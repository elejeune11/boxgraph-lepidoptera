ted harmonic Fourier-cosine continuation of SI Eq. (8) primary branch chi(max_rho)","relations":[],"role":"model","variant_of":null},{"id":"turnover_diffusion_length","name":"actin turnover-diffusion characteristic length scale","relations":[{"kind":"scales_as","other":"sekine2024/anisotropic_diffusion_ratio","stated":false,"status":"verified"},{"kind":"approximated_by","other":"sekine2024/cgmd_anisotropic_langevin","stated":false,"status":"verified"},{"kind":"approximated_by","other":"sekine2024/cgmd_anisotropic_langevin","stated":false,"status":"verified"}],"role":"model","variant_of":null},{"id":"two_cell_orthoradial_coupling_eq16","name":"two-cell orthoradial junction stress coupling stochastic PDE (SI Eqs. 15-16)","relations":[],"role":"model","variant_of":null},{"id":"two_component_reduction_corrected","name":"corrected two-component to one-component effective D and k_d (SI Section 2.1)","relations":[],"role":"model","variant_of":null},{"id":"two_component_reduction_printed","name":"printed two-component to one-component effective D and k_d (SI Section 2.1)","relations":[],"role":"model","variant_of":null},{"id":"viscosity_2d_from_3d","name":"2D cortical viscosity from 3D bulk viscosity and thickness","relations":[],"role":"model","variant_of":null},{"id":"weakly_nonlinear_branch_corrected","name":"corrected adjoint-Fredholm weakly nonlinear pitchfork branch chi(max_rho) (SI Section 2.6.2, Figs. S11-S12)","relations":[],"role":"model","variant_of":"weakly_nonlinear_branch_printed"},{"id":"weakly_nonlinear_branch_printed","name":"printed weakly nonlinear pitchfork branch chi(max_rho) (SI Section 2.6.2, Figs. S11-S12)","relations":[],"role":"model","variant_of":null},{"id":"weakly_nonlinear_curvature_finite_corrected","name":"corrected adjoint-Fredholm finite-domain pitchfork curvature chi_i^(2) (SI Section 2.6.2)","relations":[],"role":"model","variant_of":null},{"id":"weakly_nonlinear_curvature_finite_printed","name":"printed finite-domain pitchfork bifurcation curvature chi_i^(2) (SI Section 2.6.2)","relations":[],"role":"model","variant_of":null},{"id":"weakly_nonlinear_curvature_infinite_corrected","name":"corrected adjoint-Fredholm infinite-system pitchfork curvature chi_c^(2) (SI Section 2.6.2)","relations":[],"role":"model","variant_of":"weakly_nonlinear_curvature_infinite_printed"},{"id":"weakly_nonlinear_curvature_infinite_printed","name":"printed infinite-system pitchfork curvature chi_c^(2) and tricritical phi (SI Section 2.6.2)","relations":[],"role":"model","variant_of":null},{"id":"zero_friction_bifurcation_corrected","name":"corrected zero-friction (xi = 0) pitchfork curvature (SI Section 2.5)","relations":[],"role":"model","variant_of":null},{"id":"zero_friction_bifurcation_printed","name":"printed zero-friction (xi = 0) pitchfork thresholds and curvature (SI Section 2.5)","relations":[],"role":"model","variant_of":null},{"id":"zero_friction_ode_branch_l2","name":"reconstructed zero-friction (xi = 0) ODE nonlinear branch chi/phi vs ||rho||_2 (SI Section 2.5, Fig. S9)","relations":[],"role":"model","variant_of":null},{"id":"zero_friction_ode_branch_maxrho","name":"corrected zero-friction (xi = 0) ODE branch chi/phi vs max(rho) (SI Fig. S9 y-axis correction)","relations":[],"role":"model","variant_of":"zero_friction_ode_branch_l2"}],"of":[],"questions":[{"id":"q_main_chi_rho0_inconsistency","kind":"possible_error","text":"Main text p. 2 (p. 8621) writes the constitutive stress as sigma = chi^0 * rho/rho_0 + eta * d_x v (Eq. 2) and the critical threshold without rho_0 as chi_c = (sqrt(eta/tau) + sqrt(D*xi))^2, so chi^0 already has units of 2D stress (Pa*m) and chi^0/(xi*D) is dimensionless. Yet p. 2 col 2 defines the dimensionless contractility as chi = rho_0 * chi^0 / (xi * D), retaining an extraneous factor of rho_0 carried over from SI Eq. (4) (sigma = eta*d_x v + chi*rho, where rho_0*chi is the active stress). Unless rho is dimensionless, rho_0 * chi^0 / (xi * D) is dimensionally inconsistent with Main Eq. (2).\n"},{"id":"q_si_two_component_K_swapped","kind":"possible_error","text":"In SI Section 2.1 (p. 3 / PDF p. 9), substituting m = K*a and rho = a + m = (1+K)*a into Eq. (1) gives a = rho/(1+K) and m = K*rho/(1+K). Summing the two conservation equations yields D = K*D_m/(1+K) and R(rho) = k_p - k_d*rho/(1+K). The SI prints D = D_m/(1+K) and R(rho) = k_p - K*k_d*rho/(1+K), swapping the factor K between the diffusion and depolymerization terms.\n"},{"id":"q_si_eq6_green_kernel_sign","kind":"possible_error","text":"In SI Section 2.2 (p. 4 / PDF p. 10), the Green's function kernel below Eq. (6) is printed as Phi(x, y) = [sinh((x - y - sign(x-y)*l)/L) - sinh((x+y)/L)] / (2*sinh(l/L)). With the minus sign before sinh((x+y)/L), Phi(+-l/2, y) != 0 (violating the clamped BC v(+-l/2) = 0 of Eq. 5) and integrating against a uniform density rho = rho_0 yields a nonzero velocity v_unif(x) = -(chi*rho_0/eta)*L*sinh(x/L)/cosh(l/(2L)) != 0. Changing the sign to +sinh((x+y)/L) restores v(+-l/2) = 0, v_unif = 0, and exact equivalence to force balance. In addition, Eq. (6) writes Phi((x-y)/L) as a single-argument translation-invariant function inside the integral, even though the finite-domain kernel Phi(x, y) depends on both x and y.\n"},{"id":"q_si_inv_qc_extra_pi","kind":"possible_error","text":"SI Section 2.2 (p. 5 / PDF p. 11) prints the critical inverse wavenumber as 1/q_c = pi * L * (D*tau*xi/eta)^(1/4) (note OCR garbles xi/eta, verified on page-011.png). Because L = sqrt(eta/xi), L*(D*tau*xi/eta)^(1/4) = (D*tau*eta/xi)^(1/4) is already 1/q_c from maximizing SI Eq. (7). The printed expression has an extraneous factor of pi (making it equal to lambda_c / 2 rather than either 1/q_c or the wavelength lambda_c = 2*pi/q_c of Main Eq. 3 and SI Eq. 11).\n"},{"id":"q_si_section262_wrong_fredholm_eigenvector","kind":"possible_error","text":"In SI Section 2.6.2 (pp. 12-13 / PDF pp. 18-19), the linear steady-state operator L = -alpha^-2 d_yy + [[1, -chi], [1, phi - chi]] (Eq. 9) is non-self-adjoint (L_12 = -chi != 1 = L_21). When applying the Fredholm solvability condition to Eq. (13) on p. 18, the SI projects the RHS onto the right eigenvector (s_i^(1), rho_i^(1)) rather than the adjoint (left) null vector ker(L^*) = (-alpha^2/(alpha^2 + i^2*pi^2), 1)^T. Reproducing that erroneous inner product yields the printed chi_i^(2) and chi_c^(2) identically, whereas both exact adjoint-Fredholm analysis and direct numerical steady-state continuation of Eq. (8) give a curvature larger by the strictly positive factor (alpha^2 + i^2*pi^2)*(alpha^2*phi + 2*i^2*pi^2)/(i*pi)^4 (6x-12x larger at Figs. S11-S12 parameters). Because the factor is positive for all phi > 0, the sign of chi_c^(2) and the tricritical point phi = 1/4 remain unchanged. Separately, the displayed 2nd-order solution (s_i^(2), rho_i^(2)) on p. 18 mistypes (alpha^2*phi + i^2*pi^2) and (alpha^2*phi + 4*i^2*pi^2) in place of (alpha^2 + i^2*pi^2) and (alpha^2 + 4*i^2*pi^2), though the paper's subsequent chi_i^(2) formula was clearly derived using the correct 2nd-order amplitudes.\n"},{"id":"q_si_section25_xi0_curvature_and_figs9","kind":"possible_error","text":"Two discrepancies occur in SI Section 2.5 (xi = 0, pp. 9-10 / PDF pp. 15-16): (1) With the stated normalization rho_1 = cos(i*pi*(y+1/2)), the exact 3rd-order expansion of the Section 2.5 PDE yields chi_i^(2) = (alpha^2*phi + i^2*pi^2)^2 / (6*alpha^2*i^2*pi^2) (which agrees with numerical continuation and equals the xi -> 0 limit of the corrected Section 2.6.2 formula), whereas p. 15 prints chi_i^(2) = phi + i^2*pi^2/(6*alpha^2). (2) The Fig. S9 caption (p. 16) states alpha^2*phi = 10, which would place the first four bifurcation points chi_i^(0)/phi = 1 + i^2*pi^2/(alpha^2*phi) at 1.99, 4.95, 9.88, 16.79 (only one branch inside the plotted range chi/phi in [0.5, 4]); the four plotted branches in Fig. S9 bifurcate at chi/phi ~ 1.1, 1.4, 1.9, 2.6, corresponding to alpha^2*phi = 100 (i.e. alpha*sqrt(phi) = 10). In addition, p. 15 writes y = x/sqrt(D*tau) alongside integrals on [-1/2, 1/2] and Neumann BCs at y = 0, 1.\n"},{"id":"q_si_p15_parameter_estimates_inconsistency","kind":"unexplained_difference","text":"SI Section 2.6.4 (p. 15 / PDF p. 21) inverts d = 5 x 10^-7 m via Eq. (11) to obtain sqrt(eta/xi) = 10^-8 m (exact inversion with D = 0.04 um^2/s, tau = 15 s gives 8.18 x 10^-9 m) and uses average cell size l = 10^-5 m, yet prints alpha = 5 x 10^2 (= 500) and phi = 10^-3. However, l/L = 10^-5 / 10^-8 = 1000 (or 1223 using L = 8.18 x 10^-9 m) — a factor of ~2x larger than alpha = 500 — and L^2/(D*tau) = 1.67 x 10^-4 (or 1.11 x 10^-4) — ~6x-9x smaller than phi = 10^-3. In Section 2.6.5 on the same page, simulations use alpha = 480 and phi = 0.0014, which yield 15 rings/cell (corresponding to d = l/15 ~ 0.67 um, matching the histogram peak ~0.62 um in Fig. S14, rather than d = 0.5 um). Meanwhile, Main text p. 3 estimates l_h ≈ 0.1 um (10^-7 m, 10x larger than SI's 10^-8 m) from 2D friction xi = 10^9 Pa*s/m, whereas SI p. 15 infers 3D per-thickness friction xi ~ 10^17 Pa*m^-2*s (2.5 x 10^16 Pa*s/m^2 from rho_0*chi = 10^3 Pa), switching between 2D and 3D conventions without explicitly noting the thickness factor h = 100 nm.\n"},{"id":"q_actin_increase_60_vs_70","kind":"possible_error","text":"Main text p. 1 (p. 8620) states 'a 60% increase in filamentous actin concentration' at ring onset, whereas Fig. 1A caption (p. 2 / p. 8621) states 'Actin intensity increases by 70% at the onset of ring formation', and SI Section 2.6.5 (p. 21) reads fluorescence ramping from 114 to 156 (+56% above the 100% baseline, or +37% during the linear ramp).\n"},{"id":"q_src42_and_kkv1_rounded_ratios","kind":"reading","text":"From the printed rounded means, Src42A (0.8 ± 0.2 um) vs wild-type (0.5 ± 0.1 um) gives a 60% increase rather than the stated 70% (though consistent with unrounded means within the 1-sig-fig printed precision, e.g., 0.47 to 0.80 um = 70.2%), and kkv1 (4.5 ± 2 um) vs wild-type (0.5 ± 0.1 um) gives a 9.0-fold increase rather than the '10-fold' stated in Fig. 3A caption.\n"},{"id":"q_minor_caption_typos_and_crossrefs","kind":"possible_error","text":"Several typographical slips appear in captions and figure cross-references: (1) Main text p. 4 swaps references to SI Fig. S1 and Fig. S2 (citing Fig. S1 A and B for moesin RNAi and Fig. S2 for taenidial-actin complementarity, whereas SI p. 7 has them reversed) and omits a word in 'Actin patterns are severely [disrupted] in embryos and larvae'. (2) Main Fig. 4B (p. 5) image header prints 't=0s, t=110s, t=220s' whereas its caption states 't = 0 (green), t = 90 s (red), and t = 180 s (blue)'. (3) SI Fig. S8 caption (p. 14) prints 'α = 0.1' instead of 'ε = 0.1'. (4) SI Section 2.6.5 (p. 21) refers to 'Fig. 1B of the main paper' when discussing the fluorescence time-course graph in Fig. 1A.\n"},{"id":"q_unstated_2d_anisotropic_model","kind":"unstated_model","text":"Main text p. 3 and Fig. 2E present 2D periodic strip simulations with anisotropic friction (reporting circumferential rings for xi_theta > 1.1*xi_z and showing 20% anisotropy), but neither the main text nor the SI Appendix gives the 2D tensorial constitutive stress equation (bulk vs shear viscosity), domain dimensions, dimensionless parameters (alpha, phi, chi), or discretization.\n"},{"id":"q_unstated_two_cell_coupling_and_C_formula","kind":"unstated_model","text":"SI Section 2.7 (pp. 17-18 / PDF pp. 23-24, Eqs. 15-16, Fig. S16) simulates two parallel coupled cells with white noise A = 0.1 and reports correlation C(beta) rising from ~0 at beta = 10^-5 to ~1 above beta ~ 10^-3. However, the SI omits the spatial noise correlation/discretization, the exact PDE parameters (Fig. S16 bottom shows smooth oscillations rho in [0.6, 1.5] on x in [0, 400], unlike the sharp spikes of Section 2.6.5), and the two-cell neighbor boundary rule in Eq. (15). Moreover, the printed formula C = int_0^1 rho_1(z)*rho_2(z) dz / int_0^1 rho_1(z)^2 dz cannot approach 0 for uncorrelated positive densities oscillating around rho_0 = 1 (which would yield C ~ 0.9); mean subtraction (rho_i - rho_0) appears to have been omitted from the printed definition of C.\n"},{"id":"q_unstated_pde_ic_and_subcritical_sensitivity","kind":"unstated_input","text":"SI Section 2.6.5 (p. 21) does not specify the amplitude or spatial spectrum of the initial random density perturbation, the spatial/temporal discretization, the final steady-state stop time, or the peak-counting convention. Because phi = 0.0014 < 1/4 lies deep in the subcritical regime, our reconstructed Eq. (8) solver shows genuine sensitivity to the initial noise amplitude: small noise (1e-4) reproduces n ~ 14.5 rings (within 14.68 ± 1.10), whereas larger noise (0.01-0.05) causes premature nucleation onto lower-wavenumber subcritical branches (~12-13 rings). In addition, our continuum integral S = int_0^1 (rho - 1)^2 dy plateaus near ~120 rather than ~14,000 as plotted on the y-axis of Fig. S13 (suggesting Fig. S13 may plot an unnormalized discrete grid sum or an integral over rescaled x_hat in [0, alpha] rather than y in [0, 1]).\n"},{"id":"q_choice_pde_sample_size_and_horizon","kind":"choice","text":"To keep build and refinement runtimes tractable, run_pde_ramp_N80 uses n_samples = 4 per replicate across 3 replicates (12 realizations total, refined up to n_samples = 8 per replicate = 24 total in ref_pde_ramp_samples_nrings) instead of N = 80 per call, and run_pde_chaos_fig_s6 integrates to t_total = 200 (matching the plotted window of Figs. S6-S8) rather than T = 5000 or T = 10^6 used in Fig. S5 classification.\n"},{"id":"q_si_section262_sign_criterion_and_i0_floor","kind":"possible_error","text":"Two additional mathematical errors appear in SI Section 2.6.2 (p. 12 / PDF p. 18): (1) The text asserts 'As in the case where phi = 0 the nature of the pitchfork bifurcation change from supercritical if alpha < sqrt(2)*i*pi to subcritical in the opposite case.' For phi > 0, both the printed and adjoint-corrected chi_i^(2) contain the sign-changing denominator factor (4*pi^4*i^4 - alpha^4*phi) alongside (2*pi^2*i^2 - alpha^2). Hence alpha < sqrt(2)*i*pi gives supercriticality only for i > alpha*phi^(1/4)/(sqrt(2)*pi) (which includes the primary critical mode i_c), whereas for lower modes i < alpha*phi^(1/4)/(sqrt(2)*pi) (e.g., i = 1..4 at Fig. S12 parameters alpha = 15, phi = 3), the sign reverses (i = 1 has alpha > sqrt(2)*pi yet is supercritical; i = 4 has alpha < 4*sqrt(2)*pi yet is subcritical). (2) The text writes that the 2nd-order denominator alpha^4*phi - 4*i^4*pi^4 vanishes for i_0 = floor(alpha*phi^(1/4)/(sqrt(2)*pi)) < i_c 'so there is no problem of definition.' The denominator vanishes only when alpha*phi^(1/4)/(sqrt(2)*pi) is an exact integer (not at its floor), and when it is an integer, the 2nd-order expansion is resonant on that lower branch i_0 < i_c (avoiding resonance only on the primary critical branch i_c).\n"},{"id":"q_audit_pde_ramp_dt_drift_and_peak_counting","kind":"reading","text":"Audit disagreement on temporal convergence and hardcoded peak counting in the reconstructed cortical_pde_1d_ramp solver: (1) ref_pde_ramp_dt_nrings checks only two levels (factors: [1, 2], dt = 50 -> 25, 3.95% change vs 5% tolerance), missing a continuing monotonic drift under further refinement. On the same 4 realizations (seed = 0, N_grid = 2048), refining dt = 50 -> 25 -> 12.5 -> 5.0 (physical dt = 1.05 -> 0.105 s) shifts n_rings monotonically upward from 13.75 -> 14.75 -> 15.50 -> 16.00 (+16.4%) and S downward from 117.46 -> 114.96 -> 110.62 -> 106.79 (-9.1%), because explicitly lagging stress s^n by dt_phys = 1.05 s damps high-wavenumber nucleation during the fast subcritical burst. (2) model.py hardcodes the 0.1 peak-height threshold (stated only in SI Section 2.2 p. 11, not in Section 2.6.5) and counts each Neumann boundary half-peak as a full ring (+0.38 to +0.62 rings above half-weighted boundary peaks consistent with linear i_c/2, and +0.50 to +0.75 above a 50% threshold).\n"},{"id":"q_audit_pde_chaos_explicit_reaction_and_max_rho","kind":"reading","text":"Audit observations on the reconstructed cortical_pde_1d_chaos solver: (1) model.py lines 69-71 contain a stale comment claiming semi-implicit linearization of -eps*(rho - 1)^2 to preserve positivity, whereas line 71 integrates -eps*(rho - 1)^2 explicitly on the RHS; while positivity holds at N_grid = 512, dt = 0.025, chaotic spikes reach max_rho ~ 50-119 so explicit decay is not unconditionally positivity-preserving at larger dt or finer grids. (2) ref_pde_chaos_grid_min_rho checks only min_rho (~0.30 in broad depleted troughs), whereas max_rho grows from 51.5 -> 83.4 -> 118.9 across N_grid = 512, 1024, 2048 (t in [0, 100]), showing chaotic spike peaks are not yet spatially resolved at N_grid = 512 (stationary spikes at xi = 0.1 saturate near 15.2). (3) The sampling interval dt_sample = 1.0 (vs Fig. S7 caption 'every 10 times steps') and transient discard (first 50% of [0, t_total]) are hardcoded in model.py rather than exposed as settings.\n"},{"id":"q_kkv1_cell_length_and_zero_friction_ring_count","kind":"unexplained_difference","text":"Two quantitative tensions exist between Main text and SI regarding cell length and zero-friction ring count: (1) Main p. 1 reports embryonic wild-type spacing 0.5 ± 0.1 um with 15 to 20 rings per cell (implying cell length 7.5-10 um, matching SI p. 15 cell size 10^-5 m = 10 um), yet Main p. 4 reports kkv1 ring distance 4.5 ± 2 um as corresponding 'on average to one ring per cell', which implies ~2x shorter axial cell length (~4.5 um vs 10 um, or ~2.2 rings per 10 um cell). (2) Main p. 4 predicts that for lambda > L actin accumulates in 'one actin ring per cell', whereas SI Section 2.5 (p. 15 / SI-9, Fig. S9) finds the sole stable zero-friction mode is i = 1 (cos(pi*(y + 1/2)), i.e., i/2 = 0.5 patterns per cell), placing one peak 'at the edge of the cell (on every two cell boundaries only)'.\n"},{"id":"q_additional_minor_equation_and_figure_typos","kind":"possible_error","text":"Additional minor notation and typographical slips identified during audit: (1) Main p. 2 uses uppercase L for cell length in col 1 ('of length L') then switches to lowercase l in alpha = l/l_h in col 2 (while SI uses l for cell length and L = sqrt(eta/xi)); similarly friction switches between xi (Main text, SI Eqs. 3-7) and zeta (Main Fig. 2E caption p. 3 and Main p. 5). (2) SI p. 5 (PDF p. 11) writes the linear perturbation on x in [-l/2, l/2] as rho = rho_0 + A*exp(lambda*t)*cos(q*x) with q = i*pi/l, which violates no-flux BCs d_x rho(+-l/2) = 0 for odd integers i (SI p. 10 / PDF p. 16 uses the correct shifted basis cos(i*pi*(y + 1/2))). (3) SI Section 2.7 (p. 17 / PDF p. 23) writes cell-cell junction continuity as sigma(l_j(t), t) = sigma(l_{j+1}(t), t) and v(l_j(t), t) = v(l_{j+1}(t), t), putting cell indices j, j+1 on the interface positions l_j, l_{j+1} rather than on the cell fields sigma_j, sigma_{j+1} and v_j, v_{j+1} (unlike the next line d_x rho_j(l_j(t), t) = d_x rho_{j+1}(l_j(t), t) = 0), and Eq. (15) has a stray extra closing parenthesis '2*sigma^0))'. (4) In SI Section 2.5 (p. 9 / PDF p. 15), normalizing Psi_1 = cos(i*pi*(y + 1/2)) instead of rho_1 = cos(i*pi*(y + 1/2)) yields chi_i^(2) = i^2*pi^2/(6*alpha^2), indicating the printed phi + i^2*pi^2/(6*alpha^2) arose from both normalizing Psi_1 and erroneously carrying +phi from (chi - phi) into chi_i^(2). (5) Minor figure typos: Main Fig. 3B x-axis prints 'Scr42A mutant' for 'Src42A mutant' and Fig. 3C caption prints 'stating' for 'staining' (p. 4); Main Fig. 4F legend clips 'Cop -/-' to 'Cop /' and Fig. 4D-E panels label the allele 'gamma-COP^10' which is omitted from Materials and Methods (p. 6).\n"},{"id":"q_figs9_yaxis_maxrho_not_l2","kind":"possible_error","text":"Calibrated 900 dpi digitization of SI Fig. S9 (p. 16 / SI-10) combined with exact harmonic continuation of the SI Section 2.5 zero-friction ODE reveals TWO independent caption/axis errors: (1) Parameter error: the four digitized bifurcation abscissae chi_i^(0)/phi = 1.093, 1.387, 1.881, 2.572 match alpha^2*phi = 100 (1.099, 1.395, 1.888, 2.579; alpha*sqrt(phi) = 10) rather than the captioned alpha^2*phi = 10 (1.987, 4.948, 9.883, 16.791), settling q_si_section25_xi0_curvature_and_figs9. (2) Vertical-axis norm mislabeling: Fig. S9 labels its y-axis '||rho||_2' and captions '||rho||_2 denotes the L2 norm of rho', yet exact ODE continuation at alpha^2*phi = 100 proves the plotted vertical ordinate is actually max(rho) (L^infinity norm). All four density-profile insets attached to the black dots at y = 4 have peak height max(rho) = 4 (whereas their L^2 norms are only 1.20-1.47); at y = 4.0, digitized chi/phi = 1.303, 1.768, 2.435, 3.342 match exact max(rho) = 4 continuation (1.307, 1.774, 2.447, 3.359; <0.5% across branches i = 1, 2), whereas true ||rho||_2 continuation misses by 40-150% (predicting 2.42, 4.30, 7.05, 10.75 at ||rho||_2 = 4).\n"},{"id":"q_fig2d_shifted_interior_ticks","kind":"reading","text":"In Main Fig. 2D (right, p. 3 / p. 8622), the three interior x-axis tick strokes for phi = 4, 6, 8 are displaced ~26.5 px (~0.21 phi units at 1200 dpi) to the left of their printed numeral labels (a vector-graphics grouping shift), whereas the frame borders (phi = 0, 10), interior tick phi = 2, all numeric label centers, and the plotted curve 2*pi*phi^(-1/4) align cleanly on the true linear axis (residual 0.18 px). Calibrating on the outer frame borders and tick phi = 2 reproduces 2*pi*phi^(-1/4) across phi in [0.2, 9.5].\n"},{"id":"q_digitized_figure_resolutions","kind":"reading","text":"Calibrated 900-1200 dpi figure digitization quantitatively resolves four open questions from the text audit and uncovers two additional AUTO diagram details: (1) Fig. 1A (settles q_actin_increase_60_vs_70): cortical actin intensity rises from ~105% (100 s) through ~114% (1000-1600 s, matching SI p. 15 '114') to a plateau of 154-157% (3700-4250 s), confirming Main p. 1 ('60%') and SI p. 15 ('156') over Fig. 1A caption's '70%'. (2) Fig. 3B (settles q_src42_and_kkv1_rounded_ratios): unrounded bar heights are 0.499 ± 0.068 um (WT), 0.797 ± 0.171 um (Src42A, +59.8% vs WT — confirming +70% in text/caption is an overestimate even before 1-sig-fig rounding), and 4.575 ± 2.018 um (kkv, 9.18-fold vs printed '10-fold'); digitized Fig. 3B histograms yield WT mean 0.494 ± 0.081 um and Src42A mean 0.807 ± 0.180 um (+63.4%). (3) Fig. 4F: digitized coordinates refine Cop-/+ (-16.0% diameter, -38.3% actin vs printed -20%, -40%) and Cop-/- (-47.4% diameter, -68.9% actin vs printed -45%, -65%); at 1200 dpi the 'Cop -/-' legend is faint rather than truncated (updating note (5) of q_additional_minor_equation_and_figure_typos). (4) Figs. S11-S12 (confirms q_si_section262_wrong_fredholm_eigenvector): all 7 red 'B' thresholds in Fig. S11 (i = 4..10, max|diff| = 0.00011) and all 8 isolated 'B' thresholds in Fig. S12 (i = 4, 6, 7, 9, 10, 11, 12, 13, max|diff| = 0.0046) reproduce finite_domain_bifurcation_threshold, and exact Fourier-cosine continuation of Eq. (8) reproduces both AUTO primary i_c = 6 branches (13/13 points in Fig. S11 to <= 0.0014; 10/10 points in Fig. S12 to <= 0.009) while printed chi_i^(2) is 6x-10x too shallow near onset and adjoint-Fredholm chi_i^(2) matches onset curvature; Fig. S11 also exhibits a secondary bifurcation branching left of the pure i = 6 curve above max(rho) ~ 3.8. (5) Fig. S16 (settles q_unstated_two_cell_coupling_and_C_formula): C = 0.0131 ± 0.0022 at beta = 1.02e-5 (rising to C = 0.502 at beta = 1.00e-3 and 1.001 for beta >= 0.05) proves mean subtraction (rho_i - rho_0) was used in code despite being omitted from the printed C formula.\n"},{"id":"q_bois2011_notation_dimensional_and_active_stress_mapping","kind":"choice","text":"Cross-record reconciliation with Bois, Julicher & Grill (PRL 106:028103, 2011; cited in hannezo2015 as ref-10, distinct from the review ref-3 Howard, Grill & Bois 2011 and the predecessor paper ref-16 / si-ref-12 Mayer et al. 2010) highlights four systematic notation, dimensional, and constitutive differences: (1) 2D thickness-integrated vs. 3D bulk units: bois2011 Eqs. (2)-(3) use 3D bulk parameters eta [Pa*s], gamma [Pa*s/m^2], and (zeta*Delta_mu)_0 [Pa], whereas hannezo2015 Main Eqs. (2)-(3) and SI Eqs. (3)-(4) use 2D thickness-integrated eta = h*eta_3D [Pa*s*m], xi (also printed zeta on Main p. 5) = h*gamma [Pa*s/m], and sigma_a = chi^0 = rho_0*chi = h*(zeta*Delta_mu)_0 [Pa*m] (with SI p. 15 friction_3d_from_contractility briefly reverting to 3D Pa and Pa*s/m^2 matching bois2011). Thickness h cancels identically in l_h = sqrt(eta/xi) = sqrt(eta_3D/gamma) = ell, T = eta/(xi*D) = ell^2/D = tau_D, and chi = sigma_a/(xi*D) = (zeta*Delta_mu)_0/(D*gamma) = Pe. (2) Symbol swaps: domain length l (hannezo2015) <-> L (bois2011), hydrodynamic length L or l_h <-> ell, dimensionless size alpha = l/l_h <-> L/ell, wavenumber q <-> k, friction xi/zeta <-> gamma, and active contractility chi (called 'the Peclet number chi' in SI p. 15) <-> Pe. (3) Linear vs. Hill saturating active stress: hannezo2015 uses strictly linear active stress sigma_act = sigma_a*(rho/rho_0) (Main Eq. 2, SI Eq. 4; no saturating stress law appears in hannezo2015), giving c_0*df/dc = 1 at rescaled reference density rho_hat_0 = 1 and turnover-free infinite-domain threshold chi_c = 1 (dimensional chi_c = (sqrt(eta/tau) + sqrt(D*xi))^2 -> D*xi as tau -> oo). bois2011's general Eqs. (12)-(13), (15) carry the factor c_0*df/dc (effective linearized Peclet Pe_eff = Pe*c_0*df/dc), while Figs. 1-5 specialize to the Hill saturating law f(c) = c/(1+c), where c_0*df/dc = c_0/(1+c_0)^2 <= 1/4 (maximum at c_0 = 1), raising bare Pe_crit by (1+c_0)^2/c_0 >= 4 while preserving the exact finite-size geometric scaling 1 + (beta*pi*ell/L)^2 (rel_bois2011_hill_boundary_scales_linear). (4) Orthogonal threshold limits: dimensionless_critical_contractility_eq10 (chi_c = (1+sqrt(phi))^2, already at alpha -> oo) and bois2011/single_species_instability_eq13 (Pe_crit = (1 + (beta*pi*ell/L)^2)/(c_0*df/dc), already at phi = 0) are orthogonal 1-parameter limits (alpha -> oo vs. phi -> 0) of finite_domain_critical_mode and finite_domain_bifurcation_threshold, both converging to chi_c = Pe_eff,c = 1 in the joint limit (alpha -> oo, phi -> 0).\n"},{"id":"q_bois2011_turnover_arrested_coarsening_and_nonlinear_dynamics","kind":"choice","text":"Comparing the linear and nonlinear dynamics of hannezo2015 against bois2011 (ref-10) clarifies the exact role of actin turnover tau (dimensionless phi = eta/(D*tau*xi)): (1) Unstated exact Eq. (15) equivalence: Hannezo Main p. 2 cites Bois 2011 only for the conserved tau -> oo limit (rel_bois2011_dispersion_eq12_limit, rel_bois2011_instability_eq13_critical_limit). Yet even at finite turnover tau < oo, Hannezo SI Eq. (7) is symbolically identical to the single-species (N = 1) case of Bois's general reaction-diffusion-advection dispersion relation Eq. (15) with first-order turnover dR/dc = -1/tau (rel_bois2011_rda_dispersion_eq15), a case Bois did not analyze (focusing Eq. 15 on the 2-species ASDM). (2) Turnover shifts the dispersion curve uniformly downward by -phi without shifting its wavenumber peak k_max*ell = sqrt(sqrt(Pe_eff) - 1), so marginal onset chi_c = (1 + sqrt(phi))^2 selects finite critical wavenumber q_c*l_h = phi^(1/4) (lambda_c = 2*pi*(D*tau*eta/xi)^(1/4)), matching Bois's fastest-growing mode at phi = (sqrt(Pe_eff) - 1)^2 (rel_bois2011_fastest_mode_approx_ring_count), whereas at phi = 0 the instability becomes long-wavelength (q_c -> 0, i_c = 1). (3) Nonlinear coarsening vs. arrested multi-ring patterns: in bois2011 (tau -> oo, single_species_pde_eq1_3, Fig. 4), regulator conservation enforces zero steady flux j_0 = 0 (Eqs. 5-8), permitting the conservative Hamiltonian reduction Eqs. (9)-(10) with Hill-stress potential V(u), and all multipeaked steady states are unstable and coarsen to a single peak (n_peaks_final = 1). In hannezo2015 (phi > 0, cortical_pde_1d_ramp, Figs. S13-S15), turnover breaks zero-flux conservation (sustaining steady depolymerization at peaks and polymerization in valleys), invalidating Bois's Hamiltonian steady-state reduction while arresting coarsening to stabilize periodic multi-ring arrays (~15 rings/cell) — and, with quadratic turnover nonlinearity (epsilon > 0, cortical_pde_1d_chaos, Figs. S5-S8), enabling spatiotemporal chaos below a critical friction xi_c propto eta/(D*tau).\n"},{"id":"q_bois2011_no_cross_validation","kind":"unstated_model","text":"No cross-record validations are entered in validations.yaml for hannezo2015 models against bois2011 data, because bois2011 (ref-10) is a purely theoretical paper containing 0 origin: measured entries out of 53 total data in bois2011/data.yaml (32 predicted dimensionless ODE/PDE/dispersion outputs, 18 reported dimensionless parameters and zero-valued boundary conditions, and 3 derived algebraic flux/wavenumber identities). All shared mathematical structure between the two papers is already captured by the verified ModelAtlas relations in relations.yaml (including same_as families for hydrodynamic_length, diffusion_time_hydrodynamic, dimensionless_contractility_chi_2d, and dispersion_relation_eq7 <-> bois2011/single_species_rda_dispersion_eq15). In the reverse direction (bois2011 models against hannezo2015's 35 origin: measured data), zero valid cross-validations exist as well; see bois2011/q_hannezo2015_no_cross_validation for the item-by-item exclusion of all 35 measured data.\n"},{"id":"q_totz2024_no_cross_validation","kind":"unstated_input","text":"No cross-record validations are entered in validations.yaml for hannezo2015 models (52 models) against totz2024 measurements (37 origin: measured and 24 origin: reported entries): neither paper cites the other, and no hannezo2015 model genuinely predicts any totz2024 measurement on butterfly wing-scale experimental conditions. (1) Inter-bundle actin spacings and protoridge widths (totz2024/d_fig3G_L_mean: 1.277-1.598 um across 39.6%-41.0% development in V. cardui, mean 1.482 um; totz2024/d_fig3G_L_median_iqr: medians 1.282-1.642 um; totz2024/d_fig4C_species_spacings: C. eurytheme flat L_2,A = 0.341 um and ridged L_1,A = 0.801 um, A. vanillae flat L_2,B = 0.360 um and ridged L_1,B = 0.910 um, V. cardui ridged L = 1.601 um; plus reported L_Vcardui_p8 / L_ref_Vcardui_p6 / L_tableS1 = 1.6 um): although critical_wavelength_eq3 (lambda_c = 2*pi*(D*tau*eta/xi)^(1/4)) and critical_wavelength_from_lengths (2*pi*sqrt(l_t*l_h)) share dimension [length] and physical role (periodic cortical actin spacing; cortical_pde_2d_anisotropic is non-runnable), evaluating them on totz2024's butterfly data is an unconditioned cross-species comparison rather than a valid on-conditions test for four reasons: (a) Zero butterfly-scale inputs (0/4 for critical_wavelength_eq3, 0/2 for critical_wavelength_from_lengths): totz2024 measures none of D, tau, eta, xi, l_t, or l_h in developing butterfly wing scales. In hannezo2015, D = 0.04 +/- 0.03 um^2/s and tau = 15 +/- 7 s (l_t = 0.775 um) were measured by FRAP in stage-15 Drosophila embryonic trachea, while Main p. 3 explicitly notes that l_h \"can be considered as the one fitting parameter to match the observed wavelength\" (using mammalian granulocyte eta_3D = 100 Pa*s, h = 100 nm, and in vitro bead friction xi = 10^9 Pa*s/m -> l_h = 0.100 um) and SI p. 21 states \"Both eta and xi are hard to measure and estimates from the literature span over several order of magnitudes.\" (b) Two mutually inconsistent Drosophila parameter sets within hannezo2015 itself (q_si_p15_parameter_estimates_inconsistency): Main p. 3's literature inputs give lambda_c = 1.749 um (printed 1.8 um, overpredicting Drosophila's own embryonic WT 0.5 +/- 0.1 um by 3.5x), whereas SI p. 21's Drosophila-inverted l_h = 10 nm (8.18 nm exact) gives 0.553 um (0.500 um exact). That Main p. 3's 1.749 um happens to sit near V. cardui's 1.60 um (while overpredicting C. eurytheme flat 0.341 um by 5.1x and A. vanillae ridged 0.910 um by 1.9x, and while SI's 0.553 um underpredicts V. cardui by 2.9x) is an unconditioned cross-species coincidence with zero inputs taken from butterflies. (c) Multi-condition/multi-species span with no varying input: d_fig3G_L_mean and d_fig3G_L_median_iqr span 5 pupal development fractions and d_fig4C_species_spacings spans 5 surface/species spacings across a 4.7x range (requiring a quartic 488x span in xi/(D*tau*eta) between V. cardui and C. eurytheme flat, and 30.5x-40.8x between ridged and flat surfaces of the same butterfly species; see totz2024/q_hannezo2015_upstream_spacing_interface). (d) Biophysical mechanism and geometry mismatch: hannezo2015 models a continuous viscous myosin-II-contractile active gel forming unimodal circumferential rings around cylindrical tracheal cells (orthoradial friction anisotropy xi_theta > 1.1*xi_z), whereas butterfly wing scales form discrete longitudinal cross-linked bundles of 20-200 F-actin filaments homologous to Drosophila bristles (totz2024 p. 10), A. vanillae exhibits bimodal alternating double-bundle spacings (0.910 and 0.360 um) on a single upper surface that unimodal active-gel onset cannot produce, and C. eurytheme's narrower lower-lamina gap L_2,A reflects edge-to-edge narrowing by thick actin bundles rather than center-to-center wavelength alone. (2) All 20 measured protoridge height profiles and peak buckling amplitudes (protoridge_height_approx, d_fig1E-G, d_fig3A-E, d_fig3F_w0_mean, d_fig3F_w0_median_iqr, d_figS1E_*, d_figS1F_ridge1-5, d_figS1J_mean_sd): hannezo2015 models a flat viscous active fluid with purely in-plane flow and contains no out-of-plane elastic membrane/cuticle buckling deflection model. (3) All 8 developmental timing/staging measurements (dev_time_fig1B-D, protoridge_onset_fraction, protoridge_onset_days, protoridge_formation_duration, dev_time_fig3_40_6pct_caption, dev_time_fig3_40_7pct_text) and all 6 sampling/profile-filtering counts (scales_per_timepoint, n_measurements_fig4B, profiles_initial_total, profiles_excluded_phase_jump, profiles_excluded_edge_drop, profile_counts_fig3F): none corresponds to any observable predicted by hannezo2015 (diffusion_time_hydrodynamic T = l_h^2/D is a ms-scale cortical diffusion time, not pupal developmental staging or buckling duration). In the reverse direction (totz2024 models vs hannezo2015's 35 origin: measured data), zero valid cross-validations exist as well; see totz2024/q_hannezo2015_no_cross_validation.\n"},{"id":"q_sekine2024_cross_validation_summary","kind":"unexplained_difference","text":"Cross-validation of all 53 hannezo2015 models (51 runnable, 2 non-runnable) against all 214 origin: measured data in sekine2024 (same Hayashi lab, same wild-type Drosophila embryonic stage 15-16 tracheal dorsal trunk) yields 3 out-of-sample validations in validations.yaml — all targeting sekine2024/cable_interval_in_vivo = 450 +/- 13.2 nm (early stage 16 fixed btl>lifeact::GFP Airyscan, N = 8 embryos, n = 294 cables, embryo-mean SD) — and all 3 come out not reproduced: (1) Uncalibrated Main p. 3 forward prediction (critical_wavelength_eq3 on stage-15 FRAP D = 0.04 um^2/s, tau = 15 s and literature eta = 10^-5 Pa*s*m, xi = 10^9 Pa*s/m): predicts 1749.0 nm (printed 1.8 um), 3.89x larger than 450 +/- 13.2 nm (+1299.0 nm). (2) SI Section 2.6.4 printed calibration (critical_wavelength_from_lengths with FRAP l_t = 0.775 um and SI p. 21 printed rounded l_h = 10^-8 m, calibrated solely to Hannezo 2015's 0.5 um confocal data): predicts 553.0 nm (+103.0 nm, +22.9%, 7.8 embryo-mean SDs). (3) SI Section 2.6.4 exact unrounded calibration (critical_wavelength_from_lengths with FRAP l_t = 0.775 um and exact SI Eq. 11 inversion lh_inv_from_d_si = 8.175 nm): predicts 500.0 nm (+50.0 nm, +11.1%, 3.79 embryo-mean SDs, 10.4 nm beyond BoxGraph's close band [410.4, 489.6] nm), isolating the inter-study mean shift (500 nm 2015 confocal stage-16 vs 450 nm 2024 Airyscan early-stage-16) and Sekine's 7.6x narrower embryo-mean SD (+/- 13.2 nm vs Hannezo's +/- 100 nm per-ring SD). Note also that Hannezo's SI Section 2.6.5 simulation parameters (alpha = 480, phi = 0.0014 on l = 10 um -> l_h = 20.8 nm, n = 14.68 rings/cell, SI Fig. S14 peak 608 nm / mean ~680 nm) imply ~677-681 nm, even further above 450 nm (not entered in validations.yaml because no hannezo2015 model outputs dimensional wavelength from alpha and phi). All other 213 measured data in sekine2024 are excluded from validations.yaml for exact physical/structural reasons: (a) d_figs1d_intervals (Supp. Fig. 1d boxplot of the exact same N = 8 embryo dataset, median 446.8 nm, range 435.2-474.6 nm): stored as a 1-point table indexed by condition_index, incompatible with scalar wavelength models without inventing a sweep port; same measurement is already tested via scalar cable_interval_in_vivo. (b) st15_cluster_count (356) and st16_cluster_count (271): pooled counts of binarized 2D nanocluster/fragment ellipses across 22 and 21 ROIs (~16.2 and ~12.9 per ROI), not per-cell 1D ring counts (rings_per_cell_embryo_wt = 15 to 20 per 10 um cell), so finite_domain_critical_mode, infinite_domain_ring_count, and cortical_pde_1d_ramp do not predict them. (c) d_fig1j_diameter (2.60-3.94 um) and d_fig1k_length (16.7-24.2 um dorsal-trunk metamere span TC5-DB6): no hannezo2015 model outputs tube diameter or tube length, and metamere span is multicellular rather than single-cell axial length l = 10 um. (d) PIV velocities d_fig5c_vx/vy and d_fig5f_vx/vy: nonlocal_velocity_kernel_corrected evaluates uniform-gel velocity v_unif(x) = 0 identically (diagnostic for SI Eq. 6's printed boundary sign error), not fluctuating 2D PIV speeds in a patterned/clustering cortex, and sekine2024 measures no active stress sigma_a or viscosity eta. (e) Tracked nanocluster steps dx_*/dy_*/dist_* and anisotropy ratios aniso_ratio_*: turnover_diffusion_length requires actin turnover time tau (not camera frame interval 0.32 s), frap_moment_recovery_eq14 outputs 1D bleached-profile variance [length]^2, and 1D hannezo2015 models have no 2D cluster-tracking or |dy|/|dx| output. (f) Remaining 170+ measured data (nanocluster major/minor axes, areas, aspect ratios, KDEs, OrientationJ angles/coherency, skeleton length, 28 RNAi/mutant conditions in Table 2, fusion frame counts, Pearson's R colocalization, junctional RhoGEF2 ratio, ROI/screen counts, and 12 P-values): continuum 1D active-gel hannezo2015 models none of these observables (and cortical_pde_2d_anisotropic is non-runnable). In the reverse direction, see sekine2024/q_hannezo2015_cross_validation_summary.\n"}],"takes_from":[],"tally":{"close":2,"error":0,"no verdict":11,"not reproduced":4,"reproduced":19},"title":"Cortical instability drives periodic supracellular actin pattern formation in epithelial tubes","variants":[{"corrections":[{"change":"Use adjoint-Fredholm curvature chi_i^(2) = (2*k^2 - alpha^2)*(alpha^2 + k^2)*(alpha^2*phi + k^2)^2 / (3*alpha^2*k^2*(4*k^4 - alpha^4*phi)) in chi(max_rho) = chi_i^(0) + 0.5*chi_i^(2)*(max_rho - 1)^2","equation":"SI Section 2.6.2 (p. 12), Fredholm solvability curvature chi_i^(2)","evidence":"SI Fig. S11 (alpha=35, phi=0.1, i=6) and Fig. S12 (alpha=15, phi=3, i=6) show onset branch curvatures 6x-10x steeper than predicted by printed chi_i^(2), agreeing with the adjoint-Fredholm solvability projection and exact Eq. (8) numerical continuation."}],"model":"weakly_nonlinear_branch_corrected","of":"weakly_nonlinear_branch_printed","tally":{"close":0,"no verdict":0,"not reproduced":2,"reproduced":0}},{"corrections":[{"change":"Substitute i = alpha*phi^(1/4)/pi into the adjoint-Fredholm chi_i^(2), giving chi_c^(2) = (1 + sqrt(phi))*(sqrt(phi) + phi)^2*(2*sqrt(phi) - 1) / (9*phi^(3/2)) instead of (2*phi^(3/2) + 3*phi - 1)/(9*(sqrt(phi) + 2))","equation":"SI Section 2.6.2, p. 13 (PDF p. 19), infinite-system chi_c^(2)","evidence":"Inherits the non-self-adjoint right-eigenvector projection error from chi_i^(2 s":[],"role":"model","variant_of":"bundle_size_eq8"},{"id":"debye_factor_b","name":"single-polymer Debye form factor b(k*) in Eq. (8)","relations":[],"role":"model","variant_of":null},{"id":"dimensionless_areal_density_def","name":"dimensionless areal polymer density definition","relations":[],"role":"processing","variant_of":null},{"id":"dimensionless_screening_length_def","name":"dimensionless electrostatic screening length definition","relations":[],"role":"processing","variant_of":null},{"id":"dimensionless_wavenumber_def","name":"dimensionless in-plane wave number definition","relations":[],"role":"processing","variant_of":null},{"id":"effective_tension_def","name":"effective stretching tension from parallel alignment strength","relations":[],"role":"processing","variant_of":null},{"id":"finite_bundle_boundary_eq8","name":"nematic-liquid to finite-bundle spinodal boundary from Eq. (8) (angular wave number)","relations":[],"role":"model","variant_of":null},{"id":"finite_bundle_boundary_eq8_mixed2pi","name":"nematic-liquid to finite-bundle spinodal boundary from Eq. (8) (mixed-2*pi figure convention variant)","relations":[],"role":"model","variant_of":"finite_bundle_boundary_eq8"},{"id":"in_plane_rg_def","name":"in-plane radius of gyration (transverse length scale)","relations":[],"role":"processing","variant_of":null},{"id":"landau_wilson_free_energy_eq4_eq7","name":"Hubbard-Stratonovich Landau-Wilson free energy functional and saddle-point equation (Eqs. 4-7)","relations":[],"role":"model","variant_of":null},{"id":"macrophase_boundary_k0","name":"macroscopic phase-separation (infinite bundle) boundary from F(k=0) = 1","relations":[],"role":"model","variant_of":null},{"id":"potential_fourier","name":"2D Fourier transform of competing Bessel-Gaussian potential (angular wave number)","relations":[],"role":"model","variant_of":null},{"id":"potential_fourier_cyclic","name":"2D Fourier transform of competing Bessel-Gaussian potential (cyclic wave number variant)","relations":[],"role":"model","variant_of":"potential_fourier"},{"id":"real_space_potential","name":"local real-space competing Bessel-repulsion and Gaussian-attraction potential","relations":[],"role":"model","variant_of":null},{"id":"screening_length_salt_scaling","name":"Debye electrostatic screening length scaling with salt concentration","relations":[],"role":"model","variant_of":null},{"id":"stability_function_eq8","name":"spinodal stability function F(k*) (Eq. 8, angular wave number)","relations":[],"role":"model","variant_of":null},{"id":"stability_function_eq8_mixed2pi","name":"spinodal stability function F(k) (Eq. 8, mixed-2*pi figure convention variant)","relations":[],"role":"model","variant_of":"stability_function_eq8"},{"id":"wlc_aligned_hamiltonian_eq1_eq3","name":"worm-like chain aligned-polymer Hamiltonian and strong-stretching approximation (Eqs. 1-3)","relations":[],"role":"model","variant_of":null}],"of":[],"questions":[{"id":"q_2pi_fourier_mismatch","kind":"possible_error","text":"Major 2*pi Fourier-transform convention mismatch between the paper's equations and its plots. Eq. (6) uses angular wave vector k in exp(i k.r), yielding the Debye factor b(k*) = (-8 + 8 exp(-k*^2/2) + 4 k*^2)/k*^4 and wavelength 2*pi/k_0 (p. 4), for which the consistent 2D Fourier transform is beta V(k) = 2*pi*Gamma_R/(k^2 + 1/lambda_R^2) - pi*Gamma_A*lambda_A^2 exp(-k^2 lambda_A^2/4). However, Figs. 2-4 all evaluate beta V(k) with the cyclic-wavenumber kernel exp(-i 2*pi k.r) (replacing k by 2*pi*k inside beta V) and plot Fig. 3 bundle sizes as 1/k_0, while inconsistently evaluating b(k) at k instead of b(2*pi*k). Because b(q) decays as 4/q^2, omitting 2*pi inside b overestimates F(k) at finite k by up to (2*pi)^2 ~ 39.5. Under the consistent angular-wavenumber equations, only the k=0 macrophase boundary in Fig. 4 reproduces; the entire finite-bundle phase of Fig. 4 disappears from the plotted range Gamma_A in [54, 105] (its Lifshitz point shifts from Gamma_A = 55.17 to 138.14 and vertical asymptote from 83.56 to 281.33), Fig. 2's Gamma_A = 13 curve has max F = 0.234 << 1 (stable), Fig. 3(a) bundling does not begin until Gamma_A = 21.58 (instead of 13.27), and Fig. 3(b) has no finite bundles for lambda_R > 0.439.\n"},{"id":"q_fig2_lambda_A_tweak","kind":"unexplained_difference","text":"Even under the mixed-2*pi figure convention, at the captioned parameters (Gamma_R = 5, lambda_R = 0.5, lambda_A = 0.3, rho* = 1), Gamma_A = 13 yields max_{V<0} F(k) = 0.953 < 1 (onset is at Gamma_A = 13.275) and Gamma_A = 31 yields F(0) = 0.911 < 1 (onset is at Gamma_A = 31.315), contradicting the text's claim that F(k) >= 1 is satisfied for the Gamma_A = 13 and Gamma_A = 31 curves in Fig. 2(b). Nonlinear fits to the digitized Fig. 2(a) curves show that while Gamma_A = 4 matches lambda_A = 0.3000 to 0.002, the plotted Gamma_A = 13 curve matches (Gamma_A = 13, lambda_A = 0.30555 — exact root of max F(k) = 1) to 0.004 rms, and the plotted Gamma_A = 31 curve matches (Gamma_A = 31, lambda_A = 0.30152 — exact root of F(0) = 1) to 0.004 rms. By contrast, Fig. 3(a)-(b) use exact lambda_A = 0.3000 (giving finite bundle size 27.7 at Gamma_A = 31).\n"},{"id":"q_bundle_size_k0_choice","kind":"unstated_model","text":"Inside the unstable region where F(k) > 1 over a finite band [k_min, k_max], the text does not state which wave number k_0 defines the bundle size plotted in Fig. 3. Digitization proves Fig. 3 plots 1/k_min (the lower root of F(k) = 1 where linear instability growth vanishes, which diverges as k_min -> 0 at the macrophase boundary F(0) = 1), rather than the fastest-growing spinodal mode k_peak = argmax F(k) (which remains finite, 1/k_peak ~ 2.07, at Gamma_A = 31). In addition, Fig. 3(a) renders a piecewise-linear polyline at integer Gamma_A = 13, 14, ..., 31 (visible kink at Gamma_A = 30-31), plotting a point at Gamma_A = 13 (D* ~ 1.44) even though at lambda_A = 0.3 onset occurs at Gamma_A = 13.275.\n"},{"id":"q_actin_ratio_in_infinite_phase","kind":"overstated_claim","text":"On p. 5 (28001-p4), the paper cites F-actin values from ref. [11] of electrostatic screening length ~1 nm and filament thickness (effective polymer diameter R_g) ~8 nm, implying dimensionless lambda_R = 1/8 = 0.125, and claims 'For these values, fig. 3 would give a bundle consisting of a few filaments.' However, at the parameters of Fig. 3(b) (Gamma_R = 5, Gamma_A = 20, lambda_A = 0.3, rho* = 1), the macrophase-separation threshold is lambda_R_inf = 0.3849 (independent of 2*pi conventions), so lambda_R = 0.125 lies deep inside the infinite-bundle phase rather than the finite-bundle regime shown in Fig. 3(b) (lambda_R in [0.39, 1.0]).\n"},{"id":"q_eq3_eq5_typos","kind":"possible_error","text":"Three algebraic/notational inconsistencies appear in Eqs. (3), (5), and (6) on p. 3 (28001-p2): (1) Eq. (3) writes u_j^2(z) inside sum_{i=1}^N (index typo for u_i^2(z)) and omits the pair-counting factor 1/2 in front of sum_{i!=j} compared to Eq. (2); (2) Eq. (6) describes z[Omega] as 'the single-polymer partition function' although the single-polymer path integral is raised to the power N (matching the -1/N ln z in Eq. 5); (3) Eq. (5) contains both rho/(2L) and an explicit 1/2 inside the sum over k (net factor 1/4).\n"},{"id":"q_wlc_hamiltonian_nonrunnable","kind":"unstated_model","text":"Eqs. (1)-(3) define a continuous functional Hamiltonian over N polymer trajectories r_i(s) and tangent vectors u_i(s) without specifying numerical values for kappa, kappa_0, L, or specific chain conformations, so the model cannot be executed as a standalone numerical calculation.\n"},{"id":"q_landau_wilson_nonrunnable","kind":"unstated_model","text":"Eqs. (4)-(7) define a coarse-grained path-integral free-energy functional f[Omega] and self-consistent saddle-point equation Omega^sp(k,z) = <rho_hat*(k,z)>_z; the paper performs only the quadratic spinodal stability analysis (Eq. 8) around the uniform nematic liquid and explicitly leaves self-consistent solution of Eq. (7) to future work (p. 6).\n"},{"id":"q_rg_prefactor_and_b0_limit","kind":"reading","text":"Two mathematical conventions are implicit in the paper: (1) the transverse length scale sqrt(L/(beta*epsilon)) is referred to as 'the in-plane radius of gyration', whereas for a 2D Gaussian directed polymer with Hamiltonian (beta*epsilon/2) int_0^L (dr_perp/dz)^2 dz the exact mean-square 2D radius of gyration is L/(3*beta*epsilon) (differing by a factor of sqrt(3)); (2) b(k*) = (-8 + 8 exp(-k*^2/2) + 4 k*^2)/k*^4 has a removable 0/0 singularity at k* = 0 whose limit b(0) = 1 is used to evaluate F(k=0) = 1 in Fig. 4 and requires a small-k Taylor series in floating-point arithmetic to avoid catastrophic cancellation.\n"},{"id":"q_eq6_missing_prefactor_and_eq3_factor2","kind":"possible_error","text":"Additional dimensional and prefactor inconsistencies in the field-theory derivation beyond q_eq3_eq5_typos: (1) In Eq. (6) (p. 3, 28001-p2), the interaction coupling term inside int_0^L dz is printed as sum_k |beta V(k)| Omega(k,z) (...) exp(i k.r(z)), omitting the 1/L factor from Eqs. (2)-(3) and a density-normalization factor consistent with Eqs. (5) and (7). If Omega is a dimensionless normalized density mode (1/N) sum_j exp(i k.r_j), Eq. (6) is missing rho/L; if Omega is the local areal density (1/A) sum_j exp(i k.r_j) as described below Eq. (7) (p. 4), Eq. (6) is missing 1/L (making the dz integral dimensionally incompatible with the dimensionless tension term -(beta*epsilon/2) int_0^L dz u^2) and Eq. (5) places rho in the numerator instead of 1/rho. (2) Eq. (8) (F = rho* |beta V| b > 1) follows from Eq. (2)'s pair-counting factor 1/(2L), whereas Eq. (3) omits the 1/2 (which would yield 2 rho* |beta V| b > 1) and Eq. (5) inserts an extra 1/2 inside the sum over k. (3) Passing from Eq. (1) to Eq. (3) silently drops the bending-rigidity term (kappa/2) int_0^L ds u_dot^2(s).\n"},{"id":"q_audit_solver_hardcoded_offset","kind":"reading","text":"Second-reader audit note on solver implementation and refinement coverage (left unchanged to preserve the first reader's solver choices): (1) Both finite_bundle_boundary_eq8/model.py (line 59) and finite_bundle_boundary_eq8_mixed2pi/model.py (line 61) hardcode the lower bracket offset lo_lR = lR_inf + 1e-5 instead of declaring it in settings. Near the Lifshitz point of Fig. 4 (Gamma_A = 55.168 under mixed-2*pi), for Gamma_A in (55.168, ~55.55) the true finite-bundle boundary satisfies 0 < lambda_R_fin - lambda_R_inf < 1e-5 (e.g., at Gamma_A = 55.5, lambda_R_inf = 0.1087865 and lambda_R_fin = 0.1087954, difference 8.86e-6), causing the solver to return None inside the finite-bundle phase. All digitized points in lambda_R_finite_fig4 have Gamma_A >= 64 (lambda_R_fin - lambda_R_inf >= 7.5e-3), so the recorded comparison is unaffected. (2) lR_max = 5.0 is in settings (truncating solutions very close to the vertical asymptote, e.g. Gamma_A = 83.55 in mixed-2*pi) but is not swept in refinements.yaml; likewise k_max is unrefined for run_fig3a and run_fig4_finite_consistent_ref, and xtol is unrefined for run_fig3a_var and run_fig4_finite_consistent_ref. (3) The k < 1e-2 Taylor switchover in debye_factor_b and downstream models has a 3.3e-8 discontinuity at k = 1e-2 due to cancellation in direct evaluation of (-8 + 8 exp(-k^2/2) + 4 k^2)/k^4 (negligible for all evaluated k >= 0.036 in this record).\n"},{"id":"q_audit_bundle_size_mode_and_rounding","kind":"reading","text":"Second-reader audit note on mode-selection scope in bundle_size_eq8 and input-rounding effects in verdicts: (1) Page 4 (28001-p3) defines the bundle size 2*pi/k_0 only at spinodal onset where F(k) >= 1 is 'just satisfied' (where lower root k_min, upper root k_max, and fastest-growing mode k_peak = argmax F(k) coincide), leaving the deep-instability selection rule unstated (see q_bundle_size_k0_choice). Implementing the stated model bundle_size_eq8 with k_0 = k_min adopts a choice inferred from Fig. 3 rather than printed in text; under the physically standard spinodal criterion k_0 = k_peak, bundle_size_eq8 yields finite 2*pi/k_peak = 3.70 at Gamma_A = 31 (and mixed-2*pi yields 1/k_peak = 2.07) with no divergence at F(0) = 1. (2) Because b(k) -> 1 as k -> 0, 2*pi/k_min under the consistent angular convention approaches 1/k_min under mixed-2*pi near the macrophase boundary (26.42 vs. 27.77 at Gamma_A = 31), and BoxGraph's input_rounding treats exact single-digit parameters (rho* = 1, Gamma_R = 5, lambda_R = 0.5, lambda_A = 0.3, Gamma_A = 13, 31) as rounded intervals. Consequently, cmp_fig3a marks Gamma_A >= 22 per-value 'reproduced' despite 4%-22% underprediction (while overall 'not reproduced' due to None at Gamma_A <= 20), and cmp_fig2a_GA13_var, cmp_fig2a_GA31_var, cmp_fig2b_GA13_var, and cmp_fig2b_GA31_var receive overall verdict 'reproduced' even though their exact lambda_A = 0.3 predictions fall outside the digitized intervals (supporting q_fig2_lambda_A_tweak, where fitting lambda_A achieves 0.0017 rms at Gamma_A = 31 vs. 0.015 rms when fitting Gamma_A alone).\n"},{"id":"q_audit_actin_quantity_and_salr","kind":"reading","text":"Second-reader audit notes on quantity typing and record scope: (1) filament_thickness_actin (~8 nm from ref. [11], p. 5) is typed as quantity in_plane_radius_of_gyration based on the paper's qualitative analogy that sqrt(L/(beta*epsilon)) plays the role of an effective polymer diameter, whereas physically a geometric F-actin diameter is distinct from a thermal transverse wandering length (relevant when cross-validating against records that declare a separate filament-diameter quantity). In addition to falling inside Fig. 3(b)'s infinite-bundle phase (lambda_R = 0.125 < lambda_R_inf = 0.3849, q_actin_ratio_in_infinite_phase), the implied ratio lambda_R = 0.125 is smaller than Fig. 3's attractive range lambda_A = 0.3, inverting the SALR (shorter-range attraction, longer-range repulsion) ordering assumed by the model. (2) In relations.yaml, rel_bundle_size_from_eq8 uses output_map: {bundle_size: F} purely to satisfy the single-output-pair schema requirement even though bundle_size and F are distinct quantities; and wlc_aligned_hamiltonian_eq1_eq3 declares kappa in inputs while its equation string transcribes only Eq. (3), which drops kappa.\n"},{"id":"q_grason2007_distinct_bundling_mechanisms","kind":"reading","text":"No stated or proposed mathematical relation (same_as, reduces_to, derived_from, scales_as, or approximated_by) connects the models of dutta2016 and grason2007, and no cited.yaml link applies (dutta2016 borrows no numerical datum from ref-20; its F-actin screening length and filament thickness come from Borukhov et al. [ref-11] = grason2007/ref-8). Both papers explicitly contrast their bundle-size control mechanisms: dutta2016 (p. 2) cites Grason & Bruinsma (2007) [ref-20] as \"a different approach\" in which inherent chirality limits bundle size, while grason2007 (p. 1) argues that finite F-actin bundle diameters (40-100 nm) are \"not determined by a mysterious long-range molecular interaction\" (citing Henle & Pincus [9]). Four structural incompatibilities prevent any valid equivalence: (1) Orthogonal mechanisms and vanishing limits: dutta2016 models achiral, pre-aligned directed polymers in a dense melt interacting via competing short-range Gaussian attraction (Gamma_A, lambda_A) and long-range Debye-Huckel repulsion (Gamma_R, lambda_R), silently dropping the single-chain bending rigidity kappa of Eq. (1) in Eq. (3) in favor of aligning tension epsilon = 3*kappa_0; setting Gamma_R -> 0 forces F(k) to peak strictly at k = 0 and eliminates finite bundles completely. Conversely, grason2007 models an isolated chiral hexagonal bundle with no long-range electrostatic repulsion, balancing chiral torque -gamma*Omega (gamma = 2*K_2/P) against anharmonic rotational-invariance gauge elasticity (mu_perp_bar*(Omega*R)^4 in-plane shear, K3_bar*Omega^4*R^2 Frank bending with K_3 ~ k_B T*l_p/d^2, and harmonic mu_par_bar*(Omega*R)^2 out-of-plane shear in 3D solids) plus surface tension 2*pi*R*Sigma; setting chirality gamma -> 0 gives f_0 -> 0 and Sigma_c -> 0 and eliminates finite bundles completely. Even the shared WLC bending energy (dutta2016 Eq. 1 -> grason2007 Frank bend K_3) is dropped before Eq. (3) and absent from all runnable dutta2016 models. (2) Disjoint control parameters: dutta2016 depends on (rho*, Gamma_R, Gamma_A, lambda_R, lambda_A) and R_g = sqrt(L*k_B T/epsilon) with no chirality, bundle twist, shear/bend moduli, or surface tension; grason2007 depends on (gamma, mu_perp_bar, mu_par_bar, K3_bar, Sigma, mu_c - mu, rho_0, L) with no pair interaction potential, electrostatic screening length, or salt concentration. (3) Distinct thermodynamic criteria and observables: dutta2016 evaluates a quadratic spinodal instability F(k*) = rho* |beta V(k*)| b(k*) = 1 in transverse wavenumber k*, crudely identifying the periodic density-modulation wavelength D* = 2*pi/k_min (spanning both dense bundle and dilute gap, p. 6) as bundle size; grason2007 evaluates single-bundle thermodynamic coexistence Delta F(R_0) - mu*rho_0*pi*R_0^2 <= 0 in cylinder radius R against a dilute filament reservoir. (4) Distinct divergence and transition behavior: in dutta2016/bundle_size_eq8, D* = 2*pi/k_min diverges continuously with exponent -1/2 as (Gamma_A_inf - Gamma_A)^(-1/2) or (lambda_R - lambda_R_inf)^(-1/2) at the finite k = 0 macrophase spinodal F(0) = 1 (while 2*pi/k_peak remains finite there). In grason2007, equilibrium radius R_0 starts at finite minimum lambda_{3 perp} at Sigma = Sigma_c(mu_c), diverges algebraically as Sigma^(-3) (columnar) or Sigma^(-1/5), Sigma^(-1/3) (solid) as Sigma -> 0+, and jumps first-order to an infinite bulk aggregate at mu = mu_c = -epsilon*L/rho_0 while R_0(mu_c) remains finite.\n"},{"id":"q_grason2007_spurious_scales_symbols_and_actin_tension","kind":"reading","text":"Three cross-record bookkeeping findings accompany the absence of ModelAtlas relations between dutta2016 and grason2007: (1) Rejected spurious dimensional/algebraic shapes: dutta2016/in_plane_rg_def (R_g = sqrt(L*k_B T/epsilon)) has the same square-root-of-ratio algebraic shape as grason2007/lambda_3perp_microscopic (lambda_{3 perp} ~ sqrt(d*l_p*k_B T/Delta E)) and grason2007/characteristic_length_lambda3 (lambda_{3 perp} = sqrt(K3_bar/mu_perp_bar)), but the physical scales are unrelated: R_g is single-chain transverse thermal wandering under aligning tension (scaling as L^(1/2), independent of l_p), whereas lambda_{3 perp} is the multi-chain continuum bend-shear crossover radius (scaling as l_p^(1/2), independent of L). Likewise, screening_length_salt_scaling (lambda_R ~ n^(-1/2)) vs. grason2007/critical_surface_tension_far_corrected (Sigma_c ~ (mu_c - mu)^(-1/2)) and trivial ratio/linear definitions (effective_tension_def, dimensionless_screening_length_def vs. bundle_diameter_from_radius, chiral_torque_coupling) are physically unrelated coincidences (too_plain). Moreover, dutta2016 has no model mapping filament count or cylinder radius to physical diameter in nm (bundle_size_eq8 outputs only dimensionless modulation wavelength D* from an implicit transcendental root), so no genuine geometric diameter conversion connects it to grason2007/bundle_diameter_from_radius (D = 2*R). (2) Symbol and quantity collisions: both records reuse symbols with incompatible meanings and dimensions: epsilon is aligning tension [pN] in dutta2016 vs. achiral bulk cohesive energy density [pN/nm^2] in grason2007; Omega is the Hubbard-Stratonovich density-mode order-parameter field in dutta2016 vs. macroscopic whole-bundle torsional twist rate [1/nm] in grason2007; rho = N/A is the system-averaged nematic melt density in dutta2016 vs. the fixed in-bundle hexagonal chain packing density rho_0 in grason2007; lambda_R is the Debye electrostatic screening length vs. lambda_{3 perp} the elastic bend-shear length; and contour length L sets R_g ~ L^(1/2) and rho* ~ L in dutta2016 while cancelling out of equilibrium radius R_0(mu_c) in grason2007. (3) Quantitative F-actin scale tension: both papers share literature roots (Borukhov et al. 2005 [dutta2016/ref-11 = grason2007/ref-8], Bloomfield 1997, Ha & Liu 1999, Henle & Pincus 2005). Grason & Bruinsma (p. 1) reject long-range electrostatic control because observed F-actin bundles (grason2007/factin_diameter_lai2007, 40-100 nm) are 40-100x larger than the ~1 nm Debye length, obtaining lambda_{3 perp} ~ 100 nm independent of electrostatic screening. Quantitatively, at dutta2016's own F-actin ratio lambda_R = 1 nm / 8 nm = 0.125, consistent Eq. (8) requires rho* * Gamma_R > 1 / (12*pi*lambda_R^4) ~= 108.65 as an exact necessary Lifshitz bound for any finite-bundle window to exist (for any lambda_A >= 0), ruling out finite bundles at all repulsion strengths studied in dutta2016 (Gamma_R = 5, 10 at rho* = 1; under the mixed-2*pi plotting mismatch the bound drops by (2*pi)^2 to 2.752, though Fig. 3's lambda_A = 0.3 > lambda_R = 0.125 still inverts SALR). Even at Gamma_R = 200 and lambda_A = 0.05 (0.4 nm), the finite-bundle window is only 2.09% wide (Gamma_A in [2572.5, 2627.3]), and reaching 40-100 nm (D* = 5-12.5) via 2*pi/k_min requires fine-tuning Gamma_A within 0.84%-0.15% of the k = 0 macrophase boundary (while the fastest-growing spinodal wavelength 2*pi/k_peak remains capped at 23.8 nm).\n"},{"id":"q_grason2007_no_cross_validation","kind":"unstated_model","text":"No cross-record validations are entered in validations.yaml for dutta2016 models against grason2007 data, because grason2007 is a pure theory paper with zero origin: measured entries (only two cited experimental measurements, both origin: reported) and no model of dutta2016 genuinely predicts either measurement on its own conditions: (1) grason2007/factin_diameter_lai2007 (40 to 100 nm, origin: reported, Lai et al. 2007 [grason2007/ref-12], nontoroidal multivalent-counterion F-actin bundles; not cited by dutta2016): dutta2016 has no model outputting physical bundle_diameter or bundle_size_physical in nm. Both bundle_size_eq8 and bundle_size_eq8_mixed2pi output only dimensionless_bundle_size (D* = 2*pi/k_min or 1/k_min, scaled by R_g = sqrt(L/(beta*epsilon))) and bundle_size_over_screening_length, while dutta2016's only [length]-outputting models are in_plane_rg_def (single-chain transverse wandering R_g) and screening_length_salt_scaling (lambda_R_phys ~ 1/sqrt(n), prefactor: unknown), neither of which is a bundle diameter. Moreover, neither paper states or measures the SALR parameters (rho*, Gamma_R, Gamma_A, lambda_A) or aligning tension epsilon for Lai et al.'s bundles. Even if one substitutes dutta2016's own cited F-actin ratio lambda_R = 1 nm / 8 nm = 0.125 (from screening_length_actin and filament_thickness_actin, Borukhov et al. ref-11), consistent bundle_size_eq8 requires rho* * Gamma_R > 1/(12*pi*lambda_R^4) ~= 108.65 as a necessary Lifshitz bound for any finite bundle window (ruling out finite bundles at dutta2016's Gamma_R = 5, 10), and at Fig. 3(b) parameters lambda_R = 0.125 falls deep in the infinite-bundle phase (lambda_R_inf = 0.3849) and inverts SALR ordering (lambda_R < lambda_A = 0.3). Furthermore, dutta2016 (p. 6) notes that 2*pi/k_0 is only a crude periodic density-modulation wavelength (dense plus dilute regions) rather than an isolated bundle diameter. (2) grason2007/factin_twist_pitch_ikawa2007 (~100 nm, origin: reported, Ikawa et al. 2007 [grason2007/ref-22], braided 2-3 F-actin filaments in Mg2+): dutta2016 is a purely achiral directed-polymer model with no chirality, torsional strain, or bundle twist-pitch quantity or model, and \"~100\" carries no printed precision. (3) Non-measured entries in grason2007/data.yaml: factin_chain_spacing (~1 to 10 nm), factin_linker_binding_energy_kBT (~10), and factin_persistence_length (~1 to 10 um) are order-of-magnitude literature input estimates (origin: estimated), and factin_lambda_3perp_est (~100 nm), factin_cholesteric_pitch_est (~1 to 10 nm), and factin_stability_threshold (>= 1) are grason2007 theoretical predictions (origin: predicted). None is an experimental measurement, and none matches any output quantity of dutta2016 (which drops bending rigidity kappa before Eq. 3, treats Gamma_A strictly as an input, and has no hexagonal lattice spacing, bend-shear length lambda_{3 perp}, cholesteric pitch, or surface-tension stability ratio).\n"},{"id":"q_claessens2008_distinct_bundling_mechanisms","kind":"reading","text":"No stated or proposed mathematical relation (same_as, reduces_to, derived_from, scales_as, or approximated_by) connects the models of dutta2016 and claessens2008, and no cited.yaml link applies. dutta2016 cites Claessens et al. (2008) [ref-19] in two places: on p. 2 (28001-p1), citing the F-actin experiments [19] alongside Grason et al. [20, 21] as \"a different approach\" in which inherent chirality limits bundle size; and on p. 5 (28001-p4), claiming qualitatively that Fig. 3 gives \"a bundle consisting of a few filaments in agreement with the findings of [19]\" when evaluated on Borukhov et al.'s [ref-11] F-actin screening length (~1 nm) and filament thickness (~8 nm). Neither record takes any numerical datum from the other (screening_length_actin and filament_thickness_actin come from ref-11, not ref-19; claessens2008 predates dutta2016 by eight years and explicitly rejects electrostatic charge-accumulation models of finite bundle size on p. 1, citing Henle & Pincus [claessens2008/ref-19 = dutta2016/ref-18] and Groenewold & Kegel [claessens2008/ref-28 = dutta2016/ref-30]). Four structural incompatibilities make the two model sets mathematically disjoint: (1) Orthogonal bundling mechanisms and degrees of freedom: dutta2016 models an achiral, pre-aligned nematic melt of directed polymers with competing isotropic pairwise SALR interactions (Debye-Huckel repulsion Gamma_R*K_0(r/lambda_R) plus short-range Gaussian attraction -Gamma_A*exp(-r^2/lambda_A^2), dropping single-chain bending rigidity kappa in Eq. 3 in favor of aligning tension epsilon = 3*kappa_0); setting Gamma_R -> 0 eliminates finite bundles completely. Conversely, claessens2008 models discrete, rigid, stoichiometrically saturating fascin cross-linkers bridging helical F-actin filaments on a 2D hexagonal lattice (a_H = 12.4 nm, 1 fascin per ~4.5 actin monomers, u ~= 13-14 monomers per hexagonal unit, bundle_geometry_saturation R = (3 +/- 3.5*n_f^(-1/2))/u), where finite thickness (n_f ~= 20, two hexagonal shells) is governed by helical-to-hexagonal angular mismatch (-13/6 -> -28/13, Delta_theta ~= 1 deg/monomer) and internal single-filament torsional twist energy (E_twist = tau*(Delta_theta)^2/d) balanced against fascin binding free energy (Delta G = k_B T ln(K_D) ~= 15 k_B T). claessens2008 contains no pair potential, no electrostatic repulsion, no Debye-length model, and no spinodal field theory. (2) Disjoint control parameters and observables: dutta2016 depends on dimensionless (rho*, Gamma_R, lambda_R, Gamma_A, lambda_A) and single-chain transverse wandering R_g = sqrt(L*k_B T/epsilon), predicting the quadratic spinodal function F(k*) and a continuum periodic density-modulation wavelength D* = 2*pi/k_min (spanning both polymer-dense bundle and dilute gap, p. 6), with no filament count n_f, hexagonal lattice spacing a_H, dissociation constant K_d, bound cross-linker ratio R*, or helical twist angle Delta_theta. claessens2008 depends on (c_a, c_f, K_d, R*, n_f, k, u, p, s, tau, d, D_d, q_10) and outputs TEM diameter fits D(R*), discrete hexagonal shell counts (n_f = 1 + 3*k*(k + 1), D_fil = 2*k + 1), Bragg spacing a_H = 4*pi/(sqrt(3)*q_10), droplet-confinement mass-conservation curves c_a ~ n_f/D_d^2, and single-filament twist/binding energies. (3) Incompatible cross-linker / attraction scaling and saturation: in claessens2008/diameter_scaling_Rstar, bundle diameter grows sublinearly with bound fascin ratio as D ~= (R*)^0.3 (Fig. 1C log-slope 0.327) and plateaus at finite size n_f ~= 20 for R* >= 0.25 due to stoichiometric binding-site saturation. In dutta2016/bundle_size_eq8, increasing attraction strength Gamma_A drives superlinear growth (local log-slope d(ln D*)/d(ln Gamma_A) >= 3.07 across Fig. 3(a) under consistent Eq. 8, and >= 1.66 even under bundle_size_eq8_mixed2pi) that diverges continuously as (Gamma_A_inf - Gamma_A)^(-1/2) into macroscopic phase separation (D* -> oo) rather than saturating at a finite bundle thickness. (4) Rejected spurious algebraic coincidences (too_plain) and symbol collisions: pure ratio or monomial definitions share trivial algebraic forms across unrelated physics -- dimensionless_screening_length_def (lambda_R_phys/R_g) vs. molar_ratio_fascin_actin (c_f/c_a), dimensionless_kd_scale (K_d/c_a), and helical_symmetry_ratio (p/s); effective_tension_def (3*kappa_0) vs. hexagonal_bragg_peaks and thermal_energy_scale; in_plane_rg_def (sqrt(L*k_B T/epsilon)) vs. diameter_filament_scaling (n_f^(1/2)); and screening_length_salt_scaling (lambda_R ~ n^(-1/2)) vs. the n_f^(-1/2) perimeter term of bundle_geometry_saturation. Likewise, dutta2016/bundle_size_eq8 (inter-bundle modulation wavelength 2*pi/k_0 from an implicit spinodal root) is mathematically and physically distinct from claessens2008/hexagonal_lattice_spacing (intra-bundle filament spacing a_H = 4*pi/(sqrt(3)*q_10)). Six symbols collide with incompatible meanings: n (bulk salt concentration in dutta2016 vs. filaments per bundle n or n_f in claessens2008 Fig. S1), k (transverse wave number in dutta2016 vs. concentric hexagonal shells in claessens2008), kappa (WLC bending rigidity in dutta2016 Eq. 1 vs. dimensionless dissociation ratio K_d/c_a in claessens2008), L (single-polymer contour length in dutta2016 vs. total actin contour length in an emulsion droplet in claessens2008), u (transverse tangent vector in dutta2016 vs. monomers per hexagonal unit u ~= 13-14 in claessens2008), and q (total polymer electric charge in dutta2016 vs. SAXS scattering wavevector in claessens2008).\n"},{"id":"q_claessens2008_electrostatic_agreement_contradicted","kind":"overstated_claim","text":"On p. 5 (28001-p4), dutta2016 substitutes Borukhov et al.'s [ref-11] F-actin electrostatic screening length (~1 nm) and filament thickness (~8 nm) into its qualitative discussion of Fig. 3 and claims \"For these values, fig. 3 would give a bundle consisting of a few filaments in agreement with the findings of [19]\" (claessens2008). Cross-checking both papers exposes four independent contradictions of this claimed agreement: (1) Direct experimental refutation of salt/electrostatic control in claessens2008: in claessens2008's standard F-buffer (p. 4 Methods: 100 mM KCl, 2 mM MgCl2, 0.2 mM CaCl2, 2 mM Tris, 0.5 mM ATP at 20 degC; ionic strength I ~= 107 mM), the Debye screening length is lambda_D ~= 0.93 nm (lambda_R = lambda_D/8 nm ~= 0.117, matching dutta2016's cited ~1 nm / 0.125). Claessens et al. (p. 1) explicitly lowered salt to the polymerization minimum (claessens2008/mgcl2_min_conc = 2 mM MgCl2, no KCl or CaCl2; I ~= 6.0-8.5 mM), increasing lambda_D by 3.5-4.2x (to 3.3-3.9 nm, lambda_R ~= 0.413-0.492), and observed \"no influence on the maximum F-actin/fascin bundle thickness.\" In dutta2016 (screening_length_salt_scaling, bundle_size_eq8, Figs. 3(b) and 4), increasing lambda_R strictly increases repulsive 2*pi*Gamma_R/(k^2 + 1/lambda_R^2) at every k >= 0 and monotonically shrinks D*(lambda_R) until bundles dissolve into the disordered nematic liquid (e.g., at Fig. 3(b) parameters, passing from infinite bundles at lambda_R = 0.117 through the narrow consistent finite-bundle window lambda_R in (0.3849, 0.4391) to unbundled liquid at lambda_R = 0.492). (2) Negligible electrostatic repulsion at fascin spacing: claessens2008 reports a fascin interfilament surface-to-surface separation of ~5 nm (interfilament_sep_fascin, p. 1) and SAXS center-to-center lattice constant a_H = 12.4 nm (aH_hex_saxs, p. 2). At F-buffer lambda_D ~= 0.93 nm, electrostatic interactions across neighboring filaments are exponentially suppressed (exp(-5/0.933) = 4.7e-3; K_0(12.4/0.933) = 5.8e-7), directly supporting claessens2008's conclusion (p. 1) that \"electrostatic repulsion between actin filaments is too short-ranged to affect bundle assembly.\" (3) Failure of dutta2016's Eq. (8) / Fig. 3(b) at the F-actin ratio: both at dutta2016's cited lambda_R = 1/8 = 0.125 (extending q_actin_ratio_in_infinite_phase) and at claessens2008's F-buffer lambda_R = 0.117, Fig. 3(b) (Gamma_R = 5, Gamma_A = 20, lambda_A = 0.3, rho* = 1) lies deep inside the infinite-bundle macrophase-separation phase (lambda_R_inf = 0.3849, independent of 2*pi conventions) and inverts the SALR ordering (lambda_R < lambda_A = 0.3). Under consistent Eq. (8), any finite-bundle window at lambda_R = 0.117 (or 0.125) requires the exact Lifshitz bound rho* * Gamma_R > 1/(12*pi*lambda_R^4) ~= 143.2 (or 108.7), ruling out finite bundles at all Gamma_R values studied in dutta2016 (Gamma_R = 5, 10 at rho* = 1). (4) Concentration-dependence and observable mismatch: claessens2008 observes finite bundles up to n_f ~= 20 filaments (5-6 filaments across in Fig. 2D; hydrated 2-shell width 50-58 nm ~= 6.3-7.3 filament diameters, TEM plateau ~28.2 nm) whose thickness is independent of actin concentration c_a (Fig. 1A-B), whereas dutta2016's spinodal criterion F = rho* |beta V| b > 1 depends directly on areal polymer density rho* and identifies bundle size only with the crude periodic density-modulation wavelength 2*pi/k_min (dense bundle plus dilute gap, p. 6).\n"},{"id":"q_claessens2008_no_cross_validation","kind":"unstated_input","text":"No cross-record validations are entered in validations.yaml for dutta2016 models against claessens2008 measurements, because despite dutta2016's qualitative claim on p. 5 (28001-p4) that Fig. 3 gives \"a bundle consisting of a few filaments in agreement with the findings of [19]\", none of dutta2016's 17 runnable models validly predicts any of claessens2008's 26 measured (or derived/reported) data on Claessens et al.'s own experimental conditions: (1) TEM bundle diameter curve claessens2008/D_fig1c_measured (8 points over R* in [0.0089, 0.90], rising from 8.41 nm to a plateau of 28.14 and 28.04 nm at R* = 0.70 and 0.90, c_a = 0.1 mg/ml): dutta2016 has no model outputting physical bundle_diameter or bundle_size_physical in nm (its only [length]-outputting models are single-chain transverse wandering length in_plane_rg_def and salt-scaling Debye length screening_length_salt_scaling, neither a bundle width) and no model taking bound fascin-to-actin ratio R* (effective_bound_ratio) as an input or sweep variable; moreover D(R*) scales sublinearly as (R*)^0.3 and saturates for R* >= 0.25, whereas bundle_size_eq8 grows superlinearly and diverges as Gamma_A approaches the k = 0 macrophase spinodal. (2) Dimensionless bundle width in filaments (claessens2008/D_fil_fig2d_caption = \"≈ 5\", D_fil_fig2d_text = \"5 to 6\") and maximum filament count (nf_max_abstract = \"≈ 20\", nf_max_confinement = \"≈ 20\"): (a) Quantity mismatch -- bundle_size_eq8 and bundle_size_eq8_mixed2pi output dimensionless_bundle_size (D* = 2*pi/k_0 or 1/k_0), a 1D periodic spinodal density-modulation wavelength spanning both polymer-dense bundle and dilute gap (explicitly noted on p. 6 as only a crude length-scale requiring self-consistent Eq. 7 to obtain actual bundle width), scaled by single-chain thermal wandering R_g = sqrt(L/(beta*epsilon)) rather than geometric filament diameter or hexagonal lattice spacing a_H = 12.4 nm (q_audit_actin_quantity_and_salr); this is neither 2D filament count n_f nor cross-sectional filaments across a single TEM fascin bundle. (b) Unstated model inputs -- both models require five dimensionless SALR parameters (rho*, Gamma_R, lambda_R, Gamma_A, lambda_A), none of which (nor aligning tension epsilon or single-chain length L) is measured or stated for Claessens's stoichiometric fascin-crosslinked bundles (whose thickness is experimentally invariant to actin concentration c_a and salt concentration). (c) Failure at Claessens's ionic conditions -- in Claessens's standard F-buffer (p. 4: 100 mM KCl, 2 mM MgCl2, 0.2 mM CaCl2, 2 mM Tris, 0.5 mM ATP at 20 degC; I ~= 107-109 mM, lambda_D ~= 0.92-0.93 nm), lambda_R = lambda_D / 8 nm ~= 0.115-0.117 (matching dutta2016's cited 1/8 = 0.125; or 0.075 scaled by a_H = 12.4 nm). At dutta2016's Fig. 3(b) parameters (rho* = 1, Gamma_R = 5, Gamma_A = 20, lambda_A = 0.3), both lambda_R = 0.117 and 0.125 lie deep inside the k = 0 macrophase-separation phase (lambda_R_inf = 0.3849) and invert SALR ordering (lambda_R < lambda_A), so both bundle_size_eq8 and bundle_size_eq8_mixed2pi return None (no finite bundle; consistent Eq. 8 requires Lifshitz bound rho* * Gamma_R > 1/(12*pi*lambda_R^4) ~= 143.0 at 0.117 or 108.7 at 0.125; see q_claessens2008_electrostatic_agreement_contradicted). Even at Claessens's low-salt control (mgcl2_min_conc = 2 mM MgCl2, I ~= 6.0-8.5 mM, lambda_D ~= 3.31-3.94 nm, lambda_R ~= 0.413-0.492), the other four SALR inputs remain unstated and Claessens observes no change in maximum bundle thickness. (3) Remaining claessens2008 measurements and derived/reported data: emulsion-droplet confinement boundaries (ca_fig2e_single_ring_max, ca_fig2e_two_bundle_min), bound cross-linker ratios (Rstar_plateau, Rstar_figS1_experiment), SAXS Bragg and helical layer-line wavevectors (q10_saxs = 0.585 nm^-1, q_layer6_unbundled, q_layer7_unbundled, q_helical_a/b/c_bundled), SAXS intensity curves (I_saxs_fig3a_*, I_saxs_fig3c_data_*), intra-bundle hexagonal spacing (aH_hex_saxs = 12.4 nm, interfilament_sep_fascin ~= 5 nm), helical overtwist curves (Delta_theta_fig3d_ca0p8, ca2, ca3; Delta_theta_max ~= 1 deg), and fascin+espin composite diameter ratio (D_ratio_fig4d ~= 3) have no matching output quantity or physics in dutta2016 (which is achiral, unconfined, single-species, and outputs no physical wavevector in 1/nm, SAXS profile, or intra-bundle lattice spacing). Likewise, claessens2008 reports no measured Debye screening length to test screening_length_salt_scaling (lambda_R_phys ~ 1/sqrt(n), prefactor: unknown) at mgcl2_min_conc = 2 mM.\n"}],"takes_from":[],"tally":{"close":0,"error":0,"no verdict":0,"not reproduced":10,"reproduced":1},"title":"Bundle formation in parallel aligned polymers with competing interactions","variants":[{"corrections":[{"change":"Use mixed-2*pi stability function F_mixed(k) = rho* |beta V_cyc(k)| b(k) and cyclic-wavenumber wavelength D* = 1 / k_min (with k_min the smallest k > 0 where F_mixed(k) = 1 and beta V_cyc(k) < 0).","equation":"Eq. 8 & bundle size 2*pi/k_0 (p. 4, Fig. 3)","evidence":"Fig. 3(a) (Gamma_A in [14, 31]) and Fig. 3(b) + inset (lambda_R in [0.40, 0.95]) match 1/k_min under F_mixed(k) to 3-4 significant figures across the entire plotted range, whereas the consistent angular model predicts no finite bundles for Gamma_A < 21.58 in Fig. 3(a) or lambda_R > 0.439 in Fig. 3(b)."}],"model":"bundle_size_eq8_mixed2pi","of":"bundle_size_eq8","tally":{"close":0,"no verdict":0,"not reproduced":0,"reproduced":3}},{"corrections":[{"change":"Solve max_{k > 0, beta V_cyc(k) < 0} rho* |beta V_cyc(k)| b(k) = 1 using the mixed-2*pi stability function instead of the consistent angular-wavenumber form.","equation":"Eq. 8 (p. 4, Fig. 4 dashed circle curve)","evidence":"Fig. 4 dashed circle curve (Gamma_A in [64, 81]) matches the mixed-2*pi boundary to within 0.001 in lambda_R (Lifshitz point at Gamma_A=55.17, vertical asymptote at Gamma_A=83.56), whereas the consistent angular model predicts no finite-bundle phase anywhere in Fig. 4's plotted range [54, 105] (its Lifshitz point is at Gamma_A=138.14)."}],"model":"finite_bundle_boundary_eq8_mixed2pi","of":"finite_bundle_boundary_eq8","tally":{"close":0,"no verdict":0,"not reproduced":0,"reproduced":1}},{"corrections":[{"change":"Use cyclic-wavenumber 2D Fourier convention exp(-i 2*pi k.r), replacing k by 2*pi*k in beta V(k).","equation":"2D Fourier
