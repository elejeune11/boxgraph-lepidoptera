e record's code read from SI Fig. S9","1.376 [1.368, 1.385] read by the record's code read from SI Fig. S9","1.398 [1.39, 1.406] read by the record's code read from SI Fig. S9","1.418 [1.407, 1.429] read by the record's code read from SI Fig. S9"],"purpose":"reproduction, corrected, reader's model","quote":"for α2 φ = 10. ||ρ||2 denotes the L2 norm","source":"hannezo2015","verdict":"reproduced"},"text":"Even at alpha^2*phi = 100, the plotted y-axis does not match the labeled L2 norm ||rho||_2 — instead, it reproduces the peak density max(rho) across both branches."},{"evidence":{"id":"q_si_section262_wrong_fredholm_eigenvector","kind":"question","question_kind":"possible_error","source":"hannezo2015","text":"In SI Section 2.6.2 (pp. 12-13 / PDF pp. 18-19), the linear steady-state operator L = -alpha^-2 d_yy + [[1, -chi], [1, phi - chi]] (Eq. 9) is non-self-adjoint (L_12 = -chi != 1 = L_21). When applying the Fredholm solvability condition to Eq. (13) on p. 18, the SI projects the RHS onto the right eigenvector (s_i^(1), rho_i^(1)) rather than the adjoint (left) null vector ker(L^*) = (-alpha^2/(alpha^2 + i^2*pi^2), 1)^T. Reproducing that erroneous inner product yields the printed chi_i^(2) and chi_c^(2) identically, whereas both exact adjoint-Fredholm analysis and direct numerical steady-state continuation of Eq. (8) give a curvature larger by the strictly positive factor (alpha^2 + i^2*pi^2)*(alpha^2*phi + 2*i^2*pi^2)/(i*pi)^4 (6x-12x larger at Figs. S11-S12 parameters). Because the factor is positive for all phi > 0, the sign of chi_c^(2) and the tricritical point phi = 1/4 remain unchanged. Separately, the displayed 2nd-order solution (s_i^(2), rho_i^(2)) on p. 18 mistypes (alpha^2*phi + i^2*pi^2) and (alpha^2*phi + 4*i^2*pi^2) in place of (alpha^2 + i^2*pi^2) and (alpha^2 + 4*i^2*pi^2), though the paper's subsequent chi_i^(2) formula was clearly derived using the correct 2nd-order amplitudes.\n"},"text":"In SI Section 2.6.2, projecting the weakly nonlinear amplitude equation onto the right instead of the left adjoint eigenvector introduces a 6–12x curvature error relative to direct PDE continuation."}],"summary":"Bois, Jülicher & Grill (2011) formulate a 1D active-fluid patterning theory; Hannezo et al. (2015) adapt it to circumferential actin rings in Drosophila tracheal tubes. ModelAtlas verifies ten cross-paper relations forming two symbolic families, while auditing each paper's figures and 19-page SI Appendix catches subtle plotting and projection slips.","teaches":"Papers against each other","title":"From active fluids to epithelial rings"},{"id":"continuum_vs_cgmd","sources":["hannezo2015","sekine2024"],"steps":[{"evidence":{"a":"sekine2024/cgmd_anisotropic_langevin","b":"hannezo2015/turnover_diffusion_length","detail":"max relative error 1.56e-01 across the regime, within the stated 0.2","id":"sekine2024/rel_hannezo2015_langevin_dx_approx_turnover_length","kind":"relation","method":"numeric error","relation":"approximated_by","stated":false,"status":"verified"},"text":"ModelAtlas links Sekine's single-filament anisotropic Langevin dynamics directly to Hannezo's continuum turnover-diffusion length l_t = sqrt(D * tau) via the two-bead Einstein-Stokes diffusivity."},{"evidence":{"a":"sekine2024/anisotropic_diffusion_ratio","b":"hannezo2015/turnover_diffusion_length","detail":"log-slopes in ['friction_asymmetry'] agree at 12 points across the regime (max difference 2.2e-13)","id":"sekine2024/rel_hannezo2015_aniso_diff_scales_turnover_length","kind":"relation","method":"numeric log-slopes","relation":"scales_as","stated":false,"status":"verified"},"text":"Both models share the exact inverse-square-root scaling with directional friction anisotropy, (gamma_y / gamma_x)^(-1/2), verified to machine precision across the regime."},{"evidence":{"added":[],"against":"sekine2024/cable_interval_in_vivo","basis":"Hannezo 2015 Main Eq. [3] (lambda_c = 2*pi*(D*tau*eta/xi)^(1/4)) evaluated on Hannezo's Main p. 3 physiological FRAP and 024's full many-body CGMD network (cgmd_2d_network) is non-runnable from the published text alone, so mirroring sekine2024/comparisons.yaml (cmp_validation_cable_interval_4m), structure_factor_interval (interval = 1 / (mu/(2*pi)), role: processing) evaluates Sekine's published 4-M CGMD Gaussian structure-factor peak spatial frequency sf_4m_mu_over_2pi = 1.89140416 um^-1 (Supp. Table 4; not fitted to Hannezo 2015) to obtain the CGMD predicted wild-type stage-16 cable spacing (528.7 nm = 0.5287 um) and tests it against Hannezo 2015's independent wild-type stage-16 tracheal ring spacing measurement (0.5 +/- 0.1 um).\n","computed":"0.5287","correspondences":["hannezo2015/ring_wavelength = sekine2024/pattern_interval"],"id":"sekine2024/val_sf_interval_4m_vs_hannezo_wt_spacing","kind":"validation","model":"sekine2024/structure_factor_interval","per_value":null,"printed":"0.5 ± 0.1","status":"checked","verdict":"reproduced"},"text":"In the reverse direction, Sekine's 4-M CGMD structure-factor peak interval (528.7 nm) fails against Sekine's own 450 ± 13.2 nm measurement — yet is reproduced against Hannezo's wider confocal measurement (0.5 ± 0.1 um)."},{"evidence":{"belongs_to":"numerics","id":"ref_dimer_rk4_corrected_eta01_dt","kind":"refinement","output":"filament_y_shift","run":"run_dimer_rk4_corrected_eta01","series":[{"setting":5e-05,"value":0.5185834033052394},{"setting":2.5e-05,"value":0.15255044219809888},{"setting":1.25e-05,"value":0.4180790960451944},{"setting":6.25e-06,"value":0.4180790960452013}],"setting":"dt","settles":true,"shift":"0.2404","source":"sekine2024","tolerance":"1%","tolerance_basis":"added: 1% relative tolerance tests RK4 stability at SI Notes text viscosity eta_cyto = 0.1 Pa*s and paper dt = 5e-5 s (where lambda_perp*dt = 5.34 > 2.785 stability boundary)"},"text":"Numerical time-step refinement settles a 10x viscosity contradiction in Sekine's SI Notes: at dt = 5e-5 s and eta_cyto = 0.1 Pa*s, RK4 is numerically unstable (result belongs to the numerics), whereas at eta_cyto = 1 Pa*s it converges cleanly."},{"evidence":{"computed":"[4.391e-30, 2.736e-19, 5.85e-11, 4.294e-05, 0.1082, 0.9355, …]","computed_2se":null,"id":"cmp_sf_literal_c1_fit","kind":"comparison","page":23,"per_value":["not reproduced","not reproduced","not reproduced","not reproduced","not reproduced","close","not reproduced","not reproduced","not reproduced"],"printed":["0.1792 [0.1596, 0.1987] read by the record's code read from Supplementary Fig. 7c1","0.3345 [0.3165, 0.3524] read by the record's code read from Supplementary Fig. 7c1","0.5377 [0.5205, 0.555] read by the record's code read from Supplementary Fig. 7c1","0.7522 [0.7337, 0.7707] read by the record's code read from Supplementary Fig. 7c1","0.9139 [0.8914, 0.9364] read by the record's code read from Supplementary Fig. 7c1","0.9625 [0.9408, 0.9843] read by the record's code read from Supplementary Fig. 7c1","0.8795 [0.8565, 0.9025] read by the record's code read from Supplementary Fig. 7c1","0.7015 [0.684, 0.719] read by the record's code read from Supplementary Fig. 7c1","0.4851 [0.4663, 0.5038] read by the record's code read from Supplementary Fig. 7c1"],"purpose":"reproduction","quote":"the structure factor S(q) by the gaussian function around the peak","source":"sekine2024","verdict":"not reproduced"},"text":"Sekine's Methods print the Gaussian structure-factor fit in angular wavenumber q while Supplementary Table 4 reports spatial frequency q/(2*pi), causing all four literal curve reproductions to fail until converted by 2*pi."},{"evidence":{"id":"q_hannezo2015_same_system_biological_and_mechanistic_contrast","kind":"question","question_kind":"unexplained_difference","source":"sekine2024","text":"Direct biological and mechanistic comparison between the two Shigeo Hayashi-lab studies on the exact same experimental system — periodic circumferential cortical actin rings/cables in the stage 15-16 Drosophila embryonic tracheal dorsal trunk — reveals one closely concordant wild-type observable alongside four sharp mechanistic and experimental divergences: (1) Same-system wild-type spacing and tube geometry (concordant): Hannezo 2015 measures stage-16 WT actin ring period 0.5 +/- 0.1 um (ring_wavelength_embryo_wt, n > 150 rings, Lifeact-mEGFP; Fig. 3B histogram mean 0.494 +/- 0.081 um, bar 0.499 +/- 0.068 um), whereas Sekine 2024 measures early stage-16 periodic cable interval 450 +/- 13.2 nm (0.450 +/- 0.0132 um; cable_interval_in_vivo, Airyscan super-resolution Lifeact::GFP, n = 294 cables across N = 8 embryos; Supp. Fig. 1d median 446.8 nm, range 435.2-474.6 nm). The 10% mean offset (450 vs 500 nm) sits well inside Hannezo's +/- 100 nm spread, and the 7.6x narrower printed uncertainty reflects distinct summary statistics: Source-data_SupplementaryFig1d.xlsx (sekine_source_data/s1d_cable_interval_mean = 0.450123 um, s1d_cable_interval_sd = 0.013158 um) confirms +/- 13.2 nm is the sample SD across N = 8 embryo means, whereas Hannezo's +/- 0.1 um is the per-ring pooled SD. Dorsal-trunk diameter also aligns across developmental staging: Sekine Fig. 1j rises from 2.60 um (-80 min) to 3.94 um (+20 min, range 2.22-4.66 um) across stage 15 to early stage 16, approaching Hannezo Fig. 4F's stage-16 WT diameter 4.775 +/- 0.250 um. On forward spacing prediction, Sekine's CGMD 4-M produces 529 nm (~0.5 um, +17.6% above 450 nm), whereas Hannezo Main p. 3's literature inputs predict 1.8 um (1.749 um exact, 3.5x-3.9x larger) and SI p. 21 reproduces 0.50-0.55 um only after inverting l_h = 10 nm (8.18 nm exact) directly from 0.5 um. (2) Myosin II / contractility requirement (complete pattern loss vs persistent oriented nanoclusters and fusion-specific role): Hannezo 2015 (Main p. 3, Fig. 2C) reports complete disappearance of stage-16 actin rings after 180-min incubation in 250 uM Y-27632 (ROCK inhibitor), taking this as decisive proof of a contractility-driven hydrodynamic instability whose uniform state is strictly stable below threshold (lambda(q) = -1/tau - D*q^2 < 0 at zero contractility in dispersion_relation_eq7). Although Sekine 2024 (p. 4) describes Myosin II[DN] (zip[ROD]) as \"consistent with the ROCK inhibitor treatment14\", Sekine's own quantitative data tell a substantially different mechanistic story: Myosin II[DN] does NOT abolish actin clustering or circumferential bias — nanoclusters remain robust (major 325.64 nm, minor 171.16 nm, aspect ratio 2.034), retain partial circumferential orientation (54.4 deg vs 63.5-66.5 deg controls and 44.5 deg random/DAAM; zip RNAi in Table 2 retains 59.5 deg and 330.58 nm), preserve statistically significant circumferential fusion-duration stabilization (P = 1.83e-5, Fig. 3e), and preserve significant circumferential motion anisotropy (|dy|/|dx| = 1.20 vs 1.60 control; PIV |V_y| = 27.2 > |V_x| = 22.6 nm/s, P = 8.98e-6, Fig. 5d-f). Correspondingly, Sekine's CGMD self-organizes periodic 404 nm nanoclusters at zero myosin motors (1-M, N^m = 0) via passive alpha-actinin crosslinking alone, and even forms circumferentially oriented fused cables without motors at high crosslinker density (2-H: N^cl = 7500, N^m = 0, gamma_y^f/gamma_x^f = 1.5 -> median 59 deg, dominant 85.3 deg, major 439.6 nm, coherency 0.15). Thus myosin II is the sole pattern-initiating instability driver in hannezo2015, whereas in sekine2024 it acts downstream solely to bridge and fuse pre-existing crosslinker-nucleated nanoclusters (with Y-27632's complete abolition in Hannezo potentially reflecting broader 180-min ROCK-pathway effects on cortical actin assembly/RhoA signaling beyond myosin II motor activity alone). (3) Friction anisotropy threshold, molecular cue, and opposite flow/motion direction: Hannezo Main p. 3 reports that small orthoradial friction excess xi_theta > 1.1*xi_z (10%; 20% shown in Fig. 2E) suffices to orient rings circumferentially, attributing friction and its anisotropy to ECM-cortex coupling (axially aligned luminal chitin fibers, Src42A increasing spacing to 0.8 +/- 0.2 um, moesin RNAi increasing larval taenidial spacing +25% to 1.8 +/- 0.5 um, and chitin-deficient kkv1 expanding spacing 9-10x to 4.5 +/- 2 um with chaotic wandering). Sekine SI Notes p. 32 instead requires 5x larger friction asymmetry (gamma_y^f/gamma_x^f >= 1.5, applied exclusively to actin filaments) plus both threshold crosslinkers (N^cl >= 6750; 4-L with N^cl = 4500 stays dispersed at 52 deg, coherency 0.15) and motors (N^m = 900), identifying mechanosensitive formin DAAM (DAAM RNAi: 44.5 deg, isotropic fusion P = 0.114, isotropic motion |dy|/|dx| = 0.96, PIV P = 0.728, labyrinth) and alpha-Actinin/Zasp52 (actn14: 42.5 deg; Zasp52 RNAi: 48.5 deg, |dy|/|dx| = 0.98, PIV P = 0.436) as the anisotropy-sensing machinery. Most fundamentally, the direction of actin transport relative to friction anisotropy is reversed: in Hannezo's active gel (xi_theta > xi_z), higher circumferential friction suppresses circumferential flow v_theta relative to axial flow v_z so contractile advection moves actin along the low-friction longitudinal axis (|v_z| > |v_theta|), matching the passive single-filament Brownian bias |dy|/|dx| = 1/sqrt(1.5) = 0.816 < 1 (anisotropic_diffusion_ratio, rel_hannezo2015_aniso_diff_scales_turnover_length); whereas Sekine observes and simulates faster nanocluster displacement and PIV flow along the high-friction circumferential axis (|dy|/|dx| = 1.13 in 2-M, 1.45 in 4-M, 1.72 at Stage 15 0* min, 1.60 in Stage 16 control, 1.20 in Myosin II[DN]; PIV |V_y| > |V_x|), an inversion not explained by equilibrium friction or linear active-gel flow (see also q_missing_relaxation_time_explanation). (4) De novo instability onset vs two-stage nanocluster fusion/fission dynamics: Hannezo 2015 proposes a single-step supercritical/subcritical bifurcation from a homogeneous stage-15 cortex triggered by a +60% (text p. 1; +70% Fig. 1A) increase in F-actin concentration ramping chi from 1.07 to 1.47 over 1875 s (supported by gamma-COP mutants with -20%/-45% diameter and -40%/-65% actin lacking rings). Sekine 2024 resolves a hierarchical two-stage process during stage-15 tube expansion (-80 to 0* min): sporadic ~140 x 210 nm (mode; mean 178 x 329 nm) nanoclusters emerge first, align circumferentially (-40 to 0* min: dominant direction 15.6 -> 83.9 deg, median 44.5 -> 66.5 deg) before cable connectivity rises (-10 to 0* min: coherency 0.13 -> 0.48), and sustain steady-state periodic cables through repetitive sub-second (0.64 s) fusion and fission with DAAM-dependent circumferential stabilization — a dynamic cluster-coalescence pathway that neither paper reconciles quantitatively with Hannezo's monolithic density-wave bifurcation or kkv1 chaotic ring dynamics.\n"},"text":"Beyond parameter tuning, the two studies diverge sharply on mechanism: Hannezo's rings vanish under ROCK inhibition, whereas Sekine's Myosin II[DN] still exhibits anisotropic circumferential nanocluster motion and fusion bias."}],"summary":"Hannezo et al. (2015) and Sekine et al. (2024) come from the same lab and study the exact same biological structure: circumferential actin rings in embryonic Drosophila trachea. Bridging continuum theory to coarse-grained molecular dynamics reveals where scale separation breaks down, how measurement precision flips validation verdicts, and why an internal viscosity choice is numerically unstable.","teaches":"Papers against each other, and against measurement","title":"Continuum active gel vs. microscopic CGMD in the same tube"},{"id":"code_and_data","sources":["sekine2024","sekine_code","sekine_rnai_screen","sekine_mist_complexes","sekine_source_data"],"steps":[{"evidence":{"added":[],"against":"sekine2024/cable_interval_in_vivo","basis":"Unweighted mean of N = 8 embryo cable intervals in Source-data_SupplementaryFig1d.xlsx vs printed 450 ± 13.2 nm.","computed":"450.1","correspondences":["sekine2024/pattern_interval = sekine_source_data/pattern_interval"],"id":"sekine_source_data/val_cable_interval_in_vivo","kind":"validation","model":"sekine_source_data/cable_interval_reader","per_value":null,"printed":"450 ± 13.2","status":"checked","verdict":"reproduced"},"text":"Running live Python readers over all 27 Source Data spreadsheets reproduces 82 cited numbers — including the in vivo cable interval mean and SD (450 ± 13.2 nm)."},{"evidence":{"added":[],"against":"sekine2024/sim_4m_coherency","basis":"Maximum 4-M coherency across frames 1-41 in Source-data_Fig4f.xlsx (0.223) vs Supplementary Table 3 (0.30).","computed":"0.223","correspondences":["sekine2024/orientation_coherency = sekine_source_data/orientation_coherency"],"id":"sekine_source_data/val_fig4f_max_vs_sim_4m_coherency","kind":"validation","model":"sekine_source_data/sim_4m_timecourse_reader","per_value":null,"printed":"0.30","status":"checked","verdict":"not reproduced"},"text":"Four cross-validations fail and pinpoint real reporting slips. First, the 4-M simulation timecourse in Fig. 4f peaks at coherency 0.223 and never reaches the 0.30 reported in Fig. 4c and Supplementary Table 3."},{"evidence":{"added":[],"against":"sekine2024/pval_fig2b_0min_pair","basis":"Bonferroni-adjusted (x3) pairwise Wilcoxon rank-sum P-value at 0* min (as stated in Fig. 2b caption) vs printed p = 0.0151 (which is actually the unadjusted P = 0.01508).","computed":"0.04524","correspondences":["sekine2024/p_value = sekine_source_data/p_value"],"id":"sekine_source_data/val_fig2b_0min_pair_bonf_pval","kind":"validation","model":"sekine_source_data/fusion_stability_reader","per_value":null,"printed":"0.0151","status":"checked","verdict":"not reproduced"},"text":"Second, Fig. 2b reports a pairwise P-value as Bonferroni-corrected, but recomputation from the raw sheet fails with Bonferroni and reproduces the printed value only without multiple-testing adjustment."},{"evidence":{"added":[],"against":"sekine2024/pval_figs5d_rhogef2","basis":"True Stage 16 RhoGEF2 vs Stage 16 GFP Welch P-value (0.0160, explaining the '*' on the plot) vs Supp. Fig. 5d caption's printed p = 0.0641.","computed":"0.01602","correspondences":["sekine2024/p_value = sekine_source_data/p_value"],"id":"sekine_source_data/val_figs5d_rhogef2_true_st16_pval","kind":"validation","model":"sekine_source_data/colocalization_reader","per_value":null,"printed":"0.0641","status":"checked","verdict":"not reproduced"},"text":"Third, Supplementary Fig. 5d prints p = 0.0641 for Stage 16 RhoGEF2 colocalization, which fails against the actual Stage 16 Control vs. RhoGEF2 columns (p = 0.0160)."},{"evidence":{"added":[],"against":"sekine2024/pval_figs5d_rhogef2","basis":"Cross-stage diagnostic testing Stage 15 RhoGEF2 (Fig. 3d) against Stage 16 GFP (Supp. Fig. 5d): yields Welch P = 0.06411, reproducing the Supp. Fig. 5d caption's p = 0.0641.","computed":"0.06411","correspondences":["sekine2024/p_value = sekine_source_data/p_value"],"id":"sekine_source_data/val_figs5d_rhogef2_cross_stage_pval","kind":"validation","model":"sekine_source_data/colocalization_reader","per_value":null,"printed":"0.0641","status":"checked","verdict":"reproduced"},"text":"Remarkably, testing Stage 15 Control against Stage 16 RhoGEF2 reproduces p = 0.0641 to four significant digits, diagnosing an exact cross-stage column mix-up."},{"evidence":{"id":"q_fig1k_duplicated_from_fig1j","kind":"question","question_kind":"possible_error","source":"sekine_source_data","text":"Source-data_Fig1k.xlsx (sheet 'Figure 1k', titled 'Tube length') contains an exact cell-for-cell duplicate of all 36 tube-diameter measurements from Source-data_Fig1j.xlsx ('Tube Diameter', ranging from 2.22 to 4.65 um with means 2.60-3.94 um; max absolute difference across all 36 cells is 0.0 um in run_tube_skel_m80). In sekine2024 Fig. 1k (PDF p. 2), 'Tube length (um)' actually rises from ~17 um at -80 min to ~24 um at +20 min. The true Fig. 1k tube-length source data are completely missing from MOESM11_ESM.zip.\n"},"text":"Auditing the archive also uncovers that Source-data_Fig1k.xlsx (\"Tube length\") is a cell-for-cell duplicate of Source-data_Fig1j.xlsx (\"Tube diameter\"), while 900 dpi digitization independently catches a +2.5 deg misplot of St. 15 orientation in Fig. 4c."},{"evidence":{"id":"q_missing_circularity_filter","kind":"question","question_kind":"possible_error","source":"sekine_code","text":"Both README.md (line 5) and sekine2024 Methods p. 10 ('Motion anisotropy') state that 'an actin cluster within the size range 0.01 to 0.1 um^2 and circularity 0.5 - 1.0 was selected at tn'. However, Nanocluster_motion.m never computes perimeter or circularity (no regionprops 'Circularity' or 'Perimeter' call anywhere in lines 1-260) and never filters by shape. Because ALL_Result exports only 6 columns (x1, y1, A1, x2, y2, A2; lines 161-170, 199-207, 222-230), circularity filtering cannot even be performed downstream in R from the MATLAB output. Either circularity pre-filtering was applied externally in ImageJ/Fiji before running MATLAB (undisclosed in both README.md and Methods p. 10, and partially redundant with bwareafilt([6 53])), or no circularity filter was actually applied. Our Python port confirms an elongated 1x20 px rod (A = 20 px = 0.0374 um^2, C = 0.143 << 0.5) is tracked by Nanocluster_motion.m (matched=1) but rejected by the documented Methods/README specification (matched=0).\n"},"text":"Reading the released MATLAB tracker (Nanocluster_motion.m) confirms its hardcoded [6, 53] pixel area filter against the Methods' 0.01–0.1 um^2 range — but shows that both the circularity (> 0.5) and area-ratio (0.5–2x) filters stated in Methods are absent from the code."},{"evidence":{"id":"q_selection_threshold_mismatch","kind":"question","question_kind":"unexplained_difference","source":"sekine_rnai_screen","text":"sekine2024 Methods (p. 11) states that \"If the number of pupae was less than 70 on day 8, the RNAi line was judged as 'pupation defective', and used in the second screen (Supplementary Table 2)\", and cell B3 of Supplementary Data 1 similarly flags \"< 70 at day 8\" in red. However, the actual 22 RNAi lines carried into sekine2024 Supplementary Table 2 do not match the day 8 < 70 criterion: (a) 3 lines with numeric day 8 < 70 colored red in Supplementary Data 1 were excluded from Supplementary Table 2 without explanation: nullo (BDSC#41905, Larva (semi), day 8 = 34), pod1 (BDSC#41705, Larva (semi), day 8 = 31), and sn (BDSC#42615, viable/blank, day 8 = 66); (b) 6 lines with day 7-8 pupa counts >= 81 were included in Supplementary Table 2, including 2 of the 10 screen positives: Chd64 (BDSC#62377, day 8 = 99, \"Gentotyped after hatch\", screen positive), form3 (BDSC#32398, day 8 = 81, \"Genotyped after hatch\", screen positive), Keap1 (BDSC#40932, day 8 = 86, \"Genotyped after hatch\"), WASp (BDSC#51802, day 8 = 101, \"Genotyped after hatch\"), zip (BDSC#38259, day 7 = 118, day 8 = n.d., \"Genotyped after hatch, R189\"), and alpha-Cat (BDSC#33430, day 7 = 112, day 8 = n.d., no note) — the \"Genotyped after hatch\" notes suggest balanced stocks whose non-RNAi siblings pupated; and (c) DAAM (BDSC#39058) and dia (BDSC#33424) have day 8 = \"n.d.\" (with day 7 = 0). Instead of day 8 < 70, the 22 lines in Supplementary Table 2 correspond exactly to all 21 \"Larva\" lines plus 1 of the 4 \"Larva (semi)\" lines (cpb, BDSC#50954).\n"},"text":"Auditing the two supplementary genetic-screen workbooks flags a day-8 pupae selection threshold mismatch in the RNAi screen and an undocumented functional grouping in the MIST complex table."}],"summary":"Sekine et al. (2024) released a MATLAB nanocluster tracker, two supplementary Excel screens (RNAi pupa counts and MIST protein complexes), and 27 Source Data spreadsheets. Reading all four attachments as BoxGraph sources confirms 82 cited values and 26 of 30 cross-validations while exposing silent statistical, plotting, and code-vs-Methods discrepancies.","teaches":"A paper against its own code and data","title":"Auditing released MATLAB code, genetic screens, and 27 Source Data files"},{"id":"bundle_diameter","sources":["grason2007","claessens2008","dutta2016"],"steps":[{"evidence":{"a":"grason2007/columnar_elastic_energy_eq5","b":"claessens2008/twist_energy_per_monomer","detail":"log-slopes in ['K2_bar', 'Omega'] agree at 24 points across the regime (max difference 1.0e-05)","id":"claessens2008/rel_grason_eq5_scales_claessens_twist","kind":"relation","method":"numeric log-slopes","relation":"scales_as","stated":false,"status":"verified"},"text":"ModelAtlas verifies four scaling relations between Claessens et al. (2008) and Grason & Bruinsma (2007): both share the geometric D ~ N^(1/2) cross-section scaling and quadratic elastic-twist energy scaling."},{"evidence":{"id":"q_grason2007_diameter_Rstar_scaling_and_onset_size","kind":"question","question_kind":"unexplained_difference","source":"claessens2008","text":"Comparing Claessens et al.'s (2008) fascin bundle-diameter measurements and scaling against Grason & Bruinsma's (2007) equilibrium-radius models reveals an incompatible dependence on bound cross-linker density R* alongside a partial order-of-magnitude overlap at saturation: (1) Cross-linker density scaling: identifying axial linker spacing l ~ 1/R* in Grason & Bruinsma's microscopic scaling (p. 4: K3 ~ k_B T*l_p/d^2 ~ (R*)^0, while mu_perp, mu_par, gamma, Sigma ~ 1/l ~ R*) predicts columnar onset radius lambda_{3 perp} = (K3_bar/mu_perp_bar)^(1/2) ~ (R*)^(-1/2), exact columnar equilibrium radius R_0(R*) (grason2007/columnar_equilibrium_radius_muc) monotonically decreasing with R* (local log-slope d(log R_0)/d(log R*) in [-0.144, 0], falling from lambda_{3 perp}(R*_c) to (16/27)*lambda_{3 perp}(R*_c) as R*/R*_c -> oo), columnar low-Sigma and solid shear-regime radii independent of R* (slope 0), and solid bending-regime radius decreasing as (R*)^(-1/5) (slope -0.2). None reproduces Claessens's observed positive growth D ~ (R*)^(+0.3) (diameter_scaling_Rstar; Fig. 1C fit slope +0.327). Only under the non-standard assumption of R*-independent surface tension Sigma (with mu_perp, mu_par, gamma ~ R*) does grason2007/solid_radius_shear_regime yield R_0 ~ (R*)^(+1/3), outside its R_0 >> lambda_{3 perp} validity regime and inconsistent with Grason's Sigma ~ Delta E*/(d*l) scaling. (2) Saturation spacing and bundle diameter: Claessens's 1:4.5 saturation stoichiometry with d = 2.9 nm gives mean axial fascin spacing per filament l_fil = 4.5*2.9 = 13.05 nm, closely matching the SAXS inter-filament spacing a_H = 12.4 nm (supporting Grason's saturated-linker estimate l ~ d in grason2007/saturated_linker_spacing, though per-neighbor-pair spacing is u*d ~= 39.2 nm). Inserting Claessens's d = 12.4 nm and Delta G/(k_B T) = 15.02 (binding_energy_fascin_sign_corrected) into grason2007/lambda_3perp_microscopic gives columnar onset diameter 2*lambda_{3 perp} = 57.5 nm at l_p = 1 um (closely matching Claessens's hydrated 2-shell SAXS diameter 50-57 nm, area-equivalent 56.8 nm for n_f = 19), but 182-237 nm at realistic F-actin persistence lengths l_p = 10-17 um (3-4x larger than the hydrated diameter and 6-8x larger than the TEM plateau 28.2 nm). Because rigid fascin linkers suppress axial sliding, fascin bundles would correspond to Grason's 3D hexagonal-solid phase (Eq. 9), where Ref. 21 (grason2007/solid_to_columnar_radius_ratio) predicts much smaller radii than columnar aggregates.\n"},"text":"Despite that shared geometry, their bundling mechanisms predict opposite responses to increasing cross-linker ratio R*: Claessens measures D ~ (R*)^(+0.3), whereas chiral supertwist predicts a decreasing or flat equilibrium radius."},{"evidence":{"computed":"[0.06831, 0.04509, 0.02886, 0.02004, 0.01283, 0.008907, …]","computed_2se":null,"id":"cmp_droplet_crit_ca_fig2e_line","kind":"comparison","page":2,"per_value":["not reproduced","not reproduced","not reproduced","not reproduced","not reproduced","not reproduced","not reproduced","not reproduced"],"printed":["0.1539 [0.145, 0.1633] read by the record's code read from Fig. 2E","0.1013 [0.09545, 0.1075] read by the record's code read from Fig. 2E","0.06462 [0.0609, 0.06858] read by the record's code read from Fig. 2E","0.04476 [0.04218, 0.0475] read by the record's code read from Fig. 2E","0.02856 [0.02691, 0.03031] read by the record's code read from Fig. 2E","0.01978 [0.01864, 0.02099] read by the record's code read from Fig. 2E","0.016 [0.01508, 0.01698] read by the record's code read from Fig. 2E","0.01208 [0.01138, 0.01281] read by the record's code read from Fig. 2E"],"purpose":"reproduction","quote":"dotted line represents nf ⫽ 20.","source":"claessens2008","verdict":"not reproduced"},"text":"Digitizing Claessens et al.'s Fig. 2E droplet-confinement phase diagram shows that the printed single-ring stability boundary misses the drawn line by a factor of 2.23x, while the paper also prints a sign slip in Delta G = k_B T ln(K_D) and a Bragg degeneracy slip in Fig. 3A."},{"evidence":{"id":"q_claessens2008_electrostatic_agreement_contradicted","kind":"question","question_kind":"overstated_claim","source":"dutta2016","text":"On p. 5 (28001-p4), dutta2016 substitutes Borukhov et al.'s [ref-11] F-actin electrostatic screening length (~1 nm) and filament thickness (~8 nm) into its qualitative discussion of Fig. 3 and claims \"For these values, fig. 3 would give a bundle consisting of a few filaments in agreement with the findings of [19]\" (claessens2008). Cross-checking both papers exposes four independent contradictions of this claimed agreement: (1) Direct experimental refutation of salt/electrostatic control in claessens2008: in claessens2008's standard F-buffer (p. 4 Methods: 100 mM KCl, 2 mM MgCl2, 0.2 mM CaCl2, 2 mM Tris, 0.5 mM ATP at 20 degC; ionic strength I ~= 107 mM), the Debye screening length is lambda_D ~= 0.93 nm (lambda_R = lambda_D/8 nm ~= 0.117, matching dutta2016's cited ~1 nm / 0.125). Claessens et al. (p. 1) explicitly lowered salt to the polymerization minimum (claessens2008/mgcl2_min_conc = 2 mM MgCl2, no KCl or CaCl2; I ~= 6.0-8.5 mM), increasing lambda_D by 3.5-4.2x (to 3.3-3.9 nm, lambda_R ~= 0.413-0.492), and observed \"no influence on the maximum F-actin/fascin bundle thickness.\" In dutta2016 (screening_length_salt_scaling, bundle_size_eq8, Figs. 3(b) and 4), increasing lambda_R strictly increases repulsive 2*pi*Gamma_R/(k^2 + 1/lambda_R^2) at every k >= 0 and monotonically shrinks D*(lambda_R) until bundles dissolve into the disordered nematic liquid (e.g., at Fig. 3(b) parameters, passing from infinite bundles at lambda_R = 0.117 through the narrow consistent finite-bundle window lambda_R in (0.3849, 0.4391) to unbundled liquid at lambda_R = 0.492). (2) Negligible electrostatic repulsion at fascin spacing: claessens2008 reports a fascin interfilament surface-to-surface separation of ~5 nm (interfilament_sep_fascin, p. 1) and SAXS center-to-center lattice constant a_H = 12.4 nm (aH_hex_saxs, p. 2). At F-buffer lambda_D ~= 0.93 nm, electrostatic interactions across neighboring filaments are exponentially suppressed (exp(-5/0.933) = 4.7e-3; K_0(12.4/0.933) = 5.8e-7), directly supporting claessens2008's conclusion (p. 1) that \"electrostatic repulsion between actin filaments is too short-ranged to affect bundle assembly.\" (3) Failure of dutta2016's Eq. (8) / Fig. 3(b) at the F-actin ratio: both at dutta2016's cited lambda_R = 1/8 = 0.125 (extending q_actin_ratio_in_infinite_phase) and at claessens2008's F-buffer lambda_R = 0.117, Fig. 3(b) (Gamma_R = 5, Gamma_A = 20, lambda_A = 0.3, rho* = 1) lies deep inside the infinite-bundle macrophase-separation phase (lambda_R_inf = 0.3849, independent of 2*pi conventions) and inverts the SALR ordering (lambda_R < lambda_A = 0.3). Under consistent Eq. (8), any finite-bundle window at lambda_R = 0.117 (or 0.125) requires the exact Lifshitz bound rho* * Gamma_R > 1/(12*pi*lambda_R^4) ~= 143.2 (or 108.7), ruling out finite bundles at all Gamma_R values studied in dutta2016 (Gamma_R = 5, 10 at rho* = 1). (4) Concentration-dependence and observable mismatch: claessens2008 observes finite bundles up to n_f ~= 20 filaments (5-6 filaments across in Fig. 2D; hydrated 2-shell width 50-58 nm ~= 6.3-7.3 filament diameters, TEM plateau ~28.2 nm) whose thickness is independent of actin concentration c_a (Fig. 1A-B), whereas dutta2016's spinodal criterion F = rho* |beta V| b > 1 depends directly on areal polymer density rho* and identifies bundle size only with the crude periodic density-modulation wavelength 2*pi/k_min (dense bundle plus dilute gap, p. 6).\n"},"text":"Dutta et al. (2016) claim their competing-interaction model agrees quantitatively with Claessens et al.'s fascin-bundle widths, but cross-record auditing refutes the claim on four fronts — including the 2*pi Fourier error and Claessens's own low-salt control."}],"summary":"Grason & Bruinsma (2007), Claessens et al. (2008), and Dutta et al. (2016) propose three different equilibrium theories for finite F-actin bundle diameter: chiral supertwist, cross-linker-driven helical overtwist, and competing electrostatic interactions. Testing them side by side separates shared geometry from contradictory physical predictions.","teaches":"Competing physical mechanisms","title":"Why do F-actin bundles stop growing?"},{"id":"wing_scales","sources":["bois2011","hannezo2015","totz2024"],"steps":[{"evidence":{"id":"q_hannezo2015_upstream_spacing_interface","kind":"question","question_kind":"unstated_model","source":"totz2024","text":"No equation-level ModelAtlas relation (same_as, reduces_to, derived_from, scales_as, approximated_by) or cited.yaml link connects hannezo2015 (52 models) and totz2024 (34 models): totz2024 does not cite hannezo2015 (none of Refs. 1-63 or S1-S6, though both independently cite Priess & Hirsh 1986 on C. elegans actin-templated cuticle patterning — hannezo2015 ref-20, totz2024 Ref. 55 — and both study insect epithelial actin scaffolds templating complementary cuticular folds: taenidial folds in Drosophila trachea vs. inter-bundle protoridges in butterfly wing scales). Rather than alternative formulations of the same equations, the two papers represent a sequential upstream-to-downstream physical coupling: upstream 1D/2D viscous active-gel cortical instability with turnover predicting periodic actin spacing lambda_c (hannezo2015) feeding into downstream static Föppl-von-Kármán (FvK) elastic plate buckling of a growing membrane/nascent cuticle clamped at fixed inter-bundle spacing L (totz2024, which notes on p. 10 that the upstream actin-scaffold patterning mechanism is left unmodeled). Quantitative evaluation of the sequential interface yields five findings: (1) Direct algebraic coupling of g_c to active-gel parameters: setting totz2024's clamped bundle spacing L equal to hannezo2015's linear onset wavelength lambda_c = 2*pi*(D*tau*eta/xi)^(1/4) = 2*pi*sqrt(l_t*l_h) = 2*pi*l_h*phi^(-1/4) (critical_wavelength_eq3, critical_wavelength_from_lengths, critical_wavelength_dimensionless) substitutes directly into totz2024's critical Euler buckling strain g_c = (pi^2 / (3*(1 - nu^2)))*(h/L)^2 (critical_growth_strain_eq4, scaling g_c ~ L^-2) to give the exact composed threshold g_c = h^2 / (12*(1 - nu^2)*l_t*l_h) = (h^2 / (12*(1 - nu^2)))*(xi / (D*tau*eta))^(1/2) = h^2*phi^(1/2) / (12*(1 - nu^2)*l_h^2), where pi^2 cancels (2*pi)^2 cleanly and cortex thickness h_c cancels inside eta/xi = eta_3D/gamma_3D while elastic plate thickness h enters as h^2. Hence totz2024's g_c ~ L^-2 couples directly to hannezo2015's (D*tau*eta/xi)^(-1/2): higher cortical-ECM friction xi shrinks lambda_c ~ xi^(-1/4) and raises g_c ~ xi^(+1/2), suppressing buckling, whereas lower friction widens lambda_c and lowers g_c. (2) Exact wavelength-to-spacing overlap across Drosophila trachea and butterfly wing scales: in stark contrast to bois2011's C. elegans cortical scale (ell ~ 10 um giving lambda ~ 51-67 um, 32-195x above butterfly scales; see q_bois2011_upstream_spacing_interface), hannezo2015's insect epithelial active-gel wavelengths (lambda_c = 0.50-1.80 um) sit squarely across totz2024's butterfly inter-bundle spacings (0.341-1.601 um in Fig. 4C; 1.28-1.60 um across Fig. 3G, overall mean 1.48 um; 1.80 um in Fig. 2E caption). Specifically, hannezo2015's theoretical predictions span 0.50-1.75 um (printed 1.8 um): Main p. 3 Eq. 3 from FRAP D = 0.04 um^2/s, tau = 15 s (l_t = 0.775 um) and literature l_h = 0.100 um (eta = 1e-5 Pa*s*m, xi = 1e9 Pa*s/m, phi = 0.0167) predicts lambda_c = 1.749 um (1.777 um with rounded l_t = 0.8 um; printed 1.8 um, lambda_c_predicted_main), matching V. cardui (1.60 um) and Fig. 2E (1.80 um); SI p. 15 inverted l_h = 10 nm (8.18 nm exact) gives lambda_c = 0.553 um (0.500 um); and the SI Section 2.6.5 nonlinear PDE ramp (alpha = 480, phi = 0.0014, 14.68 rings / 10 um) yields mean spacing 0.681 um (Fig. S14 mode 0.608 um). Likewise, hannezo2015's Drosophila tracheal measurements span 0.50-1.80 um across wild-type and modest perturbations: embryonic WT 0.5 +/- 0.1 um, Src42A 0.8 +/- 0.2 um (matching C. eurytheme ridged L_1,A = 0.801 um), early 3rd-instar larval WT 1.2 +/- 0.1 um, late 3rd-instar larval WT taenidial 1.45 +/- 0.3 um (matching V. cardui Fig. 3G mean 1.48 um), and moesin RNAi 1.8 +/- 0.5 um (only ECM-depleted kkv1 4.5 +/- 2 um lies above). Feeding hannezo2015's wavelengths into totz2024's critical_growth_strain_eq4 and rayleigh_ritz_amplitude_eq3_corrected (h = 20 nm, nu = 0.5, Y = 1 MPa, p = 10 Pa) places hannezo2015 embryonic WT (0.500 um -> g_c = 0.702%, a = 5.3 nm at g = 0.5% and 9.8 nm at g = 0.7%) right on totz2024's zero-pressure buckling threshold (L* = 0.501 um at Table S1 g_max = 0.7% and L* = 0.592 um at Fig. 4C g = 0.5%), while the SI PDE ramp (0.681 um -> g_c = 0.378%, a = 18.7 nm at g = 0.5%), Src42A (0.800 um -> g_c = 0.274%, a = 26.1 nm), larval WT (1.20-1.45 um -> g_c = 0.122-0.083%, a = 48.2-61.4 nm), and Main Eq. 3 (1.749-1.800 um -> g_c = 0.057-0.054%, a = 77.3-80.1 nm) span the full ridged butterfly buckling regime (26.2-69.4 nm at g = 0.5%). (3) Implied active-gel parameters, subcriticality, stability, and quartic friction sensitivity: inverting totz2024's five Fig. 4C spacings via hannezo2015/hydrodynamic_length_from_wavelength at hannezo2015's FRAP l_t = 0.775 um and eta = 1e-5 Pa*s*m gives: V. cardui (1.601 um) -> l_h = 83.8 nm, xi = 1.42e9 Pa*s/m, phi = 1.17e-2, chi_c = 1.23 (nearly identical to Main p. 3's l_h = 100 nm, xi = 1e9 Pa*s/m); A. vanillae ridged (0.910 um) and C. eurytheme ridged (0.801 um) -> l_h = 27.1 and 21.0 nm, xi = 1.36e10 and 2.27e10 Pa*s/m, phi = 1.22e-3 and 7.34e-4, chi_c = 1.07 and 1.05 (bracketing SI Section 2.6.4-2.6.5's phi = 1.0-1.4e-3, chi_c ~ 1.07); and A. vanillae flat (0.360 um) and C. eurytheme flat (0.341 um) -> l_h = 4.24 and 3.80 nm, xi = 5.57e11 and 6.92e11 Pa*s/m, phi = 2.99e-5 and 2.41e-5 (~2x smaller l_h than SI p. 15's exact 8.18 nm). All five butterfly spacings lie deep inside hannezo2015's subcritical pitchfork regime (phi << phi_tricrit = 1/4, producing sharp, localized actin spikes separated by wide depleted valleys) and 1.3e5-6.5e7x above hannezo2015's low-friction chaos boundary (chaos_friction_threshold_inequality: zeta_c = eta/((2*pi)^4*D*tau) = 1.07e4 Pa*s/m, phi_chaos = (2*pi)^4 = 1559), predicting stationary rather than chaotically migrating bundles (consistent with constant spacing L during buckling in totz2024 Fig. 3G). However, because lambda_c ~ xi^(-1/4) depends only weakly on friction, producing the 2.35-2.53x ridged-to-flat spacing reduction purely by active-gel parameter tuning requires a quartic (L_1/L_2)^4 = 30.4x (C. eurytheme) to 40.8x (A. vanillae) increase in xi/(D*tau*eta) — and 486x across V. cardui vs. C. eurytheme flat (compare hannezo2015's own 150x friction span between Main p. 3 and SI p. 15, hannezo2015/q_si_p15_parameter_estimates_inconsistency). (4) Symbol overloading and dimensional distinctions: D is effective cortical actin diffusivity (0.04 um^2/s, [length]^2/[time]) in hannezo2015 vs. elastic plate bending modulus Y*h^3/(12*(1 - nu^2)) ([mass]*[length]^2/[time]^2) in totz2024; L is hydrodynamic screening length sqrt(eta/xi) (SI) or cell length (Main p. 2 col. 1) in hannezo2015 vs. inter-bundle period in totz2024; h is apical actin cortex thickness (100 nm, canceling in eta/xi) in hannezo2015 vs. membrane/nascent-cuticle plate thickness (20 nm, entering as h^2 in g_c) in totz2024; chi is dimensionless active contractility / Peclet number in hannezo2015 vs. Airy stress potential in totz2024; sigma is 2D active-gel axial stress in hannezo2015 vs. 2D elastic Cauchy stress tensor / growth pre-stress sigma_A = Y*g in totz2024. (5) Remaining biophysical gaps: (a) orientation and geometry — hannezo2015 forms circumferential rings around cylindrical tracheal cells via orthoradial friction anisotropy (xi_theta > 1.1*xi_z, Fig. 2E) aligned across cell junctions (SI Section 2.7), whereas butterfly wing scales form longitudinal parallel bundles within a single flattened scale cell (requiring orthogonal anisotropy xi_parallel > 1.1*xi_perp); (b) bimodal spacing — hannezo2015's 1D active-gel steady states produce unimodal periodic arrays (Fig. S14) and cannot by themselves generate the alternating double-bundle spacing (L_1,B = 0.910 um, L_2,B = 0.360 um) on the single upper surface of A. vanillae (Fig. 4B), and in C. eurytheme totz2024 (p. 10) attributes the smaller lower-lamina gap L_2,A in part to thicker actin bundles physically narrowing the interstitial space; (c) missing mechanical bridge and unmeasured parameters — hannezo2015 models a flat viscous active fluid without membrane bending elasticity, growth strain g, or discrete bundling of 20-200 cross-linked F-actin filaments, totz2024 assumes a static rigidly clamped bundle array with no active turnover or contractility, and totz2024 measures none of D, tau, eta, xi, or sigma_a in developing butterfly scales.\n"},"text":"Hannezo's critical active-gel wavelength lambda_c = 2*pi*sqrt(l_h * l_t) and Totz's critical buckling growth strain g_c = (h^2 / (12*(1 - nu^2))) * (2*pi / L)^2 meet sequentially at L = lambda_c, yielding g_c = (h^2 / (12*(1 - nu^2))) * sqrt(xi / (D * tau * eta))."},{"evidence":{"id":"q_bois2011_upstream_spacing_interface","kind":"question","question_kind":"unstated_model","source":"totz2024","text":"No equation-level ModelAtlas relation (same_as, reduces_to, derived_from, scales_as, approximated_by) or cited.yaml link connects bois2011 and totz2024: totz2024 does not cite bois2011 (none of Refs. 1-63 or S1-S6), and the two papers model physically distinct, sequentially decoupled stages of morphogenesis — upstream 1D overdamped active-fluid advection-diffusion-reaction patterning of a viscous cortex (bois2011) versus downstream static Föppl-von-Kármán (FvK) elastic plate buckling of a growing membrane/nascent cuticle clamped between pre-existing actin bundles (totz2024, which explicitly notes on p. 10 that the symmetry-breaking mechanism forming the actin scaffold is an open question not modeled here). Documenting the upstream-to-downstream interface highlights five structural and quantitative constraints required to couple them: (1) Interface variable and symbol overloading: in bois2011, L (in L/ell) is the macroscopic 1D cortical domain extent [0, L], whereas the inter-peak pattern spacing is an emergent wavelength lambda = 2*pi/k (or L_sys/n_peaks); in totz2024, L (actin_bundle_spacing) is a single inter-bundle period (1.60 um in V. cardui, 0.801/0.341 um in C. eurytheme, 0.910/0.360 um in A. vanillae) treated as a fixed, externally imposed clamped boundary condition (w = dw/dx = 0; constant during buckling, Fig. 3G). Other symbols are also overloaded across the two records: D is regulator diffusivity [m^2/s] in bois2011 vs plate bending modulus Y*h^3/(12*(1 - nu^2)) [N*m] in totz2024; h is unmodeled fluid film thickness in bois2011 vs elastic plate thickness 20 nm in totz2024; u and v are ln(c) and bulk flow velocity in bois2011 vs in-plane elastic displacements in totz2024. (2) Quadratic buckling sensitivity to upstream wavelength: identifying totz2024's fixed bundle spacing L with an upstream pattern wavelength lambda = 2*pi/k_pattern turns Eq. 4 (critical_growth_strain_eq4) into g_c = (pi^2 / (3*(1 - nu^2)))*(h/lambda)^2 = h^2*k_pattern^2 / (12*(1 - nu^2)). A ~2.3-2.5x reduction in upstream spacing (C. eurytheme L_1,A/L_2,A = 0.801/0.341 = 2.35; A. vanillae L_1,B/L_2,B = 0.910/0.360 = 2.53) raises g_c by 5.52-6.39x (0.274% -> 1.51% and 0.212% -> 1.35%), crossing above Table S1's growth-strain range g in [0, 0.7%] and suppressing ridge buckling. (3) Single-species coarsening vs multi-species turnover: in bois2011's conserved single-species model (single_species_dispersion_eq12, single_species_fastest_mode, single_species_pde_eq1_3), the fastest-growing continuum linear mode has finite wavelength lambda_lin = 2*pi*ell / sqrt(sqrt(Pe*c0*df/dc) - 1) (~5.13*ell at Pe = 25, c0 = 1), but Bois et al. (p. 3, Fig. 4) show that multipeaked steady states are nonlinearly unstable and coarsen to a single peak (n_peaks = 1). Generating a regular array of dozens of evenly spaced actin bundles across a wing scale therefore requires either kinetic arrest of coarsening or chemical turnover as in bois2011's 2-species ASDM (asdm_dispersion_eq15, asdm_stability_boundary, asdm_pde_eq14), which supports stable multi-peaked periodic patterns (Fig. 5d: 3 peaks on L_sys/ell = 20, lambda_ss = 6.67*ell; linear onset lambda_crit = 6.49*ell at Pe = 7, rho_a = 1, rho_s = 1.5; fastest linear mode lambda_lin = 5.19*ell at D_a/D_s = 0.5). (4) Hydrodynamic length-scale gap: bois2011 prints no dimensional parameters (bois2011/q_no_dimensional_params). At the C. elegans cortical scale motivating bois2011 (ell = sqrt(eta/gamma) ~ 10 um, Ref. 7), active-fluid spacings lambda ~ 5.1-6.7*ell (~51-67 um) are ~32-195x larger than butterfly scale bundle spacings (0.34-1.60 um). Matching totz2024's spacings with k*ell ~ O(1) (lambda/ell ~ 5.1-6.7) would require ell ~ 0.24-0.31 um (V. cardui), 0.12-0.18 um (ridged C. eurytheme / A. vanillae), and 0.05-0.07 um (flat surfaces) — i.e. 10^3-4x10^4x higher friction-to-viscosity ratio gamma/eta than C. elegans — or strongly reaction-dominated short-wavelength Turing selection (k*ell >> 1). (5) Missing biophysical bridge and bimodal spacing: bois2011's 1D isotropic periodic steady states produce evenly spaced symmetric extrema of uniform period (2*L_sys/N, p. 2) and cannot by themselves produce the alternating double-bundle spacing (L_1,B = 0.910 um, L_2,B = 0.360 um) on the same upper surface of A. vanillae scales (Fig. 4B); furthermore, no model in either paper bridges continuous scalar regulator concentration peaks to discrete cross-linked bundles of 20-200 F-actin filaments rigidly anchored to a growing elastic membrane.\n"},"text":"Across five butterfly species, Totz's measured bundle spacings (0.34–1.60 um) fall inside the exact physiological range spanned by Drosophila tracheal spacings in Hannezo (0.50–1.80 um), placing cortical active-gel wavelengths squarely at the membrane buckling scale."},{"evidence":{"id":"q_hannezo2015_no_cross_validation","kind":"question","question_kind":"unstated_model","source":"totz2024","text":"No cross-record validations are entered in validations.yaml for either totz2024 or hannezo2015 (0 entries in both directions): neither paper cites the other, and no model in either record genuinely predicts any measurement of the other on that measurement's own experimental conditions. (1) totz2024 models (34 models: 29 elastic-plate FvK/constitutive models and 5 data-processing helpers) vs hannezo2015 measurements (35 origin: measured entries): (a) All 10 measured actin-ring and taenidial-fold wavelengths (ring_wavelength_embryo_wt = 0.5 +/- 0.1 um, ring_wavelength_si_input = 5e-7 m, ring_wavelength_larva_wt_early = 1.2 +/- 0.1 um, ring_wavelength_larva_wt_fig1c = 1.2 um, ring_wavelength_src42 = 0.8 +/- 0.2 um, taenidial_wavelength_larva_wt_late = 1.45 +/- 0.3 um, taenidial_wavelength_moesin_rnai = 1.8 +/- 0.5 um, ring_wavelength_kkv1 = 4.5 +/- 2 um, fig3b_bar_ring_spacing_data, figs2d_moesin_rnai_spacing_data): totz2024 treats inter-bundle spacing L as a fixed external upstream input rather than predicting actin scaffold spacing (p. 10 explicitly leaves the upstream actin-patterning mechanism unmodeled). The only elastic models in totz2024 that output actin_bundle_spacing (rayleigh_ritz_width_eq3 and rayleigh_ritz_width_eq3_corrected) are algebraic inversions of Eq. 3 used to trace constant-amplitude isocontours in Fig. 4C and require 6 buckling inputs (growth_strain g, protoridge_amplitude a = w_0, transverse_pressure p, youngs_modulus Y, poisson_ratio nu, and plate_thickness h), 0/6 of which are measured or reported in hannezo2015 (hannezo2015's reported cortical_thickness_lit = 100 nm is apical actomyosin cortex thickness, not nascent cuticle membrane thickness h, and hannezo2015 measures no taenidial fold amplitude w_0, cuticle modulus Y, pressure p, or growth strain g). Meanwhile, totz2024's remaining [length] outputs are buckling height/amplitude profiles or scaling/processing helpers (buckled_profile_cosine*, rayleigh_ritz_amplitude_eq3*, zero_pressure_*_e44, fvk_1d_ode_solver_e42_e29, fvk_dimensional_scales_e30_e35, in_plane_displacement_scale_*, extract_species_spacings, scale_bundle_spacing, fit_cosine_amplitude) that do not predict tracheal actin-ring period. (b) Both measured ring counts per cell (rings_per_cell_embryo_wt = 15 to 20, rings_per_cell_kkv1 = ~1): totz2024 models a single clamped inter-bundle membrane strip of prescribed width L and contains no model predicting the number of actin rings per cell. (c) All 6 FRAP transport and kinetics measurements (turnover_time_frap = 15 +/- 7 s, diffusion_coeff_frap = 0.04 +/- 0.03 um^2/s, immobile_fraction_frap < 20%, frap_sample_size = 10, fig2a_frap_recovery_data, fig2a_frap_variance_data): totz2024 is a static thin-plate elasticity theory with zero [time]-, [length]^2-, or [length]^2/[time]-valued model outputs and no actin turnover, diffusion, or photobleaching model. (d) All 7 developmental actin-recruitment measurements (actin_increase_onset_text = 60%, actin_increase_onset_fig1a = 70%, fluorescence_onset_si = 114, fluorescence_plateau_si = 156, fig1a_actin_intensity_data, ring_onset_time_range = 10.2 to 21.2 min, ramp_duration_si = 1875 s): totz2024 models neither cortical actin fluorescence concentration nor temporal upregulation ramps. (e) All 7 tracheal tube-diameter, gamma-COP secretion, and constriction measurements (cop_het_diameter_change, cop_het_actin_change, cop_hom_diameter_change, cop_hom_actin_change, fig4f_cop_actin_vs_diameter_data, side_branch_diameter_ratio, fig3c_kkv_diameter_vs_actin_data): totz2024 models planar buckling of a flat membrane strip between parallel bundles rather than cylindrical epithelial tube diameter, apical secretion, or contractile pearling constrictions. (f) All 3 spectral and spacing-distribution measurements (fig1c_fourier_spectrum_data, fig3b_dist_wt_data, fig3b_dist_src42_data): all totz2024 models are deterministic single-ridge buckling equations and output no actin fluorescence Fourier spectra or ring-spacing probability histograms. (2) hannezo2015 models (52 models) vs totz2024 measurements (37 origin: measured and 24 origin: reported entries): zero valid on-conditions cross-validations exist as well. While hannezo2015/critical_wavelength_eq3 (lambda_c = 2*pi*(D*tau*eta/xi)^(1/4)) and critical_wavelength_from_lengths output periodic actin spacing, totz2024 measures 0/4 active-gel parameters (D, tau, eta, xi) for butterfly wing scales; substituting hannezo2015's Drosophila tracheal FRAP (D, tau) and mammalian/in-vitro literature viscosity and friction (Main p. 3 lambda_c = 1.749 um, printed 1.8 um, vs SI p. 21 inverted 0.553 um) against butterfly spacings (d_fig3G_L_mean, d_fig3G_L_median_iqr, d_fig4C_species_spacings spanning 0.341-1.601 um) would be an unconditioned cross-species exploratory comparison rather than a valid on-conditions validation (and fails structurally on A. vanillae's bimodal alternating upper-surface spacings and C. eurytheme's bundle-thickness-narrowed lower lamina). All remaining 34 totz2024 measured entries (20 protoridge height/amplitude datasets, 8 pupal timing/duration measurements, and 6 scale/profile-filtering counts) have no corresponding predictive model in hannezo2015. See hannezo2015/q_totz2024_no_cross_validation and q_hannezo2015_upstream_spacing_interface for full details.\n"},"text":"Direct cross-validation between the active-gel and buckling models remains an open experimental target: butterfly scale-cell cortical viscosity, friction, turnover, and diffusivity have not yet been measured, and bimodal alternating ridges in A. vanillae go beyond single-mode linear instability."}],"summary":"Totz et al. (2024) model early ridge formation in butterfly wing scales as membrane buckling clamped between pre-patterned cortical F-actin bundles of spacing L, whereas Bois et al. (2011) and Hannezo et al. (2015) derive periodic cortical bundle spacing from active-gel mechanics. Putting both halves together defines an exact sequential interface — and exposes the measurements still missing to close it.","teaches":"Bridging across biological scales","title":"From cortical actin patterning to butterfly wing-scale buckling"}],"counts":"7 papers · 4 sources of code and data · 7 tested links","families":[{"models":["bois2011/hydrodynamic_length","hannezo2015/hydrodynamic_length","hannezo2015/hydrodynamic_length_from_3d"],"sources":["bois2011","hannezo2015"]},{"models":["bois2011/single_species_dispersion_eq12","bois2011/single_species_dispersion_raw"],"sources":["bois2011"]},{"models":["bois2011/single_species_rda_dispersion_eq15","hannezo2015/dispersion_relation_eq7"],"sources":["bois2011","hannezo2015"]},{"models":["grason2007/columnar_free_energy_eq6","grason2007/columnar_free_energy_from_eq5"],"sources":["grason2007"]},{"models":["hannezo2015/critical_wavelength_eq3","hannezo2015/critical_wavelength_from_lengths"],"sources":["hannezo2015"]},{"models":["hannezo2015/dimensionless_turnover_phi","hannezo2015/dimensionless_turnover_phi_from_lengths"],"sources":["hannezo2015"]},{"models":["sekine2024/connector_arm_stretching_potential","sekine2024/harmonic_stretching_potential"],"sources":["sekine2024"]},{"models":["sekine2024/gaussian_structure_factor","sekine2024/gaussian_structure_factor_peak"],"sources":["sekine2024"]},{"models":["sekine2024/persistence_length_bending","sekine2024/persistence_length_from_temperature"],"sources":["sekine2024"]},{"models":["totz2024/buckled_profile_cosine","totz2024/zero_pressure_profile_e44"],"sources":["totz2024"]}],"full":{"edges":[{"a":"sekine2024","agree":82,"b":"sekine_source_data","differ":0,"kind":"cited","unjudged":0},{"a":"bois2011","b":"hannezo2015","kind":"cross_check","verdicts":{"no verdict":3}},{"a":"bois2011","b":"bois2011/asdm_dispersion_eq15","kind":"member"},{"a":"bois2011","b":"bois2011/asdm_dispersion_pe0","kind":"member"},{"a":"bois2011","b":"bois2011/asdm_homogeneous_steady_state","kind":"member"},{"a":"bois2011","b":"bois2011/asdm_pde_eq14","kind":"member"},{"a":"bois2011","b":"bois2011/asdm_pde_profile_eq14","kind":"member"},{"a":"bois2011","b":"bois2011/asdm_stability_boundary","kind":"member"},{"a":"bois2011","b":"bois2011/characteristic_velocity","kind":"member"},{"a":"bois2011","b":"bois2011/diffusive_timescale","kind":"member"},{"a":"bois2011","b":"bois2011/discrete_wavenumber","kind":"member"},{"a":"bois2011","b":"bois2011/hydrodynamic_length","kind":"member"},{"a":"bois2011","b":"bois2011/peclet_number_physical","kind":"member"},{"a":"bois2011","b":"bois2011/peclet_number_timescale","kind":"member"},{"a":"bois2011","b":"bois2011/single_species_dispersion_eq12","kind":"member"},{"a":"bois2011","b":"bois2011/single_species_dispersion_hill","kind":"member"},{"a":"bois2011","b":"bois2011/single_species_dispersion_raw","kind":"member"},{"a":"bois2011","b" omputed with a model the reader built, not the paper's own analysis.","validation":"A model's prediction against measurements.","validation, corrected":"A model's prediction against measurements, computed with a corrected variant of a misprinted model: what the stated correction explains.","validation, corrected, prefactor unknown":"A model's prediction against measurements, computed with a corrected variant of a misprinted model: what the stated correction explains, through a scaling law printed without its prefactor: judged on its shape only.","validation, corrected, reader's model":"A model's prediction against measurements, computed with a corrected variant of a misprinted model: what the stated correction explains, computed with a model the reader built, not the paper's own analysis.","validation, prefactor unknown":"A model's prediction against measurements, through a scaling law printed without its prefactor: judged on its shape only.","validation, reader's model":"A model's prediction against measurements, computed with a model the reader built, not the paper's own analysis."},"sources":[{"authors":["Gregory M. Grason","Robijn F. Bruinsma"],"by_purpose":{"reproduction, prefactor unknown":{"close":0,"error":0,"no verdict":3,"not reproduced":0,"reproduced":0},"validation":{"close":0,"error":0,"no verdict":0,"not reproduced":1,"reproduced":0},"validation, prefactor unknown":{"close":0,"error":0,"no verdict":1,"not reproduced":0,"reproduced":0}},"checked":{"close":0,"no verdict":4,"not reproduced":1,"reproduced":0},"counts":{"added":14,"comparisons":5,"data":8,"models":35,"questions":14,"references":26,"runs":40},"id":"grason2007","kind":"article","label":"Grason & Bruinsma 2007","models":[{"id":"bulk_condensation_chemical_potential","name":"bulk condensation chemical potential mu_c","relations":[],"role":"processing","variant_of":null},{"id":"bundle_diameter_from_radius","name":"bundle diameter from radius (Fig. 1)","relations":[{"kind":"scales_as","other":"cla
