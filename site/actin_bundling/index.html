ot reproduced":0,"reproduced":1},"reproduction":{"close":0,"error":0,"no verdict":0,"not reproduced":0,"reproduced":4}},"checked":{"close":0,"no verdict":0,"not reproduced":0,"reproduced":5},"counts":{"added":3,"comparisons":5,"data":18,"models":6,"questions":10,"references":1,"runs":22},"id":"sekine_code","kind":"software","label":"Sami, code 2024","models":[{"id":"area_px_to_um2","name":"convert MATLAB pixel area threshold to physical area in um^2 (Nanocluster_motion.m lines 39-40)","relations":[],"role":"processing","variant_of":null},{"id":"area_um2_to_px_bounds","name":"convert README physical area range [0.01, 0.1] um^2 to integer pixel bounds [6, 53] (Nanocluster_motion.m lines 39-40)","relations":[],"role":"processing","variant_of":null},{"id":"circularity_definition","name":"cluster shape circularity 4*pi*A/P^2 (README.md line 5; absent from Nanocluster_motion.m)","relations":[],"role":"processing","variant_of":null},{"id":"implied_pixel_size_bounds","name":"tight pixel-size interval implied by [6, 53] px matching [0.01, 0.1] um^2 (Nanocluster_motion.m line 40 & README.md line 5)","relations":[],"role":"processing","variant_of":null},{"id":"nanocluster_motion_matlab","name":"Python port of Nanocluster_motion.m nanocluster filtering and overlap tracking (lines 28-250)","relations":[],"role":"processing","variant_of":null},{"id":"nanocluster_motion_methods_spec","name":"documented README.md / Methods p. 10 nanocluster tracking specification (with circularity, 0.5-2x area ratio, exact overlap, no border clearing)","relations":[],"role":"processing","variant_of":null}],"of":[],"questions":[{"id":"q_missing_circularity_filter","kind":"possible_error","text":"Both README.md (line 5) and sekine2024 Methods p. 10 ('Motion anisotropy') state that 'an actin cluster within the size range 0.01 to 0.1 um^2 and circularity 0.5 - 1.0 was selected at tn'. However, Nanocluster_motion.m never computes perimeter or circularity (no regionprops 'Circularity' or 'Perimeter' call anywhere in lines 1-260) and never filters by shape. Because ALL_Result exports only 6 columns (x1, y1, A1, x2, y2, A2; lines 161-170, 199-207, 222-230), circularity filtering cannot even be performed downstream in R from the MATLAB output. Either circularity pre-filtering was applied externally in ImageJ/Fiji before running MATLAB (undisclosed in both README.md and Methods p. 10, and partially redundant with bwareafilt([6 53])), or no circularity filter was actually applied. Our Python port confirms an elongated 1x20 px rod (A = 20 px = 0.0374 um^2, C = 0.143 << 0.5) is tracked by Nanocluster_motion.m (matched=1) but rejected by the documented Methods/README specification (matched=0).\n"},{"id":"q_missing_area_ratio_and_largest_tiebreak","kind":"unexplained_difference","text":"Both README.md (line 6) and sekine2024 Methods p. 10 state that in frame t_{n+1} 'an actin cluster with a similar size (between 0.5 to 2 fold of the size at tn) and similar position (at least overlapped 1 pixel with the cluster at tn)' is matched. In Nanocluster_motion.m: (1) Line 44 sets Large_Obj_Image_2 = bwareafilt(BW_Image_2, [1 Inf]); %no limitation, contradicting the comment on line 39 ('Remove very small objects from image_1 and image_2 (6 to 53 pixels)') and performing no 0.5-2 fold area-ratio check (run_matlab_area_ratio_raw accepts a 16->64 px, ratio 4.0 fusion). (2) Even if downstream Excel/R code filters exported columns 3 and 6 by 0.5 <= A2/A1 <= 2, lines 101-145 introduce an undisclosed tie-breaker when a t_n cluster has >= 2 8-connected intersection components with Cumm_Img: it selects the LARGEST overlapping object in t_{n+1} (maxArea, tie-breaking equal areas by column-major label order via break on line 138; comment notes 'before was nearest one'). When a 16-px cluster overlaps both a valid 16-px match (ratio 1.0) and a 64-px cable (ratio 4.0), Nanocluster_motion.m outputs the 64-px cable and discards the valid match, so downstream 0.5-2x filtering loses the cluster entirely (matched=0 vs spec matched=1).\n"},{"id":"q_missing_displacement_and_anisotropy_code","kind":"unstated_model","text":"README.md line 8 states 'By comparing the coordinates of the center of masses between tn and tn+1, the displacement Δx and Δy were calculated', and sekine2024 Methods p. 10 adds that 'the average ratio of absolute values (|Δy|/|Δx|) was calculated by R'. Nanocluster_motion.m performs none of these steps: it exports only raw 1-based pixel coordinates and pixel areas (x1, y1, A1, x2, y2, A2) via xlswrite (line 257), with (0, 0, 0) sentinel entries in columns 4-6 for unmatched clusters (lines 217-230). It contains no pixel-to-micron scale factor, no frame interval (0.32 s), no zero-sentinel exclusion, no Δx/Δy subtraction, and no |Δy|/|Δx| ratio; the downstream R script is not released.\n"},{"id":"q_unstated_pixel_size_and_sim_grid_mismatch","kind":"unstated_input","text":"Nanocluster_motion.m hardcodes [6 53] pixels (line 40) without stating any pixel size, whereas README.md (line 5) and sekine2024 Methods p. 10 state 0.01 to 0.1 um^2. Requiring [6, 53] to be the exact integer pixel counts inside [0.01, 0.1] um^2 tightly constrains the square pixel size to (0.043033, 0.043437] um (midpoint 0.043235 um), uniquely matching sekine2024's experimental Airyscan pixel size 0.04325 um (Methods p. 11, datum sekine2024/sim_pixel_size_printed: 0.01/0.04325^2 = 5.346 -> ceil 6 px = 0.01122 um^2; 0.1/0.04325^2 = 53.460 -> floor 53 px = 0.09914 um^2). Both alternatives shift N_max away from 53: exact simulation box pitch 3/69 = 0.043478 um gives floor(52.90) = 52 px (53 px = 0.10019 um^2 > 0.1), and Supp. Fig. 6a's 43 nm = 0.043 um gives floor(54.08) = 54 px. Because 5 px = 0.00935 um^2 < 0.01, the integer cutoff 6 px sets the actual minimum area 12.2% above 0.01 um^2 (0.01122 um^2).\n"},{"id":"q_hidden_imclearborder_filter","kind":"choice","text":"Nanocluster_motion.m calls imclearborder on BOTH Large_Obj_Image_1 (line 41) and Large_Obj_Image_2 (line 45), removing every 8-connected object touching any edge of the ROI in either frame. Neither README.md nor sekine2024 Methods p. 10 mentions border clearing. In the 50 x 50 px live-imaging ROIs (2.16 x 2.16 um), clusters touching the border in t_n are dropped entirely and interior t_n clusters that step onto the border in t_{n+1} are converted into unmatched (0, 0, 0) rows (verified in run_matlab_border_clear: matched=0 vs spec matched=2).\n"},{"id":"q_hidden_im2bw_threshold_and_connectivity","kind":"unstated_input","text":"Lines 35-36 call deprecated MATLAB im2bw(Image_1) and im2bw(Image_2) with no second (level) argument, applying MATLAB's implicit default normalized luminance threshold level = 0.5 (127.5 for uint8, 32767.5 for uint16). By contrast, sekine2024 Methods p. 10 ('Cluster analysis') describes ImageJ rolling-ball background subtraction (r = 50 px), Auto Local Threshold with Otsu (r = 5 px), and Despeckle. This implies either undisclosed upstream binarization in Fiji/ImageJ before MATLAB (making im2bw an identity map on {0, 255} TIFFs) or fixed global 0.5 thresholding that erases dim grayscale clusters below 128/255 (run_matlab_grayscale_im2bw: matched=0 vs Otsu spec matched=2; alternative binarize_level=0.25 recovers matched=2). Additionally, lines 55, 81, 83, 99, and 131 hardcode 8-connectivity ('%must use 8-connectivity'), a choice undisclosed in README.md and Methods p. 10.\n"},{"id":"q_hardcoded_frame_count_ignores_filelist","kind":"possible_error","text":"Line 8 hardcodes Numb_of_Images = 100 and line 28 loops for Count = 1:Numb_of_Images-1 (99 frame pairs), completely ignoring num_frames = (numel(filelist)) computed from the selected directory on line 25. If a folder contains fewer than 100 .tif files, line 32 throws a cell-index error; if it contains 200 frames (the sub-second live-imaging length stated on sekine2024 Methods p. 10, vs 100 frames for PIV and 50 frames in Supp. Movie 1), frames 101-200 are silently skipped. Neither Methods p. 10 nor README.md states how many frames were analyzed for Motion anisotropy in vivo or in the CGMD simulation (Fig. 4d), nor is the live-imaging frame interval (0.32 s) referenced anywhere in Nanocluster_motion.m.\n"},{"id":"q_stage1_centroid_miss_bug","kind":"possible_error","text":"In Stage 1 (lines 61-67), each 8-connected intersection component Cell_Obj of Large_Obj_Image_1 .* Large_Obj_Image_2 is mapped back to its full t_{n+1} object via bwselect(Large_Obj_Image_2, Cell_x_cordinate, Cell_y_cordinate) using the raw geometric centroid WITHOUT the imfill('holes') + bwmorph('shrink', Inf) safeguard later added in Stage 2 (lines 110-111, 181-182). For any non-convex intersection (C-shape, ring) or even a simple 2-pixel anti-diagonal 8-connected overlap {(r, c+1), (r+1, c)} whose centroid (c+0.5, r+0.5) rounds via MATLAB round() to (c+1, r+1), the seed pixel can fall on a 0 (background) pixel of Large_Obj_Image_2. bwselect then returns an all-zero mask, omitting the overlapping cluster from Cummulative_image and producing a false unmatched (0, 0, 0) row despite >= 1 pixel overlap (verified in run_matlab_antidiag_bug: matched=0 vs spec matched=1).\n"},{"id":"q_stage2_hole_shrink_and_silent_try_catch_abort","kind":"possible_error","text":"Stage 2 wraps the entire per-cluster loop in a bare try ... catch end block (lines 88 and 241-242) and applies imfill(..., 'holes') followed by bwmorph(..., 'shrink', Inf) to each intersection component before calling bwselect(Cumm_Img, x, y) (lines 110-119, 181-191). If a t_n cluster overlaps a holed t_{n+1} object in a closed ring (e.g. a 3x3 ring missing its center pixel in Cumm_Img), imfill fills the interior hole and bwmorph('shrink', Inf) collapses the filled region right onto that center pixel, which is 0 in Cumm_Img. bwselect returns an all-zero mask, regionprops(Full_Obj, 'centroid') returns an empty 0x1 struct, and Full_Obj_Cord.Centroid(1) throws an error that the bare catch silently swallows—aborting the entire remainder of the frame's cluster loop and dropping all subsequent unrelated clusters (verified in run_matlab_ring_hole_abort: 3 of 4 clusters dropped, including healthy Cluster 4). Additionally, ref_Coordinate_List = [] is only initialized at the end of the frame loop (line 247), so if frame Count = 1 has 0 objects or throws on cluster 1, line 243 crashes with an undefined variable error. (Other minor code issues: unused ManyDistance_List on line 86, unused sheet = 1 on line 256, hardcoded cd '/Users/XXXXX/' on line 6, and deprecated im2bw / xlswrite in MATLAB 2022a.)\n"},{"id":"q_circularity_perimeter_convention_and_axis_orientation","kind":"reading","text":"Neither README.md nor sekine2024 Methods p. 10 states the discrete perimeter formula used for 'circularity 0.5 - 1.0'. On small 6-53 pixel binary clusters, ImageJ outer pixel-edge perimeter gives C <= 1.0 (e.g., 4x4 square P=16 -> C=0.785; 3x2 rect P=10 -> C=0.754; 1x6 rod P=14 -> C=0.385), whereas MATLAB regionprops('Perimeter') measures pixel-center paths (4x4 square P=12 -> naive 4*pi*A/P^2 = 1.396 > 1.0; MATLAB R2019a+ regionprops('Circularity') uses a small-region adjustment 4*pi*A/(P+pi)^2 = 0.877). Also unstated in sekine_code is the upstream image rotation aligning the tracheal longitudinal axis with MATLAB Centroid(1) (x) and the circumferential axis with Centroid(2) (y) (as stated in sekine2024 Fig. 5a caption).\n"}],"takes_from":[],"tally":{"close":0,"error":0,"no verdict":0,"not reproduced":0,"reproduced":4},"title":"Nanocluster_motion: MATLAB code for actin nanocluster motility analysis (Sekine et al., 2024)","variants":[],"venue":null,"verdicts":[{"comparison":"cmp_circularity_ideal_6px","computed":"1","page":null,"printed":"1.0","purpose":"consistency","verdict":"reproduced"},{"comparison":"cmp_area_max_px","computed":"53","page":null,"printed":"53","purpose":"reproduction","verdict":"reproduced"},{"comparison":"cmp_area_max_um2","computed":"0.09914","page":null,"printed":"0.1","purpose":"reproduction","verdict":"reproduced"},{"comparison":"cmp_area_min_px","computed":"6","page":null,"printed":"6","purpose":"reproduction","verdict":"reproduced"},{"comparison":"cmp_area_min_um2","computed":"0.01122","page":null,"printed":"0.01","purpose":"reproduction","verdict":"reproduced"}],"year":2024},{"authors":["Sayaka Sekine","Mitsusuke Tarama","Housei Wada","Mustafa M. Sami","Tatsuo Shibata","Shigeo Hayashi"],"by_purpose":{},"checked":{"close":0,"no verdict":0,"not reproduced":0,"reproduced":0},"counts":{"added":0,"comparisons":0,"data":2,"models":0,"questions":5,"references":3,"runs":0},"id":"sekine_mist_complexes","kind":"dataset","label":"Sekine et al., data 2024a","models":[],"of":[],"questions":[{"id":"q_sheet_name_and_crossref_mismatch","kind":"possible_error","text":"The sole worksheet tab is named 'SupplemetaryData1' (misspelling 'Supplementary' and numbering it '1'), whereas cell A2 titles the sheet 'SupplementaryData2. List of protein complexes identified in the protein network constructed by MIST ', the journal supplement file is MOESM5_ESM.xlsx, and sekine2024 (PDF pp. 3 and 37) identifies it as Supplementary Data 2. Separately, sekine2024 Methods ('Molecular interaction network', PDF p. 11) erroneously states that the MIST molecular complexes are listed in 'Supplementary Table 4' (which actually tabulates CGMD structure-factor Gaussian fit parameters; see also sekine2024/q_indexing_and_table_crossref_typos). Minor spreadsheet formatting artifacts also occur: column C header reads 'Entrez GeneID ID' (duplicated 'ID') and every Complex ID in A4:A662 has a trailing space.\n"},{"id":"q_fig3c_myofibril_group_vs_fc1047","kind":"unexplained_difference","text":"In sekine2024 Fig. 3c (PDF p. 5), the 'Myofibril assembly' functional group contains four genes: Zasp52, Actn, WupA, and Chd64, and main text p. 3 highlights the 'myofibril assembly complex (FC1047)' in Supplementary Data 2 for including alpha-actinin (Actn). In Supplementary Data 2, FC1047 ('myofibril assembly', 27 genes, rows A6:D32) includes Actn (row 26) and wupA (row 23) together with 13 other sarcomeric/contractile genes and 12 metabolic/mitochondrial genes, but neither Zasp52 nor Chd64 appears in FC1047 or anywhere else in the workbook. More broadly, only 5 of the 10 RNAi screen-positive MIST input genes (CG3630, tsr, dia, DAAM, wupA) appear in Supplementary Data 2, while Zasp52, Chd64, ssh, cora, and form3 are absent; similarly, 3 of the 9 hub genes in Supplementary Fig. 4 (Sema1a, LIMK1, Tango2) and experimentally tested non-muscle myosin II heavy chain (zip) and RhoGEF2 are absent from Supplementary Data 2.\n"},{"id":"q_protein_folding_unreported_and_ambiguous","kind":"reading","text":"The Prominent Complex Name summary table (G3:H5) highlights 'protein folding' (H5 = 30) alongside 'myofibril assembly' (H4 = 27), making 'protein folding' (FC1280, rows A78:D107, which includes cytoskeletal genes Fim, chic, flr, Moe, and Eb1) the largest complex in Supplementary Data 2; however, sekine2024 never mentions 'protein folding' (FC1280) or the counts 27 and 30 in the article or Supplementary Information. In addition, G4:G5 omit Complex IDs, creating an ambiguity because two distinct COMPLEAT complexes in the main table share the name 'protein folding': FC1280 (rows A78:D107, 30 genes) and FC2520 (rows A398:D399, 2 genes: Stip1, Hsp83). Their union contains 31 unique genes (Stip1 overlaps; Hsp83 is only in FC2520), so H5 = 30 counts FC1280 alone.\n"},{"id":"q_unstated_enrichment_statistics_and_cutoffs","kind":"unstated_input","text":"Neither Supplementary Data 2 nor sekine2024 reports MIST/COMPLEAT enrichment P-values, enrichment scores, full COMPLEAT complex sizes, total expanded network gene count, the minimum-overlap cutoff used to list the 213 complexes (minimum observed size is 2 genes: 103 complexes of size 2 and 74 of size 3), or the criterion used to single out 'myofibril assembly' (27 genes) and 'protein folding' (30 genes) as 'Prominent Complex Name' ahead of the next-largest complexes (FC959 Planar Cell Polarity pathway and FC2099 Imd pathway, 10 genes each).\n"},{"id":"q_rnai_screen_to_mist_network_bridge","kind":"reading","text":"Both sekine_mist_complexes (Supplementary Data 2) and sekine_rnai_screen (Supplementary Data 1) are pure dataset records (zero mathematical models and zero from_source links between them), so no ModelAtlas relations.yaml entry applies and no cited.yaml numeric value is copied between sekine_rnai_screen's pupa counts and sekine_mist_complexes's two prominent complex gene counts (27 and 30). Instead, the two datasets are bridged by gene-level workflow in sekine2024: 10 larval-lethal RNAi screen positives from sekine_rnai_screen (confirmed in sekine2024 Supp. Table 2) served as MIST ver. 5.0 query inputs to build the 169-gene, 213-complex table in sekine_mist_complexes. Exactly 5 of the 10 screen positives appear in sekine_mist_complexes -- wupA (pupae_wupA_bdsc31893, 0/0/0/0) in FC1047 ('myofibril assembly', row 23) and FC523 ('troponin complex', row 561); tsr (pupae_tsr_bdsc65055, 0/0/0/0) in FC148 ('Cofilin-actin-CAP1 complex', row 156), FC2472 ('glycolysis', row 390), and FC739 (row 609); CG3630 (pupae_CG3630_bdsc65945, 0/0/0/0) in FC538 (row 565); DAAM (pupae_DAAM_bdsc39058, 0/0/0/n.d.) in FC959 ('Planar Cell Polarity pathway', row 661); and dia (pupae_dia_bdsc33424, 0/0/0/n.d.) in FC1321 ('EB1-APC-mDia2 complex', row 127) -- whereas the other 5 screen positives (Zasp52, Chd64, ssh, cora, form3) are absent from Supplementary Data 2. Crucially, alpha-Actinin (Actn), missed as a viable false negative in sekine_rnai_screen (pupae_Actn_bdsc34874, BDSC#34874, 0/22/95/124 pupae on days 5-8), is rescued via prominent complex FC1047 ('myofibril assembly', 27 genes, row 26; also in FC2791 row 462 and FC2835 row 471), where it co-occurs with screen-positive wupA (row 23) plus viable 1st-screen genes Tm2 (row 25) and Mhc (row 27), motivating its validation in the actn[14] null mutant (sekine2024/t2_actn14_orient, 42.5 deg median orientation). Across all 119 unique genes tested in sekine_rnai_screen and 169 unique genes in sekine_mist_complexes, 16 genes overlap in total: the 5 screen positives above, 1 other larval-lethal gene (chic in FC1280), 2 pupal-lethal genes (capt in FC148; Moe in FC1280/FC191, also with a viable stock), and 8 viable genes (Actn, AnxB10, Fim, Lasp, Mhc, Tm2, flr, mwh), including 5 overlapping genes (flr, AnxB10, Moe, chic, Fim) in the unreported largest complex FC1280 ('protein folding', 30 genes).\n"}],"takes_from":[],"tally":{"close":0,"error":0,"no verdict":0,"not reproduced":0,"reproduced":0},"title":"Supplementary Data 2: List of protein complexes identified in the protein network constructed by MIST","variants":[],"venue":"Nature Communications 15, 464 (Supplementary Data 2, MOESM5_ESM.xlsx)","verdicts":[],"year":2024},{"authors":["Sayaka Sekine","Mitsusuke Tarama","Housei Wada","Mustafa M. Sami","Tatsuo Shibata","Shigeo Hayashi"],"by_purpose":{},"checked":{"close":0,"no verdict":0,"not reproduced":0,"reproduced":0},"counts":{"added":0,"comparisons":0,"data":156,"models":0,"questions":6,"references":1,"runs":0},"id":"sekine_rnai_screen","kind":"dataset","label":"Sekine et al., data 2024b","models":[],"of":[],"questions":[{"id":"q_selection_threshold_mismatch","kind":"unexplained_difference","text":"sekine2024 Methods (p. 11) states that \"If the number of pupae was less than 70 on day 8, the RNAi line was judged as 'pupation defective', and used in the second screen (Supplementary Table 2)\", and cell B3 of Supplementary Data 1 similarly flags \"< 70 at day 8\" in red. However, the actual 22 RNAi lines carried into sekine2024 Supplementary Table 2 do not match the day 8 < 70 criterion: (a) 3 lines with numeric day 8 < 70 colored red in Supplementary Data 1 were excluded from Supplementary Table 2 without explanation: nullo (BDSC#41905, Larva (semi), day 8 = 34), pod1 (BDSC#41705, Larva (semi), day 8 = 31), and sn (BDSC#42615, viable/blank, day 8 = 66); (b) 6 lines with day 7-8 pupa counts >= 81 were included in Supplementary Table 2, including 2 of the 10 screen positives: Chd64 (BDSC#62377, day 8 = 99, \"Gentotyped after hatch\", screen positive), form3 (BDSC#32398, day 8 = 81, \"Genotyped after hatch\", screen positive), Keap1 (BDSC#40932, day 8 = 86, \"Genotyped after hatch\"), WASp (BDSC#51802, day 8 = 101, \"Genotyped after hatch\"), zip (BDSC#38259, day 7 = 118, day 8 = n.d., \"Genotyped after hatch, R189\"), and alpha-Cat (BDSC#33430, day 7 = 112, day 8 = n.d., no note) — the \"Genotyped after hatch\" notes suggest balanced stocks whose non-RNAi siblings pupated; and (c) DAAM (BDSC#39058) and dia (BDSC#33424) have day 8 = \"n.d.\" (with day 7 = 0). Instead of day 8 < 70, the 22 lines in Supplementary Table 2 correspond exactly to all 21 \"Larva\" lines plus 1 of the 4 \"Larva (semi)\" lines (cpb, BDSC#50954).\n"},{"id":"q_red_highlighting_inconsistency","kind":"possible_error","text":"Cell B3 defines red coloring as \"smaller than 70 at day 8\", yet shot (row 109, BDSC#64041, Larva) has day 8 = 39 (< 70) with normal black font and no cell fill (style 2). Conversely, DAAM (row 49) and dia (row 51) have day 8 = \"n.d.\" and instead have pink fill on day 7 = 0 (cells F49 and F51, style 6). Among the 16 red-colored day-8 cells, two undocumented styles are used: 12 lines with day 8 <= 21 have red font plus pink fill (style 4), whereas 4 lines with day 8 in 31-69 (cora=69, nullo=34, pod1=31, sn=66) have red font without fill (style 5).\n"},{"id":"q_nonmonotonic_pupae_counts","kind":"possible_error","text":"Cumulative pupa counts scored on days 5-8 after crossing at 25 degC should be non-decreasing (prior to adult eclosion at days 9-10), but three RNAi rows decrease between consecutive days: zip (row 136, BDSC#38259, Larva) drops from 31 on day 5 to 11 on day 6 before rising to 118 on day 7 (likely a transcription or counting error); bif (row 19, BDSC#28372, viable) drops from 98 on day 7 to 96 on day 8; and GMF (row 69, BDSC#51452, viable) drops from 93 on day 7 to 88 on day 8.\n"},{"id":"q_ambiguous_stock_ids_and_controls","kind":"unstated_input","text":"sekine2024 Supplementary Table 2 and Supplementary Table 6 do not list BDSC stock IDs for the 22 RNAi lines imaged in the 2nd screen. For 6 genes tested with 2 RNAi lines in Supplementary Data 1 (cpb, jub, WASp, Keap1, dia, alpha-Cat), only one stock is Larva/Larva (semi) lethal, identifying the stock tested; however, zip has two larval-lethal lines in Supplementary Data 1: BDSC#36727 (row 135, Larva (semi), days 5-7 = 0/6/27, day 8 = n.d.) and BDSC#38259 (row 136, Larva, days 5-7 = 31/11/118, day 8 = n.d., \"Genotyped after hatch, R189\"), while Supplementary Table 2 reports only a single zip row (\"LL\") without specifying the BDSC stock (presumably BDSC#38259) or why BDSC#36727 was omitted. In addition, the note \"R189\" in cell H136 is unexplained, and BDSC stock IDs are omitted on 5 of the 7 control rows (A150:A154 are blank; only A148=36303 for attP2 and A149=36304 for attP40 are populated).\n"},{"id":"q_actn_false_negative_and_pupal_lethals","kind":"reading","text":"Using larval lethality in the 1st RNAi screen as a primary filter missed alpha-Actinin (Actn, row 7, BDSC#34874), which was completely viable with normal pupation (0, 22, 95, 124 pupae on days 5-8) yet proved to be a core actin-cable crosslinker when subsequently discovered via the MIST protein network (Supplementary Data 2, sekine_mist_complexes, FC1047 'myofibril assembly', 27 genes, row 26) and tested as the actn[14] null mutant (42.5 deg median orientation, the strongest orientation defect in sekine2024 Supplementary Table 2). Similarly, 21 RNAi lines caused pupal lethality (3 Early pupa, 12 Pupa, 6 Pupa (semi), including four Arp2/3 subunits Arpc1, Arpc3A, Arpc3B, Arpc4 and second lines of dia, WASp, and alpha-Cat) with day 7-8 pupae >= 72 and were not evaluated for embryonic stage-16 actin cables. Maternal deposition or variable RNAi knockdown efficiency in embryonic trachea thus creates known false negatives in this 1st-screen table.\n"},{"id":"q_encoding_and_naming_inconsistencies","kind":"reading","text":"Several text-encoding and naming inconsistencies occur in Supplementary Data 1: (1) cell B116 (BDSC#65164) stores \"Sry-alpha\" as Shift-JIS half-width katakana mojibake (\"Sry-\\uff8e\\uff71\"); (2) two duplicate-line gene names vary in capitalization (\"Strn-Mlck\" row 118 vs \"strn-Mlck\" row 119; \"Svil\" row 120 vs \"svil\" row 121), so case-sensitive deduplication gives 121 names whereas case-insensitive deduplication matches sekine2024's reported 119 genes (p. 3); (3) three gene symbols differ from sekine2024 Supplementary Table 2 (\"Chd64\" vs \"Chd-64\", \"alpha-Spec\" vs \"aSpec\", \"alpha-Cat\" vs \"aCat\"); and (4) minor typos appear in cell H38 (\"Gentotyped after hatch\" for Chd64) and header E5 (\"day6\" without a space).\n"}],"takes_from":[],"tally":{"close":0,"error":0,"no verdict":0,"not reproduced":0,"reproduced":0},"title":"Supplementary Data 1: List of RNAi strains for the 1st screen (crossed with btl-Gal4)","variants":[],"venue":"Nature Communications 15, 464 (Supplementary Data 1, MOESM4_ESM.xlsx)","verdicts":[],"year":2024},{"authors":["Sayaka Sekine","Mitsusuke Tarama","Housei Wada","Mustafa M. Sami","Tatsuo Shibata","Shigeo Hayashi"],"by_purpose":{"consistency":{"close":1,"error":0,"no verdict":0,"not reproduced":4,"reproduced":17},"reproduction":{"close":9,"error":0,"no verdict":0,"not reproduced":22,"reproduced":58}},"checked":{"close":10,"no verdict":0,"not reproduced":26,"reproduced":75},"counts":{"added":0,"comparisons":111,"data":135,"models":12,"questions":10,"references":1,"runs":55},"id":"sekine_source_data","kind":"software","label":"Sekine et al., code 2024","models":[{"id":"cable_interval_reader","name":"Early stage 16 periodic circumferential actin cable interval summary (Supp. Fig. 1d)","relations":[],"role":"processing","variant_of":null},{"id":"cluster_morphometr duplicated Fig. 1k tube length, and actin skeleton length time course (Fig. 1j-k, Supp. Fig. 1g)","relations":[],"role":"processing","variant_of":null}],"of":["sekine2024"],"questions":[{"id":"q_fig1k_duplicated_from_fig1j","kind":"possible_error","text":"Source-data_Fig1k.xlsx (sheet 'Figure 1k', titled 'Tube length') contains an exact cell-for-cell duplicate of all 36 tube-diameter measurements from Source-data_Fig1j.xlsx ('Tube Diameter', ranging from 2.22 to 4.65 um with means 2.60-3.94 um; max absolute difference across all 36 cells is 0.0 um in run_tube_skel_m80). In sekine2024 Fig. 1k (PDF p. 2), 'Tube length (um)' actually rises from ~17 um at -80 min to ~24 um at +20 min. The true Fig. 1k tube-length source data are completely missing from MOESM11_ESM.zip.\n"},{"id":"q_fig5a_fig5d_dataset_and_scale_mismatch","kind":"possible_error","text":"The raw nanocluster-tracking spreadsheets Source-data_Fig5a.xlsx (all 5 Stage 15 timepoints) and Source-data_Fig5d.xlsx (Control and Zasp52 RNAi) do NOT match Supplementary Table 5 (and Source-data_Fig4e.xlsx / Fig. 5a,d printed ratios): all 7 conditions use pixel scale 0.0329 um/px in their Excel formulas and contain 19-68% more tracked events than printed in Table 5: Fig. 5a -40 min n=485 vs 314 (ratio 1.03 vs 1.08), -30 min n=444 vs 372 (1.43 vs 1.36), -20 min n=560 vs 333 (1.38 vs 1.31), -10 min n=529 vs 317 (1.39 vs 1.39), 0 min n=471 vs 322 (1.75 vs 1.72); Fig. 5d Control n=497 vs 352 (|dx|=38.7 vs 49.3 nm, |dy|=67.1 vs 78.8 nm, ratio 1.735 vs printed 1.60), and Zasp52 RNAi n=1335 vs 977 (|dx|=61.5 vs 82.3 nm, |dy|=61.9 vs 80.4 nm, ratio 1.007 vs 0.98). By contrast, in the very same Source-data_Fig5d.xlsx file, DAAM RNAi (0.0426 um/px, n=463; |dy|=58.485 vs printed 58.4 nm) and Myosin II[DN] (0.0424 um/px, n=955; exact match on all 5 metrics) match Table 5's sample sizes and statistics. Thus 7 of 9 experimental motion-anisotropy conditions in the released Source Data come from a different tracking export/calibration than Supplementary Table 5 and Fig. 5a,d.\n"},{"id":"q_fig4d_pixel_scale_0424_vs_0426","kind":"possible_error","text":"Source-data_Fig4d.xlsx computes dx and dy via Excel formulas '(F8-C8)*0.0424' (0.0424 um/px) for all three simulation conditions (1-M n=1461, 2-M n=1134, 4-M n=152), yielding 18/18 mismatches (~0.47% smaller) against Supplementary Table 5 / Source-data_Fig4e.xlsx (e.g. 1-M |dx|=18.11 vs 18.2 nm, 2-M |dx|=19.27 vs 19.4 nm, 4-M |dy|=26.50 vs 26.6 nm). Recomputing from the exact same pixel coordinates in Source-data_Fig4d.xlsx with pixel scale 0.0426 um/px (run_fig4d_*_scale0426) matches 18/18 Table 5 means and SDs to the last printed digit. Neither 0.0424 nor 0.0426 um/px equals Methods p. 11's stated simulation pixel size 0.04325 um (or 3/69 = 0.04348 um). Scale-invariant metrics (anisotropy ratios 0.97, 1.13, 1.45 and Welch P-values 0.511, 0.0485, 0.00714) match exactly.\n"},{"id":"q_figs5d_rhogef2_cross_stage_mixup","kind":"possible_error","text":"In Source-data_SupplementaryFig5d.xlsx (Stage 16 actin colocalization), two-sided Welch's t-tests vs Stage 16 GFP reproduce 5 of 6 caption P-values exactly: DAAM (0.7635 -> 0.764), alpha-Actinin (0.1761 -> 0.176), Zasp52 (1.986e-4 -> 1.99e-4), Myosin II (0.01950 -> 0.0195), and ROCK (0.1504 -> 0.150). For Stage 16 RhoGEF2::mCherry (n=6, mean R = -0.2467 ± 0.1075), Welch's t-test vs Stage 16 GFP gives P = 0.01602 (< 0.05, significant negative anti-colocalization), NOT the p = 0.0641 printed in the Supplementary Fig. 5d caption — which explains why the plot in sekine2024 displays an asterisk (*) over RhoGEF2. Forensically, run_s5d_rhogef2_cross_stage_diagnostic shows that testing Stage 15 RhoGEF2 (from Source-data_Fig3d.xlsx, mean R = -0.1617) against Stage 16 GFP yields Welch P = 0.06411, reproducing the caption's p = 0.0641 to all 4 significant digits and pinpointing a cross-stage data mix-up in computing the caption P-value.\n"},{"id":"q_fig4f_4m_coherency_never_reaches_030","kind":"unexplained_difference","text":"Source-data_Fig4f.xlsx confirms sekine2024's audit finding: across all 41 frames (Frames 1-41, 1 s/frame) of the 4-M simulation time course, OrientationJ coherency peaks at 0.22305 (Frame 32) and finishes at 0.19096 (Frame 41, dominant direction 88.97 deg; mean of last 10 frames 0.19512). It never reaches the 0.30 coherency (dominant direction 84.8 deg) reported for Fig4b-4-M in Supplementary Table 3 / Source-data_Fig4c.xlsx (and used as the > 0.3 cable-formation threshold). Also note stray Japanese katakana character 'ド' in column C header 'Dominant direction(°)ド'.\n"},{"id":"q_fig3a_control_swap_and_s3a_omissions","kind":"possible_error","text":"Both Source-data_Fig3a.xlsx and Source-data_SupplementaryFig3bc.xlsx embed Supplementary Table 2 verbatim with attP40 (control) at 64.5 deg / major 345.57 nm / minor 161.02 nm and attP2 (control) at 63.5 deg / major 363.37 nm / minor 166 nm; furthermore, Source-data_SupplementaryFig3a.xlsx's OrientationJ probability curves independently confirm attP40 has a 1.0 deg higher median orientation than attP2 (64.5 vs 63.5 deg at last bin < 0.5, or 65.5 vs 64.5 deg at first bin >= 0.5). This confirms that Fig. 3a and Supplementary Fig. 3c in sekine2024 swapped the Control (attP40) and Control (attP2) marker labels. Additionally: (1) Myosin II [DN] (54.4 deg in Table 2) is omitted from Source-data_SupplementaryFig3a.xlsx (27 genotypes present vs 28 in Table 2); and (2) Septin2's averaged PDF in SupplementaryFig3a gives median 58.5-59.5 deg vs 57.5 deg in Table 2.\n"},{"id":"q_fig5c_fig5f_unit_mislabeling_and_stars","kind":"possible_error","text":"(1) Severe unit-header errors in both PIV spreadsheets: Source-data_Fig5c.xlsx labels columns 'Vx (nm/s)' and 'Vy (nm/s)' while storing unscaled pixels/s (0.37-0.86; ~43.25x smaller than the 20-35 nm/s plotted in Fig. 5c), whereas Source-data_Fig5f.xlsx labels columns 'Vx (nm/s)' and 'Vy (nm/s)' while storing um/s (0.010-0.039; 1000x smaller than the 17-31 nm/s plotted in Fig. 5f, with Control, DAAM, and zasp52 values being exact integer multiples of 4.32536e-5 um/s = 0.001 px/s x 0.0432536 um/px). (2) Recomputing two-sided Welch's t-tests directly from Source-data_Fig5f.xlsx reproduces all 4 caption P-values to all 3 digits: Control P = 1.779e-6 (1.78e-6), DAAM P = 0.7277 (0.728), zasp52 P = 0.4363 (0.436), and myosin II[DN] P = 8.983e-6 (8.98e-6). This confirms that Control has a ~5x smaller P-value than myosin II[DN], proving Fig. 5f's '**' on Control vs '***' on myosin II[DN] is inverted (and '***' is undefined in the caption). (3) Source-data_Fig5f.xlsx also contains a stray second worksheet 'Supplementary Figure 6e' identical cell-for-cell to Source-data_SupplementaryFig7c.xlsx.\n"},{"id":"q_welch_mislabeled_as_student_and_fig2b_bonferroni","kind":"possible_error","text":"Direct statistical recomputation from the raw Source Data spreadsheets uncovers two systematic statistical reporting discrepancies in sekine2024: (1) Every t-test P-value in Fig. 3d (6/6), Fig. 4e (3/3), Fig. 5c (5/5), Fig. 5f (4/4), and Supplementary Fig. 5d (5/5 matching proteins) reproduces ONLY with Welch's unequal-variance t-test (R's default t.test(x, y)), NOT equal-variance Student's t-test as stated in all five captions (for example, Fig. 3d Myosin II gives Welch P = 0.0321 vs Student P = 0.0090; Fig. 5c 0* min gives Welch P = 0.0038 vs Student P = 0.00037; Fig. 5f myosin II[DN] gives Welch P = 8.98e-6 vs Student P = 5.11e-6). (2) In Source-data_Fig2b.xlsx, the raw 1,953 fusion events reproduce all 5 Kruskal-Wallis P-values (0.565, 0.322, 0.193, 0.0343, 0.0382), but at 0* min the printed pairwise bar 'p=0.0151' is the UNADJUSTED two-sided Wilcoxon rank-sum P-value (0.01508) between circumferential (60-90 deg) and diagonal (30-60 deg) fusions, rather than the Bonferroni-adjusted value (3 x 0.01508 = 0.0452) claimed in the Fig. 2b caption.\n"},{"id":"q_s1g_sample_counts_and_sd_convention_drift","kind":"possible_error","text":"(1) In Source-data_SupplementaryFig1g.xlsx, the actual non-missing image counts are n = 9 at +10 min (all 9 columns C16:K16 populated) and n = 4 at +20 min (only C17:F17 populated; G17:K17 are dashes '–'), contradicting the Supplementary Fig. 1g caption (PDF p. 16), which states n = 8 at 10 min and n = 5 at 20 min (apparently copied from Fig. 1h,i's counts). (2) SD conventions vary unannounced across spreadsheets: Fig. 1h, Fig. 1i, and Supp. Fig. 1g use population SD (STDEVP, ddof=0), whereas Fig. 1j, Fig. 1k, Fig. 5c, Fig. 5f, Supp. Fig. 1d, and Supp. Fig. 1f use sample SD (STDEV, ddof=1). Importantly, Source-data_SupplementaryFig1d.xlsx resolves sekine2024's ambiguity on '450 ± 13.2 nm': cell D16 = 0.013158 um is sample SD (N-1) across N = 8 embryos (where each embryo's mean interval is exactly 16.08 um / (N_cables - 1); SEM would be 4.65 nm).\n"},{"id":"q_omitted_raw_data_s7c_and_fig3e_and_stale_labels","kind":"unstated_input","text":"Several Source Data files omit underlying raw curves/events and contain stale/erroneous labels: (1) Source-data_SupplementaryFig7c.xlsx (and its identical stray copy in Source-data_Fig5f.xlsx sheet 'Supplementary Figure 6e') provides only the 4-row Gaussian-fit summary table (Supplementary Table 4) and omits the raw circularly-binned S(q) curves plotted in Supplementary Fig. 7c1-c4; moreover, its row labels retain outdated pre-split figure numbering 'Supplementary Fig. 6 e1 (1-M)' through 'Supplementary Fig. 6 e4 (c4-1)' (typo 'c4-1' for 'a4-1'). (2) Source-data_Fig3e.xlsx provides only the 12-row fusion-duration summary table (with column B still mislabeled 'Time (m)' copied from Fig. 2b) and omits the 2,451 raw per-fusion event rows, preventing direct recomputation of the 4 Kruskal-Wallis P-values printed in Fig. 3e. (3) Source-data_Fig4c.xlsx, Source-data_SupplementaryFig6bc.xlsx, and Source-data_SupplementaryFig7a.xlsx all repeat Supplementary Table 3's 2x half-arm crosslinker lengths (0.0175, 0.02, 0.03 um) and 10x turnover typo (0.3 s^-1 for 7a3-3), and SupplementaryFig7a retains 'Supplementary Figures 6b, c' in cell A3.\n"}],"takes_from":["sekine2024"],"tally":{"close":9,"error":0,"no verdict":0,"not reproduced":22,"reproduced":58},"title":"Source Data for \"Emergence of periodic circumferential actin cables from the anisotropic fusion of actin nanoclusters during tubulogenesis\" (MOESM11_ESM.zip)\n","variants":[],"venue":"Nature Communications 15, 464 (Source Data, MOESM11_ESM.zip)","verdicts":[{"comparison":"cmp_f1ef_vs_f4c_st15_major","computed":"328.6","page":null,"printed":"328.59","purpose":"consistency","verdict":"reproduced"},{"comparison":"cmp_f1ef_vs_f4c_st15_minor","computed":"178","page":null,"printed":"177.99","purpose":"consistency","verdict":"reproduced"},{"comparison":"cmp_f1ef_vs_f4c_st16_major","computed":"383.5","page":null,"printed":"383.54","purpose":"consistency","verdict":"reproduced"},{"comparison":"cmp_f1ef_vs_f4c_st16_minor","computed":"168.2","page":null,"printed":"168.18","purpose":"consistency","verdict":"close"},{"comparison":"cmp_f4d_0426_vs_f4e_1m_dist","computed":"28.38","page":null,"printed":"28.4","purpose":"consistency","verdict":"reproduced"},{"comparison":"cmp_f4d_0426_vs_f4e_1m_dx","computed":"18.19","page":null,"printed":"18.2","purpose":"consistency","verdict":"reproduced"},{"comparison":"cmp_f4d_0426_vs_f4e_1m_dy","computed":"17.6","page":null,"printed":"17.6","purpose":"consistency","verdict":"reproduced"},{"comparison":"cmp_f4d_0426_vs_f4e_2m_dist","computed":"32.76","page":null,"printed":"32.8","purpose":"consistency","verdict":"reproduced"},{"comparison":"cmp_f4d_0426_vs_f4e_2m_dx","computed":"19.36","page":null,"printed":"19.4","purpose":"consistency","verdict":"reproduced"},{"comparison":"cmp_f4d_0426_vs_f4e_2m_dy","computed":"21.82","page":null,"printed":"21.8","purpose":"consistency","verdict":"reproduced"},{"comparison":"cmp_f4d_0426_vs_f4e_4m_dist","computed":"35.89","page":null,"printed":"35.9","purpose":"consistency","verdict":"reproduced"},{"comparison":"cmp_f4d_04
