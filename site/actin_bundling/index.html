elations":[],"role":"model","variant_of":null},{"id":"columnar_free_energy_from_eq5","name":"columnar bundle free energy per length directly from Eq. (5) at Omega = Omega_0(R)","relations":[],"role":"model","variant_of":null},{"id":"columnar_optimal_torsion","name":"optimal torsional strain Omega_0(R) for columnar bundle (K_2 << K_3)","relations":[],"role":"model","variant_of":null},{"id":"columnar_radius_low_sigma","name":"low-surface-tension scaling of equilibrium columnar bundle radius","relations":[],"role":"model","variant_of":null},{"id":"critical_surface_tension_eq8","name":"critical surface tension and minimum bundle radius at bulk condensation (Eq. 8)","relations":[],"role":"model","variant_of":null},{"id":"critical_surface_tension_far_corrected","name":"critical surface tension far from bulk condensation (corrected from Eqs. 6-7)","relations":[],"role":"model","variant_of":null},{"id":"critical_surface_tension_far_printed","name":"critical surface tension far from bulk condensation (p. 3 col 2, as printed)","relations":[],"role":"model","variant_of":null},{"id":"effective_frank_moduli","name":"effective twist and bend moduli (below Eq. 5)","relations":[],"role":"processing","variant_of":null},{"id":"effective_in_plane_shear_modulus","name":"effective in-plane shear modulus (below Eq. 5)","relations":[],"role":"processing","variant_of":null},{"id":"effective_out_of_plane_shear_modulus","name":"effective out-of-plane shear modulus (below Eq. 9)","relations":[],"role":"processing","variant_of":null},{"id":"lambda_3perp_microscopic","name":"microscopic scaling of minimum bundle radius lambda_{3 perp} (p. 4 col 1)","relations":[],"role":"model","variant_of":null},{"id":"linker_binding_energy_from_kBT","name":"linker binding energy in energy units from Delta E / (k_B T)","relations":[],"role":"processing","variant_of":null},{"id":"saturated_linker_spacing","name":"axial linker spacing in saturated bundles (p. 4 col 1)","relations":[],"role":"processing","variant_of":null},{"id":"small_bundle_torsion_microscopic","name":"small-bundle torsion scaling Omega_{R->d} (p. 4 col 1)","relations":[],"role":"model","variant_of":null},{"id":"solid_elastic_energy_eq9","name":"hexagonal-solid bundle elastic energy density (Eq. 9)","relations":[{"kind":"scales_as","other":"claessens2008/twist_energy_per_monomer","stated":false,"status":"verified"}],"role":"model","variant_of":null},{"id":"solid_elastic_energy_min_eq9","name":"exact minimized torsional strain and elastic energy density of solid bundle (Eq. 9)","relations":[],"role":"model","variant_of":null},{"id":"solid_equilibrium_radius_muc","name":"exact equilibrium hexagonal-solid bundle radius at bulk condensation from Eq. (9)","relations":[],"role":"model","variant_of":null},{"id":"solid_harmonic_min_corrected","name":"harmonic minimization of solid bundle Eq. (9) (corrected factor of 2 in E_elast)","relations":[],"role":"model","variant_of":null},{"id":"solid_harmonic_min_printed","name":"harmonic minimization of solid bundle Eq. (9) (p. 3 col 2, as printed)","relations":[],"role":"model","variant_of":null},{"id":"solid_radius_bending_regime","name":"solid-phase equilibrium bundle radius scaling for R_0 << lambda_{3 perp}","relations":[],"role":"model","variant_of":null},{"id":"solid_radius_shear_regime","name":"solid-phase equilibrium bundle radius scaling for R_0 >> lambda_{3 perp}","relations":[],"role":"model","variant_of":null},{"id":"solid_to_columnar_radius_ratio","name":"ratio of solid-phase to columnar-phase equilibrium bundle radius (Ref. 21)","relations":[],"role":"model","variant_of":null},{"id":"stability_criterion_microscopic","name":"microscopic finite-size bundle stability ratio Sigma_c(mu_c) / Sigma (p. 4 col 1)","relations":[],"role":"model","variant_of":null}],"of":[],"questions":[{"id":"q_f0_prefactor_factor_16_vs_256","kind":"possible_error","text":"Below Eq. (6) (p. 2 col 2), the paper prints f_0 = 3*pi*(gamma^4 / (16 * mu_perp_bar))^(1/3). However, substituting the paper's own optimal torsional strain Omega_0(R) = (gamma / (4 * mu_perp_bar))^(1/3) * R^(-2/3) * (R^2 + lambda_{3 perp}^2)^(-1/3) into Eq. (5) (with K_2 << K_3) gives E_elast(R, Omega_0) = -(3/4) * gamma * Omega_0(R), so pi * R^2 * E_elast(R, Omega_0) yields f_0 = (3*pi/4) * (gamma^4 / (4 * mu_perp_bar))^(1/3) = 3*pi*(gamma^4 / (256 * mu_perp_bar))^(1/3). The printed 16 appears to come from moving 1/4 inside the cube root without cubing it (4 * 4 = 16 instead of 4^3 * 4 = 256), inflating f_0 and Sigma_c (Eq. 8) by 2^(4/3) ~= 2.52, and inflating the exact prefactor of the low-Sigma bundle radius R_0 = (f_0/(3*pi*Sigma))^3 by a factor of 16.\n"},{"id":"q_sigma_c_far_dimensional_and_algebraic_error","kind":"possible_error","text":"On p. 3 col 2 top, the paper prints Sigma_c ~= f_0^(3/2) * 3^(-1/2) * lambda_{3 perp}^(-1) * (mu_c - mu)^(-3/2) for the critical surface tension far from bulk condensation (mu << mu_c). This expression is dimensionally inconsistent: from Eq. (6) [f_0] = E * L^(-5/3), from Eq. (7) [mu] = [mu_c] = E (energy per filament), so the printed RHS has dimension L^(-7/2) instead of surface tension E * L^(-2) (and even if mu_c - mu were read as energy density delta = (rho_0/L)*(mu_c - mu), the RHS has dimension L, i.e., length). Expanding Eqs. (6)-(7) for R << lambda_{3 perp} yields critical radius R* = f_0^(3/2) / (3^(3/2) * pi^(3/2) * lambda_{3 perp} * delta^(3/2)) and critical surface tension Sigma_c = delta * R* = f_0^(3/2) * L^(1/2) / (3^(3/2) * pi^(3/2) * lambda_{3 perp} * rho_0^(1/2) * (mu_c - mu)^(1/2)). The printed formula appears to copy the -3/2 exponent of R* into Sigma_c, omit the (rho_0/L)^(-1/2) conversion factor, and drop factors of 3 * pi^(3/2) in the denominator.\n"},{"id":"q_solid_harmonic_energy_factor_of_2","kind":"possible_error","text":"On p. 3 col 2, minimizing the harmonic and chiral terms of Eq. (9), mu_par_bar*(Omega*R)^2 - gamma*Omega, gives Omega_0 = gamma/(2*mu_par_bar*R^2) and theta_0(R) = gamma/(2*mu_par_bar*R) (matching printed), but substituting back gives E_elast = +gamma^2/(4*mu_par_bar*R^2) - gamma^2/(2*mu_par_bar*R^2) = -gamma^2/(4*mu_par_bar*R^2), half the magnitude of the printed E_elast ~= -gamma^2/(2*mu_par_bar*R^2). Two sentences later, the paper also prints that this term contributes -pi*gamma^2/(2*mu_par_bar) to Delta F(R), which both repeats the factor-of-2 error and omits the length factor L (it is a contribution to Delta F(R)/L).\n"},{"id":"q_mu_perp_bar_25_over_216_unstated_derivation","kind":"unstated_model","text":"Below Eq. (5) (p. 2 col 1), the paper states mu_perp_bar = 25*mu_perp/216 for an incompressible array while deferring the full derivation of the radial relaxation to future work (\"We will show elsewhere\"). Solving the 2D circular-cross-section radial elastic equilibrium of Eqs. (1)-(2) with free boundary sigma_rr(R) = 0 in the incompressible limit (lambda_perp -> oo) gives u_r(r) = (1/8)*Omega^2*r^3 and disk-averaged energy density (3/32)*mu_perp*(Omega*R)^4 (3/32 = 0.09375 vs 25/216 ~= 0.11574). Because the paper does not give its derivation of 25/216, the printed coefficient is kept without a variant.\n"},{"id":"q_minor_typos_text_and_symbols","kind":"possible_error","text":"Four minor notational/typographical errors appear in the prose without affecting the main subsequent equations: (1) p. 1 col 2 prints t ~= 1 + d_z u_perp (scalar 1 instead of unit vector z_hat, which is printed correctly on p. 2 col 1); (2) p. 2 col 2 refers to \"The term, -gamma*Omega, in Eq. (4)\" instead of Eq. (5); (3) p. 3 col 2 writes the solid-phase bending anharmonic term as K3_bar*theta^2/R^2 instead of K3_bar*theta^4/R^2 (from K3_bar*Omega^4*R^2 in Eq. 9 with theta = Omega*R; the paper's subsequent scaling R_0 ~ (K3_bar/Sigma)^(1/5) * (gamma/mu_par_bar)^(4/5) uses the correct theta^4 power); and (4) p. 3 col 2 writes \"near to bulk condensation (mu >= mu_c)\" for dispersed solid bundles, reversing the sign of mu <= mu_c stated on p. 3 col 1.\n"},{"id":"q_onset_diameter_vs_lai2007","kind":"unexplained_difference","text":"On p. 1 col 1 the paper cites Lai et al. [12] for a fixed F-actin bundle diameter of 40-100 nm (radius 20-50 nm), whereas on p. 4 col 1 it estimates the minimum bundle radius lambda_{3 perp} ~ 100 nm (implying minimum diameter 2*lambda_{3 perp} ~ 200 nm, twice the upper bound of 40-100 nm). Evaluating the paper's scaling lambda_{3 perp} ~ (d*l_p*k_B T/Delta E)^(1/2) across its stated input ranges d ~ 1-10 nm, l_p ~ 1-10 um, Delta E ~ 10 k_B T actually yields lambda_{3 perp} = 10-100 nm (geometric mean 31.6 nm, linear midpoint 55.0 nm), so the printed 100 nm is the upper endpoint of the scaling range; the geometric-mean diameter 2*31.6 = 63 nm lies squarely inside 40-100 nm.\n"},{"id":"q_unstated_surface_binding_reduction","kind":"unstated_input","text":"On p. 4 col 1, the paper concludes that Sigma_c(mu_c)/Sigma can exceed 1 for F-actin \"provided the linker binding energy at the surface is reduced with respect to the bulk value\", without quantifying the reduction ratio Delta E / Delta E*. Using the midpoints of the paper's printed ranges (d = 5.5 nm, P = 5.5 nm, lambda_{3 perp} = 100 nm) with unit prefactor gives (d/P)^(4/3)*(d/lambda_{3 perp})^(1/3) = 0.380, requiring Delta E / Delta E* > 2.63 for stability (though if d > P or P is at the lower end of 1-10 nm, stability can hold even at Delta E / Delta E* = 1).\n"},{"id":"q_audit_solid_equilibrium_spinodal_vs_coexistence","kind":"reading","text":"The solver solid_equilibrium_radius_muc returns a finite bundle radius R_0 whenever Sigma <= peak_val, where peak_val = max_R [Omega_0(R)^4 * R^3 * (mu_perp_bar * R^2 + 2 * K3_bar)] is the spinodal surface tension (where a local minimum at R > 0 first forms), rather than the thermodynamic coexistence threshold Sigma_{c,solid} = max_{R > 0} [-(1/2) * R * E_elast_min(R)] where Delta F(R_0) = 0. On p. 3 col 1-2 the paper defines a thermodynamically stable dispersed phase as requiring a negative minimum Delta F(R_0) < 0 (below the R = 0 boundary minimum), which columnar_equilibrium_radius_muc enforces by returning None for Sigma > Sigma_c. At the record's F-actin continuum benchmark parameters, Sigma_{c,solid} = 0.3410 pN/nm (at R_c = 16.57 nm) while peak_val = 0.3792 pN/nm (at R_peak = 9.27 nm); for Sigma in (0.3410, 0.3792] pN/nm (e.g. Sigma = 0.36 pN/nm gives R_0 = 14.14 nm with Delta F(R_0)/L = +1.84 pN > 0), solid_equilibrium_radius_muc returns a metastable local minimum rather than None. Current runs (Sigma_solid_added = 0.05 pN/nm) and relation regimes lie well below Sigma_{c,solid} and are unaffected.\n"},{"id":"q_audit_onset_diameter_validation_prefactor_loss","kind":"reading","text":"In runs.yaml, run_eq8_at_printed_lambda3 and run_diameter_from_printed_lambda3 feed the paper's order-of-magnitude scaling estimate factin_lambda_3perp_est (\"~100\" nm, derived from the prefactor-unknown scaling law lambda_3perp_microscopic) into exact models (critical_surface_tension_eq8 and bundle_diameter_from_radius), yielding an exact D = 200.0 nm and a hard \"not reproduced\" validation verdict in cmp_diameter_onset_from_printed_lam3_lai2007 against Lai et al.'s 40-100 nm (factin_diameter_lai2007). Routing through the printed datum drops both the approximate \"~\" qualifier and the prefactor_chained provenance (unlike cmp_diameter_onset_from_micro_lam3_lai2007, which returns \"no verdict\"), judging an order-of-magnitude scaling estimate as an exact prefactor-1 prediction of D = 200 nm that the paper never states explicitly. In addition, run_eq8_at_printed_lambda3 pairs lambda_3perp = 100 nm with f0_printed_continuum (computed from added continuum parameters whose lambda_3perp_continuum is 73.26 nm), though R_0 is independent of f_0.\n"},{"id":"q_audit_footnote21_stability_and_ratio_bound","kind":"possible_error","text":"Two mathematical issues in Footnote [21] (p. 4 col 2) are not recorded elsewhere: (1) The printed dispersed-phase stability condition gamma*theta > 2*Sigma matches either the weaker necessary bound obtained by dropping all positive elastic penalty terms in Eq. (9) or the paper's factor-of-2-inflated harmonic energy E_elast ~= -gamma^2 / (2 * mu_par_bar * R^2) = -gamma*theta_0/R; using the corrected harmonic energy -gamma^2 / (4 * mu_par_bar * R^2) = -(1/2)*gamma*theta_0/R, stability Delta F/L < 0 in the harmonic solid regime requires the twice-stronger condition gamma*theta_0 > 4*Sigma (still implying Sigma/gamma << 1). (2) The claim that solid bundles are smaller than columnar aggregates \"by a factor [at] least as small as (Sigma/gamma)^(8/3)\" reverses the regime bound: (Sigma/gamma)^(8/3) is the scaling ratio in the low-Sigma shear-dominated regime (R_{0,solid} >> lambda_{3 perp}, mu_par_bar ~= mu_perp_bar, with exact asymptotic prefactor 2^(20/3) ~= 101.6 using corrected f_0 or 2^(8/3) ~= 6.35 using printed f_0), whereas in the bending-dominated regime (R_{0,solid} << lambda_{3 perp}), R_{0,solid} ~ (K3_bar/Sigma)^(1/5)*(gamma/mu_par_bar)^(4/5) is larger than the shear-regime scaling by (lambda_{3 perp}/R_{0,solid,shear})^(2/5) > 1, so R_{0,solid}/R_{0,col} is larger (not smaller) than (Sigma/gamma)^(8/3) (scaling as (Sigma_c/gamma)^(8/5) >> (Sigma_c/gamma)^(8/3) at Sigma = Sigma_{c,col}, though still << 1).\n"},{"id":"q_audit_cholesteric_pitch_2pi_convention","kind":"reading","text":"Eq. (3) (p. 2 col 1) writes the Frank twist energy as K_2*(nabla_perp x t - z_hat/P)^2 and calls P the preferred cholesteric pitch (without a 2*pi factor, so P = q_0^(-1) is the inverse preferred twist wavenumber rather than the full 2*pi cholesteric repeat pitch 2*pi/q_0), giving gamma = 2*K_2/P below Eq. (5). On p. 4 col 1, however, the paper explicitly retains 2*pi in the measured small-bundle twist pitch 2*pi/Omega ~ 100 nm (Ref. 22) when inverting Omega_{R->d} ~ (gamma / (k_B T * l_p))^(1/3) with gamma ~ Delta E / (l * P) to obtain P ~ 1-10 nm. Under the standard full-pitch convention q_0 = 2*pi/P_full, the inferred full cholesteric pitch would be 2*pi times larger (~6-60 nm; 8.4 nm at linear midpoints, 25 nm at geometric means). Because the p. 4 scaling models carry prefactor: unknown, the 2*pi factor is absorbed into the unknown prefactor within this record, but it is relevant if P is compared cross-paper against full cholesteric pitch measurements.\n"},{"id":"q_fig2_uncalibrated_corroboration","kind":"reading","text":"Neither Fig. 1 (p. 2, 3D bundle schematic) nor Fig. 2 (p. 3, main Delta F(R) plot and (mu, Sigma) phase-diagram inset) carries numeric axis tick labels, so no calibrated figures.yaml readings can be extracted. Nevertheless, direct 1200 dpi inspection of Fig. 2 (documented in figures.md) corroborates two existing open questions: (1) Fig. 2 (inset) unambiguously places dispersed filaments and dispersed bundles strictly in the mu < mu_c half-plane (left of the vertical axis at mu = mu_c) and bulk condensation strictly at mu > mu_c (right of mu = mu_c), confirming that p. 3 col 2's solid-phase statement \"mu >= mu_c\" (q_minor_typos_text_and_symbols item 4) is a reversed-sign typo; (2) tracing the plotted inset phase boundary Sigma_c(mu)/Sigma_c(mu_c) matches the exact numerical coexistence boundary of Eqs. (6)-(7) (columnar_critical_surface_tension_exact) across its plotted range a = pi*(rho_0/L)*(mu_c - mu)*lambda_{3 perp}^(4/3)/f_0 in [0, 10.25] with RMSE 0.0020 in Sigma/Sigma_c (~1.4 px) and far-left log-log slope -0.516 (exact -0.4999), directly corroborating the -1/2 asymptotic exponent of critical_surface_tension_far_corrected against the dimensionally inconsistent printed (mu_c - mu)^(-3/2) formula (q_sigma_c_far_dimensional_and_algebraic_error). Because both axes of Fig. 2 (inset) and the vertical axis of Fig. 2 (main) are unscaled, neither panel distinguishes printed vs. corrected f_0 (q_f0_prefactor_factor_16_vs_256).\n"},{"id":"q_claessens2008_no_cross_validation","kind":"unstated_input","text":"No cross-record validations are entered in validations.yaml for grason2007 models against claessens2008 measurements, because no model of grason2007 predicts any measured datum of claessens2008 on its own experimental conditions: (1) Bundle diameter curve claessens2008/D_fig1c_measured (8 TEM points over R* in [0.0089, 0.90], rising from 8.41 nm to a plateau of 28.14 and 28.04 nm at R* = 0.70 and 0.90; no standalone scalar plateau diameter or radius datum is printed in claessens2008 text): grason2007 has no model taking bound cross-linker-to-actin molar ratio R* (effective_bound_ratio) as an input, so neither bundle_diameter_from_radius (D = 2*R) nor any continuum equilibrium-radius model can sweep over D_fig1c_measured. Moreover, all continuum radius models (critical_surface_tension_eq8, columnar_equilibrium_radius_muc, columnar_radius_low_sigma, solid_equilibrium_radius_muc, solid_radius_bending_regime, solid_radius_shear_regime) output bundle_radius (not bundle_diameter) and require unmeasured continuum elastic moduli (mu_perp, mu_parallel, K_2, K_3), preferred cholesteric pitch P or chiral torque gamma, and surface tension Sigma (plus mu_c - mu, rho_0, L away from bulk condensation), none of which are measured in claessens2008 or numerically stated for F-actin in grason2007. Grason's microscopic onset scaling lambda_3perp_microscopic (lambda_{3 perp} ~ (d*l_p*k_B T/Delta E)^(1/2), prefactor: unknown) outputs a minimum columnar radius at saturated linker coverage (l ~ d) assuming freely sliding chains: substituting claessens2008/aH_hex_saxs (d = 12.4 nm) and claessens2008/DeltaG_fascin_printed (Delta E/k_B T ~= 15, exact 15.02) gives lambda_{3 perp} = 28.7-90.9 nm (onset diameter 2*lambda_{3 perp} = 57.5-181.7 nm across l_p = 1-10 um; 236.9 nm at l_p = 17 um), compared to Claessens's hydrated 2-shell SAXS area-equivalent diameter 56.8-58.2 nm (n_f = 19-20) and TEM plateau 28.1 nm (see claessens2008/q_tem_vs_saxs_bundle_diameter). Rigid fascin cross-linkers suppress axial sliding (placing fascin bundles in Grason's 3D solid phase Eq. 9, whose radius is smaller than columnar by an unmeasured (Sigma/gamma)^(8/3) factor), and extending Grason's scalings via l ~ 1/R* predicts decreasing or constant R_0(R*) rather than Claessens's rising D ~ (R*)^(+0.3) (claessens2008/q_grason2007_diameter_Rstar_scaling_and_onset_size). (2) Helical overtwist measurements (claessens2008/Delta_theta_max ~= 1 deg and Delta_theta_fig3d_ca0p8, ca2, ca3 vs R*): claessens2008 measures internal single-filament helical overtwist per actin monomer in straight, unbraided F-actin/fascin bundles (omega_fil = Delta_theta/d = 0.00595 nm^-1 at saturation, wavelength 1056 nm), whereas grason2007's torsion models (columnar_optimal_torsion, small_bundle_torsion_microscopic, solid_elastic_energy_min_eq9, solid_harmonic_min_printed/corrected) predict macroscopic whole-bundle supertwist/braiding rate Omega and outer filament tilt angle theta = Omega*R (explicitly distinct physical observables; mapping monomer_overtwist to outer_tilt_angle or torsional_strain would be physically invalid). (3) Other claessens2008 measurements (aH_hex_saxs = 12.4 nm, q10_saxs = 0.585 nm^-1, nf_max ~= 20, D_fil_fig2d = 5-6 filaments, Rstar_plateau ~= 0.25, Rstar_figS1_experiment, ca_fig2e droplet phase boundaries, D_ratio_fig4d ~= 3 for fascin+espin composite bundles, SAXS intensities and helical layer-line peaks): grason2007 treats in-plane spacing d (chain_spacing) strictly as an input, has no model outputting filament count, bundle width in filaments, bound linker ratio, droplet critical concentration, SAXS profiles, or multi-ABP composite diameter ratios (solid_to_columnar_radius_ratio is a distinct ratio R_{0,solid}/R_{0,col} << 1). Claessens also records no standalone axial linker_spacing datum to test saturated_linker_spacing (l ~ d, prefactor: unknown), though its 1:4.5 saturation stoichiometry at d_monomer = 2.9 nm implies 13.05 nm per filament, close to a_H = 12.4 nm.\n"},{"id":"q_dutta2016_no_cross_validation","kind":"unstated_model","text":"No cross-record validations are entered in validations.yaml for grason2007 models against dutta2016 data, because dutta2016 is a pure theory paper with zero origin: measured entries and no model of grason2007 predicts any reported datum of dutta2016: (1) The only two physical experimental values in dutta2016/data.yaml are both origin: reported literature citations from Borukhov et al. (2005) [dutta2016/ref-11 = grason2007/ref-8] with approximate \"~\" precision: (a) dutta2016/screening_length_actin (~1 nm, screening_length_physical): grason2007 is a purely elastic continuum theory of chiral bundles with no electrostatics, salt concentration, or Debye screening-length model or quantity (and p. 1 explicitly rejects electrostatic-screening control of F-actin bundle size). (b) dutta2016/filament_thickness_actin (~8 nm, typed in dutta2016 as in_plane_radius_of_gyration by qualitative analogy between sqrt(L/(beta*epsilon)) and single-filament thickness): grason2007 has no model predicting single-filament diameter or single-chain transverse radius of gyration. All [length]-outputting models in grason2007 predict multi-filament bundle geometry (bundle_diameter, bundle_radius, characteristic_length_lambda3), preferred cholesteric pitch (cholesteric_pitch), or axial cross-linker spacing along the bundle axis (saturated_linker_spacing, l ~ d, prefactor: unknown), whereas inter-filament spacing d (chain_spacing) is strictly an input rather than a model output. (2) The remaining 21 entries in dutta2016/data.yaml are non-measured theoretical inputs and outputs: 10 dimensionless SALR parameter settings (rho_star_1, Gamma_R_fig2_3, lambda_R_fig2_3a, lambda_A_fig2_3, Gamma_A_fig2_no_bundle, Gamma_A_fig2_finite, Gamma_A_fig2_macro, Gamma_A_fig3b, Gamma_R_fig4, lambda_A_fig4; origin: reported) and 11 digitized theoretical prediction curves (betaV_fig2a_*, F_fig2b_*, bundle_size_fig3a, bundle_size_fig3b, bundle_size_over_lR_fig3b_inset, lambda_R_finite_fig4, lambda_R_infinite_fig4; origin: predicted). Even apart from not being experimental measurements, all 11 curves are dimensionless observables of an achiral SALR spinodal theory swept over (k, Gamma_A, lambda_R), whereas grason2007's bundle-radius and diameter models output physical lengths in nm over disjoint chiral-elastic parameters (gamma, mu_perp_bar, mu_par_bar, K3_bar, Sigma, mu_c - mu, or d, l_p, Delta E, P), and grason2007's dimensionless outputs (outer_tilt_angle, solid_to_columnar_radius_ratio, bundle_stability_ratio) are physically unrelated to dutta2016's SALR observables.\n"}],"takes_from":[],"tally":{"close":0,"error":0,"no verdict":0,"not reproduced":0,"reproduced":0},"title":"Chirality and Equilibrium Biopolymer Bundles","variants":[],"venue":"Phys. Rev. Lett. 99, 098101 (2007)","verdicts":[{"comparison":"cmp_cholesteric_pitch_factin","computed":"1.333","page":4,"printed":"~1 to 10","purpose":"reproduction, prefactor unknown","verdict":"no verdict"},{"comparison":"cmp_lambda_3perp_factin","computed":"55","page":4,"printed":"~100","purpose":"reproduction, prefactor unknown","verdict":"no verdict"},{"comparison":"cmp_stability_ratio_factin","computed":"1.141","page":4,"printed":"≳ 1","purpose":"reproduction, prefactor unknown","verdict":"no verdict"},{"comparison":"cmp_diameter_onset_from_printed_lam3_lai2007","computed":"200","page":1,"printed":"40 to 100","purpose":"validation","verdict":"not reproduced"},{"comparison":"cmp_diameter_onset_from_micro_lam3_lai2007","computed":"110","page":1,"printed":"40 to 100","purpose":"validation, prefactor unknown","verdict":"no verdict"}],"year":2007},{"authors":["M. M. A. E. Claessens","C. Semmrich","L. Ramos","A. R. Bausch"],"by_purpose":{"consistency":{"close":0,"error":0,"no verdict":3,"not reproduced":0,"reproduced":1},"consistency, corrected":{"close":0,"error":0,"no verdict":1,"not reproduced":0,"reproduced":0},"reproduction":{"close":0,"error":0,"no verdict":6,"not reproduced":1,"reproduced":9},"reproduction, corrected":{"close":0,"error":0,"no verdict":4,"not reproduced":0,"reproduced":0},"reproduction, prefactor unknown":{"close":0,"error":0,"no verdict":0,"not reproduced":2,"reproduced":0},"validation":{"close":0,"error":0,"no verdict":0,"not reproduced":1,"reproduced":0},"validation, prefactor unknown":{"close":0,"error":0,"no verdict":0,"not reproduced":2,"reproduced":0}},"checked":{"close":0,"no verdict":14,"not reproduced":6,"reproduced":10},"counts":{"added":7,"comparisons":30,"data":83,"models":30,"questions":24,"references":46,"runs":51},"id":"claessens2008","kind":"article","label":"Claessens et al. 2008","models":[{"id":"Rstar_filament_scaling","name":"translated bound fascin ratio scaling with filament number (SI Fig. S1)","relations":[],"role":"model","variant_of":null},{"id":"actin_molar_from_mass","name":"G-actin molar concentration from mass concentration","relations":[],"role":"processing","variant_of":null},{"id":"binding_energy_fascin","name":"fascin binding free energy in k_B T (as printed)","relations":[],"role":"model","variant_of":null},{"id":"binding_energy_fascin_sign_corrected","name":"fascin binding energy gain in k_B T (sign-corrected -ln(K_D/c_0))","relations":[],"role":"model","variant_of":"binding_energy_fascin"},{"id":"bundle_geometry_bulk_limit","name":"bulk large-bundle limit of SI saturation stoichiometry","relations":[],"role":"model","variant_of":null},{"id":"bundle_geometry_saturation","name":"saturated hexagonal bundle cross-linker to actin ratio (SI Methods)","relations":[],"role":"model","variant_of":null},{"id":"diameter_filament_scaling","name":"bundle diameter square-root scaling with filament number (SI)","relations":[{"kind":"scales_as","other":"grason2007/bundle_diameter_from_radius","stated":false,"status":"verified"}],"role":"model","variant_of":null},{"id":"diameter_scaling_Rstar","name":"empirical bundle diameter scaling with bound fascin ratio","relations":[],"role":"fit","variant_of":null},{"id":"dimensionless_kd_scale","name":"dimensionless dissociation ratio K_d / c_a (Methods)","relations":[],"role":"processing","variant_of":null},{"id":"droplet_critical_concentration","name":"confined droplet actin concentration boundary at fixed n_f (Fig. 2E)","relations":[],"role":"model","variant_of":null},{"id":"droplet_ring_filament_number","name":"confined droplet single-ring F-actin length and filament count","relations":[],"role":"model","variant_of":null},{"id":"effective_bound_ratio","name":"effective bound fascin-to-actin molar ratio R* (Methods)","relations":[],"role":"model","variant_of":null},{"id":"filament_number_from_diameter_ratio","name":"filament count from bundle diameter ratio (Fig. 4D / SI)","relations":[],"role":"model","variant_of":null},{"id":"four_sphere_diffraction_model","name":"four-sphere actin diffraction fit for extracting filament twist (Fig. 3C)","relations":[],"role":"fit","variant_of":null},{"id":"gaussian_tem_profile_fit","name":"Gaussian intensity-profile fit for TEM bundle diameter (Fig. 1C Inset)","relations":[],"role":"fit","variant_of":null},{"id":"helical_hexagonal_max_mismatch","name":"maximum and total helical-to-hexagonal angular mismatch (SI Methods & Fig. S2)","relations":[],"role":"model","variant_of":null},{"id":"helical_hexagonal_site_mismatch","name":"helical-to-hexagonal angular mismatch at a given lattice direction (SI Fig. S2)","relations":[],"role":"model","variant_of":null},{"id":"helical_overtwist_from_symmetry","name":"monomer twist angles and overtwist from helical symmetry transition","relations":[],"role":"model","variant_of":null},{"id":"helical_symmetry_ratio","name":"F-actin helical symmetry ratio M = p / s (SI)","relations":[],"role":"processing","variant_of":null},{"id":"hexagonal_bragg_peaks","name":"hexagonal lattice higher-order Bragg peak positions","relations":[],"role":"model","variant_of":null},{"id":"hexagonal_lattice_spacing","name":"hexagonal lattice center-to-center filament spacing from q_10","relations":[],"role":"model","variant_of":null},{"id":"hexagonal_shell_filaments","name":"hexagonal shell packing filament count and diameter","relations":[{"kind":"scales_as","other":"grason2007/bundle_diameter_from_radius","stated":false,"status":"verified"}],"role":"model","variant_of":null},{"id":"hexagonal_unit_monomers","name":"actin monomers per hexagonal cross-linking unit at saturation (SI)","relations":[],"role":"model","variant_of":null},{"id":"molar_ratio_fascin_actin","name":"total fascin-to-actin molar ratio (Methods)","relations":[],"role":"processing","variant_of":null},{"id":"saturation_ratio_from_stoichiometry","name":"saturated bound fascin-to-actin ratio from monomer stoichiometry (SI)","relations":[],"role":"processing","variant_of":null},{"id":"thermal_energy_scale","name":"thermal energy scale k_B T","relations":[],"role":"processing","variant_of":null},{"id":"twist_energy_per_fascin","name":"torsional twist energy per bound fascin in units of k_B T (as printed)","relations":[],"role":"model","variant_of":null},{"id":"twist_energy_per_fascin_half","name":"torsional twist energy per bound fascin in units of k_B T (with linear-elastic 1/2 factor)","relations":[],"role":"model","variant_of":"twist_energy_per_fascin"},{"id":"twist_energy_per_monomer","name":"torsional twist energy per actin monomer (as printed)","relations":[{"kind":"scales_as","other":"grason2007/columnar_elastic_energy_eq5","stated":false,"status":"verified"},{"kind":"scales_as","other":"grason2007/solid_elastic_energy_eq9","stated":false,"status":"verified"}],"role":"model","variant_of":null},{"id":"twist_energy_per_monomer_half","name":"torsional twist energy per actin monomer (with linear-elastic 1/2 factor)","relations":[],"role":"model","variant_of":null}],"of":[],"questions":[{"id":"q_binding_energy_sign_and_standard_state","kind":"possible_error","text":"Page 3 prints Delta G = k_B T ln(K_D) ≈ 15 k_B T (also writing K_D here vs K_d on p. 4). Two issues arise: (1) ln(K_D) requires an unstated standard-state reference concentration c_0 (with c_0 = 1 M, ln(0.3e-6 / 1) = -15.02, whereas a mole-fraction standard state c_0 = 55.5 M gives -19.04); and (2) for K_d = 0.3 uM << 1 M, +k_B T ln(K_D / 1 M) = -15.02 k_B T is negative, opposite in sign to the positive binding energy gain '≈ 15 k_B T' printed in the same sentence. The positive value corresponds to -Delta G = -k_B T ln(K_D / 1 M) (variant binding_energy_fascin_sign_corrected).\n"},{"id":"q_twist_energy_missing_half_and_constancy","kind":"possible_error","text":"Page 2 prints E_twist = tau*(Delta_theta)^2*d^(-1), omitting the factor of 1/2 from linear torsion elasticity U = (1/2)*tau*(Delta_theta)^2/d. With tau = 8e-26 N*m^2, d = 2.9 nm, T = 20 C, and Delta_theta = 1 deg (0.989 deg from -13/6 -> -28/13), the printed formula without 1/2 yields 2.08 k_B T (2.03 k_B T) per monomer, or 9.34 k_B T (9.14 k_B T) per bound fascin at 1:4.5 saturation (8.30 k_B T at plateau R* = 0.25), matching the printed '≈ 10 k_B T' per bound fascin, whereas the 1/2-corrected variant yields 4.67 k_B T (4.57 k_B T at 1:4.5; 4.15 k_B T at R* = 0.25). Moreover, the paper claims E_twist is constant per bound fascin and smaller than Delta G (~15 k_B T) for all concentrations, yet at intermediate R* = 0.05-0.10 in Fig. 3D (Delta_theta ~ 0.7-0.95 deg), the printed formula without 1/2 gives ~17-20 k_B T per bound fascin (exceeding 15 k_B T), whereas with the 1/2 factor it gives ~8.5-10 k_B T at R* = 0.05-0.10 and drops to ~4.7 k_B T at saturation.\n"},{"id":"q_Rstar_stoichiometry_contradiction","kind":"possible_error","text":"The Methods equation R* = (1/2)*((1 + R + K_d/c_a) - ((1 + R + K_d/c_a)^2 - 4R)^(1/2)) is the quadratic mass-action solution for 1:1 ligand-to-actin-monomer stoichiometry, which satisfies R* < min(1, R) strictly for all finite R (making the literal 'R* = 1' in Figs. 1A-B and 2A-C unattainable at finite fascin concentration) and saturates at R* -> 1. In contrast, SI Methods (p. 5) states that fascin binding saturates at 1 fascin per ~4.5 actin monomers (R_sat ~ 0.222, or R = 0.291 at n_f = 20 with surface occupation in Fig. S1). Because 1:1 stoichiometry was used to compute R*, the highest experimental points in Figs. 1C, 3A, 3D, and S1 reach R* ~ 0.7-1.0, far exceeding the paper's own SI full-occupation upper bound.\n"},{"id":"q_bundle_count_decrease_typo","kind":"possible_error","text":"Page 1 (right column) states that when actin concentration is increased at R* ≈ 1, a 'decrease' in the number of actin bundles per unit volume is observed (Fig. 1 A and B). This contradicts both mass conservation and the Fig. 1 caption on p. 2, which states that increasing c_a from 0.04 mg/ml to 0.1 mg/ml 'merely increases the number of actin bundles per unit volume'.\n"},{"id":"q_figS2_orientation_and_half_repeat","kind":"choice","text":"Reproducing all 12 printed angles in Fig. S2 (max 13.8 deg for -13/6, max 10.7 deg for -28/13) depends on two unstated choices that differ between panels: (1) -13/6 fixes monomer 1 at phi_0 = 0 deg (max 13.85 deg, whereas optimizing phi_0 reduces the minimax mismatch to 11.54 deg), while -28/13 rotates the lattice by phi_0 = +360/56 = +6.4286 deg (bisecting monomers 1 and 16, the minimax orientation for a 14-monomer half-repeat, lowering max mismatch from 12.86 deg at phi_0 = 0 to 10.71 deg); and (2) -28/13 restricts candidate binding sites to one 14-monomer half-repeat (k = 1..14, with monomer 15 labeled at 180 deg tied with monomer 2 at 6.43 deg) rather than all 28 monomers of the crystallographic repeat (where monomers 20 and 25 lie within 2.14 deg of 300 and 60 deg, reducing the max mismatch to 6.43 deg at phi_0 = +6.43 deg or 4.29 deg at phi_0 = 0).\n"},{"id":"q_SI_R_vs_Rstar_and_surface_coeff","kind":"reading","text":"SI Methods (p. 5) writes the saturation geometry equation for total cross-linker/actin ratio n_cl^t / n_a^t = R = (1/u)*(3 +/- 3.5*n_f^(-1/2)), while Fig. S1 (p. 6) plots the same blue (+) and green (-) curves against R* (bound ratio). Geometrically, for a k-shell hexagonal cluster (n_f = 1 + 3k(k+1)), the surface term coefficient approaches 2*sqrt(3) = 3.464 (rounded to 3.5). Also, holding u = 13 in Fig. S1 implies bulk saturation R_inf = 3/13 = 0.231 (1:4.33), slightly above the 1:4.5 stoichiometry (u = 13.5, R_inf = 0.222) stated on SI p. 5.\n"},{"id":"q_droplet_ring_formula_and_fig2e_factor","kind":"unstated_model","text":"Page 2 describes in words how total F-actin length L and single-ring filament number n_f are computed from c_a and droplet diameter D_d, without printing the equation, G-actin molar mass (M_actin), monomer axial rise (2.75 vs 2.9 nm), or polymerized fraction. For an equatorial ring of circumference pi*D_d containing all actin in a sphere of volume (pi/6)*D_d^3, n_f = 20 predicts D_d = 17.0-17.5 um at c_a = 0.01 mg/ml, whereas the dotted n_f = 20 line in Fig. 2E visually crosses c_a = 0.01 mg/ml near D_d ~ 24-25 um (~sqrt(2) larger in D_d, i.e., a factor of ~2 in n_f). Digitizing Fig. 2E in the digitize stage will test this discrepancy quantitatively.\n"},{"id":"q_tem_vs_saxs_bundle_diameter","kind":"unexplained_difference","text":"SAXS yields a hexagonal center-to-center spacing a_H = 12.4 nm (p. 2), so a 2-shell hexagonal bundle (19 filaments, 5 filaments across) has a hydrated diameter of ~50-57 nm (4*a_H + d_actin ≈ 57 nm vertex-to-vertex; ~50 nm flat-to-flat). In contrast, the TEM plateau diameter D in Fig. 1C saturates near ~28 nm (about half the hydrated width). Because the paper does not state which Gaussian width metric (sigma, 2*sigma, or FWHM) defines D, nor quantify TEM dehydration shrinkage, gaussian_tem_profile_fit is non-runnable and this ~2x width discrepancy remains unresolved.\n"},{"id":"q_four_sphere_model_unstated","kind":"unstated_model","text":"The four-sphere diffraction model (Al-Khayat et al., 1995 [ref-33]) used to fit axial SAXS wedges (Fig. 3C) and extract overtwist Delta_theta(R*) (Fig. 3D) is not stated mathematically in this paper: sphere coordinates, radii, radial weighting, disorder factors, bundle-lattice convolution, and wedge integration angles are all omitted, making four_sphere_diffraction_model non-runnable here.\n"},{"id":"q_tau_typesetting_and_d_monomer","kind":"reading","text":"On p. 2 (right column), torsional stiffness is typeset as 'tau = 810^-26 Nm^2' with the multiplication sign omitted (recorded as 8 x 10^-26 N*m^2, matching ref-35, Tsuda et al. 1996). In the same sentence, the actin monomer axial spacing is printed as d = 2.9 nm rather than the standard 2.75 nm F-actin axial rise (note that with 2.75 nm and q_10 = 0.585 nm^-1, the convoluted helical/lattice peaks sqrt(q_z^2 + q_hk^2) match the measured 1.20, 1.35, and 1.46 nm^-1 peaks closely).\n"},{"id":"q_twist_radian_unit_and_high_Rstar","kind":"reading","text":"Three additional conventions/reading caveats apply to the twist-energy calculation (pp. 2-3): (1) Unstated radian conversion: p. 2 reports Delta_theta ≈ 1 deg in degrees and immediately prints E_twist = tau*(Delta_theta)^2*d^(-1) without stating that Delta_theta must be converted to radians (pi/180; plugging degrees directly inflates E_twist by (180/pi)^2 ≈ 3283). (2) Unstated per-fascin conversion and high-R* non-constancy: the paper never prints the formula dividing per-monomer E_twist by R* and k_B*T nor specifies which R* yields '≈ 10 k_B T'; evaluating E_mon/(R* k_B T) at the paper's own printed R* = 0.5 (Fig. 3B-C, where -28/13 overtwist is saturated) gives only 4.06 k_B T without 1/2 (2.03 k_B T with 1/2), so constancy near 10 k_B T above R* = 0.25 fails unless bound fascin is capped at 1:4.5 saturation rather than the paper's 1:1 R*. (3) Mixed evidence on the 1/2 variant: because the printed formula without 1/2 reproduces '≈ 10 k_B T' at saturation (9.14-9.34 k_B T) whereas the 1/2 variant gives 4.57-4.67 k_B T (matching ~8.5-10 k_B T only at intermediate R* = 0.05-0.10 in Fig. 3D), it is uncertain whether the missing 1/2 was a typographical misprint or literally omitted in the authors' saturation estimate.\n"},{"id":"q_scaling_approx_provenance","kind":"reading","text":"Both D ≈ (R*)^0.3 (pp. 1-2) and D ≈ n_f^(1/2) (SI p. 5) are printed with the approximation symbol '≈' rather than a proportionality sign ('~' or '∝'), omitting dimensional prefactors with units of length (nm) even though D is measured in nm while R* and n_f are dimensionless. The record therefore assigns prefactor: unknown to these scaling laws and to their derived composition R* ~ n_f^(5/3). In addition, SI p. 5 states that D(R*) from Fig. 1C is translated into R*(n_f) in Fig. S1 using D ≈ n_f^(1/2) and maximum thickness ≈ 20 filaments, without stating the exact plateau diameter D_max (nm) used to anchor n_f = 20 * (D / D_max)^2.\n"},{"id":"q_SI_hex_derivation_and_R_quantity_boundary","kind":"reading","text":"Two issues in the SI bundle-geometry derivation and record schema: (1) Exact hexagonal-shell bond counting for k concentric shells (n_f = 1 + 3k(k+1), 6(2k+1) exposed surface binding sites, and 3n_f - 3(2k+1) internal shared cross-linkers per hexagonal unit, with 2k+1 = sqrt((4n_f - 1)/3)) gives R = (1/u)*(3 +/- 3*sqrt(4/3 - 1/(3*n_f))*n_f^(-1/2)). The printed coefficient 3.5 is the rounded large-n_f asymptote 2*sqrt(3) = 3.464, which causes small-n_f artifacts: the inside-only (-) branch turns unphysically negative for n_f < (3.5/3)^2 = 1.361 (producing the steep drop near n ~ 1.4 in Fig. S1), and at n_f = 1 (u = 13) the surface-included (+) branch gives 6.5/13 = 0.500 instead of the exact 6/13 = 0.462. (2) Reading disagreement on output quantity: bundle_geometry_saturation declares output quantity molar_ratio_abp_actin (R, matching SI p. 5 text), whereas Fig. S1 (p. 6) plots the exact same blue/green curves on the R* (effective_bound_ratio) axis (with a caption wording slip calling R* 'Effective cross-linker over bound actin monomer ratio') and pp. 1-2 compare full occupation at n_f = 20 (0.291 surface-included, 0.171 inside-only, 0.231 bulk at u = 13) to Rstar_plateau (≈ 0.25). Keeping R and R* as distinct quantities prevents directly comparing bundle_geometry_saturation against Rstar_plateau or digitized Fig. S1 curves unless bridged.\n"},{"id":"q_fig3a_inset_12_21_degeneracy","kind":"possible_error","text":"For a 2D hexagonal lattice, Bragg wavevectors satisfy q_hk = q_10 * sqrt(h^2 + h*k + k^2), so the (2,1) and (1,2) reflections are symmetry-equivalent and strictly degenerate at q = sqrt(7)*q_10 = 1.548 nm^-1 (for q_10 = 0.585 nm^-1), and no 2D hexagonal Bragg reflection exists between sqrt(7)*q_10 = 1.548 nm^-1 and q_30 = 3*q_10 = 1.755 nm^-1 (since h^2 + h*k + k^2 = 8 has no integer solution). Nevertheless, Fig. 3A Inset (p. 3) labels (2,1) and (1,2) as two separate peaks at distinct wavevectors between helical peak c (1.46 nm^-1) and (3,0), indicating a crystallographic mislabeling in Fig. 3A Inset.\n"},{"id":"q_reading_model_scope_and_conventions","kind":"reading","text":"Three minor reading-judgement tensions retained from the first reader without modifying scope: (1) droplet_ring_filament_number and droplet_critical_concentration are marked from_words: true rather than reconstructed, although p. 2 states no formula, G-actin molar mass, polymerized fraction, or equatorial ring circumference pi*D_d ('The bundle radius can be measured'); notably, the Fig. 2E n_f = 20 line satisfies c_a * D_d^2 ≈ 5.8 (mg/ml)*um^2, almost exactly 2.0x the equatorial-ring model's 2.89 (mg/ml)*um^2 (consistent with e.g. 2*pi*D_d instead of pi*D_d or a factor-of-2 strand convention). (2) helical_symmetry_ratio returns positive M = p/s (+2.167, +2.154) while the paper prints negative -13/6 and -28/13 for left-handedness; also, Fig. S2 (Right, -28/13) orange-boxes monomers {1, 6, 7, 10, 11, 15} spanning 15 monomers (n_unit = 15 vs n_unit_28_13_added = 14), and for n_unit = 15 with phi_0 = 0 deg (matching the -13/6 panel's orientation), monomer 15 aligns exactly at 180 deg, reducing the max mismatch to 8.57 deg (total 25.71 deg) vs the paper's 10.7 deg (38.6 deg). (3) binding_energy_fascin (described_from: ref-36), DeltaG_fascin_printed (from_source: ref-36), and Kd_fascin (conditions: {temperature: 20 degC}): ref-36 (Ono et al., 1997) supplies K_d = 0.3 uM rather than the textbook relation Delta G = k_B T ln(K_D), and 20 C is this paper's polymerization temperature (p. 4) rather than a stated measurement temperature of K_d in ref-36.\n"},{"id":"q_fig1c_figS1_slope_and_Dmax_anchor","kind":"unexplained_difference","text":"Calibrated digitization of Fig. 1C (1200 dpi) and Fig. S1 (900 dpi) yields three quantitative findings informing q_scaling_approx_provenance and q_tem_vs_saxs_bundle_diameter: (1) The dashed straight power-law line drawn in Fig. 1C has log-log slope 0.3269 (20 clean dashes, max residual 0.56 px, D(R*=1) = 38.00 nm), and the red dashed line in Fig. S1 has log-log slope 1.563 (33 dashes, close to 1/(2*0.3269) = 1.529), whereas the text rounds the exponent to 1 sig fig (0.3, whose exact inverse is 5/3 = 1.667), causing cmp_D_scaling_fig1c_fit and cmp_Rstar_scaling_figS1_line to report not reproduced on shape against exact exponents 0.3 and 5/3. (2) Pairing all 8 experimental circles one-to-one between Fig. 1C (R*, D) and Fig. S1 (n, R*) settles the unstated conversion anchor in q_scaling_approx_provenance: all 8 points satisfy n = 20 * (D / D_max)^2 with D_max = 28.22 ± 0.02 nm (0.07% scatter across all 8 points, i.e., D = 6.310 * n^(1/2) nm). (3) The TEM plateau diameters at R* = 0.70 and 0.90 measure 28.14 [27.15, 29.22] nm and 28.04 [26.92, 29.22] nm (unstated vertical error bars), confirming the ~2x discrepancy relative to the ~50-57 nm hydrated width implied by SAXS a_H = 12.4 nm.\n"},{"id":"q_fig2e_quantified_factor_2p22","kind":"unexplained_difference","text":"1200 dpi calibrated digitization of Fig. 2E quantitatively settles q_droplet_ring_formula_and_fig2e_factor: the plotted dashed n_f = 20 boundary line has log-log slope -2.014 and satisfies c_a * D_d^2 = 6.43 ± 0.04 (mg/ml)*um^2 across D_d = 6.5-23 um (15 clean dashes). The equatorial-ring model droplet_critical_concentration (n_f = 20, M_actin = 42 kDa, d = 2.9 nm) predicts c_a * D_d^2 = 2.886 (mg/ml)*um^2 — uniformly 2.23x lower than the plotted boundary line (2.11x even with d = 2.75 nm), yielding not reproduced (0/8) in cmp_droplet_crit_ca_fig2e_line. The measured phase-transition brackets at c_a = 0.02-0.10 mg/ml give rightmost single-ring (red) droplets at c_a * D_d^2 = 4.73-10.25 (mg/ml)*um^2 and leftmost two-bundle (green) droplets at c_a * D_d^2 = 8.53-21.74 (mg/ml)*um^2 (cmp_droplet_crit_ca_fig2e_single_ring: 0/5 not reproduced), confirming that the plotted dashed line tracks the experimental transition while an unstated factor of ~2.2x separates the authors' droplet-to-n_f conversion from the equatorial-ring formula.\n"},{"id":"q_fig3a_fig3d_calibrated_verification","kind":"possible_error","text":"1200 dpi calibrated readings of Fig. 3A (main and inset) and Fig. 3D confirm and quantify four open questions: (1) Fig. 3A main (1,0) peak lies at q = 0.5852 nm^-1 (matching printed 0.585), and Fig. 3A Inset (whose y-axis is logarithmic 0.50-0.63, log10 residual 0.73 px vs linear 20.44 px) shows peaks at a = 1.198, b = 1.341, c = 1.456, (2,1) bump 1.561 (arrow 1.585, vs sqrt(7)*q_10 = 1.548), and (3,0) bump 1.743 (arrow 1.765, vs 3*q_10 = 1.755), whereas the mislabeled (1,2) arrow points to q = 1.693 nm^-1 on a featureless descending slope with no peak, confirming q_fig3a_inset_12_21_degeneracy. (2) All 12 Fig. 3D markers have R* values matching the 1:1 quadratic effective_bound_ratio formula at R in {0.03, 0.05, 0.1, 0.5, 1.0} (K_d = 0.3 uM, M_actin = 42 kDa) to <0.4% (up to R* = 0.882 at c_a = 0.8 mg/ml, R = 1), directly confirming q_Rstar_stoichiometry_contradiction. (3) The 12 overtwist values are quantized to 0.1 deg (0.30, 0.40, 0.60, 0.70, 0.90, 1.00, 1.10 deg), with c_a = 2 and 3 mg/ml reaching 1.10 deg at R* = 0.5 (above the printed maximum of ~1 deg). (4) Evaluating E_twist/(R* k_B T) across all 12 points directly refutes constancy: the printed formula without 1/2 spans 2.36-20.91 k_B T (exceeding Delta G ~ 15 k_B T at all 6 points with R* = 0.05-0.10: 15.23, 16.88, 17.14, 20.42, 20.49, 20.91 k_B T), whereas the 1/2 linear-elastic variant peaks at 7.62-10.46 k_B T at R* = 0.05-0.10 (consistent with ~10 k_B T and strictly < 15 k_B T everywhere) before falling to 1.18-2.54 k_B T at R* = 0.5-0.88.\n"},{"id":"q_figS1_surface_coeff_3p60_vs_3p5","kind":"possible_error","text":"900 dpi calibrated reading of both theoretical curves in Fig. S1 (R_figS1_blue_surface and R_figS1_green_inside) reveals that across n = 2-80 the two curves satisfy u_eff = 6 / (R_blue + R_green) = 12.98 ± 0.02 (confirming u = 13) and surface coefficient c_surf = u_eff * (R_blue - R_green) / 2 * sqrt(n) = 3.605 ± 0.008 (independently confirmed by the green curve crossing R* = 0.00508 at n = 1.512 [c = 3.608] and R* = 0.0100 at n = 1.583 [c = 3.611]), rather than the coefficient 3.5 printed on SI p. 5 (or the exact hexagonal asymptote 2*sqrt(3) = 3.464). With the printed 3.5 and u = 13, bundle_geometry_saturation systematically overpredicts the plotted green curve at small n (+60% at n = 1.6: 0.0179 vs 0.0112; +16% at n = 2: 0.0404 vs 0.0348; +6.6% at n = 3: 0.0753 vs 0.0707; +4.4% at n = 4: 0.0962 vs 0.0921). In cmp_SI_green_inside, the automated verdict reports reproduced only because the discrete sign selector sigma_inside_only = \"-1\" carries a decimal-rounding range [-1.5, -0.5] during input-rounding propagation, masking this 4-60% mismatch.\n"},{"id":"q_grason2007_overtwist_vs_supertwist_mechanics","kind":"unexplained_difference","text":"Claessens et al. (2008) cite Grason & Bruinsma (2007) [ref-20] on pp. 1 and 4 as an alternative thermodynamic mechanism for finite chiral bundle size, explicitly contrasting single-filament helical overtwisting (claessens2008) with whole-bundle supertwisting/braiding (grason2007). Four structural differences prevent any same_as or reduces_to equivalence between their elastic models in their physical operating regimes: (1) Twist degree of freedom and bundle-radius scaling: in claessens2008, straight unbraided filaments overtwist internally around their own axes by Delta_theta ~= 1 deg/monomer, so E_twist = tau*(Delta_theta)^2/d (or (1/2)*tau*(Delta_theta)^2/d) is independent of bundle radius (energy density ~ R^0, total energy per length ~ n_f ~ R^2) and cannot by itself yield a preferred equilibrium radius R_0; in grason2007, rigid whole-bundle torsion Omega tilts outer filaments by theta = Omega*R, making solid-rod torsion scale as mu_par_bar*(Omega*R)^2 ~ R^2 (total ~ R^4) and anharmonic in-plane shear scale as mu_perp_bar*(Omega*R)^4 ~ R^4 (total ~ R^6), which generates a finite R_0 only through anharmonicity. (2) Sign and stiffness scaling of elastic energy: in claessens2008, twisting is a positive energy cost (+tau*(Delta_theta)^2/d, scaling as +tau^1) paid by achiral fascin binding (Delta G ~= 15 k_B T); in grason2007, chiral torque -gamma*Omega drives spontaneous twist with negative minimized elastic energy density E_elast(Omega_0) < 0 (-(3/4)*gamma*Omega_0 ~ -mu_perp_bar^(-1/3) in columnar Eq. 5; -gamma^2/(4*mu_par_bar*R^2) ~ -mu_par_bar^(-1) in harmonic solid Eq. 9), so increasing elastic stiffness decreases |E_elast| rather than increasing it. (3) Overlap restricted to the achiral harmonic limit: the quadratic twist-energy scaling shared by grason2007 Eqs. (5) and (9) and claessens2008 twist_energy_per_monomer (rel_grason_eq5_scales_claessens_twist, rel_grason_eq9_scales_claessens_twist) holds only for gamma -> 0 and Omega*R << 1, a limit Grason & Bruinsma explicitly leave behind (K2 << K3, finite gamma, quartic shear/bend) to obtain finite-size chiral bundles. (4) Extensive vs. intensive surface-to-bulk energy: in the achiral limit (f_0 -> 0), Grason's Eq. (6) Delta F/L = -pi*R^2*epsilon + 2*pi*R*Sigma matches Claessens's inside-only hexagonal bond-counting model bundle_geometry_saturation (sigma = -1: R_inside = (3 - 3.5*n_f^(-1/2))/u) multiplied by -n_f*Delta E/d (yielding epsilon = 3*Delta E*rho_0/(u*d) and Sigma/epsilon = 3.5/(6*sqrt(pi*rho_0)) = 0.306*a_H, matching Grason's microscopic Sigma/epsilon ~ d at Delta E* = Delta E), while Claessens's surface-occupied branch (sigma = +1) corresponds qualitatively to Grason's reduced surface-energy penalty Delta E* < Delta E required for finite-bundle stability Sigma_c/Sigma > 1.\n"},{"id":"q_grason2007_diameter_Rstar_scaling_and_onset_size","kind":"unexplained_difference","text":"Comparing Claessens et al.'s (2008) fascin bundle-diameter measurements and scaling against Grason & Bruinsma's (2007) equilibrium-radius models reveals an incompatible dependence on bound cross-linker density R* alongside a partial order-of-magnitude overlap at saturation: (1) Cross-linker density scaling: identifying axial linker spacing l ~ 1/R* in Grason & Bruinsma's microscopic scaling (p. 4: K3 ~ k_B T*l_p/d^2 ~ (R*)^0, while mu_perp, mu_par, gamma, Sigma ~ 1/l ~ R*) predicts columnar onset radius lambda_{3 perp} = (K3_bar/mu_perp_bar)^(1/2) ~ (R*)^(-1/2), exact columnar equilibrium radius R_0(R*) (grason2007/columnar_equilibrium_radius_muc) monotonically decreasing with R* (local log-slope d(log R_0)/d(log R*) in [-0.144, 0], falling from lambda_{3 perp}(R*_c) to (16/27)*lambda_{3 perp}(R*_c) as R*/R*_c -> oo), columnar low-Sigma and solid shear-regime radii independent of R* (slope 0), and solid bending-regime radius decreasing as (R*)^(-1/5) (slope -0.2). None reproduces Claessens's observed positive growth D ~ (R*)^(+0.3) (diameter_scaling_Rstar; Fig. 1C fit slope +0.327). Only under the non-standard assumption of R*-independent surface tension Sigma (with mu_perp, mu_par, gamma ~ R*) does grason2007/solid_radius_shear_regime yield R_0 ~ (R*)^(+1/3), outside its R_0 >> lambda_{3 perp} validity regime and inconsistent with Grason's Sigma ~ Delta E*/(d*l) scaling. (2) Saturation spacing and bundle diameter: Claessens's 1:4.5 saturation stoichiometry with d = 2.9 nm gives mean axial fascin spacing per filament l_fil = 4.5*2.9 = 13.05 nm, closely matching the SAXS inter-filament spacing a_H = 12.4 nm (supporting Grason's saturated-linker estimate l ~ d in grason2007/saturated_linker_spacing, though per-neighbor-pair spacing is u*d ~= 39.2 nm). Inserting Claessens's d = 12.4 nm and Delta G/(k_B T) = 15.02 (binding_energy_fascin_sign_corrected) into grason2007/lambda_3perp_microscopic gives columnar onset diameter 2*lambda_{3 perp} = 57.5 nm at l_p = 1 um (closely matching Claessens's hydrated 2-shell SAXS diameter 50-57 nm, area-equivalent 56.8 nm for n_f = 19), but 182-237 nm at realistic F-actin persistence lengths l_p = 10-17 um (3-4x larger than the hydrated diameter and 6-8x larger than the TEM plateau 28.2 nm). Because rigid fascin linkers suppress axial sliding, fascin bundles would correspond to Grason's 3D hexagonal-solid phase (Eq. 9), where Ref. 21 (grason2007/solid_to_columnar_radius_ratio) predicts much smaller radii than columnar aggregates.\n"},{"id":"q_grason2007_pitch_and_twist_conventions","kind":"reading","text":"Three incompatible pitch, twist-rate, and angle conventions prevent direct parameter substitution between claessens2008's helical-symmetry models and grason2007's chirality/torsion models: (1) 2*pi cholesteric pitch convention: grason2007 Eq. (3) writes (nabla_perp x t - z_hat/P)^2 without 2*pi, so P = q_0^(-1) is an inverse twist wavenumber (inferred as P ~ 1-10 nm from Ikawa et al.'s 2*pi/Omega ~ 100 nm; see grason2007/q_audit_cholesteric_pitch_2pi_convention). The corresponding full 2*pi cholesteric pitch is 2*pi*P ~ 6-60 nm, overlapping F-actin's two-start long-pitch helical repeat in claessens2008 (13*d = 37.7 nm half-pitch / 75.4 nm full pitch for -13/6; 14*d = 40.6 nm / 81.2 nm for -28/13), whereas Claessens's helical_symmetry_ratio M = p/s counts monomers per left-handed genetic turn rather than a cholesteric pitch. (2) Internal overtwist rate vs. bundle braiding rate: claessens2008's -13/6 -> -28/13 transition gives Delta_theta = 0.989 deg = 0.01726 rad per monomer (d = 2.9 nm), an internal single-filament overtwist rate omega_fil = Delta_theta/d = 0.00595 nm^-1 (full overtwist wavelength 2*pi/omega_fil = 1056 nm), an order of magnitude smaller than the whole-bundle braiding rate Omega = 2*pi/(100 nm) = 0.0628 nm^-1 from Ikawa et al. used in grason2007/cholesteric_pitch_from_torsion. (3) Angle symbol theta: claessens2008 uses theta_0, theta_1, Delta_theta (printed in degrees, converted to radians in E_twist) for monomer-to-monomer azimuthal rotation about the single-filament axis, whereas grason2007 uses theta = Omega*R (dimensionless radians) for the tilt angle of outermost braided filaments relative to the bundle centerline.\n"},{"id":"q_grason2007_no_cross_validation","kind":"unstated_model","text":"No cross-record validations are entered in validations.yaml for claessens2008 models against grason2007 data, because grason2007 is a pure theory paper with only two reported experimental measurements (both from cited counterion-condensation studies) and none of claessens2008's models predicts either measurement on its own conditions: (1) grason2007/factin_diameter_lai2007 (40 to 100 nm, origin: reported, Lai et al. 2007 [ref-12 in both papers], nontoroidal multivalent-counterion F-actin bundles): although claessens2008 (p. 3) suggests that helical-packing frustration explains finite sizes for F-actin bundled by ABPs or condensing agents (citing ref-12), none of claessens2008's three models outputting bundle_diameter can validly test this scalar range: gaussian_tem_profile_fit is non-runnable and fits TEM image profiles rather than predicting bundle width; diameter_scaling_Rstar (D ≈ (R*)^0.3, role: fit, prefactor: unknown) is an empirical fascin fit requiring bound fascin ratio R*, which is undefined for Lai et al.'s counterion-condensed bundles (no fascin), and carries an unknown prefactor; and diameter_filament_scaling (D ≈ n_f^(1/2), prefactor: unknown) requires filament count n_f, which is unstated in grason2007 for Lai et al. (substituting Claessens's fascin saturation n_f = 20 would conflate fascin bundles with more tightly packed counterion bundles), and lacks a dimensional lattice-spacing prefactor (so any single scalar datum fixes the unknown prefactor and yields no verdict). hexagonal_shell_filaments outputs dimensionless D_fil = 2*k + 1 (filaments across) rather than bundle_diameter in nm (no model in claessens2008 multiplies D_fil or n_f^(1/2) by a_H to predict a dimensional diameter in nm; qualitatively, Claessens's hydrated 2-shell fascin width 50-57 nm falls within 40-100 nm while its TEM plateau ~28 nm lies below it). (2) grason2007/factin_twist_pitch_ikawa2007 (~100 nm, origin: reported, Ikawa et al. 2007 [ref-21 in claessens2008, ref-22 in grason2007], braided bundles of 2-3 F-actin filaments in Mg2+): claessens2008 has no model outputting whole-bundle helical braiding pitch (bundle_twist_pitch = 2*pi/Omega); its helical models (helical_symmetry_ratio, helical_overtwist_from_symmetry) describe internal single-filament crystallographic overtwist (-13/6 -> -28/13, Delta_theta = 0.989 deg per monomer, internal overtwist wavelength 2*pi*d/Delta_theta = 1056 nm, an order of magnitude longer and physically distinct from whole-bundle braiding; see q_grason2007_pitch_and_twist_conventions), and \"~100\" carries no printed precision. (3) Non-measured entries in grason2007/data.yaml: factin_chain_spacing (~1 to 10 nm), factin_linker_binding_energy_kBT (~10), and factin_persistence_length (~1 to 10 um) have origin: estimated (order-of-magnitude literature input assumptions, not measurements; note that claessens2008's SAXS-derived aH_hex_saxs = 12.4 nm from hexagonal_lattice_spacing on Claessens's own q10_saxs and DeltaG_fascin_sign_corrected_pred = 15.02 k_B T from Kd_fascin = 0.3 uM lie just above those generic F-actin estimates), while factin_lambda_3perp_est (~100 nm), factin_cholesteric_pitch_est (~1 to 10 nm), and factin_stability_threshold (≳ 1) are grason2007 model predictions (origin: predicted) with no matching output quantity in claessens2008.\n"},{"id":"q_dutta2016_no_cross_validation","kind":"unstated_model","text":"No cross-record validations are entered in validations.yaml for claessens2008 models against dutta2016 data, because dutta2016 is a pure theory paper with zero origin: measured entries and none of claessens2008's 28 runnable models predicts any reported or predicted datum of dutta2016: (1) The only two physical literature values in dutta2016/data.yaml are both origin: reported citations from Borukhov et al. (2005) [dutta2016/ref-11] printed with approximate \"~\" precision: (a) dutta2016/screening_length_actin (~1 nm, screening_length_physical): claessens2008 has no electrostatic or Debye screening-length model or quantity, and explicitly argues on p. 1 that electrostatic repulsion across fascin-spaced filaments (interfilament_sep_fascin ~= 5 nm, aH_hex_saxs = 12.4 nm) is too short-ranged to affect bundle assembly (confirming thickness invariance when reducing salt to mgcl2_min_conc = 2 mM MgCl2). (b) dutta2016/filament_thickness_actin (~8 nm, typed in dutta2016 as in_plane_radius_of_gyration by qualitative analogy between sqrt(L/(beta*epsilon)) and single-filament thickness): claessens2008 has no model predicting single-filament diameter or single-chain radius of gyration. All [length]-outputting models in claessens2008 describe multi-filament fascin bundles (diameter_scaling_Rstar and diameter_filament_scaling, both prefactor: unknown; non-runnable gaussian_tem_profile_fit), center-to-center hexagonal lattice spacing including ~5 nm fascin bridges (hexagonal_lattice_spacing, a_H = 12.4 nm from q_10), or total F-actin contour length inside an emulsion droplet (droplet_ring_filament_number, L). Moreover, \"~8\" carries no printed precision and is a cited literature value rather than a measurement of dutta2016. f":null},{"id":"single_species_potential_eq10","name":"dimensionless Hamiltonian oscillator potential for Hill active stress (Eq. 10)","relations":[],"role":"model","variant_of":null},{"id":"single_species_rda_dispersion_eq15","name":"single-species reacting active-fluid dispersion relation (Eq. 15, N = 1)","relations":[{"kind":"same_as","other":"hannezo2015/dispersion_relation_eq7","stated":false,"status":"verified"}],"role":"model","variant_of":null},{"id":"single_species_stability_boundary_hill","name":"single-species linear stability boundary for Hill active stress (Fig. 3b)","relations":[{"kind":"scales_as","other":"hannezo2015/finite_domain_bifurcation_threshold","stated":false,"status":"verified"}],"role":"model","variant_of":null},{"id":"single_species_steady_state_eq9","name":"single-species nonhomogeneous periodic steady-state BVP solver (Eqs. 4, 6, 8, 9)","relations":[],"role":"model","variant_of":null},{"id":"single_species_steady_state_profile_eq9","name":"single-species steady-state spatial profile evaluator (Eqs. 6, 8, 9, Fig. 1)","relations":[],"role":"model","variant_of":null},{"id":"steady_flux_eq5","name":"constant steady-state regulator flux from integrated conservation law (Eq. 5)","relations":[],"role":"model","variant_of":null},{"id":"steady_flux_eq7","name":"constant steady-state regulator flux from boundary jumps (Eq. 7)","relations":[],"role":"model","variant_of":null},{"id":"steady_velocity_eq8","name":"steady-state active fluid velocity (Eq. 8)","relations":[],"role":"model","variant_of":null}],"of":[],"questions":[{"id":"q_asdm_species1_convention","kind":"unstated_input","text":"Eq. (15) defines Pe = (zeta*Delta_mu)_0 / (D_1 * gamma) in terms of the diffusion coefficient of \"species 1\", without explicitly stating whether species 1 in the ASDM (Fig. 5) is the substrate s (D_1 = D_s) or the activator a (D_1 = D_a). Numerical checks of Eq. (15) against Fig. 5(b)-(d) (together with tau_D = ell^2 / D_s in Fig. 5(c)'s caption) show that the paper uses D_1 = D_s; taking D_1 = D_a shifts the Pe = 7 Region I/II boundary at rho_s = 2 from D_a/D_s = 0.84 down to ~0.15 and leaves the 'x' point in Fig. 5(b) linearly stable at Pe = 7.\n"},{"id":"q_asdm_rate_nondim","kind":"unstated_input","text":"Fig. 5(a)-(b) specify rho_a = 1 and plot rho_s in [0, 2] without stating in the text or caption how the chemical rate constants rho_a and rho_s are nondimensionalized. For Pe = 0 (Fig. 5a) the stability regions depend only on rho_s/rho_a and D_a/D_s, whereas for Pe > 0 (Fig. 5b-d) the active term introduces the length scale ell, requiring rho_a and rho_s to be nondimensionalized by tau_D = ell^2 / D_s (i.e. rho_a * ell^2 / D_s = 1), which matches Fig. 5(b)-(d).\n"},{"id":"q_fig5_marker_coords","kind":"unstated_input","text":"Fig. 5(c) and Fig. 5(d) refer to parameter combinations given by the 'x' marker in Fig. 5(b) and the '+' marker in Fig. 5(a) without printing their numerical (D_a/D_s, rho_s) values in the text or caption, nor stating the periodic domain length L/ell used in Fig. 5(d) (visible on the x/ell axis as 20). Added values D_a/D_s = 0.5, rho_s = 1.5, and L/ell = 20 reproduce the dispersion curves in Fig. 5(c) and the 3-peak steady state in Fig. 5(d).\n"},{"id":"q_fig2a_domain_unstated","kind":"unstated_input","text":"Fig. 2(a)'s caption does not print the Peclet numbers (shown in the plot legend as Pe = 3, 7, 10 and printed in Fig. 3(a)'s caption) or the domain length L/ell and boundary condition for the Pe = 10 nonhomogeneous steady state. Numerical solution of Eqs. (9)-(10) confirms that L/ell = 2*pi with periodic boundary conditions (matching Figs. 1 and 3a) reproduces the Pe = 10 potential curve and its shifted minimum at u < ln(c0).\n"},{"id":"q_fig5_region_iii_complex","kind":"possible_error","text":"Fig. 5(a)'s caption defines Region III as \"lambda(k) is real and positive with maxima at k = 0 and some k != 0\" and Region I as \"lambda(k) is real and positive with |k_max| > 0\". Directly evaluating Eq. (15) shows that for (3 - 2*sqrt(2))*rho_a < rho_s < rho_a (i.e. 0.1716 < rho_s < 1 at rho_a = 1), the leading eigenvalue at k = 0 is a complex conjugate pair (Im[lambda(0)] != 0, Re[lambda(0)] = (rho_a - rho_s)/2 > 0). In Region III, Re[lambda(k)] has maxima at k = 0 (complex) and at some k != 0 (real and positive); similarly in the rho_s < 1 portion of Region I at Pe = 7, lambda(k) is complex near k = 0 and real and positive at k_max != 0.\n"},{"id":"q_pde_numerics_unstated","kind":"numerics","text":"The paper presents numerical steady states (Figs. 1, 2b, 5d) and time-dependent PDE integrations (Fig. 4) without stating the numerical discretization scheme, spatial grid size, time step, solver tolerances, or initial symmetry-breaking perturbations used to depart from the homogeneous steady state (nor the integration duration in text, though Fig. 4 plots t/tau_D in [0, 20]). Our record uses fixed-step RK4 shooting (Eq. 9) and dealiased pseudospectral ETDRK2 PDE integration (Eqs. 1-3, 14) with explicit grid/timestep refinement checks in refinements.yaml.\n"},{"id":"q_no_dimensional_params","kind":"unstated_input","text":"Although motivated by the actomyosin cell cortex [6, 7], the paper prints no dimensional values for viscosity eta, friction gamma, diffusivity D, or active stress (zeta*Delta_mu)_0; every numerical example is dimensionless. Runs of the dimensional models use representative cortical-scale added inputs chosen to give ell = 10 um and Pe = 25 (with plausible order-of-magnitude alternatives).\n"},{"id":"q_extrema_count_periodic","kind":"reading","text":"Page 2 states that oscillations of period 2*L/N (N/beta in Z>0) yield \"N + 1 evenly spaced symmetric extrema\". On the closed interval [0, L] with an extremum at x = 0 repeated at x = L, there are N + 1 extrema (for periodic BCs beta = 2, N = 2 gives 1 peak and 2 endpoint valleys on [0, L]), whereas on the periodic circle (0 = L) there are N distinct extrema (N/2 maxima and N/2 minima).\n"},{"id":"q_audit_asdm_pde_grid_negativity","kind":"reading","text":"Disagreement with the first reader's default grid choice n_grid = 64 in asdm_pde_eq14 and refining only a_max in ref_asdm_pde_fig5d_ngrid. On L/ell = 20 with three sharp activator peaks (Fig. 5d), n_grid = 64 produces an unphysically negative activator minimum a_min_fig5d_pred = -0.00575 due to spectral Gibbs undershoot (and an 8.2% underprediction of s_min: 0.09142 vs. 0.09959 at n_grid = 128 and 0.09956 at n_grid = 256), whereas a_min becomes positive (+0.00273 at n_grid = 128, +0.00268 at n_grid = 256) once n_grid >= 128. Also, the 2/3 dealiasing cutoff fully dealiases quadratic advection terms (V*a, V*s) but not the cubic reaction term a^2 * s. A default grid of n_grid >= 128 and a refinement check on a_min or s_min would avoid negative concentrations.\n"},{"id":"q_audit_pde_hardcoded_initial_conditions","kind":"reading","text":"Disagreement with hardcoding initial-perturbation modal shapes inside single_species_pde_eq1_3/model.py and asdm_pde_eq14/model.py rather than exposing them in added.yaml with alternatives. (1) In single_species_pde_eq1_3, the mode-1 symmetry-breaking ratio (0.1 * eps * cos(2*pi*X/L + 0.5)) is hardcoded; lowering this ratio to 1e-5 (still a small symmetry-breaking perturbation) leaves n_peaks_final = 2 at T_end = 20, reversing cmp_final_peak_count_fig4 (and ratio 0 stays 2-peaked indefinitely by symmetry), consistent with the paper's note on p. 3 about long-lived multipeaked profiles. (2) In asdm_pde_eq14, a pure 3-mode perturbation cos(3*2*pi*X/L) is hardcoded, enforcing 3-fold symmetry so n_peaks = 3 at T_end = 40; by Eq. (15) at (D_a/D_s, rho_s) = (0.5, 1.5), Pe = 7, L/ell = 20, mode n = 4 grows faster linearly (Re[tau_D lambda] = 0.7825 vs. 0.6665 for n = 3) and remains 4-peaked at T_end = 40 before coarsening to 3 peaks by T ~ 200.\n"},{"id":"q_audit_exact_bc_added_alternatives","kind":"reading","text":"Disagreement with placing exact mathematical consequences of the paper's stated boundary and homogeneity conditions (sigma(L) - sigma(0) = 0, c(L)/c(0) = 1 for periodic BCs on p. 2; d_x u = 0 for the homogeneous steady state on p. 1) in added.yaml with nonzero or non-unit alternatives (1e-6 Pa, 1.001/0.999, +/-100 1/m). Those alternatives violate the stated periodic or homogeneous assumptions rather than representing plausible alternative parameter choices, which can falsely make exact identities (cmp_j0_steady_periodic and cmp_v_homog_steady) appear sensitive to unstated inputs.\n"},{"id":"q_audit_fig5a_L_over_l_irrelevant","kind":"possible_error","text":"Fig. 5(a)'s caption (p. 4) states that the Pe = 0 (absence of flow) ASDM linear stability diagram is drawn \"assuming L/ell >> 1\". However, when Pe = 0, active stress vanishes and the hydrodynamic length ell = sqrt(eta/gamma) drops out of Eq. (15) completely (A_ij = -k^2 D_i delta_ij + d_{c_j} R_i(c_0)). The continuum-wavenumber assumption required for Fig. 5(a) is instead that the domain size L is much larger than the reaction-diffusion length scale sqrt(D_s / rho_s), whereas L/ell >> 1 becomes relevant only when Pe > 0 (Fig. 5b).\n"},{"id":"q_fig5d_substrate_rho_s_mismatch","kind":"possible_error","text":"Calibrated digitization of Fig. 5(d) reveals a major quantitative mismatch between the printed steady-state profiles and Eq. (14) evaluated at the 'x' parameters from Fig. 5(b) (D_a/D_s = 0.5, rho_a = 1, rho_s = 1.5, Pe = 7, L/ell = 20): Eq. (14) predicts a substrate plateau s_max = 2.038 (min s_min = 0.100) and activator peak a_max = 5.167, whereas Fig. 5(d) plots s_max = 1.400 +/- 0.052 (min s_min = 0.126) and a_max ~ 5.44 (peak width at a = 5 is 0.201 vs. 0.131 for rho_s = 1.5). Varying L/ell or D_a/D_s at rho_s = 1.5 cannot reconcile s_max and a_max simultaneously; however, setting rho_s = 1.0 (keeping rho_a = 1, D_a/D_s = 0.5, Pe = 7, L/ell = 20) reproduces all three plotted profiles simultaneously to < 0.5% (s_max = 1.402, s_min = 0.125, a_max = 5.424, half-width at a = 5 is 0.197, v/U_max = 0.253). Because Fig. 5(b)'s 'x' centroid is unambiguously (0.5002, 1.5002) and Fig. 5(c)'s curves start at tau_D*lambda(0) = (rho_a - rho_s)/2 = -0.25 (confirming rho_s = 1.5 in Figs. 5b-c), Fig. 5(d) appears to have been generated with rho_s = 1.0 (e.g. omitting the rho_s prefactor in R_s = rho_s*(1 - a^2*s) or using an earlier parameter point).\n"},{"id":"q_fig5b_finite_k_grid","kind":"numerics","text":"Calibrated 1200-dpi measurement of Fig. 5(b) (Pe = 7, rho_a = 1) shows that while the Region I/II Turing boundary (rho_s > 1) agrees closely with continuum Eq. (15) (e.g. D_a/D_s = 1.028 at rho_s = 1.5), the Region I/III vertical boundary lies at D_a/D_s = 0.7082 rather than the continuum small-k limit Pe/4 - 1 = 0.75, and the bottom boundary of Region III slopes downward from rho_s = 0.222 (at D_a/D_s = 0.8) to 0.210 (at D_a/D_s = 1.9) rather than lying flat at 3 - 2*sqrt(2) = 0.1716 as in Fig. 5(a) (measured 0.1717). Both shifts match Eq. (15) evaluated on a discrete wavenumber grid with minimum nonzero wavenumber k_1*ell = pi/20 = 0.15708 (predicting vertical line D_a/D_s = 7/(4*(1 + (pi/20)^2)) - 1 = 0.7079 and bottom boundary rho_s = 0.2226 -> 0.2101), indicating that Fig. 5(b) was computed with a finite wavenumber step Delta_k*ell = pi/20 (equivalent to L/ell = 20 no-flux or L/ell = 40 periodic) rather than the continuum L/ell >> 1 limit.\n"},{"id":"q_fig5_markers_calibrated","kind":"reading","text":"Settles q_fig5_marker_coords via calibrated 1200-dpi centroid measurements (axis residuals 0.17 px horizontal, 0.00 px vertical): the 'x' marker in Fig. 5(b) lies at (D_a/D_s, rho_s) = (0.5002, 1.5002), confirming (0.5, 1.5) and reproducing all three solid dispersion curves (Pe = 0, 25, 50) in Fig. 5(c); the '+' marker in Fig. 5(a) lies at (0.0752, 1.5000), confirming (0.075, 1.5) and reproducing the dashed Pe = 0 reference dispersion curve in Fig. 5(c).\n"},{"id":"q_hannezo2015_no_cross_validation","kind":"unstated_input","text":"No cross-record validations are entered in validations.yaml for bois2011 models against hannezo2015 measurements (0 entries in both directions): bois2011 is a pure theory paper with 0 origin: measured entries out of 53 total data (32 predicted, 18 reported dimensionless inputs or BCs, 3 derived identities), so hannezo2015 has no bois2011 measurements to test against; and although hannezo2015 cites bois2011 (ref-10) and shares verified same_as ModelAtlas families (hydrodynamic_length, diffusive_timescale, peclet_number_physical, and single_species_rda_dispersion_eq15 <-> hannezo2015/dispersion_relation_eq7), none of bois2011's 26 models genuinely predicts any of hannezo2015's 35 origin: measured data on their own experimental conditions: (1) Wild-type embryonic ring count hannezo2015/rings_per_cell_embryo_wt (\"15 to 20\", stage 16): (a) single_species_fastest_mode (output n_max, quantity fastest_growing_mode) does not match either the quantity or the constitutive/input conditions: n_max is the transient linear fastest-growing Fourier mode index rather than Bois's steady-state peak count (p. 3 explicitly shows multipeaked transients are unstable and coarsen to 1 peak), and under a single cell's physical no-flux BCs (beta = 1, cos(n*pi*x/L)) mode n corresponds to n/2 rings rather than n (cf. hannezo2015/finite_domain_critical_mode, n_rings = i_c/2). Furthermore, single_species_fastest_mode hardcodes Hill saturating stress f(c) = c/(1+c) with unmeasured saturation ratio c_0 (max c_0*f'(c_0) = 1/4 at c_0 = 1, Pe_crit = 4.0002 at L/ell = 480), whereas hannezo2015 uses linear active stress (c_0*f'(c_0) = 1) and never directly measures active stress, friction, Pe, or L/ell (its SI alpha_sim_si = 480 and chi_c_sim_si = ~1.07 / chi_plateau_si = 1.47 are inverted from ring_wavelength_embryo_wt via Hannezo's finite-turnover Eqs. 10-11, differing 5x-10x from Main text literature alpha = 100 and Pe = 2.5). Passing either Pe = 1.47 (chi_plateau_si) or Pe = 2.5 (Main+SI literature stress/friction) gives Pe_eff <= 0.368 or 0.625 < 1 and n_max = 0 for all c_0 > 0; artificially rescaling Pe = 4*chi at c_0 = 1 gives n_max = 70 (35 rings, beta = 1) or 35 (beta = 2) at chi = 1.47, 28 (14 rings) at onset chi_c = 1.07 (purely circular from Hannezo's turnover-fitted phi = 0.0014), 24 (12 rings) at Main-text alpha = 100, Pe = 10, and 187 (93.5 rings) at Bois's Pe = 25. (b) single_species_pde_eq1_3 (output n_peaks_final, quantity peak_count) assumes zero turnover (tau -> oo, contradicted by measured turnover_time_frap = 15 +- 7 s), periodic BCs, hardcoded Hill stress f(c) = c/(1+c), and a Fig. 4-specific mode-2 + mode-1 initial condition; with hannezo2015's chi_plateau_si = 1.47 it is linearly stable (n_peaks_final = 0), while at rescaled Pe = 5.88 on L/ell = 480 the diffusive timescale tau_D = ell^2/D = 2.5 ms places the 3000 s experiment at T_end = 1.2e6 (giving n_peaks_final = 0 at T_end = 20, and exponentially arrested multi-peak states such as n_peaks_final = 6 at alpha = 100, Pe = 10, T_end = 500-2000). (c) asdm_pde_eq14 (output n_peaks) models a 2-species autocatalytic Turing reaction (a^2*s - a, 1 - a^2*s) whose parameters (Da/Ds, rho_a, rho_s) do not exist in hannezo2015's single-species first-order actin turnover system. (2) ECM-depleted kkv1 mutant ring count hannezo2015/rings_per_cell_kkv1 (\"~1\", stage 16): hannezo2015 measures zero mechanical or transport inputs for kkv1 (no friction xi, viscosity eta, hydrodynamic length l_h, cell length l, L/ell, D, active stress, Pe, or c_0), so running single_species_fastest_mode or single_species_pde_eq1_3 against rings_per_cell_kkv1 would use 0/4 or 0/5 inputs from kkv1. Moreover, kkv1's ~1 ring/cell arises physically from drastically lowered friction (xi -> 0 pushing finite-turnover lambda_c > l) while retaining active turnover and displaying non-stationary chaotic ring motility (Fig. 4A'-B, Movie S3), NOT from Bois's zero-turnover (tau -> oo) coarsening at finite friction to a stationary single peak. (3) All 10 measured ring/taenidial wavelengths (ring_wavelength_embryo_wt, ring_wavelength_si_input, ring_wavelength_larva_wt_early, ring_wavelength_larva_wt_fig1c, ring_wavelength_src42, taenidial_wavelength_moesin_rnai, taenidial_wavelength_larva_wt_late, ring_wavelength_kkv1, fig3b_bar_ring_spacing_data, figs2d_moesin_rnai_spacing_data): bois2011 has no model outputting a dimensional pattern wavelength ([length]); its only [length]-valued output is hydrodynamic_length (ell = sqrt(eta/gamma), velocity screening length, not ring period lambda), while discrete_wavenumber, single_species_fastest_mode, and asdm_stability_boundary output dimensionless k*ell. Moreover, bois2011's zero-turnover single-species model has no finite onset wavelength (k_c = 0), and hannezo2015 measures no cortical mechanical inputs for larval, Src42A, moesin RNAi, or kkv1 conditions. (4) All 6 FRAP measurements (turnover_time_frap = 15 +- 7 s, diffusion_coeff_frap = 0.04 +- 0.03 um^2/s, immobile_fraction_frap < 20%, frap_sample_size = 10, fig2a_frap_recovery_data, fig2a_frap_variance_data): D and dR/dc = -1/tau are strictly model inputs in bois2011 (never predicted outputs), and bois2011 has no FRAP photobleaching recovery, variance-moment, or immobile-fraction model (its only [time] output is diffusive_timescale tau_D = ell^2/D). (5) All 7 developmental actin-recruitment measurements (actin_increase_onset_text, actin_increase_onset_fig1a, fluorescence_onset_si, fluorescence_plateau_si, fig1a_actin_intensity_data, ring_onset_time_range, ramp_duration_si): bulk temporal actin upregulation is an external developmental control ramp rather than an active-fluid output (bois2011 Eqs. 1-13 conserve mean concentration c_0 = const and do not model developmental timing or fluorescence intensity). (6) All 7 tube-geometry, gamma-COP, and constriction measurements (cop_het_diameter_change, cop_het_actin_change, cop_hom_diameter_change, cop_hom_actin_change, fig4f_cop_actin_vs_diameter_data, side_branch_diameter_ratio, fig3c_kkv_diameter_vs_actin_data): bois2011 is a flat 1D constant-thickness thin-film theory with no cylindrical tube diameter, radial Laplace constriction, apical secretion, or branching. (7) Remaining 3 spectral/distributional measurements (fig1c_fourier_spectrum_data, fig3b_dist_wt_data, fig3b_dist_src42_data): all bois2011 models are deterministic and output no dimensional line-scan Fourier amplitude spectrum or ring-spacing probability histogram. (8) Finally, none of the shared same_as family outputs (hydrodynamic_length, growth_rate in Eq. 15, diffusive_timescale, peclet_number) has an origin: measured datum in hannezo2015 (lh_derived_main, lh_inverted_si, and chi_plateau_si are derived; chi_c_order_si and chi_c_sim_si are predicted).\n"}],"takes_from":[],"tally":{"close":0,"error":0,"no verdict":0,"not reproduced":1,"reproduced":34},"title":"Pattern Formation in Active Fluids","variants":[],"venue":"Phys. Rev. Lett. 106, 028103 (2011)","verdicts":[{"comparison":"cmp_fig1a_mass_conservation","computed":"1","page":2,"printed":"1","purpose":"consistency","verdict":"reproduced"},{"comparison":"cmp_fig1b_mass_conservation","computed":"1","page":2,"printed":"1","purpose":"consistency","verdict":"reproduced"},{"comparison":"cmp_fig4_mass_conservation","computed":"1","page":2,"printed":"1","purpose":"consistency","verdict":"reproduced"},{"comparison":"cmp_asdm_a0","computed":"1","page":3,"printed":"1","purpose":"reproduction","verdict":"reproduced"},{"comparison":"cmp_asdm_s0","computed":"1","page":3,"printed":"1","purpose":"reproduction","verdict":"reproduced"},{"comparison":"cmp_fastest_mode_fig4","computed":"2","page":3,"printed":"2","purpose":"reproduction","verdict":"reproduced"},{"comparison":"cmp_fig1a_c","computed":"[0.001053, 0.003223, 0.0154, 0.1938, 0.911, 3.454, …]","page":2,"printed":["0.001952 [-0.07338, 0.07728] read by the record's code read from Fig. 1(a)","0.001952 [-0.07338, 0.07728] read by the record's code read from Fig. 1(a)","0.01757 [-0.05
