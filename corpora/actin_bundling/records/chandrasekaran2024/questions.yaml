    where: "Results, Weakening filament bundling results in the loss of rings"
  text: >
    Comparing polymerization kinetics, bundling mechanisms, and VASP domain requirements between
    chandrasekaran2024 (3D droplets) and nastkolb2022 (2D supported lipid bilayers) reveals four
    major mechanistic contrasts that explain why their models cannot be mapped directly:
    (1) Crosslinking residence time vs active polymerization-driven feedback: chandrasekaran2024's
    CytoSim model decouples filament elongation (deterministic constant speed k_grow = 10.3 nm/s
    baseline, swept 10.3-618 nm/s via T_2piR = 600..10 s in Fig. 5, without coupling elongation
    speed to local VASP binding despite noting <=3x speedup from ref-18) from passive multivalent
    crosslinking (Bell slip-bond residence time tau_res = 1/k_unbind), concluding that kinetic
    trapping is governed primarily by (k_bind, k_unbind) and that *slower* elongation (larger
    T_2piR) improves ring formation probability and reduces replicate heterogeneity. Conversely,
    nastkolb2022 (operating in 10 uM profilin + 50 nM capping protein to suppress bulk assembly)
    shows that active VASP-mediated barbed-end elongation on a fluid membrane is strictly required
    for 2D bundling: passive cross-linking of pre-polymerized F-actin by VASP (Fig. S4D-E),
    alpha-actinin1b alone, mDia1 alone, and mDia1 + alpha-actinin1b all fail to produce thick
    aligned bundles; instead, a positive feedback loop concentrates mobile VASP onto wider bundles
    to capture and elongate barbed ends at bundle edges (Fig. 2F, 5D), while 4x reduced mobility on
    monolayers slows VASP-mediated polymerization below free growth and lets CP abolish bundling.
    (2) Construct & GAB domain roles (WT/GABmut human VASP vs chimeric Dictyostelium-GAB VASP):
    chandrasekaran2024 uses wild-type human VASP and mutates the GAB site (VASP-GABmut, RK236,237EE)
    as a tool to weaken filament bundling/residence time (shifting Actin:VASP = 1:7.5 droplets from
    70 +/- 13% disks [WT] to <10% disks, 53 +/- 6% rings, and 37 +/- 4% shells [GABmut], Fig. 6D),
    interpreting the phenotype purely through elevated k_unbind (Fig. 6B). By contrast, nastkolb2022
    uses chimeric human VASP carrying the high-affinity Dictyostelium discoideum GAB domain
    (p. 10, q_chimeric_vasp_construct_and_ml_substrate) specifically to achieve strong processive
    elongation; because GAB mediates both barbed-end monomer delivery and F-actin affinity/capture
    (Hansen & Mullins 2010, cited by both papers), VASP-GABmut in chandrasekaran2024 likely
    perturbs both elongation kinetics and effective crosslinker residence time simultaneously.
    (3) FAB domain vs tetramerization (valency = 4 vs monomeric VASP_DeltaTetra): both studies
    confirm FAB is indispensable (FAB mutation abolishes peripheral actin localization in 3D
    droplets [p. 7, ref-15]; FAB-less mDia1 fails to bundle on 2D bilayers [nastkolb2022 p. 6]).
    However, tetramerization plays sharply different roles: chandrasekaran2024's CytoSim mechanism
    strictly requires tetrameric multivalency (valency = 4; Fig. 3D shows rings require VASP
    tetramers bound to >=3 filaments), whereas nastkolb2022 demonstrates that monomeric
    VASP_DeltaTetra (truncated at residue 270, valency = 1) still self-concentrates on fluid SLBs
    and builds thick actin bundles (median 0.584 um vs 0.942 um for tetrameric VASP at 0.25 uM,
    with 99th-percentile widths reaching 3.09-3.2 um vs 2.48-3.0 um, Fig. 3A, 3F) because 2D
    membrane confinement + lateral mobility substitutes local surface density for covalent
    tetramerization.
    (4) Actin-concentration response: in chandrasekaran2024 experiments (Fig. 6D, 20 uM VASP monomer,
    no CP/profilin), raising bulk actin from 1 to 2.67 uM drives monotonic progression from shells to
    rings and deformed disks (whereas in CytoSim Supp. Fig. 11D at fixed [VASP-tet], raising
    N_fil = 30 -> 165 shifts networks toward locally bundled diffuse states inversely with
    [VASP-tet]); in nastkolb2022 (Fig. S3F, 0.25 uM VASP, 50 nM CP, 10 uM profilin), raising bulk
    actin across 0.5, 1, 2, 4 uM yields non-monotonic median widths (0.574, 0.770, 0.942, 0.812 um)
    as halving R_CP from 0.025 to 0.0125 at 4 uM promotes unaligned growth.

