  citation:
    page: 8
    printed_page: "8"
    quote: "when the major axis of the ellipse equals the"
    where: "Results (pp. 3, 8), Discussion (p. 9) & Supp. Table 2 (pp. 17-18) vs weirich2017"
  text: >
    Quantitative biophysical regime contrast between chandrasekaran2024 (3D VASP protein droplets
    confining elongating F-actin into shells, rings, and disks) and weirich2017 (liquid-crystalline
    nematic F-actin + filamin tactoids):
    (1) Inverted phase-separation architecture (VASP-droplet-confining-actin vs actin-as-the-droplet):
    in weirich2017, pre-polymerized short rigid F-actin rods (L_f ~ 180 nm, range 0.1-1 um << l_p
    ~ 10 um, capped with 0.25-1.5 mol% capping protein) ARE themselves the phase-separating liquid
    phase, condensed ~100-fold from 2.6 uM bulk into ~250 uM (10.5 mg/mL, mesh size xi ~ 0.093 um,
    aligned inter-filament spacing ~50 nm) nematic tactoids by long (~150 nm), flexible, transient
    filamin dimers (2.5-15 mol%). By contrast, in chandrasekaran2024, 20 uM VASP + 3% PEG8k forms
    an isotropic liquid protein condensate (R_drop = 1 um, V = 4.19 um^3) that acts as an external
    confining compartment for 30-165 long, actively elongating semiflexible actin filaments (L = 0.1
    -> 6.28 um, l_p = 18.25 um >> R_drop, kappa = 0.075 pN*um^2), reaching an intradroplet actin
    concentration of 27.67 uM (1.16 mg/mL, xi_geom = 0.258 um / xi_Schmidt = 0.278 um) in baseline
    CytoSim — 9.04x lower than Weirich's ~250 uM tactoids (and 138.38 uM in Chandrasekaran's
    nucleator assay, still 1.81x lower) — crosslinked by 4-valent Bell slip-bond VASP tetramers
    (r = 30 nm, f_u = 10 pN, k_unbind = 1e-4..10 s^-1) that kinetically trap shells, rings, and
    frustrated elliptical disks.
    (2) Droplet viscosities and Stokes-Einstein consistency (6x-60x viscosity contrast):
    weirich2017 directly measures internal F-actin FRAP recovery (tau_R ~ 880-900 s, D ~ 3 x 10^-3
    um^2/s) and applies Stokes-Einstein ellipsoid drag (R_H = 22.84 nm at L = 90 nm, r = 3.5 nm) to
    infer an internally consistent internal droplet viscosity eta ~ 3 Pa*s (exact 3.13 Pa*s at 20 C,
    ~3000x water). By contrast, chandrasekaran2024 prescribes a CytoSim droplet viscosity of
    0.5 pN*s/um^2 = 0.5 Pa*s (500x water, 6.0x lower than Weirich's 3 Pa*s) while mislabeling its
    units as '0.5 pN/s um^2' and annotating it '50x water' (0.05 Pa*s, 60.0x lower than Weirich's
    3 Pa*s; q_viscosity_unit_and_50x_water_error), and independently prescribes VASP diffusivity
    D_VASP = 10 um^2/s at r = 30 nm — 688x above D_SE(0.5 Pa*s) = 0.0145 um^2/s (68.8x above
    D_SE(0.05 Pa*s) = 0.145 um^2/s; corresponding to eta = 0.727 mPa*s < water) and ~3,300x faster
    than Weirich's measured F-actin FRAP diffusivity (~0.003 um^2/s).
    (3) Droplet aspect ratios, interfacial tension, and opposite crosslinker responses (2-3
    equilibrium nematic anchoring vs 1.1-5.56 length-limited bending/surface balance):
    weirich2017's nematic droplets possess anisotropic surface anchoring gamma_A = omega*gamma_I
    (omega = 1.1-2.2, gamma_I ~ 300 nN/m — noted on p. 4 as ~10x smaller than conventional protein
    condensates like VASP/P-granules), yielding a volume-independent equilibrium aspect ratio
    L/r = 2*sqrt(omega) ~ 2-3 that DECREASES with crosslinker density (2.5 -> 15 mol% filamin
    rounds tactoids from L/r ~ 3 to ~2 by boosting isotropic cohesion gamma_I faster than gamma_A);
    tactoids coarsen unboundedly (L ~ t^(0.47 +/- 0.01)), relax exponentially after coalescence
    (v_cap = gamma_I/eta = 110-140 nm/s, 10.7-13.6x faster than Chandrasekaran's 10.3 nm/s baseline
    filament elongation), and long (>50 um, R_0 ~ 200 nm) bundles undergo axial Rayleigh-Plateau
    pearling (lambda_max ~ 4 um corrected / ~10 um observed) and 20-60% contraction (v_cap =
    2.5-4.5 nm/s). Conversely, chandrasekaran2024's VASP condensates are purely isotropic
    (omega = 0, spherical equilibrium AR = 1) and deform to AR = 1.1-5.56 (3D straightening ceiling
    pi^(3/2) = 5.568 at L_max = 2*pi*R_drop; 2D continuum ceiling pi^2 = 9.870; LAMMPS 6-20
    filaments AR = 1.08-1.18) ONLY when confined actin-ring bending energy E_bend overcomes
    isotropic droplet surface energy E_surf ~ gamma_I*S(AR), with higher crosslinker stability
    (lower k_unbind, WT vs GABmut) INCREASING ring/disk deformation (until kinetic trapping halts
    unfolding for L_max > pi*R_drop).

