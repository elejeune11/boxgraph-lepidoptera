    page: 9
    printed_page: "9"
    quote: "consistent with our previous energy balance model presented"
    where: "Results (pp. 3, 7-8), Discussion (p. 9), Methods (pp. 10-11) & Supp. Table 2 (pp. 17-18) vs graham2023"
  text: >
    Exhaustive bidirectional cross-record validation audit between chandrasekaran2024 (46 models:
    42 runnable [56 output ports] + 4 non-runnable; 224 datums: 10 origin: measured [4 scalars + 6
    digitized Fig. 6D curves]) and its companion predecessor graham2023 (31 runnable models [40
    output ports], 0 non-runnable; 133 datums: 38 origin: measured [9 scalars + 29 digitized
    figures]; cited as ref-15) yields 0 genuine CrossValidation entries in either direction (no
    chandrasekaran2024/validations.yaml created; graham2023/validations.yaml preserves its existing
    val_ring_filament_count_vs_nastkolb_1um entry unchanged). Note on Synthesis automatic same_as
    cross-checks: although chandrasekaran2024/relations.yaml declares 6 cross-record relations with
    graham2023 (including verified same_as links rel_graham2023_2d_ellipse_max_ar and
    rel_graham2023_2d_ellipse_minor_axis, plus unverifiable stated same_as
    rel_graham2023_2d_energy_balance_stated because droplet_2d_energy_balance is non-runnable),
    Synthesis currently fires 0 automatic cross-checks because none of the scalar runs on those
    two verified same_as models (run_ellipse_2d_max_ar, graham2023/run_ring_rod_ar_max,
    graham2023/run_ellipse_axes_ar15) is paired with a printed scalar comparison in comparisons.yaml
    (both papers print the symbolic identity (a/b)_max = pi^2 without a separate numeric target).
    (1) Direction A — all 42 runnable chandrasekaran2024 models (56 output ports) + 4 non-runnable
    models vs all 38 origin: measured datums in graham2023 (2,128 total port-datum pairs; 817
    dimension-matching pairs = 39 [length] + 4 [length]/[time] + 6 [time] + 768 dimensionless):
    0 valid CrossValidation entries without fabricating unmeasured inputs, circularly re-feeding
    fitted parameters, or validating non-empirical curves.
    - [length]/[time] (4 ports x 1 measured datum: graham2023/elongation_rate_mean_text = '23 +/- 3'
      nm/s, Fig. 5h / p. 9 in 10 uM VASP + 2 uM actin + 1 mM ATP + no EDTA/EGTA):
      (a) elongation_rate_from_growth_time (role: processing, k_grow = (L_target - L0)/T_grow) is
      a simulation-setup arithmetic conversion selecting CytoSim's prescribed input speed so a
      0.1 um seed reaches 2*pi*R_drop = 6.283 um in 600 s (10.305 nm/s, swept 60-fold across
      T_2piR = 10..600 s -> 10.31..618.32 nm/s in Fig. 5), NOT a physical model of VASP-catalyzed
      actin elongation under Graham's linear-rod conditions (where bundles grow straight without a
      2*pi*R length cap and graham2023 states no L_target, L0, or T_grow; diagnostically, baseline
      10.305 nm/s is 2.23x slower than 23 +/- 3 nm/s [-55.2%, -4.23 SD], whereas 23 nm/s corresponds
      to T_2piR = 268.8 s inside Fig. 5's sweep).
      (b) brownian_ratchet_growth_rate (v(f) = k_grow*exp(-f/f_grow), f_grow = 10 pN) requires
      zero-force speed k_grow as an input and an opposing tip load f that graham2023 never measures
      (p. 9 notes elongation is not viscosity-limited; at baseline setup k_grow = 10.3 nm/s, v(f)
      is capped at <= 10.30 nm/s [10.30 / 6.25 / 3.79 nm/s at f = 0 / 5 / 10 pN]; inserting
      Graham's own 23 nm/s at f = 0 is tautological, and solving f for 23 -> 10.3 fabricates
      f = 8.03 pN).
      (c) total_actin_addition_rate (role: processing, 309 nm/s) and
      monomer_depletion_elongation_rate output summed network_elongation_rate across N_fil
      filaments rather than single-bundle tip velocity bundle_elongation_rate.
    - [length] (13 ports x 3 measured datums = 39 pairs) and filament_elongation_length:
      graham2023's only 3 [length] origin: measured datums (droplet_diam_range_obs '1 to 7' um,
      droplet_diam_median_20uM '2.86' um, droplet_diam_max_20uM '7.22' um) measure actin-free
      20 uM VASP droplet diameters, physically distinct from all 13 length outputs (filament_length,
      displacement, spheroid_axis, triangle_edge_length, persistence_length). Importantly,
      graham2023/fig5h_linear_fit_fig (flagged via rel_graham2023_linear_elongation_limit linking
      filament_elongation_length L0 + k_grow*t to linear_bundle_elongation v*t as L0 -> 0) carries
      origin: predicted (NOT origin: measured — it is the plotted dashed regression line y = 0.0227*x,
      representing length increment Delta L(t) from 0 rather than total contour length L0 + k_grow*t;
      individual overlapping experimental traces were omitted during digitization). Diagnostically,
      baseline 0.1 + 0.0103*t gives 0.358..2.057 um vs 0.570..4.241 um across t = 25..190 s (~2x
      too slow), 0.1 + 0.0227*t adds a +0.10 um offset (0.668..4.413 um), and L0 = 0 with fitted
      0.0227 um/s circularly duplicates graham2023/cmp_fig5h_linear_fit_repro on a non-measured
      curve. Likewise, graham2023/actin_lp_table1 (17.73 um) and actin_lp_range_text ('10 to 20' um)
      carry origin: reported (literature Gittes 1993 values, not Graham's measurement; the 2.92%
      offset vs persistence_length_from_rigidity = 18.248 um is audited in
      q_graham2023_fig6d_fig7f_provenance_and_buffer_discrepancies).
    - Aspect ratios (5 dimensionless aspect_ratio ports: filament_length_limited_aspect_ratio,
      ellipse_2d_constant_area, prolate_spheroid_volume_conserving,
      quasistatic_droplet_deformation_schedule, lammps_droplet_aspect_ratio x 4 measured
      droplet_aspect_ratio datums in graham2023):
      fig3g_aspect_ratio_fig (medians 1.020, 1.020, 1.050 vs morphology_category_index),
      fig5a_aspect_ratio_fig (medians 1.044, 1.368, 2.394 vs actin_to_vasp_ratio = 0.05, 0.10,
      0.1333), and edfig9e_aspect_ratio_fig (means 11.52, 1.27, 1.15, 1.06 vs peg_concentration_wv
      = 3, 5, 10, 15%): none of the 5 geometric models accepts morphology index, actin:VASP ratio,
      or PEG concentration as an input, and graham2023 never measures filament contour length L_max
      or paired semi-axes (a, R_drop) for those populations (prolate_spheroid_volume_conserving is
      the algebraic inverse of Graham Methods p. 15 effective_spherical_diameter D = (a*b^2)^(1/3)).
      For linear_droplet_ar_high ('> 15', 10 uM VASP + 2 uM actin), the unbounded inequality yields
      no verdict in BoxGraph AND corresponds to continuously polymerizing rods without a fixed
      L_max = 2*pi*R_drop cap, whereas Chandrasekaran's halted-growth ceilings (3D pi^(3/2) = 5.568,
      2D pi^2 = 9.870) both fall below '> 15' (requiring L_max = 12.16*R_drop [1.94x circumference]
      in 3D or 7.75*R_drop [1.23x] in 2D; even ED Fig. 9e's 3% PEG mean 11.52 +/- 3.97 requires
      1.62x circumference in 3D or 1.08x in 2D).
    - [time] (3 ports x 2 measured datums = 6 pairs) & diffusion (3 [length]^2/[time] ports x 0
      measured datums): bell_slip_bond_unbinding.tau_res, filament_growth_time.t_grow, and
      lammps_md_time_unit_sqrt.tau_MD are unrelated to bare-droplet coalescence
      (vasp_droplet_fusion_time = 'about 1' s, approximate -> no verdict) and bare-droplet FRAP
      (frap_t_half = '18 +/- 3' s, 1.8 um bleach diameter, r_b = 0.9 um). graham2023 never converts
      FRAP to diffusivity D (0 measured [length]^2/[time] datums) and chandrasekaran2024 has 0 FRAP
      models. Diagnostically, 2D Soumpasis conversion of Graham Fig. 1f gives D_Soump =
      0.224*(0.9 um)^2/(18 +/- 3 s) = 0.01008 um^2/s ([0.00864, 0.01210]), remarkably close (1.44x)
      to reconstructed stokes_einstein_diffusion at eta = 0.5 Pa*s, r = 30 nm (0.01454 um^2/s;
      implied eta_eff = 0.721 Pa*s = 721x water), 14.4x slower than literal '50x water' 0.05 Pa*s
      (0.1454 um^2/s), and 992x slower than CytoSim's prescribed vasp_diffusion_rate = 10 um^2/s.
    - Remaining 28 dimensionless measured datums in graham2023 & 4 non-runnable models:
      (a) 11 morphology bar charts (fig2d_*, fig3d_*, fig6d_*, edfig4c_*): cytosim_actin_vasp_droplet
      is runnable: false (and simulates rigid spheres without Disks), while processing identity
      morphology_fraction_complement (100 - P_ring - P_shell) cannot run on graham2023's 3-bar
      morphology_category_index curves (no scalar P_shell/P_ring/P_disk inputs; diagnostically,
