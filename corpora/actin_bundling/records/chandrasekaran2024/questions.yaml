  text: >
    Cross-record audit of chandrasekaran2024 against Graham et al. (2023)'s 11 released Source Data
    Excel workbooks (`graham_source_data`, 41567_2022_1924_MOESM12-22_ESM.xlsx):
    (1) ModelAtlas & `cited.yaml` scope (0 relations across all 46 x 11 = 506 model pairs; 0 direct
    `cited.yaml` links across all 224 x 94 = 21,056 datum pairs): all 11 models in
    `graham_source_data` are `role: processing`, `software: true` spreadsheet readers summarizing
    fixed experimental Excel tables (all 26 theory/simulation panels of Graham 2023, including
    Fig. 5c replotted in Fig. 7F, were omitted from MOESM12-22); analytical relations to Graham's
    equations live in `chandrasekaran2024/relations.yaml` against `graham2023`. In `cited.yaml`,
    `exp_wt_disk_pct_1_7p5` ('70 ± 13% mean ± SEM') is the sole `ref-15` scalar datum with an exact
    scalar counterpart in `graham_source_data/data.yaml` (`f3d_1to7p5_disc_mean_stored = 69.6919%`,
    MOESM14 'Fig 3d' cell AF9; `f3d_1to7p5_disc_sd_stored = 21.6496%` -> SEM `12.4994%`, reproduced),
    but cannot override inline `from_source: ref-15` per `validate.py` (while reverse linking in
    `graham_source_data` would invert 2023 -> 2024 provenance). `fig6d_wt_{shell,ring,disk}_fig` are
    3-point digitized tables whereas `graham_source_data/data.yaml` declares 0 table datums (so
    `_cited_table` rejects table-to-scalar links), and `fig7f_{bending,surface}_energy_fig`,
    `t_sim_baseline`, `vasp_disordered_pct`, and `exp_fig7ai_{actin,vasp}_conc` have no matching
    datums in MOESM12-22.
    (2) Exact Fig. 6D WT workbook provenance & EDTA/EGTA buffer-matching resolution: comparing all
    9 blindly digitized Fig. 6D WT bars and 9 SD error bars directly against MOESM14 'Fig 3d'
    proves Fig. 6D replots MOESM14 'Fig 3d''s unweighted per-image-mean summary table AD7:AI9
    (9/9 bars reproduced, max |dMean| = 0.093 pp, max |dSD| = 0.067 pp: 1:20 58.18 ± 9.25% shell /
    31.25 ± 2.75% ring / 10.57 ± 6.54% disc; 1:10 20.16 ± 9.40% / 57.13 ± 3.67% / 22.72 ± 12.86%;
    1:7.5 5.93 ± 6.81% / 24.38 ± 16.06% / 69.69 ± 21.65% [image-mean SEM 12.50%, double-rounding
    12.499 -> 12.5 -> 13%, or pooled 69.52 ± 22.06% -> SEM 12.74% -> printed '70 ± 13%']), thereby
    inheriting MOESM14 'Fig 3d''s 714-droplet total count error (replicates [302, 181, 231] across
    all 3 ratios: 178 at 1:20, 280 at 1:10, 256 at 1:7.5, NOT >= 600/replicate;
    `graham_source_data/q_fig3d_and_edfig4e_count_errors`) and its 0.5 mM EDTA + 0.5 mM EGTA buffer.
    Because chandrasekaran2024 Methods (pp. 10-11) measures VASP-GABmut in EDTA/EGTA-free buffer
    (50 mM Tris pH 7.4, 150 mM NaCl, 5 mM TCEP, 3% PEG8k; 20 uM VASP + 1/2/2.67 uM actin), the
    buffer-matched WT control in `graham_source_data` is MOESM20 'Fig S4c' (EDTA/EGTA-free, 417
    droplets [170, 110, 137]: 129 at 1:20, 140 at 1:10, 148 at 1:7.5; image-mean 1:20 72.32 ±
    14.88% / 25.46 ± 14.56% / 2.22 ± 2.22%; 1:10 20.63 ± 8.11% / 52.66 ± 11.86% / 26.71 ± 5.20%;
    1:7.5 3.46 ± 4.79% / 16.74 ± 5.65% / 79.80 ± 0.98%, failing 4/9 bars [close at all three 1:20
    bars and 1:10 ring] against Fig. 6D WT). Testing digitized Fig. 6D VASP-GABmut (N = 3) against
    BOTH WT workbooks separates buffer artifact from biological effect:
    - At 1:20, GABmut (75.00 ± 9.25% shell, 21.38 ± 8.66% ring, 3.61 ± 2.31% disc) appears shifted
      vs EDTA-containing 'Fig 3d' (Delta = +16.82, -9.86, -6.96 pp; Student p = 0.090, 0.133, 0.157)
      but is statistically indistinguishable from buffer-matched EDTA-free 'Fig S4c' (Delta = +2.68,
      -4.07, +1.39 pp; Student p = 0.804, 0.698, 0.494), showing the 1:20 shift in Fig. 6D is
      predominantly an EDTA/EGTA buffer artifact.
    - At 1:10 and 1:7.5, switching to buffer-matched 'Fig S4c' STRENGTHENS the biological GABmut
      suppression of bundled disks: at 1:10, disc reduction tightens from -17.04 pp (p_Student =
      0.086, p_Welch = 0.145 vs 'Fig 3d') to -21.04 pp (p_Student = 0.0028, p_Welch = 0.0112 vs
      'Fig S4c'; shell +18.55 pp, p_Student = 0.026); at 1:7.5, disk suppression widens from
      -59.75 pp (p_Student = 0.0104, p_Welch = 0.0315 vs 'Fig 3d') to -69.86 pp (p_Student =
      6.5e-5, p_Welch = 0.0028 vs 'Fig S4c'), with shell +33.87 pp (p_Student = 0.0022) and ring
      +35.99 pp (p_Student = 0.0049 vs 0.058 against 'Fig 3d').
    (3) Fig. 7F omission & raw MOESM14-22 empirical benchmarks against CytoSim assumptions:
    - Fig. 7F's continuum energy curves (`fig7f_{bending,surface}_energy_fig`) are absent from all
      11 workbooks in `graham_source_data` (`q_simulation_and_theory_panels_omitted`; their 19-row
      numerical table is released only in `chandrasekaran_source_data` MOESM9 'Figure7F').
    - Empirical aspect ratios vs Fig. 7B CytoSim peak (AR = 5.074), kinetically trapped plateau
      (AR = 1.92-2.64 for L_max > pi*R_drop), and straightening ceilings (3D pi^(3/2) = 5.568, 2D
      pi^2 = 9.870): 100% of MOESM14 'Fig 3g' shells (max 1.10) and rings (max 1.31) and 99.56% of
      discs (max 2.01) stay <= 2.0, whereas in MOESM16 'Fig S5a' 1:10 (n = 1285, max 6.45) and
      1:7.5 (n = 589, max 12.86), 16.89% and 37.69% exceed AR = 2.0, 0.62% (8) and 10.70% (63)
      exceed Fig. 7B's peak 5.074, 0.31% (4) and 7.64% (45) exceed 3D pi^(3/2), and 0.51% (3/589)
      exceed 2D pi^2 (rising to 60.78% > pi^(3/2) and 29.65% > pi^2 in MOESM22 'Fig S9e' 3% PEG,
      n = 877, max 26.52).
    - Droplet size, elongation speed, and actin partitioning benchmarks: only 21.93% (363/1655) of
      MOESM20 'Fig S4e' 20 uM VASP droplets (median D = 2.86 um, mean 3.03 ± 1.22 um, IQR
