    biophysical parameters between chandrasekaran2024 and its companion predecessor graham2023
    (Nature Physics 19, 574-585, 2023) uncovers five concrete cross-paper discrepancies and four
    BoxGraph provenance gaps:
    (1) Inherited Fig. 5c -> Fig. 7F unit-mismatch and AR > pi^2 overshoot: point-by-point comparison
    of blindly digitized curves confirms chandrasekaran2024 Fig. 7F replots graham2023 Fig. 5c
    verbatim across all 10 shared bending-energy points (AR = 1..9.7: 10/10 reproduced against
    chandrasekaran2024 intervals; diff 0.0002-0.12 pN*nm across AR = 1..9) and all 9 shared
    surface-energy points (AR = 1..9: 9/9 reproduced in both directions; max diff 0.069 pN*nm).
    Consequently, Fig. 7F directly inherits BOTH graham2023/q_fig5c_unit_mismatch (the y-axis prints
    'Energy (pN.nm)' while plotting E_bend(1) = pi = 3.14 and E_surf(1) = 2*pi = 6.28, which requires
    consistent length units R = 1, k_b = 1, gamma_I = 1 — e.g., pN*um for R = 1 um — a 10^6 mismatch
    with R = 1000 nm and k_b = 1 pN*nm^2) AND graham2023/q_audit_fig5d_ar_exceeds_pi_squared (curves
    extend to AR = 10.0, reading E_bend = 0.85 and E_surf = 12.85 pN*nm, exceeding Fig. 7E's own
    labeled straightening limit (a/b)_max = pi^2 = 9.8696).
    (2) Fig. 6D WT replotted from Graham Fig. 3d under mismatched buffer & 1:7.5 concentrations:
    comparing all 9 WT bars proves Fig. 6D replots graham2023 Fig. 3d (9/9 bars reproduced in both
    directions, diff -0.50% to -0.98%: 1:20 58.1/31.3/10.6% vs 59.1/32.2/11.2%; 1:10 20.1/57.1/22.8%
    vs 20.8/57.6/23.5%; 1:7.5 5.8/24.4/69.8% vs 6.7/25.0/70.3%; text '70 +/- 13%' mean +/- SEM
    reproduced by Fig. 3d 70.32 +/- 21.42% SD -> SEM = 12.36%), and NOT Graham's EDTA/EGTA-free
    control Extended Data Fig. 4c (72.4/25.4/1.5% at 1:20; 3.3/16.4/79.4% at 1:7.5). However,
    chandrasekaran2024 Methods (pp. 10-11) performs its VASP-GABmut assay in buffer WITHOUT
    EDTA/EGTA and at 20 uM VASP + 2.67 uM actin (1:7.5), whereas graham2023 Methods (p. 14) specifies
    0.5 mM EDTA + 0.5 mM EGTA and 15 uM VASP + 2 uM actin for 1:7.5 endpoint assays (reserving
    20 uM VASP + 2.67 uM actin for phalloidin ring-thickness quantification).
    (3) Simulation time 600 s vs Graham 15 min (900 s) endpoint assay: chandrasekaran2024 (p. 3) and
    Supplementary Table 2 (p. 17: 'Experimental images are taken at 600s') cite ref-15 for t_sim =
    600 s, whereas graham2023 Methods (p. 14) allows actin to polymerize for 15 min (900 s) followed
