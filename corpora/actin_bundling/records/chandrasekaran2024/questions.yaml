    R_H = L/ln(2*L/r)): (a) chandrasekaran2024/stokes_einstein_diffusion on
    weirich2017/run_se_diffusion_check (R_H = 22.84 nm, eta = ~3 Pa*s, T = 20 degC) computes
    0.003133 um^2/s vs weirich2017/D_frap_est ('~0.3 x 10^-2', origin: estimated -> no verdict,
    matching cmp_se_diffusion_consistency and circular with eta_frap_est); and
    (b) weirich2017/stokes_einstein_ellipsoid_diffusion on chandrasekaran2024/run_stokes_einstein_vasp
    (k_B*T = 4.11 pN*nm, eta = 0.5 Pa*s, R_H = 30 nm, taking r = 3.5 nm from weirich2017) computes
    0.014536 um^2/s vs chandrasekaran2024/vasp_diffusion_rate ('10', origin: reported -> not
    reproduced, matching cmp_stokes_einstein_vs_vasp_D). No additional manual CrossValidation entry
    is valid without circularity, fabricating unmeasured inputs, or conflating distinct quantities:
    (1) Direction A — all 42 runnable chandrasekaran2024 models (56 output ports) + 4 non-runnable
    models vs all 35 origin: measured datums in weirich2017 (1,960 total pairs; 625 dimension-matched
    across [length] [130], [time] [15], and dimensionless [480]): 0 valid cross-validations.
    - Aspect-ratio and 3D droplet-geometry models (5 aspect_ratio ports:
      prolate_spheroid_volume_conserving, filament_length_limited_aspect_ratio,
      ellipse_2d_constant_area, quasistatic_droplet_deformation_schedule, lammps_droplet_aspect_ratio;
      plus lammps_droplet_asphericity) vs 4 measured tactoid_aspect_ratio datums
      (aspect_ratio_2p5_filamin = '~3', aspect_ratio_15_filamin = '~2', d_fig2a_aspect_ratio
      [2.938..2.037 vs filamin 2.5..15%], d_fig3a_aspect_ratio_data [2.037..2.163 vs t = 10..85 min]):
      weirich2017 measures ZERO tactoid_minor_axis (r), ZERO tactoid_volume (V), and ZERO
      droplet_radius (R_drop) datums. Running prolate_spheroid_volume_conserving.aspect_ratio =
      (a/R_drop)^(3/2) by inferring R_drop from L and L/r is strictly circular (and even at matched
      (V, L), sharp circular-arc cusps shift AR upward by +8.15..+10.10%, e.g. 2.735 vs 2.5 at
      L = 5 um, V = 8.751 um^3, R_eq = 1.278 um, per rel_weirich2017_tactoid_length_matched_approx_prolate_ar);
      substituting chandrasekaran2024's R_drop = 1 um fabricates an arbitrary fixed volume whereas
      Fig. 3A coarsening grows tactoid volume 24.4x (0.315 -> 7.676 um^3, R_eq = 0.422 -> 1.224 um)
      at constant L/r ~ 2.1 (yielding unphysical AR = 0.624..3.083 at R_drop = 1 um and 3.953 at
      L = 5 um). Likewise, filament_length_limited_aspect_ratio = (L_max/(2*R_drop))^(3/2) and
      ellipse_2d_constant_area require a single spanning filament 2*a = L_max >= 2*R_drop, whereas
      weirich2017 tactoids aggregate thousands of short capped rods (L_fil ~ 0.18 um << L ~ 1-5 um,
      giving unphysical oblate AR = 0.015-0.099 at R_eq = 0.422-1.495 um and 0.027-0.354 even at
      R_drop = 1 um across L_fil = 0.18-1.0 um). quasistatic_droplet_deformation_schedule is a
      prescribed 10 nm/s CytoSim wall-stretching ramp (unmeasured R_drop, t0, dz, dt_relax; opposite
      to constant Fig. 3A L/r), and lammps_droplet_{aspect_ratio,asphericity} require unmeasured
      reduced LJ semi-axes (a, b, c).
    - Length models (13 [length] ports x 10 measured datums = 130 pairs):
      (a) filament_elongation_length (L_fil = L0 + k_grow*t, flagged by the scheduler solely for
      sharing shape length(length, time) with weirich2017/tactoid_exponential_relaxation): computes
      single-filament barbed-end chemical polymerization, whereas weirich2017's
      filament_length_tactoid_range ('0.1 to 1' um) is a phase-diagram window of pre-polymerized,
      capped (non-growing) filaments without (L0, k_grow, t), and weirich2017's 6 tactoid_major_axis
      datums (tactoid_length_growth_60min = '~1 to 4' um, tactoid_length_homogeneous_si = '~5' um,
      d_fig3a_length_data [1.461..4.237 um over 10..85.4 min], d_fig3b_{pre_upper,pre_lower},
      d_fig3b_coalesced_data [9.25 -> 6.0 um shortening over 10.8..245.8 s]) measure macroscopic
      multi-thousand-filament droplet lengths driven by Ostwald/coalescence coarsening (L ~ t^0.47;
      baseline L0 + k_grow*t = 6.28..52.88 um overshoots Fig. 3A by 4.30x-12.48x) or viscous
      capillary shortening (opposite sign dL/dt < 0).
      (b) droplet_characteristic_lengths.L_circ = 2*pi*R_drop (sphere circumference) is distinct
      from capillary_lambda_observed ('~10' um, cylindrical Rayleigh-Plateau pearling wavelength;
      diagnostically 2*pi*200 nm = 1.257 um, 7.96x below ~10 um, lacking nematic anchoring
      sqrt(1 + 2*omega) and fastest-mode sqrt(2), and '~10' gives no verdict).
      (c) Remaining length ports (brownian_noise_{from_mobility,stddev}.sigma_B,
      langevin_overdamped_1d.mean_dx, ellipse_2d_constant_area.b,
      prolate_spheroid_volume_conserving.b, quasistatic_droplet_deformation_schedule.a,
      icosphere_subdivision_geometry.{mean,median}_edge, persistence_length_from_rigidity.l_p)
      have no matching measured targets in weirich2017 (bundle_initial_length = '> 50' um and
      bundle_initial_radius_main = '~200' nm are cylindrical bundle dimensions).
    - Timescale models (3 [time] ports x 5 measured datums = 15 pairs): bell_slip_bond_unbinding.tau_res
      (VASP-actin bond lifetime; weirich2017 uses filamin and measures no k_unbind0, f, or f_u),
      filament_growth_time.t_grow ((L_target - L0)/k_grow; distinct from capillary coalescence
      relaxation_time in d_fig3c_inset_{5pct,10pct} [8.30..58.51 s vs dL = 0.81..4.37 um, where
      dL/k_grow = 78.6..424.3 s is ~10x slower] and d_fig3d_{5pct,10pct}_data, and from
      bundle_shape_change_timescale = '~10' min), and lammps_md_time_unit_sqrt.tau_MD (~15.3 ns).
    - Remaining 18 dimensionless ports x 16 remaining dimensionless measured datums (5
      filamin_mole_fraction: filamin_frac_tactoid_range, d_fig1d_{gas,liquid_droplets,fluid_bundles,
      viscoelastic_networks}; 2 contractile_strain: bundle_contractile_strain_range,
      d_fig4e_contractile_strain; 1 wavelength_to_radius_ratio: capillary_lambda_to_R0_observed;
      3 FRAP intensity curves: d_fig1c_frap_data, d_figS1_{bleached,unbleached}; 5 bundle
      contraction curves: d_fig4c_{2p5pct,10pct}_data, d_fig4d_{2p5pct,5pct,10pct}): zero matching
      physical quantities.
    - Audited non-measured datums in weirich2017 (and 4 non-runnable chandrasekaran2024 models):
      (a) stokes_einstein_diffusion (reconstructed sphere model) vs weirich2017/D_frap_est
      ('~0.3 x 10^-2' um^2/s): EXCLUDED as a manual validation because D_frap_est is origin:
      estimated (with approximate '~' -> no verdict), eta_frap_est ('~3' Pa*s, origin: derived) was
      literally inverted from D_frap_est itself (strictly circular), direct substitution of rod
      radius r = 3.5 nm or half-length L = 90 nm conflates sphere radius with slender-rod
      hydrodynamic radius R_H = 22.84 nm (giving 0.02045 um^2/s [6.82x high] or 0.000795 um^2/s
      [3.77x low]), running on Chandrasekaran's VASP inputs gives 0.01454 um^2/s (eta = 0.5) or
      0.1454 um^2/s (eta = 0.05) for a different tracer/medium, and the exact R_H-mapped check is
      already performed automatically by Synthesis via rel_weirich2017_stokes_einstein_diffusion
      (same applies to langevin_overdamped_1d.D_eff and einstein_diffusion_relation.D).
      (b) persistence_length_from_rigidity (18.248 um) vs weirich2017/filament_persistence_length_si
      ('~10' um): origin: reported literature recall (not measured) with '~' -> no verdict.
      (c) final_actin_concentration vs weirich2017/c_actin_tactoid_est (250 uM, origin: estimated)
      and c_actin_dilute_main (2.6 uM, origin: reported): non-measured and weirich2017 measures
      neither discrete filament count N_fil (diagnostically ~19,762 short 180 nm filaments in a
      L = 5 um, L/r = 2.5, V = 8.751 um^3 tactoid) nor R_drop.
      (d) All 4 full models (cytosim_actin_vasp_droplet, lammps_vasp_actin_droplet,
      droplet_2d_energy_balance, actin_nucleation_ode) are runnable: false and model isotropic VASP
      condensates rather than filamin nematic tactoids.
    (2) Direction B — all 52 runnable weirich2017 models (81 output ports) vs all 10 origin:
    measured datums in chandrasekaran2024 (810 total pairs; 270 dimension-matched, all
    dimensionless): 0 valid cross-validations. All 10 origin: measured datums in chandrasekaran2024
    are Fig. 6D 3D VASP-droplet Shell/Ring/Disk percentage abundances (exp_wt_disk_pct_1_7p5 =
    '70 ± 13'%, exp_gabmut_disk_pct_1_7p5 = '< 10'% [inequality -> no verdict],
    exp_gabmut_ring_pct_1_7p5 = '53 ± 6'%, exp_gabmut_shell_pct_1_7p5 = '37 ± 4'%, and 6 digitized
    Fig. 6D 3-bar curves across Actin:VASP = 1:20, 1:10, 1:7.5), which none of weirich2017's 52
    continuum tactoid/capillary/FRAP/stoichiometry models predicts. All 214 non-measured datums
    in chandrasekaran2024 (107 run, 88 reported, 15 derived, 3 predicted, 1 assumed) contain zero
    FRAP, zero capping protein, zero filamin, zero measured mesh size (diagnostically
    weirich2017/actin_mesh_size yields xi = 0.896 um at Chandrasekaran's bulk 1:7.5 2.67 uM actin
    — nearly identical to Weirich's 0.908 um at 2.6 uM — and 0.278 / 0.124 um at intradroplet
    27.67 / 138.38 uM), zero pearling wavelength, and zero experimental aspect ratio (simulated
    Fig. 7B / S1F aspect ratios are origin: run/derived for isotropic omega = 0 VASP droplets
    where Weirich's anchoring model predicts spherical AR = 1), while vasp_diffusion_rate (10 um^2/s,
    origin: reported) is already covered by Synthesis's automatic same_as cross-check. See also
    weirich2017/q_chandrasekaran2024_no_cross_validation.

