    Cross-record ModelAtlas synthesis between chandrasekaran2024 (Nat. Commun. 15, 3139, Apr 2024;
    3D CytoSim & LAMMPS VASP-actin condensates) and sekine2024 (Nat. Commun. 15, 464, Jan 2024;
    2D CGMD Drosophila tracheal actomyosin-alpha-actinin cortex). Neither paper cites the other (0
    stated relations, 0 cited.yaml links). Across all 46 x 32 = 1,472 model pairs, 6 non-trivial
    proposed relations verify in chandrasekaran2024/relations.yaml, uncovering four structural and
    biophysical contrasts:
    (1) Shared Stokes-Einstein & overdamped Langevin core — and why cgmd_anisotropic_langevin does
    not reduce directly to brownian_noise_from_mobility at tolerance 1e-6:
    `rel_sekine2024_stokes_einstein_diffusion` verifies `sekine2024/filament_einstein_stokes_diffusion`
    (8 ops) `same_as` `stokes_einstein_diffusion` (4 ops; max diff 3.70e-16, joining a new ModelAtlas
    family) via exact effective cylindrical Stokes radius R_H = 3*d_f + 2*L0_f/5 (70 nm for Sekine's
    100 nm x 10 nm actin rod vs 30 nm for Chandrasekaran's spherical VASP tetramer) and 1 Pa*s =
    1 pN*s/um^2. `rel_sekine2024_filament_diff_approx_langevin1d` verifies `langevin_overdamped_1d`
    (f = 0, mu = 1/(2*gamma^f)) reproduces `D_fil` within 4.39% Monte Carlo error (n_particles = 4000,
    seed = 42). For `sekine2024/cgmd_anisotropic_langevin` vs `brownian_noise_from_mobility`, internal
    spring forces cancel from the two-bead center of mass, so Delta x_cm and Delta y_cm have exact
    Gaussian std `sigma_B = sqrt(2*mu_cm,a*k_B T*t_obs)`; however, `cgmd_anisotropic_langevin` outputs
    the half-normal mean absolute displacement E[|Delta r_a|] = sqrt(2/pi)*sigma_B = 0.7979*sigma_B,
    leaving a non-vanishing 20.21% deterministic statistical ratio even in the isotropic limit
    `friction_asymmetry -> 1` (preventing `reduces_to` from converging to 0; instead `approximated_by`
    verifies within 22.1% <= 25% along both x and y across [0.05, 0.5] s, and 5-variable `scales_as` matches
    log-slopes in L0_f, d_f, eta_cyto, friction_asymmetry, and kBT to 4.4e-13). Both papers exhibit
    parallel printed Langevin and viscosity defects: chandrasekaran2024 mislabels mobility mu as
    'viscosity' (`q_eq1_mu_called_viscosity`) and has a 10x viscosity mismatch (0.5 Pa*s = 500x water
    labeled '50x water', plus VASP D = 10 um^2/s exceeding Stokes-Einstein 0.0145 um^2/s by 688x),
    while sekine2024 omits k_B T from its FDT (`q_fdt_missing_kBT`), leaves the anisotropic y-noise
    split unstated, and has a 10x viscosity contradiction (0.1 Pa*s SI text vs 1 Pa*s Table S1, giving
    D_fil = 0.0314 vs 0.00314 um^2/s).
    (2) Harmonic stretching elasticity: `rel_sekine2024_harmonic_stretch_scales_lammps_bond` connects
    `sekine2024/harmonic_stretching_potential` (5 ops, pN*um) to `lammps_harmonic_bond_potential`
    (3 ops, dimensionless k_B T) across all three parameters (kappa, r, L0; nonlinear log-slopes agree
    to 6.6e-13). Quantitatively, Sekine softens F-actin stretching ~2,740x below Chandrasekaran's
    LAMMPS actin bond (k_eff = 100 pN/um vs 2.74e5 pN/um at sigma = 30 nm, k_B T = 4.11 pN*nm) to
    enable dt = 5e-5 s, whereas crosslinker spring stiffnesses are comparable (571 pN/um per arm or
    286 pN/um in series vs 913 pN/um in LAMMPS).
    (3) Bending potentials and `too_plain` exclusions: `persistence_length_from_rigidity` (2 ops),
    `harmonic_repulsion_force` (2 ops, one-sided), `einstein_diffusion_relation` (2 ops),
    `mobility_from_diffusion` (2 ops), `bending_stiffness_thermal_units` (1 op), and
    `sekine2024/thermal_energy` (1 op) are excluded from proposed relations as `too_plain` (<= 2 ops).
    Physically, `sekine2024/persistence_length_bending` (`l_bend = k_bend*L0/(2*k_B T)`) matches
    `l_p = kappa/(k_B T)` under effective rigidity `kappa_eff = k_bend*(L0/2)`, but the two papers
    invert which species bends: chandrasekaran2024 models long elongating semiflexible F-actin
    (L = 0.1 -> 6.28 um, L_seg = 100 nm, l_p = 18.25 um in CytoSim, K_angle = 2500 k_B T/rad^2 in
    LAMMPS) with flexible VASP crosslinkers, whereas sekine2024 treats short fixed-length F-actin
    (L0_f = 100 nm << cited ~1 um l_p) as rigid 2-bead rods without bending and assigns cosine
    bending `U^bend = -k_bend*cos(theta)` (`sekine2024/bending_potential`) to myosin II motors
    (l_p = 2.41 um) and alpha-actinin crosslinkers (l_p = 2.41 um, misprinted ~24.1 um in Table S1).
    Because `U^bend(0) = -k_bend != 0` and uses physical energy units [pN*um], it does not directly
    scale as dimensionless `lammps_harmonic_angle_potential`; only shifted excess energy
    `k_bend*(1 - cos(theta))` approximates `(k_bend/2)*(pi - theta_LAMMPS)^2` at small angles
    (< 1.0% error for theta <= 20 deg).
    (4) Full many-body mechanisms (all three non-runnable: `cytosim_actin_vasp_droplet`,
    `lammps_vasp_actin_droplet`, `sekine2024/cgmd_2d_network`): passive 3D spherical confinement +
    polymerization + 4-valent Bell slip-bond VASP kinetic trapping (k_unbind = 1e-4..10 s^-1, f_u =
    10 pN) vs active 2D periodic cortex + rapid filament turnover (omega_f = 0.1 s^-1) + 2-valent
    force-independent alpha-actinin (omega_cl = 0.01 s^-1) + bipolar myosin II walking + directional
    friction asymmetry (gamma_y^f / gamma_x^f = 1.5).

