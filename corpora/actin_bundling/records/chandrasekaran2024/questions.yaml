- id: q_viscosity_unit_and_50x_water_error
  kind: possible_error
  about: [viscosity_droplet_printed, viscosity_ratio_water_printed, droplet_viscosity_ratio_water, stokes_einstein_diffusion, cmp_viscosity_ratio_water, cmp_stokes_einstein_vs_vasp_D]
  text: >
    Supplementary Table 2 (p. 17) prints 'Viscosity of droplet medium: 0.5 pN/s um^2' with note
    '50x water'. There are three compounding issues: (1) the printed unit 'pN/s um^2' is
    dimensionally wrong for dynamic viscosity, which has units 'pN*s/um^2' (= Pa*s); (2) even
    when corrected to 0.5 pN*s/um^2 (= 0.5 Pa*s), that is 500x water (0.001 Pa*s), contradicting
    '50x water' (0.05 Pa*s) by a factor of 10; and (3) a 30 nm VASP sphere in either 0.5 Pa*s or
    0.05 Pa*s has Stokes-Einstein diffusivity 0.0145 or 0.145 um^2/s, roughly 70x to 700x slower
    than the independently prescribed VASP diffusion rate of 10 um^2/s (p. 18), which exceeds
    Stokes-Einstein diffusion even in pure water (7.27 um^2/s).
  citation:
    page: 17
    printed_page: "SI-3"
    quote: "Viscosity of droplet medium    0.5 pN/s"
    where: "Supplementary Table 2"

