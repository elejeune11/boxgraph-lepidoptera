    `T_ring ~ D^2.0`, substantially closer to Graham's experimentally fitted ring exponent
    `b = 1.9682` (Fig. 3e) and `b = 1.8037` (Fig. 3f) than Graham's thermal-fluctuation prediction
    `D^1.5` (Eq. S25; see `graham2023/q_audit_scaling_exponent_vs_experiment`).
    (4) Kinetic trapping vs equilibrium energy minimization: whereas Graham's 2D SLSQP minimization
    (`droplet_ring_minimization_corrected`) treats bundled rings as equilibrium fixed-`N_fil` chains
    with linear weak-coupling stiffness `K_b_ring = N_fil*K_b_fil`, Chandrasekaran's 3D CytoSim model
