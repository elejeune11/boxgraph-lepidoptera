    linear-droplet time-lapse runs 0-590 s).
    (4) 2.20x slower baseline elongation speed: chandrasekaran2024 sets baseline k_grow = 10.3 nm/s
    specifically so L(600 s) = 2*pi um, which is 2.20x slower than graham2023 Fig. 5h's measured
    linear bundle elongation speed (22.7 nm/s, 23 +/- 3 nm/s in 10 uM VASP + 2 uM actin + 1 mM ATP;
