  text: >
    The full 3D agent-based CytoSim actin-VASP droplet simulation cannot be run directly from the
    printed article alone: it requires the C++ CytoSim engine and omits several configuration
    parameters (crosslinker spring stiffness, exact steric interaction functional form and cutoff,
    thermal energy/temperature T used in CytoSim, exact Brownian ratchet force-velocity equation,
    exact radius-of-gyration ellipsoidal span formula, and random seeds).
  citation:
