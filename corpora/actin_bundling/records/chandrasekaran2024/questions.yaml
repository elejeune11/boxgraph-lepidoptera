    Cross-record ModelAtlas synthesis between chandrasekaran2024 and graham2023 connects their shared
    2D/3D geometry, elongation, and bending frameworks while exposing four structural differences:
    (1) 2D constant-area family vs 3D constant-volume deformation: `ellipse_2d_constant_area`,
    `graham2023/ring_rod_max_aspect_ratio`, and `graham2023/ellipse_axes_constant_area` verify
    symbolically as a single 3-model family (`a*b = R^2`, `(a/b)_max = (L/(2R))^2 = pi^2 = 9.870`),
    and `rel_graham2023_critical_ar_reduces_to_2d_max_ar` proves Graham's bending-energy cliff
    `P(AR_crit) = 2*L` converges asymptotically (`L/R -> oo`) to `(L/(2R))^2`, explaining why
    `AR_crit = 9.538` lies just 3.4% below `pi^2`. By contrast, chandrasekaran2024's 3D CytoSim
    deformation (`prolate_spheroid_volume_conserving`, `filament_length_limited_aspect_ratio`)
    enforces 3D volume conservation `a*b^2 = R^3` (the exact algebraic inverse of Graham Methods
    p. 15's `effective_spherical_diameter` `D = (a*b^2)^(1/3)`), reducing the straightening ceiling
    by `sqrt(pi) = 1.772x` to `pi^(3/2) = 5.568` (`~5.56`) and changing large-AR interfacial growth
    from 2D perimeter `P ~ AR^(1/2)` to 3D surface area `S ~ AR^(1/3)`.
    (2) Discrete vs continuum bending mechanics: `persistence_length_from_rigidity` (`l_p = kappa/k_B T`)
    and `graham2023/filament_flexural_rigidity` (`k_b_fil = L_p*k_B T`) are exact algebraic inverses
    of the single-filament WLC law, while `rel_graham2023_hinge_angle_scales_as_ring_confinement`
    verifies exact 3-variable log-slope equivalence (`+1, +1, -2` in `k_b, L, R`) between Graham's
    continuum circular confinement bending energy and Chandrasekaran's LAMMPS harmonic angle potential.
    For single filaments, Graham's `discrete_bending_constant` at `L_cyl = 100 nm` gives
    `728.7 pN*nm = 177.3 k_B T`, whereas Chandrasekaran's LAMMPS `k_bend_phys = 10394 pN*nm`
    (`2529 k_B T`, rounded to `2500 k_B T/rad^2`) is 14.3x larger because LAMMPS uses finer bead
    spacing (~7.2 nm implied by `kappa / k_bend_phys`).
    (3) Spherical mass conservation vs thermal-fluctuation ring-thickness scaling: combining
    chandrasekaran2024's `final_actin_concentration` (`C_actin = 3*N_fil / (2*N_A*dl*R^2)` at
    `L = 2*pi*R`) with constant internal actin concentration yields `N_fil ~ R^2`; under Graham
