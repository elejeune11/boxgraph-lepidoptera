  text: >
    Bidirectional cross-record validation audit between chandrasekaran2024 (46 models: 42 runnable
    [56 output ports] + 4 non-runnable; 224 datums: 10 origin: measured) and nastkolb2022 (17
    models: 11 runnable [11 output ports] + 6 non-runnable; 119 datums: 66 origin: measured [16
    scalars, 50 digitized curves across 22 quantities]) yields 0 genuine CrossValidation entries
    in either direction (no validations.yaml created in either record). Neither paper cites or
    mentions the other, neither imports any datum from the other (0 cited.yaml links), and their
    runnable equations are structurally disjoint (0 cross-record relations in relations.yaml; 0
    Synthesis automatic cross-checks).
    (1) Forward direction — all 42 runnable chandrasekaran2024 models (56 output ports) + 4
    non-runnable models vs all 66 origin: measured data in nastkolb2022 (3,696 total pairs; 1,269
    dimension-matching pairs across [length], [length]^2, [substance]/[length]^3, [time], and
    dimensionless): 0 valid cross-validations without fabricating unmeasured inputs or equating
    physically distinct quantities.
    - VASP diffusion models (3 [length]^2/[time] ports: stokes_einstein_diffusion [reconstructed],
      einstein_diffusion_relation, langevin_overdamped_1d.D_eff) vs nastkolb2022 VASP FRAP
      measurements (0 [length]^2/[time] measured datums): nastkolb2022 prints FRAP half-times
      (frap_t_half_vasp_slb = 0.102 min = 6.12 s, frap_t_half_vasp_ml = 0.399 min = 23.94 s over
      bleach diameter d_b = 4.96 um, r_b = 2.48 um), mobile fractions (0.97, 0.65, 0.61, 0.57),
      and normalized Fig. 4C traces without ever computing diffusivity D
      (nastkolb2022/q_frap_unstated_fit_params_and_diffusivity), while chandrasekaran2024 has no
      2D FRAP half-time model converting (D, d_b) to t_1/2. Physically, 3D bulk Stokes-Einstein
      drag for a 30 nm sphere (D_SE = 0.01454 um^2/s at printed eta = 0.5 Pa*s [500x water],
      0.1454 um^2/s at literal 50x water = 0.05 Pa*s, 7.268 um^2/s in water; vs CytoSim
      prescribed D_VASP = 10 um^2/s) differs from 2D membrane-tethered diffusion of His6-VASP on
      10% DOGS-Ni-NTA bilayers/monolayers (no bulk viscosity stated). Diagnostically, 2D uniform-
      disk Soumpasis conversion (D = 0.224*r_b^2/t_1/2) gives D_SLB = 0.2251 um^2/s (15.5x faster
      than D_SE(0.5), 1.55x faster than D_SE(0.05), 44.4x slower than D_VASP = 10) and D_ML =
      0.0575 um^2/s (3.96x faster than D_SE(0.5), 2.53x slower than D_SE(0.05), 173.8x slower
      than D_VASP = 10); inversely, D_SE(0.5), D_SE(0.05), and D_VASP = 10 would imply Soumpasis
      t_1/2 = 94.8 s (1.58 min), 9.48 s (0.158 min), and 0.138 s (0.0023 min) vs measured 6.12 s
      SLB and 23.94 s ML.
    - Actin elongation speed models (4 [length]/[time] ports: brownian_ratchet_growth_rate,
      elongation_rate_from_growth_time, total_actin_addition_rate,
      monomer_depletion_elongation_rate) vs nastkolb2022 (0 [length]/[time] measured datums):
      nastkolb2022 never quantifies single-filament or bundle elongation speeds
      (nastkolb2022/q_no_elongation_velocity_quantified), reporting only fluorescence intensity
      kinetics (Fig. 3E, 5C, S2F, S3E) and an unquantified kymograph (Fig. 1C).
    - Length models (13 [length] ports x 9 measured bundle-width datums = 117 pairs): all 9
      [length] measurements in nastkolb2022 quantify transverse 2D actin bundle width
      (bundle_width_median_vasp_025 = 0.942 um, bundle_width_median_vasp_dtetra_025 = 0.584 um,
      bundle_width_max_vasp_{025,dtetra_025} = 3, 3.2 um, plus 5 curves: bundle_width_vs_vasp_fig2e,
      bundle_width_median_vs_vasp_fig2e, bundle_width_by_elongator_fig3f,
      bundle_width_vs_actin_figs3f, bundle_width_cp_substrate_figs4f). None of chandrasekaran2024's
      13 [length] outputs predicts lateral multi-filament bundle thickness:
      filament_elongation_length computes single-filament longitudinal contour length L_fil(t) =
      L0 + k_grow*t (0.924 um at 80 s, 4.271 um at 405 s, 6.280 um at 600 s),
      brownian_noise_{from_mobility,stddev} and langevin_overdamped_1d.mean_dx compute 1D
      particle displacements, droplet_characteristic_lengths / ellipse_2d_constant_area.b /
      prolate_spheroid_volume_conserving.b / quasistatic_droplet_deformation_schedule.a /
      icosphere_subdivision_geometry.{median,mean}_edge compute 3D/2D droplet geometry from R_drop,
      and persistence_length_from_rigidity outputs single-filament l_p = 18.25 um.
    - Area models (1 [length]^2 port x 4 measured bundle_pore_size curves = 4 pairs):
      prolate_spheroid_volume_conserving.surface_area (3D droplet surface area >= 4*pi*R_drop^2 =
      12.57 um^2) is physically unrelated to 2D inter-bundle network pore areas (pore_size_* in
      Fig. 2E, 3F, S3F, S4F; medians 0.20-2.80 um^2), and nastkolb2022 has no R_drop or axis a.
    - Concentration processing models (4 [substance]/[length]^3 ports x 2 measured VASP LLPS
      datums = 8 pairs): final_actin_concentration, actin_concentration_from_ratio,
      prolate_spheroid_cap_geometry.C_thresh, and vasp_tetramer_concentration are role: processing
      stoichiometry/volume conversions (3 output actin concentration; the 4th divides monomer
      concentration by valency 4), NOT thermodynamic LLPS phase-boundary models for
      vasp_llps_threshold_main ('>= 0.5' uM, inequality -> no verdict) or vasp_llps_range_si
      ('0.25 to 2' uM, washed incubation of unstated monomer/tetramer basis; dividing by 4 gives
      0.0625-0.50 uM tetramer). nastkolb2022's bulk actin concentrations (0.5-4 uM) are origin:
      reported assay recipes (not origin: measured) and have no spherical R_drop or measured L_fil.
    - Timescale models (3 [time] ports x 4 measured time datums = 12 pairs):
      bell_slip_bond_unbinding.tau_res (VASP-actin crosslinker bound lifetime, with k_unbind0 swept
      10^-4..10 s^-1), filament_growth_time.t_grow (184.47 s to 2*R_drop; 600 s to 2*pi*R_drop),
      and lammps_md_time_unit_sqrt.tau_MD (~15.3 ns inertial MD time unit) are physically distinct
      from pre-actin 2D lipid-tethered FRAP half-times (frap_t_half_vasp_slb = 0.102 min,
      frap_t_half_vasp_ml = 0.399 min, measured with zero actin present), lateral bundle swelling
      onset (bundle_diffraction_limited_window = '0 to 80' s), and mDia1 filament detachment onset
      (mdia1_tirf_decline_onset_time = '6' min, zero VASP).
    - Dimensionless models (24 ports x 47 measured datums = 1,128 pairs), unmatched dimensions
      (1/[time], [force], [time]^2/[length], [time]/[mass]: 0 measured), and 4 non-runnable models
      (cytosim_actin_vasp_droplet, lammps_vasp_actin_droplet, droplet_2d_energy_balance,
      actin_nucleation_ode): none of the 24 dimensionless outputs predicts filaments_per_bundle
      (filament_count_1um_intensity_measured = 45 +/- 12; molecule_count_from_concentration counts
      3D spherical nucleators, not filaments across a 1-um 2D bundle), vasp_mobile_fraction (4
      scalars), frap_normalized_intensity (4 Fig. 4C curves), bilayer_actin_decoration_fraction
      (bilayer_decoration_vs_vasp_figs2g rising 0.376 -> 0.950 with VASP, opposite in direction to
      non-runnable cytosim_actin_vasp_droplet's 3D surface_area_fraction falling ~0.50 -> ~0.18),
      vasp_cluster_area_fraction (vasp_cluster_area_vs_vasp_figs4h 0.007 -> 0.596, physically
      distinct from 3D bulk lammps_crowder_volume_fraction*), lipid_intensity_relaxation_fraction
      ('~0.5'), or the 36 remaining fluorescence/histogram/colocalization/enrichment curves (9
      tirf_actin_intensity_raw Fig. S2F/S3E, 8 bundle_width_fraction Fig. 2D/S2I/S4C, 6
      tirf_actin_intensity_normalized Fig. 3E, 4 spearman_colocalization_score Fig. 4B, 2
      bundle_intensity_enrichment_ratio Fig. 5C, 2 bundle_profile_actin_intensity Fig. 2C, 2
      cross_section_*_fluorescence_norm Fig. 5B, 1 bundle_actin_intensity_normalized Fig. 5C, 1
      bilayer_vasp_fluorescence_raw Fig. S2H).
    (2) Reverse direction — all 11 runnable nastkolb2022 models (11 output ports) + 6 non-runnable
    models vs all 10 origin: measured Fig. 6D VASP-droplet datums in chandrasekaran2024 (110 total
    pairs; 70 dimensionless matches): 0 valid cross-validations. Every origin: measured datum in
    chandrasekaran2024 is a 3D droplet Shell/Ring/Disk percentage abundance (exp_wt_disk_pct_1_7p5
    = '70 ± 13'%, exp_gabmut_disk_pct_1_7p5 = '< 10'% [inequality -> no verdict],
    exp_gabmut_ring_pct_1_7p5 = '53 ± 6'%, exp_gabmut_shell_pct_1_7p5 = '37 ± 4'%, and 6 digitized
    Fig. 6D 3-bar curves across Actin:VASP = 1:20, 1:10, 1:7.5), which none of nastkolb2022's 17
    models predicts (7 dimensionless runnable outputs cover FRAP recovery/plateau/mobility-ratio,
    2D filament count, CP:actin ratio, and actin fold-change; 4 dimensional outputs cover 2D
    spacing, bundle width scaling, and FRAP t_1/2 / tau). Moreover, chandrasekaran2024's 214
    non-measured datums (107 run, 88 reported, 15 derived, 3 predicted, 1 assumed) contain zero
    FRAP measurements, zero capping protein or profilin, zero measured bundle widths, and zero
    measured interfilament spacings (diagnostically, CytoSim's reported spherical VASP diameter
    2*vasp_radius = 60 nm in nastkolb2022/bundle_filament_count_2d_spacing on a 1-um ribbon gives
    16.67 filaments/um [8.33 at 120 nm max crosslink span], well below nastkolb2022's 45 +/- 12
    measured filaments/um). See also nastkolb2022/q_chandrasekaran2024_no_cross_validation.

