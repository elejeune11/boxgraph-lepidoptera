id: lammps_droplet_asphericity
name: LAMMPS droplet asphericity index (Supplementary Fig. 1E)
role: processing
stated:
  page: 22
  printed_page: "SI-8"
  quote: "Final asphericity index and F. Aspect ratio of droplet"
  where: "Supplementary Fig. 1E y-axis"
equation: "asphericity = (c^2 / (a * b))^(1/3)"
inputs:
  a: {quantity: lj_length, unit: dimensionless}
  b: {quantity: lj_length, unit: dimensionless}
  c: {quantity: lj_length, unit: dimensionless}
outputs:
  asphericity: {quantity: asphericity_index, unit: dimensionless}
settings: {}
stochastic: false
