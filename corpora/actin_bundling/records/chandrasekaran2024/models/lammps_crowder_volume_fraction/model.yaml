id: lammps_crowder_volume_fraction
name: LAMMPS crowder volume fraction using stated sphere radius r = 1 sigma
role: processing
stated:
  page: 20
  printed_page: "SI-6"
  quote: "Both VASP and crowder molecules are modeled as spheres of radius"
  where: "Supplementary Methods 1 & Supplementary Table 1"
equation: "phi = N_crowder * (4/3) * pi * r_crowder^3 / L_box^3"
inputs:
  N_crowder: {quantity: molecule_count, unit: dimensionless}
  r_crowder: {quantity: lj_length, unit: dimensionless}
  L_box: {quantity: lj_length, unit: dimensionless}
outputs:
  phi: {quantity: volume_fraction, unit: percent}
settings: {}
from_words: true
stochastic: false
