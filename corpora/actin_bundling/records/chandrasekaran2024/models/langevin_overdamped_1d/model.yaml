id: langevin_overdamped_1d
name: 1D single-particle overdamped Langevin trajectory integrator (Eq. 1)
role: model
stated:
  page: 10
  printed_page: "10"
  quote: "CytoSim employs the Langevin equation to evolve"
  where: "Methods, Eq. 1"
equation: "dx(t) = mu * f * dt + dB(t), dB(t) ~ N(0, sqrt(2 * mu * k_B T * dt))"
inputs:
  mu: {quantity: mobility, unit: um/(pN*s)}
  kBT: {quantity: thermal_energy, unit: pN*nm}
  f: {quantity: force, unit: pN}
outputs:
  D_eff: {quantity: diffusion_coefficient, unit: um^2/s}
  mean_dx: {quantity: displacement, unit: um}
settings:
  dt: 0.002
  t_sim: 1.0
  n_particles: 4000
  seed: 42
stochastic: true
