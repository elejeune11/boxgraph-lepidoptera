id: filament_length_limited_aspect_ratio
name: filament-length-limited aspect ratio of a constant-volume prolate droplet (2a = L_fil^max)
role: model
stated:
  page: 8
  printed_page: "8"
  quote: "permitted when the ellipsoidal span, 2a = Lﬁlmax"
  where: "Fig. 7B caption & Methods p. 10"
equation: "(a / b)_lim = (L_max / (2 * R_drop))^(3/2)"
inputs:
  L_max: {quantity: filament_length, unit: um}
  R_drop: {quantity: droplet_radius, unit: um}
outputs:
  aspect_ratio: {quantity: aspect_ratio, unit: dimensionless}
settings: {}
from_words: true
stochastic: false
