id: brownian_noise_stddev
name: Brownian noise increment standard deviation in overdamped Langevin step
role: model
stated:
  page: 10
  printed_page: "10"
  quote: "standard deviation"
  where: "Methods, Eq. 1 text"
equation: "sigma_B = sqrt(2 * D * dt)"
inputs:
  D: {quantity: diffusion_coefficient, unit: um^2/s}
  dt: {quantity: time_step, unit: s}
outputs:
  sigma_B: {quantity: displacement, unit: um}
settings: {}
stochastic: false
