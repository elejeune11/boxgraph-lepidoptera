id: filament_growth_time
name: time for a seed filament to elongate to a target length
role: model
stated:
  page: 3
  printed_page: "3"
  quote: "recognizing that at t > 184.47 s"
  where: "text (pp. 3, 5)"
equation: "t_grow = (L_target - L0) / k_grow"
inputs:
  L_target: {quantity: filament_length, unit: um}
  L0: {quantity: filament_length, unit: um}
  k_grow: {quantity: elongation_rate, unit: nm/s}
outputs:
  t_grow: {quantity: time, unit: s}
settings: {}
from_words: true
stochastic: false
