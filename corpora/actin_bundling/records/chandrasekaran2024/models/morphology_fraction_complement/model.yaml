id: morphology_fraction_complement
name: experimental droplet morphology percentage closure (Disk = 100% - Ring - Shell)
role: processing
stated:
  page: 7
  printed_page: "7"
  quote: "shells, rings, and disks as a function of actin to VASP ratio"
  where: "text & Fig. 6D"
equation: "P_disk = 100 - P_ring - P_shell"
inputs:
  P_ring: {quantity: ring_abundance, unit: percent}
  P_shell: {quantity: shell_abundance, unit: percent}
outputs:
  P_disk: {quantity: disk_abundance, unit: percent}
settings: {}
from_words: true
stochastic: false
