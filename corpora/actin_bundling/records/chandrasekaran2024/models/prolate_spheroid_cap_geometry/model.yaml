id: prolate_spheroid_cap_geometry
name: prolate spheroid polar-cap subvolume cut and actin concentration threshold
role: processing
stated:
  page: 10
  printed_page: "10"
  quote: "empirically choose a volume fraction of 12.5%"
  where: "Methods p. 10 & Supplementary Fig. 13 p. 34"
equation: "f_single = f_caps / 2; f_caps = 0.5 * (1 - u)^2 * (2 + u); C_thresh = C_bulk / 3"
inputs:
  f_caps: {quantity: volume_fraction, unit: percent}
  C_bulk: {quantity: actin_concentration, unit: uM}
outputs:
  f_single: {quantity: volume_fraction, unit: percent}
  u_cap: {quantity: dimensionless_axial_cut, unit: dimensionless}
  C_thresh: {quantity: actin_concentration, unit: uM}
  C_thresh_pct: {quantity: concentration_fraction, unit: percent}
settings:
  tol: 1.0e-4
from_words: true
stochastic: false
