id: brownian_noise_from_mobility
name: Brownian noise increment standard deviation expressed via mobility and thermal energy
role: model
stated:
  page: 10
  printed_page: "10"
  quote: "where the diffusion coefﬁcient is given by"
  where: "Methods, Eq. 1 text"
equation: "sigma_B = sqrt(2 * mu * k_B T * dt)"
inputs:
  mu: {quantity: mobility, unit: um/(pN*s)}
  kBT: {quantity: thermal_energy, unit: pN*nm}
  dt: {quantity: time_step, unit: s}
outputs:
  sigma_B: {quantity: displacement, unit: um}
settings: {}
stochastic: false
