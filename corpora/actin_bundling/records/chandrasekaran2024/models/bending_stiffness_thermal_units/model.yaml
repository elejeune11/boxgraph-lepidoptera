id: bending_stiffness_thermal_units
name: conversion of discrete actin bending stiffness from pN*nm to thermal energy units k_B T
role: processing
stated:
  page: 16
  printed_page: "SI-2"
  quote: "Determined from 10394"
  where: "Supplementary Table 1"
equation: "k_bend_thermal = k_bend_phys / (k_B T)"
inputs:
  k_bend_phys: {quantity: bending_energy_parameter, unit: pN*nm}
  kBT: {quantity: thermal_energy, unit: pN*nm}
outputs:
  k_bend_thermal: {quantity: bending_energy_thermal, unit: dimensionless}
settings: {}
stochastic: false
