id: prolate_spheroid_volume_conserving
name: constant-volume 3D prolate spheroid geometry (sphere-to-ellipsoid transition)
role: model
stated:
  page: 10
  printed_page: "10"
  quote: "steps of 10 nm under constant volume conditions"
  where: "Methods p. 10 & Supplementary Table 2 p. 17"
equation: "b = sqrt(R_drop^3 / a); a/b = (a / R_drop)^(3/2); S = 2 pi b^2 (1 + (a / (b e)) arcsin(e))"
inputs:
  a: {quantity: spheroid_axis, unit: um}
  R_drop: {quantity: droplet_radius, unit: um}
outputs:
  b: {quantity: spheroid_axis, unit: um}
  aspect_ratio: {quantity: aspect_ratio, unit: dimensionless}
  surface_area: {quantity: surface_area, unit: um^2}
settings: {}
from_words: true
stochastic: false
