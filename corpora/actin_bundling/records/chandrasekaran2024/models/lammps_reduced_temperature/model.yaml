id: lammps_reduced_temperature
name: reduced Lennard-Jones temperature T* (Supplementary Methods 1)
role: model
stated:
  page: 21
  printed_page: "SI-7"
  quote: "reduced temperature T ∗= kB T/ϵV−V = 1.0"
  where: "Supplementary Methods 1"
equation: "T_star = k_B T / eps_VV"
inputs:
  kBT: {quantity: thermal_energy, unit: pN*nm}
  eps_VV: {quantity: thermal_energy, unit: pN*nm}
outputs:
  T_star: {quantity: lj_temperature, unit: dimensionless}
settings: {}
stochastic: false
