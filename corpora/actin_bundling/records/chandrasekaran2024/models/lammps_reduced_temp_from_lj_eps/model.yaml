id: lammps_reduced_temp_from_lj_eps
name: reduced Lennard-Jones temperature T* evaluated in Supplementary Table 1 k_B T units
role: model
stated:
  page: 21
  printed_page: "SI-7"
  quote: "reduced temperature T ∗= kB T/ϵV−V = 1.0"
  where: "Supplementary Methods 1 (p. 21) & Supplementary Table 1 (p. 16)"
equation: "T_star = 1 / (eps_VV / k_B T)"
inputs:
  eps_VV_lj: {quantity: lj_energy, unit: dimensionless}
outputs:
  T_star: {quantity: lj_temperature, unit: dimensionless}
settings: {}
stochastic: false
