id: final_actin_concentration
name: molar F-actin concentration in a spherical droplet from filament count and length
role: processing
stated:
  page: 3
  printed_page: "3"
  quote: "centration is 27.67 μM). The simulation time of 600 s"
  where: text
equation: "C_actin = (N_fil * L_fil / dl) / (N_A * (4/3) * pi * R_drop^3)"
inputs:
  N_fil: {quantity: filament_count, unit: dimensionless}
  L_fil: {quantity: filament_length, unit: um}
  dl: {quantity: actin_monomer_rise, unit: nm}
  R_drop: {quantity: droplet_radius, unit: um}
outputs:
  C_actin: {quantity: actin_concentration, unit: uM}
settings: {}
from_words: true
stochastic: false
