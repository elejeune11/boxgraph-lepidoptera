id: elongation_rate_from_growth_time
name: filament elongation speed required to reach target length in time T_grow
role: processing
stated:
  page: 18
  printed_page: "SI-4"
  quote: "This rate is calculated to allow actin filaments reach"
  where: "Supplementary Table 2"
equation: "k_grow = (L_target - L0) / T_grow"
inputs:
  L_target: {quantity: filament_length, unit: um}
  L0: {quantity: filament_length, unit: um}
  T_grow: {quantity: time, unit: s}
outputs:
  k_grow: {quantity: elongation_rate, unit: nm/s}
settings: {}
from_words: true
stochastic: false
