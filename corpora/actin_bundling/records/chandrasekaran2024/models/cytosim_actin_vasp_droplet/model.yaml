id: cytosim_actin_vasp_droplet
name: 3D agent-based CytoSim actin-VASP droplet simulation
role: model
stated:
  page: 10
  printed_page: "10"
  quote: "CytoSim employs the Langevin equation to evolve"
  where: "Methods, Eq. 1 & Supplementary Table 2"
equation: "dx^{ij}(t) = mu f^{ij}_tot(t) dt + dB_j(t)"
inputs:
  R_drop: {quantity: droplet_radius, unit: um}
  N_fil: {quantity: filament_count, unit: dimensionless}
  L0: {quantity: filament_length, unit: um}
  k_grow: {quantity: elongation_rate, unit: nm/s}
  vasp_conc: {quantity: vasp_tetramer_concentration, unit: uM}
  k_bind: {quantity: binding_rate, unit: 1/s}
  k_unbind: {quantity: unbinding_rate, unit: 1/s}
  f_u: {quantity: force, unit: pN}
  kappa: {quantity: flexural_rigidity, unit: pN*um^2}
outputs:
  area_fraction: {quantity: surface_area_fraction, unit: dimensionless}
settings:
  dt: 0.002
  t_sim: 600.0
  seed: 0
described_from: ref-81
runnable: false
not_runnable_reason: >
  Full 3D many-body agent-based simulation of growing semiflexible F-actin fibers and diffusing
  tetrameric VASP crosslinkers requires the C++ CytoSim engine and unstated configuration details
  (crosslinker spring stiffness, exact steric interaction functional form and cutoff, temperature T
  for Brownian noise, exact Brownian ratchet force-velocity coupling, and random seeds).
stochastic: true
