id: bell_slip_bond_unbinding
name: Bell slip-bond force-dependent crosslinker unbinding rate
role: model
stated:
  page: 3
  printed_page: "3"
  quote: "slip bond kinetics in accordance with Bell’s law"
  where: "Fig. 1D caption, Methods p. 10 & Supplementary Table 2"
equation: "k_unbind(f) = k_unbind0 * exp(f / f_u); tau_res = 1 / k_unbind(f)"
inputs:
  k_unbind0: {quantity: unbinding_rate, unit: 1/s}
  f: {quantity: force, unit: pN}
  f_u: {quantity: force, unit: pN}
outputs:
  k_unbind: {quantity: unbinding_rate, unit: 1/s}
  tau_res: {quantity: residence_time, unit: s}
settings: {}
described_from: ref-SI5
from_words: true
stochastic: false
