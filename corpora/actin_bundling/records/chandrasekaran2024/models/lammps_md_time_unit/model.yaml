id: lammps_md_time_unit
name: LAMMPS molecular dynamics time scale tau_MD as printed (missing square root)
role: model
stated:
  page: 21
  printed_page: "SI-7"
  quote: "with time step δt = 0.0005τMD"
  where: "Supplementary Methods 1"
equation: "tau_MD = sigma * (m / eps_VV)"
inputs:
  sigma: {quantity: particle_radius, unit: nm}
  m: {quantity: particle_mass, unit: kg}
  eps_VV: {quantity: thermal_energy, unit: pN*nm}
outputs:
  tau_MD_printed: {quantity: md_time_unit_misprinted_dim, unit: s^2/m}
settings: {}
stochastic: false
