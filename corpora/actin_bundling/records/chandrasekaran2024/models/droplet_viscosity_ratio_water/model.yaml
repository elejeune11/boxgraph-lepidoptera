id: droplet_viscosity_ratio_water
name: ratio of droplet dynamic viscosity to water viscosity
role: processing
stated:
  page: 17
  printed_page: "SI-3"
  quote: "Viscosity of droplet medium    0.5 pN/s"
  where: "Supplementary Table 2"
equation: "alpha_visc = eta_drop / eta_water"
inputs:
  eta_drop: {quantity: dynamic_viscosity, unit: pN*s/um^2}
  eta_water: {quantity: dynamic_viscosity, unit: pN*s/um^2}
outputs:
  alpha_visc: {quantity: viscosity_ratio, unit: dimensionless}
settings: {}
from_words: true
stochastic: false
