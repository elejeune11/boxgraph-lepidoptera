id: lammps_lennard_jones_potential
name: truncated Lennard-Jones pair potential in LAMMPS (Supplementary Methods 1)
role: model
stated:
  page: 20
  printed_page: "SI-6"
  quote: "Crowder molecules interact through an LJ potential"
  where: "Supplementary Methods 1"
equation: "U(r) = 4 * eps * [(sigma / r)^12 - (sigma / r)^6] for r <= r_cut, else 0"
inputs:
  eps: {quantity: lj_energy, unit: dimensionless}
  sigma: {quantity: lj_length, unit: dimensionless}
  r: {quantity: lj_length, unit: dimensionless}
  r_cut: {quantity: lj_length, unit: dimensionless}
outputs:
  U: {quantity: lj_energy, unit: dimensionless}
  r_wca: {quantity: lj_length, unit: dimensionless}
settings: {}
described_from: ref-SI1
stochastic: false
