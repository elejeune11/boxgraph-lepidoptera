id: quasistatic_droplet_deformation_schedule
name: discrete quasi-static constant-volume droplet elongation schedule (10 nm Z-span steps per 1 s)
role: model
stated:
  page: 10
  printed_page: "10"
  quote: "steps of 10 nm under constant volume conditions"
  where: "Methods p. 10 & Fig. 7Aii p. 8"
equation: "a(t) = R_drop + 0.5 * floor((t - t0) / dt_relax) * dz; a/b = (a(t) / R_drop)^(3/2)"
inputs:
  t: {quantity: time, unit: s}
  t0: {quantity: time, unit: s}
  R_drop: {quantity: droplet_radius, unit: um}
  dz: {quantity: displacement, unit: nm}
  dt_relax: {quantity: time, unit: s}
outputs:
  a: {quantity: spheroid_axis, unit: um}
  aspect_ratio: {quantity: aspect_ratio, unit: dimensionless}
settings: {}
from_words: true
stochastic: false
