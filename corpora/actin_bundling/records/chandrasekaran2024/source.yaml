notes: >
  Complete reading of Chandrasekaran, Graham, Stachowiak & Rangamani (Nature Communications 15,
  3139, 2024), covering the main article and Methods (PDF pp. 1-14), Supplementary Information
  MOESM1_ESM (PDF pp. 15-36, journal SI pp. 1-22), and Supplementary Movie descriptions
  MOESM4_ESM (PDF p. 37). All printed numbers, tables (Supplementary Tables 1-4, including the
  image-embedded Supplementary Table 3 on p. 19), and equations were verified directly against
  rendered page images (pages/page-NNN.png).

  In scope: (1) All four full many-body/external models recorded explicitly as runnable: false
  (3D CytoSim agent-based network, 3D LAMMPS bead-spring/LJ droplet MD, 2D continuum energy
  balance from Graham et al. 2023, and the cited ODE model for [T-actin] = 138.38 uM); (2) all
  closed-form, single-body, mechanical, kinetic, geometric, and data-processing equations stated
  symbolically or in words across the main text and SI (37 runnable printed/from-words models +
  2 corrected variants for evident misprints + 1 reconstructed Stokes-Einstein consistency check,
  44 models total); (3) all printed CytoSim, LAMMPS, nucleator, and experimental parameters and measurements;
  (4) numerical refinements on the 1D stochastic overdamped Langevin solver and the spheroid cap
  root-finder; and (5) within-paper ModelAtlas relations stated by the paper.

  Out of scope for this read stage: figure digitization (deferred to the digitize stage; schematic
  and un-digitized figures include Fig. 1B-D, Fig. 2, Fig. 3A/C/F, Fig. 4A, Fig. 5A-B, Fig. 6A/C,
  Fig. 7A/C/D/E, Supp. Figs. 1A/C/D, 2A, 3, 6A, 7, 11A, 13A-B, 14), and downstream external
  code/source-data records (chandrasekaran_source_data and chandrasekaran_cytosim are separate
  jobs).
