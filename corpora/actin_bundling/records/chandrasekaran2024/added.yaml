- id: actin_monomer_rise_added
  quantity: actin_monomer_rise
  unit: nm
  printed: "2.7"
  basis: "Standard axial rise per G-actin monomer subunit in F-actin (2.7 nm/monomer, ~370.4 monomers/um), not explicitly stated in the paper but required to convert total filament contour length to molar actin concentration."
  alternatives: ["2.7027", "2.75"]
  stands_for: "axial length per actin monomer subunit (for 27.67 uM calculation on p. 3)"

- id: viscosity_water_added
  quantity: dynamic_viscosity
  unit: pN*s/um^2
  printed: "0.001"
  basis: "Standard dynamic viscosity of water at ~20 degC (1 mPa*s = 0.001 Pa*s = 0.001 pN*s/um^2), required to check the '50x water' note in Supplementary Table 2 (p. 17)."
  alternatives: ["0.00089", "0.001002"]
  stands_for: "viscosity of water referenced in '50x water' (Supplementary Table 2, p. 17)"

- id: viscosity_droplet_unit_corrected_added
  quantity: dynamic_viscosity
  unit: pN*s/um^2
  printed: "0.5"
  basis: "Dynamic-viscosity unit reading (0.5 pN*s/um^2 = 0.5 Pa*s) of the dimensionally misprinted Supplementary Table 2 entry '0.5 pN/s um^2'; alternative 0.05 Pa*s matches the accompanying '50x water' note."
  alternatives: ["0.05"]
  stands_for: "dynamic viscosity of the droplet medium (Supplementary Table 2, p. 17)"

- id: force_probe_bell_added
  quantity: force
  unit: pN
  printed: "5"
  basis: "Representative tensile load (0.5 * f_u) for evaluating the Bell slip-bond unbinding model and Brownian ratchet growth rate; zero force and characteristic force 10 pN are tested as alternatives."
  alternatives: ["0", "10"]
  stands_for: "applied force f in Bell slip-bond unbinding (Fig. 1D, p. 3) and Brownian ratchet growth (Supplementary Table 2, p. 18)"

- id: displacement_probe_spring_added
  quantity: displacement
  unit: nm
  printed: "10"
  basis: "Representative boundary excursion / steric overlap distance (10 nm) for evaluating harmonic repulsion forces in CytoSim (Supplementary Table 2, pp. 17-19)."
  alternatives: ["1", "30"]
  stands_for: "boundary excursion or steric overlap delta"

- id: lammps_pair_distance_probe_added
  quantity: lj_length
  unit: dimensionless
  printed: "1.5"
  basis: "Representative interparticle separation r = 1.5 sigma within the attractive well (2^(1/6) sigma < r < 2.5 sigma) for evaluating the printed Lennard-Jones potential U_{V-V}(r) (p. 20)."
  alternatives: ["1.12246", "2.0"]
  stands_for: "interparticle distance r in U_{V-V}(r) (Supplementary Methods 1, p. 20)"

- id: lammps_bond_stretch_probe_added
  quantity: lj_length
  unit: dimensionless
  printed: "0.11"
  basis: "Representative 10% bond stretch above r0 = 0.1 sigma for evaluating the LAMMPS actin harmonic bond potential (Supplementary Table 1, p. 16)."
  alternatives: ["0.105", "0.12"]
  stands_for: "instantaneous actin bond distance r in LAMMPS harmonic bond potential"

- id: lammps_angle_probe_added
  quantity: bond_angle
  unit: deg
  printed: "170"
  basis: "Representative 10-degree bend away from equilibrium theta0 = 180 deg for evaluating the LAMMPS actin harmonic angle potential (Supplementary Table 1, p. 16)."
  alternatives: ["175", "160"]
  stands_for: "instantaneous bead-triplet angle theta in LAMMPS harmonic angle potential"

- id: lammps_particle_mass_si_added
  quantity: particle_mass
  unit: kg
  printed: "2.66 x 10^-22"
  basis: "Estimated mass of one ~160 kDa human VASP tetramer (~4 x 40 kDa = 160 kDa = 2.66 x 10^-22 kg), not stated in Supplementary Methods 1 (p. 21), used to evaluate physical units of tau_MD."
  alternatives: ["6.64 x 10^-23", "5.31 x 10^-22"]
  stands_for: "particle mass m in tau_MD = sigma * (m / epsilon_{V-V}) (p. 21)"

- id: lammps_sigma_si_added
  quantity: particle_radius
  unit: nm
  printed: "60"
  basis: "Approximate VASP tetramer diameter (2 * 30 nm = 60 nm from CytoSim VASP radius 30 nm on p. 18), used to evaluate physical scale of tau_MD on p. 21."
  alternatives: ["30", "10"]
  stands_for: "physical length scale sigma in tau_MD (p. 21)"

- id: lammps_eps_si_added
  quantity: thermal_energy
  unit: pN*nm
  printed: "4.11"
  basis: "Energy scale epsilon_{V-V} = k_B T = 4.11 pN*nm implied by reduced temperature T* = k_B T / epsilon_{V-V} = 1.0 (p. 21) and k_B T = 4.11 pN*nm (Supplementary Table 1, p. 16)."
  alternatives: ["2.48", "6.82"]
  stands_for: "physical interaction energy scale epsilon_{V-V} in tau_MD (p. 21)"

- id: lammps_ellipsoid_a_probe_added
  quantity: lj_length
  unit: dimensionless
  printed: "17.5"
  basis: "Representative minor semi-axis (~17.5 sigma) of a weakly deformed LAMMPS droplet (equivalent radius ~18.3 sigma in Supplementary Fig. 1B) for evaluating asphericity and aspect ratio formulas (Supplementary Fig. 1E-F, p. 22)."
  alternatives: ["16.5", "18.0"]
  stands_for: "minor ellipsoid semi-axis a (and b) in Supplementary Fig. 1E-F"

- id: lammps_ellipsoid_c_probe_added
  quantity: lj_length
  unit: dimensionless
  printed: "20.5"
  basis: "Representative major semi-axis (~20.5 sigma, c/a ~ 1.17, matching 20-filament bar in Supplementary Fig. 1F) for evaluating LAMMPS asphericity and aspect ratio formulas (p. 22)."
  alternatives: ["19.0", "22.0"]
  stands_for: "major ellipsoid semi-axis c in Supplementary Fig. 1E-F"

- id: lammps_shell_count_probe_added
  quantity: molecule_count
  unit: dimensionless
  printed: "3000"
  basis: "Representative VASP particle count inside a 1-sigma-thick spherical shell near r = 17.5 sigma (4*pi*17.5^2*1 * 0.78 ~ 3000 particles, matching the interior droplet plateau ~0.78/sigma^3 in Supplementary Fig. 1B) for evaluating the printed radial number density equation N/(4*pi*r^2*dr) (p. 22)."
  alternatives: ["2500", "3500"]
  stands_for: "shell particle count N in Radial density N/(4*pi*r^2*dr) (Supplementary Fig. 1B, p. 22)"
