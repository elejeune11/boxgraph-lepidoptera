# Cross-record links from chandrasekaran2024 values to CytoSim built-in defaults and
# bundled example conventions recorded in chandrasekaran_cytosim.
#
# Notes on scope:
# 1. Most cross-record value links run in the opposite direction (chandrasekaran_cytosim
#    copying chandrasekaran2024's simulation inputs and digitized Supp. Fig. 6B-C targets):
#    31 of 32 from_source: chandrasekaran2024 datums in chandrasekaran_cytosim/data.yaml
#    already declare from_datum and check out as reproduced (the single unlinked datum,
#    paper_nuc_conc_150 = 150 nM, has no scalar datum in chandrasekaran2024/data.yaml,
#    where 150 nM appears only as a table index in nucleator_molecules_table and condition).
# 2. CytoSim's built-in defaults that chandrasekaran2024 leaves unstated (default kT = 0.0042
#    pN*um, default drag_radius = 0.0125 um, water viscosity = 0.001 pN*s/um^2) do not appear
#    as authored datums in chandrasekaran2024/data.yaml (water viscosity is in added.yaml;
#    kbt_printed = 4.11 pN*nm is LAMMPS's temperature, not CytoSim's default 4.2 pN*nm).
# 3. actin_flexural_rigidity (0.075 pN*um^2) already declares from_source: ref-SI4 (Gittes 1993),
#    and actin_steric_radius (3.5 nm) is the physical steric radius rather than CytoSim's
#    drag_radius (cym/arp23.cym:31). Only boundary_stiffness_actin (200 pN/um) directly matches
#    CytoSim's bundled actin confinement convention (cym/actin.cym:25).

- datum: boundary_stiffness_actin
  from_source: chandrasekaran_cytosim
  from_datum: cyto_cym_actin_confine_stiff
  evidence: "Supplementary Table 2 (p. 17) sets actin filament spherical boundary confinement stiffness to 200 pN/um in CytoSim, matching CytoSim's bundled cym/actin.cym example convention (line 25: 'confine = inside, 200')."

