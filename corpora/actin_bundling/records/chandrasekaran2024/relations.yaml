    a: "R * (3 * (sin(alpha) - alpha * cos(alpha) - sin(alpha)**3 / 3) / 2)**(1/3) * (sin(alpha) / (1 - cos(alpha)))**(2/3)"
  output_map:
    surface_area: A
  regime:
    R: [0.5, 10.0]
