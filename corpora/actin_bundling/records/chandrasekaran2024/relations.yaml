  assumptions:
    - "Free-particle passive diffusion (f = 0) and isotropic two-bead filament center-of-mass mobility mu = 1 / (2 * gamma^f)."
    - "Restored k_B T in Sekine's FDT (q_fdt_missing_kBT) and mobility interpretation of mu in Chandrasekaran Eq. (1) (q_eq1_mu_called_viscosity)."
    - "Tolerance 0.05 covers finite-sample Monte Carlo variance of chandrasekaran2024/langevin_overdamped_1d at n_particles = 4000, seed = 42."

- id: rel_sekine2024_cgmd_dx_approx_brownian_noise
  kind: approximated_by
  a: sekine2024/cgmd_anisotropic_langevin
  b: chandrasekaran2024/brownian_noise_from_mobility
  mapping:
    mu: "1 / (6 * pi * eta_cyto * (3 * d_f + 2 * L0_f / 5))"
    kBT: "1000 * kBT"
    dt: "t_obs"
  output_map:
    sigma_B: mean_abs_dx
  regime:
    eta_cyto: [0.5, 2.0]
    d_f: [0.008, 0.012]
    L0_f: [0.08, 0.15]
    kappa_f: [5.0, 15.0]
    kBT: [0.0035, 0.0045]
    friction_asymmetry: [1.0, 2.0]
    t_obs: [0.05, 0.5]
  tolerance: 0.25
  provenance: proposed
  reason: >
    In Sekine et al.'s single-filament 2D overdamped Langevin solver (Eqs. S1a-S1b & S5 with
    restored k_B T in the FDT), internal harmonic spring forces cancel identically from the
    two-bead center of mass cm = (r_0 + r_1)/2, so longitudinal displacement Delta x_cm(t_obs) is
    zero-mean Gaussian with exact standard deviation sigma_B = sqrt(2 * mu_cm,x * k_B T * t_obs)
    matching Chandrasekaran et al.'s Eq. (1) Brownian noise law (brownian_noise_from_mobility)
    with center-of-mass mobility mu_cm,x = 1 / (2 * gamma_x^f) =
    1 / (6 * pi * eta_cyto * (3 * d_f + 2 * L0_f / 5)) and unit conversion kBT_pNnm = 1000 * kBT_pNum.
    Because cgmd_anisotropic_langevin reports the half-normal mean absolute displacement
    E[|Delta x_cm|] = sqrt(2/pi) * sigma_B ~= 0.7979 * sigma_B rather than the RMS standard
    deviation sigma_B, the two outputs differ by the exact deterministic statistical factor
    1 - sqrt(2/pi) = 20.21% plus ~2% Monte Carlo sampling error at n_traj = 2000 (max 22.1%
    across the Euler-Maruyama stable regime, within tolerance 0.25).
  assumptions:
    - "Single free two-bead actin filament without crosslinker/motor coupling; Euler-Maruyama stable regime (eta_cyto in [0.5, 2.0] Pa*s bracketing Table S1 1 Pa*s; dt = 1e-3 s)."
    - "Restored k_B T in Sekine's FDT (q_fdt_missing_kBT) and mobility mu = 1/(2*gamma_x^f) in Chandrasekaran Eq. (1) (q_eq1_mu_called_viscosity)."
    - "Tolerance 0.25 explicitly accounts for the exact Gaussian half-normal-to-RMS ratio sqrt(2/pi) = 0.7979 (20.21% deterministic difference) plus ~2-3% finite-ensemble spread at n_traj = 2000."

- id: rel_sekine2024_cgmd_dy_approx_brownian_noise
  kind: approximated_by
  a: sekine2024/cgmd_anisotropic_langevin
  b: chandrasekaran2024/brownian_noise_from_mobility
  mapping:
