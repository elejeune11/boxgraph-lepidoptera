    kBT: "1000 * kBT"
    dt: "t_obs"
  output_map:
    sigma_B: mean_abs_dy
  regime:
    eta_cyto: [0.5, 2.0]
    d_f: [0.008, 0.012]
    L0_f: [0.08, 0.15]
    kappa_f: [5.0, 15.0]
    kBT: [0.0035, 0.0045]
    friction_asymmetry: [1.0, 2.0]
    t_obs: [0.05, 0.5]
  tolerance: 0.25
  provenance: proposed
  reason: >
    Along Sekine et al.'s anisotropic circumferential (y) axis (Eq. S1b: gamma_y^f =
    friction_asymmetry * gamma_x^f with anisotropic FDT variance 2 * gamma_y^f * k_B T), the
    two-bead center-of-mass displacement Delta y_cm(t_obs) is Gaussian with exact standard
    deviation sigma_B = sqrt(2 * mu_cm,y * k_B T * t_obs) from Chandrasekaran et al.'s Eq. (1)
    under directional mobility mu_cm,y = 1 / (2 * gamma_y^f) (which reduces to the isotropic
    mobility 1 / (2 * gamma_x^f) at friction_asymmetry = 1). As on the x-axis, mean_abs_dy =
    E[|Delta y_cm|] = sqrt(2/pi) * sigma_B differs from sigma_B by the exact 20.21% half-normal
    factor plus ~2% Monte Carlo spread at n_traj = 2000 (max 22.1%, within 0.25); notably,
    this 20.21% observable difference persists at friction_asymmetry = 1, preventing an exact
    reduces_to limit onto sigma_B without converting E[|Delta y|] to RMS.
  assumptions:
    - "Anisotropic FDT assumption in cgmd_anisotropic_langevin (noise variance 2 * gamma_y^f * k_B T along y; unstated in Sekine SI Notes, see sekine2024/q_fdt_missing_kBT)."
    - "Euler-Maruyama stable regime (eta_cyto in [0.5, 2.0] Pa*s, friction_asymmetry in [1.0, 2.0], dt = 1e-3 s)."
    - "Tolerance 0.25 accounts for exact half-normal factor 1 - sqrt(2/pi) = 20.21% plus ~2% Monte Carlo spread."

- id: rel_sekine2024_cgmd_dy_scales_brownian_noise
  kind: scales_as
  a: sekine2024/cgmd_anisotropic_langevin
  b: chandrasekaran2024/brownian_noise_from_mobility
  mapping:
    mu: "1 / (6 * pi * eta_cyto * friction_asymmetry * (3 * d_f + 2 * L0_f / 5))"
    kBT: "1000 * kBT"
    dt: "0.1"
  output_map:
    sigma_B: mean_abs_dy
  regime:
    eta_cyto: [0.5, 2.0]
    d_f: [0.008, 0.012]
    L0_f: [0.08, 0.15]
    kappa_f: [5.0, 15.0]
    kBT: [0.0035, 0.0045]
    friction_asymmetry: [1.0, 2.0]
    t_obs: [0.05, 0.5]
  provenance: proposed
  reason: >
    Eliminating the constant sqrt(2/pi) half-normal-to-RMS prefactor confirms that Sekine et al.'s
    2D stochastic anisotropic Langevin filament solver (mean_abs_dy) obeys the exact same
    five-parameter thermodynamic and hydrodynamic scaling as Chandrasekaran et al.'s Eq. (1)
    Brownian noise standard deviation sigma_B = sqrt(2 * mu * k_B T * dt) under directional
    two-bead center-of-mass mobility mu = 1 / (2 * gamma_y^f). Log-slopes in kBT (+1/2),
    eta_cyto (-1/2), friction_asymmetry (-1/2), and the nonlinear cylindrical-drag geometry
    parameters d_f and L0_f agree to 4.4e-13 across 60 evaluations. Holding dt fixed at 0.1 s in
    the mapping avoids discrete Euler-Maruyama step-count rounding jumps (n_steps = round(t_obs/dt))
    under 0.1% finite-difference perturbations of t_obs, while t_obs dependence across [0.05, 0.5] s
    is verified directly by rel_sekine2024_cgmd_dx_approx_brownian_noise and
    rel_sekine2024_cgmd_dy_approx_brownian_noise.
  assumptions:
    - "Internal filament harmonic spring cancels identically from center-of-mass Brownian motion; fixed RNG seed = 42 makes finite-difference log-slopes in continuous mobility/energy parameters exact."
    - "Fixed dt = 0.1 s in b isolates the 5 continuous thermodynamic/hydrodynamic variables from discrete step-count rounding in n_steps = round(t_obs / 0.001)."

- id: rel_sekine2024_harmonic_stretch_scales_lammps_bond
  kind: scales_as
  a: sekine2024/harmonic_stretching_potential
  b: chandrasekaran2024/lammps_harmonic_bond_potential
  mapping:
    K_bond: "(kappa / (2 * L0)) * (0.03**2 / 0.00411)"
    r: "r / 0.03"
    r0: "L0 / 0.03"
  output_map:
    U_bond: U_harm
  regime:
    kappa: [5.0, 50.0]
    L0: [0.05, 0.12]
    r: [0.13, 0.25]
  provenance: proposed
  reason: >
    Both coarse-grained actin simulation frameworks maintain F-actin contour length (and
    crosslinker arm/bond length) via a quadratic harmonic stretching potential: Sekine et al.
    Eq. (S5) writes U^harm = (kappa / (2*L0)) * (r - L0)^2 in physical units [pN*um] (5 ops;
    already verified same_as connector_arm_stretching_potential via L0 -> L0/2), whereas
    Chandrasekaran et al. Supplementary Table 1 uses LAMMPS bond_style harmonic
    U_bond = K_bond * (r - r0)^2 in dimensionless LJ k_B T units (3 ops, absorbing the factor 1/2
    into K_bond). Because U_bond is dimensionless and U_harm carries physical energy units [pN*um],
    same_as cannot bridge their dimensions; scales_as verifies exact agreement (to 6.6e-13 across
    36 evaluations) of the constant log-slope in kappa (+1) and the nontrivial, position-dependent
    nonlinear log-slopes 2*r/(r - L0) in r and -1 - 2*L0/(r - L0) in L0 across the stretched
    regime r > L0 (anchored at Chandrasekaran's sigma = 0.03 um and k_B T = 0.00411 pN*um).
  assumptions:
    - "Strictly stretched regime r > L0 (L0 in [0.05, 0.12] um, r in [0.13, 0.25] um) so U_harm > 0 everywhere and log-slopes are well-defined."
    - "Fixed LJ reference scales sigma = 0.03 um (30 nm VASP radius) and k_B T = 0.00411 pN*um (Chandrasekaran Supplementary Tables 1-2; constant unit conversions preserve all log-slopes, independent of LAMMPS's 1/2 factor convention in q_lammps_harmonic_half_factor_convention)."

# ---------------------------------------------------------------------------
# Cross-record relations with weirich2017 (Weirich et al., PNAS 114(9):2131-2136, 2017)
# Neither paper cites the other (chandrasekaran2024 cites only the 2019 motor-driven
# active-droplet follow-up Weirich et al. PNAS 116:11125-11130 as Ref. 12; zero shared
# references; 0 stated relations; 0 cited.yaml links). All 7 relations below are
# provenance: proposed and avoid too_plain (<= 2 ops) or spurious coincidences:
# - Rejected spurious shape-matched pair: chandrasekaran2024/filament_elongation_length
#   (single-filament linear chemical polymerization L0 + k_grow*t) vs
#   weirich2017/tactoid_exponential_relaxation (macroscopic viscous capillary droplet
#   shortening L_f + (L_i - L_f)*exp(-t/tau)); orthogonal physics, scales, and signs.
# - Rejected failed spherical limit L -> r on stokes_einstein_ellipsoid_diffusion:
#   Weirich uses Berg's (1983) slender-body approximation ln(2*L/r), which yields
#   ln(2) = 0.6931 != 1 at L = r (30.7% deficit vs exact Perrin atanh(e)/e -> 1);
#   instead, mapping the physical translational Stokes hydrodynamic radius
#   R_H = L / ln(2*L/r) joins weirich2017/stokes_einstein_ellipsoid_diffusion into
#   the unified Stokes-Einstein ModelAtlas family alongside chandrasekaran2024 and sekine2024.
# ---------------------------------------------------------------------------
- id: rel_weirich2017_stokes_einstein_diffusion
  kind: same_as
  a: weirich2017/stokes_einstein_ellipsoid_diffusion
  b: chandrasekaran2024/stokes_einstein_diffusion
  mapping:
    kBT: "1380649 * T / 100000000"
    eta: "eta"
    r: "L / log(2 * L / r)"
  output_map:
    D_SE: D
  regime:
    T: [285.0, 315.0]
    L: [45.0, 500.0]
    r: [3.0, 5.0]
    eta: [0.05, 5.0]
  provenance: proposed
  reason: >
    Both models evaluate passive single-particle translational diffusivity inside phase-separated
    cytoskeletal droplets via the Stokes-Einstein fluctuation-dissipation law
    D = k_B T / (6 * pi * eta * R_H) across overlapping temperatures (293-300 K) and viscosities
    (eta = 0.05-3 Pa*s; 1 Pa*s = 1 pN*s/um^2 exactly). In the literal spherical limit L -> r,
    Weirich et al.'s Berg (1983) slender-ellipsoid formula D = k_B T ln(2*L/r) / (6*pi*eta*L) does
    NOT reduce to D_SE = k_B T / (6*pi*eta*r) (falling short by 1 - ln(2) = 30.69% because ln(2L/r)
    omits Perrin's exact atanh(e)/e factor). However, substituting exact CODATA 2018 thermal energy
    k_B T = 0.01380649 * T [pN*nm] and Berg's slender-ellipsoid equivalent translational
    hydrodynamic Stokes radius R_H = L / ln(2*L/r) [nm] (22.84 nm for Weirich's 180 nm x 7 nm
    F-actin filament vs 30 nm for Chandrasekaran's spherical VASP tetramer) maps
    weirich2017/stokes_einstein_ellipsoid_diffusion (8 ops) identically onto
    chandrasekaran2024/stokes_einstein_diffusion (4 ops), uniting them (alongside
    sekine2024/filament_einstein_stokes_diffusion) in a single Stokes-Einstein ModelAtlas family.
  assumptions:
    - "Slender-rod hydrodynamic radius R_H = L / ln(2*L/r) (L >> r, here L/r in [9, 167] covering Weirich's 0.09-1.0 um capped F-actin)."
    - "Exact CODATA 2018 Boltzmann constant k_B = 1.380649e-23 J/K = 0.01380649 pN*nm/K and unit identity 1 Pa*s = 1 pN*s/um^2."
    - "Translational Stokes radius maps Weirich's rigid short F-actin rod (R_H = 22.84 nm at L = 90 nm, r = 3.5 nm) to Chandrasekaran's spherical VASP tetramer (r = 30 nm)."

- id: rel_weirich2017_ellipsoid_diff_approx_langevin1d
  kind: approximated_by
  a: weirich2017/stokes_einstein_ellipsoid_diffusion
  b: chandrasekaran2024/langevin_overdamped_1d
  mapping:
    mu: "1000 * log(2 * L / r) / (6 * pi * eta * L)"
    kBT: "1380649 * T / 100000000"
    f: "0"
  output_map:
    D_eff: D
  regime:
    T: [285.0, 315.0]
    L: [45.0, 500.0]
    r: [3.0, 5.0]
    eta: [0.05, 5.0]
  tolerance: 0.05
  provenance: proposed
  reason: >
    Verifies directly that Chandrasekaran et al.'s stochastic 1D overdamped Langevin solver
    (Methods Eq. 1: dx = mu*f*dt + dB, dB ~ N(0, sqrt(2*mu*k_B T*dt)), n_particles = 4000,
    dt = 0.002 s, t_sim = 1.0 s, seed = 42) reproduces Weirich et al.'s analytical FRAP ellipsoid
    diffusivity D = k_B T ln(2*L/r) / (6*pi*eta*L) across both papers' temperature, filament-length,
    and droplet-viscosity regimes (0.05-5 Pa*s) under zero external force (f = 0) and translational
    mobility mu = 1/(6*pi*eta*R_H) = 1000*ln(2*L/r)/(6*pi*eta*L) [um/(pN*s)]. The measured ~4.39%
    relative difference is purely the fixed-seed finite-ensemble Monte Carlo sampling realization
    (~1.96 SE for 4000 Gaussian trajectories), within tolerance 0.05.
  assumptions:
    - "Free-particle passive Brownian diffusion (f = 0) with translational mobility mu = D/(k_B T) = 1000*ln(2*L/r)/(6*pi*eta*L) [um/(pN*s)] (mobility interpretation of mu in Chandrasekaran Eq. 1, q_eq1_mu_called_viscosity)."
    - "Tolerance 0.05 covers finite-sample Monte Carlo variance of chandrasekaran2024/langevin_overdamped_1d at n_particles = 4000, seed = 42."

- id: rel_weirich2017_tactoid_area_approx_prolate_spheroid
  kind: approximated_by
  a: weirich2017/tactoid_geometry_circular_arc
  b: chandrasekaran2024/prolate_spheroid_volume_conserving
  mapping:
    R_drop: "R * (3 * (sin(alpha) - alpha * cos(alpha) - sin(alpha)**3 / 3) / 2)**(1/3)"
    a: "R * (3 * (sin(alpha) - alpha * cos(alpha) - sin(alpha)**3 / 3) / 2)**(1/3) * (sin(alpha) / (1 - cos(alpha)))**(2/3)"
  output_map:
    surface_area: A
  regime:
    R: [0.5, 10.0]
    alpha: [0.1, 1.55]
  tolerance: 0.02
  provenance: proposed
  reason: >
    Both papers model elongated, volume-conserving 3D axisymmetric liquid-like droplets:
    Weirich et al. (SI p. 8, Fig. S2B) parameterize nematic actin tactoids as circular-arc surfaces
    of revolution with sharp cusped poles (A = 4*pi*R^2*(sin(alpha) - alpha*cos(alpha)),
    V = 2*pi*R^3*g(alpha), L/r = sin(alpha)/(1 - cos(alpha))), whereas Chandrasekaran et al.
    (Methods p. 10, Fig. 7) parameterize deformed VASP droplets as smooth-poled volume-conserving
    prolate spheroids (V = (4/3)*pi*R_drop^3 = (4/3)*pi*a*b^2, S = 2*pi*b^2*(1 + (a/(b*e))*arcsin(e))).
    With zero free parameters — equating droplet volume (R_drop = (3*V/(4*pi))^(1/3)) and aspect
    ratio (a/b = L/r, so a = R_drop*(L/r)^(2/3)) — the two surface areas agree identically in the
    spherical limit (alpha -> pi/2, AR = 1), peak at just 1.601% relative difference near AR ~= 4.9,
    and converge to the exact slender-body ratio (3*pi/4)*(2/25)^(1/3) = 1.015250 (+1.525%) as
    alpha -> 0 (AR -> oo). Across alpha in [0.1, 1.55] (AR in [1.02, 20.0], bracketing both
    Chandrasekaran's AR = 1.1-5.56 and Weirich's L/r = 2-3), isotropic capillary surface energy
    gamma_I*A at fixed volume and aspect ratio is therefore invariant to sharp-cusp vs smooth-pole
    droplet geometry to within 1.61%.
  assumptions:
    - "Parameter-free geometric correspondence equating 3D droplet volume V_sph = V_tac (R_drop = R*(3*g(alpha)/2)^(1/3)) and aspect ratio a/b = L/r = cot(alpha/2)."
    - "Prolate regime alpha in [0.1, 1.55] rad (AR in [1.02, 20.0]); tolerance 0.02 bounds the exact global supremum 0.01601 across all AR in [1, oo)."

- id: rel_weirich2017_tactoid_area_scales_prolate_spheroid_slender
  kind: scales_as
  a: weirich2017/tactoid_geometry_circular_arc
  b: chandrasekaran2024/prolate_spheroid_volume_conserving
  mapping:
