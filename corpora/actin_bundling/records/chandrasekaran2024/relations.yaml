  provenance: proposed
  reason: >
    Under the exact equal-volume, equal-aspect-ratio correspondence between Weirich et al.'s
    circular-arc tactoid (tactoid_geometry_circular_arc) and Chandrasekaran et al.'s volume-conserving
    prolate spheroid (prolate_spheroid_volume_conserving), both surface areas obey the identical
    slender elongated-droplet scaling law A ~ R^2 * alpha^3 ~ V^(2/3) * (L/r)^(1/3) across
    alpha in [0.05, 0.40] (AR in [4.93, 40.0], spanning Chandrasekaran's high-AR rod transition
    AR ~ 5.56 and Weirich's elongated contracting bundles): log-slopes in arc radius R (+2.0) agree
    identically and log-slopes in central angle alpha (~+3.0) agree to < 8.3e-4.
  assumptions:
    - "Elongated/slender droplet regime alpha in [0.05, 0.40] rad (AR in [4.93, 40.0]) where S_sph / A_tac stays flat within [1.0153, 1.0163]."
    - "Equal droplet volume V_sph = V_tac and equal aspect ratio a/b = L/r."

- id: rel_weirich2017_tactoid_length_matched_approx_prolate_ar
  kind: approximated_by
  a: weirich2017/tactoid_geometry_circular_arc
  b: chandrasekaran2024/prolate_spheroid_volume_conserving
  mapping:
    R_drop: "R * (3 * (sin(alpha) - alpha * cos(alpha) - sin(alpha)**3 / 3) / 2)**(1/3)"
    a: "R * sin(alpha)"
  output_map:
    aspect_ratio: aspect_ratio
  regime:
    R: [0.5, 10.0]
    alpha: [0.1, 1.55]
  tolerance: 0.12
  provenance: proposed
  reason: >
    Directly compares the aspect ratios of Weirich et al.'s circular-arc tactoid and Chandrasekaran
    et al.'s volume-conserving prolate spheroid when both models are constrained to the exact same
    3D droplet volume V (R_drop = (3*V/(4*pi))^(1/3)) and the exact same tip-to-tip major axis
    span 2*a = L = 2*R*sin(alpha) (the geometric span constraint governing Chandrasekaran Fig. 7B's
    filament_length_limited_aspect_ratio). Because sharp parabolic cusps enclose 20% less volume
    for a given (L, r) than rounded spheroidal poles (V_tac -> (8/15)*pi*(r/2)^2*L vs
    V_sph = (2/3)*pi*b^2*(2*a)), matching (V, L) forces a slightly narrower prolate spheroid
    (b/(r/2) -> 2/sqrt(5) = 0.8944) whose aspect ratio exceeds L/r smoothly from 1.000 (sphere,
    alpha = pi/2) to 1.084-1.108 across Weirich's L/r = 2-3 and Chandrasekaran's AR = 2-5.56,
    approaching the exact global ceiling sqrt(5)/2 = 1.1180 (+11.80%, relative diff 10.56% against
    max) as alpha -> 0. This also quantifies the systematic pole-shape offset when Weirich SI p. 7
    approximates experimental tactoid shapes by ImageJ ellipses.
  assumptions:
    - "Equal 3D droplet volume V_sph = V_tac and equal tip-to-tip major axis 2*a = L = 2*R*sin(alpha)."
    - "Prolate regime alpha in [0.1, 1.55] rad (AR in [1.02, 20.0]); tolerance 0.12 bounds the exact slender-body ceiling (sqrt(5)/2 - 1)/(sqrt(5)/2) = 1 - 2/sqrt(5) = 0.1056."

- id: rel_weirich2017_tactoid_rescaled_energy_scales_spheroid_area
  kind: scales_as
  a: weirich2017/tactoid_rescaled_free_energy
  b: chandrasekaran2024/prolate_spheroid_volume_conserving
  mapping:
