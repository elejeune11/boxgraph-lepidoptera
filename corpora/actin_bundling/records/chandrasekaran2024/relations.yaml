- id: rel_graham2023_linear_elongation_limit
  kind: reduces_to
  a: chandrasekaran2024/filament_elongation_length
  b: graham2023/linear_bundle_elongation
  mapping:
    v: "k_grow / 1000"
    t: "t"
  output_map:
    y: L_fil
  limit:
    L0: "0"
  regime:
    L0: [0.05, 0.5]
    k_grow: [5.0, 50.0]
    t: [10.0, 600.0]
  provenance: proposed
  reason: >
    CytoSim's deterministic constant-velocity actin filament elongation law L_fil(t) = L0 + k_grow*t
    reduces identically to Graham et al. (2023) Fig. 5h's through-origin linear bundle elongation law
    y(t) = v*t in the negligible initial-seed limit L0 -> 0 (equivalently tracking length increment
    y = L_fil(t) - L0), converting k_grow from nm/s to um/s. Note that CytoSim's baseline speed
    (10.3 nm/s, derived to reach 2*pi um at 600 s) is 2.20x slower than Graham Fig. 5h's measured
    linear bundle speed (22.7 nm/s, 23 +/- 3 nm/s), though Chandrasekaran Fig. 5's T_2piR = 10..600 s
    sweep spans 10.3..618 nm/s.
  assumptions:
    - "Negligible initial seed length limit L0 -> 0 (CytoSim baseline uses L0 = 0.1 um; Graham Fig. 5h measures length increase y from t = 0)."

- id: rel_graham2023_critical_ar_reduces_to_2d_max_ar
  kind: reduces_to
  a: graham2023/ring_rod_critical_aspect_ratio
  b: chandrasekaran2024/ellipse_2d_constant_area
  mapping:
    L_max: "L"
    R_drop: "R"
  output_map:
    aspect_ratio: ar_crit
  limit:
    L: "oo"
  regime:
    R: [0.5, 2.0]
    L: [10.0, 40.0]
  tolerance: 1.0e-3
  provenance: proposed
  reason: >
    For elongated constant-area 2D ellipses (AR >> 1, b/a -> 0), the exact elliptic perimeter
    P(R*sqrt(AR), R/sqrt(AR)) = 4*R*sqrt(AR)*E(e) approaches 4*R*sqrt(AR). Setting Graham et al.'s
    continuum ring-unfolding threshold P(AR_crit) = 2*L (SI Section 2.11, peak of bending energy in
    Fig. 5c / Chandrasekaran Fig. 7F) therefore yields AR_crit -> (L / (2*R))^2 as L/R -> oo,
    converging asymptotically to Chandrasekaran et al.'s 2D filament-straightening ceiling (2a = L)
    in Fig. 7E and explaining why AR_crit = 9.538 sits just 3.4% below (a/b)_max = pi^2 = 9.870
    at L = 2*pi*R.
  assumptions:
    - "High aspect-ratio asymptotic regime L/R -> oo where elliptic perimeter approaches 4*a = 4*R*sqrt(AR)."

- id: rel_graham2023_hinge_angle_scales_as_ring_confinement
  kind: scales_as
  a: graham2023/ring_confinement_bending_energy
  b: chandrasekaran2024/lammps_harmonic_angle_potential
  mapping:
