  regime:
    k_b: [50000.0, 500000.0]
    L: [0.05, 0.2]
    R: [0.5, 4.0]
  provenance: proposed
  reason: >
    Connects Graham et al.'s continuum circular-confinement bending energy E_bend_0 = (k_b/2)*(L/R^2)
    (zero-fluctuation limit of Eq. 1 / SI Eq. S21) to Chandrasekaran et al.'s LAMMPS discrete
    harmonic bending angle potential U_angle = K_angle*(theta - theta0)^2 (dimensionless, in k_B T)
    for a single discretized filament segment of length L bent onto a circular droplet of radius R
    (small arc turning angle pi - theta = L/R and discrete hinge stiffness K_angle = k_b/(2*L*k_B T),
    matching graham2023/discrete_bending_constant divided by 2*k_B T). Log-slopes in all three
    shared physical variables (k_b, L, R) agree identically (+1, +1, -2), independent of LAMMPS's
    factor-of-2 harmonic convention (q_lammps_harmonic_half_factor_convention).
  assumptions:
    - "Small turning angle per discretized segment L/R << 1 (L in [0.05, 0.2] um, R in [0.5, 4.0] um)."
    - "Fixed thermal energy conversion k_B T = 4.11 pN*nm (chandrasekaran2024 Supplementary Table 1; constant scale factor preserves all log-slopes)."

# ---------------------------------------------------------------------------
# Cross-record relations with sekine2024 (Sekine et al., Nat. Commun. 15, 464, 2024)
# Neither paper cites the other (published Jan 2024 vs Apr 2024; 0 stated relations,
# 0 cited.yaml links). All 6 relations below are provenance: proposed and avoid
# too_plain (<= 2 ops) models:
# - Excluded as too_plain: persistence_length_from_rigidity (1000*kappa/kBT, 2 ops)
#   vs sekine2024/persistence_length_bending[_from_temperature] (kappa_eff = k_bend*L0/2);
#   harmonic_repulsion_force (k_spring*delta/1000, 2 ops, one-sided) vs
#   harmonic_stretching_potential.f_str; einstein_diffusion_relation (2 ops);
#   mobility_from_diffusion (2 ops); bending_stiffness_thermal_units (1 op);
#   sekine2024/thermal_energy (1 op).
# - Excluded due to ground-state offset + dimensional mismatch + distinct objects:
#   sekine2024/bending_potential (U_bend = -k_bend*cos(theta) in pN*um for motors and
#   alpha-actinin crosslinkers, nonzero ground state -k_bend) vs
#   chandrasekaran2024/lammps_harmonic_angle_potential (K_angle*(theta-theta0)^2 in
#   dimensionless k_B T for F-actin hinges); only shifted excess energy k_bend*(1-cos(theta))
#   approaches (k_bend/2)*(pi-theta_LAMMPS)^2 as theta -> 0.
# - Note on isotropic limit (friction_asymmetry -> 1) of cgmd_anisotropic_langevin vs
#   brownian_noise_from_mobility: even at friction_asymmetry = 1, cgmd_anisotropic_langevin
#   outputs the half-normal mean absolute displacement E[|Delta y_cm|] = sqrt(2/pi)*sigma_B
#   (~0.7979*sigma_B, a non-vanishing 20.21% statistical factor plus ~2% MC variance), so
#   reduces_to does not converge to zero; approximated_by and 5-variable scales_as capture
#   the exact physical relationship cleanly.
# ---------------------------------------------------------------------------
- id: rel_sekine2024_stokes_einstein_diffusion
  kind: same_as
  a: sekine2024/filament_einstein_stokes_diffusion
  b: chandrasekaran2024/stokes_einstein_diffusion
  mapping:
    kBT: "1380649 * T / 100000000"
    eta: "eta_cyto"
    r: "1000 * (3 * d_f + 2 * L0_f / 5)"
  output_map:
    D_SE: D_fil
  regime:
    T: [290.0, 310.0]
    eta_cyto: [0.05, 2.0]
    d_f: [0.005, 0.02]
    L0_f: [0.05, 0.2]
  provenance: proposed
  reason: >
    Both models evaluate passive single-agent translational diffusivity via the Stokes-Einstein law
    D = k_B T / (6 * pi * eta * R_H) in viscous cytoplasmic/condensate media (eta ~ 0.05-1 Pa*s,
    T ~ 298-300 K; 1 Pa*s = 1 pN*s/um^2 exactly). Substituting exact CODATA 2018 thermal energy
    k_B T = 0.01380649 * T [pN*nm] and Sekine's two-bead cylindrical effective hydrodynamic Stokes
    radius R_H = 3 * d_f + 2 * L0_f / 5 [um] = 1000 * (3 * d_f + 2 * L0_f / 5) [nm] (from
    2 * gamma^f = 6 * pi * eta_cyto * (3 * d_f + 2 * L0_f / 5), SI Notes p. 29 / Kim et al. 2009)
    maps sekine2024/filament_einstein_stokes_diffusion (8 ops) identically onto
    chandrasekaran2024/stokes_einstein_diffusion (4 ops), joining them in a Stokes-Einstein family
    (neither side is too_plain).
  assumptions:
    - "Isotropic single-filament passive Brownian limit in sekine2024 (friction_asymmetry = 1, FDT with restored k_B T) with total two-bead drag 2 * gamma^f = 6 * pi * eta_cyto * R_H."
    - "Exact CODATA 2018 Boltzmann constant k_B = 1.380649e-23 J/K = 0.01380649 pN*nm/K and unit identity 1 Pa*s = 1 pN*s/um^2."
    - "Hydrodynamic radius maps a spherical VASP tetramer (r = 30 nm in chandrasekaran2024) to Sekine's cylindrical two-bead F-actin rod (R_H = 3*d_f + 2*L0_f/5 = 70 nm at d_f = 10 nm, L0_f = 100 nm)."

- id: rel_sekine2024_filament_diff_approx_langevin1d
  kind: approximated_by
  a: sekine2024/filament_einstein_stokes_diffusion
  b: chandrasekaran2024/langevin_overdamped_1d
  mapping:
    mu: "1 / (6 * pi * eta_cyto * (3 * d_f + 2 * L0_f / 5))"
    kBT: "1380649 * T / 100000000"
    f: "0"
  output_map:
    D_eff: D_fil
  regime:
    T: [290.0, 310.0]
    eta_cyto: [0.1, 2.0]
    d_f: [0.005, 0.02]
    L0_f: [0.05, 0.2]
  tolerance: 0.05
  provenance: proposed
  reason: >
    Verifies directly that Chandrasekaran et al.'s stochastic 1D overdamped Langevin integrator
    (Methods Eq. 1: dx = mu*f*dt + dB, dB ~ N(0, sqrt(2*mu*k_B T*dt)), n_particles = 4000,
    dt = 0.002 s, t_sim = 1.0 s, seed = 42) reproduces Sekine et al.'s isotropic two-bead F-actin
    center-of-mass Einstein-Stokes diffusivity D_fil = k_B T / (2 * gamma^f) when supplied with
    zero external force (f = 0) and total filament mobility mu = 1 / (2 * gamma^f) =
    1 / (6 * pi * eta_cyto * (3 * d_f + 2 * L0_f / 5)). The measured 4.39% relative difference is
    purely the fixed-seed finite-ensemble Monte Carlo variance realization (~1.96 SE for 4000
