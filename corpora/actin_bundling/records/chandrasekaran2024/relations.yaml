  provenance: proposed
  reason: >
    Connects Weirich et al.'s central dimensionless droplet free-energy functional
    F_hat(alpha, omega) = (A + omega*A_omega) / V^(2/3) (SI p. 8, Fig. S2C) directly to
    Chandrasekaran et al.'s fixed-volume 3D prolate spheroid surface area S(a, R_drop) (evaluated
    at unit volume V = 1 um^3, R_drop = (3/(4*pi))^(1/3), and matched aspect ratio
    a/b = sin(alpha)/(1 - cos(alpha))). Turning off nematic surface anchoring (omega -> 0, the
    isotropic protein-droplet limit corresponding to Chandrasekaran's VASP condensates) reduces
    F_hat(alpha, 0) to the purely isotropic capillary surface-area penalty A/V^(2/3), which grows
    as alpha^(-1/3) ~ AR^(+1/3) for elongated droplets — matching the log-slope of
    prolate_spheroid_volume_conserving.surface_area to < 8.3e-4 across alpha in [0.05, 0.40]
    (AR in [4.93, 40.0]). By contrast, finite nematic anchoring (omega = 1.1-2.2 in Weirich's
    filamin tactoids) introduces a competing A_omega/V^(2/3) ~ alpha^(+5/3) ~ AR^(-5/3) term that
    creates an equilibrium elongated minimum at L/r = 2*sqrt(omega) = 2-3.
  assumptions:
    - "Isotropic droplet limit omega in [1e-6, 1e-4] (vanishing nematic anchoring gamma_A/gamma_I << 1, matching isotropic VASP condensates)."
    - "Fixed unit volume V = 1 um^3 (R_drop = (3/(4*pi))^(1/3)) and matched aspect ratio a/b = cot(alpha/2) in the elongated regime alpha in [0.05, 0.40] rad."

- id: rel_weirich2017_final_actin_conc_scales_mesh_size
  kind: scales_as
  a: chandrasekaran2024/final_actin_concentration
  b: weirich2017/actin_concentration_from_mesh_size
  mapping:
    xi: "sqrt(4 * pi * R_drop**3 / (N_fil * L_fil))"
  output_map:
    c: C_actin
  regime:
    N_fil: [6.0, 165.0]
    L_fil: [0.18, 6.28]
    dl: [2.7, 2.75]
    R_drop: [0.5, 3.0]
  provenance: proposed
  reason: >
    Both Chandrasekaran et al.'s spherical-droplet F-actin molar concentration law
    (Results p. 3: C_actin = (N_fil * L_fil / dl) / (N_A * (4/3)*pi*R_drop^3) [uM], 6 ops) and
    Weirich et al.'s semidilute F-actin cubic-mesh law (SI p. 7, Schmidt et al. 1989 [ref-18]:
    xi = 0.3*c^(-1/2), inverted in actin_concentration_from_mesh_size as c = (0.3/xi)^2 [mg/mL],
    3 ops) rest on the identical 3D F-actin contour-length density
    rho_L = (c / M_w) * N_A * dl = C_actin * N_A * dl. Equating the 3D cubic-lattice density
    rho_L = 3 / xi^2 with the spherical-droplet density rho_L = N_fil * L_fil / ((4/3)*pi*R_drop^3)
    yields the parameter-free geometric identity xi = sqrt(4*pi*R_drop^3 / (N_fil*L_fil)) [um].
    Because C_actin [uM] and c [mg/mL] differ in dimension by G-actin molar mass M_w = 42 kDa
    (1 uM = 0.042 mg/mL, plus Schmidt et al.'s 1-sig-fig rounding of 0.2784 -> 0.30 giving a
    constant 1.161x / 13.9% prefactor ratio), scales_as verifies exact agreement of all three
    geometric log-slopes (N_fil: +1, L_fil: +1, R_drop: -3) across both papers' filament-count,
    filament-length (0.18-6.28 um), and droplet-radius regimes.
  assumptions:
    - "Parameter-free geometric identification xi = sqrt(4*pi*R_drop^3 / (N_fil*L_fil)) equating cubic-network contour density rho_L = 3/xi^2 with spherical-droplet contour density rho_L = N_fil*L_fil/((4/3)*pi*R_drop^3)."
    - "Fixed F-actin monomer axial rise dl in [2.7, 2.75] nm (2.7 nm in both records) and G-actin molar mass M_w = 42 kDa convert uM to mg/mL by a constant scale factor, leaving all geometric log-slopes invariant."

