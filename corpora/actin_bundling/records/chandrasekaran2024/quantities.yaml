- id: droplet_radius
  name: spherical droplet radius
  dimension: "[length]"
  description: Radius R_drop of a spherical VASP condensate droplet (or equivalent-volume sphere radius of a deformed spheroid).

- id: filament_length
  name: actin filament length
  dimension: "[length]"
  description: Contour length of an F-actin filament (initial seed length L0, target length, or final/maximum length L_fil^max).

- id: filament_segment_length
  name: discretized filament segment length
  dimension: "[length]"
  description: Length L_seg of each rigid cylindrical segment representing an F-actin fiber in CytoSim.

- id: actin_monomer_rise
  name: actin monomer axial rise
  dimension: "[length]"
  description: Contour length increment per actin monomer subunit along an F-actin double helix.

- id: elongation_rate
  name: single-filament actin elongation rate
  dimension: "[length] / [time]"
  description: Linear barbed-end extension speed k_grow (or force-dependent speed v(f)) of a single actin filament.

- id: network_elongation_rate
  name: total network actin elongation rate
  dimension: "[length] / [time]"
  description: Total F-actin contour-length addition rate summed across N_fil growing filaments.

- id: time
  name: time
  dimension: "[time]"
  description: Elapsed simulation time, filament growth timescale (t_2R, T_2piR), relaxation window, or experimental incubation duration.

- id: time_step
  name: numerical time step or sampling interval
  dimension: "[time]"
  description: Implicit Langevin integration step size dt or trajectory output/movie frame interval.

- id: actin_concentration
  name: actin molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of actin (G-actin, polymerized F-actin, total actin [T-actin], or cap concentration threshold).

- id: vasp_tetramer_concentration
  name: VASP tetramer molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of tetrameric VASP crosslinkers [VASP-tet].

- id: vasp_monomer_concentration
  name: VASP monomer molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of monomeric VASP subunits in solution/droplets.

- id: nucleator_concentration
  name: linear nucleator molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of Arp2/3-like linear actin nucleators [Nucleator].

- id: dissociation_constant
  name: VASP-actin dissociation constant
  dimension: "[substance] / [length] ** 3"
  description: Equilibrium dissociation constant K_d of VASP binding to actin.

- id: buffer_concentration
  name: buffer component molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of droplet buffer components (Tris, NaCl, TCEP).

- id: mass_volume_percent
  name: mass-per-volume percentage
  dimension: dimensionless
  description: Solute concentration expressed as weight-per-volume percentage (% w/v), e.g., PEG8k crowder.

- id: ph
  name: solution pH
  dimension: dimensionless
  description: Acidity (pH) of the droplet buffer.

- id: filament_count
  name: actin filament count
  dimension: dimensionless
  description: Number of actin filaments N_fil in a droplet simulation.

- id: molecule_count
  name: molecule count
  dimension: dimensionless
  description: Number of discrete molecules or coarse-grained particles in a droplet or simulation box.

- id: binding_valency
  name: crosslinker binding valency
  dimension: dimensionless
  description: Number of actin-binding sites per VASP tetramer crosslinker (or maximum bonds per site).

- id: vasp_to_actin_ratio
  name: VASP-to-actin molar ratio
  dimension: dimensionless
  description: Molar ratio of VASP monomers to actin monomers (denominator r in printed Actin:VASP = 1:r).

- id: polymerization_speedup_factor
  name: VASP polymerization speedup factor
  dimension: dimensionless
  description: Fold acceleration of VASP-mediated shared barbed-end elongation over free barbed ends.

- id: binding_rate
  name: binding or nucleation rate
  dimension: "1 / [time]"
  description: Mesoscopic first-order binding rate k_bind of VASP to F-actin, or nucleator nucleation rate (filaments/s).

- id: unbinding_rate
  name: unbinding rate
  dimension: "1 / [time]"
  description: Zero-force or force-dependent unbinding rate k_unbind of VASP or nucleator from actin.

- id: residence_time
  name: crosslinker residence time
  dimension: "[time]"
  description: Mean bound lifetime tau_res = 1 / k_unbind of a VASP-actin interaction.

- id: binding_distance
  name: crosslinker binding distance
  dimension: "[length]"
  description: Capture radius r_bind within which a VASP binding site can stochastically bind an actin segment.

- id: particle_radius
  name: steric or hydrodynamic particle radius
  dimension: "[length]"
  description: Radius of a spherical VASP tetramer or cross-sectional steric radius of an F-actin filament.

- id: force
  name: mechanical force
  dimension: "[force]"
  description: Force acting on a filament or crosslinker (applied load, Brownian ratchet force, Bell characteristic unbinding force, steric/boundary force).

- id: spring_stiffness
  name: linear spring stiffness
  dimension: "[force] / [length]"
  description: Harmonic spring constant for boundary confinement or steric repulsion in CytoSim.

- id: flexural_rigidity
  name: filament flexural rigidity
  dimension: "[force] * [length] ** 2"
  description: Bending stiffness kappa of an F-actin filament.

- id: persistence_length
  name: filament persistence length
  dimension: "[length]"
  description: Thermal persistence length l_p = kappa / (k_B T) of an F-actin filament.

- id: thermal_energy
  name: thermal energy scale
  dimension: "[energy]"
  description: Thermal energy k_B T.

- id: bending_energy_parameter
  name: discrete angle bending energy parameter
  dimension: "[energy]"
  description: Discrete harmonic angle bending constant k_bend in physical energy units (e.g., pN*nm).

- id: bending_energy_thermal
  name: dimensionless bending energy parameter in k_B T
  dimension: dimensionless
  description: Discrete harmonic angle bending constant expressed in units of k_B T (or k_B T / rad^2).

- id: bond_angle
  name: equilibrium bond angle
  dimension: dimensionless
  description: Equilibrium angle theta_0 between consecutive filament beads (degrees or radians).

- id: dynamic_viscosity
  name: dynamic shear viscosity
  dimension: "[mass] / [length] / [time]"
  description: Dynamic viscosity eta of the droplet medium or water (units Pa*s = pN*s/um^2).

- id: viscosity_misprinted_unit
  name: droplet viscosity in literal misprinted unit
  dimension: "[force] / [time] / [length] ** 2"
  description: Literal printed viscosity entry '0.5 pN/s um^2' in Supplementary Table 2 whose printed unit has dimension force/(time*area) instead of dynamic viscosity.

- id: viscosity_ratio
  name: droplet-to-water viscosity ratio
  dimension: dimensionless
  description: Dimensionless ratio eta_drop / eta_water of droplet viscosity relative to water.

- id: mobility
  name: translational mobility
  dimension: "[length] / [force] / [time]"
  description: Overdamped Langevin mobility mu in Eq. (1) satisfying v = mu * f and D = mu * k_B T.

- id: diffusion_coefficient
  name: translational diffusion coefficient
  dimension: "[length] ** 2 / [time]"
  description: Translational diffusivity D of VASP tetramers or Brownian particles.

- id: displacement
  name: spatial displacement or step size
  dimension: "[length]"
  description: Particle displacement, Brownian noise standard deviation sqrt(2 D dt), boundary excursion, steric overlap, or Z-axis deformation step.

- id: spheroid_axis
  name: spheroid or ellipse semi-axis
  dimension: "[length]"
  description: Semi-major axis a or semi-minor axis b of a prolate spheroid or 2D ellipse.

- id: aspect_ratio
  name: droplet aspect ratio
  dimension: dimensionless
  description: Ratio of major to minor droplet axis (a/b for 3D prolate spheroid and 2D ellipse, or c/a in LAMMPS).

- id: surface_area
  name: droplet surface area
  dimension: "[length] ** 2"
  description: Surface area S of a spherical or prolate spheroidal droplet.

- id: volume_fraction
  name: volume fraction
  dimension: dimensionless
  description: Dimensionless fraction of total volume (e.g., polar cap subvolume fraction 12.5% / 6.25%, or LAMMPS crowder volume fraction 10%).

- id: dimensionless_axial_cut
  name: normalized spheroid polar cap cut
  dimension: dimensionless
  description: Normalized axial coordinate u = z_cap / a separating the polar cap from the central body of a prolate spheroid.

- id: concentration_fraction
  name: concentration threshold fraction
  dimension: dimensionless
  description: Ratio of cap actin concentration threshold to bulk actin concentration (C_thresh / C_bulk = 1/3, printed 33.34%).

- id: surface_area_fraction
  name: actin-covered droplet surface area fraction
  dimension: dimensionless
  description: Fraction of subdivided icosphere triangles occupied by peripheral actin monomers.

- id: icosphere_subdivision
  name: icosphere subdivision level
  dimension: dimensionless
  description: Recursive subdivision depth n of an icosahedron approximating the spherical droplet surface.

- id: triangle_count
  name: icosphere face count
  dimension: dimensionless
  description: Number of triangular facets 20 * 4^n on an n-times subdivided icosphere.

- id: triangle_edge_length
  name: icosphere triangle edge length
  dimension: "[length]"
  description: Side length of triangular facets on a subdivided icosphere.

- id: shell_thickness
  name: radial shell thickness or surface cutoff
  dimension: "[length]"
  description: Thickness delta_r of concentric radial density shells or peripheral monomer cutoff distance from the droplet boundary.

- id: percentage_abundance
  name: percentage abundance or fraction
  dimension: dimensionless
  description: Percentage of droplets or simulated trajectories in a morphology class, PCA variance explained, disordered residue fraction, or dye labeling fraction.

- id: replicate_count
  name: replicate or snapshot count
  dimension: dimensionless
  description: Number of independent replicates or trajectory frames analyzed.

- id: lj_length
  name: reduced Lennard-Jones length
  dimension: dimensionless
  description: Dimensionless length in LAMMPS LJ sigma units (box side, particle radius/diameter, pair sigma, cutoff, bond length, filament length, or ellipsoid axis).

- id: lj_energy
  name: reduced Lennard-Jones energy
  dimension: dimensionless
  description: Dimensionless interaction strength epsilon or potential energy U(r) in LAMMPS LJ units.

- id: lj_spring_constant
  name: reduced Lennard-Jones spring constant
  dimension: dimensionless
  description: Harmonic bond stiffness in LAMMPS reduced units (k_B T / sigma^2).

- id: lj_temperature
  name: reduced Lennard-Jones temperature
  dimension: dimensionless
  description: Dimensionless reduced temperature T* = k_B T / epsilon_{V-V} in LAMMPS MD.

- id: lj_time
  name: reduced Lennard-Jones time
  dimension: dimensionless
  description: Dimensionless time tau_MD or timestep delta_t in LAMMPS reduced units.

- id: lj_step_count
  name: MD integration step count
  dimension: dimensionless
  description: Number of discrete leapfrog integration steps in LAMMPS.

- id: lj_density
  name: reduced Lennard-Jones number density
  dimension: dimensionless
  description: Number of particles per sigma^3 in LAMMPS radial density profiles.

- id: probability
  name: reaction probability
  dimension: dimensionless
  description: Dimensionless probability of a stochastic binding event per attempt.

- id: asphericity_index
  name: droplet asphericity index
  dimension: dimensionless
  description: LAMMPS droplet shape asphericity metric (c^2 / (a b))^(1/3) from Supplementary Fig. 1E.

- id: particle_mass
  name: physical particle mass
  dimension: "[mass]"
  description: Physical mass m of a coarse-grained particle for checking dimensional consistency of tau_MD.

- id: md_time_unit_misprinted_dim
  name: misprinted MD time unit expression
  dimension: "[time] ** 2 / [length]"
  description: Physical dimensionality of the misprinted expression sigma * (m / epsilon_{V-V}) on p. 21 (missing square root).

- id: vasp_variant
  name: VASP protein variant label
  dimension: dimensionless
  description: Categorical experimental condition distinguishing wild-type VASP (WT) and G-actin-binding mutant (GABmut).

- id: ring_abundance
  name: actin ring droplet percentage abundance
  dimension: dimensionless
  description: Percentage of droplets or simulated trajectories containing an actin ring.

- id: shell_abundance
  name: actin shell droplet percentage abundance
  dimension: dimensionless
  description: Percentage of droplets or simulated trajectories containing an actin shell.

- id: disk_abundance
  name: deformed disk droplet percentage abundance
  dimension: dimensionless
  description: Percentage of droplets deformed into planar actin-containing disks.

- id: shell_sb_abundance
  name: shell with strong bundling percentage abundance
  dimension: dimensionless
  description: Percentage of simulated trajectories classified as 'Shell with strong bundling'.

- id: droplet_bending_energy
  name: 2D droplet actin-bending energy
  dimension: "[energy]"
  description: Actin-bending energy E_bend (in pN*nm) as a function of 2D droplet aspect ratio in the continuum energy model (Fig. 7F, from Graham et al. 2023).

- id: droplet_surface_energy
  name: 2D droplet surface energy
  dimension: "[energy]"
  description: Droplet interfacial surface energy E_surf (in pN*nm) as a function of 2D droplet aspect ratio in the continuum energy model (Fig. 7F, from Graham et al. 2023).

- id: pca_component_index
  name: principal component index
  dimension: dimensionless
  description: Ordinal index k = 1..5 of principal components in cumulative explained variance plots (Supplementary Figs. 4A, 9A, 11B.i, 12A).

- id: cumulative_explained_variance
  name: cumulative PCA explained variance ratio
  dimension: dimensionless
  description: Cumulative fraction (0 to 1) of total variance explained by the first k principal components.

- id: cluster_count
  name: k-means cluster count
  dimension: dimensionless
  description: Number of clusters k = 2..10 evaluated in k-means Silhouette coefficient optimization (Supplementary Figs. 4C, 9C, 11B.iii, 12C).

- id: silhouette_coefficient
  name: k-means silhouette coefficient
  dimension: dimensionless
  description: Mean silhouette score quantifying cluster separation as a function of cluster count k.

- id: pairwise_end_distance
  name: pairwise distance between filament ends
  dimension: "[length]"
  description: 3D Euclidean distance between pairs of actin filament ends within a spherical droplet (Fig. 4B).

- id: distance_probability_density
  name: pairwise filament-end distance probability density
  dimension: "1 / [length]"
  description: Probability density function (per um) of pairwise distances between filament ends (Fig. 4B).

- id: cumulative_distribution_function
  name: filament length cumulative density function
  dimension: dimensionless
  description: Cumulative distribution function (0 to 1) of actin filament contour lengths (Supplementary Fig. 6C).

- id: vasp_frac_0fil
  name: fraction of unbound VASP tetramers (0 filaments)
  dimension: dimensionless
  description: Fraction of VASP tetramers bound to 0 actin filaments (Fig. 3D, Supplementary Fig. 6D).

- id: vasp_frac_1fil
  name: fraction of VASP tetramers bound to 1 filament
  dimension: dimensionless
  description: Fraction of VASP tetramers bound to 1 actin filament (Fig. 3D, Supplementary Fig. 6D).

- id: vasp_frac_2fil
  name: fraction of VASP tetramers bound to 2 filaments
  dimension: dimensionless
  description: Fraction of VASP tetramers bound to 2 actin filaments (Fig. 3D, Supplementary Fig. 6D).

- id: vasp_frac_3fil
  name: fraction of VASP tetramers bound to 3 filaments
  dimension: dimensionless
  description: Fraction of VASP tetramers bound to 3 actin filaments (Fig. 3D, Supplementary Fig. 6D).

- id: vasp_frac_4fil
  name: fraction of VASP tetramers bound to 4 filaments
  dimension: dimensionless
  description: Fraction of VASP tetramers bound to 4 actin filaments (Fig. 3D, Supplementary Fig. 6D).

- id: radial_distance
  name: spherical subvolume shell radius
  dimension: "[length]"
  description: Radial distance r from the droplet center for concentric spherical shell density profiles (Supplementary Fig. 6F).

- id: normalized_radial_density
  name: normalized radial actin density ratio
  dimension: dimensionless
  description: Ratio rho(r, dr) / rho(R_drop) of actin density in a concentric shell of radius r and thickness dr = 25 nm to bulk droplet actin density (Supplementary Fig. 6F).

- id: ellipsoid_span_a
  name: gyration ellipsoid major span a
  dimension: "[length]"
  description: Largest principal span a (a >= b >= c) of the gyration-tensor ellipsoid approximating actin network shape (Supplementary Figs. 5, 10).

- id: ellipsoid_span_b
  name: gyration ellipsoid intermediate span b
  dimension: "[length]"
  description: Intermediate principal span b (a >= b >= c) of the gyration-tensor ellipsoid approximating actin network shape (Supplementary Figs. 5, 10).

- id: ellipsoid_span_c
  name: gyration ellipsoid minor span c
  dimension: "[length]"
  description: Smallest principal span c (a >= b >= c) of the gyration-tensor ellipsoid approximating actin network shape (Supplementary Figs. 5, 10).

- id: cluster_category_index
  name: cluster category index
  dimension: dimensionless
  description: "Ordinal index identifying k-means morphology cluster categories along boxplot x-axes (Supplementary Fig. 5: 1=Shell, 2=Shell-WB, 3=Shell-SB, 4=Ring; Supplementary Fig. 10: 1=Ring, 2=Shell-SB)."

- id: ring_shell_sb_probability
  name: ring-shell with strong bundling probability
  dimension: dimensionless
  description: Probability (0 to 1) of observing the 'Ring-Shell w. strong bundling' cluster in high-actin simulations (Supplementary Fig. 11D).

- id: ring_multiring_probability
  name: ring or multi-ring probability
  dimension: dimensionless
  description: Probability (0 to 1) of observing the 'Ring/Multi-ring' cluster in high-actin simulations (Supplementary Fig. 11D).

- id: locally_bundled_probability
  name: locally-bundled network probability
  dimension: dimensionless
  description: Probability (0 to 1) of observing the 'Locally-bundled' cluster in high-actin simulations (Supplementary Fig. 11D).

