# Cross-record validations comparing live software: true Source Data Excel reader models
# directly against graham2023's printed scalar measurements AND all 35 source-data-backed
# blindly digitized figure curves (plus diagnostic variants for Fig. 5a, Fig. 6f, Fig. 6g).
# Note: The remaining 26 digitized curves in graham2023 are theoretical/simulation outputs
# (ED Fig. 5c, Fig. 5c, Fig. 4f-g, ED Fig. 6A-B, ED Fig. 7b/d-g, Fig. 4h model curves)
# that are not included in the 11 released Excel Source Data workbooks.

# ==============================================================================
# 1. MOESM12 Fig. 1f & MOESM17 Fig. 6b — FRAP curves (3 digitized curves + 2 scalars)
# ==============================================================================
- id: val_fig1f_frap_recovery_scalar
  model: frap_summary_reader
  settings: {dataset: "fig1f"}
  output: final_recovery_mean
  against: graham2023/frap_recovery_fig1f
  quantities: {"graham2023/frap_recovery_fraction": frap_recovery_fraction}
  basis: "Final t = 297 s FRAP recovery mean (n = 7 remaining trials) in MOESM12 ('Fig 1f') vs Fig. 1f caption 93.9 +/- 4.89%."

- id: val_fig1f_frap_thalf_scalar
  model: frap_summary_reader
  settings: {dataset: "fig1f"}
  output: t_half_exp_mean
  against: graham2023/frap_t_half
  quantities: {"graham2023/frap_half_time": frap_half_time}
  basis: "Mean per-trial single-exponential FRAP half-time in MOESM12 ('Fig 1f', 17.96 +/- 2.70 s) vs main text 18 +/- 3 s."

- id: val_fig1f_frap_avg_curve
  model: frap_curve_reader
  sweep: {t: "graham2023/fig1f_frap_avg_fig"}
  settings: {dataset: "fig1f"}
  output: recovery
  against: graham2023/fig1f_frap_avg_fig
  quantities:
    "graham2023/frap_post_bleach_time": frap_post_bleach_time
    "graham2023/frap_recovery_fraction": frap_recovery_fraction
  basis: "Live average FRAP recovery curve from MOESM12 ('Fig 1f') vs blindly digitized 13-point Fig. 1f red curve."

- id: val_fig6b_frap_3peg_curve
  model: frap_curve_reader
  sweep: {t: "graham2023/fig6b_frap_3peg_fig"}
  settings: {dataset: "fig6b_3peg"}
  output: recovery
  against: graham2023/fig6b_frap_3peg_fig
  quantities:
    "graham2023/frap_post_bleach_time": frap_post_bleach_time
    "graham2023/frap_recovery_fraction": frap_recovery_fraction
  basis: "Live average 3% PEG FRAP recovery curve (n = 5) from MOESM17 ('Fig 6b') vs blindly digitized 8-point Fig. 6b red curve."

- id: val_fig6b_frap_10peg_curve
  model: frap_curve_reader
  sweep: {t: "graham2023/fig6b_frap_10peg_fig"}
  settings: {dataset: "fig6b_10peg"}
  output: recovery
  against: graham2023/fig6b_frap_10peg_fig
  quantities:
    "graham2023/frap_post_bleach_time": frap_post_bleach_time
    "graham2023/frap_recovery_fraction": frap_recovery_fraction
  basis: "Live average 10% PEG FRAP recovery curve (n = 5) from MOESM17 ('Fig 6b') vs blindly digitized 8-point Fig. 6b blue curve."

