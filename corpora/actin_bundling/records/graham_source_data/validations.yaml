# ==============================================================================
# 8. Cross-record Source Data verification for chandrasekaran2024 Fig. 6D WT scalar
#    (MOESM14 'Fig 3d' supplies the WT counts left blank in MOESM9 'Figure6D' rows 1-19)
# ==============================================================================
- id: val_chandrasekaran2024_exp_wt_disk_1to7p5_fig3d
  model: morphology_abundance_reader
  inputs:
    category: idx_cat_3
  settings:
    dataset: "fig3d_1to7p5"
    method: "image_mean"
  output: abundance_mean
  against: chandrasekaran2024/exp_wt_disk_pct_1_7p5
  purpose: validation
  quantities:
    "chandrasekaran2024/disk_abundance": morphology_abundance
  conditions_ok: >
    morphology_abundance_reader with settings {dataset: 'fig3d_1to7p5', method: 'image_mean'}
    and category = idx_cat_3 (disc/disk) evaluates wild-type VASP droplets at Actin:VASP = 1:7.5
    (20 uM VASP + 2.67 uM actin, N = 3 replicates, 256 total droplets across confocal images in
    0.5 mM EDTA + 0.5 mM EGTA buffer), matching the experimental conditions tagged on
    chandrasekaran2024/exp_wt_disk_pct_1_7p5 ({vasp_variant: 'WT', vasp_to_actin_ratio: '7.5'},
    from_source: ref-15). Note that chandrasekaran2024 Methods (pp. 10-11) uses EDTA/EGTA-free
    buffer for its newly measured VASP-GABmut cohort, whereas its replotted WT baseline originates
    from MOESM14 'Fig 3d' (with EDTA/EGTA) rather than MOESM20 'Fig S4c' (EDTA/EGTA-free).
  basis: >
    Chandrasekaran et al. (2024, Results p. 7, Fig. 6D) state 'Specifically, at actin to VASP
    ratio of 1:7.5, a majority of droplets composed of wild-type VASP had deformed into disks
    (70 ± 13% mean ± SEM)' and '(data from ref. 15 replotted)'. Graham et al. (2023) never
    printed this 70 ± 13% scalar in text or table, and chandrasekaran_source_data (MOESM9
    'Figure6D') left WT rows 1-19 blank, making MOESM14 ('Fig 3d') in graham_source_data the
    sole released Source Data workbook backing chandrasekaran2024/exp_wt_disk_pct_1_7p5.
    Consistent with the 43 existing software: true Excel reader validations against graham2023
    in this file, live execution of morphology_abundance_reader directly verifies this measured
    scalar from the underlying raw droplet counts.
  note: >
    Computes 69.6919% (SD 21.6496%, SEM 12.4994%, n = 256 droplets across 3 replicates; exact
    match to stored MOESM14 summary cell AF9) vs printed '70 ± 13%' (-0.3081 pp): reproduced.
    Method 'pooled' yields 69.5199% (SD 22.0628%, SEM 12.7380%, -0.4801 pp, also reproduced).
    By contrast, buffer-matched EDTA/EGTA-free MOESM20 'Fig S4c' (edfig4c_1to7p5, image_mean,
    n = 148) gives 79.7977% +/- 0.9794% SD (SEM 0.5655%, +9.7977 pp; pooled 78.4343% +/- 2.9781%
    SD) and misses 4/9 digitized Fig. 6D WT bars outside their SD bands (0/9 inside bar-height
    bands), confirming Fig. 6D WT replots EDTA/EGTA-containing MOESM14 'Fig 3d' (inheriting
    q_fig3d_and_edfig4e_count_errors: 714 droplets total across all 3 replicates, not >= 600 per
    replicate). See q_chandrasekaran2024_cross_validation_summary for full bidirectional audit.

# ==============================================================================
# 9. Remaining origin: measured printed scalar measurements in graham2023
#    (MOESM12 Fig. 1f text, MOESM16 Fig. 5h text, MOESM20 Fig. S4e median & max)
# ==============================================================================
- id: val_fig1f_frap_recovery_text_scalar
  model: frap_summary_reader
  settings: {dataset: "fig1f"}
  output: final_recovery_mean
  against: graham2023/frap_recovery_text
  purpose: validation
  quantities: {"graham2023/frap_recovery_fraction": frap_recovery_fraction}
  basis: >
    Graham et al. (2023, Results p. 2 / p. 575) report '(fractional recovery 94 ± 5%) in less than
    2 min (t1/2 of 18 ± 3 s) (Fig. 1f and Supplementary Video S2)' as the rounded main-text
    reporting of Fig. 1f's 93.9 ± 4.89% recovery. Live execution of frap_summary_reader on MOESM12
    ('Fig 1f', row 106, t = 297 s) directly verifies this origin: measured scalar datum from the
    underlying fluorescence recovery traces.
  note: >
    Computes 93.9086% (sample SD 4.8891%, n = 7 trials extending to t = 297 s; trials 8-9 stop at
    t = 207 s, all-9 last-point mean 94.6812 +/- 4.5338%) vs printed '94 ± 5%' (-0.0914 pp):
    reproduced. Note that at t = 120 s (2 min), MOESM12 gives recovery_120s_mean = 86.2497%
    (SD 5.49%, -7.75 pp, outside [89, 99]% -> close), contradicting the text's 'in less than 2 min'
    phrasing (see q_fig1f_n7_at_297s_and_sd_resolved).

- id: val_fig5h_elongation_rate_text_scalar
  model: elongation_reader
  inputs:
    t: query_time_190s
  settings: {}
  output: slope_ind_origin_mean
  against: graham2023/elongation_rate_mean_text
  purpose: validation
  quantities: {"graham2023/bundle_elongation_rate": bundle_elongation_rate}
  basis: >
    Graham et al. (2023, Results p. 9 / p. 582) report 'with an average growth rate in the presence
    of ATP of 23 ± 3 nm s−1, about 8 to 9 monomers per second (Fig. 5h)' across n = 15 elongating
    VASP-actin droplet bundles (10 uM VASP, 2 uM actin, 3% PEG, 1 mM ATP). Live execution of
    elongation_reader on MOESM16 ('Fig 5h', cells A4:R23) directly verifies this origin: measured
    scalar from the 15 raw bundle-length trajectories.
  note: >
    Computes 22.7335 nm/s (mean of 15 per-droplet through-origin slopes; 15-droplet mean-curve
    through-origin slope 0.022734 um/s = 22.7341 nm/s; invariant to query input t = 190 s) vs
    printed '23 ± 3' nm/s (-0.2665 nm/s): reproduced. Per-droplet free-intercept OLS gives 21.9335
    +/- 3.0452 nm/s and endpoint y(190)/190 gives 22.0354 +/- 3.1559 nm/s (both also reproduced);
    note sample SD of per-droplet through-origin slopes is 3.6643 nm/s (rounds to 4, not 3; 3-trial
    population SD ddof=0 is 3.0751 nm/s) and cell R6 (trial 3, droplet 5, t = 20 s) is blank
    (n = 14 at 20 s; see q_fig5h_missing_cell_sd_and_line_offset).

- id: val_edfig4e_diam_median_scalar
  model: droplet_size_reader
  inputs:
    D: query_diam_1um
  settings: {dataset: "edfig4e"}
  output: diam_median
  against: graham2023/droplet_diam_median_20uM
  purpose: validation
  quantities: {"graham2023/droplet_diameter": droplet_diameter}
  basis: >
    Graham et al. (2023, Extended Data Fig. 4e caption, p. 19) state 'for 20 μM VASP droplets.
    Median droplet size is 2.86 μm.' Live execution of droplet_size_reader on MOESM20 ('Fig S4e',
    cells E2:E1656) directly verifies this origin: measured scalar from the raw 20 uM VASP droplet
    diameter column.
  note: >
    Computes exact median 2.8600 um (mean 3.0323 +/- 1.2189 um SD, min 0.75 um, max 7.22 um;
    invariant to query input D = 1.0 um) vs printed '2.86' um (diff 0.0000 um): reproduced. Note
    that E2:E1656 holds n = 1655 numeric diameters (sum of all 21 histogram bins = 1655), not
    n = 1656 as printed in the caption because row 1 is the text header 'Droplet diameter'
    (see q_fig3d_and_edfig4e_count_errors).

