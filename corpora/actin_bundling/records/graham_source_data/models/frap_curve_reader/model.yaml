id: frap_curve_reader
name: FRAP average recovery curve lookup from Source Data workbooks (Figs. 1f and 6b)
role: processing
software: true
stated:
  none: "binary xlsx spreadsheet in unpacked Source Data archive"
  where: "41567_2022_1924_MOESM12_ESM.xlsx ('Fig 1f', B4:L106); 41567_2022_1924_MOESM17_ESM.xlsx ('Fig 6b', A5:M107)"
  quote: "time post bleach / average / 3% PEG / 10% PEG"
inputs:
  t: {quantity: frap_post_bleach_time, unit: s}
outputs:
  recovery: {quantity: frap_recovery_fraction, unit: percent}
settings:
  dataset: "fig1f"
stochastic: false
