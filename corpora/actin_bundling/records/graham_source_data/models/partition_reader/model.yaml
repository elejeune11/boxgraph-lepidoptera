id: partition_reader
name: Protein and actin droplet partition coefficient reader (Extended Data Figs. 2d and 3e)
role: processing
software: true
stated:
  none: "binary xlsx spreadsheet in unpacked Source Data archive"
  where: "MOESM18 ('Fig S2d', B3:X668); MOESM19 ('Fig S3e', C3:N297)"
  quote: "VASP partitioning into VASP droplets / Actin partitioning into mutGABmutFAB / mutFAB droplets"
inputs:
  construct: {quantity: vasp_construct_index, unit: dimensionless}
outputs:
  partition_mean: {quantity: protein_partition_coefficient, unit: dimensionless}
  partition_sd: {quantity: protein_partition_coefficient_sd, unit: dimensionless}
  partition_sem: {quantity: protein_partition_coefficient_sem, unit: dimensionless}
  pooled_mean: {quantity: protein_partition_coefficient, unit: dimensionless}
  n_droplets_total: {quantity: sample_count, unit: dimensionless}
settings:
  dataset: "edfig2d"
stochastic: false
