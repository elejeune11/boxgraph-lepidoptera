id: edfig9e_aspect_ratio_reader
name: PEG-dependent droplet aspect ratio distributions and t-tests (Extended Data Fig. 9e)
role: processing
software: true
stated:
  none: "binary xlsx spreadsheet in unpacked Source Data archive"
  where: "41567_2022_1924_MOESM22_ESM.xlsx ('Fig S9e', B3:E2900)"
  quote: "Droplet aspect ratios / 3% PEG / 5% PEG / 10%PEG / 15% PEG"
inputs:
  peg: {quantity: peg_concentration_wv, unit: percent}
outputs:
  n_droplets: {quantity: sample_count, unit: dimensionless}
  ar_mean: {quantity: droplet_aspect_ratio, unit: dimensionless}
  ar_sd: {quantity: droplet_aspect_ratio_sd, unit: dimensionless}
  ar_median: {quantity: droplet_aspect_ratio, unit: dimensionless}
  ar_q25: {quantity: droplet_aspect_ratio, unit: dimensionless}
  ar_q75: {quantity: droplet_aspect_ratio, unit: dimensionless}
  ar_max: {quantity: droplet_aspect_ratio, unit: dimensionless}
  n_gt_15: {quantity: sample_count, unit: dimensionless}
  p_val_student_vs_next: {quantity: p_value, unit: dimensionless}
  p_val_welch_vs_next: {quantity: p_value, unit: dimensionless}
settings: {}
stochastic: false
