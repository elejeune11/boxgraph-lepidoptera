  final_recovery_sd: {quantity: frap_recovery_fraction_sd, unit: percent}
  final_recovery_sem: {quantity: frap_recovery_fraction_sem, unit: percent}
  all_trials_last_mean: {quantity: frap_recovery_fraction, unit: percent}
  all_trials_last_sd: {quantity: frap_recovery_fraction_sd, unit: percent}
  recovery_120s_mean: {quantity: frap_recovery_fraction, unit: percent}
  t_half_exp_mean: {quantity: frap_half_time, unit: s}
  t_half_exp_sd: {quantity: frap_half_time_sd, unit: s}
  t_half_halfmax_mean: {quantity: frap_half_time, unit: s}
  t_half_halfmax_sd: {quantity: frap_half_time_sd, unit: s}
settings:
  dataset: "fig1f"
