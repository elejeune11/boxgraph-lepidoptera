id: fig5_aspect_ratio_reader
name: Droplet aspect ratio and actin intensity reader across actin-to-VASP ratios (Figs. 5a, 5b, ED Fig. 8a)
role: processing
software: true
stated:
  none: "binary xlsx spreadsheet in unpacked Source Data archive"
  where: "MOESM16 ('Fig S5a' C4:E1288, 'Fig S5b' C3:J386); MOESM21 ('Fig S8a' C5:O657)"
  quote: "Droplet aspect ratios / mean actin int / AR / replicate 2 / replicate 3"
inputs:
  ratio: {quantity: actin_to_vasp_ratio, unit: dimensionless}
outputs:
  n_droplets_5a: {quantity: sample_count, unit: dimensionless}
  ar_median: {quantity: droplet_aspect_ratio, unit: dimensionless}
  ar_mean: {quantity: droplet_aspect_ratio, unit: dimensionless}
  ar_sd: {quantity: droplet_aspect_ratio_sd, unit: dimensionless}
  ar_q25: {quantity: droplet_aspect_ratio, unit: dimensionless}
  ar_q75: {quantity: droplet_aspect_ratio, unit: dimensionless}
  ar_max: {quantity: droplet_aspect_ratio, unit: dimensionless}
  p_val_student_vs_next: {quantity: p_value, unit: dimensionless}
  n_droplets_5b: {quantity: sample_count, unit: dimensionless}
  total_5b: {quantity: sample_count, unit: dimensionless}
  intensity_mean_5b: {quantity: actin_fluorescence_intensity, unit: dimensionless}
  n_droplets_s8a_rep2: {quantity: sample_count, unit: dimensionless}
  total_s8a_rep2: {quantity: sample_count, unit: dimensionless}
  n_droplets_s8a_rep3: {quantity: sample_count, unit: dimensionless}
  total_s8a_rep3: {quantity: sample_count, unit: dimensionless}
settings: {}
stochastic: false
