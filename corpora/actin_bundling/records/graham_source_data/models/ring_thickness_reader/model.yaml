id: ring_thickness_reader
name: Ring thickness vs effective diameter power-law fit and subset-bijection reader (Figs. 3e, 3f, 4h, ED Fig. 4d)
role: processing
software: true
stated:
  none: "binary xlsx spreadsheet in unpacked Source Data archive"
  where: "MOESM14 ('Fig 3e' C3:H175, 'Fig 3f' C3:G388); MOESM15 ('Fig 4h' C3:D306); MOESM20 ('Fig S4d' C3:J168)"
  quote: "Effective diameter (um) / Thickness (um) / discs / rings / AR <1.1 / AR >1.1"
inputs:
  D: {quantity: droplet_diameter, unit: um}
outputs:
  thickness_nls: {quantity: ring_thickness, unit: um}
  a_nls: {quantity: power_law_prefactor_um, unit: dimensionless}
  b_nls: {quantity: power_law_exponent, unit: dimensionless}
  r2_nls: {quantity: fit_r_squared, unit: dimensionless}
  a_logols: {quantity: power_law_prefactor_um, unit: dimensionless}
  b_logols: {quantity: power_law_exponent, unit: dimensionless}
  r2_logols: {quantity: fit_r_squared, unit: dimensionless}
  n_droplets: {quantity: sample_count, unit: dimensionless}
  diam_min: {quantity: droplet_diameter, unit: um}
  diam_max: {quantity: droplet_diameter, unit: um}
  n_shared_fig3e: {quantity: sample_count, unit: dimensionless}
  n_shared_fig3f_lt11: {quantity: sample_count, unit: dimensionless}
settings:
  dataset: "fig3e_rings"
stochastic: false
