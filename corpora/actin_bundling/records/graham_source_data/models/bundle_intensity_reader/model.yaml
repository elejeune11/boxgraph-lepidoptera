id: bundle_intensity_reader
name: Normalized total actin and VASP fluorescence intensity trajectories (Figs. 6f and 6g)
role: processing
software: true
stated:
  none: "binary xlsx spreadsheet in unpacked Source Data archive"
  where: "41567_2022_1924_MOESM17_ESM.xlsx ('Fig 6f' B3:G42, 'Fig 6g' A4:R23)"
  quote: "droplet 1 / droplet 2 / Actin channel / VASP channel / trial 1..3"
inputs:
  t: {quantity: bundle_intensity_time, unit: s}
outputs:
  normalized_intensity: {quantity: normalized_total_intensity, unit: dimensionless}
  n_droplets: {quantity: sample_count, unit: dimensionless}
settings:
  series: "fig6f_d1_actin"
  add_one: false
  snap_nearest: false
stochastic: false
