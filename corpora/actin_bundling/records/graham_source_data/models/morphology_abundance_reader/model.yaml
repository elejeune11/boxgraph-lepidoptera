id: morphology_abundance_reader
name: Droplet and peripheral actin morphology percentage abundance reader (Figs. 2d, 3d, 6d, ED Fig. 4c)
role: processing
software: true
stated:
  none: "binary xlsx spreadsheet in unpacked Source Data archive"
  where: "MOESM13 ('Fig 2d', C6:P11); MOESM14 ('Fig 3d', B7:AI37); MOESM17 ('Fig 6d', B7:R24); MOESM20 ('Fig S4c', A6:Q28)"
  quote: "uniform / peripheral / oval / rod / shell / ring / disc"
inputs:
  category: {quantity: morphology_category_index, unit: dimensionless}
outputs:
  abundance_mean: {quantity: morphology_abundance, unit: percent}
  abundance_sd: {quantity: morphology_abundance_sd, unit: percent}
  total_droplets: {quantity: sample_count, unit: dimensionless}
  min_replicate_droplets: {quantity: sample_count, unit: dimensionless}
  max_replicate_droplets: {quantity: sample_count, unit: dimensionless}
settings:
  dataset: "fig2d_1to20"
  method: "pooled"
stochastic: false
