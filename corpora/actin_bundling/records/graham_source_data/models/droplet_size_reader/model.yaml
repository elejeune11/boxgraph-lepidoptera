id: droplet_size_reader
name: Droplet diameter distribution summary statistics and binned histograms (Extended Data Figs. 4e and 9c)
role: processing
software: true
stated:
  none: "binary xlsx spreadsheet in unpacked Source Data archive"
  where: "MOESM20 ('Fig S4e', E2:E1656); MOESM22 ('Fig S9c', C3:F2595)"
  quote: "Droplet diameter / Droplet diameters (um) / 3% PEG / 5% PEG / 10% PEG / 15% PEG"
inputs:
  D: {quantity: droplet_diameter, unit: um}
outputs:
  n_droplets: {quantity: sample_count, unit: dimensionless}
  diam_median: {quantity: droplet_diameter, unit: um}
  diam_mean: {quantity: droplet_diameter, unit: um}
  diam_sd: {quantity: droplet_diameter_sd, unit: um}
  diam_min: {quantity: droplet_diameter, unit: um}
  diam_max: {quantity: droplet_diameter, unit: um}
  bin_count: {quantity: droplet_size_count, unit: dimensionless}
  bin_freq: {quantity: droplet_size_frequency, unit: percent}
settings:
  dataset: "edfig4e"
  bin_start: 0.629
  bin_width: 0.3156
stochastic: false
