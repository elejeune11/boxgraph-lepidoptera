id: elongation_reader
name: Linear droplet-bundle elongation trajectories and regression fits (Fig. 5h)
role: processing
software: true
stated:
  none: "binary xlsx spreadsheet in unpacked Source Data archive"
  where: "41567_2022_1924_MOESM16_ESM.xlsx ('Fig 5h', A4:R23)"
  quote: "trial 1 / trial 2 / trial 3 / time (s) / droplet 1..5"
inputs:
  t: {quantity: elongation_time, unit: s}
outputs:
  growth_origin_fit: {quantity: bundle_growth_length, unit: um}
  growth_ols_fit: {quantity: bundle_growth_length, unit: um}
  growth_raw_avg: {quantity: bundle_growth_length, unit: um}
  slope_avg_origin: {quantity: bundle_elongation_rate, unit: um/s}
  r2_avg_origin: {quantity: fit_r_squared, unit: dimensionless}
  slope_avg_ols: {quantity: bundle_elongation_rate, unit: um/s}
  r2_avg_ols: {quantity: fit_r_squared, unit: dimensionless}
  slope_ind_origin_mean: {quantity: bundle_elongation_rate, unit: nm/s}
  slope_ind_origin_sd: {quantity: bundle_elongation_rate_sd, unit: nm/s}
  slope_ind_ols_mean: {quantity: bundle_elongation_rate, unit: nm/s}
  slope_ind_ols_sd: {quantity: bundle_elongation_rate_sd, unit: nm/s}
  slope_3trial_origin_sd_pop: {quantity: bundle_elongation_rate_sd, unit: nm/s}
  end_rate_mean: {quantity: bundle_elongation_rate, unit: nm/s}
  end_rate_sd: {quantity: bundle_elongation_rate_sd, unit: nm/s}
  n_droplets: {quantity: sample_count, unit: dimensionless}
  n_at_20s: {quantity: sample_count, unit: dimensionless}
settings: {}
stochastic: false
