# --- 6. MOESM16 Fig. 5h elongation & MOESM17 Fig. 6f/6g intensity ---
- id: run_f5h_fit
  model: elongation_reader
  inputs: {t: query_time_190s}
  settings: {}
  outputs:
    slope_avg_origin: comp_f5h_slope_orig
    r2_avg_origin: comp_f5h_r2_orig
    slope_avg_ols: comp_f5h_slope_ols
    slope_ind_origin_mean: comp_f5h_ind_orig_mean
