# Live runs of all 11 software: true Source Data Excel reader models reading directly
# from $BOXGRAPH_SOURCE (corpus/actin_bundling/code/graham_source_data).

# --- 1. MOESM12 Fig. 1f & MOESM17 Fig. 6b FRAP summaries + curve lookup ---
- id: run_frap_fig1f_summary
  model: frap_summary_reader
  inputs: {}
  settings: {dataset: "fig1f"}
  outputs:
    n_trials_total: comp_f1f_n_total
    n_trials_final: comp_f1f_n_final
    final_recovery_mean: comp_f1f_final_mean
    final_recovery_sd: comp_f1f_final_sd
    final_recovery_sem: comp_f1f_final_sem
    all_trials_last_mean: comp_f1f_all9_mean
    all_trials_last_sd: comp_f1f_all9_sd
    recovery_120s_mean: comp_f1f_120s_mean
    t_half_exp_mean: comp_f1f_thalf_exp_mean
    t_half_exp_sd: comp_f1f_thalf_exp_sd
    t_half_halfmax_mean: comp_f1f_thalf_50_mean
    t_half_halfmax_sd: comp_f1f_thalf_50_sd

- id: run_frap_fig1f_18s
  model: frap_curve_reader
  inputs: {t: query_frap_18s}
  settings: {dataset: "fig1f"}
  outputs:
    recovery: comp_f1f_rec_18s

- id: run_frap_fig6b_3peg
  model: frap_summary_reader
  inputs: {}
  settings: {dataset: "fig6b_3peg"}
  outputs:
    n_trials_total: comp_f6b_3peg_n
    final_recovery_mean: comp_f6b_3peg_final_mean
    final_recovery_sd: comp_f6b_3peg_final_sd

- id: run_frap_fig6b_10peg
  model: frap_summary_reader
  inputs: {}
  settings: {dataset: "fig6b_10peg"}
  outputs:
    n_trials_total: comp_f6b_10peg_n
    final_recovery_mean: comp_f6b_10peg_final_mean
    final_recovery_sd: comp_f6b_10peg_final_sd

