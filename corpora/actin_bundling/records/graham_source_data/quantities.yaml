# Quantities measured and summarized across the 11 Source Data Excel workbooks
# (41567_2022_1924_MOESM12-22_ESM.xlsx) released with Graham et al. (Nature Physics 19, 574-585, 2023).

# Experimental indices and conditions
- id: frap_post_bleach_time
  name: FRAP time post-bleach
  dimension: "[time]"
  description: Time elapsed relative to photobleaching during FRAP recovery measurements (Figs. 1f, 6b).

- id: morphology_category_index
  name: droplet or actin morphology category index
  dimension: dimensionless
  description: "Integer categorical index for morphology classes (Figs. 2d, 6d: 1=Uniform, 2=Peripheral/Ring AR<1.1, 3=Oval/AR>1.1, 4=Rod; Figs. 3d, 3g, ED Fig. 4c: 1=Shell, 2=Ring, 3=Disc)."

- id: actin_to_vasp_ratio
  name: actin-to-VASP molar ratio
  dimension: dimensionless
  description: Bulk monomeric actin-to-VASP molar ratio (1:20 = 0.05, 1:10 = 0.1, 1:7.5 = 0.1333).

- id: peg_concentration_wv
  name: PEG-8000 crowder concentration (% w/v)
  dimension: dimensionless
  description: Weight-per-volume percentage of PEG-8000 macromolecular crowder (3%, 5%, 10%, 15% PEG).

- id: vasp_construct_index
  name: VASP protein construct category index
  dimension: dimensionless
  description: "Integer categorical index for VASP constructs (ED Fig. 2d: 1=WT, 2=IDR/PRR, 3=delta-tet/mVASP, 4=delta-EVH1; ED Fig. 3e: 1=mutGABmutFAB, 2=mutFAB)."

- id: elongation_time
  name: bundle elongation elapsed time
  dimension: "[time]"
  description: Elapsed time during linear droplet-bundle elongation (Fig. 5h).

- id: bundle_intensity_time
  name: fluorescence intensity tracking elapsed time
  dimension: "[time]"
  description: Elapsed time during post-bleach recovery or bundle elongation intensity tracking (Figs. 6f, 6g).

# FRAP recovery quantities
- id: frap_recovery_fraction
  name: FRAP fractional fluorescence recovery
  dimension: dimensionless
  description: Percentage of normalized fluorescence intensity recovered after photobleaching.

- id: frap_recovery_fraction_sd
  name: standard deviation of FRAP fractional recovery
  dimension: dimensionless
  description: Sample standard deviation (ddof=1) of FRAP fractional recovery across droplets.

- id: frap_recovery_fraction_sem
  name: standard error of mean FRAP fractional recovery
  dimension: dimensionless
  description: Standard error of the mean of FRAP fractional recovery across droplets.

- id: frap_half_time
  name: FRAP recovery half-time
  dimension: "[time]"
  description: Half-time t_{1/2} for fluorescence recovery after photobleaching inside VASP droplets.

- id: frap_half_time_sd
  name: standard deviation of FRAP recovery half-time
  dimension: "[time]"
  description: Sample standard deviation (ddof=1) of FRAP recovery half-time across droplets.

# Morphology abundance quantities
- id: morphology_abundance
  name: droplet morphology percentage abundance
  dimension: dimensionless
  description: Mean percentage of analysed droplets belonging to a given morphological class across replicates (Figs. 2d, 3d, 6d, ED Fig. 4c).

- id: morphology_abundance_sd
  name: standard deviation of droplet morphology percentage abundance
  dimension: dimensionless
  description: Sample standard deviation (ddof=1) of morphology percentage abundance across n = 3 independent replicates.

# Droplet geometry, ring thickness, and power-law fit quantities
- id: droplet_diameter
  name: effective droplet diameter
  dimension: "[length]"
  description: Effective droplet diameter D = (a b^2)^(1/3) or circular diameter (Figs. 3e, 3f, 4h, ED Figs. 4d, 4e, 9c).

- id: droplet_diameter_sd
  name: standard deviation of droplet diameter
  dimension: "[length]"
  description: Sample standard deviation (ddof=1) of droplet diameters.

- id: ring_thickness
  name: bundled-actin ring thickness
  dimension: "[length]"
  description: Diffraction-limit-subtracted FWHM thickness of the peripheral bundled-actin ring (Figs. 3e, 3f, 4h, ED Fig. 4d).

- id: power_law_prefactor_um
  name: empirical power-law prefactor (micrometre basis)
  dimension: dimensionless
  description: Numerical prefactor a in y = a * x^b with thickness y and diameter x in um.

- id: power_law_exponent
  name: ring thickness power-law scaling exponent
  dimension: dimensionless
  description: Exponent b in the empirical power law T_ring = a * D^b.

- id: fit_r_squared
  name: coefficient of determination R^2
  dimension: dimensionless
  description: Goodness-of-fit R^2 for nonlinear power-law or linear regressions.

- id: droplet_aspect_ratio
  name: droplet aspect ratio
  dimension: dimensionless
  description: Ratio a/b of major to minor axis of a VASP droplet (Figs. 3g, 5a, 5b, ED Figs. 8a, 9e).

- id: droplet_aspect_ratio_sd
  name: standard deviation of droplet aspect ratio
  dimension: dimensionless
  description: Sample standard deviation (ddof=1) of droplet aspect ratios.

# Linear bundle elongation and fluorescence intensity quantities
- id: bundle_growth_length
  name: bundle elongation length increment
  dimension: "[length]"
  description: Increase in linear bundle length over elapsed time (Fig. 5h).

- id: bundle_elongation_rate
  name: linear droplet-bundle elongation rate
  dimension: "[length] / [time]"
  description: Linear elongation velocity of elongating VASP-actin droplet bundles (Fig. 5h).

- id: bundle_elongation_rate_sd
  name: standard deviation of linear bundle elongation rate
  dimension: "[length] / [time]"
  description: Standard deviation of bundle elongation rates across droplets or experimental trials.

- id: normalized_total_intensity
  name: normalized total droplet fluorescence intensity
  dimension: dimensionless
  description: Summed pixel fluorescence intensity across a droplet normalized to pre-bleach (Fig. 6f) or initial (Fig. 6g) intensity.

- id: actin_fluorescence_intensity
  name: mean droplet actin fluorescence intensity
  dimension: dimensionless
  description: Mean actin channel fluorescence intensity per droplet in arbitrary camera units (Fig. 5b, ED Fig. 8a).

# Partitioning and size histogram quantities
- id: protein_partition_coefficient
  name: protein fluorescence partition coefficient
  dimension: dimensionless
  description: Ratio of fluorescence intensity inside VASP droplets to outside droplets (ED Figs. 2d, 3e).

- id: protein_partition_coefficient_sd
  name: standard deviation of protein partition coefficient
  dimension: dimensionless
  description: Sample standard deviation (ddof=1) of replicate mean partition coefficients across n = 3 trials.

- id: protein_partition_coefficient_sem
  name: standard error of protein partition coefficient
  dimension: dimensionless
  description: Standard error of the mean of replicate mean partition coefficients across n = 3 trials.

- id: droplet_size_count
  name: droplet size histogram bin frequency count
  dimension: dimensionless
  description: Number of droplets falling into a diameter histogram bin (ED Fig. 4e).

- id: droplet_size_frequency
  name: droplet size distribution percentage frequency
  dimension: dimensionless
  description: Percentage frequency of droplets per 0.2 um diameter bin (ED Fig. 9c).

# Generic counting and statistical test quantities
- id: sample_count
  name: sample or droplet count
  dimension: dimensionless
  description: Number of droplets, trials, images, or overlapping data points counted in a spreadsheet block.

- id: p_value
  name: two-tailed statistical test P-value
  dimension: dimensionless
  description: Two-tailed unpaired Student or Welch t-test P-value comparing droplet aspect ratio distributions.
