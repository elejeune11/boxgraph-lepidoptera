    yields 0 ModelAtlas equation relations across all 8 x 11 = 88 model pairs (workbook readers
    summarize fixed experimental spreadsheets rather than continuous physical laws) and 0 direct
    cited.yaml links (disjoint graham2023 target sets: 24 vs 39 unique datums), while quantifying
    four direct links between MOESM12-22 and the live simulation notebook:
    (1) Exact panel partition & Fig. 4h sole intersection: MOESM12-22 accounts for all 35 experimental
    digitized panels in graham2023, whereas all 26 theoretical/simulation panels (Fig. 4f [1], Fig. 4g
    [4], Fig. 4h model curves [7], Fig. 5c [2], ED Fig. 5c [5], ED Fig. 6A-B [2], ED Fig. 7b/d-g [5])
    are absent from the Excel archive. Fig. 4h is the sole shared panel: MOESM15 ('Fig 4h') holds ONLY
    the n = 304 experimental AR < 1.1 scatter (exact union of MOESM14 'Fig 3e' 173 rings + 131 discs,
    excluding 82 shells in 'Fig 3f'; 11 droplets with D = 4.0003-4.2804 um > 4.0 um, including 4 at
    4.17-4.28 um) overlaid with graham_code/notebook_critical_ring_thickness's D^2.033 + IEEE-754
    sawtooth curves. Both attachments use the exact same AR = 1.1 threshold (generatering() line 830
    'if(aratio<=1.1):' vs experimental AR < 1.1 / AR > 1.1 partitions in MOESM13/14/15/17/20).
    (2) IEEE-754 Nbeads = 29 trigger rate on raw experimental diameters: 102/304 (33.6%) of MOESM15
    'Fig 4h' diameter floats and 554/1655 (33.5%) of MOESM20 'Fig S4e' floats trigger
    VASPDroplet_simulate.ipynb's int(D*1e3/(D*0.1*1e3)) = 9 truncation bug (2.8*D open arc, -11.8%
    drop in T_crit).
    (3) Experimental AR < 1.1 vs omitted AR > 1.1 overlap against simulated T_crit(D, gamma_I):
    graham_code's clean Nbeads = 30 threshold T_crit = 0.00890 * gamma_I * D^2.033 matches MOESM14
    'Fig 3e' rings-only NLS (0.0476 * D^1.9682, n = 173) within <= 6.5% at gamma_I = 5 pN (median
    implied gamma_I = 4.88 pN, IQR 3.93-6.21 pN), where only 103/304 (33.9%) of Fig. 4h (94/173 rings,
    9/131 = 6.9% of discs) lie below T_crit. However, MOESM14 'Fig 3f' AR > 1.1 (n = 47 deformed
    droplets, omitted from Fig. 4h) has median implied gamma_I = 7.54 pN (IQR 5.86-10.03 pN), matching
    undeformed Fig. 3e discs (n = 131, median 7.55 pN, IQR 6.01-9.26 pN); hence no single gamma_I
    cleanly separates undeformed from deformed droplets (at 7.5 pN: 216/304 = 71.1% of Fig. 4h <= T_crit
    vs only 24/47 = 51.1% of AR > 1.1 > T_crit; at 10-15 pN: 89.8-98.0% of Fig. 4h <= T_crit but
    74.5-95.7% of AR > 1.1 also lie below T_crit). Formal cross-validation belongs to
    validate:graham_code+graham_source_data.
    (4) Experimental AR distributions vs 2D ring simulation ceiling: graham_code/notebook_droplet_ring_slsqp
    saturates at AR ~ 1.56-1.75 (gamma_I = 5 pN) and ~1.75-1.80 (gamma_I = 1 pN) up to Nfil = 200 due
    to its 2.9*D open arc. While 100% of MOESM14 'Fig 3g' shells (max 1.10) and rings (max 1.31) and
    96.9% of discs (max 2.01) stay below AR = 1.57, 27.9% of MOESM16 'Fig S5a' 1:10 (max 6.45), 48.6%
