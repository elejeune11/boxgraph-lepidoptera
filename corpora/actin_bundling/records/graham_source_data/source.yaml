notes: >
  Complete BoxGraph record of all 11 Source Data Excel (.xlsx) workbooks
  (41567_2022_1924_MOESM12-22_ESM.xlsx; 22 visible sheets, 441,739 bytes total, 158 formulas across
  4 sheets) released with Graham et al., Nature Physics 19, 574-585 (2023) (record `graham2023`).
  No .xlsx files or raw tables are copied into this record; 11 zero-openpyxl Python `software: true`
  reader models under models/ parse the workbooks live from $BOXGRAPH_SOURCE via stdlib zipfile +
  xml.etree.ElementTree to recompute exact means, sample/population SDs, SEMs, medians, IQRs,
  sample counts, nonlinear least-squares and log-log OLS power-law fits, through-origin and
  free-intercept linear regressions, single-exponential FRAP half-times, unpaired Student/Welch
  t-tests, and binned diameter histograms. Across 79 intra-record comparisons (73 reproduced, 3 close,
  3 not reproduced diagnostic checks) and 43 cross-record validations against `graham2023` (2 scalars
  + all 35 source-data-backed blindly digitized figure curves + 6 diagnostic swap/offset/mean checks:
  29 reproduced, 8 close, 6 not reproduced), the record verifies both the paper's printed numbers
  and the blind PDF digitization accuracy while uncovering multiple substantive discrepancies.

  COMPLETE WORKBOOK-BY-WORKBOOK & SHEET-BY-SHEET INVENTORY (11 files, 22 sheets):
