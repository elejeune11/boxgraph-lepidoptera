# ==============================================================================
# Added inputs: values not printed by Tjhung, Nardini & Cates (2018) that are
# needed to evaluate analytical, ODE, and PDE models at representative points.
# ==============================================================================
- id: R_test_droplet
  quantity: droplet_radius
  unit: dimensionless
  printed: "15"
  basis: "Representative droplet radius inside the plotted range R in [5, 40] of Fig. 3 (p. 6), well above the equilibrium interface width xi_eq = sqrt(2) ≈ 1.414."
  alternatives: ["10", "30"]
  stands_for: "R in Fig. 3 and Appendix C"

- id: R1_init_two_droplet
  quantity: droplet_radius
  unit: dimensionless
  printed: "16.7"
  basis: "Larger initial droplet radius read approximately from Fig. 4(b) at t = 100 (p. 8); the paper states R1(0) > R2(0) without printing numerical values."
  alternatives: ["16.0", "17.0"]
  stands_for: "R1(0) in Fig. 4(b) and Appendix E"

- id: R2_init_two_droplet
  quantity: droplet_radius
  unit: dimensionless
  printed: "9.2"
  basis: "Smaller initial droplet radius read approximately from Fig. 4(b) at t = 100 (p. 8); the paper states R1(0) > R2(0) without printing numerical values."
  alternatives: ["9.0", "9.5"]
  stands_for: "R2(0) in Fig. 4(b) and Appendix E"

- id: t_two_droplet_eval
  quantity: time
  unit: dimensionless
  printed: "10000"
  basis: "Representative intermediate time within the Fig. 4(b) window t in [100, 100000] where forward vs reverse Ostwald separation is clearly developed."
  alternatives: ["5000", "20000"]
  stands_for: "t in Fig. 4(b)"

- id: R1_fig6_added
  quantity: droplet_radius
  unit: dimensionless
  printed: "23"
  basis: "Larger droplet radius inferred from Fig. 6 (p. 16), where the left droplet spans approximately x = 7 to 53 in the 120 x 120 domain; not printed in text."
  alternatives: ["20", "25"]
  stands_for: "R1 in Fig. 6 two-droplet simulation"

- id: R2_fig6_added
  quantity: droplet_radius
  unit: dimensionless
  printed: "7"
  basis: "Smaller droplet radius inferred from Fig. 6 (p. 16), where the right droplet spans approximately x = 85 to 99 in the 120 x 120 domain; not printed in text."
  alternatives: ["6", "9"]
  stands_for: "R2 in Fig. 6 two-droplet simulation"

- id: epsilon_small_test
  quantity: supersaturation
  unit: dimensionless
  printed: "0.001"
  basis: "Small positive supersaturation epsilon << 1 used to test the small-epsilon Taylor expansion Eq. (30) against exact Eq. (28) in the passive and Region A regimes."
  alternatives: ["0.0001", "0.01"]
  stands_for: "epsilon = phi_s - phi_1 in Eq. (30)"

- id: epsilon_small_neg_test
  quantity: supersaturation
  unit: dimensionless
  printed: "-0.001"
  basis: "Small negative supersaturation epsilon < 0 appropriate for reverse Ostwald ripening in Region B (sigma < 0, p. 9 and Appendix E)."
  alternatives: ["-0.0001", "-0.01"]
  stands_for: "epsilon = phi_s - phi_1 in Eq. (30) for Region B"

- id: r_eval_eq25
  quantity: radial_coordinate
  unit: dimensionless
  printed: "30"
  basis: "Representative exterior radial position r = 2 R > R to evaluate the quasistatic chemical potential profile mu(r) in Eq. (25)."
  alternatives: ["20", "60"]
  stands_for: "r in Eq. (25)"

- id: K1_nonzero_test
  quantity: gradient_coupling_K1
  unit: dimensionless
  printed: "0.1"
  basis: "Representative small nonzero gradient coupling K_1 (with |2 K_1 phi / K| < 1 across the binodals) to evaluate Appendix D Eqs. (D2)-(D6); no numerical value of K_1 != 0 is printed."
  alternatives: ["0.05", "-0.1"]
  stands_for: "K_1 in Appendix D"

- id: phi_eval_test
  quantity: order_parameter
  unit: dimensionless
  printed: "0.5"
  basis: "Representative scalar order parameter phi to evaluate psi(phi), g(phi), and psi_K1(phi)."
  alternatives: ["-0.5", "0.8"]
  stands_for: "phi in Eqs. (B1)-(B2) and (D2)-(D3)"

- id: zeta_boundary_sample
  quantity: active_rotational_parameter_zeta
  unit: dimensionless
  printed: "-2"
  basis: "Representative negative zeta value inside the Fig. 4(a) plotted domain [-4, 4] to evaluate the sigma = 0 phase boundary lambda*(zeta)."
  alternatives: ["-1", "-4"]
  stands_for: "zeta along the Region A/B boundary in Fig. 4(a)"

# ==============================================================================
# Added microscopic AOUP parameters for Sec. VI / Appendix G (no numerical
# values are printed in Sec. VI or Appendix G)
# ==============================================================================
- id: rho_cg_test
  quantity: particle_density
  unit: dimensionless
  printed: "1.0"
  basis: "Representative dimensionless coarse-grained particle density rho for evaluating Sec. VI Eqs. (36) and (39); Sec. VI is purely symbolic."
  alternatives: ["0.5", "2.0"]
  stands_for: "rho in Eqs. (36), (39)"

- id: tau_cg_test
  quantity: persistence_time
  unit: dimensionless
  printed: "0.2"
  basis: "Representative persistence time tau != 1 and 2*tau != 1 chosen so that both the missing factor of tau in printed Eqs. (G2), (G4)-(G6) and the extraneous factor of 1/2 in Eq. (G4) produce clear quantitative discrepancies."
  alternatives: ["0.1", "2.0"]
  stands_for: "tau in Sec. VI and Appendix G"

- id: T_cg_test
  quantity: thermal_diffusivity
  unit: dimensionless
  printed: "1.0"
  basis: "Representative passive diffusivity / temperature T for evaluating Sec. VI and Appendix G formulas."
  alternatives: ["0.5", "2.0"]
  stands_for: "T in Sec. VI and Appendix G"

- id: v0_cg_test
  quantity: swim_speed
  unit: dimensionless
  printed: "2.0"
  basis: "Representative zeroth-order self-propulsion speed v_0 for evaluating Sec. VI and Appendix G."
  alternatives: ["1.0", "3.0"]
  stands_for: "v_0 in Eq. (44) and Appendix G"

- id: v1_cg_test
  quantity: swim_speed_density_slope
  unit: dimensionless
  printed: "-0.5"
  basis: "Representative negative motility slope v_1 < 0 (motility-induced slowing with density) for evaluating Eq. (44) and Appendix G."
  alternatives: ["-0.2", "-1.0"]
  stands_for: "v_1 in Eq. (44) and Appendix G"

- id: gamma0_cg_test
  quantity: swim_speed_laplacian_coeff
  unit: dimensionless
  printed: "-0.3"
  basis: "Representative nonlocal speed-sensing coefficient gamma_0 < 0 (ensuring K^qs > 0) for evaluating Eq. (44) and Eqs. (G4)-(G5)."
  alternatives: ["-0.1", "-0.6"]
  stands_for: "gamma_0 in Eq. (44) and Eqs. (G4)-(G5)"

- id: gamma1_cg_test
  quantity: swim_speed_laplacian_slope
  unit: dimensionless
  printed: "0.1"
  basis: "Representative first-order coefficient gamma_1 in gamma(rho) = gamma_0 + gamma_1 rho for evaluating Eq. (G5)."
  alternatives: ["0.0", "0.2"]
  stands_for: "gamma_1 in Eq. (G5)"

- id: beta0_cg_test
  quantity: swim_speed_gradsq_coeff
  unit: dimensionless
  printed: "0.4"
  basis: "Representative gradient-squared sensing coefficient beta_0 for evaluating Eq. (G6)."
  alternatives: ["0.0", "0.8"]
  stands_for: "beta_0 in Eq. (G6)"

- id: U0_cg_test
  quantity: pair_potential_strength
  unit: dimensionless
  printed: "1.0"
  basis: "Representative repulsive soft-core Gaussian pair-potential amplitude U_0 for evaluating B and C in Eqs. (45)-(46)."
  alternatives: ["0.5", "2.0"]
  stands_for: "U_0 in test potential U(y) = U_0 exp(-y^2 / (2 ell^2))"

- id: ell_cg_test
  quantity: pair_potential_range
  unit: dimensionless
  printed: "1.0"
  basis: "Representative soft pair-potential range ell for evaluating B and C in Eqs. (45)-(46)."
  alternatives: ["0.5", "2.0"]
  stands_for: "ell in test potential U(y) = U_0 exp(-y^2 / (2 ell^2))"

- id: ell_2d_screening
  quantity: domain_size
  unit: dimensionless
  printed: "50"
  basis: "Unstated 2D logarithmic diffusion screening cutoff ell in ln(ell/R_i) (Appendix E p. 16 notes a 2D logarithmic correction without stating ell); ell = 50 (order half-box size in a ~100-128 domain) simultaneously matches the ~1.7x slowdown, Region A R_1 overshoot > 19.1, and Region B R_eq ~ 13.26 in Fig. 4(b)."
  alternatives: ["40", "64"]
  stands_for: "2D logarithmic screening length ell in ln(ell/R_i) for Fig. 4(b)"

