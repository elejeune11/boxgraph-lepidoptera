# ==============================================================================
# Cross-record ModelAtlas relations with zwicker2015 (Phys. Rev. E 92, 012317)
# ==============================================================================
# Tjhung, Nardini & Cates (2018) cite Zwicker, Hyman & Julicher (2015) as ref-30
# on pp. 1 (031080-1) and 13 (031080-13) as a contrasting non-conserved chemical
# reaction mechanism for arresting Ostwald ripening. Because tjhung2018 does not
# print an explicit equation-to-equation mapping to zwicker2015, all mathematical
# relations below carry provenance: proposed. Under the exact passive Cahn-Hilliard
# dictionary phi^B = (psi/2)*(1 + phi), A = b*psi^2/8, K = kappa*psi^2/4 (with
# opposing subscript conventions: Tjhung phi_+ [dense] <-> Zwicker phi_-^B [dense],
# Tjhung phi_- [dilute] <-> Zwicker phi_+^B [dilute]), both theories collapse onto
# the identical Model B equilibrium free energy, interfacial tension/width, curved-
# droplet Gibbs-Thomson shifts, 3D diffusion profile, droplet growth kinetics, and
# t^(1/3) coarsening law.

# --- 1A. Shared Passive Quartic Double-Well Chemical Potential ---

- id: rel_zwicker2015_ternary_muB_scales_model_b_mu
  kind: scales_as
  a: zwicker2015/ternary_free_energy_eq1
  b: tjhung2018/model_b_bulk_eq3
  mapping:
    a: "-b / 2"
    b: "2 * b / psi**2"
    phi: "phi_B - psi / 2"
  output_map:
    mu_eq: mu_B
  regime:
    a: [0.5, 5.0]
    b: [0.5, 10.0]
    psi: [0.4, 1.0]
    phi_A: [0.01, 0.2]
    phi_B: [0.02, 0.15]
  provenance: proposed
  reason: >
    Shifting Zwicker Eq. (1)'s B-component double-well potential f_B(phi^B) =
    (b/(2*psi^2))*(phi^B)^2*(psi - phi^B)^2 to its midpoint phi = phi^B - psi/2 yields
    f_B = b*psi^2/32 + (-b/2)*phi^2/2 + (2*b/psi^2)*phi^4/4. Differentiating removes the
    constant shift, giving mu^B = (b/psi^2)*phi^B*(psi - phi^B)*(psi - 2*phi^B), which
    is algebraically identical (up to dimensional energy scale [J/m^3] vs dimensionless)
    to Tjhung Eq. (3)'s Model B chemical potential mu_eq = a*phi + b*phi^3 with a = -b/2
    and b_T = 2*b/psi^2, matching log-slopes across all three shared inputs (b, psi, phi^B).
  assumptions:
    - "Midpoint-shifted order parameter phi = phi^B - psi/2 with Landau couplings a = -b/2 and b_T = 2*b/psi^2."
    - "Sampled strictly in the lower half-well 0 < phi^B < psi/2 away from zeros of mu^B."

- id: rel_zwicker2015_binary_sec3_psi1_scales_model_b_mu
  kind: scales_as
  a: zwicker2015/binary_free_energy_sec3
  b: tjhung2018/model_b_bulk_eq3
  mapping:
    a: "-b / 2"
    b: "2 * b"
    phi: "phi_B - 1 / 2"
  output_map:
    mu_eq: mu_B
  regime:
    b: [0.5, 10.0]
    psi: [1.0, 1.0]
    phi_B: [0.05, 0.45]
  provenance: proposed
  reason: >
    In Zwicker Sec. III's strong-segregation binary limit psi = 1, the printed double-well
    free energy f(phi^B) = (b/2)*(phi^B)^2*(1 - phi^B)^2 yields mu^B matching Tjhung Eq. (3)'s
    Model B chemical potential mu_eq = a*phi + b*phi^3 with a = -b/2, b_T = 2*b, and
    phi = phi^B - 1/2 across (b, phi^B).
  assumptions:
    - "Binary strong-segregation limit psi = 1."

- id: rel_zwicker2015_binary_sec3_general_psi_vs_model_b_mu
  kind: scales_as
  a: zwicker2015/binary_free_energy_sec3
  b: tjhung2018/model_b_bulk_eq3
  mapping:
    a: "-b / 2"
    b: "2 * b / psi**2"
    phi: "phi_B - psi / 2"
  output_map:
    mu_eq: mu_B
  regime:
    b: [0.5, 10.0]
    psi: [0.4, 0.9]
    phi_B: [0.02, 0.15]
  provenance: proposed
  reason: >
    Documented paper-misprint test: evaluates Zwicker Sec. III's printed f(phi^B) =
    (b/2)*(phi^B)^2*(psi - phi^B)^2 (which omits the 1/psi^2 factor present in Eq. 1)
    against Tjhung Eq. (3) under the exact Eq. (1) dictionary a = -b/2, b_T = 2*b/psi^2,
    phi = phi^B - psi/2 for general psi != 1. Intentionally not_verified with psi log-slope
    discrepancy exactly 2, independently corroborating zwicker2015/q_binary_free_energy_sec3_missing_psi2.
  assumptions:
    - "Tests general psi in [0.4, 0.9] under the Eq. (1) Landau dictionary."

# --- 1B. Shared Passive Interfacial Tension, Width, and Capillary Length ---

- id: rel_zwicker2015_surface_tension_scales_eq_interface
  kind: scales_as
  a: zwicker2015/surface_tension_gamma
  b: tjhung2018/equilibrium_interface_p4
  mapping:
    A: "b * psi**2 / 8"
    K: "kappa * psi**2 / 4"
  output_map:
    sigma_eq: gamma
  regime:
    psi: [0.1, 1.0]
    b: [0.5, 10.0]
    kappa: [1.0e-13, 1.0e-11]
  provenance: proposed
  reason: >
    Under the exact passive Cahn-Hilliard affine transformation phi^B = (psi/2)*(1 + phi),
    Zwicker's free-energy functional int [(b/(2*psi^2))*(phi^B)^2*(psi - phi^B)^2 +
    (kappa/2)*|grad phi^B|^2] dr maps onto Tjhung Eq. (3)-(4) int [A*(phi^4/4 - phi^2/2) +
    (K/2)*|grad phi|^2] dr (up to constant +A/4) with A = b*psi^2/8 and K = kappa*psi^2/4.
    Substituting into Tjhung's equilibrium tension sigma_eq = sqrt(8*K*A/9) (p. 4) yields
    (1/6)*psi^2*sqrt(b*kappa) = gamma identically (up to dimensional [J/m^2] vs dimensionless
    units), matching log-slopes (+2, +1/2, +1/2) in (psi, b, kappa).
  assumptions:
    - "Exact passive Cahn-Hilliard parameter dictionary A = b*psi^2/8, K = kappa*psi^2/4."

- id: rel_zwicker2015_interface_width_scales_eq_interface
  kind: scales_as
  a: zwicker2015/interface_width_w
  b: tjhung2018/equilibrium_interface_p4
  mapping:
    A: "b / 8"
    K: "kappa / 4"
  output_map:
    xi_eq: w
  regime:
    kappa: [1.0e-13, 1.0e-11]
    b: [0.5, 10.0]
  provenance: proposed
  reason: >
    Under A = b*psi^2/8 and K = kappa*psi^2/4, psi cancels in the ratio K/A = 2*kappa/b,
    so Tjhung's equilibrium interfacial width xi_eq = sqrt(K/(2*A)) = sqrt(kappa/b) (p. 4,
    kink tanh(x/(2*xi_eq))) equals exactly w/2 relative to Zwicker's interface width
    w = 2*sqrt(kappa/b) (p. 2, kink (psi/2)*(1 + tanh(x/w))), sharing identical (+1/2, -1/2)
    log-slopes in (kappa, b).
  assumptions:
    - "Exact passive Cahn-Hilliard ratio K/(2*A) = kappa/b giving convention ratio w = 2*xi_eq."

- id: rel_zwicker2015_capillary_length_scales_eq_interface
  kind: scales_as
  a: tjhung2018/equilibrium_interface_p4
  b: zwicker2015/capillary_length_from_micro
  mapping:
    b: "8 * A"
    kappa: "4 * K"
    psi: "1"
  output_map:
    gamma_beta: xi_eq
  regime:
    A: [0.1, 1.0]
    K: [0.5, 2.0]
  provenance: proposed
  reason: >
    In the passive strong-segregation binary limit (psi = 1, b = 8*A, kappa = 4*K), Zwicker's
    microscopic capillary length gamma*beta = [(1/6)*psi^2*sqrt(b*kappa)]*[2/(b*psi)] =
    (1/3)*sqrt(kappa/b) equals exactly (1/3)*xi_eq = (1/3)*sqrt(K/(2*A)) in Tjhung (p. 4),
    sharing identical (+1/2, -1/2) log-slopes in (K, A).
  assumptions:
    - "Binary passive dictionary b = 8*A, kappa = 4*K at psi = 1, giving gamma*beta = xi_eq / 3."

- id: rel_zwicker2015_pseudotension_passive_scales_surface_tension
  kind: scales_as
  a: tjhung2018/pseudotension_flat_eq20
  b: zwicker2015/surface_tension_gamma
  mapping:
    psi: "1"
    b: "8 * A"
    kappa: "4 * K"
  output_map:
    gamma: sigma
  regime:
    A: [0.1, 1.0]
    K: [0.5, 2.0]
    zeta: [0.0, 0.0]
    lam: [0.0, 0.0]
  provenance: proposed
  reason: >
    Links AMB+'s active pseudotension sigma (Eq. 20, p. 7) directly to Zwicker's passive
    surface tension gamma (p. 2). In the passive limit zeta = lambda = 0, sigma recovers
    sigma_eq = sqrt(8*K*A/9) = (1/6)*sqrt((8*A)*(4*K)) = gamma (at psi = 1), sharing exact
    (+1/2, +1/2) log-slopes in (A, K), whereas turning on active currents (zeta, lambda != 0)
    allows sigma < 0 (reverse Ostwald ripening) in contrast to Zwicker's strictly positive gamma > 0.
  assumptions:
    - "Passive equilibrium limit zeta = lambda = 0 with binary dictionary b = 8*A, kappa = 4*K, psi = 1."

# --- 1C. Flat & Curved Coexistence Binodals and Gibbs-Thomson Shifts ---

- id: rel_zwicker2015_coex_eqA1_reduces_model_b_binodal
  kind: reduces_to
  a: zwicker2015/coexistence_exact_eqA1
  b: tjhung2018/model_b_bulk_eq3
  mapping:
    a: "-psi**2"
    b: "1"
    phi: "0"
  output_map:
    phi_b_pos: phi_minus_B
  limit:
    R: "oo"
  regime:
    b: [1.0, 10.0]
    psi: [0.1, 1.0]
    gamma: [1.0e-4, 1.0e-3]
    R: [1.0, 10.0]
  provenance: proposed
  reason: >
    In the flat-interface thermodynamic limit R -> oo (vanishing Laplace pressure 2*gamma/R -> 0),
    Zwicker Appendix A Eq. (A1)'s exact curved-interface dense-phase coexistence fraction
    phi_-^B(R) reduces to the planar binodal psi, matching Tjhung Eq. (3)'s Model B binodal
    phi_b = sqrt(-a/b) for a = -psi^2, b = 1.
  assumptions:
    - "Flat-interface limit R -> oo; dense-phase coexistence convention phi_-^B <-> phi_b_pos."

- id: rel_zwicker2015_binodals_flat_reduces_coex_eqA1
  kind: reduces_to
  a: tjhung2018/binodals_flat_eq9
  b: zwicker2015/coexistence_exact_eqA1
  mapping:
    b: "8 * A"
    psi: "1"
    gamma: "0"
    R: "100"
  output_map:
    phi_minus_B: phi_2
  limit:
    zeta: "0"
    lam: "0"
  regime:
    A: [0.1, 1.0]
    K: [0.5, 2.0]
    zeta: [0.05, 1.0]
    lam: [0.05, 0.5]
  provenance: proposed
  reason: >
    As AMB+ activity vanishes (zeta -> 0, lambda -> 0), Tjhung Eq. (9)'s active flat-interface
    dense binodal phi_2 reduces to the symmetric equilibrium binodal +1, matching Zwicker
    Appendix A Eq. (A1)'s planar (gamma = 0) binary dense binodal phi_-^B = psi = 1.
  assumptions:
    - "Passive limit zeta, lambda -> 0 in AMB+ compared to planar (gamma = 0) binary coexistence psi = 1 in Zwicker."

- id: rel_zwicker2015_curved_O1R_approx_gibbs_thomson
  kind: approximated_by
  a: tjhung2018/curved_binodals_O1R_eq16_19
  b: zwicker2015/gibbs_thomson_eq6
  mapping:
    psi: "1"
    gamma_beta: "sqrt(2 * K / A) / 3"
    R: "R"
  output_map:
    phi_minus_B: phi_plus
  regime:
    A: [0.2, 0.5]
    K: [0.8, 1.5]
    zeta: [0.0, 0.0]
    lam: [0.0, 0.0]
    d: [3.0, 3.0]
    R: [20.0, 100.0]
  tolerance: 0.01
  provenance: proposed
  reason: >
    In passive 3D equilibrium (zeta = lambda = 0, d = 3), Tjhung Eqs. (16) and (19) yield a
    curved-droplet dense-phase binodal phi_+(R) = 1 + sigma_eq/(2*A*R) + O(1/R^2) =
    1 + sqrt(2*K/A)/(3*R) + O(1/R^2), matching Zwicker Eq. (6)'s linearized Gibbs-Thomson
    dense-phase relation phi_-^B(R) = psi + gamma*beta/R with psi = 1 and matched O(1/R)
    capillary amplitude gamma*beta = 2*xi_eq/3 = sqrt(2*K/A)/3 (accounting for the factor-of-2
    order-parameter span Delta_phi = 2 vs psi = 1 and opposite +/- subscript conventions).
    Across R in [20, 100], the nonlinear quartic O(1/R^2) discrepancy is at most 3.87e-3.
  assumptions:
    - "Passive 3D droplet (zeta = lambda = 0, d = 3) with matched O(1/R) Gibbs-Thomson shift gamma*beta = 2*xi_eq/3."
    - "Opposite subscript convention: Tjhung dense interior phi_+ <-> Zwicker dense interior phi_-^B."

- id: rel_zwicker2015_curved_O1R_approx_coex_eqA1
  kind: approximated_by
  a: tjhung2018/curved_binodals_O1R_eq16_19
  b: zwicker2015/coexistence_exact_eqA1
  mapping:
    b: "4 * A"
    psi: "1"
    gamma: "sqrt(8 * K * A / 9)"
    R: "R"
  output_map:
    phi_minus_B: phi_plus
  regime:
    A: [0.2, 0.5]
    K: [0.8, 1.5]
    zeta: [0.0, 0.0]
    lam: [0.0, 0.0]
    d: [3.0, 3.0]
    R: [20.0, 100.0]
  tolerance: 0.01
  provenance: proposed
  reason: >
    Compares both papers' exact nonlinear curved-droplet coexistence equations in passive 3D
    equilibrium (Tjhung Eqs. 16 & 19 at zeta = lambda = 0, d = 3 vs Zwicker Appendix A Eq. A1).
    Because phi_-^B = (1 + phi_+)/2 maps Tjhung's [-1, 1] well onto Zwicker's [0, 1] well
    (halving the curvature shift at fixed R), evaluating Eq. (A1) at b = 4*A (equivalently
    R_Z = R/2) with gamma = sigma_eq = sqrt(8*K*A/9) aligns both models identically through
