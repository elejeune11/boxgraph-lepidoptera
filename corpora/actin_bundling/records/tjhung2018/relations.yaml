    b2: [1.0, 1.0]
    gamma1: [0.5, 0.5]
    gamma2: [0.5, 0.5]
  provenance: proposed
  reason: >
    Connects Frohoff Appendix A Eq. (A5)'s order-parameter scale
    phi_hat_1 = sqrt(kappa_1/(zeta_1*b_1*L_0^2)) to Tjhung's equilibrium interfacial width
    xi_eq = sqrt(K/(2*A)) (p. 4). Setting Frohoff's unit binodal scale phi_hat_1 = 1 (matching
    Tjhung Eq. 4) fixes L_0 = sqrt(kappa_1/(zeta_1*b_1)) = sqrt(2/zeta_1)*xi_eq, and at fixed
    L_0 = 1, zeta_1 = 1 both quantities share identical (+1/2, -1/2) log-slopes in (kappa_1, b_1).
  assumptions:
    - "Fixed reference length L_0 = 1 m and normalization factor zeta_1 = 1 with K = kappa_1, A = b_1."

# ==============================================================================
# Cross-record ModelAtlas relations with gubbala2025 (Soft Matter 21, 6243-6251)
# ==============================================================================
# Gubbala, Jena, Arnold & Takatori (2025) study passive lipid-bilayer phase
# separation coupled to nematic F-actin (2D variational anisotropic Model C, citing
# Cates & Tjhung JFM 2018 as ref-49 rather than Tjhung PRX 2018). Because neither
# paper states explicit equation-to-equation mappings to the other, all cross-
# record relations below carry provenance: proposed. Both papers share the exact
# dimensionless symmetric phi^4 Cahn-Hilliard potential, equilibrium interface width
# scale, passive +-1 binodals, and classical Lifshitz-Slyozov t^(1/3) coarsening law.

# --- 3A. Exact Dimensionless Symmetric phi^4 Cahn-Hilliard Free Energy & Chemical Potential ---

- id: rel_gubbala2025_ch_mu_same_model_b_mu
  kind: same_as
  a: gubbala2025/cahn_hilliard_free_energy_eq2
  b: tjhung2018/model_b_bulk_eq3
  mapping:
    a: "-1"
    b: "1"
    phi: "phi"
  output_map:
    mu_eq: df_dphi
  regime:
    phi: [0.1, 0.9]
    lam: [0.5, 2.0]
    grad_phi: [0.01, 1.0]
  provenance: proposed
  reason: >
    Symbolically joins Gubbala Eq. (2)'s dimensionless symmetric Cahn-Hilliard bulk chemical
    potential df_phi/dphi = phi^3 - phi (p. 2 / 6244) and Tjhung Eqs. (3)-(4)'s passive Model B
    bulk chemical potential mu_eq = a*phi + b*phi^3 at unit bulk scale a = -1, b = 1 (A = 1)
    into a verified ModelAtlas family.
  assumptions:
    - "Unit symmetric quartic free-energy scale A = -a = b = 1 (Gubbala Eq. 2 convention)."

- id: rel_gubbala2025_ch_f_derived_model_b_f
  kind: derived_from
  a: gubbala2025/cahn_hilliard_free_energy_eq2
  b: tjhung2018/model_b_bulk_eq3
  mapping:
    a: "-1"
    b: "1"
    phi: "phi"
  output_map:
    f: f_phi
  steps:
    - "subs: grad_phi = 0"
    - "simplify"
  regime:
    phi: [0.1, 1.2]
    lam: [0.5, 2.0]
    grad_phi: [0.01, 1.0]
  provenance: proposed
  reason: >
    Symbolic derivation confirming that evaluating Gubbala Eq. (2)'s full Cahn-Hilliard free-
    energy density f_phi = phi^4/4 - phi^2/2 + (lambda/2)*|grad phi|^2 in a uniform bulk state
    (grad_phi = 0) yields Tjhung Eq. (3)'s bulk free-energy density f(phi) at a = -1, b = 1
    identically.
  assumptions:
    - "Uniform bulk state grad_phi = 0 at unit symmetric bulk scale a = -1, b = 1."

- id: rel_gubbala2025_ch_f_reduces_model_b_f
  kind: reduces_to
  a: gubbala2025/cahn_hilliard_free_energy_eq2
  b: tjhung2018/model_b_bulk_eq3
  mapping:
    a: "-1"
    b: "1"
    phi: "phi"
  output_map:
    f: f_phi
  limit:
    grad_phi: "0"
  regime:
    phi: [0.1, 1.2]
    lam: [0.5, 2.0]
    grad_phi: [0.05, 1.0]
  provenance: proposed
  reason: >
    Numeric-limit counterpart to rel_gubbala2025_ch_f_derived_model_b_f: in the vanishing
    gradient limit |grad phi| -> 0, Gubbala Eq. (2)'s dimensionless f_phi converges to Tjhung
    Eq. (3)'s bulk free-energy density f(phi) at a = -1, b = 1.
  assumptions:
    - "Vanishing spatial gradient |grad phi| -> 0 at unit bulk scale A = -a = b = 1."

- id: rel_gubbala2025_pseudopotential_reduces_ch_f
  kind: reduces_to
  a: tjhung2018/pseudovariables_eqB1_B2_corrected
  b: gubbala2025/cahn_hilliard_free_energy_eq2
  mapping:
    phi: "phi"
    lam: "K"
    grad_phi: "0"
  output_map:
    f_phi: g
  limit:
    zeta: "0"
    lam: "0"
  regime:
    A: [1.0, 1.0]
    K: [0.5, 2.0]
    zeta: [0.05, 1.0]
    lam: [0.05, 0.5]
    phi: [0.2, 1.2]
  provenance: proposed
  reason: >
    Dimensionless reduction directly connecting AMB+'s nonequilibrium pseudopotential g(phi)
    (corrected Eq. B2) to Gubbala Eq. (2)'s uniform Cahn-Hilliard bulk free energy
    f_phi = phi^4/4 - phi^2/2: as active currents vanish (zeta, lambda -> 0) at Gubbala's
    bulk energy scale A = 1, g(phi) converges identically to f_phi(phi, grad_phi = 0).
  assumptions:
    - "Passive limit zeta, lambda -> 0 at unit bulk scale A = 1 and uniform state grad_phi = 0."

# --- 3B. Equilibrium Interface Width Scale, Coexistence Binodals & Coarsening Law ---

- id: rel_gubbala2025_nondim_lc_scales_eq_interface_width
  kind: scales_as
  a: gubbala2025/nondim_parameters_s32
  b: tjhung2018/equilibrium_interface_p4
  mapping:
    A: "1"
    K: "lambda_tilde"
  output_map:
    xi_eq: l_c
  regime:
    M: [0.1, 10.0]
    Gamma: [0.1, 10.0]
    lambda_tilde: [0.1, 10.0]
    alpha: [0.05, 5.0]
    L1: [0.1, 5.0]
    L3: [0.05, 2.0]
  provenance: proposed
  reason: >
    Maps Gubbala SI Sec. 3.2's bare Cahn-Hilliard nondimensionalization length scale
    l_c = sqrt(lambda_tilde) [um] (from free-energy density phi^4/4 - phi^2/2 +
    (lambda_tilde/2)*|grad_bar phi|^2) to Tjhung's equilibrium interfacial width
    xi_eq = sqrt(K/(2*A)) (p. 4) at A = 1, K = lambda_tilde, giving exact convention ratio
    l_c = sqrt(2)*xi_eq and identical +1/2 log-slope in lambda_tilde.
  assumptions:
    - "Bare actin-free Cahn-Hilliard mapping A = 1, K = lambda_tilde giving l_c = sqrt(2)*xi_eq."

- id: rel_gubbala2025_coupled_binodal_reduces_model_b_pos
  kind: reduces_to
