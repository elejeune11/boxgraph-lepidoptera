# --- 2C. Bulk Curvature Family, Eq. (30) Misprint Cross-Check & Interface Scale ---

- id: rel_frohoff2021_ostwald_eq30_corr_same_curvature
  kind: same_as
  a: tjhung2018/ostwald_beta_over_Rs_eq30_corrected
  b: frohoff2021/bulk_energy_curvature_eq3_4
  mapping:
    a: "-A * epsilon"
    a_Delta: "0"
    phi1_bar: "phi_1 * sqrt(A * epsilon)"
    phi2_bar: "0"
  output_map:
    f1_pp: beta_over_Rs
  regime:
    A: [0.2, 1.0]
    phi_1: [0.7, 1.5]
    Delta_phi: [1.5, 2.5]
    Delta_psi: [1.5, 2.5]
    epsilon: [0.05, 0.5]
  provenance: proposed
  reason: >
    Symbolically joins Tjhung's corrected small-supersaturation Ostwald expansion
    beta/R_s = f''(phi_1)*epsilon = A*(3*phi_1^2 - 1)*epsilon (Eq. 30 corrected) with Frohoff
    Eqs. (3)-(4)'s quartic bulk free-energy curvature f_1'' = a + 3*phi_bar_1^2 under the
    rescaled coordinate a = -A*epsilon, phi_bar_1 = phi_1*sqrt(A*epsilon), confirming that
    beta/(R_s*epsilon) is purely the local bulk free-energy curvature f''(phi_1).
  assumptions:
    - "Corrected Eq. (30) without the printed spurious factor 1/(Delta_phi * Delta_psi)."

- id: rel_frohoff2021_ostwald_eq30_printed_vs_curvature
  kind: same_as
  a: tjhung2018/ostwald_beta_over_Rs_eq30
