    Documented paper-misprint test: applies the exact same mapping to Tjhung's verbatim
    printed Eq. (30) (ostwald_beta_over_Rs_eq30, evaluated at passive Delta_phi = Delta_psi = 2)
    against Frohoff's bulk curvature f_1''. Intentionally not_verified with constant ratio
    a = 0.25 * b, independently exposing Eq. (30)'s printed spurious 1/(Delta_phi*Delta_psi)
    factor (tjhung2018/q_eq30_spurious_factor).
  assumptions:
    - "Evaluates printed Eq. (30) at passive jump values Delta_phi = Delta_psi = 2."

- id: rel_frohoff2021_nondim_phi_hat_scales_eq_interface
  kind: scales_as
  a: frohoff2021/nondim_scales_eqA3_A6
  b: tjhung2018/equilibrium_interface_p4
  mapping:
    A: "b1"
    K: "kappa1"
  output_map:
    xi_eq: phi1_hat
  regime:
    L: [1.0, 1.0]
    L0: [1.0, 1.0]
    Q1: [1.0, 1.0]
    Q2: [1.0, 1.0]
    kappa1: [0.5, 2.0]
    kappa2: [1.0, 1.0]
