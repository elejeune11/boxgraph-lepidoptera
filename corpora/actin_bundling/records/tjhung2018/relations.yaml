  mapping:
    a: "-1"
    b: "1"
    phi: "0"
  output_map:
    phi_b_pos: phi_Ld_eq
  limit:
    beta: "oo"
  regime:
    beta: [5.0, 50.0]
    E1: [0.1, 2.0]
    E3: [0.0, 0.5]
  provenance: proposed
  reason: >
    As Gubbala's nematic-stiffness parameter beta -> oo (decoupling the adsorbed F-actin
    nematic order parameter Q_eq ~ 1/sqrt(beta) -> 0 from lipid composition), the dense-phase
    Ld binodal phi_Ld_eq = 1 + 1/(4*beta) + O(1/beta^2) reduces identically to Tjhung Eq. (3)'s
    passive Model B dense binodal phi_b = +1 (at a = -1, b = 1).
  assumptions:
    - "Actin-decoupled limit beta -> oo in gubbala2025."

- id: rel_gubbala2025_coupled_binodal_reduces_model_b_neg
  kind: reduces_to
  a: gubbala2025/coupled_binodal_coexistence
  b: tjhung2018/model_b_bulk_eq3
  mapping:
    a: "-1"
    b: "1"
    phi: "0"
  output_map:
    phi_b_neg: phi_Lo_eq
  limit:
    beta: "oo"
  regime:
    beta: [5.0, 50.0]
    E1: [0.1, 2.0]
    E3: [0.0, 0.5]
  provenance: proposed
  reason: >
    Complement to rel_gubbala2025_coupled_binodal_reduces_model_b_pos for the dilute Lo phase:
    as nematic stiffness beta -> oo, Gubbala's isotropic Lo binodal phi_Lo_eq reduces
    identically to Tjhung Eq. (3)'s passive Model B dilute binodal phi_b = -1 (at a = -1, b = 1).
  assumptions:
    - "Actin-decoupled limit beta -> oo in gubbala2025."

- id: rel_gubbala2025_coupled_binodal_approx_curved_O1R
  kind: approximated_by
  a: gubbala2025/coupled_binodal_coexistence
  b: tjhung2018/curved_binodals_O1R_eq16_19
  mapping:
    A: "0.25"
    K: "1"
    zeta: "0"
    lam: "0"
    d: "3"
    R: "8 * sqrt(2) * beta / 3"
  output_map:
    phi_plus: phi_Ld_eq
  regime:
    beta: [1.0, 50.0]
    E1: [0.1, 2.0]
    E3: [0.0, 0.5]
  tolerance: 0.05
  provenance: proposed
  reason: >
    Compares two distinct physical perturbations of the shared symmetric phi^4 common-tangent
    construction: Gubbala's passive nematic ordering shifts the dense Ld binodal to
    phi_Ld_eq = 1 + 1/(4*beta) + O(1/beta^2), while Tjhung Eqs. (16)/(19)'s passive 3D Laplace
    pressure (zeta = lambda = 0, d = 3, A = 1/4, K = 1, sigma_eq = sqrt(2)/3) shifts the
    droplet interior binodal to phi_+(R) = 1 + 2*sqrt(2)/(3*R) + O(1/R^2). Matching the
    leading O(1/beta) shift via R = 8*sqrt(2)*beta/3 aligns both nonlinear binodal solvers
    to within max relative error 4.36e-2 down to beta = 1 (falling as O(1/beta^2) to < 2e-5
    at beta = 50).
  assumptions:
    - "Passive 3D limit (zeta = lambda = 0, d = 3, A = 0.25, K = 1) with leading-order shift matching R = 8*sqrt(2)*beta/3."

- id: rel_gubbala2025_coarsening_passive_scales_p3
  kind: scales_as
  a: gubbala2025/coarsening_power_law
  b: tjhung2018/coarsening_scaling_p3
  mapping:
    t: "t / t0"
  output_map:
    R: R_over_R0
  regime:
    t: [10.0, 10000.0]
    t0: [10.0, 100.0]
    alpha: [0.3333333333333333, 0.3333333333333333]
  provenance: proposed
  reason: >
    Both papers anchor their coarsening analyses on classical passive bulk-diffusion Lifshitz-
    Slyozov scaling R(t) ~ t^(1/3) (both citing Bray & Emmott 1995: tjhung2018 ref-43,
    gubbala2025 ref-54): Gubbala validates R(t)/R_0 = (t/t_0)^(1/3) on actin-free lipid
    bilayers (pp. 1, 5-6, Fig. 3 bottom inset) before showing passive nematic actin elasticity
    hinders growth to alpha <= 0.25, while Tjhung (p. 3) contrasts passive Model B t^(1/3)
    growth with active reverse-Ostwald arrest. At alpha = 1/3, both models share exact
    log-slopes (+1/3, -1/3) in (t, t_0).
  assumptions:
    - "Passive actin-free control limit alpha = 1/3 in gubbala2025 matching passive Model B in tjhung2018."

