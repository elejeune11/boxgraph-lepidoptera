    along the active equilibrium-binodal line combo = zeta - 2*lambda -> 0 at finite lambda
    against Frohoff Appendix C's passive binodal phi_{1,bin} = 1. Intentionally not_verified
    (error diverges from 0.98 to 1.86 instead of falling to 0), independently corroborating
    tjhung2018/q_eqB2_misprint_6zeta.
  assumptions:
    - "Tests printed Eq. (B2) along zeta - 2*lambda -> 0 at finite lambda in [0.2, 1.5]."

- id: rel_frohoff2021_variational_coex_reduces_model_b_binodal
