notes: >
  In scope: the entire analytical and numerical theory of Active Model B+ (AMB+) across Secs. I-VII and
  Appendices A-G (pp. 1-19) of Tjhung, Nardini, and Cates, Phys. Rev. X 8, 031080 (2018): passive Model B
  quartic bulk free energy, binodals, spinodals, equilibrium interfacial tension/width, and Lifshitz-Slyozov
  t^(1/3) scaling (Eqs. 1-4, pp. 3-4); flat-interface pseudodensity psi(phi), pseudopotential g(phi),
  pseudopressure P(phi), and binodals phi_1, phi_2 (Eqs. 7-11, Appendix B Eqs. B1-B2, Figs. 2 & 5a);
  curved-interface chemical potential jump Delta, pseudotension sigma, integrals S_0 and S_1, reverse-Ostwald
  criterion and mean-field phase boundary (Eqs. 12-23, Fig. 4a); perturbative O(1/R) and O(1/R^2) curved-droplet
  densities phi_+/-(R) (Appendix C Eqs. C1-C3, Fig. 3); generalization to density-dependent gradient stiffness
  K(phi) = K + 2 K_1 phi (Appendix D Eqs. D1-D6); Ostwald and reverse-Ostwald droplet growth kinetics and
  coupled two-droplet ODEs (Eqs. 24-30, Appendix E Eqs. E1-E2, Fig. 4b); 1D flat-interface, 2D mean-field
  two-droplet, verbatim 2D stochastic, and reconstructed UV-regularized 2D stochastic AMB+ PDE simulations
  (Eqs. 5-6, Appendix A Eqs. A1-A2, Figs. 1, 4, 5, 6); and explicit microscopic coarse graining of active
  Ornstein-Uhlenbeck particles (AOUPs) with quorum sensing and soft pair potential U (Sec. VI Eqs. 31-46,
  Appendix G Eqs. G1-G12). All quantities in the paper are expressed in dimensionless natural/field-theory
  units (unit damping, M = 1, dx = dy = 1); no SI units appear anywhere in the article.

  Figures inventory (left to the dedicated digitize stage):
  - Fig. 1 (p. 2): qualitative 2D simulation snapshots of bubbly phase separation (a: zeta=4, lambda=1, phi_0=-0.4)
    and arrested cluster phase (b: zeta=-4, lambda=-1, phi_0=-0.6); no quantitative curve axes.
  - Fig. 2 (p. 6): quantitative flat-interface binodals phi_1, phi_2 and spinodals vs (zeta - 2*lambda) in [-6, 6]
    at K=1, D=0.
  - Fig. 3 (p. 6): quantitative curved-interface outer density phi_-(R) (a) and inner density phi_+(R) (b) vs
    droplet radius R in [0, 40] for Region A (zeta=-1, lambda=0.5, red) and Region B (zeta=-4, lambda=-1, blue),
    comparing Appendix C theory lines and mean-field PDE simulation markers.
  - Fig. 4 (p. 8): (a) quantitative mean-field phase diagram in (zeta, lambda) in [-4, 4] x [-2, 2] showing
    analytical sigma = 0 boundaries separating Region A from Regions B and C alongside two-droplet simulation
    markers; (b) quantitative two-droplet radius trajectories R_1(t), R_2(t) vs log t in [100, 100000] comparing
    Appendix E ODE dashed lines and D=0 PDE solid lines.
  - Fig. 5 (p. 10): (a) qualitative 2D snapshots vs global density phi_0 (with printed exact binodal axis labels
    phi_1 = -1.096 and phi_2 = 0.864, recorded directly in data.yaml); (b) quantitative bubble-radius probability
    distributions P(R) vs R in [1, 10] at t = 512, 4096, 32768, 131072; (c) quantitative mean bubble radius R_bar
    and bubble number density n_bar vs noise strength D in [0, 1].
  - Fig. 6 (p. 16): qualitative 2D vector-field current snapshot J(x, y) in x in [0, 120], y in [0, 60] at t=1000
    showing flow from small to big droplet (top, zeta=-0.8, lambda=-0.4) vs big to small (bottom, zeta=-1.6,
    lambda=-0.8).

  Key algebraic, consistency, and numerical findings (all preserved verbatim in printed models, accompanied by
  variant_of corrected models and open questions in questions.yaml):
  1. Appendix B Eq. (B2) (p. 14) prints "- 6*zeta*K^2*phi" instead of "- 6*(zeta - 2*lambda)*K^2*phi". As printed,
     Eq. (B2) violates dg/dpsi = df/dphi (Eq. 9), breaks (zeta - 2*lambda) invariance, diverges along zeta = 2*lambda != 0,
     and fails to reproduce the Fig. 5(a) binodals (-1.096, 0.864) (giving (-1.122, 0.325) at zeta=1, lambda=-0.5 and
     (-0.778, -0.350) at zeta=4, lambda=1). Both the corrected variant (binodals_flat_eqB2_corrected), direct
     integration of Eq. (9) (binodals_flat_eq9), and the 1D AMB+ PDE (amb_plus_1d_flat_pde) reproduce -1.096 and 0.864
     to all printed digits (-1.0956, 0.8637).
  2. Sec. IV Eq. (30) (p. 9) prints beta / R_s = [f''(phi_1)/(Delta_phi * Delta_psi)] * epsilon, introducing a
     spurious factor 1/(Delta_phi * Delta_psi) compared to exact Taylor expansion of Eq. (28) (beta / R_s = f''(phi_1) * epsilon;
     off by a factor of 4 even in the passive limit where Delta_phi = Delta_psi = 2).
  3. Appendix C (p. 15) has opposite O(1/R) signs in Eq. (C2) (as if phi' = +sqrt(w) instead of -sqrt(w) for a dense
     droplet), reversed integration limits int_{phi_+}^{phi_-} in the inline S_0, S_1 definitions (giving negative
     values), and lower limit 1 instead of phi_- in Eq. (C3). The corrected variant (curved_binodals_appC_corrected)
     restores w(phi_+) = 0 consistency with Eq. (19) and matches Fig. 3(a)-(b).
  4. Sec. VI Eq. (34) (p. 12) prints the Ito spurious drift with a minus sign (-tau*v*grad_i v instead of +tau*v*grad_i v),
     which implies a prefactor of 3/2 rather than the 1/2 printed in Eq. (39) for log(tau*v^2 + T).
  5. Appendix G Eqs. (G2), (G4)-(G6) (p. 17) omit an overall factor of tau when differentiating (1/2) log(tau*v^2 + T)
     in Eq. (39) (breaking dimensional consistency by 1/time), and Eq. (G4) additionally includes an extraneous factor
     of 1/2 in the denominator of K^qs. By contrast, Eqs. (44) and (G11)-(G12) for the pair potential U are exact.
  6. Fig. 6 caption and Appendix F (p. 16) state that Fig. 6 shows "the two droplet simulations shown in Fig. 4(b)",
     but use completely different activity parameters ((-0.8, -0.4) and (-1.6, -0.8) instead of (-1, 0.5) and (-4, -1))
     and different droplet radii.
  7. Appendix A Eqs. (A1)-(A2) verbatim (explicit Ito Euler, 8th-order central difference applied twice, dt=0.001,
     dx=dy=1, A=0.25, K=1) is stable in the passive limit and Region A (zeta=1, lambda=-0.5, D=0.2), but blows up in
     finite time (t ~ 0.22) in Region C (zeta=4, lambda=1, D=0.2) — persisting at dt=0.0002, D=0.05, in 1D, and under
     other unregularized discretizations — due to the Nyquist null mode of Eq. (A2), discrete product-rule violation,
     and O(k^4 phi^2) UV instability of the active current when |zeta * delta_phi| >= K. Stabilizing high wavenumbers
     with a spectral UV cutoff k_cut = 1.0 (reconstructed model amb_plus_2d_stochastic_uv_pde) recovers the arrested
     homogeneous bubble phase of Fig. 5.
