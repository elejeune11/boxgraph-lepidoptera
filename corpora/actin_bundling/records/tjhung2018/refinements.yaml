# ==============================================================================
# Numerical convergence refinements for quadrature, root-finding, ODE, and PDE runs
# ==============================================================================
- id: ref_binodals_eq9_nquad
  run: run_binodals_eq9_fig5C
  setting: n_quad
  factors: [1, 2, 4]
  mode: multiply
  output: phi_1
  tolerance: "0.01%"
  tolerance_basis: "added: tight Gauss-Legendre quadrature convergence check on flat-interface binodal phi_1 (well below 3-decimal Fig. 5a precision)"
  tolerance_added: true

- id: ref_pseudotension_eq20_nquad
  run: run_pseudotension_fig3B
  setting: n_quad
  factors: [1, 2, 4]
  mode: multiply
  output: sigma
  tolerance: "0.01%"
  tolerance_basis: "added: tight quadrature convergence check on active pseudotension sigma in Region B"
  tolerance_added: true

- id: ref_phase_boundary_nquad
  run: run_phase_boundary_zneg2
  setting: n_quad
  factors: [1, 2, 4]
  mode: multiply
  output: lam_star
  tolerance: "0.01%"
  tolerance_basis: "added: tight quadrature convergence check on mean-field phase boundary lambda*(zeta)"
  tolerance_added: true

- id: ref_curved_appC_corr_ngrid
  run: run_curved_appC_corr_fig3B
  setting: n_grid
  factors: [1, 2, 4]
  mode: multiply
  output: phi_plus
  tolerance: "0.1%"
  tolerance_basis: "added: grid convergence check on O(1/R^2) perturbative Appendix C quadrature for phi_+(R=15)"
  tolerance_added: true

- id: ref_pseudotension_K1_nquad
  run: run_pseudotension_K1_fig3B
  setting: n_quad
  factors: [1, 2, 4]
  mode: multiply
  output: sigma_K1
  tolerance: "0.01%"
  tolerance_basis: "added: tight quadrature convergence check on generalized pseudotension sigma_{K_1} (Appendix D Eq. D4)"
  tolerance_added: true

- id: ref_two_droplet_ode_rtol
  run: run_two_droplet_ode_fig4b_B
  setting: rtol
  factors: [1, 10, 100]
  mode: divide
  output: R2_final
  tolerance: "0.05%"
  tolerance_basis: "added: RK45 ODE tolerance convergence check on Appendix E two-droplet radius evolution"
  tolerance_added: true

- id: ref_cg_pair_moments_nquad
  run: run_cg_pair_moments_2d
  setting: n_quad
  factors: [1, 2, 4]
  mode: multiply
  output: B
  tolerance: "0.01%"
  tolerance_basis: "added: Gauss-Legendre quadrature convergence check on pair-potential moment B (Eq. 45)"
  tolerance_added: true

- id: ref_1d_flat_pde_dt
  run: run_1d_flat_pde_fig5C
  setting: dt
  factors: [1, 2, 4]
  mode: divide
  output: phi_1
  tolerance: "0.05%"
  tolerance_basis: "added: time-step refinement of IMEX 1D AMB+ PDE confirming convergence well below 3-decimal Fig. 5(a) precision"
  tolerance_added: true

- id: ref_2d_two_droplet_pde_dt
  run: run_2d_two_droplet_pde_fig6A
  setting: dt
  factors: [1, 2]
  mode: divide
  output: J_mag_vapor
  tolerance: "1%"
  tolerance_basis: "added: time-step refinement of 2D two-droplet AMB+ PDE confirming converged vapor current magnitude and Ostwald regime"
  tolerance_added: true

- id: ref_2d_stochastic_verbatim_dt
  run: run_2d_stochastic_verbatim_fig5A
  setting: dt
  factors: [1, 2]
  mode: divide
  output: phi_max
  tolerance: "15%"
  tolerance_basis: "added: stochastic Ito Euler step-size check on finite-sample ensemble extreme phi_max in Region A (3 replicates)"
  tolerance_added: true

- id: ref_2d_stochastic_uv_dt
  run: run_2d_stochastic_uv_fig5C
  setting: dt
  factors: [1, 2]
  mode: divide
  output: R_bar
  tolerance: "15%"
  tolerance_basis: "added: time-step refinement check on reconstructed UV-regularized stochastic bubble-phase mean radius R_bar (3 replicates)"
  tolerance_added: true
