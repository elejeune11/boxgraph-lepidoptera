id: phase_boundary_eq23
name: Mean-field reverse-Ostwald phase boundary lambda*(zeta) where sigma = 0 (Eq. 23, Fig. 4a)
role: model
stated:
  page: 7
  printed_page: "031080-7"
  quote: "The phase diagram is thereby divided into three regions"
  where: "Sec. III Eq. 23 and Fig. 4(a) (p. 8)"
equation: "sigma(A, K, zeta, lambda*) = 0 for dense droplets (zeta < 0, Region A/B boundary); by duality lambda*_bubble(zeta) = -lambda*(-zeta) for Region A/C"
built_from: [pseudotension_flat_eq20]
inputs:
  A: {quantity: bulk_free_energy_scale, unit: dimensionless}
  K: {quantity: gradient_coefficient, unit: dimensionless}
  zeta: {quantity: active_rotational_parameter_zeta, unit: dimensionless}
outputs:
  lam_star: {quantity: active_gradient_parameter_lambda, unit: dimensionless}
settings:
  n_quad: 128
  xtol: 1.0e-10
stochastic: false
