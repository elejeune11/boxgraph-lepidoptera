id: cg_pair_moments_eq45_46
name: Pair-potential gradient expansion moments B and C (Eqs. 45-46) for Gaussian soft potential
role: model
stated:
  page: 12
  printed_page: "031080-12"
  quote: "Finally, the constants B and C only depend on the two-body potential"
  where: "Sec. VI Eqs. 45-46 (evaluated on test potential U(y) = U_0 exp(-y^2 / (2 ell^2)))"
equation: "B = -(Omega / (2*d*(d+2))) * int_0^inf y^(d+2) U'(y) dy; C = -(Omega / d) * int_0^inf y^d U'(y) dy"
inputs:
  d: {quantity: spatial_dimension, unit: dimensionless}
  U_0: {quantity: pair_potential_strength, unit: dimensionless}
  ell: {quantity: pair_potential_range, unit: dimensionless}
outputs:
  B: {quantity: pair_potential_second_moment, unit: dimensionless}
  C: {quantity: pair_potential_zeroth_moment, unit: dimensionless}
settings:
  n_quad: 64
stochastic: false
