id: binodals_flat_combo_eqB2_corrected
name: Flat-interface binodals from corrected Eq. (B2) parameterized by (zeta - 2*lambda) and lambda (Fig. 2)
role: model
variant_of: binodals_flat_combo_eqB2
corrections:
  - equation: "Eq. (B2)"
    change: "Replace printed -6*zeta*K^2*phi inside the brackets of g(phi) with -6*(zeta - 2*lambda)*K^2*phi"
    evidence: "Exact integration of Eq. (9) uniquely yields -6*(zeta - 2*lambda)*K^2*phi, restoring the Fig. 2 invariance under (zeta - 2*lambda) and reproducing both digitized Fig. 2 binodal curves across [-5.8, 5.8] at nonzero lambda."
stated:
  page: 14
  printed_page: "031080-14"
  quote: "It is useful to notice that the explicit solution to"
  where: "Appendix B Eq. B2 (corrected) evaluated along Fig. 2 axis (zeta - 2*lambda)"
equation: "Corrected Eq. (B2) with -6*(zeta - 2*lambda)*K^2*phi: depends strictly on (zeta - 2*lambda)"
built_from: [binodals_flat_eqB2_corrected]
inputs:
  A: {quantity: bulk_free_energy_scale, unit: dimensionless}
  K: {quantity: gradient_coefficient, unit: dimensionless}
  combo: {quantity: activity_combination, unit: dimensionless}
  lam: {quantity: active_gradient_parameter_lambda, unit: dimensionless}
outputs:
  phi_1: {quantity: order_parameter, unit: dimensionless}
  phi_2: {quantity: order_parameter, unit: dimensionless}
settings:
  xtol: 1.0e-12
stochastic: false
