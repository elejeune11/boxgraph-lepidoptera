id: two_droplet_ode_eqE1_E2
name: Coupled two-droplet Ostwald/reverse-Ostwald ODE evolution (Appendix E Eqs. E1-E2, Fig. 4b)
role: model
stated:
  page: 16
  printed_page: "031080-16"
  quote: "we can solve Eqs. (E1) and (E2) simultaneously to obtain"
  where: "Appendix E Eqs. E1-E2 and Fig. 4(b)"
equation: "Delta_phi(R_1) * dR_1/dt = (f'(phi_-(R_2)) - f'(phi_-(R_1))) / R_1; Delta_phi(R_2) * dR_2/dt = (f'(phi_-(R_1)) - f'(phi_-(R_2))) / R_2"
built_from: [curved_binodals_appC_corrected]
inputs:
  A: {quantity: bulk_free_energy_scale, unit: dimensionless}
  K: {quantity: gradient_coefficient, unit: dimensionless}
  zeta: {quantity: active_rotational_parameter_zeta, unit: dimensionless}
  lam: {quantity: active_gradient_parameter_lambda, unit: dimensionless}
  d: {quantity: spatial_dimension, unit: dimensionless}
  R1_0: {quantity: droplet_radius, unit: dimensionless}
  R2_0: {quantity: droplet_radius, unit: dimensionless}
  t_end: {quantity: time, unit: dimensionless}
outputs:
  R1_final: {quantity: droplet_radius, unit: dimensionless}
  R2_final: {quantity: droplet_radius, unit: dimensionless}
  dR1: {quantity: radius_change, unit: dimensionless}
  dR2: {quantity: radius_change, unit: dimensionless}
  ostwald_sign: {quantity: ostwald_sign_indicator, unit: dimensionless}
settings:
  n_R_table: 40
  rtol: 1.0e-6
  atol: 1.0e-8
stochastic: false
