id: cg_aoup_mobility_mu_eq36_39
name: Coarse-grained AOUP mobility M[rho] and quorum-sensing chemical potential mu_qs (Eqs. 36, 39)
role: model
stated:
  page: 12
  printed_page: "031080-12"
  quote: "The force density due to quorum sensing"
  where: "Sec. VI Eqs. 36 and 39"
equation: "M[rho] = rho * (tau * v^2 + T); mu_qs = log(rho) + (1/2) * log(tau * v^2 + T)"
inputs:
  rho: {quantity: particle_density, unit: dimensionless}
  tau: {quantity: persistence_time, unit: dimensionless}
  v: {quantity: swim_speed, unit: dimensionless}
  T: {quantity: thermal_diffusivity, unit: dimensionless}
outputs:
  M_cg: {quantity: cg_mobility, unit: dimensionless}
  mu_qs: {quantity: cg_chemical_potential, unit: dimensionless}
settings: {}
stochastic: false
