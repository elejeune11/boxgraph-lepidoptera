id: amb_plus_2d_two_droplet_pde
name: 2D mean-field (D=0) Active Model B+ two-droplet PDE simulation (Eqs. 5-6, Appendix A Eqs. A1-A2, Figs. 4 & 6)
role: model
stated:
  page: 14
  printed_page: "031080-14"
  quote: "The dynamics of Active Model B+ is given by Eqs. (5) and (6)."
  where: "Sec. II Eqs. 5-6, Sec. IV p. 9, Appendix A Eqs. A1-A2, Figs. 4(b) & 6"
equation: "d_t phi = -div J; J = -grad[f'(phi) - K lap phi + lambda |grad phi|^2] + zeta (lap phi) grad phi with 8th-order central difference Eq. (A2) on periodic L x L lattice"
inputs:
  A: {quantity: bulk_free_energy_scale, unit: dimensionless}
  K: {quantity: gradient_coefficient, unit: dimensionless}
  zeta: {quantity: active_rotational_parameter_zeta, unit: dimensionless}
  lam: {quantity: active_gradient_parameter_lambda, unit: dimensionless}
  R1_0: {quantity: droplet_radius, unit: dimensionless}
  R2_0: {quantity: droplet_radius, unit: dimensionless}
outputs:
  dR1: {quantity: radius_change, unit: dimensionless}
  dR2: {quantity: radius_change, unit: dimensionless}
  Jx_mid: {quantity: current_magnitude, unit: dimensionless}
  J_mag_vapor: {quantity: current_magnitude, unit: dimensionless}
  ostwald_sign: {quantity: ostwald_sign_indicator, unit: dimensionless}
settings:
  L: 64
  dx: 1.0
  dt: 0.05
  t_relax: 150.0
  t_end: 500.0
stochastic: false
