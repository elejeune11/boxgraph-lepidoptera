id: ostwald_beta_over_Rs_eq30_corrected
name: Small-supersaturation expansion of beta / R_s corrected from Eq. (28)
role: model
variant_of: ostwald_beta_over_Rs_eq30
corrections:
  - equation: "Eq. (30)"
    change: "Remove spurious factor 1/(Delta_phi * Delta_psi), giving beta / R_s = f''(phi_1) * epsilon + O(epsilon^2)"
    evidence: "From Eq. (28), beta / R_s = (f'(phi_1 + epsilon) * Delta_psi - Delta_g) / Delta_psi = f'(phi_1 + epsilon) - Delta_g / Delta_psi = f'(phi_1 + epsilon) - f'(phi_1) = f''(phi_1) * epsilon + O(epsilon^2), using Eqs. (8) and (10) (Delta_g / Delta_psi = mu_bar = f'(phi_1)). In the passive limit (Delta_phi = Delta_psi = 2), printed Eq. (30) underpredicts beta / R_s from Eq. (28) by a factor of 4."
stated:
  page: 9
  printed_page: "031080-9"
  quote: "also negative. To determine the sign of Rs , we Taylor"
  where: "Sec. IV Eq. 30 (corrected from Eq. 28)"
equation: "beta / R_s = f''(phi_1) * epsilon"
inputs:
  A: {quantity: bulk_free_energy_scale, unit: dimensionless}
  phi_1: {quantity: order_parameter, unit: dimensionless}
  Delta_phi: {quantity: order_parameter_difference, unit: dimensionless}
  Delta_psi: {quantity: pseudodensity_difference, unit: dimensionless}
  epsilon: {quantity: supersaturation, unit: dimensionless}
outputs:
  beta_over_Rs: {quantity: ostwald_rate_over_Rs, unit: dimensionless}
settings: {}
stochastic: false
