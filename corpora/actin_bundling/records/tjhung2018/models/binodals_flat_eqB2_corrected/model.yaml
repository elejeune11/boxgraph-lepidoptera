id: binodals_flat_eqB2_corrected
name: Flat-interface binodals from Eqs. (8), (10), (B1), and corrected Eq. (B2)
role: model
variant_of: binodals_flat_eqB2
corrections:
  - equation: "Eq. (B2)"
    change: "Replace -6*zeta*K^2*phi inside Eq. (B2) with -6*(zeta - 2*lambda)*K^2*phi"
    evidence: "Exact integration of Eq. (9) gives -6*(zeta - 2*lambda)*K^2*phi; with this correction, both (zeta=1, lambda=-0.5) and (zeta=4, lambda=1) yield identical binodals phi_1 = -1.0956 and phi_2 = 0.8637 matching Fig. 5(a) (-1.096, 0.864) and p. 10 text (≃ -1.10, ≃ 0.86)."
stated:
  page: 14
  printed_page: "031080-14"
  quote: "Then, finding the binodals amounts to finding those"
  where: "Sec. III Eqs. 8, 10, 11 and Appendix B Eqs. B1-B2 (corrected)"
equation: "f'(phi_1) = f'(phi_2) = mu_bar; psi(phi_1)*mu_bar - g_B2_corr(phi_1) = psi(phi_2)*mu_bar - g_B2_corr(phi_2)"
built_from: [pseudovariables_eqB1_B2_corrected]
inputs:
  A: {quantity: bulk_free_energy_scale, unit: dimensionless}
  K: {quantity: gradient_coefficient, unit: dimensionless}
  zeta: {quantity: active_rotational_parameter_zeta, unit: dimensionless}
  lam: {quantity: active_gradient_parameter_lambda, unit: dimensionless}
outputs:
  phi_1: {quantity: order_parameter, unit: dimensionless}
  phi_2: {quantity: order_parameter, unit: dimensionless}
  mu_bar: {quantity: chemical_potential, unit: dimensionless}
settings:
  xtol: 1.0e-12
stochastic: false
