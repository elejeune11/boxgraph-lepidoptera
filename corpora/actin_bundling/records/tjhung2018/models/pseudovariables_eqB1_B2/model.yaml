id: pseudovariables_eqB1_B2
name: Pseudodensity psi(phi), printed pseudopotential g(phi), and pseudopressure P(phi) (Eqs. 11, B1, B2 as printed)
role: model
stated:
  page: 14
  printed_page: "031080-14"
  quote: "It is useful to notice that the explicit solution to"
  where: "Appendix B Eqs. B1-B2 and Eq. 11"
equation: "psi(phi) = (K/(zeta-2*lambda))*(exp(((zeta-2*lambda)/K)*phi) - 1); g(phi) = 6*A*K^4/(zeta-2*lambda)^4 - A*K^2/(zeta-2*lambda)^2 - (A*K*exp(((zeta-2*lambda)/K)*phi)/(zeta-2*lambda)^4)*[-(zeta-2*lambda)^3*phi*(phi^2-1) + 6*K^3 - 6*zeta*K^2*phi + (zeta-2*lambda)^2*K*(3*phi^2-1)]; P(phi) = psi(phi)*f'(phi) - g(phi)"
inputs:
  A: {quantity: bulk_free_energy_scale, unit: dimensionless}
  K: {quantity: gradient_coefficient, unit: dimensionless}
  zeta: {quantity: active_rotational_parameter_zeta, unit: dimensionless}
  lam: {quantity: active_gradient_parameter_lambda, unit: dimensionless}
  phi: {quantity: order_parameter, unit: dimensionless}
outputs:
  psi: {quantity: pseudodensity, unit: dimensionless}
  g: {quantity: pseudopotential, unit: dimensionless}
  P: {quantity: pseudopressure, unit: dimensionless}
settings: {}
stochastic: false
