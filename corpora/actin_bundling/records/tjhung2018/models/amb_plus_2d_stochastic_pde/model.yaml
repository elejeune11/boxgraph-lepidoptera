id: amb_plus_2d_stochastic_pde
name: 2D stochastic Active Model B+ PDE verbatim from Appendix A (Eqs. 5-6, A1-A2)
role: model
stated:
  page: 14
  printed_page: "031080-14"
  quote: "The dynamics of the field"
  where: "Appendix A Eqs. A1-A2 (verbatim explicit Ito Euler + 8th-order FD)"
equation: "phi_{ij}^{n+1} = phi_{ij}^n - dt * div(J_{ij}^n) - sqrt(2*D*dt/(dx*dy)) * div(Gamma_{ij}^n) with 8th-order central difference Eq. (A2) applied twice for second derivatives"
inputs:
  A: {quantity: bulk_free_energy_scale, unit: dimensionless}
  K: {quantity: gradient_coefficient, unit: dimensionless}
  zeta: {quantity: active_rotational_parameter_zeta, unit: dimensionless}
  lam: {quantity: active_gradient_parameter_lambda, unit: dimensionless}
  D: {quantity: noise_strength, unit: dimensionless}
  phi_0: {quantity: order_parameter, unit: dimensionless}
outputs:
  phi_min: {quantity: order_parameter, unit: dimensionless}
  phi_max: {quantity: order_parameter, unit: dimensionless}
  R_bar: {quantity: droplet_radius, unit: dimensionless}
  n_bar: {quantity: bubble_number_density, unit: dimensionless}
settings:
  L: 32
  dx: 1.0
  dt: 0.001
  t_end: 2.0
  seed: 0
stochastic: true
