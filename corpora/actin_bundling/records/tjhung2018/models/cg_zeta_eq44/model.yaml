id: cg_zeta_eq44
name: Coarse-grained rotational activity parameter zeta_cg from microscopic AOUP model (Eq. 44)
role: model
stated:
  page: 12
  printed_page: "031080-12"
  quote: "where the explicitly derived"
  where: "Sec. VI Eq. 44"
equation: "zeta_cg = (2 * tau * v_0 / (T + tau * v_0^2)^2) * (gamma_0 * C - v_1 * B)"
inputs:
  tau: {quantity: persistence_time, unit: dimensionless}
  T: {quantity: thermal_diffusivity, unit: dimensionless}
  v_0: {quantity: swim_speed, unit: dimensionless}
  v_1: {quantity: swim_speed_density_slope, unit: dimensionless}
  gamma_0: {quantity: swim_speed_laplacian_coeff, unit: dimensionless}
  B: {quantity: pair_potential_second_moment, unit: dimensionless}
  C: {quantity: pair_potential_zeroth_moment, unit: dimensionless}
outputs:
  zeta_cg: {quantity: cg_active_zeta, unit: dimensionless}
settings: {}
stochastic: false
