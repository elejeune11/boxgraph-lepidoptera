id: amb_plus_1d_flat_pde
name: 1D deterministic Active Model B+ PDE for flat-interface binodals (Eqs. 5-7, Appendix A Eq. A2)
role: model
stated:
  page: 14
  printed_page: "031080-14"
  quote: "The dynamics of Active Model B+ is given by Eqs. (5) and (6)."
  where: "Sec. II Eqs. 5-6, Sec. III Eq. 7, Appendix A Eqs. A1-A2 (1D flat interface, D = 0)"
equation: "d_t phi = -d_x J; J = -d_x [f'(phi) - K d_x^2 phi + lambda (d_x phi)^2] + zeta (d_x^2 phi)(d_x phi) with 8th-order spatial difference Eq. (A2)"
inputs:
  A: {quantity: bulk_free_energy_scale, unit: dimensionless}
  K: {quantity: gradient_coefficient, unit: dimensionless}
  zeta: {quantity: active_rotational_parameter_zeta, unit: dimensionless}
  lam: {quantity: active_gradient_parameter_lambda, unit: dimensionless}
outputs:
  phi_1: {quantity: order_parameter, unit: dimensionless}
  phi_2: {quantity: order_parameter, unit: dimensionless}
settings:
  L: 64
  dx: 1.0
  dt: 0.25
  t_end: 2000.0
stochastic: false
