id: two_droplet_ode_2d_log_screened
name: Reconstructed 2D logarithmically screened two-droplet Ostwald ODE (Sec. IV, Appendix E, Fig. 4b)
role: model
reconstructed: "Appendix E prints 3D-flux Eqs. (E1)-(E2) and notes qualitatively that 'in d = 2, there is a logarithmic correction' (pp. 8, 16) without stating the explicit 2D ODE or screening length ell. Solving 2D quasistatic diffusion with outer cutoff ell divides dR_i/dt in Eqs. (E1)-(E2) by ln(ell/R_i), which simultaneously accounts for the ~1.7x slowdown, the Region A R_1 overshoot above 19.1, and the Region B R_eq undershoot below 13.5 in the dashed theory curves of Fig. 4(b)."
stated:
  page: 16
  printed_page: "031080-16"
  quote: "there is a logarithmic correction, but this does not change"
  where: "Appendix E Eqs. E1-E2 (p. 16) and Fig. 4(b) (p. 8)"
equation: "Delta_phi(R_1) * dR_1/dt = [f'(phi_-(R_2)) - f'(phi_-(R_1))] / [R_1 * ln(ell / R_1)]; Delta_phi(R_2) * dR_2/dt = [f'(phi_-(R_1)) - f'(phi_-(R_2))] / [R_2 * ln(ell / R_2)]"
built_from: [two_droplet_ode_eqE1_E2, curved_binodals_appC_corrected]
inputs:
  A: {quantity: bulk_free_energy_scale, unit: dimensionless}
  K: {quantity: gradient_coefficient, unit: dimensionless}
  zeta: {quantity: active_rotational_parameter_zeta, unit: dimensionless}
  lam: {quantity: active_gradient_parameter_lambda, unit: dimensionless}
  d: {quantity: spatial_dimension, unit: dimensionless}
  R1_0: {quantity: droplet_radius, unit: dimensionless}
  R2_0: {quantity: droplet_radius, unit: dimensionless}
  ell: {quantity: domain_size, unit: dimensionless}
  t_end: {quantity: time, unit: dimensionless}
outputs:
  R1_final: {quantity: droplet_radius, unit: dimensionless}
  R2_final: {quantity: droplet_radius, unit: dimensionless}
  ostwald_sign: {quantity: ostwald_sign_indicator, unit: dimensionless}
settings:
  n_R_table: 50
  rtol: 1.0e-6
  atol: 1.0e-8
stochastic: false
