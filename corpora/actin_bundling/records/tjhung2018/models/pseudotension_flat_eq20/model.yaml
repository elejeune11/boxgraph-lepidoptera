id: pseudotension_flat_eq20
name: Flat-interface pseudotension sigma, integrals S_0 and S_1, and reverse-Ostwald criterion (Eqs. 20-23)
role: model
stated:
  page: 7
  printed_page: "031080-7"
  quote: "where σ is a pseudotension defined by"
  where: "Sec. III Eqs. 20-23"
equation: "sigma = (K/(zeta - 2*lambda)) * [zeta*S_0 - 2*lambda*S_1]; S_0 = exp[(zeta-2*lambda)*phi_2/K] int phi'^2 dy; S_1 = int phi'^2 exp[(zeta-2*lambda)*phi/K] dy; reverse Ostwald iff |zeta - 2*lambda| < -zeta*|1 - S_0/S_1|"
built_from: [binodals_flat_eq9]
inputs:
  A: {quantity: bulk_free_energy_scale, unit: dimensionless}
  K: {quantity: gradient_coefficient, unit: dimensionless}
  zeta: {quantity: active_rotational_parameter_zeta, unit: dimensionless}
  lam: {quantity: active_gradient_parameter_lambda, unit: dimensionless}
outputs:
  S_0: {quantity: interface_integral_S0, unit: dimensionless}
  S_1: {quantity: interface_integral_S1, unit: dimensionless}
  sigma: {quantity: interfacial_tension, unit: dimensionless}
  sigma_bubble: {quantity: interfacial_tension, unit: dimensionless}
  reverse_margin: {quantity: ostwald_criterion_margin, unit: dimensionless}
  ostwald_sign_droplet: {quantity: ostwald_sign_indicator, unit: dimensionless}
  ostwald_sign_bubble: {quantity: ostwald_sign_indicator, unit: dimensionless}
settings:
  n_quad: 128
  xtol: 1.0e-12
stochastic: false
