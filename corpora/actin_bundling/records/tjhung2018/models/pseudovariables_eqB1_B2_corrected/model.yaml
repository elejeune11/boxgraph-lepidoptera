id: pseudovariables_eqB1_B2_corrected
name: Pseudodensity psi(phi) and corrected pseudopotential g(phi) (Eqs. 9, 11, B1, corrected B2)
role: model
variant_of: pseudovariables_eqB1_B2
corrections:
  - equation: "Eq. (B2)"
    change: "Replace -6*zeta*K^2*phi inside the brackets of Eq. (B2) with -6*(zeta - 2*lambda)*K^2*phi"
    evidence: "Exact integration of Eq. (9), dg/dphi = f'(phi) exp[(zeta-2*lambda)phi/K], yields -6*(zeta-2*lambda)*K^2*phi; printed Eq. (B2) violates dg/dpsi = df/dphi, violates the stated dependence only on (zeta-2*lambda) (Sec. III p. 5, Fig. 2), diverges as zeta-2*lambda -> 0 for lambda != 0, and fails to reproduce Fig. 5(a) binodals (-1.096, 0.864)."
stated:
  page: 14
  printed_page: "031080-14"
  quote: "It is useful to notice that the explicit solution to"
  where: "Appendix B Eqs. B1-B2 (corrected from Eq. 9)"
equation: "psi(phi) = (K/(zeta-2*lambda))*(exp(((zeta-2*lambda)/K)*phi) - 1); g(phi) = 6*A*K^4/(zeta-2*lambda)^4 - A*K^2/(zeta-2*lambda)^2 - (A*K*exp(((zeta-2*lambda)/K)*phi)/(zeta-2*lambda)^4)*[-(zeta-2*lambda)^3*phi*(phi^2-1) + 6*K^3 - 6*(zeta-2*lambda)*K^2*phi + (zeta-2*lambda)^2*K*(3*phi^2-1)]; P(phi) = psi(phi)*f'(phi) - g(phi)"
inputs:
  A: {quantity: bulk_free_energy_scale, unit: dimensionless}
  K: {quantity: gradient_coefficient, unit: dimensionless}
  zeta: {quantity: active_rotational_parameter_zeta, unit: dimensionless}
  lam: {quantity: active_gradient_parameter_lambda, unit: dimensionless}
  phi: {quantity: order_parameter, unit: dimensionless}
outputs:
  psi: {quantity: pseudodensity, unit: dimensionless}
  g: {quantity: pseudopotential, unit: dimensionless}
  P: {quantity: pseudopressure, unit: dimensionless}
settings: {}
stochastic: false
