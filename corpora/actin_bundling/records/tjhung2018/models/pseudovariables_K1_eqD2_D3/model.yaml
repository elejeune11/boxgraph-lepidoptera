id: pseudovariables_K1_eqD2_D3
name: Generalized pseudodensity psi_{K_1}(phi) and weight psi_bar(phi) for K_1 != 0 (Appendix D Eqs. D2-D3)
role: model
stated:
  page: 15
  printed_page: "031080-15"
  quote: "This goes similarly to the one presented in Sec. III except"
  where: "Appendix D Eqs. D2-D3"
equation: "nu = lambda - K_1 - zeta/2; psi_bar(phi) = (1 + 2*K_1*phi/K)^(-nu/K_1); psi_{K_1}(phi) = -(K/(2*nu))*(psi_bar(phi) - 1)"
inputs:
  K: {quantity: gradient_coefficient, unit: dimensionless}
  K_1: {quantity: gradient_coupling_K1, unit: dimensionless}
  zeta: {quantity: active_rotational_parameter_zeta, unit: dimensionless}
  lam: {quantity: active_gradient_parameter_lambda, unit: dimensionless}
  phi: {quantity: order_parameter, unit: dimensionless}
outputs:
  nu: {quantity: effective_active_gradient_nu, unit: dimensionless}
  psi_bar: {quantity: dimensionless_weight_psi_bar, unit: dimensionless}
  psi_K1: {quantity: pseudodensity, unit: dimensionless}
settings: {}
stochastic: false
