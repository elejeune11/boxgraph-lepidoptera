id: chemical_potential_droplet_eq24
name: Leading-order interfacial chemical potential mu_I(R) of a spherical droplet (Eq. 24)
role: model
stated:
  page: 8
  printed_page: "031080-8"
  quote: "chemical potential at the interface of the droplet is"
  where: "Sec. IV Eq. 24"
equation: "mu_I(R) = Delta_g / Delta_psi + (d - 1) * sigma / (Delta_psi * R)"
inputs:
  Delta_g: {quantity: pseudopotential_difference, unit: dimensionless}
  Delta_psi: {quantity: pseudodensity_difference, unit: dimensionless}
  sigma: {quantity: interfacial_tension, unit: dimensionless}
  d: {quantity: spatial_dimension, unit: dimensionless}
  R: {quantity: droplet_radius, unit: dimensionless}
outputs:
  mu_I: {quantity: chemical_potential, unit: dimensionless}
settings: {}
stochastic: false
