id: cg_aoup_ito_prefactor_eq34
name: Prefactor of log(tau*v^2 + T) in mu_qs implied by printed Ito SDE Eq. (34)
role: model
stated:
  page: 12
  printed_page: "031080-12"
  quote: "We then write the Dean equation"
  where: "Sec. VI Eq. 34 (printed -tau*v*grad_i v)"
equation: "From Ito SDE r_dot = v*sqrt(2*tau)*eta - tau*v*grad(v) - sum grad U + sqrt(2*T)*xi, Fokker-Planck/Dean current is J = -D*grad(rho) + (-tau*v*grad(v) - grad(D))*rho = -rho*D*grad[log(rho) + (3/2)*log(tau*v^2 + T)]"
inputs:
  tau: {quantity: persistence_time, unit: dimensionless}
  v0: {quantity: swim_speed, unit: dimensionless}
outputs:
  log_prefactor: {quantity: log_diffusivity_prefactor, unit: dimensionless}
settings: {}
stochastic: false
