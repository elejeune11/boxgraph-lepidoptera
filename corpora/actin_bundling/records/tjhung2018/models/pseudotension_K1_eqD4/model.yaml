id: pseudotension_K1_eqD4
name: Flat-interface binodals and generalized pseudotension sigma_{K_1} for K_1 != 0 (Appendix D Eqs. D4-D6)
role: model
stated:
  page: 15
  printed_page: "031080-15"
  quote: "Generalizing the argument leading to Ostwald ripening"
  where: "Appendix D Eqs. D4-D6"
equation: "sigma_{K_1} = -(K/(2*nu))*[zeta*S_2 - (2*lambda - 2*K_1)*S_3]; S_2 = psi_bar(phi_2) int phi'^2 dy; S_3 = int psi_bar(phi) phi'^2 dy"
built_from: [pseudovariables_K1_eqD2_D3]
inputs:
  A: {quantity: bulk_free_energy_scale, unit: dimensionless}
  K: {quantity: gradient_coefficient, unit: dimensionless}
  K_1: {quantity: gradient_coupling_K1, unit: dimensionless}
  zeta: {quantity: active_rotational_parameter_zeta, unit: dimensionless}
  lam: {quantity: active_gradient_parameter_lambda, unit: dimensionless}
outputs:
  phi_1: {quantity: order_parameter, unit: dimensionless}
  phi_2: {quantity: order_parameter, unit: dimensionless}
  S_2: {quantity: interface_integral_S0, unit: dimensionless}
  S_3: {quantity: interface_integral_S1, unit: dimensionless}
  sigma_K1: {quantity: interfacial_tension, unit: dimensionless}
settings:
  n_quad: 128
  xtol: 1.0e-12
stochastic: false
