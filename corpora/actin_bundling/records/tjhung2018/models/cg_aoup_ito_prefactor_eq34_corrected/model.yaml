id: cg_aoup_ito_prefactor_eq34_corrected
name: Prefactor of log(tau*v^2 + T) in mu_qs with corrected Stratonovich-to-Ito sign in Eq. (34)
role: model
variant_of: cg_aoup_ito_prefactor_eq34
corrections:
  - equation: "Eq. (34)"
    change: "Change the spurious Ito drift from -tau*v*grad_i v to +tau*v*grad_i v"
    evidence: "Converting Stratonovich SDE Eq. (33) (r_dot =_s sqrt(2*tau)*v*eta + ...) to Ito adds +(1/2)*(sqrt(2*tau)*v)*grad_i(sqrt(2*tau)*v) = +tau*v*grad_i v. Substituting +tau*v*grad_i v into the Dean/Fokker-Planck equation gives J = -rho*D*grad[log(rho) + (1/2)*log(tau*v^2 + T)], reproducing the prefactor 1/2 in Eq. (39), whereas printed -tau*v*grad_i v yields 3/2."
stated:
  page: 12
  printed_page: "031080-12"
  quote: "We then write the Dean equation"
  where: "Sec. VI Eq. 34 (corrected Stratonovich-to-Ito sign +tau*v*grad_i v)"
equation: "From corrected Ito SDE r_dot = v*sqrt(2*tau)*eta + tau*v*grad(v) - sum grad U + sqrt(2*T)*xi, Dean current yields mu_qs = log(rho) + (1/2)*log(tau*v^2 + T)"
inputs:
  tau: {quantity: persistence_time, unit: dimensionless}
  v0: {quantity: swim_speed, unit: dimensionless}
outputs:
  log_prefactor: {quantity: log_diffusivity_prefactor, unit: dimensionless}
settings: {}
stochastic: false
