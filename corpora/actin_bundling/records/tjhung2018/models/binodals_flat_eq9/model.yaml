id: binodals_flat_eq9
name: Flat-interface binodals directly from Eq. (9) differential definitions (Eqs. 8-11)
role: model
stated:
  page: 5
  printed_page: "031080-5"
  quote: "developed in Ref. [34]. This amounts to introducing a"
  where: "Sec. III Eqs. 8-11"
equation: "d^2 psi/d phi^2 = ((zeta - 2*lambda)/K) d psi/d phi; dg/dpsi = df/dphi; f'(phi_1) = f'(phi_2) = mu_bar; P(phi_1) = P(phi_2)"
inputs:
  A: {quantity: bulk_free_energy_scale, unit: dimensionless}
  K: {quantity: gradient_coefficient, unit: dimensionless}
  zeta: {quantity: active_rotational_parameter_zeta, unit: dimensionless}
  lam: {quantity: active_gradient_parameter_lambda, unit: dimensionless}
outputs:
  phi_1: {quantity: order_parameter, unit: dimensionless}
  phi_2: {quantity: order_parameter, unit: dimensionless}
  mu_bar: {quantity: chemical_potential, unit: dimensionless}
  Delta_phi: {quantity: order_parameter_difference, unit: dimensionless}
  Delta_psi: {quantity: pseudodensity_difference, unit: dimensionless}
  Delta_g: {quantity: pseudopotential_difference, unit: dimensionless}
settings:
  n_quad: 64
  xtol: 1.0e-12
stochastic: false
