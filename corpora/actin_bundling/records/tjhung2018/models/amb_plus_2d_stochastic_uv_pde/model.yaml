id: amb_plus_2d_stochastic_uv_pde
name: Reconstructed UV-regularized 2D stochastic AMB+ PDE for Region C bubble phase (Sec. V, Fig. 5)
role: model
reconstructed: "Verbatim Appendix A Eqs. (A1)-(A2) blows up in finite time (t ≈ 0.22) for the paper's Region C parameters (zeta=4, lambda=1, D=0.2, dx=1, dt=0.001, even at dt=0.0002 or D=0.05) due to UV instability of the quadratic O(k^4 phi^2) active current and the Nyquist null mode of Eq. (A2). This reconstructed solver adds an isotropic spectral UV cutoff |k| <= k_cut with IMEX stepping so the homogeneous bubble phase of Fig. 5 can be simulated."
stated:
  page: 9
  printed_page: "031080-9"
  quote: "full stochastic simulations of AMB+ with finite noise"
  where: "Sec. V, Fig. 5, and Appendix A (reconstructed with UV cutoff)"
equation: "d_t phi = -div(J + sqrt(2*D)*Lambda) with spectral UV cutoff |k| <= k_cut and IMEX stepping"
inputs:
  A: {quantity: bulk_free_energy_scale, unit: dimensionless}
  K: {quantity: gradient_coefficient, unit: dimensionless}
  zeta: {quantity: active_rotational_parameter_zeta, unit: dimensionless}
  lam: {quantity: active_gradient_parameter_lambda, unit: dimensionless}
  D: {quantity: noise_strength, unit: dimensionless}
  phi_0: {quantity: order_parameter, unit: dimensionless}
outputs:
  R_bar: {quantity: droplet_radius, unit: dimensionless}
  n_bar: {quantity: bubble_number_density, unit: dimensionless}
  phi_min: {quantity: order_parameter, unit: dimensionless}
  phi_max: {quantity: order_parameter, unit: dimensionless}
settings:
  L: 48
  dx: 1.0
  dt: 0.05
  t_end: 200.0
  k_cut: 1.0
  seed: 0
stochastic: true
