id: binodals_flat_combo_eq9
name: Flat-interface binodals phi_1, phi_2 as a function of (zeta - 2*lambda) from Eq. (9) (Fig. 2)
role: model
stated:
  page: 6
  printed_page: "031080-6"
  quote: "The binodals depend on a combination of the two"
  where: "Fig. 2 caption (p. 6) and Sec. III Eqs. 8-11 (p. 5)"
equation: "d^2 psi/d phi^2 = ((zeta - 2*lambda)/K) d psi/d phi; dg/dpsi = df/dphi; f'(phi_1) = f'(phi_2); P(phi_1) = P(phi_2)"
built_from: [binodals_flat_eq9]
inputs:
  A: {quantity: bulk_free_energy_scale, unit: dimensionless}
  K: {quantity: gradient_coefficient, unit: dimensionless}
  combo: {quantity: activity_combination, unit: dimensionless}
outputs:
  phi_1: {quantity: order_parameter, unit: dimensionless}
  phi_2: {quantity: order_parameter, unit: dimensionless}
settings:
  n_quad: 64
  xtol: 1.0e-12
stochastic: false
