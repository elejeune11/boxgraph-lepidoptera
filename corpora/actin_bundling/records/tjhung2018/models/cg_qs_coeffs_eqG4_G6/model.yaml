id: cg_qs_coeffs_eqG4_G6
name: Coarse-grained quorum-sensing coefficients K^qs, K_1^qs, and lambda_qs as printed (Appendix G Eqs. G4-G6)
role: model
stated:
  page: 17
  printed_page: "031080-17"
  quote: "and the other parameters are set as"
  where: "Appendix G Eqs. G4-G6 (as printed)"
equation: "K^qs = -v_0*gamma_0 / (2*(T + tau*v_0^2)); K_1^qs = -(1/(2*(T + tau*v_0^2))) * [v_0*gamma_1 + v_1*gamma_0 - 2*v_0^2*v_1*gamma_0*tau/(T + tau*v_0^2)]; lambda_qs = v_0*beta_0 / (T + tau*v_0^2) + K_1^qs"
inputs:
  tau: {quantity: persistence_time, unit: dimensionless}
  T: {quantity: thermal_diffusivity, unit: dimensionless}
  v_0: {quantity: swim_speed, unit: dimensionless}
  v_1: {quantity: swim_speed_density_slope, unit: dimensionless}
  gamma_0: {quantity: swim_speed_laplacian_coeff, unit: dimensionless}
  gamma_1: {quantity: swim_speed_laplacian_slope, unit: dimensionless}
  beta_0: {quantity: swim_speed_gradsq_coeff, unit: dimensionless}
outputs:
  K_qs: {quantity: cg_gradient_coefficient, unit: dimensionless}
  K1_qs: {quantity: cg_gradient_coupling_K1, unit: dimensionless}
  lambda_qs: {quantity: cg_active_lambda, unit: dimensionless}
settings: {}
stochastic: false
