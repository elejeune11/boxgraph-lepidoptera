id: model_b_bulk_eq3
name: Model B quartic bulk free energy, binodals, and spinodal (Eq. 3)
role: model
stated:
  page: 3
  printed_page: "031080-3"
  quote: "chosen to be of the square gradient"
  where: "Eq. 3 and Sec. II text (p. 3)"
equation: "f(phi) = (a/2) phi^2 + (b/4) phi^4; f'(phi) = a phi + b phi^3; P_eq(phi) = phi f'(phi) - f(phi); phi_b = sqrt(-a/b); phi_s = sqrt(-a/(3b))"
inputs:
  a: {quantity: quartic_coupling_a, unit: dimensionless}
  b: {quantity: quartic_coupling_b, unit: dimensionless}
  phi: {quantity: order_parameter, unit: dimensionless}
outputs:
  f: {quantity: bulk_free_energy_density, unit: dimensionless}
  mu_eq: {quantity: chemical_potential, unit: dimensionless}
  P_eq: {quantity: pseudopressure, unit: dimensionless}
  phi_b_pos: {quantity: order_parameter, unit: dimensionless}
  phi_b_neg: {quantity: order_parameter, unit: dimensionless}
  phi_s_pos: {quantity: order_parameter, unit: dimensionless}
settings: {}
stochastic: false
