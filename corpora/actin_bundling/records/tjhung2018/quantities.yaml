# ==============================================================================
# Order parameter, free energy, and AMB+ field-theory parameters (dimensionless
# field-theory units throughout Tjhung, Nardini & Cates 2018)
# ==============================================================================
- id: order_parameter
  name: scalar order parameter phi
  dimension: dimensionless
  description: "Conserved scalar order parameter phi(r, t), linearly shifted particle density vanishing at the mean-field critical point (includes binodals phi_1, phi_2, passive binodal phi_b, spinodal phi_s, curved densities phi_+, phi_-, and global mean phi_0)."

- id: order_parameter_difference
  name: order parameter jump Delta_phi
  dimension: dimensionless
  description: "Difference between dense and dilute coexisting order parameter values, Delta_phi = phi_2 - phi_1 or phi_+ - phi_-."

- id: supersaturation
  name: supersaturation epsilon
  dimension: dimensionless
  description: "Departure of far-field vapor density from the flat-interface binodal, epsilon = phi_s - phi_1."

- id: quartic_coupling_a
  name: quadratic Landau coefficient a
  dimension: dimensionless
  description: "Quadratic bulk free-energy coefficient a in f(phi) = (a/2)phi^2 + (b/4)phi^4 (Eq. 3); phase separation occurs for a < 0."

- id: quartic_coupling_b
  name: quartic Landau coefficient b
  dimension: dimensionless
  description: "Quartic bulk free-energy coefficient b > 0 in f(phi) = (a/2)phi^2 + (b/4)phi^4 (Eq. 3)."

- id: bulk_free_energy_scale
  name: symmetric Landau scale A
  dimension: dimensionless
  description: "Symmetric bulk free-energy scale A = -a = b > 0 (Eq. 4), setting passive binodals to +/-1."

- id: gradient_coefficient
  name: square-gradient coefficient K
  dimension: dimensionless
  description: "Constant square-gradient coefficient K > 0 in the free-energy functional F[phi] (Eq. 3)."

- id: gradient_coupling_K1
  name: density-dependent gradient coefficient K_1
  dimension: dimensionless
  description: "Linear phi-dependence of square-gradient stiffness K(phi) = K + 2 K_1 phi (Sec. II and Appendix D)."

- id: mobility
  name: field mobility M
  dimension: dimensionless
  description: "Positive-definite mobility M in Eqs. (1)-(2) and (5)-(6); taken constant M = 1 in AMB+."

- id: noise_strength
  name: noise strength D
  dimension: dimensionless
  description: "Effective temperature / additive noise strength D in Eqs. (1), (5), and (A1)."

- id: active_gradient_parameter_lambda
  name: active gradient activity parameter lambda
  dimension: dimensionless
  description: "Coefficient lambda of the irrotational TRS-breaking term lambda |grad phi|^2 in Eq. (6)."

- id: active_rotational_parameter_zeta
  name: active rotational activity parameter zeta
  dimension: dimensionless
  description: "Coefficient zeta of the non-gradient TRS-breaking current zeta (grad^2 phi) grad phi in Eq. (6)."

- id: activity_combination
  name: flat-interface activity combination zeta - 2*lambda
  dimension: dimensionless
  description: "Single combination zeta - 2*lambda governing flat-interface binodals phi_1, phi_2 (Sec. III, Fig. 2)."

- id: effective_active_gradient_nu
  name: generalized active gradient parameter nu
  dimension: dimensionless
  description: "Combined parameter nu = lambda - K_1 - zeta/2 entering Appendix D (Eqs. D1-D4) for K_1 != 0."

- id: spatial_dimension
  name: spatial dimension d
  dimension: dimensionless
  description: "Euclidean spatial dimension d (d = 2 for simulations and Fig. 3; d = 3 for Sec. IV and App. E Ostwald derivation)."

# ==============================================================================
# Bulk and pseudo-thermodynamic quantities (Sec. III, Appendices B-D)
# ==============================================================================
- id: bulk_free_energy_density
  name: bulk free-energy density f(phi)
  dimension: dimensionless
  description: "Local quartic bulk free-energy density f(phi) = (a/2)phi^2 + (b/4)phi^4 (Eq. 3)."

- id: chemical_potential
  name: chemical potential mu
  dimension: dimensionless
  description: "Equilibrium bulk chemical potential f'(phi), flat-interface coexistence value mu_bar, or nonlocal effective chemical potential mu_I(R) and mu(r)."

- id: chemical_potential_jump
  name: equilibrium chemical potential jump Delta
  dimension: dimensionless
  description: "Curvature-induced jump Delta = f'(phi_-) - f'(phi_+) = (d-1) zeta int (phi'^2/y) dy across a curved interface (Eqs. 16-18)."

- id: chemical_potential_slope
  name: chemical potential derivative f''(phi)
  dimension: dimensionless
  description: "Second derivative of bulk free energy f''(phi) = A(3 phi^2 - 1), positive outside the spinodals."

- id: pseudodensity
  name: pseudodensity psi(phi)
  dimension: dimensionless
  description: "Transformed order parameter psi(phi) solving Eq. (9) (Eq. B1 for K_1=0; Eq. D2 for K_1!=0)."

- id: pseudodensity_difference
  name: pseudodensity jump Delta_psi
  dimension: dimensionless
  description: "Difference Delta_psi = psi(phi_2) - psi(phi_1) between dense and dilute binodals (Eq. 24)."

- id: dimensionless_weight_psi_bar
  name: generalized weight psi_bar(phi)
  dimension: dimensionless
  description: "Weight factor psi_bar(phi) = [1 + 2 K_1 phi / K]^(-nu/K_1) in Appendix D (Eq. D3)."

- id: pseudopotential
  name: pseudopotential g(phi)
  dimension: dimensionless
  description: "Transformed bulk potential g(phi) satisfying dg/dpsi = df/dphi (Eq. 9; Eq. B2 for K_1=0)."

- id: pseudopotential_difference
  name: pseudopotential jump Delta_g
  dimension: dimensionless
  description: "Difference Delta_g = g(phi_2) - g(phi_1) between dense and dilute binodals (Eq. 24)."

- id: pseudopressure
  name: bulk pseudopressure P(phi)
  dimension: dimensionless
  description: "Bulk pseudopressure P(phi) = psi(phi) mu - g(phi) (Eqs. 10-11, 19), reducing to P_eq(phi) = phi f'(phi) - f(phi) in the passive limit."

- id: interfacial_tension
  name: interfacial tension or pseudotension sigma
  dimension: dimensionless
  description: "Equilibrium interfacial tension sigma_eq = (8 K A / 9)^(1/2) or active pseudotension sigma (Eq. 20) and sigma_K1 (Eq. D4)."

- id: interfacial_width
  name: equilibrium interfacial width xi_eq
  dimension: dimensionless
  description: "Equilibrium interfacial width xi_eq = (K / 2A)^(1/2) (Sec. II, p. 4)."

- id: interface_integral_S0
  name: weighted interface integral S_0 (or S_2)
  dimension: dimensionless
  description: "Interface gradient integral S_0 = exp[(zeta-2*lambda)phi_2/K] int phi'^2 dy (Eq. 21) or S_2 (Eq. D5)."

- id: interface_integral_S1
  name: weighted interface integral S_1 (or S_3)
  dimension: dimensionless
  description: "Interface gradient integral S_1 = int phi'^2 exp[(zeta-2*lambda)phi/K] dy (Eq. 22) or S_3 (Eq. D6)."

- id: ostwald_sign_indicator
  name: Ostwald regime sign indicator
  dimension: dimensionless
  description: "Sign indicator of Ostwald ripening (+1 for normal/forward Ostwald ripening, -1 for reverse Ostwald ripening)."

- id: ostwald_criterion_margin
  name: reverse-Ostwald criterion margin
  dimension: dimensionless
  description: "Margin -zeta*|1 - S_0/S_1| - |zeta - 2*lambda| of Eq. (23); strictly positive iff sigma < 0 for a dense droplet."

# ==============================================================================
# Droplet kinetics, Ostwald ripening, and PDE simulation quantities (Secs. IV-V, Apps. A, E, F)
# ==============================================================================
- id: droplet_radius
  name: droplet or bubble radius R
  dimension: dimensionless
  description: "Radius R of a spherical/circular droplet or bubble, fixed-point radius R_s (Eq. 28), two-droplet radii R_1, R_2 (App. E), or steady-state mean bubble radius R_bar (Fig. 5c)."

- id: droplet_growth_rate
  name: droplet radial growth rate dR/dt
  dimension: dimensionless
  description: "Time derivative dR/dt of a droplet radius in Ostwald ripening (Eq. 27, Eqs. E1-E2)."

- id: ostwald_rate_parameter
  name: Ostwald rate parameter beta
  dimension: dimensionless
  description: "Effective Ostwald ripening rate parameter beta = (d-1) sigma / Delta_psi (Eq. 29)."

- id: ostwald_rate_over_Rs
  name: Ostwald ratio beta / R_s
  dimension: dimensionless
  description: "Ratio beta / R_s entering Eq. (27) and Taylor-expanded for small supersaturation in Eq. (30)."

- id: radial_coordinate
  name: radial distance r
  dimension: dimensionless
  description: "Radial distance r = |r| from the center of a spherical droplet (Sec. III-IV, Eq. 25)."

- id: time
  name: simulation time t
  dimension: dimensionless
  description: "Dimensionless time t or discrete time step Delta_t in AMB+ simulations (Figs. 1, 4b, 5b, 6, Appendix A)."

- id: grid_spacing
  name: spatial lattice spacing Delta_x
  dimension: dimensionless
  description: "Spatial discretization step Delta_x = Delta_y on the 2D lattice (Appendix A)."

- id: domain_size
  name: simulation box linear size L
  dimension: dimensionless
  description: "Side length L of the 2D periodic L x L simulation domain (Sec. V, Appendix A, Fig. 6)."

- id: current_magnitude
  name: particle current magnitude |J|
  dimension: dimensionless
  description: "Magnitude (or signed component) of the deterministic particle current J (Eq. 6, Fig. 6, Appendix F)."

- id: bubble_number_density
  name: bubble number density n_bar
  dimension: dimensionless
  description: "Steady-state number density of vapor bubbles n_bar in the homogeneous bubble phase (Fig. 5c)."

- id: radius_change
  name: droplet radius change Delta_R
  dimension: dimensionless
  description: "Net change in droplet radius R(t_end) - R(t_0) during a mean-field two-droplet PDE or ODE evolution."

- id: derivative_phi_wrt_R
  name: radial slope d(phi)/dR
  dimension: dimensionless
  description: "Derivative of curved-interface bulk density phi_+(R) or phi_-(R) with respect to droplet radius R (Fig. 3)."

# ==============================================================================
# Microscopic AOUP coarse-graining quantities (Sec. VI, Appendix G; unit damping)
# ==============================================================================
- id: particle_density
  name: coarse-grained particle density rho
  dimension: dimensionless
  description: "Smooth coarse-grained number density rho(r, t) of active Ornstein-Uhlenbeck particles (Sec. VI, Eqs. 35-46)."

- id: persistence_time
  name: active persistence time tau
  dimension: dimensionless
  description: "Exponential autocorrelation time tau of the AOUP orientation variable u_i (Eq. 32)."

- id: thermal_diffusivity
  name: passive diffusivity / temperature T
  dimension: dimensionless
  description: "Passive translational diffusion constant D_t = T (with unit damping) in Eqs. (31), (33)-(44), and Appendix G."

- id: swim_speed
  name: self-propulsion speed v_0
  dimension: dimensionless
  description: "Zeroth-order swim speed v_0 (or local speed v(rho)) in the density expansion v(rho) = v_0 + v_1 rho + o(rho) (Eq. G1)."

- id: swim_speed_density_slope
  name: swim-speed density slope v_1
  dimension: dimensionless
  description: "First-order density derivative v_1 in v(rho) = v_0 + v_1 rho + o(rho) (Eq. G1)."

- id: swim_speed_laplacian_coeff
  name: swim-speed Laplacian coefficient gamma_0
  dimension: dimensionless
  description: "Zeroth-order coefficient gamma_0 in gamma(rho) = gamma_0 + gamma_1 rho + o(rho) multiplying grad^2 rho in v[rho] (Eq. G1)."

- id: swim_speed_laplacian_slope
  name: swim-speed Laplacian slope gamma_1
  dimension: dimensionless
  description: "First-order coefficient gamma_1 in gamma(rho) = gamma_0 + gamma_1 rho + o(rho) (Eq. G1)."

- id: swim_speed_gradsq_coeff
  name: swim-speed gradient-squared coefficient beta_0
  dimension: dimensionless
  description: "Zeroth-order coefficient beta_0 in beta(rho) = beta_0 + o(rho^0) multiplying |grad rho|^2 in v[rho] (Eq. G1)."

- id: pair_potential_second_moment
  name: pair-potential gradient moment B
  dimension: dimensionless
  description: "Third-order gradient expansion coefficient B = -(Omega / (2 d (d+2))) int_0^inf y^(d+2) U'(y) dy (Eq. 45)."

- id: pair_potential_zeroth_moment
  name: pair-potential gradient moment C
  dimension: dimensionless
  description: "First-order gradient expansion coefficient C = -(Omega / d) int_0^inf y^d U'(y) dy (Eq. 46)."

- id: pair_potential_strength
  name: soft pair-potential amplitude U_0
  dimension: dimensionless
  description: "Amplitude U_0 of a test soft pair potential U(y) = U_0 exp(-y^2 / (2 ell^2)) used to evaluate Eqs. (45)-(46)."

- id: pair_potential_range
  name: soft pair-potential range ell
  dimension: dimensionless
  description: "Interaction range ell of a test soft pair potential U(y) = U_0 exp(-y^2 / (2 ell^2)) used to evaluate Eqs. (45)-(46)."

- id: cg_mobility
  name: coarse-grained mobility M[rho]
  dimension: dimensionless
  description: "Density-dependent coarse-grained mobility M[rho] = rho (tau v[rho]^2 + T) (Eq. 36)."

- id: cg_chemical_potential
  name: coarse-grained chemical potential mu_qs
  dimension: dimensionless
  description: "Quorum-sensing effective chemical potential mu_qs = log(rho) + (1/2) log(tau v[rho]^2 + T) (Eq. 39)."

- id: log_diffusivity_prefactor
  name: prefactor of log(tau v^2 + T) in mu_qs
  dimension: dimensionless
  description: "Coefficient multiplying log(tau v[rho]^2 + T) in the quorum-sensing chemical potential mu_qs (printed as 1/2 in Eq. 39; implied to be 3/2 by the sign in printed Eq. 34)."

- id: ito_drift_sign
  name: sign of the Stratonovich-to-Ito spurious drift term
  dimension: dimensionless
  description: "Sign coefficient (+1 for +tau v grad v, -1 for printed -tau v grad v) of the spurious drift in Eq. (34)."

- id: cg_gradient_coefficient
  name: coarse-grained gradient stiffness K^qs or K^r
  dimension: dimensionless
  description: "Square-gradient coefficient K^qs (Eq. G4) or K^r (Eq. G11) obtained from explicit coarse graining."

- id: cg_gradient_coupling_K1
  name: coarse-grained gradient coupling K_1^qs or K_1^r
  dimension: dimensionless
  description: "Linear density-dependent gradient coefficient K_1^qs (Eq. G5) or K_1^r (Eq. G12)."

- id: cg_active_lambda
  name: coarse-grained active parameter lambda_qs or lambda_r
  dimension: dimensionless
  description: "Irrotational TRS-breaking coefficient lambda_qs (Eq. G6) or lambda_r (Eq. G12)."

- id: cg_active_zeta
  name: coarse-grained active parameter zeta_cg
  dimension: dimensionless
  description: "Rotational TRS-breaking coefficient zeta_cg = 2 tau v_0 (gamma_0 C - v_1 B) / (T + tau v_0^2)^2 (Eq. 44)."

# ==============================================================================
# Additional quantities for digitized figures (Figs. 5b, 6)
# ==============================================================================
- id: bubble_radius_probability_density
  name: bubble radius probability distribution P(R)
  dimension: dimensionless
  description: "Histogram probability distribution P(R) of vapor bubble radius R in the homogeneous bubble phase (Fig. 5b; discrete histogram with bin width Delta_R = 0.25 and sum P(R_i) = 1)."

- id: spatial_coordinate_x
  name: horizontal lattice coordinate x
  dimension: dimensionless
  description: "Horizontal spatial coordinate x in the 2D two-droplet simulation domain of Fig. 6 (plotted over x in [0, 128] with tick labels 0 to 120)."

- id: spatial_coordinate_y
  name: vertical lattice coordinate y
  dimension: dimensionless
  description: "Vertical spatial coordinate y of droplet interface contours (phi = 0) in the 2D two-droplet simulation domain of Fig. 6 (plotted over y in [0, 64] with symmetry line y = 30)."

- id: relative_horizontal_current
  name: normalized signed horizontal vapor current J_x / |J_x,mid|
  dimension: dimensionless
  description: "Signed horizontal particle current J_x(x) along a midline vapor row normalized by the mid-gap current magnitude |J_x(x ≈ 68)| in Fig. 6 (arrows are magnified without a printed scale bar; sign indicates flow direction)."

