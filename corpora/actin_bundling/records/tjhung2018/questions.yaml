    Cross-record ModelAtlas synthesis between tjhung2018 (Active Model B+) and gubbala2025 (2D
    passive variational anisotropic Model C for lipid bilayers coupled to adsorbed nematic F-actin;
    note that gubbala2025 ref-49 cites Cates & Tjhung J. Fluid Mech. 2018 rather than Tjhung PRX 2018):
    9 verified cross-record relations in tjhung2018/relations.yaml establish the exact shared
    passive Model B core.
    (1) Exact dimensionless Model B identity: gubbala2025/cahn_hilliard_free_energy_eq2 and
    tjhung2018/model_b_bulk_eq3 join into a symbolic same_as ModelAtlas family for mu = phi^3 - phi
    at unit symmetric bulk scale A = -a = b = 1, with symbolic derived_from and numeric reduces_to
    linking f_phi -> f as |grad phi| -> 0 and tjhung2018's corrected pseudopotential g -> f_phi as
    zeta, lambda -> 0.
    (2) Interfacial scales, binodals, and coarsening: Gubbala's bare Cahn-Hilliard length scale
    l_c = sqrt(lambda_tilde) equals sqrt(2)*xi_eq (at A = 1, K = lambda_tilde); note that Gubbala's
    "effective line tension parameter" lambda = 1 + chi/2 (effective_line_tension_s13) enters as
    the square-gradient stiffness K rather than the integrated interfacial tension itself, so
    equilibrium line tension scales as sigma_eq = (2*sqrt(2)/3)*sqrt(lambda) rather than linearly
    with lambda. As nematic stiffness beta -> oo, Gubbala's coupled binodals (phi_Lo_eq, phi_Ld_eq)
    reduce identically to Tjhung's passive Model B binodals (-1, +1), while at finite beta in [1, 50]
    Gubbala's nematic dense-binodal shift 1 + 1/(4*beta) matches Tjhung's passive 3D Laplace shift
    1 + 2*sqrt(2)/(3*R) under R = 8*sqrt(2)*beta/3 to within 4.36% (max at beta = 1). Both papers
    anchor their coarsening kinetics on classical passive bulk-diffusion R(t) ~ t^(1/3) (both
    citing Bray & Emmott 1995), contrasting AMB+'s active TRS-breaking reverse Ostwald arrest
    against Gubbala's strictly passive nematic-elastic coarsening slowdown (alpha <= 0.25).

