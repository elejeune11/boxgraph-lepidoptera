- id: q_appE_mass_conservation_d2_vs_d3
  kind: choice
  about: [two_droplet_ode_eqE1_E2]
  text: >
    Appendix E derives Eqs. (E1)-(E2) stating "(for dimension d = 3)" (p. 16), yet the coupled pair
    Delta_phi(R_1) * R_1 * dR_1/dt = f'(phi_-(R_2)) - f'(phi_-(R_1)) = -Delta_phi(R_2) * R_2 * dR_2/dt
    conserves 2D droplet area (proportional to R_1^2 + R_2^2 when Delta_phi is approximately constant) rather than
    3D droplet volume (R_1^3 + R_2^3), because the effective-medium 3D flux 4*pi*R_i*Delta_mu into each droplet
    depends on its own radius R_i. Moreover, the paper does not state the initial radii R_1(0), R_2(0), the box size
    L used in Fig. 4(b), or the 2D logarithmic screening factor ln(ell/R) omitted between Eqs. (E1)-(E2) and the
    d = 2 simulations.
  citation:
    page: 16
    printed_page: "031080-16"
    quote: "there is a logarithmic correction, but this does not change"
    where: "Appendix E Eqs. E1-E2 (p. 16)"

- id: q_stochastic_appA_uv_blowup_regionC
  kind: numerics
  about: [amb_plus_2d_stochastic_pde, amb_plus_2d_stochastic_uv_pde, D_stochastic, zeta_fig5_C, lambda_fig5_C]
  text: >
    Implementing Appendix A Eqs. (A1)-(A2) verbatim (explicit Ito Euler, 8th-order central finite difference Eq. A2
    applied twice for second derivatives, A = 0.25, K = 1, K_1 = 0, dx = dy = 1, dt = 0.001) is numerically stable
    in the passive limit (zeta = lambda = 0, D = 0.2) and in Region A (zeta = 1, lambda = -0.5, D = 0.2), but blows
    up in finite time (t ≈ 0.22) for the paper's Region C parameters (zeta = 4, lambda = 1, D = 0.2, phi_0 = 0.6,
    and also at phi_0 = 1.0 and -1.1). The blowup persists at 5x smaller time step (dt = 0.0002, blowup at t ≈ 0.20),
    at 4x lower noise (D = 0.05, blowup at t ≈ 0.71), in 1D (blowup at t ≈ 0.40 even though continuum 1D (zeta=4,
    lambda=1) is identical to stable (zeta=0, lambda=-1)), and under 2nd-order, staggered, stress-tensor, and
    2/3-dealiased discretizations (stable only for D <= 0.02 at dx = 1 or with an isotropic UV cutoff |k| <= k_cut ≈ 1.0-1.3).
    Two factors cause this: (i) discrete Eq. (A2) has a Nyquist null mode keff(pi) = 0 and breaks the product rule
    (1/2) d_x((d_x phi)^2) = (d_x^2 phi)(d_x phi); (ii) at |zeta| = 4, K = 1, the quadratic active term zeta*(lap phi)*grad phi
    is O(k^4 phi^2) and overwhelms linear -K*lap^2 phi once grid-scale fluctuations reach |delta phi| >= K/|zeta| = 0.25.
    An unstated UV regularization or implementation detail appears necessary to reach Fig. 5(a)-(c) (D up to 0.8, t up to 131072).
  citation:
    page: 14
    printed_page: "031080-14"
    quote: "We choose Dt = 0.001 and"
    where: "Appendix A Eqs. A1-A2 and Sec. V Fig. 5 (pp. 9-10, 14)"

