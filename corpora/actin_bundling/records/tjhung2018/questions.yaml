- id: q_eqB2_misprint_6zeta
  kind: possible_error
  about: [pseudovariables_eqB1_B2, binodals_flat_eqB2, phi1_z2l2_fig5a, phi2_z2l2_fig5a]
  text: >
    Appendix B Eq. (B2) (p. 14) prints "- 6*zeta*K^2*phi" inside the brackets of g(phi) instead of
    "- 6*(zeta - 2*lambda)*K^2*phi". Exact integration of Eq. (9) (dg/dphi = f'(phi) exp[(zeta-2*lambda)phi/K])
    uniquely yields -6*(zeta - 2*lambda)*K^2*phi. As printed, Eq. (B2) violates dg/dpsi = df/dphi whenever
    lambda != 0, violates the paper's core result that flat binodals depend only on (zeta - 2*lambda) (Sec. III p. 5,
    Fig. 2), diverges as O((zeta-2*lambda)^-4) along zeta = 2*lambda != 0, and fails to reproduce the Fig. 5(a)
    binodals (-1.096, 0.864) (yielding (-1.122, 0.325) at zeta=1, lambda=-0.5 and (-0.778, -0.350) at zeta=4,
    lambda=1). The corrected variant binodals_flat_eqB2_corrected (and direct integration of Eq. 9) reproduces
    -1.096 and 0.864 to every printed digit.
  citation:
    page: 14
    printed_page: "031080-14"
    quote: "It is useful to notice that the explicit solution to"
    where: "Appendix B Eq. B2"

- id: q_eq30_spurious_factor
  kind: possible_error
  about: [ostwald_beta_over_Rs_eq30, ostwald_ripening_eq27_29]
  text: >
    Sec. IV Eq. (30) (p. 9) prints beta / R_s = [f''(phi_1) / (Delta_phi * Delta_psi)] * epsilon + O(epsilon^2).
    However, directly expanding Eq. (28) (R_s = Delta_psi * beta / [f'(phi_s) * Delta_psi - Delta_g]) with
    phi_s = phi_1 + epsilon and using Eqs. (8) and (10) (Delta_g / Delta_psi = mu_bar = f'(phi_1)) yields
    beta / R_s = f'(phi_1 + epsilon) - f'(phi_1) = f''(phi_1) * epsilon + O(epsilon^2), without the factor
    1 / (Delta_phi * Delta_psi). Even in the passive limit (Delta_phi = Delta_psi = 2), printed Eq. (30)
    underpredicts exact Eq. (28) by a factor of 4. Because Delta_phi > 0 and Delta_psi > 0, the qualitative
    sign conclusion (R_s > 0 when beta < 0 and epsilon < 0) is unaffected.
  citation:
    page: 9
    printed_page: "031080-9"
    quote: "also negative. To determine the sign of Rs , we Taylor"
    where: "Sec. IV Eq. 30"

- id: q_appC_eqC2_signs_and_limits
  kind: possible_error
  about: [curved_binodals_appC, curved_binodals_appC_corrected]
  text: >
    Appendix C (p. 15) contains three related sign/limit misprints for a dense droplet (phi(0) = phi_+ > phi_- = phi(inf),
    for which phi'(r) = -sqrt(w(phi)) < 0 and dr = -dphi / sqrt(w)): (1) the inline expressions for S_0 and S_1 print
    integration limits from phi_+ to phi_- (giving negative values since phi_+ > phi_-) instead of phi_- to phi_+,
    and drop the outer grouping brackets in exp{[(zeta-2*lambda)/K] phi_+}; (2) both O(1/R) terms in Eq. (C2) have
    reversed signs (as if phi' = +sqrt(w)), which causes the boundary consistency integral int exp(alpha*x) s(x) dx = 0
    to yield P(phi_+) - P(phi_-) = -(d-1)*sigma/R (opposite to Eq. 19) and drives w(phi_+) strongly nonzero/negative;
    (3) Eq. (C3) prints lower integration limit 1 instead of phi_- (likely a misprint for phi_1 or phi_-), which lies
    outside the support [phi_-, phi_+] of sqrt(w) whenever phi_+ < 1 (e.g., zeta - 2*lambda > 0). The corrected variant
    curved_binodals_appC_corrected matches the Fig. 3(a)-(b) theory curves cleanly.
  citation:
    page: 15
    printed_page: "031080-15"
    quote: "The perturbative strategy then goes as follows."
    where: "Appendix C inline S_0, S_1 and Eqs. C2-C3"

- id: q_eq34_ito_drift_sign
  kind: possible_error
  about: [cg_aoup_ito_prefactor_eq34, cg_aoup_ito_prefactor_eq34_corrected, mu_qs_log_prefactor_eq39]
  text: >
    Sec. VI Eq. (34) (p. 12) prints the Ito form of Stratonovich SDE Eq. (33) with a minus sign on the spurious drift
    (-tau * v * grad_i v). Converting r_dot =_s sqrt(2*tau) * v * eta to Ito form yields +(1/2)*(sqrt(2*tau)*v)*grad_i(sqrt(2*tau)*v)
    = +tau * v * grad_i v. Substituting the printed minus sign into the Dean / Fokker-Planck equation gives
    J_qs = -rho * D * grad[log(rho) + (3/2) log(tau*v^2 + T)], contradicting the factor 1/2 in Eq. (39), whereas
    the corrected +tau * v * grad_i v yields Eq. (39) identically.
  citation:
    page: 12
    printed_page: "031080-12"
    quote: "We then write the Dean equation"
    where: "Sec. VI Eqs. 33, 34, and 39"

- id: q_appG_eqG2_G4_G6_missing_tau_and_half
  kind: possible_error
  about: [cg_qs_coeffs_eqG4_G6, cg_qs_coeffs_eqG4_G6_corrected]
  text: >
    Appendix G Eq. (G2) (p. 17) expands (1/2) log(tau * (v + delta_v)^2 + T) from Eq. (39) as
    [v / (tau*v^2 + T)] * delta_v, omitting the factor of tau in the numerator (exact derivative is
    [tau * v / (tau*v^2 + T)] * delta_v; omitting tau makes the gradient term dimensionally inconsistent with
    dimensionless log(rho) by a factor of 1/time). This missing factor of tau propagates into Eqs. (G4), (G5),
    and (G6). In addition, Eq. (G4) prints an extraneous factor of 1/2 in the denominator
    (K^qs = -v_0*gamma_0 / [2*(T + tau*v_0^2)]), whereas matching Eq. (41)-(42) delta F_qs/delta rho = f'_qs -
    (K^qs + 2*K_1^qs*rho)*grad^2 rho - K_1^qs*|grad rho|^2 equates -K^qs (without factor 2) to the zeroth-order
    coefficient of grad^2 rho, giving K^qs = -tau*v_0*gamma_0 / (T + tau*v_0^2). Note that Eqs. (44) and (G11)-(G12)
    for the pair-potential contribution do NOT have this omission and are algebraically exact.
  citation:
    page: 17
    printed_page: "031080-17"
    quote: "and the other parameters are set as"
    where: "Appendix G Eqs. G2, G4-G6"

