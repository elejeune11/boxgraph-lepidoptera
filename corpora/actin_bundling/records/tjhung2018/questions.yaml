    Cross-record ModelAtlas synthesis between tjhung2018 (single-field AMB+) and frohoff2021
    (nonreciprocal two-field Cahn-Hilliard; frohoff2021 cites tjhung2018 as ref-28 on pp. 2 and 11,
    explicitly likening its nonreciprocal "reverse coarsening" to AMB+'s "reverse Ostwald ripening"):
    14 cross-record relations in tjhung2018/relations.yaml (12 verified + 2 documented-misprint
    tests) link all shared single-field Cahn-Hilliard equilibrium structures and contrast the two
    conserved nonequilibrium coarsening-arrest mechanisms.
    (1) Shared ModelAtlas families and passive reductions: both papers use the exact zero-midpoint
    quartic Landau potential f(phi) = (a/2)*phi^2 + (b/4)*phi^4 and chemical potential mu = a*phi + b*phi^3.
    Two verified same_as relations join tjhung2018/model_b_bulk_eq3 with frohoff2021/decoupled_binodals_appC
    (phi_b = sqrt(-a/b)) and tjhung2018/ostwald_beta_over_Rs_eq30_corrected with
    frohoff2021/bulk_energy_curvature_eq3_4 (symbolic identity for f''(phi_1)). Five verified
    reduces_to relations confirm that AMB+ flat binodals (zeta, lambda -> 0 or combo = zeta - 2*lambda -> 0),
    Frohoff variational coexistence (rho -> 0), and Frohoff Turing spinodal (rho = 0, alpha -> 0,
    f_2'' -> 0) all converge to the shared passive single-field Model B binodals and spinodals;
    Frohoff's Novick-Cohen subcriticality threshold sqrt(-a/5) scales at constant ratio sqrt(3/5)
    inside Model B's spinodal sqrt(-a/3); and Frohoff's phi_hat_1 scales with Tjhung's xi_eq.
    (2) Contrasting conserved arrest mechanisms: both systems strictly conserve their scalar order
    parameter(s) without chemical turnover, yet arrest/reverse coarsening by distinct nonvariational
    routes — single-field AMB+ requires d >= 2 dimensions so its rotational active current
    zeta*(lap phi)*grad phi drives circulating currents and negative pseudotension sigma < 0
    (whereas 1D AMB+ is integrable via Eq. 9 and cannot arrest coarsening), whereas Frohoff's
    nonreciprocal two-field coupling (-alpha*phi_2, +alpha*phi_1) already arrests coarsening,
