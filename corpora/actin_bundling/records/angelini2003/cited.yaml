# Cross-record provenance audit of values cited between angelini2003 and the three
# remaining Wave 6 ready partner records (claessens2008, grason2007, tang1996).
# (Note: angelini2003+borukhov2005 and angelini2003+henle2005 were previously
# audited inside those partner records.)
#
# 1. claessens2008 -> angelini2003 (ref-11):
#    claessens2008 (published 2008, after angelini2003) cites angelini2003 (Ref. [11])
#    purely qualitatively in three places: on p. 1 col. 1 ("generally form a phase of
#    bundles with a well defined thickness (9-16)"), on p. 3 col. 1 ("Therefore, F-actin
#    is not ideally suited for hexagonal packing (11, 30)"), and on p. 3 col. 1 ("finite
#    sizes observed for F-actin bundled in the presence of ABPs or condensing agents in
#    vitro (10-12, 22)"). Zero datums in claessens2008/data.yaml carry from_source: ref-11
#    or angelini2003: its only from_source datums come from ref-35 (Tsuda et al. 1996,
#    tau_actin = 8 x 10^-26 N*m^2 — the same external source as angelini2003's ref-19)
#    and ref-36 (Ono et al. 1997, Kd_fascin and DeltaG_fascin_printed). Note that
#    claessens2008's unreferenced d_monomer = 2.9 nm (p. 2) is numerically close to
#    angelini2003's extracted d_monomer_extracted = 28.7 A (2.87 nm), but claessens2008
#    does not cite angelini2003 for it.
# 2. grason2007 -> angelini2003 (ref-6):
#    grason2007 (published 2007, after angelini2003) cites angelini2003 (Ref. [6])
#    purely qualitatively once in the introductory literature bracket [3-6] on p. 1 col. 1
#    ("phase diagram of solutions of actin proteins and linkers under in vitro conditions
#    [3-6]"). Zero datums in grason2007/data.yaml borrow any numerical value from
#    angelini2003 (its only two from_source datums come from ref-12 Lai et al. 2007 and
#    ref-22 Ikawa et al. 2007).
# 3. angelini2003 + tang1996:
#    Neither paper cites the other: tang1996 (1996) precedes angelini2003 (2003), and
#    angelini2003/references.yaml does not cite tang1996 (J. Biol. Chem. 271:8556-8563;
#    its Tang co-authored citations are ref-5 Lyubartsev et al. 1998 PRL and ref-25
#    Butler et al. 2003 PRL). All five from_source datums in angelini2003/data.yaml come
#    from ref-12 (Lodish et al. 2000), ref-14 (Holmes et al. 1990), or ref-19 (Tsuda et
#    al. 1996), none of which is in the corpus. While angelini2003 prints unreferenced
#    b_linear_charge_spacing = "≈ 2.5" A at pH 7 (p. 1) matching tang1996's derived
#    b_actin = 2.5 A at pH 7.2 (p. 4), angelini2003 does not attribute it to tang1996.
#
# Accordingly, zero CitedLink entries apply to angelini2003 for these three pairs.
[]
