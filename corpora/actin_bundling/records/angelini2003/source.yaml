notes: >
  Quantitative reading of Angelini, Liang, Wriggers & Wong (2003), PNAS 100(15):8634-8637
  (PDF pages 1-4).

  In scope:
  - Reported physical properties of F-actin (persistence length xi_A ≈ 10 um, diameter D_A ≈ 75 Å,
    linear charge spacing ≈ 2.5 Å per -1e at pH 7, torsional modulus kappa ≈ 8 x 10^-26 N*m^2
    from Tsuda et al. ref-19) and extracted monomer spacing d_m = 28.7 Å (p. 3).
  - All 13 measured 2D SAXS peak wavevectors (a-m) from Fig. 3 (p. 3) and Fig. 2A (p. 2) for both
    nonelectrostatically condensed F-actin (90 mg/ml, 0 mM Ba2+) and Ba2+-condensed F-actin
    (7.5 mg/ml, 60 mM Ba2+; also 36 and 108 mM Ba2+ in Fig. 2A), plus the calculated mosaic-smeared
    36/17 layer-line peaks (q = 0.113 and 0.120 Å^-1).
  - Runnable models: hexagonal equatorial peak ratios (q_11 = sqrt(3)*q_10, q_20 = 2*q_10),
    1D counterion CDW spatial period (d_CDW = 2*pi/q_z = 59.8 Å), twice-monomer charge-patch period
    (d = 2*d_m = 57.4 Å), helical monomer rotation angle (theta = -t*2*pi/M giving -166.2 deg for
    13/6 and -170 deg for 36/17), helical overtwist (Delta_theta = -3.8 deg per monomer),
    thermal energy scale (k_B*T), continuum torsional twist energy (E_twist = (1/2)*kappa*Delta_theta^2*d^-1,
    in J and in k_B*T), and equipartition thermal rms twist (Delta_theta_rms = sqrt(k_B*T*d/kappa)).
  - Non-runnable model: partially powder-averaged four-sphere helical diffraction fit with Gaussian
    layer-line profiles and mosaic smearing (pp. 2-3, citing refs 14-16), which omits sphere
    coordinates/radii, layer-line widths, and mosaic orientation distribution parameters.

  Left out (feeding no quantitative model in this paper):
  - Sample preparation and beamline apparatus parameters on p. 1: G-actin molecular weight 43,000,
    5 mM Tris pH 8.0, 0.2 mM CaCl2, 0.5 mM ATP, 0.2 mM DTT, 0.01% NaN3, 2 mg/ml G-actin,
    100 mM KCl, phalloidin MW 789.2, ultracentrifugation 100,000 x g, 10 mg/ml F-actin resuspension,
    18.2 MOhm Millipore H2O, 1.5-mm quartz capillaries, 300 x 300 um^2 synchrotron beam,
    8.98 keV X-ray energy (Si(111) monochromator); confocal bundle conditions on p. 2 (0.03 mg/ml
    F-actin ≈ 10 um long, 72 mM Ba2+, "thousands of filaments"); Fig. 2A filament length ≈ 2 um
    and Ba2+ levels 0, 36, 108 mM (noted in conditions where relevant); SAXS coordinate definitions
    q_r = q*cos(chi), q_z = q*sin(chi), q = (4*pi/lambda)*sin(theta) (p. 2, which produce no printed
    numbers since no scattering angles theta are reported; note also the wording convention calling
    2*theta "the Bragg angle" instead of the scattering angle); 40 deg wedge width and pi/2 >= chi >= pi/4
    partial powder-averaging range; qualitative 6-fold divisibility observation (36 mod 6 = 0 vs
    13 mod 6 != 0 on p. 4).

  Figures (digitized at 1200 dpi = exact 8x upsampling of native 150-ppi PDF rasters; see figures.yaml and figures.md):
  - Fig. 1A-B (p. 2): SITUS low-resolution density schematic drawings of uncondensed (13/6) and
    condensed (36/17 + CDW) F-actin (left out: illustrations, no numeric axes).
  - Fig. 2A (p. 2): Digitized all three 1D SAXS profiles I(q)/I_0 vs q (fig2a_0mM, fig2a_36mM,
    fig2a_108mM; calibrated on 14 x-ticks 0.05-0.18 Å^-1 and 14 log10 y-ticks 0.6-10) plus
    resolved peak wavevectors (fig2a_108mM_peaks: 0.0849, 0.1335 Å^-1; fig2a_36mM_peak2: 0.1239 Å^-1),
    finding systematic downward shifts relative to the Fig. 2 caption's printed 0.089 and 0.136 Å^-1
    (q_digitize_fig2a_peak_shift).
  - Fig. 2B (p. 2): Confocal fluorescence micrograph of F-actin bundles at 72 mM Ba2+, scale bar 8 um
    (left out: micrograph, no plotted data).
  - Fig. 3A, 3D (p. 3): 2D SAXS detector patterns (left out: 2D false-color images, no numeric axes).
  - Fig. 3B, 3C, 3E, 3F + Inset (p. 3): Digitized all four full 1D SAXS cuts I(q)/I_0 vs q_r, q_z
    (fig3b_equatorial_nonelec, fig3c_meridional_nonelec, fig3e_equatorial_ba, fig3f_meridional_ba;
    all x- and log10 y-axis fits <= 0.49 native-px residual) plus all 12 resolved peak wavevectors
    (fig3b_peaks, fig3c_peaks, fig3e_peaks, fig3f_main_peaks, fig3f_inset_peaks; 14 readings,
    209 total points across Figs. 2-3).
  - Fig. 4 (p. 3): Schematic 3-filament bundle and unwrapped triangular channel charge-distribution
    diagrams for 36/17 and 13/6 symmetries (left out: drawings, no numeric axes).

  Key quantitative findings:
  - Helical geometry (-166.2 deg, -170 deg, -3.8 deg overtwist), CDW spatial period (59.8 Å from
    0.105 Å^-1), charge-patch period (57.4 Å = 2 * 28.7 Å), and nonelectrostatic 2nd-order hexagonal
    peak (0.07 Å^-1) all reproduce cleanly; nonelectrostatic sqrt(3)-order peak (0.062 vs 0.0606 Å^-1)
    is close.
  - Major discrepancy (p. 4): the printed torsional energy formula E_twist = (1/2)*kappa*Delta_theta^2*d^-1
    with printed kappa ≈ 8 x 10^-26 N*m^2, Delta_theta = -3.8 deg/monomer (-3.846 deg exact), and
    d = 28.7 Å at room temperature (298.15 K) gives 14.89 k_B*T per monomer (15.26 k_B*T unrounded;
    7.45 k_B*T even if d = 57.4 Å), ~9.3x larger than the printed 1.6 kT (not reproduced). Likewise,
    equipartition Delta_theta_rms = sqrt(k_B*T*d/kappa) gives 0.70 deg/monomer (0.98 deg at d = 57.4 Å)
    vs printed ≈ 3 deg (~4.3x smaller), and 1.6 kT vs ≈ 3 deg are also internally inconsistent by
    sqrt(2) under 1-DOF equipartition (3.8/sqrt(3.2) = 2.12 deg vs 3.8/sqrt(1.6) = 3.00 deg).
  - For Ba2+-condensed bundles, peak h (0.136 Å^-1) deviates by -11.8% from the exact hexagonal
    prediction sqrt(3)*0.089 = 0.154 Å^-1 (described as "deviates slightly"), and the measured CDW
    period (59.8 Å) exceeds twice the extracted monomer spacing (57.4 Å) by 4.0%.
