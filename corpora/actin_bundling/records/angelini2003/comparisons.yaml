# Torsional twist energy and thermal equipartition reproductions (p. 4, col. 1)
- id: cmp_twist_energy_kT_printed_dtheta
  purpose: reproduction
  computed: E_twist_kT_calc
  printed: E_twist_printed
  note: "Checks E_twist = (1/2)*kappa*Delta_theta^2*d^-1 / (k_B T) using printed kappa, Delta_theta = -3.8 deg, and d = 28.7 Å against printed 1.6 kT (p. 4, col. 1)."

- id: cmp_twist_energy_kT_chained_dtheta
  purpose: reproduction
  computed: E_twist_kT_chained_calc
  printed: E_twist_printed
  note: "Chained check of E_twist / (k_B T) using exact unrounded overtwist (-3.846 deg) from 36/17 vs 13/6 against printed 1.6 kT (p. 4, col. 1)."

- id: cmp_thermal_rms_twist
  purpose: reproduction
  computed: Delta_theta_rms_calc
  printed: Delta_theta_rms_printed
  note: "Checks equipartition thermal rms twist sqrt(k_B T d / kappa) at room temperature against printed ≈ 3 deg (p. 4, col. 1)."

# Digitized Fig. 2A peak comparisons vs Fig. 2A caption and hexagonal model
- id: cmp_fig2a_108mM_vs_caption
  purpose: consistency
  computed: q_peaks_fig2a_printed
  printed: q_peaks_fig2a_108mM
  conditions_ok: >
    Fig. 2 caption reports a single pair of peak positions (0.089 and 0.136 Å^-1) jointly for
    both 36 mM and 108 mM Ba2+ curves (~2 um F-actin), whereas q_peaks_fig2a_108mM reads the
    108 mM curve specifically.
  note: "Checks Fig. 2 caption printed peaks [0.089, 0.136] Å^-1 against calibrated Fig. 2A 108 mM peak intervals [0.0849 +/- 0.0010, 0.1335 +/- 0.0018] Å^-1."

- id: cmp_fig2a_36mM_q2_vs_caption
  purpose: consistency
  computed: q_2_fig2a_36mM_dig
  printed: q_2_fig2a_printed
  conditions_ok: >
    Fig. 2 caption cites q = 0.136 Å^-1 for both 36 mM and 108 mM Ba2+ (~2 um F-actin); here
    compared against the resolved higher-order peak read specifically from the 36 mM curve.
  note: "Digitized 36 mM higher-order peak (0.1239 Å^-1) lies 8.9% below the caption's 0.136 Å^-1."

- id: cmp_hex_fig2a_108mM_q11
  purpose: validation
  computed: q_11_fig2a_108mM_pred
  printed: q_2_fig2a_printed
  conditions_ok: >
    Hexagonal sqrt(3)-order prediction from the digitized Fig. 2A 108 mM first-order peak
    compared against the Fig. 2 caption's printed higher-order peak (jointly cited for 36 & 108 mM).
  note: "Hexagonal sqrt(3)*q_1(108 mM) = 0.1470 Å^-1 vs Fig. 2 caption 0.136 Å^-1 (and vs digitized 108 mM q_2 = 0.1335 Å^-1, -9.2%)."

