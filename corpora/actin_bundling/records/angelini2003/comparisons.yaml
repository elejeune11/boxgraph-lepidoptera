# CDW spatial period and charge-patch period reproductions and consistency
- id: cmp_cdw_period
  purpose: reproduction
  computed: d_cdw_calc
  printed: d_cdw_printed
  note: "Checks d_CDW = 2*pi/0.105 Å^-1 = 59.84 Å against printed 59.8 Å (pp. 2, 4)."

- id: cmp_charge_patch_period
  purpose: reproduction
  computed: d_patch_calc
  printed: d_patch_printed
  conditions_ok: >
    The paper holds the monomer axial spacing fixed at the 28.7 Å value extracted from nonelectrostatically
    condensed F-actin (90 mg/ml, 0 mM Ba2+, Fig. 3A) when evaluating the 36/17 charge-patch period
    d = 2*d_m = 57.4 Å in the Ba2+-condensed phase (7.5 mg/ml, 60 mM Ba2+).
  note: "Checks d = 2 * 28.7 Å = 57.4 Å against printed d = 57.4 Å (p. 4)."

- id: cmp_cdw_vs_patch_period
  purpose: consistency
  computed: d_patch_calc
  printed: d_cdw_printed
  conditions_ok: >
    The paper directly compares the 36/17 negative-charge-patch period d = 57.4 Å (computed from the
    28.7 Å monomer spacing extracted at 0 mM Ba2+) with the measured 1D CDW period 59.8 Å at 60 mM Ba2+,
    calling them 'quite close' (p. 4, col. 1).
  note: "Quantifies the 2.4 Å (4.0%) difference between actin charge-patch spacing (57.4 Å) and measured CDW period (59.8 Å)."

