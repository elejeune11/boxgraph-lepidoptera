- id: scattering_wavevector
  name: scattering wavevector
  dimension: "1/[length]"
  description: SAXS momentum transfer magnitude or component (q, q_r, or q_z).

- id: axial_spatial_period
  name: axial spatial period along filament
  dimension: "[length]"
  description: Real-space axial periodicity along the F-actin filament (1D counterion CDW period or negative-charge-patch spacing).

- id: monomer_spacing
  name: actin monomer axial spacing
  dimension: "[length]"
  description: Axial rise per G-actin monomer along an F-actin filament.

- id: helical_repeat_monomers
  name: monomers per helical repeat
  dimension: dimensionless
  description: Number of actin monomers M in one crystallographic helical repeat (e.g. 13 in 13/6, 36 in 36/17).

- id: helical_repeat_turns
  name: turns per helical repeat
  dimension: dimensionless
  description: Number of full helical turns t in one crystallographic helical repeat (e.g. 6 in 13/6, 17 in 36/17).

- id: monomer_twist_angle
  name: azimuthal twist angle per monomer
  dimension: dimensionless
  description: Azimuthal rotation angle between adjacent actin monomers along the genetic helix (theta = -2*pi*t/M).

- id: monomer_overtwist
  name: helical overtwist per monomer
  dimension: dimensionless
  description: Change in azimuthal twist angle per actin monomer relative to native 13/6 F-actin (Delta_theta = theta_1 - theta_0).

- id: thermal_rms_twist
  name: thermal rms twist angle
  dimension: dimensionless
  description: Root-mean-square thermal twist fluctuation of F-actin at room temperature from equipartition.

- id: torsional_modulus
  name: F-actin torsional modulus
  dimension: "[mass]*[length]**3/[time]**2"
  description: Torsional rigidity kappa of an F-actin filament (units N*m^2).

- id: twist_energy
  name: torsional twist energy per monomer
  dimension: "[energy]"
  description: Elastic torsional strain energy E_twist required to twist one F-actin monomer segment by Delta_theta.

- id: twist_energy_kT
  name: torsional twist energy in units of kT
  dimension: dimensionless
  description: Elastic torsional strain energy E_twist divided by thermal energy k_B*T.

- id: temperature
  name: absolute temperature
  dimension: "[temperature]"
  description: Thermodynamic temperature T of the aqueous sample.

- id: thermal_energy
  name: thermal energy scale
  dimension: "[energy]"
  description: Boltzmann thermal energy k_B*T.

- id: persistence_length
  name: F-actin persistence length
  dimension: "[length]"
  description: Bending persistence length xi_A of filamentous actin.

- id: filament_diameter
  name: F-actin diameter
  dimension: "[length]"
  description: Cross-sectional diameter D_A of an F-actin filament.

- id: linear_charge_spacing
  name: axial spacing per elementary charge
  dimension: "[length]"
  description: Axial distance along F-actin per unit negative elementary charge (-1e).

- id: actin_mass_concentration
  name: F-actin mass concentration
  dimension: "[mass]/[length]**3"
  description: Mass concentration of F-actin in the experimental sample (condition quantity).

- id: barium_concentration
  name: barium ion concentration
  dimension: "[substance]/[length]**3"
  description: Concentration of divalent Ba2+ counterions added to condense F-actin (condition quantity).

- id: pH
  name: solution pH
  dimension: dimensionless
  description: Aqueous buffer pH (condition quantity).

- id: filament_length
  name: F-actin filament length
  dimension: "[length]"
  description: Mean gelsolin-regulated F-actin filament length (condition quantity).

- id: relative_saxs_intensity
  name: relative SAXS intensity
  dimension: dimensionless
  description: >
    Relative small-angle X-ray scattering intensity I(q)/I_0 calibrated in exact decades from
    the logarithmic vertical axis ticks on each SAXS panel (with I_0 = 1 defined at a specified
    reference major decade tick on the panel; in Fig. 2A, traces are vertically shifted for display).

- id: diffraction_peak_index
  name: diffraction peak index
  dimension: dimensionless
  description: >
    Ordinal integer index identifying a resolved SAXS diffraction peak within a given panel or
    curve (e.g. 1 = first-order peak, 2 = higher-order peak, or 1–4 = peaks i, j, k, l in Fig. 3F Inset).

