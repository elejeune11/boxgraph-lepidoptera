# Cross-record validation audit of angelini2003 models against independent measurements
# (and partner models against angelini2003 measurements) across the three remaining ready
# Wave 6 partner records (claessens2008, grason2007, tang1996).
# (Note: angelini2003+borukhov2005 and angelini2003+henle2005 were previously audited
# inside those partner records.)
#
# Result: 0 physically valid cross-record validations across these three pairs.
# Every pair was audited in both directions and recorded in angelini2003/questions.yaml:
#
# - angelini2003 + claessens2008 (see q_claessens2008_relate_validate_audit):
#   * angelini2003's runnable non-curve models compute 2D hexagonal equatorial Bragg ratios
#     (q_11 = sqrt(3)*q_10, q_20 = 2*q_10), 1D counterion CDW spatial period (2*pi/q_z),
#     36/17 charge-patch period (2*d_m), helical monomer angle (-2*pi*t/M), helical overtwist
#     Delta_theta = theta_1 - theta_0 (signed negative, from integer repeat transitions),
#     single-filament torsional twist energy (1/2)*kappa*(Delta_theta)^2/d (in J and k_B T),
#     and equipartition thermal rms twist sqrt(k_B*T*d/kappa).
#   * claessens2008's `origin: measured` datums are TEM bundle diameters D(R*), confined-ring
#     filament counts (n_f ~ 20, D_fil ~ 5-6), saturated plateau Rstar_plateau (~0.25),
#     multi-ABP diameter ratio (~3), first-order hexagonal q_10 = 0.585 nm^-1 (an input, not
#     a predicted higher-order peak; claessens2008 records NO measured q_11 or q_20 scalar
#     datum), axial helical layer lines (1.14-1.46 nm^-1; angelini2003's four-sphere
#     diffraction model is non-runnable), full SAXS intensity profiles I(q), and fascin-induced
#     overtwist curves Delta_theta(R*) (Fig. 3D, indexed by bound fascin ratio R*, which
#     angelini2003/helical_overtwist does not take as input, uses opposite sign convention,
#     and reflects fascin cross-linking rather than Ba2+ 1D CDW channels; claessens2008's
#     Delta_theta_max ~ 1 deg and aH_hex_saxs = 12.4 nm have origin: derived, and
#     E_twist_per_fascin_printed ~ 10 k_B T has origin: predicted).
#   * Conversely, claessens2008's neutral rigid fascin cross-linker models (K_d = 0.3 uM,
#     saturated 2-shell n_f ~ 20, 60-deg fascin-binding-site mismatch, per-fascin twist
#     energy) do not apply to angelini2003's multivalent Ba2+ counterion CDW bundles
#     (thousands of filaments, no fascin, 36/17 symmetry), and claessens2008/hexagonal_bragg_peaks
#     is identical (`same_as`) to angelini2003/hexagonal_equatorial_peaks already tested
#     internally in angelini2003/comparisons.yaml.
#
# - angelini2003 + grason2007 (see q_grason2007_relate_validate_audit):
#   * grason2007 is a pure continuum-elasticity theory paper with 0 `origin: measured` datums
#     in grason2007/data.yaml (its two experimental literature values, factin_diameter_lai2007
#     40-100 nm and factin_twist_pitch_ikawa2007 ~100 nm, have origin: reported and neither
#     quantity is predicted by any angelini2003 model).
#   * Conversely, all 29 `origin: measured` datums in angelini2003/data.yaml are SAXS peak
#     wavevectors q [1/angstrom] and relative SAXS intensity curves I(q)/I_0; none of
#     grason2007's 35 models outputs SAXS wavevectors or scattering intensities, and
#     angelini2003 reports no measured equilibrium bundle radius R_eq or whole-bundle
#     braiding pitch 2*pi/Omega.
#
# - angelini2003 + tang1996 (see q_tang1996_relate_validate_audit):
#   * tang1996's 58 `origin: measured` datums are 90-deg light-scattering curves and
#     divalent/polycation/calponin bundling onset thresholds (mM/uM); it measures zero SAXS
#     wavevectors, axial periods, or helical twist angles, so no angelini2003 model predicts
#     any tang1996 measurement.
#   * Conversely, tang1996 models smooth-cylinder Manning counterion condensation, polycation
#     binding mass balance, ionic-strength scaling, and gelsolin filament length; none outputs
#     SAXS wavevectors or intensities. angelini2003's b_linear_charge_spacing (~2.5 A) is an
#     `origin: reported` literature property (not measured), and its Ba2+ levels (36, 60, 72,
#     108 mM) are supra-threshold preparation conditions (not measured bundling-onset
#     thresholds, which tang1996's Manning models cannot predict for ion-specific divalents).
