id: extract_saxs_peak
name: extract individual SAXS diffraction peak wavevector from a digitized peak list
role: processing
from_words: true
stated:
  page: 3
  printed_page: "8636"
  quote: "The peak positions are 0.035 Å⫺1 (a), 0.062 Å⫺1 (b),"
  where: "Fig. 3 caption"
equation: "q_peak = peaks(index = peak_index)"
inputs:
  peaks:
    quantity: scattering_wavevector
    unit: 1/angstrom
    curve:
      quantity: diffraction_peak_index
      unit: dimensionless
    description: Digitized list of resolved SAXS peak wavevectors indexed by ordinal peak index
outputs:
  q_peak:
    quantity: scattering_wavevector
    unit: 1/angstrom
    description: Scattering wavevector of the selected diffraction peak
settings:
  peak_index: 1
stochastic: false
