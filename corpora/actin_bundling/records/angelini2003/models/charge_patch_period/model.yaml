id: charge_patch_period
name: F-actin negative-charge-patch period along one filament side
role: model
from_words: true
stated: {page: 4, printed_page: "8637", quote: "the monomer spacing on a single filament, d ⫽ 57.4 Å, which is", where: text}
equation: "d = 2 * d_m"
inputs:
  d_m: {quantity: monomer_spacing, unit: angstrom, description: "Axial spacing between adjacent actin monomers"}
outputs:
  d: {quantity: axial_spatial_period, unit: angstrom, description: "Period of negative-charge patches along a 36/17 filament (twice the monomer spacing)"}
settings: {}
stochastic: false
