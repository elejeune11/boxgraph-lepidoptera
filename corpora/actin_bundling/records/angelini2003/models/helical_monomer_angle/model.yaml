id: helical_monomer_angle
name: azimuthal rotation angle between adjacent monomers on an M/t helix
role: model
stated: {page: 3, printed_page: "8636", quote: "adjacent monomers on a 13兾6 helix is given by ⫺6*2␲兾13, or", where: text}
equation: "theta = -t * 2*pi / M"
inputs:
  M: {quantity: helical_repeat_monomers, unit: dimensionless, description: "Number of monomers in one crystallographic helical repeat"}
  t: {quantity: helical_repeat_turns, unit: dimensionless, description: "Number of full turns in one crystallographic helical repeat"}
outputs:
  theta: {quantity: monomer_twist_angle, unit: rad, description: "Azimuthal twist angle between adjacent monomers"}
settings: {}
stochastic: false
