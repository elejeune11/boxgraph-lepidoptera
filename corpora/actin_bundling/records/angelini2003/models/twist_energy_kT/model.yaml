id: twist_energy_kT
name: torsional twist energy per actin monomer in units of k_B T
role: model
built_from: [twist_energy_per_monomer, thermal_energy_scale]
stated: {page: 4, printed_page: "8637", quote: "(Etwist ⫽ 1⁄2␬ ⌬␪2d⫺1 ⫽ 1.6 kT, ␬ ⬇ 8 ⫻ 10⫺26 Nm2) (19).", where: text}
equation: "E_twist_kT = ((1/2) * kappa * (Delta_theta)^2 * d^(-1)) / (k_B * T)"
inputs:
  kappa: {quantity: torsional_modulus, unit: N*m^2, description: "Torsional modulus of F-actin"}
  Delta_theta: {quantity: monomer_overtwist, unit: rad, description: "Twist angle per monomer"}
  d: {quantity: monomer_spacing, unit: angstrom, description: "Axial spacing per monomer along F-actin"}
  T: {quantity: temperature, unit: K, description: "Absolute temperature"}
outputs:
  E_twist_kT: {quantity: twist_energy_kT, unit: dimensionless, description: "Torsional twist energy per monomer in units of k_B T"}
settings: {}
stochastic: false
