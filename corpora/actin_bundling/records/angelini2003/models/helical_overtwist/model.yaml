id: helical_overtwist
name: helical overtwist per monomer between two M/t symmetries
role: model
from_words: true
built_from: [helical_monomer_angle]
stated: {page: 3, printed_page: "8636", quote: "is ⫺170°, which indicates an additional twist of ⫺3.8° per", where: text}
equation: "Delta_theta = (-t_1 * 2*pi / M_1) - (-t_0 * 2*pi / M_0)"
inputs:
  M_0: {quantity: helical_repeat_monomers, unit: dimensionless, description: "Native helical repeat monomers (13)"}
  t_0: {quantity: helical_repeat_turns, unit: dimensionless, description: "Native helical repeat turns (6)"}
  M_1: {quantity: helical_repeat_monomers, unit: dimensionless, description: "Overtwisted helical repeat monomers (36)"}
  t_1: {quantity: helical_repeat_turns, unit: dimensionless, description: "Overtwisted helical repeat turns (17)"}
outputs:
  Delta_theta: {quantity: monomer_overtwist, unit: rad, description: "Additional twist per monomer from M_0/t_0 to M_1/t_1 symmetry"}
settings: {}
stochastic: false
