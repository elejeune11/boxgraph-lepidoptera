id: thermal_rms_twist
name: thermal rms twist fluctuation of F-actin via equipartition theorem
role: model
from_words: true
built_from: [twist_energy_per_monomer, thermal_energy_scale]
stated: {page: 4, printed_page: "8637", quote: "tition theorem, the rms twist of F-actin at room temperature just", where: text}
equation: "Delta_theta_rms = sqrt(k_B * T * d / kappa)"
inputs:
  kappa: {quantity: torsional_modulus, unit: N*m^2, description: "Torsional modulus of F-actin"}
  d: {quantity: monomer_spacing, unit: angstrom, description: "Axial spacing per monomer along F-actin"}
  T: {quantity: temperature, unit: K, description: "Absolute temperature"}
outputs:
  Delta_theta_rms: {quantity: thermal_rms_twist, unit: rad, description: "Root-mean-square thermal twist fluctuation per monomer"}
settings: {}
stochastic: false
