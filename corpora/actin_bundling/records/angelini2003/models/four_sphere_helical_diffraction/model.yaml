id: four_sphere_helical_diffraction
name: partially powder-averaged four-sphere helical diffraction model with mosaic smearing (Fig. 3)
role: fit
described_from: ref-15
runnable: false
not_runnable_reason: >
  The paper states that 2D SAXS layer-line positions and FWHM are computed from the Fourier transform
  of the four-sphere F-actin model (Al-Khayat et al. 1995 [ref-15]) using Holmes coordinates (Holmes
  et al. 1990 [ref-14]) combined with Gaussian layer-line profiles (Tibbits & Caspar 1993 [ref-16])
  and partial powder averaging (pi/2 >= chi >= pi/4) plus bundle mosaic smearing, but does not print
  the four-sphere coordinates/radii/weights, Gaussian layer-line widths, or mosaic orientation
  distribution function and angular spread.
stated: {page: 2, printed_page: "8635", quote: "four-sphere model (15) for the actin filament, using the Holmes", where: text}
inputs:
  d_m: {quantity: monomer_spacing, unit: angstrom, description: "Actin monomer axial spacing (varied in 0.1 Å increments)"}
  M: {quantity: helical_repeat_monomers, unit: dimensionless, description: "Monomers per helical repeat"}
  t: {quantity: helical_repeat_turns, unit: dimensionless, description: "Turns per helical repeat"}
outputs:
  q_z: {quantity: scattering_wavevector, unit: 1/angstrom, description: "Mosaic-smeared meridional layer-line peak positions"}
settings:
  d_m_increment_angstrom: 0.1
  twist_scan_range_deg: 10.0
  twist_scan_increment_deg: 0.05
  max_repeat_checked: "108/51"
  chi_integration_range_rad: [0.7853981633974483, 1.5707963267948966]
stochastic: false
