    Cross-record ModelAtlas, citation, and validation audit for angelini2003 + tang1996
    (neither paper cites the other; 0 ModelAtlas relations, 0 cited.yaml links, 0 cross-validations).
    (1) Citation & shared F-actin parameters (cited.yaml): tang1996 precedes angelini2003 by
    7 years, and angelini2003/references.yaml does not cite tang1996 (J. Biol. Chem.
    271:8556-8563; Angelini cites only later Tang collaborations ref-5 Lyubartsev et al. 1998
    and ref-25 Butler et al. 2003, plus Manning 1978 [ref-11] qualitatively on p. 1). Although
    angelini2003 reports an unreferenced linear charge spacing b_linear_charge_spacing ≈ 2.5 Å
    at pH 7 (p. 1) matching tang1996's derived b_actin = 2.5 Å at pH 7.2 (p. 4), there is no
    citation link in data.yaml or references.yaml. Note also that tang1996's monomer density
    370 monomers/um (p. 2) corresponds to 27.03 Å/monomer, 5.8% below angelini2003's SAXS-fitted
    d_monomer_extracted = 28.7 Å (p. 3).
    (2) ModelAtlas (0 relations): The two papers' mathematical model sets are completely
    disjoint. tang1996 models F-actin as a smooth uniformly charged cylinder under mean-field
    Manning counterion condensation (Bjerrum length, zeta = lambda_B/b, Eq. 1 condensation
    fraction, Eq. 2 condensation volume, Eq. 3 salt scaling, Appendix Eq. 4 polycation binding
    mass balance, and gelsolin filament contour length), whereas angelini2003 investigates
    discrete structural ordering inside the condensed counterion layer via SAXS (2D hexagonal
    Bragg ratios, 1D CDW spatial period 2*pi/q_z, 36/17 charge-patch period, helical monomer
    angles/overtwist, and single-filament torsional elasticity/equipartition).
    (3) Cross-validation (0 valid): All 58 origin: measured datums in tang1996 are 90-deg
    light-scattering curves and divalent/polycation/calponin bundling onset thresholds (mM/uM),
    none of which is predicted by any angelini2003 model. Conversely, all 29 origin: measured
    datums in angelini2003 are SAXS wavevectors q [1/angstrom] and relative SAXS intensity
    curves I(q)/I_0, none of which is predicted by any tang1996 model; angelini2003's
    b_linear_charge_spacing (≈ 2.5 Å) is an origin: reported literature value rather than a
    measurement, and its Ba2+ levels (36, 60, 72, 108 mM) are supra-threshold preparation
    conditions rather than measured bundling-onset thresholds (which tang1996's Manning models
    cannot predict for ion-specific divalent cations).



