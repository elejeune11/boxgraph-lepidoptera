- id: q_twist_energy_order_of_magnitude
  kind: possible_error
  about:
    - twist_energy_per_monomer
    - twist_energy_kT
    - E_twist_printed
    - kappa_torsional_modulus
    - d_monomer_extracted
    - Delta_theta_overtwist_printed
    - cmp_twist_energy_kT_printed_dtheta
    - cmp_twist_energy_kT_chained_dtheta
  citation: {page: 4, printed_page: "8637", quote: "(Etwist ⫽ 1⁄2␬ ⌬␪2d⫺1 ⫽ 1.6 kT, ␬ ⬇ 8 ⫻ 10⫺26 Nm2) (19).", where: text}
  text: >
    Evaluating the paper's printed formula E_twist = (1/2)*kappa*(Delta_theta)^2*d^(-1) with the
    printed torsional modulus kappa ≈ 8 x 10^-26 N*m^2 (Tsuda et al., ref-19), overtwist
    Delta_theta = -3.8 deg per monomer (-0.06632 rad; or -3.846 deg exact from 36/17 vs 13/6),
    and extracted monomer spacing d = 28.7 Å = 2.87 x 10^-9 m (p. 3) gives E_twist = 6.130 x 10^-20 J,
    which at room temperature T = 298.15 K (k_B T = 4.116 x 10^-21 J) is 14.89 k_B T per monomer
    (15.26 k_B T using unrounded -3.846 deg; 14.80-15.15 k_B T across T = 293.15-300 K; 15.54 k_B T
    with standard Holmes spacing 27.5 Å) — roughly 9.3x larger than the printed 1.6 kT (not reproduced).
    Even if the symbol d on p. 4 col. 1 line 59 were interpreted as the charge-patch period d = 57.4 Å
    defined 36 lines earlier on p. 4 (twice the monomer spacing), E_twist = 7.45 k_B T (still 4.7x larger
    than 1.6 kT, and physically a 2-monomer segment twists by 2*Delta_theta = 7.6 deg, giving 29.8 k_B T
    per dimer = 14.9 k_B T per monomer). A factor-of-~10 arithmetic error reproduces 1.5-1.6 k_B T
    (e.g. treating d = 27.5-28.7 Å as 27.5-28.7 nm gives 1.55-1.49 k_B T; entering kappa = 8 x 10^-27 N*m^2
    gives 1.49-1.55 k_B T; or omitting pi in converting degrees to radians via (3.8/180)^2 divides by
    pi^2 = 9.87 and gives 1.51-1.57 k_B T). The true ~15 k_B T per monomer penalty weakens the qualitative
    conclusion that twisting F-actin by 3.8 deg/monomer has a "relatively small" energetic cost.

- id: q_thermal_rms_twist_and_equipartition
  kind: possible_error
  about:
    - thermal_rms_twist
    - Delta_theta_rms_printed
    - E_twist_printed
    - kappa_torsional_modulus
    - d_monomer_extracted
    - T_room_added
    - cmp_thermal_rms_twist
  citation: {page: 4, printed_page: "8637", quote: "from thermal fluctuations is ⬇3°.", where: text}
  text: >
    By the equipartition theorem for a harmonic torsional degree of freedom of monomer length
    d = 28.7 Å, (1/2)*(kappa/d)*<Delta_theta^2> = (1/2)*k_B*T yields
    Delta_theta_rms = sqrt(k_B*T*d/kappa) = 0.01215 rad = 0.696 deg per monomer at T = 298.15 K
    (0.690-0.698 deg across 293.15-300 K; 0.985 deg even at d = 57.4 Å) — about 4.3x smaller than
    the paper's printed ≈ 3 deg. Furthermore, independent of kappa and d, the paper's two adjacent
    printed claims E_twist(3.8 deg) = 1.6 kT and Delta_theta_rms ≈ 3 deg are mutually inconsistent
    under 1-DOF equipartition ((1/2)*k_B*T), which requires
    Delta_theta_rms = Delta_theta / sqrt(2 * E_twist / k_B T) = 3.8 / sqrt(3.2) = 2.12 deg; only
    omitting the 1/2 in equipartition (setting E_twist = k_B T) gives 3.8 / sqrt(1.6) = 3.00 deg.
    Achieving Delta_theta_rms = 3 deg from true equipartition with kappa = 8 x 10^-26 N*m^2 requires
    a segment length of d ≈ 533 Å (~18.6 monomers), not one monomer.

