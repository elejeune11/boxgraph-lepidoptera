# Core reproduction comparisons (paper's own derived values from its own formulas & inputs)
- id: cmp_figS10_spacing_from_freq
  purpose: reproduction
  computed: figS10_spacing_pred
  printed: figS10_ridge_spacing
  note: "SI Fig. S10D (41% dev): 1 / 0.684 um^-1 = 1.46199 um vs printed 1.4618 um; reproduced when 3-sig-fig input rounding on freq (0.684 +/- 0.0005, 1/1.4618 = 0.684088) is propagated."

- id: cmp_figS11_spacing_from_freq
  purpose: reproduction
  computed: figS11_spacing_pred
  printed: figS11_ridge_spacing
  note: "SI Fig. S11B (61% dev): 1 / 0.540 um^-1 = 1.85185 um directly reproduces printed 1.85 um."

# Developmental timing and cross-figure consistency comparisons
- id: cmp_fig2G_dev_pct_typical
  purpose: consistency
  computed: fig2G_dev_pct_from_10d
  printed: fig2G_dev_fraction
  note: "8.12 d / 10 d = 81.2% vs printed 83% for the Fig. 2G specimen, reflecting specimen-specific generation duration (9.78 d vs typical ~10 d, within stated <=2 d variation)."

- id: cmp_fig2G_implied_duration
  purpose: consistency
  computed: fig2G_implied_T_pupal
  printed: pupal_duration_typical
  note: "Implied generation duration for Fig. 2G (9.783 d) compared with typical ~10 d (no precision on 'about 10 d')."

- id: cmp_fig5_implied_duration_35
  purpose: consistency
  computed: fig5_implied_T_pupal_35
  printed: pupal_duration_typical
  note: "Implied generation duration for Fig. 5 specimen from 100 h / 35% (11.90 d) compared with typical ~10 d (within stated <=2 d variation)."

- id: cmp_fig5_implied_duration_40
  purpose: consistency
  computed: fig5_implied_T_pupal_40
  printed: pupal_duration_typical
  note: "Implied generation duration for Fig. 5 specimen from 114 h / 40% (11.88 d) compared with typical ~10 d (within stated <=2 d variation; paired with cmp_fig5_implied_duration_35)."

- id: cmp_fig5_end_pct_consistency
  purpose: consistency
  computed: fig5_end_pct_chained
  printed: fig5_key_window_end_pct
  note: "Chained internal consistency of p. 5 window ('roughly 35 to 40%' <-> 'around 100 h to 114 h'): 114 h at T_pupal(100 h, 35%) yields 39.90% vs roughly 40%."

- id: cmp_figS7A_vs_fig4D_dev_fraction
  purpose: consistency
  computed: figS7A_dev_fraction
  printed: fig4D_dev_fraction
  note: "SI Fig. S7A explicitly notes 'this image is the same image as Fig. 4D'; checks that 17.8% rounds to printed 18%."

# Optical and phase-gradient consistency & reconstructed stand-in comparisons
- id: cmp_rayleigh_lateral_resolution
  purpose: approximation
  computed: rayleigh_lat_res_pred
  printed: lateral_resolution_theoretical
  note: "Reconstructed Rayleigh formula 0.61 * 800 nm / 1.0 = 488.0 nm vs printed 490 nm (ref-37; matches to 2 significant figures, 0.4% difference)."

- id: cmp_figS2_grad_mag_bound
  purpose: consistency
  computed: figS2_grad_mag_diag_pred
  printed: figS2F_phase_grad_mag_max
  note: "2D gradient magnitude at the Fig. S2C-D axis ceiling (40, 40) rad/um gives 56.57 rad/um vs 60 rad/um top tick in Fig. S2F (consistent with a 1024-px 75-um FOV giving max single-axis ~42.9 rad/um and diagonal ~60.7 rad/um)."

# Digitized figure reproductions (SI Fig. S10B-D, Fig. 5B, Fig. 5C-F)
- id: cmp_fft1d_figS10c_freq
  purpose: reproduction
  computed: figS10c_fft_freq_pred
  printed: figS10_dominant_freq
  note: "Mean-subtracted 1D FFT of digitized SI Fig. S10C gives 0.6591 um^-1 vs printed 0.684 um^-1 (-3.64%, not reproduced), confirming q_audit_fft_dc_and_findpeaks that removing DC eliminates the sinc-sidelobe shift visible in Fig. S10D."

- id: cmp_fft1d_figS10c_spacing
  purpose: reproduction
  computed: figS10c_fft_spacing_pred
  printed: figS10_ridge_spacing
  note: "Mean-subtracted 1D FFT spacing of digitized SI Fig. S10C gives 1.5172 um vs printed 1.4618 um (+3.79%, not reproduced)."

- id: cmp_fft1d_uncentered_figS10c_freq
  purpose: reproduction
  computed: figS10c_fft_unc_freq_pred
  printed: figS10_dominant_freq
  note: "Uncentered 1D FFT variant (retaining the nonzero DC peak shown in SI Fig. S10D, n_uniform=79) on digitized SI Fig. S10C gives 0.6784 um^-1 vs printed 0.684 um^-1 (-0.81%, 4.5x closer than mean-subtracted; outside 3-sig-fig rounding due to raster trace uncertainty)."

- id: cmp_fft1d_uncentered_figS10c_spacing
  purpose: reproduction
  computed: figS10c_fft_unc_spacing_pred
  printed: figS10_ridge_spacing
  note: "Uncentered 1D FFT variant spacing on digitized SI Fig. S10C gives 1.4740 um vs printed 1.4618 um (+0.83%)."

- id: cmp_fft1d_fig5b_freq
  purpose: consistency
  computed: fig5b_fft_freq_pred
  printed: figS10_dominant_freq
  note: "Mean-subtracted 1D FFT on digitized Fig. 5B bottom (same 41% trace as SI Fig. S10C) gives 0.6616 um^-1 vs printed 0.684 um^-1 (-3.27%)."

- id: cmp_fft1d_uncentered_fig5b_freq
  purpose: consistency
  computed: fig5b_fft_unc_freq_pred
  printed: figS10_dominant_freq
  note: "Uncentered 1D FFT variant on digitized Fig. 5B bottom (same 41% trace as SI Fig. S10C) gives 0.6777 um^-1 vs printed 0.684 um^-1 (-0.92%)."

- id: cmp_rot_peaks_figS10b_height
  purpose: consistency
  computed: figS10b_mean_height_pred
  printed: fig5B_protoridge_height
  note: "OLS slope-flattening rotation (-0.01633 rad = -0.936 deg) and trough-baseline peak height on digitized unrotated SI Fig. S10B gives mean 90.8 nm (SD 6.6 nm) vs caption 'about 100 nm' (and matches the 41.0% pooled mean 89.2 nm in Fig. 5H to 1.9%)."

- id: cmp_rot_peaks_fig5b_height
  purpose: reproduction
  computed: fig5b_mean_height_pred
  printed: fig5B_protoridge_height
  note: "Trough-baseline peak height on digitized Fig. 5B bottom gives mean 87.6 nm (SD 5.8 nm) vs caption 'about 100 nm'."

- id: cmp_bounding_box_fig5f_vol
  purpose: reproduction
  computed: fig5f_vol_pct_pred
  printed: fig5f_volume_mean_data
  note: "Reproduces the Fig. 5F mean relative volume curve (%) from digitized Fig. 5C-E mean L(t), W(t), T(t) via V = L*W*T normalized to max=100% (verdict: close; 5 of 6 timepoints reproduced within reading intervals and 47.0% within +1.51 pp due to averaging L, W, T before vs after multiplying across n=2 scales)."

- id: cmp_bounding_box_fig5f_surf
  purpose: reproduction
  computed: fig5f_surf_pct_pred
  printed: fig5f_surface_mean_data
  note: "Reproduces the Fig. 5F mean relative surface area curve (%) from digitized Fig. 5C-E mean L(t), W(t), T(t) via S = 2*(LW+LT+WT) normalized to max=100% across all 6 timepoints (verdict: reproduced, 6/6 timepoints within 0.05-0.46 pp)."
