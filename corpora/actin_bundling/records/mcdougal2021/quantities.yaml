# Optical, microscopy, and phase-imaging quantities
- id: laser_wavelength
  name: illumination center wavelength
  dimension: "[length]"
  description: Center wavelength lambda_0 of the bandpass-filtered supercontinuum illumination used in speckle-correlation reflection phase microscopy.

- id: laser_bandwidth
  name: illumination spectral bandwidth
  dimension: "[length]"
  description: Spectral bandwidth Delta_lambda passed by the bandpass filter for the supercontinuum laser source.

- id: objective_numerical_aperture
  name: objective lens numerical aperture
  dimension: "dimensionless"
  description: Numerical aperture NA of the water-dipping microscope objective (Olympus LUMPLFLN 60XW).

- id: objective_magnification
  name: objective lens magnification
  dimension: "dimensionless"
  description: Nominal optical magnification of the microscope objective lens.

- id: fluid_refractive_index
  name: biological fluid refractive index
  dimension: "dimensionless"
  description: Refractive index n of the biological fluid above the developing wing tissue used to match optical path length in the reference arm.

- id: optical_lateral_resolution
  name: microscope lateral spatial resolution
  dimension: "[length]"
  description: Theoretical lateral spatial resolution of speckle-correlation reflection phase microscopy.

- id: optical_axial_resolution
  name: microscope axial spatial resolution
  dimension: "[length]"
  description: Theoretical axial (depth-sectioning) resolution of speckle-correlation reflection phase microscopy.

- id: surface_height_sensitivity
  name: interferometric surface height sensitivity
  dimension: "[length]"
  description: Sensitivity of 1D phase line profiles to nanoscale variations in scale surface height.

- id: camera_frame_rate
  name: interferogram camera frame rate
  dimension: "1 / [time]"
  description: Maximum acquisition frame rate of the off-axis holography camera (Point Gray Flea3).

- id: axial_step_size
  name: axial z-scan step size
  dimension: "[length]"
  description: Step size Delta_z of the motorized sample stage along the optical axis when scanning volumetric image stacks.

- id: axial_scan_depth
  name: axial scan or volumetric image depth
  dimension: "[length]"
  description: Total axial scan depth, cropped volumetric depth thickness, maximum-projection depth, or apical-to-basal depth offset along the optical axis.

- id: axial_step_count
  name: number of axial z-scan steps
  dimension: "dimensionless"
  description: Number of discrete z-scan intervals N_z = depth / Delta_z spanning an axial scan or volumetric depth.

- id: lateral_fov_dimension
  name: lateral imaging field-of-view dimension
  dimension: "[length]"
  description: Lateral width or height of the imaged tissue region (field of view) in the x-y focal plane.

- id: coverslip_thickness
  name: glass coverslip thickness
  dimension: "[length]"
  description: Thickness of the No. 1 glass coverslip placed over the surgically exposed wing tissue (and matched in the gold-coated reference coverslip).

- id: surgical_window_dimension
  name: forewing surgical window lateral dimension
  dimension: "[length]"
  description: Approximate lateral dimension of the shallow cuticle incision made over the forewing during single-timepoint pupal surgery.

- id: deconvolution_iterations
  name: Lucy-Richardson deconvolution iteration count
  dimension: "dimensionless"
  description: Number of iterations of Lucy-Richardson deconvolution applied to reflected amplitude stacks using the theoretically estimated PSF.

- id: roi_area_fraction
  name: central slice area fraction for depth intensity profile
  dimension: "dimensionless"
  description: Fraction of each image slice area integrated in the central region to generate the depth intensity profile in SI Fig. S3B.

- id: optical_phase
  name: unwrapped optical phase
  dimension: "dimensionless"
  description: Continuous unwrapped interferometric phase phi_unwrapped (in radians) encoding surface height variations of a scale cell.

- id: wrapped_optical_phase
  name: wrapped optical phase
  dimension: "dimensionless"
  description: Interferometric phase phi_wrapped = W phi_unwrapped wrapped onto the interval (-pi, pi] radians.

- id: phase_wrap_integer
  name: phase wrapping integer multiplier
  dimension: "dimensionless"
  description: Integer k(n) in W phi(n) = phi(n) + 2*pi*k(n) ensuring -pi < W phi(n) <= pi (Eq. 2).

- id: wrapped_phase_difference
  name: wrapped discrete phase difference
  dimension: "dimensionless"
  description: Wrapped nearest-neighbor phase difference W Delta phi_wrapped(n) along one pixel step (Eq. 4, radians).

- id: optical_phase_gradient
  name: lateral wrapped optical phase gradient component
  dimension: "1 / [length]"
  description: Component of the wrapped optical phase gradient (g_x or g_y, in rad/um) encoding local surface slope along x or y (SI Fig. S2C-D).

- id: optical_phase_gradient_magnitude
  name: 2D optical phase gradient magnitude
  dimension: "1 / [length]"
  description: Euclidean norm sqrt(g_x^2 + g_y^2) of the 2D wrapped optical phase gradient (in rad/um, SI Fig. S2F).

- id: slope_orientation_angle
  name: local surface slope orientation angle
  dimension: "dimensionless"
  description: Azimuthal direction atan2(g_y, g_x) of the 2D phase gradient indicating local downhill surface tilt orientation (Fig. 2I, SI Fig. S2E).

- id: reflected_field_amplitude
  name: reflected optical field amplitude
  dimension: "dimensionless"
  description: Reconstructed interferometric reflection amplitude A (arbitrary units) at a point in the tissue volume.

- id: reflected_intensity
  name: reflected optical intensity
  dimension: "dimensionless"
  description: Reflected light intensity I = A^2 (arbitrary units) plotted on a log scale versus depth in SI Fig. S3B and G.

# Butterfly scale geometry, actin/ridge structure, and surface profile quantities
- id: lateral_distance
  name: lateral distance along scale surface profile
  dimension: "[length]"
  description: Coordinate x along a 1D line trace across or along the butterfly scale surface.

- id: surface_height
  name: scale surface height
  dimension: "[length]"
  description: Local out-of-plane surface height h(x) of a developing or mature butterfly scale derived from reflection phase microscopy.

- id: ridge_peak_height
  name: ridge or proto-ridge peak height
  dimension: "[length]"
  description: Height of a scale ridge or proto-ridge peak above the line connecting its two adjacent troughs (mean or individual peak height).

- id: ridge_peak_height_perpendicular
  name: perpendicular ridge peak height to trough-connecting line
  dimension: "[length]"
  description: Orthogonal Euclidean distance from a surface profile peak (x_P, h_P) to the line connecting adjacent troughs (x_L, h_L) and (x_R, h_R).

- id: ridge_peak_height_sd
  name: ridge peak height standard deviation
  dimension: "[length]"
  description: Sample standard deviation (per-profile or pooled) of ridge peak heights across a scale profile or across multiple profiles at a timepoint.

- id: profile_tilt_angle
  name: surface profile best-fit tilt angle
  dimension: "dimensionless"
  description: Angle arctan(m) of the linear best-fit slope of an unwrapped 1D surface height profile before flattening rotation (SI Fig. S10B-C).

- id: dominant_spatial_frequency
  name: dominant ridge or actin spatial frequency
  dimension: "1 / [length]"
  description: Dominant spatial frequency freq = s^-1 extracted from 1D (phase profile) or 2D (amplitude image) Fourier analysis (SI Figs. S10D, S11B).

- id: ridge_or_actin_spacing
  name: scale ridge or actin bundle periodic spacing
  dimension: "[length]"
  description: Periodic lateral spacing s = 1 / freq between longitudinal sub-membrane actin bundles or forming/mature cuticular scale ridges.

- id: scale_lower_lamina_thickness
  name: mature scale lower lamina thickness
  dimension: "[length]"
  description: Thickness of the thin chitinous lower lamina of a mature Vanessa cardui butterfly scale.

- id: scale_length
  name: developing cover scale length
  dimension: "[length]"
  description: Length L of a developing cover scale measured along its primary distal plane from the distal tip to the wing surface plane (Fig. 5C, SI Fig. S9C).

- id: scale_width
  name: developing cover scale width
  dimension: "[length]"
  description: Width W of a developing cover scale measured toward the distal tip where the lateral edges become nearly straight (Fig. 5D, SI Fig. S9B).

- id: scale_thickness
  name: developing cover scale thickness
  dimension: "[length]"
  description: Thickness T of a developing cover scale measured in the width-measurement region away from thinner scale edges (Fig. 5E, SI Fig. S9B).

- id: scale_tip_height_above_wing
  name: scale distal tip perpendicular height above wing plane
  dimension: "[length]"
  description: Perpendicular distance z_tip from the distal tip of a developing scale to the plane of the wing surface in the longitudinal plane-extrapolation geometry (SI Fig. S9C).

- id: scale_inclination_angle
  name: scale inclination angle relative to wing plane
  dimension: "dimensionless"
  description: Angle theta between the primary longitudinal plane of a developing cover scale and the wing surface plane (SI Fig. S9C).

- id: scale_bounding_box_volume
  name: scale presumptive bounding-box volume
  dimension: "[length]**3"
  description: Estimated developing scale volume V = L * W * T defined by the rectangular bounding box of measured length, width, and thickness (Fig. 5F).

- id: scale_bounding_box_surface_area
  name: scale presumptive bounding-box surface area
  dimension: "[length]**2"
  description: Estimated developing scale surface area S = 2 * (L*W + L*T + W*T) defined by the rectangular bounding box of measured length, width, and thickness (Fig. 5F).

- id: wing_tissue_displacement
  name: vertical wing tissue displacement during apolysis
  dimension: "[length]"
  description: Vertical retraction drop or subsequent upward return distance of the hindwing epithelial tissue relative to the peripodial membrane/coverslip (SI Fig. S3).

# Developmental timing, rearing, surgery, and sampling counts
- id: pupal_stage_duration
  name: total pupal stage duration
  dimension: "[time]"
  description: Total elapsed time T_pupal from pupation (0% development) to adult eclosion (100% development) for Vanessa cardui.

- id: pupal_stage_duration_variation
  name: inter-individual variation in pupal stage duration
  dimension: "[time]"
  description: Maximum typical variation (+/- up to 2 d) in total pupal stage duration across V. cardui individuals/generations.

- id: elapsed_pupal_time
  name: elapsed time since pupation
  dimension: "[time]"
  description: Absolute elapsed time t after larval-pupal molting for a given developmental stage or specimen.

- id: pupal_development_fraction
  name: normalized pupal developmental progress
  dimension: "dimensionless"
  description: Percentage of pupal development p_dev = 100% * t / T_pupal normalized to the generation's average pupal duration.

- id: rearing_temperature
  name: laboratory butterfly rearing temperature
  dimension: "[temperature]"
  description: Ambient laboratory temperature at which V. cardui butterflies were reared (SI p. 10).

- id: protocol_time_interval
  name: experimental protocol time duration or interval
  dimension: "[time]"
  description: Duration or sampling interval in rearing, anesthesia, surgery, or imaging protocols (e.g., molt timing precision, CO2 anesthesia, imaging cycle interval).

- id: scale_sample_count
  name: number of measured scales
  dimension: "dimensionless"
  description: Number of individual scales measured per timepoint for error-bar quantification (Fig. 5).

- id: peak_count
  name: number of ridge peaks in a surface profile
  dimension: "dimensionless"
  description: Count n_i of detected ridge peaks within an individual 1D surface height profile used for pooled mean and pooled SD calculations.

- id: geometric_point_count
  name: number of landmark points for geometric plane/line fit
  dimension: "dimensionless"
  description: Number of manually selected 3D points defining a line along the scale (2 points) or the wing surface plane (3 points) in Dragonfly (SI Fig. S9C).

# Digitized figure quantities (SI Fig. S10D, Fig. 5F)
- id: fft_profile_magnitude
  name: 1D FFT magnitude of scale surface height profile
  dimension: "[length]"
  description: Unnormalized 1D discrete Fourier transform magnitude |FFT(h)| (in nm) of a flattened butterfly scale surface height profile as a function of spatial frequency (SI Fig. S10D).

- id: scale_bounding_box_volume_pct
  name: relative scale bounding-box volume (% of maximum)
  dimension: "dimensionless"
  description: Developing cover scale presumptive bounding-box volume V = L*W*T expressed as a percentage of the maximum timepoint mean volume (Fig. 5F).

- id: scale_bounding_box_surface_area_pct
  name: relative scale bounding-box surface area (% of maximum)
  dimension: "dimensionless"
  description: Developing cover scale presumptive bounding-box surface area S = 2*(L*W + L*T + W*T) expressed as a percentage of the maximum timepoint mean surface area (Fig. 5F).
