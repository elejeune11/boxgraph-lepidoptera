notes: >
  Full quantitative reading of McDougal et al. (2021), covering the main PNAS article
  (PDF pp. 1-8, including Materials and Methods and References 1-48) and 100% of the
  Supplementary Information (PDF pp. 9-25: Detailed Methods and Materials, Figs. S1-S11,
  Movie S1-S5 legends, and SI References 1-13).

  Scope included:
  - All optical and phase-imaging equations and processing pipelines: phase wrapping operator
    W (Eqs. 1-2, p. 7 & SI p. 11), 1D Itoh phase unwrapping (Eq. 3, p. 7 & SI p. 11, curve-port
    model ready for digitized profiles), discrete local wrapped phase gradient (Eq. 4, p. 7 &
    SI p. 11), 2D phase gradient magnitude and slope orientation (SI Fig. S2C-F), intensity from
    amplitude squared I = A^2 (SI Fig. S3B), axial scan step count N_z = depth / dz, reconstructed
    double-pass reflection phase-to-height conversion h = phi * lambda_0 / (4 * pi * n),
    reconstructed Rayleigh lateral resolution 0.61 * lambda_0 / NA, and non-runnable theoretical
    dynamic-speckle PSF / 10-iteration Lucy-Richardson deconvolution (refs. 37, 45).
  - All butterfly scale ridge spacing, height, growth kinetics, and statistical analysis models:
    spacing from dominant spatial frequency s = 1 / freq (SI Figs. S10D & S11B), zero-padded 1D
    FFT dominant frequency extraction (SI p. 11 & Fig. S10D, curve-port model), 1D trough-to-trough
    baseline peak height definition (vertical and perpendicular distances, p. 7 & SI p. 11, Fig.
    S10C), 1D best-fit slope rotation + peak/trough extraction pipeline (curve-port model),
    pooled mean and pooled SD across multiple profiles (both total combined sample SD and within-
    group ANOVA pooled SD), scale bounding-box volume V = L*W*T and surface area S = 2*(LW+LT+WT)
    (p. 5, p. 7, SI p. 11), longitudinal plane-extrapolation scale length L = z_tip / sin(theta)
    (SI p. 11 & Fig. S9C), pupal development percentage conversion p_dev = 100 * t / T_pupal and
    its inverse T_pupal = t / (p_dev / 100), and non-runnable 2D FFT actin/ridge spacing extraction
    on raw 3D amplitude stacks (SI Fig. S11, Zenodo ref-48).
  - Every printed quantitative parameter, optical specification, surgical/rearing condition,
    developmental timing checkpoint, apical-to-basal depth table (SI Fig. S4), and FFT frequency/
    spacing pair across all 25 PDF pages.

  Key reading and consistency findings:
  1. SI Fig. S10D (p. 23, 41% dev) prints freq = 0.684 um^-1 and s = 1.4618 um; direct reciprocal
     1/0.684 = 1.46199 um differs by 0.00019 um from 4-decimal 1.4618 um, reproduced once the
     3-sig-fig rounding of printed freq (0.684 +/- 0.0005, since 1/1.4618 = 0.684088) is propagated.
     SI Fig. S11B (p. 24, 61% dev) prints freq = 0.540 um^-1 and s = 1.85 um; 1/0.540 = 1.8519 um
     reproduces 1.85 um directly.
  2. Every reported axial depth and apical-basal offset across the entire main paper and SI (3.2,
     6, 8.0, 12.0, 15.6, 16, 16.8, 24.4, 86, 130, 200 um) is an exact integer multiple of the
     400 nm axial z-step (8, 15, 20, 30, 39, 40, 42, 61, 215, 325, 500 steps).
  3. Developmental checkpoints confirm specimen-specific pupal durations inside the stated
     10 +/- 2 d window: Fig. 2G (8.12 d at 83%) implies T_pupal = 9.78 d, while the p. 5 window
     (35-40% <-> 100-114 h) implies T_pupal = 11.90 d (from 100 h / 35%) and 11.88 d (from
     114 h / 40%), internally consistent to 0.25%.
  4. Unstated equations and parameters documented in questions.yaml: phase-to-height equation
     h = phi * lambda_0 / (4 * pi * n) is omitted from the text (though at lambda_0 = 800 nm,
     n = 1.35, one 2*pi wrap is 296.3 nm, matching the 0-300 nm vertical scale of Figs. 2J-K);
     Eq. 4 omits lateral pixel spacing dx needed to convert W Delta phi (rad) to rad/um in
     Fig. S2C-F (colorbar bounds +/-40 rad/um and 60 rad/um imply dx ~ 73-79 nm, consistent with
     ~1024 px across the 75 um FOV); pooled SD formula (total combined vs within-group), FFT
     zero-padding length, high-pass cutoffs, findpeaks thresholds, and bounding-box percentage
     normalization convention are not stated in the PDF (analysis code is archived on Zenodo,
     ref-48). Minor caption/text cross-reference discrepancies (Fig. 2J-K lines drawn in I rather
     than G; Fig. S5C citing Fig. S6 instead of Fig. S7; Fig. S7 caption printing "after the
     second subset" instead of "after the first subset"; Fig. S10 citing Fig. 5G instead of Fig.
     5H; apolysis ~20% on p. 6 vs ~10% detachment onset in Fig. S3; ridge onset ~37-39% in Fig.
     5H pupa vs ~47% in Fig. 5G pupa / Conclusion p. 6) are also recorded in questions.yaml.

