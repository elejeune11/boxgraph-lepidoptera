id: phase_gradient_eq4
name: local wrapped discrete phase difference (Eq. 4)
role: processing
stated:
  page: 7
  printed_page: "7"
  quote: "local phase behavior via the integrand of the unwrapping scheme"
  where: "Materials and Methods, Eq. 4 (also SI p. 11)"
equation: "dphi_wrapped(n) = W(Delta phi_wrapped(n)) = W(phi_wrapped(n) - phi_wrapped(n - 1))"
built_from:
  - phase_wrapping_eq1_eq2
inputs:
  phi_n:
    quantity: wrapped_optical_phase
    unit: rad
    description: Wrapped phase phi_wrapped(n) at pixel n.
  phi_prev:
    quantity: wrapped_optical_phase
    unit: rad
    description: Wrapped phase phi_wrapped(n - 1) at preceding pixel n - 1.
outputs:
  dphi_wrapped:
    quantity: wrapped_phase_difference
    unit: rad
    description: Wrapped pixel-to-pixel phase difference W Delta phi_wrapped(n) in (-pi, pi].
settings: {}
stochastic: false
