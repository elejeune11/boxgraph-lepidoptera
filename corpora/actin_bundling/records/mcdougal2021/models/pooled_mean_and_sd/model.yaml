id: pooled_mean_and_sd
name: pooled mean and pooled standard deviation across three scale profiles (p. 7, SI p. 11)
role: processing
from_words: true
stated:
  page: 7
  printed_page: "7"
  quote: "all profiles are then used to determine the pooled"
  where: "Materials and Methods (also SI p. 11; n = 3 scales in Fig. 5 caption p. 5)"
equation: "mu_pool = sum(n_i * mu_i) / N; s_total = sqrt(sum((n_i - 1)*s_i^2 + n_i*(mu_i - mu_pool)^2) / (N - 1)); s_within = sqrt(sum((n_i - 1)*s_i^2) / (N - K))"
inputs:
  n1:
    quantity: peak_count
    unit: dimensionless
    description: Number of ridge peaks in profile 1.
  n2:
    quantity: peak_count
    unit: dimensionless
    description: Number of ridge peaks in profile 2.
  n3:
    quantity: peak_count
    unit: dimensionless
    description: Number of ridge peaks in profile 3.
  mu1:
    quantity: ridge_peak_height
    unit: nm
    description: Mean peak height of profile 1 (nm).
  mu2:
    quantity: ridge_peak_height
    unit: nm
    description: Mean peak height of profile 2 (nm).
  mu3:
    quantity: ridge_peak_height
    unit: nm
    description: Mean peak height of profile 3 (nm).
  sd1:
    quantity: ridge_peak_height_sd
    unit: nm
    description: Sample standard deviation of peak heights in profile 1 (nm).
  sd2:
    quantity: ridge_peak_height_sd
    unit: nm
    description: Sample standard deviation of peak heights in profile 2 (nm).
  sd3:
    quantity: ridge_peak_height_sd
    unit: nm
    description: Sample standard deviation of peak heights in profile 3 (nm).
outputs:
  pooled_mean:
    quantity: ridge_peak_height
    unit: nm
    description: Sample-size-weighted pooled mean peak height across the 3 profiles (nm).
  pooled_sd_total:
    quantity: ridge_peak_height_sd
    unit: nm
    description: Exact combined sample SD of the union of all peaks across the 3 profiles (including between-profile mean variance).
  pooled_sd_within:
    quantity: ridge_peak_height_sd
    unit: nm
    description: ANOVA within-profile pooled SD (excluding between-profile mean differences).
settings: {}
stochastic: false
