id: scale_bounding_box_percent_curves
name: normalized developing cover scale bounding-box volume and surface area curves (% of max, Fig. 5F)
role: processing
from_words: true
stated:
  page: 5
  printed_page: "5"
  quote: "volume (red) and surface area (black) as percentage of maximum estimated from the bounding box of scales"
  where: "Fig. 5F caption (also Materials and Methods p. 7, SI p. 11)"
equation: "V(t) = L(t)*W(t)*T(t), V_pct(t) = 100 * V(t) / max_t V(t); S(t) = 2*(L*W + L*T + W*T), S_pct(t) = 100 * S(t) / max_t S(t)"
built_from:
  - scale_bounding_box_geometry
inputs:
  L:
    quantity: scale_length
    unit: um
    curve:
      quantity: pupal_development_fraction
      unit: "%"
    description: Mean developing cover scale length L(t) curve vs pupal development % (Fig. 5C).
  W:
    quantity: scale_width
    unit: um
    curve:
      quantity: pupal_development_fraction
      unit: "%"
    description: Mean developing cover scale width W(t) curve vs pupal development % (Fig. 5D).
  T:
    quantity: scale_thickness
    unit: um
    curve:
      quantity: pupal_development_fraction
      unit: "%"
    description: Mean developing cover scale thickness T(t) curve vs pupal development % (Fig. 5E).
outputs:
  V_pct:
    quantity: scale_bounding_box_volume_pct
    unit: "%"
    curve:
      quantity: pupal_development_fraction
      unit: "%"
    description: Presumptive bounding-box volume V(t) normalized to 100% at its time-series maximum (Fig. 5F red curve).
  S_pct:
    quantity: scale_bounding_box_surface_area_pct
    unit: "%"
    curve:
      quantity: pupal_development_fraction
      unit: "%"
    description: Presumptive bounding-box surface area S(t) normalized to 100% at its time-series maximum (Fig. 5F black curve).
settings: {}
stochastic: false
