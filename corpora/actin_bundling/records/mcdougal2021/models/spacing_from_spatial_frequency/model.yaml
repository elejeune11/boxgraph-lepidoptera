id: spacing_from_spatial_frequency
name: ridge or actin bundle spacing from dominant spatial frequency (SI Figs. S10D, S11B)
role: processing
stated:
  page: 23
  printed_page: "SI 15"
  quote: "freq = s-1 = 0.684μm-1"
  where: "SI Fig. S10D (also SI Fig. S11B p. 24, Methods p. 7, SI p. 11)"
equation: "freq = s^-1  =>  s = 1 / freq"
inputs:
  freq:
    quantity: dominant_spatial_frequency
    unit: 1/um
    description: Dominant spatial frequency peak extracted via 1D or 2D FFT (um^-1).
outputs:
  s:
    quantity: ridge_or_actin_spacing
    unit: um
    description: Corresponding periodic spacing s = 1 / freq between actin bundles or scale ridges (um).
settings: {}
stochastic: false
