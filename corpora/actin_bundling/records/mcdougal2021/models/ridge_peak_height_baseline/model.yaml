id: ridge_peak_height_baseline
name: ridge peak height above trough-connecting baseline (p. 7, SI p. 11, Fig. S10C)
role: processing
from_words: true
stated:
  page: 7
  printed_page: "7"
  quote: "height of the peak as the distance from the peak to the line connecting"
  where: "Materials and Methods (also SI p. 11, SI Fig. S10C p. 23)"
equation: "H_vert = h_peak - (h_left + (x_peak - x_left)/(x_right - x_left) * (h_right - h_left)); H_perp = H_vert / sqrt(1 + ((h_right - h_left)/(x_right - x_left))^2)"
inputs:
  x_left:
    quantity: lateral_distance
    unit: um
    description: Lateral coordinate x_L of the trough immediately left of the peak (um).
  h_left:
    quantity: surface_height
    unit: nm
    description: Surface height h_L of the left trough (nm).
  x_peak:
    quantity: lateral_distance
    unit: um
    description: Lateral coordinate x_P of the ridge peak (um).
  h_peak:
    quantity: surface_height
    unit: nm
    description: Surface height h_P of the ridge peak (nm).
  x_right:
    quantity: lateral_distance
    unit: um
    description: Lateral coordinate x_R of the trough immediately right of the peak (um).
  h_right:
    quantity: surface_height
    unit: nm
    description: Surface height h_R of the right trough (nm).
outputs:
  H_vert:
    quantity: ridge_peak_height
    unit: nm
    description: Vertical height of peak above the straight line connecting the adjacent troughs (nm).
  H_perp:
    quantity: ridge_peak_height_perpendicular
    unit: nm
    description: Exact physical perpendicular Euclidean distance from peak to the trough-connecting line (nm; agrees with H_vert to <0.1% for physical slopes).
settings: {}
stochastic: false
