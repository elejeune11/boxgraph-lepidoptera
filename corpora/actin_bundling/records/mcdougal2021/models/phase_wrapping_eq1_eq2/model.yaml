id: phase_wrapping_eq1_eq2
name: 2pi phase wrapping operator (Eqs. 1-2)
role: processing
stated:
  page: 7
  printed_page: "7"
  quote: "where W is an operator for wrapping, given by"
  where: "Materials and Methods, Eqs. 1-2 (also SI p. 11)"
equation: "phi_wrapped = W phi_unwrapped; W phi(n) = phi(n) + 2*pi*k(n), -pi < W phi(n) <= pi"
inputs:
  phi_unwrapped:
    quantity: optical_phase
    unit: rad
    description: Continuous unwrapped interferometric optical phase phi(n).
outputs:
  phi_wrapped:
    quantity: wrapped_optical_phase
    unit: rad
    description: Phase wrapped onto the half-open interval (-pi, pi] radians.
  k:
    quantity: phase_wrap_integer
    unit: dimensionless
    description: Integer wrapping count k(n) ensuring -pi < phi(n) + 2*pi*k(n) <= pi.
settings: {}
stochastic: false
