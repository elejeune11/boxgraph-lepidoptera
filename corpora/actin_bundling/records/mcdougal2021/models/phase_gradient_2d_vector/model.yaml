id: phase_gradient_2d_vector
name: 2D phase gradient magnitude and slope orientation (SI Fig. S2C-F)
role: processing
from_words: true
stated:
  page: 7
  printed_page: "7"
  quote: "Combination of the horizontal and vertical components of this gradient"
  where: "Materials and Methods (also SI p. 11 and SI Fig. S2C-F pp. 13-14)"
equation: "|grad phi| = sqrt(g_x^2 + g_y^2); theta = atan2(g_y, g_x)"
built_from:
  - phase_gradient_eq4
inputs:
  g_x:
    quantity: optical_phase_gradient
    unit: rad/um
    description: Wrapped phase gradient along x (rad/um, SI Fig. S2C).
  g_y:
    quantity: optical_phase_gradient
    unit: rad/um
    description: Wrapped phase gradient along y (rad/um, SI Fig. S2D).
outputs:
  grad_mag:
    quantity: optical_phase_gradient_magnitude
    unit: rad/um
    description: Euclidean magnitude of 2D wrapped phase gradient (rad/um, SI Fig. S2F).
  grad_dir:
    quantity: slope_orientation_angle
    unit: rad
    description: Azimuthal orientation angle atan2(g_y, g_x) indicating downhill tilt direction (SI Fig. S2E, Fig. 2I).
settings: {}
stochastic: false
