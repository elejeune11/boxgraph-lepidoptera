id: scale_bounding_box_geometry
name: presumptive rectangular bounding-box volume and surface area of a developing scale (Fig. 5F, p. 7, SI p. 11)
role: processing
from_words: true
stated:
  page: 7
  printed_page: "7"
  quote: "estimated using the measured length, width, and thickness to define the"
  where: "Materials and Methods (also Fig. 5F caption p. 5, SI p. 11)"
equation: "V = L * W * T; S = 2 * (L*W + L*T + W*T)"
inputs:
  L:
    quantity: scale_length
    unit: um
    description: Measured developing cover scale length L (um, Fig. 5C).
  W:
    quantity: scale_width
    unit: um
    description: Measured developing cover scale width W (um, Fig. 5D).
  T:
    quantity: scale_thickness
    unit: um
    description: Measured developing cover scale thickness T (um, Fig. 5E).
outputs:
  V:
    quantity: scale_bounding_box_volume
    unit: um^3
    description: Presumptive bounding-box volume V = L * W * T (um^3).
  S:
    quantity: scale_bounding_box_surface_area
    unit: um^2
    description: Presumptive bounding-box surface area S = 2*(L*W + L*T + W*T) (um^2).
settings: {}
stochastic: false
