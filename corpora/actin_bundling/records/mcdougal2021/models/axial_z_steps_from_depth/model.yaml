id: axial_z_steps_from_depth
name: axial z-scan step count from scan depth and step size
role: processing
from_words: true
stated:
  page: 6
  printed_page: "6"
  quote: "(z axis) in 400-nm steps to build up a volume"
  where: "Materials and Methods (also SI p. 10)"
equation: "N_steps = depth / dz"
inputs:
  depth:
    quantity: axial_scan_depth
    unit: um
    description: Axial scan depth, cropped volume thickness, or apical-to-basal depth offset (um).
  dz:
    quantity: axial_step_size
    unit: nm
    description: Optical-axis z-scan step size (400 nm).
outputs:
  N_steps:
    quantity: axial_step_count
    unit: dimensionless
    description: Number of discrete z-scan intervals N_steps = depth / dz.
settings: {}
stochastic: false
