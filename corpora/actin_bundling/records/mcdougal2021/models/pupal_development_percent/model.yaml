id: pupal_development_percent
name: normalized pupal development percentage from elapsed time and generation duration
role: processing
from_words: true
stated:
  page: 6
  printed_page: "6"
  quote: "The percentage of development of an individual after surgery is estimated using"
  where: "Materials and Methods (Butterfly Rearing, also p. 2 and SI p. 10)"
equation: "p_dev = 100 * (t / T_pupal)"
inputs:
  t:
    quantity: elapsed_pupal_time
    unit: day
    description: Elapsed time t since larval-pupal molting (days).
  T_pupal:
    quantity: pupal_stage_duration
    unit: day
    description: Average total pupal stage duration T_pupal of the same generation (days).
outputs:
  p_dev:
    quantity: pupal_development_fraction
    unit: "%"
    description: Normalized developmental progress p_dev (% of pupal development).
settings: {}
stochastic: false
