id: pupal_duration_from_checkpoint
name: implied generation pupal duration from an (elapsed time, % development) checkpoint
role: processing
from_words: true
stated:
  page: 6
  printed_page: "6"
  quote: "The percentage of development of an individual after surgery is estimated using"
  where: "Materials and Methods (inverse of p_dev = 100 * t / T_pupal, also p. 2 and SI p. 10)"
equation: "T_pupal = t / (p_dev / 100)"
built_from:
  - pupal_development_percent
inputs:
  t:
    quantity: elapsed_pupal_time
    unit: day
    description: Elapsed time t since larval-pupal molting (days).
  p_dev:
    quantity: pupal_development_fraction
    unit: "%"
    description: Reported developmental progress p_dev (% of pupal development).
outputs:
  T_pupal:
    quantity: pupal_stage_duration
    unit: day
    description: Implied total generation pupal duration T_pupal (days).
settings: {}
stochastic: false
