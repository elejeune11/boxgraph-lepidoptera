id: reflection_phase_to_height
name: reflection-mode phase-to-surface-height conversion (reconstructed)
role: processing
reconstructed: >
  McDougal et al. (2021) state that unwrapped reflection phase yields nanoscale surface height
  profiles (pp. 2, 7; SI pp. 10-11; Figs. 2J-K, 5A-B, S8, S10) with center wavelength
  lambda_0 = 800 nm and biological fluid refractive index n = 1.35, but omit the phase-to-height
  equation from the PDF. Standard double-pass reflection interferometry gives h = phi * lambda_0 / (4 * pi * n).
stated:
  page: 2
  printed_page: "2"
  quote: "The phase data capture the height of the material interfaces"
  where: "text (also p. 6, SI p. 10, refs. 37-38)"
equation: "h = phi * lambda_0 / (4 * pi * n)"
inputs:
  phi:
    quantity: optical_phase
    unit: rad
    description: Unwrapped reflection optical phase phi (radians).
  lambda_0:
    quantity: laser_wavelength
    unit: nm
    description: Illumination center wavelength lambda_0 (800 nm).
  n:
    quantity: fluid_refractive_index
    unit: dimensionless
    description: Refractive index n of the medium above the scale surface (1.35 in vivo).
outputs:
  h:
    quantity: surface_height
    unit: nm
    description: Surface height change h corresponding to reflection phase phi.
settings: {}
stochastic: false
