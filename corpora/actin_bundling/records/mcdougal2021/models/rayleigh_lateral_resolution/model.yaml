id: rayleigh_lateral_resolution
name: Rayleigh lateral diffraction resolution (reconstructed stand-in for ref-37)
role: model
reconstructed: >
  McDougal et al. (2021) state a theoretical lateral resolution of 490 nm for lambda_0 = 800 nm
  and NA = 1.0, citing Choi et al. (2014) (ref-37), without printing the resolution formula in
  the paper or SI. Standard Rayleigh diffraction resolution r_lat = 0.61 * lambda_0 / NA is
  evaluated as a stand-in (yielding 488 nm, matching 490 nm at 2 significant figures).
stated:
  page: 6
  printed_page: "6"
  quote: "resolution of 490 nm and the theoretical axial resolution of 1.03 μm were"
  where: "Materials and Methods (citing ref-37; also p. 2, SI p. 10)"
equation: "r_lat = 0.61 * lambda_0 / NA"
inputs:
  lambda_0:
    quantity: laser_wavelength
    unit: nm
    description: Center illumination wavelength lambda_0 (800 nm).
  NA:
    quantity: objective_numerical_aperture
    unit: dimensionless
    description: Objective numerical aperture NA (1.0).
outputs:
  r_lat:
    quantity: optical_lateral_resolution
    unit: nm
    description: Rayleigh lateral spatial resolution r_lat.
settings: {}
stochastic: false
