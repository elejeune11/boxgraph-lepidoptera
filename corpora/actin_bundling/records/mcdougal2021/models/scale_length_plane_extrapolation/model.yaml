id: scale_length_plane_extrapolation
name: cover scale length extrapolation to wing surface plane (SI p. 11, Fig. S9C)
role: processing
from_words: true
stated:
  page: 11
  printed_page: "SI 3"
  quote: "Length was estimated along the primary plane of the scale, from the distal tip"
  where: "SI Detailed Methods (Image analysis) and SI Fig. S9C (p. 22)"
equation: "L = z_tip / sin(theta)"
inputs:
  z_tip:
    quantity: scale_tip_height_above_wing
    unit: um
    description: Perpendicular distance from the scale's distal tip to the wing surface plane (um).
  theta:
    quantity: scale_inclination_angle
    unit: deg
    description: Inclination angle theta between the primary longitudinal scale plane and the wing surface plane (deg).
outputs:
  L:
    quantity: scale_length
    unit: um
    description: Extrapolated scale length L from distal tip to wing plane intersection (um).
settings: {}
stochastic: false
