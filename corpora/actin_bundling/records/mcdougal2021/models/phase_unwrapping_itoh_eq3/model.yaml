id: phase_unwrapping_itoh_eq3
name: 1D Itoh phase unwrapping algorithm (Eq. 3)
role: processing
described_from: ref-46
stated:
  page: 7
  printed_page: "7"
  quote: "described the unwrapping process for n = 0, 1"
  where: "Materials and Methods, Eq. 3 (also SI p. 11)"
equation: "phi_unwrapped(m) = phi_wrapped(0) + sum_{n=1}^{m} (W Delta phi_wrapped(n)), Delta phi(n) = phi(n) - phi(n - 1)"
built_from:
  - phase_gradient_eq4
inputs:
  phi_wrapped:
    quantity: wrapped_optical_phase
    unit: rad
    curve:
      quantity: lateral_distance
      unit: um
    description: 1D wrapped phase trace phi_wrapped(n) in (-pi, pi] indexed by lateral distance x.
outputs:
  phi_unwrapped:
    quantity: optical_phase
    unit: rad
    curve:
      quantity: lateral_distance
      unit: um
    description: Unwrapped 1D phase profile phi_unwrapped(m) obtained via Itoh's discrete integration.
settings: {}
stochastic: false
