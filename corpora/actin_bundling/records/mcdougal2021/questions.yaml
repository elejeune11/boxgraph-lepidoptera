- id: q_phase_to_height_unstated
  kind: unstated_model
  about:
    - reflection_phase_to_height
    - fluid_refractive_index_si
    - laser_wavelength_center
  text: >
    The paper states that unwrapped phase profiles capture nanoscale scale surface height
    (pp. 2, 7; SI pp. 10-11) and plots surface height h(x) in nm in Figs. 2J-K, 5A-B, S8A-C,
    and S10B-C, with laser center wavelength lambda_0 = 800 nm and biological fluid refractive
    index n = 1.35 (SI p. 10). However, the paper never prints the phase-to-height conversion
    formula h = phi * lambda_0 / (4 * pi * n), nor specifies which refractive index n is applied
    in vivo (n = 1.35 biological fluid vs n = 1.333 water) or for dry adult scales (Fig. 1F,
    likely air n = 1.0). Under standard double-pass reflection at lambda_0 = 800 nm, n = 1.35,
    one 2*pi phase wrap equals 296.3 nm, closely matching the 0-300 nm vertical scale of Fig. 2J-K.
  citation:
    page: 2
    printed_page: "2"
    quote: "The phase data capture the height of the material interfaces"
    where: "text (also SI p. 10)"

- id: q_eq4_missing_pixel_pitch
  kind: unstated_input
  about:
    - phase_gradient_eq4
    - phase_gradient_2d_vector
    - figS2CD_phase_grad_axis_max
    - figS2F_phase_grad_mag_max
    - cmp_figS2_grad_mag_bound
  text: >
    Eq. 4 (p. 7, SI p. 11) defines the local phase gradient simply as the pixel-to-pixel
    wrapped difference W Delta phi_wrapped(n) (in radians per pixel), omitting division by the
    lateral pixel spacing dx. Yet SI Fig. S2C-D plot the wrapped phase gradient along x and y in
    units of rad/um spanning [-40, 40] rad/um, and SI Fig. S2F plots gradient magnitude in rad/um
    up to 60 rad/um. Neither the camera pixel pitch in object space nor the image pixel dimensions
    are printed anywhere in the paper or SI. Since |W Delta phi| <= pi, a single-axis bound of
    ~40-43 rad/um implies dx ~ 73-79 nm (e.g., 75 um / 1024 px = 73.2 nm gives pi/dx = 42.9 rad/um
    and diagonal sqrt(2)*42.9 = 60.7 rad/um, matching the 60 rad/um colorbar top in Fig. S2F).
  citation:
    page: 13
    printed_page: "SI 5"
    quote: "Phase gradient along x, wrapped (rad/µm)"
    where: "SI Fig. S2C-F (and Eq. 4, p. 7 / SI p. 11)"

- id: q_speckle_psf_and_axial_res
  kind: unstated_model
  about:
    - speckle_psf_deconvolution
    - rayleigh_lateral_resolution
    - lateral_resolution_theoretical
    - axial_resolution_theoretical
    - cmp_rayleigh_lateral_resolution
  text: >
    The paper states a theoretical lateral resolution of 490 nm and axial resolution of 1.03 um
    (citing Choi et al. 2014, ref-37) and applies 10 iterations of Lucy-Richardson deconvolution
    with a theoretically estimated point spread function (citing Zhou et al. 2017, ref-45), but
    does not print the PSF or resolution equations in the main text or SI. Evaluating the
    standard Rayleigh stand-in 0.61 * lambda_0 / NA with lambda_0 = 800 nm and NA = 1.0 yields
    488.0 nm (0.4% from 490 nm, identical to 2 significant figures).
  citation:
    page: 6
    printed_page: "6"
    quote: "resolution of 490 nm and the theoretical axial resolution of 1.03 μm were"
    where: "Materials and Methods (also p. 7, SI pp. 10-11)"

