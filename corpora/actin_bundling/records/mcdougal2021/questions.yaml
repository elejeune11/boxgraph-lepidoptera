  text: >
    No cross-record validations are entered in validations.yaml for either mcdougal2021 or totz2024
    (0 entries in both directions). Although totz2024 (from the same Kolle/So lab, citing mcdougal2021
    as ref-35 / SI ref-S1) models early-stage V. cardui scale ridge buckling on overlapping timestamps
    (39.6%-41.0% development) of the same single pupa imaged in mcdougal2021 Fig. 5A-B/5H/S8/S10,
    no model in either record produces a valid on-conditions prediction with an informative BoxGraph
    verdict against a measured datum of the other record:
    (1) mcdougal2021 models (21 optical/image-processing/geometric/staging models; 0 biomechanical
    models, as p. 6 explicitly defers mechanical modeling to future work) vs totz2024 measurements
    (37 origin: measured and 24 origin: reported entries):
    (a) 1D FFT periodicity models (dominant_spatial_frequency_fft_1d and _uncentered): totz2024's
    Fig. 3A-E (d_fig3A..E_invivo_*), Fig. S1F, and Fig. S1J are pre-segmented single-ridge windows
    spanning only 1.03-1.21 um (< 1 period L = 1.6 um), where 1D FFT fails structurally and returns
    window-length or f_min-cutoff artifacts (1.03-1.14 um centered; 2.14-2.19 um uncentered). Fig. S1E
    (d_figS1E_mean_profile, 11 sparse points, dx = 0.90 um) is aliased (Nyquist 0.556 um^-1 < 0.625 um^-1).
    On multi-ridge Fig. 1G (d_fig1G_profile_41_0pct, 19 points, dx = 0.25 um, 3 peaks spaced at 1.75 um),
    1D FFT recovers s = 1.796 um (centered) and 1.846 um (uncentered), inside Fig. 3G 41.0% IQR
    1.38-1.80 um (and 1.586 um uncentered on Fig. 1F 40.0% vs Fig. 3G mean 1.595 um), but totz2024
    contains no scalar origin: measured spacing target (d_fig3G_L_mean is a 5-point curve;
    totz2024/L_Vcardui_p8 = 1.6 um is origin: reported citing mcdougal2021 itself).
    (b) Trough-baseline peak height models (profile_slope_rotation_and_peaks and
    ridge_peak_height_baseline): on totz2024 Fig. 3A-E and S1J, unobstructed curves stop at
    x = +/-0.46..0.67 um above w = 0, causing artificial 6-15 nm baseline subtraction (16.8-50.7 nm vs
    true curve peaks 22.8-61.3 nm), and d_fig3F_w0_mean is a 5-point curve without per-timepoint scalar
    targets. On Fig. 1G, outer peaks 1 and 3 are boundary-truncated at x = 0.25 and 4.75 um (biasing
    profile_slope_rotation_and_peaks to 68.8 +/- 14.0 nm vs central bracketed peak 71.9 nm and
    trough-referenced peak elevations 83.2-100.0 nm; Fig. 1F gives 30.5 +/- 2.8 nm; smooth Fig. 1E gives
    nan), and totz2024's only scalar measured height datum (protoridge_height_approx = "~100" nm, p. 4)
    is an approximate prose estimate producing 'no verdict'. Offline evaluation of
    ridge_peak_height_baseline on totz2024's Fig. S1E peaks and troughs (d_figS1E_peaks,
    d_figS1E_troughs) yields 31.37, 30.70, 74.22, 49.81, 82.63 nm, matching totz2024 Fig. S1F's rotated
    individual ridge peaks (32.36, 30.02, 74.32, 48.17, 82.32 nm) within -0.99 to +1.64 nm, confirming
    methodological equivalence of the two papers' trough-flattening peak-height definitions, though the
    coordinates are stored as curves rather than scalar inputs/targets.
    (c) Staging, diffraction, and remaining models: totz2024 reports no elapsed times for Fig. 1B-D or
    Fig. 3 timestamps (while pupal_development_percent on protoridge_onset_days "~3.5 to 4.5" d /
    pupal_duration_typical "about 10" d vs protoridge_onset_fraction "~35 to 45" % yields 'no verdict');
    totz2024's "~500" nm and "~1" um resolutions are origin: reported citations of mcdougal2021's own
    490 nm / 1.03 um specs (already linked in totz2024/cited.yaml); and totz2024 measures no numerical
    optical phase, intensity, axial scan step, or macroscopic scale cuboid dimensions.
    (2) totz2024 models (34 FvK elastic plate buckling, Hooke constitutive, and segmentation models) vs
    mcdougal2021 measurements (65 origin: measured and 5 origin: derived entries):
    (a) fig5h_ridge_height_data (10 points, 34.82%-41.04%, mean +/- SD): totz2024 has no dynamical model
    taking pupal_development_fraction or time as input (Y and g are unmeasured free parameters constrained
    only along degenerate fitted isocontours in Fig. 3H). Offline cross-checks confirm substantial
    pipeline sensitivity: evaluating totz2024's corrected Eq. 3 at mcdougal2021 Fig. 5H's 39.63% mean
    (44.02 +/- 17.4 nm, L = 1.255 +/- 0.337 um) lowers Y_min from 3.5e6 Pa to 3.52e5 Pa at own L (9.9x
    lower; 1.16e6 Pa at H - 1 SD) and 9.28e5 Pa at L = 1.6 um (3.8x lower); matching 41.04% (89.16 +/-
    34.4 nm, L = 1.469 um) requires g = 1.258% at Y = 3.5 MPa (1.170% at Y = 1 MPa), exceeding totz2024
    Table S1's 0.0%-0.7% range; and driving Eq. 3 along totz2024's Fig. 3H g(t) at Y = 3.5 MPa with
    Fig. 5H's spacings predicts 14.2-58.1 nm (-35% to -68%, -0.58 to -1.72 SD below Fig. 5H means across
    all 5 shared timestamps).
    (b) fig5B_protoridge_height ("about 100" nm at 41%): unmeasured (Y, g) give 20.8-83.1 nm across
    totz2024's parameter ranges at L = 1.4618 um (57.3-58.1 nm on Fig. 3H 41.0%), "about 100" yields
    'no verdict', and Fig. 5B is the same pupa/timestamp as totz2024 Fig. 3E.
    (c) 1D surface height profiles: sweeping totz2024's phase-pinned single-ridge cosines over
    mcdougal2021's unaligned 41% multi-ridge traces (fig5b_profile_41pct_data,
    figS10c_rotated_profile_data) fails purely from arbitrary cursor-origin phase offset (r = -0.551/-0.594
    trough-origin; peak-origin puts ~95 nm at the 11.0 nm x = 0 trough) and unequal local ridge widths
    (1.33, 1.33, 1.77 um), while Fig. 5A (35% smooth), Fig. S8B (37% irregular), Fig. S10B (unrotated),
    Fig. 2J (83% mature sclerotized chitin ridges with lamellae), and Fig. 2K (longitudinal lamellae)
    lie outside totz2024's early protoridge buckling regime.
    (d) Actin/ridge spacings (fig5h_ridge_spacing_data, fig5g_*, figS10/S11_ridge_spacing,
    actin_bundle_spacing_plateau), macroscopic scale dimensions (Fig. 5C-F), optical depth profiles
    (Fig. S3B, Fig. S4), and staging measurements: totz2024 takes actin spacing L as an external input
    (does not predict L, though critical_growth_strain_eq4 maps Fig. 5G's widening from 0.984 to
    1.562-1.943 um to a 3.9x drop in g_c from 0.181% to 0.0465%-0.0719%) and models none of the
    macroscopic, optical, or developmental-timing observables. See totz2024/q_mcdougal2021_no_cross_validation
    and totz2024/q_mcdougal2021_shared_pupa_heights_and_Ymin_sensitivity.
