    quote: "manually defining the minimum accepted peak height and spacing"
    where: "SI Detailed Methods (Image analysis)"

- id: q_pooled_sd_definition
  kind: unstated_model
  about:
    - pooled_mean_and_sd
    - fig5_measured_scale_count
  text: >
    Materials and Methods (p. 7) and SI Detailed Methods (p. 11) state that per-profile mean and
    SD peak heights are calculated and then combined into "the pooled mean and the pooled SD for
    each time point" (with error bars corresponding to measurements from n = 3 scales, Fig. 5
    caption). The exact formula for pooled SD is not printed, leaving open whether between-profile
    mean variance is included (exact combined sample SD of all pooled peaks) or excluded (ANOVA
    within-profile pooled SD), and per-profile peak counts n_i are not reported in the PDF.
  citation:
    page: 7
    printed_page: "7"
    quote: "all profiles are then used to determine the pooled"
    where: "Materials and Methods (also SI p. 11)"

- id: q_bounding_box_percent_normalization
  kind: reading
  about:
    - scale_bounding_box_geometry
  text: >
    Fig. 5F (p. 5) plots scale bounding-box volume and surface area "as percentage of maximum"
    for both individual scales (crosses) and the 3-scale mean (dashed curves), without specifying
    whether values are normalized by the maximum of the timepoint mean curve or by each individual
    scale's own maximum. Several individual markers around 38-42% development sit near or above
    100%, suggesting normalization by the maximum timepoint mean; to be verified once Fig. 5C-F
    are digitized.
  citation:
    page: 5
    printed_page: "5"
    quote: "volume (red) and surface area (black) as percentage of maximum"
    where: "Fig. 5F caption"

- id: q_figS10_freq_rounding_precision
  kind: reading
  about:
    - figS10_dominant_freq
    - figS10_ridge_spacing
    - cmp_figS10_spacing_from_freq
  text: >
    SI Fig. S10D (p. 23) prints the dominant spatial frequency to 3 significant figures
    (freq = 0.684 um^-1) alongside the reciprocal spacing to 5 significant figures
    (s = 1.4618 um). Direct inversion of the rounded frequency gives 1/0.684 = 1.46199 um,
    differing by 0.00019 um from 1.4618 um; conversely 1/1.4618 = 0.684088 um^-1 rounds cleanly
    to 0.684 um^-1, showing that s was computed from the unrounded FFT peak before printing freq.
  citation:
    page: 23
    printed_page: "SI 15"
    quote: "freq = s-1 = 0.684μm-1"
    where: "SI Fig. S10D"

- id: q_figS10C_peak_height_aspect
  kind: reading
  about:
    - ridge_peak_height_baseline
  text: >
    Methods (p. 7, SI p. 11) define peak height as "the distance from the peak to the line
    connecting the troughs on either side of the peak", and SI Fig. S10C draws the peak-height
    arrow perpendicular to the sloped dashed trough line in display coordinates (while noting
    that the y-axis in nm and x-axis in um use different length scales). In true physical length
    units, vertical height H_vert and perpendicular distance H_perp agree to within <0.1% because
    physical slopes dh/dx are O(10^-2); measuring perpendicular distance in distorted display
    coordinates would depend arbitrarily on plot aspect ratio.
  citation:
    page: 23
    printed_page: "SI 15"
    quote: "note that the y-axis and x-axis are shown with different length scales"
    where: "SI Fig. S10C caption"

