- id: q_audit_curvature_vs_radius
  kind: possible_error
  about:
    - scale_bounding_box_geometry
    - scale_width_41pct_added
  text: >
    SI Detailed Methods (p. 11, lines 109-110) define the lateral width measurement location as
    'where the rounded end becomes nearly straight (where the curvature of the scale’s edge
    exceeds the scale length)'. Curvature (dimension 1/[length]) cannot be compared to scale
    length ([length]) and becomes small rather than large on a nearly straight edge; the
    authors evidently mean the radius of curvature R = 1/kappa exceeding the scale length L.
  citation:
    page: 11
    printed_page: "SI 3"
    quote: "nearly straight (where the curvature of the scale’s edge exceeds the scale length)."
    where: "SI Detailed Methods (Image analysis)"

- id: q_digitize_fft_uncentered_confirmed
  kind: reading
  about:
    - dominant_spatial_frequency_fft_1d
    - dominant_spatial_frequency_fft_1d_uncentered
    - figS10c_rotated_profile_data
    - figS10d_fft_spectrum_data
    - cmp_fft1d_figS10c_freq
    - cmp_fft1d_uncentered_figS10c_freq
  text: >
    Calibrated digitization of SI Fig. S10B-D settles q_audit_fft_dc_and_findpeaks
    quantitatively: Fig. S10D displays a nonzero DC peak reaching 4.38 x 10^3 nm at f = 0, a
    dominant peak of 1.27 x 10^3 nm at f = 0.684 um^-1 (red circle center 0.685 um^-1), and
    terminates at Nyquist f_nyq = 5.649 um^-1 (implying lateral sample step dx = 88.5 nm, i.e.,
    N = 79 diagonal MATLAB improfile samples at ~34 deg across a ~73 nm pixel grid). Running
    the mean-subtracted model dominant_spatial_frequency_fft_1d on digitized Fig. S10C removes
    the DC sinc sidelobe, raising the peak to ~1.52 x 10^3 nm and shifting its frequency down to
    0.6591 um^-1 (s = 1.517 um, -3.64%, not reproduced). Running the uncentered variant
    dominant_spatial_frequency_fft_1d_uncentered (without mean subtraction, n_uniform = 79)
    reproduces the DC peak (~4.39 x 10^3 nm), dominant peak magnitude (~1.26 x 10^3 nm), and
    dominant frequency (0.6784 um^-1, s = 1.474 um, within 0.81% of printed 0.684 um^-1 /
    1.4618 um, 4.5x closer than mean-subtracted). Rotating digitized Fig. S10B by its OLS
    best-fit slope (-0.01633 rad = -0.936 deg) reproduces Fig. S10C (and Fig. 5B / Fig. S8C
    bottom) to ~1.2 nm RMS, and profile_slope_rotation_and_peaks yields mean peak height
    90.8 nm (SD 6.6 nm), matching the 41.0% pooled mean 89.2 nm in Fig. 5H to 1.9%.
  citation:
    page: 23
    printed_page: "SI 15"
    quote: "The magnitude of spatial frequencies shows the dominant frequency of the periodic surface height"
    where: "SI Fig. S10B-D"

