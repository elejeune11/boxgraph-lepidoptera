- id: q_audit_figS2_colorbar_ticks
  kind: reading
  about:
    - figS2CD_phase_grad_axis_max
    - figS2F_phase_grad_mag_max
    - cmp_figS2_grad_mag_bound
  text: >
    Second-reader disagreement: figS2CD_phase_grad_axis_max (40 rad/um) and
    figS2F_phase_grad_mag_max (60 rad/um) record the highest labeled tick marks of the
    SI Fig. S2C-D and S2F colorbars as upper limits, and cmp_figS2_grad_mag_bound checks
    sqrt(40^2 + 40^2) = 56.57 rad/um against 60 rad/um, yielding a 'not reproduced' verdict.
    Inspecting page-013.png directly shows that the colorbars in Fig. S2C-D visibly extend
    beyond +/-40 rad/um (just as Fig. S2B extends beyond +/-3 to +/-pi rad) and Fig. S2F
    extends slightly past 60 rad/um (and down past 10 to 0). Thus 40 and 60 are rounded
    axis ticks rather than true colorbar extrema, so cmp_figS2_grad_mag_bound = not reproduced
    is an artifact of evaluating the vector norm on rounded tick labels rather than an
    inconsistency in the paper's phase-gradient calculation.
  citation:
    page: 13
    printed_page: "SI 5"
    quote: "Magnitude of phase gradient"
    where: "SI Fig. S2C-D and S2F colorbars"

- id: q_audit_fft_dc_and_findpeaks
  kind: reading
