    - profile_slope_rotation_and_peaks
    - figS10_dominant_freq
    - figS10_ridge_spacing
  text: >
    Second-reader disagreement on two implementation choices in from_words processing models
    that will matter once SI Fig. S10B-D are digitized: (1) dominant_spatial_frequency_fft_1d
    subtracts mean(y) before taking the 1D FFT, whereas SI Fig. S10D (page-023.png) visibly
    shows a large nonzero DC peak at spatial frequency 0 reaching ~4.4 x 10^3 nm (consistent
    with unnormalized abs(fft(h)) on the nonnegative profile in Fig. S10C without mean
    subtraction, whose rectangular-window DC sinc sidelobes leak into f > 0 and can slightly
    shift low-frequency peaks); (2) profile_slope_rotation_and_peaks uses scipy's prominence
    parameter (min_peak_prominence_nm = 15.0, min_peak_distance_um = 0.8), whereas SI p. 11
    describes MATLAB's findpeaks with 'minimum accepted peak height and spacing' (MinPeakHeight
    rather than MinPeakProminence), and both models embed unstated reader-chosen settings
    (n_fft = 4096, f_min = 0.3, n_uniform = 256, min_peak_prominence_nm = 15.0,
    min_peak_distance_um = 0.8).
  citation:
    page: 23
    printed_page: "SI 15"
    quote: "The magnitude of spatial frequencies shows the dominant frequency of the periodic surface height"
    where: "SI Fig. S10D (and SI Detailed Methods p. 11)"

