- id: q_apolysis_timing_20_vs_10
  kind: reading
  about:
    - apolysis_dev_forewing_text
    - hindwing_adherence_end_dev
  text: >
    Main text Materials and Methods (p. 6) and SI p. 10 state that forewing cuticle can be removed
    "at any time after apolysis, which occurs at ~20% of development (SI Appendix, Fig. S3)."
    However, the SI Fig. S3 caption (p. 15) reports that the hindwing adheres to the peripodial
    membrane for only "the first ~10% of development", after which it detaches and retracts
    ~120 um (with a speed change at ~23%). The ~10% vs ~20% timings likely distinguish the onset
    of hindwing epithelial detachment from sufficient forewing separation for safe cuticle surgery.
  citation:
    page: 6
    printed_page: "6"
    quote: "occurs at ∼20% of development (SI Appendix, Fig. S3)."
    where: "Materials and Methods (compared with SI Fig. S3 p. 15)"

