  text: >
    The paper prints the 1D Itoh phase unwrapping algorithm (Eq. 3, p. 7 & SI p. 11), which is
    implemented as a runnable curve-port model (phase_unwrapping_itoh_eq3). Because no 1D wrapped
    phase trace phi_wrapped(x) is tabulated or plotted in the PDF (all 1D line profiles in Figs.
