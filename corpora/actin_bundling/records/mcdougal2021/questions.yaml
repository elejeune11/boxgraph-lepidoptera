    SI Detailed Methods (p. 11) describe zero-padded 1D FFT frequency interpolation, high-pass
    filtered 2D FFT peak selection (SI Fig. S11B), and MATLAB 'findpeaks' with manually defined
    minimum peak height and spacing, without printing the numerical zero-padding factor, high-pass
    cutoff frequency, or findpeaks thresholds in the PDF. Raw image stacks and MATLAB analysis
    scripts are archived separately on Zenodo (ref-48).
  citation:
