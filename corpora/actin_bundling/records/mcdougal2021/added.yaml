# Inputs not printed numerically in McDougal et al. (2021) needed to exercise
# stated processing/geometric/statistical equations before figure digitization.

- id: phi_unwrapped_test_added
  quantity: optical_phase
  unit: rad
  printed: "4.5"
  basis: >
    Illustrative unwrapped phase (> pi, corresponding to ~212 nm in double-pass reflection
    at lambda_0 = 800 nm, n = 1.35, within the 0-300 nm range of Fig. 2J-K) to evaluate
    the phase wrapping operator Eqs. 1-2 (p. 7, SI p. 11).
  alternatives: ["2.1", "7.5"]
  stands_for: "phi_unwrapped in Eqs. 1-2 (p. 7, SI p. 11)"

- id: phi_wrapped_n_added
  quantity: wrapped_optical_phase
  unit: rad
  printed: "-2.9"
  basis: >
    Illustrative wrapped phase value just past the +pi/-pi wrap discontinuity (-2.9 rad)
    to exercise Eq. 4 (W Delta phi_wrapped across a branch cut).
  alternatives: ["0.5", "3.0"]
  stands_for: "phi_wrapped(n) in Eq. 4 (p. 7, SI p. 11)"

- id: phi_wrapped_prev_added
  quantity: wrapped_optical_phase
  unit: rad
  printed: "2.9"
  basis: >
    Illustrative preceding wrapped phase value just below the +pi branch cut (+2.9 rad) so
    that raw difference is -5.8 rad while wrapped local difference W Delta phi is +0.483 rad.
  alternatives: ["0.0", "2.5"]
  stands_for: "phi_wrapped(n-1) in Eq. 4 (p. 7, SI p. 11)"

- id: amplitude_illustrative_added
  quantity: reflected_field_amplitude
  unit: dimensionless
  printed: "1.0 x 10^5"
  basis: >
    Illustrative reflected amplitude corresponding to I = A^2 = 10^10 arb. units, centered
    within the 10^9 to 10^12 intensity axis of SI Fig. S3B (p. 15).
  alternatives: ["3.16 x 10^4", "1.0 x 10^6"]
  stands_for: "amplitude A in Intensity = amplitude squared (SI Fig. S3B caption, p. 15)"

- id: scale_length_41pct_added
  quantity: scale_length
  unit: um
  printed: "150"
  basis: >
    Approximate mature cover scale length near ~40-41% development from visual inspection
    of Fig. 5C (p. 5, where mean length peaks near ~150-160 um); used to exercise the
    bounding-box volume and surface area model before calibrated digitization of Fig. 5C-F.
  alternatives: ["100", "170"]
  stands_for: "measured scale length L in bounding-box estimate (p. 7, SI p. 11, Fig. 5C)"
  conditions:
    pupal_development_fraction: "41 %"

- id: scale_width_41pct_added
  quantity: scale_width
  unit: um
  printed: "40"
  basis: >
    Approximate cover scale width near ~40-41% development from visual inspection of
    Fig. 5D (p. 5); used to exercise the bounding-box geometry model before digitization.
  alternatives: ["25", "50"]
  stands_for: "measured scale width W in bounding-box estimate (p. 7, SI p. 11, Fig. 5D)"
  conditions:
    pupal_development_fraction: "41 %"

- id: scale_thickness_41pct_added
  quantity: scale_thickness
  unit: um
  printed: "4.5"
  basis: >
    Approximate cover scale thickness near ~40-41% development from visual inspection of
    Fig. 5E (p. 5); used to exercise the bounding-box geometry model before digitization.
  alternatives: ["4.0", "6.0"]
  stands_for: "measured scale thickness T in bounding-box estimate (p. 7, SI p. 11, Fig. 5E)"
  conditions:
    pupal_development_fraction: "41 %"

- id: scale_tip_height_s9_added
  quantity: scale_tip_height_above_wing
  unit: um
  printed: "30"
  basis: >
    Illustrative distal-tip height above the wing surface plane (~30 um, consistent with
    Fig. S3A-B where cover scales lie ~40-50 um above the wing tissue) to evaluate the
    longitudinal plane-extrapolation length model (SI Fig. S9C, p. 22).
  alternatives: ["20", "45"]
  stands_for: "perpendicular height of distal tip above wing plane in SI Fig. S9C"

- id: scale_inclination_angle_s9_added
  quantity: scale_inclination_angle
  unit: deg
  printed: "12"
  basis: >
    Illustrative shallow inclination angle (~12 deg, matching the low-angle longitudinal
    geometry in SI Fig. S9C and giving L ~ 144 um for z_tip = 30 um) to evaluate the
    plane-extrapolation length model before digitization.
  alternatives: ["8", "18"]
  stands_for: "angle theta between distal scale plane and wing surface plane in SI Fig. S9C"

- id: peak_x_left_s10_added
  quantity: lateral_distance
  unit: um
  printed: "2.0"
  basis: >
    Illustrative left trough position x_L from visual inspection of the highlighted peak in
    SI Fig. S10C (p. 23, trough near ~2.0 um); used to exercise the baseline peak-height
    formula prior to calibrated digitization of Fig. S10C.
  alternatives: ["1.8", "2.2"]
  stands_for: "left adjacent trough x_L in SI Fig. S10C (p. 23)"

- id: peak_h_left_s10_added
  quantity: surface_height
  unit: nm
  printed: "0"
  basis: >
    Illustrative left trough height h_L near 0 nm from visual inspection of SI Fig. S10C (p. 23).
  alternatives: ["-10", "10"]
  stands_for: "left adjacent trough height h_L in SI Fig. S10C (p. 23)"

- id: peak_x_center_s10_added
  quantity: lateral_distance
  unit: um
  printed: "2.9"
  basis: >
    Illustrative peak position x_P near ~2.9 um from visual inspection of SI Fig. S10C (p. 23).
  alternatives: ["2.7", "3.1"]
  stands_for: "peak position x_P in SI Fig. S10C (p. 23)"

- id: peak_h_center_s10_added
  quantity: surface_height
  unit: nm
  printed: "100"
  basis: >
    Illustrative peak height h_P near ~100 nm matching Fig. 5B ('about 100 nm in height')
    and SI Fig. S10C (p. 23).
  alternatives: ["80", "120"]
  stands_for: "peak height h_P in SI Fig. S10C (p. 23)"

- id: peak_x_right_s10_added
  quantity: lateral_distance
  unit: um
  printed: "3.7"
  basis: >
    Illustrative right trough position x_R near ~3.7 um from visual inspection of SI Fig. S10C (p. 23).
  alternatives: ["3.5", "3.9"]
  stands_for: "right adjacent trough x_R in SI Fig. S10C (p. 23)"

- id: peak_h_right_s10_added
  quantity: surface_height
  unit: nm
  printed: "30"
  basis: >
    Illustrative elevated right trough height h_R (~30 nm) matching the sloped trough-to-trough
    dashed line drawn in SI Fig. S10C (p. 23).
  alternatives: ["10", "50"]
  stands_for: "right adjacent trough height h_R in SI Fig. S10C (p. 23)"

- id: pooled_n1_added
  quantity: peak_count
  unit: dimensionless
  printed: "4"
  basis: >
    Illustrative peak count n_1 = 4 along a ~6-7 um line trace (matching the 4 full peaks in
    Fig. S10C, p. 23) for scale 1 of 3 in the pooled mean/SD model (p. 7, SI p. 11).
  alternatives: ["3", "6"]
  stands_for: "peak count n_1 for profile 1 in pooled mean and SD calculation (p. 7, SI p. 11)"

- id: pooled_n2_added
  quantity: peak_count
  unit: dimensionless
  printed: "4"
  basis: >
    Illustrative peak count n_2 = 4 for scale 2 of 3 in the pooled mean/SD model (p. 7, SI p. 11).
  alternatives: ["3", "6"]
  stands_for: "peak count n_2 for profile 2 in pooled mean and SD calculation (p. 7, SI p. 11)"

- id: pooled_n3_added
  quantity: peak_count
  unit: dimensionless
  printed: "4"
  basis: >
    Illustrative peak count n_3 = 4 for scale 3 of 3 in the pooled mean/SD model (p. 7, SI p. 11).
  alternatives: ["3", "6"]
  stands_for: "peak count n_3 for profile 3 in pooled mean and SD calculation (p. 7, SI p. 11)"

- id: pooled_mu1_added
  quantity: ridge_peak_height
  unit: nm
  printed: "80"
  basis: >
    Illustrative mean peak height for profile 1 at ~41% development (within the ~50-120 nm
    range of Fig. 5H / Fig. S8D) to exercise the pooled mean and pooled SD model.
  alternatives: ["60", "100"]
  stands_for: "profile 1 mean peak height mu_1 (p. 7, SI p. 11)"

- id: pooled_mu2_added
  quantity: ridge_peak_height
  unit: nm
  printed: "95"
  basis: >
    Illustrative mean peak height for profile 2 at ~41% development to exercise the pooled
