    Illustrative mean peak height for profile 3 at ~41% development to exercise the pooled
    mean and pooled SD model.
  alternatives: ["90", "120"]
  stands_for: "profile 3 mean peak height mu_3 (p. 7, SI p. 11)"

- id: pooled_sd1_added
  quantity: ridge_peak_height_sd
  unit: nm
  printed: "15"
  basis: >
    Illustrative within-profile peak height SD for profile 1 (~15 nm) to exercise the pooled
    SD model and illustrate the difference between total combined SD and within-profile pooled SD.
  alternatives: ["10", "25"]
  stands_for: "profile 1 peak height SD s_1 (p. 7, SI p. 11)"

