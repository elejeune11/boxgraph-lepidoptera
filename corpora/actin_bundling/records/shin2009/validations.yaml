# Cross-record validation audit of shin2009 models against independent measurements
# across all six ready Wave 6 partner records (claessens2008, pelletier2003, haviv2008,
# gov2008, grason2007, dutta2016).
#
# Result: 0 physically valid cross-record validations from shin2009 models to measurements
# in these six partner records. Every pair was audited individually and recorded in
# shin2009/questions.yaml:
#
# - claessens2008 + shin2009 (see q_claessens2008_cross_comparison_and_no_validation):
#   * claessens2008 measures fascin-actin overtwist vs effective bound ratio R* (Fig. 3D:
#     Delta_theta_fig3d_ca0p8/ca2/ca3), hexagonal q_10 (0.585 nm^-1), helical layer lines,
#     saturated plateau Rstar_plateau (~0.25), TEM bundle diameter D(R*), and confined droplet
#     bundle counts (n_f ~ 20).
#   * shin2009's continuous statistical-mechanics overtwist models (mean_field_eos +
#     overtwist_correlation_perturbative / transfer_matrix) output bond-interval Im[ln g]
#     (rad across ~4.67 monomers) as a function of uncalibrated (beta*U, z, xi_t) without
#     stating fascin's beta*U or z(R*) calibration, so they predict only the qualitative
#     continuous-rise trend and cannot predict Delta_theta(R*) in deg/monomer.
#   * shin2009/overtwist_28_13_plateau is the constant 0.989 deg stiff-linker (espin) plateau
#     indexed by total stoichiometric R (molar_ratio), whereas claessens2008 Fig. 3D measures
#     flexible-linker fascin (continuous rise 0.3-1.1 deg) indexed by effective bound ratio R*
#     (a distinct physical quantity).
#   * shin2009/composite_28_13_packing predicts f_bound = 6/28 = 0.214 bound monomers per
#     actin (= 3/28 = 0.107 cross-links/actin), NOT cross-linkers per actin (Rstar_plateau ~ 0.25),
#     differing by a factor of 2 in cross-link stoichiometry.
#   * claessens2008's aH_hex_saxs (12.4 nm) and Delta_theta_max (~1 deg) have origin: derived
#     (not independent measurements), and claessens2008 has no measured q_11 scalar datum.
#   * shin2009 assumes an infinite 2D hexagonal lattice and predicts no bundle diameter or n_f.
#
# - pelletier2003 + shin2009 (see q_pelletier2003_no_cross_validation):
#   * pelletier2003 measures alpha-actinin (30 nm antiparallel cross-linker) F-actin bundles
#     forming a distorted-square lattice (q_1 = 0.19 nm^-1, q_2 = 0.29 nm^-1, q_2/q_1 = 1.53),
#     mesh size (~5 um), and bundle diameter (~400 nm), with no helical layer-line or overtwist
#     measurements. Incompatible with shin2009's hexagonal short-linker (fascin/espin) models.
#
# - haviv2008 + shin2009 (see q_haviv2008_no_cross_validation):
#   * haviv2008 measures cryo-TEM fascin-actin bundle diameters D_b, filament-count distributions
#     P(N_b), and bundle-onset thresholds phi; it measures neither SAXS spacing nor helical
#     overtwist, while shin2009 predicts neither bundle diameter nor filament-count distributions.
#
# - gov2008 + shin2009 (see q_gov2008_no_cross_validation):
#   * gov2008 is pure theory with 0 origin: measured datums in data.yaml.
#
# - grason2007 + shin2009 (see q_grason2007_no_relation_and_no_cross_validation):
