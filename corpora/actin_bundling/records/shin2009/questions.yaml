    quote: "cooperative binding only occurs over short dis-"
    where: "text, p. 4 col 1"

- id: q_fig3b_overtwist_unstated_formula_and_discrepancy
  kind: unexplained_difference
  about:
    - overtwist_correlation_perturbative
    - overtwist_correlation_transfer_matrix
    - overtwist_rho_exponent_printed
  text: >
    Page 4 col 1 defines g(l_0) = <exp{i(phi_{l_0+delta_l} - phi_{l_0} - omega_0*delta_l)}> and states
    it is calculated perturbatively to O(U^2) for the 28/13 ground state to produce Fig. 3(b), without
    printing the explicit perturbative expression or specifying whether l_0 is fixed to one bond gap
    (dl = 4 or 5) or averaged over the 6 bonds in a 28-monomer repeat. Exact connected O(U^2)
    perturbation theory of the printed single-filament Hamiltonian (verified to 5+ digits against the
    exact non-perturbative 1D Fourier transfer matrix) confirms Im[ln g] ~ rho^2 as U -> 0, but
    disagrees sharply with Fig. 3(b) at finite (beta*U*rho)^2 in [0, 0.25]: (i) in exact O(U^2)
    perturbation theory, incommensurability dephasing causes the overtwist coefficient to peak near
    xi_t ~= 60 and drop by ~56x from xi_t = 100 to xi_t = 1000, whereas Fig. 3(b) shows xi_t = 1000
    rising above xi_t = 100 to ~0.114 rad; (ii) in the exact non-perturbative transfer matrix, all
    three persistence lengths (xi_t = 10, 100, 1000) saturate to the same mean bond-interval overtwist
    pi/39 = 0.0806 rad (and at most 5*pi/182 = 0.0863 rad for a 5-monomer interval at xi_t = 1000),
    whereas Fig. 3(b) shows distinct plateaus (~0.008, ~0.078, ~0.114 rad) with xi_t = 1000 exceeding
    0.0863 rad and xi_t = 10 saturating an order of magnitude below pi/39; and (iii) the plotted
    xi_t = 100 and xi_t = 1000 curves in Fig. 3(b) are concave up near the origin x = 0 (fitting
    atan2(I*x^2, 1 + R*x^2) within ~0.001 rad), which is mathematically impossible for any O(U^2)
    ratio atan2(I*x, 1 + R*x) with R > 0 as a function of x = (beta*U*rho)^2 (suggesting either an
    unstated higher-order/resummed expression or that the Fig. 3(b) x-axis coordinate is beta*U*rho
    rather than (beta*U*rho)^2). Downstream figure digitization of Fig. 3(b) will quantify these offsets.
  citation:
    page: 4
    printed_page: "238102-4"
    quote: "ground state and find overtwist, as measured by"
    where: "text, p. 4 col 1 & Fig. 3(b)"

