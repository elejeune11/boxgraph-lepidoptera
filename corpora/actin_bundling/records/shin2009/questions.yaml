  text: >
    Page 4 col 1 states 'For small xi_t, cooperative binding only occurs over short distances, so that
    u ~ xi_t.' On the discrete 28/13 lattice where neighboring cross-link sites are separated by at least
    4 monomers (gaps of 4 and 5, mean spacing 28/6 = 4.67), the exact sum decays exponentially as
    u(xi_t) ~ exp(-4/xi_t) for xi_t << 4 (local log-slope d(ln u)/d(ln xi_t) = 4.47 at xi_t = 1 and
    2.52 at xi_t = 2), NOT linearly in xi_t. Approximate linear scaling u ~ xi_t (log-slope ~= 1.0)
    appears only in the intermediate short-range window 4 << xi_t << 58 (e.g., log-slope 1.18 at
    xi_t = 10, 1.03 at xi_t = 15, 0.89 at xi_t = 20), matching the continuum approximation
    u_cont propto xi_t / (1 + (delta_omega*xi_t)^2).
  citation:
