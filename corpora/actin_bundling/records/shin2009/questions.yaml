- id: q_chirality_sign_mismatch_eq3
  kind: possible_error
  about:
    - cooperativity_28_13_printed
    - cooperativity_28_13_left_handed
    - effective_hamiltonian_eq2_eq3
    - omega_0_printed
    - xi_t_max_printed
  text: >
    Chirality sign mismatch between printed omega_0 = +12*pi/13 (p. 2 col 2), printed Eq. (3)
    cos[omega_0*(l - l') - 2*pi*(m - m')/6] (p. 3 col 2), and the six printed 28/13 ground-state
    sites (0,0); (4,1); (9,-1); (14,3); (19,1); (24,-1) (p. 3 col 1 & Fig. 2c). Because F-actin
    is a left-handed 13/6 helix (p. 2 col 1), the printed site sequence advances by dm = +1 over
    dl = 4 (matching -4*12*pi/13 = +4*pi/13 mod 2*pi) and dm = -2 over dl = 5 (matching -5*12*pi/13
    = -8*pi/13 mod 2*pi). Substituting printed positive omega_0 = +12*pi/13 with those site
    coordinates directly into Eq. (3) produces negative nearest-neighbor couplings (cos = -0.429
    for dl = 4 and -0.632 for dl = 5) and negative cooperativity u < 0 for all xi_t > 0, with no
    maximum near xi_t ~= 60 and no attractive bundling transition. Using the consistent left-handed
    sign omega_0 = -12*pi/13 (equivalently +2*pi*(m - m')/6 in Eq. 3, implemented in variant
    cooperativity_28_13_left_handed) restores positive nearest-neighbor couplings (cos = +0.997
    and +0.987), V(l, l') > 0, a cooperativity maximum at xi_t = 57.86 ~= 60, and beta*U_c = 0.841 ~= 1.
  citation:
    page: 3
    printed_page: "238102-3"
    quote: "cross-links to form. There are six monomers in a repeat"
    where: "Eq. 3 & text, p. 3"

- id: q_eq1_expansion_factor_of_2
  kind: possible_error
  about:
    - binding_hamiltonian_eq1
    - eq1_linear_coeff_printed
  text: >
    On p. 2 col 2, the paper represents the ith monomer by spin vector a*S_i (p. 2 col 2) and writes
    the in-plane squared linker deformation as (Delta_ij - Delta_0)^2 ~= C_0 - 2*a^2*D_hat_ij.(S_i - S_j)
    + O(S^2). For monomer binding sites at R_i + a*S_i and R_j + a*S_j with filament separation vector
    R_j - R_i = D*D_hat_ij, the aligned state (S_i = +D_hat_ij, S_j = -D_hat_ij) has separation
    Delta_0 = D - 2*a, which gives Delta_ij - Delta_0 = a*[2 - D_hat_ij.(S_i - S_j)] + O(a^2/D) and
    (Delta_ij - Delta_0)^2 = 4*a^2 - 4*a^2*D_hat_ij.(S_i - S_j) + O(S^2) — a linear coefficient of -4*a^2
    rather than the printed -2*a^2 (which corresponds to D - Delta_0 = a instead of 2*a, or halving
    the two-filament bond energy per filament).
  citation:
    page: 2
    printed_page: "238102-2"
    quote: "the in-plane cross-links so that the square deformation has"
    where: "text, p. 2 col 2"

- id: q_eps0_prime_shift_factor_of_2
  kind: possible_error
  about:
    - effective_hamiltonian_eq2_eq3
    - effective_hamiltonian_cumulant_exact
    - eps0_prime_shift_coeff_printed
  text: >
    Immediately after Eq. (2) (p. 3 col 2), the paper states epsilon_0' = epsilon_0 - U/2. However,
    the printed single-filament bond energy on p. 3 col 1 is -epsilon_0 + U*(1 - cos[phi_l - phi_m]).
    Integrating out the monomer angles phi_l under H_0 = (C/2)*sum(Delta_phi_l - omega_0)^2 gives
    <cos[phi_l - phi_m]>_0 = 0 by global azimuthal rotation symmetry, so the exact first-order cumulant
    shift is +U (giving epsilon_0' = epsilon_0 - U, twice the printed U/2), while the second-order
    cumulant matches Eq. (3) V(l, l') = (beta*U^2/2)*cos[...]*exp(-|l - l'|/xi_t) identically (and
    contributes a self-term +beta*U^2/4 to epsilon_0' if l = l' is excluded from the pair sum in Eq. 2).
    Because epsilon_0' enters the mean-field EOS only through the effective fugacity z = exp[beta*(mu + epsilon_0')],
    this shift does not alter V(l, l'), u, u_c = 4, or xi_t_max.
  citation:
    page: 3
    printed_page: "238102-3"
    quote: "energy for adding a bond at a layer"
    where: "Eq. 2 text, p. 3 col 1-2"

