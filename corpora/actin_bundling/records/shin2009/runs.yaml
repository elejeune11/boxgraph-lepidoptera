- id: run_fig3b_tm_xit100
  model: overtwist_fig3b_transfer_matrix
  inputs:
    xi_t: xi_t_fig3b_100_printed
    omega_0: omega_0_printed
  sweep:
    x_sq: overtwist_fig3b_xit100
  outputs:
    overtwist: overtwist_fig3b_tm_xit100_comp

- id: run_fig3b_tm_xit10
  model: overtwist_fig3b_transfer_matrix
  inputs:
    xi_t: xi_t_fig3b_10_printed
    omega_0: omega_0_printed
  sweep:
    x_sq: overtwist_fig3b_xit10
  outputs:
    overtwist: overtwist_fig3b_tm_xit10_comp

- id: run_fig1e_28_13_espin
  model: overtwist_28_13_plateau
  inputs:
    delta_omega_28_13: delta_omega_28_13_comp
  sweep:
    R: overtwist_fig1e_espin
  outputs:
    delta_omega: overtwist_28_13_fig1e_espin_comp

- id: run_fig1e_28_13_fascin
  model: overtwist_28_13_plateau
  inputs:
    delta_omega_28_13: delta_omega_28_13_comp
  sweep:
    R: overtwist_fig1e_fascin
  outputs:
    delta_omega: overtwist_28_13_fig1e_fascin_comp

- id: run_saxs_peaks_fig1c_R0p33
  model: saxs_layer_line_peak_finder
  inputs:
    I_q: I_saxs_fig1c_fascin_R0p33
  outputs:
    q_layer1: q1_fig1c_R0p33_comp
    q_layer2: q2_fig1c_R0p33_comp

- id: run_saxs_peaks_fig1d_R0p2
  model: saxs_layer_line_peak_finder
  inputs:
    I_q: I_saxs_fig1d_espin_R0p2
  outputs:
    q_layer1: q1_fig1d_R0p2_comp
    q_layer2: q2_fig1d_R0p2_comp

- id: run_saxs_peaks_fig1d_pure
  model: saxs_layer_line_peak_finder
