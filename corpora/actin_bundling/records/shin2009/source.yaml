    (qualitative pattern); (c) circularly averaged pseudo-Voigt-subtracted SAXS intensity I(q) [a.u.]
    vs q [A^-1] (0.105-0.14) for fascin:actin at R = 0.05, 0.1, 0.2, 0.33 (quantitative curves
    showing shift of first layer line peak); (d) circularly averaged SAXS intensity I(q) [a.u.] vs
    q [A^-1] (0.105-0.14) for espin:actin at pure F-actin and R = 0.02, 0.05, 0.2 from Ref. [7]
    (quantitative curves showing 2-phase coexistence of 13/6 and 28/13 peaks); (e) measured F-actin
    overtwist [degrees] (0-1.2) vs molar ratio R (0-0.4) for espin (black filled squares with error
    bars, 6 points) and fascin (red open circles with error bars, 5 points; error-bar meaning
    unstated in caption/text) — primary quantitative experimental data panel for downstream digitization.
  - Fig. 2 (p. 3, 238102-3): purely schematic/geometric illustrations of (a) two actin filaments
    linked by a cross-link, (b) X,Y spin representation S_i, S_j with spacing D and distance Delta_ij,
    and (c) top-view angular distribution of the 6 cross-linkers (0; 4,19; 9,24; 14) in the 28/13
