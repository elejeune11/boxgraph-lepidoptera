notes: >
  In scope: the paper's complete experimental structural analysis and coarse-grained statistical
  mechanics model of cross-linker-mediated parallel F-actin bundles (fascin and espin) —
  hexagonal interactin lattice spacing D = 4*pi/(sqrt(3)*q_10) and q_11 = sqrt(3)*q_10 from SAXS
  peaks (p. 2), cross-linker sizes d_linker = D - d_actin for fascin and espin (p. 2), geometric
  helical overtwist from native 13/6 to bundled 28/13 symmetry (p. 2), composite 28/13 ground-state
  packing from 4 sections of 30/14 (5 monomers) and 2 sections of 24/11 (4 monomers) giving bound
  fraction 6/28 ~= 0.214 (p. 3), microscopic binding Hamiltonian Eq. (1) and its in-plane expansion
  (p. 2), continuum filament twist Hamiltonian H_0 and single-bond cosine distortion energy (p. 3),
  perturbative integration of spin degrees of freedom yielding effective cross-link Hamiltonian
  Eq. (2) and pairwise coupling Eq. (3) with twist persistence length xi_t = 2*beta*C (p. 3),
  net cooperativity parameter u(beta*U, xi_t) on the infinite periodic 28/13 lattice (printed sign
  and chirality-corrected variant, pp. 3-4), grand-canonical mean-field equation of state
  rho = (1 + z^-1 * exp(-u*rho))^-1, exact critical point (u_c = 4, rho_c = 1/2, z_c = e^-2),
  critical susceptibility divergence chi_rho ~ |z - z_c|^(-2/3), critical stiffness scaling
  k_c ~= k_B*T/a^2 (pp. 3-4), and the monomer-monomer overtwist correlation function g(l_0)
  (both exact O(U^2) connected perturbation theory and exact non-perturbative 1D Fourier transfer
  matrix verifying Im[ln g] ~ rho^2 as U -> 0, p. 4). Non-runnable external models (4-sphere SAXS
  twist fitting citing Refs. [4, 7, 14] and the exhaustive composite hexagonal-tiling search up to
  40 monomers/repeat citing unpublished Ref. [19]) are recorded with runnable: false and open
  questions.
  Left out: experimental preparation and beamline apparatus details that feed no model in this
  paper — polymerization salt 100 mM KCl, average F-actin length ~1 um, recombinant rat espin 3A
  molecular weight 34.3 kDa, recombinant human fascin molecular weight 57.8 kDa, N-terminal 6xHis
  tag, 0.15 mg F-actin per capillary, SAXS beam energies 9 keV (SSRL beam line 4-2) and 12 keV
  (APS beam line 12-ID), MAR Research CCD pixel size 79 um, experimental q-range 0.01 < q < 0.2 A^-1,
  and the standard scattering vector definition q = (4*pi*sin(theta))/lambda (all p. 1 col 2).
  Figures cataloged (left for downstream digitize stage — no figure digitization in this read pass):
  - Fig. 1 (p. 2, 238102-2): (a) 2D SAXS detector image of fascin-actin bundle at R = 0.3 (qualitative
