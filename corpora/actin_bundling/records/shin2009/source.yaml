  Key analytical findings and discrepancies audited in this record:
  (1) Chirality sign mismatch between printed omega_0 = +12*pi/13 (p. 2 col 2), printed Eq. (3)
  cos[omega_0*(l - l') - 2*pi*(m - m')/6], and the six printed 28/13 ground-state sites (0,0);
  (4,1); (9,-1); (14,3); (19,1); (24,-1) (p. 3 col 1 & Fig. 2c): the printed sites follow
  left-handed angular steps (matching p. 2 col 1 'left-handed 13/6'), so plugging printed positive
  omega_0 = +12*pi/13 into printed Eq. (3) yields negative nearest-neighbor couplings (-0.429,
  -0.632) and negative cooperativity u < 0 for all xi_t > 0 (no peak near xi_t ~= 60 and no
  attractive binding transition). Correcting the relative chirality sign in variant
  cooperativity_28_13_left_handed (omega_0 = -12*pi/13, equivalently +2*pi*(m - m')/6 in Eq. 3)
  recovers positive nearest-neighbor couplings (+0.997, +0.987) and an exact maximum of u(xi_t) at
  xi_t = 57.86 (reproducing 'around xi_t ~= 60', with u_max/(beta*U)^2 = 5.6575 and critical
  stiffness beta*U_c = 0.8408 ~= 1, reproducing k_c ~= k_B*T/a^2).
  (2) Factor-of-2 discrepancy in Eq. (1) in-plane expansion (p. 2 col 2): for spin vectors a*S_i
  and exact aligned distance Delta_0 = D - 2*a, (Delta_ij - Delta_0)^2 = 4*a^2 - 4*a^2*D_hat.(S_i - S_j)
  + O(S^2), twice the printed linear coefficient -2*a^2.
  (3) Factor-of-2 discrepancy in eps_0' = eps_0 - U/2 (p. 3 col 2): exact cumulant integration of
  the printed single-filament bond energy -eps_0 + U*(1 - cos[phi_l - phi_m]) reproduces Eq. (3)
  V(l, l') = (beta*U^2/2)*cos[...]*exp(-|l-l'|/xi_t) exactly, but gives O(U) shift eps_0' = eps_0 - U
  (since <cos>_0 = 0), plus O(U^2) self-term +beta*U^2/4 if l = l' is excluded from the pair sum;
  this shifts only z and leaves V, u, u_c, and xi_t_max unaffected.
  (4) Small-xi_t scaling u ~ xi_t (p. 4 col 1): on the discrete 28/13 lattice (minimum bond gap
  4 monomers), u(xi_t) ~ exp(-4/xi_t) is exponentially suppressed for xi_t << 4 (log-slope 2.52
  at xi_t = 2), and exhibits approximate linear scaling u ~ xi_t (log-slope ~= 1.0) only in the
  intermediate window 4 << xi_t << 58 (e.g., log-slope 1.03 at xi_t = 15; continuum limit strictly
  gives u ~ xi_t as xi_t -> 0).
  (5) Unstated O(U^2) formula for g(l_0) and unexplained discrepancy with Fig. 3(b): both exact
  connected O(U^2) perturbation theory and the exact 1D mean-field transfer matrix confirm
  Im[ln g] ~ rho^2 as U -> 0 (exponent 2.0000), yet neither reproduces the Fig. 3(b) curves
  (where xi_t = 1000 exceeds xi_t = 100 and reaches ~0.114 rad above the uniform 28/13 mean
  pi/39 = 0.0806 rad, xi_t = 10 plateaus at ~0.008 rad, and xi_t = 100, 1000 are concave up near
  the origin despite the axis being labeled (beta*U*rho)^2).
