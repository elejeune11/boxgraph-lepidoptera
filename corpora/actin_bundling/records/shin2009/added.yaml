# ==========================================================================
# Unstated physical/evaluation inputs needed to run dimensionless or parametric
# models of shin2009 (all chosen values include realistic alternatives).
# ==========================================================================
- id: kBT_room_temp_added
  quantity: thermal_energy
  unit: pN*nm
  printed: "4.11"
  basis: "Standard room-temperature thermal energy k_B*T at T = 298 K (25 degC), needed to evaluate energy-dimensioned Hamiltonians H_binding, H_eff, and V(l, l')."
  alternatives: ["4.04", "4.28"]
  stands_for: "k_B*T = 1/beta in Eqs. (1)-(3) and p. 4"

- id: monomer_size_a_added
  quantity: monomer_size
  unit: nm
  printed: "3.75"
  basis: "Half of the F-actin filament diameter d_actin = 7.5 nm reported on p. 2 col 1 (Ref. [18]), representing the radial lever arm a of spin vector a*S_i."
  alternatives: ["2.75", "5.5"]
  stands_for: "a (monomer size) in spin vector a*S_i and Eq. (1) expansion (p. 2 col 2)"

- id: linker_stiffness_k_added
  quantity: linker_stiffness
  unit: pN/nm
  printed: "0.3"
  basis: "Order-of-magnitude cross-linker stiffness near the paper's critical scale k_c ~= k_B*T/a^2 (~0.29 pN/nm for k_B*T = 4.11 pN*nm and a = 3.75 nm)."
  alternatives: ["0.1", "1.0"]
  stands_for: "k in Eq. (1)"

- id: optimal_binding_energy_eps0_added
  quantity: optimal_binding_energy
  unit: pN*nm
  printed: "41.1"
  basis: "Representative ~10 k_B*T cross-linker binding energy gain to test Eq. (1)-(2) and effective fugacity z; paper does not assign a numeric value to epsilon_0."
  alternatives: ["20.55", "61.65"]
  stands_for: "epsilon_0 in Eqs. (1)-(2)"

- id: chemical_potential_mu_added
  quantity: chemical_potential
  unit: pN*nm
  printed: "-45.21"
  basis: "Representative chemical potential (-11 k_B*T) placing effective fugacity z = exp[beta*(mu + epsilon_0')] near the transition region z ~ O(0.1); paper treats z directly."
  alternatives: ["-41.1", "-49.32"]
  stands_for: "mu in z = exp[beta*(mu + epsilon_0')] (p. 3 col 2)"

- id: linker_energy_U_added
  quantity: linker_distortion_energy
  unit: pN*nm
  printed: "4.11"
  basis: "Representative linker distortion energy U = 1.0 k_B*T (beta*U = 1), near the critical regime U_c ~ k_B*T (p. 4 col 1)."
  alternatives: ["2.055", "8.22"]
  stands_for: "U in single-bond energy and Eq. (2)-(3)"

- id: torsional_stiffness_C_added
  quantity: torsional_stiffness
  unit: pN*nm
  printed: "123.3"
  basis: "Filament discrete torsional stiffness C = 30 k_B*T corresponding to twist persistence length xi_t = 2*beta*C = 60 monomers (the paper's cooperativity peak location on p. 4 col 1)."
  alternatives: ["20.55", "205.5"]
  stands_for: "C in H_0 = (C/2)*sum(Delta_phi_l - omega_0)^2 and xi_t = 2*beta*C (p. 3)"

- id: beta_U_baseline_added
  quantity: dimensionless_linker_stiffness
  unit: dimensionless
  printed: "1.0"
  basis: "Baseline dimensionless linker stiffness beta*U = 1 for evaluating u(beta*U, xi_t) and verifying u propto (beta*U)^2 (exact for any beta*U > 0)."
  alternatives: ["0.5", "2.0"]
  stands_for: "beta*U in Eq. (3) and u (p. 4 col 1)"

- id: beta_U_small_added
  quantity: dimensionless_linker_stiffness
  unit: dimensionless
  printed: "0.01"
  basis: "Small dimensionless linker stiffness beta*U = 0.01 to evaluate the U -> 0 perturbative scaling limit Im[ln g] ~ rho^2 claimed on p. 4 col 1."
  alternatives: ["0.001", "0.05"]
  stands_for: "beta*U in the U -> 0 limit for g(l_0) (p. 4 col 1)"

- id: xi_t_peak_eval_added
  quantity: twist_persistence_length
  unit: dimensionless
  printed: "57.86"
  basis: "Optimal twist persistence length near the cooperativity peak xi_t ~= 60 monomers (p. 4 col 1) for evaluating u_max and critical stiffness k_c/(k_B*T/a^2)."
  alternatives: ["10", "100", "200"]
  stands_for: "xi_t near cooperativity maximum (p. 4 col 1)"

- id: xi_t_very_small_added
  quantity: twist_persistence_length
  unit: dimensionless
  printed: "2.0"
  basis: "Truly small twist persistence length (xi_t = 2 < minimum inter-bond gap 4 monomers) to test the strict xi_t -> 0 behavior of the discrete-lattice sum for u ~ xi_t."
  alternatives: ["1.0", "3.0"]
  stands_for: "small xi_t in u ~ xi_t (p. 4 col 1)"

- id: xi_t_intermediate_added
  quantity: twist_persistence_length
  unit: dimensionless
  printed: "15.0"
  basis: "Intermediate short-range twist persistence length (4 < xi_t = 15 << 58) where cooperative binding spans a few neighboring bonds before 13/6-28/13 incommensurability sets in."
  alternatives: ["10.0", "20.0"]
  stands_for: "short-range xi_t in u ~ xi_t (p. 4 col 1)"

- id: xi_t_fig3b_mid_added
  quantity: twist_persistence_length
  unit: dimensionless
  printed: "100"
  basis: "Middle twist persistence length curve value xi_t = 100 printed directly as a curve label in Fig. 3(b) (p. 3)."
  alternatives: ["10", "1000"]
  stands_for: "xi_t curve parameter in Fig. 3(b) (p. 3)"

- id: rho_eval_added
  quantity: site_occupancy
  unit: dimensionless
  printed: "0.5"
  basis: "Mid-range site occupancy rho = 0.5 for evaluating overtwist correlation g(l_0) and its small-U scaling exponent in rho."
  alternatives: ["0.2", "0.8"]
  stands_for: "rho in g(l_0) and Im[ln g] ~ rho^2 (p. 4 col 1)"

- id: u_first_order_eval_added
  quantity: dimensionless_cooperativity
  unit: dimensionless
  printed: "5.0"
  basis: "Representative super-critical cooperativity u = 5 > u_c = 4 in the stiff-linker first-order regime (Fig. 3a and p. 4 col 1)."
  alternatives: ["4.5", "6.0"]
  stands_for: "u > u_c in first-order regime of mean-field EOS (p. 4 col 1)"

- id: z_eval_added
  quantity: effective_fugacity
  unit: dimensionless
  printed: "0.2"
  basis: "Representative effective fugacity z = 0.2 > z_c = e^-2 ~= 0.1353 in the strongly-bound region to evaluate the mean-field EOS rho(z, u) and susceptibility chi_rho."
  alternatives: ["0.05", "0.135335", "0.5"]
  stands_for: "z in rho = (1 + z^-1 * exp(-u*rho))^-1 (p. 3 col 2)"

- id: spin_projection_eval_added
  quantity: spin_projection
  unit: dimensionless
  printed: "1.0"
  basis: "Non-aligned test spin projection x = D_hat_ij.(S_i - S_j) = 1.0 (halfway between orthogonal x=0 and fully aligned x=2) for evaluating single-bond energy Eq. (1)."
  alternatives: ["0.0", "2.0"]
  stands_for: "D_hat_ij.(S_i - S_j) in Eq. (1) expansion (p. 2 col 2)"
