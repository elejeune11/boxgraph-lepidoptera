id: overtwist_correlation_perturbative
name: exact O(U^2) connected perturbative overtwist correlation Im[ln g]
role: model
reconstructed: "The paper defines g(l_0) = <exp{i(phi_{l_0+delta_l} - phi_{l_0} - omega_0*delta_l)}> (p. 4 col 1) and states it is calculated perturbatively to O(U^2) for the 28/13 ground state, but omits the explicit O(U^2) formula and does not specify whether g(l_0) is evaluated on one bond interval or averaged over the 6 intervals of the 28-monomer repeat. This model evaluates the exact connected O(U^2) cumulant expansion of the printed single-filament Hamiltonian H_0 + H_bond with chirality-consistent sign (clockwise phi_m = -2*pi*m/6 with omega_0 = +12*pi/13 so overtwist is positive), averaged over all 6 neighboring bond intervals."
stated:
  page: 4
  printed_page: "238102-4"
  quote: "ground state and find overtwist, as measured by"
  where: "text, p. 4 col 1 & Fig. 3(b)"
equation: "g(l_0) = <exp{i(phi_{l_0+delta_l} - phi_{l_0} - omega_0*delta_l)}>; Im[ln g] = atan2(x*Im_c, 1 + x*Re_c) where x = (beta*U*rho)^2"
inputs:
  beta_U:
    quantity: dimensionless_linker_stiffness
    unit: dimensionless
  rho:
    quantity: site_occupancy
    unit: dimensionless
  xi_t:
    quantity: twist_persistence_length
    unit: dimensionless
  omega_0:
    quantity: monomer_twist_angle
    unit: rad
outputs:
  overtwist:
    quantity: bond_interval_overtwist
    unit: rad
    description: "Mean Im[ln g(l_0)] over the 6 neighboring bond intervals in the 28/13 ground state."
  rho_exponent:
    quantity: scaling_exponent
    unit: dimensionless
    description: "Local log-slope d(ln Im[ln g])/d(ln rho) verifying Im[ln g] ~ rho^2 in the U -> 0 limit."
settings: {}
stochastic: false
