id: effective_hamiltonian_cumulant_exact
name: exact O(U^2) Gaussian cumulant integration of single-filament H_0 + H_bond
role: model
from_words: true
stated:
  page: 3
  printed_page: "238102-3"
  quote: "spin degrees of freedom via a thermodynamic perturbation"
  where: "text, p. 3 col 1-2"
equation: "H_0 = (C/2)*sum(Delta_phi_l - omega_0)^2; H_bond = sum n_{l,m}*[-eps_0 + U*(1 - cos(phi_l - phi_m))] => eps_0' = eps_0 - U (O(U) cumulant), V(l, l') = (beta*U^2/2)*cos[omega_0*(l-l') - (phi_m - phi_{m'})]*exp(-|l-l'|/(2*beta*C))"
inputs:
  eps_0:
    quantity: optimal_binding_energy
    unit: pN*nm
  U:
    quantity: linker_distortion_energy
    unit: pN*nm
  C:
    quantity: torsional_stiffness
    unit: pN*nm
  kBT:
    quantity: thermal_energy
    unit: pN*nm
  omega_0:
    quantity: monomer_twist_angle
    unit: rad
outputs:
  xi_t:
    quantity: twist_persistence_length
    unit: dimensionless
  eps_0_prime_O1:
    quantity: effective_binding_energy
    unit: pN*nm
    description: "Exact O(U) effective single-site binding energy eps_0 - U (keeping l = l' inside Eq. 2 pair sum)."
  eps_0_prime_O2_no_self:
    quantity: effective_binding_energy
    unit: pN*nm
    description: "Exact O(U^2) effective single-site binding energy eps_0 - U + beta*U^2/4 when l = l' self-term is folded into the one-body term."
  c_U_exact:
    quantity: binding_energy_shift_coefficient
    unit: dimensionless
    description: "Exact O(U) shift coefficient c_U = 1 in eps_0' = eps_0 - c_U*U since <1 - cos(phi_l - phi_m)>_0 = 1."
  V_nn_4:
    quantity: pairwise_bond_coupling
    unit: pN*nm
  V_nn_5:
    quantity: pairwise_bond_coupling
    unit: pN*nm
settings: {}
stochastic: false
