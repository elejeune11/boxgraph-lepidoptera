  quote: "fitting 2D SAXS data to the four sphere model of"
  where: "text, p. 1 col 2 & p. 2 col 1"
inputs:
  q_layer1:
    quantity: scattering_wavevector
    unit: 1/angstrom
  q_layer2:
    quantity: scattering_wavevector
    unit: 1/angstrom
outputs:
  overtwist:
    quantity: filament_overtwist_per_monomer
    unit: degree
settings: {}
stochastic: false
