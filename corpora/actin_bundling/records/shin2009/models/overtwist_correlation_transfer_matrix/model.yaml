id: overtwist_correlation_transfer_matrix
name: exact non-perturbative 1D Fourier transfer matrix for mean-field overtwist g(l_0)
role: model
reconstructed: "Exact non-perturbative 1D transfer-matrix solution of the single-filament mean-field Hamiltonian H_MF = (C/2)*sum(Delta_phi_l - omega_0)^2 - U*rho*sum cos(phi_l - phi_m) on the periodic 28/13 lattice; constructed to cross-check the O(U^2) perturbative expansion of g(l_0) and audit the plateau heights and ordering of Fig. 3(b)."
stated:
  page: 4
  printed_page: "238102-4"
  quote: "ground state and find overtwist, as measured by"
  where: "text, p. 4 col 1 & Fig. 3(b)"
equation: "g(l_0) = Tr[T_mod * T_cell^(N-1)] / Tr[T_cell^N] under H_MF = (C/2)*sum(Delta_phi_l - omega_0)^2 - U*rho*sum cos(phi_l - phi_m)"
inputs:
  beta_U:
    quantity: dimensionless_linker_stiffness
    unit: dimensionless
  rho:
    quantity: site_occupancy
    unit: dimensionless
  xi_t:
    quantity: twist_persistence_length
    unit: dimensionless
  omega_0:
    quantity: monomer_twist_angle
    unit: rad
outputs:
  overtwist:
    quantity: bond_interval_overtwist
    unit: rad
    description: "Exact mean Im[ln g(l_0)] over the 6 neighboring bond intervals in the 28/13 repeat."
  rho_exponent:
    quantity: scaling_exponent
    unit: dimensionless
    description: "Local log-slope d(ln Im[ln g])/d(ln rho) verifying Im[ln g] ~ rho^2 at small beta*U."
settings:
  n_modes: 8
stochastic: false
