id: cooperativity_28_13_printed
name: net cross-linking cooperativity u on 28/13 ground state (Eq. 3, printed positive omega_0)
role: model
stated:
  page: 4
  printed_page: "238102-4"
  quote: "of the net cooperativity of cross-linking. Specifically,"
  where: "Eq. 3 (p. 3) & text (p. 4 col 1)"
equation: "u = N_b^-1 * beta * sum'_{l' != l} V(l, l'), V(l, l') = (beta*U^2/2)*cos[omega_0*(l-l') - 2*pi*(m-m')/6]*exp(-|l-l'|/xi_t) with printed omega_0 = +12*pi/13 and sites (0,0); (4,1); (9,-1); (14,3); (19,1); (24,-1)"
inputs:
  beta_U:
    quantity: dimensionless_linker_stiffness
    unit: dimensionless
  xi_t:
    quantity: twist_persistence_length
    unit: dimensionless
  omega_0:
    quantity: monomer_twist_angle
    unit: rad
outputs:
  u:
    quantity: dimensionless_cooperativity
    unit: dimensionless
  u_norm:
    quantity: normalized_cooperativity
    unit: dimensionless
    description: "Geometry factor u / (beta*U)^2 evaluated on the infinite periodic 28/13 site lattice."
  xi_t_max:
    quantity: twist_persistence_length
    unit: dimensionless
    description: "Twist persistence length maximizing u(xi_t) over xi_t in [1, 1000] (hits lower boundary 1.0 when u decreases monotonically from 0)."
  u_max:
    quantity: normalized_cooperativity
    unit: dimensionless
    description: "Maximum value of u / (beta*U)^2 over xi_t in [1, 1000] (negative when printed positive omega_0 is used)."
  stiffness_exponent:
    quantity: scaling_exponent
    unit: dimensionless
    description: "Log-slope d(ln |u|) / d(ln (beta*U))."
settings:
  opt_tol: 1.0e-6
stochastic: false
