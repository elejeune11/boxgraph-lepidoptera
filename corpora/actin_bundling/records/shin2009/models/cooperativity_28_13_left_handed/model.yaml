id: cooperativity_28_13_left_handed
name: net cross-linking cooperativity u on 28/13 ground state (chirality-consistent left-handed variant)
role: model
variant_of: cooperativity_28_13_printed
corrections:
  - equation: "Eq. (3) and p. 2 col 2 definition of omega_0"
    change: "Use left-handed native twist -omega_0 = -12*pi/13 in Eq. (3) (equivalently flip the sign of 2*pi*(m - m')/6 to +2*pi*(m - m')/6 in Eq. 3) to match the left-handed angular steps of the six printed 28/13 ground-state sites (0,0); (4,1); (9,-1); (14,3); (19,1); (24,-1)."
    evidence: "Page 2 col 1 states F-actin has native 'left-handed 13/6 monomers/turn' symmetry, p. 3 col 2 states V(l, l') > 0 for nearby aligned monomers, and p. 4 col 1 predicts a positive maximum of u(xi_t) around xi_t ~= 60 and critical stiffness k_c ~= k_B*T/a^2. With printed positive omega_0 = +12*pi/13 and printed site signs, nearest-neighbor cosines in Eq. (3) are negative (-0.429 and -0.632) and u < 0 for all xi_t > 0; with consistent left-handed sign (-omega_0), nearest-neighbor cosines are +0.997 and +0.987, V > 0, u peaks at xi_t = 57.86 ~= 60, and beta*U_c = 0.841 ~= 1."
stated:
  page: 4
  printed_page: "238102-4"
  quote: "of the net cooperativity of cross-linking. Specifically,"
  where: "Eq. 3 (p. 3) & text (p. 4 col 1)"
equation: "u = N_b^-1 * beta * sum'_{l' != l} (beta*U^2/2)*cos[-omega_0*(l-l') - 2*pi*(m-m')/6]*exp(-|l-l'|/xi_t)"
inputs:
  beta_U:
    quantity: dimensionless_linker_stiffness
    unit: dimensionless
  xi_t:
    quantity: twist_persistence_length
    unit: dimensionless
  omega_0:
    quantity: monomer_twist_angle
    unit: rad
outputs:
  u:
    quantity: dimensionless_cooperativity
    unit: dimensionless
  u_norm:
    quantity: normalized_cooperativity
    unit: dimensionless
  xi_t_max:
    quantity: twist_persistence_length
    unit: dimensionless
  stiffness_exponent:
    quantity: scaling_exponent
    unit: dimensionless
  local_xit_exponent:
    quantity: scaling_exponent
    unit: dimensionless
    description: "Local power-law log-slope d(ln u)/d(ln xi_t) evaluated at the input xi_t."
  beta_U_crit:
    quantity: dimensionless_critical_stiffness_prefactor
    unit: dimensionless
    description: "Dimensionless critical linker stiffness k_c/(k_B*T/a^2) = beta*U_c = sqrt(4 / u_norm(xi_t))."
settings:
  opt_tol: 1.0e-6
stochastic: false
