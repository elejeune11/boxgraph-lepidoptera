id: mean_field_critical_point
name: mean-field critical point (u_c, rho_c, z_c) and susceptibility exponent
role: model
built_from:
  - mean_field_eos
stated:
  page: 4
  printed_page: "238102-4"
  quote: "this susceptibility diverges at"
  where: "text, p. 4 col 1"
equation: "dz/drho = 0 and d^2z/drho^2 = 0 for z(rho) = (rho/(1-rho))*exp(-u*rho); chi_rho ~ |z - z_c|^(-2/3)"
inputs: {}
outputs:
  u_c:
    quantity: dimensionless_cooperativity
    unit: dimensionless
    description: "Critical cooperativity parameter where spinodal points merge."
  rho_c:
    quantity: site_occupancy
    unit: dimensionless
    description: "Critical site occupancy where chi_rho diverges."
  z_c:
    quantity: effective_fugacity
    unit: dimensionless
    description: "Critical effective fugacity z(rho_c, u_c)."
  chi_exponent:
    quantity: scaling_exponent
    unit: dimensionless
    description: "Critical susceptibility divergence exponent d(ln chi_rho) / d(ln |z - z_c|) at u = u_c."
settings:
  tol: 1.0e-12
  delta_rho: 1.0e-3
stochastic: false
