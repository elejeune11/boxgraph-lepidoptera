id: linker_size_from_spacing
name: cross-linker size from interactin spacing and F-actin diameter
role: processing
from_words: true
stated:
  page: 2
  printed_page: "238102-2"
  quote: "F-actin diameter of 7.5 nm [18]. Using the 4-sphere model,"
  where: "text, p. 2 col 1"
equation: "d_linker = D - d_actin"
inputs:
  D:
    quantity: interactin_spacing
    unit: nm
  d_actin:
    quantity: actin_diameter
    unit: nm
outputs:
  d_linker:
    quantity: linker_size
    unit: nm
settings: {}
stochastic: false
