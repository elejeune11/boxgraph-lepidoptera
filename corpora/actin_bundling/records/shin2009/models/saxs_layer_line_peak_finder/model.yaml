id: saxs_layer_line_peak_finder
name: intra-actin first and second layer-line peak extractor from SAXS I(q)
role: processing
from_words: true
stated:
  page: 2
  printed_page: "238102-2"
  quote: "Peaks were found at 0.057, 0.100,"
  where: "text, p. 2 col 1 & Figs. 1(c,d)"
equation: "q_layer1 = argmax_{q in [0.110, 0.124]} I(q); q_layer2 = argmax_{q in [0.124, 0.138]} I(q) (3-point parabolic refinement)"
inputs:
  I_q:
    quantity: saxs_intensity
    unit: dimensionless
    curve:
      quantity: scattering_wavevector
      unit: 1/angstrom
outputs:
  q_layer1:
    quantity: scattering_wavevector
    unit: 1/angstrom
    description: "First intra-actin helical layer-line peak position in [0.110, 0.124] A^-1."
  q_layer2:
    quantity: scattering_wavevector
    unit: 1/angstrom
    description: "Second intra-actin helical layer-line peak position in [0.124, 0.138] A^-1."
settings: {}
stochastic: false
