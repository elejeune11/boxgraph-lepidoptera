id: overtwist_fig3b_transfer_matrix
name: exact 1D transfer-matrix overtwist Im[ln g] vs (beta*U*rho)^2 (Fig. 3b)
role: model
built_from:
  - overtwist_correlation_transfer_matrix
reconstructed: "Re-parameterizes the exact non-perturbative 1D Fourier transfer matrix model overtwist_correlation_transfer_matrix in the Fig. 3(b) abscissa x_sq = (beta*U*rho)^2 (setting h = beta*U*rho = sqrt(x_sq)) for point-by-point comparison against all three digitized Fig. 3(b) curves (xi_t = 10, 100, 1000)."
stated:
  page: 4
  printed_page: "238102-4"
  quote: "ground state and find overtwist, as measured by"
  where: "text, p. 4 col 1 & Fig. 3(b)"
equation: "g(l_0) = Tr[T_mod * T_cell^(N-1)] / Tr[T_cell^N] with h = beta*U*rho = sqrt(x_sq)"
inputs:
  x_sq:
    quantity: squared_mean_field_coupling
    unit: dimensionless
  xi_t:
    quantity: twist_persistence_length
    unit: dimensionless
  omega_0:
    quantity: monomer_twist_angle
    unit: rad
outputs:
  overtwist:
    quantity: bond_interval_overtwist
    unit: rad
    description: "Exact non-perturbative mean Im[ln g(l_0)] over the 6 neighboring bond intervals in the 28/13 repeat."
settings:
  n_modes: 16
stochastic: false
