id: mean_field_eos
name: grand-canonical mean-field equation of state and coexistence (p. 3-4)
role: model
stated:
  page: 3
  printed_page: "238102-3"
  quote: "solution to the self-consistency condition,"
  where: "text, p. 3 col 2 & p. 4 col 1"
equation: "rho = (1 + z^-1 * exp(-u*rho))^-1; chi_rho = d(rho)/dz = rho*(1-rho) / [z*(1 - u*rho*(1-rho))]"
inputs:
  z:
    quantity: effective_fugacity
    unit: dimensionless
  u:
    quantity: dimensionless_cooperativity
    unit: dimensionless
outputs:
  rho:
    quantity: site_occupancy
    unit: dimensionless
    description: "Thermodynamically stable equilibrium site occupancy minimizing grand potential omega(rho) = -(1/2)*u*rho^2 + rho*ln(rho) + (1-rho)*ln(1-rho) - rho*ln(z)."
  chi_rho:
    quantity: linker_susceptibility
    unit: dimensionless
    description: "Equilibrium linker susceptibility chi_rho = d(rho)/dz."
  z_coex:
    quantity: effective_fugacity
    unit: dimensionless
    description: "Exact first-order coexistence fugacity exp(-u/2) for u >= 4 (equal to z_c = e^-2 at u = 4)."
  delta_rho_coex:
    quantity: site_occupancy
    unit: dimensionless
    description: "Discontinuous jump rho_+ - rho_- across the first-order transition at z = z_coex (0 for u <= 4)."
settings:
  tol: 1.0e-10
stochastic: false
