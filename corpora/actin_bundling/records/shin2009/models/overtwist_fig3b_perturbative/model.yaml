id: overtwist_fig3b_perturbative
name: exact O(U^2) perturbative overtwist Im[ln g] vs (beta*U*rho)^2 (Fig. 3b)
role: model
built_from:
  - overtwist_correlation_perturbative
reconstructed: "Re-parameterizes the reconstructed connected O(U^2) perturbative model overtwist_correlation_perturbative directly in the Fig. 3(b) horizontal axis variable x_sq = (beta*U*rho)^2 so it can be swept quantitatively against all three digitized Fig. 3(b) curves (xi_t = 10, 100, 1000)."
stated:
  page: 4
  printed_page: "238102-4"
  quote: "ground state and find overtwist, as measured by"
  where: "text, p. 4 col 1 & Fig. 3(b)"
equation: "Im[ln g(l_0)] = (1/6) * sum_{b=1}^6 atan2(x_sq * Im_c(b, xi_t), 1 + x_sq * Re_c(b, xi_t)), x_sq = (beta*U*rho)^2"
inputs:
  x_sq:
    quantity: squared_mean_field_coupling
    unit: dimensionless
  xi_t:
    quantity: twist_persistence_length
    unit: dimensionless
  omega_0:
    quantity: monomer_twist_angle
    unit: rad
outputs:
  overtwist:
    quantity: bond_interval_overtwist
    unit: rad
    description: "Mean connected O(U^2) perturbative Im[ln g(l_0)] over the 6 neighboring bond intervals in the 28/13 ground state."
settings: {}
stochastic: false
