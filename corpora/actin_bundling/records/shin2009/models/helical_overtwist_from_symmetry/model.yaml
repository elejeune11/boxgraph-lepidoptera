id: helical_overtwist_from_symmetry
name: geometric F-actin twist angle and overtwist from helical symmetries
role: processing
from_words: true
stated:
  page: 2
  printed_page: "238102-2"
  quote: "symmetry of unbundled F actin to a symmetry of 28=13"
  where: "text, p. 2 col 1-2"
equation: "omega_0 = 2*pi*t_native/n_native; omega_bundle = 2*pi*t_bundle/n_bundle; delta_omega = (omega_bundle - omega_0) * (180/pi)"
inputs:
  n_native:
    quantity: monomer_count
    unit: dimensionless
  t_native:
    quantity: helical_turn_count
    unit: dimensionless
  n_bundle:
    quantity: monomer_count
    unit: dimensionless
  t_bundle:
    quantity: helical_turn_count
    unit: dimensionless
outputs:
  omega_0:
    quantity: monomer_twist_angle
    unit: rad
  omega_bundle:
    quantity: monomer_twist_angle
    unit: rad
  delta_omega:
    quantity: filament_overtwist_per_monomer
    unit: degree
settings: {}
stochastic: false
