id: effective_hamiltonian_eq2_eq3
name: effective cross-link Hamiltonian and pairwise coupling (Eqs. 2-3, printed)
role: model
stated:
  page: 3
  printed_page: "238102-3"
  quote: "is a pairwise coupling be-"
  where: "Eqs. 2-3, p. 3 col 2"
equation: "eps_0' = eps_0 - U/2; xi_t = 2*beta*C; z = exp[beta*(mu + eps_0')]; V(l, l') = (beta*U^2/2)*cos[omega_0*(l - l') - 2*pi*(m - m')/6]*exp(-|l - l'|/xi_t)"
inputs:
  eps_0:
    quantity: optimal_binding_energy
    unit: pN*nm
  U:
    quantity: linker_distortion_energy
    unit: pN*nm
  C:
    quantity: torsional_stiffness
    unit: pN*nm
  mu:
    quantity: chemical_potential
    unit: pN*nm
  kBT:
    quantity: thermal_energy
    unit: pN*nm
  omega_0:
    quantity: monomer_twist_angle
    unit: rad
outputs:
  xi_t:
    quantity: twist_persistence_length
    unit: dimensionless
  eps_0_prime:
    quantity: effective_binding_energy
    unit: pN*nm
  c_U:
    quantity: binding_energy_shift_coefficient
    unit: dimensionless
  z:
    quantity: effective_fugacity
    unit: dimensionless
  V_nn_4:
    quantity: pairwise_bond_coupling
    unit: pN*nm
    description: "Pairwise coupling V(4, 0) between printed neighboring sites (0, 0) and (4, 1) using printed Eq. (3)."
  V_nn_5:
    quantity: pairwise_bond_coupling
    unit: pN*nm
    description: "Pairwise coupling V(9, 4) between printed neighboring sites (4, 1) and (9, -1) using printed Eq. (3)."
settings: {}
stochastic: false
