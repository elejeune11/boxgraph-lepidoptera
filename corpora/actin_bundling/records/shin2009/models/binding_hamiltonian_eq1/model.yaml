id: binding_hamiltonian_eq1
name: microscopic cross-link binding Hamiltonian and exact in-plane expansion (Eq. 1)
role: model
stated:
  page: 2
  printed_page: "238102-2"
  quote: "where the sum runs over sites on neighboring filaments and"
  where: "Eq. 1, p. 2 col 2"
equation: "H_bond = -eps_0 + (k/2)*(Delta_ij - Delta_0)^2; Delta_0 = D - 2*a; (Delta_ij - Delta_0)^2 = 4*a^2 - c_1*a^2*x + O(S^2)"
inputs:
  eps_0:
    quantity: optimal_binding_energy
    unit: pN*nm
  k:
    quantity: linker_stiffness
    unit: pN/nm
  D:
    quantity: interactin_spacing
    unit: nm
  a:
    quantity: monomer_size
    unit: nm
  x:
    quantity: spin_projection
    unit: dimensionless
    description: "In-plane spin difference projection x = D_hat_ij . (S_i - S_j); x = 2 for optimally aligned opposing spins."
outputs:
  Delta_0:
    quantity: monomer_displacement
    unit: nm
  H_bond:
    quantity: bond_hamiltonian_energy
    unit: pN*nm
  c_1_exact:
    quantity: expansion_linear_coefficient
    unit: dimensionless
    description: "Exact linear coefficient c_1 = 2*(D - Delta_0)/a in (Delta_ij - Delta_0)^2 = C_0 - c_1*a^2*x + O(S^2) for aligned Delta_0 = D - 2*a."
settings: {}
stochastic: false
