id: cooperativity_28_13_continuum
name: continuum approximation to net cooperativity u(xi_t) on 28/13 packing
role: model
reconstructed: "Continuum-limit approximation replacing the discrete 28/13 site sum in Eq. (3) with uniform bond density n_0 = 6/28 and twist mismatch delta_omega = pi/182 rad/monomer; constructed to test the paper's small-xi_t linear scaling claim u ~ xi_t (which holds strictly in the continuum limit but is exponentially cut off below xi_t ~ 4 monomers on the discrete lattice) and the dephasing peak scale xi_t_max = 1/delta_omega ~= 57.93."
stated:
  page: 4
  printed_page: "238102-4"
  quote: "cooperative binding only occurs over short dis-"
  where: "text, p. 4 col 1"
equation: "u_norm_cont = (6/28) * xi_t / (1 + (delta_omega*xi_t)^2); xi_t_max = 1 / delta_omega"
inputs:
  beta_U:
    quantity: dimensionless_linker_stiffness
    unit: dimensionless
  xi_t:
    quantity: twist_persistence_length
    unit: dimensionless
  f_bound:
    quantity: bound_monomer_fraction
    unit: dimensionless
  delta_omega:
    quantity: filament_overtwist_per_monomer
    unit: rad
outputs:
  u_cont:
    quantity: dimensionless_cooperativity
    unit: dimensionless
  u_norm_cont:
    quantity: normalized_cooperativity
    unit: dimensionless
  xi_t_max:
    quantity: twist_persistence_length
    unit: dimensionless
  local_xit_exponent:
    quantity: scaling_exponent
    unit: dimensionless
settings: {}
stochastic: false
