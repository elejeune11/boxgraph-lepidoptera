- id: scattering_wavevector
  name: SAXS scattering wavevector magnitude
  dimension: "1/[length]"
  description: Magnitude q of the small-angle x-ray scattering wavevector for bundle structure-factor or actin layer-line peaks.

- id: interactin_spacing
  name: interactin hexagonal lattice spacing
  dimension: "[length]"
  description: Center-to-center spacing D between neighboring parallel F-actin filaments on the hexagonal bundle lattice.

- id: actin_diameter
  name: F-actin filament diameter
  dimension: "[length]"
  description: Effective diameter of an individual F-actin filament used to infer cross-linker span.

- id: linker_size
  name: cross-linking protein size
  dimension: "[length]"
  description: Effective span (D - d_actin) of a fascin or espin cross-linking protein between adjacent bundled filaments.

- id: monomer_count
  name: monomer count
  dimension: dimensionless
  description: Number of G-actin monomers in a helical repeat unit or composite packing section.

- id: helical_turn_count
  name: helical turn count
  dimension: dimensionless
  description: Number of helical turns completed in a repeat unit or symmetry ratio.

- id: section_count
  name: composite packing section count
  dimension: dimensionless
  description: Number of constant-symmetry monomer sections within one composite helical repeat unit.

- id: bound_monomer_fraction
  name: fraction of bound monomers
  dimension: dimensionless
  description: Fraction of monomers per repeat unit aligned with the sixfold hexagonal lattice directions for cross-linking.

- id: monomer_twist_angle
  name: helical twist angle per monomer
  dimension: dimensionless
  description: Azimuthal winding angle per G-actin monomer along the filament axis (omega_0 = 12*pi/13 for native 13/6 F-actin).

- id: filament_overtwist_per_monomer
  name: F-actin overtwist per monomer
  dimension: dimensionless
  description: Excess helical twist angle per monomer of bundled F-actin relative to the native 13/6 unbundled state.

- id: bond_interval_overtwist
  name: mean overtwist between neighboring bonds
  dimension: dimensionless
  description: Excess twist angle between neighboring cross-linked monomers along a filament, measured by Im[ln g(l_0)].

- id: monomer_size
  name: G-actin monomer size
  dimension: "[length]"
  description: Radial scale a of the monomer spin vector a*S_i representing cross-linker binding-site positions.

- id: monomer_displacement
  name: cross-linked monomer separation
  dimension: "[length]"
  description: Distance Delta_ij (or aligned equilibrium distance Delta_0) between binding sites on neighboring filaments.

- id: linker_stiffness
  name: cross-linker spring stiffness
  dimension: "[force]/[length]"
  description: Harmonic deformation stiffness k of a cross-linking protein bond in Eq. (1).

- id: thermal_energy
  name: thermal energy
  dimension: "[energy]"
  description: Thermal energy scale k_B*T = 1/beta.

- id: optimal_binding_energy
  name: distortion-free cross-link binding energy
  dimension: "[energy]"
  description: Minimum (distortion-free) binding energy gain epsilon_0 of an optimally aligned cross-link in Eq. (1).

- id: linker_distortion_energy
  name: linker angular distortion energy scale
  dimension: "[energy]"
  description: Energy scale U ~= k*a^2 penalizing azimuthal misalignment of a cross-linked monomer from a sixfold lattice direction.

- id: effective_binding_energy
  name: renormalized cross-link binding energy
  dimension: "[energy]"
  description: Effective single-site binding energy epsilon_0' entering H_eff Eq. (2) after integrating out filament spin fluctuations.

- id: chemical_potential
  name: cross-linker chemical potential
  dimension: "[energy]"
  description: Grand-canonical chemical potential mu regulating removal of cross-linking proteins from solution.

- id: torsional_stiffness
  name: filament torsional stiffness
  dimension: "[energy]"
  description: Discrete monomer-to-monomer torsional rigidity C in H_0 = (C/2) * sum (Delta_phi_l - omega_0)^2.

- id: twist_persistence_length
  name: dimensionless twist persistence length
  dimension: dimensionless
  description: Filament twist persistence length xi_t = 2*beta*C measured in number of monomers.

- id: pairwise_bond_coupling
  name: pairwise cross-link coupling energy
  dimension: "[energy]"
  description: Effective van der Waals-like pairwise coupling V(l, l') between cross-links at layers l and l' along a filament (Eq. 3).

- id: bond_hamiltonian_energy
  name: cross-link Hamiltonian energy
  dimension: "[energy]"
  description: Energy of a single cross-link bond or effective cross-link configuration.

- id: dimensionless_linker_stiffness
  name: dimensionless linker stiffness
  dimension: dimensionless
  description: Ratio beta*U = U / (k_B*T) controlling perturbative cross-link cooperativity and overtwist.

- id: effective_fugacity
  name: effective cross-linker fugacity
  dimension: dimensionless
  description: Effective grand-canonical fugacity z = exp[beta*(mu + epsilon_0')] proportional to unbound linker concentration.

- id: dimensionless_cooperativity
  name: net cross-linking cooperativity parameter
  dimension: dimensionless
  description: Dimensionless mean-field cooperativity parameter u = N_b^-1 * beta * sum'_{l' != l} V(l, l') on the 28/13 ground state.

- id: normalized_cooperativity
  name: geometry-normalized cooperativity factor
  dimension: dimensionless
  description: Ratio u / (beta*U)^2 depending solely on filament twist persistence length xi_t and 28/13 packing geometry.

- id: site_occupancy
  name: mean cross-linker site occupancy
  dimension: dimensionless
  description: Mean occupation probability rho = <n_{l,m}> of cross-linker binding sites in the 28/13 ground state.

- id: linker_susceptibility
  name: cross-linker binding susceptibility
  dimension: dimensionless
  description: Thermodynamic binding susceptibility chi_rho = d(rho)/dz.

- id: scaling_exponent
  name: power-law scaling exponent
  dimension: dimensionless
  description: Local or asymptotic logarithmic slope describing a claimed power-law scaling relation.

- id: dimensionless_critical_stiffness_prefactor
  name: dimensionless critical linker stiffness prefactor
  dimension: dimensionless
  description: Ratio k_c / (k_B*T/a^2) = beta*U_c required to reach the critical point u = u_c = 4.

- id: expansion_linear_coefficient
  name: in-plane geometric expansion linear coefficient
  dimension: dimensionless
  description: Dimensionless coefficient c_1 in (Delta_ij - Delta_0)^2 = C_0 - c_1 * a^2 * D_hat.(S_i - S_j) + O(S^2).

- id: binding_energy_shift_coefficient
  name: renormalized binding energy shift coefficient
  dimension: dimensionless
  description: Dimensionless coefficient c_U in epsilon_0' = epsilon_0 - c_U * U from integrating out monomer spins.

- id: spin_projection
  name: in-plane spin difference projection
  dimension: dimensionless
  description: Dimensionless scalar projection x = D_hat_ij . (S_i - S_j) of monomer unit spin vectors onto the inter-filament lattice vector.

- id: molar_ratio
  name: cross-linker to G-actin molar ratio
  dimension: dimensionless
  description: Stoichiometric molar ratio R = N_crosslinker / N_G-actin in SAXS bundle samples.

- id: saxs_intensity
  name: background-subtracted SAXS intensity
  dimension: dimensionless
  description: Circularly averaged small-angle x-ray scattering intensity I(q) in arbitrary units after pseudo-Voigt background subtraction (Figs. 1c and 1d).

- id: squared_mean_field_coupling
  name: squared mean-field cross-linker coupling
  dimension: dimensionless
  description: Dimensionless mean-field coupling parameter (beta*U*rho)^2 forming the horizontal axis of Fig. 3(b).

