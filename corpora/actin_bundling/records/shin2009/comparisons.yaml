  printed: overtwist_fig3b_xit1000
  note: "Exact connected O(U^2) perturbation theory swept over all 13 digitized Fig. 3(b) points at xi_t = 1000: predicts linear growth up to 0.0205 rad at x=0.25 vs plotted curve rising concavely-up to 0.1137 rad (5.5x discrepancy)."

