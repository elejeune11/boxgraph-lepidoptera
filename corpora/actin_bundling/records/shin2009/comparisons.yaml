- id: cmp_fig3b_tm_xit10
  purpose: reproduction
  computed: overtwist_fig3b_tm_xit10_comp
  printed: overtwist_fig3b_xit10
  note: "Exact non-perturbative 1D Fourier transfer matrix swept over all 12 digitized Fig. 3(b) points at xi_t = 10: rises smoothly toward pi/39 (0.0626 rad at x=0.25) vs plotted plateau 0.00789 rad (8x higher)."

- id: cmp_fig1e_espin_vs_28_13
  purpose: validation
  computed: overtwist_28_13_fig1e_espin_comp
  printed: overtwist_fig1e_espin
  note: "Tests the paper's constant 28/13 ground-state packing overtwist (0.989 deg) against all 7 digitized espin-actin points in Fig. 1(e) (R = 0.02..0.33): matches both error-barred points (R=0.05: 0.948 +/- 0.05 deg; R=0.10: 0.900 +/- 0.10 deg), while sitting ~0.09 deg above the four un-barred 0.90 deg markers and ~0.19 deg above the un-barred R=0.33 (0.80 deg) marker."

- id: cmp_fig1e_fascin_vs_28_13
  purpose: validation
  computed: overtwist_28_13_fig1e_fascin_comp
  printed: overtwist_fig1e_fascin
  note: "Contrasts the saturated 28/13 packing prediction (0.989 deg) against all 5 digitized fascin-actin points in Fig. 1(e) (R = 0.05..0.33): reproduces the high-R saturated point (R=0.33: 0.900 +/- 0.10 deg) and sits close at R=0.20 (0.799 +/- 0.10 deg), while strongly departing across the continuous low-R transition (0.002, 0.104, 0.302 deg at R = 0.05, 0.069, 0.101)."

