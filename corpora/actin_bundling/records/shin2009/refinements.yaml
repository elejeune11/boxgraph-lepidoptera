- id: ref_coop_lh_opt_tol
  run: run_coop_lh_peak
  setting: opt_tol
  factors: [1, 2, 4, 8]
  mode: divide
  output: xi_t_max
  tolerance: "0.001%"
  tolerance_basis: "added: far tighter than the printed approximate peak xi_t ~= 60 to confirm numerical convergence of bounded optimization"
  tolerance_added: true

- id: ref_mf_eos_tol
  run: run_mf_eos_first_order
  setting: tol
  factors: [1, 2, 4, 8]
  mode: divide
  output: rho
  tolerance: "0.001%"
  tolerance_basis: "added: confirms numerical convergence of Brent root-finding for the mean-field self-consistency equation"
  tolerance_added: true

- id: ref_mf_crit_tol
  run: run_mf_critical_point
  setting: tol
  factors: [1, 2, 4, 8]
  mode: divide
  output: u_c
  tolerance: "0.001%"
  tolerance_basis: "added: confirms numerical convergence of the nested optimizer and root-finder for the mean-field critical point"
  tolerance_added: true

- id: ref_mf_crit_delta_rho
  run: run_mf_critical_point
  setting: delta_rho
  factors: [1, 2, 4, 8]
  mode: divide
  output: chi_exponent
  tolerance: "0.01%"
  tolerance_basis: "added: confirms asymptotic convergence of the finite-difference susceptibility critical exponent to exact -2/3"
  tolerance_added: true

- id: ref_tm_n_modes
  run: run_overtwist_tm_small_U
  setting: n_modes
  factors: [1, 2, 3, 4]
  mode: multiply
  output: overtwist
  tolerance: "0.001%"
  tolerance_basis: "added: confirms Fourier angular-momentum basis truncation convergence of the 1D transfer matrix"
  tolerance_added: true
