    printed_page: "7877"
    quote: "to form bundled rings inside condensates, such as actin in"
    where: "Discussion (p. 7877, citing ref-19 Graham et al. 2023)"
  text: >
    Zero genuine cross-record validations exist in either direction between feigeles2025 and
    graham2023 (despite qualitative citations of graham2023 as ref-19 on pp. 2 and 6):
    (1) feigeles2025 models against graham2023 measurements: the two studies examine opposite
    filament-condensate topologies and measure disjoint physical observables. feigeles2025 models
    3D axisymmetric liquid FUS droplets externally wetting pre-polymerized cylindrical actin
    bundles (unduloid Young-Laplace ODEs Eqs. 2-5, contact angle theta, capillary pressure Delta P,
    groove meniscus radius, bundle Gaussian FWHM, bundle straightness L_c/l, and free-solution
    coalescence viscocapillary scaling). graham2023 studies actin monomers actively polymerizing
    inside 3D PEG8k-crowded VASP droplets into internal shells, closed rings, discs, and rod-like
    bundles, measuring morphology fractions, internal ring thickness power laws, monomer-addition
    elongation rate (23 +/- 3 nm/s), VASP FRAP, partition coefficients, droplet diameters, and
    droplet aspect ratios defined as major/minor >= 1 (exact reciprocal of feigeles2025's
    2*R_max/l <= 1, with no separate R_max and l pairs printed). graham2023 measures no external
    contact angles, no capillary pressures, no 3D surface tensions in N/m (its continuum parameter
    gamma_I is a 2D line tension in pN, and gamma_AVR/gamma_AVD are numerical confinement penalty
    constants 10^-8 and 10^4 pN/nm), no condensate viscosity eta, and no coalescence trajectory
    L(t) or Delta L (its single scalar vasp_droplet_fusion_time = 'about 1' s lacks both Delta L
    and eta/gamma inputs).
    (2) graham2023 models against feigeles2025 measurements: graham2023's models (2D internal ring
    bending/stretching energy minimization, ring-to-rod critical aspect ratio, ring thickness
    power-law scaling, monomer elongation rate, and flat-sheet ring filament count N_fil =
    T_ring/delta) do not predict feigeles2025's external barrel-droplet wetting geometry, contact
    angles, or coalescence kinetics; feigeles2025 pre-polymerizes actin (>20 min) before adding
    FUS (no polymerization elongation or internal actin rings), performs no FRAP, and explicitly
    notes on p. 4 that bundle filament packing density / filament count N_fil is unmeasured.

