    where: "Fig. S2 (p. 12) vs p. 3"
  text: >
    Fig. S2 caption and y-axis label state 'End-To-End Length:Contour Length, epsilon / L_c',
    yet every plotted datum lies at or above 1.0 (spanning ~1.0 to ~2.6). Because the
    straight-line end-to-end distance epsilon between two points cannot exceed the contour
    length L_c along the curve joining them (epsilon / L_c <= 1), the Fig. S2 label is inverted
    and the plotted points represent L_c / epsilon >= 1, matching the main text definition on
    p. 3 ('the ratio of the contour length, L_c, to the end-to-end length, l'). Furthermore,
    p. 3 claims bundles are 'straight on length scale upwards of 40 um (Fig. S2)', whereas the
    lone plotted point above 40 um (at L_c ~ 46 um) has ratio ~2.6 (strongly curved) and the
    three points near 38–40 um lie at ~1.1–1.4.

