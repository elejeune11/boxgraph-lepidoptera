    quote: "We define the radius of the bundle to be the full"
    where: "Methods, Bundle radius measurement (p. 7) vs p. 3 & p. 4"
  text: >
    Methods p. 7 defines 'the radius of the bundle' as the Gaussian full width at half maximum
    (FWHM = 2*delta*sqrt(2*ln 2)) and says 'The reported radius is an average of 30 bundles',
    whereas Results p. 3 calls the only reported Gaussian-fit value (0.23 +/- 0.10 um) 'the
    average bundle thickness'. Physically, FWHM measures full width (diameter/thickness), not
    radius (half-width HWHM = delta*sqrt(2*ln 2)). Additionally, inverting the p. 4 cylindrical
    column pressure range (~65 to 260 N/m^2 at sigma = 90 uN/m) implies bundle radii R_f = 0.35
    to 1.38 um for the 28-condensate wetting dataset (consistent with Fig. 5B's R_f = 1.2 um),
    significantly larger than the 0.23 +/- 0.10 um thickness measured on the Fig. 1D network
    bundles; the paper does not explain how bundle radii R_f were measured for the 28 wetted
    bundles versus the 30 Gaussian-fitted bundles.

