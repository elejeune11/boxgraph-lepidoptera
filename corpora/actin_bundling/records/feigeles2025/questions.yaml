    wetting/coalescing on actin bundles, gamma ~ 40-90 uN/m, eta = 1.2 Pa*s) and weirich2017
    (nematic F-actin/filamin tactoids, gamma_I ~ 300 nN/m, eta ~ 3 Pa*s; same PI):
    (1) Forward direction (feigeles2025 models -> weirich2017 measurements): 5 CrossValidation
    entries in feigeles2025/validations.yaml test coalescence_surface_tension_figS6C (420 nN/m at
    5 mol % filamin and 330 nN/m at 10 mol % filamin vs printed ~300 nN/m, zero added inputs),
    coalescence_capillary_velocity_figS6C (0.100 um/s vs Table S1 0.14 +/- 0.02 um/s -> close at
    5 mol % and 0.11 +/- 0.03 um/s -> reproduced at 10 mol %, zero added inputs), and
    coalescence_exponential_decay_figS6B_corrected swept across all 48 measured points of Weirich
    2017 Fig. 3B (d_fig3b_coalesced_data; not reproduced at physical L_i = 9.454 um, L_f = 6.04 um,
    tau = 36.4 s with RMSE = 0.186 um and max |err| = 0.670 um at t = 10.84 s, exposing the exact
    same unprinted time-offset omission t_0 ~ 7.5-10.8 s as Feigeles Fig. S6B's t_0 = 0.15 s;
    absorbing t_0 into L_i = 10.209 um reproduces d_fig3b_exp_fit 12/12 to RMSE = 0.0012 um and
    reduces data RMSE 2.2x to 0.0854 um). Three additional forward checks are blocked from
    validations.yaml by schema/axis barriers and quantified here: (a) running
    feigeles2025/coalescence_decay_time_from_curve directly on weirich2017/d_fig3b_coalesced_data
    extracts tau = 36.82 s, L_f = 5.965 um, Delta_L = 3.192 um (reproducing Table S1's
    tableS1_coal_10_Leq = 6.04 +/- 0.38 um to -1.2%, -0.20 SD; blocked because weirich2017 has no
    scalar Fig. 3B tau datum and BoxGraph's 1-to-1 quantities dict cannot map
    weirich2017/tactoid_major_axis to both coalescing_condensate_length and
    final_coalescence_length); (b) applying Feigeles Fig. S6C's graphical linear regression
    (coalescence_surface_tension_from_figS6C_curve / coalescence_deltaL_linear_scaling) to Weirich
    2017's 14 digitized Fig. 3C inset coalescence points is blocked because Weirich plots tau (y)
    vs Delta L (x) (swapped axes), and directly evaluating OLS d(Delta L)/d(tau) = 0.0668 um/s
    (intercept +0.765 um) with eta = 3 Pa*s gives gamma = 200 nN/m (-33% vs ~300 nN/m; reciprocal
    of Weirich's plotted line 1/13.72 = 0.0729 um/s gives 219 nN/m; origin-constrained Delta L/tau
    = 0.0926 um/s gives 278 nN/m). All Feigeles external barrel-on-fiber unduloid, contact-angle,
    capillary-pressure, groove-meniscus, and Gaussian FWHM models are physically inapplicable to
    Weirich 2017's free-floating bulk tactoids.
    (2) Reverse direction (weirich2017 models -> feigeles2025 measurements, not authored in
    weirich2017/validations.yaml per single-record edit scope): evaluating Weirich 2017's full
    nonlinear variational shape-dynamics ODE in the isotropic spherical-droplet limit (omega =
    1e-4, vanishing nematic anchoring) on Feigeles 2025 Fig. S6B (L_i = 7.143 um, L_f = 4.658 um,
    Delta L = 2.485 um, eta = 1.2 Pa*s) sharply discriminates Feigeles's three conflicting surface
    tension / tau claims (q_digitized_figS6_misaligned_labels_6pt_fit_and_tau_settled):
    (i) weirich2017/tactoid_shape_dynamics_ode_rayleigh2 (the Rayleigh 2*Phi corrected ODE that
    reproduces Weirich's own Fig. 3D) predicts tau = 0.0602 s at main-text gamma = 90 uN/m (within
    -11.6% of the digitized 12-point Fig. S6B decay tau = 0.0681 s and -16.8% of the red curve
    0.0724 s, vs 10x faster than printed inset tau = 0.6 s), tau = 0.1355 s at SI gamma = 40 uN/m
    (1.99x digitized 0.0681 s), and tau = 1.449 s at the calibrated Fig. S6C slope gamma =
    3.74 uN/m (2.42x printed 0.6 s, 21.3x digitized 0.0681 s);
    (ii) weirich2017/tactoid_shape_dynamics_ode (printed D = (1/2) V eta [...] variant) predicts
    exactly half those times: tau = 0.0678 s at gamma = 40 uN/m (0.6% from digitized 0.0681 s),
    tau = 0.0301 s at gamma = 90 uN/m, and tau = 0.725 s at gamma = 3.74 uN/m (1.21x printed 0.6 s);
    (iii) weirich2017/coalescence_tau_linear_scaling (tau = (eta/gamma)*Delta L) across all 6
    digitized Fig. S6C points (Delta L = 1.247..2.672 um, tau = 0.113..0.564 s) underpredicts
    observed tau by 3.02x-7.03x at gamma = 40 uN/m (0.037..0.080 s) and 6.79x-15.83x at gamma =
    90 uN/m (0.017..0.036 s), while overpredicting by 1.52x-3.54x at gamma = 3.74 uN/m
    (0.400..0.857 s) because Fig. S6C's linear fit carries a large positive y-intercept (+0.946 um);
    and (iv) for Fig. 3C coalescence of two FUS condensates along an actin bundle (L_i = 8.80 um,
    L_f = 5.75 um, measured tau = 14.4 s), Weirich's isotropic Rayleigh-corrected ODE predicts
    free-solution tau = 0.074 s (at 90 uN/m) to 0.167 s (at 40 uN/m), 86x-194x faster than
    observed, quantifying the strong contact-line/hydrodynamic drag imposed by the actin bundle.

