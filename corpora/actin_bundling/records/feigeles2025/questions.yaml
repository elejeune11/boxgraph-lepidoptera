    densities P(kappa/<kappa>) rather than individual dimensional domain curvatures paired with
    (R_f, theta, c), and measures no 3D external contact angles, capillary pressures, single-pair
    coalescence trajectories L(t), viscosity, or interfacial tension.
    (2) gubbala2025 models against feigeles2025 measurements: gubbala2025's 2D continuum Model C
    phase-field PDE (coupled Cahn-Hilliard scalar order parameter phi and 2D nematic Q-tensor in
    dimensionless units), Landau-de Gennes bulk/Frank elastic energies, linear stability thresholds,
    and dimensionless coarsening power law R(t)/R_0 = (t/t_0)^alpha describe collective 2D membrane
