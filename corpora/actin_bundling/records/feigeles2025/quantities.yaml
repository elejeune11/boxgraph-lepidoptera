- id: actin_concentration
  name: actin monomer concentration
  dimension: "[substance] / [length] ** 3"
  description: Total monomeric actin concentration in the sample.

- id: labeled_actin_concentration
  name: fluorescently labeled actin concentration
  dimension: "[substance] / [length] ** 3"
  description: Concentration of TMR-labeled monomeric actin in the sample.

- id: labeling_fraction
  name: fluorescent actin labeling fraction
  dimension: dimensionless
  description: Molar fraction of monomeric actin labeled with TMR.

- id: fus_concentration
  name: FUS protein concentration
  dimension: "[substance] / [length] ** 3"
  description: Concentration of FUS-GFP protein in the sample.

- id: buffer_molar_concentration
  name: buffer solute molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of a buffer component (Tris, MgCl2, CaCl2, KCl, ATP, DTT, NaN3).

- id: mass_concentration
  name: protein stock mass concentration
  dimension: "[mass] / [length] ** 3"
  description: Mass concentration of hydrated monomeric actin stock solution.

- id: weight_percent
  name: additive weight percent
  dimension: dimensionless
  description: Weight percentage (wt%) of a solution or passivation additive.

- id: purity_percent
  name: protein purity percentage
  dimension: dimensionless
  description: Reported purity percentage of lyophilized actin protein.

- id: pH
  name: buffer pH
  dimension: dimensionless
  description: Negative base-10 logarithm of hydrogen ion activity in buffer.

- id: temperature
  name: temperature
  dimension: "[temperature]"
  description: Solution storage, dialysis, or handling temperature.

- id: wavelength
  name: optical wavelength
  dimension: "[length]"
  description: Optical excitation laser/LED or UV absorbance wavelength.

- id: extinction_coefficient
  name: molar extinction coefficient
  dimension: "[length] ** 2 / [substance]"
  description: Molar absorbance extinction coefficient of actin at 280 nm.

- id: magnification
  name: objective magnification
  dimension: dimensionless
  description: Microscope objective magnification factor.

- id: numerical_aperture
  name: objective numerical aperture
  dimension: dimensionless
  description: Numerical aperture (NA) of the microscope objective.

- id: bundle_thickness
  name: actin-FUS bundle thickness
  dimension: "[length]"
  description: Transverse thickness of actin bundles colocalized with FUS condensates (reported on p. 3; defined via Gaussian FWHM on p. 7).

- id: bundle_radius
  name: actin bundle radius
  dimension: "[length]"
  description: Radius R_f of an actin-FUS bundle modeled as a cylindrical fiber.

- id: filament_diameter
  name: single actin filament diameter
  dimension: "[length]"
  description: Diameter of an individual F-actin filament.

- id: filament_length
  name: actin filament length
  dimension: "[length]"
  description: Length of individual actin filaments.

- id: persistence_length
  name: actin filament persistence length
  dimension: "[length]"
  description: Bending persistence length of a single actin filament.

- id: bundle_straightness_length
  name: bundle straightness length scale
  dimension: "[length]"
  description: Length scale over which condensate-induced actin bundles remain straight (Fig. S2).

- id: bundle_contour_length
  name: bundle contour length
  dimension: "[length]"
  description: Contour length L_c measured along an individual bundle between intersections with other bundles.

- id: bundle_end_to_end_length
  name: bundle end-to-end length
  dimension: "[length]"
  description: Straight-line distance l (p. 3) or epsilon (Fig. S2) between the intersections at the ends of a bundle.

- id: bundle_straightness_ratio
  name: bundle straightness ratio
  dimension: dimensionless
  description: Dimensionless ratio of bundle contour length and end-to-end length (L_c/l on p. 3; labeled epsilon/L_c on Fig. S2 y-axis).

- id: gaussian_position
  name: transverse coordinate across bundle
  dimension: "[length]"
  description: Position x (or peak position x_0) along a line perpendicular to the bundle axis in Eq. (1).

- id: gaussian_std
  name: Gaussian profile standard deviation
  dimension: "[length]"
  description: Standard deviation delta of the Gaussian intensity fit across a bundle in Eq. (1).

- id: fluorescence_intensity
  name: fluorescence intensity
  dimension: dimensionless
  description: Arbitrary-unit fluorescence intensity I(x) or background level I_0 in Eq. (1).

- id: integrated_bundle_intensity
  name: integrated bundle fluorescence intensity
  dimension: "[length]"
  description: Integrated intensity parameter I_B in Eq. (1), with dimension [length] so I_B / (delta * sqrt(2*pi)) has the same unit as I_0.

- id: fit_r_squared
  name: coefficient of determination R^2
  dimension: dimensionless
  description: Goodness-of-fit R^2 of transverse Gaussian intensity fits to actin bundles.

- id: sample_count
  name: sample count
  dimension: dimensionless
  description: Number of bundles, condensates, measurement points, or coalescence events (n).

- id: droplet_max_radius
  name: droplet maximum radius
  dimension: "[length]"
  description: Maximum radial extent R_max of a barrel-shaped condensate measured from the fiber symmetry axis.

- id: droplet_initial_radius
  name: initial free condensate radius
  dimension: "[length]"
  description: Radius R_i of a spherical condensate in solution prior to adsorbing onto a bundle (Fig. S3).

- id: droplet_length
  name: condensate axial length
  dimension: "[length]"
  description: End-to-end length l of a barrel-shaped condensate along the actin bundle axis.

- id: droplet_half_length
  name: condensate axial half-length
  dimension: "[length]"
  description: Axial distance x_apex from the contact line (y = R_f) to the droplet apex (y = R_max) along the bundle.

- id: droplet_axial_position
  name: axial distance to unduloid cut-off
  dimension: "[length]"
  description: Axial coordinate x_b along the bundle from the contact line y(0) = R_f to the cut-off radius y = R_b.

- id: droplet_aspect_ratio
  name: condensate aspect ratio
  dimension: dimensionless
  description: Dimensionless aspect ratio 2*R_max / l of a condensate droplet on a bundle (p. 3, Fig. 2B, Fig. S3).

- id: rescaled_droplet_radius
  name: rescaled droplet radius
  dimension: dimensionless
  description: Condensate maximum radius normalized by bundle radius, R_max / R_f.

- id: contact_angle
  name: wetting contact angle
  dimension: dimensionless
  description: Contact angle theta formed by the FUS condensate meniscus with the actin bundle surface (p. 4, Fig. 5).

- id: cutoff_droplet_radius
  name: droplet cut-off radius
  dimension: "[length]"
  description: Radial coordinate R_b of the barrel-shaped condensate contour at the chosen cut-off plane (Fig. 5, Eq. 4).

- id: cutoff_angle
  name: contour angle at cut-off
  dimension: dimensionless
  description: Angle theta_b between the droplet contour tangent and the radial y-axis at the cut-off radius R_b (Fig. 5, Eq. 4).

- id: unduloid_constant
  name: unduloid fitting constant
  dimension: "[length]"
  description: Integration constant c in the axisymmetric unduloid profile ODE (Eqs. 3–5).

- id: reduced_laplace_pressure
  name: reduced Laplace pressure Delta p / (2 sigma)
  dimension: "1 / [length]"
  description: Half the mean curvature, Delta p / (2 sigma), appearing as a fitting parameter in Eqs. (3) and (5).

- id: normalized_laplace_pressure
  name: normalized Laplace pressure Delta p / sigma
  dimension: "1 / [length]"
  description: Ratio of capillary pressure to interfacial tension, Delta p / sigma, in the Young–Laplace equation (Eq. 2).

- id: interfacial_tension
  name: condensate interfacial tension
  dimension: "[force] / [length]"
  description: Interfacial (surface) tension sigma (or gamma in SI Fig. S6) between FUS condensate phase and surrounding buffer.

- id: capillary_pressure
  name: condensate capillary pressure
  dimension: "[force] / [length] ** 2"
  description: Laplace capillary pressure difference Delta P_condensate inside an unduloidal condensate droplet on a bundle.

- id: column_capillary_pressure
  name: cylindrical FUS column capillary pressure
  dimension: "[force] / [length] ** 2"
  description: Laplace capillary pressure Delta P_column = sigma / R_f of a cylindrical column of condensate of radius R_f.

- id: dimensionless_capillary_pressure
  name: dimensionless capillary pressure
  dimension: dimensionless
  description: Condensate capillary pressure normalized by the cylindrical column capillary pressure, (Delta P_condensate * R_f) / sigma.

- id: groove_meniscus_radius
  name: groove meniscus radius of curvature
  dimension: "[length]"
  description: Radius of curvature R_FUS of a condensate meniscus bridging two actin filaments in a surface groove of the bundle (p. 4).

- id: rescaled_groove_meniscus_radius
  name: rescaled groove meniscus radius
  dimension: dimensionless
  description: Ratio R_FUS / R_f of the surface-groove meniscus radius of curvature to the bundle radius (p. 4).

- id: time
  name: elapsed time or duration
  dimension: "[time]"
  description: Observation time, incubation duration, dialysis time, or dynamic event timescale.

- id: spreading_decay_time
  name: condensate spreading decay time
  dimension: "[time]"
  description: Characteristic exponential relaxation time of condensate aspect ratio spreading on a bundle (Fig. 2B).

- id: coalescence_decay_time
  name: condensate coalescence decay time
  dimension: "[time]"
  description: Characteristic exponential relaxation time tau of condensate length shortening during coalescence (Fig. 3C, Fig. S6B–C).

- id: coalescing_condensate_length
  name: coalescing condensate major-axis length
  dimension: "[length]"
  description: End-to-end major-axis length L(t) of two coalescing condensates as a function of time (Fig. 3C, Fig. S6B).

- id: initial_coalescence_length
  name: initial coalescing condensate length
  dimension: "[length]"
  description: Initial end-to-end major-axis length L_i of two touching condensates before coalescence relaxation (Fig. S6B–C).

- id: final_coalescence_length
  name: final coalesced condensate length
  dimension: "[length]"
  description: Final relaxed diameter/length L_f after two condensates finish coalescing (Fig. S6B–C).

- id: coalescence_length_change
  name: change in condensate length during coalescence
  dimension: "[length]"
  description: Total length shortening Delta L = L_i - L_f of two coalescing condensates (Fig. S6C).

- id: condensate_viscosity
  name: condensate dynamic viscosity
  dimension: "[mass] / ([length] * [time])"
  description: Dynamic viscosity eta of FUS condensates used to extract surface tension from coalescence (SI p. 15).

- id: capillary_velocity
  name: capillary velocity gamma / eta
  dimension: "[length] / [time]"
  description: Ratio of interfacial tension to viscosity, gamma / eta, matching the physical dimension of Delta L / tau in Fig. S6C.

- id: inverse_capillary_velocity
  name: inverse capillary velocity eta / gamma
  dimension: "[time] / [length]"
  description: Ratio of viscosity to interfacial tension, eta / gamma, printed as the slope symbol in Fig. S6C caption (SI p. 15).

- id: histogram_frequency
  name: histogram bin frequency
  dimension: dimensionless
  description: Count of condensates per bin in a frequency histogram (Figs. S5, S7).

