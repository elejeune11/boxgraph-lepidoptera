notes: >
  Complete reading of both the main article (PDF pp. 1–9, Soft Matter 21, 7872–7880, 2025)
  and 100% of the Supplementary Information (PDF pp. 10–16, Figs. S1–S7, SI Ref. 1,
  Movies S1–S5). All numbers, Greek letters, exponents, and equations were verified directly
  against the page images (pages/page-001.png through page-016.png) because the extracted
  text mangles micro symbols (uM -> mM, um -> mm, uN -> mN), degree/plus-minus symbols,
  tildes (~ -> B), inequalities (< -> o, > -> 4), and equation fractions.

  Scope: every stated quantitative model, analytical equation, ODE, fitting law, derived
  value, and experimental parameter across main text and SI is recorded and implemented as
  printed, including the unduloidal droplet Young–Laplace ODE (Eqs. 2–5, Fig. 5B),
  unduloidal and cylindrical-column capillary pressures (p. 4), dimensionless capillary
  pressure (p. 4, Fig. 2D), groove meniscus equilibrium radius (p. 4), Gaussian transverse
  intensity profile and FWHM bundle width (Eq. 1, p. 7), droplet aspect ratio (p. 3, Fig. 2B),
  bundle straightness ratio (p. 3, Fig. S2), and SI droplet coalescence exponential decay and
  viscous capillary-velocity surface tension extraction (Fig. S6B–C, pp. 14–15). No formula
  for elastocapillary length/number or Cassie–Baxter contact angle is printed in the paper
  (both are discussed qualitatively only; Cassie–Baxter is explicitly noted as unevaluated
  because bundle filament density is unknown).

  Calibrated figure digitization (Figs. 1E, 2B–D, 3C, S2–S7) is deferred to the separate
  digitize:feigeles2025 stage per job specification (completed 2026-11-25: 19 calibrated
  mode: code readings across all 11 quantitative plot panels recorded in figures.yaml,
  saved to readings.json, and logged in figures.md); qualitative microscopy panels, schematics,
  and movies (Figs. 1A–D, 2A, 2E, 3A–B, 4A–D, 5A–B, S1, S6A, Movies S1–S5) are documented in
  experimental parameters and notes.

  Key internal consistency findings and evident printed misprints identified and modeled
  verbatim alongside evidenced variant_of models and open questions:
  (1) Eq. (3) (p. 8): the second algebraic expression omits the exponent 2 on the denominator
  ((Delta p / (2 sigma)) * y - c / y), giving contact angle 22.2 deg (vs printed 31 deg) and
  cut-off angle 80.8 deg (vs printed 77 deg) for the Fig. 5B droplet, whereas the first
  printed expression of Eq. (3) and the corrected variant reproduce both angles exactly and
  predict an equilibrium aspect ratio 0.720 consistent with Fig. 2B (~0.7).
  (2) Fig. S6B (p. 14): the printed exponential equation L = L_i + (L_i - L_f)*exp(-tau/t)
  has both an inverted exponent (-tau/t instead of -t/tau) and leading L_i instead of L_f,
  making L(t) increase monotonically above L_i instead of decaying; in addition, the printed
  label tau = 0.6 s is ~10x slower than the plotted decay on the 0.1–0.8 s axis (~0.06 s)
  while Fig. S6A timestamps span 0–3.6 s.
  (3) Fig. S6C (pp. 14–15): caption states slope eta/gamma (inverse velocity, s/m) while the
  plot shows Delta L (um) vs tau (s) whose slope is capillary velocity gamma/eta (um/s);
  moreover, the plotted red line (Delta L ~ 1.1 to 2.7 um over tau ~ 0.11 to 0.57 s, slope
  ~3.4 um/s, non-zero intercept ~0.74 um) with eta = 1.2 Pa*s yields gamma ~ 4.1 uN/m, a
  factor of ~10 below the stated ~40 uN/m (and ~22x below the 90 uN/m assumed in the main
  text on p. 4); only 6 points appear in the plotted window despite n = 10 stated.
  (4) Fig. S2 (p. 12): caption and y-axis label state end-to-end to contour length (epsilon/L_c),
  yet plotted values span 1.0 to 2.6 (matching L_c/l as described on p. 3, since geometrically
  epsilon <= L_c).
  (5) Bundle thickness vs radius (pp. 3, 4, 7): p. 7 defines bundle "radius" as the Gaussian
  FWHM 2*delta*sqrt(2*ln 2), whereas p. 3 calls 0.23 +/- 0.10 um the average bundle
  "thickness"; meanwhile the 28-condensate wetting analysis uses much thicker bundles
  (R_f = 0.35–1.38 um inferred from Delta P_column = 65–260 N/m^2, and R_f = 1.2 um in Fig. 5B).
  (6) Aspect ratio text vs formula (pp. 3, 7): p. 7 defines aspect ratio in words as "major
  axis to minor axis", contradicting the formula 2*R_max/l (minor/major, ~0.7 after spreading)
  used in p. 3, Fig. 2B, and Fig. S3.
  (7) Groove meniscus radius range 2.3 R_f < R_FUS < 5.4 R_f (p. 4): matches bulk R_max/R_f
  ~ 4–10 (and Fig. 5B's R_FUS/R_f = 3.21), but is narrower than the full Fig. 2C–D range
  (R_max/R_f ~ 2.4–11.8 gives R_FUS/R_f ~ 1.5–6.4).
