- id: rel_gubbala2025_unduloid_pressure_reduces_to_circle_curvature
  kind: reduces_to
  a: feigeles2025/unduloid_pressure_eq5
  b: gubbala2025/boundary_curvature_s2_corrected
  mapping:
    R: "R_f / cos(theta * pi / 180)"
  output_map:
    kappa_mean: DeltaP_over_2sigma
  limit:
    c: "0"
  regime:
    R_f: [0.35, 2.0]
    theta: [10.0, 60.0]
    c: [0.01, 2.0]
  provenance: proposed
  reason: >
    Links the Young-Laplace curvature equations across both Soft Matter 2025 condensate/domain-actin
    studies. Feigeles et al. (2025, p. 8 Eq. 5) express the 3D axisymmetric unduloid mean curvature
    as H = Delta p / (2*sigma) = cos(theta)/R_f + c/R_f^2 [1/um], while Gubbala et al. (2025,
    p. 6 & SI Eq. S2 corrected) explicitly invoke the classical Young-Laplace proportionality
    between domain boundary curvature kappa and excess interfacial stress for circular domains
    (kappa_mean = 1/R [1/um]). In the c -> 0 limit of Feigeles's Eq. (3)-(5), the unduloid profile
    degenerates into an exact spherical cap of radius R = R_f / cos(theta) whose 3D mean curvature
    H = cos(theta) / R_f reduces exactly to Gubbala's corrected 2D circular curvature kappa_mean = 1/R
    across all fiber radii R_f and contact angles theta.
  assumptions:
    - "Spherical-cap limit c -> 0 of Feigeles Eq. (3)-(5), where the axisymmetric unduloid has constant radius of curvature R = R_f / cos(theta) and mean curvature H = 1/R."
    - "Targets Gubbala's corrected SI Eq. (S2) parametric curvature (boundary_curvature_s2_corrected) rather than the misprinted denominator (x' + y')^(3/2)."

