# Cross-record validations of feigeles2025 runnable models against independent
# experimental measurements and coalescence-derived quantities in paired
# actin_bundling records.
#
# Audit scope across all five paired records:
# - feigeles2025 + weirich2017 (5 validations below):
#   Both papers from the Weirich group measure viscous capillary coalescence of
#   liquid-like protein/biopolymer droplets (Feigeles 2025: isotropic FUS-GFP
#   condensates, gamma ~ 40-90 uN/m, eta = 1.2 Pa*s; Weirich 2017: nematic
#   F-actin/filamin tactoids, gamma_I ~ 300 nN/m, eta ~ 3 Pa*s).
#   (1)-(2) coalescence_surface_tension_figS6C (gamma = eta * slope) tested on
#   Weirich 2017's FRAP viscosity (eta_frap_est = ~3 Pa*s, 5 mol % filamin) and
#   Table S1 coalescence capillary velocities at 5 and 10 mol % filamin
#   (0.14 +/- 0.02 and 0.11 +/- 0.03 um/s) against gamma_I_est_main (~300 nN/m),
#   with zero added inputs.
#   (3)-(4) coalescence_capillary_velocity_figS6C (v_cap = gamma / eta) tested on
#   Weirich 2017's eta_frap_est and gamma_I_est_main against Table S1's measured/
#   fitted 5 and 10 mol % filamin capillary velocities (0.14 +/- 0.02 and
#   0.11 +/- 0.03 um/s), with zero added inputs.
#   (5) coalescence_exponential_decay_figS6B_corrected (L = L_f + (L_i - L_f)*exp(-t/tau))
#   swept across all 48 measured points of Weirich 2017's Fig. 3B 10 mol % filamin
#   coalescence trajectory (weirich2017/d_fig3b_coalesced_data), exposing the exact
#   same unprinted coalescence-onset time offset t_0 (~7.5-10 s in Weirich 2017 vs
#   ~0.15 s in Feigeles 2025 Fig. S6B).
#   Additional non-schema-mappable forward checks (coalescence_decay_time_from_curve
#   on d_fig3b_coalesced_data -> tau = 36.82 s, L_f = 5.965 um vs Table S1 6.04 +/- 0.38 um;
#   swapped-axis Fig. 3C inset regression -> gamma = 200-278 nN/m) and reverse-direction
#   checks (weirich2017/tactoid_shape_dynamics_ode and rayleigh2 variant in the omega -> 0
#   isotropic limit on Feigeles 2025 Fig. S6B/S6C/Fig. 3C) are recorded quantitatively in
#   q_weirich2017_cross_validation_audit in questions.yaml.
# - feigeles2025 + graham2023: 0 validations (physically disjoint external 3D
#   barrel-on-fiber wetting vs internal 2D/3D VASP droplet actin rings; see
#   q_graham2023_no_cross_validation in questions.yaml).
# - feigeles2025 + graham_source_data: 0 validations (Excel Source Data readers for
#   Graham 2023; see q_graham_source_data_no_cross_validation in questions.yaml).
# - chandrasekaran2024 + feigeles2025: 0 validations (internal CytoSim/LAMMPS VASP
#   droplet kinetic trapping vs external FUS capillary wetting; see
#   q_chandrasekaran2024_no_cross_validation in questions.yaml).
# - feigeles2025 + gubbala2025: 0 validations (2D Model C Lo-domain phase-field PDE
#   in nematic SLB actin vs 3D external FUS barrel wetting; see
#   q_gubbala2025_no_cross_validation in questions.yaml).

- id: val_coalescence_gamma_vs_weirich2017_5pct
  model: coalescence_surface_tension_figS6C
  inputs:
    eta: "weirich2017/eta_frap_est"
    slope: "weirich2017/tableS1_coal_5_gamma_eta"
  output: gamma
  against: "weirich2017/gamma_I_est_main"
  purpose: validation
  quantities:
    "weirich2017/dynamic_viscosity": condensate_viscosity
    "weirich2017/capillary_velocity": capillary_velocity
    "weirich2017/interfacial_tension_isotropic": interfacial_tension
  conditions_ok: >
    Both Feigeles et al. (2025, SI Fig. S6C, pp. 14-15) and Weirich et al. (2017, Main p. 4 /
    p. 2134 & Table S1, p. SI-5) extract liquid droplet interfacial tension from the viscocapillary
    product gamma = eta * v_cap, but in two distinct reconstituted droplet systems spanning three
    orders of magnitude in interfacial tension: Feigeles 2025 studies isotropic FUS-GFP condensates
    in buffer (eta = 1.2 Pa*s from Ijavi et al. 2021, reporting gamma ~ 40 uN/m), whereas Weirich
    2017 studies nematic 2.6 uM F-actin droplets cross-linked by 5 mol % filamin (1.5 mol % capping
    protein for FRAP viscosity eta_frap_est ~ 3 Pa*s; 1 mol % capping protein for coalescence
    tableS1_coal_5_gamma_eta = 0.14 +/- 0.02 um/s). Because gamma = eta * v_cap is a universal
    low-Reynolds-number viscocapillary relation, evaluating Feigeles 2025's zero-parameter
    coalescence_surface_tension_figS6C on Weirich 2017's matched 5 mol % filamin viscosity and
    capillary velocity directly tests its cross-system consistency against Weirich's printed
    interfacial tension gamma_I_est_main (~300 nN/m, which Weirich 2017 rounded from the 10 mol %
    filamin Table S1 row 3 * 0.11 = 330 nN/m).
  basis: >
    Feigeles et al. (2025, SI Fig. S6C caption, p. 15 / SI-6) state: "Using a viscosity of 1.2 Pa s
    (1), the surface tension is extracted from the slope of the line, eta/gamma, and determined to
    be approximately 40 uN m^-1" (modeled in coalescence_surface_tension_figS6C via the
    dimensionally consistent product gamma = eta * (d(Delta L)/d(tau)) = eta * v_cap). Weirich et
    al. (2017, Main p. 4 / p. 2134) independently state: "From the eta/gamma_I obtained in the fit
    (Table S1), and the viscosity estimated from photobleaching, we estimate gamma_I ~ 300 nN/m."
    Running coalescence_surface_tension_figS6C with zero added inputs on Weirich 2017's 5 mol %
    filamin FRAP viscosity (eta_frap_est) and 5 mol % filamin coalescence capillary velocity
    (tableS1_coal_5_gamma_eta) tests whether the exact same viscocapillary tension extractor
    reproduces Weirich 2017's reported gamma_I ~ 300 nN/m at the filamin concentration where eta
    was actually measured.
  note: >
    Computes gamma = 0.420 uN/m (420 nN/m; +/-60 nN/m propagating the +/-0.02 um/s Table S1
    uncertainty at fixed eta = 3 Pa*s) vs printed "~300" nN/m (+120 nN/m, +40.0%; formal BoxGraph
    verdict: no verdict because "~300" carries an approximate tilde without precision), with zero
    added inputs. By contrast, applying Feigeles 2025's purely graphical Fig. S6C OLS regression
    (d(Delta L)/d(tau)) directly to Weirich 2017's 14 digitized Fig. 3C inset coalescence points
    without Weirich's anisotropic ODE yields slope 0.0668 um/s (free intercept +0.765 um) ->
    gamma = 200 nN/m (-33%), or 0.0926 um/s (origin-constrained) -> gamma = 278 nN/m (-7.4%).

- id: val_coalescence_gamma_vs_weirich2017_10pct
  model: coalescence_surface_tension_figS6C
  inputs:
    eta: "weirich2017/eta_frap_est"
    slope: "weirich2017/tableS1_coal_10_gamma_eta"
  output: gamma
  against: "weirich2017/gamma_I_est_main"
  purpose: validation
  quantities:
    "weirich2017/dynamic_viscosity": condensate_viscosity
    "weirich2017/capillary_velocity": capillary_velocity
    "weirich2017/interfacial_tension_isotropic": interfacial_tension
  conditions_ok: >
    Same viscocapillary tension relation gamma = eta * v_cap (Feigeles 2025 SI Fig. S6C vs Weirich
    2017 Main p. 4 & Table S1), here evaluated on Weirich 2017's 10 mol % filamin coalescence
    capillary velocity (tableS1_coal_10_gamma_eta = 0.11 +/- 0.03 um/s, 1 mol % CP) paired with
    Weirich 2017's 5 mol % filamin FRAP viscosity (eta_frap_est ~ 3 Pa*s, 1.5 mol % CP). Note
    that Weirich 2017 p. 4 itself combines these cross-condition 5% FRAP and 10% Table S1 values
    to round gamma_I ~ 300 nN/m, and rel_weirich2017_surface_tension_same_as_coalescence_gamma
    confirms symbolic equivalence between coalescence_surface_tension_figS6C and
    weirich2017/interfacial_tension_from_capillary_velocity across uN/m <-> nN/m.
  basis: >
    Feigeles et al. (2025, SI Fig. S6C, p. 15 / SI-6) extract droplet interfacial tension from
    viscosity and coalescence capillary velocity via gamma = eta * v_cap. Weirich et al. (2017,
    Main p. 4 / p. 2134 & Table S1, p. SI-5) report tableS1_coal_10_gamma_eta = 0.11 +/- 0.03 um/s
    and eta_frap_est ~ 3 Pa*s and state "we estimate gamma_I ~ 300 nN/m." Evaluating
    coalescence_surface_tension_figS6C directly on Weirich's 10 mol % filamin inputs verifies
    cross-record consistency across three orders of magnitude in interfacial tension (uN/m vs nN/m)
    with zero added inputs.
  note: >
    Computes gamma = 0.330 uN/m (330 nN/m; +/-90 nN/m propagating +/-0.03 um/s at eta = 3 Pa*s) vs
    printed "~300" nN/m (+30 nN/m, +10.0%; formal BoxGraph verdict: no verdict because "~300"
    carries an approximate tilde without precision), with zero added inputs. Together with
    val_coalescence_gamma_vs_weirich2017_5pct (420 nN/m), this confirms Weirich's ~300 nN/m
    order-of-magnitude tension sits closer to the 10 mol % filamin product (330 nN/m) than the
    composition-matched 5 mol % filamin product (420 nN/m).

- id: val_coalescence_vcap_vs_weirich2017_5pct
  model: coalescence_capillary_velocity_figS6C
  inputs:
    eta: "weirich2017/eta_frap_est"
    gamma: "weirich2017/gamma_I_est_main"
  output: v_cap
  against: "weirich2017/tableS1_coal_5_gamma_eta"
  purpose: validation
  quantities:
    "weirich2017/dynamic_viscosity": condensate_viscosity
    "weirich2017/interfacial_tension_isotropic": interfacial_tension
    "weirich2017/capillary_velocity": capillary_velocity
  conditions_ok: >
    Both records relate liquid droplet coalescence capillary velocity to interfacial tension and
    viscosity via v_cap = gamma / eta (Feigeles 2025 SI Fig. S6C for isotropic FUS condensates;
    Weirich 2017 Main p. 4 & Table S1 for nematic F-actin/filamin tactoids). Here Feigeles 2025's
    coalescence_capillary_velocity_figS6C is run with zero added inputs on Weirich 2017's printed
    FRAP viscosity (eta_frap_est ~ 3 Pa*s, 5 mol % filamin, 1.5 mol % CP) and reported isotropic
    interfacial tension (gamma_I_est_main ~ 300 nN/m) and judged against Weirich 2017's 5 mol %
    filamin coalescence capillary velocity (tableS1_coal_5_gamma_eta = 0.14 +/- 0.02 um/s, 1 mol %
    CP). Because Weirich 2017 rounded gamma_I ~ 300 nN/m from the 10 mol % filamin row (0.11 um/s)
    rather than the 5 mol % row, comparing v_cap = 0.100 um/s against 0.14 +/- 0.02 um/s tests
    whether a single composition-independent (gamma_I, eta) pair predicts 5 mol % filamin
    coalescence speeds within experimental uncertainty.
  basis: >
    Feigeles et al. (2025, SI Fig. S6C, pp. 14-15) model free-droplet coalescence speed via the
    viscocapillary velocity v_cap = gamma / eta (coalescence_capillary_velocity_figS6C). Weirich
    et al. (2017, Main p. 4 / p. 2134 & Table S1, p. SI-5) fit coalescence trajectories of 5 mol %
    filamin actin tactoids to obtain gamma_I / eta = 0.14 +/- 0.02 um/s while reporting a single
    estimated viscosity eta ~ 3 Pa*s and isotropic tension gamma_I ~ 300 nN/m. Testing
    coalescence_capillary_velocity_figS6C.v_cap against tableS1_coal_5_gamma_eta checks this
    single-parameter consistency with explicit +/-0.02 um/s precision and zero added inputs.
  note: >
    Computes v_cap = 0.1000 um/s vs measured/fitted 0.14 +/- 0.02 um/s ([0.12, 0.16] um/s): diff
    -0.0400 um/s (-28.6%, -2.0 SD below mean, -0.020 below lower bound) -> close. This confirms
    quantitatively that Weirich 2017's single rounded gamma_I ~ 300 nN/m (with eta ~ 3 Pa*s)
    underpredicts the 5 mol % filamin coalescence capillary velocity by 29% (matching the 420 nN/m
    vs ~300 nN/m gap in val_coalescence_gamma_vs_weirich2017_5pct).

- id: val_coalescence_vcap_vs_weirich2017_10pct
  model: coalescence_capillary_velocity_figS6C
  inputs:
    eta: "weirich2017/eta_frap_est"
    gamma: "weirich2017/gamma_I_est_main"
  output: v_cap
  against: "weirich2017/tableS1_coal_10_gamma_eta"
  purpose: fit_quality
  quantities:
    "weirich2017/dynamic_viscosity": condensate_viscosity
    "weirich2017/interfacial_tension_isotropic": interfacial_tension
    "weirich2017/capillary_velocity": capillary_velocity
  conditions_ok: >
    Same viscocapillary velocity model v_cap = gamma / eta (Feigeles 2025 SI Fig. S6C) evaluated on
    Weirich 2017's eta_frap_est (~3 Pa*s, 5 mol % filamin, 1.5 mol % CP) and gamma_I_est_main
    (~300 nN/m) against Weirich 2017's 10 mol % filamin coalescence capillary velocity
    (tableS1_coal_10_gamma_eta = 0.11 +/- 0.03 um/s, 1 mol % CP). Marked purpose: fit_quality
    because Weirich 2017 p. 4 inferred gamma_I_est_main (~300 nN/m) directly from Table S1's
    coalescence capillary velocity and FRAP viscosity rather than from an independent tensiometry
    measurement, making this a roundtrip precision check rather than an out-of-sample prediction.
  basis: >
    Feigeles et al. (2025, SI Fig. S6C, pp. 14-15) define coalescence capillary velocity as
    v_cap = gamma / eta (coalescence_capillary_velocity_figS6C). Weirich et al. (2017, Main p. 4 /
    p. 2134 & Table S1, p. SI-5) report tableS1_coal_10_gamma_eta = 0.11 +/- 0.03 um/s and combine
    Table S1's eta/gamma_I with FRAP viscosity eta ~ 3 Pa*s to quote gamma_I ~ 300 nN/m. Because
    gamma_I_est_main was calibrated to Table S1, this entry checks roundtrip fit quality at the
    printed Table S1 precision (+/-0.03 um/s) with zero added inputs.
  note: >
    Computes v_cap = 0.1000 um/s vs 0.11 +/- 0.03 um/s ([0.08, 0.14] um/s): diff -0.0100 um/s
    (-9.1%, -0.33 SD) -> reproduced inside the printed uncertainty band with zero added inputs.

- id: val_coal_exp_decay_vs_weirich2017_fig3b_data
  model: coalescence_exponential_decay_figS6B_corrected
  inputs:
    L_i: weirich2017_fig3b_Li_phys_added
    L_f: weirich2017_fig3b_Lf_tableS1_added
    tau: weirich2017_fig3b_tau_fig3d_added
  sweep:
    t: "weirich2017/d_fig3b_coalesced_data"
  output: L
  against: "weirich2017/d_fig3b_coalesced_data"
  purpose: fit_quality
  quantities:
    "weirich2017/elapsed_time": time
    "weirich2017/tactoid_major_axis": coalescing_condensate_length
  conditions_ok: >
    Both papers from the Weirich group model the major-axis length relaxation of two coalescing
    liquid-like droplets with the identical zero-offset single-exponential decay law
    L(t) = L_f + (L_i - L_f) * exp(-t / tau) (verified algebraically identical via
    rel_weirich2017_coalescence_exp_decay_same_as_tactoid_relaxation): Feigeles et al. (2025,
    SI Fig. S6B, p. 14, corrected variant) for isotropic FUS-GFP condensates in buffer, and
    Weirich et al. (2017, Fig. 3B, p. 4 / p. 2134 & SI p. 8) for nematic 2.6 uM F-actin tactoids
    (1 mol % capping protein, 10 mol % filamin). Here Feigeles 2025's corrected exponential decay
    is swept across all 48 measured post-coalescence timepoints of Weirich 2017 Fig. 3B
    (t = 10.84 to 245.82 s) using Weirich 2017's own physical event parameters (L_i = 9.454 um
    from the pre-coalescence tactoid sum L_1 + L_2 = 5.252 + 4.202 um, L_f = 6.04 um from
    Table S1 10 mol % filamin L_eq, and tau = 36.4 s from Fig. 3C inset / Fig. 3D for this event).
    Marked purpose: fit_quality because L_i, L_f, and tau come from the same Weirich 2017 10 mol %
    filamin coalescence dataset rather than from Feigeles 2025's FUS condensates.
  basis: >
    Feigeles et al. (2025, SI Fig. S6B, p. 14 / SI-5, corrected variant
    coalescence_exponential_decay_figS6B_corrected) and Weirich et al. (2017, Main p. 3-4 /
    pp. 2133-2134 & SI p. 8) both state that two coalescing droplets relax exponentially in major-
    axis length via L(t) = L_f + (L_i - L_f) * exp(-t / tau) with no time offset t_0. Weirich et
    al. (2017, Fig. 3B) plot 48 measured post-coalescence lengths (t = 10.84..245.82 s) plus a
    dashed exponential fit curve, yet never test their unshifted equation against the digitized
    Fig. 3B trajectory in weirich2017/comparisons.yaml. Sweeping Feigeles 2025's corrected
    exponential formula directly over weirich2017/d_fig3b_coalesced_data tests both single-
    exponential fit quality and the consequence of omitting the coalescence-onset time offset t_0
    in both papers' printed formulas.
  note: >
    Verdict: not reproduced (7/48 reproduced, 7/48 close, 34/48 not reproduced against the tight
    +/-0.0124 um digitization band of the 48 blue dots; RMSE = 0.1860 um, mean relative error 1.81%,
    max |err| = 0.6702 um at the first post-coalescence frame t = 10.84 s where the unshifted model
    predicts 8.575 um vs measured 9.245 um). Crucially, this exposes the exact same unprinted time-
    offset omission found in Feigeles 2025 Fig. S6B (q_figS6_missing_t0_and_coupled_10x_tension,
    t_0 = 0.15 s): Weirich 2017 Fig. 3B's post-coalescence relaxation begins at t_0 ~ 7.5-10.8 s
    rather than t = 0 s, so absorbing exp(+t_0/tau) into an effective t = 0 intercept L_i = 10.209 um
    (with L_f = 6.004 um, tau = 36.34 s) reproduces Weirich's plotted dashed fit curve
    weirich2017/d_fig3b_exp_fit on 12/12 points (RMSE = 0.0012 um, max |err| = 0.0025 um) and
    cuts the data RMSE 2.2x to 0.0854 um (0.98% mean relative error; 6/48 reproduced, 15/48 close,
    27/48 not reproduced due to ~0.08 um experimental scatter and late-time drift; unconstrained
    3-parameter fit gives L(0) = 10.249 um, L_f = 5.965 um, tau = 36.82 s, RMSE = 0.0801 um, 11/48
    reproduced, 10/48 close, 27/48 not reproduced). Using the first post-coalescence frame L_i =
    9.245 um at t_0 = 0 worsens RMSE to 0.2260 um (max |err| = 0.825 um).
