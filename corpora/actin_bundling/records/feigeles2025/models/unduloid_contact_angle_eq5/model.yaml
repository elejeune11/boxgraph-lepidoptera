id: unduloid_contact_angle_eq5
name: contact angle solved from Eq. (5) given fitted Delta p / (2 sigma) and c
role: processing
stated:
  page: 8
  printed_page: "7879"
  quote: "the contact angle is obtained by solving eqn (5) for"
  where: "p. 7879, text after Eq. 5"
equation: "theta = arccos(R_f * (Delta p / (2 * sigma)) - c / R_f)"
built_from:
  - unduloid_pressure_eq5
inputs:
  R_f: {quantity: bundle_radius, unit: um}
  DeltaP_over_2sigma: {quantity: reduced_laplace_pressure, unit: 1/um}
  c: {quantity: unduloid_constant, unit: um}
outputs:
  theta: {quantity: contact_angle, unit: deg}
settings: {}
stochastic: false
