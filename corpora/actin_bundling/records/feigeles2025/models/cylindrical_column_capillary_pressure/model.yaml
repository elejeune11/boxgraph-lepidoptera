id: cylindrical_column_capillary_pressure
name: cylindrical FUS column capillary pressure (p. 4)
role: model
stated:
  page: 4
  printed_page: "7875"
  quote: "pressure of cylindrical FUS column"
  where: "p. 7875, col. 1"
equation: "DeltaP_column = sigma / R_f"
inputs:
  sigma: {quantity: interfacial_tension, unit: uN/m}
  R_f: {quantity: bundle_radius, unit: um}
outputs:
  DeltaP_column: {quantity: column_capillary_pressure, unit: N/m^2}
settings: {}
stochastic: false
