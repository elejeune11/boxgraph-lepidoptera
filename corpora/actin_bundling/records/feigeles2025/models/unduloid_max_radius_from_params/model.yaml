id: unduloid_max_radius_from_params
name: unduloid apex radius R_max where dy/dx = 0 from Eq. (3) parameters
role: model
stated:
  page: 7
  printed_page: "7878"
  quote: "perpendicular to the fiber at the widest part of the"
  where: "p. 7878 & Eq. 3 (dy/dx = 0 apex condition)"
equation: "(Delta p / (2 * sigma)) * R_max - c / R_max = 1 => R_max = (1 + sqrt(1 + 4 * (Delta p / (2 * sigma)) * c)) / (2 * (Delta p / (2 * sigma)))"
built_from:
  - unduloid_pressure_eq5
from_words: true
inputs:
  R_f: {quantity: bundle_radius, unit: um}
  DeltaP_over_2sigma: {quantity: reduced_laplace_pressure, unit: 1/um}
  c: {quantity: unduloid_constant, unit: um}
outputs:
  R_max: {quantity: droplet_max_radius, unit: um}
  n: {quantity: rescaled_droplet_radius, unit: dimensionless}
settings: {}
stochastic: false
