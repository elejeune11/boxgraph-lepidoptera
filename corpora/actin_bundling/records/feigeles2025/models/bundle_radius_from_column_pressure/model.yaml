id: bundle_radius_from_column_pressure
name: bundle radius inferred from cylindrical column capillary pressure (p. 4)
role: processing
stated:
  page: 4
  printed_page: "7875"
  quote: "pressure of cylindrical FUS column"
  where: "p. 7875, col. 1 (inverted)"
equation: "R_f = sigma / DeltaP_column"
built_from:
  - cylindrical_column_capillary_pressure
inputs:
  sigma: {quantity: interfacial_tension, unit: uN/m}
  DeltaP_column: {quantity: column_capillary_pressure, unit: N/m^2}
outputs:
  R_f: {quantity: bundle_radius, unit: um}
settings: {}
stochastic: false
