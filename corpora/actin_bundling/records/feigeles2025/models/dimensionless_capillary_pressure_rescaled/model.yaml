id: dimensionless_capillary_pressure_rescaled
name: dimensionless capillary pressure as a function of rescaled droplet radius R_max/R_f (Fig. 2D)
role: model
stated:
  page: 4
  printed_page: "7875"
  quote: "against the condensate radius rescaled by the"
  where: "p. 7875, col. 1 & Fig. 2D"
equation: "P_star = 2 * (n - cos(theta)) / (n^2 - 1), where n = R_max / R_f"
built_from:
  - dimensionless_capillary_pressure
inputs:
  n: {quantity: rescaled_droplet_radius, unit: dimensionless}
  theta: {quantity: contact_angle, unit: deg}
outputs:
  P_star: {quantity: dimensionless_capillary_pressure, unit: dimensionless}
settings: {}
stochastic: false
