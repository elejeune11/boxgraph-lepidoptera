id: dimensionless_capillary_pressure_from_fig2c
name: dimensionless capillary pressure curve computed point-by-point from Fig. 2C (n, theta) data
role: model
stated:
  page: 4
  printed_page: "7875"
  quote: "against the condensate radius rescaled by the"
  where: "p. 7875, col. 1 & Fig. 2C–D"
equation: "P_star(n_i) = 2 * (n_i - cos(theta_i)) / (n_i^2 - 1), evaluated at the Fig. 2C (n_i, theta_i) pairs resampled onto Fig. 2D x positions"
built_from:
  - dimensionless_capillary_pressure_rescaled
inputs:
  theta_vs_n:
    quantity: contact_angle
    unit: deg
    curve:
      quantity: rescaled_droplet_radius
      unit: dimensionless
  P_star_target:
    quantity: dimensionless_capillary_pressure
    unit: dimensionless
    curve:
      quantity: rescaled_droplet_radius
      unit: dimensionless
outputs:
  P_star_curve:
    quantity: dimensionless_capillary_pressure
    unit: dimensionless
    curve:
      quantity: rescaled_droplet_radius
      unit: dimensionless
settings: {}
stochastic: false
