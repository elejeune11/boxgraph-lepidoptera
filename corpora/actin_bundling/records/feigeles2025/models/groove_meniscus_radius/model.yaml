id: groove_meniscus_radius
name: surface-groove meniscus radius of curvature in equilibrium with unduloidal droplet (p. 4)
role: model
stated:
  page: 4
  printed_page: "7875"
  quote: "This radius satisfies the equilibrium condition"
  where: "p. 7875, col. 2"
equation: "2 * sigma * (R_max - R_f * cos(theta)) / (R_max^2 - R_f^2) = sigma / R_FUS"
built_from:
  - unduloid_capillary_pressure
inputs:
  R_max: {quantity: droplet_max_radius, unit: um}
  R_f: {quantity: bundle_radius, unit: um}
  theta: {quantity: contact_angle, unit: deg}
outputs:
  R_FUS: {quantity: groove_meniscus_radius, unit: um}
  R_FUS_over_Rf: {quantity: rescaled_groove_meniscus_radius, unit: dimensionless}
settings: {}
stochastic: false
