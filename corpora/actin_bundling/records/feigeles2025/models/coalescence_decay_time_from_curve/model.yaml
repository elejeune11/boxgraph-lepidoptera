id: coalescence_decay_time_from_curve
name: exponential decay time extraction from coalescing condensate length trajectory
role: processing
stated:
  page: 4
  printed_page: "7875"
  quote: "Exponential fit (red solid line) has a characteristic decay of"
  where: "Fig. 3C (p. 7875) & Fig. S6B (p. SI-5)"
equation: "L(t) = L_f + A * exp(-(t - t_0) / tau), nonlinear least-squares fit"
built_from:
  - coalescence_exponential_decay_figS6B_corrected
inputs:
  L_vs_t:
    quantity: coalescing_condensate_length
    unit: um
    curve:
      quantity: time
      unit: s
outputs:
  tau:
    quantity: coalescence_decay_time
    unit: s
  L_f:
    quantity: final_coalescence_length
    unit: um
  Delta_L:
    quantity: coalescence_length_change
    unit: um
settings: {}
stochastic: false
