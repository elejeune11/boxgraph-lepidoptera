id: gaussian_bundle_profile_eq1
name: transverse Gaussian fluorescence intensity profile across an actin bundle (Eq. 1)
role: fit
stated:
  page: 7
  printed_page: "7878"
  quote: "was then plotted and fit to a Gaussian using the following"
  where: "Eq. 1"
equation: "I(x) = I_0 + (I_B / (delta * sqrt(2*pi))) * exp(-((x - x_0)^2 / (2 * delta^2)))"
inputs:
  x: {quantity: gaussian_position, unit: um}
  x_0: {quantity: gaussian_position, unit: um}
  delta: {quantity: gaussian_std, unit: um}
  I_0: {quantity: fluorescence_intensity, unit: dimensionless}
  I_B: {quantity: integrated_bundle_intensity, unit: um}
outputs:
  I: {quantity: fluorescence_intensity, unit: dimensionless}
settings: {}
stochastic: false
