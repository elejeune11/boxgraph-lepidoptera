id: unduloid_ode_eq3_rhs_corrected
name: unduloidal droplet profile ODE, second expression with denominator square restored (Eq. 3 RHS corrected)
role: model
stated:
  page: 8
  printed_page: "7879"
  quote: "profile was fit with the unduloidal function (eqn (3))"
  where: "Eq. 3 (second expression, corrected variant)"
described_from: ref-14
variant_of: unduloid_ode_eq3_rhs_printed
corrections:
  - equation: "Eq. 3 (second expression)"
    change: "Restore the missing square on the denominator: sqrt(1 / ((Delta p / (2*sigma))*y - c/y)^2 - 1) instead of sqrt(1 / ((Delta p / (2*sigma))*y - c/y) - 1)"
    evidence: "Algebraic simplification of the first printed expression in Eq. (3), sqrt((1 - u^2) / u^2), equals sqrt(1/u^2 - 1), not sqrt(1/u - 1). For the Fig. 5B droplet (R_f = 1.2 um, R_b = 6.5 um, theta_b = 77 deg, theta = 31 deg), the printed RHS gives theta = 22.2 deg and theta_b = 80.8 deg, whereas restoring the square recovers theta = 31.0 deg and theta_b = 77.0 deg."
equation: "dy/dx = sqrt(1 / ((Delta p / (2*sigma))*y - c/y)^2 - 1), y(0) = R_f"
built_from:
  - unduloid_constant_eq4
  - unduloid_pressure_eq5
inputs:
  R_f: {quantity: bundle_radius, unit: um}
  R_b: {quantity: cutoff_droplet_radius, unit: um}
  DeltaP_over_2sigma: {quantity: reduced_laplace_pressure, unit: 1/um}
  c: {quantity: unduloid_constant, unit: um}
outputs:
  theta_contact: {quantity: contact_angle, unit: deg}
  theta_b_out: {quantity: cutoff_angle, unit: deg}
  x_b: {quantity: droplet_axial_position, unit: um}
  x_apex: {quantity: droplet_half_length, unit: um}
  aspect_ratio_eq: {quantity: droplet_aspect_ratio, unit: dimensionless}
settings:
  max_step: 0.1
  rtol: 1.0e-8
  atol: 1.0e-10
stochastic: false
