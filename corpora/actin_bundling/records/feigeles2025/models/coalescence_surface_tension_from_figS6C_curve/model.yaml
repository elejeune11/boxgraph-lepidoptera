id: coalescence_surface_tension_from_figS6C_curve
name: interfacial tension extracted via linear regression of Fig. S6C Delta L vs tau
role: processing
stated:
  page: 15
  printed_page: "SI-6"
  quote: "the surface tension is extracted from the slope of the line"
  where: "Fig. S6C caption (pp. 14–15)"
equation: "slope = d(Delta L)/d(tau) by OLS regression; gamma = eta * slope"
built_from:
  - coalescence_surface_tension_figS6C
inputs:
  DeltaL_vs_tau:
    quantity: coalescence_length_change
    unit: um
    curve:
      quantity: coalescence_decay_time
      unit: s
  eta:
    quantity: condensate_viscosity
    unit: Pa*s
outputs:
  slope:
    quantity: capillary_velocity
    unit: um/s
  gamma:
    quantity: interfacial_tension
    unit: uN/m
settings: {}
stochastic: false
