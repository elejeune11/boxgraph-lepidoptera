id: unduloid_capillary_pressure
name: unduloid droplet capillary pressure (p. 4)
role: model
stated:
  page: 4
  printed_page: "7875"
  quote: "DPcondensate, between the condensate and bundle for an undu-"
  where: "p. 7875, col. 1"
described_from: ref-14
equation: "DeltaP_condensate = 2 * sigma * (R_max - R_f * cos(theta)) / (R_max^2 - R_f^2)"
inputs:
  sigma: {quantity: interfacial_tension, unit: uN/m}
  R_max: {quantity: droplet_max_radius, unit: um}
  R_f: {quantity: bundle_radius, unit: um}
  theta: {quantity: contact_angle, unit: deg}
outputs:
  DeltaP_condensate: {quantity: capillary_pressure, unit: N/m^2}
settings: {}
stochastic: false
