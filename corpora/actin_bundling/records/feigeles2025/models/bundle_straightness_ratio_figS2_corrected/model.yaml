id: bundle_straightness_ratio_figS2_corrected
name: bundle contour to end-to-end length ratio L_c / epsilon (Fig. S2 axis inversion corrected)
role: processing
stated:
  page: 12
  printed_page: "SI-3"
  quote: "Ratio of the end-to-end to contour length"
  where: "Fig. S2 (corrected variant)"
variant_of: bundle_straightness_ratio_figS2_printed
corrections:
  - equation: "Fig. S2 y-axis label and caption (epsilon / L_c)"
    change: "Invert the ratio from epsilon / L_c to L_c / epsilon"
    evidence: "By the triangle inequality, the straight-line end-to-end distance epsilon cannot exceed the contour length L_c along the bundle (epsilon / L_c <= 1). Fig. S2 plots values ranging from 1.0 up to ~2.6, which matches L_c / l as defined in the main text on p. 3 ('the ratio of the contour length, L_c, to the end-to-end length, l')."
equation: "ratio = L_c / epsilon"
inputs:
  epsilon: {quantity: bundle_end_to_end_length, unit: um}
  L_c: {quantity: bundle_contour_length, unit: um}
outputs:
