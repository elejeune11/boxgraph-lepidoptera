id: dimensionless_capillary_pressure
name: dimensionless capillary pressure normalized by cylindrical column pressure (p. 4, Fig. 2D)
role: model
stated:
  page: 4
  printed_page: "7875"
  quote: "Plotting the dimensionless capillary pressure"
  where: "p. 7875, col. 1 & Fig. 2D"
equation: "(DeltaP_condensate * R_f) / sigma = 2 * R_f * (R_max - R_f * cos(theta)) / (R_max^2 - R_f^2)"
built_from:
  - unduloid_capillary_pressure
  - cylindrical_column_capillary_pressure
inputs:
  R_max: {quantity: droplet_max_radius, unit: um}
  R_f: {quantity: bundle_radius, unit: um}
  theta: {quantity: contact_angle, unit: deg}
outputs:
  P_star: {quantity: dimensionless_capillary_pressure, unit: dimensionless}
settings: {}
stochastic: false
