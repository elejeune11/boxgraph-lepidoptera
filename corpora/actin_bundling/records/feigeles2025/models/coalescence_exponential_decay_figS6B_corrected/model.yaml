id: coalescence_exponential_decay_figS6B_corrected
name: droplet coalescence length exponential decay (Fig. S6B corrected variant)
role: fit
stated:
  page: 14
  printed_page: "SI-5"
  quote: "Representative data of length as a function of time"
  where: "Fig. S6B inset equation (corrected variant)"
variant_of: coalescence_exponential_decay_figS6B_printed
corrections:
  - equation: "Fig. S6B inset equation"
    change: "Replace leading L_i with L_f and replace exponent (-tau / t) with (-t / tau), giving L(t) = L_f + (L_i - L_f) * exp(-t / tau)"
    evidence: "Fig. S6B plots condensate length monotonically decreasing from ~7.15 um to a final plateau ~4.6 um as time increases. With L_i > L_f, the printed expression L_i + (L_i - L_f)*exp(-tau/t) starts at L_i as t -> 0+ and rises monotonically toward 2*L_i - L_f (~9.8 um) as t -> infinity, contradicting the plotted exponential decay curve."
equation: "L = L_f + (L_i - L_f) * exp(-t / tau)"
inputs:
  L_i: {quantity: initial_coalescence_length, unit: um}
  L_f: {quantity: final_coalescence_length, unit: um}
  tau: {quantity: coalescence_decay_time, unit: s}
  t: {quantity: time, unit: s}
outputs:
  L: {quantity: coalescing_condensate_length, unit: um}
settings: {}
stochastic: false
