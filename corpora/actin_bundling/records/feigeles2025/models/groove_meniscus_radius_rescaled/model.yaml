id: groove_meniscus_radius_rescaled
name: rescaled surface-groove meniscus radius R_FUS/R_f from rescaled droplet radius (p. 4)
role: model
stated:
  page: 4
  printed_page: "7875"
  quote: "that RFUS ranges between 2.3Rf o RFUS o 5.4Rf, suggesting"
  where: "p. 7875, col. 2"
equation: "R_FUS / R_f = (n^2 - 1) / (2 * (n - cos(theta))), where n = R_max / R_f"
built_from:
  - groove_meniscus_radius
inputs:
  n: {quantity: rescaled_droplet_radius, unit: dimensionless}
  theta: {quantity: contact_angle, unit: deg}
outputs:
  R_FUS_over_Rf: {quantity: rescaled_groove_meniscus_radius, unit: dimensionless}
settings: {}
stochastic: false
