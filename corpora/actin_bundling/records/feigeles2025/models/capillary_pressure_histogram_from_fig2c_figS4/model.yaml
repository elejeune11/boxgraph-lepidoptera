id: capillary_pressure_histogram_from_fig2c_figS4
name: capillary pressure histogram reconstructed from paired Fig. 2C and Fig. S4 droplets (Fig. S7)
role: processing
stated:
  page: 15
  printed_page: "SI-6"
  quote: "Histogram of the capillary pressure for 28 FUS condensates"
  where: "Fig. S7 (p. SI-6) & p. 7875, col. 1"
equation: "DeltaP_i = 2*sigma*(R_max,i - R_f,i*cos(theta_i))/(R_max,i^2 - R_f,i^2) with R_f,i = R_max,i / n_i, binned into left-edge 10 N/m^2 bins [20,30)..[60,70)"
built_from:
  - unduloid_capillary_pressure
inputs:
  theta_vs_n:
    quantity: contact_angle
    unit: deg
    curve:
      quantity: rescaled_droplet_radius
      unit: dimensionless
  theta_vs_Rmax:
    quantity: contact_angle
    unit: deg
    curve:
      quantity: droplet_max_radius
      unit: um
  sigma:
    quantity: interfacial_tension
    unit: uN/m
  hist_target:
    quantity: histogram_frequency
    unit: dimensionless
    curve:
      quantity: capillary_pressure
      unit: N/m^2
outputs:
  freq_curve:
    quantity: histogram_frequency
    unit: dimensionless
    curve:
      quantity: capillary_pressure
      unit: N/m^2
settings: {}
stochastic: false
