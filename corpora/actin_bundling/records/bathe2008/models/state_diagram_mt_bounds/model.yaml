id: state_diagram_mt_bounds
name: state diagram alpha bounds from interlayer shear modulus for MT bundles (Fig. 5g)
role: model
stated:
  page: 7
  printed_page: "2961"
  quote: "we also include in the state diagram MT bundles from outer pillar hair cells"
  where: Fig. 5g & text p. 7 col 1
equation: "alpha(L_min), alpha(L_max) from alpha = (k_x / delta) * L^2 / (E_f * A_f), evaluated at Fig. 5g box corners [N_min, N_max]"
built_from:
  - coupling_parameter_shear_modulus
inputs:
  G_shear: {quantity: interlayer_shear_modulus, unit: Pa}
  E_f_A_f: {quantity: fiber_extensional_rigidity, unit: N}
  L_min: {quantity: bundle_length, unit: m}
  L_max: {quantity: bundle_length, unit: m}
  box_ref:
    quantity: fiber_coupling_parameter
    unit: dimensionless
    curve: {quantity: filament_number, unit: dimensionless}
outputs:
  alpha_bounds:
    quantity: fiber_coupling_parameter
    unit: dimensionless
    curve: {quantity: filament_number, unit: dimensionless}
settings: {}
stochastic: false
