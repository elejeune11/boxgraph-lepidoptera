id: wlb_fe_fractured
name: 2D Hermitian beam FE model with random fiber fractures (SM Figs. S1-S2)
role: model
stated:
  page: 11
  quote: "Each original mother-fiber in the Finite Element model is divided into m daughter-fibers"
  where: Supplementary Material, p. 11 & text p. 5 col 2
equation: "2M mother fibers divided into phi = L/L_f randomly staggered daughter fibers; pinned 3-point bending"
built_from:
  - wlb_fe_3point
inputs:
  M: {quantity: half_layer_count, unit: dimensionless}
  alpha: {quantity: fiber_coupling_parameter, unit: dimensionless}
  phi: {quantity: fracture_density, unit: dimensionless}
  kappa_f_sim: {quantity: arbitrary_fiber_bending_stiffness, unit: dimensionless}
outputs:
  kappa_B_star: {quantity: normalized_bending_stiffness, unit: dimensionless}
  kappa_B_sim: {quantity: arbitrary_bundle_bending_stiffness, unit: dimensionless}
settings:
  n_el: 80
  seed: 0
stochastic: true
