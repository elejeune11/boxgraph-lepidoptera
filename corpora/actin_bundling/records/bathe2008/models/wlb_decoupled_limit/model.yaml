id: wlb_decoupled_limit
name: decoupled bundle bending stiffness limit (alpha << 1)
role: model
stated:
  page: 5
  printed_page: "2959"
  quote: "quantitative agreement with the FE results. In the limits of"
  where: text, p. 5 col 1 & Fig. 3A
equation: "kappa_B = N * kappa_f"
inputs:
  kappa_f: {quantity: fiber_bending_stiffness, unit: N*m^2}
  N: {quantity: filament_number, unit: dimensionless}
outputs:
  kappa_B: {quantity: bundle_bending_stiffness, unit: N*m^2}
  kappa_B_star: {quantity: normalized_bending_stiffness, unit: dimensionless}
settings: {}
stochastic: false
