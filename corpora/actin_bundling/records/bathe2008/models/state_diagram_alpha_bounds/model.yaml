id: state_diagram_alpha_bounds
name: state diagram alpha bounds from Eq. (1) for actin bundles (Fig. 5)
role: model
stated:
  page: 6
  printed_page: "2960"
  quote: "The bending regime of in vivo cytoskeletal bundles may be predicted"
  where: Fig. 5 & text pp. 6-7
equation: "alpha(L_min), alpha(L_max) from alpha = k_x * L^2 / (E_f * A_f * delta), evaluated at the Fig. 5 box corners [N_min, N_max]"
built_from:
  - coupling_parameter_ea
inputs:
  k_x: {quantity: crosslink_shear_stiffness, unit: N/m}
  E_f_A_f: {quantity: fiber_extensional_rigidity, unit: N}
  delta: {quantity: crosslink_spacing, unit: m}
  L_min: {quantity: bundle_length, unit: m}
  L_max: {quantity: bundle_length, unit: m}
  box_ref:
    quantity: fiber_coupling_parameter
    unit: dimensionless
    curve: {quantity: filament_number, unit: dimensionless}
outputs:
  alpha_bounds:
    quantity: fiber_coupling_parameter
    unit: dimensionless
    curve: {quantity: filament_number, unit: dimensionless}
settings: {}
stochastic: false
