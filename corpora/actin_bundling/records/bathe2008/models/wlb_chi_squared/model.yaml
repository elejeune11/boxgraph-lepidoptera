id: wlb_chi_squared
name: cross-link finite-thickness factor chi^2
role: model
stated:
  page: 5
  printed_page: "2959"
  quote: "finite thickness of the cross-links."
  where: Eq. 2 & Eq. A6
equation: "chi^2 := A_f * (d_f + t)^2 / (12 * I_f)"
inputs:
  A_f: {quantity: fiber_area, unit: m^2}
  d_f: {quantity: fiber_diameter, unit: m}
  t: {quantity: crosslink_length, unit: m}
  I_f: {quantity: fiber_moment_of_inertia, unit: m^4}
outputs:
  chi2: {quantity: crosslink_geometry_factor, unit: dimensionless}
settings: {}
stochastic: false
