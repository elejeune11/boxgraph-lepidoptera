id: wlb_ring_fluctuation_eqa10
name: exact Fourier mode-sum ring-bundle bending stiffness (Eq. A10)
role: model
stated:
  page: 8
  printed_page: "2962"
  quote: "Calculation of the equilibrium mean-square transverse displacement"
  where: Eq. A10
equation: "r_perp^2 = 2 * sum_{j=1}^{n_modes} (k_B*T/L) / (q_j^4 * kappa_B(N,alpha,q_j)) = k_B*T*L^3 / (720 * kappa_{B,eff}), q_j = 2*pi*j/L"
built_from:
  - wlb_bending_stiffness_eq2
inputs:
  kappa_f: {quantity: fiber_bending_stiffness, unit: N*m^2}
  N: {quantity: filament_number, unit: dimensionless}
  alpha: {quantity: fiber_coupling_parameter, unit: dimensionless}
  chi2: {quantity: crosslink_geometry_factor, unit: dimensionless}
outputs:
  kappa_B: {quantity: bundle_bending_stiffness, unit: N*m^2}
  kappa_B_star: {quantity: normalized_bending_stiffness, unit: dimensionless}
settings:
  n_modes: 200
stochastic: false
