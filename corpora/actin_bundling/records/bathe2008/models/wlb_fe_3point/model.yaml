id: wlb_fe_3point
name: 2D Hermitian beam finite element model for three-point bending
role: model
stated:
  page: 3
  printed_page: "2957"
  quote: "Fibers are discretized identically in two dimensions (2D) using two-node"
  where: Finite element modeling, p. 3 col 1-2
equation: "E_cl = (k_x/2)*[(u^(k)-u^(k-1)) + ((d_f+t)/2)*(theta^(k)+theta^(k-1))]^2; kappa_B = 2M * P*L^3/(a*w_{L/2})"
inputs:
  N: {quantity: filament_number, unit: dimensionless}
  alpha: {quantity: fiber_coupling_parameter, unit: dimensionless}
  chi2: {quantity: crosslink_geometry_factor, unit: dimensionless}
outputs:
  kappa_B_star: {quantity: normalized_bending_stiffness, unit: dimensionless}
settings:
  bc: pinned
  n_el: 80
stochastic: false
