id: timoshenko_macroscopic
name: Timoshenko homogeneous beam bending stiffness (pinned 3-point bending)
role: model
stated:
  page: 5
  printed_page: "2959"
  quote: "The bundle stiffness computed from Timoshenko theory"
  where: text, p. 5 col 1
equation: "kappa_B = E_B * I_B * [1 + 12 * E_B * I_B / (beta * G_B * A_B * L_B^2)]^(-1)"
described_from: ref-58
inputs:
  E_B: {quantity: bundle_youngs_modulus, unit: Pa}
  I_B: {quantity: bundle_moment_of_inertia, unit: m^4}
  beta: {quantity: shear_correction_factor, unit: dimensionless}
  G_B: {quantity: interlayer_shear_modulus, unit: Pa}
  A_B: {quantity: bundle_area, unit: m^2}
  L: {quantity: bundle_length, unit: m}
outputs:
  kappa_B: {quantity: bundle_bending_stiffness, unit: N*m^2}
settings: {}
stochastic: false
