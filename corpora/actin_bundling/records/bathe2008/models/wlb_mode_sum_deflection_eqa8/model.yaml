id: wlb_mode_sum_deflection_eqa8
name: exact Fourier mode-sum three-point bending stiffness (Eqs. A8-A9)
role: model
stated:
  page: 8
  printed_page: "2962"
  quote: "transverse deflection vanishes at the bundle ends."
  where: Eqs. A8-A9
equation: "r_perp(L/2) = -F_{L/2}*L^3/(beta*kappa_{B,eff}), with r_perp(x) = R_0 - sum_{j=1}^{n_modes} F_j*phi(q_j*x)/(q_j^4*kappa_B(N,alpha,q_j))"
built_from:
  - wlb_bending_stiffness_eq2
inputs:
  kappa_f: {quantity: fiber_bending_stiffness, unit: N*m^2}
  N: {quantity: filament_number, unit: dimensionless}
  alpha: {quantity: fiber_coupling_parameter, unit: dimensionless}
  chi2: {quantity: crosslink_geometry_factor, unit: dimensionless}
outputs:
  kappa_B: {quantity: bundle_bending_stiffness, unit: N*m^2}
  kappa_B_star: {quantity: normalized_bending_stiffness, unit: dimensionless}
settings:
  bc: pinned
  n_modes: 200
stochastic: false
