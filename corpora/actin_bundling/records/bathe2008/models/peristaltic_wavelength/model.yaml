id: peristaltic_wavelength
name: maximum peristaltic mode wavelength
role: model
stated:
  page: 3
  printed_page: "2957"
  quote: "restricts the wavelength of these peristaltic"
  where: text, p. 3 col 1
equation: "lambda_max := (kappa_f * delta / k_perp)^(1/4)"
inputs:
  kappa_f: {quantity: fiber_bending_stiffness, unit: N*m^2}
  delta: {quantity: crosslink_spacing, unit: m}
  k_perp: {quantity: crosslink_extensional_stiffness, unit: N/m}
outputs:
  lambda_max: {quantity: peristaltic_wavelength, unit: nm}
settings: {}
stochastic: false
