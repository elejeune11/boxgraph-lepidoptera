id: critical_buckling_force
name: Euler critical buckling load scaling
role: model
prefactor: unknown
stated:
  page: 7
  printed_page: "2961"
  quote: "at the critical buckling load"
  where: text, p. 7 col 1
equation: "F_crit ~ kappa_B / L^2"
inputs:
  kappa_B: {quantity: bundle_bending_stiffness, unit: N*m^2}
  L: {quantity: bundle_length, unit: m}
outputs:
  F_crit: {quantity: critical_buckling_force, unit: N}
settings: {}
stochastic: false
