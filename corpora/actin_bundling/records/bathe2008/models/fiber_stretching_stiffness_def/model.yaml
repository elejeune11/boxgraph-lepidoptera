id: fiber_stretching_stiffness_def
name: discrete fiber stretching stiffness between cross-links
role: model
stated:
  page: 2
  printed_page: "2956"
  quote: "Euler-Bernoulli beams (or extensible wormlike polymers) with stretching"
  where: text, p. 2 col 1
equation: "k_f := E_f * A_f / delta"
inputs:
  E_f_A_f: {quantity: fiber_extensional_rigidity, unit: N}
  delta: {quantity: crosslink_spacing, unit: m}
outputs:
  k_f: {quantity: fiber_stretching_stiffness, unit: N/m}
settings: {}
stochastic: false
