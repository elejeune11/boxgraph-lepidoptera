id: wlb_bending_stiffness_fig4
name: WLB bending stiffness vs L^2/delta for fascin-actin rings (Fig. 4)
role: model
stated:
  page: 6
  printed_page: "2960"
  quote: "bundle stiffness (solid line) is calculated using Eq. 2"
  where: Fig. 4
equation: "kappa_B = kappa_f * N * (1 + chi^2 * (N - 1) / (1 + c * (N + sqrt(N)) / ((k_x / (E_f * A_f)) * (L^2 / delta))))"
built_from:
  - wlb_bending_stiffness_eq2
  - coupling_parameter_ea
inputs:
  kappa_f: {quantity: fiber_bending_stiffness, unit: N*m^2}
  N: {quantity: filament_number, unit: dimensionless}
  k_x: {quantity: crosslink_shear_stiffness, unit: N/m}
  E_f_A_f: {quantity: fiber_extensional_rigidity, unit: N}
  L2_over_delta: {quantity: length_sq_over_spacing, unit: m}
  chi2: {quantity: crosslink_geometry_factor, unit: dimensionless}
  c: {quantity: mode_factor, unit: dimensionless}
outputs:
  kappa_B: {quantity: bundle_bending_stiffness, unit: N*m^2}
settings: {}
stochastic: false
