id: coupling_parameter_ea
name: fiber coupling parameter in terms of extensional rigidity Ef*Af
role: model
stated:
  page: 5
  printed_page: "2959"
  quote: "which a := (k3/EfAf)(L2/d) mediates the bending regime"
  where: text, p. 5 col 2 & Appendix p. 8
equation: "alpha := (k_x / (E_f * A_f)) * (L^2 / delta)"
inputs:
  k_x: {quantity: crosslink_shear_stiffness, unit: N/m}
  E_f_A_f: {quantity: fiber_extensional_rigidity, unit: N}
  L: {quantity: bundle_length, unit: m}
  delta: {quantity: crosslink_spacing, unit: m}
outputs:
  alpha: {quantity: fiber_coupling_parameter, unit: dimensionless}
settings: {}
stochastic: false
