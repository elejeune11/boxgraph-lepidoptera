id: wlb_hamiltonian_reduced_eqa5
name: mode bending stiffness from reduced Hamiltonian (Eq. A5)
role: model
stated:
  page: 8
  printed_page: "2962"
  quote: "and the corresponding reduced Hamiltonian,"
  where: Eq. A5
equation: "kappa_B(q_j) = 2 * H_j[r_j, Delta_u*] / (q_j^4 * r_j^2) = 4*M^2*kappa_f + 2*M^2*E_f*A_f*(d_f+t)^2*(4*M^2-1) / (6 + (q_j*L)^2*M*(2*M+1)/alpha)"
inputs:
  M: {quantity: half_layer_count, unit: dimensionless}
  kappa_f: {quantity: fiber_bending_stiffness, unit: N*m^2}
  E_f_A_f: {quantity: fiber_extensional_rigidity, unit: N}
  d_f: {quantity: fiber_diameter, unit: m}
  t: {quantity: crosslink_length, unit: m}
  k_x: {quantity: crosslink_shear_stiffness, unit: N/m}
  delta: {quantity: crosslink_spacing, unit: m}
  L: {quantity: bundle_length, unit: m}
  q_j: {quantity: wavenumber, unit: 1/m}
outputs:
  kappa_B: {quantity: bundle_bending_stiffness, unit: N*m^2}
settings: {}
stochastic: false
