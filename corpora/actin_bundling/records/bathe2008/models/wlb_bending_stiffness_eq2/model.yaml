id: wlb_bending_stiffness_eq2
name: wormlike bundle effective bending stiffness (Eq. 2 / Eq. A6)
role: model
stated:
  page: 5
  printed_page: "2959"
  quote: "The mode number dependent bending stiffness depends on the wave numbers"
  where: Eq. 2
equation: "kappa_B(N, alpha, c) = kappa_f * N * (1 + chi^2 * (N - 1) / (1 + c * (N + sqrt(N)) / alpha))"
inputs:
  kappa_f: {quantity: fiber_bending_stiffness, unit: N*m^2}
  N: {quantity: filament_number, unit: dimensionless}
  alpha: {quantity: fiber_coupling_parameter, unit: dimensionless}
  chi2: {quantity: crosslink_geometry_factor, unit: dimensionless}
  c: {quantity: mode_factor, unit: dimensionless}
outputs:
  kappa_B: {quantity: bundle_bending_stiffness, unit: N*m^2}
  kappa_B_star: {quantity: normalized_bending_stiffness, unit: dimensionless}
settings: {}
stochastic: false
