# Cross-record provenance audit of cited values for bathe2008 across all five
# Wave 6 partner records: grason2007, claessens2008, graham2023, graham_code,
# and claessens2006 (ref-29).
#
# 1. bathe2008 + grason2007 (0 CitedLink entries):
#    - bathe2008 cites grason2007 once (`ref-35`, source: grason2007) on PDF p. 2 col 2
#      (printed p. 2956) inside the bracket `(33-36)` solely to justify neglecting torsional
#      twist in the linear bending regime (`l_p := kappa_B / k_B T >> L`).
#    - Zero datums in bathe2008/data.yaml carry `from_source: ref-35` or `grason2007`, and
#      grason2007 (Aug 2007) precedes bathe2008 and cites no bathe2008 values.
#
# 2. bathe2008 + claessens2008 (0 CitedLink entries):
#    - bathe2008 (Apr 2008) does not cite claessens2008 (Jul 2008). claessens2008 cites
#      bathe2008 once conceptually (`ref-3`, p. 1 col 1, printed p. 8819) for the mechanical
#      requirements of cytoskeletal bundles, and zero datums in claessens2008/data.yaml take a
#      value from `ref-3`.
#    - Shared external reference discrepancy noted in questions.yaml
#      (`q_claessens2008_kd_discrepancy_and_structural_comparison`): both papers cite Ono et al.
#      (JBC 272:2527-2533, 1997; bathe2008/ref-83, claessens2008/ref-36) for fascin-actin K_d,
#      yet bathe2008 prints 0.5 uM while claessens2008 prints 0.3 uM. Both also cite DeRosier &
#      Tilney (1981; bathe2008/ref-31, claessens2008/ref-30) for hexagonal F-actin packing.
#
# 3. bathe2008 + graham2023 (0 CitedLink entries):
#    - graham2023 cites bathe2008 (`ref-si-11`, SI Note 1, PDF p. 39 / SI-12) for the WLB
#      bending stiffness equation (SI Eq. S1), not for any numerical datum; all six `from_source`
#      entries in graham2023/data.yaml cite external literature (`ref-15`, `ref-27`, `ref-si-8`,
#      `ref-si-9` [Gittes 1993], `ref-si-10`). Zero datums in bathe2008/data.yaml come from
#      graham2023 (2023).
#
# 4. bathe2008 + graham_code (0 CitedLink entries):
#    - graham_code cites bathe2008 (`ref-bathe2008`, VASPDroplet_simulate.ipynb line 73
#      `# Bathe et al Nonlinear`) for the inactive nonlinear branch of `getkbend()`, but none of
#      graham_code's 6 hidden `bathe_*_code` parameters (`df=10 nm`, `delta=50 nm`, `t=15 nm`,
#      `kx=2.5 pN/nm`, `Ef=2.6e9 Pa`, `nmodes=10`) are printed in or taken from bathe2008; its
#      only `from_source` entries point to `graham2023` (41 links) and `ref-gittes1993` (1 link).
#
# 5. bathe2008 + claessens2006 (0 CitedLink entries; see q_claessens2006_fig4_not_replot_and_validation_scope):
#    - The only 6 datums in bathe2008/data.yaml with `from_source: ref-29` (source: claessens2006)
#      are the Fig. 4 experimental curves (`fig4_exp_points_datum` and `fig4_exp_d40/d56/d68/d225/
#      d412_datum`, indexed by `L^2/delta` [m] at fixed N = 27 +/- 6). Quantitative comparison
#      against claessens2006 Fig. 3B confirms that bathe2008 Fig. 4 is NOT printed in claessens2006:
#      Fig. 4 spans 5 fascin spacings (delta = 40, 56, 68, 225, 412 nm) with bundle length L varied
#      uncorrelatedly over 24.2-55.9 um (down to kappa_B = 0.93 pN*um^2), whereas claessens2006
#      Fig. 3B reports 4 fascin ratios (r = 0.5, 0.2, 0.05, 0.02) indexed by filament count n with
#      correlated lengths L_B(n) ~= 48-54 um near n = 27 (min kappa_B = 1.59 pN*um^2). The Fig. 4
#      caption phrase "as described in Claessens et al. (29)" refers to the microemulsion-droplet
#      measurement method (cf. p. 3 col 2: "Experimental methods are as described in Claessens et al.
#      (29)"). Per BoxGraph Rule 5 ("A value the other paper does not print stays unlinked"), these
#      6 datums remain unlinked (and have incompatible table index quantity vs Fig. 3B).
#    - All shared physical constants in bathe2008/data.yaml cite external primary literature rather
#      than ref-29: `kappa_f_actin_p3` (ref-39 Le Goff 2002), `EfAf_actin` (ref-41 Kojima 1994),
#      `Kd_fascin` = 0.5 uM (ref-83 Ono 1997; disagrees with claessens2006 uncited 0.7 uM), and
#      `delta_min_hex` = 37.5 nm (ref-31 DeRosier & Tilney 1981; disagrees with claessens2006 33 nm).
#      `G_shear_fascin_table` and `kx_fascin_t0/t10_printed` are bathe2008's own new Eq. (2) fits
#      and estimates (not printed in claessens2006).
#    - Conversely, claessens2006/data.yaml has 0 datums with `from_source: ref-bathe-inprep`
#      (claessens2006 cites ref-bathe-inprep on p. 12 solely for the fiber-based bundle model).
#
