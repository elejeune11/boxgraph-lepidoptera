notes: >
  In scope: the complete Wormlike Bundle (WLB) theoretical framework of Bathe et al. (2008) plus
  Supplementary Material (PDF p. 11, converted from mmc1.doc): coupling parameter Eq. (1) and its
  equivalent forms, peristaltic wavelength cutoff, Appendix continuum Hamiltonian derivation
  Eqs. (A1)-(A6) and closed-form bending stiffness Eq. (2), exact Fourier mode sums for three-point
  bending Eqs. (A8)-(A9) and periodic ring thermal fluctuations Eq. (A10), direct-stiffness 2D
  Hermitian beam + discrete cross-link shear finite element models (unfractured p. 3 and randomly
  fractured p. 5 & SM p. 11), Timoshenko beam theory reduction (p. 5), factor-of-2 crossover law
  (Fig. 3B inset), Langmuir cross-link spacing isotherm and fascin-actin bundle fitting (p. 5 &
  Fig. 4), in vivo bending-stiffness state diagram (Fig. 5, all 7 biological bundle systems a-g),
  and fiber fracture renormalization scaling (SM Figs. S1-S2). All quantitative figures (Figs. 3A,
  3B, 3B inset, 4, 5, S1, S2A, S2B) are digitized via code readers verified on high-res overlays.
  Left out: context/qualitative numbers that feed no model in this paper — cross-link off-rate
  k_off ~ 0.1-1 s^-1 (p. 2), peristaltic transverse fluctuation amplitude r_perp ~ 0.1-1 nm and
  interaxial spacing (d_f + t) >= 10 nm (p. 3), in vitro diameter/length summary ranges (2 <= N <= 40,
  14-90 um, 24-55 um on p. 5), stereocilia count ~60 in Fig. 1A, Drosophila bristle bundle count 11
  (p. 7), and qualitative micrographs/schematics (Figs. 1 and 2, documented in figures.md).
  Audit findings are recorded in questions.yaml (including the d_f [m^2] unit typo on p. 2,
  unstated kappa_f = 4.0e-26 N*m^2 and k_x = 7.3e-5 N/m underlying Fig. 4 curves vs printed
  7e-26 N*m^2 and 1e-5 N/m, 37.5 nm vs 39 nm minimum spacing, Fig. 5 box a and box g quantitative
  offsets, bristle fracture density phi = 133 vs phi* = M/8 ~= 1.5 or M ~= 12, and exact mode-sum
  vs constant-c approximation errors of 10-16%).
