- id: rel_eq2_reduces_to_graham_code_kbend
  kind: reduces_to
  a: bathe2008/wlb_bending_stiffness_eq2
  b: graham_code/notebook_bundle_kbend
  mapping:
    Nfil: "N"
    lcyl: "100"
