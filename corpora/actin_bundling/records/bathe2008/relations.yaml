    identically to bathe2008's decoupled limit kappa_B = N * kappa_f across all inter-filament
    spacings t in [0, 35 nm].
  assumptions:
    - "Vanishing effective shear coupling k_par / delta -> 0 (k_par -> 0, delta -> oo; matching claessens2006/rel_bundle_3d_reduces_to_decoupled)."

- id: rel_claessens2006_bundle_3d_reduces_to_fully_coupled
  kind: reduces_to
  a: claessens2006/bundle_3d_bending
  b: bathe2008/wlb_fully_coupled_limit
  mapping:
    kappa_f: "kappa_a"
    N: "n"
    chi2: "k_a * d * (d + t) / (12 * kappa_a)"
  output_map:
    kappa_B: kappa_B
  limit:
    k_par: "oo"
