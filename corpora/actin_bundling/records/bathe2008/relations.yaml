    finite-thickness fully coupled limit kappa_B = kappa_f * N * (1 + chi^2 * (N - 1)) once
    claessens2006's Tolomeo-Holley geometric factor d*(d+t) is mapped to chi^2 = k_a*d*(d+t)/(12*kappa_a).
  assumptions:
    - "Rigid cross-links k_par -> oo; maps Tolomeo-Holley d*(d+t) into chi^2 (note bathe2008 uses parallel-axis (d_f+t)^2)."

- id: rel_claessens2006_bundle_3d_KnoN_reduces_to_decoupled
  kind: reduces_to
  a: claessens2006/bundle_3d_bending_K_no_divN
  b: bathe2008/wlb_decoupled_limit
  mapping:
    kappa_f: "kappa_a"
    N: "n"
  output_map:
    kappa_B: kappa_B
  limit:
    k_par: "0"
    delta: "oo"
  regime:
    n: [2.0, 40.0]
    L_B: [1.0e-5, 8.0e-5]
    k_par: [1.0e-7, 1.0e-4]
    delta: [3.3e-8, 2.0e-6]
    k_a: [4.4e-8, 4.4e-8]
    kappa_a: [7.3e-26, 7.3e-26]
    d: [4.5e-9, 4.5e-9]
    t: [0.0, 3.5e-8]
  tolerance: 1.0e-4
  provenance: proposed
  reason: >
