- id: rel_claessens2006_bundle_3d_same_as_eqa8
  kind: same_as
  a: claessens2006/bundle_3d_bending
  b: bathe2008/wlb_mode_sum_deflection_eqa8
  mapping:
    kappa_f: "kappa_a"
    N: "n"
    alpha: "k_par * L_B**2 / (delta * k_a)"
    chi2: "k_a * d * (d + t) / (12 * kappa_a)"
  output_map:
    kappa_B: kappa_B
  regime:
    n: [2.0, 40.0]
    L_B: [1.0e-5, 8.0e-5]
    k_par: [1.0e-7, 1.0e-4]
    delta: [3.3e-8, 2.0e-6]
    k_a: [4.4e-8, 4.4e-8]
    kappa_a: [7.3e-26, 7.3e-26]
    d: [4.5e-9, 4.5e-9]
    t: [0.0, 3.5e-8]
  tolerance: 1.0e-5
  provenance: proposed
  reason: >
    Exact real-space vs. Fourier-space mathematical equivalence of the pinned three-point-bending
    discrete fiber-bundle model introduced by the same authors in claessens2006 (Methods p. 12,
    citing Tolomeo & Holley 1997 ref-25 and "MB, EF in preparation 2006" ref-bathe-inprep) and
    reformulated in Fourier mode space in bathe2008 (Appendix Eqs. A6-A9, p. 8; citing
    claessens2006 as ref-29 on p. 5 col 2: "bundle-bending stiffness was analyzed using an existing
    analytical theory that depends in a complex manner on the numerous bundle parameters (25, 29)").
    Because claessens2006's printed K = S_2/N = (n + sqrt(n))/12 gives 12*K = N + sqrt(N), partial-
    fraction expansion of bathe2008's odd-mode pinned three-point-bending series
    sum_{j odd} 2 / ((j*pi/L)^4 * kappa_B(q_j)) sums analytically to claessens2006's exact
    hyperbolic-tangent compliance bracket w_B,max (matching to <= 8e-7 across the full physical
    regime, limited solely by n_modes = 200 truncation).
  assumptions:
    - "Maps claessens2006's Tolomeo-Holley geometric factor d*(d+t) into chi^2 = k_a*d*(d+t)/(12*kappa_a); note bathe2008 Eq. (A6) uses parallel-axis (d_f+t)^2, which agrees identically at t = 0 and differs by (d+t)/d for t > 0."
    - "Uses claessens2006's printed K = S_2/N = (n + sqrt(n))/12 (omitting 1/N in variant bundle_3d_bending_K_no_divN rescales alpha by 2/(sqrt(n) - 1))."
    - "Default pinned three-point bending boundary condition (bc = pinned, n_modes = 200) in wlb_mode_sum_deflection_eqa8."

- id: rel_claessens2006_bundle_3d_approx_by_eq2
  kind: approximated_by
  a: claessens2006/bundle_3d_bending
  b: bathe2008/wlb_bending_stiffness_eq2
  mapping:
    kappa_f: "kappa_a"
    N: "n"
    alpha: "k_par * L_B**2 / (delta * k_a)"
    chi2: "k_a * d * (d + t) / (12 * kappa_a)"
    c: "1"
  output_map:
    kappa_B: kappa_B
  regime:
    n: [2.0, 40.0]
    L_B: [1.0e-5, 8.0e-5]
    k_par: [1.0e-7, 1.0e-4]
    delta: [3.3e-8, 2.0e-6]
    k_a: [4.4e-8, 4.4e-8]
    kappa_a: [7.3e-26, 7.3e-26]
    d: [4.5e-9, 4.5e-9]
    t: [0.0, 3.5e-8]
  tolerance: 0.12
  provenance: proposed
  reason: >
    Bathe et al. (2008, p. 5 col 1 & Appendix p. 8) replace the exact pinned three-point-bending
    deflection solution (analytically identical to claessens2006/bundle_3d_bending) with the
    closed-form single-mode WLB formula Eq. (2) / Eq. (A6) using constant pinned mode factor
    c = 1 ("In three-point bending at zero temperature, the analytical solution for the bundle-
    bending stiffness is well approximated by Eq. 2 with a constant factor c = 1 for pinned ends").
    Across the full claessens2006 experimental regime (n in [2, 40], t in [0, 35 nm], L_B in
    [10, 80 um], k_par in [1e-7, 1e-4 N/m], delta in [33 nm, 2 um]), Eq. (2) at c = 1 approximates
    claessens2006/bundle_3d_bending to within ~10.8% (matching the ~10.4% error of Eq. 2 vs
    Eq. A8 inside bathe2008; using c = 5/6 tightens the worst-case error to ~9.5%).
  assumptions:
    - "Pinned three-point-bending constant mode factor c = 1 (bathe2008 p. 5 col 1 & p. 8)."
    - "Maps claessens2006's Tolomeo-Holley geometric factor d*(d+t) into chi^2 = k_a*d*(d+t)/(12*kappa_a) (agrees with bathe2008 parallel-axis (d_f+t)^2 at t = 0)."
    - "Uses claessens2006's printed K = S_2/N = (n + sqrt(n))/12."

- id: rel_claessens2006_bundle_3d_approx_by_fig4
  kind: approximated_by
  a: claessens2006/bundle_3d_bending
  b: bathe2008/wlb_bending_stiffness_fig4
  mapping:
    kappa_f: "kappa_a"
    N: "n"
    k_x: "k_par"
    E_f_A_f: "k_a"
    L2_over_delta: "L_B**2 / delta"
    chi2: "k_a * d * (d + t) / (12 * kappa_a)"
    c: "1"
  regime:
    n: [2.0, 40.0]
    L_B: [1.0e-5, 8.0e-5]
    k_par: [1.0e-7, 1.0e-4]
    delta: [3.3e-8, 2.0e-6]
    k_a: [4.4e-8, 4.4e-8]
    kappa_a: [7.3e-26, 7.3e-26]
    d: [4.5e-9, 4.5e-9]
    t: [0.0, 3.5e-8]
  tolerance: 0.12
  provenance: proposed
  reason: >
    Bathe et al. (2008, Fig. 4 p. 6) evaluate Eq. (2) directly as a function of L^2/delta and
    k_x/(E_f*A_f) in wlb_bending_stiffness_fig4. With pinned mode factor c = 1 (rather than
    Fig. 4's periodic-ring value c = 5) and chi^2 = k_a*d*(d+t)/(12*kappa_a), wlb_bending_stiffness_fig4
    approximates claessens2006/bundle_3d_bending to within ~10.8% across the full physical regime.
    Note that evaluating Fig. 4 at periodic-ring c = 5 makes the intermediate shear-dominated regime
    ~5-6x softer than claessens2006's pinned three-point-bending formula at identical alpha.
  assumptions:
    - "Pinned three-point-bending mode factor c = 1 (vs c = 5 used for periodic rings in bathe2008 Fig. 4)."
    - "Tolomeo-Holley geometric factor d*(d+t) mapped into chi^2; printed K = S_2/N = (n + sqrt(n))/12."

- id: rel_alpha_ea_same_as_claessens_alpha
  kind: same_as
  a: bathe2008/coupling_parameter_ea
  b: claessens2006/bending_regime_alpha
  mapping:
    k_par: "k_x"
    L_B: "L"
    delta: "delta"
    k_a: "E_f_A_f"
  regime:
    k_x: [1.0e-7, 1.0e-4]
    E_f_A_f: [1.0e-8, 5.0e-7]
    L: [1.0e-6, 1.0e-4]
    delta: [3.3e-8, 2.0e-6]
  provenance: proposed
  reason: >
    Both companion papers define the identical dimensionless bundle-bending coupling parameter
    alpha = k_x * L^2 / (E_f * A_f * delta) = k_par * L_B^2 / (delta * k_a) separating decoupled
    (alpha << 1), shear-dominated (1 << alpha << N), and fully coupled (alpha >> N) regimes
    (claessens2006 p. 6 & Fig. 1 caption p. 16: "dimensionless quantity, alpha === k_|| L_B^2 /
    delta k_a"; bathe2008 p. 5 col 2 & Appendix p. 8: "alpha := (k_x / E_f A_f)(L^2 / delta)",
    with fiber extensional rigidity k_a = E_f * A_f = 4.4e-8 N from Kojima et al. 1994).
  assumptions:
    - "Identical physical quantities: k_par = k_x, L_B = L, k_a = E_f * A_f, and axial cross-link spacing delta."

- id: rel_alpha_eq1_same_as_claessens_alpha
  kind: same_as
  a: bathe2008/coupling_parameter_eq1
  b: claessens2006/bending_regime_alpha
  mapping:
    k_par: "k_x"
    L_B: "L"
    delta: "delta"
    k_a: "k_f * delta"
  regime:
    k_x: [1.0e-7, 1.0e-4]
    L: [1.0e-6, 1.0e-4]
    k_f: [0.05, 5.0]
    delta: [3.3e-8, 2.0e-6]
  provenance: proposed
  reason: >
    Substituting bathe2008's discrete fiber-segment stretching stiffness definition
    k_f := E_f * A_f / delta (p. 2 col 1) into Eq. (1) (p. 3 col 1: alpha := k_x * L^2 / (k_f * delta^2))
    recovers claessens2006/bending_regime_alpha (p. 6: alpha === k_par * L_B^2 / (delta * k_a))
    symbolically identically with k_a = E_f * A_f = k_f * delta.
  assumptions:
    - "Discrete fiber stretching stiffness definition k_f = E_f * A_f / delta = k_a / delta (bathe2008 p. 2 col 1)."

- id: rel_langmuir_spacing_same_as_claessens_abp_eq
  kind: same_as
  a: bathe2008/langmuir_crosslink_spacing
  b: claessens2006/abp_chemical_equilibrium
  mapping:
    c_ABP: "c_fascin"
    K_d: "K_d"
    delta_max: "delta_min"
  output_map:
    delta: delta
  regime:
    delta_min: [30.0, 45.0]
    K_d: [0.3, 1.0]
    c_fascin: [0.01, 10.0]
  provenance: proposed
  reason: >
    Both papers calculate the mean axial cross-link spacing from an identical non-depleted
    Langmuir equilibrium binding isotherm: bathe2008 p. 5 col 2 cites claessens2006 (ref-29)
    for "equilibrium binding considerations (29)" and Fig. 4 caption (p. 6) writes
    delta = delta_min * (K_d + c_fascin) / c_fascin, which is algebraically identical to
    claessens2006 Methods p. 12: delta = delta_max / theta with theta = c_ABP / (K_d + c_ABP)
    (where claessens2006 labels the minimum saturated hexagonal spacing delta_max = 33 nm vs
    bathe2008's delta_min = 37.5 nm, and uses K_d = 0.7 uM vs bathe2008's 0.5 uM for fascin).
  assumptions:
    - "Non-depleted 1:1 Langmuir binding isotherm; claessens2006 symbol delta_max denotes the minimum saturated axial spacing (same physical quantity as bathe2008's delta_min)."

- id: rel_interlayer_shear_same_as_claessens_keff
  kind: same_as
  a: bathe2008/interlayer_shear_modulus_from_kx
  b: claessens2006/effective_shear_stiffness
  mapping:
    k_par: "k_x"
    delta: "delta"
  regime:
    k_x: [1.0e-7, 1.0e-4]
    delta: [3.3e-8, 2.0e-6]
  provenance: proposed
  reason: >
    Both papers define the effective interlayer shear coupling modulus per unit axial length as
    k_x / delta [Pa] (bathe2008 p. 5 col 1-2: "concentration-dependent effective interlayer shear
    modulus, k_x / delta", identified with macroscopic Timoshenko G_B) and k_par / delta [N/m^2]
    (claessens2006 pp. 5-7: "overall effective shear stiffness coupling neighboring filaments,
    k_|| / delta"). Since 1 Pa = 1 N/m^2, the two definitions are symbolically identical.
  assumptions:
    - "1 Pa = 1 N/m^2; k_par = k_x and identical axial cross-link spacing delta."

- id: rel_kx_from_shear_same_as_claessens_shear_inv
  kind: same_as
  a: bathe2008/kx_from_shear_modulus
  b: claessens2006/shear_stiffness_from_effective
  mapping:
    k_eff: "G_shear"
    delta: "delta"
  regime:
    G_shear: [10.0, 2000.0]
    delta: [3.3e-8, 2.0e-6]
  provenance: proposed
  reason: >
    Both papers invert the effective interlayer shear modulus to extract single-cross-linker shear
    stiffness via k_x = (k_x / delta) * delta (bathe2008 p. 5 col 2 for fascin; claessens2006 p. 7
    for PEG depletion lower bound k_par >= 10^-4 N/m from k_par/delta >= 10^3 N/m^2 and delta = 10^-7 m).
  assumptions:
    - "1 Pa = 1 N/m^2; inverse of rel_interlayer_shear_same_as_claessens_keff."

- id: rel_decoupled_same_as_claessens_decoupled
  kind: same_as
  a: bathe2008/wlb_decoupled_limit
  b: claessens2006/bundle_stiffness_decoupled
  mapping:
    n: "N"
    kappa_a: "kappa_f"
  output_map:
    kappa_B: kappa_B
  regime:
    kappa_f: [1.0e-26, 1.0e-25]
    N: [2.0, 100.0]
  provenance: proposed
  reason: >
    Both papers state the identical decoupled bundle-bending stiffness limit kappa_B = N * kappa_f
    = n * kappa_a for alpha << 1 (bathe2008 p. 5 col 1 & Fig. 3A; claessens2006 p. 6 & Fig. 3
    caption p. 16: "Dashed lines indicate decoupled (alpha << 1; kappa_B = n * kappa_a)").
  assumptions:
    - "Decoupled bending regime alpha << 1 (freely slipping filaments)."

- id: rel_fully_coupled_derived_to_claessens_coupled
  kind: derived_from
  a: bathe2008/wlb_fully_coupled_limit
  b: claessens2006/bundle_stiffness_coupled
  mapping:
    n: "N"
    kappa_a: "kappa_f"
  output_map:
    kappa_B: kappa_B
  steps:
    - "subs: chi2 = 1"
    - "simplify"
  regime:
    kappa_f: [1.0e-26, 1.0e-25]
    N: [2.0, 100.0]
    chi2: [1.0, 5.0]
  provenance: proposed
  reason: >
    Bathe et al.'s finite-thickness fully coupled limit kappa_B = kappa_f * N * (1 + chi^2 * (N - 1))
    (p. 5 col 1 & Eq. A6 p. 8) reduces symbolically to claessens2006's zero-spacing fully coupled
    asymptote kappa_B = n^2 * kappa_a (Fig. 3 caption p. 16: "fully coupled (alpha >> n;
    kappa_B = n^2 * kappa_a) bundle bending regimes assuming zero inter-filament spacing (t = 0)")
    upon substituting chi^2 = 1 (square cross-section fibers at t = 0).
  assumptions:
    - "Zero inter-filament spacing t = 0 with square-beam fiber geometry I_f = A_f * d_f^2 / 12 giving chi^2 = 1."

- id: rel_eq2_reduces_to_claessens_decoupled
  kind: reduces_to
  a: bathe2008/wlb_bending_stiffness_eq2
  b: claessens2006/bundle_stiffness_decoupled
  mapping:
    n: "N"
    kappa_a: "kappa_f"
  output_map:
    kappa_B: kappa_B
  limit:
    alpha: "0"
  regime:
    kappa_f: [1.0e-26, 1.0e-25]
    N: [2.0, 40.0]
    alpha: [0.01, 1.0]
    chi2: [1.0, 10.0]
    c: [0.5, 5.0]
  provenance: proposed
  reason: >
    In the weak shear-coupling limit alpha -> 0 (alpha << 1), bathe2008's closed-form WLB stiffness
    Eq. (2) reduces identically to claessens2006's decoupled asymptote kappa_B = n * kappa_a
    (bathe2008 p. 5 col 1; claessens2006 Fig. 3 caption p. 16).
  assumptions:
    - "Weak inter-filament shear coupling alpha -> 0 (e.g., plastin/fimbrin bundles in claessens2006 Fig. 3A)."

- id: rel_eq2_reduces_to_claessens_coupled
  kind: reduces_to
  a: bathe2008/wlb_bending_stiffness_eq2
  b: claessens2006/bundle_stiffness_coupled
  mapping:
    n: "N"
    kappa_a: "kappa_f"
  output_map:
    kappa_B: kappa_B
  limit:
    alpha: "oo"
  regime:
    kappa_f: [1.0e-26, 1.0e-25]
    N: [2.0, 40.0]
    alpha: [1.0, 100.0]
    chi2: [1.0, 1.0]
    c: [0.5, 5.0]
  provenance: proposed
  reason: >
    In the rigid-crosslink limit alpha -> oo (alpha >> N) at tight filament packing chi^2 = 1
    (t = 0), bathe2008's closed-form WLB stiffness Eq. (2) reduces identically to claessens2006's
    fully coupled asymptote kappa_B = n^2 * kappa_a (bathe2008 p. 5 col 1; claessens2006 Fig. 3
    caption p. 16).
  assumptions:
    - "Strong shear coupling alpha -> oo and zero inter-filament spacing chi^2 = 1 (t = 0, e.g., PEG bundles in claessens2006 Fig. 3D)."

- id: rel_eqa10_reduces_to_claessens_decoupled
  kind: reduces_to
  a: bathe2008/wlb_ring_fluctuation_eqa10
  b: claessens2006/bundle_stiffness_decoupled
  mapping:
    n: "N"
    kappa_a: "kappa_f"
  output_map:
    kappa_B: kappa_B
  limit:
    alpha: "0"
  regime:
    kappa_f: [1.0e-26, 1.0e-25]
    N: [2.0, 40.0]
    alpha: [0.01, 1.0]
    chi2: [1.0, 10.0]
  provenance: proposed
  reason: >
    In the weak-coupling limit alpha -> 0, bathe2008's exact 200-mode periodic-ring thermal-
    fluctuation bending stiffness Eq. (A10) (derived specifically for claessens2006's emulsion-
    droplet rings on p. 8) reduces to claessens2006's decoupled limit kappa_B = n * kappa_a
    (within ~4e-8 mode-truncation residual at n_modes = 200).
  assumptions:
    - "Periodic ring modes q_j = 2*pi*j/L (n_modes = 200) in the decoupled limit alpha -> 0."

- id: rel_eqa10_reduces_to_claessens_coupled
  kind: reduces_to
  a: bathe2008/wlb_ring_fluctuation_eqa10
  b: claessens2006/bundle_stiffness_coupled
  mapping:
    n: "N"
    kappa_a: "kappa_f"
  output_map:
    kappa_B: kappa_B
  limit:
    alpha: "oo"
  regime:
    kappa_f: [1.0e-26, 1.0e-25]
    N: [2.0, 40.0]
    alpha: [1.0, 100.0]
    chi2: [1.0, 1.0]
  provenance: proposed
  reason: >
    In the strong-coupling limit alpha -> oo at tight packing chi^2 = 1 (t = 0), bathe2008's
    periodic-ring thermal-fluctuation bending stiffness Eq. (A10) (p. 8) reduces to claessens2006's
    fully coupled asymptote kappa_B = n^2 * kappa_a (Fig. 3 caption p. 16).
  assumptions:
    - "Periodic ring modes q_j = 2*pi*j/L (n_modes = 200), strong shear coupling alpha -> oo, and chi^2 = 1 (t = 0)."

- id: rel_claessens2006_bundle_3d_reduces_to_decoupled
  kind: reduces_to
  a: claessens2006/bundle_3d_bending
  b: bathe2008/wlb_decoupled_limit
  mapping:
    kappa_f: "kappa_a"
    N: "n"
  output_map:
    kappa_B: kappa_B
  limit:
    k_par: "0"
    delta: "oo"
  regime:
    n: [2.0, 40.0]
    L_B: [1.0e-5, 8.0e-5]
    k_par: [1.0e-7, 1.0e-4]
    delta: [3.3e-8, 2.0e-6]
    k_a: [4.4e-8, 4.4e-8]
    kappa_a: [7.3e-26, 7.3e-26]
