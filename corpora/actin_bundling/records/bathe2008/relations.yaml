    alpha: [0.01, 1.0]
    chi2: [0.5, 10.0]
    c: [0.5, 10.0]
  limit:
    alpha: "0"
  provenance: proposed
  reason: >
    In VASPDroplet_simulate.ipynb cell 3 (line 73: '# Bathe et al Nonlinear', nonlinearbool = False)
    and cell 7 (lines 170-204, getkbend), the live notebook adapter graham_code/notebook_bundle_kbend
    runs with default nonlinearbool = False (matching all published graham2023 simulations) and
    computes k_flex_bundle = k_bend * lcyl = kflex_fil * Nfil. In the weak-coupling limit alpha -> 0,
    Bathe et al. Eq. (2) reduces identically to this live software implementation. (Note: the
    inactive nonlinearbool = True branch in getkbend diverges from Bathe Eq. 2 and Eq. A10 by up to
