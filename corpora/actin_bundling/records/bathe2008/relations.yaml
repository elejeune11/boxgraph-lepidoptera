  assumptions:
    - "Vanishing effective shear coupling k_par / delta -> 0 (k_par -> 0, delta -> oo); K = S_2 diverges from bathe2008 Eq. (2) / Eq. (A8) only at intermediate alpha via effective rescaling alpha_eff = 2*alpha / (sqrt(n) - 1)."

- id: rel_claessens2006_bundle_3d_KnoN_reduces_to_fully_coupled
  kind: reduces_to
  a: claessens2006/bundle_3d_bending_K_no_divN
  b: bathe2008/wlb_fully_coupled_limit
  mapping:
    kappa_f: "kappa_a"
    N: "n"
    chi2: "k_a * d * (d + t) / (12 * kappa_a)"
  output_map:
    kappa_B: kappa_B
  limit:
    k_par: "oo"
  regime:
    n: [2.0, 40.0]
    L_B: [1.0e-5, 8.0e-5]
    k_par: [1.0e-5, 1.0e-3]
    delta: [3.3e-8, 2.0e-6]
    k_a: [4.4e-8, 4.4e-8]
    kappa_a: [7.3e-26, 7.3e-26]
    d: [4.5e-9, 4.5e-9]
    t: [0.0, 3.5e-8]
  tolerance: 1.0e-4
  provenance: proposed
  reason: >
    In the rigid-crosslink limit k_par -> oo, claessens2006's K = S_2 variant reduces identically
