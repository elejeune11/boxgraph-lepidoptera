# ==========================================================================
# Cross-record ModelAtlas relations (Wave 6: graham2023, graham_code,
# claessens2008, grason2007).
# Authored strictly inside bathe2008/relations.yaml under Wave 6 isolation;
# relations stated by partner records use provenance: proposed with verbatim
# partner citations in `reason`.
#
# Zero-relation audits:
# - bathe2008 + grason2007 (0/1085 model pairs): bathe2008 cites grason2007
#   once (ref-35, p. 2 col 2) solely to justify neglecting twist in linear
#   bending (l_p >> L). The two frameworks are physically orthogonal (achiral
#   bending stiffness kappa_B at exogenous N vs chiral torsional equilibrium
#   radius R_0). The coarse shape match fiber_stretching_stiffness_def vs
#   chiral_torque_coupling is a coincidental [force]/[length] ratio (see
#   q_grason2007_citation_and_orthogonal_mechanics).
# - bathe2008 + claessens2008 (0/868 runnable model pairs): claessens2008
#   cites bathe2008 once conceptually (ref-3, p. 1 col 1) and models bundle
#   thickness, hexagonal SAXS packing, helical overtwist, and droplet mass
#   conservation rather than bending stiffness. While bathe2008/
#   langmuir_crosslink_spacing (delta = delta_min*(K_d + c)/c ~ 1/theta [nm])
#   is the exact reciprocal of the dilute-actin c_a -> 0 limit of
#   claessens2008/effective_bound_ratio (R* -> theta = c/(K_d + c)
#   [dimensionless]), the opposite-signed log-slopes and distinct dimensions
#   preclude a direct relation without an unstated wrapper model (see
#   q_claessens2008_kd_discrepancy_and_structural_comparison).
# ==========================================================================

# --- bathe2008 + graham2023 (graham2023 cites Bathe 2008 as ref-si-11) ---

- id: rel_graham2023_bathe_eqS1_same_as_eq2
  kind: same_as
  a: graham2023/bundle_bending_rigidity_bathe_eqS1
  b: bathe2008/wlb_bending_stiffness_eq2
  mapping:
    kappa_f: "k_b_fil / 10**30"
    N: "N"
    alpha: "alpha"
    chi2: "chi**2"
    c: "c_qj"
  output_map:
    kappa_B: k_b
  regime:
    k_b_fil: [10000.0, 200000.0]
    N: [2.0, 100.0]
    chi: [0.5, 5.0]
    c_qj: [0.5, 10.0]
    alpha: [0.01, 1000.0]
  provenance: proposed
  reason: >
    Graham et al. (2023, SI Note 1, PDF p. 39 / SI-12, citing Bathe et al. 2008 as ref-si-11:
    "Bathe et al. showed that the bending stiffness (k_b) depends on the bending stiffness of
    individual actin filaments ... The expression is given by ... (S1)") directly transcribe
    Bathe et al. (2008) Eq. (2) / Eq. (A6). Substituting kappa_f = k_b_fil / 10^30 (pN*nm^2 ->
    N*m^2), chi2 = chi^2, and c = c_qj makes graham2023/bundle_bending_rigidity_bathe_eqS1
    symbolically identical to bathe2008/wlb_bending_stiffness_eq2. (Recorded with provenance:
    proposed inside bathe2008/relations.yaml under Wave 6 partner-isolation rules.)
  assumptions:
    - "Unit conversion 1 pN*nm^2 = 10^-30 N*m^2; graham2023 parameterizes cross-link geometry by chi rather than chi^2."

- id: rel_eq2_reduces_to_graham2023_linear
  kind: reduces_to
  a: bathe2008/wlb_bending_stiffness_eq2
  b: graham2023/bundle_bending_rigidity_linear
  mapping:
    K_b_fil: "10**30 * kappa_f"
    N_fil: "N"
  output_map:
    K_b_ring: kappa_B
  regime:
    kappa_f: [1.0e-26, 1.0e-25]
    N: [2.0, 100.0]
    alpha: [0.01, 1.0]
    chi2: [0.5, 10.0]
    c: [0.5, 10.0]
  limit:
    alpha: "0"
  provenance: proposed
  reason: >
    Graham et al. (2023, SI Note 1, p. 39 / SI-12, citing ref-si-11; SI Section 2.6, p. 41 / SI-14)
    state: "As VASP-crosslinked actin networks produce weaker elastic responses than fascin and
    alpha-actinin [12], we assume that the inter-filament coupling parameter is really weak. Hence,
    we assume that the contribution of nonlinear term in the above expression is low and hence
    consider the bending stiffness to scale linearly with number of filaments." In the weak-coupling
    limit alpha -> 0, Bathe et al. Eq. (2) reduces exactly to Graham et al.'s linear ring stiffness
    K_b_ring = K_b_fil * N_fil.
  assumptions:
    - "Weak inter-filament shear coupling limit alpha -> 0 (alpha << 1) for fluid VASP bundles; 1 N*m^2 = 10^30 pN*nm^2."

- id: rel_graham2023_bathe_eqS1_reduces_to_fully_coupled
  kind: reduces_to
  a: graham2023/bundle_bending_rigidity_bathe_eqS1
  b: bathe2008/wlb_fully_coupled_limit
  mapping:
    kappa_f: "k_b_fil / 10**30"
    N: "N"
    chi2: "chi**2"
  output_map:
    kappa_B: k_b
  regime:
    k_b_fil: [10000.0, 200000.0]
    N: [2.0, 100.0]
    chi: [0.5, 5.0]
    c_qj: [0.5, 10.0]
    alpha: [1.0, 100.0]
  limit:
    alpha: "oo"
  provenance: proposed
  reason: >
    In the strong inter-filament shear-coupling limit alpha -> oo (alpha >> N), Graham et al.'s
    transcription of the WLB bending stiffness (SI Eq. S1, p. 39, citing Bathe 2008 ref-si-11)
    reduces identically to Bathe et al.'s fully coupled bending stiffness limit
    kappa_B = kappa_f * N * (1 + chi^2 * (N - 1)) (p. 5 col 1).
  assumptions:
    - "Strong inter-filament shear coupling limit alpha -> oo; unit conversion 1 pN*nm^2 = 10^-30 N*m^2."

- id: rel_eqa10_reduces_to_graham2023_linear
  kind: reduces_to
  a: bathe2008/wlb_ring_fluctuation_eqa10
  b: graham2023/bundle_bending_rigidity_linear
  mapping:
    K_b_fil: "10**30 * kappa_f"
    N_fil: "N"
  output_map:
    K_b_ring: kappa_B
  regime:
    kappa_f: [1.0e-26, 1.0e-25]
    N: [2.0, 50.0]
    alpha: [0.01, 1.0]
    chi2: [0.5, 5.0]
  limit:
    alpha: "0"
  provenance: proposed
  reason: >
    Both Bathe et al. Appendix Eq. (A10) (p. 8) and Graham et al. SI Section 2.6 (p. 41) treat
    circular/periodic actin bundle rings confined inside droplets. In the weak-coupling limit
    alpha -> 0, Bathe's exact 200-mode periodic ring thermal-fluctuation harmonic sum Eq. (A10)
    reduces to Graham's linear ring bending stiffness K_b_ring = K_b_fil * N_fil (within ~4e-8
    mode-truncation residual at n_modes = 200).
  assumptions:
    - "Weak inter-filament shear coupling limit alpha -> 0 for periodic ring modes q_j = 2*pi*j/L (n_modes = 200)."

- id: rel_eqa10_approximated_by_graham2023_bathe_eqS1
  kind: approximated_by
  a: bathe2008/wlb_ring_fluctuation_eqa10
  b: graham2023/bundle_bending_rigidity_bathe_eqS1
  mapping:
    k_b_fil: "10**30 * kappa_f"
    N: "N"
    chi: "sqrt(chi2)"
    c_qj: "5"
    alpha: "alpha"
  output_map:
    k_b: kappa_B
  regime:
    kappa_f: [7.0e-26, 7.0e-26]
    N: [4.0, 100.0]
    alpha: [0.01, 1000.0]
    chi2: [1.0, 1.0]
  tolerance: 0.20
  provenance: proposed
  reason: >
    Evaluates the approximation accuracy of Graham et al.'s single-mode WLB formula (SI Eq. S1,
    p. 39, ref-si-11) evaluated with Bathe's periodic-ring effective mode factor c(q_j) = 5
    against Bathe et al.'s exact 200-mode periodic-ring thermal-fluctuation sum Eq. (A10) (p. 8),
    matching within ~16.5% across N in [4, 100] and alpha in [0.01, 1000].
  assumptions:
    - "Periodic ring mode factor c(q_j) = 5 (Bathe Appendix Eq. A10, p. 8); small cross-link limit chi^2 = 1."

- id: rel_decoupled_same_as_graham2023_linear
  kind: same_as
  a: bathe2008/wlb_decoupled_limit
  b: graham2023/bundle_bending_rigidity_linear
  mapping:
    K_b_fil: "10**30 * kappa_f"
    N_fil: "N"
  output_map:
    K_b_ring: kappa_B
  regime:
    kappa_f: [1.0e-26, 1.0e-25]
    N: [1.0, 100.0]
  provenance: proposed
  reason: >
    Bathe et al.'s decoupled bundle bending stiffness limit kappa_B = N * kappa_f (p. 5 col 1)
    is symbolically identical to Graham et al.'s weak-coupling linear bundled-actin ring rigidity
    K_b_ring = K_b_fil * N_fil (SI Section 2.6, p. 41 / SI-14; derived from Bathe SI Eq. S1 in
    SI Note 1, p. 39), differing only by unit scale (N*m^2 vs pN*nm^2).
  assumptions:
    - "Unit conversion 1 N*m^2 = 10^30 pN*nm^2; decoupled limit alpha << 1."

