    q_graham_code_nonlinear_bathe_10mode_sum_bug.)
  assumptions:
    - "Default setting nonlinearbool = False in graham_code/notebook_bundle_kbend (active in all graham2023 simulations)."
    - "Unit conversion 1 N*m^2 = 10^30 pN*nm^2; lcyl cancels in k_flex_bundle = kbend * lcyl."

