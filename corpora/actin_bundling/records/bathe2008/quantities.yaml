- id: filament_number
  name: bundle filament number
  dimension: dimensionless
  description: Total number of constituent filaments N = (2M)^2 in a 3D cytoskeletal bundle.

- id: half_layer_count
  name: half number of in-plane fiber layers
  dimension: dimensionless
  description: Parameter M = sqrt(N)/2 such that a planar bundle cross section has 2M fiber layers (p. 2, Appendix p. 8, SM p. 11).

- id: bundle_length
  name: bundle contour length
  dimension: "[length]"
  description: Overall contour length L of a cytoskeletal fiber bundle.

- id: filament_length
  name: constituent fiber contour length
  dimension: "[length]"
  description: Contour length L_f of an individual (intact or fractured daughter) constituent fiber.

- id: fiber_diameter
  name: constituent fiber diameter
  dimension: "[length]"
  description: Cross-sectional dimension (diameter) d_f of a single constituent fiber (printed with typo '[m^2]' on p. 2 col 1).

- id: crosslink_length
  name: effective cross-link length
  dimension: "[length]"
  description: Effective axial/transverse spacing thickness t contributed by a cross-linking protein between adjacent fiber surfaces.

- id: interaxial_spacing
  name: interaxial fiber spacing
  dimension: "[length]"
  description: Center-to-center distance (d_f + t) between nearest-neighbor fibers in the bundle.

- id: crosslink_spacing
  name: mean axial cross-link spacing
  dimension: "[length]"
  description: Mean axial distance delta between consecutive discrete cross-links along a pair of neighboring fibers.

- id: min_crosslink_spacing
  name: minimum axial cross-link spacing
  dimension: "[length]"
  description: Minimum coplanar axial distance delta_min between cross-links in a hexagonally ordered actin bundle.

- id: fiber_area
  name: fiber cross-sectional area
  dimension: "[length]**2"
  description: Effective cross-sectional area A_f of a single fiber.

- id: fiber_moment_of_inertia
  name: fiber area moment of inertia
  dimension: "[length]**4"
  description: Effective cross-sectional area moment of inertia I_f of a single fiber with respect to its neutral axis.

- id: fiber_youngs_modulus
  name: fiber Young's modulus
  dimension: "[force] / [length]**2"
  description: Effective Young's modulus E_f of a single fiber.

- id: fiber_extensional_rigidity
  name: fiber extensional rigidity
  dimension: "[force]"
  description: Axial stretching rigidity E_f * A_f of a single constituent fiber.

- id: fiber_stretching_stiffness
  name: discrete fiber stretching stiffness
  dimension: "[force] / [length]"
  description: Stretching stiffness k_f := E_f * A_f / delta of a fiber segment between adjacent cross-links (p. 2).

- id: fiber_bending_stiffness
  name: single-fiber bending stiffness
  dimension: "[force] * [length]**2"
  description: Isotropic transverse bending stiffness kappa_f := E_f * I_f of a single constituent fiber.

- id: crosslink_shear_stiffness
  name: cross-link shear stiffness
  dimension: "[force] / [length]"
  description: Effective shear spring stiffness k_x of an individual cross-link.

- id: crosslink_extensional_stiffness
  name: cross-link extensional stiffness
  dimension: "[force] / [length]"
  description: Transverse extensional stiffness k_perp of an individual cross-link opposing peristaltic fiber separation.

- id: interlayer_shear_modulus
  name: effective interlayer shear modulus
  dimension: "[force] / [length]**2"
  description: Effective interlayer shear modulus k_x / delta (identified with macroscopic Timoshenko shear modulus G_B on p. 5).

- id: bundle_bending_stiffness
  name: 3D bundle bending stiffness
  dimension: "[force] * [length]**2"
  description: Effective three-dimensional bundle bending stiffness kappa_B = 2M * kappa_{B(2D)}.

- id: normalized_bending_stiffness
  name: normalized bundle bending stiffness
  dimension: dimensionless
  description: Dimensionless bundle bending stiffness kappa_B* := kappa_B / kappa_f.

- id: arbitrary_bundle_bending_stiffness
  name: unnormalized simulation bundle bending stiffness
  dimension: dimensionless
  description: Bundle bending stiffness kappa_B plotted without physical units in Supplementary Material Fig. S1 (p. 11).

- id: arbitrary_fiber_bending_stiffness
  name: unnormalized simulation single-fiber bending stiffness
  dimension: dimensionless
  description: Effective single-fiber bending stiffness kappa_{f,sim} in the arbitrary simulation units of Fig. S1 (p. 11).

- id: fiber_coupling_parameter
  name: fiber coupling parameter
  dimension: dimensionless
  description: Dimensionless ratio alpha := k_x * L^2 / (k_f * delta^2) = k_x * L^2 / (E_f * A_f * delta) (Eq. 1) measuring cross-link shear vs fiber stretching.

- id: crossover_coupling_parameter
  name: crossover coupling parameter
  dimension: dimensionless
  description: Value alpha* (labeled alpha** in Fig. 3B inset) at which kappa_B lies within a factor of 2 of its decoupled or fully coupled limit.

- id: renormalized_coupling_parameter
  name: fracture-renormalized coupling parameter
  dimension: dimensionless
  description: Renormalized coupling parameter alpha' := alpha * (phi* / phi)^2 in the high-fracture-density regime (p. 5, SM p. 11).

- id: crosslink_geometry_factor
  name: cross-link finite-thickness factor
  dimension: dimensionless
  description: Dimensionless geometric factor chi^2 := A_f * (d_f + t)^2 / (12 * I_f) accounting for finite cross-link length t (Eq. 2, Eq. A6).

- id: mode_factor
  name: bending mode factor
  dimension: dimensionless
  description: Nondimensional mode or boundary-condition factor c(q_j) = (q_j * L)^2 / 12 (with effective values c = 1 pinned, c = 4 clamped, c = 5 periodic ring, and fitted c(phi, M) in Fig. S2).

- id: wavenumber
  name: bending mode wavenumber
  dimension: "1 / [length]"
  description: Fourier bending mode wavenumber q_j (e.g. j*pi/L for hinged ends, 2*j*pi/L for periodic ring).

- id: peristaltic_wavelength
  name: maximum peristaltic mode wavelength
  dimension: "[length]"
  description: Cutoff wavelength lambda_max := (kappa_f * delta / k_perp)^(1/4) for out-of-phase peristaltic fiber bending modes (p. 3).

- id: transverse_fluctuation
  name: transverse fiber fluctuation amplitude
  dimension: "[length]"
  description: Characteristic transverse peristaltic fluctuation amplitude r_perp between neighboring fibers (p. 3).

- id: mean_square_transverse_displacement
  name: mean-square transverse bundle displacement
  dimension: "[length]**2"
  description: Equilibrium mean-square transverse displacement r_perp^2 := (1/L) integral <r_perp^2(x)> dx of a ring bundle (Eq. A10).

- id: thermal_energy
  name: thermal energy
  dimension: "[energy]"
  description: Thermal energy scale k_B * T.

- id: crosslink_off_rate
  name: cross-link unbinding rate
  dimension: "1 / [time]"
  description: Spontaneous unbinding off-rate k_off of biological actin-binding cross-linkers (p. 2).

- id: concentration_ratio
  name: cross-linker to actin molar ratio
  dimension: dimensionless
  description: Molar concentration ratio r := c_fascin / c_actin (p. 5).

- id: crosslinker_concentration
  name: cross-linker molar concentration
  dimension: "[substance] / [length]**3"
  description: Bulk molar concentration c_fascin of the cross-linking protein fascin (Fig. 4).

- id: dissociation_constant
  name: cross-linker dissociation constant
  dimension: "[substance] / [length]**3"
  description: Equilibrium dissociation constant K_d of fascin binding to F-actin in the Langmuir isotherm (Fig. 4).

- id: length_sq_over_spacing
  name: squared bundle length per cross-link spacing
  dimension: "[length]"
  description: Combined geometric parameter L^2 / delta plotted on the horizontal axis of Fig. 4 (p. 6).

- id: fracture_density
  name: fiber fracture number density
  dimension: dimensionless
  description: Number of daughter segments per mother fiber phi := L / L_f (p. 5, SM p. 11).

- id: critical_fracture_density
  name: critical fiber fracture density
  dimension: dimensionless
  description: Critical fracture density phi* delineating unfractured (phi << phi*) and fractured (phi >> phi*) bending regimes (p. 5, SM p. 11).

- id: scaled_fracture_parameter
  name: squared normalized fracture density
  dimension: dimensionless
  description: Rescaled fracture coordinate (phi / phi*)^2 plotted on the horizontal axis of Fig. S2B (p. 11).

- id: critical_buckling_force
  name: Euler critical buckling load
  dimension: "[force]"
  description: Axial compressive critical buckling force F_crit ~ kappa_B / L^2 (p. 7).

- id: entropic_stretching_stiffness
  name: entropic stretching stiffness
  dimension: "[force] / [length]"
  description: Entropic longitudinal stretching stiffness k_e of a thermally fluctuating semiflexible bundle (p. 7).

- id: bundle_youngs_modulus
  name: effective homogeneous bundle Young's modulus
  dimension: "[force] / [length]**2"
  description: Effective macroscopic Young's modulus E_B in Timoshenko beam theory (p. 5).

- id: bundle_moment_of_inertia
  name: effective homogeneous bundle moment of inertia
  dimension: "[length]**4"
  description: Effective macroscopic area moment of inertia I_B in Timoshenko beam theory (p. 5).

- id: bundle_area
  name: effective homogeneous bundle cross-sectional area
  dimension: "[length]**2"
  description: Effective macroscopic cross-sectional area A_B in Timoshenko beam theory (p. 5).

- id: shear_correction_factor
  name: Timoshenko shear correction factor
  dimension: dimensionless
  description: Cross-section dependent Timoshenko shear correction factor beta (p. 5).

- id: midpoint_force
  name: three-point bending midpoint load
  dimension: "[force]"
  description: Transverse point force P (or F_{L/2}) applied at the bundle midpoint x = L/2 (p. 3, Eq. A9).

- id: midpoint_deflection
  name: three-point bending midpoint deflection
  dimension: "[length]"
  description: Transverse deflection w_{L/2} (or r_perp(L/2)) at the bundle midpoint x = L/2 (p. 3, Eq. A9).

- id: bending_prefactor
  name: three-point bending boundary prefactor
  dimension: dimensionless
  description: Boundary-condition factor a (or beta in Eq. A9) equal to 48 for pinned ends and 192 for clamped ends.
