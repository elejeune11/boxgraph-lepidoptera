- id: kappa_f_fig4_added
  quantity: fiber_bending_stiffness
  unit: N*m^2
  printed: "4.0 x 10^-26"
  basis: >
    Fig. 4 caption does not state the single-filament bending stiffness kappa_f used to plot the
    Eq. (2) curves; the decoupled asymptote of all three curves (N = 21, 27, 33) at small L^2/delta
    gives kappa_B / N = 4.0 x 10^-26 N*m^2 (consistent with l_p ~ 10 um, whereas p. 3 prints
    kappa_f ~= 7 x 10^-26 N*m^2).
  alternatives: ["7 x 10^-26", "4.1 x 10^-26"]
  stands_for: kappa_f in Fig. 4 theoretical curves

- id: kx_fig4_added
  quantity: crosslink_shear_stiffness
  unit: N/m
  printed: "7.3 x 10^-5"
  basis: >
    Fig. 4 caption does not state k_x used for the solid/dashed Eq. (2) curves; fitting Eq. (2)
    (c = 5, chi^2 = 1, E_f*A_f = 4.4 x 10^-8 N) to the solid N = 27 curve yields k_x = 7.3 x 10^-5 N/m,
    ~7x larger than the order-of-magnitude text estimate k_x ~= 10^-5 N/m on p. 5 col 2.
  alternatives: ["1.0 x 10^-5", "4.3 x 10^-5"]
  stands_for: k_x in Fig. 4 theoretical curves

- id: kx_fimbrin_added
  quantity: crosslink_shear_stiffness
  unit: N/m
  printed: "1.0 x 10^-6"
  basis: >
    The paper refers to Claessens et al. (29) for the apparent k_x of fimbrin used to construct
    Fig. 5 boxes (b) stereocilia and (c) microvilli, without printing its numerical value;
    k_x = 1.0 x 10^-6 N/m (10x lower than fascin) matches both Fig. 5(b) and Fig. 5(c) to <2%.
  alternatives: ["5 x 10^-7", "2 x 10^-6"]
  stands_for: apparent k_x of fimbrin in Fig. 5(b,c)

- id: kx_alpha_actinin_added
  quantity: crosslink_shear_stiffness
  unit: N/m
  printed: "3.0 x 10^-6"
  basis: >
    The paper refers to Claessens et al. (29) for the apparent k_x of alpha-actinin used in
    Fig. 5 box (d) stress fibers without printing its value; k_x ~ 2.5-3.6 x 10^-6 N/m spans
    the plotted alpha range [1.55 x 10^-3, 0.22] for L = 1-10 um.
  alternatives: ["2.5 x 10^-6", "3.6 x 10^-6"]
  stands_for: apparent k_x of alpha-actinin in Fig. 5(d)

- id: L_bristle_min_added
  quantity: bundle_length
  unit: um
  printed: "70"
  basis: >
    The text on p. 7 states L ~= 400 um for Drosophila macrochaete bristles (matching the upper
    bound alpha ~= 966 of Fig. 5 box f), but does not state the lower bundle length corresponding
    to the lower edge alpha ~= 29.8 of box (f); L = 70 um (typical microchaete length; Fig. 1D)
    gives alpha = 29.7 with fascin k_x = 10^-5 N/m.
  alternatives: ["50", "100"]
  stands_for: lower bundle length of Fig. 5 box (f)

- id: kappa_f_sim_figS1_added
  quantity: arbitrary_fiber_bending_stiffness
  unit: dimensionless
  printed: "1.345"
  basis: >
    SM Fig. S1 (p. 11) plots unnormalized 2D FE bundle stiffness kappa_B for M = 8 (2M = 16 fibers)
    without physical units; the decoupled asymptote kappa_B(alpha -> 0) ~= 21.52 implies
    kappa_{f,sim} = 21.52 / 16 = 1.345 in ADINA simulation units.
  alternatives: ["1.0", "1.333"]
  stands_for: unstated per-fiber bending stiffness unit in Fig. S1

