- id: d_f_actin_added
  quantity: fiber_diameter
  unit: nm
  printed: "4.37"
  basis: >
    The paper never prints a numerical value for F-actin diameter d_f despite using t = 10 nm in
    chi^2 = A_f*(d_f+t)^2/(12*I_f) on p. 5 col 2; inverting the Appendix relation
    kappa_f = E_f*A_f*d_f^2/12 (p. 8) with printed kappa_f = 7 x 10^-26 N*m^2 (p. 3) and
    E_f*A_f = 4.4 x 10^-8 N (p. 6) gives d_f = 4.37 nm.
  alternatives: ["7.0", "3.30"]
  stands_for: d_f in chi^2 = A_f*(d_f+t)^2/(12*I_f) for F-actin (p. 5 col 2)

