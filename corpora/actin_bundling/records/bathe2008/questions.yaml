    3.22x larger for fascin t = 10 nm and 8.78x larger for alpha-actinin t = 35 nm; equal at t = 0).
    In claessens2006's plotted Fig. 3 curves, omitting 1/N in K (bundle_3d_bending_K_no_divN,
    K = S_2) rescales alpha by 2/(sqrt(n) - 1) = 1/N_2D (shifting the intermediate crossover from
    alpha ~ n to alpha ~ n^(3/2)) while preserving both asymptotes. Switching from pinned 3-point
    bending (c ~= 5/6-1) to periodic-ring thermal fluctuations Eq. (A10) (c = 5) softens the
    intermediate regime by ~5-6x. Together with delta = 39 nm vs ~125 nm (at c_a = 0.5 uM) and
    order-of-magnitude rounding (4.3e-5 -> 1e-5, ~4e-6 -> 1e-6), these shifts account for the 15x
    gap between claessens2006's fitted k_par_fascin = 1.5e-5 N/m (t = 10 nm) and bathe2008's
    apparent k_x ~= 10^-6 N/m (t = 10 nm).
    (2) Direct parameter shifts on shared Langmuir isotherm: bathe2008 uses K_d = 0.5 uM (ref-83
