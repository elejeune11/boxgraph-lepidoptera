    (hinged straight-beam modes q_j = j*pi/L, Bathe Eq. A9 c_eff = 1), whereas periodic ring
    modes in Bathe Eq. (A10) have q_j = 2*pi*j/L, i.e., c(q_j) = j^2*pi^2/3 (4x larger,
