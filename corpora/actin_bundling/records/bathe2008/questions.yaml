    (alpha = 1), 5.59x (alpha = 100), 9.42x (alpha = 10^4, line 672's sample alpha), and 10.00x
    as alpha -> oo (4.042e10 vs 4.043e9 pN*nm^2 at alpha = 10^9) relative to Bathe Eq. (A10).
