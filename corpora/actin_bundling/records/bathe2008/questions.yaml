  text: >
    Cross-record ModelAtlas and validation audit between bathe2008 and claessens2008 (Claessens,
    Semmrich, Ramos & Bausch, PNAS 105:8819-8822, 2008; sharing coauthors Claessens and Bausch)
    yields 0 cited.yaml links, 0 direct ModelAtlas relations across all 31 x 28 = 868 runnable
    model pairs, and 0 cross-validations, while exposing one direct citation-value contradiction
    and four quantitative structural comparisons for fascin-actin bundles:
    (1) Direct K_d contradiction from the SAME primary reference: both papers cite Ono et al.
    (JBC 272:2527-2533, 1997; bathe2008/ref-83 [plus ref-84] Fig. 4 caption p. 6;
    claessens2008/ref-36 Methods p. 4) for the fascin-actin dissociation constant, yet bathe2008
    prints K_d = 0.5 uM whereas claessens2008 prints K_d = 0.3 uM (1.67x discrepancy).
    (2) Exact reciprocal relation between binding isotherms (no direct ModelAtlas link without an
    unstated wrapper): bathe2008/langmuir_crosslink_spacing computes mean axial spacing
    delta = delta_min*(K_d + c_fascin)/c_fascin = delta_min/theta [nm] from an undepleted
    Langmuir isotherm, whereas claessens2008/effective_bound_ratio computes bound fascin ratio
    R* = (1/2)*[(1 + R + K_d/c_a) - sqrt((1 + R + K_d/c_a)^2 - 4*R)] [dimensionless] accounting
    for free-fascin depletion. In the dilute-actin limit c_a -> 0 at fixed c_f = R*c_a,
