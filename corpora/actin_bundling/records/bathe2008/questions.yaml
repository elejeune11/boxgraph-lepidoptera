    mode kappa_B(q_j), and the macroscopic effective stiffness is a harmonic weighted average
    1/kappa_{B,eff} ~ sum_j 1/(q_j^4 * kappa_B(q_j)) (Eqs. A8, A10), never an arithmetic sum.
