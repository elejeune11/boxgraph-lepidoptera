- id: ref_fe_nel
  run: run_fe_refinement_point
  setting: n_el
  factors: [1, 2, 4]
  mode: multiply
  output: kappa_B_star
  tolerance: "2%"
  tolerance_basis: "added: below the ~2-4% reading precision of the log-log curves in Fig. 3"
  tolerance_added: true

- id: ref_eqa8_nmodes
  run: run_eqa8_refinement_point
  setting: n_modes
  factors: [1, 2, 4]
  mode: multiply
  output: kappa_B_star
  tolerance: "0.1%"
  tolerance_basis: "added: strict truncation tolerance for the 1/j^4 Fourier mode sum Eq. (A8)"
  tolerance_added: true

- id: ref_eqa10_nmodes
  run: run_eqa10_refinement_point
  setting: n_modes
  factors: [1, 2, 4]
  mode: multiply
  output: kappa_B_star
  tolerance: "0.1%"
  tolerance_basis: "added: strict truncation tolerance for the 1/j^4 periodic ring mode sum Eq. (A10)"
  tolerance_added: true

- id: ref_fe_fractured_nel
  run: run_fe_fractured_refinement_point
  setting: n_el
  factors: [1, 2, 4]
  mode: multiply
  output: kappa_B_sim
  tolerance: "5%"
  tolerance_basis: "added: comparable to stochastic scatter across random fracture phase realizations in Fig. S1"
  tolerance_added: true

- id: ref_ceff_nmodes
  run: run_c_eff_ring
  setting: n_modes
  factors: [1, 2, 4]
  mode: multiply
  output: c_eff
  tolerance: "0.1%"
  tolerance_basis: "added: truncation tolerance for periodic ring 1/j^2 and 1/j^4 mode sums"
  tolerance_added: true
