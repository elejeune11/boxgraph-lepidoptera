# Butterfly wing-scale morphological quantities
- id: scale_length
  name: wing scale length
  dimension: "[length]"
  description: Longitudinal length of an adult butterfly wing scale measured from the distal edge of the socket to the distal tip of the scale blade (SI p. 5, Fig. S4A).

- id: scale_width
  name: wing scale width
  dimension: "[length]"
  description: Width of an adult butterfly wing scale measured along a 90 deg transect at the midpoint of scale length (SI p. 5, Fig. S4A).

- id: scale_area
  name: approximate wing scale area
  dimension: "[length] ** 2"
  description: Approximate surface area of a butterfly wing scale calculated as rectangular area A = L * W (p. 3, SI p. 5).

- id: ridge_spacing
  name: longitudinal ridge spacing
  dimension: "[length]"
  description: Center-to-center spacing between adjacent parallel longitudinal cuticle ridges on the upper lamina of a butterfly wing scale (p. 3, SI p. 5, Fig. S1E-F).

- id: ridge_width
  name: longitudinal ridge width
  dimension: "[length]"
  description: Width of individual longitudinal cuticle ridges on an adult butterfly wing scale measured via FIJI Ridge Detection (p. 3, SI p. 5, Fig. S4C-E).

- id: ridge_number
  name: longitudinal ridge count per scale
  dimension: "dimensionless"
  description: Total number of parallel longitudinal cuticle ridges across a butterfly wing scale (p. 3, p. 9, Fig. 2D-E/L, Fig. 8N).

- id: crossrib_spacing
  name: crossrib spacing
  dimension: "[length]"
  description: Center-to-center spacing between adjacent crossribs joining parallel longitudinal ridges, extracted via correlation function analysis of X-ray nanotomography volumes (p. 3, SI p. 2, Fig. S1G-H).

- id: ridge_height
  name: cuticle ridge height
  dimension: "[length]"
  description: Vertical height H of a cuticle ridge measured by AFM from the absolute minimum of the scale height profile to the top of the ridge peak (SI pp. 6-7, Fig. S12).

- id: ridge_curvature
  name: ridge curvature
  dimension: "1 / [length]"
  description: Average curvature kappa of longitudinal cuticle ridges fitted as open B-splines in FIJI Kappa (pp. 9-10, Fig. 8O, SI p. 6).

- id: ridge_curvature_se
  name: standard error of ridge curvature
  dimension: "1 / [length]"
  description: Reported standard error of the mean ridge curvature kappa across treated or control scales (p. 10).

- id: ridge_spacing_reduction
  name: ridge spacing reduction
  dimension: "[length]"
  description: Reduction in parallel ridge spacing associated with increased reflectivity in Morpho adonis (p. 10, ref-46).

# Developing scale F-actin cytoskeleton quantities
- id: actin_bundle_width
  name: F-actin bundle width
  dimension: "[length]"
  description: Mean width (diameter) of longitudinal F-actin bundles in developing pupal wing scales at 50% development, measured via FIJI Ridge Detection (p. 3, Fig. 2J, SI p. 5).

- id: actin_bundle_spacing
  name: F-actin bundle spacing
  dimension: "[length]"
  description: Mean center-to-center spacing between adjacent longitudinal F-actin bundles in developing pupal wing scales at 50% development (p. 3, Fig. 2K, SI p. 5).

- id: actin_bundle_number
  name: F-actin bundle count per scale
  dimension: "dimensionless"
  description: Total number of longitudinal F-actin bundles across a developing pupal wing scale at 50% development (p. 3, Fig. 2L, SI p. 6).

- id: z_depth_range
  name: TauSTED axial depth color-bar span
  dimension: "[length]"
  description: Axial (Z) depth range spanned by depth-color-coded TauSTED Z-stack projections of F-actin (Figs. 4, 6, S8).

# Optical, reflectance, and correlation quantities
- id: wavelength
  name: optical wavelength
  dimension: "[length]"
  description: Wavelength of light measured in reflectance spectroscopy of adult wings (Fig. 8E, SI Fig. 10A).

- id: boxcar_smoothing_width
  name: spectral boxcar smoothing width
  dimension: "[length]"
  description: Spectral boxcar averaging width used in Ocean Optics SpectraSuite reflectance acquisition (SI p. 6).

- id: reflectance_angle
  name: reflectance measurement angle
  dimension: "dimensionless"
  description: Angular stage position used for angle-resolved reflectance spectroscopy of adult wings (SI Fig. 10B).

- id: reflectivity_increase
  name: optical reflectivity increase
  dimension: "dimensionless"
  description: Relative percentage increase in optical reflectivity resulting from reduced ridge spacing in Morpho adonis (p. 10, ref-46).

- id: correlation_lag_distance
  name: correlation function lag distance
  dimension: "[length]"
  description: Spatial lag distance r along the y or z axis of the 1D electron-density correlation function G_z(y) or G_x(z) (SI Fig. 1E-H).

- id: normalized_correlation
  name: normalized electron-density correlation function
  dimension: "dimensionless"
  description: Normalized 1D correlation function amplitude G_z(y) or G_x(z) extracted from X-ray nanotomography reconstructions (SI Fig. 1E-H).

- id: lateral_profile_position
  name: lateral AFM profile distance
  dimension: "[length]"
  description: Lateral scan position along a transverse AFM cross-section across cuticle ridges (SI Fig. 12A-B).

- id: surface_height
  name: AFM surface height profile
  dimension: "[length]"
  description: Topographic surface height z(x) along a transverse AFM line profile across cuticle ridges (SI Fig. 12A-B).

# Developmental timing and environmental conditions
- id: pupal_development_percent
  name: pupal development percentage
  dimension: "dimensionless"
  description: Developmental stage of a pupa expressed as a percentage of total pupation duration from pupal case formation to adult eclosion (p. 12).

- id: pupal_duration
  name: total pupal development duration
  dimension: "[time]"
  description: Total time from pupal case formation to adult eclosion at 25 degC (p. 12).

- id: elapsed_pupal_time
  name: elapsed pupal development time
  dimension: "[time]"
  description: Elapsed time since pupal case formation corresponding to a developmental percentage checkpoint (p. 12).

- id: temperature
  name: temperature
  dimension: "[temperature]"
  description: Environmental rearing, reagent storage, or resin curing temperature (p. 12, SI p. 3).

- id: relative_humidity
  name: rearing relative humidity
  dimension: "dimensionless"
  description: Ambient relative humidity maintained during caterpillar rearing (p. 12).

# Chemical perturbation, staining, and imaging protocol quantities
- id: mass_concentration
  name: mass concentration
  dimension: "[mass] / [length] ** 3"
  description: Mass-per-volume concentration of a reagent stock or staining solution (e.g., Cytochalasin D stock in DMSO, DAPI counterstain; p. 12, SI p. 3).

- id: molar_concentration
  name: molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of an injected drug/vehicle working solution or chemical preparation bath (p. 12, SI pp. 3-4).

- id: molar_mass
  name: molecular weight
  dimension: "[mass] / [substance]"
  description: Molar mass of a chemical compound (Cytochalasin D) used for stock-to-working molarity conversion.

- id: solution_volume
  name: liquid solution volume
  dimension: "[length] ** 3"
  description: Volume of an injected drug/control aliquot or adult butterfly feeding solution (p. 12).

- id: reagent_mass
  name: reagent or pollen mass
  dimension: "[mass]"
  description: Mass of pollen added to adult butterfly sugar-water feeding solution (p. 12).

- id: dilution_factor
  name: volumetric dilution factor
  dimension: "dimensionless"
  description: Denominator D of a 1:D dilution of antibody, dye, or stock solution (SI p. 3).

- id: concentration_percent
  name: percentage solution concentration
  dimension: "dimensionless"
  description: Concentration expressed as a percentage (w/v or v/v) for sugar water, PFA fixative, Triton-X 100, goat serum, Tween, EtOH, and Epon resin washes (p. 12, SI p. 3).

- id: dye_fold_increase
  name: STED dye concentration fold increase
  dimension: "dimensionless"
  description: Multiplicative increase in fluorophore dye concentration for STED relative to confocal imaging (SI p. 3).

- id: protocol_duration
  name: experimental protocol duration
  dimension: "[time]"
  description: Fixation, washing, blocking, antibody incubation, dehydration, resin infiltration, curing, or staining duration (p. 12, SI pp. 3-4).

- id: integration_time
  name: spectrometer integration time
  dimension: "[time]"
  description: Detector integration time per reflectance scan in SpectraSuite (SI p. 6).

- id: scan_average_count
  name: averaged spectrometer scans
  dimension: "dimensionless"
  description: Number of sequential spectrometer scans averaged per reflectance acquisition (SI p. 6).

- id: xray_photon_energy
  name: synchrotron X-ray photon energy
  dimension: "[mass] * [length] ** 2 / [time] ** 2"
  description: Monochromatic X-ray beam energy used for transmission X-ray nanotomography at PETRA III (SI p. 2).

- id: effective_pixel_size
  name: effective imaging pixel size
  dimension: "[length]"
  description: Effective isotropic object-space pixel size of the transmission X-ray microscope (SI p. 2).

- id: rotation_angle
  name: tomography rotation range
  dimension: "dimensionless"
  description: Total angular range through which a scale specimen is rotated during X-ray nanotomography projection acquisition (SI p. 2).

- id: transect_angle
  name: width transect angle
  dimension: "dimensionless"
  description: Angle relative to the longitudinal scale axis along which scale width and ridge count are measured (SI p. 5, Fig. S4A).

- id: tem_section_thickness
  name: TEM ultramicrotome section thickness
  dimension: "[length]"
  description: Thickness of ultrathin resin sections cut for transmission electron microscopy (SI p. 3).

- id: accelerating_voltage
  name: electron microscope accelerating voltage
  dimension: "[mass] * [length] ** 2 / [time] ** 3 / [current]"
  description: Electron beam accelerating voltage of the Philips CM100 TEM (SI p. 4).

- id: objective_magnification
  name: microscope objective magnification
  dimension: "dimensionless"
  description: Nominal magnification of the confocal microscope oil-immersion objective lens (SI p. 5).

- id: wing_section_size
  name: dissected wing section dimension
  dimension: "[length]"
  description: Side length of the square wing piece dissected and mounted for SEM (SI pp. 4-5).

- id: afm_scan_size
  name: AFM scan region side length
  dimension: "[length]"
  description: Lateral side length of a square tapping-mode AFM scan area (SI Fig. 12A-B).

- id: deconvolution_background_size
  name: deconvolution background estimation size
  dimension: "[length]"
  description: Spatial scale parameter used by Huygens Professional for automatic background estimation prior to CMLE deconvolution (SI p. 4).

- id: deconvolution_quality
  name: CMLE deconvolution quality threshold
  dimension: "dimensionless"
  description: Default stopping quality threshold for optimized-iteration CMLE deconvolution in Huygens Professional (SI p. 4).

- id: image_crop_pixels
  name: ROI crop pixel dimension
  dimension: "dimensionless"
  description: Linear pixel side length of square image crops analyzed by FIJI Ridge Detection (SI p. 5).

- id: algorithm_parameter
  name: image-analysis plugin parameter
  dimension: "dimensionless"
  description: Numeric configuration parameter of FIJI Ridge Detection (Sigma, thresholds, line length bounds) or Kappa B-spline curvature fitting (SI pp. 5-6).

# Sample sizes, experimental outcomes, and statistical quantities
- id: individual_count
  name: count of individuals or pupae
  dimension: "dimensionless"
  description: Number of butterfly individuals, pupae, or mounted wing instances in an experiment or analysis (pp. 3, 12-13, SI pp. 4-6).

- id: scale_count
  name: count of wing scales
  dimension: "dimensionless"
  description: Number of individual butterfly wing scales analyzed in an imaging or morphological dataset (pp. 3, 11-13, SI pp. 5-6, 13).

- id: wing_region_count
  name: count of wing regions sampled
  dimension: "dimensionless"
  description: Number of distinct forewing/hindwing regions sampled per individual (proximal/iridescent vs distal/non-iridescent; SI p. 5).

- id: batch_count
  name: count of experimental injection batches
  dimension: "dimensionless"
  description: Number of independent Cytochalasin D / control injection batches (SI p. 6).

- id: image_count
  name: count of microscope images
  dimension: "dimensionless"
  description: Number of microscopy images or AFM transects acquired (p. 13, SI p. 6).

- id: ridge_width_measurement_count
  name: count of individual ridge-width measurements
  dimension: "dimensionless"
  description: Number of point-wise ridge width measurements collected along all detected ridges within one 600 x 600 px SEM scale crop (SI Fig. 4D).

- id: emergence_rate
  name: pupal emergence rate
  dimension: "dimensionless"
  description: Percentage of injected pupae successfully eclosing into adults (p. 13, SI p. 6).

- id: chi_squared_statistic
  name: chi-squared test statistic
  dimension: "dimensionless"
  description: Test statistic chi^2 from a likelihood ratio test of nested linear mixed-effects models or a 2x2 contingency table chi-squared test (p. 3, SI p. 6).

- id: t_statistic
  name: t-test statistic
  dimension: "dimensionless"
  description: Test statistic t from a Welch two-sample t-test or paired t-test (pp. 9-10, SI p. 2).

- id: degrees_of_freedom
  name: statistical degrees of freedom
  dimension: "dimensionless"
  description: Degrees of freedom (df) of a chi-squared or t-test statistic (pp. 3, 9-10, SI pp. 2, 6).

- id: p_value
  name: statistical p-value
  dimension: "dimensionless"
  description: Two-sided p-value (t-test / Tukey post-hoc) or upper-tail p-value (chi-squared test) reported for statistical hypothesis tests (pp. 3, 9-10, SI pp. 2, 6).

# Quantities added for calibrated figure readings
- id: optical_reflectance
  name: optical reflectance intensity
  dimension: "dimensionless"
  description: Reflected light intensity (%) measured by reflectance spectroscopy of adult butterfly wings (Fig. 8E, SI Fig. 10A-B).

- id: fluorescence_intensity
  name: fluorescence intensity
  dimension: "dimensionless"
  description: Arbitrary-unit TauSTED fluorescence intensity of phalloidin (actin) or CBD (chitin) measured along an orthogonal transect across developing ridges (Fig. 7E-F, SI Fig. 9F).

- id: transect_position
  name: fluorescence line-profile position
  dimension: "[length]"
  description: Spatial position along the red orthogonal transect across developing scale ridges in TauSTED fluorescence intensity profiles (Fig. 7E-F, SI Fig. 9F).

- id: treatment_group_index
  name: experimental treatment group index
  dimension: "dimensionless"
  description: Discrete ordinal index identifying experimental treatment groups in Cytochalasin D perturbation plots (1 = control, 2 = cytochalasin D treated; Fig. 8N-O, SI Fig. 12C).

- id: wing_region_index
  name: wing region index
  dimension: "dimensionless"
  description: Discrete ordinal index identifying wing regions in H. sara 50% developing F-actin plots (1 = black non-iridescent, 2 = blue iridescent; Fig. 2J-L).

- id: scale_group_index
  name: scale region and type group index
  dimension: "dimensionless"
  description: Discrete ordinal index identifying adult H. sara wing-region and scale-type combinations (1 = black cover, 2 = black ground, 3 = blue cover, 4 = blue ground; SI Fig. 5A-C).

- id: ridge_index
  name: longitudinal ridge identifier
  dimension: "dimensionless"
  description: Sequential integer ID (1 to 30) assigned to individual longitudinal ridges detected by FIJI Ridge Detection in a single adult H. sara scale crop (SI Fig. 4E).

- id: sample_index
  name: individual sample or scale ordinal index
  dimension: "dimensionless"
  description: Sequential ordinal index (1..n) identifying individual scales, ridges, or butterfly specimens ordered within a plotted group (Fig. 2J-L, Fig. 8N-O, SI Fig. 10A-B, SI Fig. 12C).

