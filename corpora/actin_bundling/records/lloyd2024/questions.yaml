  text: >
    No cross-record validations are entered in lloyd2024/validations.yaml between lloyd2024 and
    totz2024 (0 entries in either direction). Although both 2024 papers investigate butterfly wing
    scale ridge morphogenesis (Heliconius sara / P. arcas / M. helenor in lloyd2024 vs Vanessa
    cardui in totz2024), their quantitative observables occupy incompatible developmental stages
    and model regimes:
    (1) lloyd2024 models (15 runnable models) vs totz2024 measurements (37 origin: measured datums):
    (a) afm_ridge_height_from_profile: totz2024 assigns a single quantity id
    (totz2024/protoridge_height) to both 1D height profiles (d_fig1G_profile_41_0pct) and its only
    scalar measured height datum (protoridge_height_approx = "~100" nm, p. 4), which cannot be
    mapped 1:1 onto lloyd2024's distinct input (surface_height) and output (ridge_height) quantities
    without quantity conflation; moreover "~100" nm yields 'no verdict' and native 0.2 um prominence
    detects 0 peaks. Offline evaluation with min_prominence_um = 0.015 um gives H_mean = 89.4 nm
    (H_max = 100.0 nm at default 0.2 um) on d_fig1G_profile_41_0pct (3 ridges spaced 1.75 um at
    41.0% dev), 45.8 nm (H_max = 49.2 nm) on d_fig1F_profile_40_0pct, 151.8 nm on the sparse tilted
    d_figS1E_mean_profile (dx = 0.90 um, 0 interior peaks), and 19.4, 23.7, 30.7, 32.4, 52.8 nm on
    the single-ridge Fig. 3A-E averages (truncated above w = 0, with no per-timepoint scalar target
    because d_fig3F_w0_mean is a 5-point curve).
    (b) pupal_development_time_from_percent: totz2024 prints no total pupal duration T_pupal and no
    clock times for Fig. 1B-D or Fig. 3A-H; its only timing statement ("~35 to 45" % <-> "~3.5 to
    4.5" days, p. 4) is an approximate prose range yielding 'no verdict'.
    (c) All remaining lloyd2024 models (scale_rectangular_area, ridge_spacing_from_width_and_count,
    actin_templated_ridge_spacing, correlation_peak_*, statistical p-values, Cyto-D stoichiometry)
    have zero corresponding measured quantities in totz2024 (no scale length/width/area, no ridge
    or actin counts, no autocorrelation G(r), no t/chi2 tests, no Cyto-D injections).
    (2) Offline audit of reverse direction (totz2024 FvK thin-plate buckling models vs lloyd2024
    measurements):
    (a) Adult H. sara sclerotized AFM ridge heights (d_figs12c_ridge_height_mean_sd: control 1304 +-
    165 nm, Cyto-D 1121 +- 187 nm [literally mislabeled 'um' in data.yaml]; Profile 4 H_mean =
    1101 / 755 nm, H_max = 1317 / 900 nm) are mature multilayered chitin lamellae grown across
    50%-100% development, far outside totz2024's early-stage (39.6%-41.0%) thin-plate membrane
    buckling regime (a/h ~ 65 >> 1 violates FvK moderate-rotation theory). Evaluating
    totz2024/rayleigh_ritz_amplitude_eq3_corrected (h = 20 nm, nu = 0.5, Y = 1 MPa, p = 10 Pa,
    g in [0, 0.7%]) at H. sara's 50% F-actin spacings predicts only 20.9-48.2 nm (blue, L = 1.07 um)
    and 27.0-56.9 nm (black, L = 1.22 um) — 23x-62x smaller than adult AFM heights — while
    inverting rayleigh_ritz_strain_eq3_corrected for a = 1304 nm demands unphysical elastic growth
    strains of g = 489% (blue) or g = 376% (black), 500x-700x above totz2024 Table S1's 0.0%-0.7%.
    (b) lloyd2024 measures zero early-stage (39%-41%) membrane deflection heights and zero elastic
    parameters (Y, p, g, nu, h), while totz2024 takes actin-bundle spacing L as an external input
    rather than predicting L (with critical_growth_strain_eq4 giving g_c = 0.153% for blue 1.07 um
    vs 0.118% for black 1.22 um, both well below totz2024 Fig. 4C's non-buckling lower-lamina
    threshold g_c ~ 1.35%-1.51% at L ~ 0.34-0.36 um).
