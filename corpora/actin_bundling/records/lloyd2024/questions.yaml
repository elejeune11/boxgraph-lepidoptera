    peakshape maximum reflectance H1, mean brightness B2, or total integrated reflectance B1,
    nor whether a Welch or pooled t-test was used -- note df = 33 vs pooled n1+n2-2 = 34
    implies Welch t-test) are specified in the PDF.
  citation:
