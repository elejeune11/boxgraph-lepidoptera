- id: q_cytod_curvature_se_welch_mismatch
  kind: possible_error
  about:
    - welch_two_sample_t_test_summary
    - cytod_curvature_treated
    - cytod_curvature_treated_se
    - cytod_curvature_control
    - cytod_curvature_control_se
    - cytod_curvature_t
    - cytod_curvature_df
    - cmp_cytod_curvature_welch_t_n12
    - cmp_cytod_curvature_welch_df_n12
    - cmp_cytod_curvature_welch_df_n20
  text: >
    Main p. 10 prints mean ± SE ridge curvature (kappa) as treated 0.0566 ± 0.0018 um^-1
    and control 0.0158 ± 0.0006 um^-1 with Welch two-sample t-test t = -2.78, df = 12,
    p < 0.05. Evaluating Welch's t-test directly from these printed means and SEs yields
    t = -21.50 (p = 8.7e-12; df = 13.41 at n = 12 scales/group, or df = 23.17 at n = 20),
    far from the printed t = -2.78 and df = 12. Visual inspection of the red SD error bars
    in Fig. 8O (p. 11) shows treated SD ~ 0.050 um^-1 and control SD ~ 0.009 um^-1; for
    n = 12 scales/group (SI p. 6), this implies SE_treated ~ 0.0144 um^-1 and SE_control ~
    0.0026 um^-1, which DO yield t ~ -2.79 and df ~ 11.7 (~12). Thus the printed SEs
    (0.0018 and 0.0006 um^-1) are ~8x and ~4x smaller than the scale-level SEs consistent
    with both the reported Welch t-test and Fig. 8O (e.g., computed over a much larger
    non-independent pooling unit such as individual spline points, or mis-scaled by ~10x).
  citation:
    page: 10
    printed_page: "10"
    quote: "treated 0.0566 ± 0.0018 μm−1, control 0.0158 ± 0.0006 μm−1; t-test,"
    where: "text (also Fig. 8O on p. 11)"

- id: q_fig8_NO_swapped_refs_and_n
  kind: possible_error
  about:
    - cytod_ridge_number_n_fig8N_caption
    - cytod_curvature_n_fig8O_caption
    - cytod_ridge_number_df
    - cytod_curvature_df
    - cmp_sampling_cytod_rn_fig8N
    - cmp_sampling_cytod_curv_fig8O
  text: >
    Two separate swaps affect Fig. 8N and 8O (pp. 9-11): (1) The main text on p. 9 cites
    Fig. 8O for ridge number and Fig. 8N (pp. 9-10) for ridge curvature, whereas on p. 11
    panel (N) plots Ridge number and panel (O) plots Ridge curvature. (2) The Fig. 8 caption
    (p. 11) reports n = 12 per group for ridge number (N) and n = 20 per group for ridge
    curvature (O), swapping the sample sizes relative to SI Methods p. 6 (4 individuals x
    5 scales = 20 scales/group for ridge number; 4 individuals x 3 scales = 12 scales/group
    for curvature) and relative to the actual dot counts plotted in Fig. 8N (20 dots/group)
    and Fig. 8O (12 dots/group). Note also an asymmetry in statistical replication units:
    ridge number gives Welch df = 5 (consistent with averaging to n = 4 vs 4 individuals,
    max df = 6), whereas curvature gives df = 12 (impossible for 4 vs 4 individuals,
    confirming scale-level testing at n = 12 vs 12 scales).
  citation:
    page: 11
    printed_page: "11"
    quote: "N Ridge number for cyto-d treated (n = 12) and control scales"
    where: "Fig. 8N-O caption (compare pp. 9-10 text and SI p. 6)"

