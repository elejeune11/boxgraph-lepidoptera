  text: >
    No cross-record validations are entered in lloyd2024/validations.yaml between lloyd2024 and
    sekine2024 (0 entries in either direction). Despite sharing the broad biological theme of
    periodic F-actin assemblies patterning cuticular surfaces, the two studies investigate
    completely disjoint organisms, organs, length scales, and quantitative observables:
    (1) lloyd2024 models (15 runnable morphometric, pupal-staging, AFM-height, TXM-correlation,
    Cyto-D stoichiometry, and statistical-test models) vs sekine2024 measurements (261
    measured/fitted/derived datums on embryonic stage 15-16 Drosophila melanogaster tracheal
    dorsal-trunk circumferential actin cables): sekine2024 measures no butterfly wing-scale
    dimensions (L, W, A), no ridge or actin-bundle counts (N, N_actin), no transverse AFM height
    profiles z(x), no real-space autocorrelation curves G(r), no pupal development percentage
    timestamps, and no t-test or chi-squared test statistics (sekine2024's p. 20 Student's t-test
    caption prints p-values without t or df).
    (2) Offline audit of reverse direction (sekine2024's 32 CGMD polymer-physics, hydrodynamic
    drag, persistence-length, motor-walking, nanocluster-width, PIV, and Gaussian Fourier
    structure-factor S(q) models vs lloyd2024 measurements): lloyd2024 measures no single-filament
    mechanical parameters, cytosolic viscosity, myosin-II speeds, sub-diffraction actin nanocluster
    dimensions, live PIV displacement anisotropies, or Fourier structure factors S(q). Applying
    sekine2024's Drosophila tracheal 4-M CGMD structure-factor cable spacing (528.7 nm) to
    Heliconius sara butterfly wing-scale 50% F-actin bundle spacing (1070 +- 20 nm blue, 1220 +-
    30 nm black) would be physically invalid across unrelated insects, tissues, and patterning
    mechanisms (and off by 2.0x-2.3x).
  citation:
