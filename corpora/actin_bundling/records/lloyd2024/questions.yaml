- id: q_cytod_unit_typo_and_dmso_vehicle
  kind: possible_error
  about:
    - cytod_vehicle_dmso_concentration
    - cytod_working_conc
    - dmso_control_conc
    - cmp_cytod_vehicle_dmso_vs_control
  text: >
    Main p. 12 twice misprints lowercase '20 μm' (micrometers) instead of '20 μM'
    (micromolar) for the final Cytochalasin D concentration ('a final concentration of
    20 μm') and the DMSO control ('5 μl of 20 μm DMSO in Grace's insect medium').
    Furthermore, diluting the commercial 5 mg/ml Cytochalasin D stock in neat DMSO
    (~9.85 mM, MW = 507.62 g/mol) to 20 uM requires a 492.5-fold dilution, leaving ~28.6 mM
    (28,588 uM, ~0.203% v/v) DMSO in the drug injection solution -- 1430x higher than a
    literal 20 uM DMSO control solution. Presumably the control used a vehicle-matched
    volume of DMSO (~0.2% v/v) corresponding to the 20 uM drug dilution rather than 20 uM
    molar DMSO.
  citation:
    page: 12
    printed_page: "12"
    quote: "of 20 μm in Grace’s insect medium (Merck)"
    where: "Methods (Chemical perturbation of actin)"

