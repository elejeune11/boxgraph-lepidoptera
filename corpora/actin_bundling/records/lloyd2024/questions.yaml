- id: q_audit_figS10_orientation_reading
  kind: reading
  about:
    - q_figS10_panel_coloring_mismatch
    - pavo_reflectance_spectral_analysis
    - cytod_analyzed_treated
    - cytod_analyzed_control
  text: >
    Audit disagreement with q_figS10_panel_coloring_mismatch: Supplementary Fig. 10 (p. 34,
    SI p. 19) is printed rotated 90 degrees clockwise. When rotated 90 degrees counter-clockwise
    into upright orientation so that each ggplot facet's grey strip header sits directly above
    its own plot box, all 15 GIM_TREAT_* panels are plotted in red (CONTROL) and all 21
    TREATED_* panels -- including TREATED_1B, TREATED_1E, and TREATED_1F -- are plotted in
