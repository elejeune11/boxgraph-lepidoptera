    with flat low-intensity (~2-7%) spectra. The apparent color mismatch described in
    q_figS10_panel_coloring_mismatch arose from reading the sideways strip labels of
    TREATED_1B/1E/1F against the adjacent plot boxes of GIM_TREAT_9G, GIM_TREAT_H1, and
    GIM_TREAT_H2 in the preceding row.
  citation:
    page: 35
    printed_page: "SI 20"
    quote: "Individual reflectance spectra from all control and Cytochalasin D treated individuals"
    where: "SI Fig. 10 (plot on p. 34 rotated 90 deg clockwise; caption on p. 35)"

- id: q_hedem_paired_t_se_pooling_mismatch
  kind: unexplained_difference
  about:
    - hedem_ridge_spacing_proximal
    - hedem_ridge_spacing_distal
    - hedem_ridge_spacing_t
    - hedem_ridge_spacing_df
    - hedem_ridge_spacing_p
  text: >
    SI p. 2 (p. 17) reports Heliconius erato demophoon mean ± SE ridge spacing as proximal
    0.906 ± 0.0101 um and distal 0.956 ± 0.0125 um alongside a paired t-test (t = 1.94,
    d.f. = 4, p = 0.125). By Cauchy-Schwarz, for any paired observations (X_i, Y_i) with
    marginal standard errors SE_X and SE_Y, SE(Y - X) <= SE_X + SE_Y; inserting the printed
    SEs yields SE(diff) <= 0.0226 um and thus |t| >= (0.956 - 0.906) / 0.0226 = 2.212
    (at least 2.159 even under worst-case rounding of printed digits), contradicting the
    printed t = 1.94 (which implies SE(diff) ~ 0.0258 um). Combined with Main p. 13
    ('we firstly averaged measurements for each region per individual. Given the lower sample
    size we performed a paired t-test') and the between-individual scatter visible in SI Fig.
    6D (p. 29), this proves that the printed SEs (0.0101 and 0.0125 um) are pooled scale-level
    SEs (n = 50 scales/region across 5 individuals x 10 scales) rather than individual-level
    SEs (n = 5), though the text does not state the pooling unit of the printed SEs.
  citation:
    page: 17
    printed_page: "SI 2"
    quote: "mean ± SE ridge spacing, proximal = 0.906 μm ± 0.0101, distal = 0.956 ± 0.0125 μm"
    where: "SI Supplementary results (compare Main p. 13 and SI Fig. 6D on p. 29)"

- id: q_actin_vs_adult_ridge_spacing_offset
  kind: unexplained_difference
  about:
    - actin_bundle_spacing_blue
    - actin_bundle_spacing_black
    - actin_bundle_number_blue
    - actin_bundle_number_black
    - sem_ridge_spacing_blue
    - sem_ridge_spacing_black
    - sem_width_blue_cover
    - sem_width_black_cover
    - cmp_actin_templated_spacing_blue
  text: >
    Two quantitative gaps affect the developing-actin-to-adult-ridge spacing comparison on
    p. 3: (1) Although p. 3 reports that 50% developing F-actin bundle counts (40 ± 1.8
    iridescent, 32 ± 1.1 non-iridescent) closely match adult cover ridge counts and concludes
    'a tight coupling between the spacing of actin bundles and spacing of chitin ridges', the
    printed 50% F-actin bundle spacings (1.07 ± 0.02 um blue, 1.22 ± 0.03 um black) are
    27-33% larger than adult SEM ridge spacings (0.804 ± 0.007 um blue, 0.962 ± 0.004 um
    black), and N_actin * s_actin (42.8 um blue, 39.0 um black) is 25-45% wider than adult
    cover scale widths (29.5 um blue, 31.3 um black); the paper does not report 50% developing
    scale widths or discuss this lateral shrinkage/offset between hydrated confocal and dry
    SEM scales. (2) Main p. 3 prints only pooled cover+ground adult ridge spacing for blue
    scales (0.804 ± 0.007 um) without reporting separate blue cover and ground means despite
    finding a significant difference between them (Tukey p < 0.001), causing
    cmp_actin_templated_spacing_blue (29.5 / 40 = 0.7375 um vs pooled 0.804 ± 0.007 um) to
    be not reproduced until SI Fig. 5A is digitized.
  citation:
    page: 3
    printed_page: "3"
    quote: "indicating a tight coupling between the spacing of actin bundles and spacing of chitin"
    where: "Results (p. 3)"

- id: q_audit_additional_text_and_fig_inconsistencies
  kind: reading
  about:
    - q_sem_scale_count_400_vs_800
    - sem_hsara_scale_count_p3
    - sem_hsara_cover_per_region
    - sem_width_blue_cover
    - afm_ridge_height_from_profile
    - xray_crossrib_spacing_blue_text
  text: >
    Additional textual and figure inconsistencies identified during independent audit:
    (1) Main Methods p. 12 literally omits 'per region', stating '10 cover and 10 ground
    scales analysed for each individual' (20 x 20 = 400 scales, matching p. 3 '400 scales'),
    whereas SI pp. 4-5 explicitly writes 'For each region, images were taken of 10 cover and
    10 ground scales' (20 x 2 x 20 = 800 scales, matching p. 13 and SI Fig. 5); thus p. 12
    does not itself state 800 scales (nuancing q_sem_scale_count_400_vs_800). (2) Main p. 3
    cites '(Fig. 2D, S5B)' for scale width, whereas SI Fig. 5B plots scale area (not scale
    width); p. 3 also cites '(S6)^34' for prior inter-species Heliconius ridge-spacing work
    (ref-34, Parnell et al. 2018), whereas SI Fig. 6 (S6) is the authors' own within-wing
    H. e. demophoon control. (3) In SI Fig. 12A (p. 36), the vertical arrow labeled 'H' on
    the AFM profile plot extends down to Height = 0 um rather than to the profile minimum
    (~0.18 um), whereas both SI p. 7 and SI Fig. 12 caption define H from the profile minimum
    to the ridge peak (which matches Panel C values ~900-1550 nm). (4) Main p. 3 cites ref-39
    (Siddique et al. 2017) for the expanded black-scale crossrib melanin-absorption claim,
    whereas the parallel sentence on SI p. 2 (p. 17) cites si-ref-1 (Brien et al. 2021 =
    ref-40).
  citation:
    page: 12
    printed_page: "12"
    quote: "with 10 cover and 10 ground scales analysed for each individual"
    where: "Methods (also p. 3, SI p. 2, SI Fig. 12A on p. 36)"


