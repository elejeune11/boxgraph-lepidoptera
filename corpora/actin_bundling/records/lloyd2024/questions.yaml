- id: q_actin_lrt_omitted_df
  kind: unstated_input
  about:
    - lrt_actin_df_added
    - lrt_actin_width_chi2
    - lrt_actin_spacing_chi2
    - lrt_actin_number_chi2
    - cmp_pval_lrt_actin_number
  text: >
    Main p. 3 reports likelihood ratio test chi-squared statistics for developing F-actin
    bundle width (chi2 = 19), spacing (chi2 = 40), and bundle number (chi2 = 11), all with
    p < 0.001, without printing their degrees of freedom (d.f.). Because each model compares
    two wing regions (iridescent vs non-iridescent) with an intercept-only random effect for
    individual (p. 13), df = 1 is implied; notably, chi2 = 11 yields p = 0.00091 (< 0.001)
    only for df = 1, whereas df = 2 gives p = 0.00409 (> 0.001).
  citation:
    page: 3
    printed_page: "3"
    quote: "likelihood ratio, χ2 = 11, p < 0.001"
    where: "text (also χ2 = 19 and χ2 = 40 on p. 3)"

- id: q_emergence_chi2_no_yates
  kind: choice
  about:
    - pupal_emergence_chi_squared
    - cytod_emergence_chi2
    - cytod_emergence_p
    - cmp_cytod_emergence_chi2
    - cmp_cytod_emergence_p
  text: >
    SI p. 6 reports χ2(1) = 0.0211, p = 0.884 for pupal emergence (29/42 cyto-D vs 24/34
    control). This exactly reproduces Pearson's uncorrected 2x2 chi-squared test (0.02113,
    p = 0.8844), whereas R's default chisq.test() applies Yates' continuity correction
    (correct = TRUE, giving chi2 = 0.000, p = 1.000). The paper states all statistical
    analyses were performed in R (p. 13) without specifying correct = FALSE.
  citation:
    page: 21
    printed_page: "SI 6"
    quote: "no significant difference in emergence rate between cyto-D and controls (χ2 (1) = 0.0211, p = 0.884)"
    where: "SI Methods"

- id: q_missing_r_scripts_and_lme4_data
  kind: unstated_input
  about:
    - lme4_scale_morphology_models
    - lme4_actin_bundle_models
  text: >
    Main p. 13 directs readers to 'See Supplementary Information for the R scripts and data
    used to undertake these analyses', yet the Supplementary Information PDF (pp. 16-37)
    contains no R scripts and no raw morphological/actin data tables (processed imaging
    data are instead archived externally at University of Sheffield ORDA/Figshare, DOI
    10.15131/shef.data.c.7114033). Consequently, the lme4 linear mixed-effects models and
    emmeans Tukey post-hoc contrasts cannot be executed from the paper PDF alone.
  citation:
    page: 13
    printed_page: "13"
    quote: "See Supplementary Information for the R"
    where: "Statistical and reproducibility"

