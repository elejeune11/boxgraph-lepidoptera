  text: >
    ModelAtlas audit across all 23 models of lloyd2024 and all 34 models of totz2024 (Cell
    Reports Physical Science 5, 102063, 2024; co-published in 2024; neither paper cites the other)
    yields 0 stated relations, 0 proposed relations, and 0 cited.yaml links: the two butterfly
    wing-scale papers are mathematically complementary rather than formally overlapping.
    (1) Mechanical vs. empirical scope: lloyd2024 invokes Ghiradella's (1974) stress-buckling
    hypothesis and intracellular cytoplasmic pressure only qualitatively on p. 12 (non-runnable
    multilayer_ridge_bragg_optics) and prints zero elasticity or buckling equations, whereas
    totz2024 contains 29 Foppl-von-Karman thin-plate buckling, Hooke plane-stress, and
    nondimensionalization models plus 5 local processing/bookkeeping helpers, with zero
    morphometric area, pupal-timing, drug-stoichiometry, or statistical-test models.
    (2) Curve-port ridge-height models (untestable in ModelAtlas): lloyd2024/afm_ridge_height_from_profile
    extracts multi-ridge adult AFM heights above the global profile minimum (H ~ 1.0-1.5 um,
    SI Fig. 12), whereas totz2024/fit_cosine_amplitude performs single-ridge OLS projection onto
    (1/2)*(1 + cos(2*pi*x/L)) on early-developing 39.6-41.0% V. cardui phase profiles
    (a ~ 24-64 nm, Fig. 3A-E); the two coincide only on a noiseless zero-baseline single-period
    cosine. (3) Spacing models: lloyd2024/actin_templated_ridge_spacing (s = W/N_actin) and
    totz2024/rayleigh_ritz_width_eq3_corrected (L from g, a, p, Y, nu, h) predict actin/ridge
    spacing from completely disjoint physical inputs (geometric counting vs. FvK buckling
    balance), while totz2024/scale_bundle_spacing (L = m*L_0) is a 1-op Fig. 2E multiplier
    (too_plain). (4) Biophysical synthesis: evaluating totz2024/critical_growth_strain_eq4
    (g_c = pi^2/(3*(1-nu^2))*(h/L)^2, h = 20 nm, nu = 0.5) at lloyd2024's 50% developing H. sara
    F-actin spacings (L_blue = 1.07 +- 0.02 um vs. L_black = 1.22 +- 0.03 um) yields g_c = 0.153%
    for iridescent blue scales versus 0.118% for non-iridescent black scales — a 1.30x higher
    buckling threshold (2.24x above V. cardui's 1.6 um baseline g_c = 0.069%), yet still well
    below the closely spaced non-buckling lower-lamina regime (~0.3-0.5 um in totz2024 Fig. 4C).
    Furthermore, lloyd2024's Cytochalasin D injection at 50% development preserves adult ridge
    number (p = 0.70) and macroscopic ridge height (~1.1-1.4 um) while raising ridge curvature
    3.6x and disrupting layered lamellae, probing a post-initiation structural stabilization stage
    (including secondary branched actin between ridges) beyond totz2024's 39.6-41.0% early
    membrane-buckling onset model.


