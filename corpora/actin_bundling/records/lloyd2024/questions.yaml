    where: "SI Methods (Reflectance spectroscopy; also p. 9)"

- id: q_optical_and_buckling_model_unstated
  kind: unstated_model
  about:
    - multilayer_ridge_bragg_optics
    - morpho_adonis_ridge_spacing_reduction
    - morpho_adonis_reflectivity_increase
  text: >
    Although the paper attributes H. sara blue iridescence to multilayer Bragg interference
    by layered cuticle ridge lamellae and discusses Ghiradella's intracellular-stress
    elastic buckling hypothesis (pp. 1-2, 10-12), it contains no quantitative optical
    reflectance equations (Bragg/thin-film/transfer-matrix), no measured lamellar thickness,
    air-gap, layer-count, or refractive-index values for H. sara (explicitly noting on p. 3
    that ridge lamellae were beyond X-ray nanotomography resolution and were not quantified),
    and no mechanical buckling equations.
  citation:
    page: 3
    printed_page: "3"
    quote: "We did not quantify differences in the layering of lamellae within the ridges"
    where: "Results (also pp. 1-2, 10-12)"

