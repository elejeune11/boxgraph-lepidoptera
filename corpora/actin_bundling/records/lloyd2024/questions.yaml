  text: >
    ModelAtlas audit across all 23 models of lloyd2024 and all 32 models of sekine2024 (Nat.
    Commun. 15, 464, 2024; neither paper cites the other) yields 0 stated relations, 0 non-trivial
    proposed relations, and 0 cited.yaml links. Specifically: (1) The automated shape match
    between lloyd2024/xray_tomography_correlation_analysis and sekine2024/cgmd_2d_network
    ('length from energy, length') is purely a dimensional coincidence (11 keV synchrotron X-ray
    photon energy vs. k_B*T thermal energy; both models are non-runnable and physically disjoint).
    (2) Shared 1-2 op algebraic forms across unrelated organisms/organs are excluded as too_plain
    (consistent with sekine2024's own ModelAtlas convention in sekine2024+gov2018):
    lloyd2024/ridge_spacing_from_width_and_count (W/N) and actin_templated_ridge_spacing
    (W/N_actin) vs. sekine2024/structure_factor_interval (1/(mu/(2*pi))) and
    structure_factor_interval_wavenumber (2*pi/mu); likewise sekine2024/pseudo_image_discretization
    (L_box/N_grid, simulation pixel pitch) and fusion_duration_time (N_frames*dt_frame, movie
    duration) measure physically distinct quantities. (3) Biologically, both papers investigate
    how periodic F-actin bundles pattern an apical cuticular surface — ~450 nm circumferential
    actin cables emerging via myosin-II-driven anisotropic fusion of actin nanoclusters in
    Drosophila tracheal tubes (modeled by 2D overdamped Langevin CGMD and Gaussian Fourier
    structure-factor S(q) fits in sekine2024) versus 1.07-1.22 um longitudinal F-actin bundles
    templating 0.80-0.96 um cuticular ridges in butterfly wing scales (measured by SEM, TauSTED,
    TXM correlation G_z(y), AFM, and Cyto-D perturbation in lloyd2024, without polymer-physics,
    hydrodynamic drag, Langevin, or S(q) equations).

- id: q_totz2024_no_model_relations_and_buckling_synthesis
  kind: reading
