    where: "SI Methods (Synchrotron X-ray nanotomography)"

- id: q_image_analysis_pipelines_nonrunnable
  kind: unstated_model
  about:
    - steger_ridge_detection_width
    - kappa_bspline_ridge_curvature
    - huygens_cmle_sted_deconvolution
  text: >
    Three image-processing pipelines described in SI Methods cannot be executed without the
    raw micrographs and interactive user inputs: (1) FIJI Steger Ridge Detection (SI p. 5)
    requires manual contrast/brightness adjustment and image-dependent confocal upper
    thresholds (12.58 to 21.93); (2) FIJI Kappa open B-spline curvature fitting (SI p. 6)
    requires manually digitized ridge control points on high-magnification SEMs; and (3)
    Huygens Professional v23.10 CMLE deconvolution (SI p. 4) relies on raw Leica TauSTED
    stacks, per-image SNR/PSF optimization, and proprietary deconvolution software.
  citation:
    page: 20
    printed_page: "SI 5"
    quote: "Contrast and brightness levels were adjusted manually to optimal levels using FIJI"
    where: "SI Methods (also SI pp. 4, 6)"

- id: q_pavo_reflectance_metric_unstated
  kind: unstated_model
  about:
    - pavo_reflectance_spectral_analysis
    - cytod_brightness_t
    - cytod_brightness_df
    - cytod_brightness_p
  text: >
    SI p. 6 states that reflectance spectra were smoothed with PAVO 'procspec' and peaks
    extracted with 'peakshape', and p. 9 reports a significant reduction in brightness
    (t = 4.34, df = 33, p < 0.001). However, neither the raw spectra, the 'procspec'
