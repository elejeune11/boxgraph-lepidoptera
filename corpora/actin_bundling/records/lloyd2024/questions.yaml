  text: >
    Cross-record ModelAtlas audit between lloyd2024 and mcdougal2021 (PNAS 118(49), e2112009118,
    2021; neither paper cites the other — lloyd2024 ref-2 is McDougal et al. 2019 J. Opt., and
    mcdougal2021 ref-19 is Lloyd & Nadeau 2021; 0 stated relations; 0 cited.yaml links) adds
    three proposed relations in lloyd2024/relations.yaml and documents three structural/curve-port
    gaps that ModelAtlas cannot test directly: (1) Scale area vs. bounding-box geometry:
    mcdougal2021/scale_bounding_box_geometry (S = 2*(L*W + L*T + W*T)) scales identically with
    lloyd2024/scale_rectangular_area (A = L*W) in the thin flattened-lamina regime (T in
    [0.05, 0.20] um around McDougal's ~100 nm mature lower lamina, edge contribution < 0.9%,
    differing by the exact factor of 2 between two-sided 3D envelope S -> 2*A and one-sided 2D
    SEM projection A), whereas in mcdougal2021's developing pupal scales (T = 4.31-6.27 um,
    W = 8.58-46.14 um, L = 42.2-178.9 um, Fig. 5C-E), lateral walls 2*T*(L+W) contribute
    12.4%-87.9% of 2*L*W (dropping d ln S / d ln W to 0.61-0.92), and strongly varying T(t)
    decouples volume V(t) from area A(t) (Fig. 5F). (2) Pupal staging algebraic inverses: both
    papers normalize pupal morphogenesis via p_dev/100 = t/T_pupal (H. sara 8 d, M. helenor 14 d,
    P. arcas 14-21 d in lloyd2024 vs. V. cardui ~10 d +- <=2 d in mcdougal2021), but
    lloyd2024/pupal_development_time_from_percent solves for elapsed time t(p_dev, T_pupal),
    whereas mcdougal2021/pupal_development_percent solves for p_dev(t, T_pupal) (incompatible
    output dimension) and pupal_duration_from_checkpoint solves for T_pupal(t, p_dev) (opposite
    p_dev scaling exponent +1 vs. -1); no directed relation is forced without a stated relation
    justifying a helper model. (3) Curve-port profile analyzers (untestable in ModelAtlas):
    lloyd2024/afm_ridge_height_from_profile extracts adult AFM ridge heights above a single
    global profile minimum min(z) without tilt detrending (H ~ 1.0-1.5 um, SI Fig. 12), whereas
    mcdougal2021/profile_slope_rotation_and_peaks (and scalar ridge_peak_height_baseline) first
    rotates out the OLS linear slope (-arctan(m)) and measures developing protoridge peaks above
    the local chord connecting adjacent troughs (H ~ 40-100 nm, Fig. 5H / SI Fig. S10C) — so
    global-minimum subtraction overestimates ridge height relative to local-chord baseline on
    tilted or undulating scans. Likewise, lloyd2024/correlation_peak_ridge_spacing (first non-zero
    lag peak of 1D X-ray electron-density autocorrelation G_z(y)) and
    mcdougal2021/dominant_spatial_frequency_fft_1d (zero-padded 1D FFT dominant frequency -> 1/freq)
    are real-space/Fourier duals operating on distinct curve inputs. All optical/phase-unwrapping
    models in mcdougal2021 and statistical/stoichiometric models in lloyd2024 are disjoint.

