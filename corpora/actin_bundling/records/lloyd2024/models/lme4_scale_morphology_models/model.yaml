id: lme4_scale_morphology_models
name: R lme4 linear mixed-effects models for adult H. sara wing scale morphology (p. 13)
role: fit
runnable: false
not_runnable_reason: >
  Individual-scale SEM dataset (800 scales across 20 individuals) and the R scripts
  referenced on p. 13 ('See Supplementary Information for the R scripts and data') are
  not present in the main article or SI PDF (processed imaging data are archived externally
  on University of Sheffield ORDA/Figshare, DOI 10.15131/shef.data.c.7114033).
stated:
  page: 13
  printed_page: "13"
  quote: "we constructed a linear mixed effect model for each response variable"
  where: "Statistical and reproducibility (R v3.5.2, lme4, emmeans)"
described_from: ref-59
inputs:
  scale_area_in: {quantity: scale_area, unit: um^2}
  scale_width_in: {quantity: scale_width, unit: um}
  scale_length_in: {quantity: scale_length, unit: um}
  ridge_spacing_in: {quantity: ridge_spacing, unit: um}
  ridge_width_in: {quantity: ridge_width, unit: um}
outputs:
  lrt_chi2: {quantity: chi_squared_statistic, unit: dimensionless}
  lrt_p: {quantity: p_value, unit: dimensionless}
settings:
  r_version: "3.5.2"
  package: "lme4"
  posthoc_package: "emmeans"
stochastic: false
