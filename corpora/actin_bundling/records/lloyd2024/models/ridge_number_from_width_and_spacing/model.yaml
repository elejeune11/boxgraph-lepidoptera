id: ridge_number_from_width_and_spacing
name: ridge number inverted from scale width and average ridge spacing
role: processing
from_words: true
built_from:
  - ridge_spacing_from_width_and_count
stated:
  page: 20
  printed_page: "SI 5"
  quote: "The average ridge spacing was calculated as scale width divided by total number of ridges"
  where: "SI Methods (algebraic inverse of s = W / N)"
equation: "N = W / s"
inputs:
  W: {quantity: scale_width, unit: um}
  s: {quantity: ridge_spacing, unit: um}
outputs:
  N: {quantity: ridge_number, unit: dimensionless}
settings: {}
stochastic: false
