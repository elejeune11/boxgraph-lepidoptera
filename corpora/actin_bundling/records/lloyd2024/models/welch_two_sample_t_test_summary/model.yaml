id: welch_two_sample_t_test_summary
name: Welch two-sample t-test from printed group means, standard errors, and sample sizes (p. 10, SI p. 6)
role: processing
from_words: true
stated:
  page: 21
  printed_page: "SI 6"
  quote: "Average ridge curvature was calculated per scale and comparisons performed using a Welch two-sample t-test"
  where: "SI Methods (Phenotypic analyses of actin perturbation; also p. 10)"
equation: "t = (m1 - m2)/sqrt(se1^2 + se2^2); df = (se1^2 + se2^2)^2 / (se1^4/(n1-1) + se2^4/(n2-1)); p = 2*(1 - F_{t,df}(|t|))"
inputs:
  mean_control: {quantity: ridge_curvature, unit: 1/um}
  se_control: {quantity: ridge_curvature_se, unit: 1/um}
  n_control: {quantity: scale_count, unit: dimensionless}
  mean_treated: {quantity: ridge_curvature, unit: 1/um}
  se_treated: {quantity: ridge_curvature_se, unit: 1/um}
  n_treated: {quantity: scale_count, unit: dimensionless}
outputs:
  t_stat: {quantity: t_statistic, unit: dimensionless}
  df: {quantity: degrees_of_freedom, unit: dimensionless}
  p_value: {quantity: p_value, unit: dimensionless}
settings: {}
stochastic: false
