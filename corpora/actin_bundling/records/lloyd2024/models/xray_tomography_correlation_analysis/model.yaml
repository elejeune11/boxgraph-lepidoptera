id: xray_tomography_correlation_analysis
name: synchrotron X-ray nanotomography 3D reconstruction and electron-density correlation function (p. 3, SI pp. 2-3, 8)
role: processing
runnable: false
not_runnable_reason: >
  Raw 11 keV PETRA III Zernike phase-contrast TXM projection stacks, machine-learning
  denoised 3D volumes (TomoPy / PyHST), and the exact 1D correlation function formula and
  normalization (deferred to Strobl & Schneider 1980, ref-38, and Burg 2018 thesis, si-ref-5)
  are not printed in the article or SI PDF.
stated:
  page: 18
  printed_page: "SI 3"
  quote: "Values of ridge spacing and cross-rib spacing were extracted from the reconstructed images using correlation function analysis"
  where: "SI Methods (Synchrotron X-ray nanotomography; also p. 3, SI Fig. 1)"
described_from: ref-38
inputs:
  pixel_size: {quantity: effective_pixel_size, unit: nm}
  xray_energy: {quantity: xray_photon_energy, unit: keV}
  rotation: {quantity: rotation_angle, unit: deg}
outputs:
  ridge_spacing: {quantity: ridge_spacing, unit: nm}
  crossrib_spacing: {quantity: crossrib_spacing, unit: nm}
settings:
  reconstruction_software: "TomoPy + PyHST + ML denoising"
  effective_pixel_size_nm: 22.8
  energy_keV: 11
  rotation_deg: 180
stochastic: false
