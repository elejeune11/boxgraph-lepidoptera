id: correlation_peak_ridge_spacing
name: ridge spacing from first non-zero peak of 1D correlation function G_z(y) (SI Fig. 1E-F)
role: processing
from_words: true
stated:
  page: 23
  printed_page: "SI 8"
  quote: "Extraction of morphological parameters from the rendered images using correlative function analysis"
  where: "SI Fig. 1E-F (G_z(y) correlation peak)"
equation: "s_ridge = argmax_{r > r_min} G_z(r) (first non-zero local maximum)"
inputs:
  corr_curve:
    quantity: normalized_correlation
    unit: dimensionless
    curve:
      quantity: correlation_lag_distance
      unit: nm
outputs:
  s_ridge: {quantity: ridge_spacing, unit: nm}
settings:
  min_lag_nm: 200.0
  min_prominence: 0.0002
stochastic: false
