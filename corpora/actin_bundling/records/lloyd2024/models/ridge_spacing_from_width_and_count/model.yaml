id: ridge_spacing_from_width_and_count
name: average ridge spacing from scale width and ridge number (SI p. 5)
role: processing
from_words: true
stated:
  page: 20
  printed_page: "SI 5"
  quote: "The average ridge spacing was calculated as scale width divided by total number of ridges"
  where: "SI Methods (SEM Analysis of adult scale H. sara morphology)"
equation: "s = W / N"
inputs:
  W: {quantity: scale_width, unit: um}
  N: {quantity: ridge_number, unit: dimensionless}
outputs:
  s: {quantity: ridge_spacing, unit: um}
settings: {}
stochastic: false
