id: huygens_cmle_sted_deconvolution
name: Huygens Professional CMLE deconvolution and MIP orthogonal slicing of TauSTED Z-stacks (SI p. 4)
role: processing
runnable: false
not_runnable_reason: >
  Raw Leica TCS SP8 TauSTED Z-stack files, estimated per-image SNR and optical PSF
  parameters, and the proprietary Huygens Professional v23.10 Classic Maximum Likelihood
  Estimation (CMLE) deconvolution implementation are not printed in the PDF.
stated:
  page: 19
  printed_page: "SI 4"
  quote: "the recommended CMLE (Classic Maximum Likelihood Estimation) was used as the deconvolution algorithm"
  where: "SI Methods (TauSTED microscopy)"
inputs:
  bg_area: {quantity: deconvolution_background_size, unit: um}
  quality_threshold: {quantity: deconvolution_quality, unit: dimensionless}
outputs:
  z_depth: {quantity: z_depth_range, unit: nm}
settings:
  software: "Huygens Professional v23.10"
  algorithm: "CMLE"
  background_area_um: 0.7
  quality_threshold: 0.01
  background_search: "widefield"
  psf_estimation: "conservative optimization"
  ortho_projection: "MIP (compress contrast)"
stochastic: false
