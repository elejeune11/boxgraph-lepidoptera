id: correlation_peak_crossrib_spacing
name: crossrib spacing from first non-zero peak of 1D correlation function G_x(z) (SI Fig. 1G-H)
role: processing
from_words: true
built_from:
  - correlation_peak_ridge_spacing
stated:
  page: 24
  printed_page: "SI 9"
  quote: "Extraction of cross-rib spacing of the iridescent (G) and non-iridescent scale (H)"
  where: "SI Fig. 1G-H (G_x(z) correlation peak)"
equation: "s_crossrib = argmax_{r > r_min} G_x(r) (first non-zero local maximum)"
inputs:
  corr_curve:
    quantity: normalized_correlation
    unit: dimensionless
    curve:
      quantity: correlation_lag_distance
      unit: nm
outputs:
  s_crossrib: {quantity: crossrib_spacing, unit: nm}
settings:
  min_lag_nm: 200.0
  min_prominence: 0.00005
stochastic: false
