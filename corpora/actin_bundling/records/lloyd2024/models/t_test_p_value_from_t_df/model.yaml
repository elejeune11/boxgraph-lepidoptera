id: t_test_p_value_from_t_df
name: two-sided Student t-test p-value from t statistic and degrees of freedom
role: processing
from_words: true
stated:
  page: 13
  printed_page: "13"
  quote: "Given the lower sample size we performed a paired t-test"
  where: "Statistical and reproducibility (also pp. 9-10, SI pp. 2, 6)"
equation: "p = 2 * (1 - F_{t, df}(|t|))"
inputs:
  t_stat: {quantity: t_statistic, unit: dimensionless}
  df: {quantity: degrees_of_freedom, unit: dimensionless}
outputs:
  p_value: {quantity: p_value, unit: dimensionless}
settings: {}
stochastic: false
