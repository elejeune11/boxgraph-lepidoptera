id: pavo_reflectance_spectral_analysis
name: R PAVO reflectance spectrum smoothing, peak brightness extraction, and group averaging (SI p. 6)
role: processing
runnable: false
not_runnable_reason: >
  Raw Ocean Optics USB2000+ reflectance spectra for the 21 cyto-D treated and 15 control
  forewings, the PAVO 'procspec' smoothing span/options, and the specific brightness summary
  metric tested by the t-test (t = 4.34, df = 33, p < 0.001 on p. 9) are not printed in the PDF.
stated:
  page: 21
  printed_page: "SI 6"
  quote: "Data was analysed in R, using the package PAVO (v. 2.4.0)"
  where: "SI Methods (Reflectance spectroscopy; Maia et al. 2013, si-ref-12)"
described_from: si-ref-12
inputs:
  wavelength_range: {quantity: wavelength, unit: nm}
  angle_range: {quantity: reflectance_angle, unit: deg}
  boxcar_width: {quantity: boxcar_smoothing_width, unit: nm}
  integration_time: {quantity: integration_time, unit: ms}
outputs:
  brightness_t: {quantity: t_statistic, unit: dimensionless}
  brightness_df: {quantity: degrees_of_freedom, unit: dimensionless}
  brightness_p: {quantity: p_value, unit: dimensionless}
settings:
  pavo_version: "2.4.0"
  integration_time_ms: 350
  scans_averaged: 5
  boxcar_width_nm: 3
  functions: ["procspec", "peakshape", "aggplot"]
stochastic: false
