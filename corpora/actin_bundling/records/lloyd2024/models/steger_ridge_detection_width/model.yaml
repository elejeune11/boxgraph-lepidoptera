id: steger_ridge_detection_width
name: FIJI Steger Ridge Detection curvilinear width extraction for adult ridges and developing actin bundles (SI p. 5)
role: processing
runnable: false
not_runnable_reason: >
  Raw 600x600 px adult SEM crops (400 scales) and 100x100 px sum-sliced confocal Z-stack
  crops (120 scales), plus manual per-image brightness/contrast adjustments and variable
  confocal upper thresholds (12.58 to 21.93), are not in the PDF.
stated:
  page: 20
  printed_page: "SI 5"
  quote: "Ridge width was calculated using the Ridge Detection plugin"
  where: "SI Methods (adult SEM and confocal actin bundle width; Steger 1998, si-ref-11)"
described_from: si-ref-11
inputs:
  sigma: {quantity: algorithm_parameter, unit: dimensionless}
  lower_threshold: {quantity: algorithm_parameter, unit: dimensionless}
  upper_threshold: {quantity: algorithm_parameter, unit: dimensionless}
outputs:
  ridge_width: {quantity: ridge_width, unit: um}
  actin_bundle_width: {quantity: actin_bundle_width, unit: um}
settings:
  sem_crop_px: 600
  sem_sigma: 3.10
  sem_lower_threshold: 0.51
  sem_upper_threshold: 3.40
  sem_min_line_length: 40.00
  sem_max_line_length: 0.00
  confocal_crop_px: 100
  confocal_sigma: 1.22
  confocal_lower_threshold: 4.76
  confocal_upper_threshold_range: [12.58, 21.93]
  confocal_min_line_length: 10.00
  confocal_max_line_length: 0.00
stochastic: false
