id: pupal_development_time_from_percent
name: elapsed pupal development time from developmental percentage and pupal duration (p. 12)
role: processing
from_words: true
stated:
  page: 12
  printed_page: "12"
  quote: "recorded as a percentage of pupal development, with H. sara and M."
  where: "Methods (Butterfly rearing)"
equation: "t = (p_dev / 100) * T_pupal"
inputs:
  p_dev: {quantity: pupal_development_percent, unit: percent}
  T_pupal: {quantity: pupal_duration, unit: day}
outputs:
  t_days: {quantity: elapsed_pupal_time, unit: day}
  t_hours: {quantity: elapsed_pupal_time, unit: hour}
settings: {}
stochastic: false
