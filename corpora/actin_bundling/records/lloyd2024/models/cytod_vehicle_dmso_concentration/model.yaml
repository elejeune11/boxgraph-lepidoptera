id: cytod_vehicle_dmso_concentration
name: reconstructed DMSO vehicle concentration in diluted Cytochalasin D injection solution
role: processing
reconstructed: >
  Main p. 12 states that ready-made Cytochalasin D stock (5 mg/ml in DMSO) was diluted to
  a final concentration of '20 μm' (intended 20 uM) in Grace's insect medium and that
  controls received '5 μl of 20 μm DMSO', without computing the actual DMSO concentration
  carried over from the stock dilution. This reconstructed stoichiometric check computes
  the stock molarity, dilution factor, and actual working-solution DMSO molarity.
stated:
  page: 12
  printed_page: "12"
  quote: "solution (Merck) (5 mg/ml in DMSO) was diluted to a final concentration"
  where: "Methods (Chemical perturbation of actin)"
equation: "c_stock = rho_stock / MW; D = c_stock / c_target; c_DMSO = c_neat_DMSO / D"
inputs:
  rho_stock: {quantity: mass_concentration, unit: mg/ml}
  MW_cytod: {quantity: molar_mass, unit: g/mol}
  c_target: {quantity: molar_concentration, unit: uM}
  c_neat_dmso: {quantity: molar_concentration, unit: M}
outputs:
  c_stock: {quantity: molar_concentration, unit: mM}
  dilution_factor: {quantity: dilution_factor, unit: dimensionless}
  c_dmso_working: {quantity: molar_concentration, unit: uM}
settings: {}
stochastic: false
