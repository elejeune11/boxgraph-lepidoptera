id: pupal_emergence_chi_squared
name: pupal emergence rate and 2x2 Pearson chi-squared test (p. 13, SI p. 6)
role: processing
from_words: true
stated:
  page: 21
  printed_page: "SI 6"
  quote: "no significant difference in emergence rate between cyto-D and controls (χ2 (1) = 0.0211, p = 0.884)"
  where: "SI Methods (Cyto-d manipulation; also p. 13)"
equation: "N_tot = N_t + N_c; r = 100*(E_t + E_c)/N_tot; chi2 = sum((O_ij - E_ij)^2 / E_ij); p = 1 - F_{chi2,1}(chi2)"
inputs:
  n_treated_injected: {quantity: individual_count, unit: dimensionless}
  n_control_injected: {quantity: individual_count, unit: dimensionless}
  n_treated_emerged: {quantity: individual_count, unit: dimensionless}
  n_control_emerged: {quantity: individual_count, unit: dimensionless}
outputs:
  n_total_injected: {quantity: individual_count, unit: dimensionless}
  emergence_rate: {quantity: emergence_rate, unit: percent}
  chi2: {quantity: chi_squared_statistic, unit: dimensionless}
  p_value: {quantity: p_value, unit: dimensionless}
settings:
  yates_correction: false
stochastic: false
