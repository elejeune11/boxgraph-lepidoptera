id: actin_templated_ridge_spacing
name: adult cover ridge spacing predicted from 1:1 developing F-actin bundle templating
role: model
from_words: true
built_from:
  - ridge_spacing_from_width_and_count
stated:
  page: 3
  printed_page: "3"
  quote: "closely matched the mean number of ridges measured in adult cover"
  where: "text (combining 1:1 actin-to-ridge matching p. 3 with s = W / N on SI p. 5)"
equation: "s = W / N_actin"
inputs:
  W: {quantity: scale_width, unit: um}
  N_actin: {quantity: actin_bundle_number, unit: dimensionless}
outputs:
  s: {quantity: ridge_spacing, unit: um}
settings: {}
stochastic: false
