id: afm_ridge_height_from_profile
name: AFM cuticle ridge height from transverse surface height profile (SI p. 7, Fig. S12)
role: processing
from_words: true
stated:
  page: 22
  printed_page: "SI 7"
  quote: "ridge height measurements were calculated using the absolute minimum value of the data to the top of the ridge peak"
  where: "SI Methods (Phenotypic analyses of actin perturbation; also SI Fig. 12 caption p. 36)"
equation: "H_mean = mean_k(z_peak,k - min(z)); H_max = max(z) - min(z)"
inputs:
  profile:
    quantity: surface_height
    unit: um
    curve:
      quantity: lateral_profile_position
      unit: um
outputs:
  H_mean: {quantity: ridge_height, unit: um}
  H_max: {quantity: ridge_height, unit: um}
settings:
  min_prominence_um: 0.2
  min_distance_um: 0.4
stochastic: false
