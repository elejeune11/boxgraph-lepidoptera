id: kappa_bspline_ridge_curvature
name: FIJI Kappa open B-spline Point Distance Minimization ridge curvature measurement (SI p. 6)
role: processing
runnable: false
not_runnable_reason: >
  High-magnification SEM micrographs of cyto-D treated and control scales and the manually
  placed B-spline control points along 10 ridges per scale are not included in the PDF.
stated:
  page: 21
  printed_page: "SI 6"
  quote: "The Fiji package Kappa (13) was used to acquire measurements of curvature (κ) for 10 ridges per scale"
  where: "SI Methods (Phenotypic analyses of actin perturbation; Mary & Brouhard 2019, si-ref-13)"
described_from: si-ref-13
inputs:
  data_threshold_radius: {quantity: algorithm_parameter, unit: dimensionless}
  global_threshold_level: {quantity: algorithm_parameter, unit: dimensionless}
  local_error_threshold: {quantity: algorithm_parameter, unit: dimensionless}
outputs:
  kappa: {quantity: ridge_curvature, unit: 1/um}
settings:
