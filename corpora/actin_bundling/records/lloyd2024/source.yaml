notes: >
  Full quantitative reading of Lloyd et al. (2024), covering both the main Nature
  Communications article (PDF pp. 1-15, including Methods, Statistical & reproducibility,
  and References 1-62) and 100% of the Supplementary Information (PDF pp. 16-37 / SI pp.
  1-22: Supplementary results, Methods, Supplementary Figs. 1-12, and SI References 1-13).
  No other record currently in the actin_bundling corpus is cited by Lloyd et al. (2024)
  (ref-2 is McDougal et al. 2019 J. Opt. review, not mcdougal2021 PNAS).

  Scope included (201 data entries, 4 added inputs, 23 models [15 runnable, 8 non-runnable],
  34 runs, 36 comparisons, 16 open questions, 75 references):
  - Runnable morphological, developmental, statistical, and stoichiometric models:
    * scale_rectangular_area (A = L * W, SI p. 5)
    * ridge_spacing_from_width_and_count (s = W / N, SI p. 5),
      ridge_number_from_width_and_spacing (N = W / s), and
      actin_templated_ridge_spacing (s = W / N_actin, p. 3 & SI p. 5)
    * pupal_emergence_chi_squared (total injected, emergence %, 2x2 Pearson chi2 and p,
      p. 13 & SI p. 6)
    * welch_two_sample_t_test_summary (Welch t, Welch-Satterthwaite df, two-sided p from
      printed group means, SEs, and n, p. 10 & SI p. 6)
    * t_test_p_value_from_t_df and chi_squared_p_value_from_stat_df (exact p-value checks
      for all 4 t-tests and 9 LRT chi-squared tests across pp. 3, 9-10, SI p. 2)
    * sampling_scale_count_two_regions and sampling_scale_count_per_group (sampling design
      accounting across adult H. sara SEM, H. e. demophoon SEM, and Cyto-D SEM)
    * pupal_development_time_from_percent (t = (p_dev / 100) * T_pupal, p. 12)
    * cytod_vehicle_dmso_concentration (reconstructed stoichiometry check of DMSO carryover
      from 5 mg/ml Cyto-D stock diluted to 20 uM vs printed control '20 μm DMSO', p. 12)
    * Three curve-port models ready for the digitize stage: afm_ridge_height_from_profile
      (SI p. 7, Fig. S12A-B), correlation_peak_ridge_spacing (SI Fig. 1E-F), and
      correlation_peak_crossrib_spacing (SI Fig. 1G-H).
  - Non-runnable models (raw images/spectra/volumes or proprietary/external R scripts not in
    the PDF; each documented in questions.yaml): lme4_scale_morphology_models,
    lme4_actin_bundle_models, xray_tomography_correlation_analysis,
    steger_ridge_detection_width, kappa_bspline_ridge_curvature,
    pavo_reflectance_spectral_analysis, huygens_cmle_sted_deconvolution, and
    multilayer_ridge_bragg_optics (note: the paper contains no printed thin-film, Bragg,
    SAXS, reflectance, or elastic-buckling equations).
  - Complete quantitative extraction of adult H. sara X-ray nanotomography (SI Fig. 1E-H red
    peak values), adult H. sara and H. e. demophoon SEM morphology, developing 50% F-actin
    bundle width/spacing/number, TauSTED developmental checkpoints and Z-depth colorbar
    spans across H. sara, P. arcas, and M. helenor, Cytochalasin D emergence/reflectance/
    curvature/ridge-number/AFM metrics, and all rearing, staining, TEM, AFM, TXM, TauSTED,
    SpectraSuite/PAVO, Ridge Detection, and Kappa protocol parameters.

  Key consistency findings and discrepancies (all recorded in questions.yaml):
  1. Reproduced core statistics: Pupal emergence accounting (42 + 34 = 76; 53/76 = 69.74% ->
     70%; uncorrected Pearson chi2 = 0.02113 -> 0.0211; p = 0.8844 -> 0.884), Cyto-D ridge
     number p-value (t = -0.41, df = 5 -> 0.6988 -> 0.70), H. e. demophoon paired t-test
     p-value (t = 1.94, df = 4 -> 0.1244, 0.1233-0.1255 with input rounding -> 0.125),
     ridge-width type LRT p-value (chi2 = 0.24, df = 1 -> 0.6242, 0.6206-0.6278 -> 0.622),
     and all four adult scale rectangular area checks (E[L]*E[W] reproduces printed E[L*W]
     within +0.18 to +0.25 SE). All 8 significant LRT chi2 tests (including actin bundle
     number chi2 = 11 with omitted df, which requires df = 1 to reach p = 0.00091 < 0.001)
     and both significant t-tests satisfy their printed p-value inequalities.
  2. Cyto-D ridge curvature SE vs Welch t-test discrepancy (NOT REPRODUCED): Main p. 10
     prints mean ± SE curvature (treated 0.0566 ± 0.0018 um^-1, control 0.0158 ± 0.0006
     um^-1; Welch t = -2.78, df = 12, p < 0.05). Running Welch's t-test on those printed
     values yields t = -21.50 (p = 8.7e-12; df = 13.41 at n = 12 or df = 23.17 at n = 20).
     Visual SD bars in Fig. 8O (~0.050 and ~0.009 um^-1) imply scale-level SEs of ~0.0144
     and ~0.0026 um^-1 at n = 12, which DO reproduce t ~ -2.79 and df ~ 11.7 (~12); thus
     the printed SEs are ~8x and ~4x too small.
  3. Fig. 8N/8O double swap: Main text pp. 9-10 swaps panel references (citing 8O for ridge
     number and 8N for curvature), and Fig. 8 caption (p. 11) swaps sample sizes (printing
     n = 12 for ridge number and n = 20 for curvature, opposite to SI p. 6 and the actual
     dot counts in Fig. 8N [20/group] and Fig. 8O [12/group]).
  4. SI Fig. 12C (p. 36) 1000x unit error: y-axis ticks 1000-1400 (nm, matching AFM profiles
     0-1.21 um and 0-1.85 um in Fig. 12A-B) are mislabeled 'Ridge height (μm)' in both axis
     and caption.
  5. SEM scale-count discrepancies: p. 3 prints '400 scales' vs 800 from the stated 20 x 2 x
     (10+10) design (p. 13, SI Fig. 5), while SI Fig. 5 caption states n = 800 for panel C
     (ridge width) although SI p. 5 specifies 5+5 scales/region (400 scales total).
  6. Cyto-D concentration unit typo and DMSO vehicle mismatch: p. 12 twice prints lowercase
     '20 μm' instead of '20 μM'; moreover, diluting 5 mg/ml Cyto-D in neat DMSO to 20 uM
     carries over ~28.6 mM (28,589 uM, 0.203% v/v) DMSO, 1430x higher than the literally
     printed '20 μm [uM] DMSO' control.
  7. Additional verified issues: SI Fig. 1G crossrib spacing 483.76 nm truncated to 0.483 um
     in text (p. 3, SI p. 2) rather than rounded to 0.484 um; SI Fig. 10 (p. 34) colors
     TREATED_1B/1E/1F red (CONTROL) in panel A and TREATED_1E/1F red in panel B; H. e.
     demophoon SI Methods (p. 20) writes 'distal hindwing' vs 'distal forewing' on SI pp. 2,
     14; p. 13 promises R scripts and data in SI that are absent from the SI PDF; plus minor
     figure cross-ref and duplicate-reference (refs 20 & 45) errors.

