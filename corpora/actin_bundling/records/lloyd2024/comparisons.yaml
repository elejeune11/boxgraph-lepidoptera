# 5. Consistency checks: 1:1 developing actin bundle templating -> adult ridge spacing
# ============================================================================

- id: cmp_actin_templated_spacing_black
  purpose: consistency
  computed: actin_templated_spacing_black_pred
  printed: sem_ridge_spacing_black
  conditions_ok: "Comparing 50% pupal F-actin bundle count (cover scales) propagated via s = W / N_actin against adult black scale ridge spacing (no cover/ground difference, Tukey p = 0.633)."
  note: "31.3 um / 32 = 0.9781 um vs adult black ridge spacing 0.962 ± 0.004 um (reproduced once input ± SE on N_actin = 32 ± 1.1 is propagated)."

- id: cmp_actin_templated_spacing_blue
  purpose: consistency
  computed: actin_templated_spacing_blue_pred
  printed: sem_ridge_spacing_blue
  conditions_ok: "Comparing 50% pupal F-actin bundle count (blue cover scales) propagated via s = W / N_actin against pooled adult blue cover+ground ridge spacing."
  note: "29.5 um / 40 = 0.7375 um (matches Fig. S5A blue cover median ~0.75 um) vs pooled blue cover+ground 0.804 ± 0.007 um (cover scales have significantly smaller spacing than ground scales, Tukey p < 0.001)."

