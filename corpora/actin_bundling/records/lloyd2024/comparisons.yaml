# ============================================================================
# 1. Core reproductions: Pupal emergence rate and 2x2 chi-squared test (SI p. 6)
# ============================================================================

- id: cmp_cytod_total_injected
  purpose: reproduction
  computed: cytod_total_injected_pred
  printed: cytod_pupae_total_injected
  note: "42 cyto-D + 34 control = 76 total injected pupae."

- id: cmp_cytod_emergence_rate
  purpose: reproduction
  computed: cytod_emergence_rate_pred
  printed: cytod_emergence_rate_overall
  note: "(29 + 24) / 76 = 69.74% reproduces printed 70% emergence rate."

- id: cmp_cytod_emergence_chi2
  purpose: reproduction
  computed: cytod_emergence_chi2_pred
  printed: cytod_emergence_chi2
  note: "Uncorrected 2x2 Pearson chi-squared gives 0.02113, reproducing printed 0.0211."

- id: cmp_cytod_emergence_p
  purpose: reproduction
  computed: cytod_emergence_p_pred
  printed: cytod_emergence_p
  note: "Upper-tail chi2(1) p-value gives 0.8844, reproducing printed 0.884."

