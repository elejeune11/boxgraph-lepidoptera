- id: lrt_actin_df_added
  quantity: degrees_of_freedom
  unit: dimensionless
  printed: "1"
  alternatives: ["2"]
  basis: >
    Main p. 3 omits d.f. for the three developing actin bundle likelihood ratio tests
    (bundle width chi2 = 19, bundle spacing chi2 = 40, bundle number chi2 = 11).
    Because these are two-group comparisons (iridescent vs non-iridescent wing region)
    in an intercept-only linear mixed-effects model (p. 13), dropping the binary region
    fixed effect removes 1 degree of freedom (df = 1). Confirming this, chi2 = 11 gives
    p = 0.00091 (< 0.001 as printed) for df = 1, whereas df = 2 gives p = 0.0041 (> 0.001).
  stands_for: "omitted d.f. in p. 3 confocal actin LRTs"

- id: cytod_molar_mass_added
  quantity: molar_mass
  unit: g/mol
  printed: "507.62"
  alternatives: ["507.6", "508"]
  basis: >
    Standard IUPAC molecular weight of Cytochalasin D (C30H37NO6, 507.62 g/mol, Merck
    ready-made 5 mg/ml DMSO stock), not printed in the paper, required to convert the
    printed 5 mg/ml stock mass concentration to molarity and compute the vehicle DMSO
    dilution factor.
  stands_for: "molecular weight of Cytochalasin D"

- id: dmso_neat_molarity_added
  quantity: molar_concentration
  unit: M
  printed: "14.08"
  alternatives: ["14.0", "14.1"]
  basis: >
    Molarity of neat liquid dimethyl sulfoxide (DMSO) at 25 degC (density 1.100 g/mL
    divided by MW 78.13 g/mol = 14.08 M), not printed in the paper, required to estimate
    the resulting DMSO concentration in the diluted Cytochalasin D working solution.
  stands_for: "molarity of neat DMSO solvent in Merck 5 mg/ml Cytochalasin D stock"

- id: adult_cover_ridge_number_illustrative_added
  quantity: ridge_number
  unit: dimensionless
  printed: "33"
  alternatives: ["30", "39"]
  basis: >
    Illustrative adult cover-scale ridge count within the H. sara cover-scale range of
    Fig. 2D/L (~30-42 ridges) used to exercise ridge_spacing_from_width_and_count (SI p. 5)
    prior to calibrated figure digitization.
  stands_for: "total number of ridges N in s = W / N (SI p. 5)"
