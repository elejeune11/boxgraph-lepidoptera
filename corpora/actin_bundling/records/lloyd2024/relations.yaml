# 3. Pair: lloyd2024 + totz2024
#    (Totz et al., Cell Reports Physical Science 5, 102063, 2024; co-published
#    in 2024; neither paper cites the other; 0 stated relations; 0 proposed
#    relations; 0 cited.yaml links).
#    Full audit across all 23 lloyd2024 models and all 34 totz2024 models finds
#    the two records mathematically complementary with 0 formal model relations:
#    - lloyd2024 invokes Ghiradella's (1974) stress-buckling hypothesis and
#      cytoplasmic pressure only qualitatively (p. 12, non-runnable
#      multilayer_ridge_bragg_optics) and prints zero Foppl-von-Karman buckling
#      or elasticity equations; totz2024 has 29 FvK thin-plate buckling / Hooke
#      elasticity models and 5 local processing helpers, with zero morphometric
#      area, pupal-timing, stoichiometry, or statistical-test models.
#    - Curve-port ridge-height analyzers (untestable in ModelAtlas):
#      lloyd2024/afm_ridge_height_from_profile (adult AFM global-minimum peak
#      height, ~1.0-1.5 um) vs totz2024/fit_cosine_amplitude (early 39.6-41.0%
#      single-ridge OLS cosine projection, ~24-64 nm).
#    - Spacing models: actin_templated_ridge_spacing (W/N_actin) vs
#      rayleigh_ritz_width_eq3_corrected (FvK buckling balance) share zero input
#      variables; totz2024/scale_bundle_spacing (L = m*L_0) is a 1-op Fig. 2E
#      parameter multiplier (too_plain).
#    See q_totz2024_no_model_relations_and_buckling_synthesis in
#    lloyd2024/questions.yaml.
