# 2. Pair: lloyd2024 + sekine2024
#    (Sekine et al., Nat. Commun. 15, 464, 2024; neither paper cites the other;
#    0 stated relations; 0 proposed relations; 0 cited.yaml links).
#    Full audit across all 23 lloyd2024 models and all 32 sekine2024 models finds
#    no non-trivial model-to-model relations:
#    - Rejected automated shape match: lloyd2024/xray_tomography_correlation_analysis
#      vs sekine2024/cgmd_2d_network ('length from energy, length') is a pure
#      dimensional coincidence (11 keV synchrotron X-ray photon energy vs k_B*T
#      thermal energy; both non-runnable and physically disjoint).
#    - Excluded 1-2 op trivial quotients across unrelated organisms/organs as
#      too_plain (matching sekine2024's own convention in sekine2024+gov2018):
#      ridge_spacing_from_width_and_count (W/N) & actin_templated_ridge_spacing
#      (W/N_actin) vs structure_factor_interval (1/(mu/(2*pi))) &
#      structure_factor_interval_wavenumber (2*pi/mu); pseudo_image_discretization
#      (L_box/N_grid, simulation pixel pitch) and fusion_duration_time (N_frames*dt)
#      measure physically distinct quantities.
#    - lloyd2024 contains no polymer mechanics, Langevin/CGMD, hydrodynamic drag,
#      motor kinetics, or Gaussian Fourier structure-factor models.
#    See q_sekine2024_no_model_relations_and_actin_patterning_contrast in
#    lloyd2024/questions.yaml.
