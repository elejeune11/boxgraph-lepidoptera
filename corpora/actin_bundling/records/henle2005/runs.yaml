- id: run_hex_bonds_bench
  model: hexagonal_bonds_p2
  inputs: {R_over_a: R_over_a_bench_added}
  outputs: {b: b_bench_calc}

- id: run_frustrated_phi_bench
  model: frustrated_attraction_hyperbola_p4
  inputs: {b: b_bench_calc, phi_max: phi_max_fig2_inset, xi: xi_fig2_inset}
  outputs: {phi: phi_bench_calc}

# ---------------------------------------------------------------------------
# DNA + trivalent cobalt hexammine ion-radius threshold (p. 3 col 1)
# ---------------------------------------------------------------------------
