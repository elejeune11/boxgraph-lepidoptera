# ---------------------------------------------------------------------------
# Auxiliary / helper model runs
# ---------------------------------------------------------------------------
- id: run_alpha_b_fig1
  model: available_area_eq2
  inputs: {a: a_fig1, a_0: a0_fig1}
  outputs: {alpha_b: alpha_b_fig1_calc}

- id: run_kappa_fig1_10uM_printed
  model: debye_screening_eq4
  inputs: {l_B: lB_water, n_1: n1_fig1, n_q: nq_fig1_mid, q: q_fig1}
  outputs: {kappa: kappa_fig1_10uM_printed_calc}

