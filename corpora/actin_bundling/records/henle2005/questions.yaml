    Cross-record ModelAtlas, citation, and validation audit for henle2005+tang1996 (0 ModelAtlas
    relations, 0 cited.yaml links, 0 cross-validations).
    (1) Bibliographic clarification & cited.yaml: Although henle2005/ref-4 is a 1996 Tang & Janmey
    paper cited on p. 1 col 1 for counterion-induced bundling of F-actin, microtubules, fd/M13, and
    TMV, ref-4 is J. X. Tang, S. Wong, P. T. Tran & P. A. Janmey, Ber. Bunsenges. Phys. Chem. 100,
    796 (1996) — a distinct publication from the corpus record tang1996 (J. X. Tang & P. A. Janmey,
    J. Biol. Chem. 271, 8556-8563, 1996). Neither record cites the other directly or borrows
    numerical datums from the other (both quote DNA's standard 1/lambda_0 = 1.7 A and l_B = 7.1 A
    independently from Bloomfield 1997 [ref-2] and Manning 1978 [ref-12], respectively).
    (2) ModelAtlas: Both papers build on Manning counterion condensation (1969/1978), but their
    models operate on different observables and regimes: tang1996 implements single-filament
    Manning condensed fraction theta = 1 - 1/(N*zeta) (dimensionless), condensation volume V_P =
    41.1*(zeta - 1)*b^3 [cm^3/mol], competitive ion-exchange scaling K ~ [KCl]^(-N) and [C]_onset
    ~ [KCl]^N, and linear Lys_18 binding vs actin concentration, whereas henle2005 models a dense
    M-rod cylindrical bundle where internal multivalent condensation drives per-rod renormalized
    charge to lambda_rod ~ (2/(l_B*q*M))*ln(lambda_0/(q*n_q*alpha_b)) ~ 1/R^2 [1/nm] and total
    bundle charge to lambda_tot ~ 2/(l_B*q*(1+kappa*w))*ln(...) [1/nm]. No algebraic equivalence or
    shared scaling relation links the existing runnable models without inventing unstated
    conversions.
    (3) Cross-validation: henle2005 has 0 measured datums, and all 58 measured datums in tang1996
    are 90-degree light-scattering curves, polycation bundling onset concentrations (vs KCl or
    actin concentration), and a relative measurement error. None of henle2005's models outputs
    light-scattering intensity or critical counterion onset concentration n_q*(n_1). Furthermore,
    tang1996's key quantitative scaling — Fig. 5b [C]_onset vs [KCl] for Mn^2+ and Co(NH_3)_6^3+ —
    is governed by competitive monovalent/multivalent counterion exchange, which henle2005
    explicitly excludes from its model on p. 1 col 2 ("we assume that only multivalent ions can
    enter inside the bundle (the effects of competitive binding with monovalent ions will be
    discussed in a future paper [23])").
