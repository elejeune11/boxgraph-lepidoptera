  text: >
    The paper states on p. 1 col 2 that positive monovalent (s = +1), positive q-valent (s = q), and
    negative monovalent co-ions (s = -1) are present in an overall charge-neutral system in equilibrium
    with a salt bath, and captions Figs. 1 and 2 by specifying only n_1 and n_q (not n_{-1}). The bulk
    co-ion concentration n_{-1} = n_1 + q*n_q (giving sum_s s^2 n_s = 2*n_1 + q*(q + 1)*n_q in kappa^2)
    is implicit from bulk salt-bath electroneutrality and is confirmed to ~0.001 nm^-1 by Figs. 1 and 2
    (under n_1 = 10 mM).
