    three curves nearly collapse together and all three exhibit a local minimum near R/a ~= 17, directly
    contradicting both the plotted solid curve (which has no minimum) and the text on p. 3 col 2 ("At
    small n_q, ... no minimum in beta*F(R) is obtained"). Replacing n_1 = 10 nM with n_1 = 10 mM
    (a single-letter unit typo, factor 10^6, matching typical experimental monovalent salt concentrations)
    simultaneously reproduces all three curves of Fig. 1 main, both curves of Fig. 1 inset (including the
    asymptotic dashed line at 8.190 nm^-1 vs digitized 8.195 nm^-1), and all three curves of Fig. 2 main
    to within ~0.001-0.004 nm^-1 (sub-pixel precision). Per BoxGraph rules, n1_fig1 is preserved verbatim
    as 10 nM in data.yaml and tested alongside the diagnostic 10 mM hypothesis in added.yaml.
  citation:
