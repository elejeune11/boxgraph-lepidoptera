    - cmp_fig2_inset_1mM_10mM
  text: >
    Even after accounting for the n_1 = 10 mM unit-typo hypothesis (which reproduces Fig. 1 main, Fig. 1
    inset, and Fig. 2 main to ~0.001-0.004 nm^-1), the printed frustrated-attraction model on p. 3-4
    (beta*F_attr = -gamma*L*M*phi(b) with b = B/M = 3 - 3.6*a/R, phi(b) = (1/2)*(b + phi_max)
    - (1/2)*|phi_max - b|*sqrt(1 + xi/(b - phi_max)^2), gamma = 1.7 nm^-1, phi_max = 2, xi = 0.1,
    Delta F(R) = F(R) - F(100a)) does NOT reproduce the Fig. 2 inset curves. For n_q = 1 mM (dotted),
    the printed model predicts beta*Delta F/(N*L) = +0.606 nm^-1 at R/a = 2.0 and a shallow minimum of
    -0.102 nm^-1 near R/a = 4.37, whereas Fig. 2 inset shows -0.186 nm^-1 near R/a = 2.0 (dot at 1.96)
    and a deep minimum of -0.267 nm^-1 near R/a = 2.5 (discrepancy up to 1.43 nm^-1 at R/a = 1.20).
    For n_q = 10 uM (dashed), the printed model has a minimum of -0.470 nm^-1 near R/a = 3.25, whereas
    Fig. 2 inset shows no minimum in the plotted range and drops monotonically below -0.63 nm^-1 at
    R/a = 3.6. Two quantitative clues emerge from the digitized curves: (1) inverting phi(b) from the
    1 mM dots over R/a in [1.20, 2.34] gives (3 - b)*(R/a) = 2.565 +/- 0.015 ~= 3.6/1.4 = 3.6/a,
    suggesting b = 3 - 3.6/R (dropping the factor a = 1.4 nm) may have been evaluated, shifting the saturation knee from R/a = 3.6
    to R/a = 2.57 (which is geometrically impossible for hexagonally packed rods since even M = 7 rods at
    R/a = sqrt(7) = 2.65 only have B/M = 12/7 = 1.71 < 2); and (2) while model-independent double
    differences [F(R, 0.1 uM) - F(R, 1 mM)] - [F(13.3a, 0.1 uM) - F(13.3a, 1 mM)] confirm n_1 = 10 mM
    (rms 0.007 nm^-1), the absolute vertical offset between the 0.1 uM and 1 mM curves is shifted upward
    by ~+0.037 nm^-1 relative to R_ref = 100a (consistent with a smaller reference radius R_ref ~= 25a).
    Because these discrepancies are not attributable to a single evident printed-equation misprint, no
    variant model is added for Fig. 2 inset.
