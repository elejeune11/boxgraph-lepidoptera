- id: q_finite_size_eq6_rhs_sign
  kind: possible_error
  about:
    - finite_size_eq6_printed
    - finite_size_eq6_corrected
    - finite_size_free_energy_p3
    - rel_finite_fe_same_as_eq6_corrected
  text: >
    On p. 3 col 1, after adding the finite-size counterion steric entropy term
    M*L*[(Lambda - lambda_q)*ln(1 - lambda_q/Lambda) + lambda_q] to beta*F_ent, the text states:
    "This adds a term -ln(1 - lambda_q/Lambda) to the right-hand side of Eq. (6), which diverges as
    lambda_q -> Lambda, thus forcing lambda_q < Lambda for any bundle size R." Differentiating the
    printed free-energy term with respect to lambda_q gives d/d(lambda_q)[(Lambda - lambda_q)*
    ln(1 - lambda_q/Lambda) + lambda_q] = -ln(1 - lambda_q/Lambda), which enters the LEFT-HAND side
    of Eq. (6) (i.e., +ln(1 - lambda_q/Lambda) on the right-hand side). Placing -ln(1 - lambda_q/Lambda)
    on the right-hand side produces ln[lambda_q*(1 - lambda_q/Lambda)/(n_q*alpha_b)] - l_B*q*lambda*
    R^2/(2*a^2) - 2*l_B*q*lambda_tot*K_0/(kappa*R*K_1) = 0, whose left-hand side is bounded above and
    strictly negative on all of (0, Lambda) for large R (e.g., max <= -624 at R = 100a and max <= -17.7
    at R = 20a for Fig. 2 parameters), so no real solution exists at R = 100a or near the Fig. 2 minimum.
    Direct numerical minimization of the printed modified free energy (finite_size_free_energy_p3) agrees
    with the corrected LHS Eq. (6) variant (finite_size_eq6_corrected) to ~10^-14 in dF/(N*L) and
    reproduces Fig. 2 (under n_1 = 10 mM).
  citation:
    page: 3
    printed_page: "060801-3"
    quote: "to the right-hand side of Eq."
    where: "text, p. 3 col 1"

- id: q_stern_charge_theta_vs_delta
  kind: possible_error
  about:
    - pointlike_bundle_eq5_eq7
  text: >
    On p. 2 col 1, when modeling the Stern layer as a uniform surface charge (setting w = 0 in the
    electrostatic integral Eq. 3), the text prints e*n_st(x) = theta(R - r) * e*lambda_st / (2*pi*R).
    A surface charge localized at r = R requires a Dirac delta function delta(r - R) (dimension
    1/[length], yielding 3D number density 1/[length]^3), not the Heaviside step function theta(R - r)
    (dimensionless, yielding 1/[length]^2 and a uniform volume charge rather than a surface charge).
    Integrating Eq. (3) with delta(r - R) yields the paper's printed Eqs. (4)-(7) verbatim, confirming
    that theta(R - r) in the Stern-layer definition is a typographical misprint for delta(r - R).
  citation:
    page: 2
    printed_page: "060801-2"
    quote: "charge distributions of a bundle and its"
    where: "text, p. 2 col 1"

- id: q_fig2_inset_unexplained_discrepancy
  kind: unexplained_difference
