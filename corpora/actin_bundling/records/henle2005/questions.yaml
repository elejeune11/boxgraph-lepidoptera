  text: >
    The caption of Fig. 1 (p. 3, inherited by Fig. 2) prints the monovalent salt concentration as
    n_1 = 10 nM. Evaluating the paper's exact Eqs. (2, 5-7) at n_1 = 10 nM fails to reproduce all four
    plotted panels of Figs. 1 and 2: (1) in Fig. 1 main, the solid curve (n_q = 0.1 uM) remains strictly
    positive (+2.42 nm^-1 at R/a = 1) rather than dipping deeply negative and crossing zero near
    R/a ~= 3.8, and the dashed curve (10 uM) is monotonically decreasing instead of peaking near
    R/a ~= 2; (2) in Fig. 1 inset, the asymptotic value of lambda_tot is 10.61 nm^-1 (not 8.19 nm^-1),
