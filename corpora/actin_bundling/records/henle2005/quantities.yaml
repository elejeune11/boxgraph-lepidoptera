- id: rod_radius
  name: polyelectrolyte rod radius
  dimension: "[length]"
  description: "Radius a_0 of an individual rodlike polyelectrolyte."

- id: rod_half_spacing
  name: half rod-rod center-to-center spacing
  dimension: "[length]"
  description: "Half center-to-center distance a between neighboring rods in a hexagonally packed bundle (2a is the center-to-center spacing)."

- id: bundle_radius
  name: cylindrical bundle radius
  dimension: "[length]"
  description: "Radius R of a cylindrical polyelectrolyte bundle (R ~= a * sqrt(M))."

- id: dimensionless_bundle_radius
  name: dimensionless bundle radius
  dimension: "dimensionless"
  description: "Bundle radius scaled by half rod-rod spacing, R/a (= sqrt(M))."

- id: equilibrium_bundle_radius
  name: equilibrium bundle radius
  dimension: "[length]"
  description: "Equilibrium bundle radius R_eq minimizing the free energy beta*F(R)."

- id: equilibrium_dimensionless_bundle_radius
  name: equilibrium dimensionless bundle radius
  dimension: "dimensionless"
  description: "Equilibrium bundle radius scaled by half rod-rod spacing, R_eq/a."

- id: stern_layer_width
  name: Stern layer width
  dimension: "[length]"
  description: "Thickness w of the counterion condensation Stern layer surrounding a bundle (alpha_st ~= 2*pi*R*w)."

- id: bjerrum_length
  name: Bjerrum length
  dimension: "[length]"
  description: "Electrostatic Bjerrum length l_B = e^2 / (epsilon * k_B * T) in aqueous solution."

- id: charge_spacing
  name: bare axial charge spacing
  dimension: "[length]"
  description: "Inverse bare linear charge density lambda_0^-1 along a single polyelectrolyte rod."

- id: bare_linear_charge_density
  name: bare rod linear charge density
  dimension: "1 / [length]"
  description: "Magnitude lambda_0 of bare uniform linear charge density -e*lambda_0 on one rod."

- id: renormalized_rod_charge_density
  name: renormalized rod linear charge density
  dimension: "1 / [length]"
  description: "Renormalized linear charge density lambda = lambda_0 - q*lambda_q of one rod inside a bundle."

- id: residual_charge_fraction
  name: residual linear charge density fraction
  dimension: "dimensionless"
  description: "Dimensionless ratio lambda* / lambda_0 where lambda* = lambda_0 - q*Lambda is the minimum unneutralized linear charge density per rod for finite-size counterions."

- id: bundle_total_linear_charge_density
  name: total bundle and Stern-layer linear charge density
  dimension: "1 / [length]"
  description: "Magnitude lambda_tot = lambda*M - lambda_st of the total effective linear charge density of a bundle plus its Stern layer."

- id: monovalent_salt_concentration
  name: bulk monovalent cation concentration
  dimension: "[substance] / [length] ** 3"
  description: "Bulk molar concentration n_1 of positive monovalent counterions in the salt bath."

- id: multivalent_salt_concentration
  name: bulk multivalent counterion concentration
  dimension: "[substance] / [length] ** 3"
  description: "Bulk molar concentration n_q of positive q-valent counterions in the salt bath."

- id: counterion_valence
  name: multivalent counterion valence
  dimension: "dimensionless"
  description: "Charge valence q of the multivalent counterions."

- id: bond_attraction_strength
  name: rod-rod attractive bond energy per unit length
  dimension: "1 / [length]"
  description: "Phenomenological attraction parameter gamma (in k_B*T per unit length) such that E_bond = -gamma * k_B * T * L."

- id: free_energy_per_rod_length
  name: dimensionless free energy per rod per unit length
  dimension: "1 / [length]"
  description: "Dimensionless free energy difference per rod per unit length beta*Delta F / (N*L) = beta*(F(R) - F(R_ref)) / (N*L)."

- id: available_area_per_rod
  name: available cross-sectional area per rod
  dimension: "[length] ** 2"
  description: "Cross-sectional area alpha_b = pi*(a^2 - a_0^2) available to multivalent counterions per rod inside the bundle."

- id: debye_screening_wavenumber
  name: inverse Debye screening length
  dimension: "1 / [length]"
  description: "Debye-Huckel screening wavenumber kappa = sqrt(4*pi*l_B * sum_s s^2 n_s)."

- id: effective_ion_radius
  name: effective counterion radius
  dimension: "[length]"
  description: "Effective steric/short-range electrostatic radius delta_eff of multivalent counterions inside a bundle."

- id: ion_packing_factor
  name: counterion sphere-to-excluded-volume packing factor
  dimension: "dimensionless"
  description: "Dimensionless geometric packing factor f_pack relating effective per-ion excluded volume v_eff to effective ion radius delta_eff via v_eff = (4*pi/3) * delta_eff^3 / f_pack."

- id: bonds_per_rod
  name: average attractive bonds per rod
  dimension: "dimensionless"
  description: "Average number of pairwise attractive bonds per rod b = B/M (or frustrated effective bond number phi(b))."

- id: frustration_saturation_bonds
  name: frustrated bond saturation parameter
  dimension: "dimensionless"
  description: "Large-b asymptotic saturation value phi_max of the frustrated attraction hyperbola phi(b)."

- id: frustration_sharpness
  name: frustration hyperbola rounding parameter
  dimension: "dimensionless"
  description: "Parameter xi controlling the rate of saturation of the frustrated attraction hyperbola phi(b)."
