- id: ref_pointlike_tol
  run: run_pointlike_scalar_bench
  setting: tol
  factors: [1, 10, 100, 1000]
  mode: divide
  output: dF_over_NL
  tolerance: "0.01%"
  tolerance_basis: "added: well below the ~0.02 nm^-1 figure reading uncertainty"
  tolerance_added: true

