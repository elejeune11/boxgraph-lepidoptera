# ------------------------------------------------------------------------------
# claessens2008 + henle2005
# ------------------------------------------------------------------------------
- id: rel_claessens2008_hexagonal_bonds_approx
  kind: approximated_by
  a: henle2005/hexagonal_bonds_p2
  b: claessens2008/bundle_geometry_saturation
  mapping:
    u: "1"
    n_f: "R_over_a**2"
    sigma: "-1"
  output_map:
    R: b
  regime:
    R_over_a: [2.0, 50.0]
  provenance: proposed
  reason: >
    Both models formulate the same finite-bundle hexagonal-lattice nearest-neighbor bond-counting
    formula B/M = 3 - c/sqrt(M) with filament count M = n_f = (R/a)^2 (bulk 6-neighbor hexagonal
    coordination gives 3 pairwise bonds per rod; surface rods lack exterior neighbors, yielding the
    exact regular-hexagon asymptotic coefficient c = 2*sqrt(3) ~= 3.464). Henle & Pincus (2005,
    p. 2 col 1) use c = 3.6 (b = 3 - 3.6*a/R for all M >= 2), whereas Claessens et al. (2008, SI
    Methods p. 5; citing Henle & Pincus as ref-19 on p. 1) write the saturated cross-linker ratio
    as R = (1/u)*(3 + sigma*3.5*n_f^(-1/2)). Evaluating Claessens' formula per filament hexagonal
    unit (u = 1) with unoccupied exterior surface sites (sigma = -1, counting internal inter-rod
    bridges only) gives 3 - 3.5/(R/a), which matches Henle & Pincus's 3 - 3.6/(R/a) to within 4.0%
    relative error across R/a in [2, 50] (M = 4 to 2500 rods; shrinking below 0.2% by R/a = 20).
  assumptions:
    - "Identifies cylindrical bundle filament count M = (R/a)^2 in henle2005 with n_f in claessens2008."
    - "Specializes claessens2008/bundle_geometry_saturation to u = 1 (bonds per filament hexagonal unit rather than per actin monomer) and sigma = -1 (internal inter-filament bridges only, excluding outer-surface cross-linker binding)."
  tolerance: 0.05

- id: rel_claessens2008_hexagonal_bonds_bulk_limit
  kind: reduces_to
  a: henle2005/hexagonal_bonds_p2
  b: claessens2008/bundle_geometry_bulk_limit
  mapping:
    u: "1"
  output_map:
    R: b
  regime:
    R_over_a: [2.0, 50.0]
  limit:
    R_over_a: "oo"
  provenance: proposed
  reason: >
    In the thermodynamic bulk-bundle limit R/a = sqrt(M) -> infinity, the surface bond deficit
    -3.6*a/R in Henle & Pincus (2005, p. 2 col 1) vanishes and b = B/M converges to the exact
    infinite-hexagonal-lattice value of 3 pairwise bonds per filament, matching Claessens et al.'s
    (2008, SI Methods p. 5) bulk saturation stoichiometry R_inf = 3/u at u = 1.
  assumptions:
    - "Sets u = 1 (one hexagonal unit per filament) and takes the large-bundle limit R/a -> infinity."

# ------------------------------------------------------------------------------
# gov2008 + henle2005
# ------------------------------------------------------------------------------
- id: rel_gov2008_incomp_req_same_as_finite_size_approx
  kind: same_as
  a: henle2005/finite_size_req_approx_p3
  b: gov2008/equilibrium_radius_incompressible_eq9
  mapping:
    a: "a"
    L_p: "inv_lambda_0"
    rho: "(lambda_star_frac / inv_lambda_0)**2"
    alpha_prime: "5 * pi * (inv_lambda_0 / a)**4 * l_B / (36 * gamma)"
  output_map:
    R_0: R_eq
  regime:
    a: [1.0, 10.0]
    gamma: [0.5, 5.0]
    l_B: [0.5, 1.0]
    inv_lambda_0: [0.1, 0.5]
    lambda_star_frac: [0.005, 0.1]
  provenance: proposed
  reason: >
    Exact symbolic identity between two canonical-ensemble equilibrium bundle-radius laws produced
    by the same Rayleigh-type balance of a +1/R surface-tension adhesion deficit against a +R^2
    long-range bulk energy penalty per filament (f(R) = c_1*a/R + c_2*R^2 => R_eq/a =
    (c_1/(2*a^2*c_2))^(1/3)). In Henle & Pincus (2005, Eq. 5 & p. 3 col 2), hexagonal surface-bond
    tension 3.6*gamma*a/R balances unneutralized finite-size counterion electrostatic self-energy
    l_B*lambda_*^2*R^2/(4*a^2) to yield R_eq = a*(7.2*gamma/(l_B*lambda_*^2))^(1/3); in Gov (2008,
    Eqs. 1, 6, 9, pp. 2-4; citing Henle & Pincus as ref-7 on pp. 1, 2, 3), continuum surface
    adhesion deficit 2*pi*eps_b*a/R balances incompressible bulk packing-defect bending energy
    K*rho*a^2*R^2/L_p^4 to yield R_0,b' = a*(pi*(L_p/a)^4/(alpha'*rho))^(1/3) with alpha' = K/eps_b.
    Under the unit-consistent monomial bijection a -> a [nm], L_p -> lambda_0^-1 [nm], rho ->
    lambda_*^2 = (lambda_*/lambda_0)^2/(lambda_0^-1)^2 [1/nm^2], and alpha' ->
    (5*pi/36)*(lambda_0^-1/a)^4*(l_B/gamma) [nm^2], the two formulas are algebraically identical,
    uniting henle2005/finite_size_req_approx_p3 with gov2008's incompressible Eq. (9) and exact
    energy minimizer into one ModelAtlas family. Physical quantities remain distinct (electrostatic
    residual charge vs incompressible packing defects); only the mathematical chart is shared.
  assumptions:
    - "Maps rod half-spacing a [nm] to filament radius a [nm] and matches the dimensionless Rayleigh balance ratios 7.2*gamma/(l_B*lambda_*^2) = pi*(L_p/a)^4/(alpha'*rho) via an invertible unit-consistent monomial map."
    - "Both models minimize free energy per filament per unit length in the canonical long-rod ensemble (negligible translational entropy, Gov 2008 p. 2 col 1 citing Henle & Pincus [7])."

- id: rel_gov2008_finite_size_req_scales_weak_binding_cbrt
  kind: scales_as
  a: henle2005/finite_size_req_approx_p3
  b: gov2008/weak_binding_cbrt_scaling
  mapping:
    eps_b: "18 * 4.114 * gamma / (10 * pi)"
  output_map:
    R_0: R_eq
  regime:
    a: [1.0, 10.0]
    gamma: [0.5, 5.0]
    l_B: [0.5, 1.0]
    inv_lambda_0: [0.1, 0.5]
    lambda_star_frac: [0.005, 0.1]
  provenance: proposed
  reason: >
    Both models predict exact cube-root scaling of equilibrium bundle radius with inter-filament
    attractive binding energy per unit length (d ln R_eq / d ln gamma = d ln R_0 / d ln eps_b =
    +1/3): Henle & Pincus (2005, p. 3 col 2) obtain R_eq ~= a*(7.2*gamma/(l_B*lambda_*^2))^(1/3)
    for finite-size counterions, and Gov (2008, p. 4 col 1; citing Henle & Pincus [7]) obtains
    R_0,b' ~ eps_b^(1/3) for incompressible bulk packing defects. The mapping equates the two
    surface-tension coefficients 2*pi*eps_b = 3.6*gamma*k_B*T at k_B*T = 4.114 pN*nm (298 K).
  assumptions:
    - "Identifies surface-tension binding energy prefactors via 2*pi*eps_b = 3.6*gamma*k_B*T (k_B*T = 4.114 pN*nm at 298 K); the +1/3 log-slope is invariant to the positive conversion constant."

