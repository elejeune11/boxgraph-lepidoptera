notes: >
  In scope: the paper's complete modified Debye-Huckel + Stern-layer cell model for equilibrium
  polyelectrolyte bundle size (Eqs. 1-7), available cross-sectional area alpha_b, Debye screening
  wavenumber kappa (with implicit bulk electroneutrality n_{-1} = n_1 + q*n_q), hexagonal bond
  counting b = 3 - 3.6*a/R, large-R asymptotic charge limits (p. 2), finite-size counterion steric
  free energy and modified Eq. (6) (both the non-runnable literal printed RHS form and the evidenced
  variant_of corrected LHS form, verified against independent direct minimization of the printed free
  energy to 6.7e-15 relative difference), analytical vs exact equilibrium bundle radius R_eq (p. 3),
  the DNA + trivalent cobalt hexammine ion-radius bound delta_eff >=~ 7 A (p. 3), the frustrated
  attraction hyperbola phi(b) (p. 4), and calibrated high-resolution readings of all 11 curves/lines
  across all four plotted panels of Figs. 1 and 2 (p. 3).
  Left out: the intermediate cylindrical electrostatic potential Eq. (4) and 3D Coulomb integral
  Eq. (3) as standalone models (their closed-form reduction to Eqs. 5-7 was verified algebraically,
  and the printed Stern-layer step-function misprint theta(R-r) for delta(r-R) on p. 2 is logged in
  questions.yaml); qualitative scaling remarks (e.g., 1/M*(beta*F_ES + beta*F_ent) ~ -1/R^2 on p. 2)
  that produce no printed numerical values.
  Key quantitative findings:
  (1) Caption unit misprint n_1 = 10 nM vs 10 mM (q_n1_10nM_vs_10mM): at the printed n_1 = 10 nM,
  all 11 curves across Figs. 1 and 2 fail reproduction; under the diagnostic n_1 = 10 mM hypothesis,
  all 3 curves of Fig. 1 main, both curves of Fig. 1 inset (including the asymptotic dashed line
  8.190 vs 8.195 nm^-1), and all 3 curves of Fig. 2 main reproduce at every digitized point (~0.001-
  0.004 nm^-1 accuracy).
  (2) Modified Eq. (6) side/sign misprint (q_finite_size_eq6_rhs_sign): p. 3 col 1 states that the
  finite-size steric entropy adds -ln(1 - lambda_q/Lambda) to the right-hand side of Eq. (6), which
  has no real solution on (0, Lambda) for large R (max residual <= -624 at R = 100a); differentiating
  the paper's own printed free energy places it on the left-hand side (variant finite_size_eq6_corrected,
  verified identical to direct minimization finite_size_free_energy_p3 to 6.73e-15).
  (3) Stern-layer density misprint (q_stern_charge_theta_vs_delta): p. 2 col 1 prints theta(R-r)
  instead of delta(r-R) for the Stern-layer surface charge density e*n_st(x).
  (4) Unexplained Fig. 2 inset discrepancy (q_fig2_inset_unexplained_discrepancy): even under n_1 =
  10 mM, the printed frustrated-attraction model (b = 3 - 3.6*a/R, phi_max = 2, xi = 0.1, gamma =
  1.7 nm^-1, R_ref = 100a) does not reproduce Fig. 2 inset (predicting a minimum near R/a = 4.37,
  depth -0.10 nm^-1 for 1 mM vs the plotted minimum near R/a = 2.5, depth -0.27 nm^-1); inverting
  phi(b) from the plotted 1 mM dots gives (3 - b)*(R/a) ~= 2.56 ~= 3.6/a along with a ~+0.037 nm^-1
  vertical shift between 0.1 uM and 1 mM consistent with R_ref ~= 25a.
  (5) All 5 numerical tolerance refinements settle (belongs_to: model) and all 5 intra-record
  ModelAtlas relations verify.
