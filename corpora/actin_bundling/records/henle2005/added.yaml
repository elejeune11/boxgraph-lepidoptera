- id: packing_factor_veff_added
  quantity: ion_packing_factor
  unit: dimensionless
  printed: "1.0"
  basis: >
    On p. 3 col 1, the paper states Lambda ~= alpha_b / v_eff and concludes that for DNA
    (1/lambda_0 = 1.7 A, a_0 = 10 A, a ~= 14 A, q = 3), lambda* = lambda_0 - q*Lambda > 0
    requires effective ion radius delta_eff >= 7 A, without printing the geometric formula
    converting v_eff to delta_eff. Using a bare sphere volume v_eff = (4*pi/3)*delta_eff^3
    (f_pack = 1.0) yields delta_eff > 7.16 A, matching the printed '~7 A'. Alternatives test
    hexagonal/fcc close packing (f_pack = pi/(3*sqrt(2)) ~= 0.7405, giving 6.48 A) and simple
    cubic packing v_eff = (2*delta_eff)^3 (f_pack = pi/6 ~= 0.5236, giving 5.77 A).
  alternatives: ["0.7405", "0.5236"]
  stands_for: "Geometric packing factor relating v_eff to (4*pi/3)*delta_eff^3 on p. 3 col 1"

- id: n1_fig1_mM_hypothesis_added
  quantity: monovalent_salt_concentration
  unit: mM
  printed: "10"
  conditions:
    monovalent_salt_concentration: "10 mM"
  basis: >
    Fig. 1 caption (p. 3) prints n_1 = 10 nM, which fails to reproduce all four plotted
    panels of Figs. 1 and 2 (see q_n1_10nM_vs_10mM). This diagnostic added value tests the
    single-letter unit-misprint hypothesis n_1 = 10 mM (standard physiological/experimental
    monovalent salt concentration, 10^6x higher than 10 nM); alternatives 1 mM and 100 mM
    bracket neighboring orders of magnitude.
  alternatives: ["1", "100"]
  stands_for: "n_1 in Figs. 1 and 2 captions under the 10 mM unit-typo hypothesis"

- id: R_over_a_bench_added
  quantity: dimensionless_bundle_radius
  unit: dimensionless
  printed: "10"
  basis: >
    Representative intermediate bundle size R/a = 10 (M = 100 rods) within the plotted domain
    of Figs. 1 and 2, used to evaluate scalar helper models (available_area_eq2,
    debye_screening_eq4, hexagonal_bonds_p2, frustrated_attraction_hyperbola_p4) and check
    self-consistency between direct free-energy minimization and saddle-point Eq. (6).
  alternatives: ["2", "20"]
  stands_for: "Representative R/a for scalar auxiliary model evaluation"
