id: finite_size_free_energy_p3
name: direct minimization of printed finite-size counterion free energy (p. 3)
role: model
stated:
  page: 3
  printed_page: "060801-3"
  quote: "inside the bundle as finite-size particles with an effective"
  where: "text, p. 3 col 1"
equation: >
  beta*F_ent -> beta*F_ent + M*L*[(Lambda - lambda_q)*ln(1 - lambda_q/Lambda) + lambda_q],
  minimized directly with respect to lambda_q in (0, Lambda) and lambda_s^st (Eq. 7)
inputs:
  R_over_a: {quantity: dimensionless_bundle_radius, unit: dimensionless}
  R_ref_over_a: {quantity: dimensionless_bundle_radius, unit: dimensionless}
  a_0: {quantity: rod_radius, unit: nm}
  a: {quantity: rod_half_spacing, unit: nm}
  w: {quantity: stern_layer_width, unit: nm}
  inv_lambda_0: {quantity: charge_spacing, unit: nm}
  l_B: {quantity: bjerrum_length, unit: nm}
  n_1: {quantity: monovalent_salt_concentration, unit: M}
  n_q: {quantity: multivalent_salt_concentration, unit: M}
  q: {quantity: counterion_valence, unit: dimensionless}
  gamma: {quantity: bond_attraction_strength, unit: 1/nm}
  lambda_star_frac: {quantity: residual_charge_fraction, unit: dimensionless}
outputs:
  dF_over_NL: {quantity: free_energy_per_rod_length, unit: 1/nm}
  lambda_tot: {quantity: bundle_total_linear_charge_density, unit: 1/nm}
  lambda_rod: {quantity: renormalized_rod_charge_density, unit: 1/nm}
settings:
  tol: 1.0e-10
built_from:
  - available_area_eq2
  - debye_screening_eq4
  - hexagonal_bonds_p2
stochastic: false
