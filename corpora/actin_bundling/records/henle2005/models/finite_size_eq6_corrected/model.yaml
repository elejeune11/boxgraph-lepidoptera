id: finite_size_eq6_corrected
name: finite-size counterion bundle free energy via corrected LHS Eq. (6) (p. 3)
role: model
variant_of: finite_size_eq6_printed
corrections:
  - equation: "modified Eq. (6) (p. 3 col 1)"
    change: "Add -ln(1 - lambda_q/Lambda) to the left-hand side of Eq. (6) (equivalently +ln(1 - lambda_q/Lambda) to the right-hand side) instead of the printed right-hand side."
    evidence: "Differentiating the paper's own printed modified free energy beta*F_ent -> beta*F_ent + M*L*[(Lambda - lambda_q)*ln(1 - lambda_q/Lambda) + lambda_q] (p. 3 col 1, preceding sentence) with respect to lambda_q yields -ln(1 - lambda_q/Lambda) on the left-hand side of Eq. (6). The printed right-hand-side placement has no real root on (0, Lambda) at large R (max residual <= -624 at R = 100a), whereas left-hand-side placement forces lambda_q -> Lambda^- (lambda -> lambda*) as R -> infinity and reproduces all three curves of Fig. 2 (under n_1 = 10 mM) to ~0.002 nm^-1."
stated:
  page: 3
  printed_page: "060801-3"
  quote: "to the right-hand side of Eq."
  where: "text, p. 3 col 1"
equation: >
  ln(lambda_q/(n_q*alpha_b)) - ln(1 - lambda_q/Lambda) - l_B*q*lambda*R^2/(2*a^2)
  - 2*l_B*q*lambda_tot*K_0(kappa*R)/(kappa*R*K_1(kappa*R)) = 0
inputs:
  R_over_a: {quantity: dimensionless_bundle_radius, unit: dimensionless}
  R_ref_over_a: {quantity: dimensionless_bundle_radius, unit: dimensionless}
  a_0: {quantity: rod_radius, unit: nm}
  a: {quantity: rod_half_spacing, unit: nm}
  w: {quantity: stern_layer_width, unit: nm}
  inv_lambda_0: {quantity: charge_spacing, unit: nm}
  l_B: {quantity: bjerrum_length, unit: nm}
  n_1: {quantity: monovalent_salt_concentration, unit: M}
  n_q: {quantity: multivalent_salt_concentration, unit: M}
  q: {quantity: counterion_valence, unit: dimensionless}
  gamma: {quantity: bond_attraction_strength, unit: 1/nm}
  lambda_star_frac: {quantity: residual_charge_fraction, unit: dimensionless}
outputs:
  dF_over_NL: {quantity: free_energy_per_rod_length, unit: 1/nm}
  lambda_tot: {quantity: bundle_total_linear_charge_density, unit: 1/nm}
  lambda_rod: {quantity: renormalized_rod_charge_density, unit: 1/nm}
settings:
  tol: 1.0e-10
built_from:
  - available_area_eq2
  - debye_screening_eq4
  - hexagonal_bonds_p2
stochastic: false
