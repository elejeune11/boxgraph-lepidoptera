id: debye_screening_eq4
name: Debye-Huckel inverse screening length with bulk electroneutrality (Eq. 4 text)
role: model
stated:
  page: 2
  printed_page: "060801-2"
  quote: "the bundle and its Stern layer,"
  where: "text below Eq. 4"
equation: "kappa = sqrt(4 * pi * l_B * sum_s s^2 * n_s) = sqrt(4 * pi * l_B * (2 * n_1 + q * (q + 1) * n_q))"
inputs:
  l_B: {quantity: bjerrum_length, unit: nm}
  n_1: {quantity: monovalent_salt_concentration, unit: M}
  n_q: {quantity: multivalent_salt_concentration, unit: M}
  q: {quantity: counterion_valence, unit: dimensionless}
outputs:
  kappa: {quantity: debye_screening_wavenumber, unit: 1/nm}
settings: {}
stochastic: false
