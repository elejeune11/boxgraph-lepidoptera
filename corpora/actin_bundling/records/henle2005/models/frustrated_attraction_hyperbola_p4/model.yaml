id: frustrated_attraction_hyperbola_p4
name: frustrated attractive bond saturation hyperbola phi(b) (p. 4)
role: model
stated:
  page: 4
  printed_page: "060801-4"
  quote: "effects of bond frustration, we chose"
  where: "text, p. 4 col 1"
equation: "phi(b) = (1/2)*(b + phi_max) - (1/2)*|phi_max - b|*sqrt(1 + xi/(b - phi_max)^2)"
inputs:
