id: ion_radius_threshold_p3
name: minimum effective counterion radius for incomplete bundle neutralization (p. 3)
role: model
from_words: true
stated:
  page: 3
  printed_page: "060801-3"
  quote: "the effective radius of the ions"
  where: "text, p. 3 col 1"
equation: "lambda* = lambda_0 - q*(alpha_b/v_eff) > 0 with alpha_b = pi*(a^2 - a_0^2) and v_eff = (4*pi/3)*delta_eff^3 / f_pack => delta_eff > (3*f_pack*q*(a^2 - a_0^2)/(4*lambda_0))^(1/3)"
inputs:
  a_0: {quantity: rod_radius, unit: angstrom}
  a: {quantity: rod_half_spacing, unit: angstrom}
  inv_lambda_0: {quantity: charge_spacing, unit: angstrom}
  q: {quantity: counterion_valence, unit: dimensionless}
  f_pack: {quantity: ion_packing_factor, unit: dimensionless}
outputs:
  delta_eff_min: {quantity: effective_ion_radius, unit: angstrom}
settings: {}
built_from:
  - available_area_eq2
stochastic: false
