# Physical quantities declared for sekine2024 (one quantity per distinct physical meaning)

# --- Cytosol & thermodynamic parameters ---
- {id: temperature, name: absolute temperature, dimension: "[temperature]", description: "Ambient or simulation temperature T."}
- {id: thermal_energy, name: thermal energy, dimension: "[energy]", description: "Thermal energy scale k_B T."}
- {id: cytosolic_viscosity, name: cytosolic viscosity, dimension: "[viscosity]", description: "Effective dynamic viscosity eta_cyto of the cytosol near the apical membrane or in bulk."}
- {id: diffusion_coefficient, name: translational diffusion coefficient, dimension: "[length]**2/[time]", description: "Effective translational diffusion coefficient of a cytoskeletal filament or particle."}

# --- Molecular geometry & mechanical parameters ---
- {id: molecular_diameter, name: molecular diameter or width, dimension: "[length]", description: "Cross-sectional diameter or width of an actin filament (d^f), myosin II filament (d^m), alpha-actinin dimer (d^cl), or GFP tag."}
- {id: molecular_rest_length, name: molecular rest length, dimension: "[length]", description: "Equilibrium contour or rest length of an actin filament (L_0^f), myosin II motor (L_0^m), or alpha-actinin crosslinker (L_0^cl)."}
- {id: segment_length, name: instantaneous segment length, dimension: "[length]", description: "Instantaneous distance r between two bonded coarse-grained particles."}
- {id: stretching_modulus, name: axial stretching modulus, dimension: "[force]", description: "Extensional rigidity kappa^{X,str} = E A appearing in the harmonic potential U^harm = (kappa/(2 L_0))(r - L_0)^2."}
- {id: young_modulus, name: Young's modulus, dimension: "[pressure]", description: "Effective Young's modulus E^{X,str} = kappa^{X,str} / (pi (d^X / 2)^2)."}
- {id: spring_stiffness, name: linear spring stiffness, dimension: "[force]/[length]", description: "Effective harmonic spring constant kappa / L_0 or transverse bending spring constant."}
- {id: bending_rigidity, name: angular bending rigidity, dimension: "[energy]", description: "Angular bending stiffness parameter k^{X,bend} in U^bend = -k r_hat_- . r_hat_+."}
- {id: bending_angle, name: connector bending deflection angle, dimension: "dimensionless", description: "Deviation angle theta between connector arm unit vectors -l_hat_0 and l_hat_1."}
- {id: persistence_length, name: polymer or connector persistence length, dimension: "[length]", description: "Persistence length of actin filament or of myosin/crosslinker connector l^{X,bend} = k^{X,bend} l_0^X / (2 k_B T)."}
- {id: elastic_energy, name: elastic potential energy, dimension: "[energy]", description: "Harmonic stretching or angular bending potential energy."}
- {id: elastic_force, name: elastic restoring force, dimension: "[force]", description: "Restoring force generated by stretching or bending elasticity."}
- {id: bending_torque, name: angular bending torque, dimension: "[energy]", description: "Restoring torque dU^bend / dtheta = k sin(theta)."}
- {id: friction_coefficient, name: hydrodynamic friction coefficient, dimension: "[force]*[time]/[length]", description: "Translational viscous drag coefficient gamma^f, gamma^m, or gamma^cl of a coarse-grained particle."}
- {id: friction_asymmetry, name: filament friction anisotropy ratio, dimension: "dimensionless", description: "Ratio gamma_y^f / gamma_x^f of circumferential (y) to longitudinal (x) filament friction."}
- {id: motor_walk_force, name: motor walking force, dimension: "[force]", description: "Active plus-end-directed walking force f^walk of a myosin II actin-binding domain."}
- {id: motor_sliding_friction, name: motor ABD sliding friction, dimension: "[force]*[time]/[length]", description: "Sliding friction coefficient zeta between a myosin ABD and an actin filament in Eq. S4."}
- {id: motor_walking_speed, name: motor walking velocity, dimension: "[length]/[time]", description: "Active sliding velocity v^walk = f^walk / zeta of a myosin ABD along an actin filament."}
- {id: abd_rate, name: normalized ABD progression rate, dimension: "1/[time]", description: "Rate d(alpha)/dt = f^walk / (zeta l_f) of dimensionless ABD coordinate along a filament."}
- {id: motor_traversal_time, name: motor filament traversal time, dimension: "[time]", description: "Time L_0^f / v^walk required for a motor ABD to traverse one full actin filament."}
- {id: turnover_rate, name: molecular turnover or unbinding rate, dimension: "1/[time]", description: "Stochastic filament turnover rate omega^f, motor unbinding rate omega^m, or crosslinker unbinding rate omega^cl."}

# --- Coarse-grained MD simulation box, counts & numerical dynamics ---
- {id: molecule_count, name: number of molecules or agents, dimension: "dimensionless", description: "Count of actin filaments (N^f), myosin motors (N^m), or crosslinkers (N^cl) in a simulation or nanocluster."}
- {id: simulation_box_length, name: simulation box side length, dimension: "[length]", description: "Linear dimension L of the square 2D periodic simulation domain."}
- {id: simulation_timestep, name: numerical integration time step, dimension: "[time]", description: "Time increment dt used in Euler and fourth-order Runge-Kutta integration."}
- {id: relaxation_time, name: simulation relaxation time, dimension: "[time]", description: "Duration required to reach steady-state patterns in the CGMD simulation."}
- {id: binding_coordinate, name: fractional filament binding coordinate, dimension: "dimensionless", description: "Dimensionless position 0 <= alpha <= 1 of a motor or crosslinker ABD along an actin filament."}
- {id: applied_force, name: ABD force transmitted to filament, dimension: "[force]", description: "Force f_{m,h}^m or f_{c,h}^cl applied by a connector ABD to a bound actin filament."}
- {id: filament_end_force, name: force assigned to filament endpoint particle, dimension: "[force]", description: "Force component assigned to filament minus-end (i=0) or plus-end (i=1) particle."}
- {id: force_conservation_ratio, name: filament force conservation ratio, dimension: "dimensionless", description: "Ratio (f_0 + f_1) / f checking whether forces distributed to filament endpoints sum to the applied ABD force (1 = conserved)."}
- {id: crosslinker_deflection, name: crosslinker transverse deflection, dimension: "[length]", description: "Transverse displacement of the crosslinker central particle from the straight line between its two ABDs."}
- {id: dimer_filament_shift, name: dimer filament transverse relaxation shift, dimension: "[length]", description: "Transverse shift of the crosslinker-bound actin filaments during deterministic RK4 relaxation from an initial crosslinker deflection."}
- {id: center_of_mass_drift, name: isolated dimer center-of-mass drift, dimension: "[length]", description: "Spurious net displacement of the friction-weighted center of mass of an isolated deterministic two-filament dimer (0 under force conservation)."}
- {id: rk4_stability_number, name: dimensionless RK4 stiffness number, dimension: "dimensionless", description: "Product lambda_perp * dt measuring linear stability of RK4 integration for crosslinker bending relaxation (stable below 2.785)."}
- {id: observation_time, name: observation or integration horizon, dimension: "[time]", description: "Total simulated elapsed time t_max for an ODE/SDE integration run."}

# --- Structure factor & periodic cable spacing ---
- {id: spatial_frequency, name: spatial frequency q/(2*pi), dimension: "1/[length]", description: "Inverse-wavelength spatial frequency q/(2*pi) used on the abscissa of S(q) plots and in Table 4."}
- {id: wavenumber, name: angular wavenumber q, dimension: "1/[length]", description: "Angular spatial wavenumber q = 2*pi / lambda appearing in the structure factor S(q)."}
- {id: structure_factor, name: static structure factor S(q), dimension: "dimensionless", description: "Circularly binned static structure factor S(q) of filament particles."}
- {id: structure_factor_fit_amplitude, name: Gaussian structure factor amplitude A, dimension: "1/[length]", description: "Prefactor A in the Gaussian fit A / ((2*pi)^(1/2) sigma) exp(-(q - mu)^2 / (2 sigma^2)) (in q/(2*pi) coordinates of Table 4)."}
- {id: structure_factor_peak_frequency, name: structure factor peak spatial frequency mu/(2*pi), dimension: "1/[length]", description: "Peak center mu/(2*pi) from Gaussian fitting of S(q) around its dominant peak."}
- {id: structure_factor_peak_wavenumber, name: structure factor peak wavenumber mu, dimension: "1/[length]", description: "Peak angular wavenumber mu = 2*pi / interval from Gaussian fitting of S(q)."}
- {id: structure_factor_fit_width, name: Gaussian structure factor width sigma, dimension: "1/[length]", description: "Standard deviation sigma of the Gaussian fit to S(q) around its peak (in q/(2*pi) coordinates of Table 4)."}
- {id: pattern_interval, name: periodic cable or cluster spacing interval, dimension: "[length]", description: "Characteristic center-to-center spacing between periodic circumferential actin cables or simulated actin structures."}

# --- Cluster morphometry, orientation & molecular packing ---
- {id: complex_width, name: labeled actin complex width, dimension: "[length]", description: "Estimated physical width of a single lifeact::GFP-labeled actin filament or an alpha-actinin-crosslinked filament pair."}
- {id: cluster_major_length, name: actin cluster major axis length, dimension: "[length]", description: "Major axis length of an ellipse fitted to a segmented actin nanocluster or cable fragment."}
- {id: cluster_major_length_sd, name: actin cluster major axis length SD, dimension: "[length]", description: "Standard deviation of fitted cluster major axis lengths across clusters."}
- {id: cluster_minor_length, name: actin cluster minor axis length, dimension: "[length]", description: "Minor axis length of an ellipse fitted to a segmented actin nanocluster or cable fragment."}
- {id: cluster_minor_length_sd, name: actin cluster minor axis length SD, dimension: "[length]", description: "Standard deviation of fitted cluster minor axis lengths across clusters."}
- {id: cluster_area, name: actin cluster projected area, dimension: "[area]", description: "Projected area of an ellipse-fitted segmented actin cluster."}
- {id: cluster_area_sd, name: actin cluster projected area SD, dimension: "[area]", description: "Standard deviation of segmented actin cluster areas."}
- {id: cluster_aspect_ratio, name: actin cluster aspect ratio, dimension: "dimensionless", description: "Ratio of major axis to minor axis of fitted actin cluster ellipses."}
- {id: cluster_aspect_ratio_sd, name: actin cluster aspect ratio SD, dimension: "dimensionless", description: "Standard deviation of fitted actin cluster aspect ratios."}
- {id: pattern_orientation, name: actin pattern orientation angle, dimension: "dimensionless", description: "Axial orientation angle relative to tube longitudinal axis (0 deg = longitudinal, 90 deg = circumferential): median orientation or OrientationJ dominant direction."}
- {id: orientation_coherency, name: OrientationJ coherency, dimension: "dimensionless", description: "Gradient structure tensor coherency (0 to 1) quantifying actin pattern connectivity/alignment."}
- {id: cluster_count, name: number of analyzed clusters, dimension: "dimensionless", description: "Total number of segmented actin clusters included in ellipse-fitting statistics."}
- {id: roi_count, name: number of analyzed ROIs, dimension: "dimensionless", description: "Number of regions of interest analyzed per condition."}
- {id: sample_count, name: number of biological or statistical samples, dimension: "dimensionless", description: "Number of embryos, genes, RNAi lines, or tracked motion events."}

# --- Nanocluster motion, fusion dynamics & imaging/PIV processing ---
- {id: mean_longitudinal_displacement, name: mean absolute longitudinal displacement |dx|, dimension: "[length]", description: "Mean absolute single-step cluster displacement along the longitudinal (x) axis."}
- {id: longitudinal_displacement_sd, name: longitudinal displacement spread, dimension: "[length]", description: "Reported spread (SD in parentheses in Table 5) of single-step |dx| cluster displacements."}
- {id: mean_circumferential_displacement, name: mean absolute circumferential displacement |dy|, dimension: "[length]", description: "Mean absolute single-step cluster displacement along the circumferential (y) axis."}
- {id: circumferential_displacement_sd, name: circumferential displacement spread, dimension: "[length]", description: "Reported spread (SD in parentheses in Table 5) of single-step |dy| cluster displacements."}
- {id: motion_anisotropy_ratio, name: cluster motion anisotropy ratio |dy|/|dx|, dimension: "dimensionless", description: "Ratio of mean absolute circumferential displacement to mean absolute longitudinal displacement."}
- {id: mean_step_distance, name: mean Euclidean cluster step distance, dimension: "[length]", description: "Mean Euclidean displacement distance of tracked small actin nanoclusters per frame step."}
- {id: step_distance_sd, name: Euclidean step distance spread, dimension: "[length]", description: "Reported spread (SD in parentheses in Table 5) of tracked Euclidean step distances."}
- {id: frame_interval, name: live-imaging frame interval, dimension: "[time]", description: "Time interval between consecutive frames in fast Airyscan live imaging."}
- {id: frame_count, name: number of imaging frames, dimension: "dimensionless", description: "Number of consecutive frames (e.g. fusion duration in frames or total movie frames)."}
- {id: duration_time, name: elapsed event or movie duration, dimension: "[time]", description: "Physical duration corresponding to a count of live-imaging frames."}
- {id: developmental_time, name: relative developmental time, dimension: "[time]", description: "Time relative to completion of circumferential cable formation (0* min)."}
- {id: pixel_size, name: image or pseudo-image pixel size, dimension: "[length]", description: "Physical edge length represented by one image pixel or simulation density-grid cell."}
- {id: grid_cells_per_side, name: pseudo-image grid cells per side, dimension: "dimensionless", description: "Number of square discretization cells along one edge of the simulation box."}
- {id: window_size_pixels, name: PIV interrogation window size in pixels, dimension: "dimensionless", description: "Linear size of the TPIV interrogation window on enlarged frames, in pixels."}
- {id: enlargement_factor, name: image spatial enlargement factor, dimension: "dimensionless", description: "Spatial upsampling factor applied before TPIV analysis."}
- {id: piv_window_size, name: PIV interrogation window physical size, dimension: "[length]", description: "Physical side length corresponding to the TPIV interrogation window."}
- {id: roi_size_pixels, name: ROI linear size in pixels, dimension: "dimensionless", description: "Linear side length of a square analysis ROI in pixels."}
- {id: roi_physical_length, name: ROI physical side length, dimension: "[length]", description: "Physical side length of a square analysis ROI."}
- {id: p_value, name: statistical test P value, dimension: "dimensionless", description: "Printed statistical significance P value from hypothesis tests."}
- {id: piv_max_vector_length, name: PIV colorbar maximum displacement vector length, dimension: "[length]", description: "Printed upper bound of the PIV displacement vector length color scale in Fig. 5b,e."}

# --- Additional quantities for digitized figure axes ---
- {id: aspect_ratio_density, name: cluster aspect ratio probability density, dimension: "dimensionless", description: "Kernel probability density of fitted actin cluster aspect ratio (Fig. 1f)."}
- {id: cluster_length_density, name: cluster axis length probability density, dimension: "1/[length]", description: "Kernel probability density per unit length of cluster major or minor axis length (Supplementary Fig. 1b,c)."}
- {id: tube_diameter, name: tracheal tube diameter, dimension: "[length]", description: "Diameter of the embryonic Drosophila tracheal dorsal trunk measured between TC5 and DB6 (Fig. 1j)."}
- {id: tube_length, name: tracheal tube length, dimension: "[length]", description: "Length of the embryonic Drosophila tracheal dorsal trunk between TC5 and DB6 (Fig. 1k)."}
- {id: skeleton_length, name: mean actin skeleton length, dimension: "[length]", description: "Mean of maximum actin skeleton lengths across binarized ROIs (Supplementary Fig. 1g)."}
- {id: pearson_correlation, name: Pearson correlation coefficient R, dimension: "dimensionless", description: "Pearson's R colocalization coefficient between a tagged protein and cortical actin (Fig. 3d, Supplementary Fig. 5d)."}
- {id: piv_mean_velocity, name: PIV mean displacement rate, dimension: "[length]/[time]", description: "Mean longitudinal (|Vx|) or circumferential (|Vy|) cortical actin displacement rate measured by PIV (Fig. 5c,f)."}
- {id: cluster_shift_magnitude, name: single-step cluster shift magnitude, dimension: "[length]", description: "Magnitude of single-step actin cluster shift (|dx| or |dy|) plotted in simulation shift boxplots (Fig. 4e)."}
- {id: junctional_intensity_ratio, name: junctional RhoGEF2 intensity ratio, dimension: "dimensionless", description: "Ratio of longitudinal to circumferential junctional RFP::RhoGEF2 mean fluorescence intensity (Supplementary Fig. 1f)."}
- {id: simulation_time, name: CGMD simulation elapsed time, dimension: "[time]", description: "Elapsed simulation time t during cable self-organization starting from a uniform filament distribution (Fig. 4f)."}
- {id: condition_index, name: experimental or simulation condition index, dimension: "dimensionless", description: "1-based integer index identifying categorical conditions, genotypes, proteins, or axis components in boxplots and bar charts."}

