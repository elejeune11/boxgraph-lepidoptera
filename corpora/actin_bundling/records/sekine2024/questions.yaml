  text: >
    No cross-record validations are entered in validations.yaml for either bois2011 or sekine2024
    (0 entries in both directions): sekine2024 does not cite bois2011 directly (connecting only
    transitively via hannezo2015, Ref. 14 / S21), and no model in either record genuinely predicts
    any measurement of the other on that measurement's own experimental conditions.
    (1) sekine2024 models (31 models: 30 runnable microscopic elastic/drag/structure-factor/
    anisotropy/data-processing models plus non-runnable cgmd_2d_network) vs bois2011 data (53
    entries): bois2011 is a purely theoretical paper with 0 origin: measured entries in data.yaml
    (32 predicted dimensionless ODE/PDE/dispersion/stability outputs, 18 reported dimensionless
    parameters and zero-valued boundary conditions, and 3 derived algebraic flux/wavenumber
    identities). Consequently, sekine2024 has zero bois2011 measurements to validate against.
    (2) bois2011 models (26 purely 1D continuum active-fluid models with 0 printed dimensional
    parameter values; see bois2011/q_no_dimensional_params) vs sekine2024 measurements (all 214
    origin: measured entries across 27 quantities, plus experimental origin: derived summaries):
    (a) Periodic cable interval (pattern_interval, 2 measured data: cable_interval_in_vivo = 450
    +/- 13.2 nm and d_figs1d_intervals median 0.4468 um, range 0.4352-0.4746 um): none of
    bois2011's 26 models outputs a dimensional pattern wavelength or cable spacing ([length]).
    The sole [length]-valued output in bois2011 is bois2011/hydrodynamic_length (ell =
    sqrt(eta/gamma)), which is the active-fluid velocity screening length rather than the
    emergent cable period lambda (mapping pattern_interval to hydrodynamic_length would conflate
    distinct physical quantities sharing only dimension [length]), while discrete_wavenumber,
    single_species_fastest_mode, and asdm_stability_boundary output dimensionless k*ell. Moreover,
    bois2011's zero-turnover single-species model (Eqs. 1-13) has no finite onset wavelength
    (k_c = 0) and coarsens all multi-peak transients to n_peaks_final = 1; bois2011 prints no
    dimensional cortical parameters (its generic added C. elegans scales give ell = 10 um, 22x
    larger than 450 nm and 114-148x larger than the ell = 67.5-87.7 nm implied by bois2011's
    worked lambda/ell in [5.13, 6.67], which itself violates continuum scale separation against
    L_0^f = 100 nm and L_0^m = 200 nm; see q_bois2011_continuum_vs_microscopic_bridge); and
    sekine2024 measures none of bois2011's continuum inputs (eta, gamma, (zeta*Delta_mu)_0, D,
    Pe, c_0, L/ell, D_a/D_s, rho_a, rho_s) in vivo.
    (b) Cortical actin PIV velocities (piv_mean_velocity, 4 measured curves: d_fig5c_vx =
    20.7-27.5 nm/s and d_fig5c_vy = 25.6-34.8 nm/s across Stage 15 -40..0* min; d_fig5f_vx =
    17.1-29.4 nm/s and d_fig5f_vy = 26.5-28.8 nm/s across Stage 16 Control, DAAM RNAi, Zasp52
    RNAi, and myosin II[DN]): although bois2011 has [length]/[time]-valued outputs
    (characteristic_velocity U = (zeta*Delta_mu)_0/sqrt(eta*gamma), steady_velocity_eq8 v =
    D*d_x(ln c), and steady_flux_eq5/steady_flux_eq7 j_0), none predicts 2D PIV speeds on
    sekine2024's conditions. sekine2024 measures none of the required continuum inputs
    ((zeta*Delta_mu)_0, eta, gamma, D, or local spatial log-concentration gradient d_x(ln c)) at
    any developmental stage or genotype (bois2011's generic added cortical scales give U = 250
    nm/s, 7-15x above PIV speeds and uncoupled from tracheal conditions); U is an
    order-of-magnitude scale rather than a spatially averaged PIV velocity, Eq. (8) assumes zero
    turnover (j_0 = 0) and a known local profile d_x(ln c), and j_0 vanishes for periodic or
    no-flux BCs; and 1D isotropic bois2011 cannot separate |V_x| vs |V_y| or model developmental
    staging or RNAi perturbations (furthermore, 2D anisotropic-friction active-gel advection
    flows along low-friction x with |V_x| > |V_y| and vanishes as (zeta*Delta_mu)_0 -> 0,
    contrary to sekine2024's measured |V_y| > |V_x| and persistent PIV speeds of 22.6 and 27.2
    nm/s with P = 8.98e-6 in myosin II[DN]).
    (c) Wild-type and RNAi/mutant nanocluster morphometry, orientation, coherency, densities,
    skeleton length, and cluster counts (152 measured data: 38 cluster_major_length, 2
    cluster_major_length_sd, 33 cluster_minor_length, 2 cluster_minor_length_sd, 2 cluster_area,
    2 cluster_area_sd, 30 cluster_aspect_ratio, 2 cluster_aspect_ratio_sd, 2 aspect_ratio_density,
    4 cluster_length_density, 31 pattern_orientation, 1 orientation_coherency, 2 cluster_count,
    and 1 skeleton_length, covering Stage 15/16 wild type and 28 Table 2 / Fig. 3 / Supp. Fig. 3
    genetic perturbations including DAAM, Zasp52, actn14, RhoA, and myosin II[DN]): 1D isotropic
    bois2011 has no discrete 2D cluster morphology, orientation angle (0-90 deg), structure-tensor
    coherency, size-distribution KDE, skeleton length, or genetic-perturbation parameters, and
    outputs no [length]^2 area or [1/length] density. In particular, st15_cluster_count = 356 and
    st16_cluster_count = 271 are pooled counts of binarized 2D ellipses across 22 and 21 ROIs
    (~16.2 and ~12.9 clusters per 5.19 x 5.19 um^2 ROI), not 1D spatial peak counts
    (peak_count, fastest_growing_mode) on a single 1D domain L.
    (d) Tracked 2D nanocluster displacements and fusion lifetimes (35 measured data: 9
    mean_longitudinal_displacement dx_*, 9 mean_circumferential_displacement dy_*, 9
    mean_step_distance dist_*, and 8 frame_count fusion-duration entries fusion_frames_typical,
    fusion_frames_ex_s2b, d_fig2b_mean_*, d_fig3e_mean_*; plus origin: derived ratios
    aniso_ratio_st15_*, aniso_ratio_st16_* and fusion_dur_*): deterministic 1D continuum bois2011
    models neither discrete tracked 2D cluster steps (nor their high-friction-biased ratio
    |dy|/|dx| = 1.08-1.72; see q_bois2011_contrasting_myosin_and_patterning_predictions) nor
    stochastic fusion/fission durations.
    (e) Tracheal tube geometry, protein colocalization, junctional RhoGEF2, experimental counts,
    and statistical P-values (21 measured data: d_fig1j_diameter, d_fig1k_length,
    d_fig3d_coloc_st15, d_figs5d_coloc_st16, d_figs1f_rhogef2, st15_roi_count, st16_roi_count,
    rnai_screen_lethal_lines, rnai_screen_positive_genes, and 12 p_value entries pval_*):
    bois2011 is a flat constant-thickness 1D film with fixed input domain length L and
    deterministic PDEs, predicting no cylindrical tube expansion/elongation, two-channel
    fluorescence colocalization, junctional polarity, screen/ROI sample counts, or P-values.
    (f) Conversely, bois2011's remaining dimensional output classes — diffusive_timescale
    ([time], tau_D = ell^2/D) and growth_rate ([1/time], lambda(k) in Eqs. 12 and 15) — have 0
    origin: measured data of matching dimension in sekine2024.
