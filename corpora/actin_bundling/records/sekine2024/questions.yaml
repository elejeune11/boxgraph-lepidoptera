  text: >
    Cross-validation of all 31 sekine2024 models (30 runnable, plus non-runnable cgmd_2d_network)
    against all 35 origin: measured data in hannezo2015 yields 1 cross-validation entry in
    validations.yaml (val_sf_interval_4m_vs_hannezo_wt_spacing, purpose: validation) and excludes
    the remaining 34 measured data:
    (1) Included validation — structure_factor_interval on sf_4m_mu_over_2pi (1.89140416 um^-1,
    4-M WT embryonic stage-16 circumferential-stripe CGMD simulation, Supp. Table 4) vs
    hannezo2015/ring_wavelength_embryo_wt (0.5 +/- 0.1 um, n > 150 rings, Olympus FV1000 confocal
    UAS-lifeact-mEGFP): computes 0.5287 um (528.7 nm), diff = +0.0287 um (+5.7%), verdict =
    reproduced inside [0.4, 0.6] um. This mirrors sekine2024/comparisons.yaml's own
    cmp_validation_cable_interval_4m and reveals a sharp precision-driven contrast: the exact
    same 528.7 nm 4-M prediction is reproduced against Hannezo 2015's confocal per-ring SD
    (500 +/- 100 nm) yet not reproduced against Sekine 2024's own Airyscan embryo-mean SD
    (450 +/- 13.2 nm, +17.5%). Important methodological caveat: because cgmd_2d_network is
    non-runnable from the published text alone (q_cgmd_2d_not_runnable_unstated_algorithm),
    structure_factor_interval (role: processing) evaluates the published 4-M fitted structure-
    factor peak frequency rather than re-integrating the 12,150-agent CGMD network from scratch.
    (structure_factor_interval_wavenumber is omitted as an algebraic same_as duplicate, and
    hannezo2015/ring_wavelength_si_input = 5 x 10^-7 m is omitted as a duplicate restatement of
    ring_wavelength_embryo_wt without its +/- 0.1 um uncertainty.)
    (2) Excluded hannezo2015 measurements (34/35):
    (a) Mutant, larval, and multi-condition bar-chart spacings (ring_wavelength_src42,
    ring_wavelength_kkv1, ring_wavelength_larva_wt_early, ring_wavelength_larva_wt_fig1c,
    taenidial_wavelength_larva_wt_late, taenidial_wavelength_moesin_rnai,
    fig3b_bar_ring_spacing_data, figs2d_moesin_rnai_spacing_data): Sekine's 4-M simulation
    models embryonic stage 15-16 wild-type tracheal cells only, not Src42A, kkv1, moesin RNAi,
    or third-instar larvae, and fig3b_bar_ring_spacing_data is a 3-bar table indexed by
    condition_index.
    (b) Stage-15 FRAP measurements (diffusion_coeff_frap = 0.04 +/- 0.03 um^2/s,
    turnover_time_frap = 15 +/- 7 s, fig2a_frap_variance_data, fig2a_frap_recovery_data,
    immobile_fraction_frap): no runnable model in sekine2024 outputs diffusion_coefficient
    ([length]^2/[time]), frap_variance ([length]^2), actin turnover_time (omega_f_sim = 0.1 s^-1
    is a fixed simulation input, fusion_duration_time is nanocluster-fusion duration, and
    motor_walking_velocity.tau_walk is myosin ABD traversal time), or immobile_fraction. In
    particular, cgmd_anisotropic_langevin outputs single-filament mean absolute displacements
    mean_abs_dx/dy (nm) and dimensionless R_aniso, and anisotropic_diffusion_ratio outputs
    dimensionless R_aniso — none of which is measured in hannezo2015.
    (c) Remaining hannezo2015 measurements (rings_per_cell_embryo_wt, rings_per_cell_kkv1,
    fig1c_fourier_spectrum_data larval 1D FFT vs period, fig3b_dist_* spacing histograms,
    fig1a_actin_intensity_data, actin_increase_onset_*, fluorescence_*, cop_* diameter/actin
    changes, fig3c_kkv_diameter_vs_actin_data, fig4f_cop_actin_vs_diameter_data,
    side_branch_diameter_ratio, ring_onset_time_range, ramp_duration_si, frap_sample_size):
    no runnable sekine2024 model predicts per-cell ring counts, larval Fourier spectra, ring
    spacing histograms, actin fluorescence intensity ramps, tube diameters, or mutant
    diameter/intensity changes.
    In the reverse direction (hannezo2015 models vs sekine2024 measurements), see
    hannezo2015/q_sekine2024_cross_validation_summary.
