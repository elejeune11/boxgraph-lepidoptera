- id: q_gaussian_sf_2pi_convention
  kind: possible_error
  about:
    - gaussian_structure_factor
    - gaussian_structure_factor_peak
    - sf_1m_A
    - sf_1m_sigma
    - sf_3m_A
    - sf_3m_sigma
    - sf_4m_A
    - sf_4m_sigma
    - sf_a4_1_A
    - sf_a4_1_sigma
  text: >
    Methods (PDF p. 11) writes the Gaussian structure-factor fit as
    A / ((2*pi)^(1/2) * sigma) * exp[-(q - mu)^2 / (2 * sigma^2)] with periodic interval 2*pi / mu,
    so q and mu are angular wavenumbers. However, Supplementary Table 4 (PDF p. 26) tabulates columns
    A, mu/(2*pi), and sigma while Supplementary Fig. 7c1-c4 (PDF p. 22) plots S(q) and the dotted
    Gaussian fit against q/(2*pi). Checking peak heights A/(sqrt(2*pi)*sigma) = 0.974 (1-M),
    0.716 (3-M), 0.398 (4-M), and 2.656 (a4-1) and half-widths at e^(-1/2) of peak height against
    Fig. 7c1-c4 shows that Table 4's sigma (0.528, 0.372, 0.501, 0.561 um^-1) and A are fitted
    directly in q/(2*pi) coordinates (effectively sigma/(2*pi) and A/(2*pi) relative to p. 11).
    Plugging Table 4's sigma into p. 11's literal (q - mu)^2 / (2*sigma^2) with angular wavenumbers
    q = 2*pi*(q/2*pi) and mu = 2*pi*(mu/2*pi) shrinks the Gaussian width by a factor of 2*pi
    (yielding S ~ 10^-7 at q/(2*pi) = 2.0 um^-1 in c1 instead of the plotted ~0.65).
  citation:
    page: 11
    printed_page: "11"
    quote: "The interval of the structure is measured"
    where: "Methods (Structure factor) vs Supplementary Table 4 & Fig. 7c"

