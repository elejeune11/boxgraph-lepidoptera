    - q_cgmd_2d_not_runnable_unstated_algorithm
    - q_eta_cyto_contradiction
    - bois2011/hydrodynamic_length
    - bois2011/characteristic_velocity
    - bois2011/diffusive_timescale
    - bois2011/peclet_number_physical
    - bois2011/discrete_wavenumber
    - bois2011/single_species_dispersion_eq12
    - bois2011/single_species_rda_dispersion_eq15
    - bois2011/single_species_pde_eq1_3
    - bois2011/asdm_dispersion_eq15
    - bois2011/asdm_pde_eq14
    - bois2011/q_no_dimensional_params
  text: >
    No equation-level ModelAtlas relation (same_as, reduces_to, derived_from, scales_as,
    approximated_by) or cited.yaml link connects bois2011 and sekine2024 across all 26 x 31 = 806
    model pairs. sekine2024 does not cite bois2011 directly (none of Refs. 1-55 or S1-S27 is Bois,
    Julicher & Grill 2011; Ref. 23 is Yan, Narayanan, Wiegand, Julicher & Grill 2022 on cortical
    condensates) and takes zero values from bois2011 (a purely dimensionless theory paper with 0
    origin: measured data). Instead, sekine2024 connects to bois2011 transitively via hannezo2015
    (Ref. 14 / S21), positioning its 2D bottom-up coarse-grained molecular dynamics (CGMD) model as
    the molecular mechanism beneath hannezo2015's phenomenological active-gel model (which in turn
    extends bois2011 and shares verified same_as ModelAtlas families with bois2011 for
    hydrodynamic_length, diffusive_timescale, peclet_number_physical, and
    single_species_rda_dispersion_eq15). Four structural and quantitative gaps block any
    equation-level map between bois2011 and sekine2024:
    (1) Model-class mismatch and missing coarse-graining derivation: bois2011 formulates 1D
    isotropic, constant-thickness viscous continuum advection-diffusion-reaction PDEs (explicitly
    neglecting viscoelasticity and filament discreteness, p. 1), whereas sekine2024 models a
    non-runnable 2D discrete 3-species Langevin CGMD network (cgmd_2d_network: N^f = 4500 polar
    two-bead actin filaments, N^cl = 6750 passive alpha-actinin crosslinkers, N^m = 900 bipolar
    myosin II motors in a 3 x 3 um^2 periodic box with stochastic binding/unbinding/turnover),
    microscopic single-molecule elastic/drag constitutive laws, and phenomenological Gaussian
    structure-factor fits. Neither paper derives effective continuum fields (c, v), gel viscosity
    eta, substrate friction gamma, or an active-stress constitutive law f(c) from Eqs. S1-S9.
    Superficial algebraic pairs across shared dimensions (e.g., bois2011/discrete_wavenumber vs
    structure_factor_interval_wavenumber, characteristic_velocity vs motor_walking_velocity,
    diffusive_timescale vs fusion_duration_time or motor_walking_velocity.tau_walk, or
    single_species_dispersion_eq12 vs gaussian_structure_factor) either represent unrelated
    physical/functional forms or fail ModelAtlas's too_plain (<= 2 ops) threshold.
    (2) Symbol overloading and dimensional mismatches: gamma is 3D continuum substrate friction per
    unit volume [Pa*s/m^2] in bois2011 Eq. (3) vs single-bead cytosolic Stokes drag [pN*s/um] in
    sekine2024 Eqs. (S1)-(S3); eta is macroscopic active-gel internal viscosity [Pa*s] in bois2011
    vs background cytosolic fluid viscosity eta_cyto (1 Pa*s in Table S1; 0.1 Pa*s in SI text)
    setting solvent drag in sekine2024; zeta appears in active stress coupling zeta*Delta_mu [Pa]
    in bois2011 vs motor-ABD sliding friction zeta = 0.1 pN*s/um in sekine2024 Eq. (S4); L is the
    1D macroscopic domain length in bois2011 vs simulation box side L_box = 3 um and molecular rest
    lengths L_0^f = 0.1, L_0^m = 0.2, L_0^cl = 0.035 um in sekine2024; and sigma is total 1D fluid
    stress [Pa] in bois2011 vs Gaussian structure-factor peak width [1/um] in sekine2024.
    (3) Breakdown of continuum scale separation (ell >> L_0^f, L_0^m): bois2011 prints no
    dimensional parameters (bois2011/q_no_dimensional_params), with pattern wavelengths
    lambda/ell in [5.13, 6.67] across its worked examples (single-species Pe = 25 linear 5.13*ell;
    ASDM Fig. 5d steady state 6.67*ell). Matching sekine2024's periodic cable spacing
    (450 +/- 13.2 nm in vivo; 529 nm in CGMD 4-M) requires ell = 67-88 nm (in vivo) or 79-103 nm
    (CGMD 4-M) — comparable to or smaller than an individual actin filament (L_0^f = 100 nm) and
    2-3x smaller than a bipolar myosin II motor (L_0^m = 200 nm) or nanocluster (168-384 nm) —
    violating the hydrodynamic continuum separation of scales required by bois2011.
    (4) Microscopic transport and elastic-motor scales vs continuum inputs: from Table S1
    (eta_cyto = 1 Pa*s), single-bead filament drag is gamma^f = 0.6597 pN*s/um (2*gamma^f =
    1.3195 pN*s/um per two-bead filament), yielding free-filament thermal diffusivity
    D_fil,x = k_B T / (2*gamma^f) = 0.00314 um^2/s (diffusive length sqrt(D_fil,x / omega^f) =
    177 nm over filament lifetime 1/omega^f = 10 s; at eta_cyto = 0.1 Pa*s, D_fil,x = 0.0314 um^2/s
    and 560 nm), and naive 2D filament drag density xi_2D,x = (N_f / L_box^2) * (2*gamma^f) =
    6.60e8 Pa*s/m. Moreover, in sekine2024 Eqs. (S4) and (S6)-(S7), the direct counterforce of
    f^walk vanishes identically and active forces enter only indirectly through load-free kinematic
    ABD walking (v^walk = f^walk / zeta) stretching harmonic motor arms (k_eff = 2*kappa^{m,str} /
    L_0^m = 100 pN/um per arm), with no closed-form mapping onto bois2011's scalar active stress
    (zeta*Delta_mu)_0 * f(c) or continuum gel viscosity eta.
  citation:
    page: 2
    printed_page: "2"
    quote: "phenomenological active gel model, the local anisotropic friction"
    where: "Introduction (p. 2) & Results/SI Notes (pp. 4, 28-33) vs bois2011 Eqs. (1)-(15)"

- id: q_bois2011_contrasting_myosin_and_patterning_predictions
  kind: unexplained_difference
  about:
    - cgmd_2d_network
    - anisotropic_diffusion_ratio
    - motor_walking_velocity
    - motion_anisotropy_ratio
    - interval_sim_1m
    - interval_sim_3m
