# Open questions documenting misprints, internal contradictions, unstated inputs/models,
# numerical choices, and reading ambiguities found in sekine2024.

- id: q_force_assignment_sign_error
  kind: possible_error
  about:
    - filament_force_distribution
    - filament_force_distribution_corrected
    - cgmd_dimer_rk4
    - cgmd_dimer_rk4_corrected
  text: >
    On SI Notes p. 2 (PDF p. 29), both the motor and crosslinker force-assignment equations
    print a minus sign before delta_{i1}: f_i^{f,m} = delta_{i0} sum (1 - alpha) f - delta_{i1} sum alpha f
    and f_i^{f,cl} = delta_{i0} sum (1 - alpha) f - delta_{i1} sum alpha f. This contradicts
    Fig. S1 directly above on the same page (which draws both (1-alpha)f and +alpha f pointing
    in the same direction as f) and violates force and torque conservation (total force on the
    filament sums to (1 - 2*alpha)f instead of f, producing ~0.416 nm spurious center-of-mass
    drift in our isolated dimer test run_dimer_rk4_printed_eta1 vs 5e-15 nm in the sign-corrected
    variant_of model).
  citation:
    page: 29
    printed_page: "SI Notes 2"
    quote: "to the filament particles with the geometric weight"
    where: "SI Notes I"

- id: q_fdt_missing_kBT
  kind: possible_error
  about:
    - cgmd_2d_network
    - cgmd_anisotropic_langevin
    - kBT_sim
  text: >
    On SI Notes p. 2 (PDF p. 29), the fluctuation-dissipation theorem is printed as
    <xi_{i,a}^X(0) xi_{j,b}^X(t)> = 2 gamma^X delta_{ij} delta_{ab} delta(t), omitting the
    thermal energy factor k_B T. Without k_B T the right-hand side has dimensions [force]/[length]
    instead of [force]^2 (pN^2). Table S1 explicitly lists k_B T = 4.142 x 10^-3 pN*um as a
    bold simulation input parameter, confirming that 2 gamma^X k_B T was intended. In addition,
    the paper does not state whether thermal noise along y under anisotropic friction Eqs. S1a-S1b
    uses 2 gamma_y^f k_B T or isotropic 2 gamma^f k_B T.
  citation:
    page: 29
    printed_page: "SI Notes 2"
    quote: "which satisfy the fluctuation-dissipation theorem"
    where: "SI Notes I"

- id: q_table_s1_cl_persistence
  kind: possible_error
  about:
    - l_cl_bend_sim
    - persistence_length_bending
    - cmp_l_cl_bend_sim
  text: >
    Table S1 (PDF p. 31) prints the crosslinker persistence length formula
    l^{cl,bend} = k^{cl,bend} l_0^{cl} / (2 k_B T) and reports ~ 24.1 um. Direct substitution of
    Table S1's own inputs (k^{cl,bend} = 0.57 pN*um, L_0^{cl} = 0.035 um, k_B T = 4.142 x 10^-3 pN*um)
    yields 2.408 um (rounds to 2.41 um), exactly 10 times smaller than 24.1 um and matching the
    motor persistence length (~ 2.4 um) because 0.57 * 0.035 = 0.01995 ~= 0.1 * 0.2 = 0.02. This
    strongly indicates a factor-of-10 decimal slip in Table S1 (24.1 instead of 2.41 um).
  citation:
    page: 31
    printed_page: "SI Notes 4"
    quote: "∼ 24.1 µm"
    where: "Table S1"

- id: q_eta_cyto_contradiction
  kind: possible_error
  about:
    - eta_cyto_si_text
    - eta_cyto_table_s1
    - cmp_consistency_eta_cyto
    - ref_dimer_rk4_corrected_eta01_dt
    - ref_dimer_rk4_corrected_eta1_dt
  text: >
    SI Notes Section II (PDF p. 30) states 'we set eta_cyto = 10^-1 Pa*sec which is larger than
    the measured cytosolic viscosity 10^-3-10^-1 Pa*sec [27]', whereas Table S1 on the very next
    page (PDF p. 31) lists eta_cyto = 1 Pa*sec in bold as the simulation input. Furthermore, our
    RK4 dimer solver refinement (ref_dimer_rk4_corrected_eta01_dt vs ref_dimer_rk4_corrected_eta1_dt)
    shows that at eta_cyto = 0.1 Pa*s and the paper's stated dt = 5e-5 s, the crosslinker bending
    stiffness number lambda_perp*dt = 16 k^{cl,bend} dt / ((L_0^{cl})^2 gamma^{cl}) = 5.34 exceeds
    the RK4 linear stability boundary (2.785), causing a 24% numerical error at factor=1 (belongs_to:
    numerics), whereas at eta_cyto = 1 Pa*s lambda_perp*dt = 0.534 converges smoothly to 0.0025%
    (belongs_to: model). Both the text logic ('10 times larger than 10^-1') and RK4 stability
    indicate 1 Pa*s was used in the simulations and 10^-1 Pa*s in Section II is a misprint.
  citation:
    page: 30
    printed_page: "SI Notes 3"
    quote: "Therefore, we set ηcyto = 10−1 Pa · sec"
    where: "SI Notes II & Table S1"

