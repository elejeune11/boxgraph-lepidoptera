    printed_page: "11"
    quote: "The interval of the structure is measured"
    where: "Methods (Structure factor)"

- id: q_reading_anisotropic_friction_split_scope
  kind: reading
  about:
    - anisotropic_filament_friction
    - rel_anisotropic_friction_symmetric_limit
    - cgmd_dimer_rk4
    - cgmd_dimer_rk4_corrected
  text: >
    Audit disagreement with scope markings on anisotropic_filament_friction,
    rel_anisotropic_friction_symmetric_limit, and cgmd_dimer_rk4 / cgmd_dimer_rk4_corrected:
    SI Notes p. 3 (PDF p. 30, Eqs. S1a-S1b) specifies only the ratio gamma_y^f / gamma_x^f without
    stating whether gamma_x^f = gamma^f is held fixed while gamma_y^f is scaled up (as opposed to
    holding gamma_y^f = gamma^f or sqrt(gamma_x^f * gamma_y^f) = gamma^f fixed). While
    cgmd_anisotropic_langevin and q_cgmd_2d_not_runnable_unstated_algorithm explicitly mark this
    partition as unstated/reconstructed, anisotropic_filament_friction encodes gamma_x^f = gamma^f
    without reconstructed and rel_anisotropic_friction_symmetric_limit marks the relation as
    provenance: stated. Likewise, cgmd_dimer_rk4 (and its corrected variant) sets thermal noise
    xi = 0, applies the unstated friction split, and constructs a synthetic two-filament geometry
    not stated in the paper without setting reconstructed. Left unchanged per audit rules.
  citation:
    page: 30
    printed_page: "SI Notes 3"
    quote: "where γyf /γxf measures the friction asymmetry"
    where: "Eqs. S1a-S1b"

- id: q_reading_dimer_rk4_solver_and_eigenvalue
  kind: reading
  about:
    - cgmd_dimer_rk4
    - cgmd_dimer_rk4_corrected
    - ref_dimer_rk4_corrected_eta01_dt
    - q_eta_cyto_contradiction
  text: >
    Audit note on solver details in cgmd_dimer_rk4/model.py and ref_dimer_rk4_corrected_eta01_dt:
    (1) model.py hardcodes a divergence cap CAP_UM = 100.0 that returns finite sentinel outputs
    (100000 nm) rather than NaN if triggered (never triggered on current runs because the bounded
    cosine bending potential turns linear RK4 instability into large-amplitude nonlinear oscillations);
    (2) the reported rk4_stiffness_number = 16 * k_bend / (L0_cl^2 * g_cl) * dt (= 5.34 at
    eta_cyto = 0.1 Pa*s, dt = 5e-5 s) is the fixed-ABD center-bead approximation rather than the
    exact coupled two-filament linearized eigenvalue at alpha = 0.5,
    (16 * k_bend / L0_cl^2) * (1/g_cl + 1/(4*g_f)) * dt = 6.75 at dt = 5e-5 s and 3.37 (> 2.785)
    at factor = 2 (dt = 2.5e-5 s). The coupled eigenvalue explains why ref_dimer_rk4_corrected_eta01_dt
    still diverges to 0.153 nm (vs converged 0.418 nm) at factor = 2 even though 5.34/2 = 2.67 < 2.785,
    further reinforcing that dt = 5e-5 s is unstable at eta_cyto = 0.1 Pa*s.
  citation:
    page: 30
    printed_page: "SI Notes 3"
    quote: "solved by using the fourth-order Runge-Kutta method"
    where: "SI Notes I"

