    printed_page: "10"
    quote: "P = 1.78e-6 in Control (n = 9), P = 0.728"
    where: "Fig. 5f caption, Results p. 3, Supp. Fig. 5d, Fig. 4f"

- id: q_si_notes_and_table_s1_minor_typos
  kind: possible_error
  about:
    - d_actin_s6a
    - d_f_lit
    - l_actinin_s6a
    - L0_cl_lit
    - E_f_str_sim
    - E_f_str_lit
    - persistence_length_bending
  text: >
    Additional SI Notes, Discussion, and Table S1 inconsistencies found during independent audit:
    (1) SI Notes III.2 (PDF p. 33) cites 'Supplement Figure 7b6 L_0^f = 0.075' for shorter filament
    length, whereas Supplementary Fig. 7b6 (PDF p. 22) varies crosslinker length L_0^{cl} and panel
    7b7 varies filament length L_0^f (b7-2 = 0.075); (2) Discussion (PDF p. 8) cites 'Supplementary
    Tables 3 and 5' for cluster size and interval dependence on turnover rates, whereas structure
    intervals are in Supplementary Table 4 (Table 5 is motion analysis); (3) Table S1 (PDF p. 31)
    prints l_0^m and l_0^{cl} in the persistence-length formulas instead of the rest-length symbols
    L_0^m and L_0^{cl} (and prints mot instead of m in the motor Young's modulus formula), and uses
    an F-actin Young's modulus (~1.27 x 10^5 Pa) ~16,000x softer than the literature value listed
