- id: q_nanocluster_motion_code_vs_methods
  kind: possible_error
  about:
    - motion_anisotropy_ratio
    - sim_pixel_size_printed
    - pseudo_image_discretization
    - roi_side_px_live
    - dt_frame_live
    - aniso_ratio_sim_4m
    - aniso_ratio_st15_0
    - aniso_ratio_st16_ctrl
    - sekine_code/nanocluster_motion_matlab
    - sekine_code/nanocluster_motion_methods_spec
    - sekine_code/implied_pixel_size_bounds
  text: >
    Cross-record audit of the released MATLAB nanocluster motility script (sekine_code:
    Nanocluster_motion.m, 260 lines, and README.md, 8 lines; cited on Methods p. 10 and Code
    availability p. 11 for Fig. 4d,e, Fig. 5a,d, and Supplementary Table 5) reveals that the script
    only implements an upstream binary image-tracking step exporting 6 raw-pixel columns
    (x1, y1, A1, x2, y2, A2; with (0, 0, 0) sentinels for unmatched clusters) and diverges from
    Methods p. 10 / README.md in six major respects (verified by porting Nanocluster_motion.m in
    sekine_code/nanocluster_motion_matlab vs the documented specification in
    sekine_code/nanocluster_motion_methods_spec; no ModelAtlas equation relation exists because
    sekine_code ports image tracking whereas sekine2024 models CGMD dynamics and summary ratios,
    pixel-area vs pixel-length formulas differ in dx^2 vs dx^1 scaling and are too_plain, and
    Methods p. 10's 7 tracking thresholds appear only in prose rather than sekine2024/data.yaml):
    (1) Missing circularity 0.5-1.0 filter (sekine_code/q_missing_circularity_filter):
    Nanocluster_motion.m never computes or exports perimeter or circularity, so circularity
    filtering cannot even be applied downstream in R (an elongated 1x20 px rod with A = 20 px =
    0.0374 um^2 and C = 0.143 << 0.5 is tracked as matched=1 vs Methods spec matched=0).
    (2) Missing 0.5-2 fold area-ratio filter and undisclosed largest-overlap tie-breaker
    (sekine_code/q_missing_area_ratio_and_largest_tiebreak): line 44 sets
    bwareafilt(BW_Image_2, [1 Inf]) ('%no limitation', contradicting line 39's comment '6 to 53
    pixels') with no area-ratio check (accepting a 16->64 px, 4.0x fusion), and for >= 2
    8-connected intersection components lines 101-145 select the LARGEST overlapping t_{n+1}
    object (maxArea, comment 'before was nearest one'), discarding a valid 1.0x match whenever
    the cluster also touches a larger 4.0x structure so downstream 0.5-2x filtering cannot
    recover it (matched=0 vs spec matched=1).
    (3) Unreleased displacement and anisotropy computation
    (sekine_code/q_missing_displacement_and_anisotropy_code): Nanocluster_motion.m contains no
    pixel-to-micron factor, no frame interval (dt_frame_live = 0.32 s), no zero-sentinel removal,
    no dx/dy subtraction, and no |dy|/|dx| ratio (motion_anisotropy_ratio); the downstream R
    script cited on Methods p. 10 is not released.
    (4) Hidden imclearborder, default im2bw(0.5), 8-connectivity, and hardcoded frame count
    (sekine_code/q_hidden_imclearborder_filter, sekine_code/q_hidden_im2bw_threshold_and_connectivity,
    sekine_code/q_hardcoded_frame_count_ignores_filelist): lines 41 and 45 silently call
    imclearborder on both frames (dropping 50x50 px ROI border-touching clusters at t_n and
    turning clusters stepping onto the border at t_{n+1} into (0, 0, 0) rows: matched=0 vs spec
    matched=2); lines 35-36 call deprecated im2bw with implicit default level = 0.5 (127.5/255 for
    uint8, erasing dim intensity-100 clusters unless pre-binarized externally in Fiji via Methods
    p. 10's local Otsu r = 5 px: matched=0 vs spec matched=2) with undisclosed 8-connectivity; and
    line 8 hardcodes Numb_of_Images = 100 (99 pairs, ignoring num_frames = numel(filelist) on line
    25), conflicting with Methods p. 10's 200-frame live-imaging length.
    (5) Stage 1 and Stage 2 tracking bugs (sekine_code/q_stage1_centroid_miss_bug,
    sekine_code/q_stage2_hole_shrink_and_silent_try_catch_abort): Stage 1 (lines 61-67) calls
    bwselect on raw intersection centroids without imfill/shrink, dropping non-convex or 2-px
    anti-diagonal overlaps whose rounded centroid lands on a 0 background pixel (matched=0 vs
    spec matched=1); Stage 2 (lines 88, 110-119, 181-191, 241-242) applies imfill('holes') +
    bwmorph('shrink', Inf), collapsing ring-shaped overlaps onto interior 0 hole pixels of Cumm_Img
    so empty bwselect -> Centroid throws an error silently swallowed by the bare try/catch around
    the per-cluster loop, aborting the rest of the frame and dropping all subsequent unrelated
    clusters (3 of 4 dropped, including an unrelated healthy cluster; plus an uninitialized
    ref_Coordinate_List crash on line 243 if frame 1 is empty or fails on cluster 1).
    (6) Implicit pixel-size bracket from [6, 53] px vs 0.01-0.1 um^2
    (sekine_code/q_unstated_pixel_size_and_sim_grid_mismatch, reinforcing q_sim_pixel_size_mismatch):
    line 40's hardcoded [6, 53] px window uniquely constrains the unstated pixel pitch to
    (0.043033, 0.043437] um (sekine_code/implied_pixel_size_bounds), matching experimental
    sim_pixel_size_printed = 0.04325 um (6 px = 0.01122 um^2, +12.2% above 0.01 um^2; 53 px =
    0.09914 um^2) while excluding both the exact simulation grid pitch 3/69 = 0.043478 um (52 px)
    and Supplementary Fig. 6a's 43 nm = 0.043 um (54 px).
  citation:
    page: 10
    printed_page: "10"
    quote: "measured using an original program written in Matlab"
    where: "Methods (Motion anisotropy) & Code availability (p. 11) vs sekine_code/Nanocluster_motion.m"

- id: q_bois2011_continuum_vs_microscopic_bridge
  kind: unstated_model
  about:
    - ref-14
    - sref-21
    - ref-23
    - cgmd_2d_network
    - cgmd_anisotropic_langevin
    - cylindrical_friction_filament
