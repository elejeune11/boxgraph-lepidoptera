    rather than the already-declared spatial_frequency (which would mismatch a spatial_frequency
    x-axis when digitizing Supplementary Fig. 7c); and (3) rel_gaussian_sf_peak_limit pins both
    mu_over_2pi and q_over_2pi to constant 1.0 instead of equating q_over_2pi = mu_over_2pi. Left
    unchanged per audit rules (first reader's model-scope choice).
  citation:
