- id: q_cgmd_2d_not_runnable_unstated_algorithm
  kind: unstated_model
  about:
    - cgmd_2d_network
  text: >
    The full 2D many-body CGMD simulation (Eqs. S1-S9, S1a-S1b) cannot be uniquely reconstructed
    from the paper alone: SI Notes I (PDF p. 30) states that a free motor or crosslinker 'binds to
    a randomly-selected pair of filaments whenever it find a position on each filament that are
    separated by the length' L_0^m or L_0^{cl}, without specifying the binding attempt rate per
    time step, number of pair trials, distance tolerance, or intersection selection rule. In
    addition, how gamma_y^f/gamma_x^f is split between gamma_x^f and gamma_y^f, whether thermal
    noise scales anisotropically, the exact steady-state averaging window and delta_q bin width
    for S(q), and the simulation frame interval between t_n and t_{n+2} in Fig. 4d are all unstated
    (simulation code is available only upon request to M.T.).
  citation:
    page: 30
    printed_page: "SI Notes 3"
    quote: "binds to a randomly-selected pair of filaments whenever"
    where: "SI Notes I"

- id: q_missing_relaxation_time_explanation
  kind: unstated_model
  about:
    - cgmd_2d_network
    - cgmd_anisotropic_langevin
    - cmp_langevin_passive_vs_sim_2m
    - cmp_analytic_passive_vs_sim_2m
    - aniso_ratio_sim_2m
  text: >
    Main text (PDF p. 6) attributes cluster alignment and biased motion toward the higher-friction
    direction to 'the difference in the relaxation time scale of the filaments... caused by the
    friction asymmetry (see Supplementary Notes)'. However, the Supplementary Notes (PDF pp. 28-33)
    contain no derivation or discussion of relaxation time scales or cluster motion anisotropy.
    Moreover, single-filament passive Brownian motion under Eqs. S1a-S1b with FDT gives
    <|dy|>/<|dx|> = sqrt(gamma_x^f / gamma_y^f) = 1/sqrt(1.5) = 0.816 < 1 (verified by
    run_anisotropic_langevin_filament), opposite in sign to motor-free many-body simulation 2-M
    (<|dy|>/<|dx|> = 1.13 > 1, P = 0.0485), implying that non-equilibrium filament/crosslinker
    turnover or cluster-shape centroid tracking must invert the displacement anisotropy.
  citation:
    page: 6
    printed_page: "6"
    quote: "relaxation time scale of the filaments"
    where: text

- id: q_structure_factor_normalization
  kind: possible_error
  about:
    - structure_factor_interval
    - gaussian_structure_factor
  text: >
    Methods (PDF p. 11) writes S(q) = integral_q^{q+dq} integral_0^{2*pi} <(1/N_f) sum_j sum_k
    exp[-i q . (r_j^f - r_k^f)]> q dtheta dq, omitting the bin-area normalization 1/(2*pi*q*dq)
    and summing over all filament particles (2 N_f particles while dividing by N_f). In
    Supplementary Fig. 7c1-c4 (PDF p. 22), S(q) decays toward ~0.1 at large q/(2*pi) = 6 rather
    than growing linearly with q as the unnormalized integral predicts, indicating that bin
    averaging (and likely j != k or baseline handling) was applied in the code.
  citation:
    page: 11
    printed_page: "11"
    quote: "The structure factor is calculated from the position"
    where: "Methods (Structure factor)"

