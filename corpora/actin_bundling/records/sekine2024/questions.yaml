  text: >
    Direct biological and mechanistic comparison between the two Shigeo Hayashi-lab studies on the
    exact same experimental system — periodic circumferential cortical actin rings/cables in the
    stage 15-16 Drosophila embryonic tracheal dorsal trunk — reveals one closely concordant
    wild-type observable alongside four sharp mechanistic and experimental divergences:
    (1) Same-system wild-type spacing and tube geometry (concordant): Hannezo 2015 measures stage-16
    WT actin ring period 0.5 +/- 0.1 um (ring_wavelength_embryo_wt, n > 150 rings, Lifeact-mEGFP;
    Fig. 3B histogram mean 0.494 +/- 0.081 um, bar 0.499 +/- 0.068 um), whereas Sekine 2024
    measures early stage-16 periodic cable interval 450 +/- 13.2 nm (0.450 +/- 0.0132 um;
    cable_interval_in_vivo, Airyscan super-resolution Lifeact::GFP, n = 294 cables across N = 8
    embryos; Supp. Fig. 1d median 446.8 nm, range 435.2-474.6 nm). The 10% mean offset (450 vs
    500 nm) sits well inside Hannezo's +/- 100 nm spread, and the 7.6x narrower printed uncertainty
    reflects distinct summary statistics: Source-data_SupplementaryFig1d.xlsx
    (sekine_source_data/s1d_cable_interval_mean = 0.450123 um, s1d_cable_interval_sd = 0.013158 um)
    confirms +/- 13.2 nm is the sample SD across N = 8 embryo means, whereas Hannezo's +/- 0.1 um
    is the per-ring pooled SD. Dorsal-trunk diameter also aligns across developmental staging:
    Sekine Fig. 1j rises from 2.60 um (-80 min) to 3.94 um (+20 min, range 2.22-4.66 um) across
    stage 15 to early stage 16, approaching Hannezo Fig. 4F's stage-16 WT diameter 4.775 +/-
    0.250 um. On forward spacing prediction, Sekine's CGMD 4-M produces 529 nm (~0.5 um, +17.6%
    above 450 nm), whereas Hannezo Main p. 3's literature inputs predict 1.8 um (1.749 um exact,
    3.5x-3.9x larger) and SI p. 21 reproduces 0.50-0.55 um only after inverting l_h = 10 nm
    (8.18 nm exact) directly from 0.5 um.
    (2) Myosin II / contractility requirement (complete pattern loss vs persistent oriented
    nanoclusters and fusion-specific role): Hannezo 2015 (Main p. 3, Fig. 2C) reports complete
    disappearance of stage-16 actin rings after 180-min incubation in 250 uM Y-27632 (ROCK
    inhibitor), taking this as decisive proof of a contractility-driven hydrodynamic instability
    whose uniform state is strictly stable below threshold (lambda(q) = -1/tau - D*q^2 < 0 at zero
    contractility in dispersion_relation_eq7). Although Sekine 2024 (p. 4) describes Myosin II[DN]
    (zip[ROD]) as "consistent with the ROCK inhibitor treatment14", Sekine's own quantitative data
    tell a substantially different mechanistic story: Myosin II[DN] does NOT abolish actin
    clustering or circumferential bias — nanoclusters remain robust (major 325.64 nm, minor
    171.16 nm, aspect ratio 2.034), retain partial circumferential orientation (54.4 deg vs
    63.5-66.5 deg controls and 44.5 deg random/DAAM; zip RNAi in Table 2 retains 59.5 deg and
    330.58 nm), preserve statistically significant circumferential fusion-duration stabilization
    (P = 1.83e-5, Fig. 3e), and preserve significant circumferential motion anisotropy
    (|dy|/|dx| = 1.20 vs 1.60 control; PIV |V_y| = 27.2 > |V_x| = 22.6 nm/s, P = 8.98e-6,
    Fig. 5d-f). Correspondingly, Sekine's CGMD self-organizes periodic 404 nm nanoclusters at
    zero myosin motors (1-M, N^m = 0) via passive alpha-actinin crosslinking alone, and even forms
    circumferentially oriented fused cables without motors at high crosslinker density (2-H:
    N^cl = 7500, N^m = 0, gamma_y^f/gamma_x^f = 1.5 -> median 59 deg, dominant 85.3 deg, major
    439.6 nm, coherency 0.15). Thus myosin II is the sole pattern-initiating instability driver in
    hannezo2015, whereas in sekine2024 it acts downstream solely to bridge and fuse pre-existing
    crosslinker-nucleated nanoclusters (with Y-27632's complete abolition in Hannezo potentially
    reflecting broader 180-min ROCK-pathway effects on cortical actin assembly/RhoA signaling beyond
    myosin II motor activity alone).
    (3) Friction anisotropy threshold, molecular cue, and opposite flow/motion direction:
    Hannezo Main p. 3 reports that small orthoradial friction excess xi_theta > 1.1*xi_z (10%;
    20% shown in Fig. 2E) suffices to orient rings circumferentially, attributing friction and its
    anisotropy to ECM-cortex coupling (axially aligned luminal chitin fibers, Src42A increasing
    spacing to 0.8 +/- 0.2 um, moesin RNAi increasing larval taenidial spacing +25% to 1.8 +/-
    0.5 um, and chitin-deficient kkv1 expanding spacing 9-10x to 4.5 +/- 2 um with chaotic
    wandering). Sekine SI Notes p. 32 instead requires 5x larger friction asymmetry
    (gamma_y^f/gamma_x^f >= 1.5, applied exclusively to actin filaments) plus both threshold
    crosslinkers (N^cl >= 6750; 4-L with N^cl = 4500 stays dispersed at 52 deg, coherency 0.15)
    and motors (N^m = 900), identifying mechanosensitive formin DAAM (DAAM RNAi: 44.5 deg,
    isotropic fusion P = 0.114, isotropic motion |dy|/|dx| = 0.96, PIV P = 0.728, labyrinth) and
    alpha-Actinin/Zasp52 (actn14: 42.5 deg; Zasp52 RNAi: 48.5 deg, |dy|/|dx| = 0.98, PIV P = 0.436)
    as the anisotropy-sensing machinery. Most fundamentally, the direction of actin transport
    relative to friction anisotropy is reversed: in Hannezo's active gel (xi_theta > xi_z),
    higher circumferential friction suppresses circumferential flow v_theta relative to axial flow
    v_z so contractile advection moves actin along the low-friction longitudinal axis (|v_z| >
    |v_theta|), matching the passive single-filament Brownian bias |dy|/|dx| = 1/sqrt(1.5) =
    0.816 < 1 (anisotropic_diffusion_ratio, rel_hannezo2015_aniso_diff_scales_turnover_length);
    whereas Sekine observes and simulates faster nanocluster displacement and PIV flow along the
    high-friction circumferential axis (|dy|/|dx| = 1.13 in 2-M, 1.45 in 4-M, 1.72 at Stage 15
    0* min, 1.60 in Stage 16 control, 1.20 in Myosin II[DN]; PIV |V_y| > |V_x|), an inversion not
    explained by equilibrium friction or linear active-gel flow (see also
    q_missing_relaxation_time_explanation).
    (4) De novo instability onset vs two-stage nanocluster fusion/fission dynamics: Hannezo 2015
    proposes a single-step supercritical/subcritical bifurcation from a homogeneous stage-15
    cortex triggered by a +60% (text p. 1; +70% Fig. 1A) increase in F-actin concentration ramping
    chi from 1.07 to 1.47 over 1875 s (supported by gamma-COP mutants with -20%/-45% diameter and
    -40%/-65% actin lacking rings). Sekine 2024 resolves a hierarchical two-stage process during
    stage-15 tube expansion (-80 to 0* min): sporadic ~140 x 210 nm (mode; mean 178 x 329 nm)
    nanoclusters emerge first, align circumferentially (-40 to 0* min: dominant direction 15.6 ->
    83.9 deg, median 44.5 -> 66.5 deg) before cable connectivity rises (-10 to 0* min: coherency
    0.13 -> 0.48), and sustain steady-state periodic cables through repetitive sub-second (0.64 s)
    fusion and fission with DAAM-dependent circumferential stabilization — a dynamic
    cluster-coalescence pathway that neither paper reconciles quantitatively with Hannezo's
    monolithic density-wave bifurcation or kkv1 chaotic ring dynamics.
