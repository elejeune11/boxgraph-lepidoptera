  text: >
    Methods (PDF p. 11) states that the 3 x 3 um^2 simulation box 'was discretized into 69 x 69
    square boxes of the length 0.04325 um, which is comparable to the pixel size of the
    experimental images.' Exact division gives 3 / 69 = 0.043478 um (69 * 0.04325 = 2.98425 um).
    The printed value 0.04325 um reproduces the experimental PIV window conversion on p. 10
    (91 / 10 * 0.04325 = 0.39358 -> 0.394 um), indicating 0.04325 um is the experimental pixel size
    rather than the exact 3/69 simulation grid pitch.
  citation:
    page: 11
    printed_page: "11"
    quote: "the length 0.04325 µm, which is comparable to"
    where: "Methods (Models)"

