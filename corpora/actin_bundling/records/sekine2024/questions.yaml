    - interval_sim_a4_1
    - f_walk_table_s1
    - f_walk_fig_s7b3_4m
    - sim_2h_orient
    - sim_2h_major
    - sim_2h_coherency
    - sim_4l_orient
    - sim_4l_coherency
    - sim_4m_orient
    - sim_4m_coherency
    - t2_myosin_dn_orient
    - t2_myosin_dn_major
    - aniso_ratio_sim_2m
    - aniso_ratio_sim_4m
