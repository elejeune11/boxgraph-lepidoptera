    - structure_factor_interval_wavenumber
    - cable_interval_in_vivo
    - interval_sim_4m
    - eta_cyto_table_s1
    - eta_cyto_si_text
    - L0_f_sim
    - L0_m_sim
    - L0_cl_sim
    - N_f_sim
    - N_cl_sim
    - N_m_sim
