    - q_missing_relaxation_time_explanation
    - bois2011/single_species_dispersion_eq12
    - bois2011/single_species_instability_eq13
    - bois2011/single_species_stability_boundary_hill
    - bois2011/single_species_fastest_mode
    - bois2011/single_species_pde_eq1_3
    - bois2011/single_species_rda_dispersion_eq15
    - bois2011/asdm_dispersion_eq15
    - bois2011/asdm_stability_boundary
    - bois2011/asdm_pde_eq14
  text: >
    Comparing bois2011's 1D active-fluid continuum framework against sekine2024's 2D CGMD
    simulations and in vivo Drosophila tracheal perturbations reveals five qualitative and
    quantitative predictive divergences — most sharply in myosin motor dependence:
    (1) Motor-free periodic clustering vs mandatory active-stress threshold: in bois2011's
    single-species model (Eqs. 1-13), vanishing active stress (Pe = 0) gives lambda(k) = -D*k^2 < 0
    for all k != 0 so no clusters or patterns can form below the finite threshold Pe > Pe_crit
    (Pe_crit >= 4 for Hill stress at c_0 = 1, Eq. 13; ASDM at Pe = 0 requires autocatalytic
    Turing chemistry with D_a/D_s < 0.114 at rho_a = 1, rho_s = 1.5). In contrast, sekine2024
    demonstrates spontaneous, regularly spaced ~200-350 nm nanoclusters with periodic structure
    factor interval 404 nm (1-M, mu/(2*pi) = 2.476 um^-1) at N^m = 0 (zero myosin motors) purely
    from passive alpha-actinin crosslinking + filament turnover, and even aligned fused structures
    at high crosslinker density (2-H: N^cl = 7500, N^m = 0, gamma_y^f/gamma_x^f = 1.5, major =
    439.6 nm, dominant direction = 85.3 deg, coherency = 0.15). Consistently, in vivo myosin II[DN]
    still forms nanoclusters (325.64 nm major length, orientation 54.4 deg) and retains significant
    circumferential fusion-duration bias (P = 1.83e-5, Fig. 3e) and PIV anisotropy (P = 8.98e-6,
    Fig. 5f), failing specifically at cluster-to-cable fusion rather than initial clustering.
    (2) Non-monotonic motor-activity window (upper destruction threshold) vs monotonic Pe
    amplification: in bois2011 Eqs. (12) and (15) (Figs. 3a-b, 5b-c), diffusivity D is independent
    of active stress, so raising Pe monotonically increases growth rates, expands unstable parameter
    regions, and sharpens concentration peaks without any upper bound (Pe = 7, 10, 25, 50). In
    sekine2024 (SI Notes III.2, pp. 32-33; Fig. S7b3), aligned stripes occur only inside an
    intermediate window of motor walk force: f^walk = 0 produces an unoriented labyrinth;
    f^walk = 0.001-0.005 pN (v^walk = 0.01-0.05 um/s, filament traversal time tau_walk = 10-2 s,
    single-filament Peclet Pe_fil = v^walk*L_0^f/D_fil = 0.32-1.59 at eta_cyto = 1 Pa*s) produces
    circumferential stripes (4-M); and f^walk = 0.05 pN (v^walk = 0.5 um/s, tau_walk = 0.2 s = 50x
    faster than filament turnover 1/omega^f = 10 s, Pe_fil = 15.9, drag force 2*gamma^f*v^walk =
    0.660 pN >> k_B T/L_0^f = 0.0414 pN) injects active agitation that enhances effective filament
    diffusion and destroys the pattern completely ("no clear pattern", SI Notes p. 33; see also
    q_f_walk_contradiction).
    (3) Opposite sign of myosin-induced pattern-spacing shift: adding N^m = 900 motors in
    sekine2024 increases the structure-factor interval from 404 nm (1-M, N^m = 0) to 571 nm
    (3-M isotropic labyrinth, +41.3%) and 529 nm (4-M anisotropic stripes, +30.9%, Supplementary
    Table 4) — shifting peak spatial frequency downward (2.476 -> 1.751 / 1.891 um^-1) as motors
    bridge and coalesce neighboring clusters. By contrast, raising active stress Pe in bois2011
    shifts the fastest-growing linear wavenumber monotonically upward and shortens the selected
    wavelength: k_max*ell = sqrt(sqrt(Pe/4) - 1) increases from 0.568 (Pe = 7) to 1.225 (Pe = 25)
    and 1.592 (Pe = 50) in single-species Eq. (12), and from 1.215 (Pe = 7) to 1.630 (Pe = 25) and
    2.005 (Pe = 50) in ASDM Fig. 5c (lambda_lin/ell drops from 11.1 to 3.95 and 5.17 to 3.13).
    (4) Crosslinker necessity, coarsening, and turnover scaling: sekine2024 requires passive
    crosslinker attraction above a threshold (N^cl = 6750, omega^cl <= 0.01 s^-1; dropping to
    N^cl = 4500 in 4-L or raising omega^cl to 0.02-0.03 s^-1 yields a dispersed state even with
    full motors and friction anisotropy), a mechanism absent from bois2011 (where passive viscosity
    eta instead widens ell and raises finite-domain Pe_crit in Eq. 13). On turnover, bois2011's
    conserved single-species PDE (Eqs. 1-3, Fig. 4) coarsens all multi-peak transients to 1 peak,
    requiring chemical turnover (Eq. 15; e.g. first-order dR/dc = -omega^f in hannezo2015 giving
    lambda_c propto (omega^f)^(-1/4)) to arrest coarsening. Lowering omega^f 10-fold (0.1 ->
    0.01 s^-1) in motor-free sekine2024 (1-M -> a4-1) increases spacing by only +16.6%
    (404 -> 471 nm) vs +77.8% (10^(1/4) - 1) predicted by bois2011 Eq. (15) with first-order
    turnover, and with motors at omega^f = 0.01 s^-1 (Fig. S7b5) reverts stripes back into compact
    isolated clusters rather than coarsening to a single global peak.
    (5) 1D isotropic flow vs 2D anisotropic friction and opposite motion-anisotropy direction:
    bois2011 is strictly 1D and isotropic and cannot select 2D stripe orientation; extending
    bois2011's overdamped force balance to 2D anisotropic friction gamma_y/gamma_x = 1.5 (as in
    hannezo2015) gives Pe_x/Pe_y = 1.5 and ell_x/ell_y = 1.225, selecting wavevector k_x (stripes
    aligned along high-friction y) via advective flow v_x along the low-friction x-axis (same sign
    as passive single-filament Brownian bias |dy|/|dx| = 1/sqrt(1.5) = 0.816 < 1 in
    anisotropic_diffusion_ratio). In sekine2024, cables also align along the high-friction y-axis,
    yet tracked nanocluster displacements are biased along the high-friction y-axis instead
    (|dy|/|dx| = 1.13 in 2-M, 1.45 in 4-M, 1.60 in Stage 16 control, 1.72 at Stage 15 0 min, and
    1.20 in myosin II[DN]; see also q_missing_relaxation_time_explanation), reflecting
    many-body turnover and circumferential motor-bridging coalescence rather than low-friction
    x-axis hydrodynamic advection.
  citation:
    page: 33
    printed_page: "SI Notes 6"
    quote: "no clear pattern is observed (f walk = 0.05). This is probably because the higher motor walk force"
    where: "SI Notes III.2 (pp. 32-33), Supp. Tables 3-5 & Figs. 3-5 vs bois2011 Eqs. (12)-(15)"

