  text: >
    Audit of every citation of Hannezo et al. (PNAS 112:8620-8625, 2015; ref-14 on main pp. 1-2, 4,
    6, 8 and sref-21 on SI Notes pp. 30, 32) across sekine2024 establishes zero cited.yaml value
    links and zero stated ModelAtlas equation relations, alongside three verified proposed relations
    bridging single-filament Langevin diffusion to Hannezo's turnover-diffusion length
    (rel_hannezo2015_langevin_dx_approx_turnover_length,
    rel_hannezo2015_langevin_dy_approx_turnover_length,
    rel_hannezo2015_aniso_diff_scales_turnover_length):
    (0) Cited-data and stated-relation audit: none of sekine2024/data.yaml's 9 from_source entries
    cites ref-14 or sref-21 (they cite sref-15, -16, -17, -23, -25, -27). Even Table S1's filament
    turnover rate omega^f = 0.1 s^-1 (lifetime 1/omega^f = 10 s, which sits inside Hannezo's FRAP
    tau = 15 +/- 7 s -> 1/tau in [0.045, 0.125] s^-1) prints no reference to [21], and Sekine's
    anisotropy threshold gamma_y^f/gamma_x^f >= 1.5 is its own CGMD sweep threshold rather than
    Hannezo's xi_theta > 1.1*xi_z. All seven mentions of Hannezo 2015 are conceptual or qualitative
    experimental comparisons (prior active-gel anisotropic-friction cue, DAAM labyrinth, ROCK
    inhibitor Y-27632, and circumferential force balance); sekine2024 derives cgmd_2d_network from
    Tarama & Shibata 2022 (sref-12) and states no mathematical reduction, equivalence, or scaling
    map between its CGMD equations and Hannezo's active-gel PDEs.
    (1) Non-runnable 2D pattern-forming models and model-class mismatch: the two models that
    directly address 2D anisotropic-friction stripe orientation — hannezo2015/cortical_pde_2d_anisotropic
    (unstated 2D tensorial viscosity, aspect ratio, BCs, and parameters; hannezo2015/q_unstated_2d_anisotropic_model)
    and sekine2024/cgmd_2d_network (12,150 discrete agents with unstated binding protocol,
    anisotropic friction split, noise scaling, and S(q) binning; q_cgmd_2d_not_runnable_unstated_algorithm)
    — are both non-runnable and belong to structurally incompatible classes. Hannezo formulates
    1D/2D compressible viscous continuum active-gel PDEs with linear active stress
    sigma = chi^0*(rho/rho_0) + eta*d_x v and no passive crosslinkers; Sekine simulates discrete
    polar two-bead actin filaments (N^f = 4500), passive alpha-actinin crosslinkers (N^cl = 6750),
    and bipolar myosin II motors (N^m = 900) where the counterforce of f^walk vanishes identically
    via Eq. (S4) and active forces arise solely from kinematic ABD walking stretching harmonic
    motor arms. Neither paper derives continuum gel viscosity eta, substrate friction xi, or active
    stress chi^0 from Eqs. (S1)-(S9). Across the remaining runnable pairs, trivial too_plain shapes
    (e.g. structure_factor_interval_wavenumber 2*pi/mu vs critical_wavelength_eq3) and accidental
    dimensional collisions (hannezo2015/viscosity_2d_from_3d [Pa*s*m] vs
    sekine2024/cylindrical_friction_filament [pN*s/um], both [M]/[T] yet physically distinct) are
    excluded.
    (2) Symbol overloading and dimensional mismatches: eta denotes 2D thickness-integrated cortical
    viscosity (eta = eta_3D*h = 10^-5 Pa*s*m, with eta_3D = 100 Pa*s) in Hannezo vs background
    cytosolic solvent viscosity eta_cyto (1 Pa*s in Table S1; 0.1 Pa*s in SI Notes II) in Sekine;
    xi (also zeta on Main pp. 3, 5) is 2D continuum ECM friction (10^9 Pa*s/m Main p. 3; 3D
    ~10^17 Pa*s/m^2 SI p. 21) in Hannezo vs thermal Langevin noise xi_i^X and motor ABD sliding
    friction zeta = 0.1 pN*s/um in Sekine; gamma^f is single-bead cytosolic Stokes drag
    [pN*s/um] in Sekine (absent in Hannezo); alpha is dimensionless cell length l/l_h = 480-500 in
    Hannezo vs fractional ABD binding coordinate 0 <= alpha <= 1 in Sekine; and sigma is axial
    cortical stress in Hannezo vs Gaussian S(q) peak width [1/um] in Sekine.
    (3) Breakdown of continuum hydrodynamic scale separation (l_h << L_0^f, L_0^m): inverting
    Hannezo Eq. [3] (hydrodynamic_length_from_wavelength) with Hannezo's FRAP inputs (D = 0.04 um^2/s,
    tau = 15 s -> l_t = 0.775 um) yields l_h = 8.18 nm (SI p. 21 printed 10^-8 m) for Hannezo's
    0.50 um spacing and l_h = 6.62 nm for Sekine's 450 nm spacing — 12x-15x smaller than a single
    actin filament (L_0^f = 100 nm), 24x-30x smaller than a bipolar myosin II filament (L_0^m =
    200 nm), and 20x-58x smaller than an actin nanocluster (168-384 nm). Even Hannezo Main p. 3's
    literature estimate l_h = 100 nm equals L_0^f and is half L_0^m while overpredicting embryonic
    WT spacing by 3.5x-3.9x (1.75 um computed / 1.8 um printed vs 0.50 / 0.45 um).
    (4) Microscopic-to-continuum transport and drag tension (eta_cyto = 0.1 vs 1 Pa*s): at Sekine's
    SI Notes II value eta_cyto = 0.1 Pa*s, single-filament two-bead Stokes drag is 2*gamma_x^f =
    0.132 pN*s/um, giving Einstein-Stokes center-of-mass diffusivity D_fil,x = k_B T / (2*gamma_x^f) =
    0.0314 um^2/s (D_fil,y = 0.0209 um^2/s at gamma_y^f/gamma_x^f = 1.5) and turnover-diffusion
    length l_{t,x} = sqrt(D_fil,x / omega^f) = 0.560 um (l_{t,y} = 0.458 um) — matching Hannezo's
    in vivo FRAP (D = 0.04 +/- 0.03 um^2/s, tau = 15 +/- 7 s, l_t = 0.8 +/- 0.5 um) while areal
    filament drag density xi_2D,x = (N_f/L_box^2)*(2*gamma_x^f) = 6.60e7 Pa*s/m (1.31e8 Pa*s/m
    including crosslinkers and motors) sits ~10x below Hannezo's xi = 10^9 Pa*s/m. Conversely, at
    Table S1's bold eta_cyto = 1 Pa*s (required for RK4 stability at dt = 5e-5 s;
    q_eta_cyto_contradiction), areal drag density closely matches Hannezo's 10^9 Pa*s/m
    (xi_2D,x = 6.60e8, xi_2D,y = 9.90e8 Pa*s/m for filaments alone; 1.31e9 / 1.64e9 Pa*s/m
    including all 12,150 agents), whereas free-filament diffusivity drops 12.7x below Hannezo's FRAP
    (D_fil,x = 0.00314 um^2/s, l_{t,x} = 0.177 um).
    (5) Incompatible turnover and contractility scaling laws: Hannezo Eq. [3] predicts
    lambda_c = 2*pi*(D*tau*eta/xi)^(1/4) propto (omega^f)^(-1/4) (+77.8% spacing increase for a
    10-fold drop in omega^f) and supercritical spacing reduction as contractility chi rises
    (Main p. 3; ring count n ~ sqrt(chi) in SI Fig. S15). In Sekine Supp. Table 4, lowering
    omega^f 10-fold (0.1 -> 0.01 s^-1, motor-free 1-M -> a4-1) increases spacing by only +16.6%
    (404 -> 471 nm, effective exponent -0.067 vs -0.25) and with motors (Fig. S7b5) collapses
    stripes back into discrete clusters; meanwhile adding motors lengthens spacing by +30.9% to
    +41.3% (404 -> 529 nm in 4-M, 571 nm in 3-M) and raising motor walk force to f^walk = 0.05 pN
    destroys the pattern completely via active agitation (SI Notes pp. 32-33).
