# Cross-record links from sekine2024 values to released Source Data (sekine_source_data).
#
# Notes on scope:
# 1. All 80 table/text scalar values from sekine2024 that appear verbatim in sekine_source_data/data.yaml
#    are already linked in sekine_source_data/data.yaml (80/80 checked and reproduced).
# 2. None of sekine2024's 44 digitized figure curves (d_fig1h_orientation, d_fig1i_coherency,
#    d_fig1j_diameter, d_fig1k_length, d_fig2b_mean_*, d_fig3a_*, d_fig3d_coloc_st15, d_fig3e_mean_*,
#    d_fig4c_sim_exp, d_fig4e_shift, d_fig4f_*, d_fig5c_*, d_fig5f_*, d_figs1*, d_figs3*,
#    d_figs5d_coloc_st16, d_figs6*, d_figs7c*) can be linked here as table-to-table cited links because
#    sekine_source_data (kind: software, 27 .xlsx files) declares only 135 scalar summary cells in its
#    data.yaml and 0 table datums (BoxGraph Synthesis requires both sides of a table link to be tables).
#    Independent check of all 44 digitized PDF curves directly against the 27 unpacked .xlsx files is
#    documented in build/actin_bundling/relate-check/sekine2024+sekine_source_data/ and questions.yaml.
# 3. The 4 Supplementary Table 1 cluster means (st15/16_major/minor_mean, 4 sig figs) are already
#    validated directly against raw Source-data_Fig1ef.xlsx in sekine_source_data/validations.yaml.

- datum: aniso_ratio_st16_ctrl_fig5d
  from_source: sekine_source_data
  from_datum: f4e_st16_ctrl_ratio
  evidence: "Fig. 5d printed Stage 16 Control motion anisotropy ratio |dy|/|dx| = 1.60 is the same published summary statistic as Supplementary Table 5 embedded in Source-data_Fig4e.xlsx (sheet 'Figure 4e', cell E21 = 1.6; note raw Source-data_Fig5d.xlsx contains a different n=497 export giving 1.735)."

- datum: aniso_ratio_st16_myosin_dn_fig5d
  from_source: sekine_source_data
  from_datum: f4e_st16_myosin_ratio
  evidence: "Fig. 5d printed Stage 16 Myosin II[DN] motion anisotropy ratio |dy|/|dx| = 1.20 is the same published summary statistic as Supplementary Table 5 embedded in Source-data_Fig4e.xlsx (sheet 'Figure 4e', cell E24 = 1.2; also reproduced to 1.197 from raw Source-data_Fig5d.xlsx)."
