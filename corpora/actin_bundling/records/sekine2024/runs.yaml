  outputs: {w_single: width_single_computed, w_dimer: width_dimer_computed}

- id: run_pseudo_image_pixel
  model: pseudo_image_discretization
  inputs: {L_box: sim_box_length, N_grid: sim_grid_cells}
  outputs: {dx_pixel: sim_pixel_size_computed}

- id: run_piv_window_phys
  model: piv_window_physical_size
  inputs: {W_px: piv_window_px, M_enlarge: piv_enlargement, dx_pixel: sim_pixel_size_printed}
  outputs: {W_phys: piv_window_phys_computed}

- id: run_roi_side_movies23
