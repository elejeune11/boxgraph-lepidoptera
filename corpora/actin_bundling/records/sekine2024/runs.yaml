# All model runs for sekine2024: reproducing printed SI Table S1 derived quantities,
# Supplementary Table 4 intervals, Supplementary Table 5 motion anisotropy ratios,
# Supplementary Fig. 6a complex widths, Methods pixel/PIV/frame durations,
# hydrodynamic/mechanical scales, RK4 dimer stability/conservation tests, and
# stochastic anisotropic Langevin single-filament baseline.

# --- 1. Table S1 thermodynamic & mechanical derivations ---
- id: run_thermal_energy_300K
  model: thermal_energy
  inputs: {T: temp_sim}
  outputs: {kBT: kBT_computed}

- id: run_young_modulus_filament
  model: young_modulus_rod
  inputs: {kappa: kappa_f_str_sim, d: d_f_sim}
  outputs: {E: E_f_str_computed}

- id: run_young_modulus_motor
  model: young_modulus_rod
  inputs: {kappa: kappa_m_str_sim, d: d_m_sim}
  outputs: {E: E_m_str_computed}

- id: run_young_modulus_crosslinker
  model: young_modulus_rod
  inputs: {kappa: kappa_cl_str_sim, d: d_cl_sim}
  outputs: {E: E_cl_str_computed}

- id: run_persistence_motor
  model: persistence_length_bending
  inputs: {k_bend: k_m_bend_sim, L0: L0_m_sim, kBT: kBT_sim}
  outputs: {l_bend: l_m_bend_computed}

- id: run_persistence_motor_chained
  model: persistence_length_from_temperature
  inputs: {k_bend: k_m_bend_sim, L0: L0_m_sim, T: temp_sim}
  outputs: {l_bend: l_m_bend_chained}

- id: run_persistence_crosslinker
  model: persistence_length_bending
  inputs: {k_bend: k_cl_bend_sim, L0: L0_cl_sim, kBT: kBT_sim}
  outputs: {l_bend: l_cl_bend_computed}

- id: run_persistence_crosslinker_chained
  model: persistence_length_from_temperature
  inputs: {k_bend: k_cl_bend_sim, L0: L0_cl_sim, T: temp_sim}
  outputs: {l_bend: l_cl_bend_chained}

# --- 2. Hydrodynamic friction, walking velocity, and elastic potentials (SI Notes I) ---
- id: run_friction_filament_eta1
  model: cylindrical_friction_filament
  inputs: {eta_cyto: eta_cyto_table_s1, d_f: d_f_sim, L0_f: L0_f_sim}
  outputs: {gamma_f: gamma_f_eta1}

- id: run_friction_filament_eta01
  model: cylindrical_friction_filament
  inputs: {eta_cyto: eta_cyto_si_text, d_f: d_f_sim, L0_f: L0_f_sim}
  outputs: {gamma_f: gamma_f_eta01}

- id: run_anisotropic_friction_4m
  model: anisotropic_filament_friction
  inputs: {eta_cyto: eta_cyto_table_s1, d_f: d_f_sim, L0_f: L0_f_sim, friction_asymmetry: friction_asymmetry_stripe}
  outputs: {gamma_y_f: gamma_y_f_4m}

- id: run_friction_motor_eta1
  model: cylindrical_friction_connector
  inputs: {eta_cyto: eta_cyto_table_s1, d: d_m_sim, L0: L0_m_sim}
  outputs: {gamma: gamma_m_eta1}

- id: run_friction_crosslinker_eta1
  model: cylindrical_friction_connector
  inputs: {eta_cyto: eta_cyto_table_s1, d: d_cl_sim, L0: L0_cl_sim}
  outputs: {gamma: gamma_cl_eta1}

- id: run_friction_crosslinker_eta01
  model: cylindrical_friction_connector
  inputs: {eta_cyto: eta_cyto_si_text, d: d_cl_sim, L0: L0_cl_sim}
  outputs: {gamma: gamma_cl_eta01}

- id: run_motor_walk_table_s1
  model: motor_walking_velocity
  inputs: {f_walk: f_walk_table_s1, zeta: zeta_motor_sim, l_f: L0_f_sim}
  outputs: {v_walk: v_walk_table_s1, dalpha_dt: dalpha_dt_table_s1, tau_walk: tau_walk_table_s1}

- id: run_motor_walk_fig_s7b3_4m
  model: motor_walking_velocity
  inputs: {f_walk: f_walk_fig_s7b3_4m, zeta: zeta_motor_sim, l_f: L0_f_sim}
  outputs: {v_walk: v_walk_fig_s7b3_4m, dalpha_dt: dalpha_dt_fig_s7b3_4m, tau_walk: tau_walk_fig_s7b3_4m}

- id: run_filament_stretch_probe
  model: harmonic_stretching_potential
  inputs: {r: probe_stretch_length_f, kappa: kappa_f_str_sim, L0: L0_f_sim}
  outputs: {U_harm: U_harm_f_probe, f_str: f_str_f_probe, k_eff: k_eff_f_probe}

- id: run_crosslinker_arm_stretch_probe
  model: connector_arm_stretching_potential
  inputs: {r: probe_stretch_length_cl_arm, kappa: kappa_cl_str_sim, L0: L0_cl_sim}
  outputs: {U_harm: U_harm_cl_probe, f_str: f_str_cl_probe, k_eff: k_eff_cl_probe}

- id: run_crosslinker_bending_probe
  model: bending_potential
  inputs: {theta: probe_bending_angle, k_bend: k_cl_bend_sim}
  outputs: {U_bend: U_bend_cl_probe, tau_bend: tau_bend_cl_probe}

- id: run_force_dist_printed
  model: filament_force_distribution
  inputs: {f: probe_applied_force, alpha: probe_binding_alpha}
  outputs: {f_0: f0_printed, f_1: f1_printed, f_sum_ratio: f_sum_ratio_printed}

- id: run_force_dist_corrected
  model: filament_force_distribution_corrected
  inputs: {f: probe_applied_force, alpha: probe_binding_alpha}
  outputs: {f_0: f0_corrected, f_1: f1_corrected, f_sum_ratio: f_sum_ratio_corrected}

# --- 3. Structure factor Gaussian fits and periodic intervals (Supplementary Table 4) ---
- id: run_sf_interval_1m
  model: structure_factor_interval
  inputs: {mu_over_2pi: sf_1m_mu_over_2pi}
  outputs: {interval: interval_1m_computed}

- id: run_sf_interval_3m
  model: structure_factor_interval
  inputs: {mu_over_2pi: sf_3m_mu_over_2pi}
  outputs: {interval: interval_3m_computed}

- id: run_sf_interval_4m
  model: structure_factor_interval
  inputs: {mu_over_2pi: sf_4m_mu_over_2pi}
  outputs: {interval: interval_4m_computed}

- id: run_sf_interval_a4_1
  model: structure_factor_interval
  inputs: {mu_over_2pi: sf_a4_1_mu_over_2pi}
  outputs: {interval: interval_a4_1_computed}

- id: run_mu_wavenumber_4m
  model: angular_wavenumber_from_frequency
  inputs: {mu_over_2pi: sf_4m_mu_over_2pi}
  outputs: {mu: sf_4m_mu_wavenumber}

- id: run_sf_interval_4m_via_wavenumber
  model: structure_factor_interval_wavenumber
  inputs: {mu: sf_4m_mu_wavenumber}
  outputs: {interval: interval_4m_via_mu_computed}

- id: run_sf_gaussian_peak_1m
  model: gaussian_structure_factor
  inputs: {A: sf_1m_A, mu_over_2pi: sf_1m_mu_over_2pi, sigma: sf_1m_sigma, q_over_2pi: sf_1m_mu_over_2pi}
