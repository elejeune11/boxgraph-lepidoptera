# --- 6. Deterministic RK4 mechanical dimer solver (Eqs. S1, S3, S5, S8, S9) ---
- id: run_dimer_rk4_printed_eta1
  model: cgmd_dimer_rk4
  inputs:
    eta_cyto: eta_cyto_table_s1
    d_f: d_f_sim
    L0_f: L0_f_sim
    kappa_f: kappa_f_str_sim
    d_cl: d_cl_sim
    L0_cl: L0_cl_sim
    kappa_cl: kappa_cl_str_sim
    k_cl_bend: k_cl_bend_sim
    friction_asymmetry: friction_asymmetry_iso
    alpha: probe_binding_alpha
    delta_y0: dimer_initial_deflection
    t_max: dimer_t_max
  settings: {dt: 5.0e-5}
  outputs:
    filament_y_shift: dimer_shift_printed_eta1
    cm_drift: dimer_cm_drift_printed_eta1
    rk4_stiffness_number: dimer_stiffness_eta1
  note: "Printed force-assignment sign (-delta_{i1}) at Table S1 viscosity eta_cyto = 1 Pa*s and paper dt = 5e-5 s."

- id: run_dimer_rk4_corrected_eta1
  model: cgmd_dimer_rk4_corrected
  inputs:
    eta_cyto: eta_cyto_table_s1
    d_f: d_f_sim
    L0_f: L0_f_sim
    kappa_f: kappa_f_str_sim
    d_cl: d_cl_sim
    L0_cl: L0_cl_sim
    kappa_cl: kappa_cl_str_sim
    k_cl_bend: k_cl_bend_sim
    friction_asymmetry: friction_asymmetry_iso
    alpha: probe_binding_alpha
    delta_y0: dimer_initial_deflection
    t_max: dimer_t_max
  settings: {dt: 5.0e-5}
  outputs:
    filament_y_shift: dimer_shift_corrected_eta1
    cm_drift: dimer_cm_drift_corrected_eta1
    rk4_stiffness_number: dimer_stiffness_corr_eta1
  note: "Sign-corrected (+delta_{i1}) RK4 dimer test at Table S1 viscosity eta_cyto = 1 Pa*s and paper dt = 5e-5 s."

- id: run_dimer_rk4_corrected_eta01
  model: cgmd_dimer_rk4_corrected
  inputs:
    eta_cyto: eta_cyto_si_text
    d_f: d_f_sim
    L0_f: L0_f_sim
    kappa_f: kappa_f_str_sim
    d_cl: d_cl_sim
    L0_cl: L0_cl_sim
    kappa_cl: kappa_cl_str_sim
    k_cl_bend: k_cl_bend_sim
    friction_asymmetry: friction_asymmetry_iso
    alpha: probe_binding_alpha
    delta_y0: dimer_initial_deflection
    t_max: dimer_t_max
  settings: {dt: 5.0e-5}
  outputs:
    filament_y_shift: dimer_shift_corrected_eta01
    cm_drift: dimer_cm_drift_corrected_eta01
    rk4_stiffness_number: dimer_stiffness_corr_eta01
  note: "Sign-corrected (+delta_{i1}) RK4 dimer test at SI Notes Section II text viscosity eta_cyto = 10^-1 Pa*s and paper dt = 5e-5 s (linear stiffness number lambda_perp*dt = 5.34 > 2.785 RK4 stability limit)."

# --- 7. Passive anisotropic Langevin single-filament baseline (Eqs. S1a-S1b) ---
- id: run_passive_aniso_analytic
  model: anisotropic_diffusion_ratio
  inputs: {friction_asymmetry: friction_asymmetry_stripe}
  outputs: {R_aniso: passive_aniso_ratio_analytic}

- id: run_anisotropic_langevin_filament
  model: cgmd_anisotropic_langevin
  inputs:
    eta_cyto: eta_cyto_table_s1
    d_f: d_f_sim
    L0_f: L0_f_sim
    kappa_f: kappa_f_str_sim
    kBT: kBT_sim
    friction_asymmetry: friction_asymmetry_stripe
    t_obs: langevin_obs_time
  settings: {dt: 0.001, n_traj: 2000, seed: 42}
  replicates: 5
  outputs:
    mean_abs_dx: langevin_dx_aniso
    mean_abs_dy: langevin_dy_aniso
    R_aniso: langevin_R_aniso
  note: "Added numerical choice: dt = 0.001 s (vs paper 5e-5 s, justified because single-filament stretching rate 2*kappa_f/(L0_f*gamma_f) = 303 s^-1 satisfies lambda*dt = 0.30 << 2) and n_traj = 2000 per replicate across 5 replicates to keep refinement fast while achieving < 1% Monte Carlo SE."

# --- 8. Structure factor Gaussian curve sweeps against Supplementary Fig. 7c1-c4 ---
# Tests Methods p. 11 literal angular-wavenumber form vs Table 4 q/(2*pi) frequency convention
# directly against the digitized black dotted fit curves and simulated S(q) spectra.
