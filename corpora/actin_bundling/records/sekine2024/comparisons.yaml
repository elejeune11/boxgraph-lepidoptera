# --- 6. Validation & theoretical baseline comparisons ---
- id: cmp_validation_cable_interval_4m
  purpose: validation
  computed: interval_4m_computed
  printed: cable_interval_in_vivo
  note: "Simulated 4-M stripe interval from structure factor (529 nm) vs in vivo early stage 16 periodic cable interval (450 ± 13.2 nm)."

- id: cmp_langevin_passive_vs_sim_2m
  purpose: consistency
  computed: langevin_R_aniso
  printed: aniso_ratio_sim_2m
  note: "Contrasts stochastic single-filament passive anisotropic Brownian displacement ratio (<|dy|>/<|dx|> ~ 0.806 < 1) against motor-free many-body simulation 2-M (1.13 > 1), showing that equilibrium FDT diffusion alone predicts opposite anisotropy to 2-M."

- id: cmp_analytic_passive_vs_sim_2m
  purpose: consistency
  computed: passive_aniso_ratio_analytic
  printed: aniso_ratio_sim_2m
  note: "Contrasts exact analytical passive Brownian ratio 1/sqrt(1.5) = 0.8165 < 1 against motor-free many-body simulation 2-M (1.13 > 1)."

