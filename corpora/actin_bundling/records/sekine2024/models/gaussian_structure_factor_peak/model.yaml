id: gaussian_structure_factor_peak
name: Gaussian peak height of static structure factor S(mu) (Methods & Supp. Fig. 7c)
role: processing
stated:
  page: 11
  printed_page: "11"
  quote: "The interval of the structure is measured"
  where: "Methods (Structure factor) & Supplementary Table 4"
equation: "S_peak = A / ((2 * pi)^(1/2) * sigma)"
inputs:
  A: {quantity: structure_factor_fit_amplitude, unit: 1/um}
  sigma: {quantity: structure_factor_fit_width, unit: 1/um}
outputs:
  S_peak: {quantity: structure_factor, unit: dimensionless}
settings: {}
stochastic: false
