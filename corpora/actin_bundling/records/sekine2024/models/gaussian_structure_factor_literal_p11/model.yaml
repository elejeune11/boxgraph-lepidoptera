id: gaussian_structure_factor_literal_p11
name: Gaussian fit to S(q) in literal angular-wavenumber form (Methods p. 11)
role: processing
stated:
  page: 11
  printed_page: "11"
  quote: "The interval of the structure is measured"
  where: "Methods (Structure factor)"
equation: "S(q) = (A / ((2*pi)^(1/2) * sigma)) * exp(-(q - mu)^2 / (2 * sigma^2)), with q = 2*pi*(q/(2*pi)), mu = 2*pi*(mu/(2*pi))"
inputs:
  A: {quantity: structure_factor_fit_amplitude, unit: 1/um}
  mu_over_2pi: {quantity: structure_factor_peak_frequency, unit: 1/um}
  sigma: {quantity: structure_factor_fit_width, unit: 1/um}
  q_over_2pi: {quantity: spatial_frequency, unit: 1/um}
outputs:
  S_q: {quantity: structure_factor, unit: dimensionless}
settings: {}
stochastic: false
