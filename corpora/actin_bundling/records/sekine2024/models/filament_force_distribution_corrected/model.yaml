id: filament_force_distribution_corrected
name: geometric force distribution to filament endpoints, sign corrected (SI Notes I)
role: model
stated:
  page: 29
  printed_page: "SI Notes 2"
  quote: "to the filament particles with the geometric weight"
  where: "SI Notes I / Fig. S1"
equation: "f_i^{f,X} = delta_{i0} (1 - alpha) f + delta_{i1} alpha f"
variant_of: filament_force_distribution
corrections:
  - equation: "Force distribution equations for f_i^{f,m} and f_i^{f,cl} (SI Notes p. 2, PDF p. 29)"
    change: "Replace '- delta_{i1} sum alpha f' with '+ delta_{i1} sum alpha f'."
    evidence: "Fig. S1 on the same page (PDF p. 29) explicitly draws (1-alpha)f on r_0^f and +alpha f on r_1^f pointing in the same direction as f, and the text directly below states that this force assignment ensures force and torque conservation of the filament; the printed minus sign yields total force (1 - 2*alpha)f != f."
inputs:
  f: {quantity: applied_force, unit: pN}
  alpha: {quantity: binding_coordinate, unit: dimensionless}
outputs:
  f_0: {quantity: filament_end_force, unit: pN}
  f_1: {quantity: filament_end_force, unit: pN}
  f_sum_ratio: {quantity: force_conservation_ratio, unit: dimensionless}
settings: {}
stochastic: false
