id: young_modulus_rod
name: effective Young's modulus of cylindrical rod (Table S1)
role: model
stated:
  page: 31
  printed_page: "SI Notes 4"
  quote: "Young’s modulus"
  where: "Table S1"
equation: "E^{X,str} = kappa^{X,str} / (pi * (d^X / 2)^2)"
inputs:
  kappa: {quantity: stretching_modulus, unit: pN}
  d: {quantity: molecular_diameter, unit: um}
outputs:
  E: {quantity: young_modulus, unit: Pa}
settings: {}
stochastic: false
