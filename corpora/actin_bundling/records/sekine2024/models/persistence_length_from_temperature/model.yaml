id: persistence_length_from_temperature
name: connector bending persistence length from absolute temperature (Table S1)
role: model
stated:
  page: 31
  printed_page: "SI Notes 4"
  quote: "persistence length"
  where: "Table S1"
equation: "l^{X,bend} = k^{X,bend} * l_0^X / (2 * k_B * T)"
inputs:
  k_bend: {quantity: bending_rigidity, unit: pN*um}
  L0: {quantity: molecular_rest_length, unit: um}
  T: {quantity: temperature, unit: K}
outputs:
  l_bend: {quantity: persistence_length, unit: um}
built_from:
  - thermal_energy
  - persistence_length_bending
settings: {}
stochastic: false
