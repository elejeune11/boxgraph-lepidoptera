id: nanocluster_complex_width
name: molecular packing widths of labeled actin filament and crosslinked pair (Supp. Fig. 6a)
role: model
from_words: true
stated:
  page: 21
  quote: "two crosslinked actin filaments is estimated as 58 nm in width"
  where: "Supplementary Fig. 6a"
equation: "w_single = d_actin + 2 * d_GFP; w_dimer = 2 * d_actin + 2 * d_GFP + L_actinin"
inputs:
  d_actin: {quantity: molecular_diameter, unit: nm}
  d_GFP: {quantity: molecular_diameter, unit: nm}
  L_actinin: {quantity: molecular_rest_length, unit: nm}
outputs:
  w_single: {quantity: complex_width, unit: nm}
  w_dimer: {quantity: complex_width, unit: nm}
settings: {}
stochastic: false
