id: anisotropic_filament_friction
name: anisotropic circumferential filament friction (Eqs. S1a-S1b)
role: model
stated:
  page: 30
  printed_page: "SI Notes 3"
  quote: "where γyf /γxf measures the friction asymmetry"
  where: "Eqs. S1a-S1b"
equation: "gamma_y^f = (gamma_y^f / gamma_x^f) * 3 * pi * eta_cyto * (3 * d^f + 2 * L_0^f / 5)"
inputs:
  eta_cyto: {quantity: cytosolic_viscosity, unit: Pa*s}
  d_f: {quantity: molecular_diameter, unit: um}
  L0_f: {quantity: molecular_rest_length, unit: um}
  friction_asymmetry: {quantity: friction_asymmetry, unit: dimensionless}
outputs:
  gamma_y_f: {quantity: friction_coefficient, unit: pN*s/um}
built_from:
  - cylindrical_friction_filament
settings: {}
stochastic: false
