id: filament_force_distribution
name: geometric force distribution to filament endpoints, as printed (SI Notes I)
role: model
stated:
  page: 29
  printed_page: "SI Notes 2"
  quote: "to the filament particles with the geometric weight"
  where: "SI Notes I"
equation: "f_i^{f,X} = delta_{i0} (1 - alpha) f - delta_{i1} alpha f"
inputs:
  f: {quantity: applied_force, unit: pN}
  alpha: {quantity: binding_coordinate, unit: dimensionless}
outputs:
  f_0: {quantity: filament_end_force, unit: pN}
  f_1: {quantity: filament_end_force, unit: pN}
  f_sum_ratio: {quantity: force_conservation_ratio, unit: dimensionless}
settings: {}
stochastic: false
