id: bending_potential
name: angular bending potential for motors and crosslinkers (Eqs. S7, S9)
role: model
stated:
  page: 29
  printed_page: "SI Notes 2"
  quote: "is bending energy with bending rigidity k"
  where: "Eqs. S7, S9"
equation: "U^bend(r_-, r_+; k) = -k * r_hat_- . r_hat_+ = -k * cos(theta)"
inputs:
  theta: {quantity: bending_angle, unit: rad}
  k_bend: {quantity: bending_rigidity, unit: pN*um}
outputs:
  U_bend: {quantity: elastic_energy, unit: pN*um}
  tau_bend: {quantity: bending_torque, unit: pN*um}
settings: {}
stochastic: false
