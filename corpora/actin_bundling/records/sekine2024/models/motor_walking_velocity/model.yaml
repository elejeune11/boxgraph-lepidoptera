id: motor_walking_velocity
name: motor ABD active walking velocity and traversal timescale (Eq. S4)
role: model
stated:
  page: 28
  quote: "Then, the equation of motion for the motor ABD reads"
  where: "Eq. S4"
equation: "zeta * l_f * (d alpha_{m,h}^m / dt) = f^walk"
inputs:
  f_walk: {quantity: motor_walk_force, unit: pN}
  zeta: {quantity: motor_sliding_friction, unit: pN*s/um}
  l_f: {quantity: molecular_rest_length, unit: um}
outputs:
  v_walk: {quantity: motor_walking_speed, unit: um/s}
  dalpha_dt: {quantity: abd_rate, unit: 1/s}
  tau_walk: {quantity: motor_traversal_time, unit: s}
settings: {}
stochastic: false
