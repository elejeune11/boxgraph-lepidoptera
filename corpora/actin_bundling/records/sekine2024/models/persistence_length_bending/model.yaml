id: persistence_length_bending
name: connector bending persistence length (Table S1)
role: model
stated:
  page: 31
  printed_page: "SI Notes 4"
  quote: "persistence length"
  where: "Table S1"
equation: "l^{X,bend} = k^{X,bend} * l_0^X / (2 * k_B T)"
inputs:
  k_bend: {quantity: bending_rigidity, unit: pN*um}
  L0: {quantity: molecular_rest_length, unit: um}
  kBT: {quantity: thermal_energy, unit: pN*um}
outputs:
  l_bend: {quantity: persistence_length, unit: um}
settings: {}
stochastic: false
