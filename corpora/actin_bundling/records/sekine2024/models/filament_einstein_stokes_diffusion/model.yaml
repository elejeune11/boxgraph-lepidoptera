id: filament_einstein_stokes_diffusion
name: single-filament Einstein-Stokes translational diffusivity from cylindrical drag (helper)
role: processing
stated:
  page: 29
  printed_page: "SI Notes 2"
  quote: "The cytosolic friction is defined using a cylindrical approximation"
  where: "SI Notes I (cylindrical filament friction gamma^f, FDT with restored k_B T, and Table S1)"
equation: "D_fil = k_B * T / (2 * gamma^f) = k_B * T / (6 * pi * eta_cyto * (3 * d_f + 2 * L0_f / 5))"
built_from:
  - cylindrical_friction_filament
  - thermal_energy
inputs:
  T: {quantity: temperature, unit: K}
  eta_cyto: {quantity: cytosolic_viscosity, unit: Pa*s}
  d_f: {quantity: molecular_diameter, unit: um}
  L0_f: {quantity: molecular_rest_length, unit: um}
outputs:
  D_fil: {quantity: diffusion_coefficient, unit: "um**2/s"}
settings: {}
stochastic: false
