id: gaussian_structure_factor_freq_variant
name: Gaussian fit to S(q) in q/(2*pi) spatial-frequency coordinates (Supp. Table 4 & Fig. 7c)
role: processing
variant_of: gaussian_structure_factor_literal_p11
corrections:
  - equation: "Methods (Structure factor) Gaussian fit"
    change: "evaluate exp(-(q/(2*pi) - mu/(2*pi))^2 / (2 * sigma^2)) in q/(2*pi) spatial-frequency coordinates using Supplementary Table 4's sigma rather than angular wavenumbers q = 2*pi*(q/(2*pi))"
    evidence: "Supplementary Fig. 7c1-c4 (PDF p. 22) plots S(q) and the dotted Gaussian fit against q/(2*pi), and Supplementary Table 4 (PDF p. 26) tabulates A, mu/(2*pi), and sigma whose peak heights and widths reproduce the plotted dotted curves directly in q/(2*pi) coordinates (whereas literal angular wavenumber q is narrower by 2*pi)"
stated:
  page: 11
  printed_page: "11"
  quote: "The interval of the structure is measured"
  where: "Methods (Structure factor) & Supplementary Table 4"
equation: "S(q) = (A / ((2*pi)^(1/2) * sigma)) * exp(-(q/(2*pi) - mu/(2*pi))^2 / (2 * sigma^2))"
inputs:
  A: {quantity: structure_factor_fit_amplitude, unit: 1/um}
  mu_over_2pi: {quantity: structure_factor_peak_frequency, unit: 1/um}
  sigma: {quantity: structure_factor_fit_width, unit: 1/um}
  q_over_2pi: {quantity: spatial_frequency, unit: 1/um}
outputs:
  S_q: {quantity: structure_factor, unit: dimensionless}
settings: {}
stochastic: false
