id: harmonic_stretching_potential
name: harmonic stretching potential and force for filament (Eq. S5)
role: model
stated:
  page: 29
  printed_page: "SI Notes 2"
  quote: "The length of the filament is maintained by the stretching elasticity"
  where: "Eq. S5"
equation: "U^harm(r; kappa, L_0) = (kappa / (2 * L_0)) * (r - L_0)^2"
inputs:
  r: {quantity: segment_length, unit: um}
  kappa: {quantity: stretching_modulus, unit: pN}
  L0: {quantity: molecular_rest_length, unit: um}
outputs:
  U_harm: {quantity: elastic_energy, unit: pN*um}
  f_str: {quantity: elastic_force, unit: pN}
  k_eff: {quantity: spring_stiffness, unit: pN/um}
settings: {}
stochastic: false
