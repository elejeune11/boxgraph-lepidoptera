id: connector_arm_stretching_potential
name: harmonic stretching potential for motor or crosslinker arm (Eqs. S6, S8)
role: model
stated:
  page: 29
  printed_page: "SI Notes 2"
  quote: "Similarly, the stretching and bending forces act between the motor particles"
  where: "Eqs. S6, S8"
equation: "U^harm(r; kappa, L_0/2) = (kappa / L_0) * (r - L_0 / 2)^2"
inputs:
  r: {quantity: segment_length, unit: um}
  kappa: {quantity: stretching_modulus, unit: pN}
  L0: {quantity: molecular_rest_length, unit: um}
outputs:
  U_harm: {quantity: elastic_energy, unit: pN*um}
  f_str: {quantity: elastic_force, unit: pN}
  k_eff: {quantity: spring_stiffness, unit: pN/um}
built_from:
  - harmonic_stretching_potential
settings: {}
stochastic: false
