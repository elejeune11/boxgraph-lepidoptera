# Cross-record relations with hannezo2015 (Hannezo et al., PNAS 112:8620-8625, 2015; cited as ref-14 / sref-21).
# Note: sekine2024 states no equation-level relation to hannezo2015 (it adopts directional friction
# asymmetry conceptually as an external cue in SI Notes pp. 30, 32, and both 2D pattern-forming
# models — hannezo2015/cortical_pde_2d_anisotropic and sekine2024/cgmd_2d_network — are non-runnable).
# The three proposed relations below bridge sekine2024's single-filament anisotropic Langevin dynamics
# (Eqs. S1a-S1b, S5 with FDT) to hannezo2015's continuum turnover-diffusion length l_t = sqrt(D*tau).

- id: rel_hannezo2015_langevin_dx_approx_turnover_length
  kind: approximated_by
  a: sekine2024/cgmd_anisotropic_langevin
  b: hannezo2015/turnover_diffusion_length
  mapping:
    D: "kBT / (6 * pi * eta_cyto * (3 * d_f + 2 * L0_f / 5))"
    tau: "t_obs"
  output_map:
    l_t: mean_abs_dx
  regime:
    eta_cyto: [0.5, 2.0]
    d_f: [0.008, 0.012]
    L0_f: [0.08, 0.15]
    kappa_f: [5.0, 15.0]
    kBT: [0.0035, 0.0045]
    friction_asymmetry: [1.0, 2.0]
    t_obs: [0.05, 0.5]
  tolerance: 0.20
  provenance: proposed
  reason: >
    Under Eqs. (S1a)-(S1b) and (S5) with the corrected fluctuation-dissipation theorem, internal
    harmonic spring forces cancel identically from the two-bead actin filament center of mass,
    giving 1D longitudinal Brownian diffusion with exact Einstein-Stokes center-of-mass diffusivity
    D_fil,x = k_B T / (2 * gamma_x^f) = k_B T / (6 * pi * eta_cyto * (3 * d^f + 2 * L_0^f / 5))
    [1 pN*um / (Pa*s * um) = 1 um^2/s]. Over observation (or turnover) time tau = t_obs, the
    stochastic mean absolute displacement E[|Delta x_cm|] = sqrt(4/pi) * sqrt(D_fil,x * t_obs) =
    1.1284 * l_t is approximated by Hannezo's continuum turnover-diffusion length l_t = sqrt(D * tau)
    (Main p. 2) within the exact 11.4% half-normal-to-scale factor (1 - sqrt(pi/4)) plus ~2-4%
    finite-ensemble Monte Carlo spread at n_traj = 2000.
  assumptions:
    - "Free two-bead filament without crosslinker or motor coupling (single-filament passive Brownian limit of Eqs. S1a-S1b, S5 with restored k_B T in FDT)."
    - "Longitudinal drag partition gamma_x^f = gamma^f = 3*pi*eta_cyto*(3*d^f + 2*L_0^f/5); Euler-Maruyama stable regime (eta_cyto in [0.5, 2.0] Pa*s bracketing Table S1 1 Pa*s; dt = 1e-3 s)."
    - "Mean absolute displacement E[|Delta x|] = sqrt(4/pi)*sqrt(D*t) differs from l_t = sqrt(D*t) by a deterministic factor sqrt(4/pi) ~= 1.1284 (relative difference 11.4%) plus finite-sample Monte Carlo noise."

- id: rel_hannezo2015_langevin_dy_approx_turnover_length
  kind: approximated_by
  a: sekine2024/cgmd_anisotropic_langevin
  b: hannezo2015/turnover_diffusion_length
  mapping:
    D: "kBT / (6 * pi * eta_cyto * friction_asymmetry * (3 * d_f + 2 * L0_f / 5))"
    tau: "t_obs"
  output_map:
    l_t: mean_abs_dy
  regime:
    eta_cyto: [0.5, 2.0]
    d_f: [0.008, 0.012]
    L0_f: [0.08, 0.15]
    kappa_f: [5.0, 15.0]
    kBT: [0.0035, 0.0045]
    friction_asymmetry: [1.0, 2.0]
    t_obs: [0.05, 0.5]
  tolerance: 0.20
  provenance: proposed
  reason: >
    Along the circumferential (y) axis where Sekine introduces directional filament friction
    gamma_y^f = (gamma_y^f / gamma_x^f) * gamma_x^f following Hannezo's anisotropic-friction cue
    (ref-14 / sref-21), the two-bead center-of-mass Einstein-Stokes diffusivity scales inversely
    with friction asymmetry as D_fil,y = D_fil,x / (gamma_y^f / gamma_x^f). Consequently, the
    stochastic circumferential mean displacement mean_abs_dy = E[|Delta y_cm(t_obs)|] =
    sqrt(4/pi) * sqrt(D_fil,y * t_obs) is approximated by Hannezo's continuum turnover-diffusion
    length l_t = sqrt(D_fil,y * tau) within the same 11.4% half-normal factor plus ~2-4% Monte
    Carlo spread across the Euler-Maruyama stable regime bracketing friction_asymmetry in [1.0, 2.0].
  assumptions:
    - "Free two-bead filament under Eqs. (S1a)-(S1b) and (S5) with anisotropic friction gamma_y^f = friction_asymmetry * gamma_x^f and anisotropic FDT noise variance 2*gamma_a^f*k_B*T."
    - "Euler-Maruyama stable regime (eta_cyto in [0.5, 2.0] Pa*s bracketing Table S1 1 Pa*s; dt = 1e-3 s)."
    - "Highlights the passive-diffusion baseline (D_fil,y < D_fil,x when gamma_y^f > gamma_x^f), whose reduced circumferential travel contrasts with the enhanced circumferential motion |dy|/|dx| > 1 in Sekine's full many-body CGMD and in vivo measurements."

- id: rel_hannezo2015_aniso_diff_scales_turnover_length
  kind: scales_as
  a: sekine2024/anisotropic_diffusion_ratio
  b: hannezo2015/turnover_diffusion_length
  mapping:
    D: "0.04 / friction_asymmetry"
    tau: "15.0"
  output_map:
    l_t: R_aniso
  regime:
    friction_asymmetry: [1.0, 3.0]
  provenance: proposed
  reason: >
    Under Einstein-Stokes scaling D_y = D_x / (gamma_y^f / gamma_x^f) with direction-independent
    actin turnover time tau (anchored at Hannezo's stage-15 tracheal FRAP values D_x = 0.04 um^2/s
    and tau = 15 s), Hannezo's circumferential turnover-diffusion length l_{t,y} = sqrt(D_y * tau)
    scales as (gamma_y^f / gamma_x^f)^(-1/2), matching the exact log-slope (-1/2) of Sekine's
    passive anisotropic Brownian displacement ratio R_aniso = <|dy|>/<|dx|> =
    (gamma_y^f / gamma_x^f)^(-1/2). Both continuum passive diffusion and equilibrium Langevin
    dynamics therefore predict reduced circumferential displacement (< 1) under gamma_y^f > gamma_x^f,
    opposite in sign to Sekine's full CGMD (|dy|/|dx| = 1.13-1.45) and in vivo tracheal tracking
    (|dy|/|dx| = 1.20-1.72).
  assumptions:
    - "Einstein-Stokes inverse-friction diffusivity D_y = D_x / (gamma_y^f / gamma_x^f) at fixed longitudinal D_x = 0.04 um^2/s and isotropic turnover time tau = 15 s (Hannezo Main p. 3 FRAP values)."
    - "Passive equilibrium single-filament scaling without motor-driven clustering or nonequilibrium turnover-induced directional bias."

# Cross-record relation with weirich2017 (Weirich et al., PNAS 114(9):2131-2136, 2017; neither paper cites the other).
# Note: Zero stated relations and zero exact (same_as / reduces_to / approximated_by) equivalences hold
# across all 31 sekine2024 and 51 weirich2017 models (in particular, sekine2024/cgmd_anisotropic_langevin
# vs weirich2017/tactoid_exponential_relaxation is purely a dimensional coincidence: t^(1/2) single-filament
# Brownian spreading vs exponential macroscopic droplet relaxation). The single shared physical law across
# both papers is single short-F-actin Stokes-Einstein Brownian diffusion D = k_B T / gamma proportional to
# T / eta, captured below via the helper model sekine2024/filament_einstein_stokes_diffusion.

- id: rel_weirich2017_filament_diffusion_scales_stokes_einstein
  kind: scales_as
  a: sekine2024/filament_einstein_stokes_diffusion
  b: weirich2017/stokes_einstein_ellipsoid_diffusion
  mapping:
    T: "T"
    eta: "eta_cyto"
    L: "90"
    r: "3.5"
  output_map:
    D: D_fil
  regime:
    T: [290.0, 310.0]
    eta_cyto: [0.1, 5.0]
    d_f: [0.007, 0.012]
    L0_f: [0.075, 0.25]
  provenance: proposed
  reason: >
    Both papers model passive translational Brownian diffusion of a single short rigid F-actin filament
    (L_f ~ 100 nm in sekine2024 Table S1; L_f = 2*L ~ 180 nm in weirich2017 SI p. 8; both << l_p) in a
    viscous Newtonian medium (eta ~ 0.1-3 Pa*s at T ~ 293-300 K) via overdamped Stokes-Einstein
    fluctuation-dissipation D = k_B T / gamma (explicitly invoked as D proportional to 1/eta_cyto in
    sekine2024 SI Notes p. 30 and D = k_B T ln(2*L/r)/(6*pi*eta*L) in weirich2017 SI p. 8). At fixed
    rod geometry (anchored at Weirich's L = 90 nm, r = 3.5 nm), both models share exact log-slopes
    +1 in temperature T and -1 in dynamic viscosity eta. Full rod-geometry mapping (L = 500*L0_f,
    r = 500*d_f) is intentionally NOT equated because the two drag formulas differ in both prefactor
    and aspect-ratio functional form: Sekine's two-bead cylindrical drag 2*gamma^f = 6*pi*eta*(3*d_f +
    2*L0_f/5) lacks Weirich/Perrin's slender-ellipsoid logarithmic factor 1/ln(2*L_f/d_f) and exceeds
    Weirich's drag by R_drag(p) = (6/p + 4/5)*ln(2*p) = 4.06-4.19x across p = L_f/d_f in [10, 30]
    (see q_weirich2017_modelatlas_and_hydrodynamic_drag).
  assumptions:
    - "Fixed filament geometry in weirich2017 (half-length L = 90 nm, radius r = 3.5 nm, SI p. 8) isolates the shared Stokes-Einstein thermal-viscous scaling D proportional to T / eta."
    - "Isotropic single-filament passive Brownian limit (friction_asymmetry = 1, FDT with restored k_B T) across T in [290, 310] K and eta in [0.1, 5.0] Pa*s spanning Sekine SI text (0.1 Pa*s), Sekine Table S1 (1 Pa*s), and Weirich FRAP (3 Pa*s)."
    - "Does not equate absolute drag prefactors or aspect-ratio dependence: D_Weirich / D_Sekine = (6*d_f/L0_f + 4/5)*ln(2*L0_f/d_f) ~= 4.06-4.19 across short F-actin aspect ratios 10-30."

# Cross-record audit with gov2018 (N. S. Gov, Phil. Trans. R. Soc. B 373:20170115, 2018; neither paper
# cites the other or shares any overlapping references; indirect bridge only via hannezo2015 = ref-14/sref-21):
# Zero stated relations, zero non-trivial proposed relations across all 37 x 32 = 1,184 model pairs, and
# zero cited.yaml links. Specifically:
# 1. gov2018/cylindrical_ring_critical_mode vs sekine2024/cgmd_2d_network is purely a coarse dimensional
#    coincidence ([length], [energy], dimensionless -> [length]): cgmd_2d_network is non-runnable (12,150-agent
#    flat 2D periodic CGMD with zero membrane height, bending rigidity, curvature, or tube radius R_0), whereas
#    cylindrical_ring_critical_mode is a 1D axisymmetric continuum Helfrich cylindrical-membrane instability
#    whose wavelength scales with R_0 (predicting 3.6-12.4 um on Drosophila tracheal radii vs 450 nm observed).
# 2. Shared 1-2 op identities are excluded as too_plain: sekine2024/filament_einstein_stokes_diffusion vs
#    gov2018/cmc_diffusion_einstein (D = Lambda * k_B * T, 1 op, tautological under Lambda = 1/(2*gamma^f)),
#    structure_factor_interval[_wavenumber] vs wavelength_from_wavenumber (2*pi/q, 1-2 ops), and
#    motor_walking_velocity.v_walk (f_walk/zeta, 1 op) vs membrane_height_dynamics_eq2_3.
# Full ModelAtlas audit and quantitative Drosophila tracheal comparison are documented in
# sekine2024/questions.yaml (q_gov2018_curvature_ring_vs_cgmd_contrasts) and
# gov2018/questions.yaml (q_sekine2024_tracheal_cgmd_vs_curvature_rings).
