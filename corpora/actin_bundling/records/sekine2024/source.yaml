notes: >
  Full quantitative reading of Sekine et al., Nature Communications 15, 464 (2024)
  (published online 24 January 2024; article number 464 verified on PDF pp. 1-13),
  covering the main article and Methods (PDF pp. 1-13), Supplementary Figures 1-7
  and Supplementary Tables 1-6 (PDF pp. 14-27), Supplementary Notes on the 2D
  coarse-grained molecular dynamics (CGMD) agent-based model and Table S1 (PDF
  pp. 28-33), Supplementary References (PDF pp. 34-36), and Description of
  Additional Supplementary Files (PDF pp. 37-38). Every equation, table cell
  (including rasterized Supplementary Table 1 on PDF p. 24), sign, exponent, and
  unit was verified against rendered page images (pages/page-NNN.png).

  In scope: all printed experimental measurements (nanocluster mode/mean/SD size,
  area, aspect ratio, orientation, periodic cable spacing 450 +/- 13.2 nm, all 28
  genetic/RNAi perturbations in Supplementary Table 2, Stage 15 and Stage 16
  motion anisotropy measurements in Supplementary Table 5, imaging/PIV/fusion
  protocol parameters, and Supplementary Fig. 6a molecular packing width
  estimates); all printed CGMD simulation inputs and outputs (Table S1,
  Supplementary Tables 3-5, Supplementary Fig. 7 parameter sweeps); all closed-form
  mechanical, statistical-mechanics, and image-analysis equations (thermal energy,
  rod Young's modulus, bending persistence length, cylindrical hydrodynamic
  friction for filaments and connectors, anisotropic friction scaling, harmonic
  stretching and bending potentials, motor walking speed Eq. S4, force assignment
  to filament endpoints, Gaussian structure factor and interval 2*pi/mu, motion
  anisotropy ratio |dy|/|dx|, complex widths, pseudo-image pixel size, PIV window
  size, and fusion frame duration); an exact RK4+Euler mechanical dimer solver
  (printed and corrected variant) plus a stochastic anisotropic Langevin filament
  solver with dt refinement series; intra-record stated model relations; and open
  questions.

  Key internal findings uncovered by the record: (1) Force-assignment sign misprint
  on PDF p. 29 (-delta_{i1} instead of +delta_{i1}), contradicting Fig. S1 and
  violating force conservation; modeled as printed plus corrected variant_of.
  (2) Missing k_B T factor in the fluctuation-dissipation theorem on PDF p. 29
  (dimensionally inconsistent without k_B T). (3) 10x discrepancy in crosslinker
  persistence length in Table S1 (PDF p. 31): printed ~24.1 um vs computed 2.408 um
  from k^{cl,bend} L_0^{cl} / (2 k_B T). (4) 10x contradiction in cytosolic
  viscosity eta_cyto between SI Notes Section II (10^-1 Pa*s, PDF p. 30) and
  Table S1 (1 Pa*s, PDF p. 31); our RK4 dimer solver and refinement series prove
  that dt = 5e-5 s is RK4-unstable at eta_cyto = 0.1 Pa*s (lambda*dt = 5.34 > 2.785)
  and stable at eta_cyto = 1 Pa*s (lambda*dt = 0.534). (5) 50x contradiction in
  default motor walk force f^walk between Table S1 (0.05 pN, PDF p. 31) and
  Supplementary Fig. 7b3 / SI Notes III.2 (0.001 pN for black-framed 4-M stripes,
  whereas 0.05 pN disperses the pattern). (6) Factor-of-2 discrepancy in
  crosslinker length between Table S1 / Fig. S7 (L_0^cl = 0.035, 0.04, 0.06 um)
  and Supplementary Table 3 (0.0175, 0.02, 0.03 um, i.e. half-length L_0^cl/2) and
  10x typo in Supplementary Table 3 for Fig. 7a3-3 crosslinker turnover (0.3 vs
  0.03 s^-1 in Fig. S7a3-3 and SI Notes p. 32). (7) Pseudo-image pixel size
  discrepancy (3 um / 69 = 0.04348 um vs printed 0.04325 um on PDF p. 11).
  (8) Swapped Control (attP40) and Control (attP2) labels in Fig. 3a and
  Supplementary Fig. 3c relative to Supplementary Table 2 and Supplementary Fig. 3b.
  (9) Full many-body CGMD simulation (cgmd_2d_network) is non-runnable as stated
  because binding attempt rate/algorithm, anisotropic friction decomposition,
  noise scaling, S(q) bin width/averaging, and simulated cluster-tracking frame
  interval are unstated (and the simulation code is available only upon request).

  Deferred to later stages (not created here): figure digitization (figures.yaml /
  figures.md), independent audit (audit.md), and companion code/spreadsheet records
  (sekine_code, sekine_rnai_screen, sekine_mist_complexes, sekine_source_data).
  Un-digitized quantitative plots left to the digitize stage: Fig. 1e-f (cluster
  angle/AR histograms; summary means/SDs/medians recorded from Supp. Table 1),
  Fig. 1h-k (live-imaging time courses of dominant direction, coherency, tube
  diameter, tube length), Fig. 2b and Fig. 3e (fusion duration boxplots), Fig. 3d
  and Supp. Fig. 5d (Pearson's R colocalization boxplots), Fig. 4e-f (simulated
  cluster shift boxplots and 4-M time course), Fig. 5c,f (PIV mean displacement
  time course and genotype boxplots), Supp. Fig. 1b-d,f-g (major/minor axis
  densities, cable interval boxplot, junctional RhoGEF2 ratio, skeleton length),
  Supp. Fig. 3a (OrientationJ curves), and Supp. Fig. 7c1-c4 (S(q) curves; Gaussian
  fit parameters and intervals recorded from Supp. Table 4). Non-quantitative
  panels (micrographs, binarized snapshots, PIV vector maps, kymographs, protein
  interaction networks, and schematics): Fig. 1a-d,g, Fig. 2a,c, Fig. 3b,c,f,
  Fig. 4a,b,d-scatter, Fig. 5a-scatter,b,d-scatter,e,g, Supp. Fig. 1a,e,h,
  Supp. Fig. 2a,b, Supp. Fig. 4, Supp. Fig. 5a-c, Supp. Fig. 6a-cartoon,
  Supp. Fig. 7a-b, and SI Notes Fig. S1.
