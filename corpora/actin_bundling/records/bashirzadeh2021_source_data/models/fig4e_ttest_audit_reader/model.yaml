id: fig4e_ttest_audit_reader
name: Fig. 4e and Supp. Fig. 9c persistence length hypothesis-test audit reader
role: processing
software: true
stated:
  none: "binary xlsx spreadsheet in Figshare Source Data archive"
  where: "Fig4e_persistence_length_data.xlsx ('Sheet5' A2:AG17 & 'P_PL' A1:U30)"
  quote: "t-Test: Two-Sample Assuming Unequal Variances / 0-0.1 vs 0.1-0.1 / 0.1-0.1 vs 0.1-0.3 / 0-0.3 vs 0.1-0.3"
inputs:
  pair: {quantity: ttest_pair_index, unit: dimensionless}
outputs:
  t_welch: {quantity: welch_t_statistic, unit: dimensionless}
  df_welch_excel: {quantity: welch_degrees_of_freedom, unit: dimensionless}
  df_welch_exact: {quantity: welch_degrees_of_freedom, unit: dimensionless}
  p_welch_excel_two: {quantity: p_value, unit: dimensionless}
  p_welch_excel_one: {quantity: p_value, unit: dimensionless}
  p_welch_exact_two: {quantity: p_value, unit: dimensionless}
  p_student_two: {quantity: p_value, unit: dimensionless}
  p_mann_whitney_two: {quantity: p_value, unit: dimensionless}
  p_log_welch_two: {quantity: p_value, unit: dimensionless}
  p_dedup_welch_two: {quantity: p_value, unit: dimensionless}
settings: {}
stochastic: false
