id: fig4e_persistence_length_reader
name: Actin bundle persistence length live reader (Fig. 4e & Supp. Fig. 9c)
role: processing
software: true
stated:
  none: "binary xlsx spreadsheets in Figshare Source Data archive"
  where: "Fig4e_persistence_length_data.xlsx & Source_data.xlsx ('Sheet5', A2:AG39)"
  quote: "1_10 Trace4 (BigGUV) / 3_10 / 1_1_10 trace19 / 1_2_10 snake1 / 1_3_10 snake 4 / 10_3_3"
inputs:
  condition: {quantity: condition_index, unit: dimensionless}
outputs:
  n_bundles: {quantity: bundle_sample_count, unit: dimensionless}
  n_unique_bundles: {quantity: bundle_sample_count, unit: dimensionless}
  lp_mean: {quantity: bundle_persistence_length, unit: um}
  lp_sd: {quantity: bundle_persistence_length_sd, unit: um}
  lp_sem_true: {quantity: bundle_persistence_length_sem, unit: um}
  lp_sem_sheet_formula: {quantity: bundle_persistence_length_sem, unit: um}
  lp_median: {quantity: bundle_persistence_length, unit: um}
  lp_dedup_mean: {quantity: bundle_persistence_length, unit: um}
  lp_dedup_sem: {quantity: bundle_persistence_length_sem, unit: um}
  n_with_length: {quantity: bundle_sample_count, unit: dimensionless}
  n_length_out_of_range: {quantity: bundle_sample_count, unit: dimensionless}
  workbook_match_flag: {quantity: exact_match_flag, unit: dimensionless}
settings: {}
stochastic: false
