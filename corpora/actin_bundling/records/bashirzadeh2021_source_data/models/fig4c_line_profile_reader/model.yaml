id: fig4c_line_profile_reader
name: Confocal line fluorescence profile reader from Fig4c-d.mat (Fig. 4c & Supp. Fig. 8e)
role: processing
software: true
stated:
  none: "binary MATLAB v5 .mat file in Figshare Source Data archive"
  where: "Fig4c-d.mat (ValuesAlpha, ValuesFascin, ValuesActin, *2, *Ring)"
  quote: "ValuesAlpha / ValuesFascin / ValuesActin / ValuesAlpha2 / ValuesFascin2 / ValuesActin2 / ValuesAlphaRing / ValuesFascinRing / ValuesActinRing"
inputs:
  profile: {quantity: profile_index, unit: dimensionless}
outputs:
  n_points: {quantity: data_point_count, unit: dimensionless}
  spatial_span: {quantity: profile_spatial_span, unit: um}
  alpha_mean_raw: {quantity: raw_fluorescence_intensity, unit: dimensionless}
  fascin_mean_raw: {quantity: raw_fluorescence_intensity, unit: dimensionless}
  actin_mean_raw: {quantity: raw_fluorescence_intensity, unit: dimensionless}
  alpha_norm_peak: {quantity: normalized_fluorescence_intensity, unit: dimensionless}
  fascin_norm_peak: {quantity: normalized_fluorescence_intensity, unit: dimensionless}
  actin_norm_peak: {quantity: normalized_fluorescence_intensity, unit: dimensionless}
  alpha_peak_position: {quantity: profile_spatial_span, unit: um}
  fascin_peak_position: {quantity: profile_spatial_span, unit: um}
  corr_alpha_fascin: {quantity: pearson_correlation, unit: dimensionless}
  corr_actin_alpha: {quantity: pearson_correlation, unit: dimensionless}
  corr_actin_fascin: {quantity: pearson_correlation, unit: dimensionless}
settings: {}
stochastic: false
