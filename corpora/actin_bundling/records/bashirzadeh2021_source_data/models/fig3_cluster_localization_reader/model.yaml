id: fig3_cluster_localization_reader
name: Figs. 3c and 3d GUV actin cluster localization live reader
role: processing
software: true
stated:
  none: "binary xlsx spreadsheet in Figshare Source Data archive"
  where: "Source_data.xlsx ('Sheet4', A1:X15)"
  quote: "cluster location, >16 um GUVs / center / pole / noCluster / fascin / NoFascin>16um"
inputs:
  category: {quantity: cluster_category_index, unit: dimensionless}
outputs:
  n_guvs: {quantity: guv_sample_count, unit: dimensionless}
  n_guvs_combined: {quantity: guv_sample_count, unit: dimensionless}
  center_pct: {quantity: cluster_localization_percentage, unit: percent}
  periphery_pct: {quantity: cluster_localization_percentage, unit: percent}
  no_cluster_pct: {quantity: cluster_localization_percentage, unit: percent}
settings: {}
stochastic: false
