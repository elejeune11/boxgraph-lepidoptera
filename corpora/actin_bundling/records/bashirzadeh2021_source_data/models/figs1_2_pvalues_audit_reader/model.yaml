id: figs1_2_pvalues_audit_reader
name: Figs. 1 and 2 Welch t-test p-value audit reader (all 18 tests)
role: processing
software: true
stated:
  none: "binary xlsx spreadsheets in Figshare Source Data archive"
  where: "Figs_1_and_2_Pvalues.xlsx ('Sheet1' A1:K40 & 'Sheet3'-'Sheet20') cross-checked against Source_data.xlsx ('Sheet2' & 'Sheet3')"
  quote: "t-Test: Two-Sample Assuming Unequal Variances / Fig2d / Fig2e / Fig2f / Fig1c / Fig1d / Fig1f"
inputs:
  test_id: {quantity: ttest_pair_index, unit: dimensionless}
outputs:
  mean_small_pct: {quantity: morphology_percentage, unit: percent}
  mean_large_pct: {quantity: morphology_percentage, unit: percent}
  t_welch: {quantity: welch_t_statistic, unit: dimensionless}
  df_welch_excel: {quantity: welch_degrees_of_freedom, unit: dimensionless}
  df_welch_exact: {quantity: welch_degrees_of_freedom, unit: dimensionless}
  p_welch_excel_two: {quantity: p_value, unit: dimensionless}
  p_welch_exact_two: {quantity: p_value, unit: dimensionless}
  p_student_two: {quantity: p_value, unit: dimensionless}
  p_sheet_stored: {quantity: p_value, unit: dimensionless}
  p_welch_excel_fixed_plus1: {quantity: p_value, unit: dimensionless}
  max_abs_diff_vs_source_data: {quantity: max_abs_percentage_diff, unit: percent}
settings: {}
stochastic: false
