id: fig1_fig2_guv_morphology_reader
name: Figs. 1 and 2 GUV actin morphology counts, percentages, and peripheral aster live reader
role: processing
software: true
stated:
  none: "binary xlsx spreadsheet in Figshare Source Data archive"
  where: "Source_data.xlsx ('Sheet2' Fig. 1 alpha-actinin & 'Sheet3' Fig. 2 alpha-actinin+fascin, A1:AC50)"
  quote: "ring / ring/network / network / 7-12 small / 12-16 medium / >16 big / 7 to 16 / Lumen / Membrane"
inputs:
  condition: {quantity: condition_index, unit: dimensionless}
  size_bin: {quantity: size_bin_index, unit: dimensionless}
outputs:
  n_guv_size_total: {quantity: guv_sample_count, unit: dimensionless}
  n_guv_7to16_total: {quantity: guv_sample_count, unit: dimensionless}
  n_guv_rep1_total: {quantity: guv_sample_count, unit: dimensionless}
  n_guv_rep2_total: {quantity: guv_sample_count, unit: dimensionless}
  n_guv_rep3_total: {quantity: guv_sample_count, unit: dimensionless}
  ring_pct_mean: {quantity: morphology_percentage, unit: percent}
  ring_pct_sem: {quantity: morphology_percentage_sem, unit: percent}
  ring_net_pct_mean: {quantity: morphology_percentage, unit: percent}
  ring_net_pct_sem: {quantity: morphology_percentage_sem, unit: percent}
  net_pct_mean: {quantity: morphology_percentage, unit: percent}
  net_pct_sem: {quantity: morphology_percentage_sem, unit: percent}
  cumul_ring_prob_correct: {quantity: cumulative_morphology_probability, unit: dimensionless}
  cumul_ring_prob_sheet_a8: {quantity: cumulative_morphology_probability, unit: dimensionless}
  cumul_rn_prob_correct: {quantity: cumulative_morphology_probability, unit: dimensionless}
  cumul_net_prob_correct: {quantity: cumulative_morphology_probability, unit: dimensionless}
  aster_7to16_pct_mean: {quantity: morphology_percentage, unit: percent}
  aster_7to16_pct_sem: {quantity: morphology_percentage_sem, unit: percent}
  aster_gt16_pct_mean: {quantity: morphology_percentage, unit: percent}
  aster_gt16_pct_sem: {quantity: morphology_percentage_sem, unit: percent}
  aster_gt16_pct_mean_fixed: {quantity: morphology_percentage, unit: percent}
  aster_gt16_count_sum: {quantity: guv_sample_count, unit: dimensionless}
  fig1g_lumen_pct: {quantity: peripheral_bundle_percentage, unit: percent}
  fig1g_periph_pct: {quantity: peripheral_bundle_percentage, unit: percent}
  fig1g_denom_count: {quantity: guv_sample_count, unit: dimensionless}
settings:
  dataset: "fig1_sheet2"
stochastic: false
