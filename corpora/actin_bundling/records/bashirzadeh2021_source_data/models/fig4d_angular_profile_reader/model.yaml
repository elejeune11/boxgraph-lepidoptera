id: fig4d_angular_profile_reader
name: Confocal angular fluorescence profile reader from Fig4c-d.mat (Fig. 4d)
role: processing
software: true
stated:
  none: "binary MATLAB v5 .mat file in Figshare Source Data archive"
  where: "Fig4c-d.mat (ValuesAlphaoval, ValuesFascinoval, ValuesActinoval, *2oval)"
  quote: "ValuesAlphaoval / ValuesFascinoval / ValuesActinoval / ValuesAlpha2oval / ValuesFascin2oval / ValuesActin2oval"
inputs:
  profile: {quantity: profile_index, unit: dimensionless}
outputs:
  n_points: {quantity: data_point_count, unit: dimensionless}
  angular_span: {quantity: profile_angular_span, unit: dimensionless}
  alpha_mean_raw: {quantity: raw_fluorescence_intensity, unit: dimensionless}
  fascin_mean_raw: {quantity: raw_fluorescence_intensity, unit: dimensionless}
  actin_mean_raw: {quantity: raw_fluorescence_intensity, unit: dimensionless}
  alpha_cv: {quantity: intensity_cv, unit: dimensionless}
  fascin_cv: {quantity: intensity_cv, unit: dimensionless}
  actin_cv: {quantity: intensity_cv, unit: dimensionless}
  corr_alpha_fascin: {quantity: pearson_correlation, unit: dimensionless}
  corr_actin_alpha: {quantity: pearson_correlation, unit: dimensionless}
  corr_actin_fascin: {quantity: pearson_correlation, unit: dimensionless}
settings: {}
stochastic: false
