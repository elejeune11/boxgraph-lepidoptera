# Cross-record validation audit for bashirzadeh2021_source_data
# (Figshare Source Data for Bashirzadeh et al., Commun. Biol. 4, 1136, 2021;
# DOI 10.6084/m9.figshare.16337442.v1).
#
# Pairwise audit summary:
# - graham2024 (Graham et al., PNAS 121(3), e2309152121, 2024): 0 cross-record validations in either
#   direction (logged in questions.yaml `q_graham2024_pair_audit_and_quantitative_comparison`).
#   1. bashirzadeh2021_source_data -> graham2024 (60 `origin: measured` datums): all 7 models in
#      bashirzadeh2021_source_data are `role: processing`, `software: true` Excel/MATLAB readers of
#      Bashirzadeh et al. (2021)'s own GUV microscopy archive, not predictive mechanistic models of
#      graham2024's VASP-Arp2/3-VCA liquid-droplet experiments.
#   2. graham2024 -> bashirzadeh2021_source_data (44 `origin: measured` datums):
#      - graham2024's 3D CytoSim model (`cytosim_actin_vasp_arp23_vca`) is `runnable: false` and
#        models VASP + Arp2/3 + VCA inside a rigid R_drop = 1 um sphere (lacking both alpha-actinin
#        and fascin: "Importantly, our system lacks fascin", p. 8).
#      - graham2024/actin_persistence_length_from_rigidity (`L_p = K_bend / (k_B T)` = 18.11 um at
#        K_bend = 0.075 pN*um^2, T = 300 K; text ~17 um) applies to single bare F-actin filaments,
#        whereas bashirzadeh2021_source_data contains zero bare-actin `[0:0:10]` L_p measurements
#        and only crosslinked multi-filament bundles (`paper_Lp_0_1_10`..`paper_Lp_1_3_10`,
#        33.37-99.71 um); graham2024 has no bundle flexural-rigidity model K_bundle(N_f, [fascin],
#        [alpha-actinin]). Testing single-filament L_p against crosslinked bundles would be invalid.
#      - The remaining 39 `origin: measured` datums in bashirzadeh2021_source_data are GUV/bundle
#        sample counts, spreadsheet SEM values, and MATLAB array point counts, none predicted by any
#        runnable graham2024 model.
