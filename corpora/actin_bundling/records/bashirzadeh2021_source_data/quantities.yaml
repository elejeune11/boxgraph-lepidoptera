# Quantities declared for bashirzadeh2021_source_data
# Core physical quantities align with bashirzadeh2021/quantities.yaml for cross-record checks.

# Selector / categorical indices for live Source Data reader models
- id: condition_index
  name: experimental condition index
  dimension: dimensionless
  description: "Integer index selecting crosslinker molar-ratio condition (Figs. 1-2: 1=0.1, 2=0.2, 3=0.3; Fig. 4e/Supp. Fig. 9c: 1=[0:1:10], 2=[0:3:10], 3=[1:1:10], 4=[1:2:10], 5=[1:3:10], 6=[3:3:10])."

- id: size_bin_index
  name: GUV diameter bin or replicate index
  dimension: dimensionless
  description: "Integer index selecting GUV diameter bin (1=7-12 um, 2=12-16 um, 3=>16 um) or replicate experiment (1, 2, 3)."

- id: ttest_pair_index
  name: pairwise hypothesis test index
  dimension: dimensionless
  description: "Integer index selecting a pairwise comparison in Fig. 4e/Supp. Fig. 9c (1..4) or in Figs_1_and_2_Pvalues.xlsx (1..18 corresponding to Sheet3..Sheet20)."

- id: cluster_category_index
  name: cluster localization category index
  dimension: dimensionless
  description: "Integer index selecting a Fig. 3c/3d or Sheet4 GUV cluster-localization category (1=Fig. 3d 16-24 um, 2=Fig. 3d >24 um, 3=Fig. 3c alpha-actinin+fascin, 4=Fig. 3c alpha-actinin only, 5=raw Sheet4 16_25 um, 6=raw Sheet4 >25 um)."

- id: profile_index
  name: fluorescence profile series index
  dimension: dimensionless
  description: "Integer index selecting a fluorescence line or angular profile set inside Fig4c-d.mat (1=Fig. 4c line 1, 2=line 2, 3=Fig. 4d oval 1, 4=oval 2, 5=Supp. Fig. 8e ring)."

# Sample counts and experimental ratios (matching bashirzadeh2021)
- id: alpha_actinin_to_actin_ratio
  name: alpha-actinin to actin molar ratio
  dimension: dimensionless
  description: Molar concentration ratio [alpha-actinin]/[actin] (M/M).

- id: fascin_to_actin_ratio
  name: fascin to actin molar ratio
  dimension: dimensionless
  description: Molar concentration ratio [fascin]/[actin] (M/M).

- id: actin_concentration
  name: actin molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Encapsulated molar concentration of actin monomers polymerized into F-actin (5 uM).

- id: guv_diameter
  name: GUV diameter
  dimension: "[length]"
  description: Diameter of a giant unilamellar vesicle (GUV) used for spherical confinement categorization.

- id: guv_sample_count
  name: number of analyzed GUVs
  dimension: dimensionless
  description: Count of GUVs analyzed in a given diameter category, replicate, or experimental condition.

- id: bundle_sample_count
  name: number of analyzed actin bundles
  dimension: dimensionless
  description: Count of actin bundles analyzed for persistence length (Fig. 4e, Supp. Fig. 9c) or subset counts (unique bundles, bundles violating 8 < L < 20 um).

- id: data_point_count
  name: number of sampled points in a profile
  dimension: dimensionless
  description: Number of spatial or angular sampling points in a Fig4c-d.mat fluorescence profile array.

# Persistence length and contour length quantities (Fig. 4e & Supp. Fig. 9c)
- id: bundle_persistence_length
  name: actin bundle or filament persistence length
  dimension: "[length]"
  description: Effective persistence length L_p' of an experimentally skeletonized actin bundle (um).

- id: bundle_persistence_length_sd
  name: standard deviation of bundle persistence length
  dimension: "[length]"
  description: Sample standard deviation (ddof=1) of measured actin bundle persistence length across N_bundles (um).

- id: bundle_persistence_length_sem
  name: standard error of the mean of bundle persistence length
  dimension: "[length]"
  description: Standard error of the mean (SEM) of measured actin bundle persistence length (um).

- id: filament_contour_length
  name: actin filament or bundle contour length
  dimension: "[length]"
  description: Contour length L of a skeletonized actin bundle (um).

# Hypothesis test quantities (Fig. 1, Fig. 2, Fig. 4e)
- id: p_value
  name: statistical hypothesis test p-value
  dimension: dimensionless
  description: Two-sided or one-sided p-value from Welch, Student, Mann-Whitney U, or log-transformed Welch tests.

- id: welch_t_statistic
  name: Welch t-test statistic
  dimension: dimensionless
  description: Unpaired two-sample unequal-variance Student (Welch) t-statistic.

- id: welch_degrees_of_freedom
  name: Welch-Satterthwaite degrees of freedom
  dimension: dimensionless
  description: Continuous or Excel-rounded integer Welch-Satterthwaite degrees of freedom.

# GUV morphology percentages, cumulative probabilities, and cluster localization (Figs. 1-3)
- id: morphology_percentage
  name: GUV actin morphology formation percentage
  dimension: dimensionless
  description: Percentage of analyzed GUVs forming rings, ring/networks, networks, or asters across n = 3 replicates (Figs. 1c, 1d, 1f, 2d, 2e, 2f).

- id: morphology_percentage_sem
  name: standard error of the mean of GUV morphology percentage
  dimension: dimensionless
  description: Standard error of the mean (SEM, percentage points) of GUV morphology percentage across n = 3 independent experiments.

- id: cumulative_morphology_probability
  name: cumulative GUV morphology probability
  dimension: dimensionless
  description: Pooled probability (fraction in [0, 1]) of Ring, Ring/Network, or Network formation across all alpha-actinin concentrations (Figs. 1b, 2b).

- id: peripheral_bundle_percentage
  name: peripheral vs lumenal bundle percentage in peripheral asters
  dimension: dimensionless
  description: Cumulative percentage of large GUVs with peripheral asters having all peripheral bundles vs at least one lumenal bundle (Fig. 1g).

- id: cluster_localization_percentage
  name: actin cluster localization percentage
  dimension: dimensionless
  description: Cumulative percentage of large GUVs with actin clusters at the center, at the periphery (pole), or without clusters (Figs. 3c, 3d).

# Fluorescence profile quantities (Fig. 4c, 4d, Supp. Fig. 8e from Fig4c-d.mat)
- id: profile_spatial_span
  name: fluorescence line profile length
  dimension: "[length]"
  description: Maximum spatial distance along a confocal line intensity profile (um; Fig. 4c, Supp. Fig. 8e).

- id: profile_angular_span
  name: fluorescence angular profile span
  dimension: dimensionless
  description: Maximum angular coordinate along a circular confocal intensity profile (degrees; Fig. 4d).

- id: raw_fluorescence_intensity
  name: raw confocal fluorescence intensity
  dimension: dimensionless
  description: Unnormalized confocal fluorescence intensity in arbitrary units (a.u.) stored in Fig4c-d.mat.

- id: normalized_fluorescence_intensity
  name: mean-normalized fluorescence intensity
  dimension: dimensionless
  description: Confocal fluorescence intensity divided by its profile mean I(x)/<I> (Fig. 4c, Supp. Fig. 8e).

- id: intensity_cv
  name: fluorescence intensity coefficient of variation
  dimension: dimensionless
  description: Relative modulation SD(I)/mean(I) of a confocal fluorescence intensity profile.

- id: pearson_correlation
  name: Pearson correlation coefficient
  dimension: dimensionless
  description: Linear Pearson correlation coefficient r between two confocal fluorescence channels along the same spatial or angular scan.

# Audit verification indicators
- id: exact_match_flag
  name: binary workbook identity indicator
  dimension: dimensionless
  description: Equals 1 if two workbook sheets match cell-for-cell (values and formulas), 0 otherwise.

- id: max_abs_percentage_diff
  name: maximum absolute percentage difference across cells
  dimension: dimensionless
  description: Maximum absolute difference (percentage points) between replicate entries in Figs_1_and_2_Pvalues.xlsx and Source_data.xlsx.
