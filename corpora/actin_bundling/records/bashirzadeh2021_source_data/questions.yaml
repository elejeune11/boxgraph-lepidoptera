- id: q_fig4cd_mat_unplotted_actin_and_undocumented_supp_fig8e
  kind: reading
  about:
    - fig4c_line_profile_reader
    - fig4d_angular_profile_reader
    - mat_fig4c_alpha_peak_norm
    - mat_fig4d_npoints
    - mat_s8e_ring_npoints
  text: >
    Inspection of `Fig4c-d.mat` (15 MATLAB v5 double arrays) clarifies three undocumented details
    of Figs. 4c, 4d, and Supplementary Fig. 8e: (1) Despite its filename `Fig4c-d.mat`, the file
    also stores the 18-point (`0–3.953 um`) cross-section profiles `ValuesActinRing`,
    `ValuesAlphaRing`, and `ValuesFascinRing` plotted in **Supplementary Fig. 8e** (mean-normalized
    peaks `1.525, 1.253, 1.088` at `x = 2.33–2.56 um`, strong colocalization `r = 0.791–0.921`).
    (2) In Fig. 4c (`ValuesAlpha`, `ValuesFascin`, n=213, `0–49.30 um`), both crosslinkers peak at
    the central cluster (`r = +0.897`), with α-actinin enriched more sharply (`1.911x` mean vs
    fascin `1.469x`); `ValuesActin` has only `209` points (`0–48.37 um`), matching a second scan
    set (`*2`, n=209). (3) In Fig. 4d (`ValuesAlphaoval`, `ValuesFascinoval`, n=360, `0–359 deg`),
    the paper omits the accompanying `ValuesActinoval` array (`CV = 15.9%`) and plots raw intensities
    on equal-span 500-a.u. axes (`1400–1900` vs `500–1000`), where both crosslinkers exhibit nearly
    identical weak relative modulation (`CV = 3.17%` α-actinin vs `2.55%` fascin). The quantitative
    signature of sorting outside the cluster only appears by correlating against the unplotted actin
    channel (`r(actin, fascin) = +0.421` vs `r(actin, α-actinin) = +0.170`; secondary circle
    `Values*2oval`: `+0.430` vs `+0.078`).
