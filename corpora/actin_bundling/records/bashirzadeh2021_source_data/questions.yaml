- id: q_graham2024_pair_audit_and_quantitative_comparison
  kind: unstated_model
  about:
    - fig4e_persistence_length_reader
    - fig1_fig2_guv_morphology_reader
    - fig3_cluster_localization_reader
    - fig4c_line_profile_reader
    - fig4d_angular_profile_reader
    - paper_Lp_0_1_10
    - paper_Lp_1_3_10
    - graham2024/actin_persistence_length_from_rigidity
    - graham2024/max_filament_length_circumference
    - graham2024/cytosim_actin_vasp_arp23_vca
    - graham2024/aster_spoke_enrichment
    - graham2024/fig4f_0nM_fig
    - graham2024/fig6c_asters_fig
    - graham2024/fig6f_spoke_enrichment_fig
  text: >
    Cross-record relate/validate audit of `bashirzadeh2021_source_data` + `graham2024` (Graham et al.,
    PNAS 121(3), e2309152121, 2024): **0 ModelAtlas relations** (273 model pairs audited), **0 cited
    links**, and **0 valid CrossValidation entries** in either direction.
    (1) **False-positive pairing cause**: `pipeline/pairs.py` paired these records solely via
    `graham2024 cites Bashirzadeh 2021 (ref-12)` (`\bBashirzadeh\b.*\b2021\b`), which matched Yashar
    Bashirzadeh as second author of **Wubshet, Bashirzadeh & Liu (MBoC 32, 1634-1640, 2021)** — cited
    twice in `graham2024` as `ref-12` (pp. 2, 10, 11) and duplicate `ref-44` (pp. 7, 12) for Arp2/3
    suppression of fascin bundles in GUVs — NOT Bashirzadeh et al. (*Commun. Biol.* 4, 1136, 2021) or
    its Figshare Source Data (`10.6084/m9.figshare.16337442.v1`).
    (2) **Why no relations, cited links, or validations apply**: all 7 `bashirzadeh2021_source_data`
    models are `role: processing`, `software: true` Excel/MATLAB readers taking discrete integer
    selectors over fixed Figshare files (not continuous physical equations or predictive models of
    `graham2024`'s VASP-Arp2/3-VCA droplets); conversely, `graham2024`'s 3D CytoSim model is
    `runnable: false` and lacks α-actinin and fascin (*"Importantly, our system lacks fascin"*, p. 8),
    its `actin_persistence_length_from_rigidity` models single bare F-actin filaments (absent from
    `Sheet5`), and its other 37 runnable models predict VASP-Arp2/3-VCA setup/ODE/radial-density/FRAP
    quantities disjoint from `bashirzadeh2021_source_data`'s 44 `origin: measured` datums (crosslinked
    bundle `L_p`, SEMs, GUV/bundle sample counts, and `.mat` array lengths).
    (3) **Quantitative comparison A — Bundle `L_p` (`Sheet5`) vs single-filament `L_p` (`graham2024`)**:
    `graham2024/actin_persistence_length_from_rigidity` maps Table S1 `K_bend = 0.075 pN*um^2` (Gittes
    et al. 1993) to `L_p = 18.11 um` at `300 K` (`18.22 um` at `298.15 K`, `17.86 um` at CytoSim
    `k_B T = 0.0042 pN*um`; printed `~17 um` on p. 7). Across `Sheet5`'s 6 crosslinked-bundle
    conditions (`N = 109` rows, `102` unique), mean `L_p` spans `1.84x-5.51x` above `18.11 um`
    (`K_eff(300 K) = 0.138-0.413 pN*um^2`): `[0:1:10]` `33.37 +/- 7.68 um` (`1.84x`), `[0:3:10]`
    `39.38 +/- 9.13 um` (`2.17x`), `[1:1:10]` `54.25 +/- 10.42 um` (`3.00x`), `[1:2:10]`
    `77.83 +/- 19.05 um` (`4.30x`), `[1:3:10]` `99.71 +/- 13.97 um` (`5.51x`; deduplicated `103.99 um`),
    and Supp. Fig. 9c `[3:3:10]` `95.62 +/- 21.86 um` (`5.28x`), implying modest effective bundle sizes
    (`N_eff = 1.8-5.5` under uncoupled linear scaling or `1.4-2.4` under shear-coupled quadratic
    scaling). Critically, because raw `Sheet5` distributions are strongly right-skewed, **50.0%
    (11/22)** of `[0:1:10]` bundles (median `18.02 um`, min `8.10 um`), **42.9% (6/14)** of `[0:3:10]`
    bundles (min `9.48 um`), and **21.1% (23/109)** of all measured bundles (`20/109 = 18.3% < 17 um`)
    fall *below* `graham2024`'s single-filament `18.11 um`; adding fascin collapses this `< 18.11 um`
    tail to `5.6%-14.3%` (`0%` at `[3:3:10]`).
    (4) **Quantitative comparison B — Confinement diameter, `L_p/D`, `L_max = 2*pi*R_drop`, and ring/aster
    control**: `graham2024` confines actin in small VASP droplets (`R_drop = 1 um`, `D = 2 um`,
    `L_max = 2*pi*R_drop = 6.283 um`, single-filament `L_p/D = 8.5-9.1`; Fig. 1C experimental average
    `D ~ 3 um`, histogram weighted mean `2.50 um` VASP-only and `4.12 um` VASP+Arp2/3+VCA, `99%+ < 7.4 um`),
    where single filaments bend into peripheral rings (`34.2%` Ring + `53.6%` Disc at `0 nM` Arp2/3,
    Fig. 4F) until Arp2/3 shortens median `L_fil` below `D = 2 um` (`~5.6 um` -> `~0.75 um` at `150 nM`,
    Fig. 5E; `76.1%` Shells) or generates asters at high actin:VASP (`4:1 uM`: `0%` -> `76.7%` at
    `500 nM` Arp2/3, Fig. 6C). By contrast, `bashirzadeh2021_source_data` GUV bins (`7-12`, `12-16`,
    `>16 um`; Fig. 3d split `24 um`; Fig. 4c span `49.30 um`; circumferences `pi*D = 22.0-75.4 um`)
    are `3.5x-25x` wider: at `D = 16-24 um`, single-filament `L_p/D = 0.71-1.06`, whereas crosslinked
    bundles restore `L_p/D = 1.39-6.23`, and `67/73` (**91.8%**) of `Sheet5` bundle contour lengths
    (`4.43-52.74 um`, median `10.28 um`) exceed `graham2024`'s `L_max = 6.283 um` while staying below
    large-GUV circumferences. Stiffening bundles with fascin shifts medium GUVs away from rings (`50.9%`
    in `Sheet2` [115/226] -> `15.4%` true / `11.9%` buggy `A9` in `Sheet3` [23/149]) and shifts >16 um
    asters from periphery (`3.75%` central, `62.50%` pole in `Sheet4` `NoFascin>16um`, `n=80`) to
    center (`29.89%` central overall, `57.69%` at `>24 um`, `n=87`).
    (5) **Quantitative comparison C — Spatial sorting in asters (`Fig4c-d.mat` vs `graham2024` Fig. 6F)**:
    Both papers measure core-vs-spoke sorting with radial/circular confocal profiles (`graham2024`
    Methods p. 11 circular scan `1 um` outside the core; `Fig4c-d.mat` `49.30 um` line + `360 deg`
    circle). `graham2024` finds sharp **`7.6x-10x`** VASP-vs-Arp2/3 spoke enrichment (Fig. 6F digitized
    `0.563 +/- 0.175` vs `0.074 +/- 0.070`; text `6.8 +/- 2.3%` vs `0.69 +/- 0.52%`), whereas
    `Fig4c-d.mat` shows only a **`1.30x`** central α-actinin/fascin peak-normalized ratio (`1.911` vs
    `1.469`; secondary scan `1.909` vs `1.414`, `1.35x`), weak angular modulation (`CV = 3.17%`
    α-actinin vs `2.55%` fascin vs `15.88%` unplotted actin), and an exploratory Graham-style
    actin-normalized spoke/core ratio (Fig. 4d top-10% actin angles vs Fig. 4c cluster peak) of
    `E_fascin = 1.19` vs `E_alpha = 0.86` (**`1.38x`**; `[23, 27.5] um` core window: `0.92` vs `0.72`,
    **`1.28x`**) — `~6x` smaller in fold amplitude, so sorting in `Fig4c-d.mat` appears mainly in
    angular phase correlation with actin (`r = +0.421` fascin vs `+0.170` α-actinin).
