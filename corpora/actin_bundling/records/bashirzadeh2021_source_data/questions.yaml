  text: >
    **ALL 18 p-values printed on Figs. 1c, 1d, 1f (p. 3) and Figs. 2d, 2e, 2f (p. 4) of
    `bashirzadeh2021` are completely swapped between Fig. 1 and Fig. 2.** In `Figs_1_and_2_Pvalues.xlsx`,
    `Sheet1` rows 1–18 hold Fig. 2 (α-actinin+fascin, matching `Source_data.xlsx` `Sheet3` to `< 5e-6`)
    and feed Excel ToolPak Welch t-tests `Sheet3`–`Sheet11`, whereas `Sheet1` rows 23–40 hold Fig. 1
    (α-actinin-only, matching `Source_data.xlsx` `Sheet2` to `< 5e-6`) and feed `Sheet12`–`Sheet20`.
    Yet the published paper placed `Sheet3`–`Sheet11` (Fig. 2 results) onto **Fig. 1** (`1c`:
    `0.0185, 0.0009, 0.0018`; `1d`: `0.0382, 0.0150, 0.0266`; `1f`: `0.0392, 0.0004, 0.0364`) and
    placed `Sheet12`–`Sheet20` (Fig. 1 results) onto **Fig. 2** (`2d`: `0.0006, 0.0034, 0.0079`;
    `2e`: `0.0338, 0.0261, 0.0217`; `2f`: `0.0241, 0.0168, 0.0435`). Furthermore, `Sheet12`
    (`0.006397`, true Fig. 1c `0.1`) suffered an additional 10x decimal-place transcription error
    when printed as `p = 0.0006` on Fig. 2d, and multiple values were truncated rather than rounded
    to 4 decimal places (`0.000472 -> 0.0004`, `0.015065 -> 0.0150`, `0.026163 -> 0.0261`,
    `0.021749 -> 0.0217`, `0.024161 -> 0.0241`). Also note Excel's integer rounding of Welch-Satterthwaite
    `df` at `n = 3` per group shifts several p-values materially relative to exact continuous-df Welch
    t-tests (e.g., `Sheet18` Fig. 1f `0.1`: `df = 2.403 -> 2` gives `0.0242` vs exact `0.0151`;
    `Sheet13` Fig. 1c `0.2`: `df = 2.59 -> 3` gives `0.00343` vs exact `0.00585`; `Sheet20` Fig. 1f
    `0.3`: `df = 3.57 -> 4` gives `0.0435` vs exact `0.04995`).
