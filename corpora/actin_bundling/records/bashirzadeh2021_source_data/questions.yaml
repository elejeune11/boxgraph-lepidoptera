    where: "Fig4e_persistence_length_data.xlsx ('Sheet5' A31:AG39 & 'P_PL' A1:U30)"
    quote: "A32=A33/SQRT(13), K32=K33/SQRT(15), X33=STDEV(X2:X25), X32=X33/SQRT(24), AG39=AG38/SQRT(15)"

- id: q_fig4e_duplicate_bundles_length_violations_and_skewness
  kind: possible_error
  about:
    - fig4e_persistence_length_reader
    - fig4e_ttest_audit_reader
    - paper_nbundles_1_3_10
    - cmp_nbundles_1310_unique
    - cmp_fig4e_p_0110_vs_1110_mw
    - cmp_fig4e_p_1110_vs_1310_dedup
    - cmp_fig4e_p_0310_vs_1310_dedup
  text: >
    Three data-integrity and distributional issues affect `Sheet5` (`Fig4e_persistence_length_data.xlsx`):
    (1) **Exact 15-digit duplicate bundle rows**: `[1:3:10]` (`X2:Y27`, N=26) contains 5 exact
    floating-point duplicate `L_p` entries — four full `(L_p, L)` pairs appear verbatim in reverse
    order (`R4=R22`: `197.279758769351, 9.34340465240673`; `R5=R21`: `53.6680569614863, 11.9739782216399`;
    `R6=R19`: `13.137221669911, 15.0323865912941`; `R7=R18`: `70.3044287054511, 10.2190919988279`)
    plus `X15=X16` (`74.1635462702595`), leaving only 21 unique bundles (`mean = 103.99 +/- 15.87 um`);
    `[1:1:10]` (`K2:L19`, N=18) also duplicates `(K3,L3) == (K10,L10)` (`31.0787494721203, 17.2547743730733`),
    leaving 17 unique bundles (`mean = 55.61 +/- 10.96 um`). Deduplication shifts the three Welch
    p-values from `(0.1162, 0.0125, 0.00087)` to `(0.1305, 0.0171, 0.00135)` (same qualitative
    significance at alpha = 0.05). (2) **Violation of stated `8 < L < 20 um` selection criterion**:
    across the 73 Fig. 4e bundles with recorded contour lengths (cols `B, H, L, R, Y`), 25/73
    (34.2% — 20 bundles with `L < 8 um` down to `4.43 um`, and 5 bundles in `[0:1:10]` with
    `L > 20 um` up to `52.74 um`) fall outside Methods p. 8's `"8 < L < 20 um"` window. Also rows
    37–41 contain undocumented excluded outliers (`2.62–7.58 um` and `296–5225 um`). (3) **Strong
    right-skewness**: because `SD > mean` in `[0:1:10]` and `L_p` spans 8–236 um, two-sided
    Mann-Whitney U (`p = 0.01496`) and log-transformed Welch t-test (`p = 0.01619`) find a
    statistically significant stiffness increase from `[0:1:10]` to `[1:1:10]`, whereas the
    paper's untransformed Welch t-test (`p = 0.1162`) reports it as non-significant.
  citation:
