- id: q_source_data_formula_bugs_j11_and_plus1
  kind: possible_error
  about:
    - fig1_fig2_guv_morphology_reader
    - figs1_2_pvalues_audit_reader
    - sheet2_fig1b_med_ring_a9_stored
    - sheet3_fig2b_med_ring_a9_stored
    - cmp_f2b_med_ring_correct_vs_a9
  text: >
    Four spreadsheet formula bugs reside inside `Source_data.xlsx` (`Sheet2` and `Sheet3`):
    (1) **Omitted cell `J11` in `A6`** (`=F5+F8+F11+J5+J8+N2+N6+...`): drops `J11 = 2` rings in
    `Sheet2` (shifting Fig. 1b medium Ring probability from `115/226 = 0.5088` in `T2` to
    `113/224 = 0.5045` in `A9`) and drops `J11 = 6` rings in `Sheet3` (shifting Fig. 2b medium
    Ring probability from `23/149 = 0.1544` in `T2` down to `17/143 = 0.1189` in `A9`, and visual
    inspection of Fig. 2b confirms the buggy `0.119` value was plotted!).
    (2) **Spurious `+1` in peripheral aster denominators**: both `Sheet2` and `Sheet3` compute
    `Q43 = num/(SUM(N3:P3)+1)` (`8/12` instead of `8/11` in Fig. 1f; `13/19` instead of `13/18` in
    Fig. 2f) and `O44 = num/(SUM(J10:L11)+1)` (`4/15` instead of `4/14` in Fig. 1f; `12/60` instead
    of `12/59` in Fig. 2f). Removing the spurious `+1` shifts Fig. 1f `0.1` >16 um mean from `53.35%`
    to `55.37%` and its Excel Welch p-value from `0.02416` to `0.03534` (and Fig. 1f `0.2` from
    `0.01681` to `0.02080`).
    (3) **`Sheet2` `V43:V45` / `X43:X45`** compute `STDEV(...)` (SD) rather than `STDEV(...)/SQRT(3)`
    (SEM), whereas Fig. 1f plots SEM; and **`Sheet3` `Q48`** stores `'=7/13'` as a literal text string,
    causing `AVERAGE(P48:R48)` to ignore it.
    (4) `Sheet1` and `Sheet1 (2)` are superseded 2-bin draft sheets, and `Sheet2` rows 42–89 /
    `Sheet3` rows 52–72 / `Sheet4` rows 14–15 (`0min` vs `60min`, `Myosin`, `filopodia`, `shape
    changes`) contain unrelated scratch/auxiliary analyses not appearing in `bashirzadeh2021`.
  citation:
