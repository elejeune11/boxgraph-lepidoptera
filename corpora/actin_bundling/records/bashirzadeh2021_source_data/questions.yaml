- id: q_fig3c_caption_count_swap_and_diameter_threshold_error
  kind: possible_error
  about:
    - fig3_cluster_localization_reader
    - paper_fig3c_nguv_alpha_only
    - paper_fig3c_nguv_alpha_fascin
    - cmp_f3c_n_alpha_only_vs_caption
    - cmp_f3c_n_alpha_fascin_vs_caption
    - cmp_f3_raw_16_25_vs_61
    - cmp_f3_raw_gt25_vs_26
  text: >
    `Source_data.xlsx` `Sheet4` reveals THREE discrepancies in Fig. 3c & 3d (p. 5):
    (1) **Swapped sample counts in Fig. 3c caption**: the caption prints
    `N_GUVs>20 um = 167 [87 (α-actinin), 80 (α-actinin+fascin)]`, whereas `Sheet4` proves `80` is
    `NoFascin>16um` (`N5:P5 = 3, 50, 27` -> `3.75%` center, `62.50%` pole) and `87` is `fascin`
    (`J4:L4 + J6:L6 = 61 + 26 = 87` -> `29.89%` center, `47.13%` pole — the exact same 87 GUVs
    plotted in Fig. 3d!).
    (2) **Misstated diameter threshold in Fig. 3c**: the caption and text claim Fig. 3c analyzes
    GUVs with diameter `>20 um`, whereas `Sheet4` explicitly titles the table `A1 = 'cluster location,
    >16 um GUVs'`, labels `M10 = 'NoFascin>16um'`, and computes the α-actinin+fascin bar directly
    from `16–24 um` (`J4:L4`, n=61) + `>24 um` (`J6:L6`, n=26).
    (3) **Hardcoded summary vs stale raw breakdown**: in `Sheet4`, cells `K4=34`, `L4=16` (n=61)
    and `J6:L6=(15, 7, 4)` (n=26) are hardcoded numbers that disagree with the raw per-concentration
    table `B4:G6` (`16_25`: `11 center, 42 pole, 9 noCluster`, n=62; `>25`: `6, 3, 2`, n=11),
    indicating the diameter cut was shifted from `25 um` to `24 um` manually without updating `B4:G6`.
