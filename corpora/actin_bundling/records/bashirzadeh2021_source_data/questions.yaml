  text: >
    Resolves both `bashirzadeh2021/q_fig1f_sample_count_mismatch` and
    `bashirzadeh2021/q_fig1g_vs_fig1f_aster_count_paradox`: the captions of Fig. 1c, d
    (`[389 42 23], [67 45 38], [188 145 128]`) and Fig. 2d, e (`[101 98 29], [147 58 71],
    [137 82 24]`) state "(numbers in brackets are arranged in order of ascending GUV diameter)",
    which is false. Direct summation of `Source_data.xlsx` `Sheet2` and `Sheet3` proves that all
    these brackets are **total GUV counts per replicate experiment across ALL diameters** — and in
    Fig. 1 `0.2` and `0.3`, the first entries (`67` and `188`) even come from unused extra blocks
    (`J1:L3` and `F1:H3`) rather than analyzed Replicate 3 (`25` and `91`)! True pooled totals by
    diameter `[7-12, 12-16, >16 um]` across the 3 replicates are `[314, 70, 70]`, `[48, 35, 25]`,
    `[155, 121, 88]` for Fig. 1 and `[127, 57, 44]`, `[176, 59, 41]`, `[182, 33, 28]` for Fig. 2.
    For Figs. 1f and 2f, the authors summed the first two replicate totals (`389+42=431` mis-added
    as `429`, `67+45=112`, `188+145=333`; `101+98=199`, `147+58=205`, `137+82=219`), falsely
    labeling them as `[7-16 um, >16 um]`. Because there are actually `70`, `25`, and `88` large
    (>16 um) GUVs in Fig. 1 (not `23, 38, 128`), Fig. 1g's peripheral aster counts are no longer
    impossible; however, Fig. 1g's caption prints `[35, 14, 53]` whereas `Sheet2` M48:N50 actually
    computes `20/35` & `15/35` (vs `21/35` & `14/35` in `H43:I43`/`G47:H47`), `5/12` & `7/12`
    (`N = 12`, NOT `14`!), and `17/53` & `36/53` (and Fig. 1f large-aster numerators in `P43:R45`
    sum to `36, 13, 56` rather than `35, 12, 53`).
