- id: q_fig4e_sem_formulas_and_count_errors
  kind: possible_error
  about:
    - fig4e_persistence_length_reader
    - fig4e_ttest_audit_reader
    - paper_Lp_sem_0_1_10
    - paper_Lp_sem_1_1_10
    - paper_Lp_sem_1_3_10
    - paper_nbundles_1_1_10
    - paper_nbundles_3_3_10
    - cmp_lp_0110_sem_true
    - cmp_lp_1110_sem_true
    - cmp_lp_1310_sem_true
    - cmp_nbundles_1110_raw
    - cmp_nbundles_s9c_3310
  text: >
    Resolves `bashirzadeh2021/q_welch_pvalues_fig4e` completely: the three printed Fig. 4e Welch
    p-values (0.1162, 0.0125, 0.0008) failed to reproduce from the caption summary values because
    THREE of the five caption SEM values come from buggy Excel formulas in `Sheet5` row 32 (both in
    `Fig4e_persistence_length_data.xlsx` and identical `Source_data.xlsx`): (1) `[0:1:10]` (`A2:A23`,
    N=22, SD=36.0375) computes `A32 = A33/SQRT(13) = 9.9950` (printed `+/- 10`) instead of true
    `SD/sqrt(22) = 7.6832` (+30.1% inflated); (2) `[1:1:10]` (`K2:K19`, N=18, SD=44.2067) computes
    `K32 = K33/SQRT(15) = 11.4141` (printed `+/- 11.4`) instead of true `SD/sqrt(18) = 10.4196`
    (+9.5% inflated), AND the caption misprints `N = 17` instead of `18` (while `P_PL` uses `18`);
    (3) `[1:3:10]` (`X2:X27`, N=26, full SD=71.2350) computes `X33 = STDEV(X2:X25) = 73.6105`
    (omitting `X26` and `X27`) and `X32 = X33/SQRT(24) = 15.0257` (printed `+/- 15`) instead of
    true `SD/sqrt(26) = 13.9703` (+7.6% inflated). Visual measurement of Fig. 4e confirms that
    the plotted bar error bars actually show the TRUE SEMs (`+/-7.68`, `+/-10.42`, `+/-13.97 um`),
    contradicting the caption's text. Using the raw columns directly, Excel Analysis ToolPak's
    integer-rounded-df Welch t-test reproduces `P_PL` to 15 digits: `0.116226` (df=33, printed
    `0.1162`), `0.012547` (df=42, printed `0.0125`), and `0.00086695` (df=38, truncated rather than
    rounded to `0.0008`; means in the caption are likewise truncated: `33.366->33.3`, `39.376->39.3`,
    `54.251->54.2`). Additionally, Supp. Fig. 9c (`Sheet5` col `AG`, `AG3:AG17`) contains `N = 15`
    bundles (`95.62 +/- 21.86 um`, `AG39 = AG38/SQRT(15)`), NOT `N = 16` as printed in the
    Supplementary Fig. 9c caption.
  citation:
