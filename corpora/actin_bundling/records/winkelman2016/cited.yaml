# Cross-record provenance audit of values cited by winkelman2016 across all six ready
# partner records (claessens2008, freedman2019, freedman2019_code, nastkolb2022,
# pelletier2003, shin2009):
#
# 1. pelletier2003 (ref-33): ONE numerical datum linked below — `d_interfil_actinin_square_lit`
#    (printed "30" nm on p. 9 / 2704: "square lattice with filaments spaced 30 nm apart [33]").
#    Linking it to `pelletier2003/lattice_spacing_printed` ("33" nm, p. 3 / 148102-3) exposes a
#    real citation discrepancy (30 nm vs 33 nm; Pelletier et al. print "~30 nm [2]" on p. 1 only
#    for the literature EM length of an alpha-actinin dimer, `alpha_actinin_length`).
# 2. claessens2008 (ref-18): cited ONLY qualitatively on p. 4 / 2699 ("perhaps because of a
#    structural difference in fascin bundles [18, 19]"). Zero datums in winkelman2016/data.yaml
#    take a numerical value from claessens2008.
# 3. shin2009 (ref-19): cited ONLY qualitatively in the same phrase "[18, 19]" on p. 4 / 2699.
#    Zero datums in winkelman2016/data.yaml take a numerical value from shin2009.
# 4. freedman2019, freedman2019_code, nastkolb2022: published after winkelman2016 (2019, 2019,
#    2022); winkelman2016 does not cite them (citations in the reverse direction — e.g.
#    freedman2019/fig3c_left_expt_fascin_datum, fig5b_expt_fascin_datum, barrier_height_ref16,
#    and freedman2019_code/kmc_winkelman_expt_table — belong in those partner records' own
#    cited.yaml files).
#
# All remaining `from_source` entries in winkelman2016/data.yaml cite ref-11, ref-14, ref-15,
# ref-21, ref-28, or ref-32, none of which is a record in the corpus.

- datum: d_interfil_actinin_square_lit
  from_datum: lattice_spacing_printed
  evidence: >
    Winkelman et al. (2016, p. 9 / 2704) write "alpha-actinin generates a square lattice with
    filaments spaced 30 nm apart [33]", citing Pelletier et al. (2003) [ref-33 / pelletier2003].
    Pelletier et al. (2003, p. 3 / 148102-3) derive a 33 nm distorted-square lattice spacing
    from the first-order SAXS peak q_1 = 0.19 nm^-1 (d = 2*pi/q_1 = 33.1 nm, datum
    lattice_spacing_printed), while quoting "~30 nm [2]" on p. 1 solely as the literature EM
    length of the alpha-actinin dimer (alpha_actinin_length). Winkelman et al. thus misstate
    Pelletier's 33 nm square-lattice interfilament spacing as 30 nm (likely conflating it with
    Pelletier's ~30 nm alpha-actinin molecular length or rounding 33 nm to one significant digit).
