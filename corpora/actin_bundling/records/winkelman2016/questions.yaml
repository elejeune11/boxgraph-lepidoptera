  text: >
    Cross-record audit of pelletier2003 + winkelman2016: (1) Citation discrepancy (linked in
    cited.yaml): Winkelman et al. (2016, p. 9 / 2704) write "alpha-actinin generates a square
    lattice with filaments spaced 30 nm apart [33]", citing Pelletier et al. (2003) [ref-33 /
    pelletier2003]. However, Pelletier et al. (2003, p. 3 / 148102-3) actually derive a 33 nm
    distorted-square lattice spacing from SAXS (d = 2*pi / q_1 = 2*pi / 0.19 nm^-1 = 33.1 nm,
    pelletier2003/lattice_spacing_printed), while printing "~30 nm [2]" on p. 1 solely as the
    literature EM length of an alpha-actinin dimer (pelletier2003/alpha_actinin_length).
    Winkelman et al. thus misstate Pelletier's 33 nm square-lattice spacing as 30 nm (note that
    Pelletier's actual 33 nm spacing agrees closely with Winkelman's own negative-stain EM
    interfilament spacing of ~32 nm / 32.9 +/- 0.15 nm in mixed bundles, Fig. 4H).
    (2) Zero mathematical relations and zero cross-record validations exist between the two
    records: pelletier2003 models single-species alpha-actinin SAXS Bragg peaks (d = 2*pi/q_1,
    q_2 = sqrt(2)*q_1, Delta_q ~ q^2, Scherrer domain size), whereas winkelman2016 models
    two-species 1D KMC domain lengths, single-molecule residence times, and trailing barbed-end
    elongation rates, with no overlapping predicted/measured model quantities.
  citation: {page: 9, printed_page: "2704", quote: "square lattice with filaments spaced 30 nm apart", where: text}

