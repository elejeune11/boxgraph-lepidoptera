    1.51, 3.49, ..., 49.44 s. (2) In its own data frame (dt = t_tick + 0.484 s), the plotted
    blue fit curve (d_figS5e_actinin_domains_fit) obeys y(dt) = 0.0859 + 0.9100*exp(-0.2064*dt)
    (y(0) = 0.996, tau = 4.84 s, k_off = 0.206 s^-1, RMSE = 0.0013 vs 0.0193 for fixed
    k_off = 0.251 s^-1) — closely matching printed tau = 4.9 sec (1/4.9 = 0.204 s^-1) rather
    than k_off = 0.251 s^-1 (revising the eye-based supposition in
    q_figs5de_offset_concentrations_and_unit_typo). (3) The 26 digitized blue data points
    (d_figS5e_actinin_domains_data, quantized in ~0.021 steps corresponding to N ~= 47 tracked
