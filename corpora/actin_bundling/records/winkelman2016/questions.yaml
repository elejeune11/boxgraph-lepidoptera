  text: >
    Several assay protocol details and figure labels are inconsistent or unstated across Main Text
    and SI: (1) Experimental Procedures (p. 10) and SI (p. 25) state that F-actin was preassembled
    from 15 uM Mg-ATP-actin monomers and spun at 10,000 x g (low-speed), without stating the
