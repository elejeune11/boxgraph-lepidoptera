  text: >
    Main Text p. 7 states that alpha-actinin-4 and fascin 1 bind in exclusive runs that are
    ~50x longer than predicted by simple mass-action competition simulations (Fig. 3H), without
    specifying the concentration/on-rate ratio r at which the ratio is evaluated. At the
    symmetric equimolar ratio r = 1.0, the cooperative-to-simple ratio is 47.2x using finite-
    lattice KMC means, 50.4x comparing the cooperative exponential fit (3.73 um) to the simple
    KMC mean (0.074 um), and 61.3x in the infinite-lattice limit (1 + exp(4.8))/2; across
    r = 0.5 to 2.0 the ratio spans 36x to 81x. Separately, SI p. 28 writes the model's
    dimensionless rate ratio parameter as k_on^B / k_on^A while Fig. S3C defines
    r = k_on^Fascin / k_on^alpha-Actinin (equivalent upon taking A = alpha-actinin, B = fascin).
  citation: {page: 7, printed_page: "2702", quote: "runs that are 503 longer than predicted by simulations based", where: text}

