  citation: {page: 18, printed_page: "SI-6", quote: "Fascin domain lengths extracted in this manner for a wider range of parameters", where: "Fig. S3C caption & Fig. 3H"}

- id: q_figs5e_digitized_data_vs_curve_and_r2
