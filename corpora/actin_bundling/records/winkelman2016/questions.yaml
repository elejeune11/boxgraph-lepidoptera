  text: >
    Cross-record forensic comparison of Winkelman (2016) Fig. 3H against Freedman et al. (2019,
    Figs. 3C & 5B Ref. 16) and the authors' released repository freedman2019_code
    (xlink_sorting_paper/kmc.ipynb Cell 9 `expt_data_txt` and process/plots.nb lines 11802-11806)
    reveals five quantitative discrepancies and mechanistic connections:
    (1) Illustrator layer shift in winkelman2016 Fig. 3H: all 11 red markers in published Fig. 3H
    (`d_fig3h_data`) are shifted by a constant (+0.0192 +/- 0.0016 in r, -0.039 +/- 0.010 um in y)
    relative to the exact author table embedded in plots.nb / kmc.ipynb and re-plotted in Freedman
    Figs. 3C & 5B (including the r = 0 negative control sitting at y = -0.0405 um); after removing
    this constant offset, all 10 positive-r points agree with Freedman Fig. 5B and plots.nb to
    <= 0.002 in r and <= 0.02 um in y. Moreover, the exact rational x-values in kmc.ipynb / plots.nb
    reveal two distinct alpha-actinin concentrations behind Fig. 3H: 400 nM for 4 points (50, 125,
    250, 500 nM fascin -> r = 0.125, 0.3125, 0.625, 1.25) and 380 nM for 6 points (r = 0.17895,
    0.26316, 0.52632, 0.78947, 1.0526, 1.5789).
    (2) Silent omission of the zero-domain point in kmc.ipynb: published Fig. 3H plots 11 points
    and plots.nb / Freedman Fig. 5B plot 10 positive-r points including (r = 0.17895, l_F = 0.0 um),
    whereas kmc.ipynb Cell 9 `expt_data_txt` (`freedman2019_code/kmc_winkelman_expt_table`) silently
    drops (0.17895, 0.0), leaving 9 points. Consequently, Winkelman's eps = 4.8 KMC models
    (both exp-fit and mean readouts) yield `close` (7/9 reproduced, 2/9 close, 0 not reproduced) on
    the 9-point kmc.ipynb table, vs `not reproduced` on the 10-point Fig. 5B and 11-point Fig. 3H
    datasets solely because of the (0.17895, 0.0) point.
    (3) Cross-check of Freedman KMC (37 nm, 27 nm) and kmc.ipynb's swapped (35 nm, 29 nm) against
    winkelman2016/d_fig3h_data (partner-owned validations belong in freedman2019 / freedman2019_code):
    at paper parameters (l_b = 37 nm, Delta l_xl = 27 nm), Freedman's KMC matches 8/10 positive-r
    Fig. 3H points within 1 SE (1 close at r = 0.644 [1.66 SE], 1 miss at r = 0.197 [2.54 SE]);
    at kmc.ipynb's transposed parameters (35 nm, 29 nm), it matches 6/10 within 1 SE (3 close, 1 miss
    at r = 0.197 [2.79 SE]). Ironically, kmc.ipynb's transposed site_width = 35 nm matches
    Winkelman's own Fig. 4G EM transverse repeat ("about 35 nm", digitized 35.17 nm;
    q_kmc_lattice_spacing_37nm_vs_em_35nm) rather than the 37 nm lattice spacing, whereas
    dxl = 37 - 8 = 29 nm matches neither Winkelman's EM spacing difference (32 - 8 = 24 nm, Fig. 4H)
    nor the cited literature difference (35 - 8 = 27 nm).
    (4) Why Freedman's KMC matches Winkelman's ~3.5-3.7 um domains at a lower per-event barrier
    (eps_eff = 3.81 at r = 1.0 vs eps = 4.8): in Freedman's growing-bundle KMC, homotypic cross-linkers
    bind across an average gap <d_same> ~= 2.4 vacant sites, multiplying domain lengths by <d_same>
    and lowering the required barrier by ln(<d_same>) ~= 0.9 k_B T. Across r = 0.3..2.0, Freedman's
    emergent barrier is U-shaped (4.15 -> 3.69 -> 4.96 k_B T), causing super-linear fascin domain
    growth (0.76 to 8.57 um) that diverges by up to 36.3% from Winkelman's constant-barrier mean
    KMC (`kmc_domain_length_mean`) on r in [0.5, 1.5], while agreeing with `kmc_domain_length_exp_fit`
    within 23.7% on r in [0.8, 2.0] and with `kmc_domain_length_mean` on l_alpha within 11.3% across
    all r in [0.3, 2.0].
    (5) Slow-growth reduction of kmc.ipynb: `freedman2019_code/kmc_notebook_growing_bundle` satisfies
    the exact same slow-growth reduction (extension_rate -> 0) to `winkelman2016/kmc_domain_length_mean`
    as `rel_freedman2019_kmc_reduces_to_winkelman_kmc_mean` (verified at eps = 3.484, r = 1.0:
    1.135 vs 1.151 um [1.4%], eps_eff = 3.466 vs 3.484), but is omitted from relations.yaml solely
    because each default 1000-trial Python notebook execution takes ~20-30 s (~33 min for 80 limit
    samples).
  citation: {page: 5, printed_page: "2700", quote: "Dependence of TMR-fascin domain length on TMR-fascin concentration.", where: "Fig. 3H & cross-check with freedman2019 / freedman2019_code"}

- id: q_freedman2019_fig4b_refutes_rate_independence_and_figs4c_excluded
