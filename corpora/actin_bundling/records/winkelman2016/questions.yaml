- id: q_figs5e_actinin_domains_tau_koff_mismatch
  kind: possible_error
  about:
    - residence_time_from_koff
    - k_off_actinin_domains
    - tau_actinin_domains
    - cmp_tau_actinin_domains
  text: >
    In Fig. S5E (p. 21 PNG; caption p. 22), the inset for single TMR-alpha-actinin molecules
    bound to alpha-actinin domains prints k_off = 0.251 s^-1 together with tau = 4.9 sec
    (R^2 = 0.997). However, for a single-exponential dwell-time distribution, tau = 1 / k_off =
    1 / 0.251 = 3.984 s (~4.0 s), disagreeing with the printed 4.9 sec by 0.92 s (23%). The
    other three insets in Fig. S5D-E all satisfy tau = 1 / k_off to two significant figures:
    Fascin Control (0.203 s^-1 -> 4.926 vs 4.9), Fascin domains (0.198 s^-1 -> 5.051 vs 5.1),
    and alpha-Actinin Control (0.217 s^-1 -> 4.608 vs 4.6 sec). Thus either tau = 4.9 sec is
    a transcription error (e.g., mistyped from 4.0 sec or copied from Fascin Control's 4.9)
    or k_off = 0.251 s^-1 is misprinted (tau = 4.9 s would correspond to k_off = 0.204 s^-1).
  citation: {page: 22, printed_page: "SI-10", quote: "Single exponential fits of the fraction of single TMR-α-actinin", where: "Fig. S5E caption"}

- id: q_kmc_finite_size_edge_effects
  kind: overstated_claim
  about:
    - kmc_domain_length_exp_fit
    - kmc_domain_length_mean
    - kmc_infinite_lattice_limit
    - N_lattice_sites
    - eps_barrier_coop
    - ref_kmc_expfit_nsites
    - ref_kmc_mean_nsites
    - cmp_inf_lF_r1p0
    - cmp_inf_lF_r2p0
  text: >
    SI p. 27 states that the virtual lattice of N = 400 binding sites (~15 um, exact 14.8 um)
    "was long enough to remove edge effects". Both the lattice-size refinement series
    (n_sites = 400 -> 800 -> 1600 -> 3200 in refinements.yaml) and the exact analytical
    N -> infinity Markov-chain limit (l_F = a * (1 + r * exp(epsilon / k_B T))) contradict
    this claim. At epsilon = 4.8 k_B T, the edge-effect-free infinite-lattice domain lengths
    are 2.285 um (r = 0.5), 4.533 um (r = 1.0), and 9.029 um (r = 2.0), whereas N = 400
    truncates domains at the bundle ends (producing the prominent spike at l = 400 sites in
    Fig. S3C and a (1 - l / L_box) finite-size factor across interior lengths). At r = 1.0,
    N = 400 depresses the arithmetic mean by 23% (3.49 vs 4.533 um) and the exponential-fit
    decay length by 18% (3.73 vs 4.533 um); at r = 2.0 (or l_alpha at r = 0.5), the arithmetic
    mean is depressed by 38% (5.57 vs 9.029 um). Consequently, the fitted switching barrier
    epsilon = 4.8 k_B T is itself modestly inflated by finite-size truncation (on an infinite
    lattice, epsilon ~= 4.60 k_B T already yields l_F = 3.7 um at r = 1.0).
  citation: {page: 27, printed_page: "SI-15", quote: "was long enough to remove edge effects occurring in experiments", where: "SI Cooperative kinetic model"}

- id: q_kmc_readout_ambiguity_mean_vs_expfit
  kind: choice
  about:
    - kmc_domain_length_exp_fit
    - kmc_domain_length_mean
    - ref_kmc_expfit_binwidth
    - l_F_S3C_r0p5
    - l_alpha_S3C_r0p5
    - l_F_S3C_r1p0
    - l_alpha_S3C_r1p0
    - l_F_S3C_r2p0
    - l_alpha_S3C_r2p0
    - cmp_mean_lalpha_r0p5
    - cmp_mean_lF_r2p0
  text: >
    The paper describes two different summary statistics for extracting domain lengths from
    the 5000 KMC simulations on N = 400 sites: SI p. 28 states "From these runs we compute the
    average repeat length of A's and B's" (direct arithmetic mean), whereas Fig. S3C caption
    (p. 18) states "average domain lengths from exponential fits for fascin and alpha-actinin
    given in the inset", without specifying histogram binning, whether the boundary-truncated
    spike at l = 400 sites is retained in the fit, or whether fitting is done in linear or
    log space. On N = 400 sites, the direct arithmetic mean fails to reproduce the long-domain
    Fig. S3C values by ~30% (5.57 um vs printed 8.2 and 7.8 um), whereas an unweighted
    2-parameter exponential fit A * exp(-l / L) to the 40-bin histogram P(l) including the
    l = 400 spike (matching the ~40 plotted bins of width 10 sites in Fig. S3C) yields
    ~2.03-2.15, ~8.00-8.27 (r = 0.5), ~3.70-3.85 (r = 1.0), and ~7.98-8.25, ~2.04-2.15 um
    (r = 2.0), matching all six printed numbers closely and accounting for the 0.4 um
    stochastic difference between the exact-symmetry pairs (l_alpha = 8.2 at r = 0.5 vs
    l_F = 7.8 at r = 2.0) through the ~0.22 um seed-to-seed standard deviation of the fit.
    Excluding the l = 400 spike drops the r = 2.0 fit to ~6.9-7.1 um (below both 7.8 and 8.2).
  citation: {page: 18, printed_page: "SI-6", quote: "with average domain lengths from exponential fits for fascin", where: "Fig. S3C caption"}

- id: q_figs3c_top_axis_scale_misprint
  kind: possible_error
