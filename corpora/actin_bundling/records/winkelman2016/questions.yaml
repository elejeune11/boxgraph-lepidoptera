    - cmp_tau_main_actinin_domains
  text: >
    Three additional omissions/typos appear in Fig. S5D-E (p. 21 PNG; caption p. 22) beyond the
    tau vs 1/k_off mismatch in q_figs5e_actinin_domains_tau_koff_mismatch: (1) Both single-
    exponential fit curves in Fig. S5E (alpha-actinin) plateau at substantial nonzero vertical
    offsets at t = 20-50 s (~0.05 for Control and ~0.08-0.10 for alpha-actinin domains, unlike
    Fig. S5D which decays to 0), indicating an unstated baseline offset y0 (or immobile fraction)
    in y(t) = y0 + A*exp(-k_off*t). With y0 ~= 0.08, the faster initial decay k_off = 0.251 s^-1
    (tau = 3.98 s) matches the plotted blue curve, reinforcing that printed tau = 4.9 sec is a
    misprint and that the main-text summary "~5 s" (p. 6) overlooks this ~4.0 s lifetime.
    (2) Protein concentrations for Fig. S5E (single-molecule TMR-alpha-actinin, unlabeled
    alpha-actinin, and Cy5-fascin) are never stated in the caption or Methods (only Fig. S5A
    gives concentrations for the Cy5-fascin experiment). (3) Fig. S5D Fascin domains inset prints
    "k_off = 0.198 s^1" (missing the minus sign in s^-1) and omits the "sec" unit on tau = 4.9
    and tau = 5.1.
  citation: {page: 22, printed_page: "SI-10", quote: "Single exponential fits of the fraction of single TMR-α-actinin", where: "Fig. S5E caption"}

- id: q_kmc_lattice_spacing_37nm_vs_em_35nm
  kind: choice
  about:
    - a_binding_site_spacing
    - d_transverse_repeat_EM
    - kmc_domain_length_exp_fit
    - kmc_domain_length_mean
    - kmc_infinite_lattice_limit
  text: >
    The cooperative kinetic lattice model fixes the axial binding-site spacing at a = 37 nm
    (p. 10, Fig. S3A p. 17, SI p. 27), whereas the paper's own negative-stain EM transverse-
    repeat measurements in Fig. 4G (p. 6 PNG; text p. 7) give "about 35 nm" (plotted bars ~32.5
    nm for alpha-actinin and ~34.5 nm for fascin). Using a = 35 nm instead of 37 nm uniformly
    scales all simulated domain lengths down by 5.4% (e.g., 3.73 -> 3.53 um at r = 1.0), shifting
    the fitted switching barrier epsilon. Note also that p. 7 ("a turn of F-actin") and Fig. 6B
    caption p. 9 ("a complete turn of the actin filament") describe the ~35-37 nm crossover repeat,
    which is one 180-deg helical half-pitch of two-stranded F-actin (a full 360-deg helical turn
    is ~72-74 nm).
  citation: {page: 7, printed_page: "2702", quote: "about 35 nm, corresponding to a turn of F-actin", where: "text / Fig. 4G"}

- id: q_sedimentation_protocol_gaps_and_fig1c_label
