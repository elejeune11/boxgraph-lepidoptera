    (d_figS5d_fascin_control_data) cleanly reproduce y0 = 0.002, k_off = 0.209 s^-1
    (tau = 4.79 s), R^2 = 0.998.
  citation: {page: 22, printed_page: "SI-10", quote: "Single exponential fits of the fraction of single TMR-α-actinin molecules bound", where: "Fig. S5E"}

