  text: >
    Digitizing the solid blue "Coop. model" curve in Fig. 3H (d_fig3h_coop_model) yields
    l_F = 0.98, 1.84, 2.13, 3.19, 4.07, 4.78, 5.40, and 5.87 um at r = 0.2, 0.4, 0.5, 0.8,
    1.0, 1.2, 1.4, and 1.55 (reading half-width ~0.11 um). Across the entire curve, the
    plotted line lies ~4-12% above kmc_domain_length_exp_fit (0.88, 1.64, 2.03, 3.06, 3.75,
    4.33, 5.12, and 5.70 um) and at r = 1.0 reads 4.07 +/- 0.12 um, exceeding Fig. S3C's own
    printed inset value l_F = 3.6 um by +0.47 um (+13%) despite Fig. S3C caption (p. 18)
    stating that Fig. 3H extracts domain lengths "in this manner". Notably, the ratio
    (mean ~1.08) closely matches the 40/37 = 1.081 misprint factor on Fig. S3C's top
    lattice-site axis (q_figs3c_top_axis_scale_misprint). The digitized Fig. 3H curve also
    decisively rules out the direct arithmetic mean described on SI p. 28
    (kmc_domain_length_mean gives 3.49 um at r = 1.0 and 4.76 um at r = 1.55). Against the
    digitized experimental data (d_fig3h_data), kmc_domain_length_exp_fit falls inside the
    printed SEM bars at 8 of 10 positive r points (missing r = 0.197 and r = 0.810), while
