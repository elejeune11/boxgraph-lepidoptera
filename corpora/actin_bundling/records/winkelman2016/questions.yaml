  text: >
    Exact pixel digitization of Fig. S5E (p. 21 PNG; caption p. 22) resolves the
    k_off = 0.251 s^-1 vs tau = 4.9 sec discrepancy (q_figs5e_actinin_domains_tau_koff_mismatch)
    in an unexpected direction and uncovers an R^2 contradiction plus a horizontal layer shift:
    (1) The entire plotted marker and fit-curve layer in Fig. S5E is shifted left by 24.5 px
    (~0.48 s) relative to the 0, 10, 20, 30, 40, 50 x-axis ticks, placing the initial t = 0
