  text: >
    Cross-record validation design for freedman2019 + winkelman2016: (1) Winkelman et al.'s (2016,
    Fig. S3B caption p. 18) constant-barrier KMC model explicitly excludes actin polymerization rate
    ("not part of the model") and predicts symmetric domain lengths l_F = l_alpha = 3.74 um (exp_fit)
    or 3.49 um (mean) at r = 1.0 regardless of actin concentration. Validating this rate-independent
    prediction via `kmc_domain_length_vs_actin` against Freedman et al.'s (2019, Fig. 4B) independent
    two-color TIRFM experiments (exact same labeled actin + labeled fascin + unlabeled alpha-actinin
    protocol, 150 nM each, r = 1.0) refutes Winkelman's model on both species (`not reproduced` across
    all 4 validations): even at 1.5 uM actin (46.99 +/- 3.62 nm/s), measured domains are shorter
    (fascin 2.64 +/- 0.20 um, alpha-actinin 2.21 +/- 0.15 um), and slowing polymerization at 0.75 uM
    actin (22.15 +/- 3.78 nm/s) triggers a 6.1x symmetry breaking (fascin 1.35 +/- 0.057 um vs
    alpha-actinin 8.29 +/- 0.15 um) that Winkelman's symmetric KMC structurally cannot capture.
    (2) Freedman's Fig. S4C (`figS4c_fascin_datum`, `figS4c_alpha_actinin_datum`, unlabeled actin +
    labeled alpha-actinin at 3 uM and 1.5 uM actin) was intentionally excluded from validations.yaml
    because Freedman et al. (p. 13 / SI-7 caption) explicitly warn that "it is harder to compare these
    results to Ref. (6) [Winkelman 2016], since the affinities of the crosslinkers to actin are
    different under these conditions" (note: Winkelman's KMC would also be refuted on Fig. S4C,
    3.74 um vs 1.83/1.81 um fascin and 1.62/2.48 um alpha-actinin).
    (3) Experimental growth-rate tension between papers at the same nominal 1.5 uM actin concentration:
    Freedman et al. (2019, Fig. 4 caption) measure 46.99 +/- 3.62 nm/s (~17.4 sub/s at 2.7 nm/sub),
    whereas Winkelman et al. (2016, Fig. S1A-B) measure 10 sub/s (~27 nm/s) for leading barbed ends
    at 1.5 uM actin.
  citation: {page: 18, printed_page: "SI-6", quote: "shown only for illustrative purposes and is not part of the", where: "Fig. S3B caption & cross-validation with freedman2019 Fig. 4B"}

