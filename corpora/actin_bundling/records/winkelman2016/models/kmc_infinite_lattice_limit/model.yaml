id: kmc_infinite_lattice_limit
name: exact analytical infinite-lattice domain length of the cooperative Markov chain
role: model
stated: {page: 28, printed_page: "SI-16", quote: "assume a simple model of cooperativity where both types of crosslinkers", where: "SI Cooperative kinetic model"}
equation: "l_F = a * (1 + r * exp(epsilon/(k_B*T))); l_alpha = a * (1 + (1/r) * exp(epsilon/(k_B*T)))"
inputs:
  r: {quantity: crosslinker_on_rate_ratio, unit: dimensionless}
  eps_kBT: {quantity: switching_barrier_kBT, unit: dimensionless}
  a: {quantity: binding_site_spacing, unit: nm}
outputs:
  l_F: {quantity: domain_length, unit: um}
  l_alpha: {quantity: domain_length, unit: um}
settings: {}
stochastic: false
reconstructed: "Exact analytical N -> infinity geometric mean run length of the paper's two-state Markov chain (pp. 10, 27-28); the paper only runs finite-lattice KMC at N = 400 while claiming N = 400 removes edge effects."
