id: trailing_barbed_end_relative_rate
name: relative elongation rate and fractional reduction of fascin-bundled trailing barbed ends (Fig. S1B)
role: processing
stated: {page: 14, printed_page: "SI-2", quote: "Trailing barbed ends bundled by fascin grow at 90% of non-bundled", where: "Fig. S1B caption"}
equation: "f_rel = 100 * v_trailing / v_leading; f_red = 100 * (v_leading - v_trailing) / v_leading"
inputs:
  v_leading: {quantity: filament_elongation_rate_subunits, unit: 1/s}
  v_trailing: {quantity: filament_elongation_rate_subunits, unit: 1/s}
outputs:
  f_rel: {quantity: relative_elongation_rate, unit: percent}
  f_red: {quantity: fractional_elongation_reduction, unit: percent}
settings: {}
from_words: true
stochastic: false
