id: filament_growth_speed
name: linear actin filament growth velocity from subunit addition rate (Fig. S3B caption)
role: processing
stated: {page: 18, printed_page: "SI-6", quote: "A preformed actin filament growing at 20 subunits/sec (~53 nm/sec)", where: "Fig. S3B caption"}
equation: "v = k_elong * d_sub"
inputs:
  k_elong: {quantity: filament_elongation_rate_subunits, unit: 1/s}
  d_sub: {quantity: actin_subunit_axial_rise, unit: nm}
outputs:
  v: {quantity: filament_elongation_speed, unit: nm/s}
settings: {}
from_words: true
stochastic: false
