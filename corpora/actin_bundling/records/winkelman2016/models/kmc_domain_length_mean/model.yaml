id: kmc_domain_length_mean
name: cooperative kinetic lattice model (KMC arithmetic mean repeat length, SI p. 28)
role: model
stated: {page: 28, printed_page: "SI-16", quote: "From these runs we compute the average repeat length of A’s and B’s", where: "SI Cooperative kinetic model"}
equation: "k_switch^B = k_on^B * exp(-epsilon/(k_B*T)); k_switch^A = k_on^A * exp(-epsilon/(k_B*T)); P_init(A) = k_on^A/(k_on^A + k_on^B); l_bar = mean(run_lengths) * a"
inputs:
  r: {quantity: crosslinker_on_rate_ratio, unit: dimensionless}
  eps_kBT: {quantity: switching_barrier_kBT, unit: dimensionless}
  a: {quantity: binding_site_spacing, unit: nm}
outputs:
  l_F: {quantity: domain_length, unit: um}
  l_alpha: {quantity: domain_length, unit: um}
settings:
  n_sites: 400
  n_sims: 5000
  seed: 0
from_words: true
stochastic: true
