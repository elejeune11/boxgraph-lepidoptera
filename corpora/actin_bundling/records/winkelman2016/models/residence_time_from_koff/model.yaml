role: processing
stated: {page: 22, printed_page: "SI-10", quote: "Single exponential fits of the fraction of single Cy5-fascin", where: "Fig. S5D-E caption"}
equation: "tau = 1 / k_off"
inputs:
  k_off: {quantity: crosslinker_off_rate, unit: 1/s}
outputs:
