id: kmc_domain_length_exp_fit
name: cooperative kinetic lattice model (KMC with exponential decay fit to P(l), Fig. S3C)
role: model
stated: {page: 18, printed_page: "SI-6", quote: "with average domain lengths from exponential fits for fascin", where: "Fig. S3C caption & SI pp. 27-28"}
equation: "k_switch^B = k_on^B * exp(-epsilon/(k_B*T)); k_switch^A = k_on^A * exp(-epsilon/(k_B*T)); P_init(A) = k_on^A/(k_on^A + k_on^B); P(l) = A * exp(-l / l_bar)"
inputs:
  r: {quantity: crosslinker_on_rate_ratio, unit: dimensionless}
  eps_kBT: {quantity: switching_barrier_kBT, unit: dimensionless}
  a: {quantity: binding_site_spacing, unit: nm}
outputs:
  l_F: {quantity: domain_length, unit: um}
  l_alpha: {quantity: domain_length, unit: um}
settings:
  n_sites: 400
  n_sims: 5000
  bin_width_sites: 10
  seed: 0
from_words: true
stochastic: true
