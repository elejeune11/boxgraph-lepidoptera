  outputs:
    l_F: l_F_inf_simple_50x
    l_alpha: l_alpha_inf_simple_50x

# ==========================================================================
# Cooperative vs simple mass-action run-length enhancement (~50x claim, p. 7)
# ==========================================================================

- id: run_ratio_coop_mean
  model: cooperativity_length_ratio
  inputs:
    l_coop: l_F_mean_coop_50x
    l_simple: l_F_mean_simple_50x
  outputs:
    R: R_coop_mean_calc

- id: run_ratio_coop_expfit_over_mean
  model: cooperativity_length_ratio
  inputs:
    l_coop: l_F_expfit_coop_50x
    l_simple: l_F_mean_simple_50x
  outputs:
    R: R_coop_expfit_over_mean_calc

- id: run_ratio_coop_inf
  model: cooperativity_length_ratio
  inputs:
    l_coop: l_F_inf_coop_50x
    l_simple: l_F_inf_simple_50x
  outputs:
    R: R_coop_inf_calc

# ==========================================================================
# Single-molecule residence times tau = 1 / k_off (Fig. S5D-E pp. 21-22)
# ==========================================================================

- id: run_tau_fascin_control
  model: residence_time_from_koff
  inputs:
    k_off: k_off_fascin_control
  outputs:
    tau: tau_fascin_control_calc

- id: run_tau_fascin_domains
  model: residence_time_from_koff
  inputs:
    k_off: k_off_fascin_domains
  outputs:
    tau: tau_fascin_domains_calc

- id: run_tau_actinin_control
  model: residence_time_from_koff
  inputs:
    k_off: k_off_actinin_control
  outputs:
    tau: tau_actinin_control_calc

- id: run_tau_actinin_domains
  model: residence_time_from_koff
  inputs:
    k_off: k_off_actinin_domains
  outputs:
    tau: tau_actinin_domains_calc

# ==========================================================================
# Illustrative filament growth speed (Fig. S3B caption p. 18) &
# Trailing barbed-end elongation rate reduction (Fig. S1B & Main Text p. 4)
# ==========================================================================

- id: run_filament_growth_S3B
  model: filament_growth_speed
  inputs:
    k_elong: k_elong_S3B_illustrative
    d_sub: d_actin_subunit_added
  outputs:
    v: v_elong_S3B_calc

- id: run_trailing_barbed_end_fascin
  model: trailing_barbed_end_relative_rate
  inputs:
    v_leading: v_elong_leading_S1B
    v_trailing: v_elong_trailing_fascin_S1B
  outputs:
    f_rel: f_rel_trailing_fascin_calc
    f_red: f_red_trailing_fascin_calc

