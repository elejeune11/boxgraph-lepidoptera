# ==========================================================================
# Reconstructed exact infinite-lattice asymptote (N -> infinity)
# ==========================================================================

- id: run_kmc_inf_r0p5
  model: kmc_infinite_lattice_limit
  inputs:
    r: r_S3C_0p5
    eps_kBT: eps_barrier_coop
    a: a_binding_site_spacing
  outputs:
    l_F: l_F_inf_r0p5
    l_alpha: l_alpha_inf_r0p5

- id: run_kmc_inf_r1p0
  model: kmc_infinite_lattice_limit
  inputs:
    r: r_S3C_1p0
    eps_kBT: eps_barrier_coop
    a: a_binding_site_spacing
  outputs:
    l_F: l_F_inf_r1p0
    l_alpha: l_alpha_inf_r1p0

- id: run_kmc_inf_r2p0
  model: kmc_infinite_lattice_limit
  inputs:
    r: r_S3C_2p0
    eps_kBT: eps_barrier_coop
    a: a_binding_site_spacing
  outputs:
    l_F: l_F_inf_r2p0
    l_alpha: l_alpha_inf_r2p0

- id: run_kmc_inf_coop_50x
  model: kmc_infinite_lattice_limit
  inputs:
