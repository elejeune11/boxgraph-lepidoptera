# ==========================================================================
# Virtual lattice bundle length and Fig. S3B rate ratios
# ==========================================================================

- id: run_bundle_length
  model: bundle_lattice_length
  inputs:
    N: N_lattice_sites
    a: a_binding_site_spacing
  outputs:
    L: L_bundle_calc

- id: run_r_S3B_top
  model: rate_ratio_r
  inputs:
    k_on_F: k_on_F_S3B_top
    k_on_alpha: k_on_alpha_S3B_top
  outputs:
    r: r_S3B_top_calc

- id: run_r_S3B_mid
  model: rate_ratio_r
  inputs:
    k_on_F: k_on_F_S3B_mid
    k_on_alpha: k_on_alpha_S3B_mid
  outputs:
    r: r_S3B_mid_calc

- id: run_r_S3B_bot
  model: rate_ratio_r
  inputs:
    k_on_F: k_on_F_S3B_bot
    k_on_alpha: k_on_alpha_S3B_bot
  outputs:
    r: r_S3B_bot_calc

# ==========================================================================
# Cooperative kinetic model — exponential-fit readout (Fig. S3C caption p. 18)
# ==========================================================================

- id: run_kmc_expfit_r0p5
  model: kmc_domain_length_exp_fit
  inputs:
    r: r_S3C_0p5
    eps_kBT: eps_barrier_coop
    a: a_binding_site_spacing
  settings: {n_sites: 400, n_sims: 5000, bin_width_sites: 10, seed: 0}
  replicates: 5
  outputs:
    l_F: l_F_expfit_r0p5
    l_alpha: l_alpha_expfit_r0p5

- id: run_kmc_expfit_r1p0
  model: kmc_domain_length_exp_fit
  inputs:
    r: r_S3C_1p0
    eps_kBT: eps_barrier_coop
    a: a_binding_site_spacing
  settings: {n_sites: 400, n_sims: 5000, bin_width_sites: 10, seed: 0}
  replicates: 5
  outputs:
    l_F: l_F_expfit_r1p0
    l_alpha: l_alpha_expfit_r1p0

- id: run_kmc_expfit_r2p0
  model: kmc_domain_length_exp_fit
  inputs:
    r: r_S3C_2p0
    eps_kBT: eps_barrier_coop
    a: a_binding_site_spacing
  settings: {n_sites: 400, n_sims: 5000, bin_width_sites: 10, seed: 0}
  replicates: 5
  outputs:
    l_F: l_F_expfit_r2p0
    l_alpha: l_alpha_expfit_r2p0

- id: run_kmc_expfit_coop_50x
  model: kmc_domain_length_exp_fit
  inputs:
    r: r_50x_eval_added
    eps_kBT: eps_barrier_coop
    a: a_binding_site_spacing
  settings: {n_sites: 400, n_sims: 5000, bin_width_sites: 10, seed: 0}
  replicates: 5
  outputs:
    l_F: l_F_expfit_coop_50x
    l_alpha: l_alpha_expfit_coop_50x

