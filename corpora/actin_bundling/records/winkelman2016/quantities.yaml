# ==========================================================================
# Structural, lattice, and geometric lengths
# ==========================================================================

- id: binding_site_count
  name: number of crosslinker binding sites along a two-filament bundle
  dimension: dimensionless
  description: Number of discrete virtual crosslinker binding sites N on the 1D bundle lattice in the cooperative kinetic model.

- id: binding_site_spacing
  name: crosslinker binding site spacing along F-actin
  dimension: "[length]"
  description: Axial spacing a between consecutive crosslinker binding sites along a two-filament bundle (~37 nm, one F-actin helical half-pitch).

- id: bundle_length
  name: two-filament actin bundle length
  dimension: "[length]"
  description: Total length L = N * a of the simulated two-filament actin bundle lattice.

- id: domain_length
  name: crosslinker domain length
  dimension: "[length]"
  description: Average continuous run length l_F (fascin) or l_alpha (alpha-actinin) of a single crosslinker type along a two-filament F-actin bundle.

- id: domain_length_ratio
  name: cooperative-to-simple domain length ratio
  dimension: dimensionless
  description: Ratio of average crosslinker domain length with cooperative switching barrier (epsilon > 0) to that predicted by simple mass-action competition (epsilon = 0).

- id: interfilament_spacing
  name: interfilament spacing within an F-actin bundle
  dimension: "[length]"
  description: Center-to-center or edge-to-edge separation distance between adjacent actin filaments in a fascin-, alpha-actinin-, fimbrin-, or espin-crosslinked bundle.

- id: transverse_repeat_distance
  name: crosslinker transverse repeat distance along a bundle
  dimension: "[length]"
  description: Axial distance between adjacent bound fascin or alpha-actinin crosslinkers along a two-filament F-actin bundle measured by negative-stain EM.

- id: transition_zone_length
  name: fascin-to-alpha-actinin domain transition zone length
  dimension: "[length]"
  description: Axial length L of the structural transition region where interfilament spacing widens from a fascin domain to an alpha-actinin domain in negative-stain EM.

- id: protein_molecular_size
  name: crosslinker physical size
  dimension: "[length]"
  description: "Physical diameter (globular compact crosslinkers: fascin, fimbrin) or end-to-end length (elongated dimer: alpha-actinin, or its spectrin-repeat rod)."

- id: actin_subunit_axial_rise
  name: F-actin axial rise per monomer
  dimension: "[length]"
  description: Helical axial increment per actin subunit along an F-actin filament (~2.7 nm).

- id: bundle_filament_count
  name: number of filaments in a multi-filament bundle
  dimension: dimensionless
  description: Number of F-actin filaments comprising a multi-filament bundle at steady state.

# ==========================================================================
# Kinetic rates, ratios, dwell times, and energetic barrier
# ==========================================================================

- id: crosslinker_on_rate
  name: crosslinker addition rate to a like-type bundle
  dimension: "1/[time]"
  description: Effective first-order rate k_on^A or k_on^B at which a crosslinker adds to the next open lattice site when the preceding site is occupied by the same crosslinker type.

- id: crosslinker_on_rate_ratio
  name: fascin to alpha-actinin on-rate ratio
  dimension: dimensionless
  description: Dimensionless ratio r = k_on^Fascin / k_on^alpha-Actinin controlling relative crosslinker addition rates (approximated by [Fascin]/[alpha-Actinin]).

- id: switching_barrier_kBT
  name: cooperative switching energetic barrier in units of k_B T
  dimension: dimensionless
  description: Dimensionless energetic penalty epsilon / (k_B T) slowing addition of a heterologous crosslinker by factor exp(-epsilon / (k_B T)).

- id: crosslinker_off_rate
  name: single-molecule crosslinker dissociation rate
  dimension: "1/[time]"
  description: First-order off-rate k_off obtained from single-exponential fits of single-molecule dwell-time survival curves on two-filament F-actin bundles.

- id: crosslinker_residence_time
  name: single-molecule crosslinker residence time
  dimension: "[time]"
  description: Mean single-molecule bound lifetime tau = 1 / k_off of fascin or alpha-actinin on two-filament F-actin bundles.

- id: filament_elongation_rate_subunits
  name: actin filament barbed-end elongation rate in subunits per second
  dimension: "1/[time]"
  description: Rate of actin monomer addition at a filament barbed end in subunits/s.

- id: filament_elongation_speed
  name: actin filament barbed-end linear growth speed
  dimension: "[length]/[time]"
  description: Linear extension velocity of a growing actin filament barbed end in nm/s.

- id: relative_elongation_rate
  name: relative trailing barbed-end elongation rate
  dimension: dimensionless
  description: Ratio of trailing-filament barbed-end elongation rate in a bundle to the unbundled leading barbed-end elongation rate.

- id: fractional_elongation_reduction
  name: fractional reduction in trailing barbed-end elongation rate
  dimension: dimensionless
  description: Fractional decrease (v_leading - v_trailing) / v_leading in trailing barbed-end elongation rate upon bundling.

# ==========================================================================
# Equilibrium binding, cooperativity, concentration, and sorting metrics
# ==========================================================================

- id: bundling_dissociation_constant
  name: apparent F-actin bundling dissociation constant K_D
  dimension: "[substance]/[length]**3"
  description: Apparent half-maximal concentration K_D from cooperative Hill fits of low-speed F-actin bundling sedimentation assays.

- id: hill_coefficient
  name: F-actin bundling Hill coefficient
  dimension: dimensionless
  description: Cooperativity exponent n_H from Hill fits of low-speed F-actin bundling sedimentation assays.

- id: bundling_threshold_concentration
  name: critical bundler concentration threshold for stable bundling
  dimension: "[substance]/[length]**3"
  description: Minimum bundler concentration required to form stable two-filament F-actin bundles in TIRFM assays.

- id: competition_ic50
  name: half-maximal inhibitory concentration IC50 for crosslinker competition
  dimension: "[substance]/[length]**3"
  description: Competitor concentration (TMR-fimbrin) reducing bound Cy5-fascin fluorescence on parallel two-filament bundles by 50%.

- id: bundler_enrichment_fold
  name: crosslinker domain enrichment ratio
  dimension: dimensionless
  description: Fold enrichment of a secondary compact bundler (fimbrin) on fascin domains relative to parallel alpha-actinin domains.

# ==========================================================================
# Condition quantities (for metadata in data.yaml)
# ==========================================================================

- id: actin_concentration
  name: actin monomer concentration
  dimension: "[substance]/[length]**3"
  description: Total Mg-ATP-actin concentration in an experimental assay.

- id: fascin_concentration
  name: fascin concentration
  dimension: "[substance]/[length]**3"
  description: Fascin concentration in an experimental assay.

- id: alpha_actinin_concentration
  name: alpha-actinin dimer concentration
  dimension: "[substance]/[length]**3"
  description: Alpha-actinin homodimer concentration in an experimental assay.

- id: temperature
  name: experimental temperature
  dimension: "[temperature]"
  description: Reaction temperature in an experimental assay.

# ==========================================================================
# Quantities for digitized figures (Figs. 1-5 and Figs. S1-S6)
# ==========================================================================

- id: free_fascin_concentration
  name: free (unbound) fascin concentration
  dimension: "[substance]/[length]**3"
  description: Free fascin concentration remaining in supernatant in low-speed F-actin sedimentation assays (Fig. 1B).

- id: free_alpha_actinin_concentration
  name: free (unbound) alpha-actinin dimer concentration
  dimension: "[substance]/[length]**3"
  description: Free alpha-actinin homodimer concentration remaining in supernatant in low-speed F-actin sedimentation assays (Fig. 1C).

- id: bound_bundler_per_actin
  name: molar ratio of bound crosslinker to F-actin
  dimension: dimensionless
  description: Stoichiometric molar ratio of sedimented fascin or alpha-actinin per F-actin monomer in low-speed sedimentation assays (Fig. 1B-C).

- id: time
  name: elapsed time
  dimension: "[time]"
  description: Elapsed time during TIRFM bundle assembly (Fig. 1E) or single-molecule residence-time survival curves (Fig. S5D-E).

- id: normalized_fluorescence_intensity
  name: normalized fluorescence intensity
  dimension: dimensionless
  description: Normalized fluorescence intensity in arbitrary units (typically scaled to 0-1; Figs. 1E, 5H, S6B).

- id: relative_fluorescence_intensity
  name: relative fluorescence intensity ratio
  dimension: dimensionless
  description: Ratio of Cy5-fascin to Oregon green-actin fluorescence intensity in biomimetic bead networks (Fig. 2E-F).

- id: fluorescence_ratio
  name: crosslinker fluorescence ratio
  dimension: dimensionless
  description: Ratio of Cy5-fascin to TMR-alpha-actinin fluorescence intensity in comet tails vs protrusions (Fig. 2G).

- id: fluorescence_intensity
  name: fluorescence intensity in arbitrary units
  dimension: dimensionless
  description: Raw or background-subtracted fluorescence intensity in arbitrary units (Figs. 4B, 4D, S4C, S4D).

- id: normalized_pellet_protein
  name: normalized protein fraction in low-speed pellet
  dimension: dimensionless
  description: Normalized amount of fascin or alpha-actinin sedimented in low-speed F-actin bundle pellets (Fig. 2A).

- id: condition_index
  name: categorical experimental condition index
  dimension: dimensionless
  description: 1-based integer index identifying discrete experimental conditions or bundle categories in bar charts (specified in each reading's description).

- id: linear_fluorescence_density
  name: linear crosslinker fluorescence intensity per micrometer of F-actin
  dimension: "1/[length]"
  description: Fluorescence intensity of bound TMR-fascin per unit bundle length (a.u./um; Fig. 3I).

- id: transverse_distance
  name: transverse distance perpendicular to a two-filament bundle
  dimension: "[length]"
  description: Spatial coordinate along a normal line scan perpendicular to a two-filament actin bundle (Fig. 4B, 4D).

- id: linear_molecule_density
  name: bound crosslinker molecules per micrometer of F-actin
  dimension: "1/[length]"
  description: Number of bound fimbrin or espin molecules per micrometer of single or bundled F-actin (Fig. 5C, 5E).

- id: espin_concentration
  name: SNAP-647-espin-2B concentration
  dimension: "[substance]/[length]**3"
  description: Concentration of SNAP-647-espin-2B in three-color TIRFM competition assays (Fig. 5F).

- id: fascin_domain_length_fraction
  name: fascin domain length fraction of total two-filament bundle length
  dimension: dimensionless
  description: Ratio of total TMR-fascin domain length to total two-filament parallel bundle length (Fig. 5F).

- id: tropomyosin_concentration
  name: skeletal muscle alpha/beta-tropomyosin concentration
  dimension: "[substance]/[length]**3"
  description: Concentration of skeletal muscle alpha/beta-tropomyosin in high-speed co-sedimentation competition assays (Fig. 5I).

- id: bound_bundler_fraction
  name: fraction of total bundler bound to F-actin in pellet
  dimension: dimensionless
  description: Fraction of total fascin or alpha-actinin remaining in the high-speed F-actin pellet as a function of tropomyosin concentration (Fig. 5I).

- id: domain_count
  name: count of measured fascin domains per length bin
  dimension: dimensionless
  description: Number of observed TMR-fascin domains falling within each length histogram bin (Fig. S2E).

- id: complementary_cumulative_frequency
  name: complementary cumulative frequency (1 - CDF) of domain lengths
  dimension: dimensionless
  description: Survival function (1 - cumulative frequency) of TMR-fascin domain lengths fitted to single-exponential decay (Fig. S2F).

- id: domain_length_probability
  name: probability density/mass P(l) of crosslinker domain lengths
  dimension: dimensionless
  description: Simulated probability P(l) of observing a fascin or alpha-actinin domain of length l in the 400-site KMC lattice model (Fig. S3C).

- id: single_molecule_binding_frequency
  name: single-molecule crosslinker binding event frequency per unit bundle length
  dimension: "1/([length]*[time])"
  description: Rate of detectable single-molecule Cy5-fascin binding events per minute per micrometer of F-actin (Fig. S5C).

- id: bound_molecule_fraction
  name: fraction of single crosslinker molecules remaining bound
  dimension: dimensionless
  description: Survival fraction of single Cy5-fascin or TMR-alpha-actinin molecules remaining bound on two-filament bundles as a function of dwell time (Fig. S5D-E).

- id: fimbrin_concentration
  name: TMR-fimbrin concentration
  dimension: "[substance]/[length]**3"
  description: Concentration of competitor TMR-fimbrin in two-filament bundle fascin-displacement assays (Fig. S6B).

