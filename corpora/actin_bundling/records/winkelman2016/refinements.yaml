- id: ref_kmc_expfit_nsims
  run: run_kmc_expfit_r1p0
  setting: n_sims
  factors: [1, 2, 4, 8]
  mode: multiply
  output: l_F
  tolerance: "2%"
  tolerance_basis: "added: tighter than the ~3% rounding half-width (0.05/3.6 = 1.4%) and Monte Carlo jitter of 1-decimal-place Fig. S3C domain lengths"
  tolerance_added: true

- id: ref_kmc_expfit_nsites
  run: run_kmc_expfit_r1p0
  setting: n_sites
  factors: [1, 2, 4, 8]
  mode: multiply
  output: l_F
  tolerance: "2%"
  tolerance_basis: "added: tests SI p. 27's explicit claim that N = 400 sites was 'long enough to remove edge effects' against the 1-decimal-place precision of Fig. S3C (0.05/3.6 = 1.4%)"
  tolerance_added: true

- id: ref_kmc_expfit_binwidth
  run: run_kmc_expfit_r1p0
  setting: bin_width_sites
  factors: [1, 2, 5, 10]
  mode: divide
  output: l_F
  tolerance: "2%"
  tolerance_basis: "added: verifies insensitivity of the exponential-decay fit to histogram bin width from 10 sites (40 bins as in Fig. S3C) down to 1 site (unbinned discrete sites)"
  tolerance_added: true

- id: ref_kmc_mean_nsims
  run: run_kmc_mean_r1p0
  setting: n_sims
  factors: [1, 2, 4, 8]
  mode: multiply
  output: l_F
  tolerance: "1%"
  tolerance_basis: "added: below the 1-decimal-place printed precision of Fig. S3C domain lengths (0.05/3.6 = 1.4%) to confirm Monte Carlo sample convergence"
  tolerance_added: true

- id: ref_kmc_mean_nsites
  run: run_kmc_mean_r1p0
  setting: n_sites
  factors: [1, 2, 4, 8]
  mode: multiply
  output: l_F
  tolerance: "2%"
  tolerance_basis: "added: directly tests SI p. 27's claim that N = 400 virtual binding sites removes finite-bundle edge effects"
  tolerance_added: true
