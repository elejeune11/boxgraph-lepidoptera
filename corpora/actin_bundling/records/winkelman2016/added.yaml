- id: d_actin_subunit_added
  quantity: actin_subunit_axial_rise
  unit: nm
  printed: "2.7"
  basis: >
    Fig. S3B caption (p. 18) converts an illustrative actin filament elongation rate of
    20 subunits/sec to (~53 nm/sec) without stating the axial rise per actin monomer.
    The canonical F-actin axial rise per monomer is 2.7 nm (20 * 2.7 = 54 nm/s); alternative
    values reflect dividing the paper's 37 nm helical half-pitch by 14 subunits (2.643 nm ->
    52.86 nm/s ~= 53 nm/s), the exact ratio 53/20 = 2.65 nm, or the often-quoted 2.75 nm
    (55 nm/s).
  alternatives: ["2.643", "2.65", "2.75"]
  stands_for: "axial rise per actin subunit in Fig. S3B caption conversion (20 subunits/sec -> ~53 nm/sec)"

- id: r_50x_eval_added
  quantity: crosslinker_on_rate_ratio
  unit: dimensionless
  printed: "1.0"
  basis: >
    Main Text p. 7 (2702) states that alpha-actinin-4 and fascin 1 both bind in exclusive
    runs that are ~50x longer than predicted by simple mass-action competition simulations
    (Fig. 3H), without naming a specific concentration ratio r = [Fascin]/[alpha-Actinin].
    Choosing r = 1.0 corresponds to the symmetric equimolar point where both crosslinkers
    have equal run lengths; alternatives span the Fig. S3B-C and Fig. 3H range (0.5, 1.6, 2.0).
  alternatives: ["0.5", "1.6", "2.0"]
  stands_for: "concentration/on-rate ratio r at which the ~50x cooperative-vs-simple run-length ratio on p. 7 is evaluated"
