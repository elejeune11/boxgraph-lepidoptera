notes: >
  Full quantitative reading of Winkelman et al. (2016), Current Biology 26, 2697-2706
  (PDF pages 1-11: Graphical Abstract/Highlights cover + journal pp. 2697-2706) together
  with its merged Supplemental Information (PDF pages 12-29: SI cover, Figures S1-S6 with
  captions, Supplemental Experimental Procedures, and Supplemental References S1-S8).

  In scope (models, inputs, derived/predicted results, key measurements, and comparisons):
  - Cooperative kinetic lattice model of fascin / alpha-actinin segregation on two-filament
    bundles (Main Text p. 10 / 2705, Fig. 3H p. 5, Fig. S3 pp. 17-18, SI pp. 27-28):
    1. Virtual bundle length L = N * a = 400 * 37 nm = 14.8 um vs printed ~15 um (pp. 10, 27).
    2. On-rate ratio r = k_on^Fascin / k_on^alpha-Actinin evaluated for the three Fig. S3B
       parameter pairs (0.75/1.5 = 0.5, 1.5/1.5 = 1.0, 1.5/0.75 = 2.0) vs Fig. S3C legend.
    3. Finite-lattice kinetic Monte Carlo (KMC) model on N = 400 sites (a = 37 nm, n_sims =
       5000, first two sites initialized identically with probability r/(r+1) for fascin and
       1/(r+1) for alpha-actinin, heterologous switching rates slowed by exp(-epsilon / k_B T)
       with epsilon = 4.8 k_B T). Because the paper states two distinct domain-length readouts—
       an exponential decay fit to P(l) in Fig. S3C caption (p. 18) and the arithmetic mean
       repeat length on SI p. 28—both readouts are implemented as separate models
       (`kmc_domain_length_exp_fit` and `kmc_domain_length_mean`) and compared against all six
       Fig. S3C printed domain lengths (r = 0.5: l_F = 2.1, l_alpha = 8.2 um; r = 1.0: l_F =
       3.6, l_alpha = 3.7 um; r = 2.0: l_F = 7.8, l_alpha = 2.1 um). The exponential-fit readout
       reproduces or comes close to all six values (and matches the 0.4 um stochastic asymmetry
       between symmetric pairs 8.2 vs 7.8 um), whereas the direct arithmetic mean on N = 400
       sites severely underpredicts the minority-switch cases (5.57 um vs 8.2 and 7.8 um).
    4. Finite-size convergence (`refinements.yaml` over n_sites = 400, 800, 1600, 3200) and a
       reconstructed infinite-lattice Markov-chain limit (`kmc_infinite_lattice_limit`:
       l_F = a*(1 + r*exp(eps/k_B T)), yielding 2.285, 4.533, 9.029 um) show that N = 400 sites
       exhibits 18-38% finite-size truncation bias, directly refuting SI p. 27's claim that
       400 sites was "long enough to remove edge effects".
    5. Cooperative-to-simple mass-action domain-length enhancement ratio (`cooperativity_length_ratio`,
       eps = 4.8 vs eps = 0) compared against the main-text claim "~50x longer" (p. 7 / 2702).
  - Single-molecule residence time vs off-rate consistency (`residence_time_from_koff`, tau =
    1 / k_off, Fig. S5D-E pp. 21-22): reproduces Fascin Control (0.203 s^-1 -> 4.93 vs 4.9 s),
    Fascin domains (0.198 s^-1 -> 5.05 vs 5.1 s), and alpha-Actinin Control (0.217 s^-1 -> 4.61
    vs 4.6 s), but exposes an internal inconsistency for alpha-Actinin domains (k_off = 0.251
    s^-1 gives 3.98 s, NOT the printed tau = 4.9 sec; 23% / 0.92 s error).
  - Illustrative filament growth speed (`filament_growth_speed`, Fig. S3B caption p. 18):
    20 subunits/sec * d_sub vs printed ~53 nm/sec (with added canonical actin axial rise
    2.7 nm -> 54 nm/s, and alternatives 2.643 nm = 37/14 nm -> 52.9 nm/s, 2.65 nm -> 53.0 nm/s,
    2.75 nm -> 55.0 nm/s).
  - Trailing barbed-end elongation reduction (`trailing_barbed_end_relative_rate`, Main Text
    p. 4 and Fig. S1 pp. 13-14): 9 sub/s vs 10 sub/s reproduces printed 90% and ~10% reduction.
  - Core measured, fitted, and literature-reported biophysical values recorded in `data.yaml`:
    low-speed sedimentation Hill fits (fascin K_D = 272 nM, n_H = 2.3; alpha-actinin K_D = 290
    nM, n_H = 2.5, Fig. 1B-C), TIRFM critical bundling threshold (~25-50 nM, p. 3), TIRFM
    subdiffraction interfilament spacing (~5 nm fascin, ~25 nm alpha-actinin; example Gaussian
    fits 6 nm and 37 nm, Fig. 4B/D/E), negative-stain EM interfilament spacing (~8 nm fascin,
    ~32 nm alpha-actinin, Fig. 4H), EM transverse repeat (~35 nm, Fig. 4G), EM transition zone
    length (L = 142 +/- 52 nm, Fig. 4F), fimbrin enrichment on fascin vs alpha-actinin bundles
    (6-fold, p. 7), fimbrin-fascin competition IC50 = 47.4 nM (Fig. S6B), structural dimensions
    (fascin 5-6 nm, alpha-actinin dimer 35 nm / spectrin rod ~25 nm, fimbrin core 6-8 nm), and
    cited multi-filament bundle values (~20-30 filaments hexagonal fascin bundles [ref-32],
    30 nm square-lattice alpha-actinin bundles [ref-33 / pelletier2003]).

  Left out of data.yaml and models/ (experimental protocol details, protein expression/purification
  buffers, centrifugation/labeling/optics parameters, residue boundaries, and qualitative numbers
  feeding no model):
  - Protein domain residue ranges in Fig. 1A (fascin 1-138, 259, 383, 493; alpha-actinin 1, 250,
    285, 406, 518, 632, 767), PDB IDs (3P53, 1SJJ), cloning restriction sites/vectors (pET21a,
    ProEX HTA), IPTG induction (0.5 mM, 16 h at 16 degC), lysate spins (30,000g, 50,000g),
    column elution gradients (300-700 mM NaCl), dye DMF stocks (10 mM TMR, 1 mM Cy5, 3-5x molar
    excess, 4 degC overnight, 3x 500 mL dialysis), buffer recipes (10 mM imidazole pH 7.0, 50 mM
    KCl, 1 mM MgCl2, 1 mM EGTA, 0.5 mM DTT, 0.2 mM ATP, 50/90 uM CaCl2, 15 mM glucose, 20 ug/mL
    catalase, 100 ug/mL glucose oxidase, 0.5% 400 cP methylcellulose at 25 degC; see question on
    SI p. 26 Bead motility buffer unit misprints), glass passivation (acetone 30 min, 95% ethanol
    10 min, 2% Hellmanex III 2 h, piranha 1-2 h, 1 mg/mL 5000 MW mPEG-Silane 18 h), SDS-PAGE
    (12.5%, 20 min stain, 16 h destain), TIRFM/confocal/EM optics (488/491/561/638/642 nm lasers,
    50 ms exposure, 10 frames/s, <100 nm pixel, 100 nm TetraSpeck beads ~20/field, 100x oil
    objective, 1 um z-step, 2 um carboxylate microspheres 2.6% solids, 120 kV TEM, 400 mesh
    grids, 1% uranyl acetate), and individual fit R^2 / R thresholds (Fig. S2F R > 0.97; Fig.
    S5D-E R^2 = 0.997-0.998; noted in data.yaml notes).

