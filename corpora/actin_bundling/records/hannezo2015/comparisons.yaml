# ==============================================================================
# 3. SI Section 2.6.4 Parameter Inversion & Consistency Checks (SI p. 15)
# ==============================================================================
- id: cmp_lh_inv_si
  purpose: reproduction
  computed: lh_inv_from_d_si
  printed: lh_inverted_si
  note: "Checks inverted hydrodynamic length (d/(2*pi))^2/sqrt(D*tau) = 8.18e-9 m against printed 10^-8 m (bare power of ten, SI p. 15)."

- id: cmp_alpha_si_from_printed_L
  purpose: reproduction
  computed: alpha_si_from_printed_L
  printed: alpha_estimated_si
  note: "Checks alpha = l/L = 10^-5 m / 10^-8 m = 1000 against printed alpha = 5 x 10^2 (500) on SI p. 15 (off by factor of 2!)."

- id: cmp_alpha_si_chained
  purpose: reproduction
  computed: alpha_si_chained
  printed: alpha_estimated_si
  note: "Chained check alpha = l/L_inv = 10^-5 m / 8.18e-9 m = 1223 against printed alpha = 5 x 10^2 (500) on SI p. 15."

- id: cmp_phi_si_from_printed_L
  purpose: reproduction
  computed: phi_si_from_printed_L
  printed: phi_estimated_si
  note: "Checks phi = (L/l_t)^2 = (10^-8 m / 0.8 um)^2 = 1.56e-4 against printed phi = 10^-3 (bare power of ten, SI p. 15)."

- id: cmp_phi_si_chained
  purpose: reproduction
  computed: phi_si_chained
  printed: phi_estimated_si
  note: "Chained check phi = (L_inv/l_t)^2 = 1.11e-4 against printed phi = 10^-3 (SI p. 15)."

- id: cmp_chi_c_order_si
  purpose: reproduction
  computed: chi_c_si_order_computed
  printed: chi_c_order_si
  note: "Checks Eq. (10) (1 + sqrt(10^-3))^2 = 1.064 against printed chi_c ~ 1 (SI p. 15)."

- id: cmp_xi_3d_si
  purpose: reproduction
  computed: xi_3d_si_computed
  printed: friction_3d_estimated_si
  note: "Checks xi = (rho_0*chi)/(D*chi_c) = 10^3 / (0.04e-12 * 1) = 2.5e16 Pa*s/m^2 against printed xi ~ 10^17 Pa*m^-2*s (SI p. 15)."

- id: cmp_xi_3d_si_chained
  purpose: reproduction
  computed: xi_3d_si_chained
  printed: friction_3d_estimated_si
  note: "Chained check xi = 10^3 / (0.04e-12 * (1 + sqrt(10^-3))^2) = 2.35e16 Pa*s/m^2 against printed xi ~ 10^17 Pa*m^-2*s (SI p. 15)."

