# ==============================================================================
# 1. Main Text Reproductions (pp. 2-3): l_t, l_h, lambda_c
# ==============================================================================
- id: cmp_lt_main
  purpose: reproduction
  computed: lt_from_frap
  printed: lt_derived_main
  note: "Checks l_t = sqrt(D*tau) = 0.775 um against printed l_t ≈ 0.8 ± 0.5 um (p. 3)."

- id: cmp_lh_main_3d
  purpose: reproduction
  computed: lh_from_lit_3d
  printed: lh_derived_main
  note: "Checks l_h = sqrt(eta_3D*h/xi) = 0.100 um against printed l_h ≈ 0.1 um (p. 3)."

- id: cmp_lh_main_chained
  purpose: reproduction
  computed: lh_from_lit_chained
  printed: lh_derived_main
  note: "Chained check l_h = sqrt(eta/xi) via eta = eta_3D*h against printed l_h ≈ 0.1 um (p. 3)."

- id: cmp_lambda_c_main_from_printed_lengths
  purpose: reproduction
  computed: lambda_c_main_from_printed_lengths
  printed: lambda_c_predicted_main
  note: "Checks lambda_c = 2*pi*sqrt(l_t*l_h) using the printed rounded l_t = 0.8 um and l_h = 0.1 um (gives 1.777 um vs printed 1.8 um)."

- id: cmp_lambda_c_main_chained
  purpose: reproduction
  computed: lambda_c_main_chained
  printed: lambda_c_predicted_main
  note: "Chained Eq. [3] evaluation directly from D = 0.04 um^2/s, tau = 15 s, eta_3D = 10^2 Pa*s, h = 100 nm, xi = 10^9 Pa*s/m (gives 1.749 um vs printed 1.8 um)."

- id: cmp_lambda_c_val_embryo
  purpose: validation
  computed: lambda_c_main_chained
  printed: ring_wavelength_embryo_wt
  conditions_ok: "Model predicts embryonic stage 16 ring spacing using stage 15 FRAP parameters and literature viscosity/friction estimates."
  note: "Main text p. 3 notes lambda_c = 1.8 um is slightly larger than, though same order of magnitude as, embryonic 0.5 ± 0.1 um."

- id: cmp_lambda_c_val_larva
  purpose: validation
  computed: lambda_c_main_chained
  printed: ring_wavelength_larva_wt_early
  conditions_ok: "Main text p. 3 compares the threshold estimate lambda_c = 1.8 um against both embryonic and larval tracheal ring spacings."

