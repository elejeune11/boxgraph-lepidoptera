- id: ramp_noise_amplitude_added
  quantity: dimensionless_density
  unit: dimensionless
  printed: "0.0001"
  basis: >
    SI Section 2.6.5 (p. 21) states 'Starting from an homogeneous concentration of actin
    randomly perturbed' without specifying the perturbation amplitude. Because phi = 0.0014 < 1/4
    is subcritical, larger initial noise triggers premature nucleation on lower-wavenumber
    subcritical branches.
  alternatives: ["0.01", "0.05"]
  stands_for: "initial random perturbation amplitude delta_rho in SI Section 2.6.5"

- id: ramp_total_duration_added
  quantity: time
  unit: s
  printed: "3000"
  basis: >
    SI Fig. S13 (p. 22) plots S(t) up to t = 3000 s after the 1875 s linear ramp of chi,
    though the text of Section 2.6.5 does not state the exact stop time used to evaluate
    steady-state ring counts.
  alternatives: ["2200", "4500"]
  stands_for: "total integration time t_total in SI Section 2.6.5"

- id: chaos_noise_amplitude_added
  quantity: dimensionless_density
  unit: dimensionless
  printed: "0.05"
  basis: >
    SI Section 2.2 (p. 11) initializes Eq. (6) from 'a randomly perturbed initial data'
    without reporting the perturbation amplitude.
  alternatives: ["0.01", "0.1"]
  stands_for: "initial perturbation amplitude in SI Section 2.2 chaos simulations"

- id: chaos_horizon_added
  quantity: dimensionless_time
  unit: dimensionless
  printed: "200"
  basis: >
    SI Figs. S6-S8 (pp. 12-14) plot chaotic density and peak-dislocation dynamics over
    t in [0, 200]; the phase-diagram classification horizon T = 5000 (p. 12) is replaced by
    t = 200 here for fast validation runs.
  alternatives: ["100", "400"]
  stands_for: "simulation horizon matching SI Figs. S6-S8"

- id: chaos_stationary_xi_added
  quantity: dimensionless_friction_chaos
  unit: dimensionless
  printed: "0.1"
  basis: >
    Representative friction inside the stationary-pattern phase of SI Fig. S5 (p. 12) at
    chi*rho_0 = 4, epsilon = 0.1, chosen to verify the transition from chaos (xi = 0.001)
    to stationary rings.
  alternatives: ["0.05", "0.2"]
  stands_for: "xi in the stationary-pattern phase of SI Fig. S5"

- id: bif_probe_eps_added
  quantity: dimensionless_density
  unit: dimensionless
  printed: "0.002"
  basis: >
    Small mode amplitude epsilon used in reconstructed steady-state Eq. (8) continuation to
    numerically extract the pitchfork curvature chi^(2) = 2*(chi(eps) - chi^(0))/eps^2.
  alternatives: ["0.001", "0.005"]
  stands_for: "asymptotic amplitude epsilon in SI Section 2.6.2"

- id: frap_probe_time_added
  quantity: time
  unit: s
  printed: "15"
  basis: >
    Representative post-bleach elapsed time t = 15 s (one turnover time, within the 0-100 s
    FRAP window of Main Fig. 2A) to exercise the moment-recovery model Eq. (14).
  alternatives: ["30", "60"]
  stands_for: "elapsed post-bleach time t in SI Eq. (14)"

- id: frap_initial_variance_added
  quantity: frap_variance
  unit: um^2
  printed: "0"
  basis: >
    Initial rescaled second moment M_2(0)/M_0(0) of the bleached region in SI Section 2.6.4
    (p. 20); Main Fig. 2A (Bottom Right) linear fit intersects near 0 um^2 at t = 0.
  alternatives: ["0.5", "1.0"]
  stands_for: "M_2(0)/M_0(0) in SI Section 2.6.4"

- id: probe_binding_ratio_K_added
  quantity: equilibrium_binding_ratio
  unit: dimensionless
  printed: "2"
  basis: >
    Unstated myosin-actin equilibrium constant K = k_on/k_off in SI Section 2.1 (p. 9);
    chosen away from 1 so the printed (D_m/(1+K), K*k_d/(1+K)) and algebraically corrected
    (K*D_m/(1+K), k_d/(1+K)) reductions are distinguished.
  alternatives: ["0.5", "5"]
  stands_for: "K = k_on/k_off in SI Section 2.1"

- id: probe_motor_diffusivity_added
  quantity: diffusion_coefficient
  unit: um^2/s
  printed: "0.08"
  basis: >
    Unstated myosin motor diffusivity D_m in SI Eq. (1)-(2) (p. 9), chosen of the same order
    as the measured cortical diffusivity D = 0.04 um^2/s.
  alternatives: ["0.04", "0.2"]
  stands_for: "D_m in SI Eq. (1)-(2)"

- id: probe_kd_added
  quantity: depolymerization_rate
  unit: 1/s
  printed: "0.1"
  basis: >
    Unstated actin depolymerization rate k_d in SI Eq. (1)-(2) (p. 9), chosen of the same
    order as 1/tau = 0.067 s^-1.
  alternatives: ["0.05", "0.2"]
  stands_for: "k_d in SI Eq. (1)-(2)"

- id: probe_alpha_xi0_added
  quantity: rescaled_cell_size
  unit: dimensionless
  printed: "1"
  basis: >
    In the zero-friction limit (SI Section 2.5, Fig. S9, p. 16), only the product alpha^2*phi
    enters chi/phi; setting alpha = 1 separates the variables to exercise the printed formulas
    on p. 15.
  alternatives: ["0.5", "2"]
  stands_for: "alpha in SI Section 2.5 formulas"

- id: probe_phi_xi0_added
  quantity: rescaled_turnover
  unit: dimensionless
  printed: "10"
  basis: >
    With alpha = 1, phi = 10 matches the captioned product alpha^2*phi = 10 of Fig. S9 (p. 16);
    alternative 100 matches the plotted bifurcation abscissae (chi/phi ~ 1.1, 1.4, 1.9, 2.6)
    which correspond to alpha^2*phi = 100 (alpha*sqrt(phi) = 10).
  alternatives: ["100", "2.5"]
  stands_for: "phi in SI Section 2.5 formulas (with alpha = 1)"

- id: probe_mode_i1_added
  quantity: mode_index
  unit: dimensionless
  printed: "1"
  basis: >
    First unstable cosine mode i = 1 (the sole linearly stable branch in SI Section 2.5,
    Fig. S9, p. 15-16); alternatives i = 2, 3 probe higher unstable branches shown in Fig. S9.
  alternatives: ["2", "3"]
  stands_for: "mode index i in SI Section 2.5"

- id: probe_x_kernel_added
  quantity: spatial_coordinate
  unit: um
  printed: "4.9"
  basis: >
    Position x = 4.9 um (one hydrodynamic length L = 0.1 um inside the clamped boundary x = l/2 = 5 um
    for l = 10 um) chosen to evaluate the non-local force-balance velocity kernel Phi(x, y) in SI Eq. (6)
    (p. 10), where the printed minus sign yields an O(0.4-1.0 um/s) spurious uniform-gel velocity and
    violates v(l/2) = 0.
  alternatives: ["4.5", "5.0"]
  stands_for: "axial evaluation coordinate x in SI Eq. (6)"

- id: probe_active_stress_2d_added
  quantity: active_stress_2d
  unit: Pa*m
  printed: "10^-4"
  basis: >
    Representative 2D active stress rho_0*chi = (10^3 Pa)*(100 nm) = 10^-4 Pa*m obtained by
    multiplying the keratocyte 3D stress (10^3 Pa, SI p. 15) by the cortical thickness
    (100 nm, Main p. 3), used to evaluate the SI Eq. (6) velocity kernel in physical units.
  alternatives: ["10^-5", "10^-3"]
  stands_for: "2D active contractility chi*rho_0 in SI Eq. (6)"

- id: figs9_phi_100_added
  quantity: rescaled_turnover
  unit: dimensionless
  printed: "100"
  basis: >
    With probe_alpha_xi0_added = 1, phi = 100 sets alpha^2*phi = 100 (i.e. alpha*sqrt(phi) = 10),
    matching the four plotted bifurcation abscissae in SI Fig. S9 (1.093, 1.387, 1.881, 2.572)
    instead of the captioned alpha^2*phi = 10 (which predicts 1.987, 4.948, 9.883, 16.791).
  alternatives: ["10"]
  stands_for: "phi (with alpha = 1) reproducing plotted SI Fig. S9 curves"

- id: figs9_alpha2_phi_100_added
  quantity: squared_cell_to_turnover_length
  unit: dimensionless
  printed: "100"
  basis: >
    Combined zero-friction parameter alpha^2*phi = 100 (alpha*sqrt(phi) = 10) inferred from the
    four plotted pitchfork bifurcation points in SI Fig. S9, contrasted with captioned 10.
  alternatives: ["10"]
  stands_for: "alpha^2*phi actually plotted in SI Fig. S9"

