id: turnover_diffusion_length
name: actin turnover-diffusion characteristic length scale
role: model
stated:
  page: 2
  printed_page: "8621"
  quote: "compares the range at which diffusion and turnover"
  where: text
equation: "l_t = sqrt(D * tau)"
inputs:
  D:
    quantity: diffusion_coefficient
    unit: um^2/s
  tau:
    quantity: turnover_time
    unit: s
outputs:
  l_t:
    quantity: turnover_diffusion_length
    unit: um
settings: {}
stochastic: false
