id: weakly_nonlinear_branch_printed
name: printed weakly nonlinear pitchfork branch chi(max_rho) (SI Section 2.6.2, Figs. S11-S12)
role: model
stated:
  page: 18
  printed_page: "SI-12"
  quote: "Beyond the linear analysis, the shape of bifurcation branches can be found"
  where: SI Section 2.6.2 (p. 12)
equation: "chi(max_rho) = chi_i^(0) + 0.5 * chi_i^(2)_printed * (max_rho - 1)^2"
built_from:
  - finite_domain_bifurcation_threshold
  - weakly_nonlinear_curvature_finite_printed
inputs:
  alpha:
    quantity: rescaled_cell_size
    unit: dimensionless
  phi:
    quantity: rescaled_turnover
    unit: dimensionless
  i:
    quantity: mode_index
    unit: dimensionless
  max_rho:
    quantity: dimensionless_density
    unit: dimensionless
outputs:
  chi:
    quantity: peclet_contractility
    unit: dimensionless
settings: {}
stochastic: false
