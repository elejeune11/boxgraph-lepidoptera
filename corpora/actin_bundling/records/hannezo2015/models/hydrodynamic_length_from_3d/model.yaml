id: hydrodynamic_length_from_3d
name: cortical hydrodynamic length from 3D viscosity, thickness, and 2D friction
role: model
stated:
  page: 3
  printed_page: "8622"
  quote: "length to lh ≈ 0.1 μm. This predicts a wavelength"
  where: text
equation: "l_h = sqrt(eta_3D * h / xi)"
built_from:
  - viscosity_2d_from_3d
  - hydrodynamic_length
inputs:
  eta_3D:
    quantity: viscosity_3d
    unit: Pa*s
  h:
    quantity: cortical_thickness
    unit: nm
  xi:
    quantity: friction_2d
    unit: Pa*s/m
outputs:
  l_h:
    quantity: hydrodynamic_length
    unit: um
settings: {}
stochastic: false
