id: critical_inverse_wavenumber_si_corrected
name: corrected critical inverse wavenumber 1/q_c from maximizing SI Eq. (7)
role: model
stated:
  page: 11
  printed_page: "SI-5"
  quote: "This loss of stability happens at a critical wavelength"
  where: SI Section 2.2
variant_of: critical_inverse_wavenumber_si_printed
corrections:
  - equation: "SI Section 2.2, p. 5 (PDF p. 11), inline 1/q_c formula"
    change: "Remove extraneous factor of pi: 1/q_c = L * (D * tau * xi / eta)^(1/4) = (D * tau * eta / xi)^(1/4)"
    evidence: "Maximizing SI Eq. (7) gives q_c^2 = 1/(L*sqrt(D*tau)) so 1/q_c = (D*tau*eta/xi)^(1/4); Main Eq. [3] and SI Eq. (11) give wavelength lambda_c = 2*pi/q_c = 2*pi*(D*tau*eta/xi)^(1/4), whereas the printed 1/q_c = pi*(D*tau*eta/xi)^(1/4) equals lambda_c/2 and is off from 1/q_c by pi (and from lambda_c by 1/2)."
equation: "1/q_c = L * (D * tau * xi / eta)^(1/4)"
inputs:
  L:
    quantity: hydrodynamic_length
    unit: um
  D:
    quantity: diffusion_coefficient
    unit: um^2/s
  tau:
    quantity: turnover_time
    unit: s
  xi:
    quantity: friction_2d
    unit: Pa*s/m
  eta:
    quantity: viscosity_2d
    unit: Pa*s*m
outputs:
  inv_qc:
    quantity: critical_inverse_wavenumber
    unit: um
  q_c:
    quantity: wavenumber
    unit: 1/um
settings: {}
stochastic: false
