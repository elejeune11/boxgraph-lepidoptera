id: two_component_reduction_corrected
name: corrected two-component to one-component effective D and k_d (SI Section 2.1)
role: model
stated:
  page: 9
  printed_page: "SI-3"
  quote: "Defining ρ = a + m, the acto-myosin density, by summing"
  where: SI Section 2.1, Eq. (1)-(2)
variant_of: two_component_reduction_printed
corrections:
  - equation: "SI Section 2.1, p. 3 (PDF p. 9), below Eq. (2)"
    change: "Swap factor K between D and R(rho): D = K*D_m/(1+K) and k_d_eff = k_d/(1+K) instead of D = D_m/(1+K) and k_d_eff = K*k_d/(1+K)"
    evidence: "From SI Eq. (1) with m = K*a and rho = a + m = (1+K)*a, we have a = rho/(1+K) and m = K*rho/(1+K). Summing the two conservation equations gives -D_m*d_xx(m) = -(K*D_m/(1+K))*d_xx(rho) and k_p - k_d*a = k_p - (k_d/(1+K))*rho; the K factor was transposed between the diffusion and depolymerization terms."
equation: "D = K * D_m / (1 + K); k_d_eff = k_d / (1 + K)"
inputs:
  D_m:
    quantity: diffusion_coefficient
    unit: um^2/s
  k_d:
    quantity: depolymerization_rate
    unit: 1/s
  K:
    quantity: equilibrium_binding_ratio
    unit: dimensionless
outputs:
  D:
    quantity: diffusion_coefficient
    unit: um^2/s
  k_d_eff:
    quantity: depolymerization_rate
    unit: 1/s
settings: {}
stochastic: false
