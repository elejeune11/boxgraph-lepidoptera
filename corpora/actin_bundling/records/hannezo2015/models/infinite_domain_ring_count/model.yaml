id: infinite_domain_ring_count
name: infinite-system linear ring count per cell alpha*phi^(1/4)/(2*pi) (SI Fig. S10)
role: model
stated:
  page: 17
  printed_page: "SI-11"
  quote: "Number of patterns as function of φ for α = 25"
  where: SI Section 2.6.1 & Fig. S10
equation: "n_rings = alpha * phi^(1/4) / (2 * pi)"
inputs:
  alpha:
    quantity: rescaled_cell_size
    unit: dimensionless
  phi:
    quantity: rescaled_turnover
    unit: dimensionless
outputs:
  n_rings:
    quantity: ring_count
    unit: dimensionless
settings: {}
stochastic: false
