id: frap_moment_recovery_eq14
name: FRAP zeroth-moment exponential recovery and second-moment linear spreading (SI Eq. 14)
role: model
stated:
  page: 20
  printed_page: "SI-14"
  quote: "the zeroth moment relaxes exponentially with time"
  where: SI Section 2.6.4, Eq. (14)
equation: "M_0(t)/M_0(0) = exp(-t/tau); M_2(t)/M_0(t) = 2*D*t + M_2(0)/M_0(0)"
inputs:
  t:
    quantity: time
    unit: s
  tau:
    quantity: turnover_time
    unit: s
  D:
    quantity: diffusion_coefficient
    unit: um^2/s
  var0:
    quantity: frap_variance
    unit: um^2
outputs:
  m0_norm:
    quantity: frap_zeroth_moment
    unit: dimensionless
  variance:
    quantity: frap_variance
    unit: um^2
settings: {}
stochastic: false
