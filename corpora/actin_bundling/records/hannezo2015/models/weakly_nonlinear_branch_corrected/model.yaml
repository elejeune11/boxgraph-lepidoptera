id: weakly_nonlinear_branch_corrected
name: corrected adjoint-Fredholm weakly nonlinear pitchfork branch chi(max_rho) (SI Section 2.6.2, Figs. S11-S12)
role: model
stated:
  page: 18
  printed_page: "SI-12"
  quote: "Beyond the linear analysis, the shape of bifurcation branches can be found"
  where: SI Section 2.6.2 (p. 12)
variant_of: weakly_nonlinear_branch_printed
corrections:
  - equation: "SI Section 2.6.2 (p. 12), Fredholm solvability curvature chi_i^(2)"
    change: "Use adjoint-Fredholm curvature chi_i^(2) = (2*k^2 - alpha^2)*(alpha^2 + k^2)*(alpha^2*phi + k^2)^2 / (3*alpha^2*k^2*(4*k^4 - alpha^4*phi)) in chi(max_rho) = chi_i^(0) + 0.5*chi_i^(2)*(max_rho - 1)^2"
    evidence: "SI Fig. S11 (alpha=35, phi=0.1, i=6) and Fig. S12 (alpha=15, phi=3, i=6) show onset branch curvatures 6x-10x steeper than predicted by printed chi_i^(2), agreeing with the adjoint-Fredholm solvability projection and exact Eq. (8) numerical continuation."
equation: "chi(max_rho) = chi_i^(0) + 0.5 * chi_i^(2)_corrected * (max_rho - 1)^2"
built_from:
  - finite_domain_bifurcation_threshold
  - weakly_nonlinear_curvature_finite_corrected
inputs:
  alpha:
    quantity: rescaled_cell_size
    unit: dimensionless
  phi:
    quantity: rescaled_turnover
    unit: dimensionless
  i:
    quantity: mode_index
    unit: dimensionless
  max_rho:
    quantity: dimensionless_density
    unit: dimensionless
outputs:
  chi:
    quantity: peclet_contractility
    unit: dimensionless
settings: {}
stochastic: false
