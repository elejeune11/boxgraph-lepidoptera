id: zero_friction_bifurcation_corrected
name: corrected zero-friction (xi = 0) pitchfork curvature (SI Section 2.5)
role: model
stated:
  page: 15
  printed_page: "SI-9"
  quote: "The nature of the bifurcation branches can be deduced"
  where: SI Section 2.5
variant_of: zero_friction_bifurcation_printed
corrections:
  - equation: "SI Section 2.5, p. 9 (PDF p. 15), chi_i^(2)"
    change: "Replace printed chi_i^(2) = phi + i^2*pi^2/(6*alpha^2) with exact weakly nonlinear curvature chi_i^(2) = (alpha^2*phi + i^2*pi^2)^2 / (6 * alpha^2 * i^2 * pi^2)"
    evidence: "Direct 3rd-order Lyapunov-Schmidt expansion of the stated Section 2.5 PDE (-alpha^-2 d_yy Psi = (chi - phi)(exp(Psi)/int exp(Psi) - 1), rho = (1 - phi/chi)*exp(Psi)/int exp(Psi) + phi/chi) normalized with rho_1 = cos(i*pi*(y+1/2)) (per 'Using the same notations' as Section 2.6.2) yields (alpha^2*phi + i^2*pi^2)^2/(6*alpha^2*i^2*pi^2), which agrees to 6 digits with numerical steady-state continuation and equals the exact xi -> 0 limit of the corrected Section 2.6.2 curvature."
equation: "chi_i^(0) = phi + i^2*pi^2/alpha^2; chi_i^(2) = (alpha^2*phi + i^2*pi^2)^2 / (6*alpha^2*i^2*pi^2)"
inputs:
  alpha:
    quantity: rescaled_cell_size
    unit: dimensionless
  phi:
    quantity: rescaled_turnover
    unit: dimensionless
  i:
    quantity: mode_index
    unit: dimensionless
outputs:
  chi_i0:
    quantity: peclet_contractility
    unit: dimensionless
  chi_i0_over_phi:
    quantity: rescaled_contractility_over_turnover
    unit: dimensionless
  chi_i2:
    quantity: pitchfork_curvature
    unit: dimensionless
settings: {}
stochastic: false
