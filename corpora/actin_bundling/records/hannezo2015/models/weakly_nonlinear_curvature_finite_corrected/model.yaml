id: weakly_nonlinear_curvature_finite_corrected
name: corrected adjoint-Fredholm finite-domain pitchfork curvature chi_i^(2) (SI Section 2.6.2)
role: model
stated:
  page: 18
  printed_page: "SI-12"
  quote: "Again, the condition of solvability reads"
  where: SI Section 2.6.2 (p. 12)
variant_of: weakly_nonlinear_curvature_finite_printed
corrections:
  - equation: "SI Section 2.6.2, p. 12 (PDF p. 18), Fredholm solvability condition and chi_i^(2)"
    change: "Project the 3rd-order RHS onto the adjoint (left) null vector ker(L^*) = (-alpha^2/(alpha^2 + i^2*pi^2), 1)^T instead of the right eigenvector (s_i^(1), rho_i^(1))^T, multiplying chi_i^(2) by (alpha^2 + i^2*pi^2)*(alpha^2*phi + 2*i^2*pi^2)/(i*pi)^4"
    evidence: "The linear steady-state operator L = -alpha^-2 d_yy + [[1, -chi], [1, phi - chi]] (Eq. 9) is non-self-adjoint (L_12 = -chi != 1 = L_21). SI p. 12 dots the RHS with the right eigenvector (s_i^(1), rho_i^(1)) rather than the adjoint eigenvector, giving a curvature 6x-12x smaller than direct numerical steady-state continuation of Eq. (8), whereas the adjoint-Fredholm formula agrees with numerical continuation to 5+ digits (e.g., at alpha=15, phi=3, i=6: numerical = 3.5325, corrected = 3.5325, printed = 0.5546; at alpha=35, phi=0.1, i=6: numerical = -0.4005, corrected = -0.4005, printed = -0.0384)."
equation: "chi_i^(2) = (2*pi^2*i^2 - alpha^2)*(alpha^2 + pi^2*i^2)*(alpha^2*phi + pi^2*i^2)^2 / (3*alpha^2*pi^2*i^2*(4*pi^4*i^4 - alpha^4*phi))"
inputs:
  alpha:
    quantity: rescaled_cell_size
    unit: dimensionless
  phi:
    quantity: rescaled_turnover
    unit: dimensionless
  i:
    quantity: mode_index
    unit: dimensionless
outputs:
  chi_i2:
    quantity: pitchfork_curvature
    unit: dimensionless
settings: {}
stochastic: false
