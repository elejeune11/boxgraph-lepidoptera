id: hydrodynamic_length_from_wavelength
name: hydrodynamic length inverted from observed ring spacing (SI Section 2.6.4)
role: model
stated:
  page: 21
  printed_page: "SI-15"
  quote: "we obtain from (11) a typical hydrodynamic"
  where: SI Section 2.6.4
equation: "sqrt(eta / xi) = (d / (2 * pi))^2 / sqrt(D * tau)"
inputs:
  d:
    quantity: ring_wavelength
    unit: m
  D:
    quantity: diffusion_coefficient
    unit: um^2/s
  tau:
    quantity: turnover_time
    unit: s
outputs:
  l_h:
    quantity: hydrodynamic_length
    unit: m
settings: {}
stochastic: false
