id: dispersion_relation_dimless_eq8
name: dimensionless linear dispersion relation and 2x2 operator invariants (SI Eqs. 8-9)
role: model
stated:
  page: 13
  printed_page: "SI-7"
  quote: "We use the characteristic hydrodynamic length of the problem L"
  where: "SI Section 2.3 Eq. (8) (pp. SI-7 to SI-8) and Section 2.6.1 Eq. (9) (p. SI-10)"
equation: "lam_hat = -phi - q_hat^2 + chi*q_hat^2/(1 + q_hat^2) = -det(L)/(1 + q_hat^2); det(L) = q_hat^4 + (1 + phi - chi)*q_hat^2 + phi; tr(L) = 2*q_hat^2 + 1 + phi - chi"
built_from:
  - dispersion_relation_eq7
  - diffusion_time_hydrodynamic
  - dimensionless_contractility_chi_2d
  - dimensionless_turnover_phi
inputs:
  q_hat:
    quantity: dimensionless_wavenumber
    unit: dimensionless
  chi:
    quantity: peclet_contractility
    unit: dimensionless
  phi:
    quantity: rescaled_turnover
    unit: dimensionless
outputs:
  lam_hat:
    quantity: dimensionless_growth_rate
    unit: dimensionless
  det_L:
    quantity: linear_operator_det
    unit: dimensionless
  tr_L:
    quantity: linear_operator_trace
    unit: dimensionless
settings: {}
stochastic: false
