id: diffusion_time_hydrodynamic
name: characteristic diffusion time over hydrodynamic length (SI Section 2.3)
role: model
stated:
  page: 13
  printed_page: "SI-7"
  quote: "and the characteristic time of diffusion over this length"
  where: SI Section 2.3
equation: "T = eta / (xi * D)"
inputs:
  eta:
    quantity: viscosity_2d
    unit: Pa*s*m
  xi:
    quantity: friction_2d
    unit: Pa*s/m
  D:
    quantity: diffusion_coefficient
    unit: um^2/s
outputs:
  T:
    quantity: diffusion_time_hydrodynamic
    unit: s
settings: {}
stochastic: false
