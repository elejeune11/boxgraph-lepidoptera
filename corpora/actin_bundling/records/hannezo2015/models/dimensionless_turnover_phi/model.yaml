id: dimensionless_turnover_phi
name: dimensionless turnover parameter phi = eta / (D * tau * xi)
role: model
stated:
  page: 14
  printed_page: "SI-8"
  quote: "which is the ratio of viscous stress created by actin turnover over frictional stress"
  where: SI Section 2.3
equation: "phi = eta / (D * tau * xi)"
inputs:
  eta:
    quantity: viscosity_2d
    unit: Pa*s*m
  D:
    quantity: diffusion_coefficient
    unit: um^2/s
  tau:
    quantity: turnover_time
    unit: s
  xi:
    quantity: friction_2d
    unit: Pa*s/m
outputs:
  phi:
    quantity: rescaled_turnover
    unit: dimensionless
settings: {}
stochastic: false
