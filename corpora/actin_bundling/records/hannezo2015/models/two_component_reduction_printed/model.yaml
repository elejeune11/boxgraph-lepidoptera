id: two_component_reduction_printed
name: printed two-component to one-component effective D and k_d (SI Section 2.1)
role: model
stated:
  page: 9
  printed_page: "SI-3"
  quote: "Defining ρ = a + m, the acto-myosin density, by summing"
  where: SI Section 2.1, Eq. (2)
equation: "D = D_m / (1 + K); k_d_eff = K * k_d / (1 + K)"
inputs:
  D_m:
    quantity: diffusion_coefficient
    unit: um^2/s
  k_d:
    quantity: depolymerization_rate
    unit: 1/s
  K:
    quantity: equilibrium_binding_ratio
    unit: dimensionless
outputs:
  D:
    quantity: diffusion_coefficient
    unit: um^2/s
  k_d_eff:
    quantity: depolymerization_rate
    unit: 1/s
settings: {}
stochastic: false
