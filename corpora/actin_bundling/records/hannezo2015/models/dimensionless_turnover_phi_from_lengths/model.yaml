id: dimensionless_turnover_phi_from_lengths
name: dimensionless turnover parameter phi = (l_h / l_t)^2
role: model
stated:
  page: 14
  printed_page: "SI-8"
  quote: "which is the ratio of viscous stress created by actin turnover over frictional stress"
  where: SI Section 2.3 & 2.6.4
equation: "phi = (l_h / l_t)^2"
built_from:
  - hydrodynamic_length
  - turnover_diffusion_length
  - dimensionless_turnover_phi
inputs:
  l_h:
    quantity: hydrodynamic_length
    unit: m
  l_t:
    quantity: turnover_diffusion_length
    unit: m
outputs:
  phi:
    quantity: rescaled_turnover
    unit: dimensionless
settings: {}
stochastic: false
