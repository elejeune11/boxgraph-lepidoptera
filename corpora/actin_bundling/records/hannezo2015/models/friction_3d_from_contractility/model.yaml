id: friction_3d_from_contractility
name: 3D cortical friction inferred from active stress and critical Peclet number (SI Section 2.6.4)
role: model
stated:
  page: 21
  printed_page: "SI-15"
  quote: "If we suppose that ρ0 χ = 103 P a as obtained for fish keratocytes"
  where: SI Section 2.6.4
equation: "xi = (rho_0 * chi) / (D * chi_c)"
inputs:
  sigma_a:
    quantity: active_stress_3d
    unit: Pa
  D:
    quantity: diffusion_coefficient
    unit: um^2/s
  chi_c:
    quantity: peclet_contractility
    unit: dimensionless
outputs:
  xi:
    quantity: friction_3d
    unit: Pa*s/m^2
settings: {}
stochastic: false
