id: peclet_from_fluorescence_ratio
name: plateau Peclet contractility scaled linearly from actin fluorescence (SI Section 2.6.5)
role: model
stated:
  page: 21
  printed_page: "SI-15"
  quote: "the critical value of the Peclet χ ∼ 1.07 corresponds to a fluorescence of 114"
  where: SI Section 2.6.5
equation: "chi_plateau = chi_c * (F_plateau / F_c)"
from_words: true
inputs:
  chi_c:
    quantity: peclet_contractility
    unit: dimensionless
  F_c:
    quantity: fluorescence_intensity
    unit: dimensionless
  F_plateau:
    quantity: fluorescence_intensity
    unit: dimensionless
outputs:
  chi_plateau:
    quantity: peclet_contractility
    unit: dimensionless
settings: {}
stochastic: false
