id: resonance_mode_i0
name: second-order resonance mode index i_0 (SI Section 2.6.2)
role: model
stated:
  page: 18
  printed_page: "SI-12"
  quote: "Of note, the denominator of the second term vanishes for"
  where: SI Section 2.6.2 (p. 12)
equation: "i_0 = floor(alpha * phi^(1/4) / (sqrt(2) * pi))"
inputs:
  alpha:
    quantity: rescaled_cell_size
    unit: dimensionless
  phi:
    quantity: rescaled_turnover
    unit: dimensionless
outputs:
  i_0:
    quantity: mode_index
    unit: dimensionless
settings: {}
stochastic: false
