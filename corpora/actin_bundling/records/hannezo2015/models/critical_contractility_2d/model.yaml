id: critical_contractility_2d
name: critical 2D active contractility threshold for cortical instability
role: model
stated:
  page: 2
  printed_page: "8621"
  quote: "Starting from an initially uniform density"
  where: text (p. 8621) and SI p. 5
equation: "chi_c = (sqrt(eta / tau) + sqrt(D * xi))^2"
inputs:
  eta:
    quantity: viscosity_2d
    unit: Pa*s*m
  tau:
    quantity: turnover_time
    unit: s
  D:
    quantity: diffusion_coefficient
    unit: um^2/s
  xi:
    quantity: friction_2d
    unit: Pa*s/m
outputs:
  chi_c:
    quantity: active_stress_2d
    unit: Pa*m
settings: {}
stochastic: false
