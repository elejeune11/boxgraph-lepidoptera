id: dispersion_relation_eq7
name: linear stability mode growth rate dispersion relation (SI Eq. 7)
role: model
stated:
  page: 11
  printed_page: "SI-5"
  quote: "And at first order on obtains the mode growth"
  where: SI Eq. 7
equation: "lambda = -1/tau - D*q^2 + (chi*rho_0 / xi) * q^2 / (1 + (L*q)^2)"
inputs:
  tau:
    quantity: turnover_time
    unit: s
  D:
    quantity: diffusion_coefficient
    unit: um^2/s
  sigma_a:
    quantity: active_stress_2d
    unit: Pa*m
    description: "2D active contractility product chi*rho_0 (or chi^0 in Main Eq. 2)"
  xi:
    quantity: friction_2d
    unit: Pa*s/m
  eta:
    quantity: viscosity_2d
    unit: Pa*s*m
  q:
    quantity: wavenumber
    unit: 1/um
outputs:
  lam:
    quantity: growth_rate
    unit: 1/s
settings: {}
stochastic: false
