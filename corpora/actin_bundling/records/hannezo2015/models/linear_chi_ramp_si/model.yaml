id: linear_chi_ramp_si
name: piecewise-linear contractility Peclet number ramp chi(t) (SI Section 2.6.5, Fig. S13 inset)
role: model
stated:
  page: 21
  printed_page: "SI-15"
  quote: "linearly over the course of 1875 s until it reaches a fluorescence plateau at 156"
  where: SI Section 2.6.5 & Fig. S13 inset
equation: "chi(t) = min(chi_start + (chi_end - chi_start) * t / t_ramp, chi_end)"
inputs:
  t:
    quantity: time
    unit: s
  chi_start:
    quantity: peclet_contractility
    unit: dimensionless
  chi_end:
    quantity: peclet_contractility
    unit: dimensionless
  t_ramp:
    quantity: time
    unit: s
outputs:
  chi:
    quantity: peclet_contractility
    unit: dimensionless
settings: {}
stochastic: false
