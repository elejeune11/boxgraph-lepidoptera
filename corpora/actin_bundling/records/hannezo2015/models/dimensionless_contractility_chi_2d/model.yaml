id: dimensionless_contractility_chi_2d
name: dimensionless active contractility (Peclet number) chi = sigma_a / (xi * D)
role: model
stated:
  page: 14
  printed_page: "SI-8"
  quote: "which measures the importance of contractile based drift favouring localization"
  where: SI Section 2.3 (and Main p. 8621)
equation: "chi = (rho_0 * chi_dim) / (xi * D)"
inputs:
  sigma_a:
    quantity: active_stress_2d
    unit: Pa*m
    description: "2D active contractile stress rho_0*chi (SI Eq. 4) or chi^0 (Main Eq. 2)"
  xi:
    quantity: friction_2d
    unit: Pa*s/m
  D:
    quantity: diffusion_coefficient
    unit: um^2/s
outputs:
  chi:
    quantity: peclet_contractility
    unit: dimensionless
settings: {}
stochastic: false
