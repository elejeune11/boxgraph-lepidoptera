id: critical_inverse_wavenumber_si_printed
name: printed critical inverse wavenumber 1/q_c (SI Section 2.2, p. 5)
role: model
stated:
  page: 11
  printed_page: "SI-5"
  quote: "This loss of stability happens at a critical wavelength"
  where: SI Section 2.2
equation: "1/q_c = pi * L * (D * tau * xi / eta)^(1/4)"
inputs:
  L:
    quantity: hydrodynamic_length
    unit: um
  D:
    quantity: diffusion_coefficient
    unit: um^2/s
  tau:
    quantity: turnover_time
    unit: s
  xi:
    quantity: friction_2d
    unit: Pa*s/m
  eta:
    quantity: viscosity_2d
    unit: Pa*s*m
outputs:
  inv_qc:
    quantity: critical_inverse_wavenumber
    unit: um
settings: {}
stochastic: false
