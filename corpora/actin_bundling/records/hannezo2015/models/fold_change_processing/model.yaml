id: fold_change_processing
name: fold change ratio of mutant ring spacing to wild-type
role: processing
stated:
  page: 4
  printed_page: "8623"
  quote: "mutants, and 10-fold by genetic removal of the extracellular matrix"
  where: Fig. 3A caption
equation: "fold = lambda_mutant / lambda_wt"
from_words: true
inputs:
  lambda_mutant:
    quantity: ring_wavelength
    unit: um
  lambda_wt:
    quantity: ring_wavelength
    unit: um
outputs:
  fold:
    quantity: fold_change
    unit: dimensionless
settings: {}
stochastic: false
