id: finite_domain_critical_mode
name: finite-domain critical mode i_c, ring count i_c/2, and threshold chi_ic^(0) (SI Section 2.6.1)
role: model
stated:
  page: 17
  printed_page: "SI-11"
  quote: "The number of patterns is then"
  where: SI Section 2.6.1
equation: "i_c = floor(x) if floor(x) > x^2 - floor(x)^2 else ceil(x), x = alpha*phi^(1/4)/pi; n_rings = i_c / 2"
built_from:
  - finite_domain_bifurcation_threshold
inputs:
  alpha:
    quantity: rescaled_cell_size
    unit: dimensionless
  phi:
    quantity: rescaled_turnover
    unit: dimensionless
outputs:
  i_c:
    quantity: mode_index
    unit: dimensionless
  n_rings:
    quantity: ring_count
    unit: dimensionless
  chi_c0:
    quantity: peclet_contractility
    unit: dimensionless
settings: {}
stochastic: false
