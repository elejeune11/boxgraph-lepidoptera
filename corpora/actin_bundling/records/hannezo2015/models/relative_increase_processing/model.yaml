stated:
  page: 4
  printed_page: "8623"
  quote: "still clearly visible (Fig. 3A), but the period is 0.8 ± 0.2 μm, a 70%"
  where: text (p. 8623)
equation: "pct_increase = 100 * (lambda_mutant - lambda_wt) / lambda_wt"
from_words: true
