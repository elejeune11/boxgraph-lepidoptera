id: steady_state_eq8_bifurcation
name: reconstructed cosine-collocation steady-state continuation of SI Eq. (8) near pitchfork bifurcation
role: model
stated:
  page: 19
  printed_page: "SI-13"
  quote: "two bifurcation diagrams constructed with AUTO"
  where: SI Section 2.6.3 (Figs. S11-S12)
reconstructed: "SI Section 2.6.3 computes nonlinear steady-state branches of Eq. (8) using AUTO-07p without providing AUTO scripts or mesh settings; we implement a Fourier-cosine Galerkin/collocation root-finder for steady-state Eq. (8) to independently verify the pitchfork curvature chi_i^(2)."
equation: "-alpha^-2 d_yy s + s = chi*(rho - 1); alpha^-2 d_y(rho*d_y s - d_y rho) = -phi*(rho - 1); chi_i^(2) = 2*(chi(eps) - chi_i^(0))/eps^2"
inputs:
  alpha:
    quantity: rescaled_cell_size
    unit: dimensionless
  phi:
    quantity: rescaled_turnover
    unit: dimensionless
  i:
    quantity: mode_index
    unit: dimensionless
  eps:
    quantity: dimensionless_density
    unit: dimensionless
outputs:
  chi_branch:
    quantity: peclet_contractility
    unit: dimensionless
  chi_i2:
    quantity: pitchfork_curvature
    unit: dimensionless
  min_rho:
    quantity: dimensionless_density
    unit: dimensionless
settings:
  M_modes: 24
  N_quad: 256
stochastic: false
