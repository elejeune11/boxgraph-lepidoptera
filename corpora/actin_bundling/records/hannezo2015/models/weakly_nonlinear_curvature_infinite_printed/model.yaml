id: weakly_nonlinear_curvature_infinite_printed
name: printed infinite-system pitchfork curvature chi_c^(2) and tricritical phi (SI Section 2.6.2)
role: model
stated:
  page: 19
  printed_page: "SI-13"
  quote: "which is negative (subcritical) if φ < 1/4 and positive otherwise"
  where: SI Section 2.6.2 (p. 13)
equation: "chi_c^(2) = (2*phi^(3/2) + 3*phi - 1) / (9*(sqrt(phi) + 2))"
inputs:
