id: finite_domain_bifurcation_threshold
name: finite-domain linear bifurcation threshold chi_i^(0) (SI Section 2.6.1)
role: model
stated:
  page: 16
  printed_page: "SI-10"
  quote: "set of solutions branching from the homogeneous one"
  where: SI Section 2.6.1
equation: "chi_i^(0) = 1 + (i^2 * pi^2) / alpha^2 + phi * (1 + alpha^2 / (i^2 * pi^2))"
inputs:
  alpha:
    quantity: rescaled_cell_size
    unit: dimensionless
  phi:
    quantity: rescaled_turnover
    unit: dimensionless
  i:
    quantity: mode_index
    unit: dimensionless
outputs:
  chi_i0:
    quantity: peclet_contractility
    unit: dimensionless
settings: {}
stochastic: false
