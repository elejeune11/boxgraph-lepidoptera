id: nonlocal_velocity_kernel_printed
name: printed non-local force-balance velocity kernel on uniform gel (SI Eq. 6)
role: model
stated:
  page: 10
  printed_page: "SI-4"
  quote: "We have introduced, the kernel Φ which explicitly reads"
  where: SI Eq. 6
equation: "v_unif(x) = (sigma_a / eta) * int_{-l/2}^{l/2} Phi_printed(x, y) dy = -(sigma_a / eta) * L * sinh(x/L) / cosh(l/(2L))"
inputs:
  sigma_a:
    quantity: active_stress_2d
    unit: Pa*m
  eta:
    quantity: viscosity_2d
    unit: Pa*s*m
  L:
    quantity: hydrodynamic_length
    unit: um
  l:
    quantity: cell_length
    unit: um
  x:
    quantity: spatial_coordinate
    unit: um
outputs:
  v_unif:
    quantity: cortical_velocity
    unit: um/s
settings: {}
stochastic: false
