id: critical_wavelength_from_lengths
name: critical actin ring wavelength in terms of l_t and l_h
role: model
stated:
  page: 3
  printed_page: "8622"
  quote: "near the threshold of λc = 1.8 μm, which is slightly larger"
  where: text (from Eq. 3 and l_t, l_h)
equation: "lambda_c = 2 * pi * sqrt(l_t * l_h)"
built_from:
  - turnover_diffusion_length
  - hydrodynamic_length
  - critical_wavelength_eq3
inputs:
  l_t:
    quantity: turnover_diffusion_length
    unit: um
  l_h:
    quantity: hydrodynamic_length
    unit: um
outputs:
  lambda_c:
    quantity: ring_wavelength
    unit: um
settings: {}
stochastic: false
