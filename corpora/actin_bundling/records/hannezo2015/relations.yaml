- id: rel_bois2011_instability_eq13_critical_limit
  kind: reduces_to
  a: hannezo2015/finite_domain_critical_mode
  b: bois2011/single_species_instability_eq13
  mapping:
    Pe: "1"
    c0: "1"
    df_dc: "1"
    beta: "1"
    L_over_l: "alpha"
  output_map:
    Pe_crit: chi_c0
  limit:
    phi: "0"
  regime:
    alpha: [2.0, 20.0]
    phi: [0.001, 0.1]
  provenance: stated
  citation:
    page: 2
    printed_page: "8621"
    quote: "The case τ → ∞ has been studied theoretically previously (10, 11) and yields to actin"
    where: "Main text p. 8621, col. 2 (citing ref. 10 = Bois et al. 2011 for the tau -> oo limit)"
  assumptions:
    - "No-turnover limit phi = eta/(D*tau*xi) -> 0 (tau -> oo) at finite domain size alpha = l/l_h, where the critical mode drops to i_c = 1 (single-region accumulation)."
    - "No-flux boundary conditions (beta = 1 in Bois Eq. 13 matching Hannezo Eq. 5)."
    - "Linear active stress f(rho_hat) = rho_hat around rescaled reference density rho_hat_0 = 1 (c_0 = 1, df/dc = 1)."

- id: rel_bois2011_instability_eq13_mode_i_limit
  kind: reduces_to
  a: hannezo2015/finite_domain_bifurcation_threshold
  b: bois2011/single_species_instability_eq13
  mapping:
    Pe: "1"
    c0: "1"
    df_dc: "1"
    beta: "i"
    L_over_l: "alpha"
  output_map:
    Pe_crit: chi_i0
  limit:
    phi: "0"
  regime:
    alpha: [2.0, 20.0]
    phi: [0.001, 0.1]
    i: [1.0, 2.0]
  provenance: proposed
  reason: >
    Taking the no-turnover limit phi -> 0 in Hannezo's finite-domain mode-i bifurcation
    threshold chi_i^(0) = 1 + (i*pi/alpha)^2 + phi*(1 + alpha^2/(i*pi)^2) yields Bois Eq. (13)'s
    Pe_crit = 1 + (beta*pi*ell/L)^2 for linear active stress (c_0 = 1, df/dc = 1), with i = 1
    matching no-flux BCs (beta = 1) and i = 2 matching periodic BCs (beta = 2).
  assumptions:
    - "No-turnover limit phi -> 0 for fixed cosine mode i."
    - "Linear active stress f(rho_hat) = rho_hat around rho_hat_0 = 1 (c_0 = 1, df/dc = 1)."
    - "Mode index i = 1 maps to no-flux BC (beta = 1) and i = 2 maps to periodic BC fundamental mode (beta = 2)."

- id: rel_bois2011_hill_boundary_scales_linear
  kind: scales_as
  a: bois2011/single_species_stability_boundary_hill
  b: hannezo2015/finite_domain_bifurcation_threshold
  mapping:
    alpha: "L_over_l"
    i: "beta"
    phi: "0"
  output_map:
    chi_i0: Pe_crit
  regime:
    c0: [0.1, 5.0]
    beta: [1.0, 2.0]
    L_over_l: [1.0, 20.0]
  provenance: proposed
  reason: >
    Bois's Hill saturating active stress f(c) = c/(1+c) multiplies the finite-domain linear
    instability threshold by the concentration-dependent saturation factor (1+c_0)^2/c_0 >= 4
    relative to Hannezo's linear active stress threshold at phi = 0, leaving the geometric
    dependence on L/ell (= alpha) and boundary condition factor beta (= i) identical.
  assumptions:
    - "Turnover-free limit phi = 0 on the Hannezo side and fixed mean concentration c_0 on the Bois Hill-stress side."

- id: rel_bois2011_fastest_mode_approx_ring_count
  kind: approximated_by
  a: bois2011/single_species_fastest_mode
  b: hannezo2015/infinite_domain_ring_count
  mapping:
    alpha: "2 * L_over_l / beta"
    phi: "(sqrt(Pe * c0 / (1 + c0)**2) - 1)**2"
  output_map:
    n_rings: n_max
  regime:
    Pe: [10.0, 50.0]
    c0: [0.5, 2.0]
    beta: [1.0, 2.0]
    L_over_l: [200.0, 1000.0]
  tolerance: 0.02
  provenance: proposed
  reason: >
    Because first-order turnover shifts Bois's dispersion curve uniformly downward by -phi
    without moving its wavenumber peak k_max*ell = sqrt(sqrt(Pe_eff) - 1), setting
    phi = (sqrt(Pe_eff) - 1)^2 aligns Hannezo's marginal onset wavenumber phi^(1/4) with Bois's
    supercritical fastest-growing wavenumber; for large domains L/ell in [200, 1000], Bois's
    discrete n_max agrees with Hannezo's continuous ring count alpha*phi^(1/4)/(2*pi) up to
    O(1/n) integer discretization.
  assumptions:
    - "Supercritical active stress Pe * c_0 / (1 + c_0)^2 > 1 throughout the regime."
    - "Large domain L/ell >> 1 so discrete integer rounding error O(1/n) is < 2%."
    - "Rescaled domain alpha = 2*(L/ell)/beta aligns discrete wavenumber spacing beta*pi/(L/ell) with Hannezo's ring count (2*pi/alpha)."

