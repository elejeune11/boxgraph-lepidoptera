# Cross-record relations with bois2011 (Bois, Julicher & Grill, PRL 106:028103, 2011; cited as ref-10)

- id: rel_bois2011_hydrodynamic_length
  kind: same_as
  a: hannezo2015/hydrodynamic_length
  b: bois2011/hydrodynamic_length
  mapping:
    eta: "eta"
    gamma: "xi"
  regime:
    eta: [1.0e-7, 1.0e-3]
    xi: [1.0e7, 1.0e11]
  provenance: proposed
  reason: >
    Both papers define the hydrodynamic screening length as sqrt(viscosity / friction):
    Hannezo's 2D cortical length l_h = sqrt(eta/xi) (Main p. 2, SI p. 10) is algebraically
    identical to Bois's 3D hydrodynamic length ell = sqrt(eta/gamma) (p. 2) because the
    cortex thickness h cancels in eta/xi = (h*eta_3D)/(h*gamma).
  assumptions:
    - "2D thickness-integrated viscosity eta = h*eta_3D and 2D friction xi = h*gamma cancel cortex thickness h in eta/xi = eta_3D/gamma (mapped at unit reference thickness h = 1 m)."

- id: rel_bois2011_hydrodynamic_length_3d
  kind: same_as
  a: hannezo2015/hydrodynamic_length_from_3d
  b: bois2011/hydrodynamic_length
  mapping:
    eta: "eta_3D"
    gamma: "xi * 10**9 / h"
  regime:
    eta_3D: [10.0, 1000.0]
    h: [10.0, 500.0]
    xi: [1.0e7, 1.0e11]
  provenance: proposed
  reason: >
    Expressing Hannezo's hydrodynamic length via 3D cortical viscosity eta_3D and thickness h
    gives a dimensionally exact 3D-to-3D identity with Bois's ell = sqrt(eta/gamma) under
    eta = eta_3D and gamma = xi / h (converting h from nm to m).
  assumptions:
    - "3D bulk friction coefficient gamma [Pa*s/m^2] relates to Hannezo's 2D cortical friction xi [Pa*s/m] by gamma = xi / h."

- id: rel_bois2011_diffusive_timescale
  kind: same_as
  a: hannezo2015/diffusion_time_hydrodynamic
  b: bois2011/diffusive_timescale
  mapping:
    l: "sqrt(eta / xi)"
    D: "D / 10**12"
  regime:
    eta: [1.0e-7, 1.0e-3]
    xi: [1.0e7, 1.0e11]
    D: [0.005, 0.5]
  provenance: proposed
  reason: >
    Both papers nondimensionalize time by diffusion across one hydrodynamic length:
    Hannezo SI Section 2.3 defines T = eta/(xi*D) = L^2/D, identically equal to Bois Fig. 3's
    diffusive timescale tau_D = ell^2/D with ell = sqrt(eta/xi).

- id: rel_bois2011_peclet_number
  kind: same_as
  a: hannezo2015/dimensionless_contractility_chi_2d
  b: bois2011/peclet_number_physical
  mapping:
    zdm0: "sigma_a"
    gamma: "xi"
    D: "D / 10**12"
  regime:
    sigma_a: [1.0e-6, 1.0e-2]
    xi: [1.0e7, 1.0e11]
    D: [0.005, 0.5]
  provenance: proposed
  reason: >
    Hannezo's dimensionless contractility chi = sigma_a/(xi*D) (explicitly called 'the Peclet
    number chi' in SI Section 2.6.5, p. 15) has the exact same form as Bois's active Peclet
    number Pe = (zeta*Delta_mu)_0/(D*gamma), with cortex thickness h canceling in
    sigma_a/xi = (zeta*Delta_mu)_0/gamma.
  assumptions:
    - "2D thickness-integrated active stress sigma_a = h*(zeta*Delta_mu)_0 and 2D friction xi = h*gamma cancel thickness h in sigma_a/xi = (zeta*Delta_mu)_0/gamma."
    - "Under Hannezo's linear active stress sigma_act = sigma_a*(rho/rho_0), c_0*df/dc = 1 so chi equals both bare Pe and linearized Pe_eff = Pe*c_0*df/dc; for Bois's Hill stress f(c) = c/(1+c), Pe_eff = Pe*c_0/(1+c_0)^2 = Pe/4 at c_0 = 1."

- id: rel_bois2011_rda_dispersion_eq15
  kind: same_as
  a: hannezo2015/dispersion_relation_eq7
  b: bois2011/single_species_rda_dispersion_eq15
  mapping:
    k: "q * 10**6"
    D: "D / 10**12"
    dR_dc: "-1 / tau"
    Pe: "sigma_a * 10**12 / (xi * D)"
    c0: "1"
    df_dc: "1"
    l: "sqrt(eta / xi)"
  regime:
    tau: [1.0, 100.0]
    D: [0.005, 0.5]
    sigma_a: [1.0e-6, 1.0e-2]
    xi: [1.0e7, 1.0e11]
    eta: [1.0e-7, 1.0e-3]
    q: [0.1, 50.0]
  provenance: proposed
  reason: >
    Hannezo SI Eq. (7) is algebraically identical to the single-species (N = 1) case of Bois
    Eq. (15) when chemical reaction is first-order actin turnover R(rho) = (rho_0 - rho)/tau
    (dR/dc = -1/tau), active stress is linear in rescaled density rho_hat = rho/rho_0
    (c_0 = 1, df/dc = 1), Pe = sigma_a/(xi*D), and ell = sqrt(eta/xi). Hannezo only cites
    Bois 2011 (ref-10) for the conserved limit tau -> oo without noting this exact equivalence
    to Bois Eq. (15).
  assumptions:
    - "Single active-stress regulator species (N = 1) with linear turnover reaction dR/dc = -1/tau."
    - "Linear active stress f(rho_hat) = rho_hat around rescaled reference density rho_hat_0 = 1 (c_0 = 1, df/dc = 1)."
    - "Cortex thickness h cancels in both ell = sqrt(eta/xi) and Pe = sigma_a/(xi*D)."

