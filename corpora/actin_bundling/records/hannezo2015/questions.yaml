    retain the same 0.5 um ring wavelength, explicitly citing ref-12 to rule out direct tube-radius
    wavelength selection (as in Gov's quartic cylindrical ring model, where lambda_max -> 2*pi*R_0
    at strong contractility), while Hannezo Main p. 6 (citing ref-43, ref-44) proposes axial membrane
    curvature as a possible secondary cue for ring orientation and non-stationary ring coalescence
    in constricted kkv1 tubes. See gov2018/q_hannezo2015_structural_contrasts for the full five-point
    mathematical and biophysical contrast.
