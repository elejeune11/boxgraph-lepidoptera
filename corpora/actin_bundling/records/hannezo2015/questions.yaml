- id: q_si_section262_sign_criterion_and_i0_floor
  kind: possible_error
  about: [weakly_nonlinear_curvature_finite_printed, weakly_nonlinear_curvature_finite_corrected, resonance_mode_i0]
  text: >
    Two additional mathematical errors appear in SI Section 2.6.2 (p. 12 / PDF p. 18):
    (1) The text asserts 'As in the case where phi = 0 the nature of the pitchfork bifurcation change
    from supercritical if alpha < sqrt(2)*i*pi to subcritical in the opposite case.' For phi > 0, both
    the printed and adjoint-corrected chi_i^(2) contain the sign-changing denominator factor
    (4*pi^4*i^4 - alpha^4*phi) alongside (2*pi^2*i^2 - alpha^2). Hence alpha < sqrt(2)*i*pi gives
    supercriticality only for i > alpha*phi^(1/4)/(sqrt(2)*pi) (which includes the primary critical
    mode i_c), whereas for lower modes i < alpha*phi^(1/4)/(sqrt(2)*pi) (e.g., i = 1..4 at Fig. S12
    parameters alpha = 15, phi = 3), the sign reverses (i = 1 has alpha > sqrt(2)*pi yet is
    supercritical; i = 4 has alpha < 4*sqrt(2)*pi yet is subcritical).
    (2) The text writes that the 2nd-order denominator alpha^4*phi - 4*i^4*pi^4 vanishes for
    i_0 = floor(alpha*phi^(1/4)/(sqrt(2)*pi)) < i_c 'so there is no problem of definition.' The
    denominator vanishes only when alpha*phi^(1/4)/(sqrt(2)*pi) is an exact integer (not at its floor),
    and when it is an integer, the 2nd-order expansion is resonant on that lower branch i_0 < i_c
    (avoiding resonance only on the primary critical branch i_c).
  citation:
    page: 18
    printed_page: "SI-12"
    quote: "the nature of the pitchfork bifurcation change from supercritical if"
    where: SI Section 2.6.2

