    - bois2011/single_species_steady_state_eq9
    - bois2011/single_species_potential_eq10
    - bois2011/single_species_pde_eq1_3
  text: >
    Comparing the linear and nonlinear dynamics of hannezo2015 against bois2011 (ref-10) clarifies
    the exact role of actin turnover tau (dimensionless phi = eta/(D*tau*xi)):
    (1) Unstated exact Eq. (15) equivalence: Hannezo Main p. 2 cites Bois 2011 only for the
    conserved tau -> oo limit (rel_bois2011_dispersion_eq12_limit, rel_bois2011_instability_eq13_critical_limit).
    Yet even at finite turnover tau < oo, Hannezo SI Eq. (7) is symbolically identical to the
    single-species (N = 1) case of Bois's general reaction-diffusion-advection dispersion relation
    Eq. (15) with first-order turnover dR/dc = -1/tau (rel_bois2011_rda_dispersion_eq15), a case
    Bois did not analyze (focusing Eq. 15 on the 2-species ASDM).
    (2) Turnover shifts the dispersion curve uniformly downward by -phi without shifting its
    wavenumber peak k_max*ell = sqrt(sqrt(Pe_eff) - 1), so marginal onset chi_c = (1 + sqrt(phi))^2
    selects finite critical wavenumber q_c*l_h = phi^(1/4) (lambda_c = 2*pi*(D*tau*eta/xi)^(1/4)),
    matching Bois's fastest-growing mode at phi = (sqrt(Pe_eff) - 1)^2 (rel_bois2011_fastest_mode_approx_ring_count),
    whereas at phi = 0 the instability becomes long-wavelength (q_c -> 0, i_c = 1).
    (3) Nonlinear coarsening vs. arrested multi-ring patterns: in bois2011 (tau -> oo,
    single_species_pde_eq1_3, Fig. 4), regulator conservation enforces zero steady flux j_0 = 0
    (Eqs. 5-8), permitting the conservative Hamiltonian reduction Eqs. (9)-(10) with Hill-stress
    potential V(u), and all multipeaked steady states are unstable and coarsen to a single peak
    (n_peaks_final = 1). In hannezo2015 (phi > 0, cortical_pde_1d_ramp, Figs. S13-S15), turnover
    breaks zero-flux conservation (sustaining steady depolymerization at peaks and polymerization
    in valleys), invalidating Bois's Hamiltonian steady-state reduction while arresting coarsening
    to stabilize periodic multi-ring arrays (~15 rings/cell) — and, with quadratic turnover
    nonlinearity (epsilon > 0, cortical_pde_1d_chaos, Figs. S5-S8), enabling spatiotemporal chaos
    below a critical friction xi_c propto eta/(D*tau).
  citation:
    page: 2
    printed_page: "8621"
    quote: "The case τ → ∞ has been studied theoretically previously (10, 11) and yields to actin"
    where: "Main text p. 8621, col. 2 (citing ref. 10 = Bois et al. 2011)"

