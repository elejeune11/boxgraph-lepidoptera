    Zwicker-commuting adiabatic dictionary (f_2'' = 0, Delta = phi, f_1'' = 1 + phi - chi).
    (2) Hannezo's dispersion relation reduces to Frohoff's passive variational CH dispersion as
    phi = 0, q_hat -> 0 (and directly in 1/s as tau -> oo, eta -> 0), reduces at finite turnover
    tau > 0 to Frohoff's dimensional adiabatic dispersion as eta -> 0 (tau_0 = eta/sigma_a,
    f_1'' = 1/chi - 1, Delta/kappa = phi/chi), and agrees within < 3.3% at finite (eta, tau, Q)
    inside the scale-separation window 1/Q << q^2 << 1.
    (3) critical_wavelength_eq3, critical_wavelength_dimensionless, and
    critical_inverse_wavenumber_si_corrected symbolically join frohoff2021/turing_wavelength_dim_eq17_A2
    (and zwicker2015/homogeneous_onset_wavelength_eqF1) in one verified 3-paper onset-wavelength
    family lambda_c = 2*pi*(D*tau*eta/xi)^(1/4), while independently corroborating
    q_si_inv_qc_extra_pi (printed 1/q_c off by pi = 3.14159).
    (4) dimensionless_critical_contractility_eq10 maps non-circularly to frohoff2021/instability_onsets_eqB4_B6_B7
    (a^T = -2*chi_c^(0) at kappa = 2), finite_domain_bifurcation_threshold matches stability_borders_eqB3_B5
    at both phi = 0 and finite phi > 0 (stiff-slaved kappa -> oo outside Frohoff's small-q Hopf
    band), zero_friction_bifurcation_corrected collapses identically onto decoupled CH a_+(q_i),
    and finite_domain_critical_mode (i_c) agrees identically (40/40 exact integer matches) with
    frohoff2021/fastest_linear_mode_eqB1 (n_first_bif) under mirror-domain doubling ell = 2*alpha.
    Irreducible structural contrasts (detailed in frohoff2021/q_hannezo2015_modelatlas_contrasts):
    (i) Hannezo's purely real active-gel spectrum (lam(0) = -1/tau < 0, nonlinear turnover-induced
    merging-emerging chaos for epsilon > 0, phi > (2*pi)^4 approx 1559) vs. Frohoff's doubly
    conserved nonreciprocal Cahn-Hilliard spectrum (lam(0) = 0, complex-eigenvalue conserved Hopf
