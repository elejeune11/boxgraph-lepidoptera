    against totz2024 measurements (37 origin: measured and 24 origin: reported entries): neither
    paper cites the other, and no hannezo2015 model genuinely predicts any totz2024 measurement on
    butterfly wing-scale experimental conditions.
    (1) Inter-bundle actin spacings and protoridge widths (totz2024/d_fig3G_L_mean: 1.277-1.598 um
