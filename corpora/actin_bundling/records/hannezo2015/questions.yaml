- id: q_si_section262_wrong_fredholm_eigenvector
  kind: possible_error
  about: [weakly_nonlinear_curvature_finite_printed, weakly_nonlinear_curvature_finite_corrected, weakly_nonlinear_curvature_infinite_printed, weakly_nonlinear_curvature_infinite_corrected, steady_state_eq8_bifurcation]
  text: >
    In SI Section 2.6.2 (pp. 12-13 / PDF pp. 18-19), the linear steady-state operator
    L = -alpha^-2 d_yy + [[1, -chi], [1, phi - chi]] (Eq. 9) is non-self-adjoint (L_12 = -chi != 1 = L_21).
    When applying the Fredholm solvability condition to Eq. (13) on p. 18, the SI projects the RHS
    onto the right eigenvector (s_i^(1), rho_i^(1)) rather than the adjoint (left) null vector
    ker(L^*) = (-alpha^2/(alpha^2 + i^2*pi^2), 1)^T. Reproducing that erroneous inner product yields
    the printed chi_i^(2) and chi_c^(2) identically, whereas both exact adjoint-Fredholm analysis and
    direct numerical steady-state continuation of Eq. (8) give a curvature larger by the strictly
    positive factor (alpha^2 + i^2*pi^2)*(alpha^2*phi + 2*i^2*pi^2)/(i*pi)^4 (6x-12x larger at
    Figs. S11-S12 parameters). Because the factor is positive for all phi > 0, the sign of chi_c^(2)
    and the tricritical point phi = 1/4 remain unchanged. Separately, the displayed 2nd-order solution
    (s_i^(2), rho_i^(2)) on p. 18 mistypes (alpha^2*phi + i^2*pi^2) and (alpha^2*phi + 4*i^2*pi^2)
    in place of (alpha^2 + i^2*pi^2) and (alpha^2 + 4*i^2*pi^2), though the paper's subsequent chi_i^(2)
    formula was clearly derived using the correct 2nd-order amplitudes.
  citation:
    page: 18
    printed_page: "SI-12"
    quote: "Again, the condition of solvability reads"
    where: SI Section 2.6.2

