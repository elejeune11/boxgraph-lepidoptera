  text: >
    Cross-record reconciliation with Bois, Julicher & Grill (PRL 106:028103, 2011; cited in
    hannezo2015 as ref-10, distinct from the review ref-3 Howard, Grill & Bois 2011 and the
    predecessor paper ref-16 / si-ref-12 Mayer et al. 2010) highlights four systematic notation,
    dimensional, and constitutive differences:
    (1) 2D thickness-integrated vs. 3D bulk units: bois2011 Eqs. (2)-(3) use 3D bulk parameters
    eta [Pa*s], gamma [Pa*s/m^2], and (zeta*Delta_mu)_0 [Pa], whereas hannezo2015 Main Eqs. (2)-(3)
    and SI Eqs. (3)-(4) use 2D thickness-integrated eta = h*eta_3D [Pa*s*m], xi (also printed zeta
    on Main p. 5) = h*gamma [Pa*s/m], and sigma_a = chi^0 = rho_0*chi = h*(zeta*Delta_mu)_0 [Pa*m]
    (with SI p. 15 friction_3d_from_contractility briefly reverting to 3D Pa and Pa*s/m^2 matching
    bois2011). Thickness h cancels identically in l_h = sqrt(eta/xi) = sqrt(eta_3D/gamma) = ell,
    T = eta/(xi*D) = ell^2/D = tau_D, and chi = sigma_a/(xi*D) = (zeta*Delta_mu)_0/(D*gamma) = Pe.
    (2) Symbol swaps: domain length l (hannezo2015) <-> L (bois2011), hydrodynamic length L or l_h
    <-> ell, dimensionless size alpha = l/l_h <-> L/ell, wavenumber q <-> k, friction xi/zeta <->
    gamma, and active contractility chi (called 'the Peclet number chi' in SI p. 15) <-> Pe.
    (3) Linear vs. Hill saturating active stress: hannezo2015 uses strictly linear active stress
    sigma_act = sigma_a*(rho/rho_0) (Main Eq. 2, SI Eq. 4; no saturating stress law appears in
    hannezo2015), giving c_0*df/dc = 1 at rescaled reference density rho_hat_0 = 1 and turnover-free
    infinite-domain threshold chi_c = 1 (dimensional chi_c = (sqrt(eta/tau) + sqrt(D*xi))^2 -> D*xi
    as tau -> oo). bois2011's general Eqs. (12)-(13), (15) carry the factor c_0*df/dc (effective
    linearized Peclet Pe_eff = Pe*c_0*df/dc), while Figs. 1-5 specialize to the Hill saturating
    law f(c) = c/(1+c), where c_0*df/dc = c_0/(1+c_0)^2 <= 1/4 (maximum at c_0 = 1), raising bare
    Pe_crit by (1+c_0)^2/c_0 >= 4 while preserving the exact finite-size geometric scaling
    1 + (beta*pi*ell/L)^2 (rel_bois2011_hill_boundary_scales_linear).
    (4) Orthogonal threshold limits: dimensionless_critical_contractility_eq10 (chi_c = (1+sqrt(phi))^2,
    already at alpha -> oo) and bois2011/single_species_instability_eq13 (Pe_crit = (1 + (beta*pi*ell/L)^2)/(c_0*df/dc),
    already at phi = 0) are orthogonal 1-parameter limits (alpha -> oo vs. phi -> 0) of
    finite_domain_critical_mode and finite_domain_bifurcation_threshold, both converging to
    chi_c = Pe_eff,c = 1 in the joint limit (alpha -> oo, phi -> 0).
  citation:
    page: 2
    printed_page: "8621"
    quote: "The case τ → ∞ has been studied theoretically previously (10, 11) and yields to actin"
    where: "Main text p. 8621, col. 2 (citing ref. 10 = Bois et al. 2011)"

- id: q_bois2011_turnover_arrested_coarsening_and_nonlinear_dynamics
  kind: choice
