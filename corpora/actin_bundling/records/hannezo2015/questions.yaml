    enters 20 tested proposed relations (19 verified + 1 diagnostic not_verified) in
    frohoff2021/relations.yaml, closing the final diagonal of the 4-paper active-turnover
    commutative square (bois2011 <-> hannezo2015 <-> frohoff2021 <-> zwicker2015).
    Key verified equivalences:
    (1) Hannezo SI Eq. (9)'s 2x2 non-self-adjoint stress-density linear operator L(q_hat) is
    symbolically identical (both det and tr) to Frohoff Eq. (12)'s nonreciprocal matrix B(q) at
    Q = kappa = 1, f_1'' = 1, f_2'' = phi - chi, rho = (chi - 1)/2, alpha = (chi + 1)/2 (intrinsic
