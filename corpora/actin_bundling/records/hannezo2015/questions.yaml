    1.6 um): although critical_wavelength_eq3 (lambda_c = 2*pi*(D*tau*eta/xi)^(1/4)) and
    critical_wavelength_from_lengths (2*pi*sqrt(l_t*l_h)) share dimension [length] and physical
    role (periodic cortical actin spacing; cortical_pde_2d_anisotropic is non-runnable), evaluating
    them on totz2024's butterfly data is an unconditioned cross-species comparison rather than a
    valid on-conditions test for four reasons:
    (a) Zero butterfly-scale inputs (0/4 for critical_wavelength_eq3, 0/2 for
    critical_wavelength_from_lengths): totz2024 measures none of D, tau, eta, xi, l_t, or l_h in
    developing butterfly wing scales. In hannezo2015, D = 0.04 +/- 0.03 um^2/s and tau = 15 +/- 7 s
    (l_t = 0.775 um) were measured by FRAP in stage-15 Drosophila embryonic trachea, while Main
    p. 3 explicitly notes that l_h "can be considered as the one fitting parameter to match the
    observed wavelength" (using mammalian granulocyte eta_3D = 100 Pa*s, h = 100 nm, and in vitro
    bead friction xi = 10^9 Pa*s/m -> l_h = 0.100 um) and SI p. 21 states "Both eta and xi are
    hard to measure and estimates from the literature span over several order of magnitudes."
    (b) Two mutually inconsistent Drosophila parameter sets within hannezo2015 itself
    (q_si_p15_parameter_estimates_inconsistency): Main p. 3's literature inputs give lambda_c =
    1.749 um (printed 1.8 um, overpredicting Drosophila's own embryonic WT 0.5 +/- 0.1 um by
    3.5x), whereas SI p. 21's Drosophila-inverted l_h = 10 nm (8.18 nm exact) gives 0.553 um
    (0.500 um exact). That Main p. 3's 1.749 um happens to sit near V. cardui's 1.60 um (while
    overpredicting C. eurytheme flat 0.341 um by 5.1x and A. vanillae ridged 0.910 um by 1.9x,
    and while SI's 0.553 um underpredicts V. cardui by 2.9x) is an unconditioned cross-species
    coincidence with zero inputs taken from butterflies.
    (c) Multi-condition/multi-species span with no varying input: d_fig3G_L_mean and
    d_fig3G_L_median_iqr span 5 pupal development fractions and d_fig4C_species_spacings spans 5
    surface/species spacings across a 4.7x range (requiring a quartic 488x span in xi/(D*tau*eta)
