- id: q_main_chi_rho0_inconsistency
  kind: possible_error
  about: [dimensionless_contractility_chi_2d, critical_contractility_2d]
  text: >
    Main text p. 2 (p. 8621) writes the constitutive stress as sigma = chi^0 * rho/rho_0 + eta * d_x v
    (Eq. 2) and the critical threshold without rho_0 as chi_c = (sqrt(eta/tau) + sqrt(D*xi))^2,
    so chi^0 already has units of 2D stress (Pa*m) and chi^0/(xi*D) is dimensionless. Yet p. 2 col 2
    defines the dimensionless contractility as chi = rho_0 * chi^0 / (xi * D), retaining an extraneous
    factor of rho_0 carried over from SI Eq. (4) (sigma = eta*d_x v + chi*rho, where rho_0*chi is the
    active stress). Unless rho is dimensionless, rho_0 * chi^0 / (xi * D) is dimensionally inconsistent
    with Main Eq. (2).
  citation:
    page: 2
    printed_page: "8621"
    quote: "contractility-induced flows favoring the localization of the gel"
    where: text

- id: q_si_two_component_K_swapped
  kind: possible_error
  about: [two_component_reduction_printed, two_component_reduction_corrected]
  text: >
    In SI Section 2.1 (p. 3 / PDF p. 9), substituting m = K*a and rho = a + m = (1+K)*a into Eq. (1)
    gives a = rho/(1+K) and m = K*rho/(1+K). Summing the two conservation equations yields
    D = K*D_m/(1+K) and R(rho) = k_p - k_d*rho/(1+K). The SI prints D = D_m/(1+K) and
    R(rho) = k_p - K*k_d*rho/(1+K), swapping the factor K between the diffusion and depolymerization terms.
  citation:
    page: 9
    printed_page: "SI-3"
    quote: "Defining ρ = a + m, the acto-myosin density, by summing"
    where: SI Section 2.1, Eq. (2)

- id: q_si_eq6_green_kernel_sign
  kind: possible_error
  about: [nonlocal_velocity_kernel_printed, nonlocal_velocity_kernel_corrected]
  text: >
    In SI Section 2.2 (p. 4 / PDF p. 10), the Green's function kernel below Eq. (6) is printed as
    Phi(x, y) = [sinh((x - y - sign(x-y)*l)/L) - sinh((x+y)/L)] / (2*sinh(l/L)). With the minus sign
    before sinh((x+y)/L), Phi(+-l/2, y) != 0 (violating the clamped BC v(+-l/2) = 0 of Eq. 5) and
    integrating against a uniform density rho = rho_0 yields a nonzero velocity
    v_unif(x) = -(chi*rho_0/eta)*L*sinh(x/L)/cosh(l/(2L)) != 0. Changing the sign to +sinh((x+y)/L)
    restores v(+-l/2) = 0, v_unif = 0, and exact equivalence to force balance. In addition, Eq. (6)
    writes Phi((x-y)/L) as a single-argument translation-invariant function inside the integral,
    even though the finite-domain kernel Phi(x, y) depends on both x and y.
  citation:
    page: 10
    printed_page: "SI-4"
    quote: "We have introduced, the kernel Φ which explicitly reads"
    where: SI Eq. (6)

