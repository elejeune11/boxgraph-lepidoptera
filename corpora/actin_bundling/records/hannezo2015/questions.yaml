    does not match Zwicker Eq. (19)'s nonlinear 3D Ostwald-arrest radius R_stab ~ (w*l^2)^(1/3) ~
    k_b^(-1/3) (diagnostic scales_as fails by 1/12 = 0.0833 on all four exponents); (iii) Zwicker's
