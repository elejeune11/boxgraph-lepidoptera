notes: >
  Full quantitative read of Hannezo et al. (PNAS 112, 8620-8625, 2015) covering the main article
  (PDF pp. 1-6), the 19-page SI Appendix (PDF pp. 7-25, SI pp. 1-19), and the 3-page Movie captions SI
  (PDF pp. 26-28). Every printed measurement, literature input, analytical equation, scale definition,
  linear stability relation, weakly nonlinear bifurcation expansion, numerical PDE/continuation model,
  and genetic/pharmacological perturbation is captured. Key mathematical findings uncovered in the
  main text and SI Appendix include: (1) Main text p. 2 retains an extraneous rho_0 factor in
  chi = rho_0*chi^0/(xi*D) inconsistent with Main Eq. [2] sigma = chi^0*rho/rho_0 + eta*d_x v;
  (2) SI Section 2.1 (p. 9) swaps the equilibrium factor K between D = D_m/(1+K) and
  R(rho) = k_p - K*k_d*rho/(1+K); (3) SI Eq. (6) (p. 10) prints -sinh((x+y)/L) instead of +sinh((x+y)/L)
  in the non-local kernel Phi(x, y), violating v(+-l/2) = 0 and generating spurious uniform-gel flow;
  (4) SI Section 2.2 (p. 11) prints 1/q_c = pi*L*(D*tau*xi/eta)^(1/4) with an extraneous factor of pi;
  (5) SI Section 2.6.2 (pp. 18-19) projects Eq. (13) onto the right eigenvector of the non-self-adjoint
  operator L rather than ker(L^*), underestimating pitchfork curvatures chi_i^(2) and chi_c^(2) by
  6x-12x while preserving the tricritical point phi = 1/4 (verified independently by direct steady-state
  numerical continuation); (6) SI Section 2.5 (pp. 15-16) misprints chi_i^(2) for xi = 0 and labels
  Fig. S9 as alpha^2*phi = 10 whereas the plotted bifurcation abscissae match alpha^2*phi = 100;
  (7) SI Section 2.6.4 (p. 21) prints alpha = 5x10^2 (500) and phi = 10^-3 whereas l/L = 10^-5/10^-8 = 1000
  (or 1223 from inverted L = 8.18 nm) and L^2/(D*tau) = 1.67x10^-4, while switching from 2D friction
  (10^9 Pa*s/m, Main p. 3) to 3D per-thickness friction (~10^17 Pa*s/m^2, SI p. 21); and (8) SI Section 2.7
  (pp. 23-24) omits mean subtraction from the printed correlation C = int rho_1*rho_2 / int rho_1^2
  (which cannot vanish at beta = 10^-5 as plotted in Fig. S16).

