# Lengths and geometric quantities
- id: ring_wavelength
  name: actin ring (or taenidial fold) spatial period
  dimension: "[length]"
  description: Center-to-center axial spacing (wavelength lambda or d) between periodic circumferential actin rings or complementary taenidial folds.
- id: hydrodynamic_length
  name: cortical hydrodynamic length scale
  dimension: "[length]"
  description: Length scale l_h = L = sqrt(eta / xi) over which contractile stresses propagate in the cortex before dissipation by substrate friction.
- id: turnover_diffusion_length
  name: turnover-diffusion length scale
  dimension: "[length]"
  description: Length scale l_t = sqrt(D * tau) separating diffusion-dominated (short) and turnover-dominated (long) density relaxation.
- id: critical_inverse_wavenumber
  name: critical inverse wavenumber at instability onset
  dimension: "[length]"
  description: Reciprocal critical wavenumber 1 / q_c at linear instability threshold (SI Section 2.2, p. 11).
- id: cell_length
  name: tracheal cell axial length
  dimension: "[length]"
  description: Axial length l (or L) of a single tracheal epithelial cell along the tube axis.
- id: cortical_thickness
  name: apical actin cortex thickness
  dimension: "[length]"
  description: Thickness h of the apical actomyosin cortex relating 3D and 2D (thickness-integrated) viscosity and friction.
- id: tube_diameter
  name: tracheal tube diameter
  dimension: "[length]"
  description: Diameter of the Drosophila tracheal epithelial tubule.
- id: wavenumber
  name: spatial perturbation wavenumber
  dimension: "1/[length]"
  description: Axial Fourier wavenumber q of a density perturbation.
- id: spatial_coordinate
  name: axial coordinate along cortex
  dimension: "[length]"
  description: Axial position x along the 1D cortical domain [-l/2, l/2].
- id: frap_variance
  name: FRAP spatial profile variance
  dimension: "[length]**2"
  description: Rescaled second moment M_2(t)/M_0(t) of the photobleached fluorescence deficit profile (SI Section 2.6.4).

# Times and rates
- id: turnover_time
  name: actin turnover time
  dimension: "[time]"
  description: Characteristic treadmilling relaxation time tau of filamentous actin in the apical cortex.
- id: diffusion_time_hydrodynamic
  name: hydrodynamic diffusion time scale
  dimension: "[time]"
  description: Characteristic time T = eta / (xi * D) = L^2 / D for diffusion across one hydrodynamic length (SI Section 2.3).
- id: diffusion_time_cell
  name: cell-scale diffusion time
  dimension: "[time]"
  description: Characteristic time l^2 / D for diffusion across the domain length l (SI Section 2.2, p. 12).
- id: time
  name: physical time
  dimension: "[time]"
  description: Physical elapsed time t (incubation, ramp duration, FRAP recovery time, imaging timepoint).
- id: dimensionless_time
  name: dimensionless simulation time
  dimension: "dimensionless"
  description: Dimensionless time t_hat = t / T (or time in unit-parameter simulations of SI Section 2.2).
- id: growth_rate
  name: linear perturbation growth rate
  dimension: "1/[time]"
  description: Exponential growth rate lambda(q) of mode q in linear stability analysis (SI Eq. 7).
- id: depolymerization_rate
  name: actin depolymerization rate
  dimension: "1/[time]"
  description: First-order depolymerization rate k_d or effective single-component decay rate k_d_eff = 1/tau (SI Section 2.1).

# Transport, mechanical, and active-gel parameters
- id: diffusion_coefficient
  name: effective actin diffusion coefficient
  dimension: "[length]**2/[time]"
  description: Effective diffusion coefficient D of cortical actin filaments (or myosin motor thermal diffusivity D_m in SI Section 2.1).
- id: viscosity_2d
  name: two-dimensional cortical viscosity
  dimension: "[mass]/[time]"
  description: Thickness-integrated 2D cortical viscosity eta = eta_3D * h (units Pa*s*m).
- id: viscosity_3d
  name: three-dimensional cortical viscosity
  dimension: "[mass]/([length]*[time])"
  description: Bulk 3D cortical viscosity eta_3D = eta / h (units Pa*s).
- id: friction_2d
  name: two-dimensional cortical friction coefficient
  dimension: "[mass]/([length]**2*[time])"
  description: Effective 2D cortical friction coefficient xi (or zeta) against the apical ECM (units Pa*s/m).
- id: friction_3d
  name: three-dimensional cortical friction coefficient
  dimension: "[mass]/([length]**3*[time])"
  description: Bulk 3D cortical friction coefficient xi_3D = xi / h per unit cortex thickness (units Pa*s/m^2, used in SI p. 15).
- id: active_stress_2d
  name: two-dimensional active contractile stress
  dimension: "[force]/[length]"
  description: Thickness-integrated 2D active contractility parameter chi^0 (Main Eq. 2) or critical threshold chi_c (units Pa*m).
- id: active_stress_3d
  name: three-dimensional active contractile stress
  dimension: "[pressure]"
  description: Bulk 3D active contractile stress rho_0 * chi (units Pa, used in SI p. 15).
- id: cortical_velocity
  name: cortical flow velocity
  dimension: "[length]/[time]"
  description: Axial cortical flow velocity v(x) driven by active stress gradients.
- id: equilibrium_binding_ratio
  name: myosin-actin equilibrium binding ratio
  dimension: "dimensionless"
  description: Dimensionless motor equilibrium ratio K = k_on / k_off in two-component reduction (SI Section 2.1).

# Dimensionless numbers and bifurcation/simulation quantities
- id: rescaled_cell_size
  name: dimensionless cell size alpha
  dimension: "dimensionless"
  description: Ratio alpha = l / l_h = l / L of cell length to cortical hydrodynamic length.
- id: peclet_contractility
  name: dimensionless contractility (Peclet number) chi
  dimension: "dimensionless"
  description: Dimensionless contractility parameter chi = rho_0 * chi_dim / (xi * D) comparing contractile advection to diffusion.
- id: rescaled_turnover
  name: dimensionless turnover parameter phi
  dimension: "dimensionless"
  description: Dimensionless parameter phi = eta / (D * tau * xi) = (l_h / l_t)^2 comparing viscous stress from turnover to diffusive friction.
- id: rescaled_contractility_over_turnover
  name: ratio of contractility to turnover chi/phi
  dimension: "dimensionless"
  description: Ratio chi / phi = rho_0 * chi_dim * tau / eta, remaining finite in the zero-friction limit xi -> 0 (SI Section 2.5, Fig. S9).
- id: squared_cell_to_turnover_length
  name: squared ratio of cell length to turnover length alpha^2*phi
  dimension: "dimensionless"
  description: Combined parameter alpha^2 * phi = l^2 / (D * tau) remaining finite in the zero-friction limit xi -> 0 (SI Section 2.5, Fig. S9).
- id: dimensionless_wavelength
  name: dimensionless pattern wavelength lambda_c / l_h
  dimension: "dimensionless"
  description: Critical pattern wavelength expressed in units of hydrodynamic length l_h (Main Fig. 2D right).
- id: nonlinear_turnover_coeff
  name: quadratic nonlinear turnover coefficient epsilon
  dimension: "dimensionless"
  description: Coefficient epsilon in the quadratic reaction term R(rho) = (rho_0 - rho)/tau - epsilon*(rho_0 - rho)^2 (SI Section 2.2).
- id: mode_index
  name: cosine Fourier mode index
  dimension: "dimensionless"
  description: Integer spatial mode index i (or critical mode i_c, resonance mode i_0) for cos(i*pi*(y+1/2)) on [-1/2, 1/2].
- id: ring_count
  name: number of actin rings per cell
  dimension: "dimensionless"
  description: Number of cortical actin rings per cell (i_c / 2 in linear theory, or steady-state peak count in simulations/experiments).
- id: pitchfork_curvature
  name: pitchfork bifurcation Landau curvature chi^(2)
  dimension: "dimensionless"
  description: Second-order bifurcation coefficient chi_i^(2) or chi_c^(2) in chi = chi^(0) + (eps^2/2) chi^(2); positive is supercritical, negative is subcritical.
- id: pattern_order_parameter
  name: pattern amplitude order parameter S
  dimension: "dimensionless"
  description: Spatial variance order parameter S = int_0^1 (rho - 1)^2 dy tracking ring formation dynamics (SI Section 2.6.5, Fig. S13).
- id: dimensionless_density
  name: dimensionless actin density rho
  dimension: "dimensionless"
  description: Rescaled actin concentration rho_hat = rho / rho_0 (also used for min/max density diagnostics and initial noise amplitude).
- id: peak_change_count
  name: peak creation/annihilation event count
  dimension: "dimensionless"
  description: Count of nonzero dislocation jumps Delta(t) != 0 in peak number over a simulation window (SI Section 2.2).
- id: junction_coupling
  name: intercellular junction stress coupling beta
  dimension: "dimensionless"
  description: Dimensionless coupling coefficient beta relating target actin density to neighboring cell stress (SI Eq. 15, Fig. S16).
- id: noise_intensity
  name: stochastic noise intensity A
  dimension: "dimensionless"
  description: White noise intensity A in coupled two-cell conservation Eq. (16) (SI Section 2.7).
- id: pattern_correlation
  name: intercellular pattern correlation C
  dimension: "dimensionless"
  description: Normalized overlap correlation C(beta) = int rho_1 rho_2 dz / int rho_1^2 dz between neighboring cells (SI Section 2.7, Fig. S16).
- id: friction_anisotropy_ratio
  name: orthoradial-to-axial friction ratio
  dimension: "dimensionless"
  description: Ratio xi_theta / xi_z of circumferential to axial cortical friction in 2D simulations (Main p. 3, Fig. 2E).

# Experimental measurements and conditions
- id: frap_zeroth_moment
  name: normalized FRAP zeroth moment
  dimension: "dimensionless"
  description: Normalized integrated fluorescence deficit M_0(t)/M_0(0) = exp(-t/tau) (SI Section 2.6.4).
- id: immobile_fraction
  name: FRAP immobile actin fraction
  dimension: "dimensionless"
  description: Fraction of cortical actin fluorescence that does not recover after photobleaching (Main p. 3).
- id: fluorescence_intensity
  name: relative actin fluorescence intensity
  dimension: "dimensionless"
  description: Relative cortical actin fluorescence intensity (e.g. Lifeact-mEGFP arbitrary/percent units in Fig. 1A and SI Section 2.6.5).
- id: relative_change
  name: relative fractional change
  dimension: "dimensionless"
  description: Fractional increase or decrease relative to baseline/wild-type (e.g. 0.60 for +60%, -0.20 for 20% smaller).
- id: fold_change
  name: fold change ratio
  dimension: "dimensionless"
  description: Multiplicative ratio relative to wild-type or main trunk (e.g. 10-fold ring spacing in kkv, 3-fold smaller diameter in side branches).
- id: drug_concentration
  name: chemical concentration
  dimension: "[substance]/[length]**3"
  description: Molar concentration of pharmacological inhibitor (Y-27632) or buffer salts (CaCl2, MgCl2).
- id: laser_wavelength
  name: photobleaching laser wavelength
  dimension: "[length]"
  description: Wavelength of the FRAP photobleaching diode laser (SI Section 1.1.2).
- id: laser_power
  name: photobleaching laser power
  dimension: "[power]"
  description: Output power of the FRAP photobleaching diode laser (SI Section 1.1.2).
- id: sample_size
  name: sample count
  dimension: "dimensionless"
  description: Number of rings, cells, tracheas, FRAP traces, or Monte Carlo realizations N.
- id: developmental_stage
  name: developmental stage condition
  dimension: "dimensionless"
  description: Qualitative condition label for Drosophila embryonic or larval developmental stage.
- id: genotype_or_treatment
  name: genetic background or drug treatment condition
  dimension: "dimensionless"
  description: Qualitative condition label for Drosophila genotype, RNAi, or pharmacological perturbation.
- id: dimensionless_domain_length
  name: domain length in unit-parameter chaos simulations
  dimension: "dimensionless"
  description: Domain length l = 200 in unit-parameter simulations of SI Section 2.2 (Figs. S5-S8).
- id: dimensionless_diffusivity_chaos
  name: diffusivity in unit-parameter chaos simulations
  dimension: "dimensionless"
  description: Unit diffusivity D = 1 in unit-parameter simulations of SI Section 2.2 (Figs. S5-S8, where D=tau=eta=rho_0=1).
- id: dimensionless_friction_chaos
  name: friction parameter in unit-parameter chaos simulations
  dimension: "dimensionless"
  description: Friction parameter xi in unit-parameter simulations of SI Section 2.2 (Figs. S5-S8, where D=tau=eta=rho_0=1).
- id: dimensionless_contractility_chaos
  name: contractility parameter in unit-parameter chaos simulations
  dimension: "dimensionless"
  description: Active contractility parameter chi*rho_0 in unit-parameter simulations of SI Section 2.2 (Figs. S5-S8).

# Quantities added for calibrated figure readings
- id: fourier_amplitude
  name: Fourier spectrum amplitude of actin intensity profile
  dimension: "dimensionless"
  description: Normalized Fourier transform amplitude of the axial larval cortical actin intensity profile (Main Fig. 1C).
- id: ring_spacing_probability
  name: discrete ring spacing probability
  dimension: "dimensionless"
  description: Normalized probability fraction of measured actin ring spacings per wavelength bin (Main Fig. 3B left).
- id: wavelength_probability_density
  name: simulated ring wavelength probability density
  dimension: "1/[length]"
  description: Probability density p(lambda) of steady-state simulated actin ring wavelengths (SI Fig. S14, unit 1/um).
- id: condition_index
  name: categorical experimental condition index
  dimension: "dimensionless"
  description: "Integer index labeling categorical genetic/treatment bars in bar charts (Main Fig. 3B right: 1=WT, 2=Src42A, 3=kkv; SI Fig. S2D: 1=WT, 2=Moesin RNAi)."
- id: density_l2_norm
  name: spatial L2 norm of dimensionless actin density
  dimension: "dimensionless"
  description: Spatial L2 norm ||rho||_2 = (int_{-1/2}^{1/2} rho(y)^2 dy)^(1/2) as labeled on the vertical axis of SI Fig. S9.

