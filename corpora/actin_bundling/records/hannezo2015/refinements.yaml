  setting: dt
  factors: [1, 2]
  mode: divide
  output: min_rho
  tolerance: "15%"
  tolerance_basis: "added: verifies positivity and temporal robustness of density trough min(rho) > 0 in the chaotic merging/emerging regime"
  tolerance_added: true

- id: ref_pde_chaos_grid_min_rho
  run: run_pde_chaos_fig_s6
  setting: N_grid
  factors: [1, 2, 4]
  mode: multiply
  output: min_rho
  tolerance: "15%"
  tolerance_basis: "added: verifies spatial resolution convergence of density trough min(rho) > 0 in the chaotic regime"
  tolerance_added: true

- id: ref_pde_stationary_dt_events
  run: run_pde_stationary_fig_s5
  setting: dt
  factors: [1, 2]
