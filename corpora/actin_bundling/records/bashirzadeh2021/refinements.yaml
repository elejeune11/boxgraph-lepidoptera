# Numerical and Monte Carlo convergence refinements for bashirzadeh2021

- id: ref_binder_eq5_grid_bins
  run: run_eq5_binder_2d_grid_printed
  setting: n_bins
  factors: [1, 2, 4, 8]
  mode: multiply
  output: U_4
  tolerance: "1%"
  tolerance_basis: "added: tests whether printed Eq. 5 (with spatial average <>) converges to a grid-independent continuum value as the 2D histogram grid is refined from 20x20 to 160x160."
  tolerance_added: true

- id: ref_binder_sum_variant_grid_bins
  run: run_sum_binder_2d_grid_variant
  setting: n_bins
  factors: [1, 2, 4, 8]
  mode: multiply
  output: U_4
  tolerance: "0.002"
  tolerance_basis: "added: 0.002 absolute tolerance is ~1/4 of the ~0.008 separation between the fascin and alpha-actinin Binder cumulant curves in Fig. 4h (p. 6); tests whether the sum-based variant is independent of the 20x20 bin discretization."
  tolerance_added: true

- id: ref_initial_filament_mc_samples
  run: run_initial_filament_confinement
  setting: n_samples
  factors: [1, 2, 4, 8]
  mode: multiply
  output: mean_U_confine
  tolerance: "5%"
  tolerance_basis: "added: verifies Monte Carlo sampling convergence of the mean t=0 radial confinement energy per filament across 500 to 4000 random initial configurations."
  tolerance_added: true
