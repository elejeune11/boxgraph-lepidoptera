# rather than the wider caption +/- values (resolving q_welch_pvalues_fig4e).
# ---------------------------------------------------------------------------
- id: fig4e_plotted_sem_0_1_10_added
  quantity: bundle_persistence_length_sem
  unit: um
  printed: "7.724"
  basis: "Symmetric error-bar half-width (41.328 - 25.881) / 2 = 7.724 um measured directly from the T-caps of Bar 1 [0:1:10] in digitized fig4e_lp_no_fascin (1200 dpi), ~23% narrower than the Fig. 4e caption's +/-10 um; alternatives bracket pixel-cap reading uncertainty and the caption value."
  alternatives: ["7.2", "8.2", "10"]
  stands_for: "plotted SEM half-width of Fig. 4e Bar 1 [0:1:10]"

