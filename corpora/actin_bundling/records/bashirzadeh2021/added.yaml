# Unstated inputs required by runnable models in bashirzadeh2021 (labelled as added with real alternatives)

- id: kBT_room_temp_added
  quantity: thermal_energy
  unit: pN*um
  printed: "0.00411"
  basis: "Paper gives polymer bending modulus 0.068 pN*um^2 in Supplementary Table 3 (p. 30) without stating simulation temperature or k_B T; 0.00411 pN*um = 4.11 pN*nm is k_B T at standard room temperature T = 298 K (25 degC), yielding standard F-actin L_p ~ 16.5 um."
  alternatives: ["0.00405", "0.00414", "0.00428"]
  stands_for: "k_B T used to convert kappa_b = 0.068 pN*um^2 into single-filament persistence length L_p = kappa_b / (k_B T)"

- id: probe_r_outside_added
  quantity: radial_position
  unit: um
  printed: "16"
  basis: "Probe bead radial distance 1 um outside the confining boundary r_c = 15 um to evaluate the Eq. 3 confinement potential; paper states Eq. 3 symbolically without printing a sample evaluation."
  alternatives: ["15", "15.5", "17"]
  stands_for: "r in Eq. 3"

- id: probe_theta_antiparallel_added
  quantity: filament_pair_angle
  unit: rad
  printed: "3.14159"
  basis: "Antiparallel filament angle theta = pi rad where Eq. 4 alignment penalty reaches its maximum 2 * k_xl^align; paper states Eq. 4 without a sample numerical energy."
  alternatives: ["0", "1.5708"]
  stands_for: "theta in Eq. 4"

- id: probe_xl_distance_added
  quantity: crosslinker_end_to_end_distance
  unit: um
  printed: "0.2"
  basis: "Probe crosslinker end-to-end extension (0.1 um beyond fascin rest length 0.1 um, or 0.3 um compressed relative to alpha-actinin rest length 0.5 um) to evaluate the harmonic crosslinker spring potential."
  alternatives: ["0.1", "0.5", "0.6"]
  stands_for: "crosslinker end-to-end distance d in U_xl^stretch"

- id: probe_zero_energy_added
  quantity: potential_energy
  unit: pN*um
  printed: "0"
  basis: "Reference zero value for unprinted Hamiltonian energy components (U_f^stretch, U_f^bend, U_xl^bind) when assembling total filament and crosslinker potential energies in Eqs. 1 and 2."
  alternatives: ["0.01", "0.1"]
  stands_for: "unstated energy terms in Eqs. 1 and 2"

- id: probe_arc_length_added
  quantity: arc_length
  unit: um
  printed: "10"
  basis: "Contour arc length s = 10 um chosen inside the paper's selected bundle length window 8 < L < 20 um (Methods, p. 8) to evaluate <C(s)> = C_0 exp(-s/L_p')."
  alternatives: ["5", "8", "15", "20"]
  stands_for: "s in <C(s)> = C_0 exp(-s / L_p')"

- id: gaussian_m2_added
  quantity: order_parameter_second_moment
  unit: dimensionless
  printed: "1"
  basis: "Normalized second moment <s^2> = 1 of a standard zero-mean Gaussian distribution N(0, 1) used to test the p. 7 claim that a Gaussian yields U_4 = 1 in Eq. 5."
  alternatives: ["0.5", "2"]
  stands_for: "<s^2> in Eq. 5 for a Gaussian distribution"

- id: gaussian_m4_added
  quantity: order_parameter_fourth_moment
  unit: dimensionless
  printed: "3"
  basis: "Exact fourth moment <s^4> = 3 * <s^2>^2 = 3 of a standard zero-mean Gaussian distribution N(0, 1) used to evaluate Eq. 5."
  alternatives: ["1", "6"]
  stands_for: "<s^4> in Eq. 5 for a Gaussian distribution"

- id: uniform_m4_added
  quantity: order_parameter_fourth_moment
  unit: dimensionless
  printed: "1"
  basis: "Exact fourth moment <s^4> = <s^2>^2 = 1 of a uniform distribution, which achieves the strict Cauchy-Schwarz upper bound U_4 = 2/3 of printed Eq. 5."
  alternatives: ["1.274", "3"]
  stands_for: "<s^4> in Eq. 5 at the Cauchy-Schwarz bound"

- id: pdf_gaussian_sigma_added
  quantity: displacement_stddev
  unit: um
  printed: "3"
  basis: "2D radial Gaussian width sigma = 3 um matching the initial filament center translation standard deviation (p. 9) and yielding peak PDF ~1.66 x 10^-2 um^-2 close to Fig. 4g combined alpha-actinin (1.25 x 10^-2 um^-2); broader alternatives span single-component alpha-actinin (6 um) and fascin (8-12 um)."
  alternatives: ["4", "6", "8", "12"]
  stands_for: "spatial width sigma of a representative 2D crosslinker PDF inside r <= r_c"

- id: hist_domain_width_added
  quantity: simulation_box_length
  unit: um
  printed: "30"
  basis: "The paper specifies 20 bins per dimension for the 2D crosslinker PDF (p. 9) without stating the histogram spatial span; Fig. 4g spans the confining circle diameter 2 * r_c = 30 um (bin width 1.5 um), which matches the Fig. 4g colorbar magnitude ~3e-3 to 1.25e-2 um^-2."
  alternatives: ["15", "100"]
  stands_for: "linear spatial extent of the 20 x 20 2D PDF histogram in Fig. 4g"

- id: hist_uniform_bin_count_added
  quantity: crosslinker_count
  unit: dimensionless
  printed: "1"
  basis: "Representative single-bin count n_ij = 1 in a uniform 20 x 20 circular disk histogram with ~314 occupied bins inside r <= r_c to verify PDF normalization (p. 9)."
  alternatives: ["2", "5"]
  stands_for: "single-bin count in 2D PDF histogram normalization"

- id: hist_uniform_total_count_added
  quantity: crosslinker_count
  unit: dimensionless
  printed: "314"
  basis: "Approximate number of occupied bins inside the r_c = 15 um circle within a 20 x 20 grid over 30 x 30 um (pi/4 * 400 ~ 314) when each occupied bin has count 1."
  alternatives: ["400", "3534"]
  stands_for: "total bound crosslinker count in 2D PDF histogram normalization"

