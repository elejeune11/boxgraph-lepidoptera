  alternatives: ["8.2", "9.0", "9.2"]
  stands_for: "plotted SEM half-width of Fig. 4e Bar 2 [0:3:10]"

- id: fig4e_plotted_sem_1_1_10_added
  quantity: bundle_persistence_length_sem
  unit: um
  printed: "10.379"
