# =============================================================================
# Cross-record ModelAtlas relations for bashirzadeh2021 (13 ready pairs audited)
#
# Pairwise audit summary:
# 1. bashirzadeh2021_code (dinner-group/AFINES@sorting_guv, 2021): 12 verified
#    relations below linking Eqs. 3-4, crosslinker/filament Hookean stretching,
#    Metropolis KMC detailed-balance affinity limit, contour length, WLC L_p,
#    step count, affinity ratio, size ratio, and vesicle crosslinker count.
#    (Initial filament confinement afines_initial_filament_confinement is NOT
#    same_as init_condition_script_adapter due to Uniform(-3,3) vs Gaussian,
#    [0,pi] bend, and shared-arm bugs in the released script.)
# 2. bashirzadeh2021_source_data (Figshare Source Data, 2021): 0 relations
#    (all 7 partner models are software: true discrete-index .xlsx/.mat readers).
# 3. winkelman2016 (Curr. Biol. 2016, ref-9): 0 relations (disjoint 1D lattice
#    domain-length / elongation models vs 2D AFINES confinement/sorting models).
# 4. freedman2019 (PNAS 2019, ref-14): 3 verified relations below (AFINES
#    crosslinker stretch potential SI Eq. 4, filament contour length, WLC L_p).
# 5. freedman2019_code (Simfreed/AFINES@growing_spacer_exv, 2019): 3 verified
#    relations below (contour length, WLC L_p, zero-bending spacer stretch MC).
# 6. claessens2008 (PNAS 2008, ref-39): 1 verified relation below (crosslinker-
#    to-actin molar ratio).
# 7. gov2008 (Phys. Rev. E 2008): 0 relations (disjoint bundle defect-energy
#    and Fokker-Planck radius distribution models).
# 8. haviv2008 (Eur. Biophys. J. 2008, ref-40): 0 relations (disjoint peaked
#    bundle filament-count distribution models).
# 9. liu2008 (Nat. Phys. 2008, ref-20): 0 relations (disjoint membrane-tube
#    Euler buckling and filopodium growth models).
# 10. pelletier2003 (PRL 2003, ref-54): 0 relations (disjoint SAXS Bragg/peak
#     width models).
# 11. graham2023 (Nat. Phys. 2023): 0 relations (filament_flexural_rigidity is
#     the algebraic inverse k_b = L_p*kBT outputting rigidity rather than L_p;
#     droplet ring-rod mechanics are disjoint).
# 12. graham2024 (PNAS 2024): 2 verified relations below (single-filament WLC
#     persistence length L_p = kappa / kBT; crosslinker/VASP-to-actin ratio).
# 13. chandrasekaran2024 (Nat. Commun. 2024): 2 verified relations below
#     (single-filament WLC L_p = kappa / kBT; harmonic crosslinker stretch
#     scales_as LAMMPS dimensionless harmonic bond potential).
# =============================================================================

