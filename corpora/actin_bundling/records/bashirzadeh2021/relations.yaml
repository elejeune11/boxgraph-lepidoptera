  provenance: proposed
  reason: >
    When upstream AFINES's perpendicular crosslinker-filament bending (s_bend = 0) and stale
    bending energy (stale_b_eng = 0) are disabled — the exact limit adopted in bashirzadeh2021's
    AFINES fork — an initially unstretched crosslinker (len_old = l) attaching at separation d
    incurs stretching energy change delE = 0.5 * kappa * (d - l)^2 identical to
    bashirzadeh2021/crosslinker_harmonic_stretch_potential.

