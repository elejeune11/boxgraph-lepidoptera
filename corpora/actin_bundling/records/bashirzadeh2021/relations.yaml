- id: rel_chandrasekaran2024_harmonic_stretch_scales_lammps_bond
  kind: scales_as
  a: bashirzadeh2021/crosslinker_harmonic_stretch_potential
  b: chandrasekaran2024/lammps_harmonic_bond_potential
  mapping:
    K_bond: "(kappa / 2) * (0.03**2 / 0.00411)"
    r: "d / 0.03"
    r0: "l / 0.03"
  output_map:
    U_bond: U_xl_stretch
  regime:
    kappa: [0.1, 5.0]
    l: [0.05, 0.25]
    d: [0.30, 0.70]
  provenance: proposed
  reason: >
    Both coarse-grained actin simulation frameworks model elastic springs via a quadratic
    harmonic potential: AFINES crosslinkers use U_xl^stretch = (1/2) * kappa * (d - l)^2 in
    physical units [pN*um], whereas Chandrasekaran et al. Supplementary Table 1 use LAMMPS
    bond_style harmonic U_bond = K_bond * (r - r0)^2 in dimensionless LJ k_B T units (absorbing
    1/2 into K_bond). Because U_bond is dimensionless while U_xl_stretch carries energy units,
    scales_as verifies exact agreement of the constant log-slope +1 in kappa and the nontrivial
    position-dependent log-slopes 2*d/(d - l) in d and -2*l/(d - l) in l across the strictly
    stretched regime d > l (anchored at Chandrasekaran's sigma = 0.03 um and k_B T = 0.00411 pN*um).
  assumptions:
    - "Strictly stretched regime d > l (l in [0.05, 0.25] um, d in [0.30, 0.70] um) so U > 0 everywhere."
    - "Fixed LJ reference scales sigma = 0.03 um and k_B T = 0.00411 pN*um (constant scale factors leave all log-slopes invariant)."

