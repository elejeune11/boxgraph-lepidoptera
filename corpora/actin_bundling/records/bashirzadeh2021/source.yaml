notes: >
  Complete reading of Bashirzadeh et al. (Communications Biology 4, 1136, 2021; DOI
  10.1038/s42003-021-02653-6), covering the main article and Methods (PDF pp. 1-11) and
  merged Supplemental Information (PDF pp. 12-31, SI pp. 1-20: Supplementary Methods,
  Supplementary Figs. 1-12, Supplementary Tables 1-3, Supplementary References). All
  equations, tables, parameter values, subscripts/superscripts, and figure annotations were
  verified directly against rendered page images (pages/page-NNN.png), resolving OCR
  artifacts including p. 7 "4^9" (value 4 followed by superscript citation ref-9, garbled
  in text/page-007.txt as "49") and p. 9 "k_xl^align = 1/3 pN.um" (stacked fraction 1/3,
  garbled in text/page-009.txt as "13", matching 0.333 pN.um in Supplementary Table 2).

  In scope: (1) Both full many-body simulation frameworks recorded as runnable: false
  (2D AFINES overdamped Langevin + KMC simulation, Eqs. 1-4 and Supplementary Tables 2-3;
  and Cytosim verification simulation, Supplementary Fig. 12); (2) all explicit potential
  energy, statistical, mechanical, kinetic, and data-processing equations stated
  symbolically or in words (Eqs. 1-5, crosslinker stretch spring, 3D orientational
  correlation decay and C0 intercept check, persistence length from polymer bending
  modulus, 2D histogram PDF normalization, crosslinker affinity and size ratios, molar
  ratios, filament contour length, initial filament confinement geometry, step counts,
  vesicle crosslinker counts, cDICE rpm-to-Hz conversion, GUV sample-size bin sums, and
  Welch two-sample unequal-variance t-test on Fig. 4e persistence lengths); (3) a
  corrected variant model for the 2D grid Binder cumulant (sum-instead-of-mean) alongside
  printed Eq. 5, plus grid-resolution and Monte Carlo refinements; (4) within-paper
  ModelAtlas relations; and (5) open questions documenting verified internal discrepancies.

  Left out: non-quantitative molecular biology protocol parameters that feed no model
  (Gibson assembly primer sequences in Supplementary Table 1, protein expression/purification
  buffers, centrifugation speeds, confocal laser exposure times, and Fiji/Squassh/SOAX
  segmentation settings in Supplementary Methods pp. 13-14). External companion code
  (bashirzadeh2021_code) and Figshare source spreadsheets (bashirzadeh2021_source_data) are
  separate downstream BoxGraph records.

