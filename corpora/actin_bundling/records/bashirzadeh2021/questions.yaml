- id: q_audit_reading_standin_models
  kind: reading
  about:
    - binder_cumulant_eq5_2d_grid
    - binder_cumulant_sum_2d_grid
    - cmp_eq5_2d_grid_vs_fig4h_range
    - cmp_sum_variant_2d_grid_vs_fig4h_range
    - afines_initial_filament_confinement
  text: >
    Independent audit reading disagreements with first-reader modeling choices (kept intact per
    audit rules): (1) binder_cumulant_eq5_2d_grid (and its variant binder_cumulant_sum_2d_grid)
    substitutes a reader-chosen truncated radial Gaussian PDF (pdf_gaussian_sigma_added) for the
    unrunnable AFINES simulation output, yet is not marked reconstructed and its comparisons
    against Fig. 4h are tagged purpose: reproduction; furthermore, binder_cumulant_eq5_2d_grid
    averages s^2 and s^4 over all 400 bins of the bounding square [-r_c, r_c]^2 including the
    ~86 zero-valued corner bins outside r <= r_c (shifting U_4 from -3.16 over the disk to
    -4.31 over the square, though the Cauchy-Schwarz bound U_4 <= 2/3 < 0.97 holds
    unconditionally on any domain and is already proven without a stand-in by
    cmp_eq5_binder_uniform_supremum_vs_fig4h); and (2) afines_initial_filament_confinement
    hardcodes the printed bend half-range pi/4 (p. 9) inside model.py rather than declaring it
    as an input port using the unused initial_bend_half_range quantity in quantities.yaml.
  citation:
    page: 9
    printed_page: "9"
    quote: "where s is an order parameter. In our case, s is the value at one point"
    where: "Methods, Simulation methods and analysis (Eq. 5 & initial condition)"

- id: q_digitize_fig4e_errorbars_resolve_welch
  kind: possible_error
  about:
    - fig4e_lp_no_fascin_fig
    - fig4e_lp_plus_fascin_fig
    - supp_fig9c_bundle_lp_fig
    - cmp_fig4e_p_0110_vs_1110_plotted_sems
    - cmp_fig4e_p_1110_vs_1310_plotted_sems
    - cmp_fig4e_p_0310_vs_1310_plotted_sems
    - cmp_supp_fig9c_bar1_vs_lp_1_3_10
  text: >
    Calibrated 1200-dpi digitization of Fig. 4e (fig4e_lp_no_fascin, fig4e_lp_plus_fascin) and
    Supplementary Fig. 9c (supp_fig9c_bundle_lp) resolves q_welch_pvalues_fig4e and exposes an
    error-bar discrepancy between Fig. 4e, its caption, and Supp. Fig. 9c: (1) All five Fig. 4e
    bar heights match the caption means within 0.04-0.30 um (33.60, 39.40, 54.36, 78.01, 99.74 um
    vs caption 33.3, 39.3, 54.2, 77.8, 99.7 um), but the plotted symmetric T-capped error bars on
    three of the four bracketed conditions are strictly narrower than the caption +/- values:
    [0:1:10] plots +/-7.72 um vs caption +/-10 um (-23%); [0:3:10] plots +/-8.69 um vs +/-9 um;
    [1:1:10] plots +/-10.38 um vs +/-11.4 um (-9%); [1:2:10] plots +/-19.07 um vs +/-19 um; and
    [1:3:10] plots +/-14.00 um vs +/-15 um (-7%). (2) Feeding the digitized Fig. 4e plotted SEMs
    into two-sided Welch's t-test (cmp_fig4e_p_*_plotted_sems) reproduces ALL THREE printed
    p-values to ~0.00005: [0:1:10] vs [1:1:10] gives p = 0.11625 vs printed 0.1162 (caption SEMs
    gave 0.1770); [1:1:10] vs [1:3:10] gives p = 0.01258 vs printed 0.0125 (caption SEMs gave
    0.0203); and [0:3:10] vs [1:3:10] gives p = 0.00076 vs printed 0.0008 (caption SEMs gave
    0.00140). Thus the printed Fig. 4e p-values were computed from the same dataset plotted in
    Fig. 4e, whereas the caption +/- numbers are wider. (3) In Supplementary Fig. 9c Bar 1, which
    replots the identical [1:3:10] condition (fascin/actin = 0.1, alpha-actinin/actin = 0.3,
    n = 26), the digitized bar is 99.58 +/- 15.09 um—matching the caption's +/-15 um rather than
    Fig. 4e Bar 5's plotted +/-14.00 um.
  citation:
    page: 7
    printed_page: "7"
    quote: "33.3 ± 10 μm [0:1:10], 39.3 ± 9 μm [0:3:10]"
    where: "Fig. 4e (pp. 6-7) & Supplementary Fig. 9c (p. 25)"

