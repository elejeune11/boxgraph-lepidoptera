  text: >
    Cross-referencing bashirzadeh2021 against its public Figshare Source Data deposit
    (bashirzadeh2021_source_data, DOI 10.6084/m9.figshare.16337442.v1) resolves five open
    paper-only mysteries while exposing pervasive spreadsheet and reporting errors:
    (1) Fig. 4e & Supp. Fig. 9c SEM/Welch resolution (resolves q_welch_pvalues_fig4e &
    q_digitize_fig4e_errorbars_resolve_welch): Fig. 4e's digitized plotted SEMs (7.72, 8.69,
    10.38, 19.07, 14.00 um) match Sheet5's true SEMs SD/sqrt(N) (7.683, 8.688, 10.420, 19.054,
    13.970 um) to <=0.04 um, whereas the caption +/- values (+/-10, +/-11.4, +/-15 um) and
    Supp. Fig. 9c Bar 1 (+/-15.09 um) came from three buggy Excel row-32 formulas:
    A32 = A33/SQRT(13) = 9.995 (N=22), K32 = K33/SQRT(15) = 11.414 (true N=18, not caption 17),
    and X32 = STDEV(X2:X25)/SQRT(24) = 15.026 (omitting X26:X27, N=26). Supp. Fig. 9c [3:3:10]
    has N=15 (95.62 +/- 21.86 um in Sheet5 vs digitized 97.66 +/- 21.79 um), not caption 16.
    Excel ToolPak Welch t-tests on raw Sheet5 reproduce P_PL to 15 digits: 0.116226 (df=33 ->
    0.1162), 0.012547 (df=42 -> 0.0125), and 0.00086695 (df=38 -> truncated to 0.0008, flagged
    not reproduced in cited.yaml).
    (2) Duplicate bundles and length-window violations in Sheet5: [1:3:10] contains 4 full
    reverse-order duplicate (L_p, L) rows plus 1 duplicate value (21 unique of 26; dedup
    103.99 +/- 15.87 um), and [1:1:10] contains 1 duplicate row (17 unique of 18; dedup
    55.61 +/- 10.96 um; deduplicated Welch p = 0.1305, 0.0171, 0.00135). Furthermore, 25/73
    bundles with recorded lengths (34.2%; 20 with L < 8 um down to 4.43 um and 5 with L > 20 um
    up to 52.74 um) violate Methods p. 8's stated "8 < L < 20 um" selection criterion.
    (3) Complete Fig. 1 <-> Fig. 2 p-value swap: Figs_1_and_2_Pvalues.xlsx (Sheets 3-20) proves
    that ALL 9 p-values printed on Fig. 1 (1c, 1d, 1f) came from Fig. 2's alpha-actinin+fascin
    data (Sheets 3-11), and ALL 9 p-values printed on Fig. 2 (2d, 2e, 2f) came from Fig. 1's
    alpha-actinin-only data (Sheets 12-20), plus a 10x typo (Sheet12 0.006397 printed as 0.0006
    on Fig. 2d) and 5 four-decimal truncations.
    (4) Fig. 2b 0.120 bug & Fig. 1-2 NGUVs paradox resolved (resolves q_digitize_fig1b_fig2b_pooled_vs_mean,
    q_fig1f_sample_count_mismatch, q_fig1g_vs_fig1f_aster_count_paradox): In Source_data.xlsx
    Sheet3, cell A6 omits J11, lowering Fig. 2b medium Ring probability from true 23/149 = 0.1544
    (T2) to 17/143 = 0.1189 (A9, matching digitized 0.1197). Fig. 1c/d and 2d/e NGUVs brackets
    are per-replicate total GUV counts across all diameters (plus unused extra blocks 67 and 188
    in Fig. 1), NOT diameter-bin counts; Fig. 1f mis-summed 389+42=431 as 429; Fig. 1g at 0.2
    uses denominator 12 (5/12, 7/12), not caption 14; and Sheet2/Sheet3 add a spurious +1
    denominator in Q43/O44.
    (5) Fig. 3c caption errors & missing simulation data: Sheet4 proves Fig. 3c swaps 87 and 80
    (true: 80 NoFascin>16um, 87=61+26 fascin>16um) and misprints >20 um when Sheet4 analyzes >16 um.
    Finally, ZERO AFINES simulation outputs (Fig. 4g PDFs, Fig. 4h Binder cumulant U_4, Supp. Fig. 11)
    or Cytosim data exist anywhere in the Figshare archive.
