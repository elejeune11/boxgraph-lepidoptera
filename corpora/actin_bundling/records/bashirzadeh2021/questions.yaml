  text: >
    Cross-referencing bashirzadeh2021 against its released AFINES repository
    (bashirzadeh2021_code, dinner-group/AFINES@sorting_guv commit a34e602) resolves the omitted
    parameters of q_afines_not_runnable and the crosslinker count ambiguity of
    q_crosslinker_init_box_and_histogram_domain (N = round(5 * pi * 15^2) = 3,534 per species),
    while exposing severe initial-condition bugs, undisclosed non-default overrides, and missing
    analysis/Cytosim code:
    (1) Shared-arm & bend-angle bug: Instead of independent filaments with half-arm offsets in
    [-pi/4, +pi/4] (mean pi/8 = 0.393 rad, 0% > pi/4; Methods p. 9),
    aster_initial_condition_grid_conda_freeze.py:98-117 draws ang1 and ang2 independently from
    Uniform(0, 2*pi) (yielding bends uniform in [0, pi], mean pi/2 = 1.571 rad, 4x larger, 75% >
    pi/4, up to 84 k_B T per hinge) and alternates resampling ang2 (even ii) and ang1 (odd ii),
    forcing 100% (49/49) of consecutive initial filaments to share an identical arm orientation.
    (2) Uniform(-3, 3) vs Gaussian translation: Lines 111-112 sample xkick, ykick from
    random.uniform(-3, 3) (actual SD = 3/sqrt(3) = 1.732 um, 3x smaller variance) rather than
    the stated Gaussian(0, 3 um), cutting initial beads outside r_c = 15 um from ~18.5% to ~15.4%.
    (3) Non-uniform crosslinker disk sampling: Lines 155-196 draw x ~ U(-r_c, r_c) and
    y | x ~ U(-sqrt(r_c^2 - x^2), sqrt(r_c^2 - x^2)) (only pi/12 = 26.2% fall in the stated
    r_c x r_c box), producing PDF p(x,y) = 1/(4*r_c*sqrt(r_c^2 - x^2)) that depletes center
    density by -21.5% (3.93 vs 5 um^-2), enriches lateral caps |x| > 12 um by +94% (~9.7 um^-2),
    and introduces 3:2 spatial anisotropy (<x^2>/<y^2> = 1.50).
    (4) Undisclosed non-default overrides contradicting Methods p. 9 ("Default values^42 were used
    for all parameters not listed"): steric occlusion --occ 0.15 um (C++ default 0),
    viscosity = 0.01 mg/(um*s) = 0.01 Pa*s (10x C++ default 0.001),
    link_stretching_stiffness = 10 pN/um (10x C++ default 1), a_m_bend = p_m_bend = 0 (C++
    default 0.04; silently allowing same-filament crosslinker binding on different springs in
    src/motor.cpp:696-700), kexv = 0 (default 1.0), temperature = 0.004 pN*um (~290 K, giving
    L_p = 17.0 um), actin_length = 0.5 um, and capture cutoffs 0.063 um. Moreover, standalone
    sorting_kinetics.cfg differs from the paper on four core parameters (r_c = 12 vs 15 um,
    nmonomer = 27 vs 35, densities = 1 vs 5 um^-2), restored only via CLI flags; Eq. 2's
    explicit U_xl^bind potential is absent from C++ (affinity enters strictly kinetically);
    and the generator omits fasc_conc = 0 (cannot produce alpha-actinin-only runs unmodified).
    (5) Missing analysis & Cytosim code: Neither Fig. 4g 2D PDF scripts, Fig. 4h Binder cumulant
    U_4 (Eq. 5) code, nor Supplementary Fig. 12 Cytosim files exist anywhere in the repository,
    leaving q_binder_cumulant_eq5_vs_fig4h_and_prose and q_cytosim_unstated permanently
    unresolvable from public artifacts.
  citation:
    page: 9
    printed_page: "9"
    quote: "of AFINES, including the new features described here, as well as the full configuration"
    where: "Methods, Simulation methods and analysis & Code availability (p. 9)"

