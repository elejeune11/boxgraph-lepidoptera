- id: q_binder_cumulant_eq5_vs_fig4h_and_prose
  kind: possible_error
  about:
    - binder_cumulant_eq5
    - binder_cumulant_eq5_2d_grid
    - binder_cumulant_sum_2d_grid
    - binder_cumulant_gaussian_claim
    - fig4h_binder_range_printed
    - cmp_eq5_binder_gaussian_claim
    - cmp_eq5_binder_uniform_supremum_vs_fig4h
    - cmp_eq5_2d_grid_vs_fig4h_range
    - ref_binder_sum_variant_grid_bins
  text: >
    Three mathematical inconsistencies affect Eq. 5 (p. 9), its prose interpretation (p. 7),
    and Fig. 4h (p. 6): (1) By the Cauchy-Schwarz inequality (<s^4> >= <s^2>^2), printed Eq. 5
    (U_4 = 1 - <s^4>/(3<s^2>^2) where <> denotes a spatial average) obeys a strict upper bound
    U_4 <= 2/3 ~ 0.6667 for every non-zero distribution s, making it mathematically impossible
    for printed Eq. 5 to produce Fig. 4h's plotted range [0.97, 1.0]. (2) Page 7 claims "A
    Binder cumulant value of one indicates that a distribution is close to Gaussian", whereas
    printed Eq. 5 gives U_4 = 1 - 3/3 = 0 for a zero-mean Gaussian (<s^4> = 3<s^2>^2) and
    gives negative values for a centrally peaked non-negative 2D Gaussian PDF on a 20x20 grid
    (e.g., U_4 = -4.305 at sigma = 3 um). (3) Replacing spatial averages <> with unnormalized
    spatial sums (variant binder_cumulant_sum_2d_grid: U_4 = 1 - sum(s^4)/(3*(sum(s^2))^2),
    which suppresses the subtracted term by 1/N = 1/400 on a 20x20 grid) places realistic aster
    PDFs squarely in [0.986, 0.999], matching Fig. 4h; however, grid refinement from 20x20 to
    160x160 (ref_binder_sum_variant_grid_bins) shows that a sum-based cumulant drifts toward 1
    as O(1/N_bins^2), making its plotted numerical scale an artifact of the 20x20 histogram
    discretization rather than an intrinsic continuum quantity.
  citation:
    page: 9
    printed_page: "9"
    quote: "We also compute the Binder cumulant72, a measure of the kurtosis"
    where: "Eq. 5 (p. 9), text (p. 7), Fig. 4h (p. 6)"

- id: q_welch_pvalues_fig4e
  kind: unexplained_difference
  about:
    - welch_two_sample_t_test
    - Lp_0_1_10
    - Lp_0_3_10
    - Lp_1_1_10
    - Lp_1_3_10
    - fig4e_p_0110_vs_1110
    - fig4e_p_1110_vs_1310
    - fig4e_p_0310_vs_1310
    - cmp_fig4e_p_0110_vs_1110
    - cmp_fig4e_p_1110_vs_1310
    - cmp_fig4e_p_0310_vs_1310
  text: >
    Running the stated two-sided unpaired two-sample Student t-test assuming unequal variances
    (Welch's t-test, Methods pp. 8-9) on the means, SEMs, and bundle counts printed in the
    Fig. 4e caption (p. 7) fails to reproduce any of the three p-values printed on Fig. 4e
    (p. 6): [0:1:10] vs [1:1:10] yields p = 0.1770 (rounding range 0.1671-0.1871) vs printed
    0.1162; [1:1:10] vs [1:3:10] yields p = 0.0203 (0.0177-0.0231) vs printed 0.0125; and
    [0:3:10] vs [1:3:10] yields p = 0.00140 (rounding range 0.00095-0.00201) vs printed 0.0008. Equal-variance
    pooled t-tests (p = 0.1763, 0.0341, 0.0080) and one-sided Welch tests (p = 0.0885, 0.0101,
    0.00070) also fail to match all three printed values. Additionally, the Fig. 4e caption does
    not explicitly state whether +/- denotes SEM (stated globally in Methods p. 8 and Supp.
    Fig. 9c), and visual inspection of Fig. 4e (pages/page-006.png) suggests Bar 1's plotted
    error bar (~+/-7.5 um) is narrower than the caption's +/-10 um. Resolution requires checking
    the bundle-level dataset (separate record bashirzadeh2021_source_data).
  citation:
    page: 7
    printed_page: "7"
    quote: "33.3 ± 10 μm [0:1:10], 39.3 ± 9 μm [0:3:10]"
    where: "Fig. 4e (pp. 6-7) & Methods (pp. 8-9)"

- id: q_cdice_rpm_to_hz_error
  kind: possible_error
  about:
    - rotational_frequency_from_rpm
    - cdice_rotation_rpm
    - cdice_rotation_hz_printed
    - cmp_cdice_rotation_hz
  text: >
    Methods (p. 8) states that the cDICE rotor chamber was "rotated at 1200 rpm (60 Hz)^36".
    1200 revolutions per minute equals 1200 / 60 = 20 Hz, not 60 Hz (60 Hz corresponds to
    3600 rpm), a 3-fold unit conversion error.
  citation:
    page: 8
    printed_page: "8"
    quote: "rotated at 1200 rpm (60 Hz)36"
    where: "Methods, GUV generation and microscopy"

- id: q_lp_regression_log_average_misprint
  kind: possible_error
  about: [orientational_correlation_3d, lp_max_abs_ln_C0]
  text: >
    Methods ("Calculation of persistence length", p. 8) writes that linear regression was
    performed on data points "(s, <Ln(C(s))>)" rather than "(s, Ln(<C(s)>))". Because
    C(s) = cos(theta(s)) can take zero or negative values for individual bond pairs (making
    ln(C(s)) undefined) and because E[ln(C)] <= ln(E[C]) by Jensen's inequality, taking the
    ensemble average outside the logarithm does not match the stated exponential decay model
    <C(s)> = C_0 exp(-s/L_p'). This is likely a notational misprint for ln(<C(s)>).
  citation:
    page: 8
    printed_page: "8"
    quote: "we ﬁtted lines by linear regression to data points (s, <Ln(C(s)) >)"
    where: "Methods, Calculation of persistence length"

