- id: q_crosslinker_init_box_and_histogram_domain
  kind: unstated_input
  about:
    - vesicle_crosslinker_count
    - histogram_pdf_normalization
    - hist_domain_width_added
    - sim_crosslinker_density
    - sim_confinement_radius
  text: >
    Two spatial-domain specifications in Methods (p. 9) are ambiguous or unstated: (1) Crosslinker
    initial positions are stated to be drawn uniformly from an "r_c x r_c" box (15 x 15 =
    225 um^2) centered at the origin, while density is stated as "5 um^-2 within the vesicle"
    (circular area pi * r_c^2 = 706.86 um^2 -> ~3534 crosslinkers per species, vs 1125 in an
    r_c x r_c box or 4500 in a 2*r_c x 2*r_c box); (2) the spatial span of the 20x20 2D PDF
    histogram (Fig. 4g) is not printed in text and must be inferred as 2*r_c = 30 um (bin area
    2.25 um^2, uniform circular disk PDF 1.41 x 10^-3 um^-2, consistent with Fig. 4g colorbar
    maxima 3 x 10^-3 to 1.25 x 10^-2 um^-2).
  citation:
    page: 9
    printed_page: "9"
    quote: "Both cross-linkers are simulated at a density of 5 μm−2 within the vesicle"
    where: "Methods, Simulation methods and analysis"

- id: q_filament_length_exceeds_confinement_diameter
  kind: choice
  about:
    - filament_contour_length
    - afines_initial_filament_confinement
    - sim_beads_per_polymer
    - sim_link_length
    - sim_confinement_radius
  text: >
    With 35 beads per polymer and 1 um link length (Supplementary Table 3, p. 30), every
    simulated actin filament has contour length L_f = (35 - 1) * 1 = 34 um, exceeding the
    confining circle diameter 2 * r_c = 30 um. Combined with the Gaussian center-of-mass
    displacement (sigma = 3 um, p. 9), ~18-20% of filament beads start outside r_c = 15 um
    (visibly confirmed in Supplementary Fig. 10a) and experience an immediate large restoring
    energy from Eq. 3 (k_c = 20 pN/um) at t = 0.
  citation:
    page: 30
    printed_page: "SI-19"
    quote: "beads per polymer 35"
    where: "Supplementary Table 3 & Supplementary Fig. 10a"

