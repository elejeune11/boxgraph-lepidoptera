# Open questions, verified discrepancies, unstated inputs, and reading notes for bashirzadeh2021

- id: q_afines_not_runnable
  kind: unstated_input
  about: [afines_crosslinker_sorting_2d, sim_polymer_bending_modulus]
  text: >
    The full 2D AFINES simulation (pp. 7, 9; Eqs. 1-4; Supplementary Tables 2-3) cannot be run
    from the paper alone because several required model parameters are omitted ("Default
    values^42 were used for all parameters not listed"): filament stretching spring constant,
    crosslinker occupancy exclusion distance o_c (explicitly named on p. 9 without any value),
    crosslinker binding capture range and U_xl^bind energy, thermal energy k_B T / temperature,
    solvent viscosity / bead drag coefficient, and KMC kinetic step interval. Full reproduction
    requires the released C++ AFINES repository (separate BoxGraph record bashirzadeh2021_code).
  citation:
    page: 9
    printed_page: "9"
    quote: "Default values42 were used for all parameters not listed"
    where: "Methods, Simulation methods and analysis"

