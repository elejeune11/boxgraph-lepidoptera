- id: q_fig1g_vs_fig1f_aster_count_paradox
  kind: possible_error
  about:
    - fig1_nguv_01_large
    - fig1_nguv_02_large
    - fig1_nguv_03_large
    - fig1g_periph_aster_count_01
    - fig1g_periph_aster_count_02
    - fig1g_periph_aster_count_03
    - fig3c_nguv_alpha_fascin
    - fig3d_nguv_total
  text: >
    Fig. 1g (p. 3) reports "Cumulative (three experiments) ... Number of large GUVs with
    peripheral asters = [35, 14, 53]" (ascending alpha-actinin concentration), whereas Fig. 1c,
    d, f report "NGUVs per experiment" for large (>16 um) GUVs as [23, 38, 128]. At 0.1,
    35 peripheral asters exceeds 23 large GUVs, which is impossible if [23, 38, 128] are totals
    across 3 experiments; conversely, if [23, 38, 128] are per-experiment counts (totals ~69,
    ~114, ~384), then 14/114 = 12% (at 0.2) and 53/384 = 14% (at 0.3) contradict Fig. 1f's
    plotted ~55% and ~63% peripheral aster formation probabilities. Similarly, across Fig. 2d-f
    large (>16 um) alpha-actinin+fascin GUV counts total 29 + 71 + 24 = 124, whereas Fig. 3d
    analyzes 87 GUVs (>16 um) and Fig. 3c analyzes 80 alpha-actinin+fascin GUVs (>20 um),
    leaving how the Fig. 1g and Fig. 3c-d subsets map onto Figs. 1-2 unstated.
  citation:
    page: 3
    printed_page: "3"
    quote: "Number of large GUVs with peripheral asters = [35, 14, 53]"
    where: "Fig. 1f, g captions (p. 3) & Fig. 3c, d captions (p. 5)"

