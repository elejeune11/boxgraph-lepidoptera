- id: q_lp_intercept_abs_misprint
  kind: possible_error
  about: [persistence_length_intercept_amplitude, lp_max_abs_ln_C0]
  text: >
    Methods ("Calculation of persistence length", p. 8) writes "The absolute value of the
    intercept, Ln(|C_0|) for selected bundles was found to be around zero with a maximum of
    0.03". Because the intercept of ln(<C(s)>) = ln(C_0) - s/L_p' is ln(C_0), its absolute
    value is |ln(C_0)| rather than ln(|C_0|) (which is negative whenever 0 < C_0 < 1). This
    misplaced absolute-value notation occurs immediately after the <Ln(C(s))> vs Ln(<C(s)>)
    misprint in the same paragraph.
  citation:
    page: 8
    printed_page: "8"
    quote: "absolute value of the intercept, Ln(|C0|) for selected bundles was found"
    where: "Methods, Calculation of persistence length"

