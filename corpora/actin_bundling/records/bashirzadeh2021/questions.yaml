  text: >
    Cross-record audit of bashirzadeh2021 across its 11 paper/code partners (winkelman2016,
    freedman2019, freedman2019_code, claessens2008, gov2008, haviv2008, liu2008, pelletier2003,
    graham2023, graham2024, chandrasekaran2024) identifies three citation/characterization
    discrepancies and documents why 0 cross-record validations apply in validations.yaml:
    (1) winkelman2016 (ref-9): (a) bashirzadeh2021 p. 2 cites ref-8,9 for "tight parallel actin
    bundles with about 6-nm spacing", whereas Winkelman et al. report ~8 nm interfilament spacing
    by EM and prior literature (d_interfil_fascin_EM, d_interfil_fascin_lit), ~5 nm mean TIRFM
    spacing (one Fig. 4B example = 6 nm), and ~5-6 nm for fascin's molecular diameter;
    (b) p. 9's "~6" size ratio and p. 7's "ratio k_on/k_off for fascin was 40 while that for
    alpha-actinin was 4^9" are not values printed by Winkelman et al. (who actually measured
    nearly equal bundling K_D = 272 vs 290 nM and nearly equal k_off ~ 0.20 vs 0.22-0.25 s^-1,
    tau ~ 5 s; 4 = 0.2/0.05 is Bashirzadeh et al.'s tuned AFINES kinetic ratio).
    (2) haviv2008 (ref-40): p. 3 writes "while the distribution of bundle widths with molar ratio
    of fascin is expected to be exponential^40". Haviv et al. (2008) Eq. 1 instead gives a peaked
    filament-number distribution P(N_b) = R_n exp(2*(k_on/D)*sqrt(N_b) - (k_off/D)*N_b), whose
    large-bundle tail is exponential in filament number N_b ~ D_b^2 (i.e., Gaussian exp(-c D_b^2)
    in bundle width D_b), not exponential in bundle width vs fascin ratio.
    (3) graham2024 false-positive citation pairing: graham2024 cites Wubshet, Bashirzadeh & Liu
    (MBoC 32, 1634-1640, 2021; ref-12 and duplicate ref-44), not Bashirzadeh et al. (Commun. Biol.
    4, 1136, 2021).
    (4) Zero cross-record validations (validations.yaml = []): bashirzadeh2021's full many-body
    AFINES and Cytosim models are runnable: false; its runnable role: model equations compute
    AFINES pair/confinement potentials, t=0 confinement statistics, the Binder cumulant 2/3 bound,
    3D tangent-vector correlation <C(s)>, and single-filament WLC L_p = kappa_b / k_B T. Across all
    13 partners (275 total origin: measured datums), no partner reports bare single-filament L_p
    paired with an independently measured kappa_b, raw <C(s)> vs s curves, or any other observable
    predicted by bashirzadeh2021's runnable models.
  citation:
    page: 3
    printed_page: "3"
    quote: "distribution of bundle widths with molar ratio of fascin is"
    where: "Results (pp. 2-3, 7) & Methods (p. 9)"



