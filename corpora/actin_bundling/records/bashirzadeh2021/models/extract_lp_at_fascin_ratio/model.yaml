id: extract_lp_at_fascin_ratio
name: Extract digitized bundle persistence length at a specified fascin/actin ratio
role: processing
stated:
  none: "Reader curve-lookup helper selecting one bar height from digitized Supp. Fig. 9c persistence-length bars at a specified fascin/actin molar ratio for cross-figure comparison with Fig. 4e."
equation: "L_p = L_p_curve(r_fascin = target_ratio)"
inputs:
  lp_curve: {quantity: bundle_persistence_length, unit: um, curve: {quantity: fascin_to_actin_ratio, unit: dimensionless}}
outputs:
  L_p: {quantity: bundle_persistence_length, unit: um}
settings:
  target_ratio: 0.1
