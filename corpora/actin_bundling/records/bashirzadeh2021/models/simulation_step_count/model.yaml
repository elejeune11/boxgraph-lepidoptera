id: simulation_step_count
name: total integration time steps in one AFINES trajectory
role: processing
stated:
  page: 9
  printed_page: "9"
  quote: "Each simulation ran for 100 s with a time step of 2 × 10−5 s"
  where: "Methods, Simulation methods and analysis & Supplementary Table 3"
equation: "N_steps = t_end / dt"
inputs:
  t_end: {quantity: simulation_time, unit: s}
  dt: {quantity: time_step, unit: s}
outputs:
  N_steps: {quantity: step_count, unit: dimensionless}
settings: {}
from_words: true
stochastic: false
