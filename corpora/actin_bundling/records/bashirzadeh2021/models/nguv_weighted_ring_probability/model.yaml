id: nguv_weighted_ring_probability
name: NGUVs-weighted ring probability aggregated across three crosslinker ratios
role: processing
stated:
  none: "Reader aggregation helper computing the NGUVs-weighted average ring probability across alpha-actinin/actin ratios [0.1, 0.2, 0.3] from digitized Fig. 1c (or Fig. 2d) and printed NGUV counts for comparison with the cumulative probability bars in Fig. 1b (or Fig. 2b)."
equation: "P_ring,pooled(g) = sum_r (N_r,g * P_ring,r(g)) / (100 * sum_r N_r,g)"
inputs:
  ring_01: {quantity: structure_formation_percent, unit: percent, curve: {quantity: guv_size_category, unit: dimensionless}}
  ring_02: {quantity: structure_formation_percent, unit: percent, curve: {quantity: guv_size_category, unit: dimensionless}}
  ring_03: {quantity: structure_formation_percent, unit: percent, curve: {quantity: guv_size_category, unit: dimensionless}}
  N01_1: {quantity: guv_sample_count, unit: dimensionless}
  N01_2: {quantity: guv_sample_count, unit: dimensionless}
  N01_3: {quantity: guv_sample_count, unit: dimensionless}
  N02_1: {quantity: guv_sample_count, unit: dimensionless}
  N02_2: {quantity: guv_sample_count, unit: dimensionless}
  N02_3: {quantity: guv_sample_count, unit: dimensionless}
  N03_1: {quantity: guv_sample_count, unit: dimensionless}
  N03_2: {quantity: guv_sample_count, unit: dimensionless}
  N03_3: {quantity: guv_sample_count, unit: dimensionless}
outputs:
  pooled_ring_prob: {quantity: structure_probability, unit: dimensionless, curve: {quantity: guv_size_category, unit: dimensionless}}
