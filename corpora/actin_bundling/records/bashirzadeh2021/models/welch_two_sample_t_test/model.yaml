id: welch_two_sample_t_test
name: two-sided unpaired two-sample Student t-test assuming unequal variances (Welch's t-test)
role: processing
stated:
  page: 9
  printed_page: "9"
  quote: "performing unpaired two-sample student t-tests assuming unequal variances"
  where: "Methods, Statistics and reproducibility (pp. 8-9) & Fig. 4e"
equation: "t = (mean2 - mean1) / sqrt(sem1^2 + sem2^2); df = (sem1^2 + sem2^2)^2 / (sem1^4/(n1 - 1) + sem2^4/(n2 - 1)); p = 2 * (1 - F_t(|t|, df))"
inputs:
  mean1: {quantity: bundle_persistence_length, unit: um}
  sem1: {quantity: bundle_persistence_length_sem, unit: um}
  n1: {quantity: bundle_sample_count, unit: dimensionless}
  mean2: {quantity: bundle_persistence_length, unit: um}
  sem2: {quantity: bundle_persistence_length_sem, unit: um}
  n2: {quantity: bundle_sample_count, unit: dimensionless}
outputs:
  p_value: {quantity: p_value, unit: dimensionless}
settings: {}
from_words: true
stochastic: false
