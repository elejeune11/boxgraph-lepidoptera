id: afines_initial_filament_confinement
name: stochastic initial filament placement and t=0 radial confinement energy (Methods p. 9 & Eq. 3)
role: model
stated:
  page: 9
  printed_page: "9"
  quote: "The initial condition of the simulation was generated by ﬁrst creating each 35-bead"
  where: "Methods, Simulation methods and analysis & Eq. 3"
equation: "35-bead filament (17 links per arm, link length l_link) with pointed arm at theta_1 ~ U[0, 2*pi], opposite arm at theta_1 + pi + delta (delta ~ U[-pi/4, pi/4]), translated by (dx, dy) ~ N(0, sigma^2); U_confine from Eq. 3"
inputs:
  N_beads: {quantity: beads_per_polymer, unit: dimensionless}
  l_link: {quantity: filament_link_length, unit: um}
  sigma_disp: {quantity: displacement_stddev, unit: um}
  r_c: {quantity: confinement_radius, unit: um}
  k_c: {quantity: confinement_stiffness, unit: pN/um}
outputs:
  frac_outside: {quantity: fraction_beads_outside, unit: dimensionless}
  mean_U_confine: {quantity: potential_energy, unit: pN*um}
settings:
  n_samples: 500
  seed: 42
built_from:
  - afines_confinement_potential_eq3
from_words: true
stochastic: true
