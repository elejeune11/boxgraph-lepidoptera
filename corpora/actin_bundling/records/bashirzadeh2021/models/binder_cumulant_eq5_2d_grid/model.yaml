id: binder_cumulant_eq5_2d_grid
name: printed Eq. 5 Binder cumulant evaluated on a 20x20 2D Gaussian crosslinker PDF inside r <= r_c
role: processing
stated:
  page: 9
  printed_page: "9"
  quote: "where s is an order parameter. In our case, s is the value at one point"
  where: "Eq. 5 & Methods, Simulation methods and analysis"
equation: "U_4 = 1 - mean(s^4) / (3 * mean(s^2)^2) on N_bins x N_bins grid over [-r_c, r_c]^2 for s(r) ~ exp(-r^2/(2*sigma^2)) * 1_{r<=r_c}"
inputs:
  r_c: {quantity: confinement_radius, unit: um}
  sigma: {quantity: displacement_stddev, unit: um}
outputs:
  U_4: {quantity: binder_cumulant, unit: dimensionless}
  peak_pdf: {quantity: spatial_pdf_value, unit: 1/um^2}
settings:
  n_bins: 20
built_from:
  - binder_cumulant_eq5
stochastic: false
