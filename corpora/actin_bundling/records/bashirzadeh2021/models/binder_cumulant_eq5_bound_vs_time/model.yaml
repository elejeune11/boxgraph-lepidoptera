id: binder_cumulant_eq5_bound_vs_time
name: Printed Eq. 5 Binder cumulant Cauchy-Schwarz upper bound (2/3) swept over Fig. 4h simulation times
role: model
built_from:
  - binder_cumulant_eq5
reconstructed: >
  Evaluates the exact unconditional Cauchy-Schwarz supremum U_4,max = 2/3 of printed Eq. 5
  (U_4 = 1 - <s^4> / (3 * <s^2>^2) with <s^4> >= <s^2>^2) across every digitized Fig. 4h
  simulation time point t so all 40 digitized Fig. 4h trajectory values can be tested directly
  against Eq. 5's mathematical ceiling.
stated:
  page: 9
  printed_page: "9"
  quote: "We also compute the Binder cumulant72, a measure of the kurtosis"
  where: "Eq. 5 (p. 9) & Fig. 4h (p. 6)"
equation: "U_4,max(t) = 1 - 1/3 = 2/3"
inputs:
  t: {quantity: simulation_time, unit: s}
outputs:
  U_4: {quantity: binder_cumulant, unit: dimensionless}
