id: afines_confinement_potential_eq3
name: radial harmonic circular confinement potential (Eq. 3)
role: model
stated:
  page: 9
  printed_page: "9"
  quote: "implemented as a radial conﬁnement potential starting at radius"
  where: "Eq. 3"
equation: "U^confine = (1/2) * k_c * (r - r_c)^2 for r >= r_c; 0 for r < r_c"
inputs:
  k_c: {quantity: confinement_stiffness, unit: pN/um}
  r: {quantity: radial_position, unit: um}
  r_c: {quantity: confinement_radius, unit: um}
outputs:
  U_confine: {quantity: potential_energy, unit: pN*um}
settings: {}
stochastic: false
