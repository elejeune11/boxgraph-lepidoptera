id: extract_lp_at_alpha_ratio
name: Extract digitized bundle persistence length at a specified alpha-actinin/actin ratio
role: processing
stated:
  none: "Reader curve-lookup helper selecting one bar height from digitized Fig. 4e persistence-length curves at a specified alpha-actinin/actin molar ratio for direct comparison with the Fig. 4e caption means."
equation: "L_p = L_p_curve(r_alpha = target_ratio)"
inputs:
  lp_curve: {quantity: bundle_persistence_length, unit: um, curve: {quantity: alpha_actinin_to_actin_ratio, unit: dimensionless}}
outputs:
  L_p: {quantity: bundle_persistence_length, unit: um}
settings:
  target_ratio: 0.1
