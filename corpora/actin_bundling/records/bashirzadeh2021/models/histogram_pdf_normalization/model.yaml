id: histogram_pdf_normalization
name: 2D crosslinker histogram probability density normalization
role: processing
stated:
  page: 9
  printed_page: "9"
  quote: "normalized by dividing the value of each bin by the area of the bin and the total"
  where: "Methods, Simulation methods and analysis"
equation: "p_ij = n_ij / ((L_domain / N_bins)^2 * N_total)"
inputs:
  n_bin: {quantity: crosslinker_count, unit: dimensionless}
  N_total: {quantity: crosslinker_count, unit: dimensionless}
  L_domain: {quantity: simulation_box_length, unit: um}
  N_bins: {quantity: histogram_bins_per_axis, unit: dimensionless}
outputs:
  pdf_val: {quantity: spatial_pdf_value, unit: 1/um^2}
settings: {}
from_words: true
stochastic: false
