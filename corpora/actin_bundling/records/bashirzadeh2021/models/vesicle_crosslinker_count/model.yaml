id: vesicle_crosslinker_count
name: number of crosslinkers per species in the 2D circular confining vesicle
role: processing
stated:
  page: 9
  printed_page: "9"
  quote: "Both cross-linkers are simulated at a density of 5 μm−2 within the vesicle"
  where: "Methods, Simulation methods and analysis"
equation: "N_xl = rho_xl * pi * r_c^2"
inputs:
  rho_xl: {quantity: crosslinker_areal_density, unit: 1/um^2}
  r_c: {quantity: confinement_radius, unit: um}
outputs:
  N_xl: {quantity: crosslinker_count, unit: dimensionless}
settings: {}
from_words: true
stochastic: false
