id: extract_bundle_width_at_fascin_ratio
name: Extract bulk actin bundle width at a specified fascin/actin ratio for aster comparison
role: processing
stated:
  none: "Reader curve-lookup helper selecting the bulk fascin-actin bundle width at fascin/actin = target_ratio from digitized Supp. Fig. 7d for direct comparison against encapsulated central aster arm bundle width."
equation: "Delta_bulk(r_fascin = target_ratio)"
inputs:
  width_curve: {quantity: bundle_width, unit: um, curve: {quantity: fascin_to_actin_ratio, unit: dimensionless}}
outputs:
  matched_width: {quantity: bundle_width, unit: um, curve: {quantity: fascin_to_actin_ratio, unit: dimensionless}}
settings:
  target_ratio: 0.1
