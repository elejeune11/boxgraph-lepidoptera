- id: run_eq5_bound_fig4h_combined_alpha
  model: binder_cumulant_eq5_bound_vs_time
  inputs: {}
  sweep: {t: fig4h_combined_alpha_actinin_fig}
  outputs: {U_4: U4_eq5_bound_fig4h_combined_alpha_computed}

- id: run_eq5_bound_fig4h_combined_fascin
  model: binder_cumulant_eq5_bound_vs_time
  inputs: {}
  sweep: {t: fig4h_combined_fascin_fig}
  outputs: {U_4: U4_eq5_bound_fig4h_combined_fascin_computed}

