  inputs:
    mean1: Lp_1_1_10
    sem1: fig4e_plotted_sem_1_1_10_added
    n1: nbundles_1_1_10
    mean2: Lp_1_3_10
    sem2: fig4e_plotted_sem_1_3_10_added
    n2: nbundles_1_3_10
  outputs: {p_value: welch_p_1110_vs_1310_plotted_sems}

- id: run_welch_0310_vs_1310_fig4e_sems
  model: welch_two_sample_t_test
  inputs:
    mean1: Lp_0_3_10
    sem1: fig4e_plotted_sem_0_3_10_added
    n1: nbundles_0_3_10
    mean2: Lp_1_3_10
    sem2: fig4e_plotted_sem_1_3_10_added
    n2: nbundles_1_3_10
  outputs: {p_value: welch_p_0310_vs_1310_plotted_sems}

