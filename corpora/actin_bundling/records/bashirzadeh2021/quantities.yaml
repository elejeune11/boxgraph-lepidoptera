# Quantities declared for bashirzadeh2021 (each physical quantity has a unique meaning and pint dimension)

- id: actin_concentration
  name: actin molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Encapsulated or bulk molar concentration of actin monomers polymerized into F-actin.

- id: alpha_actinin_concentration
  name: alpha-actinin molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of alpha-actinin crosslinkers encapsulated with actin.

- id: fascin_concentration
  name: fascin molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of fascin crosslinkers encapsulated with actin or in bulk.

- id: crosslinker_concentration
  name: generic crosslinker molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of a crosslinking protein (alpha-actinin or fascin) in a molar-ratio calculation.

- id: alpha_actinin_to_actin_ratio
  name: alpha-actinin to actin molar ratio
  dimension: dimensionless
  description: Molar concentration ratio [alpha-actinin]/[actin] (M/M).

- id: fascin_to_actin_ratio
  name: fascin to actin molar ratio
  dimension: dimensionless
  description: Molar concentration ratio [fascin]/[actin] (M/M).

- id: crosslinker_to_actin_ratio
  name: generic crosslinker to actin molar ratio
  dimension: dimensionless
  description: Molar concentration ratio [crosslinker]/[actin] (M/M).

- id: buffer_concentration
  name: buffer or lipid stock molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of buffer salts, ATP, D-glucose, or lipid stock solution.

- id: ph
  name: buffer pH
  dimension: dimensionless
  description: Solution pH of the actin polymerization buffer.

- id: molar_percent
  name: molar or volume percentage
  dimension: dimensionless
  description: Molar percentage of labeled proteins or lipids, or percentage OptiPrep density medium.

- id: guv_diameter
  name: GUV diameter
  dimension: "[length]"
  description: Diameter of a giant unilamellar vesicle (GUV) used for spherical confinement categorization.

- id: crosslinker_length
  name: crosslinker molecular or rest length
  dimension: "[length]"
  description: Physical length/spacing of a crosslinker dimer or resting spring length l in AFINES simulations.

- id: crosslinker_end_to_end_distance
  name: crosslinker end-to-end distance
  dimension: "[length]"
  description: Instantaneous distance d between the two filament-bound heads of a crosslinker spring.

- id: crosslinker_size_ratio
  name: alpha-actinin to fascin length ratio
  dimension: dimensionless
  description: Ratio of alpha-actinin length to fascin length (experimental spacing/dimer length or simulated rest length).

- id: crosslinker_stiffness
  name: crosslinker spring stiffness
  dimension: "[force] / [length]"
  description: Linear harmonic spring constant kappa of a crosslinker in AFINES (pN/um).

- id: crosslinker_on_rate
  name: crosslinker binding on-rate
  dimension: "1 / [time]"
  description: First-order kinetic binding rate k_on of a crosslinker head to F-actin in AFINES (s^-1).

- id: crosslinker_off_rate
  name: crosslinker unbinding off-rate
  dimension: "1 / [time]"
  description: First-order kinetic unbinding rate k_off of a crosslinker head from F-actin in AFINES (s^-1).

- id: crosslinker_affinity_ratio
  name: crosslinker binding rate ratio
  dimension: dimensionless
  description: Dimensionless kinetic ratio k_on / k_off governing equilibrium crosslinker occupancy in AFINES.

- id: alignment_penalty
  name: crosslinker angular alignment penalty constant
  dimension: "[energy]"
  description: Angular alignment penalty constant k_xl^align in Eq. 4 (pN*um), penalizing non-parallel filament binding.

- id: filament_pair_angle
  name: angle between crosslinked filament segments
  dimension: dimensionless
  description: Angle theta (rad) between the springs of two actin filaments connected by a crosslinker in Eq. 4.

- id: confinement_radius
  name: circular confinement radius
  dimension: "[length]"
  description: Radius r_c of the circular confinement boundary mimicking the GUV in 2D AFINES simulations.

- id: radial_position
  name: radial distance from origin
  dimension: "[length]"
  description: Distance r of a filament bead or crosslinker bead from the center (origin) of the confining circle.

- id: confinement_stiffness
  name: radial confinement spring constant
  dimension: "[force] / [length]"
  description: Harmonic confinement force constant k_c in Eq. 3 (pN/um) for beads at r >= r_c.

- id: potential_energy
  name: mechanical or interaction potential energy
  dimension: "[energy]"
  description: Potential energy term in the AFINES Hamiltonian (U_f, U_xl, U^stretch, U^bend, U^bind, U^confine, U^align) in pN*um.

- id: thermal_energy
  name: thermal energy
  dimension: "[energy]"
  description: Thermal energy scale k_B T converting flexural rigidity to persistence length.

- id: simulation_box_length
  name: simulation box or histogram domain width
  dimension: "[length]"
  description: Linear span of the 2D simulation box (X range, Y range) or the 2D PDF histogram window.

- id: filament_link_length
  name: discretized polymer link length
  dimension: "[length]"
  description: Equilibrium distance between adjacent beads along a coarse-grained WLC actin filament in AFINES.

- id: polymer_bending_modulus
  name: polymer bending modulus
  dimension: "[force] * [length] ** 2"
  description: Flexural rigidity (bending modulus kappa_b) of a single coarse-grained actin filament in AFINES (pN*um^2).

- id: filament_contour_length
  name: actin filament or bundle contour length
  dimension: "[length]"
  description: Total contour length L of a simulated 35-bead actin filament or an experimentally skeletonized actin bundle.

- id: arc_length
  name: contour arc length separation
  dimension: "[length]"
  description: Arc length separation s along a skeletonized actin bundle contour in the orientational correlation function <C(s)>.

- id: bundle_persistence_length
  name: actin bundle or filament persistence length
  dimension: "[length]"
  description: Effective persistence length L_p' of an experimentally skeletonized actin bundle or single F-actin filament (um).

- id: bundle_persistence_length_sem
  name: standard error of the mean of bundle persistence length
  dimension: "[length]"
  description: Standard error of the mean (SEM) of measured actin bundle persistence length across N_bundles (um).

- id: orientational_correlation
  name: orientational correlation function
  dimension: dimensionless
  description: Ensemble-averaged tangent-vector cosine correlation <C(s)> = <cos(theta(s))> along an actin bundle.

- id: correlation_intercept
  name: zero-arc-length correlation intercept
  dimension: dimensionless
  description: Prefactor C_0 in the 3D exponential orientational correlation fit <C(s)> = C_0 exp(-s/L_p').

- id: log_correlation_intercept
  name: log intercept magnitude of correlation fit
  dimension: dimensionless
  description: Absolute log intercept |ln(|C_0|)| of linear regression to the orientational correlation function.

- id: r_squared
  name: coefficient of determination
  dimension: dimensionless
  description: Linear regression goodness-of-fit R^2 threshold used to filter skeletonized bundles for L_p calculation.

- id: polymer_count
  name: number of simulated polymers
  dimension: dimensionless
  description: Total number of coarse-grained actin filaments in a 2D AFINES simulation.

- id: beads_per_polymer
  name: beads per simulated polymer
  dimension: dimensionless
  description: Number of discrete beads representing each coarse-grained WLC actin filament.

- id: crosslinker_areal_density
  name: crosslinker 2D areal density
  dimension: "1 / [length] ** 2"
  description: Number of crosslinkers of each species per unit area within the simulated 2D circular vesicle (um^-2).

- id: crosslinker_count
  name: number of crosslinkers
  dimension: dimensionless
  description: Total count of crosslinker molecules (total simulated or bound crosslinkers in a frame or bin).

- id: displacement_stddev
  name: initial filament translation standard deviation
  dimension: "[length]"
  description: Standard deviation of the 2D Gaussian initial center-of-mass translation of filaments in AFINES.

- id: initial_bend_half_range
  name: half-range of initial filament bend angle
  dimension: dimensionless
  description: Half-width (rad) of the uniform interval [-delta_max, +delta_max] for the random bend between the two halves of each initial filament.

- id: fraction_beads_outside
  name: fraction of beads beyond confinement radius
  dimension: dimensionless
  description: Fraction of initial filament beads located at r >= r_c (experiencing non-zero radial confinement force at t = 0).

- id: time_step
  name: simulation integration time step
  dimension: "[time]"
  description: Overdamped Langevin integration step size dt in AFINES simulations.

- id: simulation_time
  name: simulation duration or elapsed time
  dimension: "[time]"
  description: Total simulated duration (end time) or elapsed time of an AFINES or Cytosim trajectory.

- id: step_count
  name: number of simulation time steps
  dimension: dimensionless
  description: Total number of integration time steps t_end / dt in one simulation trajectory.

- id: replicate_count
  name: number of independent replicates
  dimension: dimensionless
  description: Number of independent experiments or independent simulation trajectories averaged.

- id: histogram_bins_per_axis
  name: number of 2D histogram bins per axis
  dimension: dimensionless
  description: Number of spatial bins along each Cartesian axis in the 2D crosslinker PDF histogram.

- id: spatial_pdf_value
  name: 2D spatial probability density function value
  dimension: "1 / [length] ** 2"
  description: Normalized 2D crosslinker spatial probability density s(x, y) in um^-2 integrating to 1 over the domain.

- id: order_parameter_second_moment
  name: second moment of order parameter
  dimension: dimensionless
  description: Dimensionless second moment <s^2> of a normalized order parameter s in Eq. 5.

- id: order_parameter_fourth_moment
  name: fourth moment of order parameter
  dimension: dimensionless
  description: Dimensionless fourth moment <s^4> of a normalized order parameter s in Eq. 5.

- id: binder_cumulant
  name: fourth-order Binder cumulant
  dimension: dimensionless
  description: Fourth-order Binder cumulant U_4 = 1 - <s^4> / (3 <s^2>^2) (Eq. 5) characterizing spatial distribution kurtosis.

- id: rotation_speed_rpm
  name: cDICE rotor rotational speed in rpm
  dimension: "1 / [time]"
  description: Rotational speed of the 3D-printed cDICE rotor chamber expressed in revolutions per minute (rpm).

- id: rotational_frequency
  name: cDICE rotor rotational frequency in Hz
  dimension: "1 / [time]"
  description: Rotational frequency of the cDICE rotor chamber expressed in cycles per second (Hz).

- id: incubation_time
  name: experimental incubation or preparation time
  dimension: "[time]"
  description: Time delay before encapsulation or before confocal imaging of GUVs.

- id: z_step_size
  name: confocal z-stack step size
  dimension: "[length]"
  description: Axial step spacing between consecutive focal planes in confocal z-stack imaging.

- id: guv_sample_count
  name: number of analyzed GUVs
  dimension: dimensionless
  description: Count of GUVs analyzed in a given diameter category or experimental condition.

- id: bundle_sample_count
  name: number of analyzed actin bundles
  dimension: dimensionless
  description: Count of actin bundles analyzed for persistence length (Fig. 4e, Supp. Fig. 9c) or width (Supp. Fig. 7d).

- id: p_value
  name: statistical hypothesis test p-value
  dimension: dimensionless
  description: Two-sided p-value from an unpaired two-sample Student t-test assuming unequal variances (Welch's t-test).

- id: confidence_level
  name: statistical confidence interval level
  dimension: dimensionless
  description: Confidence level (0.95) specified for two-sample unequal-variance Student t-tests.

# ---------------------------------------------------------------------------
# Quantities for calibrated figure readings (Main Figs. 1-4, Supp. Figs. 3, 7, 8, 9)
# ---------------------------------------------------------------------------
- id: guv_size_category
  name: GUV diameter category index
  dimension: dimensionless
  description: Ordinal GUV diameter bin index on figure x-axes (e.g., 1 = 7-12 um, 2 = 12-16 um, 3 = >16 um in Figs. 1b-d, 2b, 2d-e; 1 = 7-16 um, 2 = >16 um in Figs. 1f, 2f; 1 = 16-24 um, 2 = >24 um in Fig. 3d).

- id: crosslinker_condition_index
  name: crosslinker composition category index
  dimension: dimensionless
  description: Categorical index comparing crosslinker conditions on figure x-axes (1 = alpha-actinin alone, 2 = alpha-actinin + fascin in Fig. 3c).

- id: structure_probability
  name: cumulative actin architecture probability
  dimension: dimensionless
  description: Cumulative probability fraction (0 to 1) of GUVs exhibiting a ring, ring/network, or network actin architecture (Figs. 1b, 2b).

- id: structure_formation_percent
  name: actin structure formation percentage
  dimension: dimensionless
  description: Percentage (0-100%) of GUVs forming rings, networks, ring/networks, peripheral/central asters, peripheral bundles, or localized actin clusters (Figs. 1c-d, 1f-g, 2d-f, 3c-d).

- id: normalized_line_position
  name: GUV-diameter-normalized line scan position
  dimension: dimensionless
  description: Spatial distance along a confocal fluorescence line scan divided by GUV diameter (Length / GUV diameter in [0, 1]; Fig. 3b).

- id: line_scan_position
  name: confocal line scan spatial position
  dimension: "[length]"
  description: Spatial distance along a confocal fluorescence line scan across a GUV, actin ring, or single actin bundle (Fig. 4c, Supp. Figs. 7b, 8c, 8e, 9b).

- id: angular_position
  name: angular coordinate around actin aster
  dimension: dimensionless
  description: Azimuthal angle (degrees, 0 to 360) along a circular intensity profile drawn around an encapsulated aster outside the central cluster (Fig. 4d, Supp. Fig. 8b).

- id: fluorescence_intensity
  name: confocal fluorescence intensity (a.u.)
  dimension: dimensionless
  description: Confocal fluorescence intensity in arbitrary units (a.u.) along a line or angular scan (Figs. 3b, 4d, Supp. Figs. 7b, 9b).

- id: normalized_fluorescence_intensity
  name: normalized fluorescence intensity
  dimension: dimensionless
  description: Normalized confocal fluorescence intensity along a line or circular profile across an aster or ring (Fig. 4c, Supp. Figs. 8b, 8c, 8e).

- id: normalized_ring_arclength
  name: normalized actin ring arc length
  dimension: dimensionless
  description: Arc length s along a skeletonized actin ring divided by GUV circumference p (s / p in [0, 1]; Supp. Fig. 3c).

- id: normalized_ring_radius
  name: normalized actin ring radial distance
  dimension: dimensionless
  description: Ratio d / d_avg of radial distance from the ring center of mass to mean ring radius along a skeletonized actin ring (Supp. Fig. 3c).

- id: bundle_width
  name: actin bundle fluorescence profile width
  dimension: "[length]"
  description: Measured maximum distance Delta (um) over which actin fluorescence intensity is detected across a single actin bundle in bulk or central aster arms (Supp. Fig. 7b, 7d).

