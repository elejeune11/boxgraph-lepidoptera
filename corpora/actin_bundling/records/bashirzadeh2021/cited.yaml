# --- Link to winkelman2016 (resolves via data.yaml from_source: ref-9) --------

- datum: fascin_bundle_spacing_exp
  from_datum: d_interfil_fascin_EM
  evidence: >
    Bashirzadeh et al. (p. 2) write "tight parallel actin bundles with about 6-nm spacing^8,9",
    citing Jansen et al. (2011) [ref-8] and Winkelman et al. (2016) [ref-9 / winkelman2016].
    Winkelman et al. report ~8 nm interfilament spacing for fascin bundles both from prior
    literature (p. 6 / 2701, d_interfil_fascin_lit) and by their own EM measurement (p. 7 /
    2702, d_interfil_fascin_EM = "~8" nm), ~5 nm average TIRFM spacing (p. 6,
    d_interfil_fascin_TIRFM; one Fig. 4B example is 6 nm), and ~5-6 nm for fascin's globular
    molecular diameter (p. 3 / 2698, size_fascin_lit). Bashirzadeh et al.'s "about 6-nm spacing"
    appears to conflate fascin's ~5-6 nm molecular diameter (or Fig. 4B's single 6 nm TIRFM
    example) with Winkelman's ~8 nm EM interfilament spacing.

# --- Link to bashirzadeh2021_source_data (Figshare raw P_PL cell) -------------

- datum: fig4e_p_0310_vs_1310
  from_source: bashirzadeh2021_source_data
  from_datum: ppl_p_0310_vs_1310_stored
  evidence: >
    Fig. 4e (p. 6) prints p = 0.0008 for the Welch two-sample t-test comparing [0:3:10] vs
    [1:3:10] bundle persistence lengths. The companion Figshare workbook
    (Fig4e_persistence_length_data.xlsx & Source_data.xlsx, sheet P_PL cell D28) stores
    P(T<=t) two-tail = 0.00086695 (df = 38), exposing that 0.0008 was truncated rather than
    rounded (0.0009).

# --- Links to freedman2019 & freedman2019_code (inherited AFINES parameters) --

- datum: sim_link_length
  from_source: freedman2019
  from_datum: afines_link_length_la
  evidence: >
    Methods (p. 9) states "We used the simulation package AFINES^14,42,43 ... taking cues from
    previous simulations of similar systems^14"; Supplementary Table 3 (p. 30) retains AFINES's
    baseline filament discretization link length 1 um (Freedman et al. 2019 Table S1, l_a = 1 um).

- datum: sim_time_step
  from_source: freedman2019
  from_datum: afines_dt
  evidence: >
    Methods (p. 9) and Supplementary Table 3 (p. 30) retain AFINES's identical overdamped
    Langevin integration time step dt = 2 x 10^-5 s from Freedman et al. (2019) Table S1
    (afines_dt = 0.00002 s).

- datum: sim_alpha_koff
  from_source: freedman2019
  from_datum: afines_k_off_1_long
  evidence: >
    Supplementary Table 2 (p. 29) retains AFINES's baseline alpha-actinin (long crosslinker)
    unbinding rate k_off = 0.05 s^-1 from Freedman et al. (2019) Table S1
    (afines_k_off_1_long = afines_k_off_2_long = 0.05 s^-1).

- datum: sim_polymer_bending_modulus
  from_source: freedman2019_code
  from_datum: cfg_polymer_bending_modulus
  evidence: >
    Supplementary Table 3 (p. 30) retains AFINES's exact single-filament bending modulus
    0.068 pN*um^2 inherited from the upstream AFINES configuration
    (freedman2019_code xlink_sorting_paper/config/grow.cfg:7, cfg_polymer_bending_modulus = 0.068,
    yielding L_p = 0.068 / 0.004 = 17.0 um matching Freedman et al. 2019 p. 16193).
