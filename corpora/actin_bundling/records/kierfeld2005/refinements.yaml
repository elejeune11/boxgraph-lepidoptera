- id: ref_mc_N2_sweeps_energy
  run: run_mc_N2_ref_W7
  setting: n_meas
  factors: [1, 2, 4]
  mode: multiply
  output: energy_per_filament_length
  tolerance: "5%"
  tolerance_basis: "added: comparable to digitized Fig. 3(a) reading interval (~0.13 on -2.5, ~5%)"
  tolerance_added: true

- id: ref_mc_N2_red_sweeps_mean
  run: run_mc_N2_red_ref
  setting: n_meas
  factors: [1, 2, 4]
  mode: multiply
  output: mean_separation
  tolerance: "25%"
  tolerance_basis: "added: statistical sampling tolerance for rare-loop-dominated <|Delta z_12| - l_r> at |W_bar| ~ 7.4"
  tolerance_added: true

- id: ref_mc_N2_rms_sweeps
  run: run_mc_N2_rms_ref
  setting: n_meas
  factors: [1, 2, 4]
  mode: multiply
  output: mean_separation
  tolerance: "25%"
  tolerance_basis: "added: statistical sampling tolerance for rare-loop-dominated RMS separation at |W_bar| ~ 7.4"
  tolerance_added: true
