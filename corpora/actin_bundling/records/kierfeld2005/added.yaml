- id: delta_nnn_pair_contact
  quantity: broken_nearest_neighbor_bonds
  unit: dimensionless
  printed: "1"
  basis: "Near the unbinding transition, p. 3 col 2 states that typical bundle morphologies are governed by pair contacts of filaments (Fig. 1(a)), corresponding to Delta n_nn = 1 lost pair contact per unbinding filament."
  alternatives: ["2", "3"]
  stands_for: "Delta n_nn in W_bar_c(M) for pair-contact morphology near transition"

- id: delta_nnn_hex_half_q
  quantity: broken_nearest_neighbor_bonds
  unit: dimensionless
  printed: "3"
  basis: "P. 3 col 2 assumes Delta n_nn ~ q/2 for a single filament unbinding from a large hexagonal bundle with q = 6 (p. 4 col 1), giving Delta n_nn = 6/2 = 3."
  alternatives: ["1", "2"]
  stands_for: "Delta n_nn ~ q/2 for hexagonal bundle unbinding"

- id: ref_W_bar_7_added
  quantity: dimensionless_potential_strength
  unit: dimensionless
  printed: "7.0"
  basis: "Mid-range bound-state potential strength from Fig. 3(a) (|W_bar| in [5.8, 8.0]) used as the reference test point for Monte Carlo sweep-count convergence refinement."
  alternatives: ["6.0", "8.0"]
  stands_for: "|W_bar| in Fig. 3(a) for MC convergence refinement"

- id: ref_reduced_W_023_added
  quantity: reduced_potential_strength
  unit: dimensionless
  printed: "0.23"
  basis: "Deep-bound reduced potential strength (|W_bar| - |W_bar_c|)/|W_bar| = 0.23 (corresponding to |W_bar| ~ 7.4 for N = 2) from Fig. 3(b), used for MC sweep-count convergence refinement of the separation models."
  alternatives: ["0.18", "0.29"]
  stands_for: "(|W_bar| - |W_bar_c|)/|W_bar| in Fig. 3(b) for MC convergence refinement"

- id: kBT_room_added
  quantity: thermal_energy
  unit: pN*nm
  printed: "4.11"
  basis: "Room-temperature thermal energy T = k_B * 298 K = 4.11 pN*nm for evaluating dimensional F-actin scaling equations (paper works in energy units T without assigning a numeric temperature)."
  alternatives: ["4.0", "4.28"]
  stands_for: "T in Eqs. (1)-(5) and Footnote [16]"

- id: actin_kappa_added
  quantity: bending_rigidity
  unit: pN*nm^2
  printed: "35000"
  basis: "F-actin bending rigidity corresponding to L_p = 2*kappa/T ~ 17 um (p. 1 col 1) at T = 4.11 pN*nm under the paper's L_p = 2*kappa/T convention (70000 pN*nm^2 under standard 3D L_p = kappa/T)."
  alternatives: ["70000"]
  stands_for: "kappa_i for F-actin filaments"

- id: actin_kappa_soft_added
  quantity: bending_rigidity
  unit: pN*nm^2
  printed: "10000"
  basis: "Representative softer third filament bending rigidity kappa_3 < kappa_1 = kappa_2 used to exercise three_filament_reduced_rigidity."
  alternatives: ["2000", "20000"]
  stands_for: "kappa_3 in heterogeneous 3-filament model"

- id: actin_L_added
  quantity: contour_length
  unit: nm
  printed: "5000"
  basis: "Representative F-actin filament contour length L = 5 um < L_p ~ 17 um (p. 1 col 2: contour lengths comparable to or smaller than L_{p,i})."
  alternatives: ["2000", "10000"]
  stands_for: "L in Footnote [16]"

- id: actin_a_par_added
  quantity: segment_length
  unit: nm
  printed: "5.0"
  basis: "Typical actin monomer / cross-linker end-group size a_par ~ 5 nm along F-actin (paper does not assign a physical length to a_par)."
  alternatives: ["2.7", "10.0"]
  stands_for: "a_par in Eqs. (1)-(4)"

- id: actin_n_seg_added
  quantity: segment_count
  unit: dimensionless
  printed: "20"
  basis: "Representative multi-segment count L/a_par = 20 used to contrast verbatim Eq. (4) vs. independent-segment Eq. (4) in the strong-binding regime."
  alternatives: ["10", "100"]
  stands_for: "number of segments L/a_par in Eq. (4)"

- id: actin_la_added
  quantity: potential_range
  unit: nm
  printed: "35"
  basis: "Approximate alpha-actinin cross-linker length l_a ~ 35 nm (paper cites alpha-actinin experiments [4-6] without assigning a numeric l_a in nm)."
  alternatives: ["10", "50"]
  stands_for: "l_a in Eq. (5)"

- id: actin_a_perp_added
  quantity: filament_diameter
  unit: nm
  printed: "7"
  basis: "Standard F-actin filament diameter a_perp ~ 7 nm for evaluating Footnote [16] translational entropy bounds."
  alternatives: ["8", "10"]
  stands_for: "a_perp in Footnote [16]"

- id: compartment_L_perp_added
  quantity: compartment_diameter
  unit: nm
  printed: "1000"
  basis: "Representative 1 um tubular compartment diameter L_perp >> a_perp for evaluating Footnote [16] translational entropy."
  alternatives: ["500", "5000"]
  stands_for: "L_perp in Footnote [16]"

- id: linker_K_added
  quantity: linker_association_constant
  unit: L/mol
  printed: "1 x 10^6"
  basis: "Representative micromolar cross-linker association constant K ~ 1 uM^-1 (e.g. alpha-actinin) to exercise the Langmuir isotherm X_1 = K c_x / (1 + K c_x)."
  alternatives: ["1 x 10^5", "1 x 10^7"]
  stands_for: "K in X_1 = K c_x / (1 + K c_x)"

- id: linker_cx_added
  quantity: linker_solution_concentration
  unit: mol/L
  printed: "1 x 10^-7"
  basis: "Representative dilute cross-linker concentration c_x = 0.1 uM (giving low site occupancy X_1 ~ 0.091) to exercise the low-density linker expansion."
  alternatives: ["1 x 10^-8", "1 x 10^-6"]
  stands_for: "c_x in X_1 = K c_x / (1 + K c_x)"

- id: bare_W_weak_added
  quantity: bare_linker_adhesive_energy_per_length
  unit: pN
  printed: "-0.2"
  basis: "Weakly bound linker energy per length satisfying a_par * |W| / T ~ 0.24 << 1 (p. 2 col 2)."
  alternatives: ["-0.1", "-0.5"]
  stands_for: "W in weak-binding regime |W| << T/a_par"

- id: bare_W_strong_added
  quantity: bare_linker_adhesive_energy_per_length
  unit: pN
  printed: "-2.0"
  basis: "Strongly bound linker energy per length satisfying a_par * |W| / T ~ 2.43 >= 1 (p. 2 col 2)."
  alternatives: ["-1.0", "-4.0"]
  stands_for: "W in strong-binding regime |W| >= T/a_par"

- id: eff_W_bar_bound_added
  quantity: effective_pair_potential_strength
  unit: pN
  printed: "-0.04"
  basis: "Representative bound-phase effective pair attraction W_bar < W_bar_c < 0 just above the unbinding threshold for evaluating rigid-rod attraction J = W_bar_c - W_bar > 0 (p. 4)."
  alternatives: ["-0.03", "-0.06"]
  stands_for: "W_bar in J ~ W_bar_c - W_bar"

- id: crit_W_bar_c_signed_added
  quantity: critical_effective_potential_strength
  unit: pN
  printed: "-0.02"
  basis: "Representative signed critical effective pair potential W_bar_c < 0 (magnitude comparable to Eq. (5) for F-actin) for exercising X_{1,c} = W_bar_c / W and J = W_bar_c - W_bar."
  alternatives: ["-0.01", "-0.05"]
  stands_for: "W_bar_c (signed, < 0) in p. 4 Discussion"
