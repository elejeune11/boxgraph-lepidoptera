# Cross-record validation audit of kierfeld2005 models against independent measurements
# across the four remaining ready Wave 6 partner records (claessens2008, dutta2016,
# gov2008, pelletier2003). (borukhov2005+kierfeld2005 was audited in borukhov2005/.)
#
# Result: 0 physically valid cross-record validations from kierfeld2005 models to measurements
# in these four partner records (and kierfeld2005 itself has 0 origin: measured datums).
# Every pair was audited individually and recorded in kierfeld2005/questions.yaml:
#
# - claessens2008 + kierfeld2005 (see q_claessens2008_cross_audit_and_no_validation):
#   * claessens2008's 26 origin: measured datums are fascin-actin TEM bundle diameters D(R*)
#     (D_fig1c_measured), derived bound ratio vs filament count R*(n_f) (Rstar_figS1_experiment),
#     saturated plateau Rstar_plateau (~0.25), maximum bundle thickness nf_max (~20) and filament
#     width D_fil (~5-6), confined droplet ring-splitting boundaries (ca_fig2e_*), SAXS hexagonal
#     peak q10 (0.585 nm^-1), helical layer lines, SAXS profiles (I_saxs_*), helical overtwist
#     Delta_theta(R*) (Delta_theta_fig3d_*), and fascin+espin diameter ratio (D_ratio_fig4d).
#   * kierfeld2005 models achiral parallel semiflexible filaments with a single discontinuous
#     unbinding transition at X_{1,c}; its true equilibrium above X_{1,c} is a single infinite
#     bundle (no finite equilibrium D(R*) or n_f_max), it has no helical twist, no droplet-ring
#     confinement, and no SAXS model, and claessens2008 does not measure a bundling-onset
#     unbinding threshold X_{1,c}.
#
# - dutta2016 + kierfeld2005 (see q_dutta2016_no_relation_and_no_validation):
#   * Both records are pure theory/simulation papers with 0 origin: measured datums.
#
# - gov2008 + kierfeld2005 (see q_gov2008_cross_audit_and_no_validation):
#   * Both records are pure theory/simulation papers with 0 origin: measured datums.
#
# - kierfeld2005 + pelletier2003 (see q_pelletier2003_no_relation_and_no_validation):
#   * pelletier2003's 24 origin: measured datums are alpha-actinin/G-actin molar-ratio phase and
#     SAXS thresholds (gamma_phase_separation_threshold > 0.01, gamma_saxs_onset = 0.02,
#     gamma_peaks_threshold >= 0.1 at 2.5 mg/ml actin, L = 300 nm), LSCM mesh size (~5 um),
#     bundle diameter (~400 nm), SAXS peaks/widths/intensities (q_1 = 0.19, q_2 = 0.29 nm^-1;
#     dq_1 = 0.056, dq_2 = 0.136 nm^-1; I_q_fig3*), and LSCM junction profiles (I_fl_fig2*).
#   * kierfeld2005's unbinding threshold Eq. (5) (pair_unbinding_threshold_eq5) has
#     prefactor: unknown and outputs |W_bar_c| (pN) rather than total molar ratio gamma;
#     critical_linker_occupancy_weak outputs site occupancy X_{1,c} = W_bar_c/W without stating
#     alpha-actinin's bare energy W, segment length a_par, association constant K, or closed-system
#     depletion conversion to gamma at 60 uM actin. Moreover, pelletier2003 uses short rigid
#     gelsolin-capped filaments (L = 300 nm << L_p ~ 17 um, chosen to minimize fluctuations) in a
#     distorted square lattice (q = 4, d = 33 nm) rather than Kierfeld's long semiflexible
#     hexagonal bundle (q = 6). kierfeld2005 itself explicitly describes agreement with Ref. [5]
#     as solely "qualitative" (Abstract, p. 1 col. 2, p. 4 col. 2).
