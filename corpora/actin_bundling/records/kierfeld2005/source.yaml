notes: >
  In scope: the paper's full analytical theory of cross-linker-mediated bundle unbinding
  (Eqs. 1-5, Langmuir linker occupancy, weak- and strong-binding effective pair interactions,
  3-filament heterogeneous rigidity criterion 8*kappa_123 > kappa_12^r yielding kappa_3 > 0.06*kappa_1,
  N-filament sub-bundle unbinding thresholds, Footnote [15] finite-moment bound, rigid-rod attraction J,
  and Footnote [16] translational entropy and compartment-diameter bound), 14 calibrated 1200-dpi
  figure readings covering all 7 branches of Fig. 3(a) and all 7 branches of Fig. 3(b),
  programmatic extraction of the 5 discontinuous unbinding thresholds |W_bar_c(N)| from Fig. 3(a),
  first-principles Metropolis Monte Carlo simulation of the stated two-filament effective Hamiltonian
  (with sweep-count convergence refinements in refinements.yaml), and analytical hexagonal
  tight-binding/packing baselines for N = 3, 5, 10, 20.
  Left out: Fig. 1 (3D color MC snapshots without numeric axes) and Fig. 2 (schematic diagram),
  documented in figures.md; qualitative power laws with no numeric values or plotted data in the paper
  (second-moment divergence <(|Delta z_12| - l_r)^2> ~ |W_bar - W_bar_c|^(-1) on p. 2, hard-rod
  J* ~ 1/L on p. 4, and no-hard-core |W_bar_c| ~ 1/N on p. 3); and full multi-filament (N >= 3)
  Metropolis MC sweeps across Fig. 3 (exceeding per-call pure-Python runtime budgets; substituted by
  reconstructed hexagonal tight-binding/packing envelopes).
  Key findings verified by the build:
  (1) Reproduction: 8*kappa_123 = kappa_12^r at kappa_1 = kappa_2 yields kappa_3/kappa_1 = 2/31 = 0.0645,
  reproducing printed 0.06; first-principles N = 2 Metropolis MC (with L_p = 2*kappa/T = 200, kappa = 100)
  reproduces Fig. 3(a) mean energy <H>/(NL) on 10/14 digitized points (all bound points |W_bar| in [6.0, 8.0]
  to within 0.01-0.15 plus unbound plateau +1.0, with minor finite-sweep first-order hysteresis at 5.5-5.6).
  (2) Evident misprint on p. 2 col 2 below Eq. (4): exp(-a_par*W_bar/T) = (1 - X_1) + X_1*exp(-a_par*W_bar/T)
  prints W_bar on both sides, forcing W_bar = 0 identically for X_1 < 1 (rel_strong_printed_to_weak fails;
  variant effective_pair_strength_strong_corrected with RHS bare W reduces cleanly to W_bar = X_1*W).
  (3) Formal issues in Eq. (4): occupation-independent V_r is placed inside the X_1-weighted exponential
  and segment sum sum_l is inside the exponential without prod_l outside (rel_eq4_printed_vs_corrected_multiseg
  refuted at all 40 test points, median diff 61.8%), alongside an ordered-vs-unordered pair-sum factor-of-2
  ambiguity relative to Eq. (2) and Fig. 3(a).
  (4) Fig. 3(b) mean vs. RMS separation discrepancy: equilibrated N = 2 MC (refinement settled to 1.2%)
  yields linear mean <|Delta z_12| - l_r> ~ 0.0018 at |W_bar| = 8.0 (~6x smaller than Fig. 3(b) ~0.0118;
  0/9 points reproduced), whereas RMS sqrt(<(|Delta z_12| - l_r)^2>) reproduces 6/9 points (0.0104-0.0566
  vs. 0.0118-0.0618 for x in [0.08, 0.29]), and zero-T hexagonal RMS separation similarly reproduces 9/12
  points of Fig. 3(b) N = 5 vs. 0/12 for linear mean.
  (5) Text contradiction on p. 4 col 1: the text claims equilibrium bundle thickness decreases with increasing N,
  whereas Fig. 3(b) shows compact-branch <Delta z> monotonically increases with N deep in the bound phase
  (0.012 -> 0.190 for N = 2 -> 20), matching hard-core cylindrical geometry R ~ l_r*sqrt(N).
  (6) Large-N threshold saturation: Fig. 3(a) |W_bar_c(N)| drops from 5.70 (N=2) to 4.60 (N=20, ratio 0.807),
  matching finite-N single-pair-contact unbinding (Delta n_nn = 1: 5.70, 5.18, 4.87, 4.69, 4.60) rather than
  hexagonal Delta n_nn = q/2 = 3 (predicting 1.90 or 1.53).
  (7) Compact N = 20 contact frustration: Fig. 3(a) N = 20 compact reaches -12.51 at |W_bar| = 8.0 vs. ideal
  44-contact hexagonal tight-binding energy -17.53 (~29% contact loss at l_a = 0.001 << l_r = 0.1).
