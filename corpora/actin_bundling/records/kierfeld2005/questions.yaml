  text: >
    Eq. (4) on p. 2 col 2 contains three formal inconsistencies relative to Eqs. (1)-(2):
    (1) the hard-core potential V_r, which does not couple to linker occupations n_{i,k} in Eq. (2),
    is placed inside the X_1-weighted exponential, yielding finite Boltzmann weight (1 - X_1)^N
    instead of 0 upon hard-core overlap (V_r = infinity) and erasing steric repulsion at X_1 = 0;
    (2) the segment sum sum_l is placed inside the exponential without a product prod_l outside
    the bracket, treating all segments of filament i as a single global binary variable rather than
    independent lattice-gas sites n_{i,k}, making H_bar_2 non-extensive in L for strong binding;
    (3) the prefactor 1/2 in Eq. (2) matches the stated energy gain |W| and Eq. (4)'s exponent only
    if sum_{i,j} in Eq. (1) sums over ordered pairs (i != j), which would give total pair attraction
    2*W_bar = 2*X_1*W, whereas Eq. (5) and Fig. 3(a) (<H>/(NL) ~ -3.18 at |W_bar| = 8 for N = 2)
    use one copy of W_bar per unordered pair (i < j).
  citation:
