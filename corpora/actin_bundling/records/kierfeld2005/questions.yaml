  text: >
    On p. 2 col 2 (below Eq. 4), the strongly-bound effective pair interaction is printed as
    exp(-a_par * W_bar / T) = (1 - X_1) + X_1 * exp(-a_par * W_bar / T), with effective W_bar
    on both sides rather than bare linker energy W on the right-hand side. Algebraically, the
    printed equation collapses to (1 - X_1) * (exp(-a_par * W_bar / T) - 1) = 0, forcing
    W_bar = 0 identically for all X_1 < 1 and failing to reduce to W_bar = X_1 * W in the weak-binding
    limit (verified by rel_strong_printed_to_weak vs. rel_strong_corrected_to_weak).
