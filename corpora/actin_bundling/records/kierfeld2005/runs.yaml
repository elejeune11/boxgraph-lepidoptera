# 5. Dimensional F-actin analytical model evaluations (Pages 1, 2, 3, 4)
- id: run_factin_persistence_length
  model: persistence_length_def
  inputs: {kappa: actin_kappa_added, T: kBT_room_added}
  outputs: {L_p: factin_Lp_from_kappa}

- id: run_factin_reduced_rigidity_pair
  model: reduced_bending_rigidity_pair
  inputs: {kappa_1: actin_kappa_added, kappa_2: actin_kappa_added}
  outputs: {kappa_r_12: factin_kappa_r12}

- id: run_factin_three_filament_rigidity
  model: three_filament_reduced_rigidity
  inputs: {kappa_1: actin_kappa_added, kappa_2: actin_kappa_added, kappa_3: actin_kappa_soft_added}
  outputs: {kappa_123: factin_kappa_123}

- id: run_factin_subbundle_rigidity
  model: subbundle_reduced_rigidity
  inputs: {M: single_filament_subbundle_M, N: mc_N20, kappa: actin_kappa_added}
  outputs: {kappa_r_M: factin_kappa_r_M1_N20}

- id: run_factin_eq5_dimensional
  model: pair_unbinding_threshold_eq5
  inputs: {T: kBT_room_added, L_p: actin_Lp_reported, l_a: actin_la_added}
  outputs: {W_bar_c: factin_Wc_eq5_dim}

- id: run_factin_linker_occupancy
  model: linker_site_occupancy
  inputs: {K: linker_K_added, c_x: linker_cx_added}
  outputs: {X_1: factin_X1}

- id: run_factin_weak_pair_strength
  model: effective_pair_strength_weak
  inputs: {X_1: factin_X1, W: bare_W_weak_added}
  outputs: {W_bar: factin_W_bar_weak}

- id: run_factin_critical_occupancy_weak
  model: critical_linker_occupancy_weak
  inputs: {W_bar_c: crit_W_bar_c_signed_added, W: bare_W_weak_added}
  outputs: {X_1c: factin_X1c_weak}

- id: run_factin_strong_pair_printed
  model: effective_pair_strength_strong_printed
  inputs: {X_1: factin_X1, W: bare_W_strong_added, a_par: actin_a_par_added, T: kBT_room_added}
  outputs: {W_bar: factin_W_bar_strong_printed}
  note: "Demonstrates that the verbatim printed equation yields W_bar = 0 identically for X_1 < 1."

- id: run_factin_strong_pair_corrected
  model: effective_pair_strength_strong_corrected
  inputs: {X_1: factin_X1, W: bare_W_strong_added, a_par: actin_a_par_added, T: kBT_room_added}
  outputs: {W_bar: factin_W_bar_strong_corrected}
  note: "Corrected RHS bare W yields finite attractive effective strength W_bar < 0."

- id: run_factin_eq4_printed
  model: effective_interaction_eq4_pair_printed
  inputs: {X_1: factin_X1, W: bare_W_strong_added, a_par: actin_a_par_added, n_seg: actin_n_seg_added, T: kBT_room_added}
  outputs: {H_bar_2: factin_H2_eq4_printed}

- id: run_factin_eq4_corrected
  model: effective_interaction_eq4_pair_corrected
  inputs: {X_1: factin_X1, W: bare_W_strong_added, a_par: actin_a_par_added, n_seg: actin_n_seg_added, T: kBT_room_added}
  outputs: {H_bar_2: factin_H2_eq4_corrected}

- id: run_factin_rod_attraction_J
  model: effective_rod_attraction_J
  inputs: {W_bar: eff_W_bar_bound_added, W_bar_c: crit_W_bar_c_signed_added}
  outputs: {J: factin_rod_J}

- id: run_factin_translational_entropy
  model: translational_entropy_fn16
  inputs: {N: mc_N20, a_perp: actin_a_perp_added, L_perp: compartment_L_perp_added}
  outputs: {S_tr: factin_S_tr_N20}

- id: run_factin_entropy_diameter_bound
  model: negligible_entropy_diameter_bound_fn16
  inputs: {a_perp: actin_a_perp_added, N: mc_N20, L: actin_L_added, J: factin_rod_J, q: hexagonal_coordination_q, T: kBT_room_added}
  outputs: {L_perp_max: factin_L_perp_max_N20}

# 6. First-principles Metropolis MC simulation for N = 2 (Fig. 3(a) and Fig. 3(b))
- id: run_mc_fig3a_N2
  model: mc_two_filament_bundle
  inputs:
    L_p: mc_Lp
    L: mc_L
    l_a: mc_la
    l_r: mc_lr
  sweep:
    W_bar: fig3a_N2_mc
  replicates: 3
  outputs:
    energy_per_filament_length: fig3a_N2_mc_pred
    mean_separation: fig3a_N2_sep_pred
  note: "Added numerical choices: n_equil=3000, n_meas=4000 sweeps with 4-sublattice single-bead and multi-scale collective bump/translation moves (paper does not report sweep counts or proposal step sizes)."

- id: run_mc_fig3b_N2_mean
  model: mc_two_filament_bundle_reduced
  inputs:
    W_bar_c: Wc_N2_fig3a
    L_p: mc_Lp
    L: mc_L
    l_a: mc_la
    l_r: mc_lr
  sweep:
    reduced_W: fig3b_N2_mc
  replicates: 3
  outputs:
    mean_separation: fig3b_N2_mean_pred
  note: "Evaluates the captioned observable <|Delta z_12| - l_r> at |W_bar| = |W_bar_c|/(1 - reduced_W)."

- id: run_mc_fig3b_N2_rms
  model: mc_two_filament_bundle_reduced_rms
  inputs:
    W_bar_c: Wc_N2_fig3a
    L_p: mc_Lp
    L: mc_L
    l_a: mc_la
    l_r: mc_lr
  sweep:
    reduced_W: fig3b_N2_mc
  replicates: 3
  outputs:
    mean_separation: fig3b_N2_rms_pred
  note: "Diagnostic variant evaluating RMS separation sqrt(<(|Delta z_12| - l_r)^2>) on the same N = 2 Hamiltonian."

