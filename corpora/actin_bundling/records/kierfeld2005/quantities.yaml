- id: bending_rigidity
  name: filament bending rigidity
  dimension: "[energy] * [length]"
  description: "Bending rigidity kappa_i of a filament, center-of-mass rigidity kappa^c of a sub-bundle, or reduced bending rigidity kappa^r of a relative displacement mode."

- id: bending_rigidity_ratio
  name: bending rigidity ratio
  dimension: "dimensionless"
  description: "Dimensionless ratio of filament bending rigidities, e.g. kappa_2 / kappa_1 or the single-transition threshold kappa_3 / kappa_1."

- id: thermal_energy
  name: thermal energy
  dimension: "[energy]"
  description: "Temperature in energy units, T = k_B T_abs."

- id: persistence_length
  name: persistence length
  dimension: "[length]"
  description: "Filament persistence length L_{p,i} = 2*kappa_i/T or reduced two-filament persistence length L_p = 2*kappa_{12}^r/T."

- id: contour_length
  name: filament projected contour length
  dimension: "[length]"
  description: "Projected length L of each parallel filament along the x axis."

- id: segment_length
  name: cross-linker segment length
  dimension: "[length]"
  description: "Discretization segment length a_|| along the filament, of the order of the cross-linker end-group size."

- id: potential_range
  name: attractive potential well range
  dimension: "[length]"
  description: "Short-range width l_a of the attractive linker-mediated square-well potential V_a(z) outside the hard core."

- id: hard_core_radius
  name: hard-core repulsion radius
  dimension: "[length]"
  description: "Hard-core cutoff radius l_r in V_r(z) = infinity for |z| < l_r (of the order of the filament diameter)."

- id: filament_diameter
  name: single filament diameter
  dimension: "[length]"
  description: "Filament diameter a_perp in the rigid-rod mapping and translational entropy bound (Footnote [16])."

- id: compartment_diameter
  name: confining compartment diameter
  dimension: "[length]"
  description: "Perpendicular diameter L_perp of the tubular compartment confining the N parallel filaments."

- id: linker_solution_concentration
  name: cross-linker concentration in solution
  dimension: "[substance] / [length]**3"
  description: "Bulk molar concentration c_x of cross-linking sticker molecules in the surrounding solution."

- id: linker_association_constant
  name: cross-linker association constant
  dimension: "[length]**3 / [substance]"
  description: "Equilibrium association constant K for binding of one cross-linker end group to a filament segment."

- id: linker_site_occupancy
  name: linker site occupancy
  dimension: "dimensionless"
  description: "Mean cross-linker occupation per filament site, X_1 = <n_{i,k}>_1 = K c_x / (1 + K c_x)."

- id: critical_linker_site_occupancy
  name: critical linker site occupancy
  dimension: "dimensionless"
  description: "Threshold cross-linker concentration per site X_{1,c} at the discontinuous bundle unbinding transition."

- id: bare_linker_adhesive_energy_per_length
  name: bare linker adhesive energy per length
  dimension: "[energy] / [length]"
  description: "Adhesive energy per unit length W (W < 0) gained by a filament end-group binding a cross-linker."

- id: effective_pair_potential_strength
  name: effective pairwise attractive potential strength
  dimension: "[energy] / [length]"
  description: "Effective linker-mediated pair interaction depth W_bar (energy per unit length; W_bar < 0 for attraction)."

- id: critical_effective_potential_strength
  name: critical effective potential strength
  dimension: "[energy] / [length]"
  description: "Critical effective potential strength magnitude |W_bar_c| (or signed W_bar_c) at the unbinding transition."

- id: effective_rod_attraction
  name: effective rigid-rod pairwise attraction per length
  dimension: "[energy] / [length]"
  description: "Effective pairwise attraction per unit length J ~ W_bar_c - W_bar > 0 in the rigid-rod mapping (p. 4)."

- id: interaction_energy
  name: effective interaction Hamiltonian energy
  dimension: "[energy]"
  description: "Total effective interaction energy H_bar_2 obtained after tracing out cross-linkers (Eq. 4)."

- id: filament_count
  name: filament count
  dimension: "dimensionless"
  description: "Number N of parallel filaments in a bundle, or M filaments in an unbinding sub-bundle."

- id: segment_count
  name: filament segment count
  dimension: "dimensionless"
  description: "Number of discretized segments L / a_|| along a filament."

- id: coordination_number
  name: bundle coordination number
  dimension: "dimensionless"
  description: "Number q of nearest neighbors per filament in a packed bundle (q = 6 for hexagonal packing)."

- id: broken_nearest_neighbor_bonds
  name: broken nearest-neighbor pair count
  dimension: "dimensionless"
  description: "Difference Delta n_nn in the number of interacting filament pairs upon separating two sub-bundles."

- id: finite_moment_order_bound
  name: finite separation moment order bound
  dimension: "dimensionless"
  description: "Upper bound m_max = 2(N - 1)(3N - 4)/3 on moment orders m for which <(|Delta z_{ij}| - l_r)^m> stays finite at the transition (Footnote [15])."

- id: dimensionless_entropy
  name: dimensionless translational entropy
  dimension: "dimensionless"
  description: "Translational entropy S_tr (in units of k_B) neglected in the parallel filament model (Footnote [16])."

- id: dimensionless_persistence_length
  name: dimensionless filament persistence length
  dimension: "dimensionless"
  description: "Single-filament persistence length L_p / Delta x in Monte Carlo lattice units (Fig. 3)."

- id: dimensionless_contour_length
  name: dimensionless filament contour length
  dimension: "dimensionless"
  description: "Filament contour length L / Delta x in Monte Carlo lattice units (Fig. 3)."

- id: dimensionless_potential_range
  name: dimensionless attractive potential range
  dimension: "dimensionless"
  description: "Attractive square-well width l_a / Delta x in Monte Carlo lattice units (Fig. 3)."

- id: dimensionless_hard_core_radius
  name: dimensionless hard-core radius
  dimension: "dimensionless"
  description: "Hard-core repulsion radius l_r / Delta x in Monte Carlo lattice units (Fig. 3)."

- id: dimensionless_potential_strength
  name: dimensionless effective potential strength
  dimension: "dimensionless"
  description: "Magnitude of effective pairwise potential strength |W_bar| Delta x / T in Monte Carlo units (Fig. 3(a) x-axis)."

- id: dimensionless_critical_potential_strength
  name: dimensionless critical potential strength
  dimension: "dimensionless"
  description: "Critical effective potential strength magnitude |W_bar_c| Delta x / T at the unbinding transition in Monte Carlo units."

- id: reduced_potential_strength
  name: reduced potential strength
  dimension: "dimensionless"
  description: "Reduced effective potential strength (|W_bar| - |W_bar_c|) / |W_bar| above the unbinding transition (Fig. 3(b) x-axis)."

- id: dimensionless_mean_energy_per_filament_length
  name: dimensionless mean energy per filament length
  dimension: "dimensionless"
  description: "Mean total bundle energy per filament per segment <H> Delta x / (N L T) in Monte Carlo units (Fig. 3(a) y-axis)."

- id: dimensionless_mean_filament_separation
  name: dimensionless mean filament separation
  dimension: "dimensionless"
  description: "Mean interfilament surface separation <Delta z> = <|Delta z_{ij}| - l_r> / Delta x in Monte Carlo units (Fig. 3(b) y-axis)."
