- id: ref-16
  label: "16"
  text: "In the parallel filament model, we neglect the translational entropy S_tr ~ (N - 1) ln(N a_perp^2 / L_perp^2) where a_perp and L_perp are the diameter of a single filament and the system's extension perpendicular to the filaments, respectively. This entropic contribution is, indeed, negligible compared to the binding free energy in the limit of large L provided L_perp << a_perp N^(1/2) e^(L J q / 4T)."
