  note: "Printed large-N scaling W_bar_c ~ 2*W_bar_c_pair/q (prefactor: unknown) at q = 6 gives 5.70/3 = 1.90 vs. extracted Fig. 3(a) N = 20 jump |W_bar_c| = 4.60 (implied prefactor ~2.42, indicating Delta n_nn ~ 1 pair contact rather than q/2 = 3)."

