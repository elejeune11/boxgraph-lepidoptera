# 2. Analytical unbinding threshold models vs. Fig. 3(a) MC transition points
- id: cmp_eq5_lattice_vs_fig3a_N2
  purpose: reproduction
  computed: Wc_N2_eq5_pred
  printed: Wc_N2_fig3a
  note: "Eq. (5) scaling (prefactor: unknown) evaluated at Fig. 3 parameters L_p_rel = L_p/2 = 100 and l_a = 0.001 gives (100)^(-1/3)*(0.001)^(-2/3) = 21.544 vs. extracted Fig. 3(a) N = 2 jump |W_bar_c| = 5.70 (implied dimensionless prefactor ~0.265)."

- id: cmp_large_N_Wc_hex_vs_fig3a_N20
