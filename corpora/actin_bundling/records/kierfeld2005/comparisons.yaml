# 3. Direct Metropolis MC reproduction of Fig. 3(a) and Fig. 3(b) for N = 2
- id: cmp_fig3a_N2_mc
  purpose: reproduction
  computed: fig3a_N2_mc_pred
  printed: fig3a_N2_mc
  note: "First-principles Metropolis MC of the stated two-filament effective Hamiltonian (with L_p = 2*kappa/T = 200) against all 14 digitized points of Fig. 3(a) N = 2."

- id: cmp_fig3b_N2_mc_mean
  purpose: reproduction
  computed: fig3b_N2_mean_pred
  printed: fig3b_N2_mc
  note: "Direct test of the captioned Fig. 3(b) observable <|Delta z_12| - l_r> from the same equilibrated N = 2 MC Hamiltonian that reproduces Fig. 3(a): yields ~5-6x smaller values deep in the bound phase."

- id: cmp_fig3b_N2_mc_rms
  purpose: reproduction
  computed: fig3b_N2_rms_pred
  printed: fig3b_N2_mc
  note: "Diagnostic variant comparing RMS separation sqrt(<(|Delta z_12| - l_r)^2>) against digitized Fig. 3(b) N = 2: closely matches deep-bound points (|W_bar| in [6.5, 8.0])."

