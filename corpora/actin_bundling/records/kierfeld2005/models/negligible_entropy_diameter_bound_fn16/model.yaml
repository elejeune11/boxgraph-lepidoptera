id: negligible_entropy_diameter_bound_fn16
name: compartment diameter upper bound for negligible translational entropy (Footnote 16)
role: model
built_from: [translational_entropy_fn16]
stated:
  page: 4
  printed_page: "038102-4"
  quote: "entropic contribution is, indeed, negligible compared to"
  where: "Ref. [16], p. 4 col 2"
equation: "L_perp_max = a_perp * N^(1/2) * exp(L * J * q / (4 * T))"
inputs:
  a_perp: {quantity: filament_diameter, unit: nm}
  N: {quantity: filament_count, unit: dimensionless}
  L: {quantity: contour_length, unit: nm}
  J: {quantity: effective_rod_attraction, unit: pN}
  q: {quantity: coordination_number, unit: dimensionless}
  T: {quantity: thermal_energy, unit: pN*nm}
outputs:
  L_perp_max: {quantity: compartment_diameter, unit: nm}
settings: {}
stochastic: false
