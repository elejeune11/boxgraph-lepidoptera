id: resample_separation_curve
name: interpolate a Fig. 3(b) separation curve onto a target curve's reduced potential grid
role: processing
stated:
  page: 4
  printed_page: "038102-4"
  quote: "the pronounced rise of the mean separation for"
  where: "text, p. 4 col 1"
equation: "log10(y_interp(x_target)) = linear_interp(log10(source_curve), log10(x_target))"
inputs:
  source:
    quantity: dimensionless_mean_filament_separation
    unit: dimensionless
    curve: {quantity: reduced_potential_strength, unit: dimensionless}
  target:
    quantity: dimensionless_mean_filament_separation
    unit: dimensionless
    curve: {quantity: reduced_potential_strength, unit: dimensionless}
outputs:
  resampled:
    quantity: dimensionless_mean_filament_separation
    unit: dimensionless
    curve: {quantity: reduced_potential_strength, unit: dimensionless}
settings: {}
stochastic: false
