id: resample_energy_curve
name: interpolate a Fig. 3(a) energy curve onto a target curve's |W_bar| grid
role: processing
stated:
  page: 4
  printed_page: "038102-4"
  quote: "energy per filament which approaches the N"
  where: "text, p. 4 col 1"
equation: "y_interp(x_target) = linear_interp(source_curve, x_target) over overlapping |W_bar|"
inputs:
  source:
    quantity: dimensionless_mean_energy_per_filament_length
    unit: dimensionless
    curve: {quantity: dimensionless_potential_strength, unit: dimensionless}
  target:
    quantity: dimensionless_mean_energy_per_filament_length
    unit: dimensionless
    curve: {quantity: dimensionless_potential_strength, unit: dimensionless}
outputs:
  resampled:
    quantity: dimensionless_mean_energy_per_filament_length
    unit: dimensionless
    curve: {quantity: dimensionless_potential_strength, unit: dimensionless}
settings: {}
stochastic: false
