id: subbundle_unbinding_threshold_large_N
name: critical potential strength for unbinding an M-filament sub-bundle (N >> M)
role: model
prefactor: unknown
built_from: [pair_unbinding_threshold_eq5, subbundle_reduced_rigidity]
stated:
  page: 3
  printed_page: "038102-3"
  quote: "we find that they unbind at a"
  where: "text, p. 3 col 1 bottom"
equation: "W_bar_c(M) ~ W_bar_c_pair * M^(-1/3) / Delta_n_nn(M)"
inputs:
  W_bar_c_pair: {quantity: dimensionless_critical_potential_strength, unit: dimensionless}
  M: {quantity: filament_count, unit: dimensionless}
  Delta_n_nn: {quantity: broken_nearest_neighbor_bonds, unit: dimensionless}
outputs:
  W_bar_c: {quantity: dimensionless_critical_potential_strength, unit: dimensionless}
settings: {}
stochastic: false
