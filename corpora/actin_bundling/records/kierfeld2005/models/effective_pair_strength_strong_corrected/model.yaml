id: effective_pair_strength_strong_corrected
name: effective pair interaction strength for strongly bound linkers (corrected RHS W)
role: model
variant_of: effective_pair_strength_strong_printed
corrections:
  - equation: "p. 2 col 2 inline equation below Eq. (4)"
    change: "Replace RHS W_bar with bare linker adhesive energy W: exp(-a_par * W_bar / T) = (1 - X_1) + X_1 * exp(-a_par * W / T)."
    evidence: "The printed equation places W_bar on both sides, algebraically forcing (1 - X_1) * (exp(-a_par * W_bar / T) - 1) = 0 and thus W_bar = 0 identically for all X_1 < 1; replacing RHS W_bar with bare W follows directly from the grand-canonical linker Boltzmann factor in Eq. (4) and reduces to the paper's weak-binding formula W_bar = X_1 * W as |W| << T / a_par."
stated:
  page: 2
  printed_page: "038102-2"
  quote: "tive part of the effective pair interaction is given by"
  where: "text below Eq. 4, p. 2 col 2"
equation: "exp(-a_par * W_bar / T) = (1 - X_1) + X_1 * exp(-a_par * W / T)"
inputs:
  X_1: {quantity: linker_site_occupancy, unit: dimensionless}
  W: {quantity: bare_linker_adhesive_energy_per_length, unit: pN}
  a_par: {quantity: segment_length, unit: nm}
  T: {quantity: thermal_energy, unit: pN*nm}
outputs:
  W_bar: {quantity: effective_pair_potential_strength, unit: pN}
settings: {}
stochastic: false
