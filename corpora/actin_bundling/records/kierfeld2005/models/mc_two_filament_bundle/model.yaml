id: mc_two_filament_bundle
name: Monte Carlo simulation of two parallel semiflexible filaments (effective Hamiltonian)
role: model
from_words: true
stated:
  page: 3
  printed_page: "038102-3"
  quote: "we have performed extensive MC simu-"
  where: "Monte Carlo simulations, p. 3 col 2 & Fig. 3"
equation: "H = sum_{i=1}^2 H_{b,i} + H_bar_2; H_b = (kappa/2) * sum_k |z_{k+1} - 2 z_k + z_{k-1}|^2; V = V_r + V_bar_a"
inputs:
  W_bar: {quantity: dimensionless_potential_strength, unit: dimensionless}
  L_p: {quantity: dimensionless_persistence_length, unit: dimensionless}
  L: {quantity: dimensionless_contour_length, unit: dimensionless}
  l_a: {quantity: dimensionless_potential_range, unit: dimensionless}
  l_r: {quantity: dimensionless_hard_core_radius, unit: dimensionless}
outputs:
  energy_per_filament_length: {quantity: dimensionless_mean_energy_per_filament_length, unit: dimensionless}
  mean_separation: {quantity: dimensionless_mean_filament_separation, unit: dimensionless}
settings:
  n_equil: 3000
  n_meas: 4000
  seed: 1
stochastic: true
