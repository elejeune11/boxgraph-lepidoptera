id: mc_two_filament_bundle_reduced_rms
name: Monte Carlo RMS separation sqrt(<(|Delta z_12| - l_r)^2>) vs reduced potential strength (N = 2, diagnostic variant)
role: model
from_words: true
built_from: [mc_two_filament_bundle]
variant_of: mc_two_filament_bundle_reduced
corrections:
  - equation: "Fig. 3(b) caption: <Delta z> = <|Delta z_ij| - l_r>"
    change: "Compute root-mean-square separation sqrt(<(|Delta z_12| - l_r)^2>) instead of linear mean <|Delta z_12| - l_r>."
    evidence: "Equilibrium Metropolis MC of the stated effective Hamiltonian reproduces Fig. 3(a) energy <H>/(NL) to ~1-2% across |W_bar| in [5.8, 8.0], yet yields linear mean <|Delta z_12| - l_r> ~ 0.0019 at |W_bar| = 8.0 (~6x smaller than Fig. 3(b) ~0.0118), whereas the RMS separation sqrt(<(|Delta z_12| - l_r)^2>) ~ 0.011-0.025 matches Fig. 3(b) closely for |W_bar| in [6.5, 8.0]."
stated:
  page: 3
  printed_page: "038102-3"
  quote: "mean filament separation"
  where: "Fig. 3(b) caption, p. 3"
equation: "Delta_z_rms = sqrt(<(|Delta z_12| - l_r)^2>) evaluated at |W_bar| = |W_bar_c| / (1 - reduced_W)"
inputs:
  reduced_W: {quantity: reduced_potential_strength, unit: dimensionless}
  W_bar_c: {quantity: dimensionless_critical_potential_strength, unit: dimensionless}
  L_p: {quantity: dimensionless_persistence_length, unit: dimensionless}
  L: {quantity: dimensionless_contour_length, unit: dimensionless}
  l_a: {quantity: dimensionless_potential_range, unit: dimensionless}
  l_r: {quantity: dimensionless_hard_core_radius, unit: dimensionless}
outputs:
  mean_separation: {quantity: dimensionless_mean_filament_separation, unit: dimensionless}
settings:
  n_equil: 3000
  n_meas: 4000
  seed: 1
stochastic: true
