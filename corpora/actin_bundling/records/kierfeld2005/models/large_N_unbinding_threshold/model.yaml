id: large_N_unbinding_threshold
name: N-independent critical unbinding potential strength for large bundles
role: model
prefactor: unknown
built_from: [subbundle_unbinding_threshold_large_N]
stated:
  page: 3
  printed_page: "038102-3"
  quote: "For large N, this leads"
  where: "text, p. 3 col 2 top"
equation: "W_bar_c ~ 2 * W_bar_c_pair / q"
inputs:
  W_bar_c_pair: {quantity: dimensionless_critical_potential_strength, unit: dimensionless}
  q: {quantity: coordination_number, unit: dimensionless}
outputs:
  W_bar_c: {quantity: dimensionless_critical_potential_strength, unit: dimensionless}
settings: {}
stochastic: false
