id: linker_site_occupancy
name: Langmuir cross-linker occupancy per filament site
role: model
stated:
  page: 2
  printed_page: "038102-2"
  quote: "determined by the concentration of linkers in solution by"
  where: "text below Eq. 4, p. 2 col 2"
equation: "X_1 = K * c_x / (1 + K * c_x)"
inputs:
  K: {quantity: linker_association_constant, unit: L/mol}
  c_x: {quantity: linker_solution_concentration, unit: mol/L}
outputs:
  X_1: {quantity: linker_site_occupancy, unit: dimensionless}
settings: {}
stochastic: false
