id: pair_unbinding_threshold_eq5_lattice
name: two-filament unbinding threshold (Eq. 5) in Monte Carlo lattice units
role: model
prefactor: unknown
built_from: [pair_unbinding_threshold_eq5]
stated:
  page: 2
  printed_page: "038102-2"
  quote: "The unbinding of two filaments was shown to occur at a"
  where: "Eq. 5, p. 2 col 2"
equation: "|W_bar_c| * Delta_x / T ~ (L_p_single / 2)^(-1/3) * l_a^(-2/3)"
inputs:
