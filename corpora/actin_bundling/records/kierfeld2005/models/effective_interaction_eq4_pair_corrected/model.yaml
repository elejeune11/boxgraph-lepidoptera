id: effective_interaction_eq4_pair_corrected
name: effective two-filament bound-pair Hamiltonian from Eq. (4) (independent-segment trace)
role: model
variant_of: effective_interaction_eq4_pair_printed
corrections:
  - equation: "Eq. 4"
    change: "Move the segment product prod_l outside the grand-canonical trace bracket (and factor the occupation-independent hard-core potential V_r outside the trace): exp(-H_bar_2 / T) = exp(-sum_{i,j} sum_l a_par V_r / T) * prod_i prod_l [(1 - X_1) + X_1 * exp(-sum_{j!=i} a_par V_a / T)]."
    evidence: "In Eqs. (1)-(2), linker occupations n_{i,k} at distinct segments k = 1..L/a_par are independent and V_r does not couple to n_{i,k}; moving sum_l inside the exponential makes the pair energy non-extensive in L and breaks the segment-level strongly-bound relation below Eq. (4), while placing V_r inside the X_1-weighted exponential gives finite overlap energy -N T ln(1 - X_1) instead of infinity when V_r = infinity."
stated:
  page: 2
  printed_page: "038102-2"
  quote: "In the limit of low linker densities we find"
  where: "Eq. 4, p. 2 col 2"
equation: "exp(-H_bar_2 / T) = prod_i prod_l [(1 - X_1) + X_1 * exp(-sum_{j!=i} a_par * V_a / T)] (for V_r = 0)"
inputs:
  X_1: {quantity: linker_site_occupancy, unit: dimensionless}
  W: {quantity: bare_linker_adhesive_energy_per_length, unit: pN}
  a_par: {quantity: segment_length, unit: nm}
  n_seg: {quantity: segment_count, unit: dimensionless}
  T: {quantity: thermal_energy, unit: pN*nm}
outputs:
  H_bar_2: {quantity: interaction_energy, unit: pN*nm}
settings: {}
stochastic: false
