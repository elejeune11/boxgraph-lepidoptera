id: effective_pair_strength_strong_printed
name: effective pair interaction strength for strongly bound linkers (as printed)
role: model
stated:
  page: 2
  printed_page: "038102-2"
  quote: "tive part of the effective pair interaction is given by"
  where: "text below Eq. 4, p. 2 col 2"
equation: "exp(-a_par * W_bar / T) = (1 - X_1) + X_1 * exp(-a_par * W_bar / T)"
inputs:
  X_1: {quantity: linker_site_occupancy, unit: dimensionless}
  W: {quantity: bare_linker_adhesive_energy_per_length, unit: pN}
  a_par: {quantity: segment_length, unit: nm}
  T: {quantity: thermal_energy, unit: pN*nm}
outputs:
  W_bar: {quantity: effective_pair_potential_strength, unit: pN}
settings: {}
stochastic: false
