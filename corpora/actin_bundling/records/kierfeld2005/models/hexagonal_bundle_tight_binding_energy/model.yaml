id: hexagonal_bundle_tight_binding_energy
name: tight-binding hexagonal-contact bundle energy envelope
role: model
reconstructed: "Full multi-filament (N = 3, 5, 10, 20) Metropolis MC sweeps across Fig. 3(a) exceed per-call runtime budgets in pure Python and the paper omits its MC step-size and sweep-count protocol; this analytical tight-binding envelope evaluates the paper's effective Hamiltonian on an ideal compact hexagonal bundle (q = 6, p. 4 col 1) with equipartition bending modes."
stated:
  page: 4
  printed_page: "038102-4"
  quote: "roughly cylindrical bundle with a hexagonal"
  where: "text, p. 4 col 1"
equation: "<H>/(NL) = 1 for |W_bar| < |W_bar_c|; -(n_contacts(N)/N)*|W_bar| + E_bend(N) for |W_bar| >= |W_bar_c|"
inputs:
  N: {quantity: filament_count, unit: dimensionless}
  W_bar: {quantity: dimensionless_potential_strength, unit: dimensionless}
  W_bar_c: {quantity: dimensionless_critical_potential_strength, unit: dimensionless}
  L: {quantity: dimensionless_contour_length, unit: dimensionless}
outputs:
  energy_per_filament_length: {quantity: dimensionless_mean_energy_per_filament_length, unit: dimensionless}
settings: {}
stochastic: false
