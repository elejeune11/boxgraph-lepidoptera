id: translational_entropy_fn16
name: neglected translational entropy of N parallel filaments (Footnote 16)
role: model
prefactor: unknown
stated:
  page: 4
  printed_page: "038102-4"
  quote: "In the parallel filament model, we neglect the translational"
  where: "Ref. [16], p. 4 col 2"
equation: "S_tr ~ (N - 1) * ln(N * a_perp^2 / L_perp^2)"
inputs:
