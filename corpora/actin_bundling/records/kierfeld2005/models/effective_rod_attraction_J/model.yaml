id: effective_rod_attraction_J
name: effective pairwise attraction per length in the rigid-rod mapping
role: model
prefactor: unknown
stated:
  page: 4
  printed_page: "038102-4"
  quote: "pairwise attraction (per length) J is given by the bundling"
  where: "Discussion, p. 4 col 1-2"
equation: "J ~ W_bar_c - W_bar > 0 for |W_bar| > |W_bar_c|, J = 0 for |W_bar| < |W_bar_c|"
inputs:
  W_bar: {quantity: effective_pair_potential_strength, unit: pN}
  W_bar_c: {quantity: critical_effective_potential_strength, unit: pN}
outputs:
  J: {quantity: effective_rod_attraction, unit: pN}
settings: {}
stochastic: false
