- id: rel_claessens2008_bound_ratio_reduces_to_langmuir
  kind: reduces_to
  a: claessens2008/effective_bound_ratio
  b: kierfeld2005/linker_site_occupancy
  output_map:
    X_1: R_star
  mapping:
    K: "1e6 / K_d"
    c_x: "R * c_a * 1e-6"
  limit:
    c_a: "0"
  regime:
    R: [0.2, 5.0]
    K_d: [0.2, 1.0]
    c_a: [10.0, 100.0]
  tolerance: 1.0e-4
  provenance: proposed
  reason: >
    Claessens et al. (2008, p. 4 Methods, citing Kierfeld et al. 2005 as ref-26 on p. 1 col. 2)
    compute the bound cross-linker-to-actin molar ratio R* from the exact closed-system
    (canonical) 1:1 mass-action equilibrium (c_f - c_b)*(c_a - c_b)/c_b = K_d, giving
    R* = (1/2)*[(1 + R + K_d/c_a) - sqrt((1 + R + K_d/c_a)^2 - 4*R)] with R = c_f/c_a.
    Kierfeld et al. (2005, p. 2 col. 2) model single-filament cross-linker adsorption in the
    grand-canonical reservoir ensemble as X_1 = K*c_x / (1 + K*c_x) with association constant
    K = 1/K_d (1e6/K_d in L/mol for K_d in uM) and bulk linker concentration c_x = c_f = R*c_a
    (R*c_a*1e-6 in mol/L). In the dilute-actin / zero-depletion limit c_a -> 0 (c_a << K_d so
    c_{f,free} = c_f - R*c_a -> c_f), Claessens's canonical bound fraction R* reduces to
    Kierfeld's grand-canonical Langmuir occupancy X_1.
  assumptions:
    - "1:1 binding-site stoichiometry per actin monomer as assumed in Claessens's p. 4 mass-action equation"
    - "Dilute-actin reservoir limit c_a << K_d so cross-linker depletion by filaments vanishes (c_{f,free} -> c_f = R*c_a)"
    - "Tolerance 1e-4 reflects the IEEE-754 cancellation floor of Claessens's un-rationalized b - sqrt(b^2 - 4R) formula at c_a = 1e-6 uM (b ~ 10^6)"

- id: rel_claessens2008_bound_ratio_approx_langmuir
  kind: approximated_by
  a: claessens2008/effective_bound_ratio
  b: kierfeld2005/linker_site_occupancy
  output_map:
    X_1: R_star
  mapping:
    K: "1e6 / K_d"
    c_x: "R * c_a * 1e-6"
  regime:
    R: [50.0, 500.0]
    K_d: [0.3, 1.0]
    c_a: [0.001, 0.01]
  tolerance: 0.01
  provenance: proposed
  reason: >
    Complements rel_claessens2008_bound_ratio_reduces_to_langmuir by testing Claessens et al.
    (2008) canonical R* against Kierfeld et al. (2005) grand-canonical X_1 = K*c_x/(1 + K*c_x)
    across the full nonlinear Langmuir saturation crossover (K*c_x = R*c_a/K_d in [0.05, 16.7],
    X_1 in [0.05, 0.94]) in the dilute-actin regime c_a in [0.001, 0.01] uM << K_d in [0.3, 1.0] uM.
    Analytically, |R* - X_1|/X_1 <= (c_a/K_d)/(1 + K*c_x)^2 < 0.01 throughout this crossover,
    whereas in Claessens's actual experimental regime (c_a = 0.1-3 mg/ml ~= 2.4-71 uM >> K_d = 0.3 uM)
    fascin depletion causes X_1(c_f) to exceed R* by 2x-8x.
  assumptions:
    - "Dilute-actin crossover regime c_a << K_d with large stoichiometric excess R = c_f/c_a in [50, 500] so K*c_x = R*c_a/K_d spans the nonlinear Langmuir knee"
    - "1:1 monomer site stoichiometry matching Claessens's p. 4 mass-action derivation"

- id: rel_gov2008_langmuir_binding_energy
  kind: scales_as
  a: gov2008/binding_energy_vs_concentration
  b: kierfeld2005/linker_site_occupancy
  output_map:
    X_1: eps_b
  mapping:
    K: "exp(eps)"
    c_x: "c"
  regime:
    c: [1.0e-5, 1.0e-1]
    eps: [2.0, 12.0]
  provenance: proposed
  reason: >
    Both Gov (2008, p. 4 col. 1, citing Kierfeld et al. 2005 as ref-22 for filament entanglement
    in thick bundles) and Kierfeld et al. (2005, p. 2 col. 2) model equilibrium cross-linker
    adsorption onto actin filaments with the identical two-state Langmuir isotherm:
    X_1 = K*c_x / (1 + K*c_x) in Kierfeld (with weak-binding effective pair adhesion energy
    W_bar = X_1*W directly proportional to X_1) and eps_b ~ c*exp(eps)/(1 + c*exp(eps)) in Gov
    (prefactor: unknown, carrying adhesion-energy-per-length unit pN). Identifying the
    dimensionless association constant K*c_0 = exp(eps) and standard-state concentration
    c_x/c_0 = c, both functions share identical log-slopes in (c, eps) across both the linear
    dilute regime (c*exp(eps) << 1) and the saturated occupancy regime (c*exp(eps) >> 1).
    (Note that Gov assumes linear proportionality eps_b ~ X_1 even at large binding energies eps,
    whereas Kierfeld p. 2 col. 2 shows strong binding a_par*|W|/T >= 1 yields a logarithmic
    grand-canonical relation W_bar = -(T/a_par)*ln[(1 - X_1) + X_1*exp(-a_par*W/T)].)
  assumptions:
    - "Standard-state concentration normalization c_0 = 1 mol/L so K = exp(eps) [L/mol] and c_x = c [mol/L] give K*c_x = c*exp(eps)"
    - "Weak-binding linear proportionality between adhesion energy per length (eps_b or |W_bar|) and single-filament site occupancy X_1"

