# ==========================================================================
# Experimental sample concentrations, assay conditions, and imaging parameters
# ==========================================================================

- id: actin_molar_concentration
  name: total actin monomer molar concentration
  dimension: "[substance] / [length]**3"
  description: "Total monomeric actin concentration in the experimental assay."

- id: actin_unlabeled_concentration
  name: unlabeled actin monomer molar concentration
  dimension: "[substance] / [length]**3"
  description: "Molar concentration of unlabeled monomeric actin added to the sample."

- id: actin_labeled_concentration
  name: fluorescently labeled actin monomer molar concentration
  dimension: "[substance] / [length]**3"
  description: "Molar concentration of TMR-labeled monomeric actin added to the sample."

- id: filamin_mole_fraction
  name: filamin-to-actin mole fraction
  dimension: "dimensionless"
  description: "Molar ratio (mol %) of filamin cross-linker to actin monomers."

- id: capping_protein_mole_fraction
  name: capping-protein-to-actin mole fraction
  dimension: "dimensionless"
  description: "Molar ratio (mol %) of capping protein to actin monomers controlling filament length."

- id: myosin_molar_concentration
  name: skeletal muscle myosin II molar concentration
  dimension: "[substance] / [length]**3"
  description: "Molar concentration of skeletal muscle myosin II monomers added to the assay."

- id: methylcellulose_weight_fraction
  name: base methylcellulose weight fraction
  dimension: "dimensionless"
  description: "Base weight percent (wt %) of methylcellulose depletion agent in the tactoid assay."

- id: methylcellulose_added_weight_fraction
  name: additional methylcellulose weight fraction
  dimension: "dimensionless"
  description: "Additional weight percent (wt %) of methylcellulose added to crowd actin into a thin nematic layer."

- id: methylcellulose_total_weight_fraction
  name: total methylcellulose weight fraction
  dimension: "dimensionless"
  description: "Total weight percent (wt %) of methylcellulose in the thin actin nematic layer assay."

- id: atp_molar_concentration
  name: ATP molar concentration
  dimension: "[substance] / [length]**3"
  description: "Molar concentration of ATP in the final experimental assay buffer."

- id: temperature
  name: ambient experimental temperature
  dimension: "[temperature]"
  description: "Ambient laboratory temperature during vesicle preparation and experiments."

- id: nematic_layer_thickness
  name: thin actin nematic layer thickness
  dimension: "[length]"
  description: "Thickness of the crowded actin nematic layer at the passivated surface."

- id: z_slice_averaging_width
  name: confocal z-slice averaging strip width
  dimension: "[length]"
  description: "Width of the strip centered at the tactoid midplane averaged along the minor axis for z-reslicing."

# ==========================================================================
# Filament and motor geometry
# ==========================================================================

- id: actin_filament_length
  name: F-actin filament contour length
  dimension: "[length]"
  description: "Average length L_a of short capped F-actin filaments comprising the droplets."

- id: actin_filament_spacing
  name: inter-filament spacing inside actin tactoid
  dimension: "[length]"
  description: "Estimated lateral spacing between neighboring actin filaments inside a cross-linked tactoid."

- id: actin_filament_number_density
  name: F-actin filament number concentration
  dimension: "1 / [length]**3"
  description: "Number of actin filaments per unit volume c_a inside a tactoid (in Onsager scaling)."

- id: myosin_filament_length
  name: myosin II thick filament or puncta length
  dimension: "[length]"
  description: "Contour length L_M of a skeletal muscle myosin II bipolar filament or rod-like punctum."

- id: myosin_filament_diameter
  name: myosin II thick filament diameter
  dimension: "[length]"
  description: "Diameter D_M of a skeletal muscle myosin II filament (~30 nm)."

- id: myosin_to_tactoid_length_ratio
  name: myosin-to-tactoid length ratio
  dimension: "dimensionless"
  description: "Dimensionless ratio L_M / L_D of myosin rod length to tactoid semi-major axis."

# ==========================================================================
# Experimental statistics, morphology fractions, and centering kinematics
# ==========================================================================

- id: droplet_count_total
  name: total number of surveyed droplets
  dimension: "dimensionless"
  description: "Sample size n of actin-myosin droplets surveyed for morphology statistics."

- id: droplet_count_divided
  name: number of divided droplets observed
  dimension: "dimensionless"
  description: "Count of droplets observed to divide under low-%-active myosin conditions."

- id: droplet_divided_fraction
  name: fraction of droplets divided or distorted
  dimension: "dimensionless"
  description: "Fraction (or percentage) of surveyed droplets showing myosin clusters, distortion, or division."

- id: droplet_clustered_fraction
  name: fraction of droplets containing myosin clusters
  dimension: "dimensionless"
  description: "Fraction (or percentage) of surveyed droplets exhibiting myosin clusters."

- id: coalescence_event_count
  name: number of analyzed coalescence events
  dimension: "dimensionless"
  description: "Number of tactoid coalescence events analyzed for myosin localization distributions."

- id: myosin_puncta_count
  name: number of analyzed myosin puncta
  dimension: "dimensionless"
  description: "Sample size n of myosin puncta analyzed for alignment orientation."

- id: elapsed_time
  name: elapsed experimental observation time
  dimension: "[time]"
  description: "Elapsed time after droplet coalescence or start of time-lapse acquisition."

- id: linear_fit_window
  name: initial trajectory linear fit duration
  dimension: "[time]"
  description: "Duration of the early myosin trajectory linearly fitted to extract initial centering speed."

- id: myosin_fraction_centered
  name: fraction of myosin puncta near midplane
  dimension: "dimensionless"
  description: "Fraction (or percentage) of myosin puncta located within the central region or midplane bin."

- id: central_region_fraction
  name: central droplet length fraction
  dimension: "dimensionless"
  description: "Fraction of the droplet long axis spanning the central zone around the midplane."

- id: myosin_aligned_fraction
  name: fraction of centered myosin aligned with droplet axis
  dimension: "dimensionless"
  description: "Fraction (or percentage) of centered myosin puncta aligned within 10 deg of the tactoid major axis."

- id: myosin_droplet_misalignment_angle
  name: myosin-to-droplet major-axis orientation angle
  dimension: "dimensionless"
  description: "Angle theta_MD between the fitted major axes of a myosin punctum and its host tactoid."

- id: myosin_centering_speed
  name: myosin puncta centering speed
  dimension: "[length] / [time]"
  description: "Translational speed v of a myosin punctum migrating toward the tactoid midplane."

- id: speed_ratio_to_gliding
  name: ratio of unloaded myosin gliding speed to centering speed
  dimension: "dimensionless"
  description: "Factor by which unloaded skeletal muscle myosin gliding speed exceeds droplet centering speeds."

- id: detachment_time
  name: bisected droplet detachment duration
  dimension: "[time]"
  description: "Timescale over which a bisected droplet detaches from the myosin cluster into separated droplets."

# ==========================================================================
# Liquid-crystal material parameters and bipolar tactoid geometry
# ==========================================================================

- id: dynamic_viscosity
  name: effective tactoid dynamic viscosity
  dimension: "[mass] / [length] / [time]"
  description: "Effective viscosity eta of cross-linked F-actin tactoids (estimated from FRAP in Weirich et al. 2017)."

- id: frank_elastic_constant
  name: Frank nematic elastic constant
  dimension: "[force]"
  description: "One-constant approximation Frank elastic constant K of the actin nematic liquid crystal."

- id: interfacial_tension
  name: tactoid interfacial tension
  dimension: "[force] / [length]"
  description: "Surface tension gamma of the actin tactoid interface."

- id: nematic_distortion_length
  name: nematic distortion crossover length
  dimension: "[length]"
  description: "Characteristic length scale K / gamma governing the homogeneous-to-bipolar tactoid crossover."

- id: tactoid_size
  name: characteristic tactoid length
  dimension: "[length]"
  description: "Overall size of experimental actin tactoids studied in this work."

- id: tactoid_semi_major_axis
  name: tactoid semi-major axis
  dimension: "[length]"
  description: "Half-length L_D of a bipolar tactoid from midplane to pole (full major axis = 2*L_D)."

- id: tactoid_semi_minor_axis
  name: tactoid semi-minor axis
  dimension: "[length]"
  description: "Half-width L_y of a bipolar tactoid at the midplane."

- id: tactoid_aspect_ratio
  name: tactoid aspect ratio
  dimension: "dimensionless"
  description: "Ratio L_D / L_y = cot(alpha / 2) of tactoid major axis to minor axis."

- id: tactoid_tip_angle
  name: tactoid half opening tip angle
  dimension: "dimensionless"
  description: "Half-angle alpha subtended by the circular-arc tactoid boundary (alpha = pi/2 for a sphere)."

- id: tactoid_arc_radius
  name: tactoid boundary circular-arc radius
  dimension: "[length]"
  description: "Radius R of the circular arc defining the bipolar tactoid boundary (equals sphere radius at alpha = pi/2)."

- id: tactoid_volume
  name: bipolar tactoid volume
  dimension: "[length]**3"
  description: "Volume V = R^3 * v(alpha) of a circular-arc bipolar tactoid."

- id: tactoid_elastic_shape_factor
  name: dimensionless bipolar elastic energy factor
  dimension: "dimensionless"
  description: "Dimensionless geometric factor f_el(alpha) = -pi*(7*alpha*cos(alpha) - 7*sin(alpha) + alpha^2*sin(alpha))."

- id: tactoid_surface_shape_factor
  name: dimensionless bipolar surface area factor
  dimension: "dimensionless"
  description: "Dimensionless geometric factor f_s(alpha) = 4*pi*(sin(alpha) - alpha*cos(alpha))."

- id: tactoid_volume_shape_factor
  name: dimensionless bipolar volume factor
  dimension: "dimensionless"
  description: "Dimensionless geometric factor v(alpha) = 2*pi*(sin(alpha) - alpha*cos(alpha) - sin^3(alpha)/3)."

- id: tactoid_elastic_free_energy
  name: bulk nematic elastic free energy of a tactoid
  dimension: "[energy]"
  description: "Bulk Frank elastic distortion energy F_el = K * R * f_el(alpha) of a bipolar tactoid."

- id: tactoid_surface_free_energy
  name: interfacial free energy of a tactoid
  dimension: "[energy]"
  description: "Interfacial surface energy F_s = gamma * R^2 * f_s(alpha) of a bipolar tactoid."

- id: tactoid_bare_free_energy
  name: total bare mechanical free energy of a tactoid
  dimension: "[energy]"
  description: "Sum F_el + F_s of bulk nematic elastic and interfacial energies of an unadhered bipolar tactoid."

- id: tactoid_equilibrium_arc_radius
  name: equilibrium boundary arc radius of a bare tactoid
  dimension: "[length]"
  description: "Arc radius R_eq minimizing F_el + F_s at fixed tactoid volume V."

# ==========================================================================
# Motor centering continuum model (SI Section 2, Eqs. 1-5)
# ==========================================================================

- id: axial_coordinate
  name: axial coordinate along tactoid major axis
  dimension: "[length]"
  description: "Position x along the tactoid major axis measured from the midplane (x = 0)."

- id: transverse_coordinate
  name: transverse coordinate from tactoid major axis
  dimension: "[length]"
  description: "Perpendicular distance y from the tactoid major axis."

- id: rod_center_axial_position
  name: myosin rod center axial distance from midplane
  dimension: "[length]"
  description: "Axial displacement x_c (denoted d in main text) of the myosin rod center from the droplet midplane."

- id: rod_center_transverse_position
  name: myosin rod center transverse distance from major axis
  dimension: "[length]"
  description: "Transverse coordinate y_c of the myosin rod center relative to the droplet major axis."

- id: normalized_midplane_distance
  name: normalized axial distance from midplane
  dimension: "dimensionless"
  description: "Dimensionless rod position x_c / L_D (or d / L_D) normalized by tactoid semi-major axis."

- id: director_arc_radius
  name: local bipolar director circle radius
  dimension: "[length]"
  description: "Radius R(x, y) of the circular director line passing through (x, y) and both tactoid poles."

- id: director_misalignment_angle
  name: local rod-to-director misalignment angle
  dimension: "dimensionless"
  description: "Angle alpha_d between a horizontally aligned myosin rod and the local curved nematic director."

- id: director_misalignment_sine
  name: sine of local rod-to-director misalignment angle
  dimension: "dimensionless"
  description: "sin(alpha_d(x, y)) = x / R(x, y) measuring local orientational mismatch."

- id: alignment_energy_per_length
  name: rod-nematic alignment energy per unit length
  dimension: "[energy] / [length]"
  description: "Misalignment free-energy scale per unit rod length f_0 appearing in Eq. 3."

- id: centering_energy_scale
  name: rod centering free-energy scale
  dimension: "[energy]"
  description: "Characteristic centering free-energy scale F_0 = f_0 * y_c (or Onsager/harmonic energy scale)."

- id: centering_energy_scale_kBT
  name: dimensionless rod centering energy scale in thermal units
  dimension: "dimensionless"
  description: "Ratio F_0 / (k_B T) of the centering free-energy scale to thermal energy."

- id: thermal_energy
  name: thermal energy scale
  dimension: "[energy]"
  description: "Thermal energy k_B T (~4 pN*nm at ambient temperature)."

- id: centering_free_energy
  name: rod misalignment centering free energy
  dimension: "[energy]"
  description: "Total misalignment free energy Delta F of a myosin rod embedded in a bipolar tactoid."

- id: centering_free_energy_shifted
  name: centering free energy relative to midplane minimum
  dimension: "[energy]"
  description: "Shifted misalignment free energy Delta F(x_c) - Delta F(0) vanishing at the droplet midplane."

- id: centering_free_energy_dimless
  name: dimensionless misalignment free energy
  dimension: "dimensionless"
  description: "Ratio Delta F / F_0 from Eq. 4."

- id: centering_free_energy_shifted_dimless
  name: shifted dimensionless misalignment free energy
  dimension: "dimensionless"
  description: "Ratio [Delta F(x_c) - Delta F(0)] / F_0 vanishing at x_c = 0 (as plotted in Fig. S4)."

- id: centering_free_energy_kBT
  name: shifted centering free energy in thermal units
  dimension: "dimensionless"
  description: "Ratio [Delta F(d) - Delta F(0)] / (k_B T) plotted in Fig. 2F."

- id: centering_force
  name: thermodynamic centering force on myosin rod
  dimension: "[force]"
  description: "Restoring force f = -d(Delta F)/dx_c (or k*d in harmonic limit) pushing the myosin rod to the midplane."

- id: centering_spring_constant
  name: effective harmonic centering spring constant
  dimension: "[force] / [length]"
  description: "Curvature k = d^2(Delta F)/dx_c^2 at x_c = 0 (Eq. 5) of the confinement potential near the midplane."

- id: centering_spring_constant_norm
  name: normalized harmonic centering spring constant
  dimension: "1 / [length]**2"
  description: "Ratio k / F_0 plotted in Fig. S6 (in units of um^-2)."

- id: rod_drag_coefficient
  name: translational viscous drag coefficient of a myosin rod
  dimension: "[force] * [time] / [length]"
  description: "Stokes-Einstein drag coefficient Gamma of a rod-like myosin filament in the tactoid medium."

- id: centering_timescale
  name: overdamped harmonic centering timescale
  dimension: "[time]"
  description: "Characteristic centering relaxation time tau = Gamma / k (or travel time across ~1 um)."

- id: centering_rate
  name: overdamped harmonic centering rate
  dimension: "1 / [time]"
  description: "Inverse centering relaxation time tau^-1 = k / Gamma."

- id: traversal_distance
  name: representative centering traversal distance
  dimension: "[length]"
  description: "Characteristic distance (~1 um) traversed by a centering motor in ~20 min at ~nm/s."

# ==========================================================================
# Myosin cluster-induced tactoid division model (SI Section 3, Eqs. 6-8)
# ==========================================================================

- id: colloid_radius
  name: myosin cluster spherical colloid radius
  dimension: "[length]"
  description: "Effective radius a of a spherical myosin cluster imposing normal anchoring."

- id: colloid_adhesion_energy_density
  name: colloid-tactoid adhesion energy per unit area
  dimension: "[force] / [length]"
  description: "Wetting or adhesion energy per unit surface area w between the myosin cluster and actin tactoid."

- id: colloid_wetting_fraction
  name: wetted colloid surface fraction factor
  dimension: "dimensionless"
  description: "Dimensionless factor f_w(R/a, alpha) multiplying w*a^2 in the colloid wetting energy F_w."

- id: dimensionless_adhesion_spherical
  name: dimensionless adhesion ratio for spherical droplets
  dimension: "dimensionless"
  description: "Ratio w / gamma of colloid adhesion energy density to droplet interfacial tension."

- id: dimensionless_adhesion_elongated
  name: dimensionless adhesion ratio for elongated tactoids
  dimension: "dimensionless"
  description: "Ratio w * a^2 * gamma / K^2 of colloid adhesion energy scale to elongated tactoid elastic energy scale."

- id: droplet_to_cluster_volume_ratio
  name: total droplet-to-cluster volume ratio
  dimension: "dimensionless"
  description: "Ratio V_d / V_c (V_droplet / V_cluster) of total undivided actin droplet volume to colloid cluster volume."

- id: droplet_volume_partition_fraction
  name: volume fraction in daughter droplet 1
  dimension: "dimensionless"
  description: "Volume partition fraction V_1 / (V_1 + V_2) between two adhered daughter droplets."

- id: droplet_length_partition_fraction
  name: length partition fraction of daughter droplet A
  dimension: "dimensionless"
  description: "Droplet division parameter L_A / (L_A + L_B) plotted on the horizontal axis of Fig. 4A."

- id: daughter_droplet_radius_ratio
  name: daughter droplet radius normalized by colloid radius
  dimension: "dimensionless"
  description: "Dimensionless radius x = R / a of a spherical droplet adhered to a colloid of radius a."

- id: division_free_energy_spherical
  name: total free energy of spherical droplet division model
  dimension: "[energy]"
  description: "Free energy F(R) or F_tot from Eq. 7 for spherical droplet(s) adhered to a spherical colloid."

- id: division_free_energy_spherical_dimless
  name: dimensionless spherical droplet division free energy
  dimension: "dimensionless"
  description: "Total free energy F_tot / (gamma * a^2) in units of gamma * a^2 (Eq. 7, Fig. S9)."

- id: division_free_energy_elongated
  name: total free energy of elongated tactoid division model
  dimension: "[energy]"
  description: "Free energy F(alpha) or F_tot from Eq. 8 for highly elongated tactoid(s) adhered to a colloid."

- id: division_free_energy_elongated_dimless
  name: dimensionless elongated tactoid division free energy
  dimension: "dimensionless"
  description: "Total free energy F_tot / (K^2 / gamma) in units of K^2 / gamma (Eq. 8, Fig. S10)."

- id: critical_adhesion_symmetric_spherical
  name: spherical equal-division stability boundary adhesion
  dimension: "dimensionless"
  description: "Critical w / gamma where d^2 F_tot / dR_1^2 = 0 at symmetric division (black points in Fig. 4D)."

- id: critical_adhesion_unequal_spherical
  name: spherical unequal-to-single transition adhesion
  dimension: "dimensionless"
  description: "Critical w / gamma where the smaller unequal daughter droplet has radius R_1 = a (red points in Fig. 4D)."

- id: critical_adhesion_symmetric_elongated
  name: elongated equal-division stability boundary adhesion
  dimension: "dimensionless"
  description: "Critical w*a^2*gamma / K^2 where d^2 F_tot / dalpha_1^2 = 0 at symmetric division (black points in Fig. S11)."

- id: critical_adhesion_unequal_elongated
  name: elongated unequal-to-single transition adhesion
  dimension: "dimensionless"
  description: "Critical w*a^2*gamma / K^2 where the smaller unequal daughter tactoid has volume V_1 = V_c (red points in Fig. S11)."

- id: division_second_derivative_spherical
  name: dimensionless second derivative of spherical division free energy
  dimension: "dimensionless"
  description: "d^2[F_tot / (gamma*a^2)] / d(R_1/a)^2 evaluated at the equal-division point R_1 = R_2 = R*."

- id: division_second_derivative_elongated
  name: dimensionless second derivative of elongated division free energy
  dimension: "dimensionless"
  description: "d^2[F_tot / (K^2/gamma)] / d(alpha_1)^2 evaluated at the equal-division point alpha_1 = alpha_2 = alpha*."

- id: equilibrium_volume_partition_fraction
  name: equilibrium daughter droplet volume partition fraction
  dimension: "dimensionless"
  description: "Volume fraction f_V* in [0, 0.5] minimizing the two-droplet free energy F_tot(f_V)."

# ==========================================================================
# Quantities for digitized experimental and theoretical figure axes
# ==========================================================================

- id: droplet_morphology_probability
  name: observed actin-myosin droplet morphology probability
  dimension: "dimensionless"
  description: "Measured fraction of actin-myosin droplets in centered, bisected, or separated morphology (Fig. 1G)."

- id: myosin_position_probability
  name: spatial probability distribution of myosin puncta
  dimension: "dimensionless"
  description: "Binned probability of finding a myosin II punctum at normalized distance d_i / L_D from the tactoid midplane (Fig. 2B)."

- id: myosin_alignment_probability
  name: orientation probability distribution of centered myosin puncta
  dimension: "dimensionless"
  description: "Binned probability of angle theta_MD between centered myosin II puncta and tactoid major axis (Fig. 2E)."

- id: daughter_droplet_length_A
  name: daughter droplet length on side A of bisected dimer
  dimension: "[length]"
  description: "Measured major-axis length L_A of daughter droplet on side A of a bisected actin-myosin droplet dimer (Fig. 4B)."

- id: daughter_droplet_length_B
  name: daughter droplet length on side B of bisected dimer
  dimension: "[length]"
  description: "Measured major-axis length L_B of daughter droplet on side B of a bisected actin-myosin droplet dimer (Fig. 4B)."

- id: myosin_cluster_length
  name: myosin punctum or cluster major-axis length
  dimension: "[length]"
  description: "Measured length of an individual myosin punctum or cluster during aggregation in a tactoid (Fig. S1)."

- id: myosin_cluster_width
  name: myosin punctum or cluster minor-axis width
  dimension: "[length]"
  description: "Measured width of an individual myosin punctum or cluster during aggregation in a tactoid (Fig. S1)."

- id: normalized_transverse_position
  name: normalized transverse rod distance from tactoid major axis
  dimension: "dimensionless"
  description: "Dimensionless transverse coordinate y_c / L_y of a myosin rod center normalized by tactoid semi-minor axis (Fig. S5)."

- id: centering_free_energy_over_f0
  name: misalignment free-energy integral normalized by f_0
  dimension: "[length]"
  description: "Ratio Delta F / f_0 = int |sin(alpha_d(x, y_c))| dx from Eq. 3 LHS (in units of um, plotted in Fig. S5 with f_0 = 1)."

