  text: >
    Audit disagreements with first-reader choices (left unchanged): (1) cmp_centering_v_eq4_vs_near compares
    v_eq4_probe_computed (evaluated at xc_probe_added = 1.6 um and L_D = 3.2 um, which computes 1.77 nm/s rather than
