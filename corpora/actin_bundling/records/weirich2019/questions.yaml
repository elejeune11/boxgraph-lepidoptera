- id: q_eq3_rhs_missing_factor_of_2
  kind: possible_error
  about:
    - rod_centering_energy_integral
    - rod_centering_energy_small_y_printed
    - rod_centering_energy_small_y_corrected
    - rod_centering_energy_eq4
    - rel_eq3_exact_reduces_to_small_y_printed
    - rel_eq3_exact_reduces_to_small_y_corrected
    - rel_eq3_small_y_printed_same_as_eq4
    - rel_eq3_small_y_corrected_same_as_eq4
  text: >
    On SI p. 10 (SI-4), Eq. 3 approximates the exact integral f_0 * int |sin(alpha_d(x, y_c))| dx
    as '~ f_0 * y_c * int |x| / (L_D^2 - x^2) dx', dropping the factor of 2 from the small-y
    expansion of Eq. 2 (sin(alpha_d) = 2*x*y / (4*y^2*L_D^2 + (L_D^2 - x^2 - y^2)^2)^(1/2)
    = 2*x*y / (L_D^2 - x^2) + O(y^3)). Because int 2*x/(L_D^2 - x^2) dx = -log(L_D^2 - x^2),
    Eq. 4 (written with '=' and F_0 = f_0 * y_c) equals the exact y_c -> 0 limit of Eq. 3 LHS
    and requires the factor of 2 in Eq. 3 RHS; the literal printed Eq. 3 RHS gives exactly half of Eq. 4.
  citation:
    page: 10
    printed_page: "SI-4"
    quote: "In the second step above, we used a small y approximation to derive"
    where: "SI Theory 2, Eq. 3"

- id: q_eq4_slope_continuity_claim
  kind: possible_error
  about:
    - rod_centering_energy_eq4
    - rod_centering_force_velocity
  text: >
    SI p. 10 (SI-4) claims that Eq. 4 has 'discontinuities in slope at x_c = ±L_M/2' due to |sin alpha|.
    In fact, because the integrand 2*|x|/(L_D^2 - x^2) is continuous everywhere (vanishing at x = 0),
    its integral Eq. 4 is C^1 smooth: both left and right limits of d(Delta F)/dx_c at x_c = L_M/2 equal
    2*F_0*L_M / (L_D^2 - L_M^2). Only the second derivative (curvature) d^2(Delta F)/dx_c^2 has a jump
    discontinuity of -4*F_0 / L_D^2 at x_c = ±L_M/2.
  citation:
    page: 10
    printed_page: "SI-4"
    quote: "The piecewise nature of the expression in Eq. 4 with discontinuities in slope at xc = ±LM /2"
    where: "SI Theory 2"

- id: q_stokes_drag_full_vs_half_length
  kind: possible_error
  about:
    - rod_stokes_drag
    - Gamma_rod_si
    - cmp_stokes_drag_LM1p5
    - cmp_stokes_drag_LM1p0
  text: >
    SI p. 11 (SI-5) writes Gamma = 6*pi*eta*L_M / log(L_M / D_M) ~ 15 pN*s/um. With eta = 3 Pa*s,
    L_M = 1.5 um (from SI p. 10), and D_M = 30 nm, this printed formula gives 21.7 pN*s/um using
    natural log (or 49.9 pN*s/um using log10); with L_M = 1.0 um (Main p. 2) it gives 16.1 pN*s/um.
    Furthermore, the prolate-ellipsoid formula 6*pi*eta*a / ln(2*a/b) used in Weirich et al. (2017)
    takes the half-length a = L_M/2 (giving 3*pi*eta*L_M / ln(2*L_M/D_M) = 9.2 pN*s/um at L_M = 1.5 um),
    while slender-body rod drag is 2*pi*eta*L_M / ln(L_M/D_M) = 7.2 pN*s/um parallel to the rod axis
    and 4*pi*eta*L_M / ln(L_M/D_M) = 14.5 pN*s/um perpendicular to it.
  citation:
    page: 11
    printed_page: "SI-5"
    quote: "Γ = 6πηLM / log(LM /DM ) ∼ 15pN · s/µm"
    where: "SI Theory 2"

