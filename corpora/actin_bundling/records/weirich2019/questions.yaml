  text: >
    Several editorial, figure-reference, and caption discrepancies appear in the main article and SI:
    (1) SI figure cross-references are shifted after inserting Figs. S1-S2: SI p. 8 cites Fig. S2 for linescans
    (no linescan appears); Main p. 4 cites Fig. S2 for the bipolar director schematic (actually Fig. S3);
    SI p. 10 cites Figs. S6A/S6B (actually S3A/S3B, where the intersecting arc is dashed blue rather than red),
    Figs. S7/S8 (actually S4/S5), and Figs. S9/S10 (actually S6/S7); SI p. 11 cites Fig. S6A (actually S8A).
    (2) Fig. S9 caption (p. 21) prints 'Higher values of γ favor division into two equal tactoids' (inverted:
    higher w/γ, i.e., higher w or lower γ, favors division).
    (3) Fig. S6 caption (p. 18) describes the 0.33 um curve as 'green' whereas the plot and legend show red.
    (4) Fig. 4E (p. 5) labels its fourth panel 'vi' instead of 'iv'.
    (5) Fig. S2 (p. 14) prints scale bar '10 uM' (micromolar) instead of '10 um' (micrometers).
    (6) SI Ref. 8 (p. 25) misprints the publication year of Weirich et al. PNAS 114 as (2007) instead of (2017);
    SI p. 8 cites main-text ref '(29)' instead of SI ref '(16)'; Main p. 5 cites Ref. 35 (Stam et al. 2017,
    active networks) for colloids in molecular liquid-crystal droplets (Refs. 21, 38, 39).
    (7) Movie S3/S6 (0.7 nM) and Movies S2/S4/S5/S8 (12.3 nM) lie slightly outside the 1-12 nM myosin
    concentration range stated on SI p. 8.
  citation:
