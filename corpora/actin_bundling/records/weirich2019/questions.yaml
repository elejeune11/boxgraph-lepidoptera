- id: q_eq8_missing_length_ratio_and_large_alpha_figS11
  kind: possible_error
  about:
    - elongated_tactoid_division_energy
    - elongated_tactoid_division_phase_diagram
    - elongated_tactoid_division_equilibrium
    - V_ratio_figS10_added
    - K_frank_si
    - gamma_tactoid_si
    - a_colloid_added
  text: >
    On SI p. 11 (SI-5), an elongated bipolar tactoid has volume V(alpha) ~ R_eq^3 * alpha^5 ~ (K/gamma)^3 * alpha^5,
    whereas the spherical colloid has volume V_c ~ a^3. Relating V_1 to V_c therefore gives
    V_1 / V_c ~ [K / (gamma * a)]^3 * alpha_1^5, introducing an extra dimensionless length ratio beta = K / (gamma * a)
    that scales both Eq. 8 phase boundaries by beta^(-6/5): W_el,sym = (3/2) * beta^(-6/5) * (V_d / (2*V_c))^(2/5)
    and W_el,unequal = beta^(-6/5) * 3*(V_d/V_c - 1)^(2/5) / [1 + (V_d/V_c - 1)^(2/5)]. However, Fig. S11 (p. 23)
    plots V_d / V_c vs. w*a^2*gamma / K^2 using alpha_1^5 + alpha_2^5 = V_d / V_c (implicitly setting beta = 1, i.e.,
    identifying V_c with (K/gamma)^3 rather than a^3), whereas for the paper's own parameters (K/gamma ~= 3.33 um,
    a ~= 0.6 um) beta ~= 5.5, beta^3 ~= 166, and beta^(-6/5) ~= 0.13. Furthermore, setting alpha_1^5 + alpha_2^5 = V_d/V_c
    across Fig. S11 (V_d/V_c in [1, 40]) evaluates the small-angle approximation Eq. 8 at symmetric tip angles
    alpha* in [0.87, 1.82] rad (exceeding the spherical limit pi/2 ~= 1.571 rad for V_d/V_c > 19.1) and places the
    red unequal-to-single cutoff V_1 = V_c at alpha_1 = 1 rad (~57 deg, with alpha_2 up to 2.08 rad > pi/2), well
    outside the small-tip-angle regime.
  citation:
    page: 11
    printed_page: "SI-5"
    quote: "explicitly minimizing Fel(α) + Fs(α) with respect to α with constant V"
    where: "SI Theory 3, Eq. 8 & Fig. S11 (p. 23)"

- id: q_F0_overloaded_definitions_main_vs_si
  kind: unexplained_difference
  about:
    - onsager_energy_scale
    - rod_centering_energy_eq4
    - rod_centering_spring_constant
    - harmonic_centering_potential
    - F0_kBT_main
    - F0_kBT_si
    - cmp_F0_kBT_harmonic_main
    - cmp_F0_kBT_onsager_scaling
    - centering_energy_scale
  text: >
    The paper uses the same symbol F_0 for three distinct energy scales across Main p. 4 and SI pp. 9-11:
    (1) SI p. 9 defines F_0 ~ D_M * L_M * L_a * c_a * (k_B T) as the Onsager alignment energy of the entire rod,
    which is proportional to L_M and independent of transverse position y_c;
    (2) SI p. 10 (Eq. 4) redefines F_0 = f_0 * y_c, which is proportional to y_c (vanishing on the major axis y_c = 0)
    and independent of L_M (so F_0^(Eq.4) = F_0^(Onsager) * (y_c / L_M) if f_0 = F_0^(Onsager) / L_M; Figs. 2F and S6
    hold F_0 constant when changing L_M from 1.5 um to 0.33 um); and
    (3) Main p. 4 writes Delta F = k*d^2/2 = F_0*(d/L_D)^2 ('approximately the work required to move a motor across
    the droplet'), implying F_0 = k*L_D^2/2, which is larger than SI Eq. 5's F_0 by a factor of 2 in the L_D >> L_M
    limit (k ~= 4*F_0/L_D^2) and by 2.36x at L_D = 3.2 um, L_M = 1.5 um (while Eq. 4 actually diverges logarithmically
    as d -> L_D - L_M/2 rather than equaling F_0 across the droplet).
  citation:
    page: 10
    printed_page: "SI-4"
    quote: "we defined an energy scale, F0 = f0 yc , that depends on the transverse position"
    where: "Main p. 4 & SI Theory 2 (pp. 9-11)"

