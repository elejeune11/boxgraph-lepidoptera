- id: q_eq6_unstated_wetting_fraction_and_eq8_3d_scaling
  kind: unstated_model
  about:
    - tactoid_colloid_free_energy_eq6
    - elongated_tactoid_division_energy
    - elongated_tactoid_division_phase_diagram
  text: >
    Eq. 6 on SI p. 11 (SI-5) writes F = K*R*f_el(alpha) + gamma*R^2*f_s(alpha) - w*a^2*f_w(R/a, alpha)
    without stating a closed-form expression for f_w(R/a, alpha) at arbitrary tip angle alpha, making
    general Eq. 6 non-runnable. Solving the exact 3D intersection of a circular-arc bipolar tactoid (R, alpha)
    with an orthogonal spherical colloid of radius a (center at z = sqrt(R^2 sin^2 alpha + a^2)) yields
    the wetted cap area A_cap = 2*pi*a^2 * [1 - (a*sqrt(R^2*sin^2(alpha) + a^2) + R^2*cos(alpha)) / (R^2 + a^2)].
    At alpha = pi/2 this reproduces Eq. 7 up to 2*pi (2*pi*a^2*(1 - a/sqrt(a^2+R^2))). For small alpha,
    however, this 3D cap area scales as pi*a^2*alpha^2 when L_D = R*sin(alpha) >> a (solid angle of cone
    of half-angle alpha) or as O(alpha^4) when R*alpha << a — not linearly in alpha as written in Eq. 8
    ('- w*a^2*alpha', which is a 2D arc-length scaling). Replacing alpha by alpha^2 in Eq. 8 preserves the
    qualitative transition (since -V^(2/5) remains convex in V) but changes the symmetric phase boundary
    scaling in Fig. S11 from (V_d/V_c)^(2/5) to (V_d/V_c)^(1/5).
  citation:
    page: 11
    printed_page: "SI-5"
    quote: "adhesion energy given by the surface area of the colloid covered by the tactoid which grows as α for small tip angle"
    where: "SI Theory 3, Eqs. 6 and 8"

- id: q_eq7_eq8_prefactors_and_figS9_S10_rescaling
  kind: choice
  about:
    - spherical_droplet_division_energy
    - spherical_droplet_division_phase_diagram
    - elongated_tactoid_division_energy
    - elongated_tactoid_division_phase_diagram
    - V_ratio_fig4a_S9_added
    - V_ratio_figS10_added
  text: >
    Eqs. 7 and 8 (SI p. 11; note also an unmatched extra ')' at the end of Eq. 7) are printed with '~'
    omitting geometric factors (e.g., 4*pi*gamma*R^2 vs 2*pi*w*a^2 in Eq. 7, whose 2:1 ratio would double
    all critical w/gamma values in Fig. 4D; and R_eq = 4*K/gamma giving F_bare = (80*pi/3)*(K^2/gamma)*alpha^3
    in Eq. 8), yet Figs. 4D and S11 evaluate Eqs. 7 and 8 verbatim with unit prefactors. Moreover, Figs. 4A,
    S9, and S10 omit V_d/V_c from their captions (V_d/V_c = 4 matches Figs. 4A & S9; V_d/V_c = 1 matches
    Fig. S10). Although Fig. S9 caption states F is plotted 'in units of gamma*a^2', raw Eq. 7 requires
    F(V_1=0) to decrease linearly with w/gamma, whereas Fig. S9 plots F(0) ~ 2.12 (w/gamma=1.5), ~2.41
    (w/gamma=2.5), and ~2.39 (w/gamma=3.5), showing that each curve was shifted vertically and the w/gamma=2.5
    curve magnified by ~4x (similarly Fig. S10 curves are individually shifted and rescaled). Finally, because
    dF/dV -> -infinity as V -> 0 in Eq. 8, an infinitesimal second droplet always lowers F below V_1 = 0,
    necessitating the finite-size cutoff V_1 = V_c for the red phase boundary in Fig. S11.
  citation:
    page: 21
    printed_page: "SI-15"
    quote: "Free energy (in units of γa2) of two nearly spherical tactoids adhered to a colloid"
    where: "SI Theory 3, Eqs. 7-8 & Figs. 4A, S9, S10"

- id: q_bipolar_vs_homogeneous_weirich2017
  kind: unexplained_difference
  about:
    - K_frank_si
    - gamma_tactoid_si
    - tactoid_size_min_si
    - nematic_distortion_length
    - actin_spacing_main
  text: >
    SI Section 1 (p. 9) combines K ~ 1 pN (Oakes et al. 2007, SI Ref. 15) and gamma ~ 300 nN/m
    (Weirich et al. 2017, SI Ref. 8) to obtain K/gamma = 3.33 um ('about a few um') and justifies modeling
    >= 5 um tactoids as bipolar throughout this paper. However, Weirich et al. (2017) prepared actin-filamin
    tactoids under the same conditions (2.6 uM actin, 10 mol% filamin, 1.5 mol% capping protein, L ~ 5 um)
    and modeled them as homogeneous (uniform director) with negligible bulk elasticity. Separately, Main p. 4
    cites Weirich et al. (2017) (Ref. 17) for a '~50-nm spacing between actin filaments' inside tactoids,
    whereas Weirich et al. (2017) reports ~250 uM tactoid concentration and ~1 um pre-cross-linking mesh size
    without printing a 50 nm spacing.
  citation:
    page: 9
    printed_page: "SI-3"
    quote: "study tactoids of size about 5 µm or greater, justifying the use of the bipolar model"
    where: "SI Theory 1 & Main p. 11128"

- id: q_si_figure_crossrefs_and_editorial_typos
