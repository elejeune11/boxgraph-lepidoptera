  text: >
    On SI p. 11 (SI-5), inverting Eq. 5 with L_D = 3.2 um, L_M = 1.5 um, and k ~ 10^-2 pN/um
    (or k = Gamma * tau^-1 = 15 * 10^-3 = 0.015 pN/um) yields
    F_0 = k * (L_M^2 - 4*L_D^2)^2 / (16 * (L_M^2 + 4*L_D^2)) = 0.0217 to 0.0325 pN*um = 21.7 to 32.5 pN*nm
    (~30 pN*nm), which divided by k_B T ~= 4 pN*nm gives 5.4 to 8.1 k_B T (~10 k_B T).
    However, SI p. 11 prints 'F_0 ~ 30 pN · μm' instead of '30 pN · nm' — a 1000-fold unit misprint.
    Literally dividing the printed 30 pN*um by 4 pN*nm yields 7,500 k_B T rather than ~10 k_B T.
  citation:
