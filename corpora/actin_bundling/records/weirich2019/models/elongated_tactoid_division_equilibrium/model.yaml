id: elongated_tactoid_division_equilibrium
name: numerical equilibrium volume partition of elongated two-tactoid model (Eq. 8)
role: model
built_from:
  - elongated_tactoid_division_energy
stated:
  page: 12
  printed_page: "SI-6"
  quote: "which then leads to the minimization of an effective energy"
  where: "SI Theory 3 & Figs. S10, S11"
equation: "f_V* = argmin_{f_V in [0, 0.5]} [alpha_1^3 + alpha_2^3 - W_el*(alpha_1 + alpha_2)]"
inputs:
  W_el:
    quantity: dimensionless_adhesion_elongated
    unit: dimensionless
  V_ratio:
    quantity: droplet_to_cluster_volume_ratio
    unit: dimensionless
outputs:
  f_V_eq:
    quantity: equilibrium_volume_partition_fraction
    unit: dimensionless
  F_min_dimless:
    quantity: division_free_energy_elongated_dimless
    unit: dimensionless
settings:
  n_grid: 200
  tol: 1.0e-8
stochastic: false
