id: rod_centering_energy_small_y_printed
name: small-y rod centering free-energy integral as printed (Eq. 3 RHS)
role: model
built_from:
  - rod_centering_energy_integral
stated:
  page: 10
  printed_page: "SI-4"
  quote: "In the second step above, we used a small y approximation to derive"
  where: "SI Theory 2, Eq. 3 RHS"
equation: "Delta_F = f_0 * y_c * int_{x_c - L_M/2}^{x_c + L_M/2} dx |x| / (L_D^2 - x^2)"
inputs:
  f_0:
    quantity: alignment_energy_per_length
    unit: pN
  x_c:
    quantity: rod_center_axial_position
    unit: um
  y_c:
    quantity: rod_center_transverse_position
    unit: um
  L_D:
    quantity: tactoid_semi_major_axis
    unit: um
  L_M:
    quantity: myosin_filament_length
    unit: um
outputs:
  Delta_F:
    quantity: centering_free_energy
    unit: "pN*nm"
  Delta_F_over_F0:
    quantity: centering_free_energy_dimless
    unit: dimensionless
settings:
  n_quad: 16
stochastic: false
