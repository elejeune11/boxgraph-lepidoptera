id: onsager_energy_scale
name: Onsager excluded-volume rod alignment energy scale
role: model
prefactor: unknown
described_from: ref-si-11
stated:
  page: 9
  printed_page: "SI-3"
  quote: "volume excluded by the myosin rod, F0 ∼ DM LM La ca · (kB T )"
  where: "SI Theory 2"
equation: "F_0 ~ D_M * L_M * L_a * c_a * k_B T"
inputs:
  D_M:
    quantity: myosin_filament_diameter
    unit: nm
  L_M:
    quantity: myosin_filament_length
    unit: um
  L_a:
    quantity: actin_filament_length
    unit: nm
  c_a:
    quantity: actin_filament_number_density
    unit: "1/um**3"
  kBT:
    quantity: thermal_energy
    unit: "pN*nm"
outputs:
  F_0:
    quantity: centering_energy_scale
    unit: "pN*nm"
  F_0_kBT:
    quantity: centering_energy_scale_kBT
    unit: dimensionless
settings: {}
stochastic: false
