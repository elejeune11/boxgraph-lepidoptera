id: spherical_droplet_unequal_boundary
name: spherical droplet unequal-to-single transition boundary V_d/V_c(w/gamma) (Fig. 4D red dots)
role: model
built_from:
  - spherical_droplet_division_phase_diagram
stated:
  page: 5
  printed_page: "11129"
  quote: "Red points mark the transition between an"
  where: "Fig. 4D & SI Theory 3 (p. 12)"
equation: "Invert W_unequal(V_ratio) = 2*(1 - 1/x_2)/(1/(2*sqrt(2)) - 1/(x_2*(1 + x_2^2)^(3/2))) = W with x_2 = (V_ratio - 1)^(1/3) for V_ratio > 2"
inputs:
  W:
    quantity: dimensionless_adhesion_spherical
    unit: dimensionless
outputs:
  V_ratio_unequal:
    quantity: droplet_to_cluster_volume_ratio
    unit: dimensionless
settings:
  tol: 1.0e-10
stochastic: false
