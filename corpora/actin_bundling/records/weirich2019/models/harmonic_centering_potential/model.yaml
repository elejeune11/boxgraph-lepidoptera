id: harmonic_centering_potential
name: harmonic centering force, free energy, and energy scale (Main p. 11128)
role: model
stated:
  page: 4
  printed_page: "11128"
  quote: "harmonic approximation such that f(d) = kd, where k is the spring constant"
  where: "Main text p. 11128 col 1"
equation: "f(d) = k*d; Delta_F = k*d^2/2 = F_0*(d/L_D)^2 => F_0 = k*L_D^2/2"
inputs:
  k:
    quantity: centering_spring_constant
    unit: "pN/um"
  d:
    quantity: rod_center_axial_position
    unit: um
  L_D:
    quantity: tactoid_semi_major_axis
    unit: um
outputs:
  f:
    quantity: centering_force
    unit: pN
  Delta_F:
    quantity: centering_free_energy
    unit: "pN*nm"
  F_0:
    quantity: centering_energy_scale
    unit: "pN*nm"
settings: {}
stochastic: false
