id: elongated_tactoid_equal_boundary
name: elongated tactoid equal-division stability boundary V_d/V_c(W_el) (Fig. S11 black dots)
role: model
built_from:
  - elongated_tactoid_division_phase_diagram
stated:
  page: 23
  printed_page: "SI-17"
  quote: "Equal division becomes favorable as the adhesion energy scale"
  where: "Fig. S11 & SI Theory 3 (p. 12)"
equation: "V_ratio_sym = 2 * (2*W_el / 3)^(5/2)"
inputs:
  W_el:
    quantity: dimensionless_adhesion_elongated
    unit: dimensionless
outputs:
  V_ratio_sym:
    quantity: droplet_to_cluster_volume_ratio
    unit: dimensionless
settings: {}
stochastic: false
