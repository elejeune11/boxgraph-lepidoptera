id: spherical_droplet_division_energy
name: two-droplet free energy for nearly spherical droplets on an adhesive colloid (Eq. 7)
role: model
stated:
  page: 11
  printed_page: "SI-5"
  quote: "wetting energy can be derived from the overlap of two orthogonally intersecting spheres"
  where: "SI Theory 3, Eq. 7 & Figs. 4A, S9"
equation: "F(R) = gamma*R^2 - w*a^2*(1 - a/sqrt(a^2 + R^2)); F_tot = F(R_1) + F(R_2) with R_1^3 + R_2^3 = (V_d/V_c)*a^3"
inputs:
  W:
    quantity: dimensionless_adhesion_spherical
    unit: dimensionless
  V_ratio:
    quantity: droplet_to_cluster_volume_ratio
    unit: dimensionless
  f_V:
    quantity: droplet_volume_partition_fraction
    unit: dimensionless
  gamma:
    quantity: interfacial_tension
    unit: "nN/m"
  a:
    quantity: colloid_radius
    unit: um
outputs:
  F_tot_dimless:
    quantity: division_free_energy_spherical_dimless
    unit: dimensionless
  F_tot:
    quantity: division_free_energy_spherical
    unit: "pN*um"
  u_L:
    quantity: droplet_length_partition_fraction
    unit: dimensionless
  d2F_sym:
    quantity: division_second_derivative_spherical
    unit: dimensionless
settings: {}
stochastic: false
