id: rod_centering_energy_integral
name: exact bipolar misalignment free-energy integral along myosin rod (Eq. 3 LHS)
role: model
built_from:
  - bipolar_director_arc
stated:
  page: 10
  printed_page: "SI-4"
  quote: "The total free energy cost of misalignment of this myosin rod is obtained by integrating"
  where: "SI Theory 2, Eq. 3 LHS (also Fig. S5)"
equation: "Delta_F = f_0 * int_{x_c - L_M/2}^{x_c + L_M/2} dx |sin(alpha_d(x, y_c))|"
inputs:
  f_0:
    quantity: alignment_energy_per_length
    unit: pN
  x_c:
    quantity: rod_center_axial_position
    unit: um
  y_c:
    quantity: rod_center_transverse_position
    unit: um
  L_D:
    quantity: tactoid_semi_major_axis
    unit: um
  L_M:
    quantity: myosin_filament_length
    unit: um
outputs:
  Delta_F:
    quantity: centering_free_energy
    unit: "pN*nm"
  Delta_F_over_F0:
    quantity: centering_free_energy_dimless
    unit: dimensionless
settings:
  n_quad: 16
stochastic: false
