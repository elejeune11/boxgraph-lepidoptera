id: rod_stokes_drag
name: Stokes-Einstein viscous drag coefficient for a myosin rod (SI p. SI-5)
role: model
stated:
  page: 11
  printed_page: "SI-5"
  quote: "Γ = 6πηLM / log(LM /DM ) ∼ 15pN · s/µm"
  where: "SI Theory 2"
equation: "Gamma = 6 * pi * eta * L_M / ln(L_M / D_M)"
inputs:
  eta:
    quantity: dynamic_viscosity
    unit: "Pa*s"
  L_M:
    quantity: myosin_filament_length
    unit: um
  D_M:
    quantity: myosin_filament_diameter
    unit: nm
outputs:
  Gamma:
    quantity: rod_drag_coefficient
    unit: "pN*s/um"
settings: {}
stochastic: false
