id: centering_rate_from_timescale
name: inverse centering timescale tau^-1 from centering time tau
role: processing
stated:
  page: 11
  printed_page: "SI-5"
  quote: "With τ −1 ∼ 10−3 s−1 , we estimate a force constant"
  where: "SI Theory 2"
equation: "tau_inv = 1 / tau"
inputs:
  tau:
    quantity: centering_timescale
    unit: min
outputs:
  tau_inv:
    quantity: centering_rate
    unit: "1/s"
settings: {}
stochastic: false
