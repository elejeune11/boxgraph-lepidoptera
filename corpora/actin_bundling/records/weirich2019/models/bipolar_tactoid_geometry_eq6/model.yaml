id: bipolar_tactoid_geometry_eq6
name: bipolar tactoid elastic, surface, and volume geometric factors (Eq. 6)
role: model
described_from: ref-si-9
stated:
  page: 11
  printed_page: "SI-5"
  quote: "Here, fel(α) = −π(7α cos α−7 sin α+α2 sin α), fs(α) = 4π(sin α−α cos α)"
  where: "SI Theory 3, Eq. 6"
equation: "F_el = K*R*f_el(alpha); F_s = gamma*R^2*f_s(alpha); V = R^3*v(alpha)"
inputs:
  K:
    quantity: frank_elastic_constant
    unit: pN
  gamma:
    quantity: interfacial_tension
    unit: "nN/m"
  R:
    quantity: tactoid_arc_radius
    unit: um
  alpha:
    quantity: tactoid_tip_angle
    unit: rad
outputs:
  f_el:
    quantity: tactoid_elastic_shape_factor
    unit: dimensionless
  f_s:
    quantity: tactoid_surface_shape_factor
    unit: dimensionless
  v:
    quantity: tactoid_volume_shape_factor
    unit: dimensionless
  V:
    quantity: tactoid_volume
    unit: "um**3"
  F_el:
    quantity: tactoid_elastic_free_energy
    unit: "pN*um"
  F_s:
    quantity: tactoid_surface_free_energy
    unit: "pN*um"
  F_bare:
    quantity: tactoid_bare_free_energy
    unit: "pN*um"
settings: {}
stochastic: false
