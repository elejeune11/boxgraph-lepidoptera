id: tactoid_aspect_ratio_angle
name: bipolar tactoid aspect ratio and axes from tip angle and arc radius
role: model
described_from: ref-si-10
stated:
  page: 9
  printed_page: "SI-3"
  quote: "also the tip angle of the tactoid and determines its aspect ratio = cot(α/2)"
  where: "SI Theory 2 (pp. SI-3 to SI-4)"
equation: "AR = cot(alpha / 2); L_D = R * sin(alpha); L_y = R * (1 - cos(alpha))"
inputs:
  R:
    quantity: tactoid_arc_radius
    unit: um
  alpha:
    quantity: tactoid_tip_angle
    unit: rad
outputs:
  AR:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
  L_D:
    quantity: tactoid_semi_major_axis
    unit: um
  L_y:
    quantity: tactoid_semi_minor_axis
    unit: um
settings: {}
stochastic: false
