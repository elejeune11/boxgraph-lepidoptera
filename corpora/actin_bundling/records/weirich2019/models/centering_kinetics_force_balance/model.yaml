id: centering_kinetics_force_balance
name: overdamped harmonic force balance, speed, and relaxation timescale
role: model
stated:
  page: 10
  printed_page: "SI-4"
  quote: "This force balance relation is, kd = Γv, where k is the harmonic"
  where: "SI Theory 2 & Main p. 11128"
equation: "tau = Gamma / k; v = (k / Gamma) * d"
inputs:
  k:
    quantity: centering_spring_constant
    unit: "pN/um"
  Gamma:
    quantity: rod_drag_coefficient
    unit: "pN*s/um"
  d:
    quantity: rod_center_axial_position
    unit: um
outputs:
  tau:
    quantity: centering_timescale
    unit: min
  v:
    quantity: myosin_centering_speed
    unit: "nm/s"
settings: {}
stochastic: false
