id: elongated_tactoid_division_phase_diagram
name: elongated tactoid division phase boundaries (Fig. S11 black and red curves)
role: model
built_from:
  - elongated_tactoid_division_energy
stated:
  page: 12
  printed_page: "SI-6"
  quote: "in Fig. S11 in the SI for an elongated droplet"
  where: "SI Theory 3 & Fig. S11"
equation: "W_el_sym = (3/2)*(V_ratio/2)^(2/5); W_el_unequal = 3*a_2^2/(1 + a_2^2), a_2 = (V_ratio - 1)^(1/5)"
inputs:
  V_ratio:
    quantity: droplet_to_cluster_volume_ratio
    unit: dimensionless
outputs:
  W_el_sym:
    quantity: critical_adhesion_symmetric_elongated
    unit: dimensionless
  W_el_unequal:
    quantity: critical_adhesion_unequal_elongated
    unit: dimensionless
settings: {}
stochastic: false
