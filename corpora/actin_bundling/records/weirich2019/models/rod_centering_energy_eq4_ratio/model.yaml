id: rod_centering_energy_eq4_ratio
name: shifted dimensionless rod centering free energy parameterized by legend ratio L_M/L_D (Eq. 4 / Fig. S4)
role: model
built_from:
  - rod_centering_energy_eq4
stated:
  page: 16
  printed_page: "SI-10"
  quote: "LM /LD= 0.4"
  where: "Fig. S4 legend & SI Theory 2, Eq. 4"
equation: "Delta_F_shifted/F_0 = (Delta_F(u; r) - Delta_F(0; r)) / F_0 from Eq. 4 with r = L_M / L_D"
inputs:
  u:
    quantity: normalized_midplane_distance
    unit: dimensionless
  ratio:
    quantity: myosin_to_tactoid_length_ratio
    unit: dimensionless
outputs:
  Delta_F_shifted_over_F0:
    quantity: centering_free_energy_shifted_dimless
    unit: dimensionless
settings: {}
stochastic: false
