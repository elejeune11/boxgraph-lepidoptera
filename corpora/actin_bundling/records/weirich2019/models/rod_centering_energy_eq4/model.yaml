id: rod_centering_energy_eq4
name: piecewise analytical rod centering free energy (Eq. 4)
role: model
built_from:
  - rod_centering_energy_integral
stated:
  page: 10
  printed_page: "SI-4"
  quote: "The total free energy of the rod through the misalignment with the director lines"
  where: "SI Theory 2, Eq. 4 (also Fig. 2F and Fig. S4)"
equation: "Delta_F/F_0 = -log[L_D^2 - (-L_M/2 + x_c)^2] + log[L_D^2 - (L_M/2 + x_c)^2] (x_c <= -L_M/2); log(L_D^4) - log[L_D^2 - (L_M - 2*x_c)^2/4] - log[L_D^2 - (L_M + 2*x_c)^2/4] (-L_M/2 <= x_c <= L_M/2); log[L_D^2 - (L_M - 2*x_c)^2/4] - log[L_D^2 - (L_M + 2*x_c)^2/4] (x_c >= L_M/2)"
inputs:
  F_0:
    quantity: centering_energy_scale
    unit: "pN*nm"
  x_c:
    quantity: rod_center_axial_position
    unit: um
  L_D:
    quantity: tactoid_semi_major_axis
    unit: um
  L_M:
    quantity: myosin_filament_length
    unit: um
outputs:
  Delta_F:
    quantity: centering_free_energy
    unit: "pN*nm"
  Delta_F_over_F0:
    quantity: centering_free_energy_dimless
    unit: dimensionless
  Delta_F_shifted:
    quantity: centering_free_energy_shifted
    unit: "pN*nm"
  Delta_F_shifted_over_F0:
    quantity: centering_free_energy_shifted_dimless
    unit: dimensionless
settings: {}
stochastic: false
