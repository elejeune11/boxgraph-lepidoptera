id: spherical_droplet_equal_boundary
name: spherical droplet equal-division stability boundary V_d/V_c(w/gamma) (Fig. 4D black dots)
role: model
built_from:
  - spherical_droplet_division_phase_diagram
stated:
  page: 5
  printed_page: "11129"
  quote: "Black points indicate the boundary between a free-energy minimum and maximum in the equally divided state."
  where: "Fig. 4D & SI Theory 3 (p. 12)"
equation: "Invert W_sym(V_ratio) = 2*(1 + x^2)^(5/2)/(1 + 4*x^2) = W with x = (V_ratio/2)^(1/3) for V_ratio >= 1"
inputs:
  W:
    quantity: dimensionless_adhesion_spherical
    unit: dimensionless
outputs:
  V_ratio_sym:
    quantity: droplet_to_cluster_volume_ratio
    unit: dimensionless
settings:
  tol: 1.0e-10
stochastic: false
