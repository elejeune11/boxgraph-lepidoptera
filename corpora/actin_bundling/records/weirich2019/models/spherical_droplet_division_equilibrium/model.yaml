id: spherical_droplet_division_equilibrium
name: numerical equilibrium volume partition of spherical two-droplet model (Eq. 7)
role: model
built_from:
  - spherical_droplet_division_energy
stated:
  page: 12
  printed_page: "SI-6"
  quote: "which then leads to the minimization of an effective energy"
  where: "SI Theory 3 & Figs. 4A, 4D, S9"
equation: "f_V* = argmin_{f_V in [0, 0.5]} F_tot(f_V; W, V_d/V_c)"
inputs:
  W:
    quantity: dimensionless_adhesion_spherical
    unit: dimensionless
  V_ratio:
    quantity: droplet_to_cluster_volume_ratio
    unit: dimensionless
outputs:
  f_V_eq:
    quantity: equilibrium_volume_partition_fraction
    unit: dimensionless
  F_min_dimless:
    quantity: division_free_energy_spherical_dimless
    unit: dimensionless
settings:
  n_grid: 200
  tol: 1.0e-8
stochastic: false
