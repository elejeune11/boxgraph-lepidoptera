id: energy_in_kBT
name: centering free-energy scale normalized by thermal energy k_B T
role: processing
stated:
  page: 11
  printed_page: "SI-5"
  quote: "given that, kB T ≃ 4 pN · nm, gives, F0 ∼ 10kB T"
  where: "SI Theory 2 & Main p. 11128"
equation: "F0_kBT = F_0 / kBT"
inputs:
  F_0:
    quantity: centering_energy_scale
    unit: "pN*nm"
  kBT:
    quantity: thermal_energy
    unit: "pN*nm"
outputs:
  F0_kBT:
    quantity: centering_energy_scale_kBT
    unit: dimensionless
settings: {}
stochastic: false
