id: tactoid_colloid_free_energy_eq6
name: general bipolar tactoid plus adhesive spherical colloid free energy (Eq. 6)
role: model
built_from:
  - bipolar_tactoid_geometry_eq6
stated:
  page: 11
  printed_page: "SI-5"
  quote: "F = Fel + Fs + Fw = KRfel(α) + γR2fs(α) − wa2fw(R/a, α)"
  where: "SI Theory 3, Eq. 6"
equation: "F = K*R*f_el(alpha) + gamma*R^2*f_s(alpha) - w*a^2*f_w(R/a, alpha)"
inputs:
  K:
    quantity: frank_elastic_constant
    unit: pN
  gamma:
    quantity: interfacial_tension
    unit: "nN/m"
  R:
    quantity: tactoid_arc_radius
    unit: um
  alpha:
    quantity: tactoid_tip_angle
    unit: rad
  w:
    quantity: colloid_adhesion_energy_density
    unit: "nN/m"
  a:
    quantity: colloid_radius
    unit: um
outputs:
  F:
    quantity: division_free_energy_spherical
    unit: "pN*um"
settings: {}
stochastic: false
runnable: false
not_runnable_reason: "The paper states f_el(alpha), f_s(alpha), and v(alpha) in closed form, but does not provide an explicit closed-form expression for the general wetting fraction f_w(R/a, alpha) at arbitrary tip angle alpha (giving only the spherical limit in Eq. 7 and the small-alpha scaling in Eq. 8)."
