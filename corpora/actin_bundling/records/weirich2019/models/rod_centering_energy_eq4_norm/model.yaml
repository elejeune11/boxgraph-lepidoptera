id: rod_centering_energy_eq4_norm
name: shifted dimensionless rod centering free energy vs normalized midplane distance (Eq. 4 / Fig. S4)
role: model
built_from:
  - rod_centering_energy_eq4
stated:
  page: 16
  printed_page: "SI-10"
  quote: "Free energy landscape for myosin motor filament centering for motor filaments of different lengths as a function of their distance from the midplane"
  where: "Fig. S4 & SI Theory 2, Eq. 4"
equation: "Delta_F_shifted/F_0 = (Delta_F(u*L_D) - Delta_F(0)) / F_0 from Eq. 4 with u = x_c / L_D"
inputs:
  u:
    quantity: normalized_midplane_distance
    unit: dimensionless
  L_D:
    quantity: tactoid_semi_major_axis
    unit: um
  L_M:
    quantity: myosin_filament_length
    unit: um
outputs:
  Delta_F_shifted_over_F0:
    quantity: centering_free_energy_shifted_dimless
    unit: dimensionless
settings: {}
stochastic: false
