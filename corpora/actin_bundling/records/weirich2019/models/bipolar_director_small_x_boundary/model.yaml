id: bipolar_director_small_x_boundary
name: small-x midplane boundary limit of director misalignment angle
role: model
built_from:
  - bipolar_director_arc
stated:
  page: 10
  printed_page: "SI-4"
  quote: "with large y, the angle goes as sin(αd ) ∼ x/LD sin(α), as seen from Eq. 2"
  where: "SI Theory 2"
equation: "sin(alpha_d) = (x / L_D) * sin(alpha)"
inputs:
  x:
    quantity: axial_coordinate
    unit: um
  L_D:
    quantity: tactoid_semi_major_axis
    unit: um
  alpha:
    quantity: tactoid_tip_angle
    unit: rad
outputs:
  sin_alpha_d:
    quantity: director_misalignment_sine
    unit: dimensionless
settings: {}
stochastic: false
