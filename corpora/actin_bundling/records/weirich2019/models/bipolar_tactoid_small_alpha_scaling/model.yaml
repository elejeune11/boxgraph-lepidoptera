id: bipolar_tactoid_small_alpha_scaling
name: small-angle elongated bipolar tactoid volume and free-energy scaling
role: model
prefactor: unknown
stated:
  page: 11
  printed_page: "SI-5"
  quote: "constant V ∼ R3α5 . The free energy for a small angle tactoid"
  where: "SI Theory 3"
equation: "V ~ R^3 * alpha^5; F_bare ~ (K^2 / gamma) * alpha^3"
inputs:
  K:
    quantity: frank_elastic_constant
    unit: pN
  gamma:
    quantity: interfacial_tension
    unit: "nN/m"
  R:
    quantity: tactoid_arc_radius
    unit: um
  alpha:
    quantity: tactoid_tip_angle
    unit: rad
outputs:
  V:
    quantity: tactoid_volume
    unit: "um**3"
  F_bare:
    quantity: tactoid_bare_free_energy
    unit: "pN*um"
settings: {}
stochastic: false
