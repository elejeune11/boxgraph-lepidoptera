id: adhesion_dimensionless_params
name: dimensionless colloid adhesion control parameters for spherical and elongated regimes
role: model
stated:
  page: 12
  printed_page: "SI-6"
  quote: "droplet free energy parameter (which is the surface tension, γ, for spherical droplets, and K 2/(γa2) for elongated droplets)"
  where: "SI Theory 3 & Figs. 4D, S11"
equation: "W_sph = w / gamma; W_el = w * a^2 * gamma / K^2"
inputs:
  w:
    quantity: colloid_adhesion_energy_density
    unit: "nN/m"
  gamma:
    quantity: interfacial_tension
    unit: "nN/m"
  K:
    quantity: frank_elastic_constant
    unit: pN
  a:
    quantity: colloid_radius
    unit: um
outputs:
  W_sph:
    quantity: dimensionless_adhesion_spherical
    unit: dimensionless
  W_el:
    quantity: dimensionless_adhesion_elongated
    unit: dimensionless
settings: {}
stochastic: false
