id: rod_centering_energy_transverse
name: transverse rod centering free-energy integral Delta_F / f_0 vs y_c / L_y (Eq. 3 LHS / Fig. S5)
role: model
built_from:
  - rod_centering_energy_integral
stated:
  page: 17
  printed_page: "SI-11"
  quote: "Free energy landscape for transverse forces on myosin motor filament for motor filaments of different lengths as a function of their distance"
  where: "Fig. S5 & SI Theory 2, Eq. 3 LHS"
equation: "Delta_F / f_0 = int_{x_c - L_M/2}^{x_c + L_M/2} dx |sin(alpha_d(x, v*L_y))| with v = y_c / L_y"
inputs:
  v:
    quantity: normalized_transverse_position
    unit: dimensionless
  x_c:
    quantity: rod_center_axial_position
    unit: um
  L_D:
    quantity: tactoid_semi_major_axis
    unit: um
  L_y:
    quantity: tactoid_semi_minor_axis
    unit: um
  L_M:
    quantity: myosin_filament_length
    unit: um
outputs:
  Delta_F_over_f0:
    quantity: centering_free_energy_over_f0
    unit: um
settings:
  n_quad: 16
stochastic: false
