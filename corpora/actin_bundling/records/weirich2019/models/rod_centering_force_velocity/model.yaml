id: rod_centering_force_velocity
name: overdamped nonlinear centering force and velocity from Eq. 4
role: model
built_from:
  - rod_centering_energy_eq4
stated:
  page: 10
  printed_page: "SI-4"
  quote: "shows the centering velocity of the motor rod in different-sized tactoids in the overdamped regime"
  where: "SI Theory 2 & Fig. S7"
equation: "f(x_c) = |d(Delta_F)/dx_c|; v(x_c) = f(x_c) / Gamma"
inputs:
  F_0:
    quantity: centering_energy_scale
    unit: "pN*nm"
  x_c:
    quantity: rod_center_axial_position
    unit: um
  L_D:
    quantity: tactoid_semi_major_axis
    unit: um
  L_M:
    quantity: myosin_filament_length
    unit: um
  Gamma:
    quantity: rod_drag_coefficient
    unit: "pN*s/um"
outputs:
  f:
    quantity: centering_force
    unit: pN
  v:
    quantity: myosin_centering_speed
    unit: "nm/s"
settings: {}
stochastic: false
