id: rod_centering_energy_scale_from_k
name: centering free-energy scale F_0 inverted from Eq. 5 spring constant
role: model
built_from:
  - rod_centering_spring_constant
stated:
  page: 11
  printed_page: "SI-5"
  quote: "The centering free energy scale may then be estimated from the expression for the force constant given in Eq. 5"
  where: "SI Theory 2"
equation: "F_0 = k * (L_M^2 - 4*L_D^2)^2 / (16 * (L_M^2 + 4*L_D^2))"
inputs:
  k:
    quantity: centering_spring_constant
    unit: "pN/um"
  L_D:
    quantity: tactoid_semi_major_axis
    unit: um
  L_M:
    quantity: myosin_filament_length
    unit: um
outputs:
  F_0:
    quantity: centering_energy_scale
    unit: "pN*nm"
settings: {}
stochastic: false
