id: rod_centering_spring_constant
name: effective harmonic centering spring constant (Eq. 5)
role: model
built_from:
  - rod_centering_energy_eq4
stated:
  page: 10
  printed_page: "SI-4"
  quote: "Close to the midplane, xc LD , a harmonic approximation to the potential"
  where: "SI Theory 2, Eq. 5 (also Fig. S6)"
equation: "k = 16 * F_0 * (L_M^2 + 4*L_D^2) / (L_M^2 - 4*L_D^2)^2"
inputs:
  F_0:
    quantity: centering_energy_scale
    unit: "pN*nm"
  L_D:
    quantity: tactoid_semi_major_axis
    unit: um
  L_M:
    quantity: myosin_filament_length
    unit: um
outputs:
  k:
    quantity: centering_spring_constant
    unit: "pN/um"
  k_over_F0:
    quantity: centering_spring_constant_norm
    unit: "1/um**2"
settings: {}
stochastic: false
