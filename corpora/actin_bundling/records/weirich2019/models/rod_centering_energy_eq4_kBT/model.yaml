id: rod_centering_energy_eq4_kBT
name: shifted rod centering free energy in units of k_B T vs normalized midplane distance (Eq. 4 / Fig. 2F)
role: model
built_from:
  - rod_centering_energy_eq4
stated:
  page: 3
  printed_page: "11127"
  quote: "Continuum-model free-energy plots of two myosin puncta of different"
  where: "Fig. 2F & SI Theory 2, Eq. 4"
equation: "Delta_F / (k_B T) = (F_0 / (k_B T)) * (Delta_F(u*L_D) - Delta_F(0)) / F_0 from Eq. 4 with u = d / L_D"
inputs:
  u:
    quantity: normalized_midplane_distance
    unit: dimensionless
  L_D:
    quantity: tactoid_semi_major_axis
    unit: um
  L_M:
    quantity: myosin_filament_length
    unit: um
  F0_kBT:
    quantity: centering_energy_scale_kBT
    unit: dimensionless
outputs:
  Delta_F_kBT:
    quantity: centering_free_energy_kBT
    unit: dimensionless
settings: {}
stochastic: false
