id: bipolar_tactoid_equilibrium_exact
name: fixed-volume bare bipolar tactoid equilibrium minimization (Eq. 6)
role: model
built_from:
  - bipolar_tactoid_geometry_eq6
described_from: ref-si-9
stated:
  page: 11
  printed_page: "SI-5"
  quote: "explicitly minimizing Fel(α) + Fs(α) with respect to α with constant V"
  where: "SI Theory 3"
equation: "min_{alpha in (0, pi/2]} [K*R(alpha)*f_el(alpha) + gamma*R(alpha)^2*f_s(alpha)], R(alpha) = (V / v(alpha))^(1/3)"
inputs:
  K:
    quantity: frank_elastic_constant
    unit: pN
  gamma:
    quantity: interfacial_tension
    unit: "nN/m"
  V:
    quantity: tactoid_volume
    unit: "um**3"
outputs:
  alpha_eq:
    quantity: tactoid_tip_angle
    unit: rad
  R_eq:
    quantity: tactoid_equilibrium_arc_radius
    unit: um
  AR_eq:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
  F_eq:
    quantity: tactoid_bare_free_energy
    unit: "pN*um"
settings:
  n_grid: 200
  tol: 1.0e-8
stochastic: false
