id: elongated_tactoid_division_energy
name: two-tactoid free energy for highly elongated tactoids on an adhesive colloid (Eq. 8)
role: model
stated:
  page: 11
  printed_page: "SI-5"
  quote: "For a very elongated tactoid, with small tip angle, α, in contact with the colloid"
  where: "SI Theory 3, Eq. 8 & Fig. S10"
equation: "F(alpha) = (K^2/gamma)*alpha^3 - w*a^2*alpha; F_tot/(K^2/gamma) = alpha_1^3 + alpha_2^3 - W_el*(alpha_1 + alpha_2) with alpha_1^5 + alpha_2^5 = V_d/V_c"
inputs:
  W_el:
    quantity: dimensionless_adhesion_elongated
    unit: dimensionless
  V_ratio:
    quantity: droplet_to_cluster_volume_ratio
    unit: dimensionless
  f_V:
    quantity: droplet_volume_partition_fraction
    unit: dimensionless
  K:
    quantity: frank_elastic_constant
    unit: pN
  gamma:
    quantity: interfacial_tension
    unit: "nN/m"
outputs:
  F_tot_dimless:
    quantity: division_free_energy_elongated_dimless
    unit: dimensionless
  F_tot:
    quantity: division_free_energy_elongated
    unit: "pN*um"
  d2F_sym:
    quantity: division_second_derivative_elongated
    unit: dimensionless
settings: {}
stochastic: false
