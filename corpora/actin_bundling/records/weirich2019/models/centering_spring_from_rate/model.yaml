id: centering_spring_from_rate
name: centering spring constant inferred from viscous drag and relaxation rate
role: model
built_from:
  - centering_kinetics_force_balance
stated:
  page: 11
  printed_page: "SI-5"
  quote: "estimate a force constant, k ∼ Γ · τ −1 ∼ 10−2 pN/µm"
  where: "SI Theory 2"
equation: "k = Gamma * tau_inv"
inputs:
  Gamma:
    quantity: rod_drag_coefficient
    unit: "pN*s/um"
  tau_inv:
    quantity: centering_rate
    unit: "1/s"
outputs:
  k:
    quantity: centering_spring_constant
    unit: "pN/um"
settings: {}
stochastic: false
