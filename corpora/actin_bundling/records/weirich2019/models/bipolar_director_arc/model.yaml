id: bipolar_director_arc
name: local bipolar director circle radius and rod misalignment angle (Eqs. 1-2)
role: model
stated:
  page: 10
  printed_page: "SI-4"
  quote: "such that the local angle of the rod with respect to the director line is"
  where: "SI Theory 2, Eqs. 1-2"
equation: "R^2 = L_D^2 + (L_D^2 - x^2 - y^2)^2 / (4*y^2); sin(alpha_d) = x / R = 2*x*y / (4*y^2*L_D^2 + (L_D^2 - x^2 - y^2)^2)^(1/2)"
inputs:
  x:
    quantity: axial_coordinate
    unit: um
  y:
    quantity: transverse_coordinate
    unit: um
  L_D:
    quantity: tactoid_semi_major_axis
    unit: um
outputs:
  R:
    quantity: director_arc_radius
    unit: um
  sin_alpha_d:
    quantity: director_misalignment_sine
    unit: dimensionless
settings: {}
stochastic: false
