id: spherical_droplet_division_phase_diagram
name: spherical droplet division phase boundaries (Fig. 4D black and red curves)
role: model
built_from:
  - spherical_droplet_division_energy
stated:
  page: 12
  printed_page: "SI-6"
  quote: "The solid black dots are numeric solutions of the condition, d2F/dr21 = 0"
  where: "SI Theory 3 & Fig. 4D"
equation: "W_sym = 2*(1 + x*^2)^(5/2)/(1 + 4*x*^2), x*=(V_ratio/2)^(1/3); W_unequal = 2*(1 - 1/x_2)/(1/(2*sqrt(2)) - 1/(x_2*(1 + x_2^2)^(3/2))), x_2=(V_ratio - 1)^(1/3)"
inputs:
  V_ratio:
    quantity: droplet_to_cluster_volume_ratio
    unit: dimensionless
outputs:
  W_sym:
    quantity: critical_adhesion_symmetric_spherical
    unit: dimensionless
  W_unequal:
    quantity: critical_adhesion_unequal_spherical
    unit: dimensionless
settings: {}
stochastic: false
