id: elongated_tactoid_unequal_boundary
name: elongated tactoid unequal-to-single transition boundary V_d/V_c(W_el) (Fig. S11 red dots)
role: model
built_from:
  - elongated_tactoid_division_phase_diagram
stated:
  page: 23
  printed_page: "SI-17"
  quote: "Equal division becomes favorable as the adhesion energy scale"
  where: "Fig. S11 & SI Theory 3 (p. 12)"
equation: "V_ratio_unequal = 1 + (W_el / (3 - W_el))^(5/2)"
inputs:
  W_el:
    quantity: dimensionless_adhesion_elongated
    unit: dimensionless
outputs:
  V_ratio_unequal:
    quantity: droplet_to_cluster_volume_ratio
    unit: dimensionless
settings: {}
stochastic: false
