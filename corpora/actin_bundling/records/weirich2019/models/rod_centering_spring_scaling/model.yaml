id: rod_centering_spring_scaling
name: large-tactoid scaling of centering spring constant (L_D >> L_M limit of Eq. 5)
role: model
prefactor: unknown
built_from:
  - rod_centering_spring_constant
stated:
  page: 10
  printed_page: "SI-4"
  quote: "This maybe seen through Eq. 5 which for LD LM , suggests k ∼ L−2"
  where: "SI Theory 2"
equation: "k ~ F_0 / L_D^2"
inputs:
  F_0:
    quantity: centering_energy_scale
    unit: "pN*nm"
  L_D:
    quantity: tactoid_semi_major_axis
    unit: um
outputs:
  k:
    quantity: centering_spring_constant
    unit: "pN/um"
settings: {}
stochastic: false
