# ==========================================================================
# Numerical convergence refinements for quadrature and optimization models
# ==========================================================================

- id: ref_bipolar_eq_ngrid
  run: run_bipolar_eq_exact
  setting: n_grid
  factors: [1, 2, 4]
  mode: multiply
  output: alpha_eq
  tolerance: "0.01%"
  tolerance_basis: "added: tight grid convergence tolerance for smooth 1D fixed-volume minimization of Eq. 6"
  tolerance_added: true

- id: ref_bipolar_eq_tol
  run: run_bipolar_eq_exact
  setting: tol
  factors: [1, 10, 100]
  mode: divide
  output: F_eq
  tolerance: "0.01%"
  tolerance_basis: "added: tight optimizer tolerance for Brent minimization of Eq. 6"
  tolerance_added: true

- id: ref_eq3_exact_nquad
  run: run_eq3_exact
  setting: n_quad
  factors: [1, 2, 4, 8]
  mode: multiply
  output: Delta_F
  tolerance: "0.01%"
  tolerance_basis: "added: Gauss-Legendre quadrature convergence for exact Eq. 3 LHS integral"
  tolerance_added: true

