# Cross-record provenance links from weirich2019 values to weirich2017
# (Weirich et al., PNAS 114(9), 2131-2136, 2017; main ref-17 / SI ref-si-8).
#
# Audit of all `from_source` datums in weirich2019/data.yaml citing weirich2017:
# 1. `eta_tactoid_main` ('~3 Pa*s', p. 4, `from_source: ref-17`) and `eta_tactoid_si`
#    ('~3 Pa*s', p. 11, `from_source: ref-si-8`) both inherit `source: weirich2017`
#    from weirich2019/references.yaml and match `weirich2017/eta_frap_est` ('~3 Pa*s',
#    SI p. 8 / Main p. 2).
# 2. `gamma_tactoid_si` ('~300 nN/m', p. 9, `from_source: ref-si-8`) inherits
#    `source: weirich2017` and matches `weirich2017/gamma_I_est_main` ('~300 nN/m',
#    Main p. 4).
# 3. `actin_spacing_main` ('~50 nm', p. 4, `from_source: ref-17`: "estimate a ~50-nm
#    spacing between actin filaments (17)") is intentionally left UNLINKED because
#    weirich2017 never prints '50 nm' anywhere in its main text, SI, or figures:
#    weirich2017 SI p. 7 describes the fluorescence cross-sectional-area method for
#    estimating filament spacing and Main p. 1 prints `c_actin_tactoid_est` = '250 uM'
#    monomeric actin (which for parallel aligned filaments at 2.7 nm/monomer implies
#    1/sqrt(c_m * N_A * 2.7 nm) = 49.6 nm ~ 50 nm), without stating 50 nm numerically.
#    See `q_bipolar_vs_homogeneous_weirich2017` and
#    `q_weirich2017_cross_model_crossover_and_spacing` in questions.yaml.
# 4. `K_frank_si` ('~1 pN', p. 9) cites SI Refs. (8, 15) jointly and declares
#    `from_source: ref-si-15` (Oakes et al. 2007, not in corpus); weirich2017 never
#    prints a numerical value for the Frank elastic constant K.
# 5. Neither bois2011 nor hannezo2015 is cited by weirich2019 (0 cited-value links).

- datum: eta_tactoid_main
  from_datum: eta_frap_est
  evidence: "Main text p. 4 (printed p. 11128, citing ref-17 Weirich et al. 2017) uses the 'previously estimated viscosity of actin tactoids, eta ~ 3 Pa*s', directly matching weirich2017's FRAP Stokes-Einstein viscosity estimate `eta_frap_est` ('~3 Pa*s', Main p. 2 & SI p. 8)."

- datum: eta_tactoid_si
  from_datum: eta_frap_est
  evidence: "SI Theory 2 (p. 11 / printed p. SI-5, citing ref-si-8 Weirich et al. 2017) cites 'viscosity of the fluid-like actin in the medium, eta ~ 3 Pa*s, estimated in Ref. (8) from FRAP experiments', directly matching `weirich2017/eta_frap_est` ('~3 Pa*s', SI p. 8)."

- datum: gamma_tactoid_si
  from_datum: gamma_I_est_main
  evidence: "SI Theory 1 (p. 9 / printed p. SI-3, citing ref-si-8 Weirich et al. 2017 and ref-si-15 Oakes et al. 2007) cites 'gamma ~ 300 nN/m estimated previously for actin tactoids', directly matching `weirich2017/gamma_I_est_main` ('~300 nN/m', Main p. 4)."
