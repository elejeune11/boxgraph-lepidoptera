# ==========================================================================
# Unstated inputs required to run continuum models and quantitative checks
# ==========================================================================

- id: x_probe_added
  quantity: axial_coordinate
  unit: um
  printed: "1.0"
  basis: "Representative axial coordinate inside a tactoid of semi-major axis L_D = 3.0 um (matching x_c = 1 um in Fig. S5) for evaluating Eqs. 1-2."
  alternatives: ["0.5", "2.0"]
  stands_for: "x in Eqs. 1-2"

- id: y_probe_added
  quantity: transverse_coordinate
  unit: um
  printed: "0.5"
  basis: "Representative transverse coordinate midway between the major axis and outer boundary L_y = 1 um (Fig. S5) for evaluating Eqs. 1-2."
  alternatives: ["0.1", "1.0"]
  stands_for: "y in Eqs. 1-2"

- id: yc_probe_added
  quantity: rod_center_transverse_position
  unit: um
  printed: "0.5"
  basis: "Representative transverse offset y_c of a myosin rod center inside a tactoid of semi-minor axis L_y = 1 um (Fig. S5); unstated in SI Eq. 3 and Fig. S4."
  alternatives: ["0.1", "1.0"]
  stands_for: "y_c in Eq. 3"

- id: xc_probe_added
  quantity: rod_center_axial_position
  unit: um
  printed: "1.6"
  basis: "Representative mid-displacement d = 0.5*L_D = 1.6 um for L_D = 3.2 um (Fig. 2F) to evaluate Eq. 3-4 free energy and overdamped centering velocity."
  alternatives: ["0.8", "2.0"]
  stands_for: "x_c (or d) in Eqs. 3-4 and Fig. 2F"

- id: f0_probe_added
  quantity: alignment_energy_per_length
  unit: pN
  printed: "0.08"
  basis: "Derived from F_0 = f_0 * y_c with F_0 ~ 10 k_B T = 40 pN*nm and y_c = 0.5 um (40 pN*nm / 500 nm = 0.08 pN); f_0 itself is not numerically stated."
  alternatives: ["0.04", "0.2"]
  stands_for: "f_0 in Eq. 3"

- id: alpha_local_added
  quantity: director_misalignment_angle
  unit: rad
  printed: "0.5"
  basis: "Representative nonzero misalignment angle (~29 deg) for evaluating the local Onsager misalignment cost Delta F = F_0 |sin(alpha)| on SI p. 9."
  alternatives: ["0.2", "1.0"]
  stands_for: "alpha in Delta F = F_0 |sin(alpha)| (SI p. 9)"

- id: c_a_tactoid_added
  quantity: actin_filament_number_density
  unit: "1/um**3"
  printed: "2000"
  basis: "Estimated from ~50 nm inter-filament spacing (Main p. 4) and ~200 nm filament length: c_a ~ 1 / ((0.05 um)^2 * 0.2 um) = 2000 um^-3; unstated for the Onsager F_0 scaling on SI p. 9."
  alternatives: ["500", "4000"]
  stands_for: "c_a in F_0 ~ D_M * L_M * L_a * c_a * (k_B T) (SI p. 9)"

- id: alpha_tactoid_probe_added
  quantity: tactoid_tip_angle
  unit: rad
  printed: "0.6435"
  basis: "Tip half-angle alpha = 2*arccot(3) = 0.6435 rad corresponding to the Fig. S5 tactoid aspect ratio cot(alpha/2) = 3 (L_D = 3 um, L_y = 1 um)."
  alternatives: ["0.3", "1.570796"]
  stands_for: "alpha in Eq. 6 and aspect ratio = cot(alpha/2)"

- id: R_tactoid_probe_added
  quantity: tactoid_arc_radius
  unit: um
  printed: "5.0"
  basis: "Circular-arc radius R = L_D / sin(alpha) = 3.0 / 0.6 = 5.0 um for the Fig. S5 tactoid (L_D = 3 um, aspect ratio 3); also matches typical ~5 um tactoid size."
  alternatives: ["3.33", "10.0"]
  stands_for: "R in Eq. 6"

- id: V_tactoid_probe_added
  quantity: tactoid_volume
  unit: "um**3"
  printed: "20"
  basis: "Typical volume of an elongated bipolar actin tactoid with L_D ~ 3.5 um and L_y ~ 1.2 um (V ~ (4/3)*pi*1.2^2*3.5 ~ 21 um^3) for fixed-volume equilibrium minimization of Eq. 6."
  alternatives: ["5", "100"]
  stands_for: "V in fixed-volume minimization of Eq. 6 (SI p. 11)"

- id: traversal_distance_added
  quantity: traversal_distance
  unit: um
  printed: "1"
  basis: "SI p. 11 states 'nm/s seen there imply ~ 20 minutes for traversing ~ um' without a numeric prefix before 'um'; interpreted as 1 um."
  alternatives: ["1.5", "2.0"]
  stands_for: "'~ um' traversal distance on SI p. 11"

- id: speed_unit_nm_s_added
  quantity: myosin_centering_speed
  unit: nm/s
  printed: "1"
  basis: "SI p. 11 states 'The slow speeds of nm/s seen there imply ~ 20 minutes for traversing ~ um' without a numeric prefix before 'nm/s'; interpreted as 1 nm/s (compare ~1.4 nm/s on Main p. 3)."
  alternatives: ["0.8", "1.4"]
  stands_for: "'nm/s' speed on SI p. 11"

- id: a_colloid_added
  quantity: colloid_radius
  unit: um
  printed: "0.6"
  basis: "Representative myosin cluster radius (diameter ~1.2 um, consistent with Main p. 2 'micrometer-sized myosin cluster' and Fig. S1 late cluster width 1.2 um); unstated numerically in SI Section 3."
  alternatives: ["0.4", "0.9"]
  stands_for: "a in Eqs. 6-8"

- id: w_adhesion_probe_added
  quantity: colloid_adhesion_energy_density
  unit: "nN/m"
  printed: "1050"
  basis: "Corresponding to w/gamma = 3.5 (Fig. 4A equal-division regime) with gamma = 300 nN/m (SI p. 9): w = 3.5 * 300 = 1050 nN/m."
  alternatives: ["450", "750"]
  stands_for: "w in Eqs. 6-8"

- id: V_ratio_fig4a_S9_added
  quantity: droplet_to_cluster_volume_ratio
  unit: dimensionless
  printed: "4"
  basis: "Unstated in Figs. 4A and S9 captions; uniquely matched by Eq. 7 reproducing Fig. S9's unequal minimum at V_1/(V_1+V_2) ~ 0.15 for w/gamma = 2.5 and Fig. 4A's normalized curve shapes."
  alternatives: ["3", "5"]
  stands_for: "V_d / V_c in Figs. 4A and S9"

- id: V_ratio_figS10_added
  quantity: droplet_to_cluster_volume_ratio
  unit: dimensionless
  printed: "1"
  basis: "Unstated in Fig. S10 caption; matched by Eq. 8 reproducing Fig. S10's unequal minimum at V_1/(V_1+V_2) ~ 0.018 for w*a^2*gamma/K^2 = 0.5."
  alternatives: ["2", "3"]
  stands_for: "V_d / V_c in Fig. S10"

- id: V_ratio_phase_probe_added
  quantity: droplet_to_cluster_volume_ratio
  unit: dimensionless
  printed: "5"
  basis: "Mid-range point on the vertical axis (1 to 20+) of Figs. 4D and S11 for evaluating both symmetric (black) and unequal-to-single (red) phase boundaries."
  alternatives: ["2.5", "10"]
  stands_for: "V_droplet / V_cluster (V_d / V_c) in Figs. 4D and S11"

- id: fV_equal_added
  quantity: droplet_volume_partition_fraction
  unit: dimensionless
  printed: "0.5"
  basis: "Equal-division partition V_1/(V_1+V_2) = 0.5 (r_1 = r_2 = r* on SI p. 12)."
  alternatives: ["0.15", "0.2"]
  stands_for: "V_1 / (V_1 + V_2) in Figs. S9-S10"

- id: Ly_figS5_LD3p6_added
  quantity: tactoid_semi_minor_axis
  unit: um
  printed: "1.2"
  basis: "Semi-minor axis L_y = L_D / 3 = 3.6 / 3 = 1.2 um maintaining Fig. S5 caption's aspect ratio of 3 with the experimental L_D = 3.6 um (Fig. 2D black x's) that actually generated Figs. 2F, S4, and S5."
  alternatives: ["1.0", "1.1"]
  stands_for: "L_y = L_D / 3 in Fig. S5 for L_D = 3.6 um"

# ==========================================================================
# Cross-record validation inputs (Weirich et al. 2017 tactoid volumes)
# ==========================================================================

- id: V_tactoid_2p5pct_weirich2017_added
  quantity: tactoid_volume
  unit: "um**3"
  printed: "6.26"
  basis: "Circular-arc volume V = 2*pi*R^3*(sin(alpha) - alpha*cos(alpha) - sin^3(alpha)/3) of a Weirich et al. (2017) 2.5 mol % filamin tactoid with typical major-axis length L = 5 um (weirich2017/tactoid_length_homogeneous_si, SI p. 8) and Fig. 2A measured aspect ratio L/r = 2.938 (weirich2017/d_fig2a_aspect_ratio; alpha = 2*arctan(1/2.938) = 0.6561 rad, R = 4.098 um -> V = 6.262 um^3). Alternatives span: 0.452 um^3 (self-consistent bipolar equilibrium length L_bip = 5.0 um at K = 1 pN, gamma = 300 nN/m), 6.00 um^3 (printed L = 5 um, L/r = 3), 16.3 um^3 (Weirich 2017 Table S1 10% coalescence L_eq = 6.04 um at AR = 2.438), and 27.5 um^3 (Weirich 2019 Fig. 2D L_D = 3.6 um -> L = 7.2 um at AR = 2.438)."
  alternatives: ["0.452", "6.00", "16.3", "27.5"]
  stands_for: "V in fixed-volume bare bipolar equilibrium Eq. 6 for Weirich 2017 2.5 mol % filamin tactoids"

- id: V_tactoid_15pct_weirich2017_added
  quantity: tactoid_volume
  unit: "um**3"
  printed: "13.45"
  basis: "Circular-arc volume V = 2*pi*R^3*(sin(alpha) - alpha*cos(alpha) - sin^3(alpha)/3) of a Weirich et al. (2017) 15 mol % filamin tactoid with typical major-axis length L = 5 um (weirich2017/tactoid_length_homogeneous_si, SI p. 8) and Fig. 2A measured aspect ratio L/r = 2.037 (weirich2017/d_fig2a_aspect_ratio; alpha = 2*arctan(1/2.037) = 0.9126 rad, R = 3.160 um -> V = 13.45 um^3). Alternatives span: 0.452 um^3 (self-consistent bipolar equilibrium length L_bip = 5.0 um at K = 1 pN, gamma = 300 nN/m), 13.99 um^3 (printed L = 5 um, L/r = 2), 20 um^3 (weirich2019 typical tactoid probe V_tactoid_probe_added), and 78.3 um^3 (Weirich 2019 Fig. 2D largest droplet L_D = 5.1 um -> L = 10.2 um at AR = 2.438)."
  alternatives: ["0.452", "13.99", "20", "78.3"]
  stands_for: "V in fixed-volume bare bipolar equilibrium Eq. 6 for Weirich 2017 15 mol % filamin tactoids"
