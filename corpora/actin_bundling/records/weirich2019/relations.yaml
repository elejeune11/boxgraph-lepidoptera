- id: rel_eq4_velocity_reduces_to_harmonic
  kind: reduces_to
  a: weirich2019/rod_centering_force_velocity
  b: weirich2019/centering_kinetics_force_balance
  mapping:
    k: "16 * (F_0 / 1000) * (L_M**2 + 4 * L_D**2) / (L_M**2 - 4 * L_D**2)**2"
    Gamma: "Gamma"
    d: "x_c"
  output_map:
    v: v
  regime:
    F_0: [10.0, 100.0]
    x_c: [0.001, 0.1]
    L_D: [3.0, 6.0]
    L_M: [0.4, 1.5]
    Gamma: [5.0, 30.0]
  limit:
    x_c: "0"
  provenance: stated
  tolerance: 1.0e-3
  citation:
    page: 10
    printed_page: "SI-4"
    quote: "This force balance relation is, kd = Γv, where k is the harmonic"
    where: "SI Theory 2, Eq. 5 & overdamped velocity"
  assumptions:
    - "Small-displacement harmonic limit x_c -> 0 of Eq. 4 overdamped centering velocity matches v = (k / Gamma) * d with Eq. 5 spring constant k."

