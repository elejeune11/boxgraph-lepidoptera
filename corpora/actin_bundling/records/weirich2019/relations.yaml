# ==========================================================================
# Within-paper model relations stated by Weirich et al. (2019)
# ==========================================================================

- id: rel_aspect_ratio_axes_same_as_angle
  kind: same_as
  a: weirich2019/tactoid_aspect_ratio_angle
  b: weirich2019/tactoid_aspect_ratio_from_axes
  mapping:
    L_D: "R * sin(alpha)"
    L_y: "R * (1 - cos(alpha))"
  output_map:
    AR: AR
  regime:
    R: [1.0, 10.0]
    alpha: [0.1, 1.5]
  provenance: stated
  citation:
    page: 9
    printed_page: "SI-3"
    quote: "also the tip angle of the tactoid and determines its aspect ratio = cot(α/2)"
    where: "SI Theory 2"
  assumptions:
    - "Circular-arc bipolar tactoid has semi-major axis L_D = R*sin(alpha) and semi-minor axis L_y = R*(1 - cos(alpha))."

- id: rel_director_arc_reduces_to_small_x_bdy
  kind: reduces_to
  a: weirich2019/bipolar_director_arc
  b: weirich2019/bipolar_director_small_x_boundary
  mapping:
    x: "x"
    L_D: "L_D"
    alpha: "2 * atan(y / L_D)"
  output_map:
    sin_alpha_d: sin_alpha_d
  regime:
    x: [0.001, 0.1]
    y: [0.3, 2.0]
    L_D: [2.0, 6.0]
  limit:
    x: "0"
  provenance: stated
  citation:
    page: 10
    printed_page: "SI-4"
    quote: "with large y, the angle goes as sin(αd ) ∼ x/LD sin(α), as seen from Eq. 2"
    where: "SI Theory 2"
  assumptions:
    - "Evaluated on the midplane tactoid boundary y = L_D * tan(alpha / 2) in the limit x -> 0."

