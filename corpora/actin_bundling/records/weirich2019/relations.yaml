    F_0: "1000 * f_0 * y_c"
    x_c: "x_c"
    L_D: "L_D"
    L_M: "L_M"
  output_map:
    Delta_F_over_F0: Delta_F_over_F0
  regime:
    f_0: [0.02, 0.2]
    x_c: [0.2, 1.5]
    y_c: [0.001, 0.1]
    L_D: [3.0, 5.0]
    L_M: [0.4, 1.2]
