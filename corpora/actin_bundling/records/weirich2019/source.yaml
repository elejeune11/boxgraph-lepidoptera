notes: >
  In scope: the complete quantitative core of the main article (PNAS 116(23), 11125-11130,
  PDF pp. 1-6) and Supporting Information Appendix (PDF pp. 7-25): experimental sample
  composition (actin, capping protein, filamin, myosin II, methylcellulose) and droplet
  morphology statistics, bipolar nematic tactoid crossover length K/gamma and circular-arc
  aspect ratio cot(alpha/2), continuum model of myosin-rod centering in a bipolar tactoid
  (Eqs. 1-5: circular director arc radius R(x,y), local misalignment angle sin(alpha_d),
  small-x boundary limit, exact axial misalignment energy integral and small-y approximation,
  piecewise analytical energy Delta F/F_0, overdamped centering velocity, harmonic spring
  constant k and L_D^-2 scaling, Stokes-Einstein rod drag Gamma, centering timescale tau,
  and centering energy scale F_0 in pN*nm and k_B T), and continuum model of myosin-cluster
  (adhesive spherical colloid with normal anchoring) induced tactoid division (Eqs. 6-8:
  exact bipolar elastic/surface/volume geometric factors f_el(alpha), f_s(alpha), v(alpha),
  fixed-volume elongated tactoid equilibrium minimization, spherical-droplet division free
  energy and two-droplet equilibrium/stability phase boundaries, and highly elongated tactoid
  division free energy and phase boundaries).
  Deferred to the separate digitize stage (not digitized here): quantitative plots Figs. 1G,
  2B, 2C (+ inset), 2D, 2E, 2F, 4A, 4B, 4D, S1, S4, S5, S6, S7, S9, S10, and S11.
  Left out as qualitative cartoons, micrographs, or movie captions without plotted quantitative
  axes: Figs. 1A-1F, 2A, 2E inset, 3A-3B, 4C, 4E, S2, S3, S8, and routine protein purification,
  storage buffer, lipid extrusion, UV/ozone cleaning, oxygen scavenging, and laser imaging
  protocols on SI p. 8 that feed no quantitative model.
  Key algebraic, unit, and internal-consistency findings captured via printed models, evidenced
  variant_of correction, within-paper ModelAtlas relations, and open questions:
  (1) 1000-fold unit misprint in centering energy scale (SI p. 11): inverting Eq. 5 with
  L_D = 3.2 um, L_M = 1.5 um, and k = 10^-2 to 1.5x10^-2 pN/um gives F_0 = 21.7 to 32.5 pN*nm
  (5.4 to 8.1 k_B T, ~10 k_B T), whereas SI p. 11 prints 'F_0 ~ 30 pN * um' (which divided by
  k_B T = 4 pN*nm equals 7,500 k_B T).
  (2) Missing factor of 2 in Eq. 3 RHS (SI p. 10): expanding Eq. 2 to O(y) yields
  2*x*y/(L_D^2 - x^2), whose integral equals Eq. 4 exactly with F_0 = f_0*y_c; printed Eq. 3
  RHS omits the factor of 2 and integrates to 0.5x Eq. 4 (tested via variant_of model and
  ModelAtlas relations).
  (3) Slope continuity of Eq. 4 (SI p. 10): SI text claims Eq. 4 has discontinuities in slope
  at x_c = +-L_M/2, whereas d(Delta F)/dx_c is continuous (2*F_0*L_M/(L_D^2 - L_M^2)) and only
  the curvature d^2(Delta F)/dx_c^2 jumps by -4*F_0/L_D^2.
  (4) Stokes-Einstein drag prefactor (SI p. 11): printed Gamma = 6*pi*eta*L_M/log(L_M/D_M) gives
  21.7 pN*s/um at L_M = 1.5 um (16.1 at L_M = 1.0 um) vs printed ~15 pN*s/um, and uses full
  length L_M with the half-length ellipsoid prefactor 6*pi from weirich2017.
  (5) L_D definition and Fig. S4/S5/2D parameter mismatches: Fig. S4 and S5 captions state
  L_M = 1.5, 0.73, 0.33 um in L_D = 3 um (ratios 0.50, 0.243, 0.110), contradicting their
  legends and plotted curves (L_M/L_D = 0.4, 0.2, 0.1); SI p. 10 assigns L_D = 3.2 um to Fig. 2D
  blue circles labeled L_D = 4.4 um; Main p. 4 prints L_M = 0.3 um vs Fig. 2F 0.33 um.
  (6) General Eq. 6 unstated f_w(R/a, alpha) and 3D vs 2D wetting scaling in Eq. 8 (SI p. 11):
  exact 3D orthogonal-sphere-tactoid wetting area scales as alpha^2 (L_D >> a) or alpha^4
  (L_D << a), not linearly as alpha (2D arc-length scaling used verbatim in Eq. 8 and Fig. S11);
  Eqs. 7-8 drop geometric prefactors (4*pi vs 2*pi in Eq. 7), and Figs. S9-S10 individually
  shift and rescale curves despite Fig. S9 caption stating units of gamma*a^2.
  (7) Bipolar vs homogeneous crossover with weirich2017 (SI p. 9) and editorial/figure-number
  shifts across SI text, captions (Fig. S9 inverted 'higher values of gamma', Fig. S6 'green'
  for red curve, Fig. 4E 'vi' for 'iv', Fig. S2 '10 uM' scale bar, SI Ref. 8 year '2007').
