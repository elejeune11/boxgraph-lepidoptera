- id: q_mu_viscosity_misprint
  kind: possible_error
  about: [einstein_diffusion_relation, langevin_overdamped_1d]
  text: >
    Methods S1 (p. 42) writes dx^{ij}(t) = mu * f^{ij}_{tot}(t) * dt + dB_j(t) and D = mu * k_B T,
    but verbally defines mu as 'the viscosity of the solvent'. Dimensionally and physically, mu in
    both equations must be the particle hydrodynamic mobility (units um/(pN*s)), not solvent dynamic
    viscosity eta (units pN*s/um^2 = Pa*s); substituting viscosity 0.5 pN*s/um^2 into D = mu * k_B T
    yields mismatched units (pN^2*s/um rather than um^2/s).
  citation:
    page: 42
    printed_page: "SI-19"
    quote: "Here, µ is the viscosity of the solvent"
    where: "Methods S1 (Position evolution)"

- id: q_stokes_einstein_vs_prescribed_D
  kind: unexplained_difference
  about: [stokes_einstein_diffusion, sim_crosslinker_diffusion_rate, sim_condensate_viscosity, sim_crosslinker_radius, cmp_stokes_einstein_vs_prescribed_D]
  text: >
    Table S1 (pp. 25-27) specifies condensate viscosity eta = 0.5 pN*s/um^2 (500x water) and
    crosslinker solid radius r = 30 nm alongside a prescribed diffusion rate D = 10 um^2/s for
    mini-Lpd dimers, VASP tetramers, and mini-Lpd monomers. By the Stokes-Einstein relation at
    T = 298 K (k_B T = 4.114 pN*nm), a 30 nm sphere in 0.5 Pa*s fluid has D_SE = 0.01455 um^2/s —
    a 687-fold discrepancy. A diffusivity of 10 um^2/s for a 30 nm sphere corresponds to a solvent
    viscosity of 0.00073 Pa*s (below pure water), not 500x water.
  citation:
    page: 25
    printed_page: "SI-2"
    quote: "Condensate viscosity 0.5 pN"
    where: "Table S1 (pp. 25-27)"

- id: q_brownian_step_exceeds_binding_radius
  kind: numerics
  about: [brownian_noise_stddev, sim_time_step, sim_crosslinker_diffusion_rate, sim_actin_binding_distance, sim_monomer_monomer_binding_distance]
  text: >
    At the Table S1 crosslinker diffusion rate D = 10 um^2/s and time step dt = 0.002 s, the single-step
    1D Brownian displacement standard deviation sigma_B = sqrt(2*D*dt) = 200 nm (3D RMS jump = 346 nm).
    This single-step diffusive jump is 6.7x larger than both the crosslinker solid radius (30 nm) and
    the actin-binding capture radius (30 nm), 2.2x larger than the monomer-monomer capture radius
    (90 nm), and 20% of the droplet radius (1000 nm), raising a numerical question about steric
    tunneling and reaction-encounter sampling at dt = 0.002 s (whereas at Stokes-Einstein
    D_SE = 0.01455 um^2/s, sigma_B = 7.6 nm).
  citation:
    page: 42
    printed_page: "SI-19"
    quote: "centered around a mean of 0 with a standard deviation of"
    where: "Methods S1 & Table S1"

- id: q_kd_dimensionless_and_fig5b_contradiction
  kind: possible_error
  about: [binding_affinity_printed, binding_affinity_molar]
  text: >
    Methods S1 (p. 43) states: 'Binding affinity (as shown in Figure 5B) can be calculated from
    K_d = k_unbind / k_bind.' This contains three inconsistencies: (1) on p. 42, k_bind is defined
    as a first-order mesoscopic rate (1/s) while k_{bind,2} = k_bind * N_AV * V_bind is the
    second-order association rate (M^-1 s^-1), so k_unbind / k_bind is a dimensionless ratio rather
    than a molar dissociation constant K_d = k_unbind / k_{bind,2} (0.587 uM for ring actin binding
    and 5.44 nM for dimerization at k_form = 10 s^-1, k_split = 0.1 s^-1); (2) Figure 5B (p. 9)
    plots k_dimer_form (1/s) vs k_dimer_split (1/s) and prints no K_d values; and (3) main text
    (p. 10) explicitly states 'this model lacks the necessary biochemical detail to support the
    calculation of meaningful binding constants for dimerization.'
  citation:
    page: 43
    printed_page: "SI-20"
    quote: "Binding affinity (as shown in Figure 5B) can be calculated from"
    where: "Methods S1 p. 43 vs Results p. 10 & Fig. 5B p. 9"

- id: q_icosphere_eight_triangles_misprint
  kind: possible_error
  about: [icosphere_subdivision_geometry_printed, icosphere_subdivision_geometry_icosahedron, sim_icosphere_init_triangles_printed, sim_icosphere_subdiv_printed, sim_icosphere_target_monomers, cmp_icosphere_printed_monomers]
  text: >
    Methods S1 (p. 43) states that 'The icosphere was generated by dividing the initial eight
    triangles 3 more times to generate triangles whose effective size was comparable to 10 actin
    monomers. [S4]'. An icosphere starts from a 20-triangle regular icosahedron, not 8 triangles
    (an octahedron). Eight triangles subdivided 3 times yield 512 faces on an R = 1 um sphere
    with equivalent equilateral edge length 238.1 nm (~88 actin monomers at 2.7 nm helical rise or
    ~43 monomers at 5.5 nm globular diameter), far coarser than 10 monomers. Even the cited method
    [S4] (Chandrasekaran et al., 2024) uses 20 initial faces subdivided 4 times (5,120 faces,
    s_eq = 75.3 nm, ~27.9 helical rises or ~13.7 globular monomer diameters).
  citation:
    page: 43
    printed_page: "SI-20"
    quote: "The icosphere was generated by dividing the initial eight triangles 3 more times"
    where: "Methods S1 (Actin-covered surface area calculation)"

