id: bell_slip_bond_unbinding
name: Bell slip-bond force-dependent unbinding rate (Methods S1)
role: model
stated:
  page: 43
  printed_page: "SI-20"
  quote: "The unbinding rate (kunbind) is force-sensitive and given by"
  where: "Methods S1 (Actin-droplet kinetics)"
equation: "k_unbind = k_unbind^0 * exp(F / F_unbind)"
inputs:
  k_unbind_0: {quantity: rate, unit: 1/s}
  F: {quantity: force, unit: pN}
  F_unbind: {quantity: force, unit: pN}
outputs:
  k_unbind: {quantity: rate, unit: 1/s}
settings: {}
stochastic: false
