id: icosphere_subdivision_geometry_printed
name: spherical triangulation from 8 initial triangles as literally printed (Methods S1)
role: processing
stated:
  page: 43
  printed_page: "SI-20"
  quote: "The icosphere was generated by dividing the initial eight triangles 3 more times"
  where: "Methods S1 (Actin-covered surface area calculation)"
equation: "N_faces = 8 * 4^n; s_eq = sqrt(4 * (4*pi*R_drop^2 / N_faces) / sqrt(3)); n_monomers = s_eq / d_mon"
inputs:
  R_drop: {quantity: droplet_radius, unit: um}
  n_subdiv: {quantity: icosphere_subdivision, unit: dimensionless}
  d_mon: {quantity: monomer_axial_rise, unit: nm}
outputs:
  n_faces: {quantity: count, unit: dimensionless}
  median_edge: {quantity: triangle_edge_length, unit: nm}
  eq_side: {quantity: triangle_edge_length, unit: nm}
  n_monomers: {quantity: monomer_equivalents, unit: dimensionless}
settings: {}
from_words: true
stochastic: false
