id: binary_condensate_stoichiometry
name: component concentrations in constant-total-protein mini-Lpd:VASP mixtures (Results p. 4)
role: processing
stated:
  page: 4
  printed_page: "1552"
  quote: "keeping the total protein concentration constant at 30 mM"
  where: "Results & Fig. 2C-D"
equation: "C_VASP = C_tot / (1 + r_Lpd_VASP); C_Lpd = C_tot * r_Lpd_VASP / (1 + r_Lpd_VASP)"
inputs:
  C_tot: {quantity: concentration, unit: uM}
  r_Lpd_VASP: {quantity: dimensionless_ratio, unit: dimensionless}
outputs:
  C_VASP: {quantity: concentration, unit: uM}
  C_Lpd: {quantity: concentration, unit: uM}
settings: {}
from_words: true
stochastic: false
