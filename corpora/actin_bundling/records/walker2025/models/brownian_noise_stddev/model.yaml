id: brownian_noise_stddev
name: single-timestep 1D Brownian displacement standard deviation (Methods S1)
role: model
stated:
  page: 42
  printed_page: "SI-19"
  quote: "centered around a mean of 0 with a standard deviation of"
  where: "Methods S1 (Position evolution)"
equation: "sigma_B = sqrt(2 * D * dt)"
inputs:
  D: {quantity: diffusion_coefficient, unit: um^2/s}
  dt: {quantity: time, unit: s}
outputs:
  sigma_B: {quantity: displacement, unit: nm}
settings: {}
stochastic: false
