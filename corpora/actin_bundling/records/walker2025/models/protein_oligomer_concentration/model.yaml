id: protein_oligomer_concentration
name: native oligomer concentration from monomeric concentration (STAR Methods p. 22)
role: processing
stated:
  page: 22
  printed_page: "e3"
  quote: "All protein concentrations listed are the monomeric concentrations"
  where: "STAR Methods (Protein condensate formation) & Fig. 2A"
equation: "C_olig = C_mon / n_subunits"
inputs:
  C_mon: {quantity: concentration, unit: uM}
  n_subunits: {quantity: valency, unit: dimensionless}
outputs:
  C_olig: {quantity: concentration, unit: uM}
settings: {}
from_words: true
stochastic: false
