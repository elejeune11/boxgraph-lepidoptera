id: snapshot_count_from_fraction
name: total simulation snapshots and sampling interval from 5% tail window (Fig. 4K & Fig. S6G)
role: processing
stated:
  page: 8
  printed_page: "1556"
  quote: "the data were obtained from the last 30 snapshots (5%) of each replicate"
  where: "Fig. 4K caption & Fig. S6G caption p. 39"
equation: "N_total = N_last / f_last; dt_snap = t_sim / N_total"
inputs:
  N_last: {quantity: count, unit: dimensionless}
  f_last: {quantity: fraction, unit: percent}
  t_sim: {quantity: time, unit: s}
outputs:
  N_total: {quantity: count, unit: dimensionless}
  dt_snap: {quantity: time, unit: s}
settings: {}
from_words: true
stochastic: false
