id: binding_affinity_molar
name: molar dissociation constant K_d = k_unbind / k_{bind,2} (corrected variant of Methods S1)
role: model
stated:
  page: 43
  printed_page: "SI-20"
  quote: "Binding affinity (as shown in Figure 5B) can be calculated from"
  where: "Methods S1 (Actin-droplet kinetics)"
equation: "K_d = k_unbind / k_{bind,2}"
inputs:
  k_unbind: {quantity: rate, unit: 1/s}
  k_bind_2: {quantity: second_order_binding_rate, unit: uM^-1*s^-1}
outputs:
  K_d: {quantity: dissociation_constant, unit: uM}
settings: {}
stochastic: false
variant_of: binding_affinity_printed
corrections:
  - equation: "Methods S1, p. 43: K_d = k_unbind / k_bind"
    change: "Replace first-order mesoscopic rate k_bind (1/s) in denominator with second-order rate k_{bind,2} = k_bind * N_AV * V_bind (uM^-1*s^-1) so K_d has molar concentration dimensions."
    evidence: "Methods S1 (p. 42) defines k_bind as a first-order mesoscopic rate (1/s) and k_{bind,2} as the second-order binding rate with units of molarity^-1*s^-1; dividing first-order k_unbind (1/s) by first-order k_bind (1/s) yields a dimensionless ratio rather than a biochemical dissociation constant K_d."
