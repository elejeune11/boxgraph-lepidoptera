id: dynamic_dimer_max_count
name: maximum possible dimer count from diffusing monomer copy number (Fig. 5B)
role: processing
stated:
  page: 10
  printed_page: "1558"
  quote: "2,000 monomers (green spheres), which can form a maximum of 1,000 dimers"
  where: "Fig. 5B caption"
equation: "N_dimer_max = N_monomer / 2"
inputs:
  N_monomer: {quantity: crosslinker_count, unit: dimensionless}
outputs:
  N_dimer_max: {quantity: crosslinker_count, unit: dimensionless}
settings: {}
from_words: true
stochastic: false
