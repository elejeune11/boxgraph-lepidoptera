id: filament_elongation_rate
name: actin plus-end elongation rate to reach circumference 2*pi*R in t_sim (Table S1 & Methods S1)
role: processing
stated:
  page: 25
  printed_page: "SI-2"
  quote: "This rate is calculated by assuming a final filament length of 2π µm at 600 s"
  where: "Table S1 & Methods S1 p. 42"
equation: "k_grow = (2 * pi * R_drop - L0) / t_sim"
inputs:
  R_drop: {quantity: droplet_radius, unit: um}
  L0: {quantity: filament_length, unit: um}
  t_sim: {quantity: time, unit: s}
outputs:
  k_grow: {quantity: elongation_rate, unit: um/s}
settings: {}
from_words: true
stochastic: false
