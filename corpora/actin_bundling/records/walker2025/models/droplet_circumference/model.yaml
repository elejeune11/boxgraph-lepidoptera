id: droplet_circumference
name: maximum actin filament length equal to spherical condensate circumference (Table S1)
role: processing
stated:
  page: 25
  printed_page: "SI-2"
  quote: "Maximum length 2πR µm"
  where: "Table S1 (Actin filaments)"
equation: "L_max = 2 * pi * R_drop"
inputs:
  R_drop: {quantity: droplet_radius, unit: um}
outputs:
  L_max: {quantity: filament_length, unit: um}
settings: {}
from_words: true
stochastic: false
