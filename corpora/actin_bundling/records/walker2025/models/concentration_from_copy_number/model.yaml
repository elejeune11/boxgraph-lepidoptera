id: concentration_from_copy_number
name: molar crosslinker concentration from molecule copy number in spherical droplet (Table S1)
role: processing
stated:
  page: 26
  printed_page: "SI-3"
  quote: "Concentration of dimers 0.40 µM [1000 dimers]"
  where: "Table S1 (pp. 26-27)"
equation: "C = N / (N_A * (4/3) * pi * R_drop^3)"
inputs:
  N: {quantity: crosslinker_count, unit: dimensionless}
  R_drop: {quantity: droplet_radius, unit: um}
outputs:
  C: {quantity: concentration, unit: uM}
  V_drop: {quantity: volume, unit: um^3}
settings: {}
from_words: true
stochastic: false
