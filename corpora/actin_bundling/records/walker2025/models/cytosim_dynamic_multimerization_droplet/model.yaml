id: cytosim_dynamic_multimerization_droplet
name: 3D custom-CytoSim dynamic dimerization and dynamic multimerization droplet simulation
role: model
stated:
  page: 43
  printed_page: "SI-20"
  quote: "The implementation of our dynamic dimerization model required edits to the Cytosim"
  where: "Methods S1 & Tables S1-S2"
equation: "dx^{ij}(t) = mu f^{ij}_{tot}(t) dt + dB_j(t); dynamic monomer-monomer binding (valency 1 or 2) + actin binding (valency 1)"
inputs:
  R_drop: {quantity: droplet_radius, unit: um}
  N_fil: {quantity: filament_count, unit: dimensionless}
  N_monomers: {quantity: crosslinker_count, unit: dimensionless}
  monomer_valency: {quantity: valency, unit: dimensionless}
  k_bind_actin: {quantity: rate, unit: 1/s}
  k_unbind_actin: {quantity: rate, unit: 1/s}
  k_form: {quantity: rate, unit: 1/s}
  k_split: {quantity: rate, unit: 1/s}
  r_bind_monomer: {quantity: binding_distance, unit: nm}
  F_split: {quantity: force, unit: pN}
outputs:
  area_fraction: {quantity: surface_area_fraction, unit: dimensionless}
settings:
  dt: 0.002
  t_sim: 600.0
  seed: 0
described_from: ref-walker-code
runnable: false
not_runnable_reason: >
  Full 3D many-body simulation of 30 growing F-actin filaments and 2,000 dynamically dimerizing
  (Fig. 5) or multimerizing (Fig. S7) monovalent actin-binding spheres requires custom-modified
  C++ CytoSim source code (GitHub RangamaniLabUCSD/Dynamic_multimerization, Zenodo
  10.5281/zenodo.14522973) and unstated configuration details (monomer-monomer and monomer-actin
  bond spring stiffnesses, binding-site geometry on the 30 nm sphere, temperature T, and random seeds).
stochastic: true
