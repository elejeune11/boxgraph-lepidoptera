id: persistence_length_from_rigidity
name: worm-like chain persistence length from F-actin flexural rigidity
role: model
stated:
  page: 25
  printed_page: "SI-2"
  quote: "Actin flexural rigidity kbend 0.075 pN"
  where: "Table S1 & Introduction p. 2"
equation: "L_p = k_bend / (k_B * T)"
inputs:
  k_bend: {quantity: flexural_rigidity, unit: pN*um^2}
  kBT: {quantity: energy, unit: pN*nm}
outputs:
  L_p: {quantity: persistence_length, unit: um}
settings: {}
stochastic: false
reconstructed: >
  The paper quotes actin persistence length 10-20 um (pp. 2, 15, ref-17) and actin flexural
  rigidity k_bend = 0.075 pN*um^2 (Table S1 p. 25, ref-S3) without printing the worm-like
  chain identity L_p = k_bend / (k_B T); this reconstructed model tests their mutual consistency.
