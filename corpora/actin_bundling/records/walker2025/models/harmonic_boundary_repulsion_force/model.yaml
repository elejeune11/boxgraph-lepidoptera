id: harmonic_boundary_repulsion_force
name: linear harmonic confinement repulsion outside spherical condensate boundary (Table S1)
role: model
stated:
  page: 25
  printed_page: "SI-2"
  quote: "This specifies the spring stiffness that"
  where: "Table S1 (Boundary repulsion stiffness)"
equation: "F_rep = k_bound * max(0, r - R_drop)"
inputs:
  k_bound: {quantity: spring_stiffness, unit: pN/um}
  r: {quantity: radial_position, unit: um}
  R_drop: {quantity: droplet_radius, unit: um}
outputs:
  F_rep: {quantity: force, unit: pN}
settings: {}
from_words: true
stochastic: false
