id: mesoscopic_binding_rate_cylinder
name: mesoscopic actin-crosslinker binding rate from second-order rate in cylindrical volume (Methods S1)
role: model
stated:
  page: 42
  printed_page: "SI-19"
  quote: "The stochastic mesoscopic rates (kbind) employed in the simulations are related"
  where: "Methods S1 (Actin-droplet kinetics)"
equation: "k_bind = k_{bind,2} / (N_AV * pi * r_bind^2 * L_seg)"
inputs:
  k_bind_2: {quantity: second_order_binding_rate, unit: uM^-1*s^-1}
  r_bind: {quantity: binding_distance, unit: nm}
  L_seg: {quantity: filament_segment_length, unit: um}
outputs:
  k_bind: {quantity: rate, unit: 1/s}
  V_bind: {quantity: volume, unit: um^3}
settings: {}
stochastic: false
