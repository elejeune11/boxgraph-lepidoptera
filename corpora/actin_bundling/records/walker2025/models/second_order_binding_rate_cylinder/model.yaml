id: second_order_binding_rate_cylinder
name: second-order actin-crosslinker association rate implied by mesoscopic k_bind (Methods S1)
role: processing
stated:
  page: 42
  printed_page: "SI-19"
  quote: "The binding volume is a cylinder of radius given by the binding distance"
  where: "Methods S1 (Actin-droplet kinetics)"
equation: "k_{bind,2} = k_bind * N_AV * pi * r_bind^2 * L_seg"
inputs:
  k_bind: {quantity: rate, unit: 1/s}
  r_bind: {quantity: binding_distance, unit: nm}
  L_seg: {quantity: filament_segment_length, unit: um}
outputs:
  k_bind_2: {quantity: second_order_binding_rate, unit: uM^-1*s^-1}
  V_bind: {quantity: volume, unit: um^3}
settings: {}
stochastic: false
