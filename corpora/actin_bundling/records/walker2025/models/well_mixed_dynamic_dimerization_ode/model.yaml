id: well_mixed_dynamic_dimerization_ode
name: reconstructed well-mixed 5-state mass-action ODE for Fig. 5A dynamic dimerization network
role: model
stated:
  page: 9
  printed_page: "1557"
  quote: "Schematic showing the different possible binding interactions between the monomeric actin-binding protein and actin"
  where: "Fig. 5A, Fig. S4J & Methods S1 pp. 42-43"
equation: "5-state RK4 mass-action ODE (M_f, M_b, D_0, D_1, D_2) using cylindrical actin V_bind and spherical monomer V_bind"
inputs:
  C_tot: {quantity: concentration, unit: uM}
  C_actin: {quantity: concentration, unit: uM}
  k_bind: {quantity: rate, unit: 1/s}
  k_unbind: {quantity: rate, unit: 1/s}
  r_bind_actin: {quantity: binding_distance, unit: nm}
  L_seg: {quantity: filament_segment_length, unit: um}
  k_dimer_form: {quantity: rate, unit: 1/s}
  k_dimer_split: {quantity: rate, unit: 1/s}
  r_bind_monomer: {quantity: binding_distance, unit: nm}
outputs:
  f_free_monomer: {quantity: fraction, unit: dimensionless}
  f_bound_monomer: {quantity: fraction, unit: dimensionless}
  f_free_dimer: {quantity: fraction, unit: dimensionless}
  f_singly_bound_dimer: {quantity: fraction, unit: dimensionless}
  f_doubly_bound_dimer: {quantity: fraction, unit: dimensionless}
settings:
  dt: 0.002
  t_end: 10.0
stochastic: false
reconstructed: >
  The paper simulates the 5-state dynamic dimerization network (Fig. 5A, Fig. 5D) using a custom
  3D spatial C++ CytoSim engine without an analytical or ODE approximation. This reconstructed
  well-mixed mass-action ODE translates the exact Methods S1 cylindrical and spherical binding
  volumes (pp. 42-43) and Fig. 5A reaction graph into a fast deterministic steady-state predictor
  of the five monomer population fractions.
