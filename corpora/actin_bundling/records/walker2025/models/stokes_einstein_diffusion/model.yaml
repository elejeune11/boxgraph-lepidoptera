id: stokes_einstein_diffusion
name: Stokes-Einstein translational diffusion and mobility for a 30 nm spherical crosslinker
role: model
stated:
  page: 42
  printed_page: "SI-19"
  quote: "The diffusion constant D is given by the Einstein relation D = µk BT"
  where: "Methods S1 (Position evolution) & Table S1"
equation: "mu = 1 / (6 * pi * eta * r); D = k_B T / (6 * pi * eta * r)"
inputs:
  eta: {quantity: dynamic_viscosity, unit: pN*s/um^2}
  r: {quantity: particle_radius, unit: nm}
  kBT: {quantity: energy, unit: pN*nm}
outputs:
  mu: {quantity: mobility, unit: um/(pN*s)}
  D: {quantity: diffusion_coefficient, unit: um^2/s}
settings: {}
stochastic: false
reconstructed: >
  The paper states D = mu * k_B T (Methods S1, p. 42) and separately tabulates condensate
  viscosity eta = 0.5 pN*s/um^2, crosslinker radius r = 30 nm, and crosslinker diffusion rate
  D = 10 um^2/s (Table S1, pp. 25-27), without printing the Stokes-Einstein drag formula
  mu = 1 / (6 pi eta r). This reconstructed model evaluates Stokes-Einstein diffusion to test
  internal consistency of Table S1.
