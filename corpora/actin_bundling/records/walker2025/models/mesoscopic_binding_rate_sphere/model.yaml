id: mesoscopic_binding_rate_sphere
name: mesoscopic monomer-monomer binding rate from second-order rate in spherical volume (Methods S1)
role: model
stated:
  page: 43
  printed_page: "SI-20"
  quote: "The corresponding binding volume is given by a sphere with radius as the corresponding binding distance"
  where: "Methods S1 (Dynamic dimerization and dynamic multimerization models)"
equation: "k_bind = k_{bind,2} / (N_AV * (4/3) * pi * r_bind^3)"
inputs:
  k_bind_2: {quantity: second_order_binding_rate, unit: uM^-1*s^-1}
  r_bind: {quantity: binding_distance, unit: nm}
outputs:
  k_bind: {quantity: rate, unit: 1/s}
  V_bind: {quantity: volume, unit: um^3}
settings: {}
stochastic: false
