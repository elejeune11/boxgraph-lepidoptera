id: cytosim_bivalent_tetravalent_droplet
name: 3D agent-based CytoSim actin-crosslinker droplet simulation (bivalent, tetravalent & mixtures)
role: model
stated:
  page: 42
  printed_page: "SI-19"
  quote: "Simulations were performed in Cytosim"
  where: "Methods S1 & Tables S1-S2"
equation: "dx^{ij}(t) = mu f^{ij}_{tot}(t) dt + dB_j(t); k_unbind = k_unbind^0 exp(F / F_unbind)"
inputs:
  R_drop: {quantity: droplet_radius, unit: um}
  N_fil: {quantity: filament_count, unit: dimensionless}
  L0: {quantity: filament_length, unit: um}
  k_grow: {quantity: elongation_rate, unit: um/s}
  N_crosslinkers: {quantity: crosslinker_count, unit: dimensionless}
  k_bind: {quantity: rate, unit: 1/s}
  k_unbind_0: {quantity: rate, unit: 1/s}
  F_unbind: {quantity: force, unit: pN}
  k_bend: {quantity: flexural_rigidity, unit: pN*um^2}
  eta: {quantity: dynamic_viscosity, unit: pN*s/um^2}
outputs:
  area_fraction: {quantity: surface_area_fraction, unit: dimensionless}
settings:
  dt: 0.002
  t_sim: 600.0
  seed: 0
described_from: ref-S4
runnable: false
not_runnable_reason: >
  Full 3D many-body agent-based simulation of 30 growing semiflexible F-actin fibers and
  1,000-20,000 spherical bivalent (mini-Lpd) and/or tetravalent (VASP) crosslinkers requires
  the external C++ CytoSim engine and unstated configuration parameters (crosslinker bond spring
  stiffness, exact steric interaction functional form and cutoff, simulation temperature T,
  Brownian ratchet force-velocity coupling, binding-site placement on 30 nm spheres, and random seeds).
stochastic: true
