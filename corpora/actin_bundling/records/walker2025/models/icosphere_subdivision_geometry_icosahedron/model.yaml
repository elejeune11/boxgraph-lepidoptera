id: icosphere_subdivision_geometry_icosahedron
name: true icosphere triangulation from 20 initial icosahedron triangles (corrected variant of Methods S1)
role: processing
stated:
  page: 43
  printed_page: "SI-20"
  quote: "The icosphere was generated by dividing the initial eight triangles 3 more times"
  where: "Methods S1 (Actin-covered surface area calculation)"
equation: "N_faces = 20 * 4^n; s_eq = sqrt(4 * (4*pi*R_drop^2 / N_faces) / sqrt(3)); n_monomers = s_eq / d_mon"
inputs:
  R_drop: {quantity: droplet_radius, unit: um}
  n_subdiv: {quantity: icosphere_subdivision, unit: dimensionless}
  d_mon: {quantity: monomer_axial_rise, unit: nm}
outputs:
  n_faces: {quantity: count, unit: dimensionless}
  median_edge: {quantity: triangle_edge_length, unit: nm}
  eq_side: {quantity: triangle_edge_length, unit: nm}
  n_monomers: {quantity: monomer_equivalents, unit: dimensionless}
settings: {}
from_words: true
stochastic: false
variant_of: icosphere_subdivision_geometry_printed
corrections:
  - equation: "Methods S1, p. 43: icosphere initial face count"
    change: "Start from a 20-triangle regular icosahedron instead of the printed 8 triangles (an octahedron)."
    evidence: "An icosphere is by definition a subdivided 20-face icosahedron, and the cited method [S4] (Chandrasekaran et al., 2024) uses a 20-triangle icosahedron subdivided 4 times (5,120 faces, ~75 nm edge length) rather than 8 triangles subdivided 3 times (512 faces, ~238 nm edge length)."
