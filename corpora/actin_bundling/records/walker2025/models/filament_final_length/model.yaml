id: filament_final_length
name: deterministic actin filament final length capped at maximum length L_max (Table S1 & Fig. S4B)
role: model
stated:
  page: 35
  printed_page: "SI-12"
  quote: "Filaments in these simulations are allowed to grow deterministically at the rate"
  where: "Fig. S4B caption & Table S1 p. 25"
equation: "L_final = min(L0 + k_grow * t_sim, L_max)"
inputs:
  L0: {quantity: filament_length, unit: um}
  k_grow: {quantity: elongation_rate, unit: um/s}
  t_sim: {quantity: time, unit: s}
  L_max: {quantity: filament_length, unit: um}
outputs:
  L_final: {quantity: filament_length, unit: um}
settings: {}
from_words: true
stochastic: false
