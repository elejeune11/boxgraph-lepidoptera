id: langevin_overdamped_1d
name: 1D single-particle overdamped Langevin trajectory integrator (Methods S1)
role: model
stated:
  page: 42
  printed_page: "SI-19"
  quote: "Cytosim uses the Langevin equation to calculate the evolution of discretized points"
  where: "Methods S1 (Position evolution)"
equation: "dx^{ij}(t) = mu * f^{ij}_{tot}(t) * dt + dB_j(t), dB_j(t) ~ N(0, sqrt(2 * mu * k_B T * dt))"
inputs:
  mu: {quantity: mobility, unit: um/(pN*s)}
  kBT: {quantity: energy, unit: pN*nm}
  f: {quantity: force, unit: pN}
outputs:
  D_eff: {quantity: diffusion_coefficient, unit: um^2/s}
  mean_dx: {quantity: displacement, unit: um}
settings:
  dt: 0.002
  t_sim: 1.0
  n_particles: 4000
  seed: 42
stochastic: true
