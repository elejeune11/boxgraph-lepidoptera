  note: "Well-mixed ODE predicts 2.5%-86.8% actin-bound monomers vs 1.3%-31.3% in 3D CytoSim Fig. 5D bottom panel."

- id: cmp_fig5d_kf1_free_dimer_ode
  purpose: approximation
