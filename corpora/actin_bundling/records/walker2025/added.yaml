- id: kBT_added
  quantity: energy
  unit: pN*nm
  printed: "4.114"
  basis: "Methods S1 (p. 42) writes D = mu * k_B * T without stating the simulation temperature T; 4.114 pN*nm corresponds to standard room temperature T = 298 K (25 degC), consistent with room-temperature in vitro microscopy assays (STAR Methods, p. 22)."
  alternatives: ["4.142", "4.2", "4.28"]
  stands_for: "k_B T in Methods S1 Einstein relation D = mu * k_B T and WLC persistence length L_p = k_bend / (k_B T)"

- id: eta_water_added
  quantity: dynamic_viscosity
  unit: Pa*s
  printed: "0.001"
  basis: "Table S1 (p. 25) describes 0.5 pN*s/um^2 (= 0.5 Pa*s) as '500x water' without printing the reference viscosity of water; standard room-temperature water viscosity at 20 degC is 0.001 Pa*s (1 cP)."
  alternatives: ["0.00089"]
  stands_for: "reference water viscosity in '500x water' (Table S1, p. 25)"

- id: zero_force_added
  quantity: force
  unit: pN
  printed: "0"
  basis: "Zero applied force F = 0 pN used for free Brownian diffusion in the 1D overdamped Langevin equation and for the zero-force baseline of Bell slip-bond unbinding."
  alternatives: ["1", "10"]
  stands_for: "F = 0 in Methods S1 Langevin and Bell unbinding equations (pp. 42-43)"

- id: test_boundary_r_added
  quantity: radial_position
  unit: um
  printed: "1.05"
  basis: "Representative 50 nm radial excursion outside the R = 1 um spherical boundary to evaluate harmonic boundary confinement force (yielding 10 pN for actin at k = 200 pN/um, matching the 10 pN Brownian ratchet stall force)."
  alternatives: ["1.01", "1.10"]
  stands_for: "radial coordinate r > R in Table S1 boundary repulsion spring (p. 25)"

- id: actin_monomer_rise_added
  quantity: monomer_axial_rise
  unit: nm
  printed: "2.7"
  basis: "Methods S1 (p. 43) compares icosphere triangle size to '10 actin monomers' without stating the monomer linear dimension; 2.7 nm is the standard axial helical rise per subunit along F-actin (with 5.5 nm globular monomer diameter as the main alternative)."
  alternatives: ["5.5"]
  stands_for: "linear size of one actin monomer in Methods S1 surface area discretization (p. 43)"

- id: icosphere_subdiv_s4_added
  quantity: icosphere_subdivision
  unit: dimensionless
  printed: "4"
  basis: "Methods S1 (p. 43) cites [S4] (Chandrasekaran et al., 2024) for the icosphere surface-area discretization; [S4] subdivides a 20-face icosahedron 4 times (5120 faces), whereas Methods S1 prints 'dividing the initial eight triangles 3 more times'."
  alternatives: ["3"]
  stands_for: "subdivision count n in icosphere surface discretization (Methods S1 p. 43 vs ref-S4)"

- id: zero_init_length_added
  quantity: filament_length
  unit: um
  printed: "0"
  basis: "Alternative initial length L0 = 0 um to verify that Table S1 k_grow = 0.0103 um/s subtracts the Methods S1 initial length L0 = 0.1 um (2*pi/600 = 0.01047 um/s vs (2*pi - 0.1)/600 = 0.01031 um/s)."
  alternatives: ["0.1"]
  stands_for: "L0 = 0 test case in filament_elongation_rate"

- id: guv_lipid_closure_target_added
  quantity: fraction
  unit: percent
  printed: "100.0"
  basis: "Exact 100.0% total lipid mole percentage expected for a closed four-component GUV membrane mixture (Fig. S1E caption, p. 30 prints 84% + 15% + 1% + 0.1% = 100.1%)."
  alternatives: ["100"]
  stands_for: "expected 100.0% lipid composition closure for Fig. S1E GUVs"

- id: ode_actin_binding_site_conc_added
  quantity: concentration
  unit: uM
  printed: "27.67"
  basis: "Well-mixed effective F-actin monomer concentration for 30 filaments of final length 2*pi um at 2.7 nm axial rise inside an R = 1 um spherical droplet (matching Chandrasekaran et al. 2024 [S4]), required by the reconstructed 5-state Fig. 5A ODE."
  alternatives: ["10", "50"]
  stands_for: "effective F-actin binding-site concentration in reconstructed Fig. 5A dynamic dimerization ODE"

- id: ode_k_dimer_split_ring_added
