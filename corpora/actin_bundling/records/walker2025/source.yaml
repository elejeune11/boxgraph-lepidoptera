notes: >
  Complete reading of Walker, Chandrasekaran, Mansour, Graham, Torres, Wang, Lafer, Rangamani &
  Stachowiak (Developmental Cell 60, 1550-1567, June 9, 2025; published online Feb 5, 2025;
  DOI 10.1016/j.devcel.2025.01.012), covering both the main article & STAR Methods (PDF pp. 1-23,
  journal pp. 1550-1567 & e1-e4) and 100% of the Supplemental Information (PDF pp. 24-44:
  Tables S1-S2, Figures S1-S7, Methods S1, and Supplemental References S1-S13). Every equation,
  table, unit, exponent, and figure label was inspected directly against rendered page images
  (pages/page-NNN.png) to eliminate Symbol-font OCR errors (e.g. mM -> uM, mm -> um, missing minus
  signs in exponents).

  In scope: (1) All printed experimental conditions, sequence/LLPS properties, partitioning
  enrichments, aspect-ratio thresholds, tail-clipping fractions, FRAP settings, and CytoSim
  Tables S1-S2 & Methods S1 parameters; (2) full 3D CytoSim agent-based models recorded explicitly
  as runnable: false (static bivalent/tetravalent crosslinker mixtures and custom dynamic
  dimerization/multimerization models; external C++ code at
  https://github.com/RangamaniLabUCSD/Dynamic_multimerization / DOI 10.5281/zenodo.14522973);
  (3) all closed-form, stochastic single-body, geometric, kinetic, and data-processing equations
  stated symbolically or in words (33 models total: 2 non-runnable 3D CytoSim models, 26 runnable
  printed/from-words models, 2 evidenced variant_of corrections for printed equations/discretizations,
  and 3 reconstructed physical consistency/ODE models); (4) numerical refinements on both the
  1D stochastic overdamped Langevin integrator (dt and n_particles) and the reconstructed 5-state
  dynamic dimerization ODE (dt); (5) complete bibliography of all 88 main references and 13
  supplemental references linking cited corpus records (graham2023 [ref-13], chandrasekaran2024
  [ref-18, ref-S4], graham2024 [ref-23, ref-S10]); and (6) open questions documenting verified
  internal inconsistencies and misprints (e.g. mu mislabelled as solvent viscosity in Methods S1
  p. 42, 687x Stokes-Einstein vs prescribed D=10 um^2/s discrepancy, 200 nm single-step Brownian
  jump exceeding r_bind=30-90 nm, dimensionless K_d=k_unbind/k_bind contradicting p. 10 & Fig. 5B,
  8-triangle/3-subdivision icosphere giving ~88 monomers instead of ~10, Fig. S4A L_seg=0.1 uM
  unit typo, Fig. S2C/D caption swap, Fig. S5E mislabelled caption, Fig. S1E GUV lipid sum 100.1%,
  and mis-cited PhasePred reference S9).

  Out of scope for this read stage: calibrated figure digitization (deferred to digitize:walker2025;
  see figures.md for a complete panel-by-panel inventory of quantitative plots vs micrographs/schematics).
