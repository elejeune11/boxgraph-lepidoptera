- id: droplet_radius
  name: condensate droplet radius
  dimension: "[length]"
  description: Radius R of the spherical protein condensate container in CytoSim simulations.

- id: droplet_diameter
  name: condensate droplet diameter
  dimension: "[length]"
  description: Diameter of spherical protein condensates observed in microscopy experiments.

- id: filament_length
  name: actin filament length
  dimension: "[length]"
  description: Contour length of an F-actin filament (initial length L0, instantaneous length L, or maximum length L_max = 2 pi R).

- id: filament_segment_length
  name: actin filament segment length
  dimension: "[length]"
  description: Length L_seg of each inextensible linear segment composing a discretized F-actin fiber in CytoSim.

- id: persistence_length
  name: actin filament persistence length
  dimension: "[length]"
  description: Thermal bending persistence length L_p = k_bend / (k_B T) of F-actin.

- id: particle_radius
  name: molecular steric radius
  dimension: "[length]"
  description: Steric or solid-sphere radius of a simulated crosslinker (mini-Lpd dimer, VASP tetramer, mini-Lpd monomer) or F-actin fiber.

- id: binding_distance
  name: kinetic binding distance
  dimension: "[length]"
  description: Capture radius r_bind defining the cylindrical (actin-crosslinker) or spherical (monomer-monomer) binding volume in CytoSim.

- id: surface_threshold_distance
  name: condensate surface shell threshold distance
  dimension: "[length]"
  description: Radial distance inward from the spherical condensate boundary within which actin filaments are counted as surface-localized.

- id: triangle_edge_length
  name: spherical mesh triangle edge length
  dimension: "[length]"
  description: Edge length (chordal or area-equivalent equilateral side) of triangles discretizing the spherical condensate surface.

- id: monomer_axial_rise
  name: actin monomer characteristic length
  dimension: "[length]"
  description: Characteristic linear size per F-actin monomer (2.7 nm helical rise along filament, or 5.5 nm globular diameter).

- id: displacement
  name: particle displacement
  dimension: "[length]"
  description: Spatial coordinate increment, mean drift displacement, or single-step Brownian noise standard deviation.

- id: radial_position
  name: particle radial position
  dimension: "[length]"
  description: Radial distance r of a discretized actin or crosslinker point from the center of the spherical droplet.

- id: well_dimension
  name: microscopy chamber dimension
  dimension: "[length]"
  description: Diameter or thickness of the silicone gasket well used for confocal microscopy.

- id: wavelength
  name: optical wavelength
  dimension: "[length]"
  description: Laser wavelength used for photobleaching in FRAP experiments.

- id: volume
  name: volume
  dimension: "[length] ** 3"
  description: Three-dimensional volume of the spherical condensate or a mesoscopic reaction binding volume V_bind.

- id: surface_area
  name: surface area
  dimension: "[length] ** 2"
  description: Surface area of the spherical condensate or of one triangulated mesh face.

- id: time
  name: time
  dimension: "[time]"
  description: Simulation duration, time step dt, snapshot interval, assay incubation duration, fusion time, or FRAP imaging interval.

- id: rate
  name: first-order kinetic rate
  dimension: "1 / [time]"
  description: First-order mesoscopic association rate (k_bind, k_dimer_form, k_multimer_form) or dissociation/splitting rate (k_unbind, k_unbind_0, k_dimer_split, k_multimer_split).

- id: second_order_binding_rate
  name: second-order association rate constant
  dimension: "[length] ** 3 / [substance] / [time]"
  description: Bimolecular second-order association rate constant k_{bind,2} = k_bind * N_AV * V_bind.

- id: elongation_rate
  name: actin filament elongation rate
  dimension: "[length] / [time]"
  description: Plus-end linear polymerization speed k_grow of actin filaments in CytoSim.

- id: diffusion_coefficient
  name: translational diffusion coefficient
  dimension: "[length] ** 2 / [time]"
  description: Translational diffusion constant D of simulated crosslinking molecules.

- id: force
  name: mechanical force
  dimension: "[force]"
  description: Force acting on a filament, bond, or particle (Brownian ratchet stall force, Bell slip-bond unbinding/splitting force, or boundary repulsion force).

- id: spring_stiffness
  name: harmonic spring stiffness
  dimension: "[force] / [length]"
  description: Linear spring constant governing boundary confinement or steric repulsion potentials in CytoSim.

- id: flexural_rigidity
  name: actin flexural rigidity
  dimension: "[force] * [length] ** 2"
  description: Bending stiffness k_bend of an F-actin filament.

- id: energy
  name: energy
  dimension: "[energy]"
  description: Thermal energy k_B T or associative polymer interaction energy.

- id: dynamic_viscosity
  name: dynamic viscosity
  dimension: "[mass] / [length] / [time]"
  description: Dynamic shear viscosity eta of the protein condensate or aqueous solvent.

- id: mobility
  name: hydrodynamic mobility
  dimension: "[length] / [force] / [time]"
  description: Overdamped translational mobility mu = D / (k_B T) = 1 / (6 pi eta r) linking force to drift velocity.

- id: concentration
  name: molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of proteins (monomeric or oligomeric), G-actin, Latrunculin A, or crosslinkers.

- id: dissociation_constant
  name: equilibrium dissociation constant
  dimension: "[substance] / [length] ** 3"
  description: Molar equilibrium dissociation constant K_d = k_unbind / k_{bind,2} of an actin-crosslinker or monomer-monomer bond.

- id: ionic_strength_nacl
  name: NaCl buffer concentration
  dimension: "[substance] / [length] ** 3"
  description: Sodium chloride concentration controlling electrostatic screening in condensate buffers.

- id: actin_concentration
  name: added G-actin concentration
  dimension: "[substance] / [length] ** 3"
  description: Monomeric G-actin concentration added to preformed protein condensates (used as an experimental condition).

- id: protein_concentration
  name: condensate protein monomeric concentration
  dimension: "[substance] / [length] ** 3"
  description: Monomeric concentration of condensate-forming protein(s) in experimental assays (used as an experimental condition).

- id: lata_concentration
  name: Latrunculin A concentration
  dimension: "[substance] / [length] ** 3"
  description: Concentration of Latrunculin A added to inhibit actin polymerization.

- id: temperature
  name: temperature
  dimension: "[temperature]"
  description: Absolute or Celsius temperature of the condensate system.

- id: count
  name: discrete count
  dimension: "dimensionless"
  description: Generic integer count (amino acid residues, snapshots, mesh triangles, replicates, analyzed condensates, interactome proteins).

- id: filament_count
  name: actin filament count
  dimension: "dimensionless"
  description: Number of F-actin filaments N_fil initialized inside a simulated spherical condensate.

- id: crosslinker_count
  name: crosslinker copy number
  dimension: "dimensionless"
  description: Number of crosslinker particles (bivalent dimers, tetravalent tetramers, or dynamic monomers) inside a simulated droplet.

- id: valency
  name: binding valency or oligomeric state
  dimension: "dimensionless"
  description: Number of actin-binding sites, monomer-monomer binding sites, or monomeric subunits per native oligomer.

- id: volume_fraction
  name: crosslinker volume fraction
  dimension: "dimensionless"
  description: Fraction of spherical condensate volume occupied by spherical crosslinkers phi = N * (r_solid / R_drop)^3.

- id: surface_area_fraction
  name: actin-covered surface area fraction
  dimension: "dimensionless"
  description: Fraction of triangulated spherical condensate surface area occupied by near-boundary actin filaments.

- id: fraction
  name: dimensionless fraction or percentage
  dimension: "dimensionless"
  description: Dimensionless population fraction, elongated-condensate fraction (AR > 1.2), omitted distribution tail fraction, lipid mole percentage, or snapshot window fraction.

- id: peg_concentration
  name: PEG 8000 crowding concentration
  dimension: "dimensionless"
  description: Weight-by-volume percentage (% w/v) of PEG 8000 crowding agent in condensate buffer.

- id: aspect_ratio
  name: condensate aspect ratio
  dimension: "dimensionless"
  description: Ratio of longest dimension to shortest dimension of a deformed protein condensate.

- id: partition_coefficient
  name: condensate partition coefficient or fold enrichment
  dimension: "dimensionless"
  description: Ratio of mean fluorescence intensity inside the condensed phase to that in the surrounding bulk solution.

- id: dimensionless_ratio
  name: dimensionless ratio
  dimension: "dimensionless"
  description: Dimensionless ratio (condensate-to-water viscosity ratio, mini-Lpd:VASP stoichiometric ratio, printed first-order rate ratio K_d = k_unbind/k_bind, or PLL:PEG molar ratio).

- id: fluorescence_intensity
  name: fluorescence intensity
  dimension: "dimensionless"
  description: Measured fluorescence intensity inside a condensate (I_in) or in the bulk dilute phase (I_out).

- id: llps_score
  name: phase-separation prediction score
  dimension: "dimensionless"
  description: Machine-learning predicted phase-separation propensity score on [0, 1] from PSPredictor or PhasePred.

- id: icosphere_subdivision
  name: spherical mesh subdivision depth
  dimension: "dimensionless"
  description: Number of recursive triangle midpoint subdivisions n applied to an initial spherical polyhedron.

- id: monomer_equivalents
  name: actin monomer length equivalents
  dimension: "dimensionless"
  description: Number of F-actin monomers spanning the effective linear size of one spherical mesh triangle.

- id: interaction_energy_kbt
  name: dimensionless interaction energy in k_B T
  dimension: "dimensionless"
  description: Associative polymer sticker-sticker interaction energy expressed in units of thermal energy k_B T.

- id: frap_normalized_intensity
  name: FRAP normalized fluorescence intensity
  dimension: "dimensionless"
  description: Normalized fluorescence recovery intensity after photobleaching (unitless fraction on [0, 1] in Figs. 1F and S3, or percent recovery in Fig. 2G).

- id: condition_index
  name: experimental condition category index
  dimension: "dimensionless"
  description: Discrete 1-based category index for plots whose x-axis lists distinct protein constructs or treatments (e.g., Figs. 6D, 7B, 7D, 7F, 7G).

- id: residue_index
  name: amino acid residue index
  dimension: "dimensionless"
  description: 1-based amino acid sequence position along Lamellipodin (aa850-1250 or full-length) in SPARROW sequence profiles (Fig. S1B).

- id: disorder_score
  name: predicted intrinsic disorder score
  dimension: "dimensionless"
  description: Per-residue intrinsic disorder propensity score on [0, 1] predicted by SPARROW (Fig. S1B).

- id: plddt_score
  name: predicted pLDDT structure confidence score
  dimension: "dimensionless"
  description: Per-residue predicted AlphaFold pLDDT score normalized on [0, 1] from SPARROW (Fig. S1B).

- id: multimer_length
  name: dynamic multimer chain length
  dimension: "dimensionless"
  description: Number of monomeric units constituting a dynamically associated protein multimer chain in CytoSim simulations (Fig. S7F-G).

