  b: graham2024/actin_persistence_length_from_rigidity
  mapping:
    K_bend: "k_bend"
    T: "100000000 * kBT / 1380649"
  output_map:
    L_p: L_p
  regime:
    k_bend: [0.01, 0.2]
    kBT: [3.5, 5.0]
  provenance: proposed
  reason: >
    Both models compute F-actin thermal persistence length L_p = k_bend / (k_B T) identically after
    converting kBT (pN*nm) to temperature T = kBT / k_B (K) with exact SI 2019 Boltzmann constant
    k_B = 1.380649e-2 pN*nm/K.

- id: rel_graham2024_copy_number_concentration
  kind: same_as
  a: walker2025/concentration_from_copy_number
  b: graham2024/concentration_from_total_polymer
  mapping:
    L_total: "0.0027 * N"
    l_mono: "2.7"
    R_drop: "R_drop"
  output_map:
    C_T: C
  regime:
    N: [100.0, 20000.0]
    R_drop: [0.5, 5.0]
  provenance: proposed
  reason: >
    Both models convert discrete molecule copy number in a spherical droplet of radius R_drop to micromolar
    concentration via N / (N_A * (4/3)*pi*R_drop^3) with SI 2019 Avogadro constant (evaluating
    concentration_from_total_polymer at 1 monomer per molecule, L_total / l_mono = N).

- id: rel_graham2024_viscosity_ratio
  kind: same_as
  a: walker2025/condensate_viscosity_ratio
  b: graham2024/droplet_viscosity_water_ratio
  mapping:
    eta_droplet: "eta_cond"
    eta_water: "eta_water"
  output_map:
    ratio: ratio
  regime:
    eta_cond: [0.001, 10.0]
    eta_water: [0.0005, 0.002]
  provenance: proposed
  reason: >
    Both models compute the condensate-to-water viscosity ratio eta_cond / eta_water = 500 at 0.5 Pa*s
    vs 0.001 Pa*s, showing that walker2025 Table S1 ('500x water') fixes the 10-fold error ('50x water')
    carried over into graham2024 Table S1 (flagged too_plain as a 1-op quotient).

- id: rel_graham2024_oligomer_concentration
  kind: same_as
  a: walker2025/protein_oligomer_concentration
  b: graham2024/vasp_tetramer_from_monomer
  mapping:
    C_mono: "C_mon"
    valency: "n_subunits"
  output_map:
    C_tet: C_olig
  regime:
    C_mon: [0.1, 50.0]
    n_subunits: [2.0, 4.0]
  provenance: proposed
  reason: >
    Both models convert monomer subunit concentration to oligomer concentration via C_olig = C_mon / n_subunits
    (flagged too_plain as a 1-op quotient).

- id: rel_graham2024_vca_ode_reduces_to_filament_final
  kind: reduces_to
  a: graham2024/cytosim_vca_ode_filament_length
  b: walker2025/filament_final_length
  mapping:
    L0: "L_0"
    k_grow: "k_grow"
    t_sim: "t_end"
    L_max: "50"
  output_map:
    L_final: L_fil
  limit:
    L_total: "oo"
  regime:
    k_grow: [0.005, 0.02]
    N_fil: [10.0, 50.0]
    L_0: [0.05, 0.2]
    L_total: [500.0, 2000.0]
    t_end: [50.0, 600.0]
    k_bind: [1.0, 5.0]
    C_vca: [0.0, 0.0]
    factor_Gmax: [5.0, 5.0]
    R_drop: [0.8, 1.5]
    l_mono: [2.7, 2.7]
  tolerance: 1.0e-4
  provenance: proposed
  reason: >
    In the zero-VCA (C_vca = 0), infinite monomer-pool limit (L_total -> oo) below the circumference cap
    L_max, graham2024's CytoSim monomer-depletion ODE reduces identically to walker2025's undepleted
    filament final length L_final = L0 + k_grow * t_sim.

