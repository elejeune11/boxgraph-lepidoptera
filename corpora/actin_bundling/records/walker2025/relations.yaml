    graham2024_code/config_parameter_audit reads eta = 0.5 pN*s/um^2 and r_blob = 0.03 um = 30 nm directly
    from released CytoSim config0.cym and evaluates Stokes-Einstein diffusivity kT / (6*pi*eta*r_blob),
    matching walker2025/stokes_einstein_diffusion identically and confirming the identical 673x-687x
    diffusivity discrepancy across both Rangamani-lab codebases.

