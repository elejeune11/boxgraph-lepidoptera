id: wlc_ring_mc_prefactor
name: Metropolis Monte Carlo simulation of closed WLC ring fluctuations
role: model
runnable: false
not_runnable_reason: >
  Page 11 states only that Metropolis Monte Carlo simulations were used to determine the
  prefactor 0.16 in kappa_B = 0.16 * R_c^3 * k_B * T / D_B^2 and verify equal in-plane and
  out-of-plane transverse fluctuations, without specifying ring discretization (number of beads
  or segments), bending energy discretization, closure constraint enforcement, trial moves,
  equilibration/sampling steps, or L_B / l_p range.
stated: {page: 11, printed_page: "11", quote: "Metropolis Monte Carlo simulations were used to determine the prefactor (0.16)", where: Methods}
inputs:
  R_c: {quantity: ring_radius, unit: um}
  T: {quantity: temperature, unit: K}
outputs:
  c_ring: {quantity: wlc_ring_prefactor, unit: dimensionless}
settings: {seed: 0}
stochastic: true
