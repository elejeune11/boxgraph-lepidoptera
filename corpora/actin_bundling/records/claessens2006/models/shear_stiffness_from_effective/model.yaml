id: shear_stiffness_from_effective
name: crosslink shear stiffness from effective shear stiffness per unit length
role: model
stated: {page: 7, printed_page: "7", quote: "δ = 10−7 m , the typical ABP axial spacing at high ABP concentration", where: text}
equation: "k_par = (k_par / delta) * delta"
inputs:
  k_eff: {quantity: effective_shear_stiffness_per_length, unit: N/m^2}
  delta: {quantity: crosslink_spacing_axial, unit: m}
outputs:
  k_par: {quantity: crosslink_shear_stiffness, unit: N/m}
settings: {}
stochastic: false
