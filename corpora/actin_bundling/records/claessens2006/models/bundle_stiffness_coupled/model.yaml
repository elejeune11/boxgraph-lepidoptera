id: bundle_stiffness_coupled
name: fully coupled F-actin bundle bending stiffness limit (zero inter-filament spacing)
role: model
stated: {page: 16, printed_page: "16", quote: "fully coupled (α n; κ B = n 2κ a ) bundle bending regimes", where: "Fig. 3 caption"}
equation: "kappa_B = n^2 * kappa_a"
inputs:
  n: {quantity: filament_number, unit: dimensionless}
  kappa_a: {quantity: bending_stiffness_filament, unit: N*m^2}
outputs:
  kappa_B: {quantity: bending_stiffness_bundle, unit: N*m^2}
settings: {}
stochastic: false
