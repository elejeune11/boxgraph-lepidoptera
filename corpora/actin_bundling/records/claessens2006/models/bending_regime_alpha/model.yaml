id: bending_regime_alpha
name: dimensionless bundle bending stiffness regime parameter
role: model
stated: {page: 6, printed_page: "6", quote: "dimensionless quantity, α ≡ k L2B / δ ka , denotes the relevant bundle bending regime", where: text}
equation: "alpha = k_par * L_B^2 / (delta * k_a)"
inputs:
  k_par: {quantity: crosslink_shear_stiffness, unit: N/m}
  L_B: {quantity: bundle_length, unit: m}
  delta: {quantity: crosslink_spacing_axial, unit: m}
  k_a: {quantity: stretching_stiffness_filament, unit: N}
outputs:
  alpha: {quantity: bending_regime_parameter, unit: dimensionless}
settings: {}
stochastic: false
