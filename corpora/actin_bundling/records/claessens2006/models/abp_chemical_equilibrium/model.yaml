id: abp_chemical_equilibrium
name: ABP-actin Langmuir equilibrium occupancy and axial crosslink spacing
role: model
stated: {page: 12, printed_page: "12", quote: "equilibrium using, δ = 33 × 10 −9 /θ m , where, θ = c ABP /( K d + c ABP )", where: Methods}
equation: "theta = c_ABP / (K_d + c_ABP), delta = delta_max / theta"
inputs:
  c_ABP: {quantity: abp_concentration, unit: uM}
  K_d: {quantity: dissociation_constant, unit: uM}
  delta_max: {quantity: crosslink_spacing_min, unit: nm}
outputs:
  theta: {quantity: bound_crosslink_fraction, unit: dimensionless}
  delta: {quantity: crosslink_spacing_axial, unit: nm}
settings: {}
stochastic: false
