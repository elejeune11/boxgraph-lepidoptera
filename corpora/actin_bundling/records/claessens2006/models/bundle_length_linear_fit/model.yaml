id: bundle_length_linear_fit
name: empirical linear bundle length relation L_B(n)
role: fit
stated: {page: 20, printed_page: "SI 1", quote: "the length of the bundle (LB) was found to be linear in the number of filaments", where: "SI Table"}
equation: "L_B = L_0 + s * n"
inputs:
  L_0: {quantity: bundle_length_intercept, unit: um}
  s: {quantity: bundle_length_slope, unit: um}
  n: {quantity: filament_number, unit: dimensionless}
outputs:
  L_B: {quantity: bundle_length, unit: um}
settings: {}
stochastic: false
