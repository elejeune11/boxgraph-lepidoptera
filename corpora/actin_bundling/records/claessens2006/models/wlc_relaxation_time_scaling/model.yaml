id: wlc_relaxation_time_scaling
name: longest WLC bending equilibration relaxation time scaling law
role: model
prefactor: unknown
stated: {page: 20, printed_page: "SI 1", quote: "given by the longest relaxation time of a WLC", where: "SI Bundle Equilibration"}
equation: "tau ~ (mu / kappa) * L^4"
inputs:
  mu: {quantity: hydrodynamic_drag_per_length, unit: Pa*s}
  kappa: {quantity: bending_stiffness_bundle, unit: N*m^2}
  L: {quantity: bundle_length, unit: m}
outputs:
  tau: {quantity: relaxation_time, unit: s}
settings: {}
stochastic: false
