id: bending_stiffness_persistence
name: polymer bending stiffness from persistence length
role: model
stated: {page: 3, printed_page: "3", quote: "related to their persistence length, lp, in the same manner as for any polymer", where: text}
equation: "kappa_B = l_p * k_B * T"
inputs:
  l_p: {quantity: persistence_length, unit: m}
  T: {quantity: temperature, unit: K}
outputs:
  kappa_a: {quantity: bending_stiffness_filament, unit: N*m^2}
settings: {}
stochastic: false
