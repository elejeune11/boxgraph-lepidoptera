id: droplet_filament_count
name: emulsion droplet F-actin mass conservation and bundle filament number
role: model
from_words: true
built_from: [droplet_volume_sphere]
stated: {page: 16, printed_page: "16", quote: "determine the total length of F-actin present in the droplet and thus the number of filaments", where: "Fig. 2 caption"}
equation: "V_d = (4/3)*pi*R_d^3, L_tot = c_a * N_A * V_d * a_mon, L_B = 2*pi*R_r, n = L_tot / L_B"
inputs:
  c_a: {quantity: actin_concentration, unit: uM}
  R_d: {quantity: droplet_radius, unit: um}
  R_r: {quantity: ring_radius, unit: um}
  a_mon: {quantity: monomer_axial_rise, unit: nm}
outputs:
  V_d: {quantity: droplet_volume, unit: um^3}
  L_tot: {quantity: total_filament_length, unit: um}
  L_B: {quantity: bundle_length, unit: um}
  n: {quantity: filament_number, unit: dimensionless}
settings: {}
stochastic: false
