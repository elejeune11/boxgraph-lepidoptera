id: fuzzy_diameter_gaussian_processing
name: fluorescence intensity profile Gaussian fit and fuzzy diameter subtraction
role: processing
runnable: false
not_runnable_reason: >
  Page 11 specifies fitting Gaussian distributions to instantaneous and time-averaged transverse
  fluorescence intensity profiles in OpenBox (ref-34) and taking D_B = sigma_avg - sigma_int,
  but neither the raw fluorescence profiles nor any individual sigma_avg and sigma_int values
  are reported in the paper.
stated: {page: 11, printed_page: "11", quote: "The fuzzy diameter of the bundle is, DB = σ avg − σ int", where: Methods}
described_from: ref-34
equation: "D_B = sigma_avg - sigma_int"
inputs:
  sigma_avg: {quantity: profile_width_avg, unit: um}
  sigma_int: {quantity: profile_width_inst, unit: um}
outputs:
  D_B: {quantity: fuzzy_diameter, unit: um}
settings: {}
stochastic: false
