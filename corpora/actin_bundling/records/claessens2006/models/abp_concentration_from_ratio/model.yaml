id: abp_concentration_from_ratio
name: droplet ABP concentration from ABP-to-actin molar ratio
role: processing
from_words: true
stated: {page: 5, printed_page: "5", quote: "independently of c plastin (for c plastin / ca ≤ 0.5 )", where: text}
equation: "c_ABP = r_ABP_a * c_a"
inputs:
  r_ABP_a: {quantity: abp_actin_ratio, unit: dimensionless}
  c_a: {quantity: actin_concentration, unit: uM}
outputs:
  c_ABP: {quantity: abp_concentration, unit: uM}
settings: {}
stochastic: false
