id: filament_geometry_square
name: F-actin effective diameter and Young's modulus (square beam cross-section)
role: model
from_words: true
stated: {page: 12, printed_page: "12", quote: "with diameter d = 4.5 nm corresponding to an effective", where: Methods}
equation: "k_a = E * d^2, kappa_a = E * d^4 / 12 => d = sqrt(12 * kappa_a / k_a), E = k_a^2 / (12 * kappa_a)"
inputs:
  k_a: {quantity: stretching_stiffness_filament, unit: N}
  kappa_a: {quantity: bending_stiffness_filament, unit: N*m^2}
outputs:
  d: {quantity: filament_diameter, unit: nm}
  E: {quantity: youngs_modulus_filament, unit: GPa}
settings: {}
stochastic: false
