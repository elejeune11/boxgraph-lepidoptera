id: bundle_2d_bending
name: 2D discrete-filament bundle three-point bending model
role: model
stated: {page: 12, printed_page: "12", quote: "equivalent displacement of a homogeneous Euler–Bernoulli beam, κ B = L3B / 48wB ,max", where: Methods}
described_from: ref-25
equation: "kappa_B(2D) = L_B^3 / (48 * w_B,max); w_B,max = L_B^3/(48*n*kappa_a) - [k_par*d*(d+t)*sum_{i=1}^N i^2 / (delta*K*n^2*kappa_a^2)] * [L_B^3/(24*beta^2) - L_B/(2*beta^4) + tanh(beta*L_B/2)/beta^5]; beta^2 = k_par/(delta*K*k_a) + 2*k_par*d*(d+t)*sum_{i=1}^N i^2/(delta*K*n*kappa_a); K = (1/N)*sum_{k=1}^N sum_{i=k}^N i; N = (n-1)/2"
inputs:
  n: {quantity: filament_number_2d, unit: dimensionless}
  L_B: {quantity: bundle_length, unit: m}
  k_par: {quantity: crosslink_shear_stiffness, unit: N/m}
  delta: {quantity: crosslink_spacing_axial, unit: m}
  k_a: {quantity: stretching_stiffness_filament, unit: N}
  kappa_a: {quantity: bending_stiffness_filament, unit: N*m^2}
  d: {quantity: filament_diameter, unit: m}
  t: {quantity: crosslink_spacing_interfilament, unit: m}
outputs:
  beta: {quantity: decay_wavenumber, unit: 1/m}
  w_B_max: {quantity: beam_compliance_midspan, unit: m/N}
  kappa_B_2d: {quantity: bending_stiffness_2d, unit: N*m^2}
settings: {}
stochastic: false
