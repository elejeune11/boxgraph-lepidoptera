id: droplet_volume_sphere
name: spherical emulsion droplet volume
role: model
stated: {page: 16, printed_page: "16", quote: "droplet volume, Vd = 4π Rd3 / 3 , where Rd is the droplet radius", where: "Fig. 2 caption"}
equation: "V_d = (4 / 3) * pi * R_d^3"
inputs:
  R_d: {quantity: droplet_radius, unit: um}
outputs:
  V_d: {quantity: droplet_volume, unit: um^3}
settings: {}
stochastic: false
