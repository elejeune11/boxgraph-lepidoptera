id: bundle_3d_bending
name: 3D F-actin bundle bending stiffness from 2D discrete-filament model
role: model
stated: {page: 12, printed_page: "12", quote: "number of fibers in 3D, by, n3 D = n22D , and the corresponding 3D bundle bending stiffness is", where: Methods}
described_from: ref-25
built_from: [bundle_2d_bending]
equation: "n_2D = sqrt(n), kappa_B(3D) = n_2D * kappa_B(2D)(n_2D, L_B, k_par, delta, k_a, kappa_a, d, t)"
inputs:
  n: {quantity: filament_number, unit: dimensionless}
  L_B: {quantity: bundle_length, unit: m}
  k_par: {quantity: crosslink_shear_stiffness, unit: N/m}
  delta: {quantity: crosslink_spacing_axial, unit: m}
  k_a: {quantity: stretching_stiffness_filament, unit: N}
  kappa_a: {quantity: bending_stiffness_filament, unit: N*m^2}
  d: {quantity: filament_diameter, unit: m}
  t: {quantity: crosslink_spacing_interfilament, unit: m}
outputs:
  kappa_B: {quantity: bending_stiffness_bundle, unit: N*m^2}
settings: {}
stochastic: false
