- id: c_a_added
  quantity: actin_concentration
  unit: uM
  printed: "0.5"
  basis: >
    The paper never prints the actin concentration c_a in the emulsion droplets, giving only the
    molar ratios r_ABP:a = c_ABP / c_a (pp. 5, 16, 20) while requiring c_ABP in theta = c_ABP / (K_d + c_ABP)
    on p. 12. Two independent internal constraints both point to c_a ~ 0.4-0.6 uM: (1) combining droplet
    mass conservation n = (2/3)*c_a*N_A*a_mon*R_d^2 with the SI table L_B(n) = 2*pi*R_r (p. 20) yields
    c_a ~ 0.35-0.45 uM (e.g. ~0.02 mg/ml = 0.48 uM); (2) p. 7 states delta = 10^-7 m is "the typical
    ABP axial spacing at high ABP concentration" (r = 0.5), which via delta = 33 nm / theta gives
    c_a = 0.49 uM for K_d = 0.5 uM (plastin) and c_a = 0.69 uM for K_d = 0.7 uM (fascin).
  alternatives: ["0.35", "1.0", "2.4"]
  stands_for: c_a (to obtain c_ABP = r_ABP:a * c_a on p. 12 and droplet filament number n on p. 16)

- id: a_mon_added
  quantity: monomer_axial_rise
  unit: nm
  printed: "2.7"
  basis: >
    Standard axial rise per actin monomer along F-actin (370 monomers/um, i.e., 2.70 nm/monomer,
    double-stranded helix with 5.5 nm subunit repeat and two strands). Required to evaluate the
    word-level droplet mass-conservation model in the Fig. 2 caption (p. 16).
  alternatives: ["2.75", "2.9"]
  stands_for: contour length per actin monomer in droplet total F-actin length calculation (Fig. 2 caption, p. 16)

- id: mu_water_added
  quantity: hydrodynamic_drag_per_length
  unit: Pa*s
  printed: "1.0 x 10^-3"
  basis: >
    SI p. 20 writes tau ~ (mu / kappa) * L^4 without stating a numerical value or definition for mu.
    Dynamic viscosity of aqueous F-buffer at 298 K is eta ~ 0.89-1.0 x 10^-3 Pa*s, while slender-body
    transverse drag per unit length zeta_perp = 4*pi*eta / ln(L/a) is ~1.5-2.0 x 10^-3 Pa*s.
  alternatives: ["0.89 x 10^-3", "1.5 x 10^-3", "2.0 x 10^-3"]
  stands_for: mu in tau ~ (mu / kappa) * L^4 (SI p. 20)

- id: t_peg_zero_added
  quantity: crosslink_spacing_interfilament
  unit: nm
  printed: "0"
  basis: >
    For PEG-induced depletion bundles, p. 7 postulates "tight inter-molecular packing of the helical
    F-actin filaments that prohibits inter-filament slip" and Fig. 3 caption (p. 16) states the
    fully coupled dashed line assumes zero inter-filament spacing (t = 0). The paper does not
    explicitly state t = 0 for the PEG model curve in Fig. 3d, so t = 0 nm is recorded as added.
  alternatives: ["1.0", "2.0"]
  stands_for: t for PEG-bundled filaments in Fig. 3d (pp. 7, 12, 16)

- id: n_eval_10_added
  quantity: filament_number
  unit: dimensionless
  printed: "10"
  basis: >
    Representative intermediate bundle size (n = 10 filaments) on the Fig. 3 log-log x-axis (1 to 40)
    used to evaluate bundle_3d_bending, bundle_3d_bending_K_no_divN, bundle_length_linear_fit, and
    bending_regime_alpha at an exact tick mark of Fig. 3A-D.
  alternatives: ["9", "12"]
  stands_for: evaluation filament count n = 10 in Fig. 3A-D

- id: n_eval_20_added
  quantity: filament_number
  unit: dimensionless
  printed: "20"
  basis: >
    Representative large bundle size (n = 20 filaments) on the Fig. 3 log-log x-axis (1 to 40)
    used to evaluate bundle_3d_bending, bundle_3d_bending_K_no_divN, and bundle_length_linear_fit.
  alternatives: ["16", "25"]
  stands_for: evaluation filament count n = 20 in Fig. 3A-D

- id: n_eval_36_added
  quantity: filament_number
  unit: dimensionless
  printed: "36"
  basis: >
    Representative high-n evaluation point (n = 36 = 6^2 filaments, near the right edge n = 40 of
    Fig. 3A-D) where the printed K = S_2/N model and the K = S_2 variant diverge sharply.
  alternatives: ["25", "38"]
  stands_for: evaluation filament count n = 36 in Fig. 3A-D

- id: L_B_microvilli_lo_added
  quantity: bundle_length
  unit: um
  printed: "2"
  basis: >
    Lower endpoint of the printed physiological range "2-5 um" for brush border microvilli (p. 8),
    separated into a scalar endpoint so bending_regime_alpha can be evaluated at both bounds.
  alternatives: ["3.5", "5"]
  stands_for: lower bound of L_B = 2-5 um for brush border microvilli (p. 8)

- id: L_B_microvilli_hi_added
  quantity: bundle_length
  unit: um
  printed: "5"
  basis: >
    Upper endpoint of the printed physiological range "2-5 um" for brush border microvilli (p. 8),
    giving the conservative upper bound on alpha for the decoupled-regime check.
  alternatives: ["2", "3.5"]
  stands_for: upper bound of L_B = 2-5 um for brush border microvilli (p. 8)

- id: n_aact_crossover_eval_added
  quantity: filament_number
  unit: dimensionless
  printed: "3.5"
  basis: >
    Midpoint of the printed alpha-actinin crossover range "n approx 3-4" (p. 7), used to evaluate
    bundle_length_linear_fit and bending_regime_alpha at the reported crossover.
  alternatives: ["3", "4"]
  stands_for: midpoint of n ~ 3-4 alpha-actinin crossover (p. 7)

- id: R_d_si1a_added
  quantity: droplet_radius
  unit: um
  printed: "8.0"
  basis: >
    SI Fig. 1a (p. 20) prints the ring radius R_ring = 8.0 um but not the droplet radius R_d.
    In Fig. 2b (p. 18), the closed actin bundle ring lies just inside the droplet wall (R_r <= R_d,
    with R_d ~ R_r to 1.2*R_r).
  alternatives: ["8.5", "9.6"]
  stands_for: droplet radius R_d for SI Fig. 1a ring (R_ring = 8.0 um)

- id: R_d_si1b_added
  quantity: droplet_radius
  unit: um
  printed: "5.2"
  basis: >
    SI Fig. 1b (p. 20) prints the ring radius R_ring = 5.2 um but not the droplet radius R_d.
    In Fig. 2b (p. 18), the closed actin bundle ring lies just inside the droplet wall (R_d ~ R_r to 1.2*R_r).
  alternatives: ["5.7", "6.2"]
  stands_for: droplet radius R_d for SI Fig. 1b ring (R_ring = 5.2 um)

- id: n_2d_eval_3_added
  quantity: filament_number_2d
  unit: dimensionless
  printed: "3"
  basis: >
    Smallest nontrivial odd 2D filament count n_2D = 3 (N = (3-1)/2 = 1, corresponding to
    n_3D = n_2D^2 = 9 filaments in 3D), where S_2 = 1 and K = 1 unconditionally, used to run
    bundle_2d_bending directly.
  alternatives: ["5", "7"]
  stands_for: odd n in 2D theory on p. 12 (N = 1)
