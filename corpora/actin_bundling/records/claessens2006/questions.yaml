- id: q_sampling_window_vs_relaxation_time
  kind: reading
  about: [t_sampling_window, relaxation_time, wlc_relaxation_time_scaling]
  text: >
    Datum t_sampling_window (5-12 s, p. 11) is the experimental fluorescence observation and profile
    summing duration chosen long enough to ensure equilibration, not the WLC bundle equilibration
    relaxation time tau ~ (mu/kappa)*L^4 (SI p. 20). Assigning t_sampling_window to quantity
    relaxation_time conflates two physically distinct quantities of dimension [time]; downstream
    cross-record analyses should treat it as an observation window rather than a relaxation time.
  citation: {page: 11, printed_page: "11", quote: "Fluctuations are followed for 5–12 seconds and the intensity profiles are summed", where: Methods}

