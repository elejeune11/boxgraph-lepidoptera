- id: q_actin_cross_section_square_vs_circular
  kind: choice
  about: [filament_geometry_square, filament_geometry_circular, d_actin_p12, E_actin_p12, cmp_d_actin_circular, cmp_d_actin_square]
  text: >
    Page 12 states that F-actin has k_a = EA = 4.4 x 10^-8 N and kappa_a = EI = 7.3 x 10^-26 N*m^2
    'with diameter d = 4.5 nm corresponding to an effective Young's modulus of 2 GPa', without
    specifying the beam cross-section shape. For a circular cylinder (A = pi*d^2/4, I = pi*d^4/64),
    inverting (k_a, kappa_a) yields d = 5.15 nm (not reproducing 4.5 nm) and E = 2.11 GPa. For a
    square cross-section (A = d^2, I = d^4/12), inverting (k_a, kappa_a) yields d = 4.46 nm and
    E = 2.21 GPa, reproducing both printed values and ensuring that the t = 0 rigid-bundle limit
    satisfies k_a*d^2/(12*kappa_a) = 1.017 ~ 1 (so kappa_B(3D) ~ n^2*kappa_a).
  citation: {page: 12, printed_page: "12", quote: "with diameter d = 4.5 nm corresponding to an effective", where: Methods}

- id: q_fuzzy_diameter_linear_vs_quadrature
  kind: possible_error
  about: [fuzzy_diameter_gaussian_processing]
  text: >
    Page 11 extracts the bundle fuzzy diameter via linear subtraction D_B = sigma_avg - sigma_int
    of Gaussian standard deviations of the time-averaged and instantaneous intensity profiles,
    rather than quadrature subtraction sqrt(sigma_avg^2 - sigma_int^2) expected when convolving an
    intrinsic Gaussian profile width with independent Gaussian transverse thermal fluctuations.
    Moreover, no raw sigma_avg or sigma_int values are reported, making the image-processing step
    non-runnable.
  citation: {page: 11, printed_page: "11", quote: "The fuzzy diameter of the bundle is, DB = σ avg − σ int", where: Methods}

- id: q_wlc_ring_mc_unstated
