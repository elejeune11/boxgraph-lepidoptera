- id: q_digitized_si_fig1a_confirms_stiffness_discrepancy
  kind: unexplained_difference
  about: [si_fig1a_D_vs_t_meas, si_fig1b_D_vs_t_meas, fig3b_fascin_05_meas, fig3b_fascin_002_meas]
  text: >
    Calibrated digitization of SI Fig. 1a (10 points at exact multiples 1, 3, 5, 10, 15, 20, 30, 40,
    50, 60 of the 117 ms frame interval) yields a flat saturation plateau D = 0.0814 +/- 0.0003 um
    for t >= 3.53 s. Combined with R_ring = 8.0 um at T = 298 K via kappa_B = 0.16*R_c^3*k_B*T/D_B^2,
    this gives kappa_B = 50.9 pN*um^2, nearly twice the stiffest digitized fascin 1:2 bundle in Fig. 3B
    (fig3b_fascin_05_meas: 15 points spanning n = 1.99-30.51 and kappa_B = 0.148-27.32 pN*um^2),
    confirming the discrepancy flagged in q_si_fig1a_stiffness_vs_fig3b. By contrast, SI Fig. 1b
    (8 points at 1, 5, 10, 20, 30, 40, 50, 60 frames) plateaus at D = 0.2571 +/- 0.0008 um for
    t >= 4.68 s, implying kappa_B = 1.40 pN*um^2 at R_ring = 5.2 um, consistent with the digitized
