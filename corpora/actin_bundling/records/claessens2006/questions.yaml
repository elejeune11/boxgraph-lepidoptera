    though claessens2006 measures dynamic thermal fluctuation width D_B whereas graham2023 applies
    u_m to static confocal ring thickness T_ring. (4) No cross-record validations: none of claessens2006's
    21 runnable models predicts any of graham2023's 38 origin: measured datums (FRAP, droplet fusion,
