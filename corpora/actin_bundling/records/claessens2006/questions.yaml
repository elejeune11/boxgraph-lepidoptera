- id: q_claessens2008_fascin_parameters_and_nmax_tension
  kind: unexplained_difference
  about:
    - K_d_fascin
    - t_fascin_plastin
    - abp_chemical_equilibrium
    - droplet_filament_count
    - fig3b_fascin_05_meas
    - fig3b_fascin_02_meas
    - fig3b_fascin_005_meas
    - fig3b_fascin_002_meas
    - claessens2008/Kd_fascin
    - claessens2008/effective_bound_ratio
    - claessens2008/nf_max_confinement
    - claessens2008/aH_hex_saxs
    - claessens2008/ca_fig2e_single_ring_max
  text: >
    Comparing claessens2006 (Nature Materials 2006) with the same laboratory's follow-up claessens2008
    (PNAS 2008, which cites claessens2006 as ref-2 on pp. 1, 2, 4 for single-ring fascin bundles in
    emulsion droplets) reveals four concrete quantitative tensions: (1) Maximum single-ring fascin
    bundle size: claessens2008 (pp. 1-3, Fig. 2E) reports that single confined F-actin/fascin rings
    cannot exceed n_f ~= 20 filaments (two hexagonal shells = 19) due to helical overtwist frustration
    and split into two bundles above n_f = 20, yet claessens2006 Fig. 3B reports single fascin rings
    reaching n = 30.5-36.1 filaments across all four fascin:actin ratios (18 of 52 digitized points
    have n > 20: max 30.51 at 1:2, 36.13 at 0.2, 32.76 at 1:20, 32.15 at 1:50). Moreover, evaluating
    droplet_filament_count (exact same_as claessens2008/droplet_ring_filament_number) on claessens2008
    Fig. 2E's own measured rightmost single-ring droplets (ca_fig2e_single_ring_max, R_r = R_d = D_d/2,
    M_actin = 42 kDa) yields n = 30.5-66.1 (a_mon = 2.7 nm) or 32.8-71.0 (2.9 nm), consistent with
    claessens2008's 2.22x Fig. 2E boundary discrepancy (claessens2008/q_fig2e_quantified_factor_2p22).
    (2) Fascin dissociation constant K_d: claessens2006 (p. 12, uncited) uses K_d = 0.7 uM, whereas
    claessens2008 (p. 4, citing Ono et al. 1997 ref-36) uses K_d = 0.3 uM (a 2.33x difference).
    (3) Inter-filament spacing for fascin: claessens2006 (p. 12) sets surface spacing t = 10 nm with
    d = 4.5 nm (center-to-center d + t = 14.5 nm), whereas claessens2008 states a surface separation
    of ~5 nm (p. 1) and measures a SAXS hexagonal center-to-center lattice constant a_H = 12.4 nm (p. 2).
    (4) Ligand depletion: claessens2006 (p. 12) uses the non-depleted Langmuir isotherm theta = c_ABP / (K_d + c_ABP),
    whereas claessens2008 (p. 4) switches to the exact 1:1 quadratic depletion equation R* (which
    reduces to theta only as c_a -> 0; at c_a = 0.5 uM, K_d = 0.7 uM, r = 0.5, theta = 0.263 exceeds
    R* = 0.184 by 43%).
  citation: {page: 12, printed_page: "12", quote: "actin bundles (α–actinin and plastin Kd = 0.5 µM, fascin Kd = 0.7 µM)", where: Methods}

