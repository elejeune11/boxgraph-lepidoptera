- id: q_si_fig1a_stiffness_vs_fig3b
  kind: unexplained_difference
  about: [wlc_ring_bending_stiffness, run_ring_stiffness_si1a, run_relaxation_si1a, run_relaxation_si1b, D_sat_si1a_eye, R_ring_si1a]
  text: >
    Evaluating kappa_B = 0.16 * R_c^3 * k_B * T / D_B^2 (p. 11) on the SI Fig. 1a ring
    (fascin:actin 1:2, R_ring = 8.0 um, plateau D ~ 0.08 um, p. 20) gives kappa_B ~ 52.7 pN*um^2
    (kappa_B_ring_si1a), roughly 2-2.5x higher than the fascin 1:2 measurements plotted in Fig. 3B
    (p. 19, where all red filled circles lie <= ~25 pN*um^2 and the SI table fit L_B = 16.2 + 1.4*n
    at L_B = 2*pi*8.0 = 50.3 um implies n ~ 24.3). Correspondingly, the unit-prefactor relaxation
    time (mu/kappa)*L^4 differs by 6.9x between SI Fig. 1b and 1a (832 s vs 121 s), whereas the
    apparent saturation times differ by less than 2x (~5 s vs ~3 s). Calibrated digitization of
    SI Fig. 1a-b and Fig. 3B in digitize:claessens2006 should test this discrepancy.
  citation: {page: 20, printed_page: "SI 1", quote: "a. Ratio of fascin:actin 1:2 R ring =8.0 µm", where: "SI Fig. 1a"}

- id: q_digitized_fig3_K_and_small_n_continuation
  kind: unexplained_difference
  about: [fig3d_peg_curve, fig3a_plastin_05_curve, fig3b_fascin_05_curve, fig3c_aact_01_curve, bundle_3d_bending_linear_L, bundle_3d_bending_linear_L_K_no_divN, cmp_fig3d_peg_curve_printed, cmp_fig3d_peg_curve_KnoN]
  text: >
    Calibrated digitization of Fig. 3D (parameter-free PEG 4% curve, t = 0, k_par/delta = 10^3 N/m^2,
    L_B = 21.2 + 1.3*n um) decisively separates the printed K = S_2/N formula from the variant K = S_2
    for n >= 10: printed K = S_2/N overshoots every point (48.1 vs 35.9 pN*um^2 at n = 30, +34.1%;
    78.9 vs 54.6 pN*um^2 at n = 38, +44.5%; verdict not reproduced), whereas variant K = S_2 falls
    inside the 95% reading interval of all 7 digitized points across n = 10..38 (+1.4% to +3.8%;
    overall verdict close). Across Fig. 3A-C at n >= 9 (c_a = 0.5 uM), printed K = S_2/N overshoots by
    +64% to +221% at n = 38, whereas K = S_2 reproduces fig3a_plastin_002_curve and comes close on
    fig3b_fascin_002_curve (within 5.8% for n >= 9) and fig3b_fascin_02_curve (within 11.4% for n >= 9).
    However, for n < 9 (where N = (sqrt(n) - 1)/2 < 1), continuous polynomial continuation of K = S_2
    overshoots all plotted curves (+13% to +14% on PEG, +60% on fascin 0.5, +71% on alpha-actinin 0.1
    at n = 2-3), while printed K = S_2/N stays close at n = 2-3. This indicates the plotted curves did
    not use the naive continuous polynomial K = S_2 below n = 9 (e.g., interpolating from the discrete
    odd-n_2D points n = 1, 9, 25, 49, or using a modified small-n expression), and even for n >= 9
    residual +19% to +35% overshoots remain on Fig. 3A red, 3B red, and 3C red/blue at c_a = 0.5 uM.
  citation: {page: 12, printed_page: "12", quote: "where n is the total (odd) number of filaments in 2D and", where: Methods}

