    (K = S_2) deviates by up to 49%. Note also that claessens2006 uses the Tolomeo-Holley geometric
    factor d*(d+t) in chi^2 = k_a*d*(d+t)/(12*kappa_a), whereas Bathe et al. 2008 use parallel-axis
    (d+t)^2. (3) Algebraic-inverse ring-fluctuation scaling: inverting claessens2006/wlc_ring_bending_stiffness
