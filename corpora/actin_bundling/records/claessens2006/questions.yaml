    out-of-plane transverse fluctuations, but provides no simulation specification (segment/bead
    count, bending Hamiltonian discretization, ring closure constraint, trial moves, step count,
    or L_B / l_p range), making the simulation non-runnable.
  citation: {page: 11, printed_page: "11", quote: "Metropolis Monte Carlo simulations were used to determine the prefactor (0.16)", where: Methods}

- id: q_langmuir_depletion_neglected
  kind: choice
  about: [abp_chemical_equilibrium, c_a_added]
  text: >
    The chemical equilibrium expression theta = c_ABP / (K_d + c_ABP) on p. 12 uses the droplet
    ABP concentration c_ABP without subtracting bound ABP (free-ligand depletion). For c_a ~ 0.5 uM
    and saturated hexagonal binding (~1 crosslink site per 12 actin monomers, ~0.04 uM sites),
    bound ABP can be comparable to total c_ABP at low ratios r_ABP:a = 0.02-0.05 (c_ABP ~ 0.01-0.025 uM).
  citation: {page: 12, printed_page: "12", quote: "equilibrium using, δ = 33 × 10 −9 /θ m , where, θ = c ABP /( K d + c ABP )", where: Methods}

- id: q_si_table_missing_units_and_affine_scaling
  kind: reading
  about: [bundle_length_linear_fit, L0_fascin_05, r2_plastin_002, droplet_filament_count]
  text: >
    The SI bundle-length table (p. 20) omits units in the header 'Bundle length L_B(n)' (inferred
    to be micrometers from SI Fig. 1a-b ring radii 8.0 and 5.2 um), and p. 11 describes L_B as
    'directly proportional to n' even though all 10 empirical fits are affine with large positive
    intercepts (13.8 to 24.0 um). Geometrically, spherical droplet mass conservation at fixed c_a
    predicts n proportional to R_d^2 proportional to L_B^2, i.e., L_B proportional to n^(1/2),
    whose tangent over n ~ 2-30 naturally produces an affine fit with a large positive intercept.
    Also note the low goodness of fit R^2 = 0.37 for plastin r_ABP:a = 0.02.
  citation: {page: 11, printed_page: "11", quote: "Bundle length LB was directly proportional to n and the", where: Methods}

- id: q_si_relaxation_mu_unstated
  kind: unstated_input
  about: [wlc_relaxation_time_scaling, mu_water_added, cmp_tau_si1a_vs_eq, cmp_tau_si1b_vs_eq]
  text: >
    SI p. 20 states the WLC equilibration scaling tau ~ (mu / kappa) * L^4 without defining the
    symbol mu, stating its numerical value, or giving the ring-mode numerical prefactor. By
    dimensional analysis [mu] = Pa*s (solvent viscosity / transverse hydrodynamic drag per unit
    length ~ 10^-3 Pa*s), and comparing unit-prefactor (mu/kappa)*L^4 against the observed
    equilibration times (~3-5 s) implies a mode prefactor of order ~10^-2 to 10^-4 depending on
    whether L is full circumference 2*pi*R or ring radius R.
  citation: {page: 20, printed_page: "SI 1", quote: "where τ depends on the length L and bending rigidity κ of the chain.", where: "SI Bundle Equilibration"}

