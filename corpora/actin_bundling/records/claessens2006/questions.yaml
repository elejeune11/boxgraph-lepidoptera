- id: q_unstated_actin_concentration
  kind: unstated_input
  about: [c_a_added, abp_chemical_equilibrium, abp_concentration_from_ratio, droplet_filament_count, bundle_3d_bending]
  text: >
    The paper never states the actin monomer concentration c_a inside the emulsion droplets
    anywhere in the main text, Methods, figure captions, or Supplementary Information, reporting
    only the ABP-to-actin molar ratios r_ABP:a (1:2, 1:10/0.2, 1:20, 1:50). Yet c_ABP = r_ABP:a * c_a
    is required to evaluate theta = c_ABP / (K_d + c_ABP) and delta = 33 nm / theta (p. 12), and
    c_a is required to compute filament count n from droplet volume (p. 16). Two independent
    internal constraints both point to c_a ~ 0.4-0.6 uM: (1) combining droplet mass conservation
    with the SI linear relations L_B(n) = 2*pi*R_r gives c_a ~ 0.35-0.45 uM; (2) p. 7 states
    delta = 10^-7 m as the typical axial spacing at high ABP concentration (r = 0.5), which yields
    c_a = 0.49 uM for K_d = 0.5 uM and 0.69 uM for K_d = 0.7 uM.
  citation: {page: 12, printed_page: "12", quote: "and c ABP is the droplet ABP concentration, which is confirmed", where: Methods}

- id: q_K_factor_vs_fig3_curves
  kind: possible_error
  about: [bundle_2d_bending, bundle_3d_bending, bundle_3d_bending_K_no_divN, cmp_fig3d_peg4_n36_printed, cmp_fig3d_peg4_n36_KnoN]
  text: >
    Page 12 prints K = (1/N) * sum_{k=1}^N sum_{i=k}^N i = S_2 / N = n_2D*(n_2D + 1)/12.
    Although K = S_2/N is variationally exact for the linear-strain ansatz u_i = i*u_1 and yields
    the paper's stated crossover scaling alpha ~ n_3D, plugging the SI empirical bundle lengths
    L_B(n) = L_0 + s*n (p. 20) into printed K = S_2/N makes L_B^2/n increase at large n and
    drives kappa_B upward super-quadratically, overshooting the plotted curves in Fig. 3A-D.
    Crucially, in Fig. 3D (PEG 4%, where t = 0, k_par/delta = 10^3 N/m^2, and L_B = 21.2 + 1.3*n um
    with no unstated c_a), printed K = S_2/N gives kappa_B(36) = 70.45 pN*um^2 and ratio
    kappa_B(36)/kappa_B(10) = 13.21 (> 3.6^2 = 12.96), whereas the red model curve in Fig. 3D
    gives ~5.1 at n = 10 and ~51 pN*um^2 at n = 36 (ratio ~10.0). Omitting 1/N (variant
    bundle_3d_bending_K_no_divN, K = S_2) gives 5.23 and 51.18 pN*um^2 (ratio 9.80) for PEG 4%
    and produces the concave-down crossover curves seen in Fig. 3A-C. Calibrated digitization of
    Fig. 3A-D in digitize:claessens2006 is needed to test both forms definitively.
  citation: {page: 12, printed_page: "12", quote: "where n is the total (odd) number of filaments in 2D and", where: Methods}

- id: q_spacing_factor_d_d_plus_t
  kind: choice
  about: [bundle_2d_bending, bundle_3d_bending]
  text: >
    The printed three-point-bending equations on p. 12 use the geometric factor d*(d + t) in both
    w_B,max and beta^2, which yields a fully coupled limit kappa_B(2D) -> n*kappa_a + 2*k_a*d*(d+t)*S_2
    rather than the parallel-axis Euler-Bernoulli limit n*kappa_a + 2*k_a*(d+t)^2*S_2 (differing
    by (d+t)/d = 3.22 for fascin/plastin and 8.78 for alpha-actinin). This reflects the Tolomeo &
    Holley (1997, ref-25) surface-slip approximation (surface slip d*w' times moment arm d+t,
    neglecting rotation of the crosslink of length t). Preliminary inspection of Fig. 3B and 3C
    at n = 9 (N = 1, where K = 1 unconditionally) matches d*(d+t) rather than (d+t)^2, confirming
    that d*(d+t) is a deliberate modeling approximation rather than a typographical error.
  citation: {page: 12, printed_page: "12", quote: "calculated analytically using an analogous version of Eq. 11 of ref. 25", where: Methods}

