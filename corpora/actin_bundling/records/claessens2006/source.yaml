notes: >
  Full quantitative reading of Claessens, Bathe, Frey & Bausch (2006), Nature Materials 5, 748-753
  (PDF pp. 1-19: article manuscript text, Methods, References 1-37, Figure captions, and Figures 1-3;
  PDF p. 20: Supplementary Information NM06040751A including bundle equilibration scaling, SI Fig. 1a-b,
  and the 10-row empirical bundle-length table L_B(n)).

  In scope:
  - Polymer bending stiffness / persistence length relation kappa_B = l_p * k_B * T (p. 3) verified
    against the single F-actin benchmark kappa_a = 7 x 10^-26 N m^2 (l_p = 17 um, T = 298 K, ref-23,
    p. 5) and cross-checked for consistency against kappa_a = 7.3 x 10^-26 N m^2 (ref-35, pp. 12, 16).
  - Single F-actin Euler-Bernoulli elasticity (k_a = EA = 4.4 x 10^-8 N, ref-26; kappa_a = EI =
    7.3 x 10^-26 N m^2, ref-35; d = 4.5 nm; E = 2 GPa; p. 12), inverted under both square
    (I/A = d^2/12 -> d = 4.46 nm, E = 2.21 GPa: reproduces both) and circular (I/A = d^2/16 ->
    d = 5.15 nm, E = 2.11 GPa: does not reproduce d = 4.5 nm) cross-section assumptions.
  - Emulsion droplet geometry V_d = 4*pi*R_d^3 / 3 and mass-conservation filament count model
    (from words, p. 16 Fig. 2 caption), plus WLC ring bending stiffness kappa_B = 0.16 * R_c^3 * k_B * T / D_B^2
    (p. 11, citing Odijk ref-22 with Monte Carlo prefactor 0.16). Non-runnable models are recorded
    for the unstated Metropolis Monte Carlo simulation (p. 11) and the fluorescence Gaussian profile
    fit + fuzzy diameter subtraction D_B = sigma_avg - sigma_int (p. 11, no raw profile widths printed).
  - ABP-actin Langmuir chemical equilibrium theta = c_ABP / (K_d + c_ABP) and mean axial spacing
    delta = delta_max / theta with delta_max = 33 nm (printed symbol delta_max for "minimum mean
    axial spacing", p. 12), K_d = 0.5 uM (plastin, alpha-actinin) and K_d = 0.7 uM (fascin), plus
    c_ABP = r_ABP:a * c_a with the unstated droplet actin concentration c_a supplied in added.yaml
    (0.5 uM, inferred from both droplet geometry + SI L_B(n) and the p. 7 statement delta = 10^-7 m
    at high ABP concentration; alternatives 0.35, 1.0, 2.4 uM).
  - Effective shear stiffness per unit length k_par / delta and inverse k_par = (k_par/delta) * delta
    (verifying PEG k_par >= 10^-4 N/m from k_par/delta >= 10^3 N/m^2 at delta = 10^-7 m, p. 7), and
    dimensionless bending regime parameter alpha = k_par * L_B^2 / (delta * k_a) (pp. 6-8, 16),
    evaluated for brush border microvilli (L_B = 2-5 um, n = 20-30, plastin -> alpha <= 0.00284 << 1
    at delta = 100 nm in run_alpha_microvilli_hi, and <= 0.0086 << 1 even at saturated delta = 33 nm,
    confirming decoupled regime), PEG 4% (n = 30 -> alpha = 82.4 > n, confirming fully coupled),
    fascin, and alpha-actinin.
  - Core 2D three-point-bending fiber-bundle model (p. 12: w_B,max, beta^2, K = (1/N) sum_{k=1}^N sum_{i=k}^N i,
    N = (n-1)/2, kappa_B(2D) = L_B^3 / (48 w_B,max)) and 2D-to-3D mapping (n_3D = n_2D^2,
    kappa_B(3D) = n_2D * kappa_B(2D)), together with its decoupled (kappa_B = n * kappa_a) and
    fully coupled (kappa_B = n^2 * kappa_a at t = 0) limits, and a corrected variant
    (bundle_3d_bending_K_no_divN, K = sum_{k=1}^N sum_{i=k}^N i without 1/N) motivated by the
    large-n slope discrepancy against the plotted Fig. 3 curves (especially parameter-free Fig. 3D PEG).
  - All 10 empirical linear bundle-length relations L_B(n) = L_0 + s*n and R^2 values (SI p. 20)
    and the WLC relaxation-time scaling law tau ~ (mu / kappa) * L^4 (SI p. 20, prefactor: unknown).

  Left out of data.yaml (non-model preparation and instrument numbers):
  - Buffer recipes and preparation protocols on p. 10: G-buffer (2 mM Tris, 0.2 mM ATP, 0.2 mM CaCl2,
    0.2 mM DTT, 0.005% NaN3), 4 degC storage, 24 h dialysis, 7 d usage window, E. coli growth at
    37 degC to A_600 = 0.6, IPTG induction at 37 degC (I-plastin) and 20 degC (fascin), phalloidin
    TRITC (1:4), 1/10th volume of 10x F-buffer (20 mM Tris, 20 mM MgCl2, 2 mM CaCl2, 2 mM DTT,
    1 M KCl), 20 uL into 1 mL of 0.3 mM phospholipid (95 mol% DOPG, 5 mol% DMPE-PEG2000) dodecane.
  - Microscope / camera hardware parameters on p. 11 (100x / 1.3 NA oil objective, 117 ms frame
    interval) and Fig. 2 scale bar (10 um, p. 16).
  - PEG molecular weight (6 kDa, p. 7) noted in conditions/descriptions as it feeds no equation.

  Figures (left for the independent digitize stage; no figures.yaml or figures.md created here;
  approximate eye-read '~' anchor values are recorded in data.yaml for SI Fig. 1a-b and representative
  Fig. 3A-D model-curve points to hand off cleanly to digitize:claessens2006):
  - Fig. 1 (p. 17, caption p. 16): schematic diagram of discrete ABP-crosslinked F-actin bundle
    showing d, t, delta, k_par, and decoupled (alpha << 1) vs fully coupled (alpha >> n) bending
    (schematic drawing, no data points or curves).
  - Fig. 2a, 2b (p. 18, caption p. 16): fluorescence micrographs of F-actin in emulsion droplets
    without ABPs (2a) and forming a ring of radius R_r inside a droplet of radius R_d with fuzzy
    diameter D (2b) (micrographs, no plotted data).
  - Fig. 3A (p. 19, caption p. 16): log-log plot of bundle bending stiffness kappa_B (pN*um^2) vs
    filament number n (1 to 40) for plastin at r_ABP:a = 1:50 (open blue circles in plot; caption
    on p. 16 prints red open circle) and 1:2 (filled red circles in plot; caption on p. 16 prints
    blue filled circle), with two solid model curves and two dashed asymptotic lines (n*kappa_a,
    n^2*kappa_a) (to be digitized).
  - Fig. 3B (p. 19, caption p. 16): log-log plot of kappa_B (pN*um^2) vs n (1 to 40) for fascin at
    four concentration ratios (red filled circles, blue open circles, green open squares, orange
    filled squares; note caption symbol/ordering discrepancy between 1:20 and 1:50 and SI table
    discrepancy 1:10 vs 0.2), four solid model curves, and two dashed lines (to be digitized).
  - Fig. 3C (p. 19, caption p. 16): log-log plot of kappa_B (pN*um^2) vs n (1 to 40) for
    alpha-actinin at two ratios (red filled circles 1:10, blue open circles labeled 1:50 in caption
    vs 0.05 in SI table), two solid model curves, and two dashed lines (to be digitized).
  - Fig. 3D (p. 19, caption p. 16): log-log plot of kappa_B (pN*um^2) vs n (1 to 40) for PEG 6 kDa
    at 4% w/w (red filled circles) and 2% w/w (blue open circles), solid red model curve (k_par/delta
    >= 10^3 N/m^2), and two dashed lines (to be digitized; decisive test of K = S_2/N vs K = S_2).
  - SI Fig. 1a, 1b (p. 20): fuzzy diameter D (um) vs time averaged (s, 0 to 8 s) for fascin:actin
    1:2 (R_ring = 8.0 um, 10 red points saturating near 0.08 um) and fascin:actin 1:50 (R_ring = 5.2 um,
    8 red points saturating near 0.26 um) (to be digitized).
