# ==========================================================================
# Cross-record ModelAtlas relations with claessens2008
# (claessens2008 cites claessens2006 as ref-2 on pp. 1, 2, 4; entered in
# claessens2006/relations.yaml with provenance: proposed under record isolation)
# ==========================================================================

- id: rel_claessens2008_droplet_ring_same_n
  kind: same_as
  a: claessens2008/droplet_ring_filament_number
  b: claessens2006/droplet_filament_count
  output_map:
    n: n_f
  mapping:
    c_a: "(c_a / M_actin) * 1e6"
    R_d: "D_d / 2"
    R_r: "D_d / 2"
    a_mon: "d"
  regime:
    c_a: [0.01, 0.2]
    D_d: [5.0, 50.0]
    M_actin: [42000.0, 43000.0]
    d: [2.7, 2.9]
  provenance: proposed
  reason: >
    Claessens et al. (2008, p. 2, citing claessens2006 as ref-2: "At small-droplet diameters, D_d,
    F-actin filaments bundle into a single ring in the presence of fascin (2)") reuse the exact same
    emulsion-droplet single-ring mass-conservation calculation introduced in claessens2006 (Fig. 2
    caption, p. 16: total polymerized F-actin length in the spherical droplet divided by single-ring
    circumference). Converting mass concentration c_a [mg/ml] to molar concentration (c_a / M_actin) * 1e6 [uM]
    and setting R_r = R_d = D_d / 2 (equatorial ring at the droplet wall) makes claessens2008's
    filament count n_f identically equal to claessens2006's n.
  assumptions:
    - "Equatorial single ring lying at the droplet wall (R_r = R_d = D_d / 2, circumference 2*pi*R_r = pi*D_d)."
    - "Complete polymerization of G-actin into the single ring with monomer molar mass M_actin (42 kDa) converting mg/ml to uM."

- id: rel_claessens2008_droplet_ring_same_L
  kind: same_as
  a: claessens2008/droplet_ring_filament_number
  b: claessens2006/droplet_filament_count
  output_map:
    L_tot: L
  mapping:
    c_a: "(c_a / M_actin) * 1e6"
    R_d: "D_d / 2"
    R_r: "D_d / 2"
    a_mon: "d"
  regime:
    c_a: [0.01, 0.2]
    D_d: [5.0, 50.0]
    M_actin: [42000.0, 43000.0]
    d: [2.7, 2.9]
  provenance: proposed
  reason: >
    Both emulsion-droplet single-ring models (claessens2006 Fig. 2 caption p. 16 and claessens2008
    p. 2, citing ref-2) compute total polymerized F-actin contour length in a spherical droplet as
    V_d * c_a * N_A * a_mon. Under unit conversion c_a [uM] = (c_a [mg/ml] / M_actin) * 1e6 and
    R_d = D_d / 2, claessens2008's total F-actin length L is identical to claessens2006's L_tot.
  assumptions:
    - "Spherical droplet volume V_d = (4/3)*pi*R_d^3 = (pi/6)*D_d^3 with complete actin polymerization."

- id: rel_claessens2008_Rstar_reduces_to_langmuir_theta
  kind: reduces_to
  a: claessens2008/effective_bound_ratio
  b: claessens2006/abp_chemical_equilibrium
  output_map:
    theta: R_star
  mapping:
    c_ABP: "R * c_a"
    K_d: "K_d"
    delta_max: "33.0"
  limit:
    c_a: "0"
  regime:
    R: [0.02, 1.0]
    K_d: [0.3, 0.7]
    c_a: [0.1, 500.0]
  tolerance: 1.0e-4
  provenance: proposed
  reason: >
    Claessens et al. (2006, Methods p. 12) model ABP-actin binding with the non-depleted Langmuir
    isotherm theta = c_ABP / (K_d + c_ABP), whereas Claessens et al. (2008, Methods p. 4) introduce
    the exact 1:1 quadratic mass-action solution R* = (1/2)*[(1 + R + K_d/c_a) - sqrt((1 + R + K_d/c_a)^2 - 4*R)]
    accounting for free-fascin depletion. Mapping c_ABP = R * c_a, in the dilute-actin / negligible-depletion
    limit c_a -> 0 (c_a << K_d), R* reduces exactly to theta (relative error ~ c_a / (K_d + R*c_a) -> 0).
    At claessens2006's inferred droplet actin concentration c_a ~ 0.5 uM and K_d = 0.7 uM (r = 0.5),
    neglecting 1:1 ligand depletion overestimates occupancy by 43% (theta = 0.263 vs R* = 0.184).
  assumptions:
    - "Dilute-actin limit c_a -> 0 (c_a << K_d) so free ABP is undepleted (c_ABP,free -> c_ABP = R*c_a)."
    - "Both equations formally treat binding sites as 1:1 independent Langmuir sites (delta_max = 33 nm is unused by output theta)."

# ==========================================================================
# Cross-record ModelAtlas relations with graham2023
# (graham2023 cites bathe2008 [ref-si-11] for Eq. S1 and Claessens et al.
# Nature Physics 2006 [ref-31], not claessens2006 Nature Materials 2006)
# ==========================================================================

- id: rel_graham2023_bundle_3d_approx_bathe_eqS1
  kind: approximated_by
  a: claessens2006/bundle_3d_bending
  b: graham2023/bundle_bending_rigidity_bathe_eqS1
  mapping:
    k_b_fil: "kappa_a * 1e30"
    N: "n"
    chi: "sqrt(k_a * d * (d + t) / (12 * kappa_a))"
    c_qj: "5 / 6"
    alpha: "k_par * L_B**2 / (delta * k_a)"
  regime:
    n: [2.0, 40.0]
    L_B: [1.0e-5, 8.0e-5]
    k_par: [1.0e-7, 1.0e-4]
    delta: [3.3e-8, 2.0e-6]
    k_a: [4.4e-8, 4.4e-8]
    kappa_a: [7.3e-26, 7.3e-26]
    d: [4.5e-9, 4.5e-9]
    t: [0.0, 3.5e-8]
  tolerance: 0.10
  provenance: proposed
  reason: >
    Graham et al. (2023, SI Table 1 Note 1, Eq. S1, p. 39) reproduce Bathe et al.'s (2008, ref-si-11)
    closed-form bundle bending stiffness formula k_b = k_b_fil * N * [1 + chi^2*(N-1)/(1 + c_qj*(N + sqrt(N))/alpha)],
    which is the single-mode analytic simplification of the three-point-bending fiber-bundle model first
    introduced in claessens2006 (Methods p. 12, citing Bathe & Frey in preparation 2006). Algebraically,
    claessens2006's bundle_3d_bending satisfies kappa_B(3D) = n*kappa_a * [1 + chi^2*(n-1)/(1 + c_eff(u)*(n + sqrt(n))/alpha)]
    with chi^2 = k_a*d*(d+t)/(12*kappa_a), alpha = k_par*L_B^2/(delta*k_a), 12*K = n + sqrt(n), and
    c_eff(u) varying monotonically from 5/6 (small u = beta*L_B/2, within 1.3% of Bathe's fundamental
    half-sine mode factor pi^2/12 = 0.8225) to 1 (large u). At c_qj = 5/6, graham2023 Eq. S1 approximates
    claessens2006/bundle_3d_bending to within 9.4% across the full physical regime (n in [2, 40],
    t in [0, 35 nm], L_B in [10, 80 um], k_par in [1e-7, 1e-4 N/m], delta in [33 nm, 2 um]).
  assumptions:
    - "Maps claessens2006's Tolomeo-Holley geometric factor d*(d+t) into chi = sqrt(k_a*d*(d+t)/(12*kappa_a)) (note Bathe et al. 2008 use parallel-axis (d+t)^2, which agrees at t = 0)."
    - "Fixes Bathe's mode factor c_qj = 5/6 (exact small-beta*L_B limit of pinned three-point bending; c_eff varies smoothly from 5/6 to 1 as beta*L_B goes from 0 to oo)."
    - "Uses claessens2006's printed K = S_2/N = (n + sqrt(n))/12, which produces the exact (N + sqrt(N)) denominator of Eq. S1 (variant K = S_2 deviates by up to 49%)."

- id: rel_graham2023_bathe_eqS1_reduces_to_decoupled
  kind: reduces_to
  a: graham2023/bundle_bending_rigidity_bathe_eqS1
  b: claessens2006/bundle_stiffness_decoupled
  mapping:
    n: "N"
    kappa_a: "k_b_fil * 1e-30"
  limit:
    alpha: "0"
  regime:
    k_b_fil: [5.0e7, 1.0e8]
    N: [2.0, 40.0]
    chi: [1.0, 5.0]
    c_qj: [0.5, 2.0]
    alpha: [0.01, 10.0]
  tolerance: 1.0e-5
  provenance: proposed
  reason: >
    In the weak inter-filament shear-coupling limit alpha -> 0 (which Graham et al. 2023, SI p. 39
    invoke for VASP-crosslinked bundles: "we assume that the inter-filament coupling parameter is
    really weak... consider the bending stiffness to scale linearly with number of filaments"),
    graham2023/bundle_bending_rigidity_bathe_eqS1 reduces identically to claessens2006's decoupled
    bundle bending regime kappa_B = n * kappa_a (Fig. 3 caption, p. 16).
  assumptions:
    - "Weak shear coupling alpha << 1 so the nonlinear coupling term chi^2*(N-1)/(1 + c_qj*(N+sqrt(N))/alpha) vanishes."

- id: rel_graham2023_bathe_eqS1_reduces_to_coupled
  kind: reduces_to
  a: graham2023/bundle_bending_rigidity_bathe_eqS1
  b: claessens2006/bundle_stiffness_coupled
  mapping:
    n: "N"
    kappa_a: "k_b_fil * 1e-30"
  limit:
    alpha: "oo"
  regime:
    k_b_fil: [5.0e7, 1.0e8]
    N: [2.0, 40.0]
    chi: [1.0, 1.0]
    c_qj: [0.5, 2.0]
    alpha: [1.0, 100.0]
  tolerance: 1.0e-5
  provenance: proposed
  reason: >
    In the rigid-crosslink fully coupled limit alpha -> oo at zero inter-filament spacing (chi = 1,
    corresponding to t = 0 in claessens2006 Fig. 3 caption, p. 16), graham2023/bundle_bending_rigidity_bathe_eqS1
    reduces identically to claessens2006's fully coupled bundle stiffness law kappa_B = n^2 * kappa_a.
  assumptions:
    - "Tight filament packing chi = 1 (t = 0) and rigid crosslinks alpha >> N + sqrt(N)."

- id: rel_graham2023_linear_rigidity_same_as_decoupled
  kind: same_as
  a: graham2023/bundle_bending_rigidity_linear
  b: claessens2006/bundle_stiffness_decoupled
  mapping:
    n: "N_fil"
    kappa_a: "K_b_fil * 1e-30"
  regime:
    K_b_fil: [5.0e7, 1.0e8]
    N_fil: [1.0, 40.0]
  provenance: proposed
  reason: >
    Graham et al.'s (2023, SI Table 1 Note 1, p. 39) weakly coupled VASP ring bending stiffness
    K_b_ring = K_b_fil * N_fil is the exact decoupled-bundle law kappa_B = n * kappa_a stated in
    claessens2006 (p. 6; Fig. 3 caption, p. 16), differing only in unit convention (pN*nm^2 vs N*m^2).
  assumptions:
    - "Decoupled / freely slipping bundle limit (alpha << 1); single-op linear product."

- id: rel_graham2023_filament_rigidity_same_as_persistence
  kind: same_as
  a: claessens2006/bending_stiffness_persistence
  b: graham2023/filament_flexural_rigidity
  mapping:
    L_p: "l_p * 1e6"
    kBT: "1.380649e-2 * T"
  regime:
    l_p: [5.0e-6, 3.0e-5]
    T: [290.0, 310.0]
  provenance: proposed
  reason: >
    Both records define single F-actin flexural rigidity from wormlike-chain persistence length via
    kappa = l_p * k_B * T (claessens2006 p. 3; graham2023 SI p. 39, Note 1: k_b,fil = L_p * k_B * T),
    with claessens2006 parameterizing thermal energy via absolute temperature T [K] (k_B = 1.380649e-2 pN*nm/K)
    and graham2023 taking kBT [pN*nm] directly.
  assumptions:
    - "Exact SI Boltzmann constant k_B = 1.380649e-23 J/K = 1.380649e-2 pN*nm/K."

- id: rel_graham2023_droplet_ring_L_same_as_circumference
  kind: same_as
  a: claessens2006/droplet_filament_count
  b: graham2023/circular_ring_contour_length
  output_map:
    L: L_B
  mapping:
    R: "R_r"
  regime:
    c_a: [0.3, 2.0]
    R_d: [1.0, 15.0]
    R_r: [0.5, 15.0]
    a_mon: [2.7, 2.9]
  provenance: proposed
  reason: >
    Both papers compute the contour length of a closed circular actin ring confined inside a spherical
    droplet as circumference L = 2*pi*R (claessens2006 Fig. 2 caption p. 16: L_B = 2*pi*R_r;
    graham2023 SI Section 2.9 p. 43: L = 2*pi*R).
  assumptions:
    - "Closed circular ring of radius R = R_r."

