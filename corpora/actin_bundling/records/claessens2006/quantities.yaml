- id: bending_stiffness_bundle
  name: F-actin bundle bending stiffness
  dimension: "[force] * [length] ** 2"
  description: Intrinsic bending stiffness (flexural rigidity) kappa_B of a 3D F-actin bundle.

- id: bending_stiffness_filament
  name: single F-actin filament bending stiffness
  dimension: "[force] * [length] ** 2"
  description: Intrinsic bending stiffness kappa_a = E*I of a single F-actin filament.

- id: bending_stiffness_2d
  name: 2D bundle model bending stiffness
  dimension: "[force] * [length] ** 2"
  description: Effective bending stiffness kappa_B(2D) = L_B^3 / (48 * w_B,max) of a 2D planar array of n_2D filaments in three-point bending.

- id: stretching_stiffness_filament
  name: F-actin axial stretching stiffness
  dimension: "[force]"
  description: Backbone axial extensional stiffness k_a = E*A of a single F-actin filament.

- id: youngs_modulus_filament
  name: effective Young's modulus of F-actin
  dimension: "[force] / [length] ** 2"
  description: Effective elastic Young's modulus E of a single F-actin filament.

- id: filament_diameter
  name: effective F-actin filament diameter
  dimension: "[length]"
  description: Effective diameter (cross-sectional width) d of a single F-actin filament in the mechanical bundle model.

- id: crosslink_spacing_interfilament
  name: inter-filament crosslink spacing
  dimension: "[length]"
  description: Surface-to-surface inter-filament spacing t fixed by the molecular length of the intervening ABP crosslink.

- id: crosslink_length_ratio
  name: crosslinker length ratio
  dimension: "dimensionless"
  description: Ratio of inter-filament spacing (molecular length) of alpha-actinin to that of fascin.

- id: crosslink_spacing_axial
  name: axial crosslink spacing
  dimension: "[length]"
  description: Mean axial spacing delta along the filament backbone between adjacent bound ABP crosslinks.

- id: crosslink_spacing_min
  name: saturated axial crosslink spacing
  dimension: "[length]"
  description: Minimum mean axial spacing between crosslinks in hexagonally packed F-actin bundles with fully saturated binding sites (printed symbol delta_max = 33 nm on p. 12).

- id: crosslink_shear_stiffness
  name: crosslink shear stiffness
  dimension: "[force] / [length]"
  description: Intrinsic linear shear stiffness k_par of a single ABP crosslink resisting inter-filament slip.

- id: protein_unfolding_stiffness
  name: single-molecule protein extensional stiffness
  dimension: "[force] / [length]"
  description: Extensional stiffness of folded proteins probed by single-molecule unfolding experiments at nanometer resolution.

- id: effective_shear_stiffness_per_length
  name: effective shear stiffness per unit length
  dimension: "[force] / [length] ** 2"
  description: Overall effective shear stiffness per unit axial length k_par / delta coupling neighboring filaments.

- id: persistence_length
  name: polymer persistence length
  dimension: "[length]"
  description: Orientational correlation length l_p = kappa / (k_B * T) of a semiflexible filament or bundle.

- id: temperature
  name: absolute temperature
  dimension: "[temperature]"
  description: Thermodynamic temperature T governing thermal fluctuations k_B * T.

- id: bundle_length
  name: bundle contour length
  dimension: "[length]"
  description: Contour length L_B of an F-actin bundle (circumference 2*pi*R_r for a closed emulsion-droplet ring, or physiological bundle length).

- id: bundle_length_intercept
  name: bundle length linear fit intercept
  dimension: "[length]"
  description: Zero-filament intercept L_0 of the empirical linear relation L_B(n) = L_0 + s * n (SI p. 20).

- id: bundle_length_slope
  name: bundle length linear fit slope
  dimension: "[length]"
  description: Slope s = dL_B/dn per filament of the empirical linear relation L_B(n) = L_0 + s * n (SI p. 20).

- id: goodness_of_fit_r2
  name: linear fit goodness of fit R^2
  dimension: "dimensionless"
  description: Coefficient of determination R^2 reported for the empirical linear relation L_B(n) (SI p. 20).

- id: filament_number
  name: number of filaments in 3D bundle
  dimension: "dimensionless"
  description: Total number of constituent F-actin filaments n (= n_3D) in a 3D bundle.

- id: filament_number_2d
  name: number of filaments in 2D bundle model
  dimension: "dimensionless"
  description: Number of filaments n_2D in the 2D planar fiber-bundle theory, mapped to 3D by n_3D = n_2D^2.

- id: bending_regime_parameter
  name: dimensionless bundle bending stiffness parameter
  dimension: "dimensionless"
  description: Dimensionless parameter alpha = k_par * L_B^2 / (delta * k_a) separating decoupled (alpha << 1), shear-dominated (1 << alpha << n), and fully coupled (alpha >> n) regimes.

- id: decay_wavenumber
  name: shear-lag inverse length scale
  dimension: "1 / [length]"
  description: Inverse decay length beta governing the coupling of axial filament stretching and crosslink shear in the 2D three-point-bending equation.

- id: beam_compliance_midspan
  name: three-point-bending midspan compliance
  dimension: "[length] / [force]"
  description: Maximal midspan deflection w_B,max of a pinned 2D bundle subjected to a unit central point load in three-point bending.

- id: ring_radius
  name: bundle ring radius
  dimension: "[length]"
  description: Root-mean-square radius of a closed F-actin bundle ring inside an emulsion droplet (printed R_r on pp. 4, 16; R_c on p. 11; R_ring on p. 20).

- id: droplet_radius
  name: emulsion droplet radius
  dimension: "[length]"
  description: Radius R_d of the water-in-dodecane emulsion droplet confining the actin ring.

- id: droplet_volume
  name: emulsion droplet volume
  dimension: "[length] ** 3"
  description: Volume V_d = (4/3) * pi * R_d^3 of a spherical emulsion droplet.

- id: fuzzy_diameter
  name: ring fuzzy diameter
  dimension: "[length]"
  description: Transverse thermal fluctuation width D_B (or D) of a bundle ring obtained from time-averaged minus instantaneous fluorescence profile Gaussian standard deviations.

- id: profile_width_avg
  name: time-averaged profile Gaussian standard deviation
  dimension: "[length]"
  description: Standard deviation sigma_avg of the Gaussian fit to the time-averaged fluorescence intensity profile perpendicular to the bundle ring.

- id: profile_width_inst
  name: instantaneous profile Gaussian standard deviation
  dimension: "[length]"
  description: Standard deviation sigma_int of the Gaussian fit to the instantaneous fluorescence intensity profile perpendicular to the bundle ring.

- id: actin_concentration
  name: actin molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration c_a of actin monomers inside the emulsion droplet.

- id: abp_concentration
  name: ABP molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration c_ABP of actin-binding protein inside the emulsion droplet.

- id: abp_actin_ratio
  name: ABP-to-actin molar concentration ratio
  dimension: "dimensionless"
  description: Molar concentration ratio r_ABP:a = c_ABP / c_a of crosslinker to actin monomers.

- id: dissociation_constant
  name: ABP-actin dissociation constant
  dimension: "[substance] / [length] ** 3"
  description: Equilibrium dissociation constant K_d for ABP binding to F-actin bundles.

- id: bound_crosslink_fraction
  name: fraction of bound crosslink sites
  dimension: "dimensionless"
  description: Equilibrium occupancy fraction theta = c_ABP / (K_d + c_ABP) of crosslink binding sites along F-actin.

- id: peg_mass_fraction
  name: PEG mass fraction
  dimension: "dimensionless"
  description: Weight/weight percentage (% w/w) of PEG (MW 6 kDa) used as a depletion bundling agent.

- id: abp_shear_strain
  name: thermal ABP shear strain
  dimension: "dimensionless"
  description: Typical shear strain experienced by crosslinks during thermal bundle fluctuations.

- id: monomer_axial_rise
  name: F-actin monomer axial rise
  dimension: "[length]"
  description: Axial contour length per actin monomer along an F-actin filament (used to relate droplet monomer number to total F-actin length).

- id: total_filament_length
  name: total F-actin length in droplet
  dimension: "[length]"
  description: Total contour length of polymerized F-actin contained in one emulsion droplet.

- id: relaxation_time
  name: WLC bundle equilibration relaxation time
  dimension: "[time]"
  description: Longest bending relaxation / equilibration time tau ~ (mu / kappa) * L^4 of a wormlike chain bundle.

- id: hydrodynamic_drag_per_length
  name: hydrodynamic friction coefficient per unit length
  dimension: "[mass] / [length] / [time]"
  description: Effective hydrodynamic viscosity / transverse drag coefficient per unit length mu in the WLC relaxation scaling tau ~ (mu / kappa) * L^4 (SI p. 20).

- id: wlc_ring_prefactor
  name: WLC ring fluctuation numerical prefactor
  dimension: "dimensionless"
  description: Numerical prefactor (0.16) in kappa_B = 0.16 * R_c^3 * k_B * T / D_B^2 determined by Metropolis Monte Carlo simulations (p. 11).

- id: averaging_time
  name: fluorescence intensity averaging time
  dimension: "[time]"
  description: Elapsed time window over which fluorescence intensity profiles are summed to determine the bundle ring fuzzy diameter D (SI Fig. 1a-b, p. 20; Methods, p. 11).
