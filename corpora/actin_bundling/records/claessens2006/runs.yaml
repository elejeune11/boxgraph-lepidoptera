# --- 5. Dimensionless bending regime parameter alpha = k_par * L_B^2 / (delta * k_a) ---

- id: run_alpha_microvilli_lo
  model: bending_regime_alpha
  inputs: {k_par: k_par_plastin_upper, L_B: L_B_microvilli_lo_added, delta: delta_typical_high_abp, k_a: k_a_actin}
  outputs: {alpha: alpha_microvilli_lo}
  note: "Checks physiological brush border microvilli (L_B = 2 um, plastin upper bound, delta = 100 nm) are decoupled (alpha << 1, p. 8)."

- id: run_alpha_microvilli_hi
  model: bending_regime_alpha
  inputs: {k_par: k_par_plastin_upper, L_B: L_B_microvilli_hi_added, delta: delta_typical_high_abp, k_a: k_a_actin}
  outputs: {alpha: alpha_microvilli_hi}
  note: "Checks brush border microvilli at upper length L_B = 5 um (plastin upper bound, delta = 100 nm) remain deeply decoupled (alpha << 1, p. 8)."

- id: run_alpha_peg4_n30
  model: bending_regime_alpha
  inputs: {k_par: k_par_peg_lower, L_B: L_B_peg4_n30, delta: delta_typical_high_abp, k_a: k_a_actin}
  outputs: {alpha: alpha_peg4_n30}
  note: "Checks PEG 4% lower bound at n = 30 yields alpha > n (fully coupled regime, p. 7)."

- id: run_alpha_fascin_05_n10
  model: bending_regime_alpha
  inputs: {k_par: k_par_fascin, L_B: L_B_fascin_05_n10, delta: delta_fascin_05, k_a: k_a_actin}
  outputs: {alpha: alpha_fascin_05_n10}

- id: run_alpha_fascin_002_n10
