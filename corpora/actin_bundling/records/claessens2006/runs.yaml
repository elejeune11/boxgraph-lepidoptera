# --- 1. Single F-actin persistence length and elastic geometry ---

- id: run_kappa_a_from_lp
  model: bending_stiffness_persistence
  inputs: {l_p: l_p_actin_p5, T: T_room_p5}
  outputs: {kappa_a: kappa_a_from_lp_comp}
  note: "Reproduces single F-actin bending stiffness 7 x 10^-26 N m^2 from l_p = 17 um at T = 298 K (p. 5)."

- id: run_actin_geometry_square
  model: filament_geometry_square
  inputs: {k_a: k_a_actin, kappa_a: kappa_a_ref35}
  outputs: {d: d_actin_square_comp, E: E_actin_square_comp}
  note: "Inverts k_a = 4.4 x 10^-8 N and kappa_a = 7.3 x 10^-26 N m^2 assuming square cross-section (A = d^2, I = d^4/12)."

- id: run_actin_geometry_circular
  model: filament_geometry_circular
  inputs: {k_a: k_a_actin, kappa_a: kappa_a_ref35}
  outputs: {d: d_actin_circular_comp, E: E_actin_circular_comp}
  note: "Inverts k_a and kappa_a assuming circular cylinder (A = pi*d^2/4, I = pi*d^4/64) to test consistency with printed d = 4.5 nm, E = 2 GPa."

- id: run_abp_length_ratio
  model: abp_length_ratio
  inputs: {t_aact: t_aact, t_fascin: t_fascin_plastin}
  outputs: {ratio: t_ratio_aact_fascin_comp}
  note: "Checks printed 'roughly three times' (p. 7) from printed lengths 35 nm and 10 nm (pp. 12, 16)."

