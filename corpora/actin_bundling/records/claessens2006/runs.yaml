# --- 8. Droplet geometry, WLC ring stiffness, and SI equilibration relaxation time ---

- id: run_droplet_vol_si1a
  model: droplet_volume_sphere
  inputs: {R_d: R_d_si1a_added}
  outputs: {V_d: V_d_si1a_only}

- id: run_droplet_si1a
  model: droplet_filament_count
  inputs: {c_a: c_a_added, R_d: R_d_si1a_added, R_r: R_ring_si1a, a_mon: a_mon_added}
  outputs: {V_d: V_d_si1a, L_tot: L_tot_si1a, L_B: L_B_si1a, n: n_si1a_est}

- id: run_droplet_si1b
  model: droplet_filament_count
  inputs: {c_a: c_a_added, R_d: R_d_si1b_added, R_r: R_ring_si1b, a_mon: a_mon_added}
  outputs: {V_d: V_d_si1b, L_tot: L_tot_si1b, L_B: L_B_si1b, n: n_si1b_est}

- id: run_ring_stiffness_si1a
  model: wlc_ring_bending_stiffness
  inputs: {c_ring: prefactor_wlc_ring, R_c: R_ring_si1a, D_B: D_sat_si1a_eye, T: T_room_p5}
  outputs: {kappa_B: kappa_B_ring_si1a}

- id: run_ring_stiffness_si1b
  model: wlc_ring_bending_stiffness
  inputs: {c_ring: prefactor_wlc_ring, R_c: R_ring_si1b, D_B: D_sat_si1b_eye, T: T_room_p5}
  outputs: {kappa_B: kappa_B_ring_si1b}

