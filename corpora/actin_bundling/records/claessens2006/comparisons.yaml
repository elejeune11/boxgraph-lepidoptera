# --- 1. Single F-actin persistence length and elastic geometry reproductions ---

- id: cmp_kappa_a_from_lp
  purpose: reproduction
  computed: kappa_a_from_lp_comp
  printed: kappa_a_single_p5
  note: "Checks kappa_a = l_p * k_B * T = 6.994 x 10^-26 N m^2 against printed 7 x 10^-26 N m^2 (p. 5)."

- id: cmp_kappa_a_ref23_vs_ref35
  purpose: consistency
  computed: kappa_a_ref35
  printed: kappa_a_single_p5
  conditions_ok: "p. 12 uses Gittes et al. (1993, ref-35) without stating T, whereas p. 5 cites Le Goff et al. (2002, ref-23) at 298 K; both describe room-temperature single F-actin flexural rigidity."
  note: "Consistency between the two printed single-filament bending stiffness values (7 x 10^-26 vs 7.3 x 10^-26 N m^2)."

- id: cmp_d_actin_square
  purpose: reproduction
  computed: d_actin_square_comp
  printed: d_actin_p12
  note: "Square cross-section (I/A = d^2/12) gives d = 4.46 nm, reproducing printed d = 4.5 nm (p. 12)."

- id: cmp_E_actin_square
  purpose: reproduction
  computed: E_actin_square_comp
  printed: E_actin_p12
  note: "Square cross-section gives E = 2.21 GPa, reproducing printed E = 2 GPa (p. 12)."

- id: cmp_d_actin_circular
  purpose: reproduction
  computed: d_actin_circular_comp
  printed: d_actin_p12
  note: "Circular rod cross-section (I/A = d^2/16) gives d = 5.15 nm, failing to reproduce printed d = 4.5 nm (p. 12)."

- id: cmp_E_actin_circular
  purpose: reproduction
  computed: E_actin_circular_comp
  printed: E_actin_p12
  note: "Circular rod cross-section gives E = 2.11 GPa, consistent with printed E = 2 GPa (p. 12)."

- id: cmp_abp_length_ratio
  purpose: reproduction
  computed: t_ratio_aact_fascin_comp
  printed: t_ratio_aact_fascin
  note: "35 nm / 10 nm = 3.5 vs printed 'roughly three times' (p. 7; no verdict due to qualitative wording)."

