# Quantities declared for bashirzadeh2021_code (each physical quantity has a unique meaning and pint dimension)

- id: simulation_box_length
  name: simulation box linear extent
  dimension: "[length]"
  description: Horizontal or vertical span (xrange, yrange) of the 2D AFINES periodic/Lees-Edwards box.

- id: confinement_radius
  name: circular confinement radius
  dimension: "[length]"
  description: Radius r_c of the circular harmonic confining wall (ext_circle) mimicking the GUV boundary.

- id: confinement_stiffness
  name: circular confinement spring constant
  dimension: "[force] / [length]"
  description: Harmonic spring stiffness k_c of the circular confining wall (circle_spring_constant) in pN/um.

- id: radial_position
  name: radial distance from origin
  dimension: "[length]"
  description: Euclidean distance r = sqrt(x^2 + y^2) of a bead or crosslinker head from the origin.

- id: filament_link_length
  name: discretized polymer link rest length
  dimension: "[length]"
  description: Equilibrium spring length l_0 between consecutive beads along an actin filament (link_length).

- id: bead_radius
  name: filament bead hydrodynamic radius
  dimension: "[length]"
  description: Hydrodynamic radius rad = actin_length assigned to each actin bead for Stokes drag 6*pi*eta*rad.

- id: polymer_bending_modulus
  name: polymer bending modulus
  dimension: "[force] * [length] ** 2"
  description: Continuum flexural rigidity kappa_b (polymer_bending_modulus) of a coarse-grained actin filament in pN*um^2.

- id: link_bending_stiffness
  name: discrete hinge bending stiffness
  dimension: "[energy]"
  description: Discrete 3-bead harmonic hinge bending stiffness k_b = polymer_bending_modulus / link_length in pN*um.

- id: link_stretching_stiffness
  name: filament link stretching stiffness
  dimension: "[force] / [length]"
  description: Hookean stretching spring constant k_s (link_stretching_stiffness) connecting adjacent actin beads in pN/um.

- id: excluded_volume_stiffness
  name: filament excluded volume stiffness
  dimension: "[force] / [length]"
  description: Repulsive spring-spring excluded-volume stiffness parameter kexv in pN/um (0 disables excluded volume).

- id: excluded_volume_cutoff
  name: filament excluded volume cutoff distance
  dimension: "[length]"
  description: Cutoff distance rmax for filament-filament excluded-volume repulsion in um.

- id: polymer_count
  name: number of simulated polymers
  dimension: dimensionless
  description: Total number of coarse-grained actin filaments (npolymer / nfil) in the simulation.

- id: filament_areal_density
  name: filament 2D areal density
  dimension: "1 / [length] ** 2"
  description: Number of actin filaments per unit circular vesicle area (fil_dens) used in the Python initial-condition script.

- id: beads_per_polymer
  name: beads per simulated polymer
  dimension: dimensionless
  description: Number of discrete beads per actin filament (nmonomer / nbeads).

- id: filament_contour_length
  name: filament contour length
  dimension: "[length]"
  description: Total rest contour length L_f = (nmonomer - 1) * link_length of one simulated actin filament.

- id: crosslinker_length
  name: crosslinker rest length
  dimension: "[length]"
  description: Equilibrium spring length mld (a_motor_length for fascin, p_motor_length for alpha-actinin) in um.

- id: crosslinker_end_to_end_distance
  name: crosslinker end-to-end distance
  dimension: "[length]"
  description: Instantaneous head-to-head separation len of a crosslinker spring in um.

- id: crosslinker_size_ratio
  name: alpha-actinin to fascin rest length ratio
  dimension: dimensionless
  description: Ratio of alpha-actinin rest length to fascin rest length.

- id: crosslinker_stiffness
  name: crosslinker spring stiffness
  dimension: "[force] / [length]"
  description: Hookean spring stiffness mk (a_motor_stiffness for fascin, p_motor_stiffness for alpha-actinin) in pN/um.

- id: crosslinker_bending_modulus
  name: crosslinker-filament bending parameter
  dimension: "[force]"
  description: Crosslinker-filament angular bending parameter (a_m_bend, p_m_bend) documented in pN (divided by mld in motor_ensemble::set_bending).

- id: crosslinker_on_rate
  name: crosslinker binding on-rate
  dimension: "1 / [time]"
  description: First-order kinetic binding attempt rate ron (a_m_kon for fascin, p_m_kon for alpha-actinin) in s^-1.

- id: crosslinker_off_rate
  name: crosslinker unbinding off-rate
  dimension: "1 / [time]"
  description: First-order kinetic unbinding attempt rate roff / rend (a_m_koff, a_m_kend, p_m_koff, p_m_kend) in s^-1.

- id: crosslinker_affinity_ratio
  name: crosslinker kinetic binding rate ratio
  dimension: dimensionless
  description: Ratio k_on / k_off governing equilibrium crosslinker binding affinity in AFINES.

- id: crosslinker_areal_density
  name: crosslinker 2D areal density
  dimension: "1 / [length] ** 2"
  description: Number of crosslinkers per unit area (global vesicle density or local regional density) in um^-2.

- id: crosslinker_count
  name: number of crosslinkers
  dimension: dimensionless
  description: Total count of crosslinker molecules of one species (nfascin or nalpha).

- id: motor_velocity
  name: motor walking velocity
  dimension: "[length] / [time]"
  description: Prescribed unloaded walking velocity along filaments (a_motor_v, p_motor_v) in um/s (0 for passive crosslinkers).

- id: motor_stall_force
  name: motor stall force
  dimension: "[force]"
  description: Load force beyond which bound motor heads stop walking (a_m_stall, p_m_stall) in pN.

- id: alignment_penalty
  name: crosslinker angular alignment penalty constant
  dimension: "[energy]"
  description: Angular alignment penalty constant kalign (a_m_kalign, p_m_kalign) in pN*um.

- id: alignment_mode
  name: crosslinker alignment mode flag
  dimension: dimensionless
  description: Discrete alignment selector par_flag (1 = parallel, 0 = nonpolar nematic, -1 = antiparallel).

- id: filament_pair_angle
  name: angle between two filament segments
  dimension: dimensionless
  description: Angle theta (rad) between two filament link vectors (crosslinked pair or adjacent hinge links).

- id: binding_cutoff_distance
  name: crosslinker binding capture cutoff distance
  dimension: "[length]"
  description: Maximum perpendicular head-to-spring distance rcut (a_m_cut, p_m_cut) permitting crosslinker attachment in um.

- id: steric_occlusion_distance
  name: crosslinker steric occlusion exclusion distance
  dimension: "[length]"
  description: Minimum 1D contour separation occ (o_c) along a filament between bound crosslinker heads in um.

- id: contour_separation
  name: 1D contour separation along a filament
  dimension: "[length]"
  description: Distance along a filament contour between a candidate binding point and the nearest already-bound head in um.

- id: time_step
  name: simulation integration time step
  dimension: "[time]"
  description: Overdamped Langevin and KMC integration step size dt in s.

- id: simulation_time
  name: simulation total duration
  dimension: "[time]"
  description: Final simulated time tfinal in s.

- id: step_count
  name: number of simulation steps
  dimension: dimensionless
  description: Count of integration time steps (total tfinal/dt or steps between saved frames n_bw_print).

- id: frame_count
  name: number of output frame intervals
  dimension: dimensionless
  description: Configured number of output intervals nframes dividing tfinal.

- id: frame_interval
  name: simulated time between output frames
  dimension: "[time]"
  description: Elapsed simulation time tfinal / nframes between consecutive written trajectory frames in s.

- id: grid_factor
  name: neighbor-list quadrant grid factor
  dimension: "1 / [length]"
  description: Number of spatial quadrant cells per micron along each axis (xgrid = round(grid_factor * xrange)).

- id: quadrant_count_per_axis
  name: neighbor-list quadrant count per axis
  dimension: dimensionless
  description: Integer number of neighbor-list quadrant divisions (xgrid, ygrid) along one box axis.

- id: dynamic_viscosity
  name: solvent dynamic viscosity
  dimension: "[mass] / [length] / [time]"
  description: Solvent dynamic viscosity eta in AFINES units mg/(um*s) (= Pa*s = pN*s/um^2).

- id: thermal_energy
  name: simulation thermal energy
  dimension: "[energy]"
  description: Thermal energy scale k_B T (temperature option) in pN*um.

- id: drag_coefficient
  name: Stokes hydrodynamic drag coefficient
  dimension: "[force] * [time] / [length]"
  description: Viscous friction coefficient gamma = 6*pi*eta*r for a filament bead or unbound crosslinker head in pN*s/um.

- id: diffusion_coefficient
  name: translational diffusion coefficient
  dimension: "[length] ** 2 / [time]"
  description: Free translational diffusivity D = k_B T / gamma (theoretical Einstein or Leimkuhler-Matthews simulated) in um^2/s.

- id: brownian_velocity_prefactor
  name: Leimkuhler-Matthews Brownian velocity prefactor
  dimension: "[length] / [time]"
  description: Thermal velocity noise prefactor sqrt(k_B T / (2*gamma*dt)) in um/s (filament.cpp:67, motor.cpp:36).

- id: potential_energy
  name: mechanical or interaction potential energy
  dimension: "[energy]"
  description: Potential energy term (stretching, bending, confinement, alignment, or KMC dE) in pN*um.

- id: binding_free_energy
  name: effective crosslinker binding free energy
  dimension: "[energy]"
  description: Effective binding free energy -k_B T * ln(k_on / k_off) implied by AFINES kinetic rates in pN*um.

- id: force
  name: mechanical force magnitude or radial component
  dimension: "[force]"
  description: Force exerted by a spring, confinement wall, or angular interaction in pN.

- id: torque
  name: angular restoring torque
  dimension: "[energy]"
  description: Magnitude of angular restoring torque |dU/dtheta| exerted on crosslinked filament segments in pN*um.

- id: probability
  name: transition or acceptance probability
  dimension: dimensionless
  description: Dimensionless KMC Metropolis acceptance factor or per-step attachment/detachment probability.

- id: boolean_flag
  name: binary indicator flag
  dimension: dimensionless
  description: Binary indicator (0 or 1) encoding whether a constraint or condition is active/satisfied.

- id: bundle_persistence_length
  name: single-filament persistence length
  dimension: "[length]"
  description: Thermal persistence length L_p = kappa_b / (k_B T) of a single simulated actin filament in um.

- id: replicate_count
  name: number of independent replicates
  dimension: dimensionless
  description: Number of independent simulation trajectories (nrep / SLURM array size) per condition.

- id: condition_index
  name: condition sweep index
  dimension: dimensionless
  description: 1-based condition index hh in the aster_initial_condition_grid_conda_freeze.py parameter grid (1..80).

- id: kinetics_scale_factor
  name: fascin kinetics scaling divisor
  dimension: dimensionless
  description: Loop divisor scl in {1, 2, 3, 4} dividing both fascin k_on and k_off while preserving k_on/k_off = 40.

- id: displacement_half_range
  name: uniform initial translation half-width
  dimension: "[length]"
  description: Half-width r_rand of the uniform interval [-r_rand, +r_rand] used for initial filament xkick, ykick translation.

- id: displacement_stddev
  name: standard deviation of initial filament center translation
  dimension: "[length]"
  description: Standard deviation of the x or y translation applied to initial filament centers in um.

- id: mean_hinge_bend_angle
  name: mean initial filament midpoint hinge bend angle
  dimension: dimensionless
  description: Mean angle (rad) between the two filament halves at the central bead (bead 17) in the initial condition.

- id: fraction_beads_outside
  name: fraction of initial filament beads beyond confinement radius
  dimension: dimensionless
  description: Fraction of initial actin filament beads placed at r >= r_c (experiencing non-zero ext_circle force at t=0).

- id: fraction
  name: dimensionless population fraction
  dimension: dimensionless
  description: Fraction of filaments, pairs, or crosslinkers meeting a geometric criterion (e.g. bend > pi/4, shared arm, inside r_c x r_c box).

- id: position_variance
  name: spatial coordinate variance or second moment
  dimension: "[length] ** 2"
  description: Mean squared coordinate <x^2> or <y^2> of crosslinker initial positions or harmonically confined Brownian particles in um^2.

- id: anisotropy_ratio
  name: x-to-y spatial second-moment anisotropy ratio
  dimension: dimensionless
  description: Ratio <x^2> / <y^2> quantifying directional bias in the initial crosslinker sampler (1.0 for isotropic disk/box, 1.5 for code).

- id: small_angle_clamp
  name: sine clamp threshold for small bend angles
  dimension: dimensionless
  description: Lower bound maxSmallAngle = 0.001 clamping sin(theta) in bend_harmonic() force division (globals.h:61, potentials.cpp:103).
