# Cross-record cited-value links for bashirzadeh2021_code (dinner-group/AFINES@sorting_guv, 2021).
#
# Audit scope across all 3 non-bashirzadeh2021 partners:
# 1. bashirzadeh2021_source_data: 0 links. All 42 paper-linked simulation parameters in
#    bashirzadeh2021_code/data.yaml already declare inline `from_source: bashirzadeh2021` +
#    `from_datum`; bashirzadeh2021_source_data contains only experimental microscopy/Excel/MATLAB
#    data (no AFINES parameters or simulation outputs).
# 2. freedman2019: 0 direct links needed in cited.yaml; shared upstream AFINES engine defaults
#    are linked directly to the upstream C++ codebase `freedman2019_code` below (which itself
#    links to `freedman2019`).
# 3. freedman2019_code (Simfreed/AFINES@growing_spacer_exv, 2019): 6 verbatim inherited upstream
#    AFINES C++ defaults and hidden engine parameters linked below (mirroring the cross-fork
#    CytoSim default links in walker2025_code/cited.yaml).
#    Note: Three shared numeric values are intentionally NOT linked because of unit-tag
#    divergences exposing AFINES C++ unit-documentation bugs (see q_afines_branch_evolution_and_bugs):
#    - cpp_default_a_m_bend / cpp_default_p_m_bend (0.04 pN, matching CLI help string) vs
#      freedman2019_code/cpp_s1_bend_default (0.04 pN*um^2, matching kb = modulus/mld).
#    - cfg_kexv (0 pN/um) vs freedman2019_code/cfg_kexv_zero (0 pN*um, matching pe_exv energy).

- datum: cpp_default_a_m_cut
  from_source: freedman2019_code
  from_datum: cpp_s1_cut_default
  evidence: "Verbatim inherited AFINES C++ default crosslinker binding capture radius 0.063 um in prog/network.cpp:187 (matching freedman2019_code prog/bundles.cpp:120, also embedded verbatim in bashirzadeh2021_code/prog/bundles.cpp:120)."

- datum: cpp_default_p_m_cut
