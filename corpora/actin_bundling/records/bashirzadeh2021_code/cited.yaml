  from_datum: cpp_s2_cut_default
  evidence: "Verbatim inherited AFINES C++ default passive-crosslinker binding capture radius 0.063 um in prog/network.cpp:250 (matching freedman2019_code prog/bundles.cpp:133)."

- datum: cpp_max_small_angle
  from_source: freedman2019_code
  from_datum: cpp_max_small_angle
  evidence: "Verbatim inherited AFINES C++ sine-clamp constant `const double maxSmallAngle = 0.001;` in include/globals.h:61 (matching freedman2019_code include/globals.h:58)."

- datum: cpp_default_temperature
