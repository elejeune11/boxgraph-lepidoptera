# Probe inputs and analytical paper benchmarks for bashirzadeh2021_code (each with meaningful alternatives)

- id: probe_r_outside
  quantity: radial_position
  unit: um
  printed: "16"
  basis: "Probe bead radial distance 1 um outside circular confinement wall r_c = 15 um to test ext_circle::compute() (src/ext.cpp:11-22)."
  alternatives: ["15", "15.5", "17"]
  stands_for: "r = |pos| in ext_circle::compute()"

- id: probe_r_inside
  quantity: radial_position
  unit: um
  printed: "10"
  basis: "Probe bead radial distance inside circular confinement wall r_c = 15 um where ext_circle::compute() returns zero energy and force."
  alternatives: ["0", "14.5", "14.99"]
  stands_for: "r = |pos| < r_c in ext_circle::compute()"

- id: probe_theta_antiparallel
  quantity: filament_pair_angle
  unit: rad
  printed: "3.14159265"
  basis: "Antiparallel filament angle theta = pi rad where fascin alignment penalty kalign * (1 - cos(theta)) reaches its maximum 2 * kalign = 0.666 pN*um."
  alternatives: ["0", "0.78539816", "1.57079633"]
  stands_for: "theta between filament link vectors in motor::alignment_penalty() and motor::update_alignment()"

- id: probe_theta_pi4
  quantity: filament_pair_angle
  unit: rad
  printed: "0.78539816"
  basis: "45-degree filament crossing angle theta = pi/4 rad probing fascin alignment penalty and Metropolis binding suppression."
  alternatives: ["0.26179939", "1.57079633", "3.14159265"]
  stands_for: "theta in motor::alignment_penalty()"

- id: probe_theta_parallel
  quantity: filament_pair_angle
  unit: rad
  printed: "0"
  basis: "Parallel filament angle theta = 0 rad where fascin alignment penalty kalign * (1 - cos(0)) = 0 in KMC binding probes."
  alternatives: ["0.26179939", "0.78539816", "3.14159265"]
  stands_for: "theta = 0 rad in motor::metropolis_prob()"

- id: probe_theta_hinge_code
  quantity: filament_pair_angle
  unit: rad
  printed: "1.57079633"
  basis: "Mean initial midpoint hinge bend angle pi/2 rad produced by bent=True in aster_initial_condition_grid_conda_freeze.py:98-117, contrasting with pi/8 = 0.3927 rad from paper's stated U[-pi/4, pi/4]."
  alternatives: ["0.39269908", "0.78539816", "3.14159265"]
  stands_for: "theta in bend_harmonic() (src/potentials.cpp:91-117)"

- id: probe_link_stretched
  quantity: filament_link_length
  unit: um
  printed: "1.05"
  basis: "5%-stretched filament spring length (1.05 um vs l_0 = 1.0 um) probing spring stretching energy at cfg link_stretching_stiffness = 10 vs C++ default 1 pN/um."
  alternatives: ["1.0", "1.1", "0.95"]
  stands_for: "llen in spring::update_force() and spring::get_stretching_energy() (src/spring.cpp:54-58,185-188)"

- id: probe_xl_len_old
  quantity: crosslinker_end_to_end_distance
  unit: um
  printed: "0.1"
  basis: "Relaxed fascin crosslinker head-to-head distance equal to rest length mld = 0.1 um prior to binding attempt."
  alternatives: ["0.05", "0.15", "0.5"]
  stands_for: "initial head separation in motor::metropolis_prob() (src/motor.cpp:537)"

- id: probe_xl_len_new
  quantity: crosslinker_end_to_end_distance
  unit: um
  printed: "0.15"
  basis: "Candidate post-binding fascin head separation 0.15 um (0.05 um stretch, within binding cutoff rcut = 0.063 um)."
  alternatives: ["0.1", "0.163", "0.2"]
  stands_for: "candidate head separation in motor::metropolis_prob() (src/motor.cpp:538)"

- id: probe_occ_clear_dist
  quantity: contour_separation
  unit: um
  printed: "0.25"
  basis: "Candidate contour separation 0.25 um exceeding steric occlusion threshold occ = 0.15 um (binding allowed)."
  alternatives: ["0.15", "0.5", "1.0"]
  stands_for: "closest_attached_distance() result in src/motor.cpp:684"

- id: probe_occ_blocked_dist
  quantity: contour_separation
  unit: um
  printed: "0.10"
  basis: "Candidate contour separation 0.10 um below steric occlusion threshold occ = 0.15 um (binding rejected)."
  alternatives: ["0.0", "0.05", "0.14"]
  stands_for: "closest_attached_distance() result in src/motor.cpp:684"

- id: probe_flag_false
  quantity: boolean_flag
  unit: dimensionless
  printed: "0"
  basis: "Boolean false (0) for distinct filaments/springs in motor::allowed_bind() (src/motor.cpp:696-700)."
  alternatives: ["1"]
  stands_for: "same_filament or same_spring flag in motor::allowed_bind()"

- id: probe_flag_true
  quantity: boolean_flag
  unit: dimensionless
  printed: "1"
  basis: "Boolean true (1) testing whether motor::allowed_bind() permits binding both heads to different springs on the same filament when kb == 0."
  alternatives: ["0"]
  stands_for: "same_filament flag in motor::allowed_bind()"

- id: probe_hh_combined
  quantity: condition_index
  unit: dimensionless
  printed: "2"
  basis: "Condition index hh = 2 (scl = 1, scale = 0, alpha_conc = 5 um^-2, fasc_conc = 5 um^-2) matching Bashirzadeh et al. combined baseline in aster_initial_condition_grid_conda_freeze.py:27-31."
  alternatives: ["1", "3", "4"]
  stands_for: "condition index hh in aster_initial_condition_grid_conda_freeze.py"

- id: probe_hh_fascin_only
  quantity: condition_index
  unit: dimensionless
  printed: "1"
  basis: "Condition index hh = 1 (scl = 1, scale = 0, alpha_conc = 0 um^-2, fasc_conc = 5 um^-2) matching Bashirzadeh et al. fascin-only baseline."
  alternatives: ["2", "5", "9"]
  stands_for: "condition index hh in aster_initial_condition_grid_conda_freeze.py"

- id: probe_scl_slow
  quantity: kinetics_scale_factor
  unit: dimensionless
  printed: "4"
  basis: "Maximum kinetics divisor scl = 4 in aster_initial_condition_grid_conda_freeze.py:27 (yielding fascin k_on = 5 s^-1, k_off = 0.125 s^-1, ratio = 40)."
  alternatives: ["1", "2", "3"]
  stands_for: "scl in aster_initial_condition_grid_conda_freeze.py:27,68-69"

- id: paper_isotropic_anisotropy_benchmark
  quantity: anisotropy_ratio
  unit: dimensionless
  printed: "1.000"
  basis: "Exact theoretical ratio <x^2>/<y^2> = 1.000 for any isotropic uniform distribution on a centered square box or circular disk, contrasting with the code's 1.5 ratio from x ~ U[-r,r], y|x ~ U[-sqrt(r^2-x^2), sqrt(r^2-x^2)]."
  alternatives: ["0.950", "1.050"]
  stands_for: "expected <x^2>/<y^2> implied by bashirzadeh2021 Methods p. 9 uniform placement"

- id: paper_rc_box_containment_benchmark
  quantity: fraction
  unit: dimensionless
  printed: "1.000"
  basis: "Exact fraction 1.000 of initial crosslinkers inside [-r_c/2, r_c/2]^2 implied by bashirzadeh2021 Methods p. 9 ('drawn with uniform probability from the box centered on the origin with dimensions r_c x r_c')."
  alternatives: ["0.950", "0.990"]
  stands_for: "expected fraction inside r_c x r_c box implied by bashirzadeh2021 Methods p. 9"

- id: paper_mean_hinge_angle_benchmark
  quantity: mean_hinge_bend_angle
  unit: rad
  printed: "0.3927"
  basis: "Exact mean bend angle E[|delta|] = pi/8 = 0.3927 rad implied by bashirzadeh2021 Methods p. 9 ('uniformly drawn from between -pi/4 and pi/4'), contrasting with pi/2 = 1.5708 rad in code."
  alternatives: ["0.3500", "0.4500"]
  stands_for: "expected mean initial filament hinge bend angle implied by bashirzadeh2021 Methods p. 9"

- id: paper_bend_gt_pi4_benchmark
  quantity: fraction
  unit: dimensionless
  printed: "0.000"
  basis: "Exact fraction 0.000 of initial filaments with hinge bend angle exceeding pi/4 implied by bashirzadeh2021 Methods p. 9 ('uniformly drawn from between -pi/4 and pi/4'), contrasting with 0.75 in code."
  alternatives: ["0.010", "0.050"]
  stands_for: "expected fraction of filaments with hinge bend > pi/4 implied by bashirzadeh2021 Methods p. 9"

- id: paper_shared_arm_benchmark
  quantity: fraction
  unit: dimensionless
  printed: "0.000"
  basis: "Exact fraction 0.000 of consecutive filament pairs sharing an identical arm orientation for independent filaments as described in bashirzadeh2021 Methods p. 9, contrasting with 1.0 (49/49 pairs) in code."
  alternatives: ["0.010", "0.020"]
  stands_for: "expected fraction of consecutive filaments sharing one half-filament angle"
