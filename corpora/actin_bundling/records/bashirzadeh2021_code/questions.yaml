  text: >
    Line-by-line forensic diff of dinner-group/AFINES@sorting_guv (bashirzadeh2021_code, commit
    a34e602, 2021) against Simfreed/AFINES@growing_spacer_exv (freedman2019_code, commit 0c6c349,
    2019) exposes both direct lineage and divergent bugs across the two AFINES branches:
    (1) Verbatim legacy artifacts: bashirzadeh2021_code/xlink_sorting_paper/ is byte-for-byte
