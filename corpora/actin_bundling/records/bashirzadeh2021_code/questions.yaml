- id: q_freedman2019_vs_sorting_guv_mechanisms_and_units
  kind: unexplained_difference
  about:
    - afines_config_derived_quantities
    - cpp_motor_alignment_potential
    - cpp_kmc_metropolis_occlusion
    - cfg_temperature
    - cfg_viscosity
    - freedman2019/crosslinker_potential_si_eq4
    - freedman2019/stokes_mobility_si_eq6
  text: >
    Comparing bashirzadeh2021_code (sorting_guv) against Freedman et al., PNAS 2019 (freedman2019)
    reveals both shared hidden AFINES conventions and a complete mechanistic pivot:
    (1) Shared undocumented defaults across both papers: hardcoded temperature = 0.004 pN*um
    (equivalent to T = 289.72 K, 3.43% below freedman2019 Table S1's 300 K = 0.004142 pN*um,
    giving exact L_p = 17.0 um in both papers), hidden actin_length = 0.5 um bead Stokes radius,
    hidden binding cutoff cut = 0.063 um, crosslinker drag gamma = 6*pi*vis*mld, and absent
    explicit U_xl^bind potential in C++ (written in both freedman2019 SI Eq. 4 and bashirzadeh2021
    Eq. 2, yet implemented purely via kinetic rates k_on/k_off).
    (2) Factor-of-2 mismatch in freedman2019 SI Eq. 4 vs BOTH AFINES C++ branches: SI Eq. 4 writes
    U_xl^bend = kappa_xl^B * sum (alpha_i - pi/2)^2 without a 1/2 prefactor, whereas both
    freedman2019_code/src/spacer.cpp:373 (`kb*dth*dth/2`) and bashirzadeh2021_code/src/potentials.cpp:108
    (`0.5 * kb * theta * theta`) include 1/2 (combining with kb = modulus/mld to give 2.5x the
    printed stiffness coefficient at mld = 0.2 um).
    (3) Sorting-mechanism & parameter pivot: freedman2019 sorts crosslinkers on growing 2-filament
    bundles (kgrow = 1 s^-1, kexv = 0.08 pN*um in Fig. 2D, perpendicular bending s1_bend = 0.005,
    s2_bend = 0.06, length ratio 0.3/0.2 = 1.5, viscosity = 0.001 Pa*s, k_xl = 10 pN/um,
    rho = 0.25 um^-2, tfinal = 2000 s, no alignment penalty, no steric occlusion, periodic box).
    bashirzadeh2021_code disables growth (kgrow = 0), excluded volume (kexv = 0), and perpendicular
    bending (a_m_bend = p_m_bend = 0), instead driving sorting in a circular GUV (r_c = 15 um) via
    parallel filament alignment (kalign = 0.333 pN*um for fascin), 1D contour steric occlusion
    (occ = 0.15 um), 5x rest-length ratio (0.5/0.1 um), 100x-weaker alpha-actinin stiffness
    (0.1 pN/um vs 1 pN/um fascin), 100x faster fascin on-rate (20 vs 0.2 s^-1), 10x higher
    viscosity (0.01 Pa*s), 20x higher density (5 um^-2), and 20x shorter runtime (100 s).
  citation:
    file: src/potentials.cpp
    lines: "108"
    quote: "result.energy = 0.5 * kb * theta * theta;"

