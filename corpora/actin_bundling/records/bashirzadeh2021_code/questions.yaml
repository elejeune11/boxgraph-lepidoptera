  text: >
    Multiple software-packaging bugs and dormant C++ bugs exist in the released snapshot:
    (1) aster_initial_condition_grid_conda_freeze.py:241 invokes binary 'afines-ring', whereas
    CMakeLists.txt:27, makefile:49, and conda.recipe/build.sh:5 build 'network' / 'afines' (though
    prog/network.cpp does implement --a_m_ring_flag, --p_m_ring_flag, --occ, and --freeze_filaments);
    (2) the script hardcodes UChicago cluster paths /project2/gardel/steven/AFINES/... (lines 22, 211),
    loops over an unused variable 'scale' (line 28) generating 5 identical blocks of 16 conditions,
    omits fasc_conc = 0 (cannot generate alpha-actinin-only runs without manual editing), fails to
    scale a_m_kend = 0.5 when scl > 1 (lines 247-248), leaves dead overrides p_m_stf = 0.5 and
