  text: >
    bashirzadeh2021 Methods p. 9 states "Default values^42 were used for all parameters not listed",
    yet the released config and CLI script silently override several critical AFINES C++ defaults
    (prog/network.cpp) without reporting them in the paper: (1) steric occlusion distance o_c (named
    on p. 9 without a value) is set to --occ 0.15 um in aster_initial_condition_grid_conda_freeze.py:65,259,
    overriding C++ default occ = 0 (disabled); (2) filament link stretching stiffness is set to
    link_stretching_stiffness = 10 pN/um in sorting_kinetics.cfg:8, 10x stiffer than C++ default 1 pN/um;
    (3) solvent viscosity is set to viscosity = 0.01 mg/(um*s) (= 0.01 Pa*s = 10 cP) in
    sorting_kinetics.cfg:38, 10x higher than C++ default water viscosity 0.001 mg/(um*s);
    (4) crosslinker-filament bending stiffnesses are set to a_m_bend = 0 and p_m_bend = 0
    (sorting_kinetics.cfg:23,33), disabling C++ defaults of 0.04 pN; (5) filament excluded volume is
    explicitly disabled via kexv = 0 (default 1.0 pN/um); (6) thermal energy is temperature = 0.004 pN*um
    (= 4.0 pN*nm, ~290 K), yielding single-filament L_p = 0.068/0.004 = 17.0 um; (7) hidden C++ default
    binding capture cutoffs a_m_cut = p_m_cut = 0.063 um and bead hydrodynamic radius actin_length = 0.5 um
    (hardcoded in actin_*.txt) govern binding and Stokes drag (gamma_bead = 0.09425, gamma_fascin = 0.01885,
    gamma_alpha = 0.09425 pN*s/um, giving 5x faster free diffusion for fascin than alpha-actinin); and
    (8) grid_factor = 2.5 um^-1 (default 2), nframes = 50 (default 1000, 2 s intervals), bnd_cnd = LEES-EDWARDS
    (default PERIODIC), and fil_dens = 0.071 um^-2 are unstated.
  citation:
    file: crosslinker_sorting_in_GUVs/sorting_kinetics.cfg
    lines: "8-38"
    quote: "viscosity=0.01"

- id: q_init_filament_translation_uniform_vs_gaussian
  kind: possible_error
  about:
    - py_r_rand
    - paper_init_displacement_sd
    - cmp_live_actin_center_std_vs_paper
    - cmp_analytical_actin_center_std_vs_paper
  text: >
    bashirzadeh2021 Methods p. 9 states that initial filament centers were displaced in x and y from
    "a Gaussian distribution centered at zero with a standard deviation of 3 um". In the released
    generator (aster_initial_condition_grid_conda_freeze.py:47,111-112), xkick and ykick are instead
    drawn from random.uniform(-3, 3), which is strictly bounded within [-3, 3] um and has standard
    deviation 3/sqrt(3) = 1.7321 um (1.73x smaller; 3x smaller variance). This reduces the initial
    fraction of filament beads outside r_c = 15 um from ~18.5% (Gaussian) to ~15.4% (Uniform) and
    substantially lowers t=0 confinement energy.
  citation:
    file: crosslinker_sorting_in_GUVs/aster_initial_condition_grid_conda_freeze.py
    lines: "111-112"
    quote: "xkick = random.uniform(-r_rand,r_rand)"

- id: q_init_filament_bend_and_shared_arm_bug
  kind: possible_error
  about:
    - init_condition_script_adapter
    - cmp_live_mean_hinge_angle_vs_paper
    - cmp_live_frac_bend_gt_pi4_vs_paper
    - cmp_live_shared_arm_vs_paper
  text: >
    bashirzadeh2021 Methods p. 9 states that each 35-bead filament has one half rotated uniformly in
    [0, 2*pi] and the other half offset by an angle uniformly drawn from [-pi/4, +pi/4] (mean
    midpoint bend angle pi/8 = 0.3927 rad, 0% exceeding pi/4, independent across filaments). In
    aster_initial_condition_grid_conda_freeze.py:24,98-117, bent = True instead draws BOTH ang1 and
    ang2 independently from Uniform(0, 2*pi) (with opposite y-rotation signs -sin(ang1) vs +sin(ang2)),
    producing midpoint bend angles uniformly distributed across [0, pi] (mean pi/2 = 1.5708 rad, 4x
    larger than the paper's pi/8, with 75% of filaments exceeding pi/4 and sharp hairpin bends up to
    180 deg storing up to 0.5*0.068*pi^2 = 0.336 pN*um = 84 kT per hinge!). Furthermore, lines 102-105
    only resample ang2 on even ii and ang1 on odd ii, forcing 100% (49/49) of consecutive initial
    filaments to share an identical arm orientation. Even the inactive bent = False branch (line 108)
    draws from [-pi, +pi] rather than [-pi/4, +pi/4].
  citation:
    file: crosslinker_sorting_in_GUVs/aster_initial_condition_grid_conda_freeze.py
    lines: "98-108"
    quote: "elif ii%2 == 0:"

- id: q_init_crosslinker_circle_nonuniform_sampling_bug
  kind: possible_error
  about:
    - init_condition_script_adapter
    - cpp_init_sampling_bias_analytical
    - cmp_live_fascin_center_density_vs_paper
    - cmp_live_fascin_edge_density_vs_paper
    - cmp_analytical_origin_density_vs_paper
    - cmp_live_fascin_anisotropy_vs_isotropic
    - cmp_live_fascin_rc_box_vs_paper
  text: >
    bashirzadeh2021 Methods p. 9 states that crosslinker initial positions "were drawn with uniform
    probability from the box centered on the origin with dimensions r_c x r_c". The released script
    (aster_initial_condition_grid_conda_freeze.py:43-45,155-196) instead places N = round(5 * pi * 15^2)
    = 3,534 crosslinkers per species inside the circular disk r <= 15 um (only pi/12 = 26.18% fall
    inside [-7.5, 7.5]^2), settling bashirzadeh2021's q_crosslinker_init_box_and_histogram_domain
    count ambiguity. However, the script contains a classic non-uniform disk sampling bug: drawing
    x ~ Uniform(-r, r) and then y | x ~ Uniform(-sqrt(r^2 - x^2), +sqrt(r^2 - x^2)) produces joint
    PDF p(x, y) = 1 / (4 * r * sqrt(r^2 - x^2)), which diverges near x = +/- r. Consequently, initial
    crosslinker density at the center is depleted to (pi/4)*5 = 3.927 um^-2 (-21.5%), lateral caps
    |x| > 12 um are enriched to ~9.7 um^-2 (+94%, ~2.5x denser than center), and the spatial second
    moments are strongly anisotropic (<x^2> = r^2/3 = 75.0 um^2 vs <y^2> = 2*r^2/9 = 50.0 um^2,
    ratio 1.50 instead of 1.0). Additionally, head 1 is placed at (x + dx, y + dy), so ~1% of fascin
    and ~3.2% of alpha-actinin head-1 positions start slightly outside r_c = 15 um.
  citation:
    file: crosslinker_sorting_in_GUVs/aster_initial_condition_grid_conda_freeze.py
    lines: "155-158"
    quote: "ymax = np.sqrt(np.square(r) - np.square(x))"

- id: q_cpp_allowed_bind_same_filament_and_ubind_omission
  kind: unexplained_difference
  about:
    - cpp_kmc_metropolis_occlusion
    - cfg_a_m_bend
    - cfg_p_m_bend
    - py_occc
  text: >
    Three C++ AFINES implementation details in src/motor.cpp diverge from or are omitted by
    bashirzadeh2021 Methods p. 9: (1) Because sorting_kinetics.cfg sets a_m_bend = 0 and p_m_bend = 0
    (kb = 0), motor::allowed_bind() (src/motor.cpp:696-700) executes the else branch
    (fl[0] != fl_idx[0] || fl[1] != fl_idx[1]), allowing a single crosslinker to bind BOTH heads onto
    different springs of the SAME actin filament (whereas kb > 0 forbids same-filament binding);
    (2) Eq. 2 writes an explicit U_xl^bind potential energy term, yet src/motor.cpp:534-616 contains
    no binding energy parameter — binding affinity enters purely through kinetic rates k_on / k_off
    (effective dF_bind = -k_B T ln(k_on/k_off) = -0.01476 pN*um = -3.69 k_B T for fascin,
    -0.005545 pN*um = -1.39 k_B T for alpha-actinin); and (3) bound crosslinker heads outside r_c
    still experience ext_circle confinement forces (src/motor.cpp:352-359) and transmit them via the
    lever rule to filament beads (lines 459-465), adding to the beads' own confinement restoring force.
  citation:
    file: src/motor.cpp
    lines: "696-700"
    quote: "if (kb > 0.0) return fl_idx[0] != fl[0];"

- id: q_script_packaging_bugs_and_cpp_quirks
