    and is misspelled in README.txt:3 as 'aster_initial_condition_conda_freeze.py';
    (3) in C++, src/motor.cpp:619-620 comments falsely claim alignment_penalty is in [0, kalign] when
    kalign*(1 - cos(theta)) actually spans [0, 2*kalign] (max 0.666 pN*um = 166.5 k_B T at theta = pi);
    prog/network.cpp:533,552 double-negates set_antipar(-a_m_kalign) (inactive here); src/exv.cpp:17
    passes l2 twice instead of (l1, l2) (inactive since kexv=0); src/quadrants.cpp:41 loops on i instead
    of j when quad_off_flag is true (inactive); and filament_ensemble.cpp:61-62 & motor_ensemble.cpp:43
    invert null checks in destructors ('if (!ext) delete ext;').
