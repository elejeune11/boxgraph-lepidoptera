    (e) prog/network.cpp:523-524,541-542 passes koff, kend cleanly (unlike bundles.cpp:372,376).
    (3) Bugs REMAINING or NEWLY INTRODUCED in sorting_guv: (a) motor::allowed_bind()
    (src/motor.cpp:696-700) regressed from spacer::allowed_bind() (fl_idx[0] != f_index[pr(hd)])
