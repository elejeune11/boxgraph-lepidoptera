# Open questions, verified code-vs-paper discrepancies, hidden parameters, and bugs in bashirzadeh2021_code

- id: q_full_afines_sim_and_missing_analysis
  kind: unstated_model
  about:
    - afines_guv_sorting_2d_sim
  text: >
    The full 2D many-body AFINES C++ simulation (prog/network.cpp, 1,750 filament beads + 7,068
    crosslinkers over 5 x 10^6 steps across 5 replicates, budgeted at 36 h SLURM runtime per
    condition) cannot be run inside BoxGraph validation; individual C++ physics kernels, KMC/occlusion
    rules, Leimkuhler-Matthews integration, and live Python initial-condition generation are executed
    separately. Crucially, an exhaustive audit of the entire released repository
    (dinner-group/AFINES branch sorting_guv commit a34e602) confirms that NO post-processing scripts
    for the Fig. 4g 2D crosslinker PDF histograms, Fig. 4h Binder cumulant U_4 (Eq. 5), or
    Supplementary Fig. 12 Cytosim verification simulations were released anywhere in the repository
    (crosslinker_sorting_in_GUVs/ contains only README.txt, sorting_kinetics.cfg, and
    aster_initial_condition_grid_conda_freeze.py; python/output.py provides only I/O helpers;
    analysis/ contains older scripts from prior AFINES papers). Consequently, the released code
    cannot settle bashirzadeh2021's q_binder_cumulant_eq5_vs_fig4h_and_prose (whether Fig. 4h used
    spatial sums instead of spatial means, or what spatial histogram window was used) or
    q_cytosim_unstated.
  citation:
    file: crosslinker_sorting_in_GUVs/README.txt
    lines: "1-3"
    quote: "This folder contains the configuration files and initial condition generating scripts"

- id: q_cfg_vs_cli_parameter_mismatches
  kind: unexplained_difference
  about:
    - cfg_circle_radius
    - py_circle_radius
    - cfg_nmonomer
    - py_nbeads
    - cfg_a_motor_density
    - py_fasc_conc
    - cfg_p_motor_density
    - py_alpha_conc_baseline
    - cmp_cfg_standalone_nfil_vs_paper
  text: >
    crosslinker_sorting_in_GUVs/README.txt states that sorting_kinetics.cfg "is the configuration
    file used to run the simulations from the paper", yet standalone sorting_kinetics.cfg disagrees
    with bashirzadeh2021 Methods p. 9 and Supplementary Tables 2-3 on four core parameters:
    circle_radius = 12 um (vs 15 um), nmonomer = 27 (26 um filaments vs 35 beads = 34 um),
    a_motor_density = 1 um^-2 (vs 5 um^-2), and p_motor_density = 1 um^-2 (vs 5 um^-2). These four
    values are only restored to the paper's parameters via CLI flag overrides in
    aster_initial_condition_grid_conda_freeze.py:249-258 (which take precedence over the config file
    because prog/network.cpp:319 calls parse_command_line before parse_config_file on line 333).
    Running AFINES directly with sorting_kinetics.cfg alone simulates a 12-um GUV with 26-um
    filaments and ~452 crosslinkers per species instead of 3,534.
  citation:
    file: crosslinker_sorting_in_GUVs/sorting_kinetics.cfg
    lines: "10-46"
    quote: "circle_radius=12"

