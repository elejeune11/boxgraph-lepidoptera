id: cpp_ext_circle_confinement
name: Line-by-line Python port of C++ ext_circle::compute() radial harmonic confinement (src/ext.cpp:11-22)
role: model
stated:
  file: src/ext.cpp
  lines: "11-22"
  quote: "result.energy = 0.5 * k * dl * dl;"
  where: "src/ext.cpp:11-22 (ext_circle::compute), prog/network.cpp:557-571, src/filament_ensemble.cpp:471-486, src/motor.cpp:352-356,438-444"
equation: "if r^2 < r_c^2: U_confine = 0, F_rad = 0; else: dl = r - r_c, U_confine = 0.5 * k_c * dl^2, F_rad = -k_c * dl"
inputs:
  k_c: {quantity: confinement_stiffness, unit: pN/um}
  r: {quantity: radial_position, unit: um}
  r_c: {quantity: confinement_radius, unit: um}
outputs:
  U_confine: {quantity: potential_energy, unit: pN*um}
  F_rad: {quantity: force, unit: pN}
settings: {}
stochastic: false
