# Cross-record ModelAtlas relations for bashirzadeh2021_code
# (dinner-group/AFINES@sorting_guv, commit a34e602, 2021).
#
# Pairwise audit summary (all 3 ready non-bashirzadeh2021 partners):
# - bashirzadeh2021_source_data (9 x 7 = 63 model pairs): 0 mathematical relations.
#   All 7 bashirzadeh2021_source_data models are `role: processing`, `software: true`
#   readers of experimental microscopy Excel workbooks and Fig4c-d.mat fluorescence
#   profiles (no AFINES simulation outputs, Fig. 4g PDFs, or Fig. 4h Binder cumulants
#   exist in the Figshare deposit).
# - freedman2019_code (9 x 10 = 90 model pairs): 10 verified proposed relations below
#   linking shared AFINES C++ physics kernels (Hookean filament stretching, LAMMPS
#   harmonic filament bending, contour length, WLC persistence length, Stokes-Einstein
#   bead and crosslinker diffusion, Leimkuhler-Matthews Langevin diffusion, and the
#   shared stretching Metropolis KMC limit joining spacer bending in freedman2019_code
#   with filament-alignment penalties in bashirzadeh2021_code).
# - freedman2019 (9 x 29 = 261 model pairs): 6 verified proposed relations below
#   linking bashirzadeh2021_code's C++ kernels to freedman2019's AFINES SI Equations
#   (SI Eq. 1 filament stretching/bending, SI Eq. 4 crosslinker stretching & effective
#   binding free energy, and SI Eq. 6 Stokes mobility & Leimkuhler-Matthews Brownian
#   dynamics, making explicit the Kelvin equivalence 0.004 pN*um <-> 289.72 K).

# =============================================================================
# 1. AFINES-to-AFINES code relations: bashirzadeh2021_code <-> freedman2019_code
# =============================================================================
