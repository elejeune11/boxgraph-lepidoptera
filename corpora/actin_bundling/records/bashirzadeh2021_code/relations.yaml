    bend_angle: "theta"
    max_small_angle: "max_small_angle"
    temperature: "0.004"
    viscosity: "0.001"
    actin_length: "0.5"
    dt: "0.00002"
  output_map:
    U_stretch: U_stretch
  regime:
    k_s: [1.0, 100.0]
    l_0: [0.5, 2.0]
    l_cur: [0.7, 1.8]
    kappa_b: [0.01, 0.5]
    theta: [0.02, 3.0]
    max_small_angle: [0.0005, 0.005]
  provenance: proposed
  reason: >
    Both AFINES branches (dinner-group/AFINES@sorting_guv src/spring.cpp:187 and
    Simfreed/AFINES@growing_spacer_exv src/spring.cpp:377) implement the identical
    Hookean actin link stretching potential U_stretch = 0.5 * k_s * (l - l_0)^2.

