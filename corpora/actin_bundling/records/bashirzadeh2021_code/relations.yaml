    dt: [0.00001, 0.00005]
    temperature: [0.003, 0.005]
  tolerance: 0.0001
  provenance: proposed
  reason: >
    When freedman2019_code's perpendicular crosslinker-filament bending (s_bend -> 0) and
    unreset stale bending energy (stale_b_eng -> 0) vanish — the exact regime adopted by
    bashirzadeh2021_code's sorting_kinetics.cfg (a_m_bend = p_m_bend = 0) — all three
    bending-related Metropolis bugs in freedman2019_code/src/spacer.cpp:220-224,355-378
    disappear and spacer::metropolis_prob() reduces identically to bashirzadeh2021_code's
    stretching-only Metropolis attachment probability (src/motor.cpp:534-616 with kalign = 0,
    occ = 0, inter-filament binding).
  assumptions:
    - "Inter-filament binding (same_filament = 0) with steric occlusion disabled (occ = 0) and zero alignment penalty (kalign = 0)."
    - "Tolerance 1e-4 accounts for 1/kT = 250 amplification of the 1e-8 numeric limit perturbation in exp(-dE/kT)."

