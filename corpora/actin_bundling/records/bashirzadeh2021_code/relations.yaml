    stale_b_eng: "0"
  regime:
    mld: [0.15, 0.35]
    mk: [0.5, 10.0]
    s_bend: [0.005, 0.06]
    th0: [1.5707963267948966, 1.5707963267948966]
    link_length: [1.0, 1.5]
    head_sep_y: [0.25, 0.50]
    tilt_dx: [0.02, 0.15]
    pre_bind_dy: [0.01, 0.06]
