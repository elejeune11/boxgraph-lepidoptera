# Numerical convergence refinements for all numerical/PDE/stochastic models
- id: ref_boundary_Z0_nk
  run: run_boundary_Z0
  setting: n_k
  factors: [1, 2, 4]
  mode: multiply
  output: Omega_crit
  tolerance: "0.1%"
  tolerance_basis: "added: well below 1% plotting precision of the SM Fig. 1 Type Io stability boundary"
  tolerance_added: true

- id: ref_boundary_Z15_nk
  run: run_boundary_Z15
  setting: n_k
  factors: [1, 2, 4]
  mode: multiply
  output: Omega_crit
  tolerance: "0.1%"
  tolerance_basis: "added: well below 1% plotting precision of the SM Fig. 1 stability boundary"
  tolerance_added: true

- id: ref_pde_spike_L1_ngrid
  run: run_pde_spike_L1
  setting: n_grid
  factors: [1, 2, 4]
  mode: multiply
  output: C_max
  tolerance: "0.2%"
  tolerance_basis: "added: well below the 2-decimal precision (~0.7%) of SM Fig. 3's C_max ~= 0.68"
  tolerance_added: true

- id: ref_pde_LP0_ngrid
  run: run_pde_LP0
  setting: n_grid
  factors: [1, 2, 4]
  mode: multiply
  output: grad_C_sq_mean
  tolerance: "0.2%"
  tolerance_basis: "added: well below 1% plotting precision of Fig. 2's <(d_X C)^2> bifurcation diagram"
  tolerance_added: true

- id: ref_pde_LP4_ngrid
  run: run_pde_LP4
  setting: n_grid
  factors: [1, 2]
  mode: multiply
  output: K_obs
  tolerance: "0.5%"
  tolerance_basis: "added: comparable to 2-decimal printed precision of K_obs = 2.80 in SM Table I"
  tolerance_added: true

- id: ref_pde_LP6_ngrid
  run: run_pde_LP6
  setting: n_grid
  factors: [1, 2]
  mode: multiply
  output: grad_C_sq_mean
  tolerance: "0.2%"
  tolerance_basis: "added: well below 1% precision for the LP6 branch in Fig. 2 and SM Table I"
  tolerance_added: true

- id: ref_pde_wave_dt
  run: run_pde_wave_smfig2
  setting: dt
  factors: [1, 2, 4]
  mode: divide
  output: C_max
  tolerance: "0.5%"
  tolerance_basis: "added: well below visual colorbar precision of SM Fig. 2 travelling wave amplitude"
  tolerance_added: true

- id: ref_pde_2d_fig4a_dt
  run: run_pde_2d_fig4a
  setting: dt
  factors: [1, 2]
  mode: divide
  output: C_max
  tolerance: "1%"
  tolerance_basis: "added: well below visual colorbar precision of Fig. 4(a) 2D localized state"
  tolerance_added: true
