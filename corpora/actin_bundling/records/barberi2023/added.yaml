# Unstated inputs required to exercise dimensional scaling relations and 2D / probe runs
- id: eta_ref_added
  quantity: shear_viscosity
  unit: Pa*s
  printed: "1000"
  basis: Representative cortical shear viscosity for testing dimensional scale definitions lambda = sqrt(eta/gamma) and 1D viscous stress Eq. (3) (the paper states no dimensional parameter values).
  alternatives: ["100", "10000"]
  stands_for: "eta in Eq. (3) and lambda = sqrt(eta/gamma) (pp. 1-2)"

- id: eta_tilde_ref_added
  quantity: bulk_viscosity
  unit: Pa*s
  printed: "1000"
  basis: Chosen equal to eta_ref_added per the paper's simplifying assumption eta = eta_tilde (p. 2).
  alternatives: ["100", "10000"]
  stands_for: "eta_tilde in Eq. (3) with eta = eta_tilde (pp. 1-2)"

- id: gamma_ref_added
  quantity: friction_coefficient
  unit: Pa*s/m^2
  printed: "1 x 10^15"
  basis: Representative cortical friction coefficient yielding lambda = 1 um with eta = 1000 Pa*s; the paper states no dimensional parameter values.
  alternatives: ["1 x 10^14", "1 x 10^16"]
  stands_for: "gamma in Eq. (2) and lambda = sqrt(eta/gamma) (pp. 1-2)"

- id: Di_dim_ref_added
  quantity: diffusion_constant_inactive_nucleator
  unit: m^2/s
  printed: "1 x 10^-11"
  basis: Representative cytosolic protein diffusivity (10 um^2/s) yielding tau = lambda^2/D_i = 0.1 s with lambda = 1 um; the paper states no dimensional values.
  alternatives: ["1 x 10^-12", "1 x 10^-10"]
  stands_for: "D_i in tau = lambda^2 / D_i (p. 2)"

- id: dv_dx_ref_added
  quantity: velocity_gradient_1d
  unit: 1/s
  printed: "1"
  basis: Unit reference 1D velocity gradient for checking the dimensionless viscous stress ratio of Eq. (3) against Eq. (SM3).
  alternatives: ["0.1", "10"]
  stands_for: "d_x v in 1D Eq. (3)"

- id: C_probe_added
  quantity: dimless_actomyosin_density
  unit: dimensionless
  printed: "0.5"
  basis: Reference actomyosin density in the contractile regime (0 < C < 2/3) to exercise nonviscous_stress_1d.
  alternatives: ["0.2", "0.8"]
  stands_for: "C in Pi(C) = Z C^2 - B C^3 (Eq. SM3)"

- id: K_probe_added
  quantity: dimless_wavenumber
  unit: dimensionless
  printed: "2.4"
  basis: Fastest-growing discrete wavenumber (n = 12, K = 2*pi*12/(10*pi) = 2.4) at Z = 0, Omega = 30 (SM Fig. 2) to exercise the 1D linear stability models.
  alternatives: ["1.0", "3.2"]
  stands_for: "K in Eqs. (SM13)-(SM23)"

- id: Omega_d_fig4_added
  quantity: dimless_actin_inactivation
  unit: dimensionless
  printed: "10"
  basis: Fig. 4 caption (p. 4) omits Omega_d while citing SM Table II (which lists Omega_d as 'see text'); Omega_d = 10 is the value used throughout Figs. 1-2 and SM Figs. 1-2.
  alternatives: ["0", "5", "20"]
  stands_for: "Omega_d in Fig. 4 (p. 4)"

- id: T_end_wave_added
  quantity: dimless_time
  unit: dimensionless
  printed: "250"
  basis: Shorter integration horizon than SM Fig. 2's T = 2000; linear growth rate ~0.15 at Z = 0, Omega = 30 saturates the travelling wave by T ~ 80 so T = 250 captures the asymptotic wave amplitude cheaply.
  alternatives: ["500", "2000"]
  stands_for: "Final dimensionless time T for SM Fig. 2 travelling wave run"

- id: T_end_2d_added
  quantity: dimless_time
  unit: dimensionless
  printed: "100"
  basis: Fig. 4 caption (p. 4) does not specify the integration time T for the 2D steady localized states; T = 100 relaxes the circular Fig. 4(a) state to steady amplitude.
  alternatives: ["50", "200"]
  stands_for: "Final dimensionless time T for 2D Fig. 4(a) run"

