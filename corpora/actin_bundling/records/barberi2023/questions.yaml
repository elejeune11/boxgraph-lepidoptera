  text: >
    Cross-record synthesis across the active-fluid quartet {barberi2023, bois2011, hannezo2015,
    mirza2025} highlights two constitutive distinctions governing linear screening and nonlinear
    localization: (1) Although all four share the bare hydrodynamic length sqrt(eta/gamma), their
    1D longitudinal viscous coefficients differ: bois2011 and hannezo2015 use 1*eta (screening length
    lambda = sqrt(eta/gamma)); barberi2023's corrected traceless Eq. (3) with eta = eta_tilde gives
    1*eta in 1D and 2*eta in 2D (whereas printed Eq. 3 gives misprinted 2*eta in 1D and 2.5*eta in
    2D, q_eq3_non_traceless_strain_rate); and mirza2025's 2D compressible viscous stress
    2*eta*(d + tr(d)*I) yields 4*eta in 1D uniaxial flow (effective screening length 2*ell_s and 4x
    timescale ratio, corresponding to barberi2023/viscous_stress_1d_eq3_corrected at d = 2,
    eta_tilde = 3*eta). (2) In linear stability (decoupled fast-diffusing active-nucleator limit),
    barberi2023 reduces identically to bois2011 Eq. (12), hannezo2015 SI Eq. (8), and mirza2025
    Eq. (C7) whenever Pi'_H > 0; nonlinearly, however, bois2011 (Ref. 11), hannezo2015, and
    mirza2025 use monotonic contractile stress (Pi'(C) > 0, giving purely attractive inflow toward
    density peaks), whereas barberi2023's nonmonotonic Pi(C) = Z*C^2 - B*C^3 (Endnote 37, p. 5)
    flips Pi'(C) < 0 at high density C > 2*Z/(3*B), producing repulsive convective outflow between
    internal peaks that stabilizes multipeaked localized patterns LP2-LP7.
