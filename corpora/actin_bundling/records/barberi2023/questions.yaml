- id: q_eq3_non_traceless_strain_rate
  kind: possible_error
  about:
    - viscous_stress_1d_eq3
    - viscous_stress_1d_eq3_corrected
    - cmp_viscous_coeff_eq3_printed
    - cmp_viscous_coeff_eq3_corrected
  text: >
    On p. 1 (Main Text Eq. 3), the text defines the 'traceless strain rate tensor' as
    v = (1/2)[grad v + (grad v)^T - (grad . v / d) 1]. Because Tr(grad v + (grad v)^T) = 2 div v,
    this printed expression has trace (1/2) div v != 0 and is missing a factor of 2 on the trace
    term (it should read (1/2)[grad v + (grad v)^T] - (div v / d) 1). In d = 1 with eta = eta_tilde,
    the printed expression yields viscous stress (eta + eta_tilde) d_x v = 2 eta d_x v (dimensionless
    coefficient 2), contradicting Eq. (SM3) Sigma = d_X V + Pi(C) (coefficient 1). Numerical checks
    confirm that the spike solution of Fig. 3(a) and SM Fig. 3 vanishes when the viscous coefficient
    is 2 and matches SM Fig. 3 when it is 1.
  citation:
    page: 1
    printed_page: "238401-1"
    quote: "active fluid, v ¼ ð1=2Þ½∇v þ ð∇vÞT − ð∇ · v=dÞ1  is the"
    where: "Eq. 3"

