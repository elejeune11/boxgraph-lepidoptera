  text: >
    Cross-record comparison of barberi2023 with frohoff2021 connects two shared conserved-quantity
    mechanisms and pinpoints a key structural contrast: (1) Conservation of total nucleators
    N_+ = N_a + N_i gives barberi2023 a neutral K = 0 mode whose long-wave linear-kinetics Schur
    complement reduces identically to frohoff2021's conserved Cahn-Hilliard (Type II_s) dispersion
    with a_eff = D_a*N_a,H + (1 - N_a,H) - Pi'_H*C_H (and Brinkman screening supplies the O(K^4)
    interfacial stiffness), directly illuminating both the true continuum Type II_s boundary in
    SM Fig. 1 (q_sm_fig1_long_wave_type_iis) and the slanted-snaking bifurcation diagram of Fig. 2.
    (2) In the equal-diffusivity passive limit (D_a = 1, Z = B = 0, Omega = 0), barberi2023's
    (delta C, delta N_-) block is algebraically identical to frohoff2021's rescaled nonreciprocal
    2x2 operator -B(q) Eq. (12) with pure nonreciprocal coupling Delta = alpha^2 = A*N_a,H*Omega_d > 0;
    however, because both fields in frohoff2021 are conserved (multiplying eigenvalues by q^2), its
    oscillatory frequency vanishes at onset as q -> 0 (Im(lambda_+) = q^2 * omega_tilde), whereas
    barberi2023's non-conserved (C, N_-) pair retains a finite oscillation frequency as K -> 0
    (supporting finite-frequency travelling waves in SM Fig. 2).
