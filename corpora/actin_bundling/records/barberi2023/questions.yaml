- id: q_sm_nloc_integral_limit_misprint
  kind: possible_error
  about:
    - pde_1d_steady_state_sm1_5
    - rel_dev_threshold_Nloc
  text: >
    SM Sec. I B (PDF p. 11 / SM p. 5) defines the local average nucleator density as
    N_bar_loc = [1 / (X_r - X_l)] int_{-X_l}^{X_r} dX (N_a + N_i). Since X_l and X_r are defined
    starting from X = -L/2 and X = L/2 respectively (so for symmetric profiles centered at 0,
    X_l = -X_r < 0), the printed lower limit -X_l equals X_r and makes the integral vanish
    identically. Clearly the lower limit is a misprint for X_l; using int_{X_l}^{X_r} reproduces
    SM Table I's N_bar_loc values to ~0.01 across LP2-LP7.
  citation:
    page: 11
    printed_page: "SM-5"
    quote: "where Xl (Xr ) is the first point from the left (right) where the relative deviation of Ni from"
    where: "SM Sec. I B"

- id: q_fig3c_spatial_eigenvalues_mismatch
  kind: possible_error
  about:
    - spatial_dynamics_eigenvalues_sm24
    - spatial_eval_unit_mult_spike
    - spatial_eval_unit_mult_LP0
    - cmp_spatial_unit_mult_spike
    - cmp_spatial_unit_mult_LP0
  text: >
    Fig. 3(c) (p. 3) and SM Sec. II (p. 14) state that the plotted eigenvalues come from linearizing
    the 8D spatial-dynamics ODE system Eqs. (SM24)-(SM31) around H, and Fig. 3(c)'s caption states
    that 'In either case, the eigenvalue with real part equal to 1 has multiplicity 4.' Direct
    evaluation of the exact 8x8 Jacobian of Eqs. (SM24)-(SM31) at H yields reversible spectra
    symmetric under mu <-> -mu with NO eigenvalue at Re(mu) = 1:
    {0 (mult 2), +-1.3081, +-2.8615, +-7.5803} for the spike (Fig. 3a) and
    {0 (mult 2), +-0.6696, +-4.6396 +- 3.8907i} for LP0 (Fig. 1a).
    By contrast, Fig. 3(c) plots only non-negative real parts at {0, 1 (mult 4), 30.5, 100} for the
    spike (x) and {0, 1 (mult 4), 56.34 +- 18.46i} for LP0 (+). Those non-zero/non-unit numbers
    ({30.5, 100} and {56.336 +- 18.464i}) are the exact eigenvalues of the decoupled 3x3
    reaction-diffusion sub-block -D^{-1} R_H (independent of active stress Z, B and velocity V),
    which arise if the identity block I_4 and reaction-diffusion block are misplaced onto the block
    diagonal of the 8x8 Jacobian rather than off-diagonal. In addition, p. 3 attributes complex-conjugate
    pairing to reversibility; complex-conjugate pairing holds for any real matrix, whereas reversibility
    enforces sign reflection mu <-> -mu (yielding quartets +-a +- i*b, absent from Fig. 3c).
  citation:
    page: 3
    printed_page: "238401-3"
    quote: "In either case, the eigenvalue with real part equal to 1 has multiplicity 4."
    where: "Fig. 3(c)"

- id: q_sm_table1_lsa_mismatch
  kind: possible_error
  about:
    - inner_wavelength_lsa_sm1b
    - inner_wavelength_lsa_sm15_literal
    - cmp_sm1b_K_star_LP2
    - cmp_sm1b_K_star_LP6
    - cmp_sm15lit_K_star_LP2
    - cmp_sm15lit_K_star_LP6
  text: >
    SM Sec. I B (pp. 11-13) computes K* and [K*_left, K*_right] in SM Table I by linear stability
    analysis of the homogeneous state H with total nucleator density N_bar = N_bar_loc on discrete
    wavenumbers K = n*pi/W. Every printed entry in SM Table I is indeed an exact integer multiple of
    pi/W. However, exact linearization of Eqs. (SM1)-(SM5) at N_bar = N_bar_loc (equivalently
    rescaling Omega -> Omega*N_loc^2, Omega_d -> Omega_d*N_loc, Z -> Z*N_loc^2, B -> B*N_loc^3 per
    SM Table II) produces K* ~ 1.08-1.25 and K*_right ~ 3.97-5.49 with K*_left = pi/W for all six
    states LP2-LP7, failing to reproduce SM Table I (K* ~ 3.57-4.22, K*_right ~ 8.33-9.57, and
    K*_left ~ 1.08-1.37 for LP4-LP7). Notably, substituting C_H(N_loc) and N_H^- = 2*N_a,H(N_loc) - N_loc
    literally into printed Eqs. (SM15)-(SM23) while leaving N_H^+ = 1 unscaled (model
    inner_wavelength_lsa_sm15_literal) matches 8 of 18 printed entries exactly (LP2 K*_right = 9.57,
    LP3 K* = 3.57, LP4 K*_left = 1.13, LP5 K* = 4.06 and K*_left = 1.08, LP6 K* = 3.83, LP7 K*_left = 1.25
    and K*_right = 8.49; 13 of 18 reproduce within BoxGraph input-rounding propagation) and recovers
    the shift to K*_left > pi/W for LP4-LP7, though residual 1-2 Delta K differences remain.
  citation:
    page: 11
    printed_page: "SM-5"
    quote: "homogeneous state with N̄ = N̄loc and all other parameters as for the corresponding LP."
    where: "SM Sec. I B & SM Table I"

- id: q_sm_table1_W_Kobs_vs_fig1
  kind: unexplained_difference
  about:
    - pde_1d_steady_state_sm1_5
    - W_LP3
    - K_obs_LP3
    - W_LP6
    - K_obs_LP6
    - cmp_pde_W_LP3
    - cmp_pde_K_obs_LP3
    - cmp_pde_W_LP6
    - cmp_pde_K_obs_LP6
  text: >
    SM Table I's caption (p. 13) states that LP2-LP7 'are the same as in Fig. 1 of the main text'
    (Omega = 10 for LP2-LP3, 14 for LP4-LP6, 15.5 for LP7). Converged, grid-independent 1D steady-state
    solutions of Eqs. (SM1)-(SM5) (residual < 10^-11, verified between N = 1024 and N = 2048) match the
    actual curves plotted in Fig. 1(b)-(g) to ~0.5% in width W and inner wavenumber K_obs and match
    Fig. 2's <(d_X C)^2> and SM Table I's N_bar_loc within ~0.01 across all six states. However, SM
    Table I prints systematically larger W and smaller K_obs for LP3, LP5, LP6, and LP7 than both our
    PDE solutions and the paper's own Fig. 1(c, e-g) plots (e.g., LP3 has W = 6.78 < LP2's 7.27 and
    K_obs = 3.44 in both our PDE and Fig. 1(c), whereas SM Table I prints W = 7.92 > 7.55 and
    K_obs = 3.15; LP6 has W = 10.28 and K_obs = 4.08 in both our PDE and Fig. 1(f), whereas SM Table I
    prints W = 11.47 and K_obs = 3.81). The definition of FWHM (of C vs N_i vs N_a + N_i) and the
    exact method used to extract K_obs are not specified in SM Sec. I B, and SM Table I may have been
    evaluated at slightly different Omega values or with an alternative width/wavenumber metric.
  citation:
    page: 13
    printed_page: "SM-7"
    quote: "SM Table I: Geometric features of six different localized patterns, LP2−7 . For definitions,"
    where: "SM Table I"

- id: q_sm_fig1_long_wave_type_iis
  kind: possible_error
  about:
    - stability_boundary_smfig1
    - linear_stability_1d_sm15
    - run_boundary_Z15
  text: >
    SM Sec. I A (p. 10) and SM Fig. 1 (p. 11) label the entire solid instability boundary of H as a
    finite-wavelength stationary (Type I_s) instability. Direct evaluation of Eqs. (SM15)-(SM23) shows
    that for Z in roughly [2.78, 23.08] (including Z = 15 of Figs. 1-2, where Omega_c = 8.1435 as K -> 0^+),
    the first mode to become unstable as Omega increases is the long-wavelength (K -> 0^+) conserved-density
    mode (a Type II_s instability in the Cross-Hohenberg classification), while a genuine finite-wavelength
    Type I_s onset (K_c ~ 3.41 down to 3.24) takes over only for Z >= 23.09 (reaching Omega_c = 0 at
    Z ~ 24.46, and Type I_o oscillatory onset with K_c ~ 2.25-2.28 occurs for Z <= 2.77). Additionally,
    SM Fig. 1's caption refers to 'solid and dotted lines' whereas the plot and legend draw a solid line
    and a dashed line.
  citation:
    page: 11
    printed_page: "SM-5"
    quote: "steady state H is unstable above the solid and dotted lines. Parameter values as in Fig. 1"
    where: "SM Fig. 1"

