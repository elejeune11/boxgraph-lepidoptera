# ==============================================================================
# Cross-record relations with bois2011 (Bois, Julicher & Grill, PRL 106:028103, 2011; cited as ref-11)
# ==============================================================================

- id: rel_bois2011_hydrodynamic_length
  kind: same_as
  a: barberi2023/hydrodynamic_length
  b: bois2011/hydrodynamic_length
  mapping:
    eta: "eta"
    gamma: "gamma"
  regime:
    eta: [10.0, 1.0e5]
    gamma: [1.0e12, 1.0e18]
  provenance: proposed
  reason: >
    Both active-fluid papers define the bare hydrodynamic screening length as
    sqrt(viscosity / friction): barberi2023 lambda = sqrt(eta/gamma) (p. 2) is symbolically
    identical to bois2011 ell = sqrt(eta/gamma) (p. 2, cited in barberi2023 as ref-11).

- id: rel_bois2011_diffusive_timescale
  kind: same_as
  a: barberi2023/diffusive_timescale
  b: bois2011/diffusive_timescale
  mapping:
    l: "lam"
    D: "D_i"
  regime:
    lam: [1.0e-7, 1.0e-4]
    D_i: [1.0e-14, 1.0e-10]
  provenance: proposed
  reason: >
    Both papers nondimensionalize time by diffusion across one hydrodynamic screening length:
    barberi2023 tau = lambda^2 / D_i (p. 2, using inactive-nucleator diffusivity D_i) is
    symbolically identical to bois2011 tau_D = ell^2 / D (Fig. 3, using regulator diffusivity D
    or substrate diffusivity D_s in ASDM).

- id: rel_bois2011_dispersion_eq12_reduces
  kind: reduces_to
  a: barberi2023/linear_stability_1d_sm15
  b: bois2011/single_species_dispersion_eq12
  mapping:
    k: "K"
    D: "1"
    Pe: "2 * Z - 3 * B"
    c0: "1"
    df_dc: "1"
    l: "1"
  output_map:
    lam_dimless: max_growth_rate
  limit:
    A: "oo"
    Kd: "oo"
    Omega_d0: "0"
    Omega_d: "0"
  regime:
    K: [0.2, 4.0]
    Dc: [0.01, 0.2]
    Da: [1.0, 1.0]
    A: [1.0, 1.0]
    Kd: [1.0, 1.0]
    Omega0: [2.0, 8.0]
    Omega: [0.5, 5.0]
    Omega_d0: [0.1, 1.0]
    Omega_d: [0.1, 1.0]
    Z: [3.0, 12.0]
    B: [0.1, 0.8]
  provenance: proposed
  reason: >
    In the vanishing nucleator-inactivation limit (Omega_d,0 -> 0, Omega_d -> 0, so N_a,H -> 1
    and N_i decouples as a purely damped mode -(K^2 + Omega_0*(1 + Omega)) < 0) combined with
    fast actomyosin turnover (A, K_d -> oo at fixed ratio C_H = A/K_d = 1, so C adiabatically
    tracks the conserved active nucleator C = N_a) and equal nucleator diffusivity (D_a = 1 = D_i,
    so tau = lambda^2/D_a = tau_D), barberi2023's 3-species active fluid Eqs. (SM15)-(SM23)
    reduces identically to bois2011 Eq. (12)'s conserved single-species active-fluid dispersion
    tau_D*lambda(K) = -K^2*(1 - Pe_eff/(1 + K^2)) with linearized active Peclet number
    Pe_eff = Pe*c_0*f'(c_0) = Pi'_H*C_H = 2*Z - 3*B. In this positive-slope regime (2*Z > 3*B),
    barberi2023's stress mimics bois2011's monotonic contractile stress (ref-11, contrasted in
    barberi2023 Endnote 37, p. 5).
  assumptions:
    - "Vanishing nucleator inactivation (Omega_d,0 -> 0, Omega_d -> 0) and fast actomyosin turnover (A, K_d -> oo at fixed C_H = A/K_d = 1)."
    - "Equal nucleator diffusivities (D_a = 1, matching reference diffusivity D_i) and positive linearized stress slope 2*Z - 3*B > 0."

- id: rel_bois2011_rda_dispersion_eq15_scales
  kind: scales_as
  a: barberi2023/linear_stability_1d_sm15
  b: bois2011/single_species_rda_dispersion_eq15
  mapping:
    k: "K"
    D: "Dc"
    dR_dc: "-Kd"
    Pe: "(2 * Z * (A / Kd) - 3 * B * (A / Kd)**2) * (A / Kd) / Dc"
    c0: "1"
    df_dc: "1"
    l: "1"
  output_map:
    lam: max_growth_rate
  regime:
    K: [0.5, 3.0]
    Dc: [0.05, 0.5]
    Da: [1.0e5, 2.0e5]
    A: [0.8, 1.5]
    Kd: [0.3, 1.0]
    Omega0: [5.0, 10.0]
    Omega: [0.5, 3.0]
    Omega_d0: [0.0, 0.0]
    Omega_d: [0.0, 0.0]
    Z: [5.0, 12.0]
    B: [0.1, 0.5]
  provenance: proposed
  reason: >
    In the decoupled fast-diffusing active-nucleator regime (Omega_d,0 = Omega_d = 0 so N_a,H = 1,
    C_H = A/K_d, and D_a >> 1 so delta N_a -> 0), actomyosin density C in barberi2023 Eqs. (SM15)-(SM23)
    obeys the single-species active reaction-diffusion-advection dispersion
    Phi(K) = -D_c*K^2 - K_d + Pi'_H*C_H*K^2/(1 + K^2), matching all six shared-parameter log-slopes
    (K, D_c, A, K_d, Z, B) of bois2011 Eq. (15) (single_species_rda_dispersion_eq15, dimensional
    output lam [1/s]) with linear turnover dR/dc = -K_d and effective Peclet number Pe = Pi'_H*C_H/D_c.
  assumptions:
    - "Decoupled uniform nucleator pool (Omega_d,0 = Omega_d = 0, D_a in [1e5, 2e5]) so actomyosin C is the leading mode across arbitrary D_c."
    - "Evaluated in the unstable contractile regime (Pi'_H*C_H > 0, Phi(K) > 0) away from neutral crossings."

- id: rel_bois2011_inner_lsa_fastest_mode_reduces
  kind: reduces_to
  a: barberi2023/inner_wavelength_lsa_sm1b
  b: bois2011/single_species_fastest_mode
  mapping:
    Pe: "4 * (2 * Z * (A * N_loc / Kd) - 3 * B * (A * N_loc / Kd)**2) * (A * N_loc / Kd) / Dc"
    c0: "1"
    beta: "1"
    L_over_l: "W"
  output_map:
    k_max_discrete_l: K_star
  limit:
    Omega_d0: "0"
    Omega_d: "0"
    Da: "oo"
  regime:
    N_loc: [0.8, 1.5]
    W: [5.0, 15.0]
    Dc: [0.2, 1.0]
    Da: [1.0, 10.0]
    A: [0.8, 1.5]
    Kd: [0.5, 1.5]
    Omega0: [5.0, 10.0]
    Omega: [0.5, 3.0]
    Omega_d0: [0.1, 1.0]
    Omega_d: [0.1, 1.0]
    Z: [6.0, 15.0]
    B: [0.1, 0.5]
  provenance: proposed
  reason: >
    barberi2023 SM Sec. I B selects the inner wavenumber K* of localized patterns by maximizing
    Re[Phi(K)] on the discrete mode spectrum K_n = n*pi/W. In the decoupled-nucleator limit
    (Omega_d,0 -> 0, Omega_d -> 0, D_a -> oo), Phi(K) = -K_d + D_c*[-K^2*(1 - (Pi'_H*C_H/D_c)/(1 + K^2))];
    because constant turnover -K_d and positive prefactor D_c leave the wavenumber argmax invariant,
    barberi2023/inner_wavelength_lsa_sm1b (K_star) reduces identically to bois2011/single_species_fastest_mode
    (k_max_discrete_l) on a no-flux domain (beta = 1, L/ell = W) with Hill-stress equivalent
    Pe = 4*Pi'_H*C_H/D_c at c_0 = 1.
  assumptions:
    - "Decoupled fast-diffusing active nucleator (Omega_d,0 -> 0, Omega_d -> 0, D_a -> oo) with C_H = (A/K_d)*N_loc."
    - "Supercritical active stress Pi'_H*C_H/D_c > 1 + (pi/W)^2 so at least one discrete mode is unstable."

# ==============================================================================
# Cross-record relations with hannezo2015 (Hannezo et al., PNAS 112:8620-8625, 2015)
# ==============================================================================

- id: rel_hannezo2015_hydrodynamic_length
  kind: same_as
  a: barberi2023/hydrodynamic_length
  b: hannezo2015/hydrodynamic_length
  mapping:
    eta: "eta"
    xi: "gamma"
  regime:
    eta: [10.0, 1.0e5]
    gamma: [1.0e12, 1.0e18]
  provenance: proposed
  reason: >
    Both active-fluid models define the hydrodynamic screening length as sqrt(viscosity / friction):
    barberi2023 lambda = sqrt(eta/gamma) [m] matches hannezo2015 l_h = sqrt(eta/xi) [um]
    symbolically because cortex thickness h cancels in eta_2D/xi_2D = (h*eta)/(h*gamma).
  assumptions:
    - "2D thickness-integrated cortical viscosity eta_2D = h*eta and friction xi_2D = h*gamma cancel thickness h at unit reference thickness h = 1 m."

- id: rel_hannezo2015_hydrodynamic_length_3d
  kind: same_as
  a: hannezo2015/hydrodynamic_length_from_3d
  b: barberi2023/hydrodynamic_length
  mapping:
    eta: "eta_3D"
    gamma: "xi * 10**9 / h"
  regime:
    eta_3D: [10.0, 1000.0]
    h: [10.0, 500.0]
    xi: [1.0e7, 1.0e11]
  provenance: proposed
  reason: >
    Expressing hannezo2015's cortical hydrodynamic length via 3D viscosity eta_3D [Pa*s] and
    thickness h [nm] yields a dimensionally exact 3D-to-3D identity with barberi2023/hydrodynamic_length
    under eta = eta_3D and gamma = xi / h (converting h from nm to m).

- id: rel_hannezo2015_diffusive_timescale
  kind: same_as
  a: hannezo2015/diffusion_time_hydrodynamic
  b: barberi2023/diffusive_timescale
  mapping:
    lam: "sqrt(eta / xi)"
    D_i: "D / 10**12"
  regime:
    eta: [1.0e-7, 1.0e-3]
    xi: [1.0e7, 1.0e11]
    D: [0.005, 0.5]
  provenance: proposed
  reason: >
    hannezo2015 SI Sec. 2.3 defines the hydrodynamic diffusion timescale T = eta/(xi*D) = l_h^2/D [s],
    symbolically identical to barberi2023's unit time tau = lambda^2/D_i [s] with lambda = sqrt(eta/xi)
    and D_i = D (converting D from um^2/s to m^2/s).

- id: rel_hannezo2015_dispersion_eq8_reduces
  kind: reduces_to
  a: barberi2023/linear_stability_1d_sm15
  b: hannezo2015/dispersion_relation_dimless_eq8
  mapping:
    q_hat: "K"
    phi: "Kd"
    chi: "(2 * Z * (A / Kd) - 3 * B * (A / Kd)**2) * (A / Kd)"
  output_map:
    lam_hat: max_growth_rate
  limit:
    Omega_d0: "0"
    Omega_d: "0"
    Da: "oo"
  regime:
    K: [0.2, 4.0]
    Dc: [1.0, 1.0]
    Da: [1.0, 10.0]
    A: [0.5, 1.5]
    Kd: [0.2, 1.5]
    Omega0: [5.0, 15.0]
    Omega: [0.5, 5.0]
    Omega_d0: [0.1, 1.0]
    Omega_d: [0.1, 1.0]
    Z: [3.0, 12.0]
    B: [0.1, 0.6]
  provenance: proposed
  reason: >
    In the decoupled fast-diffusing active-nucleator limit (Omega_d,0 -> 0, Omega_d -> 0 so N_a,H -> 1,
    C_H -> A/K_d, and D_a -> oo so delta N_a -> 0) with unit actomyosin diffusivity ratio D_c = d_c/D_i = 1
    (matching hannezo2015's timescale T = l_h^2/D_c), barberi2023's 3-species mechanochemical dispersion
    Eqs. (SM15)-(SM23) reduces identically to hannezo2015 SI Eq. (8)'s dimensionless 1D active-fluid-with-turnover
    dispersion lam_hat = -phi - q_hat^2 + chi*q_hat^2/(1 + q_hat^2) under q_hat = K, phi = K_d, and
    chi = Pi'_H*C_H = (2*Z*(A/K_d) - 3*B*(A/K_d)^2)*(A/K_d).
  assumptions:
    - "Decoupled uniform nucleator pool (Omega_d,0 -> 0, Omega_d -> 0, D_a -> oo) with fast inactive-nucleator relaxation (Omega_0 in [5, 15]) so actomyosin C is the leading mode."
    - "Equal actomyosin and reference diffusivity D_c = 1 so both dimensionless growth rates share time scale lambda^2/D_c."

- id: rel_hannezo2015_dispersion_eq7_scales
  kind: scales_as
  a: barberi2023/linear_stability_1d_sm15
  b: hannezo2015/dispersion_relation_eq7
  mapping:
    tau: "1 / Kd"
    D: "Dc * 10**12"
    sigma_a: "(2 * Z * (A / Kd) - 3 * B * (A / Kd)**2) * (A / Kd)"
    xi: "1"
    eta: "1"
    q: "K / 10**6"
  output_map:
    lam: max_growth_rate
  regime:
    K: [0.5, 3.0]
    Dc: [0.05, 0.5]
    Da: [1.0e5, 2.0e5]
    A: [0.8, 1.5]
    Kd: [0.3, 1.0]
    Omega0: [5.0, 10.0]
    Omega: [0.5, 3.0]
    Omega_d0: [0.0, 0.0]
    Omega_d: [0.0, 0.0]
    Z: [5.0, 12.0]
    B: [0.1, 0.5]
  provenance: proposed
  reason: >
    For arbitrary actomyosin diffusivity ratio D_c in the decoupled-nucleator regime
    (Omega_d,0 = Omega_d = 0, D_a >> 1), barberi2023's dimensionless growth rate
    Phi(K) = -K_d - D_c*K^2 + Pi'_H*C_H*K^2/(1 + K^2) matches all six shared-parameter log-slopes
    (K, D_c, A, K_d, Z, B) of hannezo2015 SI Eq. (7) (dimensional dispersion_relation_eq7 [1/s])
    with tau = 1/K_d, D = D_c (in SI m^2/s), eta = xi = 1, and sigma_a = Pi'_H*C_H.
  assumptions:
    - "Decoupled uniform nucleator pool (Omega_d,0 = Omega_d = 0, D_a in [1e5, 2e5]) across arbitrary D_c."
    - "Unit hydrodynamic scale eta = xi = 1 matching barberi2023's dimensionless length X = x/lambda."

# ==============================================================================
# Cross-record relations with mirza2025 (Mirza et al., eLife 13:RP93097, 2024/2025; cites barberi2023 pp. 2, 8)
