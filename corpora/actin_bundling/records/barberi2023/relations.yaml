- id: rel_mirza2025_hydrodynamic_length
  kind: same_as
  a: barberi2023/hydrodynamic_length
  b: mirza2025/hydrodynamic_length
  mapping:
    eta: "eta"
    gamma: "gamma"
  regime:
    eta: [100.0, 1.0e5]
    gamma: [1.0e14, 1.0e19]
  provenance: proposed
  reason: >
    Both active-gel models define the bare hydrodynamic screening length as sqrt(eta/gamma):
    barberi2023 lambda [m] is symbolically identical to mirza2025 ell_s [um] (mirza2025 pp. 2, 8
    cites barberi2023 as part of the compressible isotropic active-gel patterning family). Note that
    in 1D force balance, barberi2023's corrected traceless Eq. (3) with eta = eta_tilde gives
    viscous stress 1*eta*d_x v (effective screening length lambda), whereas mirza2025's 2D
    compressible viscous stress 2*eta*(d + tr(d)*I) gives 4*eta*d_x v (effective screening length
    2*ell_s, matching barberi2023/viscous_stress_1d_eq3_corrected at d = 2, eta_tilde = 3*eta).

- id: rel_mirza2025_diffusive_timescale
  kind: same_as
