    Dc: [0.01, 0.1]
    Da: [1.0, 1.0]
    A: [1000.0, 1000.0]
    Kd: [1000.0, 1000.0]
    Omega0: [1.0, 5.0]
    Omega: [0.0, 5.0]
    Omega_d0: [0.0, 0.0]
    Omega_d: [0.0, 0.0]
    Z: [2.0, 10.0]
    B: [0.1, 0.5]
