    role of Cahn-Hilliard interfacial stiffness kappa_eff = P_eff*lambda^2 for the conserved
    active-nucleator field.
  assumptions:
    - "Fast actomyosin turnover (A = K_d = 1000), conserved active nucleators (Omega_d,0 = Omega_d = 0, D_a = 1), and Type II_s unstable contractile stress P_eff = 2*Z - 3*B > 1."

