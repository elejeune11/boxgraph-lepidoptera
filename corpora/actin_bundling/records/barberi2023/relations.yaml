  reason: >
    barberi2023's diffusive unit time tau = lambda^2/D_i [s] (p. 2) is symbolically identical to
    mirza2025 Appendix B's bare diffusive timescale t_0 = ell_s^2/D [s] under ell_s = lambda and
    D = D_i (converting m -> um and m^2/s -> um^2/s).

