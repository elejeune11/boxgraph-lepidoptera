  b: frohoff2021/linear_dispersion_general_eq12
  mapping:
    q: "K"
    f1_pp: "Omega0 + Omega_d0 + Omega_d * (A / Kd) * (-(Omega0 + Omega_d0) + sqrt((Omega0 + Omega_d0)**2 + 4 * Omega0 * Omega_d * A / Kd)) / (2 * Omega_d * A / Kd)"
    f2_pp: "Kd"
    Q: "1"
    kappa: "Dc"
    rho: "0"
    alpha: "sqrt(A * Omega_d * (-(Omega0 + Omega_d0) + sqrt((Omega0 + Omega_d0)**2 + 4 * Omega0 * Omega_d * A / Kd)) / (2 * Omega_d * A / Kd))"
  output_map:
    re_lam_tilde_plus: max_growth_rate
  regime:
    K: [1.0, 2.5]
    Dc: [0.005, 0.04]
    Da: [1.0, 1.0]
    A: [1.2, 2.2]
    Kd: [0.55, 0.68]
    Omega0: [0.005, 0.009]
    Omega: [0.0, 0.0]
    Omega_d0: [0.001, 0.005]
    Omega_d: [1.5, 2.6]
  provenance: proposed
  reason: >
    Exact nonreciprocal 2x2 operator isomorphism: in barberi2023's passive limit (Z = B = 0)
    with equal nucleator diffusivities (D_a = 1 = D_i), row 2 of Eqs. (SM15)-(SM23) decouples
    the conserved total nucleator mode delta N_+ with exact eigenvalue -K^2, leaving a 2x2
    nonreciprocal activator-inhibitor operator on (delta N_-, delta C) with off-diagonal product
    -(A/2)*(-2*N_a,H*Omega_d) = +A*N_a,H*Omega_d > 0. At Omega = 0 (retaining nonlinear actin-mediated
    inactivation Omega_d > 0, giving exact quadratic steady state N_a,H), this 2x2 operator is
    algebraically identical to frohoff2021's rescaled nonreciprocal two-field operator -B(q) (Eq. 12)
    under q = K, Q = 1, kappa = D_c, f_1'' = Omega_0 + Omega_d,0 + Omega_d*C_H, f_2'' = K_d,
    rho = 0, and alpha = sqrt(A*N_a,H*Omega_d). Verified to machine precision across both real-eigenvalue
    and damped-oscillatory regimes where the 2x2 mode dominates -K^2.
  assumptions:
    - "Passive fluid (Z = B = 0), equal nucleator diffusivities (D_a = 1), and vanishing cooperative activation (Omega = 0) with nonzero actin-mediated inactivation (Omega_d > 0)."
    - "Regime satisfies f_1'' + K_d < K^2*(1 - D_c) so the nonreciprocal (delta C, delta N_-) mode is strictly the leading eigenvalue over the decoupled conserved mode -K^2."

