# Dimensional physical quantities (Main Text Eqs. 1-5 & nondimensionalization, pp. 1-2)
- id: shear_viscosity
  name: active fluid shear viscosity
  dimension: "[mass] / [length] / [time]"
  description: Shear viscosity eta of the isotropic active fluid (Eq. 3, p. 1).

- id: bulk_viscosity
  name: active fluid bulk viscosity
  dimension: "[mass] / [length] / [time]"
  description: Bulk viscosity eta_tilde of the isotropic active fluid (Eq. 3, p. 1).

- id: friction_coefficient
  name: cortical friction coefficient
  dimension: "[mass] / [length]**3 / [time]"
  description: Friction coefficient gamma in force balance grad . sigma = gamma v (Eq. 2, p. 1).

- id: hydrodynamic_length
  name: hydrodynamic screening length
  dimension: "[length]"
  description: Characteristic velocity decay length lambda = sqrt(eta / gamma) (p. 2).

- id: system_length
  name: dimensional system length
  dimension: "[length]"
  description: Physical domain length l in 1D (x in [-l/2, l/2], p. 2).

- id: diffusion_constant_actomyosin
  name: actomyosin effective diffusion constant
  dimension: "[length]**2 / [time]"
  description: Effective diffusion constant D_c of the actomyosin network (Eq. 1, p. 1).

- id: diffusion_constant_active_nucleator
  name: active nucleator diffusion constant
  dimension: "[length]**2 / [time]"
  description: Diffusion constant D_a of membrane-bound active nucleators (p. 2).

- id: diffusion_constant_inactive_nucleator
  name: inactive nucleator diffusion constant
  dimension: "[length]**2 / [time]"
  description: Diffusion constant D_i of cytosolic inactive nucleators (p. 2).

- id: diffusive_timescale
  name: inactive-nucleator diffusive timescale
  dimension: "[time]"
  description: Characteristic time tau = lambda^2 / D_i for an inactive nucleator to diffuse distance lambda (p. 2).

- id: assembly_rate
  name: actomyosin assembly rate constant
  dimension: "1 / [time]"
  description: Rate constant alpha of actomyosin assembly mediated by active nucleators (Eq. 1, p. 1).

- id: disassembly_rate
  name: actomyosin disassembly rate constant
  dimension: "1 / [time]"
  description: Spontaneous disassembly rate k_d of the actomyosin network (Eq. 1, p. 1).

- id: basal_activation_rate
  name: basal nucleator activation rate
  dimension: "1 / [time]"
  description: Spontaneous activation rate omega_0 of inactive nucleators (Eqs. 4-5, p. 2).

- id: spontaneous_inactivation_rate
  name: spontaneous nucleator inactivation rate
  dimension: "1 / [time]"
  description: Spontaneous inactivation rate omega_d,0 of active nucleators (Eqs. 4-5, p. 2).

- id: cooperative_activation_coeff
  name: cooperative nucleator activation coefficient
  dimension: "[length]**6"
  description: Coefficient omega of quadratic self-activation omega n_a^2 in Eqs. (4)-(5) (p. 2; for 3D number density n_a).

- id: actin_inactivation_rate
  name: actin-induced nucleator inactivation rate
  dimension: "[length]**3 / [time]"
  description: Rate constant omega_d of actomyosin-mediated nucleator inactivation (Eqs. 4-5, p. 2).

- id: mean_nucleator_density
  name: conserved average total nucleator density
  dimension: "1 / [length]**3"
  description: Spatially averaged conserved total nucleator density n_bar = (1/V) int (n_a + n_i) dV (p. 2).

- id: active_stress_coeff
  name: contractile active stress coefficient
  dimension: "[mass] * [length]**5 / [time]**2"
  description: Coefficient (zeta Delta mu)_0 of quadratic active stress pi_a(c) = (zeta Delta mu)_0 c^2 (p. 2).

- id: passive_stress_coeff
  name: passive steric stress coefficient
  dimension: "[mass] * [length]**8 / [time]**2"
  description: Coefficient b of cubic passive hydrostatic stress pi_p(c) = -b c^3 (p. 2).

- id: velocity_gradient_1d
  name: 1D velocity gradient
  dimension: "1 / [time]"
  description: Spatial derivative d_x v of the 1D cortical flow velocity (Eq. 3, p. 1).

- id: viscous_stress_1d
  name: 1D viscous stress
  dimension: "[mass] / [length] / [time]**2"
  description: Viscous component of the 1D stress tensor sigma_visc (Eq. 3, p. 1).

- id: spatial_dimension
  name: spatial dimension
  dimension: "dimensionless"
  description: Number of spatial dimensions d (d = 1 or d = 2, pp. 1-3).

# Nondimensional parameters & variables (p. 2, SM Table II p. 14, SM I-II)
- id: dimless_system_size
  name: dimensionless system size
  dimension: "dimensionless"
  description: Nondimensional domain length L = l / lambda (SM Table II, p. 14).

- id: dimless_diffusivity_c
  name: dimensionless actomyosin diffusivity
  dimension: "dimensionless"
  description: Nondimensional effective diffusivity D_c = D_c_dim * tau / lambda^2 (SM Table II, p. 14).

- id: dimless_diffusivity_a
  name: dimensionless active nucleator diffusivity
  dimension: "dimensionless"
  description: Nondimensional diffusivity D_a = D_a_dim * tau / lambda^2 (SM Table II, p. 14).

- id: dimless_diffusivity_i
  name: dimensionless inactive nucleator diffusivity
  dimension: "dimensionless"
  description: Nondimensional diffusivity D_i = D_i_dim * tau / lambda^2 = 1 (SM Table II, p. 14).

- id: dimless_assembly_rate
  name: dimensionless actomyosin assembly rate
  dimension: "dimensionless"
  description: Nondimensional assembly rate A = alpha * tau (Eq. SM1 p. 8; SM Table II p. 14).

- id: dimless_disassembly_rate
  name: dimensionless actomyosin disassembly rate
  dimension: "dimensionless"
  description: Nondimensional disassembly rate K_d = k_d * tau (SM Table II, p. 14).

- id: dimless_basal_activation_rate
  name: dimensionless basal activation rate
  dimension: "dimensionless"
  description: Nondimensional basal activation rate Omega_0 = omega_0 * tau (SM Table II, p. 14).

- id: dimless_cooperative_activation
  name: dimensionless cooperative activation parameter
  dimension: "dimensionless"
  description: Nondimensional cooperative activation strength Omega = omega * n_bar^2 (SM Table II, p. 14).

- id: dimless_spontaneous_inactivation
  name: dimensionless spontaneous inactivation rate
  dimension: "dimensionless"
  description: Nondimensional spontaneous inactivation rate Omega_d,0 = omega_d,0 * tau (SM Table II, p. 14).

- id: dimless_actin_inactivation
  name: dimensionless actin-mediated inactivation rate
  dimension: "dimensionless"
  description: Nondimensional actin-mediated inactivation rate Omega_d = omega_d * n_bar * tau (SM Table II, p. 14).

- id: dimless_active_stress_coeff
  name: dimensionless contractile active stress parameter
  dimension: "dimensionless"
  description: Nondimensional active stress strength Z = (zeta Delta mu)_0 n_bar^2 tau / (gamma lambda^2) (SM Table II, p. 14).

- id: dimless_passive_stress_coeff
  name: dimensionless passive stress parameter
  dimension: "dimensionless"
  description: Nondimensional passive stress strength B = b n_bar^3 tau / (gamma lambda^2) (SM Table II, p. 14).

- id: dimless_mean_nucleator_density
  name: dimensionless average total nucleator density
  dimension: "dimensionless"
  description: Spatially averaged total nucleator density N_bar = (1/L) int (N_a + N_i) dX (equals 1 globally, or N_bar_loc locally in SM I B).

- id: dimless_actomyosin_density
  name: dimensionless actomyosin density
  dimension: "dimensionless"
  description: Nondimensional actomyosin network density C = c / n_bar (p. 2).

- id: dimless_active_nucleator_density
  name: dimensionless active nucleator density
  dimension: "dimensionless"
  description: Nondimensional active nucleator density N_a = n_a / n_bar (p. 2).

- id: dimless_inactive_nucleator_density
  name: dimensionless inactive nucleator density
  dimension: "dimensionless"
  description: Nondimensional inactive nucleator density N_i = n_i / n_bar (p. 2).

- id: dimless_nucleator_difference
  name: dimensionless nucleator density difference
  dimension: "dimensionless"
  description: Difference variable N_- = N_a - N_i (Eqs. SM6-SM8, p. 8).

- id: dimless_velocity
  name: dimensionless cortical flow velocity
  dimension: "dimensionless"
  description: Nondimensional fluid velocity V = v * tau / lambda (Eqs. SM1-SM5, p. 8).

- id: dimless_nonviscous_stress
  name: dimensionless nonviscous stress
  dimension: "dimensionless"
  description: Nonviscous stress Pi(C) = Z C^2 - B C^3 (Eq. SM3, p. 8).

- id: dimless_nonviscous_stress_slope
  name: dimensionless nonviscous stress derivative
  dimension: "dimensionless"
  description: Derivative Pi'(C) = 2 Z C - 3 B C^2 (Eq. SM13, p. 9).

- id: dimless_wavenumber
  name: dimensionless spatial wavenumber
  dimension: "dimensionless"
  description: Nondimensional Fourier wavenumber K (Eqs. SM9-SM23, SM Table I).

- id: dimless_growth_rate
  name: dimensionless linear growth rate
  dimension: "dimensionless"
  description: Real part of the linear stability eigenvalue Re(Phi) (Eqs. SM9-SM23, pp. 9-10).

- id: dimless_oscillation_frequency
  name: dimensionless linear oscillation frequency
  dimension: "dimensionless"
  description: Magnitude of the imaginary part of the leading linear stability eigenvalue |Im(Phi)| (pp. 9-10).

- id: dimless_velocity_response_coeff
  name: dimensionless linearized velocity response coefficient
  dimension: "dimensionless"
  description: Imaginary amplitude K / (1 + K^2) * Pi'_H relating delta V to delta C (Eq. SM13, p. 9).

- id: dimless_time
  name: dimensionless time
  dimension: "dimensionless"
  description: Nondimensional time T = t / tau (p. 2, SM Fig. 2).

- id: dimless_position
  name: dimensionless spatial coordinate
  dimension: "dimensionless"
  description: Nondimensional 1D position X = x / lambda (p. 2).

- id: dimless_pattern_width
  name: dimensionless localized pattern width
  dimension: "dimensionless"
  description: Full Width at Half Maximum (FWHM) W of a localized pattern (SM Sec. I B & SM Table I, pp. 11-13).

- id: dimless_grad_c_sq_mean
  name: spatial mean squared actomyosin density gradient
  dimension: "dimensionless"
  description: Bifurcation order parameter <(d_X C)^2> = (1/L) int_{-L/2}^{L/2} (d_X C)^2 dX (Fig. 2, p. 3).

- id: relative_deviation_threshold
  name: relative deviation threshold for local nucleator averaging
  dimension: "dimensionless"
  description: Threshold relative deviation of N_i from its boundary value defining X_l and X_r (10% = 0.1, SM p. 5).

- id: grid_point_count
  name: spatial grid point count
  dimension: "dimensionless"
  description: Number of discrete spatial grid points N across domain L (Delta X = L / N, SM Fig. 3, p. 15).

- id: internal_peak_count
  name: number of internal peaks of a localized pattern
  dimension: "dimensionless"
  description: Integer index i of a multipeaked localized pattern LP_i (Fig. 1, p. 2).

- id: spatial_eigenvalue_real
  name: real part of spatial-dynamics eigenvalue
  dimension: "dimensionless"
  description: Real part Re(mu) of an eigenvalue of the linearized spatial-dynamics ODE system Eqs. (SM24)-(SM31) (Fig. 3c, p. 3).

- id: spatial_eigenvalue_imag
  name: imaginary part of spatial-dynamics eigenvalue
  dimension: "dimensionless"
  description: Magnitude of the imaginary part |Im(mu)| of an eigenvalue of the linearized spatial-dynamics ODE system Eqs. (SM24)-(SM31) (Fig. 3c, p. 3).

- id: eigenvalue_multiplicity
  name: algebraic multiplicity of a spatial-dynamics eigenvalue
  dimension: "dimensionless"
  description: Count of eigenvalues sharing a given real/complex value in the linearized spatial-dynamics spectrum (Fig. 3c caption, p. 3).

- id: boolean_indicator
  name: binary regime indicator
  dimension: "dimensionless"
  description: Dimensionless binary flag (0 or 1) indicating presence of a qualitative dynamical property (e.g. complex spatial eigenvalues).

- id: dimensionless_residual
  name: dimensionless PDE steady-state residual
  dimension: "dimensionless"
  description: Infinity norm of the discretized steady-state residual of Eqs. (SM1)-(SM5).

- id: viscous_stress_ratio_1d
  name: dimensionless 1D viscous stress coefficient
  dimension: "dimensionless"
  description: Coefficient multiplying d_X V in the dimensionless 1D stress tensor Sigma = coeff * d_X V + Pi(C) (1 in Eq. SM3 vs 2 from Eq. 3 as printed).

# Additional dimensionless quantities for calibrated figure readings (Fig. 3, SM Figs. 3-5)
- id: dimless_actomyosin_gradient
  name: dimensionless actomyosin density gradient
  dimension: "dimensionless"
  description: Spatial derivative d_X C of the dimensionless actomyosin density (horizontal axis of Fig. 3b, p. 3).

- id: spatial_eigenvalue_imag_signed
  name: signed imaginary part of spatial-dynamics eigenvalue
  dimension: "dimensionless"
  description: Signed imaginary part Im(mu) of a spatial-dynamics eigenvalue in the complex plane (vertical axis of Fig. 3c, p. 3).

- id: eigenvalue_index
  name: rank index of plotted spatial-dynamics eigenvalue
  dimension: "dimensionless"
  description: Integer rank index (1, 2, 3, 4) ordering plotted non-negative-real-part spatial-dynamics eigenvalues from left to right and bottom to top (Fig. 3c, p. 3).

- id: system_size_multiple
  name: system size multiple of L = 10 pi
  dimension: "dimensionless"
  description: Multiplicative domain size factor L_sys / L where L = 10*pi (horizontal axis 'System size (x L)' of SM Fig. 3 inset, p. 15).

- id: dimless_actomyosin_transport_rate
  name: dimensionless actomyosin transport divergence
  dimension: "dimensionless"
  description: Total negative flux divergence -d_X J_c = -d_X(C V - D_c d_X C) in Eq. (SM1) (SM Fig. 4, p. 16).

- id: dimless_actomyosin_reaction_rate
  name: dimensionless actomyosin net assembly rate
  dimension: "dimensionless"
  description: Reaction right-hand side R_c = A N_a - K_d C of Eq. (SM1) (SM Fig. 4, p. 16).

- id: dimless_actomyosin_advective_rate
  name: dimensionless actomyosin advective transport rate
  dimension: "dimensionless"
  description: Advective transport contribution -d_X J_c^a = -d_X(C V) of Eq. (SM1) (SM Fig. 5b, p. 17).

- id: dimless_actomyosin_diffusive_rate
  name: dimensionless actomyosin diffusive transport rate
  dimension: "dimensionless"
  description: Diffusive transport contribution -d_X J_c^d = D_c d_X^2 C of Eq. (SM1) (SM Fig. 5b, p. 17).

- id: dimless_active_nucleator_advective_rate
  name: dimensionless active nucleator advective transport rate
  dimension: "dimensionless"
  description: Advective transport contribution -d_X J_a^a = -d_X(N_a V) of Eq. (SM4) (SM Fig. 5c, p. 17).

- id: dimless_active_nucleator_diffusive_rate
  name: dimensionless active nucleator diffusive transport rate
  dimension: "dimensionless"
  description: Diffusive transport contribution -d_X J_a^d = D_a d_X^2 N_a of Eq. (SM4) (SM Fig. 5c, p. 17).

- id: dimless_inactive_nucleator_advective_rate
  name: dimensionless inactive nucleator advective transport rate
  dimension: "dimensionless"
  description: Advective transport contribution -d_X J_i^a = -d_X(N_i V) of Eq. (SM5) (SM Fig. 5d, p. 17).

- id: dimless_inactive_nucleator_diffusive_rate
  name: dimensionless inactive nucleator diffusive transport rate
  dimension: "dimensionless"
  description: Diffusive transport contribution -d_X J_i^d = D_i d_X^2 N_i of Eq. (SM5) (SM Fig. 5d, p. 17).

