id: pde_2d_time_eq1_5_printed
name: 2D periodic pseudo-spectral time integrator of Eqs. (1)-(5) with Eq. (3) as printed
role: model
built_from:
  - homogeneous_steady_state
stated:
  page: 4
  printed_page: "238401-4"
  quote: "FIG. 4. Localized states in 2D. (a),(b) Isotropically localized"
  where: "Eqs. 1-5 & Fig. 4"
equation: "2D nondimensional Eqs. (1)-(5) with eta = eta_tilde and printed Eq. (3) strain-rate tensor v = (1/2)[grad v + (grad v)^T - (div v / 2) 1]: (1 - 2.5 grad^2) V = grad Pi(C) for longitudinal flow"
inputs:
  L:
    quantity: dimless_system_size
    unit: dimensionless
  Dc:
    quantity: dimless_diffusivity_c
    unit: dimensionless
  Da:
    quantity: dimless_diffusivity_a
    unit: dimensionless
  Di:
    quantity: dimless_diffusivity_i
    unit: dimensionless
  A:
    quantity: dimless_assembly_rate
    unit: dimensionless
  Kd:
    quantity: dimless_disassembly_rate
    unit: dimensionless
  Omega0:
    quantity: dimless_basal_activation_rate
    unit: dimensionless
  Omega:
    quantity: dimless_cooperative_activation
    unit: dimensionless
  Omega_d0:
    quantity: dimless_spontaneous_inactivation
    unit: dimensionless
  Omega_d:
    quantity: dimless_actin_inactivation
    unit: dimensionless
  Z:
    quantity: dimless_active_stress_coeff
    unit: dimensionless
  B:
    quantity: dimless_passive_stress_coeff
    unit: dimensionless
  Nbar:
    quantity: dimless_mean_nucleator_density
    unit: dimensionless
  T_end:
    quantity: dimless_time
    unit: dimensionless
outputs:
  C_min:
    quantity: dimless_actomyosin_density
    unit: dimensionless
  C_max:
    quantity: dimless_actomyosin_density
    unit: dimensionless
  C_corner:
    quantity: dimless_actomyosin_density
    unit: dimensionless
settings:
  n_grid: 64
  dt: 0.025
  seed_width: 2.0
stochastic: false
