id: profile_fwhm_from_curve
name: Full Width Half Maximum (FWHM) W extracted from a 1D actomyosin density profile C(X)
role: processing
stated:
  page: 11
  printed_page: "SM-5"
  quote: "width W of the localized pattern as its Full Width Half Maximum (FWHM)."
  where: "SM Sec. I B"
equation: "W = X_right(C_half) - X_left(C_half), where C_half = (C_edge + max(C)) / 2"
inputs:
  profile_C:
    quantity: dimless_actomyosin_density
    unit: dimensionless
    curve:
      quantity: dimless_position
      unit: dimensionless
outputs:
  W:
    quantity: dimless_pattern_width
    unit: dimensionless
settings: {}
stochastic: false
