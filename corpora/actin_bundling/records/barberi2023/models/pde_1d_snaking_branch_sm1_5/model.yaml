role: model
built_from:
  - pde_1d_steady_state_sm1_5
stated:
  page: 3
  printed_page: "238401-3"
  quote: "FIG. 2. Slanted snaking. Bifurcation diagram of localized"
  where: "Fig. 2 & Eqs. SM1-SM5"
equation: "<(d_X C)^2>(Omega) = (1/L) int_{-L/2}^{L/2} (d_X C)^2 dX along stable branch LP_i via continuation"
