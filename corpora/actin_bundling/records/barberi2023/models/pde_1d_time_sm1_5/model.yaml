id: pde_1d_time_sm1_5
name: 1D periodic pseudo-spectral time integrator of Eqs. (SM1)-(SM5) (SM Fig. 2 travelling waves)
role: model
built_from:
  - homogeneous_steady_state
stated:
  page: 12
  printed_page: "SM-6"
  quote: "SM Figure 2: Travelling wave state observed at Z = 0, Ω = 30 (other parameters as in"
  where: "Eqs. SM1-SM5 & SM Fig. 2"
equation: "d_T C + d_X(V C - D_c d_X C) = A N_a - K_d C; d_T N_a + d_X J_a = R; d_T N_i + d_X J_i = -R; (1 - d_XX) V = d_X(Z C^2 - B C^3)"
inputs:
  L:
    quantity: dimless_system_size
    unit: dimensionless
  Dc:
    quantity: dimless_diffusivity_c
    unit: dimensionless
  Da:
    quantity: dimless_diffusivity_a
    unit: dimensionless
  Di:
    quantity: dimless_diffusivity_i
    unit: dimensionless
  A:
    quantity: dimless_assembly_rate
    unit: dimensionless
  Kd:
    quantity: dimless_disassembly_rate
    unit: dimensionless
  Omega0:
    quantity: dimless_basal_activation_rate
    unit: dimensionless
  Omega:
    quantity: dimless_cooperative_activation
    unit: dimensionless
  Omega_d0:
    quantity: dimless_spontaneous_inactivation
    unit: dimensionless
  Omega_d:
    quantity: dimless_actin_inactivation
    unit: dimensionless
  Z:
    quantity: dimless_active_stress_coeff
    unit: dimensionless
  B:
    quantity: dimless_passive_stress_coeff
    unit: dimensionless
  Nbar:
    quantity: dimless_mean_nucleator_density
    unit: dimensionless
  T_end:
    quantity: dimless_time
    unit: dimensionless
outputs:
  C_min:
    quantity: dimless_actomyosin_density
    unit: dimensionless
  C_max:
    quantity: dimless_actomyosin_density
    unit: dimensionless
  K_dom:
    quantity: dimless_wavenumber
    unit: dimensionless
settings:
  n_grid: 128
  dt: 0.05
  noise_amp: 0.01
  seed: 42
stochastic: true
