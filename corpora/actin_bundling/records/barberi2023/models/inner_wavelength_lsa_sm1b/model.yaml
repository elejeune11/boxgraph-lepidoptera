id: inner_wavelength_lsa_sm1b
name: local linear stability analysis for LP inner wavenumber (SM Sec. I B, exact N_bar = N_loc)
role: model
built_from:
  - linear_stability_1d_sm15
stated:
  page: 11
  printed_page: "SM-5"
  quote: "homogeneous state with N̄ = N̄loc and all other parameters as for the corresponding LP."
  where: "SM Sec. I B"
equation: "max_{K = n pi / W} Re[Phi(K; N_bar = N_loc)]; unstable band [K*_left, K*_right] where Re[Phi(K)] > 0"
inputs:
  N_loc:
    quantity: dimless_mean_nucleator_density
    unit: dimensionless
  W:
    quantity: dimless_pattern_width
    unit: dimensionless
  Dc:
    quantity: dimless_diffusivity_c
    unit: dimensionless
  Da:
    quantity: dimless_diffusivity_a
    unit: dimensionless
  A:
    quantity: dimless_assembly_rate
    unit: dimensionless
  Kd:
    quantity: dimless_disassembly_rate
    unit: dimensionless
  Omega0:
    quantity: dimless_basal_activation_rate
    unit: dimensionless
  Omega:
    quantity: dimless_cooperative_activation
    unit: dimensionless
  Omega_d0:
    quantity: dimless_spontaneous_inactivation
    unit: dimensionless
  Omega_d:
    quantity: dimless_actin_inactivation
    unit: dimensionless
  Z:
    quantity: dimless_active_stress_coeff
    unit: dimensionless
  B:
    quantity: dimless_passive_stress_coeff
    unit: dimensionless
outputs:
  K_star:
    quantity: dimless_wavenumber
    unit: dimensionless
  K_left:
    quantity: dimless_wavenumber
    unit: dimensionless
  K_right:
    quantity: dimless_wavenumber
    unit: dimensionless
  delta_K:
    quantity: dimless_wavenumber
    unit: dimensionless
  max_growth_rate:
    quantity: dimless_growth_rate
    unit: dimensionless
settings:
  n_modes: 120
stochastic: false
