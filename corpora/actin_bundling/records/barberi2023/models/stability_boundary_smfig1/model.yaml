id: stability_boundary_smfig1
name: linear stability boundary Omega_c(Z) of H (SM Fig. 1)
role: model
built_from:
  - linear_stability_1d_sm15
stated:
  page: 11
  printed_page: "SM-5"
  quote: "SM Figure 1: Stability diagram obtained from linear stability analysis. The homogeneous"
  where: "SM Fig. 1"
equation: "max_{K > 0} Re[Phi(K; Z, B=Z, Omega_c)] = 0"
inputs:
  Z:
    quantity: dimless_active_stress_coeff
    unit: dimensionless
  Dc:
    quantity: dimless_diffusivity_c
    unit: dimensionless
  Da:
    quantity: dimless_diffusivity_a
    unit: dimensionless
  A:
    quantity: dimless_assembly_rate
    unit: dimensionless
  Kd:
    quantity: dimless_disassembly_rate
    unit: dimensionless
  Omega0:
    quantity: dimless_basal_activation_rate
    unit: dimensionless
  Omega_d0:
    quantity: dimless_spontaneous_inactivation
    unit: dimensionless
  Omega_d:
    quantity: dimless_actin_inactivation
    unit: dimensionless
outputs:
  Omega_crit:
    quantity: dimless_cooperative_activation
    unit: dimensionless
  K_crit:
    quantity: dimless_wavenumber
    unit: dimensionless
  freq_crit:
    quantity: dimless_oscillation_frequency
    unit: dimensionless
  is_oscillatory:
    quantity: boolean_indicator
    unit: dimensionless
settings:
  n_k: 400
  k_min: 0.02
  k_max: 10.0
  omega_max: 40.0
stochastic: false
