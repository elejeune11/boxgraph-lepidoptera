id: homogeneous_steady_state_linear
name: homogeneous steady state H in linear kinetics limit (Omega = Omega_d = 0)
role: model
stated:
  page: 3
  printed_page: "238401-3"
  quote: "kinetics limit of Eqs. (4) and (5), with Ω ¼ Ωd ¼ 0."
  where: text
equation: "N_a,H = Omega_0 N_bar / (Omega_0 + Omega_d,0); C_H = (A/K_d) N_a,H; N_i,H = N_bar - N_a,H"
inputs:
  A:
    quantity: dimless_assembly_rate
    unit: dimensionless
  Kd:
    quantity: dimless_disassembly_rate
    unit: dimensionless
  Omega0:
    quantity: dimless_basal_activation_rate
    unit: dimensionless
  Omega_d0:
    quantity: dimless_spontaneous_inactivation
    unit: dimensionless
  Nbar:
    quantity: dimless_mean_nucleator_density
    unit: dimensionless
outputs:
  C_H:
    quantity: dimless_actomyosin_density
    unit: dimensionless
  Na_H:
    quantity: dimless_active_nucleator_density
    unit: dimensionless
  Ni_H:
    quantity: dimless_inactive_nucleator_density
    unit: dimensionless
  NH_minus:
    quantity: dimless_nucleator_difference
    unit: dimensionless
settings: {}
stochastic: false
