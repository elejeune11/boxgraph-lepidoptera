id: homogeneous_steady_state
name: homogeneous steady state H of Eqs. (SM1)-(SM5)
role: model
stated:
  page: 9
  printed_page: "SM-3"
  quote: "steady state H of Eqs. (SM1)–(SM5), i.e. CH = A(Na )H , (Na )H , (Ni )H = 1−(Na )H"
  where: "SM Sec. I A"
equation: "C_H = (A/K_d) N_a,H; Omega_0 (1 + Omega N_a,H^2) (N_bar - N_a,H) = (Omega_d,0 + Omega_d C_H) N_a,H"
inputs:
  A:
    quantity: dimless_assembly_rate
    unit: dimensionless
  Kd:
    quantity: dimless_disassembly_rate
    unit: dimensionless
  Omega0:
    quantity: dimless_basal_activation_rate
    unit: dimensionless
  Omega:
    quantity: dimless_cooperative_activation
    unit: dimensionless
  Omega_d0:
    quantity: dimless_spontaneous_inactivation
    unit: dimensionless
  Omega_d:
    quantity: dimless_actin_inactivation
    unit: dimensionless
  Z:
    quantity: dimless_active_stress_coeff
    unit: dimensionless
  B:
    quantity: dimless_passive_stress_coeff
    unit: dimensionless
  Nbar:
    quantity: dimless_mean_nucleator_density
    unit: dimensionless
outputs:
  C_H:
    quantity: dimless_actomyosin_density
    unit: dimensionless
  Na_H:
    quantity: dimless_active_nucleator_density
    unit: dimensionless
  Ni_H:
    quantity: dimless_inactive_nucleator_density
    unit: dimensionless
  NH_minus:
    quantity: dimless_nucleator_difference
    unit: dimensionless
  Pi_prime_H:
    quantity: dimless_nonviscous_stress_slope
    unit: dimensionless
settings: {}
stochastic: false
