id: spatial_dynamics_eigenvalues_sm24
name: spatial-dynamics 8x8 Jacobian eigenvalues linearized around H (Eqs. SM24-SM31, Fig. 3c)
role: model
built_from:
  - homogeneous_steady_state
stated:
  page: 14
  printed_page: "SM-8"
  quote: "The eigenvalues in Fig. 3c of the main text are calculated by performing a linear stability"
  where: "Eqs. SM24-SM31 & Fig. 3(c)"
equation: "Eigenvalues of the 8x8 Jacobian of Eqs. (SM24)-(SM31) for (C, Na, Ni, V, PC, Pa, Pi, PV) at H"
