id: linear_stability_1d_passive
name: 1D linear stability analysis in the passive fluid limit (Z = B = 0)
role: model
built_from:
  - homogeneous_steady_state
stated:
  page: 10
  printed_page: "SM-4"
  quote: "Note that instabilities are possible even if the fluid is passive (Z = 0),"
  where: "SM Sec. I A"
equation: "M u = Phi u of Eqs. (SM14)-(SM23) with Z = 0, B = 0 (Pi'_H = 0, delta V = 0)"
inputs:
  K:
    quantity: dimless_wavenumber
    unit: dimensionless
  Dc:
    quantity: dimless_diffusivity_c
    unit: dimensionless
  Da:
    quantity: dimless_diffusivity_a
    unit: dimensionless
  A:
    quantity: dimless_assembly_rate
    unit: dimensionless
  Kd:
    quantity: dimless_disassembly_rate
    unit: dimensionless
  Omega0:
    quantity: dimless_basal_activation_rate
    unit: dimensionless
  Omega:
    quantity: dimless_cooperative_activation
    unit: dimensionless
  Omega_d0:
    quantity: dimless_spontaneous_inactivation
    unit: dimensionless
  Omega_d:
    quantity: dimless_actin_inactivation
    unit: dimensionless
outputs:
  max_growth_rate:
    quantity: dimless_growth_rate
    unit: dimensionless
  dominant_freq:
    quantity: dimless_oscillation_frequency
    unit: dimensionless
settings: {}
stochastic: false
