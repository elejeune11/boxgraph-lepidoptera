id: inner_wavelength_lsa_sm15_literal
name: local linear stability analysis substituting H(N_loc) literally into printed Eqs. (SM15)-(SM23)
role: model
built_from:
  - linear_stability_1d_sm15
stated:
  page: 11
  printed_page: "SM-5"
  quote: "Specifically, K ∗ is the fastest growing mode of the linearized dynamics for a system of size"
  where: "SM Sec. I B & Eqs. SM15-SM23"
equation: "Printed Eqs. (SM15)-(SM23) with N_H^+ = 1 unscaled, C_H = (A/K_d) N_a,H(N_loc), N_H^- = 2 N_a,H(N_loc) - N_loc on K = n pi / W"
inputs:
  N_loc:
    quantity: dimless_mean_nucleator_density
    unit: dimensionless
  W:
    quantity: dimless_pattern_width
    unit: dimensionless
  Dc:
    quantity: dimless_diffusivity_c
    unit: dimensionless
  Da:
    quantity: dimless_diffusivity_a
    unit: dimensionless
  A:
    quantity: dimless_assembly_rate
    unit: dimensionless
  Kd:
    quantity: dimless_disassembly_rate
    unit: dimensionless
  Omega0:
    quantity: dimless_basal_activation_rate
    unit: dimensionless
  Omega:
    quantity: dimless_cooperative_activation
    unit: dimensionless
  Omega_d0:
    quantity: dimless_spontaneous_inactivation
    unit: dimensionless
  Omega_d:
    quantity: dimless_actin_inactivation
    unit: dimensionless
  Z:
    quantity: dimless_active_stress_coeff
    unit: dimensionless
  B:
    quantity: dimless_passive_stress_coeff
    unit: dimensionless
outputs:
  K_star:
    quantity: dimless_wavenumber
    unit: dimensionless
  K_left:
    quantity: dimless_wavenumber
    unit: dimensionless
  K_right:
    quantity: dimless_wavenumber
    unit: dimensionless
  delta_K:
    quantity: dimless_wavenumber
    unit: dimensionless
  max_growth_rate:
    quantity: dimless_growth_rate
    unit: dimensionless
settings:
  n_modes: 120
stochastic: false
