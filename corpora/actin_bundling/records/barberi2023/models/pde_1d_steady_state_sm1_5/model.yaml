id: pde_1d_steady_state_sm1_5
name: 1D symmetric steady-state solver of Eqs. (SM1)-(SM5) (Figs. 1-3, SM Fig. 3, SM Table I)
role: model
built_from:
  - homogeneous_steady_state
stated:
  page: 8
  printed_page: "SM-2"
  quote: "To start, we formulate the equations in non-dimensional units, SM Table II. Eq. (1) of"
  where: "Eqs. SM1-SM5, SM Fig. 3, SM Table I"
equation: "d_X(V C - D_c d_X C) = A N_a - K_d C; d_X(d_X V + Z C^2 - B C^3) = V; d_X(V N_a - D_a d_X N_a) = R; d_X(V N_i - D_i d_X N_i) = -R"
inputs:
  L:
    quantity: dimless_system_size
    unit: dimensionless
  Dc:
    quantity: dimless_diffusivity_c
    unit: dimensionless
  Da:
    quantity: dimless_diffusivity_a
    unit: dimensionless
  Di:
    quantity: dimless_diffusivity_i
    unit: dimensionless
  A:
    quantity: dimless_assembly_rate
    unit: dimensionless
  Kd:
    quantity: dimless_disassembly_rate
    unit: dimensionless
  Omega0:
    quantity: dimless_basal_activation_rate
    unit: dimensionless
  Omega:
    quantity: dimless_cooperative_activation
    unit: dimensionless
  Omega_d0:
    quantity: dimless_spontaneous_inactivation
    unit: dimensionless
  Omega_d:
    quantity: dimless_actin_inactivation
    unit: dimensionless
  Z:
    quantity: dimless_active_stress_coeff
    unit: dimensionless
  B:
    quantity: dimless_passive_stress_coeff
    unit: dimensionless
  Nbar:
    quantity: dimless_mean_nucleator_density
    unit: dimensionless
  rel_dev_thresh:
    quantity: relative_deviation_threshold
    unit: dimensionless
outputs:
  C_max:
    quantity: dimless_actomyosin_density
    unit: dimensionless
  C_min:
    quantity: dimless_actomyosin_density
    unit: dimensionless
  Na_max:
    quantity: dimless_active_nucleator_density
    unit: dimensionless
  Ni_max:
    quantity: dimless_inactive_nucleator_density
    unit: dimensionless
  V_max:
    quantity: dimless_velocity
    unit: dimensionless
  grad_C_sq_mean:
    quantity: dimless_grad_c_sq_mean
    unit: dimensionless
  N_loc:
    quantity: dimless_mean_nucleator_density
    unit: dimensionless
  W:
    quantity: dimless_pattern_width
    unit: dimensionless
  K_obs:
    quantity: dimless_wavenumber
    unit: dimensionless
  n_internal_peaks:
    quantity: internal_peak_count
    unit: dimensionless
  max_residual:
    quantity: dimensionless_residual
    unit: dimensionless
settings:
  branch: "spike"
  n_grid: 1024
stochastic: false
