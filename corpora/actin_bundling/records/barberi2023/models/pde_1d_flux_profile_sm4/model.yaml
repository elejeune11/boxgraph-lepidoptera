id: pde_1d_flux_profile_sm4
name: 1D steady-state transport divergence -d_X J_c, reaction R_c, and velocity V (SM Fig. 4)
role: model
built_from:
  - pde_1d_steady_state_sm1_5
stated:
  page: 16
  printed_page: "SM-10"
  quote: "SM Figure 4: This figure corresponds to the localized patterns LP0 (left) and LP3 (right)"
  where: "SM Fig. 4 & Eq. SM1"
equation: "-d_X J_c = -d_X(C V - D_c d_X C), R_c = A N_a - K_d C, and V(X) on steady states of Eqs. (SM1)-(SM5)"
inputs:
  L:
    quantity: dimless_system_size
    unit: dimensionless
  Dc:
    quantity: dimless_diffusivity_c
    unit: dimensionless
  Da:
    quantity: dimless_diffusivity_a
    unit: dimensionless
  Di:
    quantity: dimless_diffusivity_i
    unit: dimensionless
  A:
    quantity: dimless_assembly_rate
    unit: dimensionless
  Kd:
    quantity: dimless_disassembly_rate
    unit: dimensionless
  Omega0:
    quantity: dimless_basal_activation_rate
    unit: dimensionless
  Omega:
    quantity: dimless_cooperative_activation
    unit: dimensionless
  Omega_d0:
    quantity: dimless_spontaneous_inactivation
    unit: dimensionless
  Omega_d:
    quantity: dimless_actin_inactivation
    unit: dimensionless
  Z:
    quantity: dimless_active_stress_coeff
    unit: dimensionless
  B:
    quantity: dimless_passive_stress_coeff
    unit: dimensionless
  Nbar:
    quantity: dimless_mean_nucleator_density
    unit: dimensionless
  ref_V:
    quantity: dimless_velocity
    unit: dimensionless
    curve:
      quantity: dimless_position
      unit: dimensionless
outputs:
  V_curve:
    quantity: dimless_velocity
    unit: dimensionless
    curve:
      quantity: dimless_position
      unit: dimensionless
  neg_dX_Jc_curve:
    quantity: dimless_actomyosin_transport_rate
    unit: dimensionless
    curve:
      quantity: dimless_position
      unit: dimensionless
  Rc_curve:
    quantity: dimless_actomyosin_reaction_rate
    unit: dimensionless
    curve:
      quantity: dimless_position
      unit: dimensionless
settings:
  branch: "lp0"
  n_grid: 1024
  abs_x_max: null
stochastic: false
