id: pde_1d_phase_orbit_sm1_5
name: 1D spatial-dynamics homoclinic orbit projection C(d_X C) (Fig. 3b)
role: model
built_from:
  - pde_1d_steady_state_sm1_5
stated:
  page: 3
  printed_page: "238401-3"
  quote: "projected onto the (C, dC/dX) plane."
  where: "Fig. 3(b)"
equation: "Parametric steady-state trajectory (d_X C(X), C(X)) of Eqs. (SM1)-(SM5) split into upper and lower branches"
inputs:
  L:
    quantity: dimless_system_size
    unit: dimensionless
  Dc:
    quantity: dimless_diffusivity_c
    unit: dimensionless
  Da:
    quantity: dimless_diffusivity_a
    unit: dimensionless
  Di:
    quantity: dimless_diffusivity_i
    unit: dimensionless
  A:
    quantity: dimless_assembly_rate
    unit: dimensionless
  Kd:
    quantity: dimless_disassembly_rate
    unit: dimensionless
  Omega0:
    quantity: dimless_basal_activation_rate
    unit: dimensionless
  Omega:
    quantity: dimless_cooperative_activation
    unit: dimensionless
  Omega_d0:
    quantity: dimless_spontaneous_inactivation
    unit: dimensionless
  Omega_d:
    quantity: dimless_actin_inactivation
    unit: dimensionless
  Z:
    quantity: dimless_active_stress_coeff
    unit: dimensionless
  B:
    quantity: dimless_passive_stress_coeff
    unit: dimensionless
  Nbar:
    quantity: dimless_mean_nucleator_density
    unit: dimensionless
  ref_orbit:
    quantity: dimless_actomyosin_density
    unit: dimensionless
    curve:
      quantity: dimless_actomyosin_gradient
      unit: dimensionless
outputs:
  C_upper_curve:
    quantity: dimless_actomyosin_density
    unit: dimensionless
    curve:
      quantity: dimless_actomyosin_gradient
      unit: dimensionless
  C_lower_curve:
    quantity: dimless_actomyosin_density
    unit: dimensionless
    curve:
      quantity: dimless_actomyosin_gradient
      unit: dimensionless
settings:
  branch: "spike"
  n_grid: 1024
stochastic: false
