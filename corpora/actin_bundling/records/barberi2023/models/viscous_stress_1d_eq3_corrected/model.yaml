id: viscous_stress_1d_eq3_corrected
name: 1D viscous stress from Eq. (3) with traceless strain-rate tensor corrected
role: model
variant_of: viscous_stress_1d_eq3
corrections:
  - equation: "Eq. 3 (strain-rate tensor definition, p. 1)"
    change: "Subtract (div v / d) 1 outside the factor of 1/2 (equivalently -2 (div v / d) 1 inside brackets) so Tr(v) = 0, giving 2 eta (1 - 1/d) + eta_tilde instead of eta (2 - 1/d) + eta_tilde."
    evidence: "The text on p. 1 defines v as the 'traceless strain rate tensor', whereas Tr((1/2)[grad v + (grad v)^T - (div v / d) 1]) = (1/2) div v != 0. Moreover, in d = 1 with eta = eta_tilde, Eq. (SM3) on p. 8 prints Sigma = d_X V + Pi(C) (viscous coefficient 1, not 2), and numerical spike solutions in SM Fig. 3 vanish if the viscous coefficient is 2."
stated:
  page: 1
  printed_page: "238401-1"
  quote: "active fluid, v ¼ ð1=2Þ½∇v þ ð∇vÞT − ð∇ · v=dÞ1  is the"
  where: "Eq. 3"
equation: "sigma_visc = [2 eta (1 - 1/d) + eta_tilde] d_x v; coeff_1d = sigma_visc / (eta d_x v)"
inputs:
  eta:
    quantity: shear_viscosity
    unit: Pa*s
  eta_tilde:
    quantity: bulk_viscosity
    unit: Pa*s
  d:
    quantity: spatial_dimension
    unit: dimensionless
  dv_dx:
    quantity: velocity_gradient_1d
    unit: 1/s
outputs:
  sigma_visc:
    quantity: viscous_stress_1d
    unit: Pa
  viscous_coeff:
    quantity: viscous_stress_ratio_1d
    unit: dimensionless
settings: {}
stochastic: false
