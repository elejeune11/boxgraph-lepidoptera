id: linear_stability_1d_sm15
name: 1D linear stability analysis matrix M(K) around H (Eqs. SM13-SM23)
role: model
built_from:
  - homogeneous_steady_state
stated:
  page: 10
  printed_page: "SM-4"
  quote: "We are ready to investigate the stability of H by numerically evaluating the eigenvalues"
  where: "Eqs. SM14-SM23"
equation: "M u = Phi u with u = (delta C, delta N+, delta N-) and entries Eqs. (SM15)-(SM23)"
inputs:
  K:
    quantity: dimless_wavenumber
    unit: dimensionless
  Dc:
    quantity: dimless_diffusivity_c
    unit: dimensionless
  Da:
    quantity: dimless_diffusivity_a
    unit: dimensionless
  A:
    quantity: dimless_assembly_rate
    unit: dimensionless
  Kd:
    quantity: dimless_disassembly_rate
    unit: dimensionless
  Omega0:
    quantity: dimless_basal_activation_rate
    unit: dimensionless
  Omega:
    quantity: dimless_cooperative_activation
    unit: dimensionless
  Omega_d0:
    quantity: dimless_spontaneous_inactivation
    unit: dimensionless
  Omega_d:
    quantity: dimless_actin_inactivation
    unit: dimensionless
  Z:
    quantity: dimless_active_stress_coeff
    unit: dimensionless
  B:
    quantity: dimless_passive_stress_coeff
    unit: dimensionless
outputs:
  max_growth_rate:
    quantity: dimless_growth_rate
    unit: dimensionless
  dominant_freq:
    quantity: dimless_oscillation_frequency
    unit: dimensionless
  vel_response_imag:
    quantity: dimless_velocity_response_coeff
    unit: dimensionless
settings: {}
stochastic: false
