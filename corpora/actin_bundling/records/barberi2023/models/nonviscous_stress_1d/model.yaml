id: nonviscous_stress_1d
name: dimensionless nonviscous active and passive stress Pi(C) = Z C^2 - B C^3
role: model
stated:
  page: 8
  printed_page: "SM-2"
  quote: "with Π(C) = ZC 2 − BC 3 . Finally, Eqs. (4–5) read"
  where: "Eq. SM3"
equation: "Pi(C) = Z C^2 - B C^3; Pi'(C) = 2 Z C - 3 B C^2"
inputs:
  C:
    quantity: dimless_actomyosin_density
    unit: dimensionless
  Z:
    quantity: dimless_active_stress_coeff
    unit: dimensionless
  B:
    quantity: dimless_passive_stress_coeff
    unit: dimensionless
outputs:
  Pi:
    quantity: dimless_nonviscous_stress
    unit: dimensionless
  Pi_prime:
    quantity: dimless_nonviscous_stress_slope
    unit: dimensionless
settings: {}
stochastic: false
