notes: >
  Read stage of Barberi & Kruse, Phys. Rev. Lett. 131, 238401 (2023) together with its
  12-page Supplementary Material (PDF pp. 1-18). All 18 per-page text files (text/page-001.txt
  through page-018.txt) and all 18 rendered page images (pages/page-001.png through page-018.png)
  were inspected; zoomed crops of Fig. 1 and Fig. 3 were also examined to verify peak counts,
  widths, and plotted eigenvalue locations.
  Scope included: dimensional active-fluid mechanochemical equations (Main Text Eqs. 1-5),
  characteristic scales lambda = sqrt(eta/gamma) and tau = lambda^2/D_i, nonviscous active and
  passive stress Pi(C) = Z C^2 - B C^3, viscous stress Eq. (3) in 1D as printed together with
  its traceless-corrected variant matching Eq. (SM3), nondimensional parameter definitions
  (SM Table II), nondimensional 1D PDEs Eqs. (SM1)-(SM5) and conserved-variable form (SM6)-(SM8),
  homogeneous steady state H and its linear-kinetics limit (Omega = Omega_d = 0), 1D linear
  stability matrix M(K) Eqs. (SM9)-(SM23) and its passive-fluid limit (Z = B = 0), linear
  stability boundary in the (Z, Omega) plane (SM Fig. 1), local linear stability analysis for
  the inner wavelength of localized patterns (SM Sec. I B & SM Table I, both exact N_bar = N_loc
  rescaling and literal printed-matrix evaluation), 8D spatial-dynamics ODE system Eqs. (SM24)-(SM31)
  and its Jacobian eigenvalues around H (Fig. 3c), 1D steady-state localized patterns LP0 and
  LP2-LP7 and spike solutions across system sizes L x 1..32 (Figs. 1-3, SM Fig. 3, SM Table I),
  1D travelling-wave time evolution at Z = 0, Omega = 30 (SM Fig. 2), and 2D localized-state
  PDE time evolution (Fig. 4). All printed parameter values, SM Table I entries (36 values across
  LP2-LP7), SM Table II parameters, SM Fig. 3 asymptotic peak saturation C_max ~= 0.68, and Fig. 3(c)
  eigenvalue multiplicity claim are recorded and compared. Symbolic domain lengths L = 10*pi and
  32*L = 320*pi are entered as full-precision decimal strings because the printed-value parser
  requires decimal syntax.
  Key consistency findings: (1) Eq. (3) on p. 1 prints a non-traceless strain-rate tensor
  v = (1/2)[grad v + (grad v)^T - (div v / d) 1] missing a factor of 2 on the trace term, which in
  1D with eta = eta_tilde yields Sigma = 2 d_X V + Pi(C) rather than Eq. (SM3)'s Sigma = d_X V + Pi(C)
  (corrected via variant_of model viscous_stress_1d_eq3_corrected); (2) SM Table II prints A = A*tau
  instead of A = alpha*tau (p. 8 prints A = alpha*tau); (3) SM p. 5 prints the lower integration limit
  of N_loc as -X_l instead of X_l; (4) Fig. 3(c) and its caption claim an eigenvalue with real part 1
  of multiplicity 4 and plot only non-negative real parts ({0, 1, 30.5, 100} for the spike and
  {0, 1, 56.34 +- 18.46i} for LP0), which are the eigenvalues of the decoupled 3x3 reaction-diffusion
  sub-block plus unit eigenvalues rather than the true reversible 8x8 Jacobian of Eqs. (SM24)-(SM31)
  ({0 (x2), +-1.308, +-2.861, +-7.580} for the spike and {0 (x2), +-0.670, +-4.640 +- 3.891i} for LP0);
  (5) SM Table I's K*, K*_left, K*_right are not reproduced by exact linear stability analysis at
  N_bar = N_loc (which yields K* ~ 1.1-1.25 and K*_right ~ 4.0-5.5), whereas literally evaluating
  Eqs. (SM15)-(SM23) with N_H^+ = 1 unscaled while substituting C_H(N_loc) and N_H^- = 2 N_a,H - N_loc
  reproduces 8 of 18 entries exactly (13 of 18 within propagated input rounding) and matches the
  overall band scale; furthermore, our converged 1D PDE solutions reproduce Fig. 1(b)-(g) widths
  and inner wavenumbers closely and SM Table I N_loc within ~0.01, while SM Table I prints noticeably
  larger W and smaller K_obs for LP3, LP5, LP6, LP7 than shown in Fig. 1(c, e-g); (6) the solid
  stability boundary in SM Fig. 1 for Z in [2.78, 23.08] is actually a long-wavelength (Type II_s,
  K_c -> 0) instability rather than finite-wavelength Type I_s.
  Independent audit additions (audit.md): added verbatim printed Eq. (3) 2D base model
  pde_2d_time_eq1_5_printed ((1 + 2.5|K|^2), which decays to H at Fig. 4a parameters) with
  pde_2d_time_eq1_5 linked as variant_of, fixed relations.yaml output_map so both reductions verify,
  and added open questions for the unsettled spike grid and wave dt refinements and SM Table I metrics.
  Left out: (1) bibliographic numbers, grant/DOI strings, axis tick endpoints and colorbar labels
  that feed no model (e.g. SM Fig. 5 zoom window X in [14.7, 16.6], Fig. 4 colorbar ticks 0.2 and 1.1);
  (2) calibrated figure digitization of plotted curves in Figs. 1-4 and SM Figs. 1-6, which belongs
  to the separate digitize stage (models ready to sweep those curves are authored and tested here).
