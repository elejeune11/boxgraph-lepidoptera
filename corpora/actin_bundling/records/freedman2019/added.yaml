  basis: "Representative 5% stretched link length (1.05 um vs l_a = 1 um) to evaluate single-link energy SI Eq. (1)."
  alternatives: ["1.01", "1.1"]
  stands_for: "|r_i - r_{i-1}| in SI Eq. (1)"

