- id: kexv_energy_scale_added
  quantity: excluded_volume_energy_scale
  unit: pN*um
  printed: "0.08"
  basis: >
    Table S1 and Fig. 2D caption print k_exv = 0.08 pN*um^2, but SI Eq. (3) U_ij = k_exv (1 - r_ij/r_max)^2
    multiplies k_exv by a dimensionless factor, requiring k_exv to have units of energy (pN*um).
  alternatives: ["0.004", "0.8"]
  stands_for: "k_exv in SI Eq. (3) with dimensionally consistent energy units"

- id: bead_hydrodynamic_radius_added
  quantity: particle_radius
  unit: um
  printed: "0.05"
  basis: >
    SI Eq. (6) specifies Stokes mobility mu = 1/(6 pi R nu), but Table S1 omits particle radius R.
    A typical AFINES coarse-grained bead/head radius of order 0.05 um (equal to r_max = 0.05 um) is assumed
    for evaluating mobility and Brownian step models.
  alternatives: ["0.005", "0.5"]
  stands_for: "R in Stokes relation mu = 1/(6 pi R nu), SI Eq. (6)"

- id: test_sep_exv_added
  quantity: interaction_distance
  unit: um
  printed: "0.025"
  basis: "Midpoint separation r_ij = r_max / 2 = 0.025 um chosen to exercise SI Eq. (3) inside its cutoff r_max = 0.05 um."
  alternatives: ["0.01", "0.04"]
  stands_for: "|r_ij| in SI Eq. (3)"

- id: test_link_length_stretched_added
