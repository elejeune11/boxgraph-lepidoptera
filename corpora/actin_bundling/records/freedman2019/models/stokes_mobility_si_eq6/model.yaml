id: stokes_mobility_si_eq6
name: Stokes hydrodynamic mobility and Einstein diffusion (SI Eq. 6)
role: model
stated:
  page: 9
  printed_page: "SI-3"
  quote: "use the Stokes relation µ = 1/(6πRν) in the damping term"
  where: SI Eq. 6
equation: "mu = 1 / (6 pi R nu); D = k_B T mu"
inputs:
  R: {quantity: particle_radius, unit: um}
  nu: {quantity: dynamic_viscosity, unit: Pa*s}
  T: {quantity: temperature, unit: K}
outputs:
  mu: {quantity: stokes_mobility, unit: um/(pN*s)}
  D: {quantity: diffusion_coefficient, unit: um^2/s}
settings: {}
stochastic: false
