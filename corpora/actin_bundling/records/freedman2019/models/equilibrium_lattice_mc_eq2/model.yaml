id: equilibrium_lattice_mc_eq2
name: 1D equilibrium lattice Metropolis Monte Carlo simulation (Eq. 2 & Fig. 2B-D)
role: model
stated:
  page: 3
  printed_page: "16194"
  quote: "state of the lattice using the Metropolis algorithm: iteratively, we"
  where: Eq. 2 & Fig. 2B-D
equation: "U_lat = -(N_S mu_S + N_L mu_L) + sum_{g in gaps} U(l_g), Metropolis acceptance min(1, exp(-Delta U_lat / (k_B T)))"
inputs:
  L_0: {quantity: filament_length, unit: um}
  l_b: {quantity: binding_site_spacing, unit: nm}
  L_p: {quantity: filament_persistence_length, unit: um}
  delta_l_xl: {quantity: crosslinker_length_difference, unit: nm}
  mu_S_kBT: {quantity: chemical_potential_thermal, unit: dimensionless}
  mu_L_kBT: {quantity: chemical_potential_thermal, unit: dimensionless}
  n_d: {quantity: domain_min_crosslinkers, unit: dimensionless}
  l_d: {quantity: domain_max_gap, unit: um}
outputs:
  domain_length: {quantity: domain_length, unit: um}
  domain_length_short: {quantity: domain_length, unit: um}
  domain_length_long: {quantity: domain_length, unit: um}
settings:
  n_sweeps: 200
  n_sims: 20
  seed: 0
built_from:
  - gap_bending_energy_eq1
  - lattice_site_count
  - equilibrium_lattice_energy_eq2
stochastic: true
