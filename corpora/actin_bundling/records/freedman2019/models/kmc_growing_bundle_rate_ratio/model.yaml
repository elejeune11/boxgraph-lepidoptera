id: kmc_growing_bundle_rate_ratio
name: growing 2-filament bundle 1D KMC parameterized by dimensionless growth-to-bundling rate ratio (Fig. S3C)
role: model
stated:
  page: 12
  printed_page: "SI-6"
  quote: "Many simulations collapse onto one curve, showing that the amount of competition"
  where: Fig. S3C
equation: "r_grow / mu_on = rate_ratio = (mu_grow / l_b) / mu_on at equal bundling rates mu_on_A = mu_on_B in kmc_growing_bundle_fig3"
inputs:
  rate_ratio: {quantity: growth_to_bundling_ratio, unit: dimensionless}
  L_0: {quantity: filament_length, unit: um}
  l_b: {quantity: binding_site_spacing, unit: nm}
  L_p: {quantity: filament_persistence_length, unit: um}
  delta_l_xl: {quantity: crosslinker_length_difference, unit: nm}
  n_d: {quantity: domain_min_crosslinkers, unit: dimensionless}
  l_d: {quantity: domain_max_gap, unit: um}
outputs:
  switching_ratio: {quantity: switching_rate_ratio, unit: dimensionless}
  epsilon_predicted: {quantity: switching_barrier_thermal, unit: dimensionless}
  domain_length_A: {quantity: domain_length, unit: um}
  domain_length_B: {quantity: domain_length, unit: um}
settings:
  n_sims: 200
  seed: 0
built_from:
  - kmc_growing_bundle_fig3
  - kmc_rate_ratio_figs3c
stochastic: true
