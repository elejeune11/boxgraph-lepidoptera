id: filament_growth_rate_si_eq2
name: AFINES barbed-end polymerization rate and step probability (SI Eq. 2)
role: model
stated:
  page: 8
  printed_page: "SI-2"
  quote: "kg ∆la is thus the growth rate"
  where: SI Eq. 2
equation: "k_grow = k_g * Delta l_a; P(l_{a,1} + Delta l_a | l_{a,1}) = k_g * Delta t"
inputs:
  k_g: {quantity: segment_addition_rate, unit: 1/s}
  delta_l_a: {quantity: segment_growth_increment, unit: um}
  dt: {quantity: observation_time, unit: s}
outputs:
  k_grow: {quantity: polymerization_rate, unit: nm/s}
  P_step: {quantity: growth_step_probability, unit: dimensionless}
settings: {}
stochastic: false
