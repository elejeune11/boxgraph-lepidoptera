id: excluded_volume_si_eq3_printed
name: AFINES excluded volume potential as printed with Table S1 units (SI Eq. 3)
role: model
stated:
  page: 8
  printed_page: "SI-2"
  quote: "restricted from overlapping via a soft (Hookean) excluded volume interaction"
  where: SI Eq. 3 & Table S1
equation: "U_ij = k_exv * (1 - r_ij / r_max)^2 for |r_ij| < r_max, 0 for |r_ij| > r_max (with printed k_exv in pN*um^2)"
inputs:
  k_exv: {quantity: excluded_volume_stiffness_printed, unit: pN*um^2}
  r_ij: {quantity: interaction_distance, unit: um}
  r_max: {quantity: interaction_distance, unit: um}
outputs:
  U_ij: {quantity: excluded_volume_potential_printed, unit: pN*um^2}
settings: {}
stochastic: false
