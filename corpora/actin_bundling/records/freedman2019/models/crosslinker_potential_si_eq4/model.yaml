id: crosslinker_potential_si_eq4
name: AFINES cross-linker stretch, bend, and binding potential (SI Eq. 4)
role: model
stated:
  page: 8
  printed_page: "SI-2"
  quote: "Thus, the potential energy of a crosslinker is"
  where: SI Eq. 4
equation: "U_xl = (1/2) k_xl (r - l_xl)^2 + kappa_xl^B sum_{i in {L,R}} (alpha_i - pi/2)^2 I_i - k_B T [ln(k^{on,1}/k^{off,1})(I_L or I_R) + ln(k^{on,2}/k^{off,2})(I_L and I_R)]"
inputs:
  k_xl: {quantity: stretching_stiffness, unit: pN/um}
  r: {quantity: interaction_distance, unit: um}
  l_xl: {quantity: crosslinker_length, unit: um}
  kappa_xl_B: {quantity: crosslinker_bending_stiffness, unit: pN*um}
  alpha_L: {quantity: filament_bend_angle, unit: rad}
  alpha_R: {quantity: filament_bend_angle, unit: rad}
  I_L: {quantity: bound_head_indicator, unit: dimensionless}
  I_R: {quantity: bound_head_indicator, unit: dimensionless}
  k_on_1: {quantity: head_binding_rate, unit: 1/s}
  k_off_1: {quantity: head_binding_rate, unit: 1/s}
  k_on_2: {quantity: head_binding_rate, unit: 1/s}
  k_off_2: {quantity: head_binding_rate, unit: 1/s}
  T: {quantity: temperature, unit: K}
outputs:
  U_stretch: {quantity: mechanical_energy, unit: pN*um}
  U_bend: {quantity: mechanical_energy, unit: pN*um}
  U_bind: {quantity: mechanical_energy, unit: pN*um}
  U_xl: {quantity: mechanical_energy, unit: pN*um}
settings: {}
stochastic: false
