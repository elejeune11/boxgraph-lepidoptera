id: kmc_growing_bundle_conc_ratio
name: growing 2-filament bundle 1D KMC parameterized by cross-linker concentration ratio (Fig. 3C Left)
role: model
stated:
  page: 4
  printed_page: "16195"
  quote: "Left) domain size from the KMC model and experimental data from ref."
  where: Fig. 3C (Left)
equation: "mu_on_A = conc_ratio * mu_on_B in kmc_growing_bundle_fig3"
inputs:
  conc_ratio: {quantity: concentration_ratio, unit: dimensionless}
  mu_grow: {quantity: polymerization_rate, unit: nm/s}
  mu_on_B: {quantity: binding_rate_per_site, unit: 1/s}
  L_0: {quantity: filament_length, unit: um}
  l_b: {quantity: binding_site_spacing, unit: nm}
  L_p: {quantity: filament_persistence_length, unit: um}
  delta_l_xl: {quantity: crosslinker_length_difference, unit: nm}
  n_d: {quantity: domain_min_crosslinkers, unit: dimensionless}
  l_d: {quantity: domain_max_gap, unit: um}
outputs:
  switching_ratio: {quantity: switching_rate_ratio, unit: dimensionless}
  epsilon_predicted: {quantity: switching_barrier_thermal, unit: dimensionless}
  domain_length_A: {quantity: domain_length, unit: um}
  domain_length_B: {quantity: domain_length, unit: um}
settings:
  n_sims: 1000
  seed: 0
built_from:
  - kmc_growing_bundle_fig3
stochastic: true
