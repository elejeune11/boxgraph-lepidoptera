id: force_lever_rule_si_eq5
name: AFINES cross-linker tensile force lever rule (SI Eq. 5)
role: model
stated:
  page: 8
  printed_page: "SI-2"
  quote: "propagated onto the filament beads neighboring each bound head at position"
  where: SI Eq. 5
equation: "F_i = F_xl * |r_{i+1} - r_xl| / |r_{i+1} - r_i|; F_{i+1} = F_xl - F_i"
inputs:
  F_xl: {quantity: mechanical_force, unit: pN}
  d_next: {quantity: interaction_distance, unit: um}
  l_link: {quantity: filament_link_length, unit: um}
outputs:
  F_i: {quantity: mechanical_force, unit: pN}
  F_i_plus_1: {quantity: mechanical_force, unit: pN}
settings: {}
stochastic: false
