id: persistence_length_from_kappa_b
name: filament persistence length from bending modulus (SI Section A)
role: model
stated:
  page: 8
  printed_page: "SI-2"
  quote: "The persistence length of the filament is then Lp = κB /kB T"
  where: SI Section A
equation: "L_p = kappa_B / (k_B T)"
inputs:
  kappa_B: {quantity: bending_modulus, unit: pN*um^2}
  T: {quantity: temperature, unit: K}
outputs:
  L_p: {quantity: filament_persistence_length, unit: um}
settings: {}
stochastic: false
