id: filament_potential_si_eq1
name: AFINES single-link filament stretching and bending energy (SI Eq. 1)
role: model
stated:
  page: 8
  printed_page: "SI-2"
  quote: "internal forces on an actin filament can be obtained from the gradient"
  where: SI Eq. 1
equation: "U_f = (k_a / 2) * (r - l_a)^2 + (kappa_B / (2 l_a)) * theta^2"
inputs:
  k_a: {quantity: stretching_stiffness, unit: pN/um}
  r: {quantity: interaction_distance, unit: um}
  l_a: {quantity: filament_link_length, unit: um}
  kappa_B: {quantity: bending_modulus, unit: pN*um^2}
  theta: {quantity: filament_bend_angle, unit: rad}
outputs:
  U_stretch: {quantity: mechanical_energy, unit: pN*um}
  U_bend: {quantity: mechanical_energy, unit: pN*um}
  U_f: {quantity: mechanical_energy, unit: pN*um}
settings: {}
described_from: ref-si-1
stochastic: false
