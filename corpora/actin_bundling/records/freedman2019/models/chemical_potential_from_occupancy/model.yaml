id: chemical_potential_from_occupancy
name: single-species Boltzmann lattice occupancy and chemical potential (SI Section C)
role: model
stated:
  page: 9
  printed_page: "SI-3"
  quote: "determine the average lattice occupancy number"
  where: SI Section C
equation: "N^b = N / (1 + exp(-mu / (k_B T))); mu / (k_B T) = -ln(N / N^b - 1)"
inputs:
  N: {quantity: lattice_site_count, unit: dimensionless}
  mu_kBT: {quantity: chemical_potential_thermal, unit: dimensionless}
outputs:
  N_b: {quantity: occupied_site_count, unit: dimensionless}
  mu_kBT_inv: {quantity: chemical_potential_thermal, unit: dimensionless}
settings: {}
stochastic: false
