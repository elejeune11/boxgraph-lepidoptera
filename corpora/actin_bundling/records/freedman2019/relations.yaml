- id: rel_code_kmc_nb_bending_same_as_eq1
  kind: same_as
  a: freedman2019_code/kmc_notebook_bending_and_switching
  b: freedman2019/gap_bending_energy_eq1
  mapping:
    L_p: "Lp"
    delta_l_xl: "l_long - l_short"
    l_g: "x_sites * site_width"
    T: "300"
  output_map:
    U_kBT: U_kBT
  regime:
    site_width: [30.0, 45.0]
    l_long: [30.0, 50.0]
    l_short: [5.0, 15.0]
    Lp: [5.0, 50.0]
    x_sites: [3.0, 20.0]
    max_filament_length: [10000.0, 20000.0]
  provenance: proposed
  reason: >
    The live `software: true` adapter `freedman2019_code/kmc_notebook_bending_and_switching`
    executes unmodified `f(x, Lp)` from `xlink_sorting_paper/kmc.ipynb` Cell 3 directly against
    `$BOXGRAPH_SOURCE`: `(Lp*1e3/site_width)/x * arcsin((dxl/site_width)/x)^2`. This is
    algebraically identical to `freedman2019/gap_bending_energy_eq1` (`U_kBT = (L_p/l_g)*arcsin^2(Delta l_xl/l_g)`
    with `l_g = x_sites * site_width` and `dxl = l_long - l_short`), proving that the 36.2%
    bending-energy discrepancy in Figs. 3B, 3C, and S3A-C arises solely from Cell 2's transposed
    inputs (`site_width = 35 nm`, `dxl = 37 - 8 = 29 nm` instead of `37 nm`, `27 nm`), not from
    a different formula.
  assumptions:
    - "Geometrically valid gap regime `x_sites * site_width > l_long - l_short` so `arcsin` is real-valued."

