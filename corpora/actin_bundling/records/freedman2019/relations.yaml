# ==============================================================================
# Cross-record ModelAtlas relations for `freedman2019`
#
# Pairwise audit across uncovered corpus partners (`freedman2019_code`,
# `kierfeld2005`, `bathe2008`; note `winkelman2016` and `popov2016` already
# author their relations with `freedman2019` inside their own records):
#
# 1. `freedman2019 + freedman2019_code` (companion AFINES/KMC repository,
#    Simfreed/AFINES@growing_spacer_exv, Ref. 39): 12 verified relations below
#    connecting live `kmc.ipynb` Cell 3 (`software: true`) and exact C++/
#    Mathematica ports against `freedman2019`'s printed Main Text & SI equations.
#    Note: the live 1000-trial Gillespie notebook adapter
#    `kmc_notebook_growing_bundle` (`kmc.ipynb` Cells 5-6) is omitted from
#    automated 40-sample `relations.yaml` sweeps because its default
#    `num_trials = 1000` takes ~8-9 s per sample (~6 min cold per relation);
#    direct 15-um cross-checks at both (35 nm, 29 nm) and (37 nm, 27 nm) are
#    documented in `questions.yaml` (`q_code_kmc_swap_and_notebook_equivalence`)
#    and `notes.md`.
# 2. `freedman2019 + kierfeld2005` (PRL 95, 038102, 2005): 2 verified relations
#    (exact symbolic identity of grand-canonical 2-state Langmuir site occupancy
#    `X_1 = K*c_x/(1 + K*c_x)` with Freedman SI Section C's `N_b = N/(1 + exp(-mu/k_B T))`,
#    and `scales_as` comparison exposing the 2x 2D-vs-3D persistence length
#    convention between Kierfeld's `L_p = 2*kappa/T` and AFINES's 2D use of
#    `L_p = kappa_B/(k_B T)`).
# 3. `bathe2008 + freedman2019` (Biophys. J. 94, 2955-2964, 2008): honest 0
#    direct relations (continuum N-filament wormlike-bundle bending stiffness
#    `kappa_B(N, alpha)` & peristaltic wavelength vs 2-filament domain-sorting
#    bending gap energy & KMC/AFINES models; reciprocal Langmuir duality
#    `delta = delta_min/X` vs `N_b = N*X` and 8,800x filament stretching
#    softness gap logged in `q_bathe2008_no_direct_relation_and_physics_contrast`).
# ==============================================================================

