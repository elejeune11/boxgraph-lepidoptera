# 2. `freedman2019 + kierfeld2005` (2 relations)
# ------------------------------------------------------------------------------

- id: rel_kierfeld2005_langmuir_same_as_chem_pot
  kind: same_as
  a: kierfeld2005/linker_site_occupancy
  b: freedman2019/chemical_potential_from_occupancy
  mapping:
    N: "1"
    mu_kBT: "log(K * c_x)"
  output_map:
    N_b: X_1
  regime:
    K: [1.0e5, 1.0e7]
    c_x: [1.0e-8, 1.0e-5]
  provenance: proposed
  reason: >
    Both Kierfeld et al. (2005, p. 2 col. 2, `linker_site_occupancy`: `X_1 = K*c_x / (1 + K*c_x)`)
    and Freedman et al. (2019, SI Section C p. 9 / SI-3, `chemical_potential_from_occupancy`:
    `N_b = N / (1 + exp(-mu / (k_B T)))`) model equilibrium cross-linker adsorption onto
    independent actin binding sites in the non-depleted grand-canonical reservoir ensemble using
    the exact same two-state Langmuir / Fermi-Dirac isotherm. Identifying a single binding site
    (`N = 1`) and the ideal-solution chemical potential `mu / (k_B T) = ln(K * c_x)` makes the
    two expressions symbolically identical (`1 / (1 + (K*c_x)^-1) = K*c_x / (1 + K*c_x)`).
    In Freedman SI Section C, the calibrated single-species chemical potential `mu = -1.5 to -2 k_B T`
    corresponds to `K * c_x = exp(-1.5) to exp(-2) = 0.223 to 0.135`, i.e., fractional site
    occupancy `X_1 = 0.182 to 0.119`.
  assumptions:
    - "Independent binding sites (`N = 1` per-site occupancy `X_1 = N_b / N`) equilibrated with an undepleted cross-linker bath at chemical potential `mu / (k_B T) = ln(K * c_x)`."

- id: rel_kierfeld2005_lp_2d_scales_as_3d
  kind: scales_as
  a: freedman2019/persistence_length_from_kappa_b
  b: kierfeld2005/persistence_length_def
  mapping:
    kappa: "1e6 * kappa_B"
    T: "0.01380649 * T"
  output_map:
    L_p: L_p
  regime:
    kappa_B: [0.01, 0.5]
    T: [290.0, 310.0]
  provenance: proposed
  reason: >
    Both models relate semiflexible polymer persistence length `L_p` linearly to bending rigidity
    `kappa` and inversely to thermal energy `k_B T` (identical log-slopes `+1` in `kappa_B` and
    `-1` in `T`), but with an important factor-of-2 dimensional convention difference: Kierfeld
    et al. (2005, p. 2 col. 1) model a planar (1+1D / 2D) worm-like chain with one transverse
    bending mode per segment and correctly write `L_p^(2D) = 2 * kappa / T`, whereas Freedman et al.
    (2019, SI Section A p. 8 / SI-2) simulate AFINES filaments in 2D with one scalar bending
    angle `theta_i` per hinge (`U_bend = (kappa_B / (2*l_a)) * sum theta_i^2`) yet define
    `L_p = kappa_B / (k_B T)` (the 3D formula, which counts two orthogonal bending modes).
    Consequently, 2D AFINES filaments parameterized with `kappa_B = 0.068 pN*um^2` and
    `k_B T = 0.004 pN*um` have deterministic bending modulus `kappa_B` matching 3D F-actin
    (`L_p^(3D) = 17 um`), but an actual 2D thermal tangent-correlation persistence length of
    `2 * kappa_B / (k_B T) = 34 um` (2x longer than stated).
  assumptions:
    - "Unit conversions `1 pN*um^2 = 1e6 pN*nm^2` and CODATA 2018 `k_B = 0.01380649 pN*nm/K`."
    - "Exact 2x prefactor difference reflects 2D planar (`2*kappa/k_B T`) vs 3D (`kappa/k_B T`) WLC tangent-correlation persistence length."

