    `lgrow = 0.03 um`, `-4.8%` at `lgrow = 0.07 um`, up to `-9.1%` just below `0.10 um`, plus
    `-0.25%` from IEEE-754 double accumulation at `lgrow = 0.0025 um`, which itself proves Table S1's
    `0.008 um` lower bound is a misprint). Across the full Fig. 5C growth sweep `lgrow in [0.0025, 0.1] um`,
    realized contour elongation rate `k_grow_realized` is approximated by SI Eq. (2)'s nominal
    `k_grow = k_g * Delta l_a` within 9.1% (tolerance 0.10).
  assumptions:
    - "Standard AFINES link rest length `spring_l0 = 1.0 um` and split threshold `l0_max = 2.0 um` (`grow.cfg:9,16`)."

- id: rel_code_lattice_bins_approx_site_count
  kind: approximated_by
  a: freedman2019_code/afines_lattice_and_domain_processing
  b: freedman2019/lattice_site_count
  mapping:
    L_0: "lmax"
    l_b: "1000 * l0"
  output_map:
    N: n_bins_total
  regime:
    l0: [0.030, 0.045]
    lmax: [10.0, 20.0]
    nc: [4.0, 4.0]
    rc: [1.0, 1.0]
  tolerance: 0.005
  provenance: proposed
  reason: >
    Mathematica post-processing `xlink_sorting_paper/process/afines2lattice.m:10,36,48` bins
    AFINES cross-linkers into `n_bins_total = floor(lmax / l0)` discrete segments of width
    `l0 = 0.037 um` (yielding exactly `405` bins for `lmax = 15 um`, consistent with `freedman2019`
    p. 3 / SI Section B — unlike `kmc.ipynb`'s `35 nm` / `428` sites). Compared against the
    continuous ratio `N = L_0 / l_b` (`405.405` at `15 um / 37 nm`) in `freedman2019/lattice_site_count`,
    integer floor truncation introduces relative error `< l0 / lmax <= 0.45%` (within tolerance 0.005).
  assumptions:
    - "Filament contour length `lmax in [10, 20] um` and bin width `l0 in [0.030, 0.045] um` (`n_bins_total >= 222`)."

