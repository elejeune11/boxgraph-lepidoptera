- id: ref_kmc_n_sims
  run: run_kmc_figs3a
  setting: n_sims
  factors: [1, 2, 4]
  mode: multiply
  output: switching_ratio
  tolerance: "5%"
  tolerance_basis: "added: well below the ~41% discrepancy between KMC switching_ratio (~0.0225) and Fig. S3A printed 0.016, and comparable to the printed last-digit precision of 0.016 (~3%)"
  tolerance_added: true

- id: ref_eq_lattice_sweeps
  run: run_eq_lattice_baseline
  setting: n_sweeps
  factors: [1, 2, 4]
  mode: multiply
  output: domain_length
  tolerance: "10%"
  tolerance_basis: "added: reflects stochastic SEM across 30 independent lattice realizations while testing whether Metropolis equilibration has settled"
  tolerance_added: true

- id: ref_brownian_dt
  run: run_brownian_eq6
  setting: dt
  factors: [1, 2, 4]
  mode: divide
  output: D_eff
  tolerance: "5%"
  tolerance_basis: "added: matches Monte Carlo sampling noise (~3% for 2000 trajectories) to verify dt-invariance of the Leimkuhler-Matthews diffusion prefactor"
  tolerance_added: true

- id: ref_kmc_conc_ratio_n_sims
  run: run_kmc_fig3c_left_sweep
  setting: n_sims
  factors: [1, 2]
  mode: multiply
  output: domain_length_A
  tolerance: "5%"
  tolerance_basis: "added: verifies Monte Carlo convergence of mean fascin domain length at the paper's Fig. 3C sample count (n_sims = 1000 vs 2000), well below the ~15-22% offset from Fig. 3C"
  tolerance_added: true

- id: ref_kmc_rate_ratio_n_sims
  run: run_kmc_figs3c_100nms_sweep
  setting: n_sims
  factors: [1, 2]
  mode: multiply
  output: epsilon_predicted
  tolerance: "5%"
  tolerance_basis: "added: verifies Monte Carlo convergence of epsilon_predicted = -ln(N_diff/N_same) across the Fig. S3C rate-ratio sweep (n_sims = 400 vs 800)"
  tolerance_added: true
