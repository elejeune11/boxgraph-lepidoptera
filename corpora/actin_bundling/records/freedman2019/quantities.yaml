- id: binding_rate_solution
  name: solution cross-linker binding on-rate
  dimension: "1/[time]"
  description: First-order effective association rate constant k_on for cross-linker binding.

- id: unbinding_rate_solution
  name: cross-linker unbinding off-rate
  dimension: "1/[time]"
  description: First-order dissociation rate constant k_off for cross-linker unbinding.

- id: dissociation_constant_dimensionless
  name: effective dimensionless dissociation ratio
  dimension: "dimensionless"
  description: Ratio K_d = k_off / k_on when both rates are expressed in 1/s (as in AFINES MC rates).

- id: binding_rate_per_site
  name: per-site cross-linker bundling rate
  dimension: "1/[time]"
  description: Rate mu_on at which a cross-linker binds to an individual lattice binding site on a 2-filament bundle.

- id: switching_rate_ratio
  name: cross-linker switching rate ratio
  dimension: "dimensionless"
  description: Ratio of dissimilar-to-similar cross-linker binding rates or events (mu_on^diff / mu_on^same or N_diff / N_same).

- id: switching_rate_fold_reduction
  name: cross-linker switching fold reduction
  dimension: "dimensionless"
  description: Factor by which switching cross-linker type is slower than continuing the same domain (mu_on^same / mu_on^diff).

- id: switching_barrier_thermal
  name: dimensionless domain-switching energy barrier
  dimension: "dimensionless"
  description: Kinetic or effective energetic barrier epsilon / (k_B T) incurred by switching cross-linker type, in units of k_B T.

- id: crosslinker_length
  name: cross-linker rest length or filament spacing
  dimension: "[length]"
  description: Rest length of a cross-linker protein or equilibrium inter-filament spacing in a bundle.

- id: crosslinker_length_difference
  name: cross-linker length difference
  dimension: "[length]"
  description: Difference Delta l_xl = l_long - l_short between long and short cross-linker rest lengths.

- id: filament_persistence_length
  name: F-actin filament persistence length
  dimension: "[length]"
  description: Bending persistence length L_p = kappa_B / (k_B T) of an actin filament.

- id: filament_length
  name: actin filament contour length
  dimension: "[length]"
  description: Contour length L_0 (initial or maximum) of an actin filament in experiment or simulation.

- id: binding_site_spacing
  name: actin cross-linker binding site spacing
  dimension: "[length]"
  description: Spacing l_b between discrete cross-linker binding sites along an F-actin filament (37 nm helical half-pitch).

- id: gap_length
  name: inter-cross-linker gap contour length
  dimension: "[length]"
  description: Contour length l_g along the actin filament between neighboring dissimilar cross-linkers.

- id: gap_length_sites
  name: gap length in lattice binding sites
  dimension: "dimensionless"
  description: Number of lattice binding sites n_g = l_g / l_b separating a candidate binding site from the last bound cross-linker.

- id: filament_bend_angle
  name: filament bending angle
  dimension: "dimensionless"
  description: Bending angle theta (in radians) of a filament link or domain-switch bend.

- id: gap_bending_energy_thermal
  name: dimensionless gap bending energy
  dimension: "dimensionless"
  description: Elastic bending energy U(l_g) / (k_B T) required to bend a filament twice across a gap of length l_g, in units of k_B T.

- id: mechanical_energy
  name: mechanical or potential energy
  dimension: "[energy]"
  description: Potential energy of a filament, cross-linker, or gap deformation in physical energy units (e.g. pN*um).

- id: lattice_site_count
  name: number of lattice binding sites
  dimension: "dimensionless"
  description: Total number of cross-linker binding sites N = L_0 / l_b along a 1D bundle lattice.

- id: occupied_site_count
  name: number of occupied lattice sites
  dimension: "dimensionless"
  description: Number of lattice sites occupied by a cross-linker species (N_S, N_L, or average N^b).

- id: chemical_potential_thermal
  name: dimensionless cross-linker chemical potential
  dimension: "dimensionless"
  description: Cross-linker chemical potential mu_S(L) / (k_B T) in the equilibrium 1D lattice model, in units of k_B T.

- id: lattice_energy_thermal
  name: dimensionless 1D lattice energy
  dimension: "dimensionless"
  description: Total energy U_lat / (k_B T) of a 1D equilibrium lattice configuration (Eq. 2), in units of k_B T.

- id: site_switching_probability
  name: conditional probability of binding dissimilar cross-linker
  dimension: "dimensionless"
  description: Probability mu_on^diff / (mu_on + mu_on^diff) of adding the opposite cross-linker type at a given gap distance (Fig. 3B).

- id: domain_length
  name: cross-linker domain length
  dimension: "[length]"
  description: Length of a contiguous domain of a single cross-linker species along a 2-filament bundle.

- id: domain_min_crosslinkers
  name: minimum cross-linkers per domain
  dimension: "dimensionless"
  description: Minimum consecutive cross-linker count n_d required to define a domain (SI Section B).

- id: domain_max_gap
  name: maximum intra-domain cross-linker gap
  dimension: "[length]"
  description: Maximum separation l_d allowed between consecutive same-type cross-linkers within one domain (SI Section B).

- id: polymerization_rate
  name: actin filament polymerization growth rate
  dimension: "[length]/[time]"
  description: Barbed-end elongation velocity mu_grow or k_grow of actin filaments.

- id: concentration_ratio
  name: cross-linker concentration or density ratio
  dimension: "dimensionless"
  description: Ratio of short-to-long cross-linker concentration ([fascin]/[alpha-actinin]) or areal density (rho_short/rho_long).

- id: growth_to_bundling_ratio
  name: dimensionless growth-to-bundling rate ratio
  dimension: "dimensionless"
  description: Ratio (mu_grow / l_b) / mu_on controlling effective switching barrier in the growing-bundle KMC model (Fig. S3C).

- id: molar_concentration
  name: protein molar concentration
  dimension: "[substance]/[length]**3"
  description: Solution molar concentration of actin, fascin, or alpha-actinin in TIRF microscopy experiments.

- id: observation_time
  name: experimental or simulation time
  dimension: "[time]"
  description: Elapsed time of TIRF observation, simulation duration t_F, averaging window, or timestep Delta t.

- id: filament_count
  name: number of actin filaments
  dimension: "dimensionless"
  description: Total number of actin filaments N_f in the AFINES simulation box.

- id: filament_count_printed_density_units
  name: number of filaments with printed areal density units
  dimension: "1/[length]**2"
  description: Table S1 entry for N_f, which prints value 2 with apparent misprinted units um^-2 instead of dimensionless count.

- id: filament_link_count
  name: number of links per filament
  dimension: "dimensionless"
  description: Initial (N_{l,0}) or maximum (N_max) number of bead-spring links per actin filament in AFINES.

- id: filament_link_length
  name: actin filament link rest length
  dimension: "[length]"
  description: Equilibrium length l_a of one harmonic spring link in the AFINES worm-like chain filament.

- id: stretching_stiffness
  name: harmonic spring stretching stiffness
  dimension: "[force]/[length]"
  description: Hookean stretching force constant k_a of an actin link or k_xl of a cross-linker spring.

- id: bending_modulus
  name: filament bending modulus
  dimension: "[force]*[length]**2"
  description: Flexural rigidity kappa_B = L_p k_B T of an actin filament.

- id: segment_addition_rate
  name: barbed-end segment addition rate
  dimension: "1/[time]"
  description: Markovian rate k_g of discrete barbed-end link-length increments Delta l_a in AFINES (SI Eq. 2).

- id: segment_growth_increment
  name: barbed-end growth length increment
  dimension: "[length]"
  description: Discrete barbed-end spring rest-length increment Delta l_a (called l_g in Table S1) per growth event in AFINES.

- id: growth_step_probability
  name: per-timestep growth event probability
  dimension: "dimensionless"
  description: Probability P = k_g Delta t of extending the barbed-end link by Delta l_a in one timestep (SI Eq. 2).

- id: excluded_volume_stiffness_printed
  name: excluded volume stiffness in printed Table S1 units
  dimension: "[force]*[length]**2"
  description: Excluded volume parameter k_exv as printed in Table S1 and Fig. 2D caption with units pN*um^2.

- id: excluded_volume_potential_printed
  name: excluded volume potential evaluated with printed k_exv units
  dimension: "[force]*[length]**2"
  description: Result of SI Eq. 3 evaluated verbatim with k_exv in pN*um^2 (carrying dimension [force]*[length]^2 rather than [energy]).

- id: excluded_volume_energy_scale
  name: excluded volume interaction energy scale
  dimension: "[energy]"
  description: Dimensionally consistent excluded volume energy scale k_exv (in pN*um) required for SI Eq. 3 to have energy units.

- id: interaction_distance
  name: inter-object separation distance
  dimension: "[length]"
  description: Closest-approach distance |r_ij| between filament springs, bead-to-head distance, or head-to-head spring length.

- id: areal_density
  name: 2D cross-linker areal number density
  dimension: "1/[length]**2"
  description: Two-dimensional number density rho_short or rho_long of cross-linkers in the AFINES assay box.

- id: crosslinker_bending_stiffness
  name: cross-linker angular bending stiffness
  dimension: "[energy]"
  description: Harmonic angular stiffness kappa_xl^B penalizing deviation of bound cross-linker angle alpha from pi/2 (SI Eq. 4).

- id: bending_stiffness_ratio
  name: long-to-short cross-linker bending stiffness ratio
  dimension: "dimensionless"
  description: Empirical calibration ratio kappa_long^B / kappa_short^B suppressing length-dependent binding affinity bias in AFINES.

- id: head_binding_rate
  name: cross-linker head attachment or detachment rate constant
  dimension: "1/[time]"
  description: Maximum MC attachment (k_xl^{on,1}, k_xl^{on,2}) or detachment (k_xl^{off,1}, k_xl^{off,2}) rate constant of a cross-linker head.

- id: head_unbinding_ratio
  name: single-filament unbinding rate constant ratio
  dimension: "dimensionless"
  description: Ratio k_short^{off,1} / k_long^{off,1} of short to long cross-linker detachment rates from a single filament (Fig. 5E).

- id: bound_head_indicator
  name: binary cross-linker head bound state
  dimension: "dimensionless"
  description: Binary indicator I_L or I_R equal to 1 if cross-linker head is bound and 0 if unbound (SI Eq. 4).

- id: mechanical_force
  name: mechanical tensile or propagated force
  dimension: "[force]"
  description: Tensile force F_xl exerted by a doubly-bound cross-linker or lever-rule force F_i on a filament bead (SI Eq. 5).

- id: assay_dimension
  name: 2D simulation box dimension
  dimension: "[length]"
  description: Length X or width Y of the periodic 2D AFINES simulation box.

- id: grid_density
  name: spatial neighbor-search grid density
  dimension: "1/[length]"
  description: Grid density g used for spatial neighbor partitioning in AFINES (Table S1).

- id: temperature
  name: absolute temperature
  dimension: "[temperature]"
  description: Absolute thermodynamic temperature T of the simulation environment.

- id: dynamic_viscosity
  name: solvent dynamic viscosity
  dimension: "[mass]/[length]/[time]"
  description: Dynamic viscosity nu of the aqueous environment in Stokes drag (SI Eq. 6 & Table S1).

- id: particle_radius
  name: hydrodynamic particle radius
  dimension: "[length]"
  description: Effective Stokes radius R of an actin bead or cross-linker head in mu = 1/(6 pi R nu) (SI Eq. 6; unstated in Table S1).

- id: stokes_mobility
  name: Stokes hydrodynamic mobility
  dimension: "[length]/[force]/[time]"
  description: Overdamped mobility coefficient mu = 1/(6 pi R nu) relating force to drift velocity (SI Eq. 6).

- id: diffusion_coefficient
  name: translational diffusion coefficient
  dimension: "[length]**2/[time]"
  description: Overdamped Brownian translational diffusion coefficient D = k_B T mu (SI Eq. 6).

- id: simulation_seed_count
  name: number of independent simulation realizations
  dimension: "dimensionless"
  description: Number of independent simulation seeds or replicates n_s averaged to compute statistics.

- id: filament_alignment
  name: filament end-to-end alignment dot product
  dimension: "dimensionless"
  description: Threshold dot product f_hat_1 . f_hat_2 >= 0.8 used to classify two filaments as bundled (SI Section A).

- id: binding_waiting_time
  name: cross-linker binding waiting time
  dimension: "[time]"
  description: Time elapsed in the growing-bundle KMC model before binding the next cross-linker at the barbed end (Fig. S3A left).

- id: waiting_time_probability_density
  name: binding waiting-time probability density
  dimension: "1/[time]"
  description: Normalized histogram probability density P(t) of waiting times before same-type or dissimilar cross-linker binding (Fig. S3A left).

- id: binding_site_probability
  name: discrete binding-site probability
  dimension: "dimensionless"
  description: Normalized probability P(l_g) that a same-type or dissimilar cross-linker binds at a given lattice-site distance from the previous cross-linker (Fig. S3A right).

- id: bundle_extension_rate
  name: bundle extension rate
  dimension: "[length]/[time]"
  description: Realized instantaneous bundle extension velocity mu_bund = l_g / t_wait computed as cross-linker addition distance divided by waiting time (Fig. S3B).

- id: bundle_extension_rate_density
  name: bundle extension rate probability density
  dimension: "[time]/[length]"
  description: Normalized probability density P(mu_bund) of bundle extension rates in the growing-bundle KMC model (Fig. S3B).
