    - kierfeld2005/pair_unbinding_threshold_eq5
  text: >
    Cross-record analysis of `freedman2019 + kierfeld2005` (PRL 95, 038102, 2005; not cited by
    `freedman2019`) identifies two verified mathematical relations and zero citations/validations
    (`kierfeld2005` is a pure theory/MC paper with no `origin: measured` datums):
    (1) Exact grand-canonical Langmuir identity (`rel_kierfeld2005_langmuir_same_as_chem_pot`):
    Freedman SI Section C's single-species occupancy `N_b = N / (1 + exp(-mu/(k_B T)))` is
    symbolically identical to Kierfeld's `X_1 = K*c_x / (1 + K*c_x)` at `N = 1` with
    `mu/(k_B T) = ln(K*c_x)` (placing Freedman's calibrated `mu = -1.5..-2 k_B T` at fractional
    occupancy `X_1 = 0.182..0.119`).
    (2) Dimensional 2D-vs-3D persistence-length discrepancy (`rel_kierfeld2005_lp_2d_scales_as_3d`):
    Kierfeld et al. (p. 2 col. 1) model planar (1+1D / 2D) semiflexible filaments and correctly
    define `L_p^(2D) = 2 * kappa / T`, whereas AFINES (`freedman2019` SI Section A pp. 8-9)
    simulates filaments in 2D with a single scalar bending angle `theta_i` per hinge
    (`U_bend = (kappa_B / (2*l_a)) * sum theta_i^2`) yet parameterizes `kappa_B = L_p * k_B T`
    using the 3D formula (`L_p^(3D) = kappa_B / (k_B T)`). Because a 2D chain has only one
    transverse thermal bending mode per hinge (`<theta_i^2> = l_a k_B T / kappa_B`), AFINES
    filaments parameterized at `kappa_B = 0.068 pN*um^2` and `k_B T = 0.004 pN*um` actually have
    a 2D thermal tangent-correlation persistence length of `2 * kappa_B / (k_B T) = 34 um`
    (twice the intended `17 um`), even though their deterministic mechanical bending energy
    `U_bend` matches 3D F-actin.
    (3) Shared Odijk deflection-length scaling: Freedman Eq. (1) reaches `U(l_g*) = k_B T` at
    `l_g* = (L_p * Delta l_xl^2)^(1/3) ~= 231 nm` (for `L_p = 17 um`, `Delta l_xl = 27 nm`),
    sharing the same Odijk deflection-length scaling `(L_p * l_a^2)^(1/3)` that governs
    Kierfeld Eq. (5)'s critical unbinding threshold `|W_bar_c| ~ k_B T / (L_p * l_a^2)^(1/3)`,
    though the two models output different physical quantities (gap energy `[energy]` vs critical
    attraction per length `[force]`).
  citation:
    page: 8
    printed_page: "SI-2"
    quote: "The persistence length of the filament is then Lp"
    where: SI Section A & Section C vs `kierfeld2005`

- id: q_bathe2008_no_direct_relation_and_physics_contrast
