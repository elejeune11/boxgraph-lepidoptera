  text: >
    The full 2D agent-based AFINES simulation (SI Section A, Eqs. 1-6, Table S1) is marked
    runnable: false because reproducing its 2000 s trajectories at dt = 2e-5 s (10^8 steps per
    seed x 40 seeds) requires the C++ AFINES implementation (separately tracked in freedman2019_code),
    and the paper omits essential implementation parameters: hydrodynamic radius R in Stokes mobility
    SI Eq. (6), MC head capture radius and spatial grid lookup rule (g = 2.5 um^-1), angular bending
    torque lever-rule propagation from U_xl^bend onto filament beads, whether U_xl^bind is excluded
    from Delta U in MC acceptance probabilities to avoid double-counting k_on/k_off, and the
    bending-stiffness ratio on the undefined (200, 300) nm interval.
  citation:
