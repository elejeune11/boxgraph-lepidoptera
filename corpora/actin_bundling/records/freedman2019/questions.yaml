  text: >
    Cross-record audit of `bathe2008 + freedman2019` (Biophys. J. 94, 2955-2964, 2008; not cited
    by `freedman2019`) yields honest 0 direct ModelAtlas relations, 0 cited links, and 0
    cross-validations: Bathe et al. model macroscopic bending stiffness `kappa_B(N, alpha)` and
    peristaltic elasticity of homogeneous multi-filament (`N = 4..400`) bundles (validating
    against Claessens et al. 2006's 21-33-filament fascin bundle stiffness measurements in Fig. 4),
    whereas Freedman et al. model competitive sorting of two length-mismatched cross-linkers on
    2-filament bundles. Three quantitative cross-framework contrasts link their physical regimes:
    (1) Reciprocal Langmuir isotherm duality: `bathe2008/langmuir_crosslink_spacing`
    (`delta = delta_min * (K_d + c_fascin) / c_fascin` with `delta_min = 37.5 nm`) and
    `freedman2019/chemical_potential_from_occupancy` (`N_b = N / (1 + exp(-mu/(k_B T)))` with
    `l_b = 37 nm`) express reciprocal observables (`delta = delta_min / X` vs `N_b = N * X`) of
    the same non-depleted 2-state Langmuir isotherm `X = 1 / (1 + K_d/c) = 1 / (1 + exp(-mu/k_B T))`.
    (2) 8,800x filament extensional-rigidity coarse-graining gap: Bathe uses physical F-actin
    extensional rigidity `E_f A_f = 4.4e-8 N = 44,000 pN` (`k_f = E_f A_f / l_a = 44,000 pN/um`
    for a 1-um link), whereas AFINES uses `k_a = 5 pN/um` (`k_a * l_a = 5 pN`, 8,800x softer) for
    explicit-timestep numerical stability at `dt = 2e-5 s`.
    (3) Peristaltic elastic vs rigid-mismatch thermal bending length scales: Bathe's peristaltic
    healing length `lambda_max = (kappa_f * delta / k_perp)^(1/4)` balances filament bending
    against finite cross-linker stretching stiffness (~40 nm at physiological `k_perp ~ 1e-3 N/m`,
    ~294 nm at AFINES `k_xl = 10 pN/um = 1e-5 N/m`, scaling as `kappa_f^(1/4)`), whereas
    Freedman's Eq. (1) rigid-mismatch thermal bending crossover `l_g* = (L_p * Delta l_xl^2)^(1/3)`
    (~231 nm for fascin/alpha-actinin) scales as `kappa_f^(1/3)`.
  citation:
