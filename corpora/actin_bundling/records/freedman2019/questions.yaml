    SI Section A (p. 9 / SI-3) states kappa_long^B / kappa_short^B = 22 * l_long / l_short - 21
    for l_long <= 200 nm and 4 for l_long >= 300 nm. Because l_short = 200 nm and l_long spans
    [200, 1200] nm (Table S1), the condition l_long <= 200 nm covers only the single point
    l_long = 200 nm (ratio = 1) and leaves the entire interval (200, 300) nm — including
    l_long = 227 nm used in Fig. 2C, Fig. 5B, Fig. S2, and Movie S2 — undefined. Moreover, at
    l_long = 300 nm the linear expression equals 12 rather than 4, whereas it reaches 4 at
    l_long = 227.27 nm (3.97 at l_long = 227 nm). A continuous capped-ramp variant
    (crosslinker_bending_calibration_continuous) is added beside the verbatim model.
  citation:
