  text: >
    Cross-record audit against the released AFINES C++ codebase, configs, and Mathematica scripts
    (`freedman2019_code`, commit `0c6c349`) resolves five paper-vs-code discrepancies and reveals
    several severe C++ implementation bugs:
    (1) Excluded-volume units (`rel_code_afines_exv_same_as_si_eq3_energy`, resolving
    `q_kexv_units_and_vector_eq3`): `src/filament_ensemble.cpp:668-673` computes
    `pe_exv = kexv*(1 - r/rmax)^2` and exact `-grad U`, proving `kexv` has energy units `pN*um`
    (`0.08 pN*um = 20 k_B T`), NOT `pN*um^2` as misprinted in Table S1 & Fig. 2D; meanwhile
    `grow.cfg`/`nogrow.cfg`/`README.md` omit `kexv = 0.08`, and C++ has two crossing bugs
    (zero force for midpoint-crossing links with endpoint distance `r >= rmax`, and a hardcoded
    +45-deg doubled force `4*kexv/rmax` for near-end intersections).
    (2) 5x `set_bending` rescaling, SI Eq. (4) missing `1/2`, and 4 conflicting `kappa_long^B`
    prescriptions (`rel_code_spacer_bend_rescaled_same_as_si_eq4`, compounding
    `q_kappa_long_domain_gap`): `spacer_ensemble::set_bending()` (`src/motor_ensemble.cpp:314`)
    divides `s_bend` by rest length `mld` (`s1_bend = 0.005` -> `kb_short = 0.025 pN*um`, 5x
    Table S1), while `src/spacer.cpp:277` includes a `0.5` factor omitted in SI Eq. (4), so
    `U_bend` matches only under `kappa_xl^B = 0.5 * s_bend / mld` (net 2.5x stiffer for short
    cross-linkers). Moreover, SI Section A (`ratio = 4` for `l_long >= 300 nm`), `grow.cfg`/
    `nogrow.cfg` (`s2_bend = 0.06` -> raw 12x, effective 8x), `README.md` (`kb0 = 0.04` ->
    effective 1.6x via invalid flag `--s2bend`), and `plots.nb:14229` (`s2kb = 0.0675` ->
    effective 9x in Fig. 5C/5E/S5) all contradict one another.
    (3) `grow.cfg:7` `nmonomer = 2` vs Table S1 `N_{l,0} = 2` (resolving
    `q_table_s1_nf_units_and_nl0_mismatch`): `nmonomer = 2` beads = 1 initial link = `1.0 um`
    (confirmed by `plots.nb:14255` `Ceiling[14/lgrow]`), matching Fig. 5B caption (`1 um`) and
    proving Table S1 confused bead count (`2`) with link count (`15` from `nogrow.cfg`'s
    `nmonomer = 16`).
    (4) `lgrow = 0.0025 um` & barbed-end split remainder (`rel_code_barbed_growth_approx_si_eq2`,
    resolving `q_table_s1_growth_length_lower_bound` and `q_si_eq2_barbed_end_split_remainder`):
    `README.md:256` and `plots.nb:14195` confirm Fig. 5C ran down to `lgrow = 0.0025 um`
    (`2.5 nm/s`, proving Table S1's `0.008 um` is a misprint, with slow runs extended to
    `tfinal = 6000 s` in `plots.nb:14217` and Fig. 5B `s2len = 0.3` run at `dt = 1e-5 s` in
    `plots.nb:11266`); `src/filament.cpp:673-736` splits at `>= 2*l_a` (not `> 2*l_a`),
    discarding overshoot only on non-divisors (`0.03` [-2.0%], `0.07` [-4.8%]) and IEEE-754
    rounding at `0.0025`/`0.005` um.
    (5) `src/spacer.cpp` detailed-balance bugs, `s2_koff` bug, hidden Stokes radii &
    `temperature = 0.004`: `spacer::metropolis_prob()` (`src/spacer.cpp:220-224,355-378`) uses
    pre-attachment `(hx, hy)`, old `disp`, and stale `pos_a_end = 0`, omits head-0 bending
    activation on `(1,0)->(1,1)`, and subtracts unreset stale `b_eng` (inflating attachment
    probability 1.90x at the probe configuration); `prog/bundles.cpp:372,376` passes `s2_kend`
    twice instead of `s2_koff, s2_kend`; `src/bead.cpp:25` and `src/spacer.cpp:55` reveal
    unstated Stokes radii `R_bead = actin_length = 0.5 um` and `R_spacer = mld` (making short
    cross-linkers diffuse 1.5x-6x faster than long ones, `rel_code_param_map_*_same_as_si_eq6`);
    and hardcoded `temperature = 0.004 pN*um` resolves `q_lp_kbt_rounding_movies3`
    (`rel_code_param_map_lp_approx_kbt300`, 3.43% offset vs `k_B * 300 K`).
  citation:
