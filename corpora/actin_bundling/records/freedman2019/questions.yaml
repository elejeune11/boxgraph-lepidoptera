    quote: "empirically, we suppressed this bias by setting"
    where: SI Section A

- id: q_kexv_units_and_vector_eq3
  kind: possible_error
  about:
    - excluded_volume_si_eq3_printed
    - excluded_volume_si_eq3_energy_units
    - afines_kexv_printed
    - kexv_energy_scale_added
  text: >
    SI Eq. (3) writes the excluded volume potential energy as U_ij = k_exv (1 - r_ij / r_max)^2
    for |r_ij| < r_max (0 for |r_ij| > r_max), placing the vector r_ij inside a scalar difference
    and omitting |r_ij| = r_max. More importantly, because (1 - |r_ij|/r_max)^2 is dimensionless,
    U_ij has energy dimension [energy] only if k_exv has units of energy (pN*um), whereas both
    Table S1 (p. 10) and Fig. 2D caption (p. 3) print k_exv = 0.08 pN*um^2 ([energy]*[length]).
    A dimensionally consistent variant (excluded_volume_si_eq3_energy_units) is included alongside
    the verbatim model.
  citation:
    page: 8
    printed_page: "SI-2"
    quote: "restricted from overlapping via a soft (Hookean) excluded volume interaction"
    where: SI Eq. 3 & Table S1

