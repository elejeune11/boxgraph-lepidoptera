  text: >
    In Fig. 5E (p. 5) and Table S1 (p. 10), single-filament affinity is lowered by increasing
    k_short^{off,1} from 0.05 to 0.1 and 0.2 s^-1 while holding k_short^{on,1} = k_short^{on,2} = 2 s^-1
    and k_short^{off,2} = 0.05 s^-1 fixed. By SI Eq. (4), the doubly-bound binding energy is
    U_xl^bind = -k_B T [ln(k^{on,1}/k^{off,1}) + ln(k^{on,2}/k^{off,2})], so increasing
    k_short^{off,1} by 2x or 4x without adjusting k^{on,2}/k^{off,2} also weakens the equilibrium
    doubly-bound bundling free energy of short cross-linkers by +k_B T ln(2) or +k_B T ln(4),
    rather than isolating purely single-filament residence kinetics at constant equilibrium bundle
    affinity.
  citation:
    page: 8
    printed_page: "SI-2"
    quote: "Thus, the potential energy of a crosslinker is"
    where: SI Eq. 4 & Fig. 5E

