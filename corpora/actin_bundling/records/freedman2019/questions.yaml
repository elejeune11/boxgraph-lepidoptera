- id: q_fig2b_omits_initial_gap_energy
  kind: possible_error
  about:
    - equilibrium_lattice_energy_eq2
    - equilibrium_lattice_mc_eq2
    - run_eq_lattice_energy_fig2b
  text: >
    Fig. 2B (p. 3 / 16194) depicts an empty lattice site inside an initial gap of length 6 l_b
    switching to a short cross-linker (new gap 2 l_b) or long cross-linker (new gap 4 l_b), and
    prints the Boltzmann weights exp((mu_S - U(2 l_b))/k_B T) and exp((mu_L - U(4 l_b))/k_B T).
    By Eq. (2), the actual energy change is Delta U_lat = -mu_S + U(2 l_b) - U(6 l_b) (or
    -mu_L + U(4 l_b) - U(6 l_b)), so exp(-Delta U_lat / k_B T) omits the initial gap energy
    +U(6 l_b)/k_B T (which equals ~16.72 k_B T at Delta l_xl = 100 nm, L_p = 17 um, l_b = 37 nm,
    and ~1.14 k_B T at Delta l_xl = 27 nm). equilibrium_lattice_mc_eq2 uses the full Eq. (2)
    difference Delta U_lat rather than the Fig. 2B schematic label.
  citation:
    page: 3
    printed_page: "16194"
    quote: "Lattice model example, in which there is initially a gap of length 6lb"
    where: Fig. 2B

