    cross-validation completeness, `winkelman2016/L_transition_zone_EM` (`142 +- 52 nm`, Fig. 4F)
    cannot be directly validated because no `freedman2019` model outputs transition-zone length,
    though evaluating Eq. (1) at `l_g = 142 nm` (`L_p = 17 um`, `Delta l_xl = 27 nm`) gives
