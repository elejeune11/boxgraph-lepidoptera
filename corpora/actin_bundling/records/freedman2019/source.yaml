  Key quantitative findings and discrepancies:
  (1) Closed-form internal checks reproduce: 120-fold switching rate reduction at eps = 4.8 kBT
  (exp(4.8) = 121.51, within rounded-input range [115.6, 127.7]), lattice site count N = 15 um/37 nm = 405.41
  vs 405, Delta l_xl = 35 - 8 = 27 nm and 300 - 200 = 100 nm, 20 sites = 0.74 um (~0.7 um),
  eps = -ln(0.016) = 4.135 vs printed 4.1, single-filament unbinding ratios 0.1/0.05 = 2 and
  0.2/0.05 = 4, and AFINES maximum growth rate 1 s^-1 * 0.1 um = 100 nm/s.
  (2) Growing-bundle KMC (kmc_growing_bundle_fig3) run verbatim at Fig. S3A parameters
  (mu_grow = 40 nm/s, mu_on = 0.2/site/s, L_p = 17 um, Delta l_xl = 27 nm, L_0 = 15 um, l_b = 37 nm)
  yields N_diff/N_same ~= 0.0225 and eps_predicted ~= 3.79, which do not reproduce the Fig. S3A
  printed inset values N_diff/N_same = 0.016 and eps = 4.1 (approx. 41% higher switching ratio).
  (3) Persistence length L_p = kappa_B/(kBT) at Table S1 T = 300 K (kBT = 0.004142 pN*um) yields
  nominal values 2.414 um and 120.72 um for kappa_B = 0.01 and 0.5 pN*um^2 (both reproduce Movie S3's
  printed 2.5 um and 125 um within propagated printed-input rounding of 0.01 and 0.5, while the
  nominal values match the rounded textbook thermal energy kBT = 0.004 pN*um exactly: 0.01/0.004 = 2.5
  and 0.5/0.004 = 125).
  (4) Table S1 lists growth length l_g in [0.008, 0.1] um with k_g = 1 s^-1, giving minimum
  k_grow = 8 nm/s, inconsistent with Movie S6 (2.5 nm/s) and Fig. 5C (~3 nm/s cross-over).
  (5) SI Section A prints kappa_long^B/kappa_short^B = 22 l_long/l_short - 21 for l_long <= 200 nm
  and 4 for l_long >= 300 nm, leaving (200, 300) nm (including l_long = 227 nm used in Figs. 2C,
  5B, S2, Movie S2) undefined and jumping to 12 at 300 nm (whereas it reaches 4 at 227.3 nm).
  (6) SI Eq. 3 defines potential energy U_ij = k_exv (1 - r_ij/r_max)^2 with vector r_ij inside a
  scalar expression and k_exv given in Table S1 & Fig. 2D as pN*um^2 instead of energy units pN*um.
  (7) Additional minor table/caption discrepancies: Table S1 prints N_f = 2 with units um^-2 instead
  of dimensionless count, N_{l,0} = 2 links (= 2 um) vs Fig. 5B initial length 1 um, symbol collision
  of l_g (gap length in Eq. 1 vs growth length in Table S1), missing hydrodynamic radius R in Table S1,
  and cross-reference typos in Fig. S3A (cites Fig. 3B instead of 3C), Movie S5 (cites Fig. S4B/4B
  instead of S4A/4A right), and Movie S7 (cites Fig. 5E left instead of top).
  Left out: bibliographic/grant numbers, qualitative micrograph scale bars and colorbar/axis ticks
  feeding no model, and calibrated digitization of plotted curves/bars (left for the digitize stage).
