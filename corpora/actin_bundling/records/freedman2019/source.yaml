notes: >
  Read stage of Freedman et al., PNAS 116(33), 16192-16197 (2019), merged with its 9-page
  SI Appendix (PDF pp. 1-15). All 15 extracted text pages (text/page-001.txt through page-015.txt)
  and all 15 rendered page images (pages/page-001.png through page-015.png) were inspected to
  verify every equation, symbol, subscript/superscript, table entry, figure caption, and inset value.
  Scope included: all printed biochemical, mechanical, and simulation parameters (Main Text,
  SI Sections A-E, Table S1, and Movie S1-S7 captions); closed-form models for dissociation
  constant Kd = koff/kon, 1D constant-barrier domain switching rate mu_on^diff = mu_on^same exp(-eps/kBT),
  effective barrier eps = -ln(N_diff/N_same), domain-switch bending angle theta = arcsin(Delta l_xl / l_g),
  cross-linker length difference Delta l_xl = l_long - l_short, worm-like chain gap bending energy
  U(l_g) (Eq. 1), Fig. 3B site-binding switching probability, 1D lattice site count N = L_0 / l_b,
  equilibrium 1D lattice Hamiltonian (Eq. 2) and Boltzmann occupancy/chemical potential relation
  (SI Section C), equilibrium 1D lattice Metropolis Monte Carlo simulation with SI Section B domain
  clustering (ready to sweep Fig. 2C-D), growing-bundle 1D kinetic Monte Carlo (KMC) simulation
  (Fig. 3A/C & Fig. S3) and dimensionless growth-to-bundling rate ratio (Fig. S3C x-axis),
  and AFINES component equations: persistence length L_p = kappa_B/(kBT), filament potential
  U_f (SI Eq. 1), barbed-end growth rate k_grow = k_g Delta l_a (SI Eq. 2), excluded volume
  potential U_ij (SI Eq. 3 as printed with Table S1 pN*um^2 units, plus dimensionally corrected
  variant_of model in energy units pN*um), cross-linker potential U_xl (SI Eq. 4), tensile force
  lever rule (SI Eq. 5), empirical bending-stiffness calibration kappa_long^B/kappa_short^B
  (SI Section A as printed, plus continuous variant_of model bridging the undefined (200, 300) nm
  window), Stokes mobility mu = 1/(6 pi R nu) and Leimkuhler-Matthews overdamped Brownian step
  (SI Eq. 6), single-filament unbinding rate ratio k_short^{off,1}/k_long^{off,1} (Fig. 5E), and
  non-runnable catalog entry for the full 2D agent-based AFINES simulator (runnable: false;
  external C++ code in separate freedman2019_code record plus unstated parameters).
