# Physical scales and material parameters
- id: shear_viscosity
  name: active fluid shear viscosity
  dimension: "[mass] / [length] / [time]"
  description: Shear viscosity eta in the passive stress tensor Eq. (4) (note footnote [29] sets eta = 0 in d = 1).

- id: bulk_viscosity
  name: active fluid bulk viscosity
  dimension: "[mass] / [length] / [time]"
  description: Bulk viscosity eta_v in the passive stress tensor Eq. (4); in d = 2 for a thin incompressible 3D film, eta_v = 3 eta (footnote [29]).

- id: viscosity_ratio
  name: bulk-to-shear viscosity ratio
  dimension: dimensionless
  description: Ratio eta_v / eta of bulk to shear viscosity appearing in nu = 1 + eta_v / eta for d = 2.

- id: friction_coefficient
  name: substrate friction coefficient
  dimension: "[mass] / [length]**3 / [time]"
  description: Drag/friction coefficient gamma describing friction against the substrate (cytosol/plasma membrane) in Eq. (3).

- id: characteristic_active_stress
  name: active stress amplitude
  dimension: "[mass] / [length] / [time]**2"
  description: Characteristic isotropic active stress amplitude (zeta*Delta_mu)_0 in Eq. (5).

- id: diffusion_coefficient
  name: diffusion coefficient of species A
  dimension: "[length]**2 / [time]"
  description: Diffusion coefficient D of chemical species A in Eqs. (1) and (12)-(13).

- id: diffusivity_ratio
  name: diffusivity ratio of species I to A
  dimension: dimensionless
  description: Positive ratio alpha = D_I / D of the diffusion coefficients of species I and A in Eq. (2).

- id: turnover_rate
  name: chemical turnover rate of species A
  dimension: "1 / [time]"
  description: Linear relaxation/turnover rate kappa of species A in Eq. (12).

- id: turnover_rate_ratio
  name: turnover rate ratio of species I to A
  dimension: dimensionless
  description: Positive ratio rho of the turnover rate of species I to that of species A in Eq. (13).

- id: dimensionless_turnover_rate
  name: dimensionless turnover rate
  dimension: dimensionless
  description: Product kappa * tau = kappa * ell^2 / D of species A turnover rate and diffusive timescale (Fig. 3).

- id: hydrodynamic_length
  name: characteristic hydrodynamic length scale
  dimension: "[length]"
  description: Hydrodynamic screening length ell = sqrt(eta / gamma) (or sqrt(eta_v / gamma) in d = 1 from Eq. 4).

- id: turnover_length
  name: reaction-diffusion turnover length scale
  dimension: "[length]"
  description: Additional length scale sqrt(D / kappa) set by diffusivity D and turnover rate kappa (p. 4).

- id: turnover_to_hydrodynamic_length_ratio
  name: ratio of turnover length to hydrodynamic length
  dimension: dimensionless
  description: Dimensionless ratio sqrt(D / kappa) / ell = 1 / sqrt(kappa * tau).

- id: characteristic_velocity
  name: characteristic active flow velocity
  dimension: "[length] / [time]"
  description: Characteristic active velocity scale U = (zeta*Delta_mu)_0 / sqrt(eta * gamma) (p. 2).

- id: flow_velocity
  name: hydrodynamic flow velocity
  dimension: "[length] / [time]"
  description: Spatial velocity field v or Fourier amplitude magnitude |v_hat_k| in Eqs. (1)-(4) and (6).

- id: diffusive_timescale
  name: diffusive time scale
  dimension: "[time]"
  description: Diffusive relaxation time scale tau = ell^2 / D (p. 2).

- id: advective_timescale
  name: advective time scale
  dimension: "[time]"
  description: Characteristic advective time scale tau_a = ell / U (p. 2).

- id: peclet_number
  name: active Peclet number
  dimension: dimensionless
  description: Dimensionless ratio P = (zeta*Delta_mu)_0 / (gamma * D) = tau / tau_a of diffusive to advective timescales.

- id: spatial_dimension
  name: spatial dimension
  dimension: dimensionless
  description: Spatial dimension d (1 or 2) of the thin active film in Eq. (4) and simulations.

- id: viscous_screening_coefficient
  name: dimensionless viscous screening coefficient
  dimension: dimensionless
  description: "Coefficient nu in (1 + nu * k^2 * ell^2): nu = 1 for d = 1 and nu = 1 + eta_v / eta for d = 2 (p. 2)."

- id: domain_length
  name: thin-film system size
  dimension: "[length]"
  description: Finite spatial domain size L of the thin active film (pp. 1-3).

- id: dimensionless_domain_length
  name: dimensionless domain length
  dimension: dimensionless
  description: Ratio L / ell of system size to hydrodynamic length scale.

- id: boundary_condition_factor
  name: boundary condition wavenumber factor
  dimension: dimensionless
  description: "Factor omega in k_n = omega * n * pi / L: omega = 1 for no-flux and omega = 2 for periodic BCs (p. 2)."

- id: mode_number
  name: spatial Fourier mode index
  dimension: dimensionless
  description: Integer mode number n in k_n = omega * n * pi / L (p. 2).

- id: wavenumber
  name: spatial perturbation wavenumber
  dimension: "1 / [length]"
  description: Spatial perturbation wavenumber k = |k| in Eqs. (6)-(9).

- id: dimensionless_wavenumber
  name: dimensionless wavenumber
  dimension: dimensionless
  description: Product k * ell of spatial wavenumber and hydrodynamic length scale.

# Active stress regulation and concentrations
- id: normalized_activator_concentration
  name: normalized species A concentration
  dimension: dimensionless
  description: Dimensionless concentration ratio A / A_0 relative to homogeneous mean/steady-state A_0.

- id: normalized_inhibitor_concentration
  name: normalized species I concentration
  dimension: dimensionless
  description: Dimensionless concentration ratio I / I_0 relative to homogeneous mean/steady-state I_0.

- id: base_active_stress
  name: base active stress level
  dimension: dimensionless
  description: Non-negative baseline constant f_0 >= 0 in Eq. (11).

- id: stress_asymmetry_parameter
  name: active stress regulation asymmetry parameter
  dimension: dimensionless
  description: Asymmetry parameter beta in Eq. (11) governing up- vs down-regulation by species A and I.

- id: saturation_ratio
  name: dimensionless saturation concentration ratio
  dimension: dimensionless
  description: Ratio xi = A_s / A_0 = I_s / I_0 of saturation concentration to homogeneous mean concentration (p. 3).

- id: dimensionless_active_stress
  name: dimensionless active stress regulation function
  dimension: dimensionless
  description: Dimensionless active stress f(c) = zeta*Delta_mu / (zeta*Delta_mu)_0 in Eqs. (5) and (11).

- id: active_stress_perturbation
  name: dimensionless Fourier active stress perturbation
  dimension: dimensionless
  description: Combined linear Fourier amplitude A_hat_k * d_A f + I_hat_k * d_I f appearing in Eq. (6).

- id: activator_stress_sensitivity
  name: dimensionless active stress sensitivity to species A
  dimension: dimensionless
  description: Product A_0 * f_A = A_0 * d_A f(c_0) appearing in Eqs. (7)-(10).

- id: inhibitor_stress_sensitivity
  name: dimensionless active stress sensitivity to species I
  dimension: dimensionless
  description: Product I_0 * f_I = I_0 * d_I f(c_0) appearing in Eqs. (7)-(10).

- id: total_stress_sensitivity
  name: combined active stress sensitivity
  dimension: dimensionless
  description: Sum A_0 * f_A + I_0 * f_I appearing in the trace Eq. (8) and threshold Eq. (10).

# Linear stability observables
- id: stability_matrix_trace
  name: linear stability matrix trace
  dimension: "1 / [time]"
  description: Dimensional trace tr(L) of the linear stability matrix in Eq. (8).

- id: stability_matrix_discriminant
  name: linear stability matrix discriminant
  dimension: "1 / [time]**2"
  description: Dimensional discriminant Delta(L) = (tr L)^2 - 4 det(L) in Eq. (9).

- id: dimensionless_matrix_trace
  name: dimensionless linear stability matrix trace
  dimension: dimensionless
  description: Trace of the nondimensionalized stability matrix tau * L in Eq. (7) and Eqs. (12)-(13).

- id: dimensionless_matrix_determinant
  name: dimensionless linear stability matrix determinant
  dimension: dimensionless
  description: Determinant of the nondimensionalized stability matrix tau * L.

- id: dimensionless_matrix_discriminant
  name: dimensionless linear stability matrix discriminant
  dimension: dimensionless
  description: Discriminant (tr(tau*L))^2 - 4 det(tau*L) of the nondimensionalized stability matrix.

- id: dimensionless_growth_rate
  name: dimensionless linear growth rate
  dimension: dimensionless
  description: Real part Re[tau * lambda_+(k)] of the leading eigenvalue of tau * L (Fig. 1a-c).

- id: dimensionless_oscillation_frequency
  name: dimensionless linear oscillation frequency
  dimension: dimensionless
  description: Imaginary part magnitude |Im[tau * lambda_+(k)]| of the leading eigenvalue of tau * L (Fig. 1a-c, e).

- id: dimensionless_oscillation_period
  name: dimensionless oscillation time period
  dimension: dimensionless
  description: Scaled oscillation period T / tau from linear stability 2*pi / Im[tau * lambda_+(k_1)] or PDE simulations (Fig. 1e).

- id: instability_type_indicator
  name: oscillatory instability indicator
  dimension: dimensionless
  description: Indicator equal to 1 if the primary linear instability at P_c is oscillatory (Hopf) and 0 if stationary.

# PDE simulation coordinates and observables
- id: dimensionless_position
  name: dimensionless spatial coordinate
  dimension: dimensionless
  description: Scaled spatial coordinate x / ell plotted in Fig. 2.

- id: dimensionless_time
  name: dimensionless evolution time
  dimension: dimensionless
  description: Scaled time t / tau nondimensionalized by diffusive timescale tau = ell^2 / D.

- id: dimensionless_velocity
  name: dimensionless flow velocity
  dimension: dimensionless
  description: Scaled velocity v * tau / ell plotted in Fig. 2(b,d,f).

- id: initial_perturbation_amplitude
  name: initial perturbation amplitude
  dimension: dimensionless
  description: Small initial perturbation amplitude about the homogeneous state (A/A_0 = 1, I/I_0 = 1) in PDE simulations.

- id: pattern_state_code
  name: long-time PDE pattern state code
  dimension: dimensionless
  description: Discrete pattern classification of long-time PDE dynamics (0 = homogeneous, 1 = stationary, 2 = oscillating or drifting).

- id: oscillation_amplitude
  name: oscillation peak-to-trough amplitude
  dimension: dimensionless
  description: Temporal peak-to-trough variation of max(A/A_0) or max(I/I_0) over the post-transient window in PDE simulations.

- id: peak_count
  name: number of concentration peaks
  dimension: dimensionless
  description: Count of distinct spatial local maxima in A/A_0 in a 2D patterned state (Fig. 3).

- id: oscillation_phase_fraction
  name: oscillation cycle phase fraction
  dimension: dimensionless
  description: Dimensionless phase offset phi_0 = (t - t_peak) / T relative to the inhibitor concentration peak at x/ell = pi in the 1D limit cycle (Fig. 2).

