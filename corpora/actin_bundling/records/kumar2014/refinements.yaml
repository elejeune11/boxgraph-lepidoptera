- id: ref_pde_1d_fig2_ngrid
  run: run_pde_1d_fig2
  setting: n_grid
  factors: [1, 2, 4]
  mode: multiply
  output: T_over_tau
  tolerance: "0.5%"
  tolerance_basis: "added: well below 1% precision for the oscillation period T/tau in Figs. 1(e) and 2"
  tolerance_added: true

- id: ref_pde_1d_fig2_dt
  run: run_pde_1d_fig2
  setting: dt
  factors: [1, 2, 4]
  mode: divide
  output: T_over_tau
  tolerance: "0.5%"
  tolerance_basis: "added: well below 1% precision for the oscillation period T/tau in Figs. 1(e) and 2"
  tolerance_added: true

- id: ref_pde_1d_fig1e_beta3_dt
  run: run_pde_1d_fig1e_beta3
  setting: dt
  factors: [1, 2, 4]
  mode: divide
  output: T_over_tau
  tolerance: "0.5%"
  tolerance_basis: "added: well below 1% visual precision of the Fig. 1(e) period at P = 1.2, beta = 3"
  tolerance_added: true

- id: ref_pde_2d_fig3b_ngrid
  run: run_pde_2d_fig3b
  setting: n_grid
  factors: [1, 2]
  mode: multiply
  output: A_max
  tolerance: "2%"
  tolerance_basis: "added: sufficient for checking grid convergence of 2D stationary hexagon peak amplitude in Fig. 3(b)"
  tolerance_added: true

- id: ref_pde_2d_fig3b_dt
  run: run_pde_2d_fig3b
  setting: dt
  factors: [1, 2, 4]
  mode: divide
  output: A_max
  tolerance: "2%"
  tolerance_basis: "added: sufficient for checking temporal convergence of 2D stationary hexagon peak amplitude in Fig. 3(b)"
  tolerance_added: true
