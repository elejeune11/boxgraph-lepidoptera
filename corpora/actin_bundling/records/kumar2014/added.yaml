# Representative dimensional scales (the paper works in dimensionless units throughout)
- id: eta_added
  quantity: shear_viscosity
  unit: Pa*s
  printed: "1.0"
  basis: "Paper does not state numerical SI viscosities; unit reference value chosen for dimensional scaling verification."
  alternatives: ["0.1", "10.0"]
  stands_for: "eta in ell = sqrt(eta/gamma) and U = (zeta*Delta_mu)_0 / sqrt(eta*gamma)"

- id: eta_v_added
  quantity: bulk_viscosity
  unit: Pa*s
  printed: "3.0"
  basis: "Chosen consistent with eta_v = 3 eta (footnote [29]) for eta = 1 Pa*s, and positive 1D extensional viscosity in Eq. (4)."
  alternatives: ["1.0", "10.0"]
  stands_for: "eta_v in Eq. (4)"

- id: gamma_added
  quantity: friction_coefficient
  unit: Pa*s/m^2
  printed: "1.0"
  basis: "Paper does not state a numerical SI friction coefficient; unit reference value yields ell = 1 m when eta = 1 Pa*s."
  alternatives: ["0.1", "10.0"]
  stands_for: "gamma in Eqs. (3), (6), and P = (zeta*Delta_mu)_0 / (gamma*D)"

- id: zdm0_added
  quantity: characteristic_active_stress
  unit: Pa
  printed: "1.2"
  basis: "Paper does not state a numerical SI active stress amplitude; chosen so P = (zeta*Delta_mu)_0/(gamma*D) = 1.2 (Fig. 1e) when gamma = 1 Pa*s/m^2 and D = 1 m^2/s."
  alternatives: ["1.1", "1.3"]
  stands_for: "(zeta*Delta_mu)_0 in Eqs. (5)-(6) and P"

- id: D_added
  quantity: diffusion_coefficient
  unit: m^2/s
  printed: "1.0"
  basis: "Paper does not state a numerical SI diffusion coefficient; unit reference value yields tau = ell^2 / D = 1 s when ell = 1 m."
  alternatives: ["0.1", "10.0"]
  stands_for: "D in Eqs. (1)-(2), (8)-(9), and (12)-(13)"

- id: kappa_added
  quantity: turnover_rate
  unit: 1/s
  printed: "1.0"
  basis: "Paper specifies only dimensionless kappa*tau = 1 (Fig. 3); unit value matches kappa*tau = 1 for tau = 1 s."
  alternatives: ["0.1", "10.0"]
  stands_for: "kappa in Eq. (12) and turnover length scale sqrt(D/kappa)"

- id: k_sample_added
  quantity: wavenumber
  unit: 1/m
  printed: "1.0"
  basis: "Representative wavenumber matching k_1*ell = 1 for L/ell = 2*pi periodic BCs when ell = 1 m."
  alternatives: ["0.5", "2.0"]
  stands_for: "k in Eqs. (6), (8), and (9)"

# Unstated Peclet numbers and beta points for Fig. 1 and Fig. 2
- id: P_fig1a_added
  quantity: peclet_number
  unit: dimensionless
  printed: "0.2"
  basis: "Fig. 1(a) caption states only P < P_c without a numerical value; P = 0.2 matches the plotted dispersion curve (Im[tau*lambda_+] drops to 0 at k*ell ~= 1.26 and Re[tau*lambda_+(2)] ~= -0.8)."
  alternatives: ["0.15", "0.3"]
  stands_for: "P in Fig. 1(a)"

- id: P_fig1c_added
  quantity: peclet_number
  unit: dimensionless
  printed: "1.5"
  basis: "Fig. 1(c) caption states only P > P_c without a numerical value; P = 1.5 matches the plotted dispersion curve (max Re[tau*lambda_+] ~= 0.23, zero crossing at k*ell ~= 1.31, Re[tau*lambda_+(2)] = -1.0)."
  alternatives: ["1.4", "1.6"]
  stands_for: "P in Fig. 1(c)"

- id: beta_fig2_added
  quantity: stress_asymmetry_parameter
  unit: dimensionless
  printed: "1.4"
  basis: "Fig. 2 caption refers to 'the point marked with crossed symbol, Fig. 1(d)' without printing coordinates; on the delta_beta = 0.1 grid in Fig. 1(d) the crossed symbol lies at beta = 1.4, and 1D PDE peaks (max A/A0 ~= 2.03, max I/I0 ~= 5.59, max |v*tau/ell| ~= 1.12) match Fig. 2."
  alternatives: ["1.3", "1.5"]
  stands_for: "beta at the crossed symbol in Fig. 1(d) / Fig. 2"

- id: P_fig2_added
  quantity: peclet_number
  unit: dimensionless
  printed: "1.3"
  basis: "On the delta_P = 0.1 grid in Fig. 1(d), the crossed symbol lies one row above the gray rectangle (P = 1.2), at P = 1.3."
  alternatives: ["1.2", "1.4"]
  stands_for: "P at the crossed symbol in Fig. 1(d) / Fig. 2"

- id: P_high_stat_1d_added
  quantity: peclet_number
  unit: dimensionless
  printed: "1.6"
  basis: "Text (p. 3) states that 'for large enough P (and beta > 1), the oscillatory patterns are unstable and transition to stationary patterns'; at beta = 1.4, Fig. 1(d) shows stationary blue hexagons for P >= 1.4-1.5."
  alternatives: ["1.7", "1.8"]
  stands_for: "large enough P for oscillatory-to-stationary transition at beta = 1.4 (p. 3, Fig. 1d)"

- id: beta_both_up_added
  quantity: stress_asymmetry_parameter
  unit: dimensionless
  printed: "0"
  basis: "Representative value inside -1 <= beta <= 1 where both species up-regulate active stress (p. 2-3)."
  alternatives: ["-0.5", "0.5"]
  stands_for: "beta in the both-up-regulating regime (p. 2-3)"

- id: beta_codim2_gap_added
  quantity: stress_asymmetry_parameter
  unit: dimensionless
  printed: "1.01"
  basis: "Value in (1, (1 + alpha^2)/(1 - alpha^2)) = (1, 1.0202) for alpha = 0.1, where f_A > 0 and f_I < 0 yet stationary instability precedes oscillatory instability."
  alternatives: ["1.005", "1.015"]
  stands_for: "beta testing sufficiency of f_A > 0, f_I < 0 below Eq. (10)"

- id: beta_fig1e_mid_added
  quantity: stress_asymmetry_parameter
  unit: dimensionless
  printed: "2.0"
  basis: "Midpoint of the gray shaded rectangle beta in [1.2, 3.0] at P = 1.2 in Fig. 1(d)-(e)."
  alternatives: ["1.5", "2.5"]
  stands_for: "representative beta in Fig. 1(e)"

# Unstated PDE simulation parameters (pp. 3-4)
- id: t_max_1d_added
  quantity: dimensionless_time
  unit: dimensionless
  printed: "160"
  basis: "Paper does not state total integration time for 1D simulations ('at long times', Fig. 1d caption); 160 tau spans >4 full cycles at Fig. 2 parameters and >15 cycles at beta = 2-3."
  alternatives: ["120", "240"]
  stands_for: "long-time simulation horizon t_max / tau in 1D PDE (Figs. 1d, 1e, 2)"

- id: eps_init_added
  quantity: initial_perturbation_amplitude
  unit: dimensionless
  printed: "0.05"
  basis: "Paper states only 'starting with small random perturbations about the homogeneous state c0' (p. 3) without specifying an amplitude."
  alternatives: ["0.01", "0.1"]
  stands_for: "initial perturbation amplitude around (A/A0 = 1, I/I0 = 1)"

# Unstated 2D ARD simulation parameters for Fig. 3 (p. 4)
- id: L_over_l_fig3_2d_added
  quantity: dimensionless_domain_length
  unit: dimensionless
  printed: "31.41592653589793"
  basis: "Paper states only L = 2*pi (p. 3, for Eqs. 1-5) and omits the 2D box size for Fig. 3 (Eqs. 12-13). With nu = 4 (from footnote [29]), L/ell = 2*pi gives P_c^osc = 7.75 (outside Fig. 3a), whereas L/ell = 10*pi ~= 31.42 fits ~3 oscillatory wavelengths (lambda_c/ell ~= 10.32) and ~4 stationary wavelengths across the box, matching Fig. 3(a)-(i)."
  alternatives: ["25.132741228718345", "37.69911184307752"]
  stands_for: "2D periodic domain size L / ell in Fig. 3"

- id: beta_fig3b_added
  quantity: stress_asymmetry_parameter
  unit: dimensionless
  printed: "1.3"
  basis: "Coordinates of the crossed stationary-hexagon point in Fig. 3(a) shown in Fig. 3(b) are not printed as text; visually at beta = 1.3 on the delta_beta = 0.1 grid."
  alternatives: ["1.2", "1.4"]
  stands_for: "beta for Fig. 3(b)"

- id: P_fig3b_added
