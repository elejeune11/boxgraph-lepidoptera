  printed: "6.2"
  basis: "Coordinates of the crossed points in Fig. 3(a) are not printed as text; visually at P = 6.2 on the delta_P = 0.1 grid for both Fig. 3(b) and Fig. 3(c)-(e)."
  alternatives: ["6.3", "6.4"]
  stands_for: "P for Fig. 3(b) and Fig. 3(c)-(e)"

- id: beta_fig3c_added
  quantity: stress_asymmetry_parameter
  unit: dimensionless
  printed: "1.5"
  basis: "Visually located at beta = 1.5 in Fig. 3(a) for both the crossed oscillating-square point (Fig. 3c-e, P = 6.2) and crossed drifting-square point (Fig. 3f, P = 6.3)."
  alternatives: ["1.6", "1.7"]
  stands_for: "beta for Fig. 3(c)-(e) and Fig. 3(f)"

- id: beta_fig3g_added
  quantity: stress_asymmetry_parameter
  unit: dimensionless
  printed: "1.9"
  basis: "Visually located at beta = 1.9 in Fig. 3(a) for the crossed oscillating-honeycomb point shown in Fig. 3(g)-(i)."
  alternatives: ["2.0", "2.1"]
  stands_for: "beta for Fig. 3(g)-(i)"

- id: P_fig3g_added
  quantity: peclet_number
  unit: dimensionless
  printed: "6.3"
  basis: "Visually located at P = 6.3 in Fig. 3(a) for the crossed drifting-square (Fig. 3f) and oscillating-honeycomb (Fig. 3g-i) points."
  alternatives: ["6.4", "6.5"]
  stands_for: "P for Fig. 3(f) and Fig. 3(g)-(i)"

- id: t_max_2d_added
  quantity: dimensionless_time
  unit: dimensionless
  printed: "120"
  basis: "Paper does not state the 2D PDE integration horizon for Fig. 3; 120 tau reaches settled stationary hexagons at (beta = 1.3, P = 6.2)."
  alternatives: ["80", "160"]
  stands_for: "integration horizon t_max / tau for 2D ARD PDE (Fig. 3)"

# Unstated inputs identified during calibrated figure digitization (Figs. 1b, 2)
- id: P_fig1b_fit_added
  quantity: peclet_number
  unit: dimensionless
  printed: "0.50"
  basis: "Fig. 1(b) is labeled P = P_c without printing a numerical value; 2400-dpi digitization of both Re[tau*lambda_+] and Im[tau*lambda_+] matches P = 0.50 to < 0.005 (including the turnover peak of Im[tau*lambda_+] near k*ell = 1.75), whereas neither Eq. (10)'s finite-domain P_c = 1.1 nor the infinite-domain P_c^(inf) = 0.55 matches the plotted curves."
  alternatives: ["0.55", "1.1"]
  stands_for: "actual P plotted in Fig. 1(b)"

- id: phi0_fig2_added
  quantity: oscillation_phase_fraction
  unit: dimensionless
  printed: "-0.185"
  basis: "Fig. 2 captions label the three snapshot columns t, t + T/4, and t + T/2 without specifying the arbitrary reference time t on the periodic limit cycle; phi_0 = (t - t_peak)/T = -0.185 aligns both panels (a,b) at t and panels (c,d) at t + T/4 with the 1D PDE limit cycle."
  alternatives: ["-0.193", "-0.180"]
  stands_for: "initial cycle phase (t - t_peak)/T of Fig. 2(a,b)"

- id: t_max_1d_profiles_added
  quantity: dimensionless_time
  unit: dimensionless
  printed: "200"
  basis: "Integration horizon for extracting settled limit-cycle spatial snapshots in Fig. 2 (spans ~5.6 full cycles of T ~= 35.7 tau at beta = 1.4, P = 1.3; matches t_max = 320 to 0.02%)."
  alternatives: ["160", "240"]
  stands_for: "settled integration horizon t_max / tau for Fig. 2 spatial profile extraction"

