id: active_stress_regulation_eq11
name: two-species active stress regulation function (Eq. 11)
role: model
stated:
  page: 2
  printed_page: "208101-2"
  quote: "we choose the active stress regulation function f"
  where: "Eq. 11"
equation: "f(c) = f_0 + (1 + beta) * A / (A + A_s) + (1 - beta) * I / (I + I_s); A_0*f_A = (1+beta)*xi/(A/A_0+xi)^2; I_0*f_I = (1-beta)*xi/(I/I_0+xi)^2"
inputs:
  f_0:
    quantity: base_active_stress
    unit: dimensionless
  beta:
    quantity: stress_asymmetry_parameter
    unit: dimensionless
  A_norm:
    quantity: normalized_activator_concentration
    unit: dimensionless
  I_norm:
    quantity: normalized_inhibitor_concentration
    unit: dimensionless
  xi:
    quantity: saturation_ratio
    unit: dimensionless
    description: Dimensionless saturation ratio xi = A_s / A_0 = I_s / I_0.
outputs:
  f:
    quantity: dimensionless_active_stress
    unit: dimensionless
  A0_fA:
    quantity: activator_stress_sensitivity
    unit: dimensionless
  I0_fI:
    quantity: inhibitor_stress_sensitivity
    unit: dimensionless
  sum_sens:
    quantity: total_stress_sensitivity
    unit: dimensionless
settings: {}
stochastic: false
