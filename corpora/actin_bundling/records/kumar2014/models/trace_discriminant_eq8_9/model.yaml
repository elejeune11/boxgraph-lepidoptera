id: trace_discriminant_eq8_9
name: dimensional trace and discriminant of linear stability matrix (Eqs. 8-9)
role: model
stated:
  page: 2
  printed_page: "208101-2"
  quote: "tr L ¼ −Dk2 ½ð1 þ αÞ − ΠðkÞðA0 f A þ I 0 f I Þ ; (8)"
  where: "Eqs. 8-9"
equation: "tr L = -D*k^2*[(1+alpha) - Pi(k)*(A0*fA + I0*fI)]; Delta L = D^2*k^4*[(1-alpha)^2 + Pi(k)^2*(A0*fA + I0*fI)^2 - 2*Pi(k)*(1-alpha)*(A0*fA - I0*fI)], Pi(k) = P/(1 + nu*k^2*ell^2)"
inputs:
  D:
    quantity: diffusion_coefficient
    unit: m^2/s
  k:
    quantity: wavenumber
    unit: 1/m
  ell:
    quantity: hydrodynamic_length
    unit: m
  alpha:
    quantity: diffusivity_ratio
    unit: dimensionless
  P:
    quantity: peclet_number
    unit: dimensionless
  nu:
    quantity: viscous_screening_coefficient
    unit: dimensionless
  A0_fA:
    quantity: activator_stress_sensitivity
    unit: dimensionless
  I0_fI:
    quantity: inhibitor_stress_sensitivity
    unit: dimensionless
outputs:
  tr_L:
    quantity: stability_matrix_trace
    unit: 1/s
  disc_L:
    quantity: stability_matrix_discriminant
    unit: 1/s^2
  tr_tau_L:
    quantity: dimensionless_matrix_trace
    unit: dimensionless
  disc_tau_L:
    quantity: dimensionless_matrix_discriminant
    unit: dimensionless
settings: {}
stochastic: false
