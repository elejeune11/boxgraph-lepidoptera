id: ard_linear_stability_eq12_13
name: linear stability matrix for active stress-advection-reaction-diffusion model (Eqs. 12-13)
role: model
from_words: true
stated:
  page: 4
  printed_page: "208101-4"
  quote: "We analyzed this system in a manner analogous to the"
  where: "Eqs. 12-13 / p. 4 text"
equation: "tau * L_ARD = -k^2*ell^2 * I_2 - kappa*tau * diag(1, rho) + (P*k^2*ell^2 / (1 + nu*k^2*ell^2)) * [[A0*fA, A0*fI], [I0*fA, I0*fI]]"
built_from:
  - linear_stability_ad_eq7
inputs:
  k_l:
    quantity: dimensionless_wavenumber
    unit: dimensionless
  kappa_tau:
    quantity: dimensionless_turnover_rate
    unit: dimensionless
  rho:
    quantity: turnover_rate_ratio
    unit: dimensionless
  P:
    quantity: peclet_number
    unit: dimensionless
  nu:
    quantity: viscous_screening_coefficient
    unit: dimensionless
  A0_fA:
    quantity: activator_stress_sensitivity
    unit: dimensionless
  I0_fI:
    quantity: inhibitor_stress_sensitivity
    unit: dimensionless
outputs:
  tr_tau_L:
    quantity: dimensionless_matrix_trace
    unit: dimensionless
  det_tau_L:
    quantity: dimensionless_matrix_determinant
    unit: dimensionless
  disc_tau_L:
    quantity: dimensionless_matrix_discriminant
    unit: dimensionless
  re_lam_plus:
    quantity: dimensionless_growth_rate
    unit: dimensionless
  im_lam_plus:
    quantity: dimensionless_oscillation_frequency
    unit: dimensionless
settings: {}
stochastic: false
