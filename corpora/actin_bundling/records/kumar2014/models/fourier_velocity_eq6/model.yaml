id: fourier_velocity_eq6
name: linearized Fourier velocity amplitude (Eq. 6)
role: model
stated:
  page: 2
  printed_page: "208101-2"
  quote: "Fourier-amplitude of the hydrodynamic velocity field reads"
  where: "Eq. 6"
equation: "v_hat_k = i * k * (zeta*Delta_mu)_0 * (A_hat_k * d_A f + I_hat_k * d_I f) / (gamma * (1 + nu * k^2 * ell^2))"
inputs:
  k:
    quantity: wavenumber
    unit: 1/m
  zdm0:
    quantity: characteristic_active_stress
    unit: Pa
  df_hat:
    quantity: active_stress_perturbation
    unit: dimensionless
    description: Combined Fourier perturbation A_hat_k * d_A f + I_hat_k * d_I f.
  gamma:
    quantity: friction_coefficient
    unit: Pa*s/m^2
  nu:
    quantity: viscous_screening_coefficient
    unit: dimensionless
  ell:
    quantity: hydrodynamic_length
    unit: m
outputs:
  v_hat_amp:
    quantity: flow_velocity
    unit: m/s
    description: Imaginary-axis amplitude of v_hat_k (vanishes at homogeneous steady state df_hat = 0).
settings: {}
stochastic: false
