id: advection_diffusion_pde_1d_period_curve
name: 1D PDE vectorized oscillation period curve evaluator T/tau(beta) (Fig. 1e)
role: model
stated:
  page: 3
  printed_page: "208101-3"
  quote: "period of oscillations T determined numerically, for the points"
  where: "Eqs. 1-5, 11 / Fig. 1(e)"
equation: "Vectorized evaluation of 1D PDE oscillation period T/tau across all beta values of Fig. 1(e) at fixed P"
built_from:
  - advection_diffusion_pde_1d
inputs:
  P:
    quantity: peclet_number
    unit: dimensionless
  alpha:
    quantity: diffusivity_ratio
    unit: dimensionless
  xi:
    quantity: saturation_ratio
    unit: dimensionless
  f_0:
    quantity: base_active_stress
    unit: dimensionless
  L_over_l:
    quantity: dimensionless_domain_length
    unit: dimensionless
  t_max:
    quantity: dimensionless_time
    unit: dimensionless
  eps_init:
    quantity: initial_perturbation_amplitude
    unit: dimensionless
  T_ref:
    quantity: dimensionless_oscillation_period
    unit: dimensionless
    curve:
      quantity: stress_asymmetry_parameter
      unit: dimensionless
    description: Reference digitized period curve supplying the beta positions in Fig. 1(e).
outputs:
  T_over_tau:
    quantity: dimensionless_oscillation_period
    unit: dimensionless
    curve:
      quantity: stress_asymmetry_parameter
      unit: dimensionless
settings:
  n_grid: 64
  dt: 0.03
stochastic: false
