id: ard_stability_boundary_finite_2d
name: finite-domain periodic linear stability boundary for 2D turnover model (Eqs. 12-13)
role: model
from_words: true
stated:
  page: 4
  printed_page: "208101-4"
  quote: "Figure 3 shows the phase diagram of this system, together"
  where: "Eqs. 12-13 / Fig. 3(a)"
equation: "min over discrete periodic 2D wavevectors k_{nx,ny}*ell = (2*pi/(L/ell))*sqrt(nx^2+ny^2) != 0 of P_osc(k) and P_stat(k)"
built_from:
  - ard_linear_stability_eq12_13
inputs:
  beta:
    quantity: stress_asymmetry_parameter
    unit: dimensionless
  kappa_tau:
    quantity: dimensionless_turnover_rate
    unit: dimensionless
  rho:
    quantity: turnover_rate_ratio
    unit: dimensionless
  nu:
    quantity: viscous_screening_coefficient
    unit: dimensionless
  L_over_l:
    quantity: dimensionless_domain_length
    unit: dimensionless
outputs:
  P_c:
    quantity: peclet_number
    unit: dimensionless
  P_c_osc:
    quantity: peclet_number
    unit: dimensionless
  P_c_stat:
    quantity: peclet_number
    unit: dimensionless
  is_oscillatory:
    quantity: instability_type_indicator
    unit: dimensionless
settings:
  n_max: 20
stochastic: false
