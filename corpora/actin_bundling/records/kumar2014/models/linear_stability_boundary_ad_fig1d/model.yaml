id: linear_stability_boundary_ad_fig1d
name: full linear stability boundary P_c(beta) for advection-diffusion model (Eqs. 7-11, Fig. 1d)
role: model
stated:
  page: 3
  printed_page: "208101-3"
  quote: "stability boundary for the homogeneous state. The symbols"
  where: "Eqs. 7-11 / Fig. 1(d)"
equation: "P_c_osc = (1+alpha)*(1+nu*k1^2*ell^2)/2; P_c_stat = alpha*(1+nu*k1^2*ell^2)/[alpha*(1+beta)+(1-beta)]; P_c(beta) = P_c_osc if oscillatory precedes stationary else P_c_stat"
built_from:
  - linear_stability_ad_fig1
  - oscillatory_threshold_eq10
inputs:
  beta:
    quantity: stress_asymmetry_parameter
    unit: dimensionless
  alpha:
    quantity: diffusivity_ratio
    unit: dimensionless
  omega:
    quantity: boundary_condition_factor
    unit: dimensionless
  L_over_l:
    quantity: dimensionless_domain_length
    unit: dimensionless
  nu:
    quantity: viscous_screening_coefficient
    unit: dimensionless
outputs:
  P_c:
    quantity: peclet_number
    unit: dimensionless
  P_c_osc:
    quantity: peclet_number
    unit: dimensionless
  is_oscillatory:
    quantity: instability_type_indicator
    unit: dimensionless
  beta_codim2:
    quantity: stress_asymmetry_parameter
    unit: dimensionless
    description: Exact Turing-Hopf codimension-2 threshold beta* = (1 + alpha^2)/(1 - alpha^2) for alpha < 1 (or -(1 + alpha^2)/(alpha^2 - 1) for alpha > 1).
settings: {}
stochastic: false
