id: oscillatory_threshold_infinite
name: infinite-domain oscillatory instability threshold P_c^(inf) (Fig. 1b)
role: model
stated:
  page: 3
  printed_page: "208101-3"
  quote: "numbers P: (a) P < Pc , (b) P ¼ Pc , and (c) P > Pc , where"
  where: "Eq. 10 (L -> oo) / Fig. 1(b)"
equation: "P_c^(inf) = (1 + alpha) / (A_0 * f_A + I_0 * f_I)"
built_from:
  - oscillatory_threshold_eq10
inputs:
  alpha:
    quantity: diffusivity_ratio
    unit: dimensionless
  A0_fA:
    quantity: activator_stress_sensitivity
    unit: dimensionless
  I0_fI:
    quantity: inhibitor_stress_sensitivity
    unit: dimensionless
outputs:
  P_c:
    quantity: peclet_number
    unit: dimensionless
settings: {}
stochastic: false
