id: linear_stability_ad_eq7
name: linear stability matrix and leading eigenvalue for advection-diffusion model (Eq. 7)
role: model
stated:
  page: 2
  printed_page: "208101-2"
  quote: "keeping only linear terms, we find the linear-stability"
  where: "Eq. 7"
equation: "tau * L = -k^2*ell^2 * diag(1, alpha) + (P*k^2*ell^2 / (1 + nu*k^2*ell^2)) * [[A0*fA, A0*fI], [I0*fA, I0*fI]]"
inputs:
  k_l:
    quantity: dimensionless_wavenumber
    unit: dimensionless
  alpha:
    quantity: diffusivity_ratio
    unit: dimensionless
  P:
    quantity: peclet_number
    unit: dimensionless
  nu:
    quantity: viscous_screening_coefficient
    unit: dimensionless
  A0_fA:
    quantity: activator_stress_sensitivity
    unit: dimensionless
  I0_fI:
    quantity: inhibitor_stress_sensitivity
    unit: dimensionless
outputs:
  tr_tau_L:
    quantity: dimensionless_matrix_trace
    unit: dimensionless
  det_tau_L:
    quantity: dimensionless_matrix_determinant
    unit: dimensionless
  disc_tau_L:
    quantity: dimensionless_matrix_discriminant
    unit: dimensionless
  re_lam_plus:
    quantity: dimensionless_growth_rate
    unit: dimensionless
  im_lam_plus:
    quantity: dimensionless_oscillation_frequency
    unit: dimensionless
settings: {}
stochastic: false
