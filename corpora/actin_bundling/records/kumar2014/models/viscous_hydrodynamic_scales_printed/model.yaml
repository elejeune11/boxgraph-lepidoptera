id: viscous_hydrodynamic_scales_printed
name: viscous screening coefficient and hydrodynamic length as printed (Eq. 4, p. 2)
role: model
stated:
  page: 2
  printed_page: "208101-2"
  quote: "dimensionless coefficient ν is ν ¼ 1 for d ¼ 1 and ν ¼ 1 þ ηv =η for d ¼ 2."
  where: "Eq. 4 / Eq. 6 text"
equation: "ell = sqrt(eta / gamma); nu = 1 (d = 1) or 1 + eta_v / eta (d = 2)"
inputs:
  eta:
    quantity: shear_viscosity
    unit: Pa*s
  eta_v:
    quantity: bulk_viscosity
    unit: Pa*s
  gamma:
    quantity: friction_coefficient
    unit: Pa*s/m^2
  d:
    quantity: spatial_dimension
    unit: dimensionless
outputs:
  ell:
    quantity: hydrodynamic_length
    unit: m
  nu:
    quantity: viscous_screening_coefficient
    unit: dimensionless
settings: {}
stochastic: false
