id: advection_diffusion_pde_1d_osc_boundary
name: 1D PDE upper oscillatory-to-stationary phase boundary curve P_osc_to_stat(beta) (Fig. 1d)
role: model
stated:
  page: 3
  printed_page: "208101-3"
  quote: "(and β > 1), the oscillatory patterns are unstable and"
  where: "Eqs. 1-5, 11 / Fig. 1(d)"
equation: "Vectorized bisection on 1D PDE long-time pattern state (oscillating vs stationary) vs Peclet number P across all beta values of Fig. 1(d)"
built_from:
  - advection_diffusion_pde_1d
inputs:
  alpha:
    quantity: diffusivity_ratio
    unit: dimensionless
  xi:
    quantity: saturation_ratio
    unit: dimensionless
  f_0:
    quantity: base_active_stress
    unit: dimensionless
  L_over_l:
    quantity: dimensionless_domain_length
    unit: dimensionless
  t_max:
    quantity: dimensionless_time
    unit: dimensionless
  eps_init:
    quantity: initial_perturbation_amplitude
    unit: dimensionless
  bnd_ref:
    quantity: peclet_number
    unit: dimensionless
    curve:
      quantity: stress_asymmetry_parameter
      unit: dimensionless
    description: Reference digitized boundary curve supplying the beta positions in Fig. 1(d).
outputs:
  P_osc_to_stat:
    quantity: peclet_number
    unit: dimensionless
    curve:
      quantity: stress_asymmetry_parameter
      unit: dimensionless
    description: "Upper critical Peclet number where 1D oscillatory standing waves lose stability to stationary peaks."
settings:
  n_grid: 48
  dt: 0.03
  n_bisect: 6
stochastic: false
