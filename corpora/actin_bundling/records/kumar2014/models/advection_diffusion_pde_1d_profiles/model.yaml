id: advection_diffusion_pde_1d_profiles
name: 1D active advection-diffusion PDE spatial snapshot evaluator (Eqs. 1-5, 11; Fig. 2)
role: model
stated:
  page: 3
  printed_page: "208101-3"
  quote: "active stress-advection-diffusion model in d ¼ 1 with parameter"
  where: "Eqs. 1-5, 11 / Fig. 2(a)-(f)"
equation: "d_t A = -d_x(v A) + d_xx A; d_t I = -d_x(v I) + alpha*d_xx I; (1 - d_xx) v = P * d_x f_scaled(A, I); sampled at t, t + T/4, t + T/2 on the settled limit cycle"
built_from:
  - advection_diffusion_pde_1d
inputs:
  P:
    quantity: peclet_number
    unit: dimensionless
  beta:
    quantity: stress_asymmetry_parameter
    unit: dimensionless
  alpha:
    quantity: diffusivity_ratio
    unit: dimensionless
  xi:
    quantity: saturation_ratio
    unit: dimensionless
  f_0:
    quantity: base_active_stress
    unit: dimensionless
  L_over_l:
    quantity: dimensionless_domain_length
    unit: dimensionless
  t_max:
    quantity: dimensionless_time
    unit: dimensionless
  eps_init:
    quantity: initial_perturbation_amplitude
    unit: dimensionless
  phi_0:
    quantity: oscillation_phase_fraction
    unit: dimensionless
  A_a_ref:
    quantity: normalized_activator_concentration
    unit: dimensionless
    curve: {quantity: dimensionless_position, unit: dimensionless}
  I_a_ref:
    quantity: normalized_inhibitor_concentration
    unit: dimensionless
    curve: {quantity: dimensionless_position, unit: dimensionless}
  v_b_ref:
    quantity: dimensionless_velocity
    unit: dimensionless
    curve: {quantity: dimensionless_position, unit: dimensionless}
