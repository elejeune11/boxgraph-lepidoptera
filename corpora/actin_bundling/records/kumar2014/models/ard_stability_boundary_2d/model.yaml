id: ard_stability_boundary_2d
name: continuous-wavenumber linear stability boundary for 2D turnover model (Eqs. 12-13, Fig. 3a)
role: model
from_words: true
stated:
  page: 4
  printed_page: "208101-4"
  quote: "Figure 3 shows the phase diagram of this system, together"
  where: "Eqs. 12-13 / Fig. 3(a)"
equation: "P_c_osc = (1 + sqrt(nu*kappa*tau*(1+rho)/2))^2 at k_c_osc*ell = (kappa*tau*(1+rho)/(2*nu))^(1/4); P_c_stat = min_{q>0} (1+nu*q)*(q+kappa*tau)*(q+rho*kappa*tau) / [q*(2*q + kappa*tau*(rho*(1+beta)+(1-beta)))]"
built_from:
  - ard_linear_stability_eq12_13
  - active_stress_regulation_eq11_scaled
inputs:
  beta:
    quantity: stress_asymmetry_parameter
    unit: dimensionless
  kappa_tau:
    quantity: dimensionless_turnover_rate
    unit: dimensionless
  rho:
    quantity: turnover_rate_ratio
    unit: dimensionless
  nu:
    quantity: viscous_screening_coefficient
    unit: dimensionless
outputs:
  P_c:
    quantity: peclet_number
    unit: dimensionless
  P_c_osc:
    quantity: peclet_number
    unit: dimensionless
  P_c_stat:
    quantity: peclet_number
    unit: dimensionless
  k_c_osc_l:
    quantity: dimensionless_wavenumber
    unit: dimensionless
  is_oscillatory:
    quantity: instability_type_indicator
    unit: dimensionless
settings: {}
stochastic: false
