id: advection_diffusion_pde_1d_profiles_unscaled_stress
name: 1D PDE spatial snapshot evaluator reporting unscaled Eq. (11) active stress (Fig. 2b,d,f)
role: model
variant_of: advection_diffusion_pde_1d_profiles
corrections:
  - equation: "p. 3 rescaling of Eq. (11) by (1 + xi)^2 / xi vs Fig. 2(b,d,f) active stress curve"
    change: "Keep rescaled f_scaled = ((1+xi)^2/xi) * f_Eq11 inside the PDE dynamics, but report unscaled f_Eq11 = f_scaled * xi / (1 + xi)^2 on f_b, f_d, f_f."
    evidence: "Calibrated 1800-dpi digitization of Fig. 2(b,d,f) measures the black curve labeled zeta*Delta_mu / zeta*Delta_mu_0 in [0.21, 0.74] (baseline 0.50), matching f_Eq11 = f_scaled / (16/3) to < 0.01 across panels (b) and (d), whereas literal f_scaled spans [1.13, 3.96] (5.33x higher)."
stated:
  page: 3
  printed_page: "208101-3"
  quote: "active stress-advection-diffusion model in d ¼ 1 with parameter"
  where: "Eqs. 1-5, 11 / Fig. 2(b,d,f)"
equation: "Same 1D PDE spatial snapshots as advection_diffusion_pde_1d_profiles with reported active stress f_report = f_scaled * xi / (1 + xi)^2 = f_Eq11"
built_from:
  - advection_diffusion_pde_1d_profiles
