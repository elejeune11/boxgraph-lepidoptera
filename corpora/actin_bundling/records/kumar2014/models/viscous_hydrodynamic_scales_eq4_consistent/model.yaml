id: viscous_hydrodynamic_scales_eq4_consistent
name: viscous screening coefficient and hydrodynamic length consistent with Eq. (4) and footnote [29]
role: model
variant_of: viscous_hydrodynamic_scales_printed
corrections:
  - equation: "p. 2 inline definition of ell below Eq. (6) together with Eq. (4) and Ref. [29]"
    change: "Use ell = sqrt(eta_v / gamma) instead of ell = sqrt(eta / gamma) when d = 1."
    evidence: "In d = 1, the traceless shear tensor [grad v + (grad v)^T - (2/d)(div v) 1] in Eq. (4) vanishes identically leaving sigma_p = eta_v d_x v, and footnote [29] (p. 5) explicitly sets eta = 0 in d = 1. Literally substituting eta = 0 into ell = sqrt(eta / gamma) collapses ell to 0 and makes U = (zeta*Delta_mu)_0 / sqrt(eta * gamma) singular, contradicting finite ell > 0 in Figs. 1-2."
stated:
  page: 2
  printed_page: "208101-2"
  quote: "dimensionless coefficient ν is ν ¼ 1 for d ¼ 1 and ν ¼ 1 þ ηv =η for d ¼ 2."
  where: "Eq. 4 / Eq. 6 text / Ref. [29]"
equation: "d = 1: ell = sqrt(eta_v / gamma), nu = 1; d = 2: ell = sqrt(eta / gamma), nu = 1 + eta_v / eta"
inputs:
  eta:
    quantity: shear_viscosity
    unit: Pa*s
  eta_v:
    quantity: bulk_viscosity
    unit: Pa*s
  gamma:
    quantity: friction_coefficient
    unit: Pa*s/m^2
  d:
    quantity: spatial_dimension
    unit: dimensionless
outputs:
  ell:
    quantity: hydrodynamic_length
    unit: m
  nu:
    quantity: viscous_screening_coefficient
    unit: dimensionless
settings: {}
stochastic: false
