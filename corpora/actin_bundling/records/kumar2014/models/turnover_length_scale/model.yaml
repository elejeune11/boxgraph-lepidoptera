id: turnover_length_scale
name: chemical turnover diffusion length scale (p. 4)
role: model
from_words: true
prefactor: unknown
stated:
  page: 4
  printed_page: "208101-4"
  quote: "ratio of the diffusivity D to the the turnover rate κ sets a"
  where: text
equation: "ell_kappa ~ sqrt(D / kappa); ell_kappa / ell ~ 1 / sqrt(kappa * tau)"
inputs:
  D:
    quantity: diffusion_coefficient
    unit: m^2/s
  kappa:
    quantity: turnover_rate
    unit: 1/s
  ell:
    quantity: hydrodynamic_length
    unit: m
outputs:
  ell_kappa:
    quantity: turnover_length
    unit: m
  ell_kappa_over_ell:
    quantity: turnover_to_hydrodynamic_length_ratio
    unit: dimensionless
settings: {}
stochastic: false
