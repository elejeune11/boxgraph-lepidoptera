id: oscillatory_threshold_eq10
name: critical Peclet number for oscillatory instability (Eq. 10)
role: model
stated:
  page: 2
  printed_page: "208101-2"
  quote: "increasing Péclet number, the homogeneous state under-"
  where: "Eq. 10"
equation: "P_c = (1 + alpha) * (1 + omega^2 * pi^2 * ell^2 * nu / L^2) / (A_0 * f_A + I_0 * f_I)"
inputs:
  alpha:
    quantity: diffusivity_ratio
    unit: dimensionless
  omega:
    quantity: boundary_condition_factor
    unit: dimensionless
  L_over_l:
    quantity: dimensionless_domain_length
    unit: dimensionless
  nu:
    quantity: viscous_screening_coefficient
    unit: dimensionless
  A0_fA:
    quantity: activator_stress_sensitivity
    unit: dimensionless
  I0_fI:
    quantity: inhibitor_stress_sensitivity
    unit: dimensionless
outputs:
  P_c:
    quantity: peclet_number
    unit: dimensionless
settings: {}
stochastic: false
