    is_oscillatory: is_osc_fig3_beta1p5
  note: "Continuous-k 2D ARD threshold at beta = 1.5: oscillatory instability at P_c = 6.1665 precedes stationary at 6.265, matching Fig. 3(a)."

- id: run_ard_boundary_fig3_beta1p9
  model: ard_stability_boundary_2d
  inputs:
