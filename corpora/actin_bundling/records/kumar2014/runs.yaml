    k_c_osc_l: k_c_osc_fig3_beta1p3
    is_oscillatory: is_osc_fig3_beta1p3
  note: "Continuous-k 2D ARD threshold at beta = 1.3: stationary instability at P_c = 5.547 precedes Hopf at 6.1665, matching Fig. 3(a)."

- id: run_ard_boundary_fig3_beta1p5
