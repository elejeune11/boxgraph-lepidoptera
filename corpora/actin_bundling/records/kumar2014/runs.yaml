# Dimensional scaling definitions (p. 2, p. 4, Ref. [29])
- id: run_hydrodynamic_length
  model: hydrodynamic_length
  inputs:
    eta: eta_added
    gamma: gamma_added
  outputs:
    ell: ell_ref

- id: run_hydrodynamic_length_1d_footnote29
  model: hydrodynamic_length
  inputs:
    eta: eta_1d_footnote29
    gamma: gamma_added
  outputs:
    ell: ell_1d_literal_zero
  note: "Evaluating printed ell = sqrt(eta/gamma) with footnote [29]'s printed eta = 0 in d = 1 yields ell = 0."

- id: run_characteristic_velocity
  model: characteristic_velocity
  inputs:
    zdm0: zdm0_added
    eta: eta_added
    gamma: gamma_added
  outputs:
    U: U_ref

- id: run_diffusive_timescale
  model: diffusive_timescale
  inputs:
    ell: ell_ref
    D: D_added
  outputs:
    tau: tau_ref

- id: run_advective_timescale
  model: advective_timescale
  inputs:
    ell: ell_ref
    U: U_ref
  outputs:
    tau_a: tau_a_ref

- id: run_peclet_physical
  model: peclet_number_physical
  inputs:
    zdm0: zdm0_added
    gamma: gamma_added
    D: D_added
  outputs:
    P: P_phys_ref

- id: run_peclet_timescale
  model: peclet_number_timescale
  inputs:
    tau: tau_ref
    tau_a: tau_a_ref
  outputs:
    P: P_timescale_ref

- id: run_viscous_scales_1d_printed
  model: viscous_hydrodynamic_scales_printed
  inputs:
    eta: eta_1d_footnote29
    eta_v: eta_v_added
    gamma: gamma_added
    d: d_1d
  outputs:
    ell: ell_1d_printed_pred
    nu: nu_1d_printed_pred
  note: "Verbatim p. 2 definitions with footnote [29] eta = 0 in d = 1: yields nu = 1 but collapses ell = 0."

- id: run_viscous_scales_1d_consistent
  model: viscous_hydrodynamic_scales_eq4_consistent
  inputs:
    eta: eta_1d_footnote29
    eta_v: eta_v_added
    gamma: gamma_added
    d: d_1d
  outputs:
    ell: ell_1d_consistent_pred
    nu: nu_1d_consistent_pred
  note: "Eq. (4)-consistent variant in d = 1: yields nu = 1 and finite ell = sqrt(eta_v / gamma) > 0."

- id: run_viscous_scales_2d_printed
  model: viscous_hydrodynamic_scales_printed
  inputs:
    eta: eta_added
    eta_v: eta_v_added
    gamma: gamma_added
    d: d_2d
  outputs:
    ell: ell_2d_printed_pred
    nu: nu_2d_scales_pred

- id: run_viscous_coeff_2d
  model: viscous_coefficient_2d
  inputs:
    eta_v_over_eta: eta_v_over_eta_2d
  outputs:
    nu: nu_2d_pred
  note: "Computes nu = 1 + eta_v / eta = 4 in d = 2 from footnote [29]'s thin-film relation eta_v = 3 eta."

- id: run_k1_periodic_2pi
  model: discrete_wavenumber
  inputs:
    omega: omega_periodic
    n: n_mode_1
    L_over_l: L_over_l_periodic_sim
  outputs:
    k_l: k1_l_periodic_2pi
  note: "Fundamental mode k_1 * ell = 1 for periodic domain L / ell = 2*pi (Figs. 1d, 1e, 2)."

- id: run_k1_noflux_2pi
  model: discrete_wavenumber
  inputs:
    omega: omega_noflux
    n: n_mode_1
    L_over_l: L_over_l_periodic_sim
  outputs:
    k_l: k1_l_noflux_2pi

- id: run_v_homog
  model: fourier_velocity_eq6
  inputs:
    k: k_sample_added
    zdm0: zdm0_added
    df_hat: df_hat_homog
    gamma: gamma_added
    nu: nu_1d_printed
    ell: ell_ref
  outputs:
    v_hat_amp: v_homog_pred
  note: "Eq. (6) at zero perturbation (homogeneous state c = c0) reproduces v = 0."

- id: run_turnover_length
  model: turnover_length_scale
  inputs:
    D: D_added
    kappa: kappa_added
    ell: ell_ref
  outputs:
    ell_kappa: ell_kappa_ref
    ell_kappa_over_ell: ell_kappa_over_ell_ref

# Active stress regulation function Eq. (11) and p. 3 scaling
- id: run_eq11_homog_fig2
  model: active_stress_regulation_eq11
  inputs:
    f_0: f0_sim
    beta: beta_fig2_added
    A_norm: A_norm_homog
    I_norm: I_norm_homog
    xi: xi_sim
  outputs:
    f: f_eq11_homog_fig2
    A0_fA: A0_fA_eq11_homog_fig2
    I0_fI: I0_fI_eq11_homog_fig2
    sum_sens: sum_sens_eq11_homog_fig2
  note: "Unscaled Eq. (11) at homogeneous state gives f = 0.50 matching the baseline of Fig. 2(b,d,f)."

- id: run_eq11_scaled_homog_beta3
