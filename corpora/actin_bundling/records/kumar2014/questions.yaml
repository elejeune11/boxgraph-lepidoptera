    - bois2011/asdm_dispersion_eq15
  text: >
    Cross-paper comparison with direct precursor bois2011 (Ref. [10]): (1) Kumar p. 3 states that
    when diffusivities are equal (alpha = 1) or both species up-regulate active stress (-1 <= beta <= 1),
    the system exhibits steady-state patterns as in Bois et al. (2011). Quantitatively, Kumar Eq. (7)
    reduces identically to Bois Eq. (12) in BOTH the equal-diffusivity limit (alpha -> 1, nu = 1,
    effective sensitivity c_0*df/dc = A_0*f_A + I_0*f_I) and the single-regulator limit (I_0*f_I -> 0
