    threshold P_c_osc = (1 + sqrt(nu*kappa*tau*(1 + rho)/2))^2 and critical wavenumber
    k_c_osc*ell = [kappa*tau*(1 + rho)/(2*nu)]^(1/4) algebraically IDENTICAL to Hannezo Eq. (10)'s
    single-species stationary threshold chi_c^(0) = (1 + sqrt(phi))^2 (at phi = nu*kappa*tau*(1 + rho)/2)
    and — at Kumar's 2D nu = 4 — to Mirza's isotropic threshold lambda_crit,0 = (1 + 2*sqrt(k_d))^2
    and nu_crit,0 = (k_d/4)^(1/4) at the mean turnover rate k_d = (1 + rho)*kappa*tau/2. On the
    stationary single-activator branch (beta = 1 or rho = 1), however, A_0*f_A = 2 enters against a
    single species' diffusion, giving P_c_stat = (1/2)*(1 + sqrt(nu*kappa*tau))^2 (half the normalized
    single-species value). (2) Three distinct mechanochemical oscillation mechanisms in the corpus:
    kumar2014 achieves pulsatory patterns on a FIXED substrate without chemical cross-reactions via
    two opposing stress regulators (f_A > 0, f_I < 0) with differential diffusivity (alpha < 1) or
    turnover (rho < 1); mietke2019 achieves oscillations with ONE stress regulator and ZERO substrate
    friction via geometric shape feedback on a deformable cylinder (eliminated in the stiff-cylinder
    limit kappa_tilde -> oo, where Mietke's Jacobian collapses to the low-friction 1-species limit
    of Kumar's ARD dispersion); barberi2023 achieves localized snaking/oscillatory pulses on a fixed
    substrate via a single mechanical actomyosin species coupled to nonlinear bistable nucleator
    chemistry (N_a, N_i) and nonmonotonic stress Pi(C) = Z*C^2 - B*C^3.
