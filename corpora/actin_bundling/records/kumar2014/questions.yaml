    Kumar Eq. (4) and Barberi Eq. (3) (corrected traceless form) both write
    sigma_p = 2*eta*[sym(grad v) - (1/d)*(div v)*I] + eta_v*(div v)*I, giving 1D longitudinal
    viscosity [2*eta*(1 - 1/d) + eta_v]. In d = 1 the shear term vanishes identically (exposing both
    Kumar footnote [29]'s eta = 0 vs ell = sqrt(eta/gamma) contradiction and Barberi Eq. 3's omitted
    1/d trace factor); in d = 2 both yield longitudinal viscosity eta*(1 + eta_v/eta) = eta*nu
