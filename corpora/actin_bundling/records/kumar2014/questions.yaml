    eta_v = 3*eta (Kumar footnote [29], Jenkins & Dysthe 1997) gives nu = 4 (longitudinal viscosity
    4*eta), which is IDENTICAL to Mirza Eq. (6)'s 2D compressible stress 2*eta*(d + tr(d)*I) -> 4*eta*d_x v
    and corresponds to Mietke SI Eq. (S80)'s surface viscosity ratio nu_bar = (eta_s + eta_b)/(4*eta_s)
    = nu/4 = 1 at eta_b = 3*eta_s. By contrast, bois2011, hannezo2015, and barberi2023 1D absorb the
    effective 1D longitudinal viscosity directly into eta (effectively nu = 1), which shifts the
    effective screening length sqrt(nu)*ell by 2x and the dimensionless critical wavenumber by sqrt(2)
