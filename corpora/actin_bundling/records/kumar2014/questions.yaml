- id: q_eq10_sufficiency_condition
  kind: overstated_claim
  about:
    - oscillatory_threshold_eq10
    - linear_stability_boundary_ad_fig1d
    - run_boundary_fig1d_codim2_gap
  text: >
    Below Eq. (10) (p. 2), the paper states that as P increases the homogeneous state undergoes
    an oscillatory instability at P = P_c = (1 + alpha)(1 + omega^2*pi^2*ell^2*nu/L^2)/(A_0*f_A + I_0*f_I)
    "if f_A > 0 and f_I < 0 for alpha < 1, or f_A < 0 and f_I > 0 for alpha > 1." Those sign
    conditions are necessary, not sufficient: from Eqs. (8)-(9), det(L) > 0 (equivalently
    Delta(L) < 0) at P = P_c > 0 requires the stricter quantitative bounds
    alpha^2 * A_0*f_A < -I_0*f_I < A_0*f_A (for alpha < 1) or
    alpha^(-2) * I_0*f_I < -A_0*f_A < I_0*f_I (for alpha > 1). For rescaled Eq. (11) with
    alpha = 0.1, there is a stationary gap 1 < beta < (1 + alpha^2)/(1 - alpha^2) = 101/99 ~= 1.0202
    (tested at beta = 1.01, where P_c_stat = 1.047 < P_c_osc = 1.1 and Delta(L) > 0 at P = 1.1),
    which widens substantially as alpha approaches 1 (e.g. 1 < beta < 5/3 for alpha = 0.5).
  citation:
    page: 2
    printed_page: "208101-2"
    quote: "if f A > 0 and f I < 0 for α < 1, or f A < 0 and f I > 0 for"
    where: "Eq. 10 text"

