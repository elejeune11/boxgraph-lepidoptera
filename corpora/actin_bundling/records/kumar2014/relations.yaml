- id: rel_bois2011_eq7_single_regulator_reduces_eq12
  kind: reduces_to
  a: kumar2014/linear_stability_ad_eq7
  b: bois2011/single_species_dispersion_eq12
  mapping:
    k: k_l
    D: "1"
    Pe: P
    c0: "1"
    df_dc: A0_fA
    l: "1"
  output_map:
    lam_dimless: re_lam_plus
  limit:
    I0_fI: "0"
    nu: "1"
  regime:
    k_l: [0.3, 1.5]
    alpha: [1.05, 3.0]
    P: [2.5, 6.0]
    nu: [1.0, 2.0]
    A0_fA: [2.0, 4.0]
    I0_fI: [0.01, 0.5]
  provenance: proposed
  reason: >
    Decoupling species I from active stress regulation (I_0*f_I -> 0) in 1D (nu -> 1) renders
    kumar2014's 2x2 stability matrix Eq. (7) lower-triangular with eigenvalues
    -q*(1 - P*A_0*f_A/(1 + q)) and -alpha*q. Whenever the decoupled species relaxes faster than
    species A (alpha > 1) and A up-regulates active stress (A_0*f_A > 0), the leading eigenvalue
    re_lam_plus reduces identically to bois2011 Eq. (12)'s dimensionless single-species dispersion
    relation lam_dimless = -q*(1 - Pe*c_0*df/dc/(1 + q)) with c_0*df/dc = A_0*f_A.
  assumptions:
    - "Single-regulator limit I_0*f_I -> 0 in 1D (nu -> 1) with alpha > 1 so the decoupled species I mode -alpha*q is strictly subdominant to the active species A mode"

