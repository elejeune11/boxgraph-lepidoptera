- id: rel_barberi2023_viscous_eq3_derived_nu_2d
  kind: derived_from
  a: barberi2023/viscous_stress_1d_eq3_corrected
  b: kumar2014/viscous_coefficient_2d
  mapping:
    eta_v_over_eta: "eta_tilde / eta"
  output_map:
    nu: viscous_coeff
  steps:
    - "subs: d = 2"
    - "simplify"
  regime:
    eta: [1.0, 100.0]
    eta_tilde: [1.0, 300.0]
    d: [1.0, 3.0]
    dv_dx: [0.1, 10.0]
  provenance: proposed
  reason: >
    Both kumar2014 Eq. (4) and barberi2023 Eq. (3) (in its corrected traceless strain-rate form
    viscous_stress_1d_eq3_corrected) write the passive Newtonian viscous stress of a d-dimensional
    compressible active fluid as sigma_p = 2*eta*[sym(grad v) - (1/d)(div v)I] + eta_v*(div v)I,
    giving longitudinal viscous coefficient [2*eta*(1 - 1/d) + eta_v]/eta. Setting d = 2 yields
    1 + eta_tilde/eta, symbolically identical to Kumar's 2D viscous screening coefficient nu = 1 + eta_v/eta.
  assumptions:
    - "Uses Barberi's corrected traceless strain-rate tensor (barberi2023/viscous_stress_1d_eq3_corrected) and identifies bulk viscosity eta_tilde = eta_v"

- id: rel_barberi2023_sm15_vel_scales_fourier_eq6
  kind: scales_as
  a: barberi2023/linear_stability_1d_sm15
  b: kumar2014/fourier_velocity_eq6
  mapping:
    k: K
    zdm0: Z
    df_hat: "1"
    gamma: "1"
    nu: "1"
    ell: "1"
  output_map:
    v_hat_amp: vel_response_imag
  regime:
    K: [0.2, 4.0]
    Dc: [0.05, 0.5]
    Da: [0.05, 0.5]
    A: [0.5, 2.0]
    Kd: [0.2, 1.5]
    Omega0: [0.5, 3.0]
    Omega: [0.5, 5.0]
    Omega_d0: [0.1, 1.0]
    Omega_d: [0.1, 1.0]
    Z: [1.0, 15.0]
    B: [0.0, 0.0]
  provenance: proposed
  reason: >
    Both kumar2014 Eq. (6) and barberi2023 Eq. (SM15) obtain the linearized 1D Fourier velocity
    response from the same screened Brinkman momentum balance (1 - d_XX)V = d_X sigma_active,
    yielding vel_response_imag = Pi'(C_H)*K/(1 + K^2) in barberi2023 versus
    v_hat_amp = (zeta*Delta_mu)_0*df_hat*k/(gamma*(1 + nu*k^2*ell^2)) in kumar2014. When the cubic
    steric stress vanishes (B = 0), Pi'(C_H) = 2*Z*C_H is independent of K and linear in Z (since
    C_H is purely chemical), so both models share identical log-slopes in both wavenumber K and
    contractility amplitude Z across the entire parameter regime.
  assumptions:
    - "1D viscous screening (nu = 1) and purely quadratic contractile stress (B = 0) so Pi'(C_H) = 2*Z*C_H is strictly proportional to Z"

- id: rel_barberi2023_sm15_reduces_ard_eq12_13
  kind: reduces_to
  a: barberi2023/linear_stability_1d_sm15
  b: kumar2014/ard_linear_stability_eq12_13
  mapping:
    k_l: K
    kappa_tau: Kd
    rho: "1"
    P: "(2 * Z * (A / Kd) - 3 * B * (A / Kd)**2) * (A / Kd)"
    nu: "1"
    A0_fA: "1"
    I0_fI: "0"
  output_map:
    re_lam_plus: max_growth_rate
  limit:
    Omega_d0: "0"
    Omega_d: "0"
    Da: "oo"
  regime:
    K: [0.5, 1.5]
    Dc: [1.0, 1.0]
    Da: [1.0, 10.0]
    A: [0.9, 1.2]
    Kd: [0.4, 0.8]
    Omega0: [5.0, 15.0]
    Omega: [0.5, 5.0]
    Omega_d0: [0.1, 1.0]
    Omega_d: [0.1, 1.0]
    Z: [10.0, 18.0]
    B: [0.05, 0.15]
  provenance: proposed
  reason: >
    In the decoupled fast-diffusing active-nucleator limit (Omega_d,0 -> 0, Omega_d -> 0 so
    N_a,H -> 1 and C_H -> A/K_d; D_a -> oo so delta N_a -> 0) with unit actomyosin diffusivity
    ratio D_c = 1, barberi2023's 3-species mechanochemical stability matrix Eqs. (SM15)-(SM23)
    isolates actomyosin density C with dispersion Phi(K) = -K^2 - K_d + Pi'_H*C_H*K^2/(1 + K^2).
    This matches the 1D (nu = 1), single-regulator (A_0*f_A = 1, I_0*f_I = 0, rho = 1) limit of
    Kumar's ARD stability matrix Eqs. (12)-(13) with kappa*tau = K_d and effective Peclet number
    P = Pi'_H*C_H = (2*Z*(A/K_d) - 3*B*(A/K_d)^2)*(A/K_d).
  assumptions:
    - "Decoupled uniform nucleator pool (Omega_d,0 -> 0, Omega_d -> 0, D_a -> oo), fast inactive-nucleator relaxation (Omega_0 in [5, 15]), unit actomyosin diffusivity D_c = 1, and net contractile stress Pi'_H > 0"

# ==============================================================================
# Cross-record relations with mirza2025 (Mirza et al., eLife 2025; explicitly
# cites kumar2014 on pp. 2, 3, and 8 for hexagonal active-gel droplets in the
# isotropic limit beta = kappa = lambda_o = 0)
# ==============================================================================

- id: rel_mirza2025_hydrodynamic_length
  kind: same_as
  a: kumar2014/hydrodynamic_length
  b: mirza2025/hydrodynamic_length
  mapping:
    eta: eta
    gamma: gamma
  output_map:
    ell_s: ell
  regime:
    eta: [1.0, 1.0e4]
    gamma: [1.0e6, 1.0e14]
  provenance: proposed
  reason: >
    Both kumar2014 (p. 2) and mirza2025 define the hydrodynamic screening length as sqrt(eta/gamma)
    (BoxGraph converts ell_s [um] to ell [m] automatically).
  assumptions:
    - "Identical hydrodynamic length definition sqrt(eta/gamma)"

- id: rel_mirza2025_turnover_damkohler_length
  kind: same_as
  a: kumar2014/turnover_length_scale
  b: mirza2025/damkohler_length
  mapping:
    D: "D * 10**12"
    k_d: kappa
  output_map:
    ell_D: ell_kappa
  regime:
    D: [1.0e-14, 1.0e-10]
    kappa: [0.01, 10.0]
    ell: [1.0e-7, 1.0e-5]
  provenance: proposed
  reason: >
    Kumar p. 4's turnover length scale ell_kappa = sqrt(D/kappa) is symbolically identical to
    Mirza's Damkohler length ell_D = sqrt(D/k_d) under k_d = kappa and unit conversion D [m^2/s -> um^2/s].
  assumptions:
    - "Identifies linear turnover rate kappa in kumar2014 Eq. (12) with depolymerization rate k_d in mirza2025"

- id: rel_mirza2025_diffusive_timescale
  kind: same_as
  a: kumar2014/diffusive_timescale
  b: mirza2025/diffusion_timescale
  mapping:
    ell_s: "ell * 10**6"
    D: "D * 10**12"
  output_map:
    t_0: tau
  regime:
    ell: [1.0e-7, 1.0e-4]
    D: [1.0e-14, 1.0e-10]
  provenance: proposed
  reason: >
    Kumar's diffusive timescale tau = ell^2/D equals Mirza's diffusion timescale t_0 = ell_s^2/D
    under unit conversions ell [m -> um] and D [m^2/s -> um^2/s].
  assumptions:
    - "Identical diffusive timescale across one hydrodynamic length"

- id: rel_mirza2025_ard_osc_same_as_iso_lam
  kind: same_as
  a: kumar2014/ard_stability_boundary_2d
  b: mirza2025/isotropic_threshold_dimless
  mapping:
    k_d: "nu * kappa_tau * (1 + rho) / 8"
  output_map:
    lambda_crit_0: P_c_osc
  regime:
    beta: [1.2, 3.0]
    kappa_tau: [0.05, 5.0]
    rho: [0.05, 1.0]
    nu: [1.0, 4.0]
  provenance: proposed
  reason: >
    Both Kumar 2D ARD (footnote [29]: eta_v = 3*eta => nu = 1 + eta_v/eta = 4) and Mirza Eq. (6)
    (2D compressible viscous stress 2*eta*(d + tr(d)*I) => longitudinal viscosity 4*eta) employ the
    exact same 2D thin-film viscous coefficient 4*eta. Consequently, Kumar's continuous-wavenumber
    Hopf threshold P_c_osc = (1 + sqrt(nu*kappa*tau*(1 + rho)/2))^2 is algebraically identical to
    Mirza's isotropic active-gel instability threshold lambda_crit_0 = (1 + 2*sqrt(k_d))^2 under
    k_d = nu*kappa*tau*(1 + rho)/8 (at 2D nu = 4, simply the mean turnover rate k_d = (1 + rho)*kappa*tau/2).
  assumptions:
    - "Continuous-wavenumber threshold; at Kumar's 2D viscous coefficient nu = 4 (eta_v = 3*eta), k_d equals the mean dimensionless turnover rate (1 + rho)*kappa*tau/2"

- id: rel_mirza2025_ard_osc_k_same_as_iso_nu
  kind: same_as
  a: kumar2014/ard_stability_boundary_2d
  b: mirza2025/isotropic_threshold_dimless
  mapping:
    k_d: "kappa_tau * (1 + rho) / 2"
  output_map:
    nu_crit_0: k_c_osc_l
  regime:
    beta: [1.2, 3.0]
    kappa_tau: [0.05, 5.0]
    rho: [0.05, 1.0]
    nu: [4.0, 4.0]
  provenance: proposed
  reason: >
    With Kumar footnote [29]'s 2D incompressible thin-film viscosity ratio eta_v = 3*eta (nu = 4,
    matching Mirza Eq. 6's 4*eta longitudinal viscosity), Kumar's critical oscillatory onset
    wavenumber k_c_osc*ell = [kappa*tau*(1 + rho)/(2*nu)]^(1/4) = [(1 + rho)*kappa*tau/8]^(1/4)
    equals Mirza's isotropic critical wavenumber nu_crit_0 = (k_d/4)^(1/4) identically when Mirza's
    dimensionless turnover rate k_d is set to Kumar's mean dimensionless turnover rate
    (1 + rho)*kappa*tau/2.
  assumptions:
    - "2D incompressible thin-film viscosity coefficient nu = 1 + eta_v/eta = 4 (Kumar footnote [29]), matching Mirza Eq. (6)'s longitudinal viscosity 4*eta"

- id: rel_mirza2025_ard_stat_scales_iso_lam
  kind: scales_as
  a: kumar2014/ard_stability_boundary_2d
  b: mirza2025/isotropic_threshold_dimless
  mapping:
    k_d: kappa_tau
  output_map:
    lambda_crit_0: P_c_stat
  regime:
    beta: [1.0, 1.0]
    kappa_tau: [0.05, 5.0]
    rho: [0.1, 2.0]
    nu: [4.0, 4.0]
  provenance: proposed
  reason: >
    Mirza et al. (2025) p. 8 explicitly report that in the absence of nematic coupling
    (beta = kappa = lambda_o = 0), their 2D active-gel PDE forms stationary hexagonal droplets
    as previously reported in Kumar et al. (2014) (Fig. 3b). At Kumar's 2D viscous coefficient
    nu = 4 and single-activator endpoint beta = 1 (A_0*f_A = 2, I_0*f_I = 0), Kumar's stationary
    onset threshold simplifies to P_c_stat = (1/2)*(1 + 2*sqrt(kappa*tau))^2 — exactly 1/2 of
    Mirza's isotropic threshold lambda_crit_0 = (1 + 2*sqrt(k_d))^2 at k_d = kappa*tau (the factor
    1/2 reflecting A_0*f_A = 2 in Kumar's rescaled Eq. 11).
  assumptions:
    - "Single-activator endpoint beta = 1 and 2D viscous coefficient nu = 4 (eta_v = 3*eta)"

- id: rel_mirza2025_disp_eqC7_reduces_ard_eq12_13
  kind: reduces_to
  a: mirza2025/dispersion_1d_eqC7
  b: kumar2014/ard_linear_stability_eq12_13
  mapping:
    k_l: nu
    kappa_tau: k_d
    rho: "1"
    P: lam
    nu: "4"
    A0_fA: "1"
    I0_fI: "0"
  output_map:
    re_lam_plus: alpha_plus
  limit:
    kappa: "0"
    beta: "0"
  regime:
    nu: [0.3, 1.5]
    k_d: [0.1, 1.0]
    L: [0.5, 2.0]
    c_0: [10.0, 30.0]
    b: [1.0, 5.0]
    eta_rot: [0.5, 2.0]
    beta: [-0.2, -0.01]
    lambda_o: [0.0, 0.0]
    kappa: [0.01, 0.2]
    lam: [1.0, 10.0]
    q_0: [0.0, 0.0]
  provenance: proposed
  reason: >
    In the isotropic active-gel limit (kappa -> 0, beta -> 0, lambda_o = q_0 = 0) stated on
    mirza2025 p. 8 (citing Kumar et al., 2014), Mirza Eq. (C7)'s quadratic dispersion relation
    factors into a fast-decaying nematic mode -(c_0 + L*nu^2)/eta_rot and the isotropic density
    growth rate alpha_iso = -nu^2 - k_d + lam*nu^2/(1 + 4*nu^2). This matches the single-regulator
    2D (nu = 4, A_0*f_A = 1, I_0*f_I = 0, rho = 1) limit of Kumar's ARD linear stability matrix
    Eqs. (12)-(13) identically — including the exact viscous screening factor 4 from eta_v = 3*eta.
  assumptions:
    - "Isotropic limit (kappa -> 0, beta -> 0, lambda_o = q_0 = 0) with large nematic restoring stiffness c_0 in [10, 30] so the density mode is strictly the leading eigenvalue alpha_plus"

- id: rel_mirza2025_marginal_eqC8_reduces_ard_osc
  kind: reduces_to
  a: mirza2025/marginal_stability_eqC8
  b: kumar2014/ard_stability_boundary_2d
  mapping:
    beta: "2"
    kappa_tau: k_d
    rho: "1"
    nu: "4"
  output_map:
    P_c_osc: lambda_crit
  limit:
    kappa: "0"
  regime:
    k_d: [0.05, 3.0]
    L: [0.5, 2.0]
    c_0: [2.0, 20.0]
    b: [1.0, 5.0]
    beta: [-2.0, -0.1]
    lambda_o: [0.0, 0.0]
    kappa: [0.01, 0.3]
    q_0: [0.0, 0.0]
  provenance: proposed
  reason: >
    Setting active-tension anisotropy kappa -> 0 in Mirza's full active-nematic marginal stability
    boundary Eq. (C8) removes all nematic coupling and reduces lambda_crit to the isotropic threshold
    (1 + 2*sqrt(k_d))^2, which equals Kumar's 2D (nu = 4) continuous-wavenumber Hopf threshold
    P_c_osc = (1 + sqrt(nu*kappa*tau*(1 + rho)/2))^2 at equal turnover (rho = 1, kappa*tau = k_d).
  assumptions:
    - "Isotropic active tension (kappa -> 0, q_0 = 0) in Mirza Eq. (C8), matching Kumar 2D ARD at nu = 4 and rho = 1 (P_c_osc is independent of beta)"

