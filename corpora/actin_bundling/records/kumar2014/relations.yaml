    - "Maps Kumar p. 3's saturation parameter xi = A_s/A_0 = 3 to Bois's normalized concentration c_0 = A_0/A_s = 1/3 and absorbs the factor 2*(1 + xi)^2/xi = 32/3 into Pe"

