    eta: [1.0, 1.0e4]
    gamma: [1.0e6, 1.0e14]
  provenance: proposed
  reason: >
    Both kumar2014 (p. 2) and barberi2023 (p. 2, Eq. 2-3) define the active-gel hydrodynamic
    screening length identically as sqrt(eta / gamma) (denoted ell in kumar2014 and lambda in barberi2023).
  assumptions:
    - "Same 1D/thin-film hydrodynamic screening length definition"

- id: rel_barberi2023_diffusive_timescale
  kind: same_as
  a: kumar2014/diffusive_timescale
  b: barberi2023/diffusive_timescale
  mapping:
    lam: ell
    D_i: D
  output_map:
    tau: tau
  regime:
    ell: [1.0e-7, 1.0e-4]
    D: [1.0e-14, 1.0e-10]
  provenance: proposed
  reason: >
    Both kumar2014 (p. 2) and barberi2023 (p. 2) nondimensionalize time by the diffusive timescale
    across one hydrodynamic length, tau = ell^2/D = lambda^2/D_i.
  assumptions:
