  kind: scales_as
  a: kumar2014/ard_linear_stability_eq12_13
  b: bois2011/single_species_rda_dispersion_eq15
  mapping:
    k: k_l
    D: "1"
    dR_dc: "-kappa_tau"
    Pe: P
    c0: "1"
    df_dc: "A0_fA + I0_fI"
    l: "1"
  output_map:
    lam: re_lam_plus
  regime:
    k_l: [0.3, 3.0]
    kappa_tau: [0.5, 3.0]
    rho: [1.0, 1.0]
    P: [0.1, 0.4]
    nu: [1.0, 1.0]
    A0_fA: [1.0, 2.0]
    I0_fI: [0.2, 1.0]
  provenance: proposed
  reason: >
    At equal turnover rates (rho = 1) and 1D viscous screening (nu = 1), Kumar Eqs. (12)-(13)'s
    2x2 advection-reaction-diffusion stability matrix has leading dimensionless eigenvalue
    tau*lambda_+ = -k_l^2 - kappa*tau + P*(A_0*f_A + I_0*f_I)*k_l^2/(1 + k_l^2), which has the
    exact functional form of Bois Eq. (15)'s single-species reaction-diffusion-advection dispersion
    lambda = -D*k^2 + dR/dc + D*k^2*Pe*c_0*df/dc/(1 + k^2*ell^2) [1/s] under linear turnover
    dR/dc = -kappa and net sensitivity c_0*df/dc = A_0*f_A + I_0*f_I (differing only by the
    constant timescale normalization tau = ell^2/D [s]).
  assumptions:
    - "Equal turnover rates (rho = 1) and 1D viscous screening (nu = 1) in a strictly subcritical regime (re_lam_plus < 0) away from the marginal zero crossing"

# ==============================================================================
# Cross-record relations with hannezo2015 (Hannezo et al., PNAS 112:8620, 2015;
# independent active-gel-with-turnover extension of bois2011)
# ==============================================================================

- id: rel_hannezo2015_hydrodynamic_length
  kind: same_as
  a: kumar2014/hydrodynamic_length
  b: hannezo2015/hydrodynamic_length
  mapping:
    eta: eta
    xi: gamma
  output_map:
    l_h: ell
  regime:
    eta: [1.0, 1.0e4]
    gamma: [1.0e6, 1.0e14]
  provenance: proposed
  reason: >
    Both kumar2014 and hannezo2015 define the active-gel hydrodynamic screening length as
    sqrt(viscosity / friction). Under thin-film integration (eta_2D = h*eta_3D, xi_2D = h*gamma_3D),
    film thickness h cancels identically (mapped at h = 1 m so Pa*s -> Pa*s*m and Pa*s/m^2 -> Pa*s/m),
    and BoxGraph converts l_h [um] to ell [m].
  assumptions:
    - "Cortical thickness h cancels in eta_2D / xi_2D = (h*eta) / (h*gamma)"

- id: rel_hannezo2015_turnover_length
  kind: same_as
  a: kumar2014/turnover_length_scale
  b: hannezo2015/turnover_diffusion_length
  mapping:
    D: "D * 10**12"
    tau: "1 / kappa"
  output_map:
    l_t: ell_kappa
  regime:
    D: [1.0e-14, 1.0e-10]
    kappa: [0.01, 10.0]
    ell: [1.0e-7, 1.0e-5]
  provenance: proposed
  reason: >
    Kumar p. 4 identifies sqrt(D/kappa) as the additional length scale introduced by turnover in
    Eqs. (12)-(13) (turnover_length_scale), which is identically Hannezo's turnover-diffusion
    length l_t = sqrt(D*tau) with turnover time tau = 1/kappa and D converted from m^2/s to um^2/s.
  assumptions:
    - "Identifies linear turnover rate kappa [1/s] with inverse turnover time 1/tau [1/s]"

- id: rel_hannezo2015_diffusive_timescale
  kind: same_as
  a: hannezo2015/diffusion_time_hydrodynamic
  b: kumar2014/diffusive_timescale
  mapping:
    ell: "sqrt(eta / xi)"
    D: "D * 10**(-12)"
  output_map:
    tau: T
  regime:
    eta: [1.0e-7, 1.0e-3]
    xi: [1.0e7, 1.0e11]
    D: [0.005, 1.0]
  provenance: proposed
  reason: >
    Hannezo's hydrodynamic diffusion timescale T = eta/(xi*D) equals Kumar's diffusive timescale
    tau = ell^2/D upon substituting ell = sqrt(eta/xi) and converting D from um^2/s to m^2/s.
  assumptions:
    - "2D thin-film viscosity/friction ratio eta/xi equals ell^2 = eta_3D/gamma_3D"

- id: rel_hannezo2015_peclet_contractility
  kind: same_as
  a: kumar2014/peclet_number_physical
  b: hannezo2015/dimensionless_contractility_chi_2d
  mapping:
    sigma_a: zdm0
    xi: gamma
    D: "D * 10**12"
  output_map:
    chi: P
  regime:
    zdm0: [1.0, 1.0e3]
    gamma: [1.0e6, 1.0e14]
    D: [1.0e-14, 1.0e-10]
  provenance: proposed
  reason: >
    Kumar's active Peclet number P = (zeta*Delta_mu)_0/(gamma*D) is identically Hannezo's
    dimensionless contractility chi = sigma_a/(xi*D) under thin-film thickness cancellation
    sigma_a/xi = (h*(zeta*Delta_mu)_0)/(h*gamma) = (zeta*Delta_mu)_0/gamma (mapped at h = 1 m,
    with D converted from m^2/s to um^2/s).
  assumptions:
    - "Thin-film thickness h cancels in sigma_a/xi = (zeta*Delta_mu)_0/gamma; linear stress sensitivity rho_0*chi_dim is absorbed into sigma_a in Hannezo's linear active stress"

- id: rel_hannezo2015_ard_equal_turnover_reduces_eq8
  kind: reduces_to
  a: kumar2014/ard_linear_stability_eq12_13
  b: hannezo2015/dispersion_relation_dimless_eq8
  mapping:
    q_hat: k_l
    phi: kappa_tau
    chi: "P * (A0_fA + I0_fI)"
  output_map:
    lam_hat: re_lam_plus
  limit:
    rho: "1"
    nu: "1"
  regime:
    k_l: [0.6, 1.5]
    kappa_tau: [0.1, 0.6]
    rho: [0.2, 1.5]
    P: [5.0, 10.0]
    nu: [1.0, 2.0]
    A0_fA: [2.0, 4.0]
    I0_fI: [-0.2, 1.0]
  provenance: proposed
  reason: >
    In the equal-turnover (rho -> 1), 1D viscous-screening (nu -> 1) limit of Kumar Eqs. (12)-(13),
    the 2x2 ARD stability matrix tau*L_ARD decomposes into a passive mode -k_l^2 - kappa*tau and
    an active mode -k_l^2 - kappa*tau + P*(A_0*f_A + I_0*f_I)*k_l^2/(1 + k_l^2). Whenever
    A_0*f_A + I_0*f_I > 0, the leading eigenvalue re_lam_plus reduces identically to Hannezo SI
    Eq. (8)'s single-species dimensionless dispersion lam_hat = -phi - q_hat^2 + chi*q_hat^2/(1 + q_hat^2)
    with phi = kappa*tau and chi = P*(A_0*f_A + I_0*f_I).
  assumptions:
    - "Equal species turnover rates (rho -> 1), 1D viscous screening (nu -> 1), and positive net stress sensitivity A_0*f_A + I_0*f_I > 0"

- id: rel_hannezo2015_ard_single_reg_reduces_eq8
  kind: reduces_to
  a: kumar2014/ard_linear_stability_eq12_13
  b: hannezo2015/dispersion_relation_dimless_eq8
  mapping:
    q_hat: k_l
    phi: kappa_tau
    chi: "P * A0_fA"
  output_map:
    lam_hat: re_lam_plus
  limit:
    I0_fI: "0"
    nu: "1"
  regime:
    k_l: [0.2, 3.0]
    kappa_tau: [0.1, 3.0]
    rho: [1.05, 3.0]
    P: [0.5, 6.0]
    nu: [1.0, 2.0]
    A0_fA: [0.5, 4.0]
    I0_fI: [0.01, 1.0]
  provenance: proposed
  reason: >
    Decoupling species I from active stress (I_0*f_I -> 0) in 1D (nu -> 1) makes Kumar's 2x2 ARD
    matrix lower-triangular with eigenvalues -k_l^2 - kappa*tau + P*A_0*f_A*k_l^2/(1 + k_l^2) and
    -k_l^2 - rho*kappa*tau. For rho > 1 and A_0*f_A > 0, the passive I mode is strictly more damped
    and re_lam_plus reduces identically to Hannezo SI Eq. (8)'s single-species dispersion relation
    with phi = kappa*tau and chi = P*A_0*f_A.
  assumptions:
    - "Single-regulator limit I_0*f_I -> 0 in 1D (nu -> 1) with rho > 1 so the decoupled species I mode is strictly subdominant"

- id: rel_hannezo2015_ard_osc_same_as_eq10
  kind: same_as
  a: kumar2014/ard_stability_boundary_2d
  b: hannezo2015/dimensionless_critical_contractility_eq10
  mapping:
    phi: "0.5 * nu * kappa_tau * (1 + rho)"
  output_map:
    chi_c: P_c_osc
  regime:
    beta: [1.2, 3.0]
    kappa_tau: [0.05, 5.0]
    rho: [0.05, 1.0]
    nu: [1.0, 4.0]
  provenance: proposed
  reason: >
    In Kumar's two-species ARD model with rescaled Eq. (11) (where A_0*f_A + I_0*f_I = 2), the
    Hopf onset condition tr(tau*L_ARD) = -2*q - (1 + rho)*kappa*tau + 2*P*q/(1 + nu*q) = 0
    rearranges to P(Q) = (1 + Q)*(1 + phi_eff/Q) with Q = nu*q and effective mean turnover
    phi_eff = (1/2)*nu*kappa*tau*(1 + rho). Because the factor of 2 in the trace cancels the
    factor of 2 in A_0*f_A + I_0*f_I, the continuous-wavenumber Hopf threshold
    P_c_osc = (1 + sqrt(nu*kappa*tau*(1 + rho)/2))^2 is algebraically identical to Hannezo SI
    Eq. (10)'s single-species stationary threshold chi_c^(0) = (1 + sqrt(phi))^2 across all
    (beta, kappa*tau, rho, nu) > 0.
  assumptions:
    - "Continuous-wavenumber (infinite-domain) threshold mapping Hannezo's dimensionless turnover phi to Kumar's viscosity-rescaled mean turnover (1/2)*nu*kappa*tau*(1 + rho)"

- id: rel_hannezo2015_ard_stat_scales_eq10
  kind: scales_as
  a: kumar2014/ard_stability_boundary_2d
  b: hannezo2015/dimensionless_critical_contractility_eq10
  mapping:
    phi: "nu * kappa_tau"
  output_map:
    chi_c: P_c_stat
  regime:
    beta: [1.0, 1.0]
    kappa_tau: [0.05, 5.0]
    rho: [0.1, 2.0]
    nu: [1.0, 4.0]
  provenance: proposed
  reason: >
    At the single-activator endpoint beta = 1 of Kumar Eq. (11) (A_0*f_A = 2, I_0*f_I = 0), the
    (q + rho*kappa*tau) factor cancels identically from det(tau*L_ARD) = 0, giving the exact
    stationary threshold P_c_stat = (1/2)*(1 + sqrt(nu*kappa*tau))^2 — independent of rho and
    strictly proportional (constant factor 1/2 from A_0*f_A = 2) to Hannezo SI Eq. (10)'s
    chi_c^(0) = (1 + sqrt(phi))^2 at phi = nu*kappa*tau.
  assumptions:
    - "Single-activator limit beta = 1 (decoupling species I); factor of 1/2 reflects Kumar's A_0*f_A = 1 + beta = 2 versus Hannezo's normalized sensitivity 1"

# ==============================================================================
# Cross-record relations with mietke2019 (Mietke, Jülicher & Sbalzarini,
# PNAS 116:29, 2019; explicitly cites kumar2014 as Ref. 15 on pp. 1, 3, 5)
# ==============================================================================

- id: rel_mietke2019_eq11_scales_hill_eq12
  kind: scales_as
  a: kumar2014/active_stress_regulation_eq11
  b: mietke2019/hill_regulation_eq12
  mapping:
    c: A_norm
    c0: xi
    m: "1"
  output_map:
    f: f
  regime:
    f_0: [0.0, 0.0]
    beta: [1.0, 1.0]
    A_norm: [0.2, 5.0]
    I_norm: [0.2, 5.0]
    xi: [0.5, 5.0]
  provenance: proposed
  reason: >
    Mietke et al. (2019) p. 3 explicitly cite Kumar et al. (2014) (Ref. 15) alongside Bois et al.
    (2011) (Ref. 14) for saturating Hill active-stress regulation f(c) = c^m/(c_0^m + c^m) (Eq. 12).
    At f_0 = 0 and the single-activator endpoint beta = 1, Kumar Eq. (11) reduces to
    f(A) = 2*A/(A + A_s) = 2*A_norm/(A_norm + xi), matching Mietke Eq. (12) at Hill exponent m = 1
    with half-saturation c_0 = xi up to the constant factor of 2.
  assumptions:
    - "Zero baseline stress (f_0 = 0) and single-activator limit (beta = 1) in Kumar Eq. (11), corresponding to Hill exponent m = 1 in Mietke Eq. (12)"

- id: rel_mietke2019_nu_bar_scales_viscous_coeff_2d
  kind: scales_as
  a: mietke2019/viscosity_parameter_nu_bar_corrected
  b: kumar2014/viscous_coefficient_2d
  mapping:
    eta_v_over_eta: "eta_b / eta_s"
  output_map:
    nu: nu_bar
  regime:
    eta_s: [1.0, 100.0]
    eta_b: [1.0, 300.0]
  provenance: proposed
  reason: >
    Both Kumar (p. 2, Eq. 4) and Mietke (SI Eq. S80) parameterize 2D active-surface longitudinal
    viscous resistance through the sum of shear and bulk viscosities divided by shear viscosity:
    Kumar's nu = 1 + eta_v/eta and Mietke's corrected viscosity ratio nu_bar = (eta_s + eta_b)/(4*eta_s)
    = (1/4)*(1 + eta_b/eta_s) differ everywhere by the exact geometric factor 1/4.
  assumptions:
    - "Identifies 2D shear viscosity eta = eta_s and 2D bulk viscosity eta_v = eta_b (using Mietke's dimensionally corrected nu_bar)"

- id: rel_mietke2019_eq10_reduces_cyl_eq27
  kind: reduces_to
  a: kumar2014/oscillatory_threshold_eq10
  b: mietke2019/cylinder_critical_contractility_eq27
  mapping:
    eta_b: "(1 + alpha) * nu"
    gamma: "A0_fA + I0_fI"
    D: "1"
    r0: "L_over_l / (omega * pi)"
    k: "0"
  output_map:
    alpha_c_star: P_c
  limit:
    L_over_l: "0"
  regime:
    alpha: [0.05, 0.9]
    omega: [1.0, 2.0]
    L_over_l: [0.1, 2.0]
    nu: [1.0, 4.0]
    A0_fA: [2.0, 5.0]
    I0_fI: [-1.5, -0.2]
  provenance: proposed
  reason: >
    In the vanishing-substrate-friction / small-domain limit L/ell -> 0 of Kumar Eq. (10), the
    frictional drag term drops out relative to viscous resistance (nu*k_1^2*ell^2 >> 1) and the
    critical Peclet number approaches P_c ~ [(1 + alpha)*nu/(A_0*f_A + I_0*f_I)] * (omega*pi*ell/L)^2,
    matching Mietke Eq. (27)'s zero-friction cylindrical critical contractility alpha_c^* = (eta_b/gamma)*(D/r_0^2 + k)
    at zero turnover (k = 0) with effective radius r_0 = 1/k_1 = L/(omega*pi) and viscosity-to-tension
    ratio eta_b/gamma = (1 + alpha)*nu/(A_0*f_A + I_0*f_I).
  assumptions:
    - "Zero substrate friction limit L/ell -> 0 in Kumar Eq. (10) and conserved species (k = 0) in Mietke Eq. (27)"

- id: rel_mietke2019_ard_osc_reduces_cyl_dimless
  kind: reduces_to
  a: kumar2014/ard_stability_boundary_2d
  b: mietke2019/cylinder_critical_contractility_dimless
  mapping:
    D_tilde: "0"
    k_tilde: "0.5 * nu * kappa_tau * (1 + rho)"
  output_map:
    alpha_c_star: P_c_osc
  limit:
    kappa_tau: "oo"
  regime:
    beta: [1.2, 3.0]
    kappa_tau: [1.0e4, 1.0e6]
    rho: [0.05, 1.0]
    nu: [1.0, 4.0]
  provenance: proposed
  reason: >
    Because kappa*tau = kappa*eta/(gamma*D), vanishing substrate friction (gamma -> 0) sends
    kappa*tau -> oo in Kumar's 2D ARD model. In this limit the Hopf threshold
    P_c_osc = (1 + sqrt(nu*kappa*tau*(1 + rho)/2))^2 approaches (1/2)*nu*kappa*tau*(1 + rho),
    matching Mietke's flat-surface (r_0 -> oo, D_tilde = 0) dimensionless threshold
    alpha_c^* = D_tilde + k_tilde with k_tilde equal to the viscosity-weighted mean turnover rate
    (1/2)*nu*kappa*tau*(1 + rho).
  assumptions:
    - "Zero substrate friction limit kappa*tau -> oo in Kumar 2D ARD and infinite-radius flat limit (D_tilde = 0) in Mietke cylinder_critical_contractility_dimless"

- id: rel_mietke2019_trace_eq8_approx_sphere_polar
  kind: approximated_by
  a: kumar2014/trace_discriminant_eq8_9
  b: mietke2019/sphere_polar_growth_rate_eqs72
  mapping:
    D: "D * 10**12"
    R0: "sqrt(2) * 10**6 / k"
    k: "0"
    xi: "D * P / (nu * ell**2)"
    eta_b: "1"
    c0_df_dc0: A0_fA
  output_map:
    lambda_1: tr_L
  regime:
    D: [1.0e-14, 1.0e-13]
    k: [1.0e6, 3.0e6]
    ell: [2.0e-5, 5.0e-5]
    alpha: [0.0, 0.0]
    P: [5.0e4, 2.0e5]
    nu: [1.0, 4.0]
    A0_fA: [0.5, 2.0]
    I0_fI: [0.0, 0.0]
  tolerance: 0.01
  provenance: proposed
  reason: >
    In the viscous-dominated low-friction regime (k*ell in [20, 150], so nu*k^2*ell^2 >= 400 >> 1)
    with species I decoupled and immobile (alpha = 0, I_0*f_I = 0), Kumar Eq. (8)'s dimensional
    trace tr(L) = -D*k^2 + (D*P*A_0*f_A/(nu*ell^2)) * [nu*k^2*ell^2/(1 + nu*k^2*ell^2)] is
    approximated within 1% by Mietke SI Eq. (S72)'s zero-friction spherical polar (l = 1) growth
    rate lambda_1 = -2*D/R_0^2 - k + (xi/eta_b)*c_0*df/dc at zero turnover (k = 0), spherical
    wavenumber k = sqrt(2)/R_0, and effective active relaxation rate xi/eta_b = (zeta*Delta_mu)_0/(nu*eta) = D*P/(nu*ell^2).
  assumptions:
    - "Low-friction viscous regime nu*k^2*ell^2 >> 1 with decoupled immobile species I (alpha = 0, I_0*f_I = 0)"
    - "Conserved species (k = 0) and l = 1 polar mode wavenumber k = sqrt(2)/R_0 in Mietke Eq. (S72)"

- id: rel_mietke2019_ard_eq12_13_approx_cyl_jac
  kind: approximated_by
  a: kumar2014/ard_linear_stability_eq12_13
  b: mietke2019/cylinder_jacobian_eqs80_82
  mapping:
    L_over_2pi_r0: "1 / k_l"
    n_mode: "1"
    alpha: "2 * P * (A0_fA + I0_fI) / nu"
    xi_f0_over_gamma: "0"
    kappa_tilde: "100000"
    D_tilde: "1"
    k_tilde: kappa_tau
    eta_s_over_eta_b: "1"
  output_map:
    max_re_lambda_tilde: re_lam_plus
  regime:
    k_l: [15.0, 30.0]
    kappa_tau: [0.5, 5.0]
    rho: [1.0, 1.0]
    P: [20.0, 60.0]
    nu: [1.0, 4.0]
    A0_fA: [1.5, 2.5]
    I0_fI: [-0.5, 0.5]
  tolerance: 0.01
  provenance: proposed
  reason: >
    Mietke et al. (2019) p. 5 contrast their deforming-surface instability (where a single species
    generates oscillations via shape feedback) with fixed-geometry active-gel instabilities (citing
    Kumar 2014 as Ref. 15, where two species generate oscillations on a fixed substrate). Taking
    the stiff-cylinder fixed-geometry limit (kappa_tilde = 1e5) in Mietke Eqs. (S80)-(S82) eliminates
    shape deformations via Schur complement, yielding slow concentration growth rate
    lambda = alpha*(1 - 1/(4*nu_bar)) - D_tilde*k^2 - k_tilde = (alpha/2) - k^2 - k_tilde (at
    eta_s/eta_b = 1, where nu_bar = 1/2). This matches the equal-turnover (rho = 1), low-friction
    (nu*k_l^2 >> 1) limit of Kumar's 2-species ARD dispersion to within 1% when
    alpha = 2*P*(A_0*f_A + I_0*f_I)/nu.
  assumptions:
    - "Rigid fixed-geometry cylinder limit (kappa_tilde = 1e5) in Mietke Eqs. (S80)-(S82) with eta_s = eta_b (nu_bar = 1/2)"
    - "Equal turnover rates (rho = 1) and viscous-dominated low-friction regime (nu*k_l^2 >= 225 >> 1) in Kumar ARD Eqs. (12)-(13)"

