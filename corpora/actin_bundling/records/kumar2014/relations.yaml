    xi = 3, i.e. A_s = 3*A_0), species A obeys Bois's single-species Hill regulation
    f(c) = c/(1 + c) at dimensionless concentration c_0 = A_0/A_s = 1/xi = 1/3 (where
    c_0/(1 + c_0)^2 = 3/16) with effective Bois Peclet number Pe = 2*P*(1 + xi)^2/xi = (32/3)*P.
