notes: >
  Read stage of K. Vijay Kumar, J. S. Bois, F. Jülicher, and S. W. Grill, Phys. Rev. Lett. 112,
  208101 (2014) together with its 1-page Supplemental Material movie list (PDF pp. 1-6). All 6
  extracted text files (text/page-001.txt through page-006.txt) and all 6 rendered page images
  (pages/page-001.png through page-006.png) were inspected, plus 300-dpi crops of Figs. 1-3 to
  verify every equation, symbol, subscript/superscript, axis label, and phase-diagram grid.
  Scope included: all 13 numbered equations and inline scaling definitions — advection-diffusion
  PDEs Eqs. (1)-(2), force balance and passive/active stress Eqs. (3)-(5), linearized Fourier
  velocity Eq. (6), characteristic scales ell = sqrt(eta/gamma), U = (zeta*Delta_mu)_0/sqrt(eta*gamma),
  tau = ell^2/D, tau_a = ell/U, Peclet number P = (zeta*Delta_mu)_0/(gamma*D) = tau/tau_a,
  viscous screening coefficient nu (1 in d = 1; 1 + eta_v/eta = 4 in d = 2 using footnote [29]'s
  eta_v = 3 eta), discrete wavenumbers k_n = omega*n*pi/L, 2x2 linear stability matrix Eq. (7),
  dimensional trace and discriminant Eqs. (8)-(9), oscillatory instability threshold Eq. (10) and
  its infinite-domain limit P_c^(inf) = (1+alpha)/(A_0*f_A + I_0*f_I), active stress regulation
  function Eq. (11) both verbatim and with p. 3's (1+xi)^2/xi rescaling, complete Fig. 1(d)
  linear stability boundary and Fig. 1(e) linear period 2*pi/Im[lambda_+(k_1)], active
  stress-advection-reaction-diffusion PDEs Eqs. (12)-(13) together with their linear stability
  matrix, continuous-k and finite-box 2D stability boundaries, turnover length scale
  sqrt(D/kappa), and pseudo-spectral ETD2RK nonlinear solvers for both the 1D (Figs. 1d-e, 2)
  and 2D (Fig. 3) PDEs. Exact symbolic domain length L/ell = 2*pi (p. 3) is recorded as its
  full-precision decimal float because the printed-value parser requires decimal syntax.
  Key consistency findings: (1) Footnote [29] (p. 5) states eta = 0 in d = 1 and Eq. (4)'s
  traceless shear term vanishes identically in d = 1 leaving sigma_p = eta_v * d_x v, yet p. 2
  defines ell = sqrt(eta/gamma) and U = (zeta*Delta_mu)_0/sqrt(eta*gamma) without switching eta
  to eta_v (collapsing ell -> 0 literally; corrected in variant
  viscous_hydrodynamic_scales_eq4_consistent); (2) Below Eq. (10) (p. 2), the sign condition
  f_A > 0, f_I < 0 (for alpha < 1) is necessary but not sufficient for Eq. (10) to be the
  primary oscillatory instability — exact conditions from Eqs. (8)-(9) require
  alpha^2 * A_0*f_A < -I_0*f_I < A_0*f_A, leaving a stationary gap 1 < beta < 101/99 ~= 1.0202
  for alpha = 0.1; (3) Fig. 1(b) labeled "P = P_c" uses the infinite-domain threshold
  P_c^(inf) = 0.55 (with P ~= 0.2 in (a) and P ~= 1.5 in (c)), whereas Eq. (10) and Fig. 1(d)
  use the finite-domain threshold P_c(L = 2*pi*ell) = 1.1; (4) In Fig. 2(b,d,f), the plotted
  curve labeled zeta*Delta_mu / zeta*Delta_mu_0 lies in [0.20, 0.81] (unscaled Eq. 11, baseline
  0.50), a factor of (1+xi)^2/xi = 16/3 below the literal rescaled f_scaled in [1.09, 4.30]
  required inside the PDE to reproduce P_c = 1.1, Fig. 1(e), and Fig. 2's A/A_0, I/I_0, and
  v*tau/ell (captured via variant advection_diffusion_pde_1d_unscaled_stress); (5) Fig. 3's 2D
  domain size L/ell is unstated, and the paper's only printed L/ell = 2*pi gives P_c_osc = 7.75
  (with nu = 4 from footnote [29]), outside Fig. 3(a)'s range P <= 7.0, whereas the
  continuous-k / large-box threshold (e.g., L/ell ~= 10*pi) gives P_c_osc = 6.1665 at
  k_c*ell = 0.6089 and P_c_stat = 5.192, 5.547, 5.905, 6.265 at beta = 1.2-1.5, matching
  Fig. 3(a) row by row; (6) Minor text/caption slips: Fig. 2 caption prints "(a,c,d)" for the
  top row instead of "(a,c,e)", p. 4 prints duplicate "the the turnover rate", and Ref. [30]
  lists movies for Figs. (3b)-(3i) whereas p. 6 SM lists Movie S1 (Fig. 2) and Movies S2-S4
  (Figs. 3c-i).
