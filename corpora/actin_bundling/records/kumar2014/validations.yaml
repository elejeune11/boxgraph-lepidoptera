# Cross-record validation audit for kumar2014 across its 5 paired active-gel records:
# {bois2011, hannezo2015, mietke2019, barberi2023, mirza2025}.
#
# Audit summary (0 genuine non-forced cross-validations):
# - kumar2014 (self), bois2011, mietke2019, barberi2023, mirza2025: pure theoretical /
#   simulation records with 0 `origin: measured` datums each.
# - hannezo2015 (35 `origin: measured` datums from Drosophila tracheal supracellular actin
#   rings: WT embryonic stage-16 spacing 0.5 +/- 0.1 um, early/late larval WT 1.2 +/- 0.1 um
#   and 1.45 +/- 0.3 um, Src42A 0.8 +/- 0.2 um, moesin RNAi 1.8 +/- 0.5 um, kkv1 4.5 +/- 2 um,
#   ring counts, FRAP D = 0.04 +/- 0.03 um^2/s and tau = 15 +/- 7 s, fluorescence ramps, and
#   tube diameters):
#   NO runnable model in kumar2014 genuinely predicts these measurements:
#   (1) Stationary single-species system vs 2-species pulsatory model: Drosophila tracheal
#       actin rings are stationary circumferential rings modeled with a single actin-density
#       field; there is no measured second active-stress down-regulator I (no measured stress
#       asymmetry beta or turnover ratio rho).
#   (2) Missing dimensional stationary wavelength output: kumar2014/ard_stability_boundary_2d
#       works strictly in dimensionless variables and outputs only dimensionless critical
#       Peclet thresholds (P_c, P_c_osc, P_c_stat) and the oscillatory Hopf onset wavenumber
#       k_c_osc_l = [kappa*tau*(1+rho)/(2*nu)]^(1/4) — it does NOT output a stationary critical
#       wavenumber or a dimensional pattern wavelength in [length].
#   (3) Non-matching dimensional length models: kumar2014/hydrodynamic_length (ell = sqrt(eta/gamma))
#       and kumar2014/turnover_length_scale (ell_kappa = sqrt(D/kappa)) compute intermediate
#       transport lengths rather than the measured pattern spacing lambda = 2*pi*sqrt(l_t*l_h),
#       and neither ell nor l_t is directly measured in hannezo2015 (D and tau are measured by
#       FRAP, from which l_t is derived).
#   (4) No kumar2014 model predicts FRAP recovery curves, tracheal ring counts, fluorescence
#       intensity ramps, or lumen diameter coupling.
#   See q_cross_validation_audit_all_5_partners in kumar2014/questions.yaml for full details.

