# Inputs not stated numerically in the paper but required to run its equations.

- id: T_room_added
  quantity: temperature
  unit: K
  printed: "298"
  basis: "Paper states 'room temperature' on p. 3 (col. 1) for l_B and converts k_B T energies to kcal/mol on pp. 4-5 without stating a numerical temperature; 298 K (25 degC) is standard room temperature."
  alternatives: ["293", "300", "310"]
  stands_for: "T in l_B = e^2/(eps k_B T) and E = eps * k_B T"

- id: eps_water_added
  quantity: dielectric_constant
  unit: dimensionless
  printed: "78.4"
  basis: "Paper defines l_B = e^2/(eps k_B T) for 'an aqueous solution at room temperature' (p. 3) without printing a value for eps; 78.4 is the static relative permittivity of water at 298 K."
  alternatives: ["80", "78.3"]
  stands_for: "dielectric constant eps in Bjerrum length (p. 3)"

- id: lambda_e_added
  quantity: rod_linear_charge_density
  unit: 1/nm
  printed: "4"
  basis: "Paper calculates Gamma_par = Gamma_perp = 1.26 from Eq. 4 (p. 4) without stating the linear charge density lambda/e of F-actin; ~4 e/nm is the standard bare F-actin charge density (e.g. ~11-13 e per 2.75 nm monomer in Tang & Janmey 1996, Ref. 25). Alternatives span Manning-renormalized (1/l_B ~= 1.43 e/nm) and the effective values (2.35 and 2.41 e/nm) that would match Gamma_par = 1.26 or corrected Gamma_perp = 1.26 respectively."
  alternatives: ["1.43", "2.35", "2.41"]
  stands_for: "lambda/e in Eq. 4 (p. 3)"

- id: v_l_added
  quantity: linker_reference_volume
  unit: nm^3
  printed: "1"
  basis: "Paper introduces linker reference volume v_l in Eq. 7 (p. 3) without stating its formula or value; cubic volume delta^3 = 1 nm^3 is the simplest scale for linker diameter delta = 1 nm. Alternatives span spherical volume (pi/6)*delta^3 = 0.524 nm^3, (4*pi/3)*delta^3 = 4.19 nm^3, and 5.3 nm^3 (matching the Fig. 3a y-intercept at mu_l = -17.62)."
  alternatives: ["0.524", "4.19", "5.3"]
  stands_for: "v_l in Eq. 7 (p. 3)"

- id: mu_l_probe_added
  quantity: linker_chemical_potential
  unit: dimensionless
  printed: "-16"
  basis: "Representative linker chemical potential in the attractive regime near the bundling threshold, used to test Eqs. 1-3, 5, 7, and 8 directly."
  alternatives: ["-20", "-12"]
  stands_for: "mu_l probe value for unit evaluation of Eqs. 5, 7, 8"

- id: r_probe_added
  quantity: rod_separation
  unit: nm
  printed: "8.5"
  basis: "Representative separation inside the linker-binding well D < r <= D + delta (8 < 8.5 <= 9 nm) for evaluating Eqs. 1-3."
  alternatives: ["9.5"]
  stands_for: "r in Eq. 1 (p. 2)"

- id: gamma_probe_added
  quantity: interrod_angle
  unit: dimensionless
  printed: "1.5708"
  basis: "Perpendicular crossing angle pi/2 rad (90 deg) for evaluating Eqs. 1-3 and Eq. 8."
  alternatives: ["0.005", "0.5"]
  stands_for: "gamma in Eqs. 1-3 and Eq. 8"

- id: cr_probe_added
  quantity: dimensionless_rod_concentration
  unit: dimensionless
  printed: "5"
  basis: "Representative dimensionless rod concentration in the range [0, 15] of Fig. 3 for evaluating Eq. 7."
  alternatives: ["1", "10"]
  stands_for: "c_r in Eq. 7 (p. 3)"
