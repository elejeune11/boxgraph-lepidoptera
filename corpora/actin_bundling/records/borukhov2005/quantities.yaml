- id: rod_diameter
  name: rod diameter
  dimension: "[length]"
  description: "Hard-core diameter D of a rigid charged actin filament rod."

- id: rod_length
  name: rod length
  dimension: "[length]"
  description: "Length L of a rigid charged actin filament rod."

- id: linker_size
  name: linker size
  dimension: "[length]"
  description: "Diameter delta of a linker protein (equivalently the range of the short-range linker-mediated attraction)."

- id: screening_length
  name: Debye screening length
  dimension: "[length]"
  description: "Electrostatic screening length kappa^-1 in aqueous electrolyte solution."

- id: effective_rod_diameter
  name: effective electrostatic rod diameter
  dimension: "[length]"
  description: "Effective rod diameter D_eff = D + kappa^-1 (c_E + ln Gamma_perp) accounting for screened Coulomb repulsion."

- id: bjerrum_length
  name: Bjerrum length
  dimension: "[length]"
  description: "Bjerrum length l_B = e^2 / (eps * k_B * T) in aqueous solution."

- id: rod_separation
  name: rod-rod center-to-center separation
  dimension: "[length]"
  description: "Minimum center-to-center separation r between two rigid rods."

- id: interrod_angle
  name: angle between two rods
  dimension: dimensionless
  description: "Angle gamma (in radians) between the axes of two interacting rods."

- id: rod_linear_charge_density
  name: linear charge density per unit charge
  dimension: "1 / [length]"
  description: "Linear charge density lambda/e along a charged rod (elementary charges per unit length)."

- id: salt_concentration
  name: monovalent salt concentration
  dimension: "[substance] / [length] ** 3"
  description: "Bulk concentration of monovalent electrolyte setting the screening length."

- id: temperature
  name: absolute temperature
  dimension: "[temperature]"
  description: "Absolute temperature T of the aqueous solution."

- id: dielectric_constant
  name: relative dielectric constant
  dimension: dimensionless
  description: "Relative permittivity eps of the aqueous solvent."

- id: linker_reference_volume
  name: linker reference volume
  dimension: "[length] ** 3"
  description: "Microscopic reference volume v_l of a free linker in Eq. 7."

- id: repulsion_energy_parallel
  name: parallel electrostatic repulsion energy scale
  dimension: dimensionless
  description: "Dimensionless electrostatic repulsion energy Gamma_par (in units of k_B T) per segment of length D for parallel rods at r = D + delta (Eq. 4)."

- id: repulsion_energy_perpendicular
  name: perpendicular electrostatic repulsion energy scale
  dimension: dimensionless
  description: "Dimensionless electrostatic repulsion energy Gamma_perp (in units of k_B T) for perpendicular rods at r = D + delta (Eq. 4)."

- id: attraction_energy_parallel
  name: parallel linker-mediated attraction energy scale
  dimension: dimensionless
  description: "Dimensionless linker-mediated attraction energy u_par (in units of k_B T) per segment of length D for parallel rods (Eqs. 2, 5)."

- id: attraction_energy_parallel_total
  name: total parallel linker-mediated attraction energy
  dimension: dimensionless
  description: "Total dimensionless linker-mediated interaction energy (L/D) * u_par (in units of k_B T) between two parallel rods of length L (Eq. 5)."

- id: attraction_energy_perpendicular
  name: perpendicular linker-mediated attraction energy scale
  dimension: dimensionless
  description: "Dimensionless linker-mediated attraction energy u_perp (in units of k_B T) between two perpendicular rods (Eqs. 2, 5)."

- id: effective_interrod_potential
  name: effective rod-rod interaction free energy
  dimension: dimensionless
  description: "Effective rod-rod pair interaction free energy u(r, gamma) in units of k_B T (Eqs. 1-3)."

- id: linker_binding_energy_single
  name: single-filament linker adsorption energy
  dimension: dimensionless
  description: "Dimensionless adsorption energy eps_1 < 0 (in units of k_B T) of a linker bound to a single filament."

- id: linker_binding_energy_parallel
  name: parallel interfilament linker binding energy parameter
  dimension: dimensionless
  description: "Half the two-filament parallel linker binding energy eps_par < 0 (in units of k_B T; total bound energy 2*eps_par)."

- id: linker_binding_energy_perpendicular
  name: perpendicular interfilament linker binding energy parameter
  dimension: dimensionless
  description: "Half the two-filament perpendicular linker binding energy eps_perp < 0 (in units of k_B T; total bound energy 2*eps_perp)."

- id: molar_binding_energy
  name: molar linker binding energy
  dimension: "[energy] / [substance]"
  description: "Linker binding energy expressed per mole (kcal/mol)."

- id: linker_chemical_potential
  name: dimensionless linker chemical potential
  dimension: dimensionless
  description: "Chemical potential mu_l of linkers in units of k_B T."

- id: binding_sites_parallel
  name: parallel binding sites per filament
  dimension: dimensionless
  description: "Number of linker binding sites n_par = L / delta along a filament when rods are parallel."

- id: binding_sites_perpendicular
  name: perpendicular binding sites per junction
  dimension: dimensionless
  description: "Number of linker binding sites n_perp = 1 at a perpendicular rod crossing."

- id: second_virial_coefficient
  name: dimensionless second virial kernel B(gamma)
  dimension: dimensionless
  description: "Angle-dependent dimensionless second virial coefficient B(gamma) in Eq. 8."

- id: dimensionless_rod_concentration
  name: dimensionless rod concentration
  dimension: dimensionless
  description: "Scaled rod concentration c_r = (pi/4) * L^2 * D_eff * rho_r."

- id: dimensionless_linker_concentration
  name: dimensionless linker concentration
  dimension: dimensionless
  description: "Scaled linker concentration c_l = (pi/4) * L^2 * D_eff * rho_l."

- id: rod_number_density
  name: rod number concentration
  dimension: "1 / [length] ** 3"
  description: "Number of rods per unit volume rho_r."

- id: dimensionless_free_energy_density
  name: dimensionless free energy density
  dimension: dimensionless
  description: "Scaled free energy per unit volume F (or linker contribution f_linkers) in Eqs. 6-7."

- id: bundle_cone_angle
  name: bundle orientational cone width
  dimension: dimensionless
  description: "Orientational distribution cone width Delta_theta = D/L in the bundle phase (in radians)."
