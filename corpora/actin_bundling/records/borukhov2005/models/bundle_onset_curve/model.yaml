id: bundle_onset_curve
name: hexagonal-bundle coexistence onset curve c_l(c_r) (p. 4 & Fig. 3a-b, reconstructed)
role: model
built_from: [langmuir_attraction_eq5, effective_diameter_eq6, free_linkers_eq7, second_virial_eq8_corrected]
reconstructed: "Paper describes the bundle phase only qualitatively in one sentence on p. 4 (dense hexagonal packing of rods with orientational cone width Delta_theta = D/L) without printing the bundle free energy equation; reconstructed using hexagonal nearest-neighbor coordination z = 6 (3 parallel pairs per rod), translational cage volume L*delta^2, orientational entropy ln[2/(D/L)^2], and pairwise interaction (L/D)*(Gamma_par + u_par) from Eqs. 2, 3, and 5."
stated:
  page: 4
  printed_page: "3676"
  quote: "We treat the bundle phase by assuming a dense hexagonal"
  where: "text, col. 1 & Fig. 3a-b"
equation: "Equate mu_r^B(mu_l) = ln[(pi/4)*L*D_eff/delta^2] + ln[2/(D/L)^2] + 3*(L/D)*(Gamma_par + u_par(mu_l)) to min(mu_r^I, mu_r^N) at rod concentration c_r; evaluate c_l(c_r, mu_l) = -dF/dmu_l"
inputs:
  c_r: {quantity: dimensionless_rod_concentration, unit: dimensionless}
  D: {quantity: rod_diameter, unit: nm}
  L: {quantity: rod_length, unit: nm}
  delta: {quantity: linker_size, unit: nm}
  kappa_inv: {quantity: screening_length, unit: nm}
  n_perp: {quantity: binding_sites_perpendicular, unit: dimensionless}
  Gamma_par: {quantity: repulsion_energy_parallel, unit: dimensionless}
  Gamma_perp: {quantity: repulsion_energy_perpendicular, unit: dimensionless}
  eps_1: {quantity: linker_binding_energy_single, unit: dimensionless}
  eps_par: {quantity: linker_binding_energy_parallel, unit: dimensionless}
  eps_perp: {quantity: linker_binding_energy_perpendicular, unit: dimensionless}
  v_l: {quantity: linker_reference_volume, unit: nm^3}
outputs:
  c_l: {quantity: dimensionless_linker_concentration, unit: dimensionless}
  mu_l_bundle: {quantity: linker_chemical_potential, unit: dimensionless}
settings:
  n_gamma: 2000
stochastic: false
