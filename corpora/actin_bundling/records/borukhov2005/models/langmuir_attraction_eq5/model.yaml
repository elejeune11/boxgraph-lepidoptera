id: langmuir_attraction_eq5
name: Langmuir adsorption model for linker-mediated rod-rod attractions (Eq. 5)
role: model
stated:
  page: 3
  printed_page: "3675"
  quote: "The resulting linker-induced attractions can"
  where: "Eq. 5"
equation: "(L/D)*u_par = -n_par*ln[1 + exp(mu_l - 2*eps_par)] + 2*n_par*ln[1 + exp(mu_l - eps_1)]; u_perp = -n_perp*ln[1 + exp(mu_l - 2*eps_perp)] + 2*n_perp*ln[1 + exp(mu_l - eps_1)], with n_par = L/delta"
inputs:
  L: {quantity: rod_length, unit: nm}
  D: {quantity: rod_diameter, unit: nm}
  delta: {quantity: linker_size, unit: nm}
  n_perp: {quantity: binding_sites_perpendicular, unit: dimensionless}
  mu_l: {quantity: linker_chemical_potential, unit: dimensionless}
  eps_1: {quantity: linker_binding_energy_single, unit: dimensionless}
  eps_par: {quantity: linker_binding_energy_parallel, unit: dimensionless}
  eps_perp: {quantity: linker_binding_energy_perpendicular, unit: dimensionless}
outputs:
  u_par_total: {quantity: attraction_energy_parallel_total, unit: dimensionless}
  u_par: {quantity: attraction_energy_parallel, unit: dimensionless}
  u_perp: {quantity: attraction_energy_perpendicular, unit: dimensionless}
settings: {}
stochastic: false
