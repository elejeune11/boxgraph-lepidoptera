id: electrostatic_repulsion_eq4
name: Debye-Huckel parallel and perpendicular rod repulsion energies (Eq. 4, as printed)
role: model
described_from: ref-19
stated:
  page: 3
  printed_page: "3675"
  quote: "The repulsion energies"
  where: "Eq. 4"
equation: "Gamma_par = 2*D*(lambda/e)^2*l_B*K0[kappa*(D+delta)] / [(kappa*D/2)*K1(kappa*D/2)]^2; Gamma_perp = 2*pi*kappa^-1*(lambda/e)^2*l_B*exp(-kappa*(D+delta)) / [(kappa*D/2)*K1(kappa*D/2)]"
inputs:
  D: {quantity: rod_diameter, unit: nm}
  delta: {quantity: linker_size, unit: nm}
  kappa_inv: {quantity: screening_length, unit: nm}
  l_B: {quantity: bjerrum_length, unit: nm}
  lambda_e: {quantity: rod_linear_charge_density, unit: 1/nm}
outputs:
  Gamma_par: {quantity: repulsion_energy_parallel, unit: dimensionless}
  Gamma_perp: {quantity: repulsion_energy_perpendicular, unit: dimensionless}
settings: {}
stochastic: false
