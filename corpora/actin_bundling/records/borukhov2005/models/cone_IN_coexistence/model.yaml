id: cone_IN_coexistence
name: cone-approximation isotropic-nematic coexistence (Eqs. 6-8, reconstructed)
role: model
built_from: [langmuir_attraction_eq5, effective_diameter_eq6, free_linkers_eq7, second_virial_eq8_corrected]
reconstructed: "Paper describes the cone approximation in words (p. 4, uniform rod distribution in a pair of narrow cones of width Delta_theta) and states that analytical expressions for sigma and w were obtained from Eq. 8, but does not print those expressions; reconstructed by direct Gauss-Legendre spherical-cap integration of Eq. 6 with corrected Eq. 8."
stated:
  page: 4
  printed_page: "3676"
  quote: "We have adopted a"
  where: "text, col. 1 & Fig. 3a"
equation: "Minimize F_N(c_r, Delta_theta) with f(Omega) = [4*pi*(1 - cos(Delta_theta))]^-1 on polar caps theta <= Delta_theta and theta >= pi - Delta_theta; equate mu_r and osmotic pressure P between I and N at fixed mu_l(c_l)"
inputs:
  c_l: {quantity: dimensionless_linker_concentration, unit: dimensionless}
  D: {quantity: rod_diameter, unit: nm}
  L: {quantity: rod_length, unit: nm}
  delta: {quantity: linker_size, unit: nm}
  kappa_inv: {quantity: screening_length, unit: nm}
  n_perp: {quantity: binding_sites_perpendicular, unit: dimensionless}
  Gamma_par: {quantity: repulsion_energy_parallel, unit: dimensionless}
  Gamma_perp: {quantity: repulsion_energy_perpendicular, unit: dimensionless}
  eps_1: {quantity: linker_binding_energy_single, unit: dimensionless}
  eps_par: {quantity: linker_binding_energy_parallel, unit: dimensionless}
  eps_perp: {quantity: linker_binding_energy_perpendicular, unit: dimensionless}
  v_l: {quantity: linker_reference_volume, unit: nm^3}
outputs:
  c_I: {quantity: dimensionless_rod_concentration, unit: dimensionless}
  c_N: {quantity: dimensionless_rod_concentration, unit: dimensionless}
settings:
  n_quad: 12
stochastic: false
