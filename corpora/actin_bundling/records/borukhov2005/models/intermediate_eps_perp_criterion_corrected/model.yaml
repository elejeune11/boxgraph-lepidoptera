id: intermediate_eps_perp_criterion_corrected
name: intermediate phase-diagram criterion B(0 deg) = B(90 deg) = 0 (p. 4, using corrected Eq. 8)
role: model
from_words: true
built_from: [langmuir_attraction_eq5, effective_diameter_eq6, second_virial_eq8_corrected]
variant_of: intermediate_eps_perp_criterion
corrections:
  - equation: "Eq. 8"
    change: "Use corrected parallel bracket Y = (Gamma_par - |u_par|)*L/D in B(0 deg) so B(0 deg) transitions from positive to negative as linker chemical potential increases"
    evidence: "With printed Eq. 8, B(0 deg) is negative at low linker concentration and crosses upward to positive at mu_l = -15.79, opposite to the physical behavior described on pp. 3-4."
stated:
  page: 4
  printed_page: "3676"
  quote: "The structure of the phase diagram is determined by whether"
  where: "text, col. 1"
equation: "Solve B_corr(0 deg; mu_l*) = 0 from corrected Eq. 8 with Eq. 5, then solve B(90 deg; mu_l*, eps_perp) = 0 for eps_perp"
inputs:
  D: {quantity: rod_diameter, unit: nm}
  L: {quantity: rod_length, unit: nm}
  delta: {quantity: linker_size, unit: nm}
  kappa_inv: {quantity: screening_length, unit: nm}
  n_perp: {quantity: binding_sites_perpendicular, unit: dimensionless}
  Gamma_par: {quantity: repulsion_energy_parallel, unit: dimensionless}
  Gamma_perp: {quantity: repulsion_energy_perpendicular, unit: dimensionless}
  eps_1: {quantity: linker_binding_energy_single, unit: dimensionless}
  eps_par: {quantity: linker_binding_energy_parallel, unit: dimensionless}
outputs:
  mu_l_crit: {quantity: linker_chemical_potential, unit: dimensionless}
  eps_perp_int: {quantity: linker_binding_energy_perpendicular, unit: dimensionless}
settings: {}
stochastic: false
