id: electrostatic_repulsion_eq4_corrected
name: Debye-Huckel parallel and perpendicular rod repulsion energies (Eq. 4, squared denominator restored in Gamma_perp)
role: model
described_from: ref-19
variant_of: electrostatic_repulsion_eq4
corrections:
  - equation: "Eq. 4"
    change: "Square the denominator [(kappa*D/2)*K1(kappa*D/2)]^2 in Gamma_perp, matching Gamma_par"
    evidence: "In Debye-Huckel theory for two charged cylinders (Brenner & Parsegian 1974, Ref. 19), each cylinder contributes one factor of [(kappa*D/2)*K1(kappa*D/2)]^-1, so both Gamma_par and Gamma_perp carry the squared denominator. With the printed unsquared denominator, the lambda-independent ratio Gamma_par/Gamma_perp = 21.03 at D=8 nm, delta=1 nm, kappa^-1=1 nm, incompatible with the paper's claim Gamma_par = Gamma_perp = 1.26 (p. 4); restoring the square brings the ratio to 1.050."
stated:
  page: 3
  printed_page: "3675"
  quote: "The repulsion energies"
  where: "Eq. 4"
equation: "Gamma_par = 2*D*(lambda/e)^2*l_B*K0[kappa*(D+delta)] / [(kappa*D/2)*K1(kappa*D/2)]^2; Gamma_perp = 2*pi*kappa^-1*(lambda/e)^2*l_B*exp(-kappa*(D+delta)) / [(kappa*D/2)*K1(kappa*D/2)]^2"
inputs:
  D: {quantity: rod_diameter, unit: nm}
  delta: {quantity: linker_size, unit: nm}
  kappa_inv: {quantity: screening_length, unit: nm}
  l_B: {quantity: bjerrum_length, unit: nm}
  lambda_e: {quantity: rod_linear_charge_density, unit: 1/nm}
outputs:
  Gamma_par: {quantity: repulsion_energy_parallel, unit: dimensionless}
  Gamma_perp: {quantity: repulsion_energy_perpendicular, unit: dimensionless}
settings: {}
stochastic: false
