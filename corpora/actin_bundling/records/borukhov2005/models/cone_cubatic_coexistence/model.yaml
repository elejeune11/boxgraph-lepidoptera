id: cone_cubatic_coexistence
name: small-cone cubatic coexistence boundaries (I+C)/C and C/(N+C) (Eqs. 5-8, reconstructed)
role: model
built_from: [langmuir_attraction_eq5, effective_diameter_eq6, free_linkers_eq7, second_virial_eq8_corrected]
reconstructed: "Paper describes the cubatic cone approximation in words (p. 4, three pairs of mutually perpendicular narrow cones) and states that analytical expressions for sigma and w were obtained from Eq. 8, but does not print them; reconstructed using small-cone orientational entropy sigma_C = ln[2/(3*Delta_theta^2)] and w_C = (1/3)*w_N(Delta_theta) + (2/3)*B(90 deg) with exact disk-averaged w_N and corrected Eq. 8."
stated:
  page: 4
  printed_page: "3676"
  quote: "whereas the cubatic phase is characterized by three pairs of"
  where: "text, col. 1 & Fig. 3b-c"
equation: "Minimize F_C(c_r, Delta_theta) with sigma_C = ln[2/(3*Delta_theta^2)] and w_C = (1/3)*w_N + (2/3)*B(90 deg); solve I-C and C-N coexistence at the mu_l yielding c_l(C) = c_l"
inputs:
  c_l: {quantity: dimensionless_linker_concentration, unit: dimensionless}
  D: {quantity: rod_diameter, unit: nm}
  L: {quantity: rod_length, unit: nm}
  delta: {quantity: linker_size, unit: nm}
  kappa_inv: {quantity: screening_length, unit: nm}
  n_perp: {quantity: binding_sites_perpendicular, unit: dimensionless}
  Gamma_par: {quantity: repulsion_energy_parallel, unit: dimensionless}
  Gamma_perp: {quantity: repulsion_energy_perpendicular, unit: dimensionless}
  eps_1: {quantity: linker_binding_energy_single, unit: dimensionless}
  eps_par: {quantity: linker_binding_energy_parallel, unit: dimensionless}
  eps_perp: {quantity: linker_binding_energy_perpendicular, unit: dimensionless}
  v_l: {quantity: linker_reference_volume, unit: nm^3}
outputs:
  c_C_left: {quantity: dimensionless_rod_concentration, unit: dimensionless}
  c_C_right: {quantity: dimensionless_rod_concentration, unit: dimensionless}
settings:
  n_gamma: 2000
stochastic: false
