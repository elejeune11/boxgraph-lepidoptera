id: effective_potential_eq1_eq3_corrected
name: effective rod-rod interaction potential (Eqs. 1-3, corrected Eq. 2 matching Fig. 2 and Eq. 8)
role: model
variant_of: effective_potential_eq1_eq3
corrections:
  - equation: "Eq. 2"
    change: "Use u(gamma) = u_perp instead of printed u_perp / sin(gamma) for gamma > D/L"
    evidence: "Both Fig. 2 (p. 3, right panel label Gamma_perp/sin(gamma) - |u_perp|) and Eq. 8 (p. 3, exp(-Gamma_perp/sin(gamma) + |u_perp|)) omit the 1/sin(gamma) factor on u_perp, consistent with a single crossing-point binding site n_perp = 1 (p. 3 below Eq. 5)."
stated:
  page: 2
  printed_page: "3674"
  quote: "Three different interactions contribute to the interrod potential."
  where: "Eqs. 1-3"
equation: "u(r, gamma) = inf (r <= D); u(gamma) + Gamma(gamma) (D < r <= D+delta); Gamma(gamma)*exp(-kappa*(r-D-delta)) (r > D+delta); u(gamma) = (L/D)*u_par (gamma <= D/L) else u_perp; Gamma(gamma) = (L/D)*Gamma_par (gamma <= D/L) else Gamma_perp/sin(gamma)"
inputs:
  r: {quantity: rod_separation, unit: nm}
  gamma: {quantity: interrod_angle, unit: dimensionless}
  D: {quantity: rod_diameter, unit: nm}
  L: {quantity: rod_length, unit: nm}
  delta: {quantity: linker_size, unit: nm}
  kappa_inv: {quantity: screening_length, unit: nm}
  u_par: {quantity: attraction_energy_parallel, unit: dimensionless}
  u_perp: {quantity: attraction_energy_perpendicular, unit: dimensionless}
  Gamma_par: {quantity: repulsion_energy_parallel, unit: dimensionless}
  Gamma_perp: {quantity: repulsion_energy_perpendicular, unit: dimensionless}
outputs:
  u: {quantity: effective_interrod_potential, unit: dimensionless}
settings: {}
stochastic: false
