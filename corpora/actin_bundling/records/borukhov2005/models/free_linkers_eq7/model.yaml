id: free_linkers_eq7
name: free and single-rod adsorbed linker free energy density (Eq. 7)
role: model
built_from: [effective_diameter_eq6]
stated:
  page: 3
  printed_page: "3675"
  quote: "The first term in Eq. 7 is the contribution of free linkers"
  where: "Eq. 7"
equation: "f_linkers = -(L^2 * D_eff / v_l) * exp(mu_l) - n_par * c_r * log[1 + exp(mu_l - eps_1)], with n_par = L/delta and c_l_0 = -df_linkers/dmu_l"
inputs:
  L: {quantity: rod_length, unit: nm}
  D: {quantity: rod_diameter, unit: nm}
  delta: {quantity: linker_size, unit: nm}
  kappa_inv: {quantity: screening_length, unit: nm}
  Gamma_perp: {quantity: repulsion_energy_perpendicular, unit: dimensionless}
  v_l: {quantity: linker_reference_volume, unit: nm^3}
  c_r: {quantity: dimensionless_rod_concentration, unit: dimensionless}
  mu_l: {quantity: linker_chemical_potential, unit: dimensionless}
  eps_1: {quantity: linker_binding_energy_single, unit: dimensionless}
outputs:
  f_linkers: {quantity: dimensionless_free_energy_density, unit: dimensionless}
  c_l_non_junction: {quantity: dimensionless_linker_concentration, unit: dimensionless}
settings: {}
stochastic: false
