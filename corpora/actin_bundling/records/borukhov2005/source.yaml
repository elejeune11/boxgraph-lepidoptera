notes: >
  In scope: the paper's full equilibrium statistical-mechanical model of charged rigid
  rods with interrod linkers (Eqs. 1-8), including the piecewise effective rod-rod
  potential (Eqs. 1-3), Debye-Huckel parallel and perpendicular repulsion energies
  (Eq. 4), Bjerrum length definition (p. 3), Langmuir linker-mediated attractions
  (Eq. 5), effective electrostatic diameter and generalized Onsager free energy (Eq. 6),
  free and single-rod adsorbed linker free energy (Eq. 7), analytical second virial
  coefficient B(gamma) (Eq. 8), molar binding-energy conversions (-7 kBT -> -4 kcal/mol
  and -12 kBT -> -7 kcal/mol), the B(0 deg) vs B(90 deg) sign-change criterion for the
  intermediate phase diagram (p. 4), the isotropic B(90 deg) = 0 instability boundary
  (Fig. 3c), reconstructed spherical-cap cone-approximation isotropic-nematic and
  cubatic coexistence models, a reconstructed hexagonal-bundle onset model, and
  calibrated 1200-dpi figure readings of all three phase diagrams in Fig. 3(a-c).
  Left out (numbers that feed no quantitative model in the paper): F-actin persistence
  length "of order 10 um" (p. 2, footnote **), physiological monovalent salt "100 mM"
  (p. 4, col. 2, used only as qualitative motivation for kappa^-1 = 1 nm; Debye-Huckel
  screening length at 100 mM with l_B = 0.7 nm is 0.97 nm), qualitative multivalent
  cation binding energies eps_perp ~= eps_par ~= -1 (p. 5, col. 1), and typical
  protein-protein binding energy scale >= 10 kBT (p. 5, col. 2). Figs. 1 and 2 are
  uncalibrated schematic illustrations with no numeric axes (documented in figures.md).
  Notable findings from verbatim-equation and numerical verification:
  (1) Eq. 4 (p. 3) omits the exponent 2 on the denominator [(kappa*D/2)*K1(kappa*D/2)]
  of Gamma_perp, producing a lambda-independent ratio Gamma_par/Gamma_perp = 21.03 at
  the paper's parameters (D = 8 nm, delta = 1 nm, kappa^-1 = 1 nm), incompatible with
  the printed Gamma_par = Gamma_perp = 1.26 (p. 4). Even after restoring the missing
  square (variant_of), the exact ratio is 1.050 (5.0% difference), and linear charge
  density lambda/e is never stated in the paper.
  (2) Eq. 8 (p. 3) for gamma <= D/L has an inverted sign in the bracket
  [(|u_par| - Gamma_par)*L/D instead of (Gamma_par - |u_par|)*L/D]: as printed, the
  second term stays positive for attractive |u_par| > Gamma_par and diverges to
  bracket = -1.60e66 (B(0 deg) = -2.32e64) for pure electrostatic repulsion (u_par = 0), contradicting both the Mayer
  integral of Eq. 1 and the text below Eq. 8. Restoring the sign (variant_of) recovers
  the intended crossover at (|u_par| - Gamma_par)*L/D > 0.
  (3) Eq. 2 (p. 2) prints u(gamma) = u_perp / sin(gamma) for gamma > D/L, whereas
  Fig. 2 (p. 3) and Eq. 8 (p. 3) omit the 1/sin(gamma) factor on |u_perp| (consistent
  with n_perp = 1 single linker per crossing); additionally Eq. 8 uses +|u_perp|,
  which matches -u_perp only when u_perp <= 0.
  (4) Using the paper's stated parameters and corrected Eq. 8, the paper's own
  intermediate-diagram criterion B(0 deg) = B(90 deg) = 0 predicts eps_perp = -9.62 kBT
  (at mu_l = -15.74), whereas Fig. 3b prints eps_perp = -10.5 kBT (where B(90 deg) = 0
  at mu_l = -17.49, 1.75 kBT below B(0 deg) = 0). Remarkably, Fig. 3a's measured
  bundling-onset slope dc_l/dc_r ~= 0.0243 also implies mu_l_bundle ~= -17.62 via Eq. 7
  (just below -17.49), suggesting the authors' unstated bundle free energy gave bundling
  ~1.9 kBT below the Eq. 5/Eq. 8 pairwise threshold.
  (5) At the B(90 deg) = 0 instability boundary of Fig. 3c (requiring neither cone nor
  bundle approximations), exact evaluation of Eqs. 5-8 gives c_l(c_r) ~= 0.858 * c_r^2,
  6.6x larger than Fig. 3c's calibrated curve (~0.130 * c_r^2). Similarly, exact
  spherical-cap cone integration of Eqs. 6 and 8 (corrected) at c_l = 0 yields
  c_I = 3.75, c_N = 5.88 (c_N/c_I = 1.57) versus Fig. 3a's calibrated c_I = 4.27,
  c_N = 9.94 (c_N/c_I = 2.33). The paper omits the explicit analytical cone formulas,
  the bundle free energy, lambda/e, and v_l.
