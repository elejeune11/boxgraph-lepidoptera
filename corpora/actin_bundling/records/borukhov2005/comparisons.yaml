# Comparisons of computed model outputs against printed values and calibrated Fig. 3 curves.

- id: cmp_bjerrum_length
  purpose: consistency
  computed: l_B_computed
  printed: l_B_printed
  note: "Checks l_B = e^2/(eps*k_B*T) at room temperature (298 K, eps=78.4) against printed '~= 7 A' (p. 3)."

- id: cmp_eps1_kcal
  purpose: reproduction
  computed: eps_1_kcal_computed
  printed: eps_1_kcal_printed
  note: "Checks conversion of eps_1 = -7 k_B T to printed -4 kcal/mol (p. 4)."

- id: cmp_eps_perp_3c_kcal
  purpose: reproduction
  computed: eps_perp_3c_kcal_computed
  printed: eps_perp_3c_kcal_printed
  note: "Checks conversion of eps_perp = -12 k_B T to printed -7 kcal/mol (p. 5)."

# Eq. 4 printed vs corrected variant against Gamma_par = Gamma_perp = 1.26 (p. 4)
- id: cmp_Gamma_par_printed
  purpose: reproduction
  computed: Gamma_par_eq4_printed
  printed: Gamma_par_printed
  note: "Printed Eq. 4 evaluated with D=8 nm, delta=1 nm, kappa^-1=1 nm, l_B=7 A, and added lambda/e=4 nm^-1 (alternatives 1.43, 2.35, 2.41 nm^-1)."

- id: cmp_Gamma_perp_printed
  purpose: reproduction
  computed: Gamma_perp_eq4_printed
  printed: Gamma_perp_printed
  note: "Printed Eq. 4 for Gamma_perp (missing square on denominator) yields Gamma_perp 21.03x smaller than Gamma_par for any lambda/e."

- id: cmp_Gamma_par_corrected
  purpose: reproduction
  computed: Gamma_par_eq4_corrected
  printed: Gamma_par_printed
  note: "Corrected Eq. 4 (same formula for Gamma_par); reproduces 1.26 at added alternative lambda/e = 2.35 nm^-1."

- id: cmp_Gamma_perp_corrected
  purpose: reproduction
  computed: Gamma_perp_eq4_corrected
  printed: Gamma_perp_printed
  note: "Corrected Eq. 4 with squared denominator in Gamma_perp; reproduces 1.26 at added alternative lambda/e = 2.41 nm^-1 (5% offset from Gamma_par)."

# Intermediate-diagram criterion B(0 deg) = B(90 deg) = 0 vs Fig. 3b printed eps_perp = -10.5
- id: cmp_intermediate_eps_perp_printed
  purpose: reproduction
  computed: eps_perp_int_printed
  printed: eps_perp_3b_printed
  note: "Intermediate eps_perp from B(0)=B(90)=0 using printed Eq. 8 (where B(0) crosses zero in the wrong direction at mu_l = -15.79, yielding eps_perp = -9.65 vs printed -10.5)."

- id: cmp_intermediate_eps_perp_corrected
  purpose: reproduction
  computed: eps_perp_int_corrected
  printed: eps_perp_3b_printed
  note: "Intermediate eps_perp from B(0)=B(90)=0 using corrected Eq. 8 (mu_l* = -15.75, yielding eps_perp = -9.63 vs printed -10.5, a 0.87 k_B T discrepancy)."

# Fig. 3c isotropic B(90 deg) = 0 instability boundary (no cone or bundle approximation needed)
- id: cmp_fig3c_B90_printed
  purpose: reproduction
  computed: b90_instability_printed_pred
  printed: fig3c_B90_instability_data
  note: "Isotropic B(90)=0 instability curve from printed Eqs. 5-8; inverted parallel sign in Eq. 8 causes spurious -10^59 blowup from the gamma <= D/L cap."

- id: cmp_fig3c_B90_corrected
  purpose: reproduction
  computed: b90_instability_corrected_pred
  printed: fig3c_B90_instability_data
  note: "Isotropic B(90)=0 instability curve from Eqs. 5-8 with corrected parallel sign in Eq. 8; yields c_l ~= 0.858*c_r^2, ~6.6x above Fig. 3c (~0.130*c_r^2)."

# Reconstructed cone-approximation and hexagonal-bundle models vs Fig. 3(a-c)
- id: cmp_fig3a_I_IN
