  computed: cone_IN_cI_pred
  printed: fig3a_I_IN_data
  note: "Reconstructed exact spherical-cap cone I-N coexistence c_I ~= 3.75 vs calibrated Fig. 3a vertical boundary c_I ~= 4.27."

- id: cmp_fig3a_IN_N
  purpose: reproduction
  computed: cone_IN_cN_pred
  printed: fig3a_IN_N_data
  note: "Reconstructed exact spherical-cap cone I-N coexistence c_N ~= 5.88 vs calibrated Fig. 3a vertical boundary c_N ~= 9.94."

- id: cmp_fig3a_bundling_onset
