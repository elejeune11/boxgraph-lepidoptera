  printed: fig3c_C_left_data
  note: "Reconstructed small-cone (I+C)/C boundary c_C(c_l) (~29.8-29.4) vs calibrated Fig. 3c (I+C)/C boundary (~8.27-9.80)."

- id: cmp_fig3c_C_right
  purpose: reproduction
