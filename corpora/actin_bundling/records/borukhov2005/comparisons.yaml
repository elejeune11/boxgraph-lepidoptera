  note: "Reconstructed small-cone C/(N+C) boundary c_C(c_l) (~6.38-8.55) vs calibrated Fig. 3b C/(N+C) boundary (~8.89-12.46)."

- id: cmp_fig3c_C_left
  purpose: reproduction
