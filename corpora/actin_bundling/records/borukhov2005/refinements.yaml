# Numerical quadrature refinements for all integral-based models.

- id: ref_b90_ngamma
  run: run_b90_curve_corrected
  setting: n_gamma
  factors: [1, 2, 4]
  mode: multiply
  output: c_l
  tolerance: "0.1%"
  tolerance_basis: "added: well below the ~10-20% pixel reading precision of Fig. 3c"
  tolerance_added: true

- id: ref_cone_IN_nquad
  run: run_cone_IN_I
  setting: n_quad
  factors: [1, 2]
  mode: multiply
  output: c_I
  tolerance: "0.1%"
  tolerance_basis: "added: well below the ~1.5% pixel reading precision of Fig. 3a"
  tolerance_added: true

- id: ref_cone_cubatic_ngamma
  run: run_cone_cubatic_3c
  setting: n_gamma
  factors: [1, 2, 4]
  mode: multiply
  output: c_C_left
  tolerance: "0.1%"
  tolerance_basis: "added: well below the ~0.5% pixel reading precision of Fig. 3c (I+C)/C boundary"
  tolerance_added: true

- id: ref_bundle_ngamma
  run: run_bundle_3a
  setting: n_gamma
  factors: [1, 2, 4]
  mode: multiply
  output: c_l
  tolerance: "0.1%"
  tolerance_basis: "added: well below the ~2% pixel reading precision of Fig. 3a"
  tolerance_added: true
