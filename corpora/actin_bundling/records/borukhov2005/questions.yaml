# Open questions, suspected misprints, unstated inputs/models, and unexplained quantitative discrepancies.

- id: q_eq4_missing_square
  kind: possible_error
  about: [electrostatic_repulsion_eq4, electrostatic_repulsion_eq4_corrected, cmp_Gamma_perp_printed]
  text: >
    Eq. 4 (p. 3) prints the denominator of Gamma_perp as [(kappa*D/2)*K1(kappa*D/2)]
    without squaring it, whereas Gamma_par has [(kappa*D/2)*K1(kappa*D/2)]^2. In
    Debye-Huckel theory for two charged cylinders (Brenner & Parsegian 1974, Ref. 19),
    each cylinder contributes one factor of [(kappa*D/2)*K1(kappa*D/2)]^-1, so both
    formulas carry the squared denominator. At the paper's parameters (D = 8 nm,
    delta = 1 nm, kappa^-1 = 1 nm), (kappa*D/2)*K1(kappa*D/2) = 0.04993, making the
    printed lambda-independent ratio Gamma_par/Gamma_perp = 21.026 — incompatible with
    the paper's printed result Gamma_par = Gamma_perp = 1.26 (p. 4).
  citation:
    page: 3
    printed_page: "3675"
    quote: "The repulsion energies"
    where: "Eq. 4"

- id: q_unstated_lambda_e
  kind: unstated_input
  about: [electrostatic_repulsion_eq4, electrostatic_repulsion_eq4_corrected, lambda_e_added]
  text: >
    The paper calculates Gamma_par = Gamma_perp = 1.26 from Eq. 4 (p. 4) without
    stating the linear charge density lambda/e of the actin filaments. Using the
    standard bare F-actin value lambda/e = 4 nm^-1 with l_B = 0.7 nm gives
    Gamma_par = 3.66 (and corrected Gamma_perp = 3.48), whereas matching 1.26
    requires an effective charge density lambda/e = 2.35 nm^-1 (for Gamma_par) or
    2.41 nm^-1 (for corrected Gamma_perp).
  citation:
    page: 4
    printed_page: "3676"
    quote: "characterize the electrostatic repulsion are calculated from Eq."
    where: "text, col. 2"

- id: q_eq4_ratio_5pct
  kind: unexplained_difference
  about: [electrostatic_repulsion_eq4_corrected, Gamma_par_printed, Gamma_perp_printed, cmp_Gamma_par_corrected, cmp_Gamma_perp_corrected]
  text: >
    Even after restoring the missing exponent 2 in the denominator of Gamma_perp in
    Eq. 4, the ratio Gamma_par / Gamma_perp = D*K0[kappa*(D+delta)] / [pi*kappa^-1*exp(-kappa*(D+delta))]
    is independent of lambda/e and l_B and equals 1.0499 at D = 8 nm, delta = 1 nm,
    kappa^-1 = 1 nm. Because the two values differ by 5.0%, Gamma_par and Gamma_perp
    cannot both equal 1.26 to three significant figures from Eq. 4 with the stated
    lengths (at lambda/e = 2.35 nm^-1, Gamma_par = 1.262 while Gamma_perp = 1.202).
  citation:
    page: 4
    printed_page: "3676"
    quote: "characterize the electrostatic repulsion are calculated from Eq."
    where: "text, col. 2"

- id: q_eq8_parallel_sign
  kind: possible_error
  about: [second_virial_eq8, second_virial_eq8_corrected, b90_instability_curve, intermediate_eps_perp_criterion]
  text: >
    In Eq. 8 (p. 3) for small angles gamma <= D/L, the second term is printed as
    16*(D*delta/(D_eff*L))*[1 + (exp[-(|u_par|-Gamma_par)*L/D] - 1)/((|u_par|-Gamma_par)*L/D)].
    With X = (|u_par| - Gamma_par)*L/D, the bracket stays strictly positive in (0, 1)
    for all attractive interactions |u_par| > Gamma_par (X > 0) and diverges to
    -1.60e66 (giving B(0 deg) = -2.32e64) for pure electrostatic repulsion
    (u_par = 0, X = -157.5), causing the entire virial expansion and isotropic
    B(90 deg) = 0 curve to blow up to -10^59.
    Both the exact Mayer integral over overlap length l in [0, L] and the text below
    Eq. 8 (pp. 3-4) show the argument must be Y = (Gamma_par - |u_par|)*L/D = -X.
  citation:
    page: 3
    printed_page: "3675"
    quote: "It is clear from Eq. 8 that the second term changes sign"
    where: "Eq. 8 and text below"

- id: q_eq2_vs_eq8_sin_gamma
  kind: possible_error
  about: [effective_potential_eq1_eq3, effective_potential_eq1_eq3_corrected, second_virial_eq8]
  text: >
    Eq. 2 (p. 2) prints u(gamma) = u_perp / sin(gamma) for gamma > D/L, which combined
    with Eqs. 1 and 3 implies u(r, gamma) = (Gamma_perp + u_perp)/sin(gamma) for
    D < r <= D + delta. However, both Fig. 2 (p. 3, label Gamma_perp/sin(gamma) - |u_perp|)
    and Eq. 8 (p. 3, exp[-Gamma_perp/sin(gamma) + |u_perp|]) omit the 1/sin(gamma)
    factor on |u_perp|, consistent with n_perp = 1 single linker at a rod crossing.
    In addition, writing +|u_perp| in Eq. 8 matches -u_perp only in the attractive
    regime u_perp <= 0, whereas prose on p. 3 (col. 1) notes that u_par and u_perp
    can be either positive or negative via Eq. 5.
  citation:
    page: 2
    printed_page: "3674"
    quote: "Three different interactions contribute to the interrod potential."
    where: "Eq. 2"

- id: q_eq7_unstated_vl_and_pi4
  kind: unstated_input
  about: [free_linkers_eq7, v_l_added]
  text: >
    Eq. 7 (p. 3) introduces the linker reference volume v_l without specifying its
    numerical value or relation to linker diameter delta. In addition, the first term
    -(L^2*D_eff/v_l)*exp(mu_l) omits the factor pi/4 that multiplies L^2*D_eff in the
    definitions c_r = (pi/4)*L^2*D_eff*rho_r and c_l = (pi/4)*L^2*D_eff*rho_l (pp. 3-4),
    unless pi/4 is absorbed into v_l. Minor notation inconsistency: Eq. 7 uses 'log'
    for natural logarithm while Eq. 5 uses 'ln', and prose on p. 3 (col. 1) twice
    prints mu_1 instead of mu_l.
  citation:
    page: 3
    printed_page: "3675"
    quote: "The first term in Eq. 7 is the contribution of free linkers"
    where: "Eq. 7"

- id: q_intermediate_eps_perp_mismatch
  kind: unexplained_difference
  about: [intermediate_eps_perp_criterion_corrected, eps_perp_3b_printed, cmp_intermediate_eps_perp_corrected, cmp_fig3a_bundling_onset, cmp_fig3b_IB_onset]
  text: >
    Using the paper's stated parameters (D = 8 nm, L = 1000 nm, delta = 1 nm,
    kappa^-1 = 1 nm, Gamma_par = Gamma_perp = 1.26, eps_1 = eps_par = -7) and
    corrected Eq. 8, B(0 deg) crosses zero at mu_l* = -15.746 and equating
    B(0 deg) = B(90 deg) = 0 (p. 4 col. 1 criterion for the intermediate phase
    diagram) predicts eps_perp = -9.63 k_B T, not the printed Fig. 3b value
    eps_perp = -10.5 k_B T (where B(90 deg) = 0 at mu_l* = -17.486, 1.74 k_B T below
    B(0 deg) = 0). Independently, the calibrated bundling-onset slope in Fig. 3a
    (dc_l/dc_r ~= 0.0243) implies mu_l_bundle ~= -17.62 via Eq. 7 (n_par = 1000,
    eps_1 = -7), which lies just 0.13 k_B T below mu_l*(B(90)=0, eps_perp=-10.5) = -17.49
    — consistent with Fig. 3b's topology, yet at mu_l = -17.62 Eq. 5 gives only
    |(L/D)*u_par| = 26.4 k_B T versus (L/D)*Gamma_par = 157.5 k_B T (6.0x smaller).
    The printed equations do not explain why bundling occurs ~1.9 k_B T below the
    pairwise attraction-repulsion balance (possibly an unstated factor in the omitted
    bundle free energy or effective parallel interaction).
  citation:
    page: 4
    printed_page: "3676"
    quote: "Intermediate-phase diagram."
    where: "Fig. 3b caption and p. 4 col. 1"

