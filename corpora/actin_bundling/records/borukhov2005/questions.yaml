- id: q_unstated_cone_and_bundle_models
  kind: unstated_model
  about: [cone_IN_coexistence, cone_cubatic_coexistence, bundle_onset_curve, cmp_fig3a_I_IN, cmp_fig3a_IN_N, cmp_fig3c_C_left, cmp_fig3c_C_right]
  text: >
    The paper omits both (i) the explicit analytical cone-approximation expressions it
    states were obtained for sigma and w in the isotropic, nematic, and cubatic phases
    (p. 4, col. 1), and (ii) the free-energy expression for the hexagonal bundle phase
    (described only qualitatively in one sentence on p. 4, col. 1). Even for pure
    charged rods without linkers (c_l -> 0), exact spherical-cap cone integration of
    Eqs. 6 and 8 gives c_I = 3.75, c_N = 5.88 (c_N/c_I = 1.57), whereas calibrated
    Fig. 3a shows c_I = 4.27, c_N = 9.94 (c_N/c_I = 2.33). Notably, for any 3D nematic
    cone model with sigma_N ~ -2*ln(Delta_theta) and w_N ~ A*Delta_theta*(1 - h*ln(Delta_theta)),
    the envelope theorem enforces P_N >= 3*c_N, so at c_I = 4.27 with Eq. 8's w_I = 2.22
    (P_I = 24.51), coexistence requires c_N <= 8.17 < 9.94; how Fig. 3a reaches
    c_N = 9.94 at c_I = 4.27 is not determined by the printed equations.
  citation:
    page: 4
    printed_page: "3676"
    quote: "Given Eq. 8 for the"
    where: "text, col. 1"

