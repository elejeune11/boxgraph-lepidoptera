  text: >
    In Fig. 3b (p. 4), the cubatic phase C has a clear solid left boundary ((I+C)/C for
    c_linkers ~= 16-31 and (C+B)/C for c_linkers ~= 31-45), and run_cone_cubatic_3b already
    computes cone_cubatic_3b_left_pred, yet figures.yaml reads only the right boundary
    fig3b_C_right_boundary (and figures.md does not note the omission of the left boundary
    or the low-c_linkers N/(N+C) line). Additionally, in fig3c_B90_instability (Fig. 3c,
    p. 4), the embedded 150-dpi bitmap places the curve at c_rods = 1.0 and 1.5 on the single
    native pixel row immediately adjacent to the bottom axis (c_linkers ~= 0.22 +/- 0.15),
    limiting low-c_rods precision to +/-1 native pixel.
  citation:
