- id: val_caseA_hannezo_si_cal_vs_embryo_wt
  model: caseA_critical_dimensional_eq9_10
  inputs:
    gamma: gamma_hannezo_si_cal_added
    D: "hannezo2015/diffusion_coeff_frap"
    k_d: kd_hannezo_frap_added
    eta: eta_hannezo_div4_added
    kappa: kappa_fig4bI
    beta: beta_hannezo_div4_added
    c_0: c0_hannezo_si_cal_added
  output: ell_pattern
  against: "hannezo2015/ring_wavelength_embryo_wt"
  purpose: fit_quality
  quantities:
    "hannezo2015/diffusion_coefficient": effective_diffusivity
    "hannezo2015/ring_wavelength": pattern_wavelength
  conditions_ok: >
    Uses Hannezo et al. (2015) stage-15 embryonic FRAP inputs (D = 0.04 um^2/s, k_d = 1/15 s^-1)
    paired with gamma_hannezo_si_cal_added = 10^18 Pa*s/m^2 and eta_hannezo_div4_added = 25 Pa*s
    (so effective 1D hydrodynamic length 2*ell_s = 10 nm matches hannezo2015/lh_inverted_si =
    10^-8 m, which Hannezo et al. SI Sec. 2.6.4 calibrated directly to ring_wavelength_embryo_wt =
    0.5 um) plus Mirza Appendix D default nematic ratios (kappa = -0.2, beta/eta = -0.2,
    c_bar_0 = 4 -> c_0 = 1.6e5 Pa, delta = 0.005). Recorded as fit_quality (not out-of-sample
    validation) because l_h = 10^-8 m was inverted from this same embryonic measurement.
  basis: >
    Hannezo et al. (2015) Main p. 3 designates l_h as 'the one fitting parameter to match the
    observed wavelength', and SI Sec. 2.6.4 (p. 21) inverts l_h = 10^-8 m from d = 0.5 um.
    Evaluating Mirza et al. (2025) caseA_critical_dimensional_eq9_10 at this calibrated friction
    tests fit quality and verifies whether Mirza's active-nematic correction disrupts Hannezo's
    embryonic calibration.
  note: >
    Computes ell_pattern = 0.5528 um (delta = 0.0050) vs measured 0.5 +/- 0.1 um (+0.0528 um,
    1.11x, +0.53 SD; reproduced). The +10.6% offset from 0.500 um stems solely from Hannezo SI
    p. 21's rounding of exact l_h = 8.175 nm to 10^-8 m (under exact-inversion alternative
    gamma = 1.496e18 Pa*s/m^2, Case A gives 0.4998 um, differing from isotropic 0.5000 um by
    only -0.04%).

- id: val_caseA_hannezo_si_cal_vs_larva_early
  model: caseA_critical_dimensional_eq9_10
  inputs:
    gamma: gamma_hannezo_si_cal_added
    D: "hannezo2015/diffusion_coeff_frap"
    k_d: kd_hannezo_frap_added
    eta: eta_hannezo_div4_added
    kappa: kappa_fig4bI
    beta: beta_hannezo_div4_added
    c_0: c0_hannezo_si_cal_added
  output: ell_pattern
  against: "hannezo2015/ring_wavelength_larva_wt_early"
  purpose: validation
  quantities:
    "hannezo2015/diffusion_coefficient": effective_diffusivity
    "hannezo2015/ring_wavelength": pattern_wavelength
  conditions_ok: >
    Evaluates Mirza et al. (2025) Case A Eq. (10) parameterized exclusively on Hannezo et al.
    (2015)'s embryonic stage-15/16 Drosophila trachea (FRAP D, tau plus SI Sec. 2.6.4
    embryo-calibrated l_h = 10 nm -> gamma = 10^18 Pa*s/m^2 at eta = 25 Pa*s; default Mirza
    nematic ratios delta = 0.005) out-of-sample against early third-instar larval wild-type
    tracheal actin ring spacing (1.2 +/- 0.1 um).
  basis: >
    Because gamma_hannezo_si_cal_added (l_h = 10 nm) was calibrated strictly to embryonic
    stage-16 rings (0.5 um), evaluating caseA_critical_dimensional_eq9_10 on early third-instar
    larval rings (1.2 +/- 0.1 um) is a genuine out-of-sample developmental transfer test asking
    whether a single embryonic active-nematic parameter set generalizes across Drosophila
    tracheal growth.
  note: >
    Computes ell_pattern = 0.5528 um vs measured 1.2 +/- 0.1 um (-0.6472 um, 0.46x, -6.47 SDs;
    not reproduced; exact-inversion alternative gamma = 1.496e18 Pa*s/m^2 gives 0.4998 um,
    -7.00 SDs). Because ell_pattern ~ (eta*D/(gamma*k_d))^(1/4), accounting for the 2.4x
    wavelength growth from embryonic stage 16 (0.5 um) to early third-instar larvae (1.2 um)
    within Mirza et al. / Hannezo et al.'s linear theory requires a ~2.4^4 = 33x increase in
    eta*D/(gamma*k_d) (e.g. reduced cortical-ECM friction or slower turnover during larval tube
    expansion).
