    activity_ratio: activity_ratio_default
    L_domain: L_1d_fig4s1_added
  settings:
    N_grid: 128
    dt: 0.02
    t_max: 120.0
    init_mode: 4
    seed: 42
  outputs:
    rho_max: pde1d_b_rho_max
    sigma_par_peak_over_lam: pde1d_b_spar_lam
    sigma_perp_peak_over_lam: pde1d_b_sperp_lam
    sigma_diff_peak_over_lam: pde1d_b_sdiff_lam
  note: "1D steady state for Fig. 4—figure supplement 1b (kappa = -0.5); confirms near-exact contractile-to-extensile crossover sigma_par ≈ sigma_perp."

- id: run_pde_1d_fig4s1_c
  model: active_nematic_pde_1d_eqB1_B4
  inputs:
    k_d: kd_bar_fig2
    L: L_bar_default
    c_0: c0_bar_fig2
    b: b_bar_fig2
