# ==============================================================================
# 4. Nonlinear Continuum PDE Solvers (1D Eqs. B1-B4 & 2D Eqs. 1-8)
# ==============================================================================
- id: run_pde_1d_fig4s1_a
  model: active_nematic_pde_1d_eqB1_B4
  inputs:
    k_d: kd_bar_fig2
    L: L_bar_default
    c_0: c0_bar_fig2
    b: b_bar_fig2
    eta_rot: eta_rot_bar_default
    beta: beta_bar_default
    lambda_o: lambda_o_bar_default
    kappa: kappa_fig4bI
    activity_ratio: activity_ratio_default
    L_domain: L_1d_fig4s1_added
  settings:
    N_grid: 128
    dt: 0.02
    t_max: 120.0
    init_mode: 4
    seed: 42
  outputs:
    rho_max: pde1d_a_rho_max
    rho_min: pde1d_a_rho_min
    S_max: pde1d_a_S_max
    sigma_par_peak_over_lam: pde1d_a_spar_lam
    sigma_perp_peak_over_lam: pde1d_a_sperp_lam
    sigma_diff_peak_over_lam: pde1d_a_sdiff_lam
    sigma_par_peak_over_lamc: pde1d_a_spar_lamc
    sigma_perp_peak_over_lamc: pde1d_a_sperp_lamc
    wavelength_ratio: pde1d_a_wratio
  note: "4-bundle 1D steady state for Fig. 4—figure supplement 1a (kappa = -0.2); confirms contractile bundle tension sigma_par > sigma_perp and matches plotted curves when normalized by lambda = 1.3*lambda_crit."

- id: run_pde_1d_fig4s1_b
  model: active_nematic_pde_1d_eqB1_B4
  inputs:
    k_d: kd_bar_fig2
    L: L_bar_default
