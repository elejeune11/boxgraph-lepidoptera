    sigma_perp_peak_over_lam: pde1d_c_sperp_lam
    sigma_diff_peak_over_lam: pde1d_c_sdiff_lam
  note: "1D steady state for Fig. 4—figure supplement 1c (kappa = -0.8); confirms emergent extensile bundle tension sigma_par < sigma_perp."

- id: run_pde_2d_fig2_fibrillar
  model: active_nematic_pde_2d_eq1_8
  inputs:
    k_d: kd_bar_fig2
