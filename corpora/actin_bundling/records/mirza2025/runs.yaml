    rho_max: pde2d_fibrillar_rho_max
    rho_min: pde2d_fibrillar_rho_min
    S_max: pde2d_fibrillar_S_max
  note: "2D periodic PDE for Fig. 2 fibrillar regime (kappa = -0.2); uses added domain L_mult = 2*ell_pattern (vs paper's 8*ell_pattern) and N_grid = 32 to run in <15 s on CPU (see q_2d_pde_domain_choice)."

