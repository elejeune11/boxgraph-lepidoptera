- id: q_audit_kappa_positivity_bound
  kind: reading
  about:
    - static_active_tensions_eq11
    - kappa_discrete_fit
  text: >
    Main text (p. 5, p. 10) and captions of Fig. 1 (p. 3) and Fig. 2 (p. 7) state that total active tension remains
    positive (contractile) in all directions whenever |kappa| < 1 (and p. 10 writes "total active tension is
    contractile since |kappa| < 1"). Because q_ij = S*(n_i*n_j - delta_ij/2) has eigenvalues +/- S/2 with 0 <= S <= 1,
    Eqs. (7) and (11) (and Fig. 1c) give sigma_par = rho*lambda*(1 + kappa*S/2) and sigma_perp = rho*lambda*(1 - kappa*S/2),
    so total active tension actually remains positive for |kappa| < 2 (or |kappa| < 2/S). This sharper bound is what
    allows the paper's own discrete network estimate kappa ≈ -1.6 (p. 14, Fig. 5e), whose magnitude exceeds 1, to
    correspond to strictly positive contractile tensions sigma_par, sigma_perp > 0 for all S <= 1.
  citation:
