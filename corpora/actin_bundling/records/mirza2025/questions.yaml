- id: q_1d_entropy_inequality_factor
  kind: possible_error
  about:
    - entropy_production_bound_1d_printed
    - entropy_production_bound_1d_corrected
    - cmp_entropy_1d_printed_vs_corrected
  text: >
    Appendix A (p. 22) states that positive dissipation requires 4*eta*eta_rot - beta^2 >= 0 in the reduced
    1D model and 2*eta*eta_rot - beta^2 >= 0 in the 2D model. However, reducing the 2D dissipation potential
    2*eta*(d:d + (tr d)^2) + 2*beta*(d^dev:q_hat) + eta_rot*(q_hat:q_hat) to 1D (d_11 = d_x v, d_22 = 0,
    q_11 = -q_22 = q, so q_hat:q_hat = 2*q_hat^2) produces 4*eta*(d_x v)^2 + 2*beta*(d_x v)*q_hat + 2*eta_rot*q_hat^2,
    whose positivity discriminant is 8*eta*eta_rot - beta^2 >= 0 (matching both the effective 1D viscosity
    4*eta - beta^2/(2*eta_rot) upon eliminating q_hat between Eqs. A4-A5 and A(nu -> oo) = 8*eta_rot - beta^2
    in Eq. C7, p. 24). Omitting the factor of 2 in q_hat:q_hat = 2*q_hat^2 yields the printed 4*eta*eta_rot - beta^2 >= 0.
  citation:
    page: 22
    printed_page: "22 of 33"
    quote: "for the dissipation to be positive, the material parameters need to satisfy an entropy production inequality"
    where: "Appendix A (p. 22)"

