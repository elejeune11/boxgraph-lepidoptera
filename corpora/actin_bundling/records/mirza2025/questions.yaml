  text: >
    Complete bidirectional cross-validation audit between mirza2025 and hannezo2015:
    (1) mirza2025 models against hannezo2015 measurements (11 entries in mirza2025/validations.yaml:
    10 purpose: validation, 1 purpose: fit_quality):
    Mirza et al. (2025) motivates its theory with ~1 um parallel actin bundles in Drosophila
    trachea (Main p. 2, citing Hannezo et al., 2015), proves reduction to Hannezo et al. in the
    isotropic limit (Main p. 6, Appendix C.1), and cites Hannezo et al. for all four dimensional
    transport parameters in Appendix D (p. 27), yet never evaluates its own dimensional wavelength
    ell_pattern in microns. Cross-validating isotropic_threshold_dimensional_eq9 and
    caseA_critical_dimensional_eq9_10 against Hannezo et al.'s wild-type Drosophila tracheal
    measurements reveals four quantitative findings:
    (a) Mirza et al.'s own Appendix D reference parameters (eta = 10^4 Pa*s, ell_s = 0.2 um ->
    gamma = 2.5e17 Pa*s/m^2, k_d = 0.1 s^-1, D = 0.04 um^2/s, kappa = -0.2, beta = -2000 Pa*s,
    c_0 = 40000 Pa) predict ell_pattern = 3.160 um (isotropic) and 3.158 um (Case A) — 6.32x
    larger (+26.6 SD) than embryonic stage-16 WT (0.5 +/- 0.1 um) and 2.63x larger (+19.6 SD)
    than early 3rd-instar larval WT (1.2 +/- 0.1 um); supercritical nonlinear shortening (0.87x,
    Fig. 2—figure supplement 1) still yields 2.75 um (5.50x embryo, 2.29x early larva).
    (b) On Hannezo Main p. 3's physiological inputs (FRAP D = 0.04 um^2/s, k_d = 1/15 s^-1,
    gamma = xi_2D/h = 10^16 Pa*s/m^2) with 1D longitudinal viscosity matched (eta_mirza =
    eta_hannezo/4 = 25 Pa*s per rel_hannezo2015_iso_wavelength_same_as_eq3), mirza2025 reproduces
    Hannezo's uncalibrated 1.749 um (isotropic) / 1.748 um (Case A, delta = 0.005): still 3.50x
    too large (+12.5 SD) on embryonic WT and 1.46x (+5.48 SD) on early larval WT, while falling
    just inside 1 SD (+0.99 SD) of late 3rd-instar larval taenidial spacing (1.45 +/- 0.3 um,
    assuming stage-15 FRAP parameters transfer to late larvae).
    (c) Supplying Hannezo's literal 3D shear viscosity (hannezo2015/viscosity_3d_lit = 100 Pa*s)
    directly into Mirza Eq. (6)'s 2D compressible viscous stress (4*eta*d_x v in 1D) amplifies
    wavelength by 4^(1/4) = sqrt(2) to 2.473 um (4.95x embryo WT, 2.06x early larva WT, 1.71x /
    +3.41 SD late larva WT).
    (d) Active-nematic coupling in Case A Eq. (10) cannot bridge the embryonic gap: delta = 0.005
    (Appendix D default) shifts ell_pattern by only -0.04%, CytoSim kappa = -1.6 (delta = 0.040)
    by -0.31%, Fig. 3b entropy-bound flow alignment (beta/eta = -sqrt(2), kappa = -0.75, delta =
    0.133) by -1.0%, and even extreme combined Fig. 3b/3c coupling (delta = 0.663) by only -4.9%
    (1.663 um). Calibrating gamma = 10^18 Pa*s/m^2 to Hannezo SI Sec. 2.6.4's l_h = 10 nm
    preserves the embryonic fit (0.553 um vs 0.5 +/- 0.1 um, purpose: fit_quality, +0.53 SD) but
    fails out-of-sample on early larvae (0.553 vs 1.2 +/- 0.1 um, -53.9%, -6.47 SD), implying a
    ~33x developmental increase in eta*D/(gamma*k_d) between stage 16 and third-instar larvae.
    (2) Excluded hannezo2015 measurements (24 of 35 origin: measured datums not validated):
    - Genetically perturbed ring spacings (`ring_wavelength_src42` = 0.8 +/- 0.2 um,
      `taenidial_wavelength_moesin_rnai` = 1.8 +/- 0.5 um, `ring_wavelength_kkv1` = 4.5 +/- 2 um):
      Hannezo et al. never measure or report mutant cortical friction xi, viscosity eta, D, or tau
      for Src42A, moesin RNAi, or kkv1, so active-gel theory provides only a qualitative trend
      (decreasing friction increases wavelength via gamma^(-1/4)), not condition-specific numbers.
    - Duplicate/bar-chart wavelength datums (`ring_wavelength_si_input` = 5e-7 m duplicating
      `ring_wavelength_embryo_wt`; `ring_wavelength_larva_wt_fig1c` = 1.2 um duplicating
      `ring_wavelength_larva_wt_early`; categorical bar charts `fig3b_bar_ring_spacing_data` and
      `figs2d_moesin_rnai_spacing_data` indexed by `condition_index` rather than a physical input).
    - Ring counts (`rings_per_cell_embryo_wt` = 15-20, `rings_per_cell_kkv1` ~ 1): mirza2025 has
      no model computing ring count from dimensional cell length L_cell (domain_pattern_repeats
      takes dimensionless L/ell_pattern and wavelength_ratio only).
    - FRAP inputs/traces (`diffusion_coeff_frap`, `turnover_time_frap`, `immobile_fraction_frap`,
      `frap_sample_size`, `fig2a_frap_recovery_data`, `fig2a_frap_variance_data`), fluorescence
      intensity ramps (`actin_increase_onset_*`, `fig1a_actin_intensity_data`, `ring_onset_time_range`,
      `fluorescence_*_si`, `ramp_duration_si`), FFT/PDF curves (`fig1c_fourier_spectrum_data`,
      `fig3b_dist_*`), and tubular radial/secretion assays (`fig3c_kkv_diameter_vs_actin_data`,
      `fig4f_cop_actin_vs_diameter_data`, `cop_*`, `side_branch_diameter_ratio`): none of these
      quantities is predicted by any mirza2025 model.
    (3) Reverse direction (hannezo2015 models against mirza2025 measurements): 0 validations
    because mirza2025 is a purely theoretical and computational study containing 0 origin: measured
    empirical datums (all 29 run and 2 fitted datums are continuum FEM or discrete CytoSim outputs).
