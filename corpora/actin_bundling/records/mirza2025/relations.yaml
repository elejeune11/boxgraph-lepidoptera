# ==============================================================================
# Cross-record relations with frohoff2021 (Frohoff-Hulsmann, Wrembel & Thiele, PRE 103:042602, 2021)
# ==============================================================================
# Note: Neither paper cites the other. Their 2-field linear stability dispersions
# (mirza2025/dispersion_1d_eqC7 vs frohoff2021/linear_dispersion_general_eq12) belong to
# distinct PDE classes: frohoff2021 couples two conserved Cahn-Hilliard fields (overall q^2
# conservation factor, -q^4 short-wave damping, no hydrodynamic flow or turnover), whereas
# mirza2025 couples a non-conserved turnover density with nonlocal Stokes flow 1/(1 + 4*nu^2)
# and a non-conserved nematic order parameter (-nu^2 damping). However, their spatially
# uniform quartic Landau bulk free-energy densities share the exact same mathematical form.

- id: rel_frohoff2021_landau_bulk_free_energy_reduces_to
  kind: reduces_to
  a: mirza2025/landau_free_energy_eq3
  b: frohoff2021/bulk_free_energy_eq3_A1
  mapping:
    a1: "a"
    b1: "b / 2"
    phi: "S"
  output_map:
    f: f
  limit:
    grad_q: "0"
  regime:
    a: [0.5, 5.0]
    b: [1.0, 20.0]
    L: [0.1, 5.0]
    S: [0.1, 1.0]
    grad_q: [0.01, 1.0]
  provenance: proposed
  reason: >
    In the spatially uniform limit (grad_q -> 0), mirza2025 Eq. (3)'s Landau nematic free-energy
    density f = (1/2)*a*S^2 + (1/8)*b*S^4 [Pa = J/m^3] reduces identically to frohoff2021
    Eq. (3)/(A5)'s quartic Landau double-well bulk free-energy density f = (a1/2)*phi^2 +
    (b1/4)*phi^4 [J/m^3] under a1 = a, b1 = b/2, and phi = S.
  assumptions:
    - "Spatially uniform limit (grad_q -> 0) and exact SI unit identity 1 Pa = 1 J/m^3."
    - "Scalar order parameter correspondence phi <-> S (scalar concentration field in frohoff2021 vs 2D nematic order magnitude S in mirza2025)."

# ==============================================================================
# Cross-record relations with gubbala2025 (Gubbala et al., Soft Matter 21:6242-6252, 2025)
# ==============================================================================
# Note: Neither paper cites the other. Their PDE dynamics differ fundamentally (passive
# Model C conserved Cahn-Hilliard + LdG nematic without hydrodynamic flow or turnover in
# gubbala2025 vs active compressible nematohydrodynamics with Stokes flow, flow-alignment,
# and turnover in mirza2025), but both share the exact same 2D traceless symmetric Q-tensor
# definition Q_ij = S*(n_i n_j - delta_ij/2) and quartic Landau-de Gennes bulk free energy.

- id: rel_gubbala2025_ldg_bulk_eq10_scales_as_eq3
  kind: scales_as
  a: mirza2025/landau_free_energy_eq3
  b: gubbala2025/ldg_bulk_free_energy_eq10_consistent
  mapping:
    beta: "2 * b"
    phi: "-2 * a - 1"
    Q_xx: "S / 2"
    Q_xy: "0"
  output_map:
    f_bulk: f
  regime:
    a: [0.5, 5.0]
    b: [1.0, 20.0]
    L: [0.0, 0.0]
    S: [0.1, 1.0]
    grad_q: [0.0, 0.0]
  provenance: proposed
  reason: >
    Both mirza2025 (Eq. 3) and gubbala2025 (Eq. 3, Eq. 10 / SI Eq. S20) use the 2D traceless
    symmetric nematic tensor Q_ij = S*(n_i n_j - delta_ij/2) with Tr(Q^2) = S^2/2. In the
    spatially uniform limit (grad_q = 0), mirza2025's (a/2)*S^2 + (b/8)*S^4 [Pa] has the exact
    same functional form as gubbala2025's Eq. (10)-consistent dimensionless bulk free energy
    -((1+phi)/2)*Tr(Q^2) + (beta/4)*(Tr Q^2)^2 under 1 + phi = -2*a and beta = 2*b.
  assumptions:
    - "Spatially uniform limit (grad_q = 0, L = 0) with director aligned along x (Q_xx = S/2, Q_xy = 0)."

- id: rel_gubbala2025_ldg_bulk_eq4_printed_scales_as_eq3
  kind: scales_as
  a: mirza2025/landau_free_energy_eq3
  b: gubbala2025/ldg_bulk_free_energy_eq4
  mapping:
    beta: "4 * b"
    phi: "-2 * a - 1"
    Q_xx: "S / 2"
    Q_xy: "0"
  output_map:
    f_bulk: f
  regime:
    a: [0.5, 5.0]
    b: [1.0, 20.0]
    L: [0.0, 0.0]
    S: [0.1, 1.0]
    grad_q: [0.0, 0.0]
  provenance: proposed
  reason: >
    Against gubbala2025's literally printed Eq. (4) using Tr(Q^4) = (1/2)*(Tr Q^2)^2 in 2D,
    matching mirza2025 Eq. (3)'s uniform bulk free energy requires beta = 4*b (twice the
    beta = 2*b mapping of Eq. 10-consistent ldg_bulk_free_energy_eq10_consistent), directly
    reflecting the 2D factor-of-2 discrepancy between Tr(Q^4) and (Tr Q^2)^2.
  assumptions:
    - "Spatially uniform limit (grad_q = 0, L = 0) with Q_xx = S/2, Q_xy = 0."

- id: rel_gubbala2025_nematic_saturation_same_as_q0
  kind: same_as
  a: mirza2025/equilibrium_nematic_order
  b: gubbala2025/nematic_saturation_eq4_s5
  mapping:
    beta: "2 * b_bar"
    phi: "-c_bar_0 - 1"
  output_map:
    S: q_0_pos
  regime:
    c_bar_0: [-10.0, -0.5]
    b_bar: [1.0, 40.0]
  provenance: proposed
  reason: >
    Under the exact same bulk free-energy parameter mapping (1 + phi = -c_bar_0, beta = 2*b_bar)
    that equates mirza2025's effective Landau potential (c_bar_0/4)*S^2 + (b_bar/8)*S^4 to
    gubbala2025's Eq. (10)-consistent potential -((1+phi)/4)*S^2 + (beta/16)*S^4, gubbala2025's
    printed saturation formula S = sqrt((1+phi)/(2*beta)) matches mirza2025's tensor eigenvalue
    q_0_pos = S_0/2 = sqrt(-c_bar_0/(4*b_bar)) rather than S_0 = sqrt(-c_bar_0/b_bar),
    confirming that gubbala2025's SI Sec. 3.3 uses Q_xx = S instead of Eq. (3)'s Q_xx = S/2.
  assumptions:
    - "Ordered nematic phase (c_bar_0 = 2*a_bar - lambda_bar_o < 0, corresponding to 1 + phi > 0)."

- id: rel_gubbala2025_diffusive_timescale_same_as
  kind: same_as
  a: mirza2025/diffusion_timescale
  b: gubbala2025/nondim_parameters_s32
  mapping:
    M: "D"
    Gamma: "1"
    lambda_tilde: "ell_s**2"
    alpha: "1"
    L1: "1"
    L3: "1"
  output_map:
    t_phi: t_0
  regime:
    ell_s: [0.05, 2.0]
    D: [0.005, 0.5]
  provenance: proposed
  reason: >
    Both papers define the characteristic diffusive timescale as (length)^2 / diffusivity:
    mirza2025's t_0 = ell_s^2/D matches gubbala2025 SI Sec. 3.2's t_phi = l_c^2/M = lambda_tilde/M
    under lambda_tilde = ell_s^2 and M = D.

# ==============================================================================
# Cross-record audit with weirich2017 & weirich2019 (0 model relations)
# ==============================================================================
# mirza2025 cites weirich2017 (ref-weirich2017) and weirich2019 (ref-weirich2019) only once,
# qualitatively on p. 8 ("elongated high-density and high-order domains fragment into nematic
# droplets or tactoids (Weirich et al., 2017; Weirich et al., 2019; Figure 2bII)").
# All models in weirich2017 (3D passive homogeneous tactoid interfacial free energy, circular-arc
# geometry, capillary coalescence ODE, Stokes-Einstein ellipsoid diffusion) and weirich2019
# (bipolar 3D tactoid director field, Onsager myosin-rod centering potential, Stokes rod drag,
# adhesive colloid capillary droplet division) are physically and mathematically disjoint from
# mirza2025's 2D compressible active nematohydrodynamics PDEs and CytoSim discrete-network
# equations; therefore 0 model relations are added for either pair (see
# `q_weirich2017_2019_tactoid_analogy` in mirza2025/questions.yaml).

