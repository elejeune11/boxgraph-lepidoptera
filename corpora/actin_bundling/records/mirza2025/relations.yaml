- id: rel_code_linear_stability_reduces_to_marginal_eqC8_lam
  kind: reduces_to
  a: mirza2025_code/code_linear_stability
  b: mirza2025/marginal_stability_eqC8
  mapping:
    k_d: "visc"
    L: "frank / 2"
    c_0: "2 * sus20 + lambda_rot * heqb"
    b: "20"
    beta: "cvisc"
    lambda_o: "-lambda_rot"
    kappa: "(lambda_aniso - crossLinker) / lambda_iso"
    q_0: "0"
  output_map:
    lambda_crit: lambda_crit
  limit:
    k_lim: "0"
  regime:
    visc: [0.02, 0.5]
    cvisc: [-0.4, -0.05]
    rvisc: [0.5, 2.0]
    frank: [0.5, 4.0]
    sus20: [4.0, 8.0]
    lambda_rot: [-6.0, -2.0]
    lambda_iso: [3.0, 5.0]
    lambda_aniso: [2.5, 3.5]
    crossLinker: [2.5, 3.5]
    heqb: [0.8, 1.2]
    k_lim: [1.0e-4, 1.0e-2]
    S2_max: [0.99, 0.999]
    r_out: [100.0, 150.0]
  provenance: proposed
  reason: >
    Linearizing the exact C++ FEM equations in mirza2025_code (AuxCortexNematic2D.cpp:420,
    514-565, 1070-1140) around the isotropic uniform state (q_0 = 0) yields effective
    parameters k_bar_d = visc, L_bar = frank/2, c_bar_0 = 2*sus20 + lambda_rot*heqb + 4*k_lim/S2_max,
    and kappa = (lambda_aniso - crossLinker)/lambda_iso. Removing the code's undocumented
    logarithmic realizability barrier (k_lim -> 0) recovers mirza2025 Eq. (C8)-(C10)'s exact
    critical activity lambda_crit identically.
  assumptions:
    - "Isotropic uniform base state (q_0 = 0, c_bar_0 = 2*sus20 + lambda_rot*heqb > 0)."
    - "Effective Frank constant L_bar = frank/2 from AuxCortexNematic2D.cpp:420 (DqDq = 0.5*(|grad q1|^2 + |grad q2|^2))."
    - "Vanishing undocumented logarithmic barrier stiffness k_lim -> 0."

