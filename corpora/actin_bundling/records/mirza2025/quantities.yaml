# Continuum active nematic gel quantities (dimensional)
- id: cortical_viscosity
  name: cortical gel viscosity
  dimension: "[mass]/([length]*[time])"
  description: "Continuum active gel shear/bulk viscosity parameter eta (3D viscosity, Pa*s)."

- id: rotational_viscosity
  name: continuum nematic rotational viscosity
  dimension: "[mass]/([length]*[time])"
  description: "Continuum nematic viscous coefficient eta_rot conjugate to the Jaumann derivative q_hat (Pa*s)."

- id: flow_alignment_viscosity
  name: flow-alignment coupling viscosity
  dimension: "[mass]/([length]*[time])"
  description: "Onsager-reciprocal coupling coefficient beta (< 0) between deviatoric rate-of-deformation and nematic dynamics (Pa*s)."

- id: cortical_friction
  name: hydrodynamic friction coefficient
  dimension: "[mass]/([length]**3*[time])"
  description: "Viscous drag coefficient gamma (> 0) with surroundings per unit effective cortex thickness (Pa*s/m^2)."

- id: effective_diffusivity
  name: effective cytoskeletal diffusivity
  dimension: "[length]**2/[time]"
  description: "Effective diffusivity D in cytoskeletal mass balance Eq. (1)."

- id: depolymerization_rate
  name: cytoskeletal turnover (depolymerization) rate
  dimension: "1/[time]"
  description: "First-order actin turnover / depolymerization rate k_d in mass balance Eq. (1)."

- id: hydrodynamic_length
  name: hydrodynamic screening length
  dimension: "[length]"
  description: "Hydrodynamic length ell_s = sqrt(eta / gamma), above which friction dominates over viscosity."

- id: damkohler_length
  name: Damkohler length
  dimension: "[length]"
  description: "Reaction-diffusion length ell_D = sqrt(D / k_d), above which turnover dominates over diffusion."

- id: nematic_length
  name: nematic correlation length
  dimension: "[length]"
  description: "Characteristic nematic lengthscale ell_q = sqrt(L / |2*a - lambda_o * rho_0|)."

- id: pattern_wavelength
  name: linear pattern lengthscale
  dimension: "[length]"
  description: "Dimensional pattern wavelength ell_pattern = 2*pi / nu_crit predicted by linear stability analysis."

- id: bundle_spacing
  name: biological actin bundle spacing
  dimension: "[length]"
  description: "Observed parallel spacing between actin bundles in vivo (e.g. butterfly wing scales, Drosophila trachea)."

- id: diffusion_timescale
  name: hydrodynamic diffusion timescale
  dimension: "[time]"
  description: "Characteristic timescale t_0 = ell_s^2 / D = eta / (gamma * D) used for nondimensionalization in Appendix B."

- id: nematic_relaxation_time
  name: nematic relaxation timescale
  dimension: "[time]"
  description: "Characteristic nematic relaxation time t_q = (ell_q^2 * eta_rot) / L = eta_rot / |2*a - lambda_o * rho|."

- id: nematic_susceptibility_a
  name: quadratic nematic susceptibility
  dimension: "[mass]/([length]*[time]**2)"
  description: "Quadratic Landau free-energy susceptibility parameter a (> 0 favors isotropic equilibrium)."

- id: nematic_susceptibility_b
  name: quartic nematic susceptibility
  dimension: "[mass]/([length]*[time]**2)"
  description: "Quartic Landau free-energy susceptibility parameter b (> 0)."

- id: effective_susceptibility_c0
  name: effective linear nematic susceptibility
  dimension: "[mass]/([length]*[time]**2)"
  description: "Effective susceptibility c_0 = 2*a - rho_0*lambda_o governing uniform isotropic vs ordered steady state."

- id: nematic_susceptibility_rate_a
  name: quadratic susceptibility-to-rotational-viscosity ratio
  dimension: "1/[time]"
  description: "Ratio a / eta_rot setting nematic relaxation rate (Appendix D)."

- id: nematic_susceptibility_rate_b
  name: quartic susceptibility-to-rotational-viscosity ratio
  dimension: "1/[time]"
  description: "Ratio b / eta_rot (Appendix D)."

- id: frank_elastic_constant
  name: Frank elastic constant
  dimension: "[mass]*[length]/[time]**2"
  description: "One-constant nematic Frank elasticity parameter L (> 0, Pa*m^2 = N)."

- id: active_tension_parameter
  name: isotropic active tension parameter
  dimension: "[mass]/([length]*[time]**2)"
  description: "Master contractile activity parameter lambda (> 0) in sigma^act_ij = rho*lambda*(delta_ij + kappa*q_ij)."

- id: nematic_activity_stress
  name: active orientational forcing density
  dimension: "[mass]/([length]*[time]**2)"
  description: "Product rho_0 * lambda_o representing the density-weighted active generalized force favoring nematic alignment."

- id: critical_wavenumber
  name: dimensional critical wavenumber
  dimension: "1/[length]"
  description: "Dimensional onset wavenumber nu_crit from linear stability analysis."

- id: critical_wavenumber_squared
  name: dimensional critical wavenumber squared
  dimension: "1/[length]**2"
  description: "Square of dimensional onset wavenumber nu_crit^2 (Eq. 10)."

- id: case_b_delta_misprinted
  name: misprinted dimensional Case B nematic coupling parameter
  dimension: "1/[length]**2"
  description: "Dimensional expression delta = gamma*D*kappa*beta/(2*eta*L) as printed on p. 7 (dimensionally 1/[length]^2 rather than dimensionless)."

- id: entropy_production_margin
  name: viscosity-coupling entropy production discriminant
  dimension: "[mass]**2/([length]**2*[time]**2)"
  description: "Dissipation positivity discriminant (2*eta*eta_rot - beta^2 in 2D; 4*eta*eta_rot - beta^2 printed or 8*eta*eta_rot - beta^2 corrected in 1D)."

- id: free_energy_density
  name: Landau nematic free-energy density
  dimension: "[mass]/([length]*[time]**2)"
  description: "Landau-de Gennes free-energy density f(q, grad q) in Eq. (3)."

- id: nematic_gradient_norm
  name: nematic tensor gradient norm
  dimension: "1/[length]"
  description: "Frobenius norm |grad q| entering the Frank gradient energy (1/2)*L*|grad q|^2 in Eq. (3)."

# Dimensionless continuum groups and observables
- id: turnover_rate_dimless
  name: dimensionless turnover rate
  dimension: dimensionless
  description: "Nondimensional turnover rate k_bar_d = ell_s^2 / ell_D^2 = k_d * t_0."

- id: frank_constant_dimless
  name: dimensionless Frank elastic constant
  dimension: dimensionless
  description: "Nondimensional Frank constant L_bar = L / (eta * D) = L / (gamma * D * ell_s^2)."

- id: susceptibility_a_dimless
  name: dimensionless quadratic susceptibility
  dimension: dimensionless
  description: "Nondimensional susceptibility a_bar = a / (gamma * D)."

- id: susceptibility_b_dimless
  name: dimensionless quartic susceptibility
  dimension: dimensionless
  description: "Nondimensional susceptibility b_bar = b / (gamma * D)."

- id: effective_susceptibility_c0_dimless
  name: dimensionless effective linear susceptibility
  dimension: dimensionless
  description: "Nondimensional effective susceptibility c_bar_0 = 2*a_bar - lambda_bar_o."

- id: rotational_viscosity_dimless
  name: dimensionless rotational viscosity
  dimension: dimensionless
  description: "Nondimensional nematic viscosity eta_bar_rot = eta_rot / eta."

- id: flow_alignment_dimless
  name: dimensionless flow-alignment coupling
  dimension: dimensionless
  description: "Nondimensional flow-alignment coefficient beta_bar = beta / eta."

- id: nematic_activity_dimless
  name: dimensionless nematic activity coefficient
  dimension: dimensionless
  description: "Nondimensional orientational activity lambda_bar_o = rho_0 * lambda_o / (gamma * D)."

- id: active_tension_dimless
  name: dimensionless active tension parameter
  dimension: dimensionless
  description: "Nondimensional isotropic active tension lambda_bar = lambda / (gamma * D)."

- id: active_tension_anisotropy
  name: active tension anisotropy parameter
  dimension: dimensionless
  description: "Ratio kappa = lambda_aniso / lambda controlling deviatoric active tension (kappa < 0 extensile deviatoric, kappa > 0 contractile deviatoric)."

- id: activity_supercritical_ratio
  name: supercritical activity ratio
  dimension: dimensionless
  description: "Ratio lambda / lambda_crit of applied activity to linear stability threshold."

- id: domain_size_in_wavelengths
  name: computational domain size in pattern wavelengths
  dimension: dimensionless
  description: "Ratio Domain Size * nu_crit / (2*pi) = L_domain / ell_pattern."

- id: friction_scale_factor
  name: friction rescaling factor
  dimension: dimensionless
  description: "Multiplicative factor gamma_new / gamma_ref applied to friction gamma."

- id: turnover_scale_factor
  name: dimensionless turnover rescaling factor
  dimension: dimensionless
  description: "Multiplicative factor k_bar_d_new / k_bar_d_ref applied to k_bar_d."

- id: nematic_order_parameter
  name: scalar nematic order parameter
  dimension: dimensionless
  description: "Degree of local alignment S = sqrt(2 * q_ij * q_ij) in [0, 1] (S_0 equilibrium/initial, S(t) dynamic)."

- id: nematic_order_change
  name: change in scalar nematic order parameter
  dimension: dimensionless
  description: "Increase in scalar nematic order S(t) - S_0 relative to initial imposed order S_0 during active discrete network evolution (Fig. 5f)."

- id: nematic_tensor_1d
  name: 1D nematic order tensor component
  dimension: dimensionless
  description: "Independent component q = q_11 = -q_22 of the 2D traceless symmetric nematic tensor in 1D (|q| = S/2; q > 0 parallel to x, q < 0 perpendicular to x)."

- id: wavenumber_dimless
  name: dimensionless perturbation wavenumber
  dimension: dimensionless
  description: "Dimensionless Fourier wavenumber nu_bar = nu * ell_s (Appendix C)."

- id: wavenumber_squared_dimless
  name: dimensionless perturbation wavenumber squared
  dimension: dimensionless
  description: "Square of dimensionless wavenumber x = nu_bar^2 (Appendix C)."

- id: growth_rate_dimless
  name: dimensionless linear perturbation growth rate
  dimension: dimensionless
  description: "Dimensionless growth rate alpha_bar = alpha * t_0 from dispersion relation Eq. (C7)."

- id: pattern_wavelength_dimless
  name: dimensionless pattern wavelength
  dimension: dimensionless
  description: "Dimensionless wavelength ell_bar_pattern = 2*pi / nu_bar_crit."

- id: wavelength_ratio
  name: nonlinear-to-linear pattern lengthscale ratio
  dimension: dimensionless
  description: "Ratio ell_pattern^sim / ell_pattern (or ell_max / ell_pattern) comparing supercritical pattern spacing to marginal linear onset spacing."

- id: pattern_repeat_count
  name: pattern repeat count across domain
  dimension: dimensionless
  description: "Number of periodic pattern repeats spanning one side of the computational domain (domain size divided by pattern wavelength)."

- id: nematic_coupling_delta
  name: dimensionless nematic perturbation coupling
  dimension: dimensionless
  description: "Perturbation expansion parameter delta in Case A (Eq. C12), Case B (Eq. C17), and Case C (Eq. C22)."

- id: nematic_prealignment_tau
  name: dimensionless pre-alignment shift parameter
  dimension: dimensionless
  description: "Parameter tau = kappa * (lambda_o / (8*b*q_0) + q_0) in Case C (Eq. C22)."

- id: architecture_order_parameter
  name: pattern architecture order parameter
  dimension: dimensionless
  description: "2D pattern architecture order parameter omega = (ell_s^2 / (rho_0^2 * |A|)) * integral(grad rho . q . grad rho dS); omega < 0 fibrillar, omega > 0 banded (Fig. 2a-b)."

- id: relative_density
  name: relative cytoskeletal density
  dimension: dimensionless
  description: "Normalized density rho_bar = rho / rho_0."

- id: normalized_tension
  name: normalized active or total tension
  dimension: dimensionless
  description: "Dimensionless tension normalized by lambda_crit, lambda, or mean tension sigma_bar."

- id: tension_anisotropy_ratio
  name: deviatoric-to-mean tension ratio
  dimension: dimensionless
  description: "Ratio xi = (sigma_par - sigma_perp) / sigma_bar = 2*(sigma_par - sigma_perp)/(sigma_par + sigma_perp) (Eqs. 11 and E12)."

- id: normalized_tension_difference
  name: normalized parallel-minus-perpendicular stress difference
  dimension: dimensionless
  description: "Dimensionless stress anisotropy (sigma_par - sigma_perp) / sigma_crit or (sigma_par - sigma_perp) / lambda."

- id: threshold_relative_error
  name: relative error of linear instability threshold
  dimension: dimensionless
  description: "Fractional difference |lambda_crit^sim - lambda_crit^lin| / lambda_crit^lin between nonlinear simulation onset and linear stability prediction."

- id: position_dimless
  name: dimensionless spatial coordinate
  dimension: dimensionless
  description: "Dimensionless position x_bar = x / ell_s."

- id: time_dimless
  name: dimensionless time
  dimension: dimensionless
  description: "Dimensionless time t_bar = t / t_0 (continuum) or t / tau_A (discrete network normalized by actin turnover time)."

- id: entropy_production_margin_dimless
  name: dimensionless entropy production discriminant
  dimension: dimensionless
  description: "Dimensionless dissipation positivity margin (2*eta_bar_rot - beta_bar^2 in 2D; 4*eta_bar_rot - beta_bar^2 or 8*eta_bar_rot - beta_bar^2 in 1D)."

- id: normalized_mean_tension_slope
  name: normalized mean tension vs density slope
  dimension: dimensionless
  description: "Slope of (sigma_bar / sigma_bar_1) vs (rho / rho_1) predicted to equal 1 by Eq. (11) (Fig. 5d)."

# Discrete network (CytoSim) quantities
- id: boltzmann_constant
  name: Boltzmann constant
  dimension: "[energy]/[temperature]"
  description: "Boltzmann constant k = 1.38 x 10^-5 pN*um/K (Appendix E.1)."

- id: thermal_energy
  name: thermal energy kT
  dimension: "[energy]"
  description: "Thermal energy scale kT (0 athermal or 0.0042 pN*um at room temperature, Appendix E)."

- id: temperature
  name: absolute temperature
  dimension: "[temperature]"
  description: "Absolute temperature T = kT / k in discrete network simulations."

- id: medium_viscosity
  name: suspending medium viscosity
  dimension: "[mass]/([length]*[time])"
  description: "Solvent viscosity nu in CytoSim Langevin dynamics (Appendix 5-table 1)."

- id: rve_size
  name: representative volume element dimension
  dimension: "[length]"
  description: "Spatial size (edge length ell, L, radius R, or thickness t) of the discrete network simulation box."

- id: simulation_timestep
  name: discrete simulation time step
  dimension: "[time]"
  description: "Time step dt in CytoSim discrete network simulations."

- id: output_frequency
  name: data acquisition frequency
  dimension: "1/[time]"
  description: "Output sampling rate (40 s^-1, i.e., 1 every 5 time steps) in Appendix E.2."

- id: output_stride
  name: output step stride
  dimension: dimensionless
  description: "Number of simulation time steps per output frame (5 in Appendix E.2)."

- id: simulation_duration
  name: simulation stage duration
  dimension: "[time]"
  description: "Duration or timestamp of equilibration, clamping, or measurement windows in CytoSim protocols."

- id: filament_length
  name: actin filament length
  dimension: "[length]"
  description: "Individual actin filament length ell_A in CytoSim simulations (Appendix 5-table 2)."

- id: filament_segment_length
  name: filament discretization segment length
  dimension: "[length]"
  description: "Constant segment length s_A between adjacent filament model points (Appendix 5-table 2)."

- id: filament_surface_density
  name: actin filament surface density
  dimension: "1/[length]"
  description: "Total actin filament length per unit area rho_A in (actin um)/um^2 = 1/um (Appendix E.2, Appendix 5-table 2)."

- id: filament_bending_rigidity
  name: actin filament bending rigidity
  dimension: "[force]*[length]**2"
  description: "Flexural rigidity kappa_A of semiflexible actin filaments (pN*um^2, Appendix 5-table 2)."

- id: actin_turnover_rate
  name: discrete actin filament turnover rate
  dimension: "1/[time]"
  description: "Fraction of actin filaments replaced per unit time r_A (20 %/s = 0.2 s^-1, Appendix 5-table 2)."

- id: actin_turnover_time
  name: discrete actin filament turnover time
  dimension: "[time]"
  description: "Characteristic actin turnover timescale tau_A = 1 / r_A (= 5 s) used to normalize time in Fig. 5c,f,g."

- id: filament_count
  name: number of actin filaments
  dimension: dimensionless
  description: "Total count N_A of actin filaments in the representative volume element."

- id: realization_count
  name: stochastic realization or condition count
  dimension: dimensionless
  description: "Number of independent stochastic simulation realizations n (16) or parameter sets (12, 4)."

- id: crosslinker_linear_density
  name: crosslinker density per unit actin length
  dimension: "1/[length]"
  description: "Number of crosslinkers per micrometer of actin filament rho_X (Appendix 5-table 4)."

- id: motor_linear_density
  name: myosin motor density per unit actin length
  dimension: "1/[length]"
  description: "Number of myosin motors per micrometer of actin filament rho_M (Appendix 5-table 3)."

- id: spring_stiffness
  name: Hookean spring or anchor stiffness
  dimension: "[force]/[length]"
  description: "Linear spring constant K_X, K_M, K_H (and as-printed unit of K_S = 5000 pN/um on p. 30)."

- id: restraining_energy_stiffness
  name: nematic restraining energy stiffness
  dimension: "[energy]"
  description: "Dimensionally consistent energy-scale coefficient K_S in E_S = (K_S/2)|q^s - q^0|^2 (Eq. E2) and Eq. (12)."

- id: spring_rest_length
  name: spring resting length
  dimension: "[length]"
  description: "Equilibrium resting length ell_X, ell_M of crosslinker or myosin motor Hookean springs."

- id: spring_elongation
  name: spring end-to-end distance
  dimension: "[length]"
  description: "Current end-to-end distance u_X or u_M of a bound crosslinker or motor spring (Eq. E8)."

- id: binding_range
  name: spring binding range
  dimension: "[length]"
  description: "Maximum capture distance d_X^b, d_M^b, d_H^b for crosslinker, motor, or anchor attachment."

- id: binding_rate
  name: stochastic binding rate
  dimension: "1/[time]"
  description: "Exponential binding rate r_X^b, r_M^b, r_H^b for crosslinkers, motors, or anchors."

- id: unbinding_rate
  name: force-dependent or base unbinding rate
  dimension: "1/[time]"
  description: "Base (r^{u,0}) or Bell-law loaded (r^u) detachment rate for crosslinkers, motors, or anchors (Eq. E9)."

- id: force
  name: microscopic molecular force
  dimension: "[force]"
  description: "Force magnitude or component f_X, f_M, f, characteristic unbinding force f^u, or motor stall force f_M^stall (pN)."

- id: motor_speed
  name: myosin motor walking speed
  dimension: "[length]/[time]"
  description: "Unloaded (v_M^max) or load-dependent (v_M) motor velocity along an actin filament (Eq. E10)."

- id: network_tension_2d
  name: discrete network 2D active tension
  dimension: "[force]/[length]"
  description: "Boundary-measured 2D tension components sigma_par, sigma_perp, and mean tension sigma_bar = (sigma_par + sigma_perp)/2 (pN/um, Eqs. 11 and E11)."

- id: discrete_rotational_drag
  name: discrete network nematic rotational drag
  dimension: "[energy]*[time]"
  description: "Effective rotational viscosity parameter eta_rot (~ 1583 pN*um*s) in discrete relaxation Eq. (12)."

- id: discrete_nematic_rate
  name: rate of change of nematic order
  dimension: "1/[time]"
  description: "Time derivative S_dot = dS/dt of average nematic order in unconstrained periodic discrete simulations (Eq. 12, Fig. 5g)."

- id: discrete_nematic_rate_dimless
  name: turnover-normalized rate of change of nematic order
  dimension: dimensionless
  description: "Dimensionless ordering rate S_dot / r_A = tau_A * dS/dt plotted in Fig. 5g."

- id: discrete_nematic_energy
  name: nematic restraining energy
  dimension: "[energy]"
  description: "System-wide nematic penalty potential E_S(X) in Eq. (E2)."

- id: discrete_active_tension_coeff
  name: discrete active tension per filament density
  dimension: "[force]"
  description: "Proportionality coefficient lambda = sigma_bar / rho_A (pN) in Eq. (11) for discrete network tensions."

- id: relaxation_timescale_mismatch_ratio
  name: misprinted-unit relaxation rate
  dimension: "1/([length]**2*[time])"
  description: "Ratio K_S / eta_rot when using printed K_S [pN/um] and printed eta_rot [pN*um*s], exposing the 1/um^2 unit contradiction."
