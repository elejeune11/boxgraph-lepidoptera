  alternatives: ["0.04545", "0.125", "0.1"]
  stands_for: "k_d = 1/tau from hannezo2015/turnover_time_frap for hannezo2015 cross-validations"

- id: gamma_hannezo_main_added
  quantity: cortical_friction
  unit: Pa*s/m^2
  printed: "1e16"
  basis: "Bulk 3D cortical friction gamma = xi_2D / h = (10^9 Pa*s/m) / (100 nm) = 10^16 Pa*s/m^2 implied by Hannezo et al. (2015) Main p. 3 literature estimates (hannezo2015/friction_2d_lit = 10^9 Pa*s/m and hannezo2015/cortical_thickness_lit = 100 nm). Alternatives cover Hannezo et al. (2015) SI Sec. 2.6.4 keratocyte-stress 3D friction estimates (2.5e16 Pa*s/m^2 exact from xi_3d_si_computed; 1e17 Pa*s/m^2 printed friction_3d_estimated_si) and the SI-calibrated l_h = 10 nm bulk friction (1e18 Pa*s/m^2 at eta = 25 Pa*s)."
  alternatives: ["2.5e16", "1e17", "1e18"]
  stands_for: "gamma = xi_2D / h from hannezo2015 Main p. 3 for hannezo2015 cross-validations"

- id: eta_hannezo_div4_added
  quantity: cortical_viscosity
  unit: Pa*s
  printed: "25"
  basis: "1D-longitudinal-viscosity-matched cortical viscosity eta_mirza = eta_3D,hannezo / 4 = (10^2 Pa*s) / 4 = 25 Pa*s from Hannezo et al. (2015) Main p. 3 (hannezo2015/viscosity_3d_lit = 10^2 Pa*s), accounting for the factor-of-4 2D compressible viscous stress convention in Mirza et al. (2025) Eq. (6) (4*eta_mirza*d_x v vs eta_hannezo*d_x v; rel_hannezo2015_iso_wavelength_same_as_eq3 in relations.yaml) so that effective 1D hydrodynamic length 2*ell_s = 2*sqrt(25/10^16) = 0.10 um matches hannezo2015/lh_derived_main. Alternatives test literal 3D shear viscosity 100 Pa*s (yielding sqrt(2) larger wavelength, 2.473 um) and Mirza Appendix D 10^4 Pa*s (7.82 um at gamma = 10^16)."
  alternatives: ["100", "10000"]
  stands_for: "eta_mirza = eta_hannezo / 4 for 1D-matched hannezo2015 cross-validations"

- id: beta_hannezo_div4_added
  quantity: flow_alignment_viscosity
  unit: Pa*s
  printed: "-5"
  basis: "Dimensional flow-alignment coupling beta = beta_bar * eta = -0.2 * 25 Pa*s = -5 Pa*s preserving Mirza et al. (2025) Appendix D's default dimensionless ratio beta/eta = -0.2 when paired with eta_hannezo_div4_added = 25 Pa*s (Hannezo et al., 2015 models an isotropic active gel and does not measure flow-alignment viscosity). Alternatives test the 2D entropy-production limit beta/eta = -sqrt(2) (-35.36 Pa*s, Fig. 3b) and the decoupled isotropic limit (0 Pa*s)."
  alternatives: ["-35.36", "0"]
  stands_for: "beta = -0.2 * eta for Case A hannezo2015 cross-validations"

- id: c0_hannezo_main_added
  quantity: effective_susceptibility_c0
  unit: Pa
  printed: "1600"
  basis: "Dimensional effective nematic susceptibility c_0 = c_bar_0 * gamma * D = 4 * (10^16 Pa*s/m^2) * (0.04 um^2/s) = 1600 Pa preserving Mirza et al. (2025) Appendix 4—table 1's default c_bar_0 = 4 (giving delta = 0.005 at kappa = -0.2, beta/eta = -0.2) at Hannezo et al. (2015) Main p. 3 gamma = 10^16 Pa*s/m^2 and D = 0.04 um^2/s (Hannezo et al., 2015 does not measure nematic susceptibility). Alternatives test 10x weaker susceptibility c_bar_0 = 0.4 (160 Pa, Fig. 3c) and Mirza Appendix D's dimensional 40000 Pa."
  alternatives: ["160", "40000"]
  stands_for: "c_0 = 4 * gamma * D for Case A hannezo2015 Main cross-validations"

- id: gamma_hannezo_si_cal_added
  quantity: cortical_friction
  unit: Pa*s/m^2
  printed: "1e18"
  basis: "Embryo-calibrated bulk 3D cortical friction gamma = 4*eta_mirza / l_h^2 = 100 Pa*s / (10^-8 m)^2 = 10^18 Pa*s/m^2 (paired with eta_hannezo_div4_added = 25 Pa*s) matching Hannezo et al. (2015) SI Sec. 2.6.4's calibrated hydrodynamic length hannezo2015/lh_inverted_si = 10^-8 m (2*ell_s = 10 nm), inverted exclusively from ring_wavelength_embryo_wt = 0.5 um. Alternatives test exact unrounded SI inversion l_h = 8.175 nm (1.496e18 Pa*s/m^2, giving 0.500 um) and uncalibrated Main p. 3 friction (1e16 Pa*s/m^2, giving 1.748 um)."
  alternatives: ["1.496e18", "1e16"]
  stands_for: "gamma matching hannezo2015 SI Sec. 2.6.4 calibrated l_h = 10 nm"

- id: c0_hannezo_si_cal_added
  quantity: effective_susceptibility_c0
  unit: Pa
  printed: "1.6e5"
  basis: "Dimensional effective nematic susceptibility c_0 = c_bar_0 * gamma * D = 4 * (10^18 Pa*s/m^2) * (0.04 um^2/s) = 1.6e5 Pa preserving Mirza et al. (2025) Appendix 4—table 1's default c_bar_0 = 4 (delta = 0.005) at gamma_hannezo_si_cal_added = 10^18 Pa*s/m^2 and D = 0.04 um^2/s. Alternatives test c_bar_0 = 0.4 (1.6e4 Pa, delta = 0.05) and Mirza Appendix D's dimensional 40000 Pa (c_bar_0 = 1.0, delta = 0.02)."
  alternatives: ["1.6e4", "40000"]
  stands_for: "c_0 = 4 * gamma * D for Case A hannezo2015 SI-calibrated cross-validations"

