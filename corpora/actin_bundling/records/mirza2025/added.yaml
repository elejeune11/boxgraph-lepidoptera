  printed: "-0.2"
  basis: "Figure 2—figure supplement 1 (p. 37) does not state the value of kappa used in the 8*ell_pattern snapshots, but the default fibrillar value in Figures 2 and 4a-b (Appendix 4—table 1) is kappa = -0.2."
  alternatives: ["-0.5", "-0.8", "0.0"]
  stands_for: "kappa in Figure 2—figure supplement 1"

- id: gamma_scale_fig3c_added
  quantity: friction_scale_factor
  unit: dimensionless
  printed: "10"
  basis: "Figure 3c caption (p. 9) states 'an increase in friction as detailed in Appendix 4—table 1' without stating the numerical factor; comparing Fig. 3b (k_bar_d=0.1, c_bar_0=4, b_bar=20) to Fig. 3c (k_bar_d=0.01, c_bar_0=0.4, b_bar=2) gives gamma_3c / gamma_3b = 10."
  alternatives: ["5", "20"]
  stands_for: "friction increase factor in Fig. 3c"

- id: K_S_energy_added
  quantity: restraining_energy_stiffness
  unit: pN*um
  printed: "5000"
  basis: "Appendix E.2 (p. 30) prints K_S = 5000 pN/um, which has units of stiffness [force]/[length] rather than [energy] required by Eq. (E2) E_S = (K_S/2)|q^s - q^0|^2 and Eq. (12) S(t) = S_0*(1 - exp(-K_S*t/eta_rot)) with eta_rot = 1583 pN*um*s. Retaining the numeric value 5000 in energy units pN*um tests a unit-typo interpretation; alternatives 20000 and 25000 test the faster tau ~ 0.063-0.079 s curve plotted in Fig. 5—figure supplement 1 III(e)."
  alternatives: ["20000", "25000"]
  stands_for: "K_S in Eq. (12) and Eq. (E2)"

