notes: >
  Full quantitative read of Mirza, De Corato, Pensalfini, Vilanova, Torres-Sánchez & Arroyo,
  eLife 13:RP93097 (2024; Version of Record 2025), covering both the main article and Appendices A-E
  (PDF pp. 1-33) and the Figures and Figure Supplements section (PDF pp. 34-43). All pages with
  equations, tables, and figures were inspected visually via rendered page images alongside text
  extractions.

  Record contents: 95 quantities, 103 data (covering all text claims, Appendix D dimensional
  reference values, Appendix 4—tables 1-2, Appendix E & Appendix 5—tables 1-4 "Present work"
  parameters, and Fig. 2—figure supplement 1), 23 added inputs with alternatives, 44 models (43
  runnable including 4 evidenced variant_of corrections, plus 1 non-runnable external C++ CytoSim
  agent-based model), 57 runs, 36 comparisons (25 reproduction: 22 reproduced, 2 not reproduced,
  1 no verdict; plus 11 consistency/approximation checks), 8 numerical refinements (8/8 settling,
  belongs_to: model), 12 intra-record stated relations (12/12 verified), 15 open questions, and
  105 bibliography references linking all 4 cited corpus records (bois2011, hannezo2015,
  weirich2017, weirich2019).

  Key mathematical and quantitative findings:
  (1) Main text p. 6 below Eq. (9) misprints lambda_crit,0 = gamma*D*(1 + 2*sqrt(ell_s/ell_D))^2
  with an extraneous square root over ell_s/ell_D (45.14 kPa vs 26.65 kPa from the adjacent
  (sqrt(gamma*D) + 2*sqrt(k_d*eta))^2); corrected variant isotropic_threshold_lengths_corrected
  restores exact symbolic identity.
  (2) Main text p. 7 misprints dimensional Case B delta = gamma*D*kappa*beta/(2*eta*L), which has
  dimension 1/[length]^2 rather than dimensionless; corrected variant caseB_delta_dimensional_corrected
  (D*kappa*beta/(2*L)) matches Appendix B and Eq. (C17) delta = kappa*beta_bar/(2*L_bar) identically.
  (3) Appendix A (p. 22) prints the 1D entropy production inequality as 4*eta*eta_rot - beta^2 >= 0
  (|beta_bar| <= 2) instead of 8*eta*eta_rot - beta^2 >= 0 (|beta_bar| <= 2*sqrt(2)), whereas reducing
  the 2D dissipation potential to 1D (q_hat:q_hat = 2*q_hat^2) and Eq. (C7) A(nu -> oo) = 8*eta_rot - beta^2
  both yield the factor of 8 (implemented in entropy_production_bound_1d_corrected).
  (4) Figure 4c(I) (pp. 11-12) and Fig. 4—figure supplement 1d describe reducing friction gamma by
  200-fold, which reproduces k_bar_d = 20 and b_bar = 4000 in Appendix 4—table 1 (and implied
  a_bar = 1000 = 200*5), but fails to reproduce c_bar_0 = 200 (predicted 800) and lambda_bar_o = 1800
  (predicted 1200; Table 1 effectively scales lambda_bar_o by 300x).
  (5) Figure 2—figure supplement 1 (p. 37) reports nonlinear simulation wavelength ratio
  ell_pattern^sim / ell_pattern = 0.87 +/- 0.02 at lambda = 1.3*lambda_crit; both the supercritical
  fastest-growing linear mode of Eq. (C7) (nu_crit / nu_max = 0.8565) and our 1D nonlinear PDE
  solution of Eqs. (B1)-(B4) (0.8867) reproduce this ratio.
  (6) Figure 4—figure supplement 1 (p. 40) labels stress y-axes 'x 1/lambda_crit', whereas direct
  integration of 1D Eqs. (B1)-(B4) at lambda = 1.3*lambda_crit reproduces every plotted peak, trough,
  active component, viscous component, and contractile-to-extensile crossover (sigma_par - sigma_perp =
  +0.438, +0.003, -0.588 at kappa = -0.2, -0.5, -0.8) only when normalized by lambda = 1.3*lambda_crit
  rather than lambda_crit.
  (7) Standalone 2D periodic spectral solver of Eqs. (1)-(8) on L = 2*ell_pattern (N = 32, refined to
  48; dt = 0.04, refined to 0.02) confirms the architectural transition from fibrillar (omega = -0.0168
  at kappa = -0.2) to banded (omega = +0.0015 at kappa = +0.2) states, settling within < 0.6%.
  (8) Appendix E.2 (p. 30) prints restraining stiffness K_S = 5000 pN/um ([force]/[length]) instead of
  energy units [pN*um] required by Eqs. (E2), (E4), and (12) with fitted eta_rot ~ 1583 pN*um*s; even
  in pN*um, tau = eta_rot / K_S = 0.317 s is ~5x slower than the ~0.063 s relaxation curves plotted in
  Fig. 5—figure supplement 1 III(e) (p. 42). Appendix E.1 (p. 28) also omits dt in r_A = N_t/(N_s*N_A)
  (corrected variant restores r_A = 20 %/s). Minor typos include p. 25 'ell_s = 0.2 approaches 0' (for
  c_0), p. 27 '0.2 icrom', and Appendix 5—table 3 misattributing Cortes et al. (2020) rows to
  Weißenbruch et al. (2021).

