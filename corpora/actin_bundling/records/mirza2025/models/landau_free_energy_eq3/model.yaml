id: landau_free_energy_eq3
name: Landau nematic free-energy density f(q, grad q) (Eq. 3)
role: model
stated:
  page: 4
  printed_page: 4 of 33
  quote: is the classical Landau expansion of free-energy density per unit mass
  where: Eq. 3 (p. 4)
equation: f(q, grad q) = (1/2)*a*S^2 + (1/8)*b*S^4 + (1/2)*L*|grad q|^2
inputs:
  a:
    quantity: nematic_susceptibility_a
    unit: Pa
  b:
    quantity: nematic_susceptibility_b
    unit: Pa
  L:
    quantity: frank_elastic_constant
    unit: pN
  S:
    quantity: nematic_order_parameter
    unit: dimensionless
  grad_q:
    quantity: nematic_gradient_norm
    unit: 1/um
outputs:
  f:
    quantity: free_energy_density
    unit: Pa
settings: {}
stochastic: false
