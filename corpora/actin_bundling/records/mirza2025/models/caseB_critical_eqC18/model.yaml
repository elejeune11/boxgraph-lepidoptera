    unit: dimensionless
  nu_crit_sq:
    quantity: wavenumber_squared_dimless
    unit: dimensionless
  nu_crit:
    quantity: wavenumber_dimless
    unit: dimensionless
  lambda_crit:
    quantity: active_tension_dimless
    unit: dimensionless
  ell_pattern:
    quantity: pattern_wavelength_dimless
    unit: dimensionless
settings: {}
