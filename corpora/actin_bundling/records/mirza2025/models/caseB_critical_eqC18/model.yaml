id: caseB_critical_eqC18
name: Case B (q_0 = 0, c_0 -> 0) exact critical wavenumber and activity (Eqs. C16-C18)
role: model
stated:
  page: 26
  printed_page: 26 of 33
  quote: Following the same rationale as before, we find
  where: Appendix C.2, Eqs. C16-C18 (p. 26)
equation: delta = kappa*beta/(2*L); nu_crit^2 = (-2*k_d*delta + sqrt(k_d*(1 + delta*(1 - 4*k_d))))/(2*(1 + delta)); lambda_crit = (1 + 4*x)*(k_d + x)/((1 + delta)*x + k_d*delta)
