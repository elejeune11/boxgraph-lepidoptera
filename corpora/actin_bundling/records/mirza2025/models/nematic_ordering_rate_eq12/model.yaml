id: nematic_ordering_rate_eq12
name: short-time active nematic ordering rate S_dot = (rho*lambda_o - 2*a)*S_0 / eta_rot (Eq. 12, Fig. 5g)
role: model
stated:
  page: 14
  printed_page: "14 of 33"
  quote: "we tested the short-time prediction of Equation 12"
  where: "Main text Eq. 12 (p. 14) & Fig. 5g (p. 13)"
equation: "eta_rot * S_dot = (rho * lambda_o - 2 * a) * S_0; S_dot_norm = S_dot / r_A"
inputs:
  S_0: {quantity: nematic_order_parameter, unit: dimensionless}
  c_eff_energy: {quantity: restraining_energy_stiffness, unit: pN*um}
  eta_rot: {quantity: discrete_rotational_drag, unit: pN*um*s}
  r_A: {quantity: actin_turnover_rate, unit: 1/s}
outputs:
  S_dot: {quantity: discrete_nematic_rate, unit: 1/s}
  S_dot_norm: {quantity: discrete_nematic_rate_dimless, unit: dimensionless}
settings: {}
stochastic: false
