id: caseB_delta_dimensional_corrected
name: corrected dimensional Case B coupling delta = D*kappa*beta/(2*L) from Appendix B & Eq. (C17)
role: model
stated:
  page: 7
  printed_page: 7 of 33
  quote: finding analogous expansions for the critical tension and wavenumber in terms of
  where: text (p. 7) & Appendix C Eq. (C17) (p. 26)
variant_of: caseB_delta_dimensional_printed
corrections:
- equation: Main text p. 7, inline expression for Case B delta
  change: 'Remove the erroneous factor gamma/eta = 1/ell_s^2: delta = D*kappa*beta/(2*L) instead of gamma*D*kappa*beta/(2*eta*L).'
  evidence: Appendix B (p. 23) defines beta_bar = beta/eta and L_bar = L/(eta*D) = L/(gamma*D*ell_s^2), so dimensionless Eq. (C17) (p. 26) delta = kappa*beta_bar/(2*L_bar) equals D*kappa*beta/(2*L), which is dimensionless; the printed gamma*D*kappa*beta/(2*eta*L) has dimension 1/[length]^2 and cannot enter (1 - (1 + 2*sqrt(k_bar_d))*delta).
equation: delta = D * kappa * beta / (2 * L)
inputs:
  D:
    quantity: effective_diffusivity
    unit: um^2/s
  kappa:
    quantity: active_tension_anisotropy
    unit: dimensionless
  beta:
    quantity: flow_alignment_viscosity
    unit: Pa*s
  L:
    quantity: frank_elastic_constant
    unit: pN
outputs:
  delta:
    quantity: nematic_coupling_delta
    unit: dimensionless
settings: {}
stochastic: false
