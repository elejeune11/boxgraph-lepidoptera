id: active_nematic_pde_1d_profile_norm_lam
name: 1D periodic steady-state spatial profiles normalized by applied activity lambda (corrected y-axis normalization for Fig. 4—figure supplement 1)
role: model
stated:
  page: 40
  printed_page: "7 of 10"
  quote: "The left column shows the density distribution, the middle column the total tension along (solid) and perpendicular (dashed) to nematic bundles"
  where: "Appendix B Eqs. B1-B4 (p. 23) & Fig. 4—figure supplement 1(a-c) (p. 40)"
built_from:
  - active_nematic_pde_1d_profile_eqB1_B4
variant_of: active_nematic_pde_1d_profile_eqB1_B4
corrections:
  - equation: "Fig. 4—figure supplement 1 y-axis normalization ('x 1/lambda_crit')"
    change: "Normalize total, active, and viscous 1D tensions by applied activity lambda = 1.3 * lambda_crit rather than linear threshold lambda_crit."
    evidence: "Calibrated digitization of Fig. 4—figure supplement 1(a-d) shows that isotropic troughs satisfy sigma^act / lambda = rho / rho_0 identically (e.g. row d: 0.816 vs 0.815, 0.712 vs 0.712, 0.669 vs 0.669) and all 21 curves in rows (a)-(c) match Eqs. (B1)-(B4) normalized by lambda, whereas division by lambda_crit is systematically 1.30x higher."
equation: "1D periodic steady state of Eqs. (B1)-(B4) on wavelength L_period, with tensions normalized by applied activity lambda = 1.3 * lambda_crit"
inputs:
  k_d: {quantity: turnover_rate_dimless, unit: dimensionless}
  L: {quantity: frank_constant_dimless, unit: dimensionless}
  c_0: {quantity: effective_susceptibility_c0_dimless, unit: dimensionless}
  b: {quantity: susceptibility_b_dimless, unit: dimensionless}
  eta_rot: {quantity: rotational_viscosity_dimless, unit: dimensionless}
  beta: {quantity: flow_alignment_dimless, unit: dimensionless}
  lambda_o: {quantity: nematic_activity_dimless, unit: dimensionless}
  kappa: {quantity: active_tension_anisotropy, unit: dimensionless}
  activity_ratio: {quantity: activity_supercritical_ratio, unit: dimensionless}
  L_period: {quantity: position_dimless, unit: dimensionless}
  rho_ref:
    quantity: relative_density
    unit: dimensionless
    curve: {quantity: position_dimless, unit: dimensionless}
  vis_ref:
    quantity: normalized_tension
    unit: dimensionless
    curve: {quantity: position_dimless, unit: dimensionless}
outputs:
  rho:
    quantity: relative_density
    unit: dimensionless
    curve: {quantity: position_dimless, unit: dimensionless}
  sigma_par:
    quantity: normalized_tension
    unit: dimensionless
    curve: {quantity: position_dimless, unit: dimensionless}
  sigma_perp:
    quantity: normalized_tension
    unit: dimensionless
    curve: {quantity: position_dimless, unit: dimensionless}
  sigma_act_par:
    quantity: normalized_tension
    unit: dimensionless
    curve: {quantity: position_dimless, unit: dimensionless}
  sigma_act_perp:
    quantity: normalized_tension
    unit: dimensionless
    curve: {quantity: position_dimless, unit: dimensionless}
  sigma_vis_par:
    quantity: normalized_tension
    unit: dimensionless
    curve: {quantity: position_dimless, unit: dimensionless}
  sigma_vis_perp:
    quantity: normalized_tension
    unit: dimensionless
    curve: {quantity: position_dimless, unit: dimensionless}
settings:
  N_grid: 64
  dt: 0.04
  t_max: 120.0
  steady_tol: 1.0e-7
stochastic: false
