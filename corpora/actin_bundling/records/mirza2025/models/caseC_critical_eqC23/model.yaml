id: caseC_critical_eqC23
name: Case C (q_0 != 0, L = 0) exact critical wavenumber and activity (Eqs. C21-C23)
role: model
stated:
  page: 26
  printed_page: 26 of 33
  quote: Going back to Equation C8 and taking L = 0 to obtain workable expressions
  where: Appendix C.3, Eqs. C21-C23 (p. 26)
equation: delta = kappa*beta/(16*b*q_0^2); tau = kappa*(lambda_o/(8*b*q_0) + q_0); nu_crit^2 = (delta*k_d + sqrt(delta^2*k_d^2 + k_d*(4 + 4*tau - delta)*(1 + tau + delta*k_d)))/(4 + 4*tau - delta); lambda_crit = (1 + 4*x)*(x + k_d)/(delta*x^2 + (1 + tau + delta*k_d)*x)
inputs:
  k_d:
    quantity: turnover_rate_dimless
    unit: dimensionless
  b:
    quantity: susceptibility_b_dimless
    unit: dimensionless
  beta:
    quantity: flow_alignment_dimless
    unit: dimensionless
  lambda_o:
    quantity: nematic_activity_dimless
    unit: dimensionless
  kappa:
    quantity: active_tension_anisotropy
    unit: dimensionless
  q_0:
    quantity: nematic_tensor_1d
    unit: dimensionless
outputs:
  delta:
    quantity: nematic_coupling_delta
    unit: dimensionless
  tau:
    quantity: nematic_prealignment_tau
    unit: dimensionless
  nu_crit_sq:
    quantity: wavenumber_squared_dimless
    unit: dimensionless
  nu_crit:
    quantity: wavenumber_dimless
    unit: dimensionless
  lambda_crit:
    quantity: active_tension_dimless
    unit: dimensionless
  ell_pattern:
    quantity: pattern_wavelength_dimless
    unit: dimensionless
settings: {}
stochastic: false
