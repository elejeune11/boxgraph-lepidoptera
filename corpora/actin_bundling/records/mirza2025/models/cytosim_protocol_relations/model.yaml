id: cytosim_protocol_relations
name: CytoSim discrete network filament count, output rate, turnover time, and normalized time checks (Appendix E)
role: processing
stated:
  page: 30
  printed_page: 30 of 33
  quote: we adopt a time step of 5 ms and a data acquisition frequency of 40 s−1, i.e., 1 every 5 time steps
  where: Appendix E.2-E.3 (pp. 30-31) & Fig. 5c,f (p. 13)
equation: N_A = rho_A * ell^2 / ell_A; f_out = 1 / (stride * dt); tau_A = 1 / r_A; t_norm = t / tau_A; T = kT / k_B
inputs:
  rho_A:
    quantity: filament_surface_density
    unit: um/um^2
  ell:
    quantity: rve_size
    unit: um
  ell_A:
    quantity: filament_length
    unit: um
  dt:
    quantity: simulation_timestep
    unit: s
  stride:
    quantity: output_stride
    unit: dimensionless
  r_A:
    quantity: actin_turnover_rate
    unit: 1/s
  t_eval:
    quantity: simulation_duration
    unit: s
  kT:
    quantity: thermal_energy
    unit: pN*um
  k_B:
    quantity: boltzmann_constant
    unit: pN*um/K
outputs:
  N_A:
    quantity: filament_count
    unit: dimensionless
  rho_A_2x:
    quantity: filament_surface_density
    unit: um/um^2
  rho_A_3x:
    quantity: filament_surface_density
    unit: um/um^2
  f_out:
    quantity: output_frequency
    unit: 1/s
  tau_A:
    quantity: actin_turnover_time
    unit: s
  t_norm:
    quantity: time_dimless
    unit: dimensionless
  T:
    quantity: temperature
    unit: K
settings: {}
stochastic: false
