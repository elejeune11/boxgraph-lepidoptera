id: equilibrium_nematic_order
name: uniform quiescent nematic order S_0 and q_0 (p. 5, p. 10-11, Appendix A)
role: model
stated:
  page: 11
  printed_page: 11 of 33
  quote: the nematic order parameter in the quiescent and uniform equilibrium state
  where: text (p. 5, p. 10), Fig. 4a caption (p. 11), & Appendix A (p. 22)
equation: S_0 = 0 if c_bar_0 >= 0 else sqrt(-c_bar_0 / b_bar); q_0 = S_0 / 2
inputs:
  c_bar_0:
    quantity: effective_susceptibility_c0_dimless
    unit: dimensionless
  b_bar:
    quantity: susceptibility_b_dimless
    unit: dimensionless
outputs:
  S_0:
    quantity: nematic_order_parameter
    unit: dimensionless
  q_0_pos:
    quantity: nematic_tensor_1d
    unit: dimensionless
  q_0_neg:
    quantity: nematic_tensor_1d
    unit: dimensionless
settings: {}
stochastic: false
