id: nematic_length_and_time
name: nematic correlation length ell_q and relaxation time t_q (p. 6, Appendix B)
role: model
stated:
  page: 23
  printed_page: 23 of 33
  quote: the characteristic nematic lengthscale
  where: text (p. 6) & Appendix B (p. 23)
equation: ell_q = sqrt(L / |2*a - lambda_o * rho_0|), t_q = (ell_q^2 * eta_rot) / L = eta_rot / |2*a - lambda_o * rho_0|
inputs:
  L:
    quantity: frank_elastic_constant
    unit: pN
  a:
    quantity: nematic_susceptibility_a
    unit: Pa
  rho_lam_o:
    quantity: nematic_activity_stress
    unit: Pa
  eta_rot:
    quantity: rotational_viscosity
    unit: Pa*s
outputs:
  ell_q:
    quantity: nematic_length
    unit: um
  t_q:
    quantity: nematic_relaxation_time
    unit: s
settings: {}
stochastic: false
