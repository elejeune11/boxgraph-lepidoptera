id: isotropic_threshold_lengths_corrected
name: corrected length-ratio form of isotropic threshold lambda_crit,0 = gamma*D*(1 + 2*ell_s/ell_D)^2
role: model
stated:
  page: 6
  printed_page: 6 of 33
  quote: where λcrit,0 =
  where: inline equation below Eq. 9 (p. 6)
variant_of: isotropic_threshold_lengths_printed
corrections:
- equation: Main text p. 6, inline expression below Eq. (9)
  change: 'Remove the erroneous square root over ell_s/ell_D: gamma*D*(1 + 2*ell_s/ell_D)^2 instead of gamma*D*(1 + 2*sqrt(ell_s/ell_D))^2.'
  evidence: On the same line immediately to the left, (sqrt(gamma*D) + 2*sqrt(k_d*eta))^2 = gamma*D*(1 + 2*sqrt(k_d*eta/(gamma*D)))^2 = gamma*D*(1 + 2*ell_s/ell_D)^2 since ell_s = sqrt(eta/gamma) and ell_D = sqrt(D/k_d). Likewise Eqs. (9)-(10) (p. 6) and Eqs. (C14)-(C15) (p. 25) use ell_s/ell_D = sqrt(k_bar_d) without a square root.
equation: lambda_crit,0 = gamma * D * (1 + 2 * (ell_s / ell_D))^2, nu_crit,0^2 = 1 / (2 * ell_s * ell_D)
inputs:
  gamma:
    quantity: cortical_friction
    unit: Pa*s/m^2
  D:
    quantity: effective_diffusivity
    unit: um^2/s
  ell_s:
    quantity: hydrodynamic_length
    unit: um
  ell_D:
    quantity: damkohler_length
    unit: um
outputs:
  lambda_crit_0:
    quantity: active_tension_parameter
    unit: Pa
  nu_crit_0_sq:
    quantity: critical_wavenumber_squared
    unit: 1/um^2
settings: {}
stochastic: false
