id: marginal_stability_eqC8
name: exact 1D marginal stability boundary lambda(nu) and critical threshold (Eqs. C8-C10)
role: model
stated:
  page: 25
  printed_page: 25 of 33
  quote: From this condition, we can express the activity parameter as
  where: Appendix C, Eqs. C8-C10 (p. 25)
equation: lambda(x) = (x^-1 + 4)*(x + k_d)*(2*G + 2*L*x) / ((1 + kappa*q_0)*(2*G + 2*L*x) + kappa*(beta*(x + k_d) + 2*lambda_o*q_0)); d(lambda)/dx = 0
inputs:
  k_d:
    quantity: turnover_rate_dimless
    unit: dimensionless
  L:
    quantity: frank_constant_dimless
    unit: dimensionless
  c_0:
    quantity: effective_susceptibility_c0_dimless
    unit: dimensionless
  b:
    quantity: susceptibility_b_dimless
    unit: dimensionless
  beta:
    quantity: flow_alignment_dimless
    unit: dimensionless
  lambda_o:
    quantity: nematic_activity_dimless
    unit: dimensionless
  kappa:
    quantity: active_tension_anisotropy
    unit: dimensionless
  q_0:
    quantity: nematic_tensor_1d
    unit: dimensionless
outputs:
  lambda_crit:
    quantity: active_tension_dimless
    unit: dimensionless
  nu_crit_sq:
    quantity: wavenumber_squared_dimless
    unit: dimensionless
  nu_crit:
    quantity: wavenumber_dimless
    unit: dimensionless
  ell_pattern:
    quantity: pattern_wavelength_dimless
    unit: dimensionless
settings:
  n_grid: 4000
  x_min: 1.0e-05
  x_max: 10000.0
stochastic: false
