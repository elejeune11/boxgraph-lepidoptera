id: cytosim_boundary_tension_eqE11_E12
name: discrete RVE boundary tension readout and anisotropy ratio (Eqs. E11-E12)
role: processing
stated:
  page: 30
  printed_page: 30 of 33
  quote: allows us to quantify tension anisotropy using the deviatoric tension normalized by the mean tension
  where: Appendix E.2, Eqs. E11-E12 (p. 30)
equation: sigma_par = (F_top - F_bot)/(2*L); sigma_perp = (F_right - F_left)/(2*L); xi = 2*(sigma_par - sigma_perp)/(sigma_par + sigma_perp)
inputs:
  F_top:
    quantity: force
    unit: pN
  F_bot:
    quantity: force
    unit: pN
  F_right:
    quantity: force
    unit: pN
  F_left:
    quantity: force
    unit: pN
  L:
    quantity: rve_size
    unit: um
outputs:
  sigma_par:
    quantity: network_tension_2d
    unit: pN/um
  sigma_perp:
    quantity: network_tension_2d
    unit: pN/um
  sigma_bar:
    quantity: network_tension_2d
    unit: pN/um
  xi:
    quantity: tension_anisotropy_ratio
    unit: dimensionless
settings: {}
stochastic: false
