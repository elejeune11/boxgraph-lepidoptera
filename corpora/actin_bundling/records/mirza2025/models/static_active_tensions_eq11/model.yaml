id: static_active_tensions_eq11
name: static uniform active tension components and anisotropy (Eqs. 7 and 11, Fig. 1b-c, Fig. 5d-e)
role: model
stated:
  page: 14
  printed_page: 14 of 33
  quote: in the absence of nematic gradients and flow, the tension components
  where: Eq. 7 (p. 5), Fig. 1b-c (p. 3), & Eq. 11 (p. 14)
equation: sigma_par = rho*lam*(1 + kappa*S/2), sigma_perp = rho*lam*(1 - kappa*S/2), sigma_bar = (sigma_par + sigma_perp)/2 = lam*rho, xi = (sigma_par - sigma_perp)/sigma_bar = kappa*S
inputs:
  rho:
    quantity: filament_surface_density
    unit: um/um^2
  rho_ref:
    quantity: filament_surface_density
    unit: um/um^2
  lam:
    quantity: discrete_active_tension_coeff
    unit: pN
  kappa:
    quantity: active_tension_anisotropy
    unit: dimensionless
  S:
    quantity: nematic_order_parameter
    unit: dimensionless
outputs:
  sigma_par:
    quantity: network_tension_2d
    unit: pN/um
  sigma_perp:
    quantity: network_tension_2d
    unit: pN/um
  sigma_bar:
    quantity: network_tension_2d
    unit: pN/um
  sigma_bar_norm:
    quantity: normalized_tension
    unit: dimensionless
  norm_slope:
    quantity: normalized_mean_tension_slope
    unit: dimensionless
  xi:
    quantity: tension_anisotropy_ratio
    unit: dimensionless
settings: {}
stochastic: false
