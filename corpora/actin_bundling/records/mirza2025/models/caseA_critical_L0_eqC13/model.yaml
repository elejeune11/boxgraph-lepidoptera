id: caseA_critical_L0_eqC13
name: Case A (q_0 = 0, L = 0) exact critical wavenumber and activity (Eqs. C11-C13)
role: model
stated:
  page: 25
  printed_page: 25 of 33
  quote: To obtain workable explicit expressions, we first assume that L = 0
  where: Appendix C.1, Eqs. C11-C13 (p. 25)
equation: delta = kappa*beta/(2*c_0); nu_crit^2 = (k_d*delta + sqrt(k_d*(4 + delta*(4*k_d - 1))))/(4 - delta); lambda_crit = (1 + 4*x)*(k_d + x)/(delta*x^2 + (1 + k_d*delta)*x)
inputs:
  k_d:
    quantity: turnover_rate_dimless
    unit: dimensionless
  c_0:
    quantity: effective_susceptibility_c0_dimless
    unit: dimensionless
  beta:
    quantity: flow_alignment_dimless
    unit: dimensionless
  kappa:
    quantity: active_tension_anisotropy
    unit: dimensionless
outputs:
  delta:
    quantity: nematic_coupling_delta
    unit: dimensionless
  nu_crit_sq:
    quantity: wavenumber_squared_dimless
    unit: dimensionless
  nu_crit:
    quantity: wavenumber_dimless
    unit: dimensionless
  lambda_crit:
    quantity: active_tension_dimless
    unit: dimensionless
  ell_pattern:
    quantity: pattern_wavelength_dimless
    unit: dimensionless
settings: {}
stochastic: false
