id: relaxation_rate_printed_units_check
name: dimensional diagnostic of K_S / eta_rot using printed units pN/um and pN*um*s
role: processing
stated:
  page: 30
  printed_page: 30 of 33
  quote: which acts with a stiffness KS = 5000 pN/μm to induce a nematic orientation
  where: Appendix E.2 (p. 30) & Appendix E.3 (p. 31)
equation: ratio = K_S_printed / eta_rot  [1 / (um^2 * s)]
inputs:
  K_S_printed:
    quantity: spring_stiffness
    unit: pN/um
  eta_rot:
    quantity: discrete_rotational_drag
    unit: pN*um*s
outputs:
  ratio:
    quantity: relaxation_timescale_mismatch_ratio
    unit: 1/(um^2*s)
settings: {}
stochastic: false
