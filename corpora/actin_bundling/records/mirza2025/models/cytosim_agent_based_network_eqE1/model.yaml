id: cytosim_agent_based_network_eqE1
name: 2D stochastic CytoSim agent-based crosslinked actomyosin network (Eq. E1, Fig. 5)
role: model
stated:
  page: 28
  printed_page: 28 of 33
  quote: we establish an agent- based microscopic model of a crosslinked actomyosin network
  where: Main text (pp. 13-14) & Appendix E (pp. 28-33)
described_from: ref-pensalfini2025
equation: dX = mu * F(X, t) dt + dB(t) (customized C++ CytoSim engine)
inputs:
  rho_A:
    quantity: filament_surface_density
    unit: um/um^2
  S_0:
    quantity: nematic_order_parameter
    unit: dimensionless
outputs:
  kappa:
    quantity: active_tension_anisotropy
    unit: dimensionless
  eta_rot:
    quantity: discrete_rotational_drag
    unit: pN*um*s
settings:
  dt: 0.005
  n_realizations: 16
  seed: 0
runnable: false
not_runnable_reason: The discrete actomyosin network simulations in Fig. 5 require the customized C++ CytoSim engine (Pensalfini, 2025; external GitLab/Software Heritage repository not included in this article PDF), integrating 1500-4500 semiflexible inextensible filaments with stochastic crosslinkers, walking myosin motors, turnover, and custom nematic penalty forces over 12 x 16 = 192 realizations of 20-32.5 s.
stochastic: true
