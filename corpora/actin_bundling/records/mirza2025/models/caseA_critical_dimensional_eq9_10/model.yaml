id: caseA_critical_dimensional_eq9_10
name: dimensional critical activity and wavenumber expansions (Main Eqs. 9-10)
role: model
stated:
  page: 6
  printed_page: 6 of 33
  quote: we derived explicit expansions in the limit of small L for the critical contractile activity
  where: Main text, Eqs. 9-10 (p. 6)
equation: lambda_crit = (sqrt(gamma*D) + 2*sqrt(k_d*eta))^2 * [1 - (1/2)*(ell_s/ell_D)*(1 + 2*ell_s/ell_D)*delta]; nu_crit^2 = (1/(2*ell_s*ell_D)) * [1 + (1/8)*(1 + 2*ell_s/ell_D)^2 * delta]; delta = gamma*D*kappa*beta/(2*eta*c_0)
inputs:
  gamma:
    quantity: cortical_friction
    unit: Pa*s/m^2
  D:
    quantity: effective_diffusivity
    unit: um^2/s
  k_d:
    quantity: depolymerization_rate
    unit: 1/s
  eta:
    quantity: cortical_viscosity
    unit: Pa*s
  kappa:
    quantity: active_tension_anisotropy
    unit: dimensionless
  beta:
    quantity: flow_alignment_viscosity
    unit: Pa*s
  c_0:
    quantity: effective_susceptibility_c0
    unit: Pa
outputs:
  delta:
    quantity: nematic_coupling_delta
    unit: dimensionless
  lambda_crit:
    quantity: active_tension_parameter
    unit: Pa
  nu_crit_sq:
    quantity: critical_wavenumber_squared
    unit: 1/um^2
  nu_crit:
    quantity: critical_wavenumber
    unit: 1/um
  ell_pattern:
    quantity: pattern_wavelength
    unit: um
settings: {}
stochastic: false
