id: friction_rescaling_reduction
name: nondimensional parameter rescaling under friction reduction gamma -> gamma / R_gamma (Fig. 4cI, p. 12)
role: model
stated:
  page: 12
  printed_page: 12 of 33
  quote: we can either reduce γ, which in nondimensional terms means increasing k̄d, a, b, and λ̄⊙ in concert
  where: text (p. 12), Fig. 4cI (p. 11), & Appendix B (p. 23)
equation: k_bar_d_new = R_gamma * k_bar_d, c_bar_0_new = R_gamma * c_bar_0, b_bar_new = R_gamma * b_bar, lambda_bar_o_new = R_gamma * lambda_bar_o
inputs:
  k_bar_d_ref:
    quantity: turnover_rate_dimless
    unit: dimensionless
  c_bar_0_ref:
    quantity: effective_susceptibility_c0_dimless
    unit: dimensionless
  b_bar_ref:
    quantity: susceptibility_b_dimless
    unit: dimensionless
  lambda_o_bar_ref:
    quantity: nematic_activity_dimless
    unit: dimensionless
  R_gamma:
    quantity: friction_scale_factor
    unit: dimensionless
outputs:
  k_bar_d:
    quantity: turnover_rate_dimless
    unit: dimensionless
  c_bar_0:
    quantity: effective_susceptibility_c0_dimless
    unit: dimensionless
  b_bar:
    quantity: susceptibility_b_dimless
    unit: dimensionless
  lambda_o_bar:
    quantity: nematic_activity_dimless
    unit: dimensionless
settings: {}
stochastic: false
