id: cytosim_motor_speed_eqE10
name: linear force-velocity relation for myosin motors (Eq. E10)
role: model
stated:
  page: 30
  printed_page: 30 of 33
  quote: speed of the motor in the absence of external loads, the effective speed is given by
  where: Appendix E.1, Eq. E10 (p. 30)
