id: active_nematic_pde_1d_eqB1_B4
name: 1D periodic nonlinear active nematic PDE solver (Eqs. B1-B4, Fig. 4—figure supplement 1)
role: model
stated:
  page: 23
  printed_page: 23 of 33
  quote: We present next a nondimensionalization of the governing Equations A2–A5
  where: Appendix B, Eqs. B1-B4 (p. 23) & Fig. 4—figure supplement 1 (p. 40)
built_from:
- marginal_stability_eqC8
equation: d_t rho + d_x(rho*v) - d_xx rho + k_d*(rho - 1) = 0; rho*v = d_x sigma; sigma = rho*(4*d_x v + beta*q_hat + lam*(1 + kappa*q) - 2*L*(d_x q)^2); eta_rot*q_hat + (beta/2)*d_x v + (2*a - rho*lambda_o + 4*b*q^2)*q - L*d_xx q - (L/rho)*(d_x q)*(d_x rho) = 0
inputs:
  k_d:
    quantity: turnover_rate_dimless
    unit: dimensionless
  L:
    quantity: frank_constant_dimless
    unit: dimensionless
  c_0:
    quantity: effective_susceptibility_c0_dimless
    unit: dimensionless
  b:
    quantity: susceptibility_b_dimless
    unit: dimensionless
  eta_rot:
    quantity: rotational_viscosity_dimless
    unit: dimensionless
  beta:
    quantity: flow_alignment_dimless
    unit: dimensionless
  lambda_o:
    quantity: nematic_activity_dimless
    unit: dimensionless
  kappa:
    quantity: active_tension_anisotropy
    unit: dimensionless
  activity_ratio:
    quantity: activity_supercritical_ratio
    unit: dimensionless
  L_domain:
    quantity: position_dimless
    unit: dimensionless
