id: entropy_production_bound_1d_corrected
name: corrected 1D entropy production inequality 8*eta*eta_rot - beta^2 >= 0 from Eqs. (A4)-(A5) and (C7)
role: model
stated:
  page: 22
  printed_page: 22 of 33
  quote: for the dissipation to be positive, the material parameters need to satisfy an entropy production inequality
  where: Appendix A (p. 22) & Appendix C Eq. (C7) (p. 24)
variant_of: entropy_production_bound_1d_printed
corrections:
- equation: Appendix A (p. 22) 1D entropy production inequality
  change: Replace 4*eta*eta_rot - beta^2 >= 0 with 8*eta*eta_rot - beta^2 >= 0 (beta_bar_min = -2*sqrt(2*eta_bar_rot)).
  evidence: Reducing the 2D dissipation potential 2*eta*(d:d + (tr d)^2) + 2*beta*(d^dev:q_hat) + eta_rot*(q_hat:q_hat) to 1D (d_11 = d_x v, d_22 = 0, q_11 = -q_22 = q) yields 4*eta*(d_x v)^2 + 2*beta*(d_x v)*q_hat + 2*eta_rot*q_hat^2, whose positivity discriminant is 8*eta*eta_rot - beta^2 >= 0. Equivalently, eliminating q_hat between Eqs. (A4) and (A5) gives effective viscosity (8*eta*eta_rot - beta^2)/(2*eta_rot), and Eq. (C7) gives A(nu -> oo) = 8*eta_rot - beta^2.
equation: 8 * eta_bar_rot - beta_bar^2 >= 0 => beta_bar_min = -2 * sqrt(2 * eta_bar_rot)
inputs:
  eta_bar_rot:
    quantity: rotational_viscosity_dimless
    unit: dimensionless
  beta_bar:
    quantity: flow_alignment_dimless
    unit: dimensionless
outputs:
  margin:
    quantity: entropy_production_margin_dimless
    unit: dimensionless
  beta_bar_min:
    quantity: flow_alignment_dimless
    unit: dimensionless
settings: {}
stochastic: false
