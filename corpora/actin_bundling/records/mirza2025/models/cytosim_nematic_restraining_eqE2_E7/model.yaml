id: cytosim_nematic_restraining_eqE2_E7
name: discrete nematic restraining energy E_S and nodal forces (Eqs. E2-E7)
role: model
stated:
  page: 28
  printed_page: 28 of 33
  quote: we introduce a system- wide restraining energy of stiffness
  where: Appendix E.1, Eqs. E2-E7 (pp. 28-29)
equation: E_S(X) = (K_S/2) * |q^s(X) - (S_0/2)*diag(-1, 1)|^2; f^P = -dE_S/dX^P
inputs:
  K_S:
    quantity: restraining_energy_stiffness
    unit: pN*um
  S_0:
    quantity: nematic_order_parameter
    unit: dimensionless
  s_A:
    quantity: filament_segment_length
    unit: um
outputs:
  E_S_isotropic:
    quantity: discrete_nematic_energy
    unit: pN*um
  f_head_mag:
    quantity: force
    unit: pN
  grad_fd_error:
    quantity: force
    unit: pN
settings:
  theta_deg: 45.0
stochastic: false
