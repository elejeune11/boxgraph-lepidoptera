id: cytosim_spring_force_eqE8
name: crosslinker and motor Hookean spring force (Eq. E8)
role: model
stated:
  page: 29
  printed_page: 29 of 33
  quote: apply a force that depends linearly on their elongation
  where: Appendix E.1, Eq. E8 (p. 29)
equation: f = K * (u - ell)
inputs:
  K:
    quantity: spring_stiffness
    unit: pN/um
  u:
    quantity: spring_elongation
    unit: um
  ell:
    quantity: spring_rest_length
    unit: um
outputs:
  f:
    quantity: force
    unit: pN
settings: {}
stochastic: false
