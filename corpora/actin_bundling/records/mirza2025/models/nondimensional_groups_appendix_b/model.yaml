id: nondimensional_groups_appendix_b
name: nondimensional groups and implied dimensional parameters (p. 6, Appendix B, Appendix D)
role: model
stated:
  page: 6
  printed_page: 6 of 33
  quote: Nondimensional analysis reveals a set of nondimensional groups that control the system behavior
  where: text (p. 6), Appendix B (p. 23), Appendix D (p. 27)
equation: k_bar_d = ell_s^2 / ell_D^2 = k_d*t_0, a_bar = (a/eta_rot)*eta_bar_rot*t_0, b_bar = (b/eta_rot)*eta_bar_rot*t_0, c_bar_0 = 2*a_bar - lambda_bar_o, L_bar = L/(eta*D)
