id: nematic_relaxation_eq12
name: uniform nematic order relaxation under restraining penalty (Eq. 12, Fig. 5-S1 IIIe)
role: model
stated:
  page: 14
  printed_page: 14 of 33
  quote: Equation 12 predicts an exponential relaxation given by
  where: Main text, Eq. 12 (p. 14) & Appendix E.3 (p. 31)
equation: eta_rot * dS/dt + K_S * (S - S_0) = 0 => S(t) = S_0 * (1 - exp(-K_S * t / eta_rot)); tau_relax = eta_rot / K_S
inputs:
  S_0:
    quantity: nematic_order_parameter
    unit: dimensionless
  K_S:
    quantity: restraining_energy_stiffness
    unit: pN*um
  eta_rot:
    quantity: discrete_rotational_drag
    unit: pN*um*s
  t:
    quantity: simulation_duration
    unit: s
outputs:
  S_t:
    quantity: nematic_order_parameter
    unit: dimensionless
  S_over_S0:
    quantity: nematic_order_parameter
    unit: dimensionless
  tau_relax:
    quantity: nematic_relaxation_time
    unit: s
settings: {}
stochastic: false
