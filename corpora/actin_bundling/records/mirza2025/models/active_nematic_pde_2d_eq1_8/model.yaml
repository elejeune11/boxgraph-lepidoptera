id: active_nematic_pde_2d_eq1_8
name: 2D periodic nonlinear compressible active nematic PDE solver (Eqs. 1-8, Fig. 2)
role: model
stated:
  page: 4
  printed_page: "4 of 33"
  quote: "To model a thin layer of actomyosin gel, we summarize next a minimal theory for 2D density-dependent compressible active nematic fluids."
  where: "Main text Eqs. 1-8 (pp. 4-5) & Fig. 2a-c (p. 7)"
built_from:
  - marginal_stability_eqC8
equation: "d_t rho + div(rho*v) - D*lap(rho) + k_d*(rho - rho_0) = 0; rho*gamma*v = div(sigma^nem + sigma^diss + sigma^act); eta_rot*q_hat + beta*d^dev - (1/rho)*h - rho*lambda_o*q = 0; omega = (ell_s^2 / (rho_0^2 * |A|)) * integral(grad rho . q . grad rho dS)"
inputs:
  k_d: {quantity: turnover_rate_dimless, unit: dimensionless}
  L: {quantity: frank_constant_dimless, unit: dimensionless}
  c_0: {quantity: effective_susceptibility_c0_dimless, unit: dimensionless}
  b: {quantity: susceptibility_b_dimless, unit: dimensionless}
  eta_rot: {quantity: rotational_viscosity_dimless, unit: dimensionless}
  beta: {quantity: flow_alignment_dimless, unit: dimensionless}
  lambda_o: {quantity: nematic_activity_dimless, unit: dimensionless}
  kappa: {quantity: active_tension_anisotropy, unit: dimensionless}
  activity_ratio: {quantity: activity_supercritical_ratio, unit: dimensionless}
outputs:
  omega: {quantity: architecture_order_parameter, unit: dimensionless}
  rho_max: {quantity: relative_density, unit: dimensionless}
  rho_min: {quantity: relative_density, unit: dimensionless}
  S_max: {quantity: nematic_order_parameter, unit: dimensionless}
settings:
  N_grid: 32
  dt: 0.04
  t_max: 75.0
  L_mult: 2.0
  pcg_maxiter: 4
  seed: 1
stochastic: false
