id: static_tension_components_norm_eq11
name: static normalized parallel and perpendicular active tensions (Eq. 11, Fig. 5c)
role: model
stated:
  page: 14
  printed_page: "14 of 33"
  quote: "in the absence of nematic gradients and flow, the tension components"
  where: "Eq. 7 (p. 5), Fig. 1(c) (p. 3), Fig. 5(c) (p. 13), & Eq. 11 (p. 14)"
built_from:
  - static_active_tensions_eq11
equation: "sigma_par / sigma_bar = 1 + kappa * S / 2; sigma_perp / sigma_bar = 1 - kappa * S / 2"
inputs:
  kappa:
    quantity: active_tension_anisotropy
    unit: dimensionless
  S:
    quantity: nematic_order_parameter
    unit: dimensionless
  t_norm:
    quantity: time_dimless
    unit: dimensionless
outputs:
  sigma_par_norm:
    quantity: normalized_tension
    unit: dimensionless
  sigma_perp_norm:
    quantity: normalized_tension
    unit: dimensionless
settings: {}
stochastic: false
