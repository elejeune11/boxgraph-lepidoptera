# Cross-record validations evaluating Mechanism 3 (chiral-twist equilibrium bundle diameter,
# Grason & Bruinsma 2007) against measured Lepidoptera actin bundle width in Lloyd et al. (2024).

- id: val_chiral_onset_micro_diameter_vs_lloyd2024_blue
  model: bundle_diameter_from_radius
  inputs:
    R: R0_onset_from_micro_lam3
  output: D
  against: lloyd2024/actin_bundle_width_blue
  purpose: validation
  quantities:
    "lloyd2024/actin_bundle_width": bundle_diameter
  conditions_ok: >
    Mechanism 3 (chiral-twist equilibrium bundle-size limitation): evaluates Grason & Bruinsma
    (2007)'s F-actin chiral-onset bundle diameter D = 2*R_0 = 2*lambda_{3,perp} from microscopic
    F-actin elastic/linker scaling (R_0 = 55.0 nm -> D = 110.0 nm; zero new added parameters)
    against Lloyd et al. (2024)'s measured iridescent blue Heliconius sara pupal actin bundle
    width (0.438 +/- 0.004 um = 438 +/- 4 nm, Fig. 2J).
  basis: >
    Tests whether equilibrium chiral-twist frustration of F-actin bundles alone predicts the
    measured ~0.44 um width of butterfly scale actin bundles (which, under mass conservation,
    would in turn constrain bundle number and spacing).
  note: >
    Computes D = 110.0 nm (0.110 um) vs 438 +/- 4 nm (0.438 +/- 0.004 um; -74.9%, 3.98x smaller;
    not reproduced). Even subtracting a generous 250 nm confocal PSF in quadrature from 438 nm
    (giving ~360 nm) leaves butterfly scale bundles 3.3x wider than Grason's microscopic chiral
    onset diameter.

- id: val_chiral_onset_printed_diameter_vs_lloyd2024_blue
  model: bundle_diameter_from_radius
  inputs:
    R: R0_onset_from_printed_lam3
  output: D
  against: lloyd2024/actin_bundle_width_blue
  purpose: validation
  quantities:
    "lloyd2024/actin_bundle_width": bundle_diameter
  conditions_ok: >
    Mechanism 3 (chiral-twist equilibrium bundle-size limitation): evaluates Grason & Bruinsma
    (2007)'s printed F-actin onset diameter D = 2*lambda_{3,perp} using printed lambda_{3,perp}
    = 100 nm (D = 200.0 nm; zero new added parameters) against Lloyd et al. (2024)'s measured
    iridescent blue Heliconius sara pupal actin bundle width (0.438 +/- 0.004 um = 438 +/- 4 nm).
  basis: >
    Upper-bound chiral-twist onset diameter check (200 nm) against measured Heliconius sara
    pupal actin bundle width (438 +/- 4 nm).
  note: >
    Computes D = 200.0 nm (0.200 um) vs 438 +/- 4 nm (-54.3%, 2.19x smaller; not reproduced, and
    still 1.80x smaller than a 250 nm PSF-deconvolved 360 nm lower bound). Together with
    haviv2008's packing check (2,368 vs ~20-200 filaments), Mechanism 3 shows that butterfly
    scale actin bundles are substantially wider than single twist-capped in vitro F-actin
    cylinders (and Lloyd's +20% higher total actin footprint in blue scales also rules out pure
    fixed-actin width-to-spacing mass conservation).
