- id: dE_surface_ratio_added
  quantity: surface_linker_binding_energy_ratio
  unit: dimensionless
  printed: "3"
  basis: "Paper states on p. 4 that surface linker binding energy Delta E* is reduced below bulk Delta E (e.g. by surfactants) so that Sigma_c(mu_c)/Sigma exceeds 1, without giving a numerical ratio. At printed midpoints (d = 5.5 nm, P = 5.5 nm, lambda_{3 perp} = 100 nm), (d/P)^(4/3)*(d/lambda_{3 perp})^(1/3) = 0.380, requiring Delta E/Delta E* > 2.63."
  alternatives: ["1", "2", "10"]
  stands_for: "Delta E / Delta E* in the p. 4 stability criterion"
  conditions:
    polymer_system: "F-actin"

- id: kBT_added
  quantity: thermal_energy
  unit: "pN*nm"
  printed: "4.11"
  basis: "Standard room-temperature thermal energy k_B T at 298 K; paper leaves T unstated and expresses Delta E in units of k_B T."
  alternatives: ["4.0", "4.28"]
  stands_for: "k_B T in Eq. (7) and p. 4 dimensional microscopic scalings"

- id: mu_perp_added
  quantity: in_plane_shear_modulus
  unit: "pN / nm**2"
  printed: "0.33"
  basis: "Representative F-actin continuum shear modulus estimated from microscopic scaling mu_perp ~ Delta E / (d^2 * l) using p. 4 scales (Delta E = 10 k_B T = 41.1 pN*nm, d ~ l ~ 5 nm); paper does not state a numerical value for mu_perp."
  alternatives: ["0.04", "4.0"]
  stands_for: "mu_perp in Eq. (5) effective modulus definition"

- id: K2_added
  quantity: frank_twist_modulus
  unit: pN
  printed: "8.2"
  basis: "Representative F-actin Frank twist constant estimated from microscopic scaling K_2 ~ Delta E / l (p. 4: gamma ~ K_2/P ~ Delta E/(l*P)) using Delta E = 41.1 pN*nm and l = 5 nm; paper does not state a numerical value for K_2."
  alternatives: ["4.0", "40.0"]
  stands_for: "K_2 in Eq. (5) effective modulus definitions"

- id: K3_added
  quantity: frank_bend_modulus
  unit: pN
  printed: "820"
  basis: "Representative F-actin Frank bend constant estimated from K_3 ~ k_B T * l_p / d^2 using p. 4 scales (k_B T = 4.11 pN*nm, l_p = 5 um, d = 5 nm), satisfying K_3 >> K_2; paper does not state a numerical value for K_3."
  alternatives: ["200", "4000"]
  stands_for: "K_3 in Eq. (5) effective modulus definitions"

- id: mu_par_added
  quantity: out_of_plane_shear_modulus
  unit: "pN / nm**2"
  printed: "0.33"
  basis: "Representative out-of-plane shear modulus for 3D hexagonal-solid bundles; paper assumes mu_par_bar ~= mu_perp_bar on p. 3 col 2 without giving a numerical value."
  alternatives: ["0.1", "1.0"]
  stands_for: "mu_parallel in Eq. (9)"

- id: epsilon_added
  quantity: achiral_aggregation_energy_density
  unit: "pN / nm**2"
  printed: "0.33"
  basis: "Representative achiral aggregation energy density epsilon ~ Delta E / (d^2 * l) for F-actin; paper does not give a numerical value for epsilon."
  alternatives: ["0.1", "1.0"]
  stands_for: "epsilon in Eq. (6) and mu_c = -epsilon*L/rho_0"

- id: Sigma_added
  quantity: surface_tension
  unit: "pN / nm"
  printed: "0.5"
  basis: "Representative bundle-solvent surface tension chosen below Sigma_c (1.44 pN/nm for printed f0 and 0.57 pN/nm for corrected f0 at the F-actin benchmark parameters) so equilibrium finite bundles exist in Eq. (6)."
  alternatives: ["0.1", "0.4"]
  stands_for: "Sigma in Eq. (6) and low-Sigma/solid radius scalings"

- id: R_eval_added
  quantity: bundle_radius
  unit: nm
  printed: "100"
  basis: "Representative bundle radius R = 100 nm (~ lambda_{3 perp}) used to evaluate continuum energy functionals Eqs. (5)-(7), (9), and Omega_0(R); paper does not state a numerical evaluation radius."
  alternatives: ["50", "200"]
  stands_for: "R in Eqs. (5)-(7), (9), and Omega_0(R)"

- id: Omega_eval_added
  quantity: torsional_strain
  unit: "1 / nm"
  printed: "0.005"
  basis: "Representative torsional strain giving small outer tilt angle theta = Omega*R = 0.5 < 1 at R = 100 nm, as required by p. 2 col 2; paper does not state a numerical evaluation Omega for Eqs. (5) and (9)."
  alternatives: ["0.001", "0.01"]
  stands_for: "Omega in Eqs. (5) and (9)"

- id: L_eval_added
  quantity: filament_length
  unit: nm
  printed: "1000"
  basis: "Representative filament length L = 1 um >> R (satisfying L >> R on p. 2 col 1) for evaluating mu_c and continuum phase-boundary models; paper does not state a numerical value for L."
  alternatives: ["500", "5000"]
  stands_for: "L in Eq. (6), Eq. (7), and mu_c"

- id: rho0_added
  quantity: chain_area_density
  unit: "1 / nm**2"
  printed: "0.04"
  basis: "Representative chain areal density rho_0 ~ 1/d^2 for d = 5 nm; paper does not state a numerical value for rho_0."
  alternatives: ["0.01", "0.2"]
  stands_for: "rho_0 in Eq. (7) and mu_c"

- id: delta_mu_added
  quantity: filament_chemical_potential
  unit: "pN*nm"
  printed: "500"
  basis: "Representative chemical-potential undercooling (mu_c - mu) > 0 below bulk condensation for evaluating the away-from-bulk-condensation critical surface tension Sigma_c(mu); paper does not state a numerical value."
  alternatives: ["50", "5000"]
  stands_for: "mu_c - mu in p. 3 col 2 Sigma_c(mu)"

- id: Sigma_solid_added
  quantity: surface_tension
  unit: "pN / nm"
  printed: "0.05"
  basis: "Low surface tension satisfying Sigma/gamma << 1 (Footnote 21: gamma*theta > 2*Sigma) so that a dispersed finite-size bundle minimum exists in the 3D solid phase Eq. (9); paper does not state a numerical value."
  alternatives: ["0.01", "0.1"]
  stands_for: "Sigma in p. 3 col 2 solid-phase bundle radius scalings and Footnote 21"

