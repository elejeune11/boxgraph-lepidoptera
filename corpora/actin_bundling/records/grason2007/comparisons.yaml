- id: cmp_lambda_3perp_factin
  purpose: reproduction
  computed: lambda_3perp_factin_pred
  printed: factin_lambda_3perp_est
  note: "Microscopic scaling lambda_{3 perp} ~ (d * l_p * k_B T / Delta E)^(1/2) evaluated at printed F-actin inputs (d ~ 1-10 nm, l_p ~ 1-10 um, Delta E ~ 10 k_B T) gives 55.0 nm (range 10-100 nm across input endpoints), compared against printed ~100 nm (prefactor unknown; implied prefactor 1.82)."

- id: cmp_cholesteric_pitch_factin
  purpose: reproduction
  computed: cholesteric_pitch_factin_pred
  printed: factin_cholesteric_pitch_est
  note: "Inferred cholesteric pitch P ~ (Delta E / k_B T) / (d * l_p * (2*pi/Lambda)^3) at printed F-actin inputs (d ~ 1-10 nm, l_p ~ 1-10 um, Delta E ~ 10 k_B T, 2*pi/Omega ~ 100 nm) gives 1.33 nm at linear midpoints (4.03 nm at geometric means; 0.40-40.3 nm across input endpoints), compared against printed P ~ 1-10 nm (prefactor unknown)."

- id: cmp_stability_ratio_factin
  purpose: reproduction
  computed: stability_ratio_factin_pred
  printed: factin_stability_threshold
  note: "Microscopic stability ratio Sigma_c(mu_c)/Sigma ~ (d/P)^(4/3) * (d/lambda_{3 perp})^(1/3) * (Delta E / Delta E*) exceeds 1 when surface linker binding energy Delta E* is reduced below bulk Delta E (here Delta E/Delta E* = 3 gives 1.14; at unreduced Delta E/Delta E* = 1 it gives 0.38 < 1)."

