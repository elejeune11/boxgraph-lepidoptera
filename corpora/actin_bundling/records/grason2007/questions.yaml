- id: q_audit_solid_equilibrium_spinodal_vs_coexistence
  kind: reading
  about:
    - solid_equilibrium_radius_muc
    - run_solid_R0_exact
  text: >
    The solver solid_equilibrium_radius_muc returns a finite bundle radius R_0 whenever
    Sigma <= peak_val, where peak_val = max_R [Omega_0(R)^4 * R^3 * (mu_perp_bar * R^2 + 2 * K3_bar)]
    is the spinodal surface tension (where a local minimum at R > 0 first forms), rather than
    the thermodynamic coexistence threshold Sigma_{c,solid} = max_{R > 0} [-(1/2) * R * E_elast_min(R)]
    where Delta F(R_0) = 0. On p. 3 col 1-2 the paper defines a thermodynamically stable dispersed
    phase as requiring a negative minimum Delta F(R_0) < 0 (below the R = 0 boundary minimum),
    which columnar_equilibrium_radius_muc enforces by returning None for Sigma > Sigma_c. At the
    record's F-actin continuum benchmark parameters, Sigma_{c,solid} = 0.3410 pN/nm (at R_c =
    16.57 nm) while peak_val = 0.3792 pN/nm (at R_peak = 9.27 nm); for Sigma in (0.3410, 0.3792]
    pN/nm (e.g. Sigma = 0.36 pN/nm gives R_0 = 14.14 nm with Delta F(R_0)/L = +1.84 pN > 0),
    solid_equilibrium_radius_muc returns a metastable local minimum rather than None. Current
    runs (Sigma_solid_added = 0.05 pN/nm) and relation regimes lie well below Sigma_{c,solid}
    and are unaffected.
  citation:
    page: 3
    printed_page: "098101-3"
    quote: "for sufficiently low surface energies and near"
    where: "text, p. 3 col 2"

