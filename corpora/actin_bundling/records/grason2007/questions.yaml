- id: q_mu_perp_bar_25_over_216_unstated_derivation
  kind: unstated_model
  about:
    - effective_in_plane_shear_modulus
    - columnar_elastic_energy_eq5
  text: >
    Below Eq. (5) (p. 2 col 1), the paper states mu_perp_bar = 25*mu_perp/216 for an incompressible
    array while deferring the full derivation of the radial relaxation to future work ("We will show
    elsewhere"). Solving the 2D circular-cross-section radial elastic equilibrium of Eqs. (1)-(2)
    with free boundary sigma_rr(R) = 0 in the incompressible limit (lambda_perp -> oo) gives
    u_r(r) = (1/8)*Omega^2*r^3 and disk-averaged energy density (3/32)*mu_perp*(Omega*R)^4
    (3/32 = 0.09375 vs 25/216 ~= 0.11574). Because the paper does not give its derivation of 25/216,
    the printed coefficient is kept without a variant.
  citation:
