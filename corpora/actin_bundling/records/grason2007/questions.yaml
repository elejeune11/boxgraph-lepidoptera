    - claessens2008/Delta_theta_fig3d_ca3
    - claessens2008/D_ratio_fig4d
    - claessens2008/DeltaG_fascin_printed
  text: >
    No cross-record validations are entered in validations.yaml for grason2007 models against
    claessens2008 measurements, because no model of grason2007 predicts any measured datum of
    claessens2008 on its own experimental conditions:
    (1) Bundle diameter curve claessens2008/D_fig1c_measured (8 TEM points over R* in [0.0089, 0.90],
    rising from 8.41 nm to a plateau of 28.14 and 28.04 nm at R* = 0.70 and 0.90; no standalone scalar
    plateau diameter or radius datum is printed in claessens2008 text): grason2007 has no model taking
    bound cross-linker-to-actin molar ratio R* (effective_bound_ratio) as an input, so neither
    bundle_diameter_from_radius (D = 2*R) nor any continuum equilibrium-radius model can sweep over
    D_fig1c_measured. Moreover, all continuum radius models (critical_surface_tension_eq8,
    columnar_equilibrium_radius_muc, columnar_radius_low_sigma, solid_equilibrium_radius_muc,
    solid_radius_bending_regime, solid_radius_shear_regime) output bundle_radius (not bundle_diameter)
    and require unmeasured continuum elastic moduli (mu_perp, mu_parallel, K_2, K_3), preferred
    cholesteric pitch P or chiral torque gamma, and surface tension Sigma (plus mu_c - mu, rho_0, L
    away from bulk condensation), none of which are measured in claessens2008 or numerically stated for
    F-actin in grason2007. Grason's microscopic onset scaling lambda_3perp_microscopic
    (lambda_{3 perp} ~ (d*l_p*k_B T/Delta E)^(1/2), prefactor: unknown) outputs a minimum columnar
    radius at saturated linker coverage (l ~ d) assuming freely sliding chains: substituting
    claessens2008/aH_hex_saxs (d = 12.4 nm) and claessens2008/DeltaG_fascin_printed (Delta E/k_B T ~=
    15, exact 15.02) gives lambda_{3 perp} = 28.7-90.9 nm (onset diameter 2*lambda_{3 perp} =
    57.5-181.7 nm across l_p = 1-10 um; 236.9 nm at l_p = 17 um), compared to Claessens's hydrated
    2-shell SAXS area-equivalent diameter 56.8-58.2 nm (n_f = 19-20) and TEM plateau 28.1 nm (see
    claessens2008/q_tem_vs_saxs_bundle_diameter). Rigid fascin cross-linkers suppress axial sliding
    (placing fascin bundles in Grason's 3D solid phase Eq. 9, whose radius is smaller than columnar by
    an unmeasured (Sigma/gamma)^(8/3) factor), and extending Grason's scalings via l ~ 1/R* predicts
    decreasing or constant R_0(R*) rather than Claessens's rising D ~ (R*)^(+0.3)
    (claessens2008/q_grason2007_diameter_Rstar_scaling_and_onset_size).
    (2) Helical overtwist measurements (claessens2008/Delta_theta_max ~= 1 deg and
    Delta_theta_fig3d_ca0p8, ca2, ca3 vs R*): claessens2008 measures internal single-filament helical
    overtwist per actin monomer in straight, unbraided F-actin/fascin bundles (omega_fil =
    Delta_theta/d = 0.00595 nm^-1 at saturation, wavelength 1056 nm), whereas grason2007's torsion
    models (columnar_optimal_torsion, small_bundle_torsion_microscopic, solid_elastic_energy_min_eq9,
    solid_harmonic_min_printed/corrected) predict macroscopic whole-bundle supertwist/braiding rate
    Omega and outer filament tilt angle theta = Omega*R (explicitly distinct physical observables;
    mapping monomer_overtwist to outer_tilt_angle or torsional_strain would be physically invalid).
    (3) Other claessens2008 measurements (aH_hex_saxs = 12.4 nm, q10_saxs = 0.585 nm^-1, nf_max ~= 20,
    D_fil_fig2d = 5-6 filaments, Rstar_plateau ~= 0.25, Rstar_figS1_experiment, ca_fig2e droplet phase
    boundaries, D_ratio_fig4d ~= 3 for fascin+espin composite bundles, SAXS intensities and helical
    layer-line peaks): grason2007 treats in-plane spacing d (chain_spacing) strictly as an input, has
    no model outputting filament count, bundle width in filaments, bound linker ratio, droplet critical
    concentration, SAXS profiles, or multi-ABP composite diameter ratios (solid_to_columnar_radius_ratio
    is a distinct ratio R_{0,solid}/R_{0,col} << 1). Claessens also records no standalone axial
    linker_spacing datum to test saturated_linker_spacing (l ~ d, prefactor: unknown), though its 1:4.5
    saturation stoichiometry at d_monomer = 2.9 nm implies 13.05 nm per filament, close to a_H = 12.4 nm.
  citation:
    page: 4
    printed_page: "098101-4"
    quote: "The bundle radius at the onset of aggregation"
    where: "text, p. 4 col 1"

