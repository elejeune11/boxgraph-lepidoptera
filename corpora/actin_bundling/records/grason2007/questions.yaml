- id: q_audit_footnote21_stability_and_ratio_bound
  kind: possible_error
  about:
    - solid_to_columnar_radius_ratio
    - solid_harmonic_min_printed
    - solid_radius_bending_regime
    - solid_radius_shear_regime
    - ref-21
  text: >
    Two mathematical issues in Footnote [21] (p. 4 col 2) are not recorded elsewhere: (1) The
    printed dispersed-phase stability condition gamma*theta > 2*Sigma matches either the weaker
    necessary bound obtained by dropping all positive elastic penalty terms in Eq. (9) or the
    paper's factor-of-2-inflated harmonic energy E_elast ~= -gamma^2 / (2 * mu_par_bar * R^2) =
    -gamma*theta_0/R; using the corrected harmonic energy -gamma^2 / (4 * mu_par_bar * R^2) =
    -(1/2)*gamma*theta_0/R, stability Delta F/L < 0 in the harmonic solid regime requires the
    twice-stronger condition gamma*theta_0 > 4*Sigma (still implying Sigma/gamma << 1). (2) The
    claim that solid bundles are smaller than columnar aggregates "by a factor [at] least as small
    as (Sigma/gamma)^(8/3)" reverses the regime bound: (Sigma/gamma)^(8/3) is the scaling ratio in
    the low-Sigma shear-dominated regime (R_{0,solid} >> lambda_{3 perp}, mu_par_bar ~= mu_perp_bar,
    with exact asymptotic prefactor 2^(20/3) ~= 101.6 using corrected f_0 or 2^(8/3) ~= 6.35 using
    printed f_0), whereas in the bending-dominated regime (R_{0,solid} << lambda_{3 perp}),
    R_{0,solid} ~ (K3_bar/Sigma)^(1/5)*(gamma/mu_par_bar)^(4/5) is larger than the shear-regime
    scaling by (lambda_{3 perp}/R_{0,solid,shear})^(2/5) > 1, so R_{0,solid}/R_{0,col} is larger
    (not smaller) than (Sigma/gamma)^(8/3) (scaling as (Sigma_c/gamma)^(8/5) >> (Sigma_c/gamma)^(8/3)
    at Sigma = Sigma_{c,col}, though still << 1).
  citation:
    page: 4
    printed_page: "098101-4"
    quote: "bundles is smaller than columnar aggregates by a factor"
    where: "Ref. 21"

- id: q_audit_cholesteric_pitch_2pi_convention
  kind: reading
  about:
    - chiral_torque_coupling
    - cholesteric_pitch_from_torsion
    - factin_cholesteric_pitch_est
    - factin_twist_pitch_ikawa2007
  text: >
    Eq. (3) (p. 2 col 1) writes the Frank twist energy as K_2*(nabla_perp x t - z_hat/P)^2 and
    calls P the preferred cholesteric pitch (without a 2*pi factor, so P = q_0^(-1) is the inverse
    preferred twist wavenumber rather than the full 2*pi cholesteric repeat pitch 2*pi/q_0), giving
    gamma = 2*K_2/P below Eq. (5). On p. 4 col 1, however, the paper explicitly retains 2*pi in the
    measured small-bundle twist pitch 2*pi/Omega ~ 100 nm (Ref. 22) when inverting
    Omega_{R->d} ~ (gamma / (k_B T * l_p))^(1/3) with gamma ~ Delta E / (l * P) to obtain
    P ~ 1-10 nm. Under the standard full-pitch convention q_0 = 2*pi/P_full, the inferred full
    cholesteric pitch would be 2*pi times larger (~6-60 nm; 8.4 nm at linear midpoints, 25 nm at
    geometric means). Because the p. 4 scaling models carry prefactor: unknown, the 2*pi factor is
    absorbed into the unknown prefactor within this record, but it is relevant if P is compared
    cross-paper against full cholesteric pitch measurements.
  citation:
    page: 2
    printed_page: "098101-2"
    quote: "a cholesteric, liquid crystal phase of pitch"
    where: "Eq. 3 and text below"

