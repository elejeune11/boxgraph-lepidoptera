    literature citations from Borukhov et al. (2005) [dutta2016/ref-11 = grason2007/ref-8] with
    approximate "~" precision:
    (a) dutta2016/screening_length_actin (~1 nm, screening_length_physical): grason2007 is a purely
    elastic continuum theory of chiral bundles with no electrostatics, salt concentration, or Debye
    screening-length model or quantity (and p. 1 explicitly rejects electrostatic-screening control of
    F-actin bundle size).
    (b) dutta2016/filament_thickness_actin (~8 nm, typed in dutta2016 as in_plane_radius_of_gyration
    by qualitative analogy between sqrt(L/(beta*epsilon)) and single-filament thickness): grason2007
    has no model predicting single-filament diameter or single-chain transverse radius of gyration.
    All [length]-outputting models in grason2007 predict multi-filament bundle geometry
    (bundle_diameter, bundle_radius, characteristic_length_lambda3), preferred cholesteric pitch
    (cholesteric_pitch), or axial cross-linker spacing along the bundle axis
    (saturated_linker_spacing, l ~ d, prefactor: unknown), whereas inter-filament spacing d
    (chain_spacing) is strictly an input rather than a model output.
    (2) The remaining 21 entries in dutta2016/data.yaml are non-measured theoretical inputs and
    outputs: 10 dimensionless SALR parameter settings (rho_star_1, Gamma_R_fig2_3, lambda_R_fig2_3a,
    lambda_A_fig2_3, Gamma_A_fig2_no_bundle, Gamma_A_fig2_finite, Gamma_A_fig2_macro, Gamma_A_fig3b,
    Gamma_R_fig4, lambda_A_fig4; origin: reported) and 11 digitized theoretical prediction curves
    (betaV_fig2a_*, F_fig2b_*, bundle_size_fig3a, bundle_size_fig3b, bundle_size_over_lR_fig3b_inset,
    lambda_R_finite_fig4, lambda_R_infinite_fig4; origin: predicted). Even apart from not being
    experimental measurements, all 11 curves are dimensionless observables of an achiral SALR
    spinodal theory swept over (k, Gamma_A, lambda_R), whereas grason2007's bundle-radius and
    diameter models output physical lengths in nm over disjoint chiral-elastic parameters (gamma,
    mu_perp_bar, mu_par_bar, K3_bar, Sigma, mu_c - mu, or d, l_p, Delta E, P), and grason2007's
    dimensionless outputs (outer_tilt_angle, solid_to_columnar_radius_ratio, bundle_stability_ratio)
    are physically unrelated to dutta2016's SALR observables.

