  text: >
    No cross-record validations are entered in validations.yaml for grason2007's 35 models against
    weirich2017's 35 origin: measured data (12 scalars, 23 digitized figure datasets), because no
    model of grason2007 genuinely predicts any measured datum of weirich2017 on Weirich et al.'s
    experimental conditions:
    (1) Sole quantity-matched measured datum — initial fluid bundle radius
    weirich2017/bundle_initial_radius_main ("~200" nm, bundle_radius, p. 5, Fig. 4A-B):
    (a) Fundamental physical regime mismatch: weirich2017's R_0 ~ 200 nm bundles are rapidly
    assembled (~1 min), out-of-equilibrium, thermodynamically UNSTABLE liquid nematic columns (formed
    near the liquid-solid boundary at 0.25-0.5 mol % capping protein, L_f ~ 0.54-1.08 um, and 10 mol %
    long flexible ~150 nm filamin) that destabilize over ~10 min via Rayleigh-Plateau pearling
    (Fig. 4A) or 20-60% axial contraction into tactoids (Fig. 4B-C). By contrast, grason2007 predicts
    the thermodynamically stable equilibrium finite radius R_0 of helically twisted hexagonal-columnar
    (Eqs. 5-8) or hexagonal-solid (Eq. 9) bundles stabilized by chiral twist torque (-gamma*Omega)
    balanced against in-plane/out-of-plane hexagonal lattice shear (mu_perp, mu_parallel) and Frank
    bend (K_3). In weirich2017's diffusive liquid phase (FRAP D ~ 3 x 10^-3 um^2/s, eta ~ 3 Pa*s,
    homogeneous untwisted director n_hat = z_hat), static hexagonal lattice shear vanishes
    (mu_perp = mu_parallel = 0) and chiral torque vanishes (gamma = 0), where grason2007 p. 3
    explicitly notes that lambda_{3 perp} diverges as mu_perp_bar -> 0 and Sigma_c -> 0 — placing
    weirich2017 in grason2007's achiral unbounded-coarsening limit (verified in
    weirich2017/q_grason2007_parameter_regime_in_weirich2017).
    (b) Unmeasured continuum inputs and uncalibrated parameter sensitivity: none of the continuum
    inputs required by columnar_equilibrium_radius_muc, columnar_radius_low_sigma,
    columnar_critical_surface_tension_exact, solid_equilibrium_radius_muc,
    solid_radius_bending_regime, or solid_radius_shear_regime (mu_perp, mu_parallel, K_2, K_3,
    cholesteric pitch P, chiral torque gamma, or chemical-potential undercooling mu_c - mu) are
    measured in weirich2017 or numerically stated in grason2007. Diagnostically, substituting
    weirich2017's derived tactoid isotropic tension gamma_I_est_main (~300 nN/m = 3.0 x 10^-4 pN/nm,
    origin: derived, 1350-4500x below grason2007's tight-bundle cohesive scale Delta E/d^2) together
    with grason2007/added.yaml tight-bundle benchmark moduli yields R_0 = 2.99 x 10^11 nm (~300 m,
    corrected f_0) or 4.79 x 10^12 nm (~4.8 km, printed f_0; 7.67 x 10^13 nm unit-prefactor low-Sigma
    scaling) in columnar_equilibrium_radius_muc, while solid_equilibrium_radius_muc gives 249.8 nm at
    the arbitrary tight-bundle benchmark point but swings 11,686x (18.5 nm to 215.7 um) across
    grason2007/added.yaml's own stated parameter alternatives — an uncalibrated artifact on a
    non-solid fluid column.
    (c) Microscopic scaling and onset-radius models: lambda_3perp_microscopic (lambda_{3 perp} ~
    (d*l_p*k_B T/Delta E)^(1/2), prefactor: unknown, outputting characteristic_length_lambda3 rather
    than bundle_radius) assumes saturated linkers (l ~ d) and static lattice shear
    mu_perp ~ Delta E/(d^2*l), whereas weirich2017 measures neither inter-filament spacing d nor
    filamin binding energy Delta E/(k_B T) (only reporting literature filament_persistence_length_si
    ~ 10 um; back-calculating d_hex ~= 53.3 nm from tactoid c_A ~ 250 uM with invented Delta E =
    10 k_B T yields 230.9 nm, or 326.5 nm at 5 k_B T, versus grason2007's 55.0 nm midpoint / ~100 nm
    printed estimate — a coincidental order-of-magnitude number on unmeasured inputs with unknown
    prefactor). critical_surface_tension_eq8 (R_0 = lambda_{3 perp}) simply echoes its lambda_{3 perp}
    input (and feeding factin_lambda_3perp_est "~100" nm strips prefactor: unknown provenance per
    q_audit_onset_diameter_validation_prefactor_loss). Furthermore, "~200" nm is an approximate
    diffraction-limited visual estimate with no printed precision (BoxGraph verdict: no verdict).
    (2) All remaining 34 origin: measured data in weirich2017 have no physically matching output in
    grason2007:
    (a) Bundle contour length and phase-diagram windows (6 data: bundle_initial_length "> 50" um,
    filament_length_tactoid_range "0.1 to 1" um, filamin_frac_tactoid_range "1 to 10" %, and Fig. 1D
    datasets d_fig1d_gas, d_fig1d_liquid_droplets, d_fig1d_fluid_bundles,
    d_fig1d_viscoelastic_networks): grason2007 treats filament/bundle length L strictly as a fixed
    input (L >> R) and has no cross-linker mole fraction or gas/tactoid/fluid-bundle/network phase
    diagram model (its phase diagram is in chemical potential mu vs surface tension Sigma).
    (b) Tactoid major-axis lengths and coarsening/coalescence trajectories (6 data:
    tactoid_length_growth_60min "~1 to 4" um, tactoid_length_homogeneous_si "~5" um, Fig. 3A
    d_fig3a_length_data, and Fig. 3B d_fig3b_pre_upper, d_fig3b_pre_lower, d_fig3b_coalesced_data):
    grason2007 models uniform-radius fixed-length static cylinders with no tactoid geometry,
    coarsening, coalescence, or time variable.
    (c) Tactoid aspect ratios (4 data: aspect_ratio_2p5_filamin "~3", aspect_ratio_15_filamin "~2",
    Fig. 2A d_fig2a_aspect_ratio, Fig. 3A d_fig3a_aspect_ratio_data): grason2007 has no tactoid cusp
    shape, anchoring ratio omega = gamma_A/gamma_I, or aspect-ratio output (its dimensionless outputs
    are outer_tilt_angle, solid_to_columnar_radius_ratio, and bundle_stability_ratio).
    (d) Rayleigh-Plateau pearling instability wavelength and ratio (2 data: capillary_lambda_observed
    "~10" um, capillary_lambda_to_R0_observed "~10 to 100"): grason2007 assumes axially uniform
    cylinders (R independent of z) with no varicose instability or hydrodynamic dispersion (its
    cholesteric/twist pitches and transverse bend-shear length lambda_{3 perp} are physically distinct
    from axial capillary pearling).
    (e) Dynamical timescales and coalescence relaxation times (5 data: bundle_shape_change_timescale
    "~10" min, Fig. 3C inset d_fig3c_inset_5pct, d_fig3c_inset_10pct, and Fig. 3D d_fig3d_5pct_data,
    d_fig3d_10pct_data): grason2007 is purely static equilibrium elasticity with zero [time]-valued
    quantities or models and no viscosity eta.
    (f) Bundle contractile strain and axial contraction curves (7 data:
    bundle_contractile_strain_range "20 to 60" %, Fig. 4E d_fig4e_contractile_strain, Fig. 4C
    d_fig4c_2p5pct_data, d_fig4c_10pct_data, and Fig. 4D d_fig4d_2p5pct, d_fig4d_5pct, d_fig4d_10pct):
    grason2007 fixes bundle length L and models no axial contraction or strain.
    (g) FRAP fluorescence recovery curves (3 data: Fig. 1C d_fig1c_frap_data and Fig. S1
    d_figS1_bleached, d_figS1_unbleached): grason2007 has no diffusion, photobleaching, or
    fluorescence intensity model.
    (3) Non-measured experimental summaries in weirich2017 (origin: derived, fitted, estimated, or
    predicted — e.g., anchoring strength omega_range_fig2a_si / omega_fig2a_* / d_fig2a_omega,
    isotropic tension gamma_I_est_main ~ 300 nN/m, viscosity eta_frap_est ~ 3 Pa*s, diffusion
    D_frap_est ~ 0.3 x 10^-2 um^2/s, FRAP tau_R_frap_*, coarsening_exponent_measured = 0.47 +/- 0.01,
    Table S1 dynamic fits, capillary_lambda_max_predicted ~ 4 um, and c_actin_tactoid_est = 250 uM)
    are neither origin: measured nor predicted by grason2007 (in particular, critical_surface_tension_eq8
    outputs an upper stability bound Sigma_c rather than the physical liquid interfacial tension
    gamma_I, and vanishes as gamma -> 0 in Weirich's achiral fluid regime).
    See also weirich2017/q_grason2007_no_cross_validation for the reverse direction.


