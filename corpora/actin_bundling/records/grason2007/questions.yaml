- id: q_f0_prefactor_factor_16_vs_256
  kind: possible_error
  about:
    - columnar_f0
    - columnar_f0_corrected
    - columnar_free_energy_eq6
    - columnar_free_energy_from_eq5
    - rel_eq5_to_eq6_printed
  text: >
    Below Eq. (6) (p. 2 col 2), the paper prints f_0 = 3*pi*(gamma^4 / (16 * mu_perp_bar))^(1/3).
    However, substituting the paper's own optimal torsional strain Omega_0(R) =
    (gamma / (4 * mu_perp_bar))^(1/3) * R^(-2/3) * (R^2 + lambda_{3 perp}^2)^(-1/3) into Eq. (5)
    (with K_2 << K_3) gives E_elast(R, Omega_0) = -(3/4) * gamma * Omega_0(R), so
    pi * R^2 * E_elast(R, Omega_0) yields f_0 = (3*pi/4) * (gamma^4 / (4 * mu_perp_bar))^(1/3) =
    3*pi*(gamma^4 / (256 * mu_perp_bar))^(1/3). The printed 16 appears to come from moving 1/4
    inside the cube root without cubing it (4 * 4 = 16 instead of 4^3 * 4 = 256), inflating f_0
    and Sigma_c (Eq. 8) by 2^(4/3) ~= 2.52, and inflating the exact prefactor of the low-Sigma
    bundle radius R_0 = (f_0/(3*pi*Sigma))^3 by a factor of 16.
  citation:
    page: 2
    printed_page: "098101-2"
    quote: "is a surface tension"
    where: "text, below Eq. 6"

- id: q_sigma_c_far_dimensional_and_algebraic_error
  kind: possible_error
  about:
    - critical_surface_tension_far_printed
    - critical_surface_tension_far_corrected
    - columnar_critical_surface_tension_exact
    - rel_exact_sigma_c_to_far_printed
  text: >
    On p. 3 col 2 top, the paper prints Sigma_c ~= f_0^(3/2) * 3^(-1/2) * lambda_{3 perp}^(-1) *
    (mu_c - mu)^(-3/2) for the critical surface tension far from bulk condensation (mu << mu_c).
    This expression is dimensionally inconsistent: from Eq. (6) [f_0] = E * L^(-5/3), from Eq. (7)
    [mu] = [mu_c] = E (energy per filament), so the printed RHS has dimension L^(-7/2) instead of
    surface tension E * L^(-2) (and even if mu_c - mu were read as energy density delta =
    (rho_0/L)*(mu_c - mu), the RHS has dimension L, i.e., length). Expanding Eqs. (6)-(7) for
    R << lambda_{3 perp} yields critical radius R* = f_0^(3/2) / (3^(3/2) * pi^(3/2) * lambda_{3 perp}
    * delta^(3/2)) and critical surface tension Sigma_c = delta * R* = f_0^(3/2) * L^(1/2) /
    (3^(3/2) * pi^(3/2) * lambda_{3 perp} * rho_0^(1/2) * (mu_c - mu)^(1/2)). The printed formula
    appears to copy the -3/2 exponent of R* into Sigma_c, omit the (rho_0/L)^(-1/2) conversion
    factor, and drop factors of 3 * pi^(3/2) in the denominator.
  citation:
    page: 3
    printed_page: "098101-3"
    quote: "Sufficiently far from the bulk condensation point"
    where: "text, p. 3 col 2 top"

