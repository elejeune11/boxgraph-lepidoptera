    E_elast ~= -gamma^2/(2*mu_par_bar*R^2). Two sentences later, the paper also prints that this
    term contributes -pi*gamma^2/(2*mu_par_bar) to Delta F(R), which both repeats the factor-of-2
    error and omits the length factor L (it is a contribution to Delta F(R)/L).
