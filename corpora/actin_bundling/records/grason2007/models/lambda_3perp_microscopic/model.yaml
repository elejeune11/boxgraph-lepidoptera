id: lambda_3perp_microscopic
name: microscopic scaling of minimum bundle radius lambda_{3 perp} (p. 4 col 1)
role: model
stated:
  page: 4
  printed_page: "098101-4"
  quote: "The bundle radius at the onset of aggregation"
  where: "text, p. 4 col 1"
equation: "lambda_3perp ~ (d * l_p * k_B * T / Delta_E)^(1/2)"
prefactor: unknown
built_from:
  - characteristic_length_lambda3
inputs:
  d:
    quantity: chain_spacing
    unit: nm
  l_p:
    quantity: persistence_length
    unit: um
  dE_kBT:
    quantity: linker_binding_energy_in_kT
    unit: dimensionless
    description: "Bulk linker binding energy Delta E / (k_B T)."
outputs:
  lambda_3perp:
    quantity: characteristic_length_lambda3
    unit: nm
settings: {}
stochastic: false
