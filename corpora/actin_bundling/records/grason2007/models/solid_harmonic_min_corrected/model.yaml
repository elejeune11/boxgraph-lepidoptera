id: solid_harmonic_min_corrected
name: harmonic minimization of solid bundle Eq. (9) (corrected factor of 2 in E_elast)
role: model
stated:
  page: 3
  printed_page: "098101-3"
  quote: "If we minimize only the harmonic"
  where: "text, p. 3 col 2"
equation: "theta_0(R) = gamma / (2 * mu_par_bar * R); E_elast = -gamma^2 / (4 * mu_par_bar * R^2)"
variant_of: solid_harmonic_min_printed
corrections:
  - equation: "harmonic minimum energy density from Eq. (9) (p. 3 col 2)"
    change: "replace -gamma^2 / (2 * mu_par_bar * R^2) with -gamma^2 / (4 * mu_par_bar * R^2)"
    evidence: "Minimizing mu_par_bar*(Omega*R)^2 - gamma*Omega gives Omega_0 = gamma/(2*mu_par_bar*R^2) (theta_0 = gamma/(2*mu_par_bar*R), matching printed). Substituting back yields mu_par_bar*theta_0^2 - gamma*Omega_0 = +gamma^2/(4*mu_par_bar*R^2) - gamma^2/(2*mu_par_bar*R^2) = -gamma^2/(4*mu_par_bar*R^2), half the magnitude of the printed expression."
built_from:
  - solid_elastic_energy_eq9
inputs:
  R:
    quantity: bundle_radius
    unit: nm
  mu_par_bar:
    quantity: effective_out_of_plane_shear_modulus
    unit: "pN / nm**2"
  gamma:
    quantity: chiral_torque_coupling
    unit: "pN / nm"
outputs:
  theta_0:
    quantity: outer_tilt_angle
    unit: dimensionless
  E_elast:
    quantity: elastic_energy_density
    unit: "pN / nm**2"
settings: {}
stochastic: false
