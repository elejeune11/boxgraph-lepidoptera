id: solid_elastic_energy_eq9
name: hexagonal-solid bundle elastic energy density (Eq. 9)
role: model
stated:
  page: 3
  printed_page: "098101-3"
  quote: "by the out-of-plane shear modulus"
  where: "Eq. 9"
equation: "E_elast(R, Omega) = mu_par_bar * (Omega * R)^2 + mu_perp_bar * (Omega * R)^4 + K3_bar * Omega^4 * R^2 - gamma * Omega"
inputs:
  R:
    quantity: bundle_radius
    unit: nm
  Omega:
    quantity: torsional_strain
    unit: "1 / nm"
  mu_par_bar:
    quantity: effective_out_of_plane_shear_modulus
    unit: "pN / nm**2"
  mu_perp_bar:
    quantity: effective_in_plane_shear_modulus
    unit: "pN / nm**2"
  K3_bar:
    quantity: effective_bend_modulus
    unit: pN
  gamma:
    quantity: chiral_torque_coupling
    unit: "pN / nm"
outputs:
  E_elast:
    quantity: elastic_energy_density
    unit: "pN / nm**2"
settings: {}
stochastic: false
