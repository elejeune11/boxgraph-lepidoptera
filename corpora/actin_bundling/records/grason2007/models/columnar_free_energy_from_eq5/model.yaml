id: columnar_free_energy_from_eq5
name: columnar bundle free energy per length directly from Eq. (5) at Omega = Omega_0(R)
role: model
stated:
  page: 2
  printed_page: "098101-2"
  quote: "sum of the elastic energy Eq. (5)"
  where: "text above Eq. 6"
equation: "Delta_F(R) / L = pi * R^2 * E_elast(R, Omega_0(R); K2_bar=0) - pi * R^2 * epsilon + 2 * pi * R * Sigma"
built_from:
  - columnar_elastic_energy_eq5
  - columnar_optimal_torsion
inputs:
  R:
    quantity: bundle_radius
    unit: nm
  gamma:
    quantity: chiral_torque_coupling
    unit: "pN / nm"
  mu_perp_bar:
    quantity: effective_in_plane_shear_modulus
    unit: "pN / nm**2"
  K3_bar:
    quantity: effective_bend_modulus
    unit: pN
  epsilon:
    quantity: achiral_aggregation_energy_density
    unit: "pN / nm**2"
  Sigma:
    quantity: surface_tension
    unit: "pN / nm"
outputs:
  dF_over_L:
    quantity: free_energy_per_length
    unit: pN
  dF_elast_over_L:
    quantity: free_energy_per_length
    unit: pN
settings: {}
stochastic: false
