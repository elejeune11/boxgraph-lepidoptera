id: bulk_condensation_chemical_potential
name: bulk condensation chemical potential mu_c
role: processing
stated:
  page: 3
  printed_page: "098101-3"
  quote: "the point of bulk condensation"
  where: "text, p. 3 col 1"
equation: "mu_c = -epsilon * L / rho_0"
inputs:
  epsilon:
    quantity: achiral_aggregation_energy_density
    unit: "pN / nm**2"
  L:
    quantity: filament_length
    unit: nm
  rho_0:
    quantity: chain_area_density
    unit: "1 / nm**2"
outputs:
  mu_c:
    quantity: filament_chemical_potential
    unit: "pN*nm"
settings: {}
stochastic: false
