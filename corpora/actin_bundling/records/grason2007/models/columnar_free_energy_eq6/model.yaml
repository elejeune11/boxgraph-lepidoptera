id: columnar_free_energy_eq6
name: total free energy per unit length of columnar bundle (Eq. 6)
role: model
stated:
  page: 2
  printed_page: "098101-2"
  quote: "sum of the elastic energy Eq. (5)"
  where: "Eq. 6"
equation: "Delta_F(R) / L = -f_0 * R^(4/3) / (lambda_3perp^2 + R^2)^(1/3) - pi * R^2 * epsilon + 2 * pi * R * Sigma"
inputs:
  R:
    quantity: bundle_radius
    unit: nm
  f_0:
    quantity: free_energy_prefactor_f0
    unit: "pN / nm**(2/3)"
  lambda_3perp:
    quantity: characteristic_length_lambda3
    unit: nm
  epsilon:
    quantity: achiral_aggregation_energy_density
    unit: "pN / nm**2"
  Sigma:
    quantity: surface_tension
    unit: "pN / nm"
outputs:
  dF_over_L:
    quantity: free_energy_per_length
    unit: pN
  dF_elast_over_L:
    quantity: free_energy_per_length
    unit: pN
settings: {}
stochastic: false
