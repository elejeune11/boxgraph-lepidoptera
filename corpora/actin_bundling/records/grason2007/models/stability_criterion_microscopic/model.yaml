  quote: "for finite-size bundle formation then"
  where: "text, p. 4 col 1"
equation: "Sigma_c(mu_c) / Sigma ~ (d / P)^(4/3) * (d / lambda_3perp)^(1/3) * (Delta_E / Delta_E_star)"
prefactor: unknown
