id: columnar_elastic_energy_eq5
name: hexagonal-columnar bundle elastic energy density (Eq. 5)
role: model
stated:
  page: 2
  printed_page: "098101-2"
  quote: "energy per unit volume Eelast"
  where: "Eq. 5"
equation: "E_elast(R, Omega) = mu_perp_bar * (Omega * R)^4 + K2_bar * Omega^2 + K3_bar * Omega^4 * R^2 - gamma * Omega"
inputs:
  R:
    quantity: bundle_radius
    unit: nm
  Omega:
    quantity: torsional_strain
    unit: "1 / nm"
  mu_perp_bar:
    quantity: effective_in_plane_shear_modulus
    unit: "pN / nm**2"
  K2_bar:
    quantity: effective_twist_modulus
    unit: pN
  K3_bar:
    quantity: effective_bend_modulus
    unit: pN
  gamma:
    quantity: chiral_torque_coupling
    unit: "pN / nm"
outputs:
  E_elast:
    quantity: elastic_energy_density
    unit: "pN / nm**2"
settings: {}
stochastic: false
