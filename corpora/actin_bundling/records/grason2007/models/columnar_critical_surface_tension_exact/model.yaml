id: columnar_critical_surface_tension_exact
name: exact critical surface tension Sigma_c(mu) from Eqs. (6)-(7)
role: model
stated:
  page: 3
  printed_page: "098101-3"
  quote: "leading to a reduction of the critical surface tension"
  where: "text, p. 3 col 1-2 (from Eqs. 6-7)"
equation: "Sigma_c(mu) = max_{R > 0} (1/(2*pi)) * [f_0 * R^(1/3) / (lambda_3perp^2 + R^2)^(1/3) - pi * (rho_0 / L) * (mu_c - mu) * R]"
built_from:
  - columnar_free_energy_eq6
  - cluster_size_distribution_eq7
inputs:
  f_0:
    quantity: free_energy_prefactor_f0
    unit: "pN / nm**(2/3)"
  lambda_3perp:
    quantity: characteristic_length_lambda3
    unit: nm
  delta_mu:
    quantity: filament_chemical_potential
    unit: "pN*nm"
    description: "Chemical potential undercooling mu_c - mu >= 0 below bulk condensation."
  rho_0:
    quantity: chain_area_density
    unit: "1 / nm**2"
  L:
    quantity: filament_length
    unit: nm
outputs:
  Sigma_c:
    quantity: surface_tension
    unit: "pN / nm"
  R_star:
    quantity: bundle_radius
    unit: nm
settings:
  rtol: 1.0e-8
stochastic: false
