id: solid_elastic_energy_min_eq9
name: exact minimized torsional strain and elastic energy density of solid bundle (Eq. 9)
role: model
stated:
  page: 3
  printed_page: "098101-3"
  quote: "by the out-of-plane shear modulus"
  where: "text, p. 3 col 2 (minimization of Eq. 9)"
equation: "Omega_0 = argmin_{Omega > 0} [mu_par_bar*(Omega*R)^2 + mu_perp_bar*(Omega*R)^4 + K3_bar*Omega^4*R^2 - gamma*Omega]; theta_0 = Omega_0 * R"
built_from:
  - solid_elastic_energy_eq9
inputs:
  R:
    quantity: bundle_radius
    unit: nm
  mu_par_bar:
    quantity: effective_out_of_plane_shear_modulus
    unit: "pN / nm**2"
  mu_perp_bar:
    quantity: effective_in_plane_shear_modulus
    unit: "pN / nm**2"
  K3_bar:
    quantity: effective_bend_modulus
    unit: pN
  gamma:
    quantity: chiral_torque_coupling
    unit: "pN / nm"
outputs:
  Omega_0:
    quantity: torsional_strain
    unit: "1 / nm"
  theta_0:
    quantity: outer_tilt_angle
    unit: dimensionless
  E_elast:
    quantity: elastic_energy_density
    unit: "pN / nm**2"
settings:
  rtol: 1.0e-8
stochastic: false
