id: columnar_f0_corrected
name: columnar free-energy prefactor f_0 (corrected from Eq. 5 + Omega_0)
role: processing
stated:
  page: 2
  printed_page: "098101-2"
  quote: "is a surface tension"
  where: "text, below Eq. 6"
equation: "f_0 = (3*pi/4) * (gamma^4 / (4 * mu_perp_bar))^(1/3) = 3 * pi * (gamma^4 / (256 * mu_perp_bar))^(1/3)"
variant_of: columnar_f0
corrections:
  - equation: "f_0 definition below Eq. 6"
    change: "replace denominator 16 with 256 inside the cube root: f_0 = 3*pi*(gamma^4 / (256 * mu_perp_bar))^(1/3)"
    evidence: "Substituting the paper's own Omega_0(R) = (gamma/(4*mu_perp_bar))^(1/3) * R^(-2/3) * (R^2 + lambda_{3 perp}^2)^(-1/3) into Eq. (5) (for K_2 << K_3) gives pi*R^2*E_elast(R, Omega_0) = -(3*pi/4)*(gamma^4/(4*mu_perp_bar))^(1/3) * R^(4/3)/(lambda_{3 perp}^2 + R^2)^(1/3). Moving 1/4 inside the cube root requires cubing it (4^3 * 4 = 256), not 4 * 4 = 16; the printed f_0 is larger by 2^(4/3) ~= 2.52."
inputs:
  gamma:
    quantity: chiral_torque_coupling
    unit: "pN / nm"
  mu_perp_bar:
    quantity: effective_in_plane_shear_modulus
    unit: "pN / nm**2"
outputs:
  f_0:
    quantity: free_energy_prefactor_f0
    unit: "pN / nm**(2/3)"
settings: {}
stochastic: false
