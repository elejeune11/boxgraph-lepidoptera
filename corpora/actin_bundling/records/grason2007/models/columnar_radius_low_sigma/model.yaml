id: columnar_radius_low_sigma
name: low-surface-tension scaling of equilibrium columnar bundle radius
role: model
stated:
  page: 3
  printed_page: "098101-3"
  quote: "of low surface energies it grows as"
  where: "text, p. 3 col 1"
equation: "R_0 ~ gamma^4 / (mu_perp_bar * Sigma^3)"
prefactor: unknown
built_from:
  - columnar_free_energy_eq6
inputs:
  gamma:
    quantity: chiral_torque_coupling
    unit: "pN / nm"
  mu_perp_bar:
    quantity: effective_in_plane_shear_modulus
    unit: "pN / nm**2"
  Sigma:
    quantity: surface_tension
    unit: "pN / nm"
outputs:
  R_0:
    quantity: bundle_radius
    unit: nm
settings: {}
stochastic: false
