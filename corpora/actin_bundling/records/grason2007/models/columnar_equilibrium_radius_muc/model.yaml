id: columnar_equilibrium_radius_muc
name: exact equilibrium columnar bundle radius at bulk condensation from Eq. (6)
role: model
stated:
  page: 3
  printed_page: "098101-3"
  quote: "is negative and the second minimum"
  where: "text, p. 3 col 1 (from Eq. 6)"
equation: "R_0(Sigma) = argmin_{R >= lambda_3perp} [-f_0 * R^(4/3)/(lambda_3perp^2 + R^2)^(1/3) + 2*pi*R*Sigma] for Sigma <= Sigma_c"
built_from:
  - columnar_free_energy_eq6
inputs:
  f_0:
    quantity: free_energy_prefactor_f0
    unit: "pN / nm**(2/3)"
  lambda_3perp:
    quantity: characteristic_length_lambda3
    unit: nm
  Sigma:
    quantity: surface_tension
    unit: "pN / nm"
outputs:
  R_0:
    quantity: bundle_radius
    unit: nm
settings:
  rtol: 1.0e-8
stochastic: false
