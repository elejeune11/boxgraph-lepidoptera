id: solid_radius_shear_regime
name: solid-phase equilibrium bundle radius scaling for R_0 >> lambda_{3 perp}
role: model
stated:
  page: 3
  printed_page: "098101-3"
  quote: "and thus a dominant maximum in"
  where: "text, p. 3 col 2"
equation: "R_0 ~ (mu_perp_bar / Sigma)^(1/3) * (gamma / mu_par_bar)^(4/3)"
prefactor: unknown
built_from:
  - solid_elastic_energy_eq9
inputs:
  mu_perp_bar:
    quantity: effective_in_plane_shear_modulus
    unit: "pN / nm**2"
  Sigma:
    quantity: surface_tension
    unit: "pN / nm"
  gamma:
    quantity: chiral_torque_coupling
    unit: "pN / nm"
  mu_par_bar:
    quantity: effective_out_of_plane_shear_modulus
    unit: "pN / nm**2"
outputs:
  R_0:
    quantity: bundle_radius
    unit: nm
settings: {}
stochastic: false
