id: solid_harmonic_min_printed
name: harmonic minimization of solid bundle Eq. (9) (p. 3 col 2, as printed)
role: model
stated:
  page: 3
  printed_page: "098101-3"
  quote: "If we minimize only the harmonic"
  where: "text, p. 3 col 2"
equation: "theta_0(R) ~= gamma / (2 * mu_par_bar * R); E_elast ~= -gamma^2 / (2 * mu_par_bar * R^2)"
built_from:
  - solid_elastic_energy_eq9
inputs:
  R:
    quantity: bundle_radius
    unit: nm
  mu_par_bar:
    quantity: effective_out_of_plane_shear_modulus
    unit: "pN / nm**2"
  gamma:
    quantity: chiral_torque_coupling
    unit: "pN / nm"
outputs:
  theta_0:
    quantity: outer_tilt_angle
    unit: dimensionless
  E_elast:
    quantity: elastic_energy_density
    unit: "pN / nm**2"
settings: {}
stochastic: false
