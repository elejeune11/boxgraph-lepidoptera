id: columnar_optimal_torsion
name: optimal torsional strain Omega_0(R) for columnar bundle (K_2 << K_3)
role: model
stated:
  page: 2
  printed_page: "098101-2"
  quote: "torsional strain that depends on the bundle size"
  where: "text, p. 2 col 2"
equation: "Omega_0(R) = (gamma / (4 * mu_perp_bar))^(1/3) * R^(-2/3) * (R^2 + lambda_3perp^2)^(-1/3)"
built_from:
  - columnar_elastic_energy_eq5
  - characteristic_length_lambda3
inputs:
  R:
    quantity: bundle_radius
    unit: nm
  gamma:
    quantity: chiral_torque_coupling
    unit: "pN / nm"
  mu_perp_bar:
    quantity: effective_in_plane_shear_modulus
    unit: "pN / nm**2"
  lambda_3perp:
    quantity: characteristic_length_lambda3
    unit: nm
outputs:
  Omega_0:
    quantity: torsional_strain
    unit: "1 / nm"
settings: {}
stochastic: false
