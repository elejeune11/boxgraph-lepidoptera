id: cholesteric_pitch_from_torsion
name: cholesteric pitch P inferred from small-bundle twist pitch (p. 4 col 1)
role: model
stated:
  page: 4
  printed_page: "098101-4"
  quote: "tion we obtain P 1–10 nm"
  where: "text, p. 4 col 1"
equation: "P ~ (Delta_E / (k_B * T)) / (d * l_p * (2 * pi / Lambda_twist)^3)  [with l ~ d and Omega = 2*pi/Lambda_twist]"
prefactor: unknown
built_from:
  - small_bundle_torsion_microscopic
  - chiral_torque_microscopic
inputs:
  dE_kBT:
    quantity: linker_binding_energy_in_kT
    unit: dimensionless
  d:
    quantity: chain_spacing
    unit: nm
  l_p:
    quantity: persistence_length
    unit: um
  twist_pitch:
    quantity: bundle_twist_pitch
    unit: nm
outputs:
  P:
    quantity: cholesteric_pitch
    unit: nm
settings: {}
stochastic: false
