id: solid_to_columnar_radius_ratio
name: ratio of solid-phase to columnar-phase equilibrium bundle radius (Ref. 21)
role: model
stated:
  page: 4
  printed_page: "098101-4"
  quote: "bundles is smaller than columnar aggregates by a factor"
  where: "Ref. 21"
equation: "R_{0,solid} / R_{0,col} ~ (Sigma / gamma)^(8/3)"
prefactor: unknown
built_from:
  - solid_radius_shear_regime
  - columnar_radius_low_sigma
inputs:
  Sigma:
    quantity: surface_tension
    unit: "pN / nm"
  gamma:
    quantity: chiral_torque_coupling
    unit: "pN / nm"
outputs:
  radius_ratio:
    quantity: solid_to_columnar_radius_ratio
    unit: dimensionless
settings: {}
stochastic: false
