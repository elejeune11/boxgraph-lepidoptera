id: solid_equilibrium_radius_muc
name: exact equilibrium hexagonal-solid bundle radius at bulk condensation from Eq. (9)
role: model
stated:
  page: 3
  printed_page: "098101-3"
  quote: "for sufficiently low surface energies and near"
  where: "text, p. 3 col 2 (from Eq. 9)"
equation: "R_0 = argmin_{R > 0} [pi * R^2 * E_elast_min(R) + 2 * pi * R * Sigma] <=> Omega_0(R)^4 * R^3 * (mu_perp_bar * R^2 + 2 * K3_bar) = Sigma"
built_from:
  - solid_elastic_energy_min_eq9
inputs:
  mu_par_bar:
    quantity: effective_out_of_plane_shear_modulus
    unit: "pN / nm**2"
  mu_perp_bar:
    quantity: effective_in_plane_shear_modulus
    unit: "pN / nm**2"
  K3_bar:
    quantity: effective_bend_modulus
    unit: pN
  gamma:
    quantity: chiral_torque_coupling
    unit: "pN / nm"
  Sigma:
    quantity: surface_tension
    unit: "pN / nm"
outputs:
  R_0:
    quantity: bundle_radius
    unit: nm
settings:
  rtol: 1.0e-8
stochastic: false
