id: critical_surface_tension_far_printed
name: critical surface tension far from bulk condensation (p. 3 col 2, as printed)
role: model
stated:
  page: 3
  printed_page: "098101-3"
  quote: "Sufficiently far from the bulk condensation point"
  where: "text, p. 3 col 2 top"
equation: "Sigma_c ~= f_0^(3/2) * 3^(-1/2) * lambda_3perp^(-1) * (mu_c - mu)^(-3/2)"
built_from:
  - columnar_free_energy_eq6
  - cluster_size_distribution_eq7
inputs:
  f_0:
    quantity: free_energy_prefactor_f0
    unit: "pN / nm**(2/3)"
  lambda_3perp:
    quantity: characteristic_length_lambda3
    unit: nm
  delta_mu:
    quantity: filament_chemical_potential
    unit: "pN*nm"
    description: "Chemical potential difference mu_c - mu > 0 as printed."
outputs:
  Sigma_c:
    quantity: surface_tension
    unit: "pN / nm"
settings: {}
stochastic: false
