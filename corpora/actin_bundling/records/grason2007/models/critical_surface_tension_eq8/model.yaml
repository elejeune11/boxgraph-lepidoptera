  printed_page: "098101-3"
  quote: "surface energy drops below a critical value"
  where: "Eq. 8"
equation: "Sigma_c = f_0 / (2^(4/3) * pi * lambda_3perp^(1/3)); R_0(Sigma_c) = lambda_3perp"
built_from:
