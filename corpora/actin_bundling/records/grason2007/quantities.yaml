- id: bundle_radius
  name: bundle radius
  dimension: "[length]"
  description: Radius R (or equilibrium radius R_0) of a cylindrical biopolymer bundle.
- id: bundle_diameter
  name: bundle diameter
  dimension: "[length]"
  description: Diameter D = 2R of a cylindrical biopolymer bundle.
- id: filament_length
  name: filament length
  dimension: "[length]"
  description: Fixed contour length L of biopolymer filaments in the bundle.
- id: characteristic_length_lambda3
  name: bend-shear characteristic length lambda_{3 perp}
  dimension: "[length]"
  description: Characteristic length lambda_{3 perp} = sqrt(K_3_bar / mu_perp_bar), setting the minimum equilibrium bundle radius at bulk condensation.
- id: chain_spacing
  name: in-plane chain spacing
  dimension: "[length]"
  description: In-plane center-to-center distance d between neighboring chains in a hexagonal bundle.
- id: linker_spacing
  name: axial linker spacing
  dimension: "[length]"
  description: Mean axial spacing l of cross-linking units along the bundle axis.
- id: persistence_length
  name: filament persistence length
  dimension: "[length]"
  description: Bending persistence length l_p of an individual semiflexible biopolymer filament.
- id: cholesteric_pitch
  name: cholesteric pitch
  dimension: "[length]"
  description: Preferred cholesteric pitch P of chiral filaments in the absence of in-plane order.
- id: bundle_twist_pitch
  name: helical twist pitch of small bundle
  dimension: "[length]"
  description: Helical repeat pitch 2*pi/Omega of a twisted small bundle of braided filaments.
- id: torsional_strain
  name: torsional strain
  dimension: "1 / [length]"
  description: Torsional twist rate per unit length Omega = d(phi)/dz of a twisted bundle.
- id: outer_tilt_angle
  name: outermost filament tilt angle
  dimension: "dimensionless"
  description: Tilt angle theta = Omega * R of the outermost filaments relative to the central bundle axis.
- id: in_plane_shear_modulus
  name: in-plane shear modulus
  dimension: "[energy] / [length]**3"
  description: In-plane 2D shear elastic modulus mu_perp of the hexagonal bundle array (energy per unit volume).
- id: effective_in_plane_shear_modulus
  name: effective in-plane shear modulus
  dimension: "[energy] / [length]**3"
  description: Effective in-plane shear modulus mu_perp_bar = (25/216)*mu_perp entering Eq. (5) for an incompressible hexagonal-columnar bundle.
- id: out_of_plane_shear_modulus
  name: out-of-plane shear modulus
  dimension: "[energy] / [length]**3"
  description: Out-of-plane shear elastic modulus mu_parallel for a 3D hexagonally ordered solid bundle (Eq. 9).
- id: effective_out_of_plane_shear_modulus
  name: effective out-of-plane shear modulus
  dimension: "[energy] / [length]**3"
  description: Effective out-of-plane shear modulus mu_par_bar = mu_parallel / 4 entering Eq. (9).
- id: frank_twist_modulus
  name: Frank twist elastic constant
  dimension: "[energy] / [length]"
  description: Frank twist elastic modulus K_2 of the filament array (Eq. 3).
- id: effective_twist_modulus
  name: effective twist modulus
  dimension: "[energy] / [length]"
  description: Effective twist modulus K_2_bar = 2*K_2 entering Eq. (5).
- id: frank_bend_modulus
  name: Frank bend elastic constant
  dimension: "[energy] / [length]"
  description: Frank bend elastic modulus K_3 of the filament array (Eq. 3).
- id: effective_bend_modulus
  name: effective bend modulus
  dimension: "[energy] / [length]"
  description: Effective bend modulus K_3_bar = K_3 / 4 entering Eq. (5).
- id: chiral_torque_coupling
  name: chiral torque coupling constant
  dimension: "[energy] / [length]**2"
  description: Chiral torque coupling gamma = 2*K_2/P (energy per unit area) driving bundle twist.
- id: elastic_energy_density
  name: elastic deformation energy density
  dimension: "[energy] / [length]**3"
  description: Elastic deformation energy per unit bundle volume E_elast(R, Omega).
- id: achiral_aggregation_energy_density
  name: achiral aggregation energy density
  dimension: "[energy] / [length]**3"
  description: Achiral bulk cohesive energy density epsilon (positive for favorable binding, entering free energy as -epsilon).
- id: surface_tension
  name: bundle surface tension
  dimension: "[energy] / [length]**2"
  description: Surface energy per unit lateral bundle area Sigma (or critical threshold Sigma_c).
- id: free_energy_prefactor_f0
  name: chiral elastic free-energy prefactor f_0
  dimension: "[energy] / [length]**(5/3)"
  description: Prefactor f_0 = 3*pi*(gamma^4 / (16*mu_perp_bar))^(1/3) in the columnar bundle free energy per length Eq. (6).
- id: free_energy_per_length
  name: bundle free energy per unit length
  dimension: "[energy] / [length]"
  description: Free energy per unit bundle length Delta F(R) / L (Eq. 6).
- id: filament_chemical_potential
  name: filament chemical potential
  dimension: "[energy]"
  description: Chemical potential mu of filaments in solution, bulk condensation value mu_c = -epsilon*L/rho_0, or undercooling difference mu_c - mu.
- id: chain_area_density
  name: in-plane chain area density
  dimension: "1 / [length]**2"
  description: Number of chains per unit cross-sectional area rho_0 in the bundle (Eq. 7).
- id: thermal_energy
  name: thermal energy
  dimension: "[energy]"
  description: Thermal energy scale k_B * T.
- id: linker_binding_energy
  name: linker binding energy
  dimension: "[energy]"
  description: Bulk binding energy Delta E of a linker unit between chains.
- id: linker_binding_energy_in_kT
  name: linker binding energy in k_B T units
  dimension: "dimensionless"
  description: Dimensionless bulk linker binding energy Delta E / (k_B T).
- id: surface_linker_binding_energy_ratio
  name: bulk-to-surface linker binding energy ratio
  dimension: "dimensionless"
  description: Ratio Delta E / Delta E* of bulk linker binding energy to surface linker binding energy.
- id: bundle_stability_ratio
  name: critical-to-actual surface tension ratio
  dimension: "dimensionless"
  description: Dimensionless ratio Sigma_c(mu_c) / Sigma; finite-size bundles are stable when this exceeds 1.
- id: solid_to_columnar_radius_ratio
  name: solid-to-columnar equilibrium radius ratio
  dimension: "dimensionless"
  description: Ratio R_{0,solid} / R_{0,col} of equilibrium bundle radii in the solid versus columnar phase (Footnote 21).
- id: unnormalized_cluster_weight
  name: unnormalized cluster size distribution weight
  dimension: "[length]**2"
  description: Unnormalized Boltzmann factor R^2 * exp(-(Delta F(R) - mu*rho_0*pi*R^2) / (k_B T)) proportional to P(R) in Eq. (7).
- id: polymer_system
  name: biopolymer species
  dimension: "dimensionless"
  description: Label identifying the biopolymer species (condition key, e.g. F-actin).
