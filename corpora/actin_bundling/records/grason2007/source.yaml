notes: >
  In scope: the paper's full continuum elasticity theory of twisted hexagonal-columnar
  (Eqs. 5-8) and hexagonal-solid (Eq. 9, Footnote 21) biopolymer bundles, all dimensional
  scale and effective-modulus definitions (mu_perp_bar, K2_bar, K3_bar, gamma, lambda_3perp,
  f0, mu_c, mu_par_bar), exact numerical minimizers of the printed free energies for
  equilibrium bundle radius and phase boundary, and all microscopic F-actin scaling
  estimates and comparisons on p. 4 (lambda_3perp ~ 100 nm, cholesteric pitch P ~ 1-10 nm
  from Ikawa et al. 2pi/Omega ~ 100 nm, stability ratio Sigma_c(mu_c)/Sigma >= 1, and
  validation of onset bundle diameter 2*lambda_3perp against Lai et al. 40-100 nm).
  Left out: field-theoretic integral definitions Eqs. (1)-(4) (which the paper reduces to
  algebraic Eq. 5, though their reduction to mu_perp_bar = 25*mu_perp/216 is audited in
  questions.yaml); the qualitative microtubule torsion observation Omega_0^-1 ~ 10 um
  (p. 4, Ref. 25) and filament count "2-3 filaments" (p. 4, Ref. 22), which feed no
  quantitative model in the paper; and Figs. 1-2 (schematic illustration and uncalibrated
  diagrams with no numeric axis scales, documented in figures.md).
  Notable findings from algebraic and symbolic verification: (1) below Eq. (6), printed
  f0 = 3*pi*(gamma^4/(16*mu_perp_bar))^(1/3) is larger by 2^(4/3) = 16^(1/3) (~2.52) than
  the exact result 3*pi*(gamma^4/(256*mu_perp_bar))^(1/3) obtained by inserting Omega_0(R)
  into Eq. (5); (2) on p. 3 col 2, the away-from-bulk-condensation critical surface tension
  Sigma_c ~= f0^(3/2) * 3^(-1/2) * lambda_3perp^(-1) * (mu_c - mu)^(-3/2) is dimensionally
  inconsistent and mixes the exponent -3/2 of R* into Sigma_c while omitting (rho_0/L)^(-1/2)
  and factors of 3*pi^(3/2); (3) on p. 3 col 2, the solid-phase harmonic minimum energy
  density E_elast ~= -gamma^2/(2*mu_par_bar*R^2) (and -pi*gamma^2/(2*mu_par_bar)) is off by
  a factor of 2 from the exact minimization result -gamma^2/(4*mu_par_bar*R^2). Each has
  both its printed model and an evidenced variant_of corrected model, tested via relations.yaml
  and documented in questions.yaml.
