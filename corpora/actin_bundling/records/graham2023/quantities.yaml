# Experimental conditions and buffer composition
- id: vasp_concentration
  name: monomeric VASP concentration
  dimension: "[substance] / [length] ** 3"
  description: Bulk monomeric VASP concentration used to form droplets (all VASP concentrations in the paper refer to monomer concentration).
- id: actin_concentration
  name: monomeric actin concentration
  dimension: "[substance] / [length] ** 3"
  description: Bulk monomeric G-actin concentration added to VASP droplets.
- id: actin_to_vasp_ratio
  name: actin-to-VASP molar ratio
  dimension: dimensionless
  description: Molar ratio of bulk monomeric actin to monomeric VASP (e.g. 1:20 = 0.05, 1:10 = 0.1, 1:7.5 = 0.133, 1:5 = 0.2, 10:1 = 10, 28:1 = 28).
- id: peg_concentration_wv
  name: PEG-8000 crowder concentration (% w/v)
  dimension: dimensionless
  description: Weight-per-volume percentage of polyethylene glycol 8000 (PEG8K) macromolecular crowder.
- id: salt_concentration
  name: NaCl salt concentration
  dimension: "[substance] / [length] ** 3"
  description: Sodium chloride concentration in droplet buffer.
- id: tris_concentration
  name: Tris buffer concentration
  dimension: "[substance] / [length] ** 3"
  description: Tris base concentration in droplet buffer.
- id: buffer_ph
  name: buffer pH
  dimension: dimensionless
  description: pH of the aqueous droplet buffer.
- id: edta_egta_concentration
  name: EDTA/EGTA chelator concentration
  dimension: "[substance] / [length] ** 3"
  description: Concentration of divalent cation chelators EDTA and EGTA in standard droplet buffer.
- id: tcep_concentration
  name: TCEP reducing agent concentration
  dimension: "[substance] / [length] ** 3"
  description: Concentration of TCEP reducing agent in droplet buffer.
- id: atp_concentration
  name: ATP concentration
  dimension: "[substance] / [length] ** 3"
  description: Adenosine triphosphate concentration supplemented for elongating bundle assays.
- id: latrunculin_a_concentration
  name: latrunculin A concentration
  dimension: "[substance] / [length] ** 3"
  description: Concentration of actin polymerization inhibitor latrunculin A.
- id: bleach_region_diameter
  name: FRAP photobleached ROI diameter
  dimension: "[length]"
  description: Diameter of the circular region photobleached during FRAP measurements.
- id: vasp_label_fraction
  name: VASP fluorescent labelling fraction
  dimension: dimensionless
  description: Fraction of VASP monomers carrying a fluorescent maleimide dye.
- id: actin_label_fraction
  name: actin fluorescent labelling fraction
  dimension: dimensionless
  description: Fraction of G-actin monomers carrying a fluorescent maleimide dye.
- id: incubation_time
  name: incubation or polymerization time
  dimension: "[time]"
  description: Time elapsed after PEG or actin addition before imaging.

# Experimental protein, droplet, FRAP, and growth measurements
- id: vasp_sequence_length
  name: VASP monomer residue length
  dimension: dimensionless
  description: Number of amino acid residues in full-length wild-type human VASP (1-380).
- id: disordered_fraction
  name: predicted intrinsically disordered fraction of VASP
  dimension: dimensionless
  description: Fraction of VASP primary sequence predicted to be intrinsically disordered.
- id: droplet_fusion_time
  name: VASP droplet fusion and re-rounding time
  dimension: "[time]"
  description: Characteristic time for two contacting VASP droplets to fuse and re-round.
- id: frap_recovery_fraction
  name: FRAP fractional fluorescence recovery
  dimension: dimensionless
  description: Percentage of normalized fluorescence intensity recovered after photobleaching.
- id: frap_half_time
  name: FRAP recovery half-time
  dimension: "[time]"
  description: Half-time t_{1/2} for fluorescence recovery after photobleaching inside VASP droplets.
- id: droplet_diameter
  name: effective droplet diameter
  dimension: "[length]"
  description: Diameter D or D_droplet of a circular/spherical droplet, or volume-equivalent spherical diameter D = (a b^2)^(1/3).
- id: droplet_radius
  name: droplet radius
  dimension: "[length]"
  description: Effective circular or spherical droplet radius R = D_droplet / 2.
- id: droplet_aspect_ratio
  name: droplet aspect ratio
  dimension: dimensionless
  description: Ratio a/b of major axis to minor axis of a deformed elliptical or elongated VASP droplet.
- id: ellipse_semi_major_axis
  name: 2D ellipse semi-major axis
  dimension: "[length]"
  description: Semi-major axis a of the 2D elliptical droplet model (span 2a).
- id: ellipse_semi_minor_axis
  name: 2D ellipse semi-minor axis
  dimension: "[length]"
  description: Semi-minor axis b of the 2D elliptical droplet model (span 2b).
- id: droplet_major_axis_length
  name: droplet full major axis length
  dimension: "[length]"
  description: Full major axis length (span) a of a deformed droplet used in Methods D = (a b^2)^(1/3).
- id: droplet_minor_axis_length
  name: droplet full minor axis length
  dimension: "[length]"
  description: Full minor axis length (span) b of a deformed droplet used in Methods D = (a b^2)^(1/3).
- id: droplet_perimeter
  name: 2D droplet interface perimeter
  dimension: "[length]"
  description: Perimeter P (denoted L in SI Eqs. S10-S12) of the 2D circular or elliptical VASP droplet interface.
- id: ring_thickness
  name: bundled-actin ring thickness
  dimension: "[length]"
  description: Thickness T_ring of the peripheral bundled-actin ring (FWHM minus diffraction limit in experiments; radial thickness in model).
- id: ring_thickness_critical
  name: critical ring thickness for droplet deformation
  dimension: "[length]"
  description: Threshold bundled-actin ring thickness above which a circular droplet deforms to aspect ratio > 1.1.
- id: ring_fluctuation_amplitude
  name: Fourier amplitude of radial ring fluctuations
  dimension: "[length]"
  description: Radial fluctuation Fourier mode amplitude u_m in Eq. 1 and Eqs. S13-S25, assumed proportional to ring thickness.
- id: bundle_elongation_rate
  name: linear droplet-bundle elongation rate
  dimension: "[length] / [time]"
  description: Growth velocity of elongating linear VASP-actin droplet bundles.
- id: monomer_addition_rate
  name: actin monomer addition rate
  dimension: "1 / [time]"
  description: Number of actin monomers incorporated per second at elongating bundle tips.
- id: actin_monomer_step
  name: F-actin axial increment per monomer
  dimension: "[length]"
  description: Axial filament length added per incorporated actin subunit (~2.7 nm).
- id: elongation_time
  name: bundle elongation elapsed time
  dimension: "[time]"
  description: Elapsed time during linear bundle elongation in Fig. 5h.
- id: bundle_growth_length
  name: bundle elongation length increment
  dimension: "[length]"
  description: Increase in linear bundle length over elapsed time in Fig. 5h.
- id: power_law_exponent
  name: ring thickness power-law scaling exponent
  dimension: dimensionless
  description: Exponent b in the power-law relation T_ring = a * D^b (experimentally fitted in Figs. 3e-f, 4h; theoretically 1.5 in Eq. S25).
- id: power_law_prefactor_um
  name: empirical power-law prefactor (micrometre basis)
  dimension: dimensionless
  description: Numerical prefactor a in the empirical power law y = a * x^b when both thickness y and diameter x are expressed in um.
- id: fit_r_squared
  name: coefficient of determination R^2
  dimension: dimensionless
  description: Goodness-of-fit R^2 for empirical linear or power-law regressions.

# Biophysical mechanical and continuum/discrete model quantities
- id: actin_persistence_length
  name: actin filament or bundle persistence length
  dimension: "[length]"
  description: Persistence length L_p of a single F-actin filament (17.73 um in Table 1; 10-20 um in main text) or an actin bundle (k_b / k_B T).
- id: filament_contour_length
  name: actin filament or ring contour length
  dimension: "[length]"
  description: Total contour length L of the encapsulated actin filament or bundled-actin ring.
- id: filament_spacing
  name: inter-filament spacing in VASP bundle
  dimension: "[length]"
  description: Center-to-center lateral spacing delta between actin filaments in a VASP-crosslinked bundle (15 nm assumed; ~12 nm between Ena/VASP actin-binding domains).
- id: filament_count
  name: number of filaments in bundled-actin ring
  dimension: dimensionless
  description: Number of actin filaments N_fil (or N) composing the bundled-actin ring.
- id: segment_length
  name: discretized cylindrical segment length
  dimension: "[length]"
  description: Rest length L_cyl of each cylindrical segment in the discretized bundle model (100 nm).
- id: thermal_energy
  name: thermal energy k_B T
  dimension: "[energy]"
  description: Product of Boltzmann constant k_B and absolute temperature T.
- id: flexural_rigidity
  name: flexural (bending) rigidity
  dimension: "[force] * [length] ** 2"
  description: Continuum bending stiffness k_b (or k_{b,fil}, K_{b,ring}) of an actin filament or bundled-actin ring.
- id: stretching_constant
  name: filament or bundle stretching constant
  dimension: "[force] / [length]"
  description: Harmonic stretching stiffness k_stretch of a single actin filament or N_fil-filament bundle segment.
- id: discrete_bending_constant
  name: discrete hinge bending constant
  dimension: "[energy]"
  description: Hinge bending energy constant k_bend = N_fil * L_p * k_B T / L_cyl in Table 1 and Eq. S2.
- id: wetting_surface_tension
  name: actin-VASP wetting surface tension
  dimension: "[force] / [length]"
  description: Wetting interfacial energy parameter gamma_AVR (VASP-rich), gamma_AVD (VASP-dilute), or transition profile gamma(e).
- id: droplet_line_tension
  name: 2D droplet interfacial surface energy parameter
  dimension: "[force]"
  description: 2D surface energy parameter (line tension) gamma_I of the VASP-rich / VASP-dilute interface multiplying droplet perimeter P.
- id: bending_energy
  name: bundle bending free energy
  dimension: "[energy]"
  description: Bending energy E_bend (or excess bending energy Delta E_bend) of the encapsulated actin ring or bundle.
- id: surface_energy
  name: droplet interfacial surface free energy
  dimension: "[energy]"
  description: Interfacial surface energy E_surf = gamma_I * P of the 2D VASP droplet.
- id: total_free_energy
  name: total droplet-ring free energy
  dimension: "[energy]"
  description: Sum of bundle mechanical energy, actin wetting energy, and droplet surface energy.
- id: fourier_mode_number
  name: Fourier fluctuation mode number
  dimension: dimensionless
  description: Integer harmonic mode index m in the radial ring fluctuation expansion u(theta) = sum_m u_m cos(m theta).
- id: normalized_ellipse_coord
  name: normalized quadratic ellipse coordinate
  dimension: dimensionless
  description: Dimensionless radial position indicator e = x^2/a^2 + y^2/b^2 (called 'eccentricity' in SI Section 2.4; e < 1 inside, e = 1 on boundary, e > 1 outside).
- id: interface_steepness
  name: tanh interface transition steepness parameter
  dimension: dimensionless
  description: Steepness constant k_e in f(e) = k_e * (e - 1) governing the width of the wetting transition at e = 1 (64 in SI Section 2.4).
- id: crosslinker_coupling
  name: Bathe inter-filament coupling parameter
  dimension: dimensionless
  description: Dimensionless shear/crosslinker coupling parameter alpha in Bathe et al. Eq. S1.
- id: crosslinker_thickness_ratio
  name: Bathe crosslinker thickness parameter
  dimension: dimensionless
  description: Dimensionless geometric thickness factor chi in Bathe et al. Eq. S1.
- id: bathe_mode_factor
  name: Bathe wavenumber factor c(q_j)
  dimension: dimensionless
  description: Non-dimensional bending mode factor c(q_j) in Bathe et al. Eq. S1.
- id: perimeter_to_2L_ratio
  name: ratio of droplet perimeter to twice bundle length
  dimension: dimensionless
  description: Dimensionless ratio P(a/b) / (2 L) separating rising (P < 2L) and falling (P > 2L) bending-energy regimes in Section 2.11.
- id: actin_exposed_length
  name: exposed actin bundle length in wetting sweep
  dimension: "[length]"
  description: Initial length of actin bundle protruding into the VASP-dilute phase in SI Section 2.4.2 (100 nm).
- id: optimization_tolerance
  name: SLSQP optimization convergence tolerance
  dimension: dimensionless
  description: Function tolerance for Sequential Least Squares Programming energy minimization (10^-6 in SI Section 2.6).
- id: coordinate_noise_amplitude
  name: uniform random coordinate perturbation amplitude
  dimension: "[length]"
  description: Upper bound of uniform random coordinate noise [0, 0.1 nm] added between minimization steps in SI Section 2.6.
- id: ring_extension_cycles
  name: iterative filament extension cycle count
  dimension: dimensionless
  description: Number of extension-minimization cycles (21) used to grow a filament from L = D to L = 3.1 D in SI Section 2.6.
- id: ring_thickness_step
  name: ring thickness increment step size
  dimension: "[length]"
  description: Step size (15 nm) by which T_ring is iteratively increased in Fig. 4e-h.
- id: ring_length_to_diameter_ratio
  name: final ring contour length to droplet diameter ratio
  dimension: dimensionless
  description: Dimensionless ratio L_final / D_droplet achieved after iterative filament extension (3.1 in SI Section 2.6, approximating pi).
- id: ring_extension_step_fraction
  name: filament extension fraction per cycle
  dimension: dimensionless
  description: Fractional increment of droplet diameter (0.1) added to filament contour length in each iterative extension cycle.

# Digitized figure measurement and sweep quantities
- id: frap_post_bleach_time
  name: FRAP time post-bleach
  dimension: "[time]"
  description: Time elapsed relative to photobleaching during FRAP recovery measurements (Figs. 1f, 6b).
- id: morphology_category_index
  name: droplet or actin morphology category index
  dimension: dimensionless
  description: "Integer categorical index for morphology classes along bar/box axes (Figs. 2d, 6d: 1=Uniform, 2=Peripheral AR<1.1, 3=Peripheral AR>1.1, 4=Rod; Figs. 3d, 3g, ED Fig. 4c: 1=Shell, 2=Ring, 3=Disc)."
- id: morphology_abundance
  name: droplet morphology percentage abundance
  dimension: dimensionless
  description: Percentage of analysed droplets belonging to a given morphological class (Figs. 2d, 3d, 6d, Extended Data Fig. 4c).
- id: bundle_intensity_time
  name: fluorescence intensity tracking elapsed time
  dimension: "[time]"
  description: Elapsed time during post-bleach recovery or bundle elongation fluorescence intensity quantification (Figs. 6f, 6g).
- id: normalized_total_intensity
  name: normalized total droplet fluorescence intensity
  dimension: dimensionless
  description: Summed pixel fluorescence intensity across a droplet normalized to the pre-bleach (Fig. 6f) or first time point (Fig. 6g) total intensity.
- id: vasp_construct_index
  name: VASP protein construct category index
  dimension: dimensionless
  description: "Integer categorical index for VASP wild-type and mutant constructs (ED Fig. 2d: 1=WT, 2=IDR, 3=delta-tet, 4=delta-EVH1; ED Fig. 3e: 1=mutGABmutFAB, 2=mutFAB)."
- id: protein_partition_coefficient
  name: protein fluorescence partition coefficient
  dimension: dimensionless
  description: Ratio of fluorescence intensity inside VASP droplets to outside droplets (Extended Data Figs. 2d, 3e).
- id: droplet_size_count
  name: droplet size histogram bin frequency count
  dimension: dimensionless
  description: Number of droplets falling into each diameter histogram bin (Extended Data Fig. 4e).
- id: droplet_size_frequency
  name: droplet size distribution percentage frequency
  dimension: dimensionless
  description: Percentage frequency of droplets as a function of droplet diameter (Extended Data Fig. 9c).
- id: wetted_bundle_fraction
  name: actin bundle fraction wetted by VASP-rich phase
  dimension: dimensionless
  description: Fraction of the discretized actin bundle residing inside the VASP-rich droplet phase at energy minimum (Extended Data Fig. 6A).


