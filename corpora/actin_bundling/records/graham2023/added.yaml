- id: kbt_room_temp_added
  quantity: thermal_energy
  unit: pN*nm
  printed: "4.114"
  basis: "Standard room temperature T = 298 K (k_B T = 1.380649e-23 J/K * 298 K = 4.114 pN*nm); the paper uses k_B T in SI Table 1 and Eq. S23 without stating a numerical temperature or k_B T value (Methods p. 14 mentions room temperature for labelling)."
  alternatives: ["4.045", "4.142", "4.280"]
  stands_for: "k_B T in SI Table 1 (k_bend) and Eq. S23"
- id: actin_monomer_step_added
  quantity: actin_monomer_step
  unit: nm
  printed: "2.7"
  basis: "Standard double-helical F-actin axial rise per monomer (~2.7 nm, or ~370 subunits/um); the paper converts 23 +/- 3 nm/s to 'about 8 to 9 monomers per second' on p. 9 without stating the monomer length used."
  alternatives: ["2.75", "2.73", "2.8"]
  stands_for: "monomer axial length increment in p. 9 growth-rate conversion"
- id: test_droplet_radius_added
  quantity: droplet_radius
  unit: um
  printed: "1.43"
  basis: "Half of the experimentally measured median droplet diameter 2.86 um for 20 uM VASP droplets (Extended Data Fig. 4e), used to evaluate Eq. 1 / S21-S25 at a representative droplet size."
  alternatives: ["0.5", "1.0", "2.0"]
  stands_for: "R in Eq. 1 and Eqs. S21-S25"
- id: test_fourier_mode_added
  quantity: fourier_mode_number
  unit: dimensionless
  printed: "2"
  basis: "Lowest non-trivial elliptical shape deformation mode m = 2 in the radial Fourier expansion u(theta) = sum_m u_m cos(m theta); the paper does not specify which mode m is evaluated in Eq. S22-S23."
  alternatives: ["1", "3", "4"]
  stands_for: "m in Eq. 1 and Eqs. S21-S23"
- id: test_fluctuation_amp_added
  quantity: ring_fluctuation_amplitude
  unit: um
  printed: "0.35"
  basis: "Representative ring thickness (~0.35 um) for a droplet of diameter ~2.86 um from Fig. 3f, used to evaluate Eq. 1 / Eq. S21 bending energy."
  alternatives: ["0.1", "0.5", "0.7"]
  stands_for: "u_m in Eq. 1 and Eqs. S21-S22"
- id: test_ring_thickness_300nm_added
  quantity: ring_thickness
  unit: nm
  printed: "300"
  basis: "Mid-range ring thickness from the Fig. 4f sweep (5 nm to 480 nm for D = 1 um, gamma_I = 5.0 pN), chosen to probe discrete SLSQP droplet deformation and numerical convergence."
  alternatives: ["150", "240", "450"]
  stands_for: "T_ring in Fig. 4f-h discrete minimization"
- id: test_aspect_ratio_ellipse_added
  quantity: droplet_aspect_ratio
  unit: dimensionless
  printed: "1.5"
  basis: "Representative deformed elliptical droplet aspect ratio from Fig. 4g-h and Fig. 5a, used to compare ellipse perimeter Eqs. S10-S11 and evaluate surface energy Eq. S12."
  alternatives: ["1.1", "2.0", "5.0"]
  stands_for: "a/b in SI Section 2.5 and 2.11"
- id: test_aspect_ratio_high_added
  quantity: droplet_aspect_ratio
  unit: dimensionless
  printed: "9.5"
  basis: "High aspect ratio just below the ring-to-rod transition threshold P(a/b) = 2L (~9.54) in Fig. 5c-d and SI Section 2.11."
  alternatives: ["9.0", "9.6", "9.8696"]
  stands_for: "a/b near peak bending energy in Fig. 5c and Section 2.11"
- id: test_ellipse_coord_inside_added
  quantity: normalized_ellipse_coord
  unit: dimensionless
  printed: "0.5"
  basis: "Interior point of the VASP-rich droplet (e < 1) used to test the wetting tension profile gamma(e) in Eqs. S4-S5 against Extended Data Fig. 5c."
  alternatives: ["0.0", "0.25", "0.75"]
  stands_for: "e inside droplet in Eqs. S4-S5"
- id: test_ellipse_coord_outside_added
  quantity: normalized_ellipse_coord
  unit: dimensionless
  printed: "1.5"
  basis: "Exterior point in the VASP-dilute phase (e > 1) used to test the wetting tension profile gamma(e) in Eqs. S4-S5 against Extended Data Fig. 5c."
  alternatives: ["1.25", "2.0", "2.5"]
  stands_for: "e outside droplet in Eqs. S4-S5"
- id: test_major_axis_methods_added
  quantity: droplet_major_axis_length
  unit: um
  printed: "3.5"
  basis: "Representative major axis span for an ellipsoidal droplet (AR ~ 1.4, minor axis 2.5 um) to test the Methods effective spherical diameter formula D = (a b^2)^(1/3)."
  alternatives: ["2.5", "4.0", "5.0"]
  stands_for: "a in Methods p. 15 effective spherical diameter formula"
- id: test_minor_axis_methods_added
  quantity: droplet_minor_axis_length
  unit: um
  printed: "2.5"
  basis: "Representative minor axis span paired with major axis 3.5 um to test the Methods effective spherical diameter formula D = (a b^2)^(1/3)."
  alternatives: ["1.5", "2.0", "3.0"]
  stands_for: "b in Methods p. 15 effective spherical diameter formula"
- id: test_bathe_alpha_weak_added
