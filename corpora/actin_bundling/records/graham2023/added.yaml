  unit: dimensionless
  printed: "0.01"
  basis: "Weak inter-filament coupling parameter alpha << 1 assumed qualitatively in SI Note 1 for VASP-crosslinked bundles (paper states alpha is 'really weak' without giving a numerical value)."
  alternatives: ["0.001", "0.1", "1.0"]
  stands_for: "alpha in SI Eq. S1 (Bathe et al.)"
- id: test_bathe_chi_added
  quantity: crosslinker_thickness_ratio
  unit: dimensionless
  printed: "1.5"
  basis: "Typical order-unity crosslinker thickness parameter chi in Bathe et al. (2008) Eq. S1; Graham et al. do not specify a numerical value."
  alternatives: ["1.0", "2.0", "3.0"]
  stands_for: "chi in SI Eq. S1 (Bathe et al.)"
- id: test_bathe_cqj_added
  quantity: bathe_mode_factor
  unit: dimensionless
  printed: "1.0"
  basis: "Order-unity wavenumber mode factor c(q_j) in Bathe et al. (2008) Eq. S1; Graham et al. do not specify a numerical value."
  alternatives: ["0.5", "2.0", "5.0"]
  stands_for: "c(q_j) in SI Eq. S1 (Bathe et al.)"
- id: test_elongation_time_added
  quantity: elongation_time
  unit: s
  printed: "100"
  basis: "Midpoint of the 0-200 s elongation window in Fig. 5h, used to evaluate the linear fit y = 0.0227 x."
  alternatives: ["50", "150", "200"]
  stands_for: "x (time) in Fig. 5h linear fit"
- id: fig5c_kb_um_consistent_added
  quantity: flexural_rigidity
  unit: pN*um^2
  printed: "1"
  basis: "Consistent micrometre-unit reading of SI Section 2.11 ('R_droplet = 1 um ... kb = 1 and gamma_I = 1') that reproduces the plotted numerical scale of Fig. 5c (E_bend(AR=1) = pi ~ 3.14, E_surf(AR=1) = 2*pi ~ 6.28, peak E_bend ~ 19.8), in contrast to Fig. 5c caption printing kb = 1 pN nm^2."
  alternatives: ["0.5", "2.0", "10.0"]
  stands_for: "kb = 1 (in pN*um^2) in SI Section 2.11 / Fig. 5c"
- id: fig5c_radius_1nm_added
  quantity: droplet_radius
  unit: nm
  printed: "1"
  basis: "Consistent nanometre-unit reading (R_droplet = 1 nm) matching Fig. 5c's printed caption inputs (kb = 1 pN nm^2, gamma_I = 1 pN) and printed y-axis unit Energy (pN nm), in contrast to SI Section 2.11 stating R_droplet = 1 um."
  alternatives: ["1000"]
  stands_for: "R_droplet = 1 (in nm) paired with Fig. 5c printed pN nm axis"
