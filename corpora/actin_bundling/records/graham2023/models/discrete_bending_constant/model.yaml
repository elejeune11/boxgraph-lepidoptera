id: discrete_bending_constant
name: discretized hinge bending constant of bundled-actin ring (SI Table 1)
role: model
stated:
  page: 39
  printed_page: "SI-12"
  quote: "Bending energy of bundled-actin"
  where: "SI Table 1"
equation: "k_bend = N_fil * L_p * kBT / L_cyl"
inputs:
  N_fil: {quantity: filament_count, unit: dimensionless}
  L_p: {quantity: actin_persistence_length, unit: um}
  kBT: {quantity: thermal_energy, unit: pN*nm}
  L_cyl: {quantity: segment_length, unit: nm}
outputs:
  k_bend: {quantity: discrete_bending_constant, unit: pN*nm}
settings: {}
stochastic: false
