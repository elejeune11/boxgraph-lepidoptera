id: wetting_tension_profile_eqS5
name: smooth actin-VASP wetting surface tension profile as printed (SI Eqs. S4-S5)
role: model
stated:
  page: 40
  printed_page: "SI-13"
  quote: "To ensure a smooth transition of γ around"
  where: "SI Eqs. S4-S5 (p. 40); Extended Data Fig. 5c (p. 20)"
equation: "Delta = 0.5 * (gamma_AVR - gamma_AVD); gamma(e) = Delta * tanh(k_e * (e - 1)) + Delta + gamma_AVD"
inputs:
  gamma_AVR: {quantity: wetting_surface_tension, unit: pN/nm}
  gamma_AVD: {quantity: wetting_surface_tension, unit: pN/nm}
  e: {quantity: normalized_ellipse_coord, unit: dimensionless}
  k_e: {quantity: interface_steepness, unit: dimensionless}
outputs:
  gamma: {quantity: wetting_surface_tension, unit: pN/nm}
settings: {}
stochastic: false
