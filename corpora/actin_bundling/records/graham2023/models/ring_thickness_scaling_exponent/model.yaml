id: ring_thickness_scaling_exponent
name: theoretical power-law exponent of ring thickness vs. droplet diameter from Eq. S24 with L = 2 pi R
role: model
stated:
  page: 6
  printed_page: "579"
  quote: "predicts that the ring thickness will increase in proportion to D1.5."
  where: "Main text p. 6; SI Eq. S25 (p. 43)"
built_from:
  - ring_amplitude_scaling_eqS24
  - circular_ring_contour_length
equation: "b = d(ln u_m) / d(ln D) with L = pi*D and constant L_p"
inputs:
  D: {quantity: droplet_diameter, unit: um}
  L_p: {quantity: actin_persistence_length, unit: um}
outputs:
  b: {quantity: power_law_exponent, unit: dimensionless}
settings: {}
stochastic: false
