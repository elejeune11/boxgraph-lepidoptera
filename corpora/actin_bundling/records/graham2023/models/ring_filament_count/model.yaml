id: ring_filament_count
name: number of actin filaments in bundled-actin ring (SI Table 1)
role: model
stated:
  page: 39
  printed_page: "SI-12"
  quote: "Number of filaments in the bundled"
  where: "SI Table 1; Fig. 4a (p. 7)"
equation: "N_fil = T_ring / delta"
inputs:
  T_ring: {quantity: ring_thickness, unit: nm}
  delta: {quantity: filament_spacing, unit: nm}
outputs:
  N_fil: {quantity: filament_count, unit: dimensionless}
settings: {}
stochastic: false
