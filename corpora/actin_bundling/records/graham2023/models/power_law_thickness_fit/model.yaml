id: power_law_thickness_fit
name: empirical power-law fit of actin ring thickness vs. effective droplet diameter (Figs. 3e-f, 4h)
role: fit
stated:
  page: 5
  printed_page: "578"
  quote: "Trendline represents the best fit to the power law y = axb."
  where: "Fig. 3e-f caption (p. 5); Fig. 4h caption (p. 7)"
equation: "T_ring = a * (D / 1 um)^b * 1 um"
inputs:
  D: {quantity: droplet_diameter, unit: um}
  a: {quantity: power_law_prefactor_um, unit: dimensionless}
  b: {quantity: power_law_exponent, unit: dimensionless}
outputs:
  T_ring: {quantity: ring_thickness, unit: um}
settings: {}
stochastic: false
