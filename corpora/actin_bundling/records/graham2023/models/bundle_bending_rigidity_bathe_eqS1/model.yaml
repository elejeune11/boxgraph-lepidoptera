id: bundle_bending_rigidity_bathe_eqS1
name: crosslinked actin bundle bending stiffness (Bathe et al., SI Eq. S1)
role: model
stated:
  page: 39
  printed_page: "SI-12"
  quote: "Bathe et al. showed that the bending stiffness"
  where: "SI Eq. S1"
described_from: ref-si-11
equation: "k_b = k_b_fil * N * (1 + chi^2 * (N - 1) / (1 + c_qj * (N + sqrt(N)) / alpha))"
inputs:
  k_b_fil: {quantity: flexural_rigidity, unit: pN*nm^2}
  N: {quantity: filament_count, unit: dimensionless}
  chi: {quantity: crosslinker_thickness_ratio, unit: dimensionless}
  c_qj: {quantity: bathe_mode_factor, unit: dimensionless}
  alpha: {quantity: crosslinker_coupling, unit: dimensionless}
outputs:
  k_b: {quantity: flexural_rigidity, unit: pN*nm^2}
settings: {}
stochastic: false
