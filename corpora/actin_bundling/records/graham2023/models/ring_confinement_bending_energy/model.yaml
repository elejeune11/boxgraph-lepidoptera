id: ring_confinement_bending_energy
name: circular droplet confinement bending energy (zero-fluctuation limit of Eq. 1 / S21)
role: model
stated:
  page: 43
  printed_page: "SI-16"
  quote: "primary contribution to bending energy of the bundle is from L/R2"
  where: "SI Section 2.8 (p. 43)"
equation: "E_bend_0 = (k_b / 2) * (L / R^2)"
inputs:
  k_b: {quantity: flexural_rigidity, unit: pN*nm^2}
  L: {quantity: filament_contour_length, unit: um}
  R: {quantity: droplet_radius, unit: um}
outputs:
  E_bend_0: {quantity: bending_energy, unit: pN*nm}
settings: {}
stochastic: false
