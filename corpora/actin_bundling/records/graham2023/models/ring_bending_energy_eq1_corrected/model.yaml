id: ring_bending_energy_eq1_corrected
name: corrected integral of SI Eq. S15 curvature for confined fluctuating ring
role: model
stated:
  page: 42
  printed_page: "SI-15"
  quote: "Substituting these terms in Eq. S17 and also considering"
  where: "SI Eqs. S15-S21 (p. 42)"
variant_of: ring_bending_energy_eq1
corrections:
  - equation: "SI Eqs. S17, S19, S21 (and Main Eq. 1)"
    change: "Replace (2 + m^4) with (1/2) * (1 + 6*m^2 + m^4) in the fluctuation term of E_bend"
    evidence: "Starting from the paper's own Eq. S15 curvature kappa(s)^2 = (r'' - r/R^2)^2 + (2 r'/R)^2 with r(s) = R + u_m cos(m s / R), expanding (1 + m^2)^2 yields 1 + 2 m^2 + m^4 (Eq. S17 omits 2 m^2), (2 r'/R)^2 yields 4 m^2 u_m^2 sin^2 / R^4 (Eq. S17 prints 2 u_m^2 sin^2 / R^4), and the exact integrals over a full ring L = 2 pi R are int cos^2 ds = int sin^2 ds = L/2 (Eq. S19 omits the factor 1/2), giving (1/2)*(1 + 2 m^2 + m^4 + 4 m^2) = (1 + 6 m^2 + m^4)/2."
equation: "E_bend = (k_b / 2) * (L / R^2 + (L / (2 * R^4)) * (1 + 6*m^2 + m^4) * u_m^2)"
inputs:
  k_b: {quantity: flexural_rigidity, unit: pN*nm^2}
  L: {quantity: filament_contour_length, unit: um}
  R: {quantity: droplet_radius, unit: um}
  m: {quantity: fourier_mode_number, unit: dimensionless}
  u_m: {quantity: ring_fluctuation_amplitude, unit: um}
outputs:
  E_bend: {quantity: bending_energy, unit: pN*nm}
settings: {}
stochastic: false
