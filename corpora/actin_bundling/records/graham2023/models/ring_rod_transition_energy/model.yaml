id: ring_rod_transition_energy
name: continuum bending and surface energy of an actin bundle on an elliptical droplet (Fig. 5c / SI Section 2.11)
role: model
stated:
  page: 44
  printed_page: "SI-17"
  quote: "employ a continuum model of 2D droplet with a bundle that"
  where: "SI Section 2.11 (p. 44); Fig. 5c-d (p. 8)"
built_from:
  - ellipse_perimeter_integral_eqS10
  - droplet_surface_energy_eqS12
equation: "E_bend = min_{s0} (k_b/2) int_{s0}^{s0+L} kappa(s)^2 ds; E_surf = gamma_I * P(a/b); a*b = R^2"
inputs:
  R: {quantity: droplet_radius, unit: um}
  L: {quantity: filament_contour_length, unit: um}
  k_b: {quantity: flexural_rigidity, unit: pN*nm^2}
  gamma_I: {quantity: droplet_line_tension, unit: pN}
  AR: {quantity: droplet_aspect_ratio, unit: dimensionless}
outputs:
  E_bend: {quantity: bending_energy, unit: pN*nm}
  E_surf: {quantity: surface_energy, unit: pN*nm}
  P_over_2L: {quantity: perimeter_to_2L_ratio, unit: dimensionless}
settings:
  n_arc: 4000
stochastic: false
