id: ring_rod_critical_aspect_ratio
name: critical aspect ratio P(a/b) = 2L where continuum ring bending energy drops (SI Section 2.11)
role: model
stated:
  page: 44
  printed_page: "SI-17"
  quote: "bundle energy continues to increase till P (a/b) < 2L."
  where: "SI Section 2.11 (p. 44); Fig. 5c-d (p. 8)"
built_from:
  - ellipse_perimeter_integral_eqS10
equation: "P(R*sqrt(AR), R/sqrt(AR)) = 2 * L"
inputs:
  R: {quantity: droplet_radius, unit: um}
  L: {quantity: filament_contour_length, unit: um}
outputs:
  ar_crit: {quantity: droplet_aspect_ratio, unit: dimensionless}
settings:
  n_quad: 400
  root_tol: 1.0e-10
stochastic: false
