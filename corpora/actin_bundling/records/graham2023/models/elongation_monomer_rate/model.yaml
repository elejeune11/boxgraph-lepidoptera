id: elongation_monomer_rate
name: conversion from linear bundle elongation velocity to actin monomer addition rate (p. 9)
role: processing
stated:
  page: 9
  printed_page: "582"
  quote: "ence of ATP of 23 ± 3 nm s−1, about 8 to 9 monomers per second"
  where: "Main text p. 9 (p. 582)"
from_words: true
equation: "r_mon = v / delta_l"
inputs:
  v: {quantity: bundle_elongation_rate, unit: nm/s}
  delta_l: {quantity: actin_monomer_step, unit: nm}
outputs:
  r_mon: {quantity: monomer_addition_rate, unit: 1/s}
settings: {}
stochastic: false
