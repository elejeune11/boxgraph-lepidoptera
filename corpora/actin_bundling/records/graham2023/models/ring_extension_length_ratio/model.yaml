id: ring_extension_length_ratio
name: final ring contour length to droplet diameter ratio from iterative extension protocol (SI Section 2.6)
role: model
stated:
  page: 41
  printed_page: "SI-14"
  quote: "extending the actin filament length by 0.1D each time for 21 cycles"
  where: "SI Section 2.6"
equation: "L_ratio = 1 + n_cycles * step_frac"
inputs:
  n_cycles: {quantity: ring_extension_cycles, unit: dimensionless}
  step_frac: {quantity: ring_extension_step_fraction, unit: dimensionless}
outputs:
  L_ratio: {quantity: ring_length_to_diameter_ratio, unit: dimensionless}
settings: {}
stochastic: false
