id: ring_bending_energy_eq1
name: bending energy of confined fluctuating actin ring (Eq. 1 / SI Eq. S21, single mode m)
role: model
stated:
  page: 4
  printed_page: "577"
  quote: "The total energy of the ring, including contributions from thermal"
  where: "Eq. 1 (p. 4); SI Eq. S21 (p. 42)"
described_from: ref-27
equation: "E_bend = (k_b / 2) * (L / R^2 + (L / R^4) * (2 + m^4) * u_m^2)"
inputs:
  k_b: {quantity: flexural_rigidity, unit: pN*nm^2}
  L: {quantity: filament_contour_length, unit: um}
  R: {quantity: droplet_radius, unit: um}
  m: {quantity: fourier_mode_number, unit: dimensionless}
  u_m: {quantity: ring_fluctuation_amplitude, unit: um}
outputs:
  E_bend: {quantity: bending_energy, unit: pN*nm}
settings: {}
stochastic: false
