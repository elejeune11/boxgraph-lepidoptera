id: filament_flexural_rigidity
name: single actin filament flexural rigidity (k_b_fil = L_p k_B T)
role: model
stated:
  page: 39
  printed_page: "SI-12"
  quote: "bending stiffness of individual actin filaments (kb,f il = Lp .kB T )"
  where: "SI Note 1; Eq. S24 text (p. 43)"
equation: "k_b_fil = L_p * kBT"
inputs:
  L_p: {quantity: actin_persistence_length, unit: um}
  kBT: {quantity: thermal_energy, unit: pN*nm}
outputs:
  k_b_fil: {quantity: flexural_rigidity, unit: pN*nm^2}
settings: {}
stochastic: false
