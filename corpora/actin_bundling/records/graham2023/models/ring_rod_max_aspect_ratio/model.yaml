id: ring_rod_max_aspect_ratio
name: maximum permitted elliptical droplet aspect ratio at ring-to-rod straightening (Fig. 5c / SI Section 2.11)
role: model
stated:
  page: 8
  printed_page: "581"
  quote: "The maximum permitted aspect ratio is obtained when"
  where: "Fig. 5c caption (p. 8); SI Section 2.11 (p. 44)"
equation: "(a/b)_max = L^2 / (4 * R^2)  [= pi^2 when L = 2*pi*R]"
inputs:
  L: {quantity: filament_contour_length, unit: um}
  R: {quantity: droplet_radius, unit: um}
outputs:
  ar_max: {quantity: droplet_aspect_ratio, unit: dimensionless}
settings: {}
stochastic: false
