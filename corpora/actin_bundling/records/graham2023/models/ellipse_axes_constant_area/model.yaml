id: ellipse_axes_constant_area
name: constant-area 2D elliptical droplet semi-axes from diameter and aspect ratio (SI Table 1)
role: model
stated:
  page: 39
  printed_page: "SI-12"
  quote: "Major and minor axis spans of el-"
  where: "SI Table 1 (4 a b = D_droplet^2); SI Section 2.11 (p. 44)"
equation: "a = (D_droplet / 2) * sqrt(AR), b = (D_droplet / 2) / sqrt(AR)"
inputs:
  D_droplet: {quantity: droplet_diameter, unit: um}
  AR: {quantity: droplet_aspect_ratio, unit: dimensionless}
outputs:
  a: {quantity: ellipse_semi_major_axis, unit: um}
  b: {quantity: ellipse_semi_minor_axis, unit: um}
settings: {}
stochastic: false
