id: ellipse_perimeter_series_eqS11
name: elliptical droplet perimeter via truncated Gauss-Kummer series (SI Eq. S11, 7 terms)
role: model
stated:
  page: 41
  printed_page: "SI-14"
  quote: "The perimeter is given by an infinite series as follows"
  where: "SI Eq. S11"
equation: "L = pi * (a + b) * sum_{n=0}^{n_terms-1} binom(0.5, n)^2 * ((a - b)/(a + b))^(2n)"
inputs:
  a: {quantity: ellipse_semi_major_axis, unit: um}
  b: {quantity: ellipse_semi_minor_axis, unit: um}
outputs:
  L: {quantity: droplet_perimeter, unit: um}
settings:
  n_terms: 7
stochastic: false
