  printed_page: "SI-14"
  quote: "bending stiffness of the ring Kb,ring = Kb,f il × Nf il ."
  where: "SI Section 2.6; Note 1 (p. 39)"
equation: "K_b_ring = K_b_fil * N_fil"
inputs:
