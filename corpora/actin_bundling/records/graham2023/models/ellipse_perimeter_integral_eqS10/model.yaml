id: ellipse_perimeter_integral_eqS10
name: exact elliptical droplet perimeter via arc-length integral (SI Eq. S10)
role: model
stated:
  page: 41
  printed_page: "SI-14"
  quote: "The perimeter of an ellipse, L is given by,"
  where: "SI Eqs. S8, S10"
equation: "L = 4 * int_0^(pi/2) sqrt((a sin(theta))^2 + (b cos(theta))^2) dtheta"
inputs:
  a: {quantity: ellipse_semi_major_axis, unit: um}
  b: {quantity: ellipse_semi_minor_axis, unit: um}
outputs:
  L: {quantity: droplet_perimeter, unit: um}
settings:
  n_quad: 200
stochastic: false
