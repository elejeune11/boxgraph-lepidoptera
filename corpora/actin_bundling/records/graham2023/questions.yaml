    from_source entries in either data.yaml import values from the other paper.
    (2) Rejection of spurious dimensional coincidences and tautological ports:
    claessens2008/twist_energy_per_monomer(_half) (torsional strain energy per actin monomer,
    E_twist = tau*(Delta_theta)^2/d [J], Tsuda 1996 torsional rigidity tau = GJ = 8.0e-26 N*m^2,
    d = 2.9 nm, Delta_theta = 0.989 deg -> 8.22 or 4.11 pN*nm = 2.03 or 1.02 k_B T per monomer)
