  text: >
    Cross-record ModelAtlas, citation, and biophysical audit across all 31 runnable graham2023 models
    and all 17 nastkolb2022 models (11 runnable, 6 non-runnable; Nast-Kolb et al., Mol. Biol. Cell
    33:ar91, 2022, online Jul 13 2022 / Sep 1 2022 vs. Graham et al., Nat. Phys. 19:574-585, 2023,
    received Jun 7 2022 / online Jan 30 2023):
    (1) Citations & data provenance (0 stated relations, 0 cited.yaml links): neither paper cites
    the other and neither data.yaml borrows any value from the other. They share 11 co-cited
    references: Krause 2003 (ref-1), Hansen & Mullins 2010 (ref-2, ref-si-7), Disanza 2013 (ref-5),
    Hansen & Mullins 2015 (ref-7), Bruhmann 2017 (ref-8), Breitsprecher 2008 (ref-9), Vaggi 2011
    (ref-35), Blanchoin 2014 (ref-43, misprinted as 2022 on p. 11), Legerstee 2019 (ref-44), Harker
    2019 (ref-si-8), and Winkelman 2014 (ref-si-13).
    (2) ModelAtlas audit (0 non-trivial proposed relations):
    (a) 2D single-layer filament count (excluded as too_plain): graham2023/ring_filament_count
    (N_fil = T_ring/delta, 1 op) and nastkolb2022/bundle_filament_count_2d_spacing
    (n_f = 1000*W/d_spacing, 2 ops; inverse bundle_effective_spacing, 2 ops) formalize the exact
    same 2D flat-sheet linear counting rule and verify symbolically under same_as (W = T_ring/1000,
    d_spacing = delta), but both have <= 2 ops so ModelAtlas flags too_plain = True and excludes
    them from families; they are therefore not forced into relations.yaml (both are already bridged
    in 2 hops via claessens2008/hexagonal_shell_filaments D_fil = 2*k + 1).
    (b) FRAP models (disjoint): nastkolb2022's only two non-too_plain models are single-exponential
    FRAP fits (frap_recovery_fit, 6 ops; frap_recovery_by_half_time, 8 ops), whereas graham2023
    delegates FRAP analysis to ImageJ FRAP_Profiler_v2.java (p. 15) without printing an equation and
    has 0 FRAP models (with qualitative parallel between nastkolb2022/frap_bleach_normalization and
    graham2023 Methods p. 15 bleach-corrected normalization). Testing nastkolb2022's single
    exponential a*(1 - 2^(-t/t_1/2)) on graham2023's digitized Fig. 1f curve (fig1f_frap_avg_fig,
    t >= 0) at printed a = 0.939, t_1/2 = 18 s, c = 0 yields RMSE = 6.50% (max error 10.44%; faster
    early recovery 26.1% at 5 s and slow late tail to 94.1% at 290 s; free 3-parameter fit gives
    a = 0.698, t_1/2 = 23.7 s, c = 0.208, RMSE = 2.78%; 2-parameter c = 0 fit gives a = 0.879,
    t_1/2 = 14.4 s, RMSE = 5.07%).
    (c) Elongation and thickness scaling (disjoint / too_plain): graham2023's linear_bundle_elongation
    (y = v*t, 1 op; 23 +/- 3 nm/s, fit 0.0227 um/s in Fig. 5h) and elongation_monomer_rate (v/delta_l,
    1 op; ~8-9 monomers/s) have no counterpart in nastkolb2022 (which never quantifies elongation
    velocity). Likewise, graham2023's thickness laws depend on spherical droplet diameter D or radius
    R (power_law_thickness_fit T_ring = a*D^b, b = 1.72-1.97; ring_thickness_scaling_eqS25
    u_m ~ R^1.5/sqrt(L_p)) bounded by elastocapillary buckling T_crit(D, gamma_I), whereas
    nastkolb2022/bundle_width_vasp_scaling (W ~ c_vasp, 0 ops) depends on washed SLB VASP incubation
    concentration c_vasp [uM] (digitized Fig. 2E medians 0.547 -> 4.357 um over 0.05-1 uM, up to
    95% bilayer coverage) with no droplet confinement or upper cap.
    (3) Quantitative biophysical contrast (3D PEG8k-crowded droplets vs. 2D membrane-tethered LLPS):
    (a) Crowding, VASP construct, buffer, and SLB role: graham2023 forms 3D droplets of cysteine-light
    human VASP (2-20 uM monomer = 0.5-5 uM tetramer; 10-20 uM in actin assays) using 3% (w/v) PEG8k
    in 50 mM Tris pH 7.4, 150 mM NaCl (I ~ 195 mM, lambda_D ~ 0.69 nm; 0.5 mM EDTA/EGTA omitted with
    +1 mM ATP in Figs. 5h, 6; NO profilin, NO CP, NO MgCl2) on PLL-PEG-passivated glass (whereas
    hydrophilic SLBs in Fig. 1e cause 3D droplets to wet into domes). nastkolb2022 tethers chimeric
    His6-human VASP carrying the high-affinity Dictyostelium discoideum GAB (Breitsprecher 2011;
    0.05-2 uM incubated and washed 20x with PBS, standard 0.25 uM) onto 10% DOGS-Ni-NTA fluid SLBs
    without any PEG crowder, undergoing 2D LLPS (>=0.5 uM text / 0.25-2 uM Fig. S4G-H) in KMEI buffer
    (50 mM KCl, 1 mM MgCl2, 1 mM EGTA, 20 mM imidazole pH 7.0; I ~ 72 mM, lambda_D ~ 1.13 nm) with
    10 uM profilin + 50 nM CP + 2 uM actin.
    (b) FRAP timescales vs. bleach-area-normalized diffusivity reversal: raw half-times order as
    nastkolb2022 SLB (t_1/2 = 0.102 min = 6.12 s, tau = 8.83 s, MF 0.97 -> 0.65 post-Pol) <
    graham2023 3D droplet (t_1/2 = 18 +/- 3 s, tau = 26.0 s, MF 93.9 +/- 4.89% in Fig. 1f) <
    nastkolb2022 ML (t_1/2 = 0.399 min = 23.94 s, tau = 34.5 s, MF 0.61 -> 0.57 post-Pol). However,
    nastkolb2022 bleaches a 4.96 um diameter spot (r_b = 2.48 um) vs. graham2023 Fig. 1f's 1.8 um
    spot (r_b = 0.90 um) — a 2.76x radius / 7.59x area ratio. Under 2D uniform-disk Soumpasis
    (D = 0.224*r_b^2/t_1/2), D_SLB = 0.225 um^2/s and D_ML = 0.0575 um^2/s, whereas graham2023's 3D
    droplet yields only D ~ 0.0101 um^2/s (0.0075-0.0113 um^2/s via r_b^2/(6*t_1/2) to r_b^2/(4*t_1/2))
    — ~20-30x slower than nastkolb2022's SLB and ~5-8x slower even than nastkolb2022's bundling-
    incompetent monolayer. Bundling still succeeds at D ~ 0.01 um^2/s in graham2023 because 0 nM CP
    eliminates diffusive recapture competition while droplets pre-concentrate G-actin (~12.6x in
    VASP-mutFAB, Extended Data Fig. 3e) and bundle mechanically via surface-tension confinement;
    only 10% PEG solidification (whole-droplet FRAP recovery collapsing from 41.2% to 2.3% at 300 s,
    Fig. 6b) arrests rod formation (89.4% -> 12.6% rods, Fig. 6d).
    (c) Monomeric VASP tetramerization-deletion divergence & LLPS determinants: in graham2023,
    monomeric VASP_Delta_tet (stop after aa 339, deleting coiled-coil aa 340-380 while retaining GAB
    and FAB) fails to form 3D droplets up to 56 uM and 5% PEG8k and partitions weakly (1.87x vs.
    9.36x WT, Extended Data Fig. 2b, d); VASP-IDR fails up to 100 uM / 10% PEG, VASP_Delta_EVH1
    requires 100 uM / 5% PEG, and high salt disrupts droplets (Extended Data Fig. 2e), directly
    testing nastkolb2022's p. 9 hypothesis of weak EVH1-PRR/IDR self-affinity while proving
    tetramerization is indispensable in 3D. Conversely, in nastkolb2022, monomeric VASP_Delta_Tetra
    (stop at aa 270 on chimeric human/Dicty-GAB VASP, p. 10) still colocalizes and forms 2D bundles
    on fluid SLBs (median 0.584 vs. 0.942 um, max 3.2 vs. 3 um in short segments/vortices, Fig. 3A, F)
    via 2D Ni-NTA membrane up-concentration.
    (d) Interfilament spacing divergence (15 nm vs. 22.2 / 28-70 nm) and mechanical consequence:
    graham2023 sets delta = 15 nm from Ena's ~12 nm GAB spacing (citing shared refs Harker 2019 /
    Winkelman 2014), giving 66.7 filaments per 1 um ribbon width — 1.48x nastkolb2022's integrated-
    fluorescence measurement (45 +/- 12 filaments/um -> d_eff = 22.2 nm, range 17.5-30.3 nm) and
    1.87x-4.67x nastkolb2022's VASP-diameter expectation (28-70 nm -> 14.3-35.7 filaments/um,
    printed 14-40; nastkolb2022 p. 9 cites Harker 2019 / Winkelman 2014 specifically to note VASP
    differs from fascin spacing). Substituting nastkolb2022's 22.2 nm (or 28 nm) spacing into
    graham2023's weak-coupling rigidity k_b = (T_ring/delta)*L_p*k_B T lowers ring stiffness by
    1.48x (or 1.87x) at fixed T_ring, raising the buckling threshold T_crit proportionally at fixed
    gamma_I (or requiring 1.48x-1.87x smaller gamma_I to match Fig. 4h). Finally, pre-polymerized
    F-actin is pulled down without bundling on nastkolb2022 SLBs (Fig. S4D-E, proving active
    elongation drives 2D alignment), whereas in graham2023 VASP-mutFAB still concentrates G-actin
    12.6x yet expels F-actin to the droplet exterior without bundling (Extended Data Fig. 3d-e),
    proving FAB-mediated droplet wetting plus confined polymerization drives 3D ring-to-rod bundling.

