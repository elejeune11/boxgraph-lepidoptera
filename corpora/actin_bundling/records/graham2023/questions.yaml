    quote: "we assume an average spacing of 15 nm"
    where: "SI Section 2.6 (p. 41) & Table 1 (p. 39); Main Fig. 1f (p. 2) & Methods (p. 15) vs nastkolb2022 Data analysis (p. 11)"
  text: >
    Exhaustive bidirectional cross-validation audit between graham2023 (31 runnable models [40
    output ports], 0 non-runnable; 38 origin: measured datums) and nastkolb2022 (17 models: 11
    runnable [11 output ports] + 6 non-runnable; 66 origin: measured datums) yields 2 checked
    CrossValidation entries (1 in each direction) and documents every excluded pair:
    (1) Forward direction — all 31 graham2023 models (40 ports) vs all 66 origin: measured
    datums in nastkolb2022 (2,640 port-datum pairs; 511 dimension-matching pairs: 376
    dimensionless + 135 [length], 0 matches in [energy], [force]*[length]^2, [force]/[length],
    or 1/[time]):
    - INCLUDED (1 entry in graham2023/validations.yaml): val_ring_filament_count_vs_nastkolb_1um
      (purpose: validation; zero added inputs). Evaluates ring_filament_count (N_fil = T_ring /
      delta) using Graham's assumed VASP spacing delta = 15 nm (filament_spacing_vasp_delta, SI
      Table 1 & Section 2.6) on Nast-Kolb's 1-um flat 2D bundle width (nastkolb2022/
      bundle_width_ref_1um) against nastkolb2022/filament_count_1um_intensity_measured (45 +/-
      12). Predicts 66.67 vs 45 +/- 12 (+21.67, +48.1%, +1.81 uncertainty units -> verdict:
      close, outside [33, 57] and inside 3x band [9, 81]). Evaluating with Ena GAB spacing 12 nm
      (filament_spacing_ena) gives 83.33 (not reproduced); Nast-Kolb's 28-70 nm VASP diameters
      would merely duplicate nastkolb2022's own internal cmp_nf_2d_{max,min}_vs_intensity (35.71
      reproduced, 14.29 close) and are not duplicated here.
    - EXCLUDED (all remaining 2,639 port-datum pairs):
      (a) Zero-target dimensions (16 ports: flexural_rigidity [3], energy [9], force/length [3],
      monomer_addition_rate [1]): nastkolb2022 contains 0 measured stiffness, energy, tension, or
      rate targets (0 velocity measurements, q_no_elongation_velocity_quantified).
      (b) Length ports (15 ports across 11 models) vs nastkolb2022's 9 [length] bundle-width
      measurements (bundle_width_median_vasp_025, bundle_width_median_vasp_dtetra_025,
      bundle_width_max_vasp_025, bundle_width_max_vasp_dtetra_025, bundle_width_vs_vasp_fig2e,
      bundle_width_median_vs_vasp_fig2e, bundle_width_by_elongator_fig3f,
      bundle_width_vs_actin_figs3f, bundle_width_cp_substrate_figs4f): all 15 ports represent
      physically incompatible quantities or require a 3D confining droplet radius R/D absent on
      Nast-Kolb's open flat 2D SLB (circular_ring_contour_length.L, droplet_ring_minimization_*
      .{a,b}, ellipse_axes_constant_area.{a,b}, ellipse_perimeter_*.L,
      effective_spherical_diameter.D = droplet geometry; linear_bundle_elongation.y =
      longitudinal growth length, not transverse width; power_law_thickness_fit.T_ring and
      ring_{equipartition_amplitude_eqS23,amplitude_scaling_eqS24,thickness_scaling_eqS25}.u_m
      = ring thickness/fluctuation inside a spherical droplet of diameter D or radius R).
      (c) Remaining dimensionless ports (7 ports: droplet_aspect_ratio [4], L_ratio, P_over_2L,
      power_law_exponent) and the other 46 dimensionless measured datums in nastkolb2022 (FRAP
      mobile fractions & Fig. 4C curves, lipid relaxation, intensity profiles/kinetics, width
      histograms, Spearman colocalization, bilayer decoration, VASP cluster area): zero matching
      physical quantities (nastkolb2022 has no confining droplets, aspect ratios, or closed rings).
      (d) Area (4 pore-size curves), concentration (2 VASP LLPS thresholds), and time (4
      datums: 2 FRAP t_1/2, diffraction-limited window, mDia1 decline onset) measurements in
      nastkolb2022 have 0 matching output dimensions in graham2023.
    (2) Reverse direction — all 17 nastkolb2022 models (11 runnable [11 ports] + 6 non-runnable)
    vs all 38 origin: measured datums in graham2023 (418 runnable pairs; 234 dimension-matching:
    224 dimensionless + 6 [length] + 4 [time]):
    - INCLUDED (1 entry in nastkolb2022/validations.yaml): val_frap_by_thalf_vs_graham_fig1f
      (purpose: fit_quality). Evaluates nastkolb2022/frap_recovery_by_half_time (y = a*(1 -
      2^(-t/t_1/2)) + c) on graham2023/fig1f_frap_avg_fig using Graham's own t_1/2 = 18 +/- 3 s
      (graham2023/frap_t_half), a = 0.939 (frap_amp_graham_fig1f_added, from frap_recovery_fig1f
      = 93.9 +/- 4.89%), and c = 0 (frap_baseline_offset_added, exact double-normalization match
      between Siggia 2000 and Graham Methods p. 15). Verdict: not reproduced (3/13 reproduced,
      4/13 close, 6/13 not reproduced; excluding the pre-bleach t = -10 s point [-44.11% vs
      100.4%], the 12 post-bleach points t = 5-290 s independently yield not reproduced [3/12
      reproduced, 4/12 close, 5/12 not reproduced, RMSE = 6.50%], exhibiting the exact same
      S-shaped diffusive-vs-exponential residual as nastkolb2022/cmp_frap_by_thalf_slb_prepol_fig4c;
      2D Soumpasis gives 11/12 reproduced, RMSE = 1.12%).
