  text: >
    Exhaustive bidirectional cross-record validation audit between graham2023 (31 runnable models
    [40 output ports], 0 non-runnable; 38 origin: measured datums) and zwicker2015 (81 runnable
    models [204 output ports], 0 non-runnable; 108 total datums, 0 origin: measured): 0 valid
    CrossValidation entries exist in either direction (neither paper cites the other; preexisting
    graham2023/validations.yaml entry val_ring_filament_count_vs_nastkolb_1um is preserved
    intact, and no zwicker2015/validations.yaml is created).
    (1) Direction A — all 81 runnable zwicker2015 models (204 output ports) vs all 38 origin:
    measured datums in graham2023 (7,752 port-datum pairs; 3,505 dimension-matching pairs = 78
    [length] + 3 [length]/[time] + 3,424 dimensionless; 4,247 dimension-mismatched pairs):
    0 valid CrossValidation entries. Two global empirical/physical blockers eliminate every active
    and continuum emulsion model in zwicker2015: (i) graham2023 studies strictly passive,
    equilibrium VASP LLPS driven by 3% (w/v) PEG-8000 crowding and tetramerization at constant
    temperature with zero active chemical turnover of the droplet-forming species VASP
    (k_f = k_b = 0, no A <-> B interconversion or localized catalytic cores Q_i); and (ii)
    graham2023 measures zero Cahn-Hilliard or reaction-diffusion continuum parameters
    (no bulk modulus b, gradient coefficient kappa, interface width w = 2*sqrt(kappa/b),
    3D surface tension gamma, capillary length gamma*beta, volume fractions psi/phi_0^B/phibar,
    dilute-phase diffusivity D_B, sample volume V_s for counted droplets, or droplet aging time t).
    Every audited dimension class is excluded as follows:
    - [length] (26 zwicker2015 ports x 3 graham2023 measured datums = 78 pairs; targets:
      droplet_diam_range_obs '1 to 7' um, droplet_diam_median_20uM '2.86' um, droplet_diam_max_20uM
      '7.22' um for 20 uM actin-free VASP droplets, n = 1656 in Extended Data Fig. 4e): all 3
      targets measure droplet_diameter (D = 2*R), whereas all 26 zwicker2015 [length] ports output
      distinct quantities — droplet_radius R (12 ports), critical_droplet_radius R_crit (3),
      stability_threshold_radius R_stab (2), capillary_length gamma*beta (5), interface_width w (1),
      reaction_diffusion_length l (1), system_radius R_s (1), and spinodal onset scales 1/q_c and
      lambda_c (2) — so none may be mapped to droplet_diameter under quantity identity. Moreover:
      (a) all active binary and ternary droplet-size models (binary_single_radius_eq16,
      binary_stability_radius_eq19, binary_dense_volume_eq20, binary_single_droplet_ss_solver,
      binary_multidroplet_stability_solver, Rbar_kb_scaling, Rstab_kb_scaling,
      autocatalytic_volume_eq23, autocatalytic_critical_radius, autocatalytic_emulsion_solver,
      reaction_diffusion_length_l, homogeneous_onset_wavelength_eqF1) require nonzero active
      turnover (k_f, k_b, k, Q > 0) and diverge or become indeterminate (0/0) at k_f = k_b = 0;
      (b) passive lifshitz_slyozov_scaling_corrected (<R> ~ w*(t*D_B/w^2)^(1/3), prefactor:
      unknown) cannot be tested because graham2023 has no time-course <R(t)> measurement (only a
      single-snapshot diameter distribution whose aging time t is unstated, alongside unmeasured
      dilute D_B and w, and droplets coarsen rapidly by ~1 s hydrodynamic coalescence rather than
      coalescence-free Ostwald ripening; lifshitz_slyozov_scaling_printed additionally omits factor
      w); (c) binary_critical_radius_approx (R_crit = gamma*beta/phi_0^B) predicts an unstable
      nucleation threshold radius rather than macroscopic median/max diameters and lacks both
      gamma*beta and phi_0^B; (d) capillary_length_from_micro, capillary_length_gb,
      interface_width_w, unnormalize_{binary,ternary}_params, and system_radius_Rs output
      microscopic/domain scales rather than droplet diameter (and graham2023 prints no droplet
      volume V_s paired with droplet_diam_median_20uM).
    - [length]/[time] (3 zwicker2015 ports x 1 graham2023 measured datum = 3 pairs; target:
      elongation_rate_mean_text = '23 +/- 3' nm/s): measures constant-velocity 1D linear barbed-end
      ATP-driven F-actin bundle elongation in deformed rods (AR > 15, Fig. 5h), physically disjoint
      from zwicker2015's 3 isotropic 3D spherical radial droplet growth-rate ports
      (binary_droplet_growth_eq13.dR_dt, autocatalytic_growth_eq22.dR_dt,
      coarse_grained_droplet_eq9_12.dR_dt), which also lack all measured inputs.
    - dimensionless (107 zwicker2015 ports x 32 graham2023 measured datums = 3,424 pairs): zero
      matching physical quantities across graham2023's 7 measured dimensionless families —
      morphology_abundance (11 bar charts: fig2d_*, fig3d_*, fig6d_*, edfig4c_*),
      frap_recovery_fraction (5: frap_recovery_fig1f/text, fig1f_frap_avg_fig, fig6b_frap_*),
      normalized_total_intensity (5 elongating-bundle traces: fig6f_*, fig6g_actin_avg_fig),
      droplet_aspect_ratio (4: linear_droplet_ar_high, fig3g_aspect_ratio_fig,
      fig5a_aspect_ratio_fig, edfig9e_aspect_ratio_fig), droplet_size_frequency (4 PEG histograms:
      edfig9c_*), protein_partition_coefficient (2: edfig2d_partition_fig,
      edfig3e_actin_partition_fig), and droplet_size_count (1 histogram: edfig4e_size_hist_fig) —
      versus zwicker2015's 22 dimensionless theoretical/normalized quantities (normalized radii
      R/w, coarsening rates lambda/k_0, volumes V/w^3, reaction rates, core activities, fixed-point
      and maximal monodisperse droplet counts N_max, volume fractions, stability parameter chi,
      etc.). Zwicker 2015 treats droplets as strictly spherical (AR = 1; no aspect-ratio or
      actin-morphology outputs), includes no FRAP tracer-recovery or bundle fluorescence model,
      predicts deterministic monodisperse steady states (N_max = 1 in passive emulsions) rather
      than polydisperse size histograms, and uses a double-well potential with zero flat-interface
      dilute solubility (phi_+^B(inf) = 0, so flat partition ratio psi/0 diverges; gibbs_thomson_eq6
      and coexistence_exact_eqA1 output Laplace-shifted phi_-^B and phi_+^B separately rather than
      a bulk fluorescence partition coefficient K_p = I_in/I_out).
    - [time] (2 graham2023 measured datums vs 0 [time] output ports in zwicker2015):
      vasp_droplet_fusion_time ('about 1' s, approximate viscoelastic hydrodynamic coalescence —
      hydrodynamics and coalescence are explicitly neglected in zwicker2015 pp. 2 and 11) and
      frap_t_half ('18 +/- 3' s, diffusive FRAP half-time in a 1.8 um bleach spot — zwicker2015
      declares 0 [time] outputs and its 40 1/[time] ports are reaction/coarsening/interface rates,
      not FRAP recovery rates).
    (2) Direction B — all 31 runnable graham2023 models (40 output ports) vs all 108 datums in
