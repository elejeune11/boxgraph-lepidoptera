    (3) Verified and contrasting structural bridges (5 proposed relations):
    (a) Spherical mass conservation vs thermal equipartition: under Graham's 2D flat-sheet
    convention T_ring = delta*N_fil (delta = 15 nm), claessens2008/droplet_ring_filament_number
    (n_f = (1/6)*D_d^2*(c_a/M_actin)*N_A*d) scales exactly as D^2
    (rel_claessens2008_droplet_ring_scales_power_law_D2: verified), matching the upper bound 2 of
