    sharp tanh wall f(e) = 64*(e - 1)) traps SLSQP in a higher-energy local minimum (AR = 1.81, E = 25052
    pN nm). Neither r_init_frac nor maxiter is tested in refinements.yaml.
  citation: {page: 41, printed_page: "SI-14", quote: "iteratively minimizing the total energy of the", where: "SI Section 2.6; Fig. 4e"}

- id: q_audit_ring_bending_true_polar_curvature
