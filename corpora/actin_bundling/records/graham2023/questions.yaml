    + 864 dimensionless + 45 [length] + 3 [length]/[time]; 2,150 dimension-mismatched): 0 valid
    CrossValidation entries.
    - [time] (8 ports x 2 datums = 16 pairs; targets: vasp_droplet_fusion_time 'about 1' s and
      frap_t_half '18 +/- 3' s):
      (a) vasp_droplet_fusion_time ('about 1' s, Fig. 1d bare VASP droplet fusion) carries no
      numerical precision ('about' -> no verdict in BoxGraph), AND graham2023 measures none of the
      hydrodynamic or geometric inputs required by coalescence_tau_linear_scaling,
      isotropic_coalescence_tau_energy_balance, isotropic_relaxation_rate_{printed,corrected}, or
      tactoid_shape_dynamics_ode*: zero dynamic viscosity eta, zero 3D interfacial tension gamma_I
      (only assumed 2D simulation line tension gamma_I = 1-15 pN), zero capillary velocity
      v_cap = gamma_I/eta, and zero pre-/post-fusion dimensions (L_i, L_f, delta_L, r, V) for the
      Fig. 1d droplets. Diagnostically, transferring Weirich's actin-tactoid parameters (eta ~ 3
      Pa*s, gamma_I ~ 300 nN/m) to equal-sphere VASP droplet fusion over D = 1.0-2.86 um
      (delta_L = 0.74-2.12 um) applies the wrong material (actin tactoid tension is ~10x softer
      than protein condensates, Weirich p. 4) and predicts tau_lin = 7.40-21.17 s and tau_iso =
      10.00-28.60 s (~10-30x slower than 'about 1' s; conversely, using unmeasured Soumpasis-inferred
      eta ~ 2.17-4.33 Pa*s at assumed R_h = 5-10 nm and projected gamma_3D = 1.75-5.0 uN/m gives
      tau_iso = 1.24-7.08 s, resting entirely on fabricated inputs).
      (b) frap_t_half ('18 +/- 3' s, 1.8 um bleach ROI) is a diffusive FRAP half-time, NOT a
      hydrodynamic droplet coalescence relaxation time; Weirich's FRAP models (frap_diffusion_scaling,
      stokes_einstein_ellipsoid_{diffusion,viscosity}) output D ([length]^2/[time]) or eta (Pa*s),
      neither of which is measured in graham2023 (diagnostically, frap_diffusion_scaling at L_b =
      1.8 um, tau_R = 18/ln(2) = 25.97 s gives D ~ 0.125 um^2/s vs 2D Soumpasis 0.0101 um^2/s,
      a 12.4x prefactor gap).
    - dimensionless (27 ports x 32 datums = 864 pairs):
      (a) droplet_aspect_ratio (4 datums: linear_droplet_ar_high '> 15' [no verdict],
      fig3g_aspect_ratio_fig [medians 1.020, 1.020, 1.050 vs morphology_category_index],
      fig5a_aspect_ratio_fig [medians 1.044, 1.368, 2.394 vs actin_to_vasp_ratio], and
      edfig9e_aspect_ratio_fig [means 11.52, 1.27, 1.15, 1.06 vs peg_concentration_wv]): every
      single datum measures actin-containing isotropic VASP droplets (omega = 0) deformed by
      internal stiff F-actin rings/bundles rather than bare droplets or nematic tactoids. Weirich's
      equilibrium models (tactoid_equilibrium_minimizer, tactoid_aspect_ratio_scaling,
      tactoid_aspect_ratio_large_omega) take only omega = gamma_A/gamma_I, predict strictly
      spherical AR = 1.0 at omega = 0, lack inputs for actin:VASP ratio, ring thickness, PEG %, or
      morphology index (and therefore cannot sweep over any of the three plotted x-axes), and
      cannot predict '> 15' (spurious omega inversion (L/r)^2/4 would fabricate omega = 1.43 at
      Fig. 5a 1:7.5, 33.2 at EDFig. 9e 3% PEG, and >56.25 for linear rods).
      (b) protein_partition_coefficient (edfig2d_partition_fig, edfig3e_actin_partition_fig):
      concentration_enrichment_ratio (c_dense/c_dilute) cannot predict these because graham2023
      measures fluorescence ratio I_in/I_out directly without separate c_dense and c_dilute values
