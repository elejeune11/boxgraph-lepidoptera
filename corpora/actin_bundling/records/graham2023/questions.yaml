  text: >
    No cross-record validations are entered in validations.yaml for graham2023 models (all 31
    runnable) against claessens2008's 26 origin: measured data (12 scalars, 14 digitized figure
    curves; plus 8 origin: fitted and 4 origin: derived data), because none of graham2023's
    soft-condensate 2D elastic-ring models validly predicts any rigid-fascin 3D bundle measurement
    of claessens2008 on Claessens et al.'s own experimental conditions:
    (1) 2D flat-sheet filament count model ring_filament_count (N_fil = T_ring / delta) vs.
    claessens2008 filament-count and width-in-filaments measurements (nf_max_abstract = "≈ 20",
    nf_max_confinement = "≈ 20", D_fil_fig2d_caption = "≈ 5", D_fil_fig2d_text = "5 to 6"):
    (a) Missing scalar width input and 2x TEM-vs-SAXS ambiguity: claessens2008 records no scalar
    bundle_diameter datum in nm — its only measured bundle_diameter is the 8-point TEM curve
    D_fig1c_measured(R*), indexed by effective_bound_ratio R* (cannot feed scalar port T_ring or
    sweep against scalar filament counts; Rstar_figS1_experiment is R*(n) without nm widths).
    Manually copying a plateau width into added.yaml would violate CrossValidation provenance and
    hit claessens2008/q_tem_vs_saxs_bundle_diameter (TEM plateau mean 28.09 nm at R* = 0.70, 0.90
    vs. hydrated 2-shell hexagonal SAXS width 50.35 nm flat-to-flat / 57.00 nm vertex-to-vertex).
    (b) Precision and quantity mismatch: both measured total filament-count datums
    (nf_max_abstract, nf_max_confinement) carry approximate "≈ 20" (no precision -> no verdict),
    while D_fil_fig2d_caption ("≈ 5") and D_fil_fig2d_text ("5 to 6") measure 1D transverse width
    (bundle_diameter_in_filaments) rather than total filament_count N_fil (19-20).
    (c) 2D-vs-3D packing breakdown: diagnostically, T_ring / delta gives only 1.87 (TEM 28.09 nm /
    Graham delta = 15 nm), 2.27 (TEM / Claessens a_H = 12.4 nm), or 3.36-4.60 (hydrated 50.35-57.00
    nm / 15 or 12.4 nm), underpredicting Claessens's 3D hexagonal ~20 filaments by 4.3x-10.7x
    because 3D bundles pack as n_f ~ (D/a_H)^2 rather than 2D N_fil = T_ring/delta.
    (2) Droplet-diameter ring-thickness scaling models (ring_thickness_scaling_eqS25,
    ring_amplitude_scaling_eqS24, ring_equipartition_amplitude_eqS23,
    ring_thickness_scaling_exponent, power_law_thickness_fit):
    claessens2008 measures no ring thickness vs. droplet diameter curve. D_fig1c_measured is bulk
    TEM bundle diameter vs. R* (no droplets); D_Rstar_exponent = 0.3 (origin: fitted) is
    d(ln D_bundle)/d(ln R*) rather than d(ln T_ring)/d(ln D_droplet); and Fig. 2E's
    ca_fig2e_single_ring_max and ca_fig2e_two_bundle_min (D_d = 6.88-26.96 um) measure critical
    actin_mass_concentration c_a(D_d) at which the twist-capped n_f ~ 20 single ring splits into
    2+ bundles rather than thickening as R^1.5. Diagnostically, across Claessens's Fig. 2E droplet
    diameters (6.88-22.71 um), Eq. S25 bare R^1.5/sqrt(L_p) gives 1.52-9.09 um, and Eq. S23 at
    m = 2, L_p = 17.73 um gives 0.142-0.854 um (1 filament), 31.9-191.1 nm (20 weakly coupled
    filaments), or 7.1-42.7 nm (20 rigidly N^2-coupled fascin filaments), whereas Claessens's
    actual bundle cross-section stays fixed at ~28 nm TEM / 50-57 nm hydrated SAXS.
    (3) Droplet deformation, bending/surface energy, wetting, and ellipse geometry models
    (droplet_ring_minimization_printed, droplet_ring_minimization_corrected,
    ring_bending_energy_eq1, ring_bending_energy_eq1_corrected, ring_confinement_bending_energy,
    ring_excess_bending_energy_eqS22, ring_rod_transition_energy, ring_rod_critical_aspect_ratio,
    ring_rod_max_aspect_ratio, droplet_surface_energy_eqS12, wetting_tension_profile_eqS5,
    wetting_tension_profile_eqS5_corrected, effective_spherical_diameter,
    ellipse_axes_constant_area, ellipse_perimeter_integral_eqS10, ellipse_perimeter_series_eqS11):
    claessens2008 measures no droplet aspect ratio, ellipse geometry, bending energy, surface
    energy, or wetting tension. High oil-water interfacial tension keeps Fig. 2A-C emulsion
    droplets strictly spherical (for a 20-filament fascin ring at D_d = 6.88-22.71 um, bending line
    tension is only e_bend = (k_b/2)/R^2 = 0.0057-0.0616 pN if linearly coupled or 0.113-1.233 pN
    if rigidly N^2-coupled, >= 10^4x smaller than water-in-oil line tension gamma_ow*D_d ~
    10^4-10^6 pN). Moreover, Claessens's only energy datums (E_twist_per_fascin_printed = "≈ 10",
    DeltaG_fascin_printed = "≈ 15", both origin: predicted) are microscopic torsional twist and
    fascin binding energies, not mesoscopic flexural ring bending energy.
    (4) Bundle flexural rigidity and discrete spring models (bundle_bending_rigidity_bathe_eqS1,
    bundle_bending_rigidity_linear, filament_flexural_rigidity, discrete_bending_constant,
    discrete_stretching_constant): claessens2008 (PNAS 2008, helical twist frustration) measures
    no bundle flexural rigidity EI or persistence length L_p (unlike Claessens et al. 2006 Nat.
    Mater. [claessens2008/ref-2]; its only rigidity datum tau_actin = 8 x 10^-26 N*m^2 is Tsuda
    1996 torsional stiffness GJ, origin: reported).
    (5) Remaining 4 models (linear_bundle_elongation, elongation_monomer_rate,
    circular_ring_contour_length, ring_extension_length_ratio) and remaining claessens2008 measured
    data (SAXS wavevectors q10_saxs, q_layer*, q_helical_*; SAXS curves I_saxs_fig3a_*,
    I_saxs_fig3c_data_*; helical overtwist Delta_theta_fig3d_*; bound fascin ratios Rstar_plateau,
    Rstar_figS1_experiment; multi-ABP diameter ratio D_ratio_fig4d) have zero shared observables.
    See claessens2008/q_graham2023_no_cross_validation for the reverse direction.

