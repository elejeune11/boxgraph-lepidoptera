  text: >
    Cross-record ModelAtlas, citation, and biophysical audit across all 31 runnable graham2023
    models and all 81 runnable zwicker2015 models (2,511 pairs; Zwicker, Hyman & Jülicher, Phys.
    Rev. E 92:012317, 2015):
    (1) Citations & data provenance (0 stated relations, 0 cited.yaml links): neither paper cites
    the other — graham2023 cites zero Zwicker papers (including Zwicker 2014 PNAS, 2015 PRE, and
    2017 Nat. Phys.) across all 52 main + 14 SI references, and zwicker2015 precedes graham2023 by
    8 years. Both belong to the broader biomolecular-condensate community (both cite Brangwynne
    reviews/papers and Hyman-group condensate studies: graham2023 ref-10, ref-14, ref-41 vs.
    zwicker2015 refs. 2-6, 13, 40), yet share exactly 0 bibliographic entries across all 66 x 46
    reference pairs and 0 from_source data links.
    (2) ModelAtlas audit (3 proposed non-too_plain scales_as relations in graham2023/relations.yaml:
    2 verified, 1 diagnostic not_verified; 0 same_as families):
    (a) Diffuse droplet-interface tanh profile (verified + diagnostic):
    wetting_tension_profile_eqS5_corrected (11 ops, gamma(e) = gamma_AVR + (1/2)*(gamma_AVD -
    gamma_AVR)*[1 + tanh(k_e*(e - 1))]) scales identically with zwicker2015/flat_interface_profile
    (5 ops, phi^B(x) = (1/2)*psi*[1 + tanh(x/w)]) across all three mapped variables (e, gamma_AVD,
    k_e) to max log-slope difference 1.6e-8 (rel_zwicker2015_wetting_corrected_scales_flat_interface)
    under strong confinement (gamma_AVR/gamma_AVD = 10^-12 << 1), linearized outward coordinate
    x = R*(e - 1)/2 at R = 500 nm, and effective interface width w_eff = R/(2*k_e) (= 3.91 nm at
    D = 1 um, 11.17 nm at median D = 2.86 um, 15.63 nm at D = 4 um for k_e = 64). Crucially,
    Graham's fixed dimensionless k_e = 64 in quadratic ellipse coordinates e = x^2/a^2 + y^2/b^2
    makes w_eff scale linearly with droplet radius R (and vary anisotropically on an ellipse, plus
    a 1.5% quadratic curvature shift at x = 15 nm), whereas Zwicker's Cahn-Hilliard kink width
    w = 2*sqrt(kappa/b) is a size-independent material constant coupled to surface tension
    gamma = (1/6)*psi^2*sqrt(b*kappa). Under the identical dictionary, printed
    wetting_tension_profile_eqS5 returns not_verified (log-slope discrepancy up to 1.2e2;
    rel_zwicker2015_wetting_printed_vs_flat_interface), independently corroborating
    q_eqS4_S5_wetting_sign_inverted.
    (b) 3D volume-equivalent sphere geometry (verified): effective_spherical_diameter (5 ops,
    Methods p. 15, D = (a*b^2)^(1/3) conserving 3D prolate volume V = (pi/6)*a*b^2) scales
    identically with zwicker2015/system_radius_Rs (9 ops, R_s = (3*V_s/(4*pi))^(1/3), the same 3D
    sphere-radius formula used in Zwicker Eqs. 20 and 23) to 2.2e-13 under V_s = (pi/6)*a*b^2*1e-18
    [m^3], with exact diameter-vs-radius ratio D = 2*R_eff
    (rel_zwicker2015_effective_diameter_scales_system_radius). By contrast, Graham's 2D theoretical
    models (ellipse_axes_constant_area, 4*a*b = D^2) conserve 2D cross-sectional area rather than
    3D volume, so an elongated prolate spheroid loses 1 - 1/sqrt(AR) of its 3D volume (29.3% at
    AR = 2, 50.0% at AR = 4, 68.2% at AR = pi^2 = 9.87; D_eff/D_0 = AR^(-1/6)).
    (c) Excluded too_plain & disjoint models: droplet_surface_energy_eqS12 (Delta_E = 1000*L*gamma_I,
    2 ops, too_plain) multiplies 2D perimeter L [um] by a phenomenological 2D line tension gamma_I
    [pN] (1-15 pN), whereas zwicker2015/surface_tension_gamma computes microscopic 3D Cahn-Hilliard
    surface tension gamma = (1/6)*psi^2*sqrt(b*kappa) [J/m^2 = pN/nm] and zwicker2015 declares no
    total interfacial-energy model 4*pi*R^2*gamma; linking them would require a tautological
    port-copy. Equating 2D circular surface energy 2*pi*R*gamma_I to 3D spherical 4*pi*R^2*gamma_3D
    nonetheless yields effective 3D VASP surface tension gamma_3D = gamma_I/D = 1.0-15.0 uN/m at
    D = 1 um (5.0 uN/m at benchmark gamma_I = 5 pN; 1.75 uN/m at median D = 2.86 um), right in the
    canonical 1-10 uN/m condensate range of Zwicker refs. 2-6. All remaining 10 too_plain graham2023
    models (linear_bundle_elongation y = v*t ~ t^1 vs. Lifshitz-Slyozov <R> ~ t^(1/3), etc.) and
    all elastic actin-ring bending/SLSQP/ellipse models (0 [energy] or flexural-rigidity ports in
    zwicker2015) are mathematically disjoint from Zwicker's 3D spherical reaction-diffusion active
    emulsion equations.
    (3) Core biophysical contrast — passive equilibrium VASP LLPS deformed mechanically by internal
    actin bending vs. chemically driven active emulsions stabilized against Ostwald ripening:
    (a) Absence of active chemical turnover of the droplet-forming component VASP: in graham2023,
    VASP undergoes strictly passive, equilibrium LLPS driven by 3% (w/v) PEG8k crowding and VASP
    tetramerization at constant temperature (no A <-> B enzymatic conversion of VASP, k_f = k_b = 0
    for VASP). Consequently, VASP droplets exhibit classic passive-liquid behavior: rapid
    hydrodynamic coalescence/re-rounding in ~1 s (vasp_droplet_fusion_time = "about 1" s, Fig. 1d
    0-924 ms, implying inverse capillary velocity eta/gamma_3D ~ 1 s/um and viscosity eta ~ 1-5 Pa*s;
    note zwicker2015 pp. 2 & 11 explicitly neglect hydrodynamics and coalescence), broad polydisperse
    size distributions (D = 1-7 um, median 2.86 um, max 7.22 um, n = 1656 in Extended Data Fig. 4e,
    rather than Zwicker's monodisperse active-emulsion size), and diffusive FRAP exchange
    (t_1/2 = 18 +/- 3 s, 93.9 +/- 4.89% recovery, Soumpasis D_VASP = 0.0101 um^2/s). In Zwicker's
    passive limit (k_b = 0, passive_coarsening_rate_eq18 lambda = D_B*gamma*beta/R^3), Ostwald
    ripening always proceeds (tau_OR = 1.9e4 s at dense D_B = 0.0101 um^2/s, R = 0.5 um, w = 3.9 nm,
    or 6.4-58 s if limited by dilute buffer diffusivity ~30 um^2/s); arresting it at Graham's
    median R = 1.43 um via Zwicker Eq. (19) (R_stab = [3*D_B*gamma*beta/(2*k_b)]^(1/3) ~
    (D_B*w/k_b)^(1/3)) would require active VASP deactivation turnover k_b >= 8.6e-6 s^-1 (dense-
    limited) to 0.026 s^-1 (dilute-limited), absent in Graham's buffer. Increasing PEG to 10%
    arrests fusion kinetically by viscoelastic solidification (FRAP recovery dropping to ~2% in
    Fig. 6b, Extended Data Fig. 9b) rather than by nonequilibrium chemical turnover, and inhibits
    rather than stabilizes dynamic actin bundling (rods dropping from 89.4% to 12.6% in Fig. 6d).
    (b) Inverted role of nonequilibrium chemistry (ATP-driven actin polymerization vs. active
    emulsion stabilization): although graham2023 includes a nonequilibrium reaction in Figs. 5h & 6
    (1 mM ATP-driven actin polymerization at 23 +/- 3 nm/s = 8-9 monomers/s, concentrated 12.6x
    inside droplets), the reacting species is a stiff client polymer (L_p = 17.73 um) rather than
    the VASP phase-forming fluid, and polymerization is effectively irreversible (zero F-actin FRAP
    recovery in Fig. 5i-j, k_b ~ 0). Instead of suppressing Ostwald ripening to hold droplets
    spherical and equal-sized, actin polymerization (i) breaks spherical droplet symmetry mechanically
    whenever ring bending energy (k_b/2)*L/R^2 overcomes 2D interfacial line tension gamma_I
    (1-15 pN), driving spheres -> ellipses -> linear rods (AR > 15, versus Zwicker's strictly
    spherical AR = 1 droplets), and (ii) induces positive-feedback competition among droplets for
    G-actin (p. 6: uniform actin distribution under latrunculin A vs. spontaneous droplet-to-droplet
    intensity amplification during polymerization), qualitatively paralleling Zwicker Sec. IV's
    core-free (Q = 0) autocatalytic droplets that accelerate rather than suppress inter-droplet
    asymmetry. See also zwicker2015/q_graham2023_modelatlas_and_active_vs_passive_droplet_contrast.

