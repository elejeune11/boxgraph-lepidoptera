- id: q_eqS15_S21_derivation_algebra
  kind: possible_error
  about: [ring_bending_energy_eq1, ring_bending_energy_eq1_corrected, ring_excess_bending_energy_eqS22]
  text: >
    The derivation of Main Eq. 1 / SI Eq. S21 in SI Sections 2.8 and 2.10 (pp. 42-43) contains multiple
    algebraic errors: (1) Section 2.10 uses kappa = sqrt(x''^2 + y''^2) with s = R*theta even though
    x'^2 + y'^2 != 1 for r(s) = R + u(s); (2) expanding (r'' - r/R^2)^2 in Eq. S17 drops the 2*m^2 cross
    term in (1 + m^2)^2 = 1 + 2*m^2 + m^4 and replaces (2*r'/R)^2 = 4*m^2*u_m^2*sin^2/R^4 with
    2*u_m^2*sin^2/R^4; (3) Eq. S19 omits the factor 1/2 in cos^2(x) = (1 + cos 2x)/2 and flips the signs
    of the integrated sin(2mL/R) terms, and Eq. S20 prints -R/m sin(ms/R) with wrong sign and dummy
    variable s instead of upper limit L; (4) substituting Eq. S19 into Eq. S17 as printed would give
    (3 + m^4) rather than the printed (2 + m^4) in Eq. S21 / Eq. 1. Correct integration of Eq. S15 yields
    (1/2)*(1 + 6*m^2 + m^4) (implemented in ring_bending_energy_eq1_corrected).
  citation: {page: 42, printed_page: "SI-15", quote: "Substituting these terms in Eq. S17 and also considering", where: "SI Eqs. S15-S21"}

