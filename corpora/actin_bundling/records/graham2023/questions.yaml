    coincidence with graham2023/ring_bending_energy_eq1(_corrected),
    ring_confinement_bending_energy, ring_excess_bending_energy_eqS22, and
    discrete_bending_constant (flexural bending rigidity k_b_fil = EI = 7.294e-26 N*m^2 from
    Gittes 1993, yielding 458.3 pN*nm for a 1-um single-filament ring or 0.423 pN*nm = 0.103 k_B T
