      (c) frap_recovery_fraction (frap_recovery_{fig1f,text}, fig1f_frap_avg_fig,
      fig6b_frap_{3,10}peg_fig): weirich2017 declares zero rising FRAP recovery curve models
      (tactoid_exponential_master_curve is a decaying coalescence length-shortening curve exp(-t/tau)
      from 1 to 0, not rising fluorescence recovery).
      (d) morphology_abundance (11), normalized_total_intensity (5), droplet_size_frequency (4),
      and droplet_size_count (1): zero weirich2017 models predict these quantities.
    - [length] (15 ports x 3 datums = 45 pairs; targets: droplet_diam_{range_obs,median_20uM,max_20uM}):
      all 3 measure static actin-free VASP droplet diameters (1-7 um, median 2.86 um, max 7.22 um),
      which match none of Weirich's [length] ports: actin_filament_length_cp / filament_* (no CP in
      graham2023; no filament length measured), actin_mesh_size (uncrosslinked actin mesh size, not
      VASP droplet diameter; diagnostically xi = 1.464 / 1.035 um at Graham's bulk 1 / 2 uM actin
      and 0.292 um at 12.6x enriched 25.2 uM), capillary_{fastest_mode,instability_threshold,wavelength}*
      (axial Rayleigh-Plateau pearling wavelength of fluid cylinders — Graham's droplets are spheres
      and its rods are stabilized against pearling by long F-actin; diagnostically at omega = 0,
      lambda_max = 8.89*R_0 = 1.78-4.44 um for R_0 = 200-500 nm), tactoid_coarsening_power_law
      (no <D(t)> coarsening time-course in graham2023), and tactoid_{exponential_relaxation,
      shape_dynamics_ode*,geometry_circular_arc} (unmeasured coalescence trajectories or circular
      radius/L_eq inputs).
    - [length]/[time] (3 ports x 1 datum = 3 pairs; target: elongation_rate_mean_text = '23 +/- 3'
      nm/s): positive ATP-driven barbed-end polymerization elongation is opposite in sign and
      mechanism to isotropic_relaxation_rate_{printed,corrected}.dL_dt (negative capillary
      shortening, inputs unmeasured) and disjoint from capillary_axial_velocity.v.
    See also weirich2017/q_graham2023_no_cross_validation for the reciprocal summary.

