  text: >
    Exhaustive bidirectional cross-record validation audit between graham2023 (31 runnable models
    [40 output ports], 0 non-runnable; 38 origin: measured datums across 4 dimensions) and
    weirich2017 (52 runnable models [81 output ports], 0 non-runnable; 35 origin: measured datums
    across 3 dimensions): 0 valid CrossValidation entries exist in either direction (neither paper
    cites the other — graham2023 Discussion p. 10 cites only the follow-up Scheff et al. 2020 as
    ref-40; 0 same_as relations; 0 cited.yaml links; preexisting graham2023/validations.yaml entry
    val_ring_filament_count_vs_nastkolb_1um is preserved intact, and no weirich2017/validations.yaml
    is created).
    (1) Direction A — all 31 runnable graham2023 models (40 output ports) vs all 35 origin:
    measured datums in weirich2017 (1,400 total port-datum pairs; 310 dimension-matched = 150
    [length] + 160 dimensionless; 1,090 dimension-mismatched): 0 valid CrossValidation entries.
    - Aspect ratio (dimensionless; targets: d_fig2a_aspect_ratio [L/r = 2.94 -> 2.04 across
      2.5-15 mol % filamin], d_fig3a_aspect_ratio_data [L/r = 2.04-2.16 during coarsening], and
      approximate scalars aspect_ratio_2p5_filamin '~3', aspect_ratio_15_filamin '~2' [no verdict]):
      graham2023's droplet_ring_minimization_{printed,corrected}.aspect_ratio model a 2D purely
      isotropic droplet (omega = 0) deformed only by an internal closed peripheral actin ring of
      thickness T_ring > 0 and line tension gamma_I. Weirich's homogeneous nematic tactoids are
      composed of short ~180 nm capped actin rods (<< L_p ~ 10 um) with zero peripheral actin ring
      (T_ring = 0) and zero measured gamma_I_2D, gamma_AVR, gamma_AVD, delta, or L_ratio; at
      T_ring -> 0 Graham's minimizer reduces identically to a circle AR = 1.0
      (rel_weirich2017_slsqp_reduces_tactoid_sphere) because it omits anisotropic surface anchoring
      gamma_A and filamin concentration, and has the opposite crosslinker trend (Graham's AR rises
      with actin/bundling, whereas Weirich Fig. 2A decreases from ~3 to ~2 with increasing filamin).
      ring_rod_critical_aspect_ratio.ar_crit (~9.2) and ring_rod_max_aspect_ratio.ar_max
      (= L^2/(4*R^2)) describe straightening of a closed ring with L >= 2*pi*R, not equilibrium
      nematic tactoids (diagnostically, plugging Weirich's rod length L = 0.18 um at R = 1-2 um
      gives unphysical ar_max = 0.0020-0.0081 << 1, and L = 1.0 um at R = 2.5 um gives 0.040).
    - Length ([length], 15 ports x 10 datums = 150 pairs; targets: d_fig3a_length_data,
      d_fig3b_{pre_upper,pre_lower,coalesced_data}, tactoid_length_{growth_60min,homogeneous_si},
      bundle_initial_{length,radius_main}, capillary_lambda_observed, filament_length_tactoid_range):
      droplet_ring_minimization_*.{a,b} and ellipse_axes_constant_area.{a,b} output 2D ellipse
      semi-axes rather than full tip-to-tip 3D tactoid major axis L and require unmeasured
      D_droplet / T_ring; effective_spherical_diameter needs both major and minor axes, whereas
      weirich2017 measures zero tactoid_minor_axis and zero droplet_diameter;
      circular_ring_contour_length (2*pi*R = 1.257 um at R_0 = 200 nm) and ellipse_perimeter_*
      output lateral circumference/perimeter rather than axial capillary pearling wavelength
      capillary_lambda_observed ('~10' um, approximate -> no verdict); linear_bundle_elongation
      (y = v*t, ATP-driven barbed-end polymerization fit) is physically disjoint from Weirich's
      capped non-polymerizing coarsening (d_fig3a_length_data, L ~ t^0.47 via coalescence, v
      unmeasured) and coalescence shortening (d_fig3b_coalesced_data, opposite sign dL/dt < 0);
      and ring thickness/fluctuation models (power_law_thickness_fit, ring_amplitude_scaling_eqS24,
      ring_equipartition_amplitude_eqS23, ring_thickness_scaling_eqS25) have zero ring-thickness
      measurements in weirich2017.
    - Remaining dimensionless & mismatched dimensions: ring_filament_count,
      ring_extension_length_ratio, ring_rod_transition_energy.P_over_2L, and
      ring_thickness_scaling_exponent (b = 1.5 for T_ring ~ D^b, physically distinct from Weirich's
      fitted temporal coarsening exponent 0.47 +/- 0.01) match none of Weirich's remaining 16
      dimensionless measured datums (FRAP traces d_fig1c_frap_data / d_figS1_*, Fig. 1D phase
      diagram d_fig1d_* / filamin_frac_tactoid_range, capillary_lambda_to_R0_observed, and bundle
      contraction d_fig4c_* / d_fig4d_* / d_fig4e_contractile_strain /
      bundle_contractile_strain_range). Graham's 17 other ports ([energy] x10, [force]*[length]^2
      x3, [force]/[length] x3, 1/[time] x1) have 0 dimension-matched measured datums in
