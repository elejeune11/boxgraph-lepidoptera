    quote: "2a = L given ab = R2, resulting in (a/b)max = π2."
    where: "Fig. 1f (p. 2), Fig. 3d,g (p. 5), Fig. 5a,c,h (p. 8), Main text (pp. 6, 9), Methods (pp. 14-15) & SI Section 2.11 (p. 44)"
  text: >
    Exhaustive bidirectional cross-record validation audit between graham2023 (31 runnable models
    [40 output ports], 0 non-runnable; 133 datums: 38 origin: measured [9 scalars + 29 digitized
    figures]) and its companion follow-up chandrasekaran2024 (46 models: 42 runnable [56 output
    ports] + 4 non-runnable; 224 datums: 10 origin: measured [4 scalars + 6 digitized Fig. 6D
    curves]; cites graham2023 as ref-15) yields 0 genuine CrossValidation entries in either
    direction. Preexisting graham2023/validations.yaml (val_ring_filament_count_vs_nastkolb_1um)
    is preserved untouched, and no chandrasekaran2024/validations.yaml is created. Automatic
    Synthesis same_as cross-checks between the two records also tally 0: while
    chandrasekaran2024/relations.yaml declares two verified same_as links
    (rel_graham2023_2d_ellipse_max_ar and rel_graham2023_2d_ellipse_minor_axis) and one
    unverifiable stated same_as link (rel_graham2023_2d_energy_balance_stated on non-runnable
    droplet_2d_energy_balance), none of the scalar runs on those verified 2D-ellipse models
    (run_ring_rod_ar_max, run_ellipse_axes_ar15, chandrasekaran2024/run_ellipse_2d_max_ar) feeds a
    printed scalar comparison in comparisons.yaml (both papers state the symbolic formula
    (a/b)_max = pi^2 rather than a separate numeric benchmark).
    (1) Forward direction — all 31 runnable graham2023 models (40 output ports) vs all 10 origin:
    measured datums in chandrasekaran2024 (400 total port-datum pairs; 80 dimension-matched, all
    dimensionless): 0 valid CrossValidation entries.
    - All 10 origin: measured datums in chandrasekaran2024 are Fig. 6D 3D VASP-droplet
      Shell/Ring/Disk population abundance percentages (exp_wt_disk_pct_1_7p5 = '70 +/- 13'% [WT
      from ref-15], exp_gabmut_disk_pct_1_7p5 = '< 10'% [inequality -> no verdict],
      exp_gabmut_ring_pct_1_7p5 = '53 +/- 6'%, exp_gabmut_shell_pct_1_7p5 = '37 +/- 4'%, plus 3 WT
      curves replotted from graham2023/fig3d_* and 3 new 2024 VASP-GABmut curves across
      vasp_to_actin_ratio = 20, 10, 7.5). None of graham2023's 31 models predicts population
      morphology fractions or accepts vasp_to_actin_ratio or VASP-GABmut crosslinker dissociation
      kinetics as inputs: its 8 dimensionless ports predict single-droplet aspect ratio
      (droplet_ring_minimization_{corrected,printed}.aspect_ratio,
      ring_rod_{max,critical}_aspect_ratio), ring filament count (ring_filament_count), ring length
      ratio (ring_extension_length_ratio), P/(2L) (ring_rod_transition_energy.P_over_2L), and
      diameter-scaling exponent (ring_thickness_scaling_exponent), while its remaining 32 ports
      ([length] x15, [energy] x10, [force]*[length]^2 x3, [force]/[length] x3, 1/[time] x1) have
      0 dimension-matching origin: measured targets in chandrasekaran2024.
    - Explicit exclusion of non-measured chandrasekaran2024 datums (214 total: 107 run, 88
      reported, 15 derived, 3 predicted, 1 assumed): fig7f_bending_energy_fig and
      fig7f_surface_energy_fig carry origin: predicted (from_source: ref-15) and are non-empirical
      replots of graham2023's own Fig. 5c 2D continuum model (diagnostically,
      ring_rod_transition_energy reproduces 12/12 bending and 10/10 surface points of Fig. 7F at
      consistent R = 1 nm while failing 0/12 and 0/10 at literal printed R = 1 um by 1000x in
      opposite directions, propagating q_fig5c_unit_mismatch verbatim; already verified via
      comparisons.yaml and ModelAtlas relations against MOESM9 Figure7F). Likewise,
      fig7b_length_limited_curve_fig (predicted), fig7b_aspect_ratio_bars_fig (run),
      fig7aii_aspect_ratio_vs_time (derived), aspect_ratio_max_approx ('~5.56', derived), and
      figs1f_aspect_ratio_fig (run) are 3D CytoSim/LAMMPS computer simulations rather than
      experiments and lack T_ring and gamma_I.
    (2) Reverse direction — all 42 runnable chandrasekaran2024 models (56 output ports) + 4
    non-runnable models vs all 38 origin: measured datums in graham2023 (2,128 total port-datum
    pairs; 817 dimension-matched = 39 [length] + 4 [length]/[time] + 6 [time] + 768 dimensionless):
    0 valid CrossValidation entries.
    - Bundle elongation rate (elongation_rate_mean_text = '23 +/- 3' nm/s, Fig. 5h / p. 9) &
      non-measured fig5h_linear_fit_fig: chandrasekaran2024/elongation_rate_from_growth_time (role:
      processing) is an inverse CytoSim setup formula choosing k_grow = (2*pi*R_drop - L0)/600 s =
      10.305 nm/s (swept 60-fold across 10.31..618.32 nm/s in Fig. 5), not a predictive velocity
      law of Graham's linear rods (2.23x slower on baseline inputs, -55.2% / -4.23 SD; graham2023
      states no L_target, L0, or T_grow); brownian_ratchet_growth_rate takes unloaded k_grow as
      input and requires an unmeasured tip force f (capped at <= 10.30 nm/s on baseline k_grow:
      10.30 / 6.25 / 3.79 nm/s at f = 0 / 5 / 10 pN; tautological if fed 23 nm/s at f = 0; f =
      8.03 pN fabricated if inverted); total_actin_addition_rate and
      monomer_depletion_elongation_rate output multi-filament network_elongation_rate rather than
      linear bundle tip speed. Moreover, fig5h_linear_fit_fig carries origin: predicted (plotted
      regression y = 0.0227*x for incremental growth Delta L(t) from 0, NOT origin: measured), so
      chandrasekaran2024/filament_elongation_length (L0 + k_grow*t, already linked to
      linear_bundle_elongation via rel_graham2023_linear_elongation_limit as L0 -> 0) has 0
      origin: measured length-vs-time targets in graham2023 (diagnostically, 0.1 + 0.0103*t gives
      0.358..2.057 um vs 0.570..4.241 um, 0.1 + 0.0227*t adds +0.10 um, and L0 = 0 circularly
      duplicates cmp_fig5h_linear_fit_repro).
    - Measured aspect ratios (fig3g_aspect_ratio_fig, fig5a_aspect_ratio_fig,
      edfig9e_aspect_ratio_fig, linear_droplet_ar_high = '> 15'): chandrasekaran2024's 5
      aspect_ratio models (filament_length_limited_aspect_ratio, ellipse_2d_constant_area,
      prolate_spheroid_volume_conserving, quasistatic_droplet_deformation_schedule,
      lammps_droplet_aspect_ratio) take geometric inputs (L_max, R_drop, a, t, a_LJ, c_LJ) never
      measured alongside AR in graham2023 and cannot sweep over morphology_category_index,
      actin_to_vasp_ratio, or peg_concentration_wv; linear_droplet_ar_high ('> 15') yields no
      verdict and reflects ongoing polymerization exceeding Chandrasekaran's halted-growth
      2*pi*R_drop ceilings (5.568 in 3D, 9.870 in 2D; AR = 15 requires 1.94x circumference in 3D
      or 1.23x in 2D, and ED Fig. 9e 3% PEG mean 11.52 +/- 3.97 requires 1.62x in 3D or 1.08x in
      2D).
    - Droplet diameters (droplet_diam_{range_obs,median_20uM,max_20uM}), timescales
      (vasp_droplet_fusion_time 'about 1' s [no verdict], frap_t_half '18 +/- 3' s), FRAP curves
      (fig1f_frap_avg_fig, fig6b_frap_{3,10}peg_fig, frap_recovery_{fig1f,text}), 11 morphology
      bar charts (fig2d_*, fig3d_*, fig6d_*, edfig4c_*), 5 fluorescence intensity traces
      (fig6f_*, fig6g_*), 2 partition-coefficient bar charts (edfig2d_*, edfig3e_*), and 5 size
      distributions (edfig4e_*, edfig9c_*): zero matching runnable models in chandrasekaran2024
      (all 4 full-network/MD/continuum/ODE models are runnable: false; morphology_fraction_complement
      lacks scalar P_shell/P_ring inputs in graham2023; actin_lp_table1 = 17.73 um is origin:
      reported from Gittes 1993). Diagnostically, 2D Soumpasis conversion of Fig. 1f FRAP gives
      D_Soump = 0.01008 um^2/s ([0.00864, 0.01210]), within 1.44x of Chandrasekaran's reconstructed
      stokes_einstein_diffusion at eta = 0.5 Pa*s, r = 30 nm (0.01454 um^2/s; implied eta_eff =
      0.721 Pa*s) yet 992x slower than CytoSim's prescribed D_VASP = 10 um^2/s; and ED Fig. 3e's
      12.62x VASP-mutFAB actin partitioning x 1 / 2 / 2.67 uM bulk actin yields 12.62 / 25.25 /
      33.71 uM intradroplet actin, bracketing Chandrasekaran's final_actin_concentration = 27.67 uM.
    See also chandrasekaran2024/q_graham2023_cross_validation_summary.









