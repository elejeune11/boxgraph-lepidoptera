    where: "Discussion p. 10 (583); Main text pp. 2-3, 6, 8-10; Methods p. 15; SI Table 1 & Sections 2.2-2.11 (pp. 39-44) vs weirich2017"
  text: >
    Cross-record ModelAtlas, citation, and biophysical audit across all 31 runnable graham2023
    models and all 52 runnable weirich2017 models (1,612 pairs; Weirich, Banerjee, Dasbiswas,
    Witten, Vaikuntanathan & Gardel, PNAS 114(9):2131-2136, 2017):
    (1) Citations & data provenance (0 stated relations, 0 cited.yaml links): neither paper cites
    the other — across all 52 main + 14 SI references, graham2023 cites zero Weirich papers
    (Discussion p. 10 / printed p. 583 cites only the Gardel-lab follow-up Scheff et al., Soft
    Matter 16:5659-5668, 2020 as ref-40 for nematic tactoid-like morphologies from short
    pre-polymerized filaments), and weirich2017 precedes graham2023 by 6 years. Across all
    66 x 49 reference pairs, the two bibliographies share exactly 1 review entry: Blanchoin et al.,
    Physiol. Rev. 94:235-263, 2014 (graham2023/ref-43 [misprinted year 2022] <-> weirich2017/ref-4).
    All 6 from_source entries in graham2023/data.yaml and all 7 from_source entries in
    weirich2017/data.yaml cite external literature, leaving 0 cross-record cited.yaml links.
    (2) ModelAtlas audit (9 proposed non-too_plain relations entered in graham2023/relations.yaml:
    7 verified, 2 honest diagnostic not_verified; 0 same_as families):
    (a) Core 1 — 2D isotropic droplet vs. 3D nematic tactoid interfacial free energy (5 relations):
    In the circular/spherical isotropic limit, graham2023/ring_rod_transition_energy.E_surf and
    weirich2017/tactoid_free_energy.F reduce identically to one another under the exact
    diameter-projected 2D-to-3D tension dictionary gamma_I_3D = gamma_I_2D / (2*R) (verified
    bidirectionally: rel_weirich2017_ring_rod_reduces_tactoid_sphere as AR -> 1 to 6.3e-15 and
    rel_weirich2017_tactoid_reduces_ring_rod_sphere as gamma_A -> 0, alpha -> pi/2 to 7.5e-8).
    Moreover, Graham's flagship discrete 2D SLSQP minimizer
    (droplet_ring_minimization_corrected.total_energy) reduces to the same spherical droplet energy
    when the actin ring vanishes (T_ring -> 0; rel_weirich2017_slsqp_reduces_tactoid_sphere,
    verified to 3.3e-7). Over moderate deformations matching Weirich's experimental tactoid range
    AR in [1.01, 3.0], Graham's constant-area 2D ellipse surface energy approximates Weirich's
    constant-volume 3D isotropic tactoid energy (gamma_A = 0) within 5.17% sampled (5.20% exact at
    AR = 3.0; rel_weirich2017_2d_ellipse_approx_3d_iso_tactoid, verified <= 0.06; 0.06% at AR = 1.1,
    2.34% at AR = 2.0, 5.20% at AR = 3.0). At higher elongations (AR in [2, 15], Graham's
    ring-to-rod transition), 2D constant-area perimeter (E_surf ~ AR^(1/2)) diverges fundamentally
    from 3D constant-volume surface area (F_hat ~ AR^(1/3)), verified honestly as diagnostic
    not_verified in rel_weirich2017_2d_ellipse_vs_3d_rescaled_ar_scaling (max log-slope difference
    0.16 in AR, approaching 1/2 - 1/3 = 1/6; relative energy gap reaches 18.2% at AR = 10 and
    23.1% at AR = 15, and widens to log-slope diff 0.42 over AR in [1.1, 3.0] when Weirich's
    nematic anchoring omega = 2 reverses dF_hat/d(AR) < 0 toward an equilibrium minimum at
    AR_eq = 2.83).
    (b) Core 2 — 3D nematic capillary cylinder vs. 2D droplet surface energy (2 relations):
    In the unperturbed straight-cylinder limit u -> 0, Weirich's axial director n_hat = z_hat is
    tangent to the lateral wall so Rapini-Papoular anchoring vanishes (A_omega = O(u^2) -> 0 for
    all omega), and weirich2017/capillary_free_energy_integral.F reduces identically to
    ring_rod_transition_energy.E_surf (AR = 1) under slab projection gamma_I_2D = gamma_I_3D * lam
    (rel_weirich2017_capillary_reduces_ring_rod_circle, verified to 8.4e-14; connecting graham2023
    via weirich2017 to grason2007/columnar_free_energy_eq6), while
    weirich2017/capillary_free_energy_per_length.F_over_lam shares identical (+1, +1) log-slopes in
    (R_0, gamma_I) (rel_weirich2017_capillary_per_len_scales_ring_rod, verified to 9.7e-7).
    (c) Core 3 — 3D volume-equivalent droplet size & 2D vs. 3D axis elongation (2 relations):
    Both papers extract droplet axes (a, b) or (L, r) using ImageJ 'Analyze Particles' ellipse
    fits (graham2023 Methods p. 15; weirich2017 SI p. 7). Under 3D prolate volume V = (pi/6)*a*b^2,
    effective_spherical_diameter (D = (a*b^2)^(1/3), 5 ops) scales identically with
    weirich2017/director_crossover_parameter (chi = gamma_A*V^(1/3)/K, 5 ops) to 2.2e-13
    (rel_weirich2017_eff_diam_scales_director_crossover); applied to Weirich's sharp-cusped
    circular-arc tactoids (V_tac/V_spheroid in [4/5, 1]), Graham's formula overestimates true
    volume-equivalent diameter D_vol = (6*V_tac/pi)^(1/3) by 5.36-6.62% at L/r = 2-3 (bounded
    above by (5/4)^(1/3) - 1 = 7.72%). Conversely, Graham's 2D constant-area parameterization
    (ellipse_axes_constant_area: a ~ AR^(1/2), losing 50% of 3D prolate volume by AR = 4) fails
    to match 3D volume-conserving tactoid elongation (tactoid_geometry_circular_arc.L ~ AR^(2/3);
    rel_weirich2017_ellipse_axes_vs_tactoid_major_axis_scaling, honestly not_verified, log-slope
    diff up to 0.18 in AR).
    (d) Explicit exclusions: all 11 too_plain (<=2 ops) graham2023 models (including
    droplet_surface_energy_eqS12, 2 ops — fully superseded by non-plain ring_rod_transition_energy
    and droplet_ring_minimization_corrected) and 14 too_plain + 1 curve weirich2017 models; the
    scheduler-flagged droplet_ring_minimization_corrected vs. capillary_energy_cost_corrected pair
    (positive total bending+wetting+surface energy of a 2D closed ring vs. sign-changing O(u^2)
    Rayleigh-Plateau capillary perturbation energy delta_F = (pi*lam*u^2*gamma_I/(2*R_0))*[(1+2*omega)*k^2 - 1],
    which is negative for k < (1+2*omega)^(-1/2) and scales as k^2 rather than m^4 in
    ring_excess_bending_energy_eqS22); the spurious 2*pi*R circle-circumference coincidence
    between capillary_instability_threshold_*.lambda_c (axial pearling wavelength) and
    ellipse_perimeter_* (2D lateral droplet perimeter); and all disjoint dynamic/hydrodynamic
    models in weirich2017 (FRAP/Stokes-Einstein, coalescence ODE, coarsening, mesh size) vs.
    actin bending/wetting/linear-elongation models in graham2023.
    (3) Deep biophysical contrast — passive isotropic VASP condensates mechanically deformed by
    long stiff actin rings vs. actin-as-the-droplet filamin nematic tactoids:
    (a) Phase-forming species & filament regime: in graham2023, the liquid phase is an isotropic
    multivalent protein condensate (15-20 uM tetrameric human VASP + 3% PEG8k, D = 1-7 um, median
    2.86 um, max 7.22 um), and actin is a polymerizing client concentrated ~12.6x inside droplets
    into long semiflexible filaments (L_p = 17.73 um >> D) that bend into peripheral rings and
    ultimately stiff linear bundles (zero F-actin FRAP recovery in Fig. 5i-j). In weirich2017,
    actin itself IS the liquid droplet: dilute 2.6 uM pre-polymerized short capped rods (~180 nm
    at 1.5 mol % CP, 0.1-1 um range << L_p ~ 10 um, behaving as rigid rods with negligible bulk
    bending) condense 100-fold to ~250 uM nematic droplets upon adding 1-15 mol % long (~150 nm)
    flexible transient filamin crosslinkers.
    (b) Interfacial tension & equilibrium shape driver: Graham's bare VASP droplets are purely
    isotropic (omega = 0, spherical AR = 1 equilibrium) with 2D line tension gamma_I = 1-15 pN
    translating via gamma_3D = gamma_I/D to gamma_3D ~ 1.0-15.0 uN/m at D = 1 um (5.0 uN/m at
    benchmark 5 pN; 1.75 uN/m at median D = 2.86 um) — roughly 6-17x higher (matching Weirich's
    '~10 times less than reported for other protein-based liquid droplets') than Weirich's nematic
    actin tactoids (gamma_I ~ 300 nN/m = 0.3 uN/m). Crucially, elongation has opposite physical
    origins and opposite crosslinker dependence: VASP droplets elongate only when internal actin
    ring bending energy (k_b/2)*L/R^2 overwhelms isotropic surface tension, pushing AR up to >15
    with increasing actin content (and 10% PEG solidification suppresses rods from 89.4% to 12.6%);
    conversely, Weirich's tactoids are elongated AT EQUILIBRIUM (L/r ~ 2-3, size-independent
    homogeneous director) solely from anisotropic nematic surface anchoring (omega = gamma_A/gamma_I
    = 1.1-2.2), and adding more filamin crosslinker (2.5 -> 15 mol %) DECREASES aspect ratio from
    ~3 to ~2 by boosting isotropic cohesion gamma_I faster than anchoring gamma_A.
    (c) Fluidity, diffusion, and bundle stability vs. pearling: VASP droplets exchange and fuse
    rapidly (FRAP t_1/2 = 18 +/- 3 s, tau_exp = 26.0 s, 93.9 +/- 4.89% recovery, Soumpasis
    D_VASP = 0.0101 um^2/s; droplet fusion ~1 s implying v_cap ~ 1-2 um/s), whereas Weirich's
    crosslinked actin tactoids recover ~34x slower in FRAP (tau_R = 880-900 s, D_actin ~ 0.003
    um^2/s [~3.4x slower], eta ~ 3 Pa*s, coalescence capillary velocity v_cap = 0.11-0.14 um/s,
    coarsening L ~ t^0.47). Finally, high-aspect-ratio bundles evolve in opposite directions:
    Graham's VASP-encapsulated parallel actin rods elongate linearly via ATP-driven tip
    polymerization (23 +/- 3 nm/s = 8-9 monomers/s) and remain stabilized against capillary
    breakup by the flexural rigidity of long F-actin filaments (and zipper laterally upon contact
    to reduce VASP surface energy), whereas Weirich's transient long bundles (>50 um, R_0 ~ 200 nm,
    capped rods) are fluidized liquid threads driven by interfacial tension to either pearl via a
    nematic Rayleigh-Plateau instability (lambda_max ~ 4 um predicted [corrected 1 + 2*omega],
    ~10 um observed) or contract spontaneously by 20-60% over ~10 min back toward equilibrium
    tactoids. See also weirich2017/q_graham2023_modelatlas_and_tactoid_vs_vasp_droplet_contrast.

