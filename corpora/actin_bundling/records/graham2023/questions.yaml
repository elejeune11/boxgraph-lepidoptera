- id: q_eqS2_stretch_bend_misprint
  kind: possible_error
  about: [droplet_ring_minimization_printed, droplet_ring_minimization_corrected]
  text: >
    SI Eq. S2 (p. 40 / SI-13) prints the mechanical energy of the discretized bundle as
    E_mech(r) = sum k_stretch ||r_{b,i} - r_{b,i+1}||^2 + sum k_bend (r_{b,i} - r_{b,i+1}).(r_{b,i+1} - r_{b,i+2}) / (||...|| ||...||).
    This contains two evident misprints: (1) the stretching term omits the equilibrium cylindrical
    segment length L_cyl = 100 nm from Table 1 (so energy minimization shrinks all segments toward zero
    length instead of maintaining segment length L_cyl), and (2) the bending term has a positive sign
    on the unit-tangent dot product (+cos theta_bend) without (1 - cos), which maximizes energy for
    a straight rod and minimizes it for 180-degree hairpin folds. Using (||dr|| - L_cyl)^2 and
    k_bend * (1 - u_i . u_{i+1}) (variant droplet_ring_minimization_corrected) restores the continuum
    bending limit (1/2) k_b int kappa^2 ds and yields circle-to-ellipse deformation consistent with Fig. 4f-h.
  citation: {page: 40, printed_page: "SI-13", quote: "The mechanical energy of the", where: "SI Eq. S2"}

- id: q_eqS4_S5_wetting_sign_inverted
  kind: possible_error
  about: [wetting_tension_profile_eqS5, wetting_tension_profile_eqS5_corrected, droplet_ring_minimization_printed, droplet_ring_minimization_corrected]
  text: >
    SI Eqs. S4-S5 (p. 40 / SI-13) and the y-axis label of Extended Data Fig. 5c (p. 20) print
    Delta = (1/2)*(gamma_AVR - gamma_AVD) and gamma(e) = Delta * tanh(f(e)) + Delta + gamma_AVD with
    f(e) = 64*(e - 1). Because gamma_AVR = 1e-8 pN/nm << gamma_AVD = 1e4 pN/nm, inside the droplet
    (e < 1, tanh -> -1) the printed formula evaluates to gamma(0) = -Delta + Delta + gamma_AVD = gamma_AVD
    (high penalty) and outside the droplet (e > 1, tanh -> +1) it evaluates to gamma(2) = 2*Delta + gamma_AVD
    = gamma_AVR (low penalty), which expels actin out of the droplet and directly contradicts the plotted
    curve in Extended Data Fig. 5c (which rises from gamma_AVR at e = 0 to gamma_AVD at e > 1). Swapping
    gamma_AVR and gamma_AVD (equivalently negating the Delta*tanh term) fixes the inversion.
  citation: {page: 40, printed_page: "SI-13", quote: "To ensure a smooth transition of γ around", where: "SI Eqs. S4-S5; Extended Data Fig. 5c"}

