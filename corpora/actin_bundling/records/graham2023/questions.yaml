    bundles cap at n_f ~= 20 (50-57 nm hydrated / 28.2 nm TEM) inside rigid 6-30 um emulsion
    droplets and split into 2+ bundles, whereas Graham's fluid weakly-coupled VASP rings grow
    uncapped as 2D ribbons (285-300 nm at N_fil = 19-20) inside soft 1-4 um condensates until
    deforming and unwinding into rods (AR_max = pi^2). Also note monomer spacing d = 2.9 nm in
