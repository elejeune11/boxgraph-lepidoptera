# ==========================================================================
# 1. Dimensional scale definitions & bundle stiffness parameters (Table 1)
# ==========================================================================
- id: run_filament_flexural_rigidity
  model: filament_flexural_rigidity
  inputs: {L_p: actin_lp_table1, kBT: kbt_room_temp_added}
  outputs: {k_b_fil: k_b_fil_computed}

- id: run_ring_filament_count_300nm
  model: ring_filament_count
  inputs: {T_ring: test_ring_thickness_300nm_added, delta: filament_spacing_vasp_delta}
  outputs: {N_fil: n_fil_300nm}

- id: run_bundle_rigidity_linear_300nm
  model: bundle_bending_rigidity_linear
  inputs: {K_b_fil: k_b_fil_computed, N_fil: n_fil_300nm}
  outputs: {K_b_ring: k_b_ring_linear_300nm}

- id: run_bundle_rigidity_bathe_300nm
  model: bundle_bending_rigidity_bathe_eqS1
  inputs:
    k_b_fil: k_b_fil_computed
    N: n_fil_300nm
    chi: test_bathe_chi_added
    c_qj: test_bathe_cqj_added
    alpha: test_bathe_alpha_weak_added
  outputs: {k_b: k_b_ring_bathe_300nm}

- id: run_discrete_k_stretch_300nm
  model: discrete_stretching_constant
  inputs: {N_fil: n_fil_300nm, k_stretch_fil: single_filament_k_stretch}
  outputs: {k_stretch: k_stretch_300nm}

- id: run_discrete_k_bend_300nm
  model: discrete_bending_constant
  inputs:
    N_fil: n_fil_300nm
    L_p: actin_lp_table1
    kBT: kbt_room_temp_added
    L_cyl: segment_length_lcyl
  outputs: {k_bend: k_bend_300nm}

# ==========================================================================
# 2. Continuum bending-fluctuation & ring-thickness scaling (Eq. 1, Eqs. S21-S25)
# ==========================================================================
- id: run_ring_circumference_median
  model: circular_ring_contour_length
  inputs: {R: test_droplet_radius_added}
  outputs: {L: L_ring_median}

- id: run_eq1_printed_median
  model: ring_bending_energy_eq1
  inputs:
    k_b: k_b_ring_linear_300nm
    L: L_ring_median
    R: test_droplet_radius_added
    m: test_fourier_mode_added
    u_m: test_fluctuation_amp_added
  outputs: {E_bend: E_bend_eq1_printed_median}

- id: run_eq1_corrected_median
  model: ring_bending_energy_eq1_corrected
  inputs:
    k_b: k_b_ring_linear_300nm
    L: L_ring_median
    R: test_droplet_radius_added
    m: test_fourier_mode_added
    u_m: test_fluctuation_amp_added
  outputs: {E_bend: E_bend_eq1_corrected_median}

- id: run_confinement_energy_median
  model: ring_confinement_bending_energy
  inputs:
    k_b: k_b_ring_linear_300nm
    L: L_ring_median
    R: test_droplet_radius_added
  outputs: {E_bend_0: E_bend_confinement_median}

- id: run_excess_bending_eqS22_median
  model: ring_excess_bending_energy_eqS22
  inputs:
    k_b: k_b_ring_linear_300nm
    L: L_ring_median
    R: test_droplet_radius_added
    m: test_fourier_mode_added
    u_m: test_fluctuation_amp_added
  outputs: {Delta_E_bend: Delta_E_bend_eqS22_median}

- id: run_equipartition_amp_eqS23_median
  model: ring_equipartition_amplitude_eqS23
  inputs:
    R: test_droplet_radius_added
    L: L_ring_median
    L_p: actin_lp_table1
    m: test_fourier_mode_added
  outputs: {u_m: u_m_eqS23_median}

- id: run_amplitude_scaling_eqS24_median
  model: ring_amplitude_scaling_eqS24
  inputs:
    R: test_droplet_radius_added
    L: L_ring_median
    L_p: actin_lp_table1
  outputs: {u_m: u_m_eqS24_median}

- id: run_thickness_scaling_eqS25_median
  model: ring_thickness_scaling_eqS25
  inputs:
    R: test_droplet_radius_added
    L_p: actin_lp_table1
  outputs: {u_m: u_m_eqS25_median}

- id: run_ring_thickness_exponent
  model: ring_thickness_scaling_exponent
  inputs: {D: droplet_diam_median_20uM, L_p: actin_lp_table1}
  outputs: {b: ring_thickness_exponent_pred}

- id: run_power_law_fit_fig3f_median
  model: power_law_thickness_fit
  inputs:
    D: droplet_diam_median_20uM
    a: fit_fig3f_ar_lt11_a
    b: fit_fig3f_ar_lt11_b
  outputs: {T_ring: T_ring_fit_fig3f_median}

- id: run_power_law_fit_fig4h_median
  model: power_law_thickness_fit
  inputs:
    D: droplet_diam_median_20uM
    a: fit_fig4h_ar_lt11_a
    b: fit_fig4h_ar_lt11_b
  outputs: {T_ring: T_ring_fit_fig4h_median}

# ==========================================================================
# 3. Droplet geometry, ellipse perimeter, surface energy, wetting profile
# ==========================================================================
- id: run_effective_spherical_diameter
  model: effective_spherical_diameter
  inputs: {a: test_major_axis_methods_added, b: test_minor_axis_methods_added}
  outputs: {D: D_eff_methods_test}

- id: run_ellipse_axes_ar15
  model: ellipse_axes_constant_area
  inputs: {D_droplet: fig4f_droplet_diam, AR: test_aspect_ratio_ellipse_added}
  outputs: {a: a_ellipse_ar15, b: b_ellipse_ar15}

- id: run_ellipse_perim_integral_ar15
  model: ellipse_perimeter_integral_eqS10
  inputs: {a: a_ellipse_ar15, b: b_ellipse_ar15}
  outputs: {L: P_integral_ar15}

- id: run_ellipse_perim_series_ar15
  model: ellipse_perimeter_series_eqS11
  inputs: {a: a_ellipse_ar15, b: b_ellipse_ar15}
  outputs: {L: P_series_ar15}

- id: run_droplet_surface_energy_ar15
  model: droplet_surface_energy_eqS12
  inputs: {gamma_I: fig4f_gamma_i, L: P_series_ar15}
  outputs: {Delta_E_surface: E_surf_ar15}

- id: run_wetting_printed_inside
  model: wetting_tension_profile_eqS5
  inputs:
    gamma_AVR: gamma_avr_table1
    gamma_AVD: gamma_avd_table1
    e: test_ellipse_coord_inside_added
    k_e: interface_steepness_ke
  outputs: {gamma: gamma_wet_printed_inside}

- id: run_wetting_printed_outside
  model: wetting_tension_profile_eqS5
  inputs:
    gamma_AVR: gamma_avr_table1
    gamma_AVD: gamma_avd_table1
    e: test_ellipse_coord_outside_added
    k_e: interface_steepness_ke
  outputs: {gamma: gamma_wet_printed_outside}

- id: run_wetting_corrected_inside
  model: wetting_tension_profile_eqS5_corrected
  inputs:
    gamma_AVR: gamma_avr_table1
    gamma_AVD: gamma_avd_table1
    e: test_ellipse_coord_inside_added
    k_e: interface_steepness_ke
  outputs: {gamma: gamma_wet_corrected_inside}

- id: run_wetting_corrected_outside
  model: wetting_tension_profile_eqS5_corrected
  inputs:
    gamma_AVR: gamma_avr_table1
    gamma_AVD: gamma_avd_table1
    e: test_ellipse_coord_outside_added
    k_e: interface_steepness_ke
  outputs: {gamma: gamma_wet_corrected_outside}

# ==========================================================================
# 4. 2D Discrete SLSQP droplet-ring energy minimization (SI Section 2.6, Fig. 4)
# ==========================================================================
- id: run_ring_extension_length_ratio
  model: ring_extension_length_ratio
  inputs: {n_cycles: ring_extension_cycles_val, step_frac: ring_extension_step_frac}
  outputs: {L_ratio: L_ratio_computed}

- id: run_slsqp_printed_fig4f_300nm
  model: droplet_ring_minimization_printed
  inputs:
    D_droplet: fig4f_droplet_diam
    T_ring: test_ring_thickness_300nm_added
    delta: filament_spacing_vasp_delta
    L_p: actin_lp_table1
    kBT: kbt_room_temp_added
    L_cyl: segment_length_lcyl
    k_stretch_fil: single_filament_k_stretch
    gamma_AVR: gamma_avr_table1
    gamma_AVD: gamma_avd_table1
    k_e: interface_steepness_ke
    gamma_I: fig4f_gamma_i
    L_ratio: L_ratio_computed
    noise_amp: noise_amp_val
  replicates: 3
  outputs:
    aspect_ratio: ar_slsqp_printed_300nm
    total_energy: E_slsqp_printed_300nm
    a: a_slsqp_printed_300nm
    b: b_slsqp_printed_300nm
  note: "3 replicates following Fig. 4h caption ('three trials') and Reporting Summary ('three independent initial conditions')."

- id: run_slsqp_corrected_fig4f_300nm
  model: droplet_ring_minimization_corrected
  inputs:
    D_droplet: fig4f_droplet_diam
    T_ring: test_ring_thickness_300nm_added
    delta: filament_spacing_vasp_delta
    L_p: actin_lp_table1
    kBT: kbt_room_temp_added
    L_cyl: segment_length_lcyl
    k_stretch_fil: single_filament_k_stretch
    gamma_AVR: gamma_avr_table1
    gamma_AVD: gamma_avd_table1
    k_e: interface_steepness_ke
    gamma_I: fig4f_gamma_i
    L_ratio: L_ratio_computed
    noise_amp: noise_amp_val
  replicates: 3
  outputs:
    aspect_ratio: ar_slsqp_corrected_300nm
    total_energy: E_slsqp_corrected_300nm
    a: a_slsqp_corrected_300nm
    b: b_slsqp_corrected_300nm
  note: "3 replicates following Fig. 4h caption and Reporting Summary."

# ==========================================================================
# 5. Continuum ring-to-rod transition energy landscape (Fig. 5c, SI Section 2.11)
# ==========================================================================
- id: run_fig5c_ring_circumference
  model: circular_ring_contour_length
  inputs: {R: fig5c_droplet_radius}
  outputs: {L: L_fig5c}

- id: run_ring_rod_ar_max
  model: ring_rod_max_aspect_ratio
  inputs: {L: L_fig5c, R: fig5c_droplet_radius}
  outputs: {ar_max: ar_max_fig5c}

- id: run_ring_rod_ar_crit
  model: ring_rod_critical_aspect_ratio
  inputs: {R: fig5c_droplet_radius, L: L_fig5c}
  outputs: {ar_crit: ar_crit_fig5c}

- id: run_ring_rod_energy_printed_units
  model: ring_rod_transition_energy
  inputs:
    R: fig5c_droplet_radius
    L: L_fig5c
    k_b: fig5c_kb_printed
    gamma_I: fig5c_gamma_i_printed
    AR: test_aspect_ratio_high_added
  outputs:
    E_bend: E_bend_fig5c_printed_units
    E_surf: E_surf_fig5c_printed_units
    P_over_2L: P_over_2L_fig5c_ar95
  note: "Evaluated with literal printed Fig. 5c caption units (kb = 1 pN*nm^2, gamma_I = 1 pN, R = 1 um), illustrating the 10^6 bend/surface scale mismatch."

- id: run_ring_rod_energy_um_consistent
  model: ring_rod_transition_energy
  inputs:
    R: fig5c_droplet_radius
    L: L_fig5c
    k_b: fig5c_kb_um_consistent_added
    gamma_I: fig5c_gamma_i_printed
    AR: test_aspect_ratio_high_added
  outputs:
    E_bend: E_bend_fig5c_um_consistent
    E_surf: E_surf_fig5c_um_consistent
    P_over_2L: P_over_2L_fig5c_um_consistent
  note: "Evaluated with consistent micrometre units (kb = 1 pN*um^2, gamma_I = 1 pN, R = 1 um) matching the plotted energy values of Fig. 5c (in pN*um)."

# ==========================================================================
# 6. Experimental linear bundle elongation and monomer rate (Fig. 5h, p. 8-9)
# ==========================================================================
- id: run_linear_elongation_100s
  model: linear_bundle_elongation
  inputs: {v: elongation_rate_fit_fig5h, t: test_elongation_time_added}
  outputs: {y: bundle_growth_100s}

- id: run_monomer_rate_from_mean_v
  model: elongation_monomer_rate
  inputs: {v: elongation_rate_mean_text, delta_l: actin_monomer_step_added}
  outputs: {r_mon: monomer_rate_from_mean_v}

- id: run_monomer_rate_from_fit_v
  model: elongation_monomer_rate
  inputs: {v: elongation_rate_fit_fig5h, delta_l: actin_monomer_step_added}
  outputs: {r_mon: monomer_rate_from_fit_v}

