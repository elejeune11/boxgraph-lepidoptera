# ==========================================================================
# 10. Digitized figure curve sweeps: Fig. 4f, Fig. 4g, ED Fig. 7 (SLSQP model)
# ==========================================================================
- id: run_slsqp_corrected_fig4f_sweep
  model: droplet_ring_minimization_corrected
  inputs:
    D_droplet: fig4f_droplet_diam
    delta: filament_spacing_vasp_delta
    L_p: actin_lp_table1
    kBT: kbt_room_temp_added
    L_cyl: segment_length_lcyl
    k_stretch_fil: single_filament_k_stretch
    gamma_AVR: gamma_avr_table1
    gamma_AVD: gamma_avd_table1
    k_e: interface_steepness_ke
    gamma_I: fig4f_gamma_i
    L_ratio: L_ratio_computed
    noise_amp: noise_amp_val
  sweep: {T_ring: fig4f_droplet_ar_fig}
  replicates: 1
  outputs:
    aspect_ratio: ar_slsqp_corr_fig4f_curve
    total_energy: E_slsqp_corr_fig4f_curve
    a: a_slsqp_corr_fig4f_curve
    b: b_slsqp_corr_fig4f_curve
  note: "Single seed (replicates: 1); droplet_ring_minimization_corrected at r_init_frac=0.96 is seed-invariant for 0.1 nm noise as verified by 3-replicate run_slsqp_corrected_fig4f_300nm."

- id: run_slsqp_printed_fig4g_d1_gI5_sweep
  model: droplet_ring_minimization_printed
  inputs:
    D_droplet: fig4f_droplet_diam
    delta: filament_spacing_vasp_delta
    L_p: actin_lp_table1
    kBT: kbt_room_temp_added
    L_cyl: segment_length_lcyl
    k_stretch_fil: single_filament_k_stretch
    gamma_AVR: gamma_avr_table1
    gamma_AVD: gamma_avd_table1
    k_e: interface_steepness_ke
    gamma_I: fig4f_gamma_i
    L_ratio: L_ratio_computed
    noise_amp: noise_amp_val
  sweep: {T_ring: fig4g_d1_gI5_fig}
  replicates: 1
  outputs:
    aspect_ratio: ar_slsqp_printed_fig4g_d1_gI5_curve
    total_energy: E_slsqp_printed_fig4g_d1_gI5_curve
    a: a_slsqp_printed_fig4g_d1_gI5_curve
