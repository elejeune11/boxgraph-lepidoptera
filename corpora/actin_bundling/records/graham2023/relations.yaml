- id: rel_weirich2017_ring_rod_reduces_tactoid_sphere
  kind: reduces_to
  a: graham2023/ring_rod_transition_energy
  b: weirich2017/tactoid_free_energy
  output_map:
    F: E_surf
  mapping:
    R: "R"
    alpha: "pi / 2"
    gamma_I: "1000 * gamma_I / (2 * R)"
    gamma_A: "0"
  limit:
    AR: "1"
  regime:
    R: [0.5, 3.5]
    L: [0.5, 2.5]
    k_b: [73000.0, 1500000.0]
    gamma_I: [1.0, 15.0]
    AR: [1.0, 10.0]
  tolerance: 1.0e-4
  provenance: proposed
  reason: >
    In the circular/spherical limit (AR -> 1), Graham et al.'s 2D elliptical droplet interfacial
    surface energy E_surf = gamma_I_2D * P(R, AR) (ring_rod_transition_energy, SI Section 2.11)
    reduces identically to 2*pi*R*gamma_I_2D, which equals Weirich et al.'s 3D circular-arc tactoid
    interfacial free energy F = gamma_I_3D * A + gamma_A * A_omega (tactoid_free_energy, SI p. 8)
    in the isotropic spherical limit (alpha = pi/2, gamma_A = 0, F = 4*pi*R^2*gamma_I_3D) under the
    exact diameter-projected 2D-to-3D tension dictionary gamma_I_3D = gamma_I_2D / (2*R) (with
    1 pN/um = 1000 nN/m and automatic BoxGraph energy conversion 1 pN*nm = 1e-21 J). This establishes
    the exact quantitative bridge showing that Graham's 2D line tension gamma_I_2D = 1-15 pN
    corresponds to gamma_I_3D = 1-15 uN/m at D = 1 um (5.0 uN/m at benchmark 5 pN, or 1.75 uN/m at
    median D = 2.86 um), ~6-17x higher than Weirich's actin tactoid tension gamma_I ~ 300 nN/m.
  assumptions:
    - "Circular droplet limit AR -> 1 in ring_rod_transition_energy matched to isotropic sphere alpha = pi/2, gamma_A = 0 in tactoid_free_energy."
    - "Diameter-projected 2D-to-3D interfacial tension dictionary gamma_I_3D [nN/m] = 1000 * gamma_I_2D [pN] / (2*R [um]), equating 2*pi*R*gamma_I_2D = 4*pi*R^2*gamma_I_3D."
    - "Ring contour length L in [0.5, 2.5] um stays below minimum perimeter 2*pi*R >= 3.14 um (E_surf is independent of L and k_b)."

- id: rel_weirich2017_tactoid_reduces_ring_rod_sphere
  kind: reduces_to
  a: weirich2017/tactoid_free_energy
  b: graham2023/ring_rod_transition_energy
  output_map:
    E_surf: F
  mapping:
    R: "R"
    L: "R"
    k_b: "73000.0"
    gamma_I: "2 * R * gamma_I / 1000"
    AR: "1.0"
  limit:
    gamma_A: "0"
    alpha: "1.5707963267948966"
  regime:
    R: [0.5, 3.5]
    alpha: [0.5, 1.5707963267948966]
    gamma_I: [100.0, 1000.0]
    gamma_A: [100.0, 2000.0]
  tolerance: 1.0e-4
  provenance: proposed
  reason: >
    Converse physical limit across Weirich et al.'s nematic tactoid parameter space (R in
    [0.5, 3.5] um, gamma_I in [100, 1000] nN/m, gamma_A in [100, 2000] nN/m): removing anisotropic
    nematic surface anchoring (gamma_A -> 0) and approaching spherical geometry (alpha -> pi/2 =
    1.5707963267948966 rad, within tactoid_free_energy's smooth 0 < alpha < pi domain) reduces
    Weirich's 3D Rapini-Papoular interfacial free energy F = gamma_I*A + gamma_A*A_omega identically
    to Graham et al.'s circular 2D droplet surface energy E_surf = 2*pi*R*gamma_I_2D
    (ring_rod_transition_energy at AR = 1) with diameter-projected line tension
    gamma_I_2D = 2*R*gamma_I_3D / 1000 [pN].
  assumptions:
    - "Isotropic spherical limit gamma_A -> 0 and alpha -> pi/2 (smooth interior point of 0 < alpha < pi in tactoid_free_energy)."
    - "Diameter-projected 2D line tension gamma_I_2D [pN] = 2*R [um] * gamma_I_3D [nN/m] / 1000; dummy L = R and k_b = 73000 pN*nm^2 do not affect E_surf."

- id: rel_weirich2017_slsqp_reduces_tactoid_sphere
  kind: reduces_to
  a: graham2023/droplet_ring_minimization_corrected
  b: weirich2017/tactoid_free_energy
  output_map:
    F: total_energy
  mapping:
    R: "D_droplet / 2"
    alpha: "pi / 2"
    gamma_I: "1000 * gamma_I / D_droplet"
    gamma_A: "0"
  limit:
    T_ring: "0"
  regime:
    D_droplet: [0.5, 1.5]
    T_ring: [15.0, 150.0]
    delta: [15.0, 15.0]
    L_p: [17.73, 17.73]
    kBT: [4.114, 4.114]
    L_cyl: [100.0, 100.0]
    k_stretch_fil: [100.0, 100.0]
    gamma_AVR: [1.0e-8, 1.0e-8]
    gamma_AVD: [10000.0, 10000.0]
    k_e: [64.0, 64.0]
    gamma_I: [1.0, 15.0]
    L_ratio: [3.1, 3.1]
    noise_amp: [0.1, 0.1]
  tolerance: 1.0e-4
  provenance: proposed
  reason: >
    Directly bridges Graham et al.'s flagship discrete 2D SLSQP droplet-ring free-energy minimizer
    (droplet_ring_minimization_corrected, SI Sections 2.2-2.6) to Weirich et al.'s 3D droplet
    interfacial free energy (tactoid_free_energy, SI p. 8): as the encapsulated actin ring vanishes
    (T_ring -> 0, driving N_fil = T_ring/delta -> 0 so bundle stretching, bending, and wetting
    energies all vanish), SLSQP relaxes the bare VASP droplet to a circle (AR = 1) whose minimized
    total_energy = pi*D_droplet*gamma_I_2D converges identically to Weirich's isotropic spherical
    droplet free energy F = 4*pi*(D_droplet/2)^2*gamma_I_3D (alpha = pi/2, gamma_A = 0) under
    gamma_I_3D = gamma_I_2D / D_droplet. Contrasts sharply with the scheduler-flagged
    capillary_energy_cost_corrected pair, which computes a sign-changing O(u^2) Rayleigh-Plateau
    perturbation energy of an infinite fluid cylinder rather than a positive droplet total energy.
  assumptions:
    - "Bare-droplet limit T_ring -> 0 removes the actin-ring mechanical and wetting contributions in droplet_ring_minimization_corrected, leaving only E_surf = gamma_I*P(a, b) minimized at a = b = D_droplet/2."
    - "Benchmarked over Graham's Fig. 4f-g diameter range D_droplet in [0.5, 1.5] um and full line-tension range gamma_I in [1, 15] pN with SI Table 1 parameters held fixed."
    - "Diameter-projected 3D isotropic tension gamma_I_3D [nN/m] = 1000 * gamma_I_2D [pN] / D_droplet [um] and gamma_A = 0."

- id: rel_weirich2017_2d_ellipse_approx_3d_iso_tactoid
  kind: approximated_by
  a: graham2023/ring_rod_transition_energy
  b: weirich2017/tactoid_free_energy
  output_map:
    F: E_surf
  mapping:
    R: "R * (2 / (3 * (sin(2 * atan(1 / AR)) - 2 * atan(1 / AR) * cos(2 * atan(1 / AR)) - sin(2 * atan(1 / AR))**3 / 3)))**(1 / 3)"
    alpha: "2 * atan(1 / AR)"
    gamma_I: "1000 * gamma_I / (2 * R)"
    gamma_A: "0"
  regime:
    R: [0.5, 3.5]
    L: [0.5, 2.5]
    k_b: [73000.0, 1500000.0]
    gamma_I: [1.0, 15.0]
    AR: [1.01, 3.0]
  tolerance: 0.06
  provenance: proposed
  reason: >
    Quantifies the exact 2D-vs-3D dimensionality approximation error of Graham et al.'s constant-area
    2D elliptical droplet surface energy E_surf(R, AR) = gamma_I_2D * P(R*sqrt(AR), R/sqrt(AR))
    (ring_rod_transition_energy) relative to Weirich et al.'s constant-volume 3D isotropic
    circular-arc tactoid free energy F(R_arc, alpha, gamma_I_3D, gamma_A=0) (tactoid_free_energy)
    matched at identical volume-equivalent spherical radius R_eff = R (enforcing
    V = 2*pi*R_arc^3*g(alpha) = (4*pi/3)*R^3), identical aspect ratio AR = cot(alpha/2), and
    sphere-matched tension gamma_I_3D = gamma_I_2D / (2*R). Across Weirich's entire experimental
    tactoid aspect-ratio regime AR in [1.01, 3.0] (and Graham's moderate elliptical deformation
    regime), Graham's 2D model tracks the 3D isotropic tactoid surface energy within 5.20%
    (0.06% at AR = 1.1, 0.91% at AR = 1.5, 2.34% at AR = 2.0, 5.20% at AR = 3.0) before diverging
    at high aspect ratios (10.1% at AR = 5, 18.2% at AR = 10, 23.1% at AR = 15) where 2D perimeter
    grows as AR^(1/2) versus 3D surface area AR^(1/3).
  assumptions:
    - "Purely isotropic 3D droplet comparison (gamma_A = 0); turning on Weirich's nematic anchoring (omega = 1.1-2.2) reverses the slope dF/d(AR) < 0 below AR_eq = 2*sqrt(omega) ~ 2-3."
    - "Exact 3D tactoid volume conservation V = (4*pi/3)*R^3 sets generating arc radius R_arc = R * (2 / (3*g(alpha)))^(1/3) with alpha = 2*atan(1/AR)."
    - "6% tolerance bounds the worst-case 5.20% relative difference at AR = 3.0 across AR in [1.01, 3.0]."

- id: rel_weirich2017_2d_ellipse_vs_3d_rescaled_ar_scaling
  kind: scales_as
  a: graham2023/ring_rod_transition_energy
  b: weirich2017/tactoid_rescaled_free_energy
  output_map:
    F_hat: E_surf
  mapping:
    alpha: "2 * atan(1 / AR)"
    omega: "0"
  regime:
    R: [1.0, 1.0]
    L: [1.0, 1.0]
    k_b: [73000.0, 73000.0]
    gamma_I: [5.0, 5.0]
    AR: [2.0, 15.0]
  provenance: proposed
  reason: >
    Diagnostic cross-paper scaling test probing whether Graham et al.'s 2D constant-area ellipse
    surface energy E_surf(AR) (ring_rod_transition_energy, SI Section 2.11 / Fig. 5c) shares the
    same aspect-ratio scaling as Weirich et al.'s 3D constant-volume rescaled surface free energy
    F_hat(alpha, omega=0) = F / (gamma_I * V^(2/3)) (tactoid_rescaled_free_energy, SI p. 8) across
    Graham's elongated ring-to-rod regime AR in [2, 15]. Honestly not_verified: at large aspect
    ratios, 2D constant-area perimeter grows as P ~ 4*R*AR^(1/2) (log-slope -> +1/2), whereas 3D
    constant-volume surface area grows as A ~ V^(2/3)*AR^(1/3) (log-slope -> +1/3), producing a
    fundamental 1/2 - 1/3 = 1/6 ~= 0.167 dimensionality exponent gap (measured max log-slope
    difference 0.16 across AR in [2, 15], directly explaining why Graham's 2D model overpredicts
    3D isotropic surface energy by 18.2% at AR = 10 and 23.1% at AR = 15, and echoing Graham SI
    p. 44's caveat that droplet dimensionality needs further exploration). With Weirich's nematic
    anchoring omega = 2 enabled, the log-slope discrepancy widens further to 0.42 over AR in
    [1.1, 3.0] because F_hat decreases toward an equilibrium minimum at AR_eq = 2*sqrt(2) = 2.83.
  assumptions:
    - "Exact circular-arc aspect-ratio inversion alpha = 2*atan(1/AR) evaluated at omega = 0 to isolate pure 2D-vs-3D dimensionality scaling from nematic surface anchoring."
    - "Fixed R = 1 um, L = 1 um, k_b = 73000 pN*nm^2, gamma_I = 5 pN so AR is the sole varying mapped variable."

- id: rel_weirich2017_capillary_reduces_ring_rod_circle
  kind: reduces_to
  a: weirich2017/capillary_free_energy_integral
  b: graham2023/ring_rod_transition_energy
  output_map:
    E_surf: F
  mapping:
    R: "R_0"
    L: "R_0"
    k_b: "73000.0"
    gamma_I: "gamma_I * lam / 1000"
    AR: "1.0"
  limit:
    u: "0"
  regime:
    R_0: [0.05, 0.5]
    u: [0.001, 0.01]
    lam: [2.0, 10.0]
    gamma_I: [100.0, 1000.0]
    omega: [0.5, 5.0]
  tolerance: 1.0e-4
  provenance: proposed
  reason: >
    Connects Weirich et al.'s exact 3D nematic liquid capillary free-energy integral
    F = gamma_I_3D * (A + omega * A_omega) (capillary_free_energy_integral, SI p. 9) to Graham et
    al.'s 2D circular droplet surface energy E_surf = 2*pi*R*gamma_I_2D (ring_rod_transition_energy
    at AR = 1): as the Rayleigh-Plateau sinusoidal perturbation amplitude u -> 0 across Weirich's
    experimental fluid-bundle regime (R_0 in 50-500 nm, lam in 2-10 um, gamma_I in 100-1000 nN/m,
    arbitrary anchoring omega in 0.5-5), the axial nematic director n_hat = z_hat becomes strictly
    tangent to the lateral cylinder wall so A_omega = O(u^2) vanishes identically, and F reduces
    to 2*pi*R_0*lam*gamma_I_3D = E_surf under the cylindrical-slab line-tension projection
    gamma_I_2D [pN] = gamma_I_3D [nN/m] * lam [um] / 1000. This also bridges graham2023 through
    weirich2017 to grason2007/columnar_free_energy_eq6 in the achiral unperturbed-cylinder limit.
  assumptions:
    - "Unperturbed straight-cylinder limit u -> 0 eliminates the Rapini-Papoular anchoring penalty omega*A_omega = O(u^2) for all omega."
    - "Cylindrical-slab 3D-to-2D projection gamma_I_2D [pN] = gamma_I_3D [nN/m] * lam [um] / 1000 equates lateral cylinder energy 2*pi*R_0*lam*gamma_I_3D with 2D perimeter energy 2*pi*R_0*gamma_I_2D."

- id: rel_weirich2017_capillary_per_len_scales_ring_rod
  kind: scales_as
  a: weirich2017/capillary_free_energy_per_length
  b: graham2023/ring_rod_transition_energy
  output_map:
    E_surf: F_over_lam
  mapping:
    R: "R_0"
    L: "R_0"
    k_b: "73000.0"
    gamma_I: "gamma_I / 1000"
    AR: "1.0"
  regime:
    R_0: [0.05, 0.5]
    u: [1.0e-5, 1.0e-4]
    lam: [2.0, 10.0]
    gamma_I: [100.0, 1000.0]
    omega: [0.5, 5.0]
  provenance: proposed
  reason: >
    Verifies identical bilinear (+1, +1) scaling in radius (R_0 <-> R) and isotropic interfacial
    tension (gamma_I_3D <-> gamma_I_2D) between Weirich et al.'s nematic capillary interfacial free
    energy per axial length F/lam = 2*pi*R_0*gamma_I_3D * (1 + O((u/R_0)^2))
    (capillary_free_energy_per_length [pN], SI p. 9) and Graham et al.'s 2D circular droplet
    surface energy E_surf = 2*pi*R*gamma_I_2D (ring_rod_transition_energy [pN*nm] at AR = 1) in
    the small-perturbation regime u/R_0 <= 2e-3 across all anchoring strengths omega in [0.5, 5.0].
  assumptions:
    - "Small-perturbation regime u/R_0 <= 2e-3 so O((u/R_0)^2) capillary and anchoring corrections are < 1e-5."
    - "Unit slab height (1 um) relates capillary energy per axial length F/lam [pN] to 2D droplet surface energy E_surf [pN*nm]; constant factor absorbed by scales_as."

- id: rel_weirich2017_eff_diam_scales_director_crossover
  kind: scales_as
  a: graham2023/effective_spherical_diameter
  b: weirich2017/director_crossover_parameter
  output_map:
    chi: D
  mapping:
    gamma_A: "600.0"
    V: "(pi / 6) * a * b**2"
    K: "1.0"
  regime:
    a: [1.0, 10.0]
    b: [0.5, 7.0]
  provenance: proposed
  reason: >
    Connects both papers' 3D volume-equivalent linear size measures for elongated droplets of full
    major axis a and minor axis b: Graham et al.'s prolate-spheroid effective spherical diameter
    D = (a*b^2)^(1/3) = (6*V/pi)^(1/3) (Methods p. 15, effective_spherical_diameter, 5 ops) and
    Weirich et al.'s homogeneous-to-bipolar nematic director crossover parameter
    chi = gamma_A * V^(1/3) / K (SI p. 8, director_crossover_parameter, 5 ops). Under the exact
    3D prolate-spheroid volume V = (pi/6)*a*b^2, both models share identical (+1/3, +2/3)
    log-slopes in (a, b) with constant prefactor (pi/6)^(1/3) * gamma_A / K. Note that when
    Graham's prolate-spheroid formula D_eff = (L*r^2)^(1/3) is applied to Weirich's sharp-cusped
    circular-arc tactoids (tactoid_geometry_circular_arc, where V_tac/V_spheroid shrinks from 1 at
    AR = 1 to 4/5 as AR -> oo), D_eff overestimates true volume-equivalent spherical diameter
    D_vol = (6*V_tac/pi)^(1/3) by 5.36-6.62% across Weirich's L/r = 2-3 tactoids (bounded above by
    (5/4)^(1/3) - 1 = 7.72%).
  assumptions:
    - "3D prolate-spheroid volume V = (pi/6)*a*b^2 [um^3] for full major axis a in [1, 10] um and minor axis b in [0.5, 7] um."
    - "Fixed nematic anchoring gamma_A = 600 nN/m (Weirich omega = 2 at gamma_I = 300 nN/m) and Frank constant K = 1 pN so V^(1/3) scaling in (a, b) is isolated cleanly."

- id: rel_weirich2017_ellipse_axes_vs_tactoid_major_axis_scaling
  kind: scales_as
  a: graham2023/ellipse_axes_constant_area
  b: weirich2017/tactoid_geometry_circular_arc
  output_map:
    L: a
  mapping:
    R: "(D_droplet / 2) * (2 / (3 * (sin(2 * atan(1 / AR)) - 2 * atan(1 / AR) * cos(2 * atan(1 / AR)) - sin(2 * atan(1 / AR))**3 / 3)))**(1 / 3)"
    alpha: "2 * atan(1 / AR)"
  regime:
    D_droplet: [1.0, 7.0]
    AR: [1.5, 10.0]
  provenance: proposed
  reason: >
    Diagnostic geometric scaling test contrasting Graham et al.'s 2D constant-area ellipse
    elongation parameterization (ellipse_axes_constant_area, SI Table 1: a = sqrt(AR)*D_droplet/2,
    b = D_droplet/(2*sqrt(AR)), conserving pi*a*b = pi*D_droplet^2/4) against Weirich et al.'s 3D
    constant-volume circular-arc tactoid major axis L = 2*R_arc*sin(alpha)
    (tactoid_geometry_circular_arc, SI p. 8) at identical initial spherical diameter D_droplet
    (V = (pi/6)*D_droplet^3) and aspect ratio AR = cot(alpha/2). Honestly not_verified: although
    both share identical linear (+1) scaling in D_droplet, Graham's 2D constant-area major axis
    grows as AR^(+1/2) (causing 3D prolate volume (4*pi/3)*a*b^2 to shrink as AR^(-1/2), losing
    50% of volume by AR = 4 and 68% by AR = pi^2), whereas a 3D volume-conserving tactoid elongates
    faster as L ~ (5/4)^(1/3)*D_droplet*AR^(+2/3) (log-slope discrepancy up to 0.18 across AR in
    [1.5, 10], asymptotically 2/3 - 1/2 = 1/6 ~= 0.167).
  assumptions:
    - "Exact 3D volume conservation V = 2*pi*R_arc^3*g(alpha) = (pi/6)*D_droplet^3 and circular-arc aspect-ratio inversion alpha = 2*atan(1/AR)."
    - "Compares 2D semi-major axis a against 3D full major axis L (factor of 2 absorbed by scales_as, isolating the AR^(1/2) vs AR^(2/3) exponent gap)."
