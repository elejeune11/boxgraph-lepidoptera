- id: rel_claessens2008_droplet_ring_scales_power_law_D2
  kind: scales_as
  a: claessens2008/droplet_ring_filament_number
  b: graham2023/power_law_thickness_fit
  output_map:
    T_ring: n_f
  mapping:
    D: "D_d"
    a: "0.0476"
    b: "2.0"
  regime:
    c_a: [0.02, 1.0]
    D_d: [1.0, 30.0]
    M_actin: [42000.0, 43000.0]
    d: [2.7, 2.9]
  provenance: proposed
  reason: >
    Under Graham et al.'s 2D flat-sheet ring-thickness convention (T_ring = delta * N_fil, SI
    Section 2.1 and Table 1, delta = 15 nm), uniform internal F-actin concentration c_a inside a
    spherical droplet of diameter D_d (Claessens et al. 2008, p. 2, droplet_ring_filament_number:
    n_f = (1/6) * D_d^2 * (c_a / M_actin) * N_A * d) yields quadratic ring-thickness scaling
    T_ring = delta * n_f = a_mass * D_d^2 with droplet diameter D = D_d. This matches
    graham2023/power_law_thickness_fit at b = 2.0 (the printed upper bound of Graham et al.'s
    cited spherical-confinement exponent range 'between 1.5 and 2' on p. 6 and within 1.6% of
    Fig. 3e's measured spherical-rings exponent b = 1.9682, vs 31% above Eq. S25's D^1.5). At
    Graham et al.'s measured G-actin partitioning into VASP-mutFAB droplets (12.62x in Extended
    Data Fig. 3e x 1 uM bulk = 12.62 uM), the mass-conservation prefactor evaluates to
    a_mass = 0.0513 um^-1 (d = 2.7 nm) or 0.0551 um^-1 (d = 2.9 nm), closely bracketing Fig. 3e's
    empirical rings fit a = 0.0476 um^-1 (which implies 11.7 uM / 10.9 uM internal F-actin).
  assumptions:
    - "Uniform internal F-actin concentration c_a across droplet diameters D_d (ignoring droplet-to-droplet partitioning scatter or monomer depletion)."
    - "Graham et al.'s 2D flat-sheet linear ring-thickness convention T_ring = delta * N_fil (SI Section 2.1, Table 1); by contrast, Claessens et al.'s 3D hexagonal cross-section (D ~ n_f^(1/2)) scales linearly as D_bundle ~ D_d^1 and caps at n_f ~= 20."
    - "b = 2.0 fixes power_law_thickness_fit to the spherical mass-conservation exponent (upper bound of lit_ring_thickness_exponent_range); empirical fits in Figs. 3e-f and 4h give b = 1.9682, 1.8456, 1.8037, and 1.7195."

- id: rel_claessens2008_droplet_ring_vs_eqS25_scaling
  kind: scales_as
  a: claessens2008/droplet_ring_filament_number
  b: graham2023/ring_thickness_scaling_eqS25
  output_map:
    u_m: n_f
  mapping:
    R: "D_d / 2"
    L_p: "17.73"
  regime:
    c_a: [0.02, 1.0]
    D_d: [1.0, 30.0]
    M_actin: [42000.0, 43000.0]
    d: [2.7, 2.9]
  provenance: proposed
  reason: >
    Directly tests whether the two papers' analytical models for equatorial actin rings inside
    spherical droplets of diameter D_d = 2*R yield the same diameter scaling: Claessens et al.'s
    3D spherical mass conservation (droplet_ring_filament_number: n_f ~ c_a * D_d^2, giving
    T_ring = delta * n_f ~ D_d^2 under Graham's 2D sheet convention) vs Graham et al.'s SI
    Eq. S25 thermal-fluctuation equipartition model (u_m ~ R^1.5 / sqrt(L_p) at constant
    single-filament L_p = 17.73 um). Not verified: the log-slopes in D_d diverge by exactly 0.50
    (2.0 vs 1.5), whereas Graham et al.'s experimental spherical-droplet fits (b = 1.72-1.97,
    especially Fig. 3e rings b = 1.9682) lie closer to the mass-conservation exponent 2.0.
  assumptions:
    - "Exact spherical droplet radius-diameter identity R = D_d / 2; single-filament persistence length held constant at L_p = 17.73 um (SI Table 1)."
    - "Compares 2D flat-sheet mass-conserving thickness scaling (T_ring = delta * n_f ~ D_d^2) against thermal fluctuation amplitude scaling (u_m ~ R^1.5); note that if L_p is instead treated as bundle persistence length L_p,bundle ~ n_f (q_lp_bundle_vs_filament_scaling), Eq. S25 drops further to R^1.0 (or R^0.5 under n_f ~ R^2)."

- id: rel_claessens2008_droplet_conc_scales_ring_bending_density
  kind: scales_as
  a: claessens2008/droplet_critical_concentration
  b: graham2023/ring_confinement_bending_energy
  output_map:
    E_bend_0: c_a
  mapping:
    k_b: "17.73 * 1000 * 4.114 * n_f"
    L: "1"
    R: "D_d / 2"
  regime:
    n_f: [1.0, 50.0]
    D_d: [1.0, 30.0]
    M_actin: [42000.0, 43000.0]
    d: [2.7, 2.9]
  provenance: proposed
  reason: >
    Connects Claessens et al.'s spherical-droplet ring mass-conservation boundary
    (droplet_critical_concentration: c_a = 6 * n_f * M_actin / (N_A * d * D_d^2)) to Graham et
    al.'s circular confinement bending energy (ring_confinement_bending_energy:
    E_bend_0 = (k_b / 2) * L / R^2) evaluated per unit ring contour length (L = 1 um, giving the
    intensive bending line tension e_bend = E_bend_0 / L that directly competes with 2D droplet
    interfacial line tension gamma_I = E_surf / L) under Graham's weak-coupling linear bundle
    rigidity k_b = n_f * L_p * k_B T (L_p = 17.73 um, k_B T = 4.114 pN*nm) and R = D_d / 2. Both
    models share identical log-slopes in filament number n_f (+1) and droplet diameter D_d (-2),
    showing that for weakly coupled rings at uniform internal actin concentration, the
    elastocapillary energy ratio E_bend_0 / E_surf = e_bend / gamma_I =
    (k_b_fil * N_A * d / (3 * M_actin)) * (c_a / gamma_I) is independent of droplet diameter D_d
    — explaining both why Fig. 5b's droplet aspect ratios collapse onto internal actin intensity
    and why Fig. 4h's buckling threshold T_crit ~ D^2 runs parallel to mass-conserving T_ring ~ D^2.
  assumptions:
    - "Weak inter-filament coupling (linear bundle rigidity k_b = n_f * L_p * k_B T from SI Note 1 and Section 2.6; for strongly coupled rigid fascin bundles in Bathe Eq. S1 at alpha -> oo, k_b ~ n_f^2 breaks this linear n_f scaling until Claessens's twist cap freezes n_f <= 20)."
    - "Unit ring contour length L = 1 um so E_bend_0 evaluates confinement bending energy per micrometre of ring perimeter (e_bend = E_bend_0 / L); total ring bending energy (at L = pi * D_d) scales instead as n_f / D_d^1, canceling the same pi * D_d factor present in E_surf = gamma_I * pi * D_d."

- id: rel_claessens2008_hex_shells_scales_ring_filament_count
  kind: scales_as
  a: claessens2008/hexagonal_shell_filaments
  b: graham2023/ring_filament_count
  output_map:
    N_fil: D_fil
  mapping:
    T_ring: "12.4 * sqrt((2 * sqrt(3) / pi) * (1 + 3 * k * (k + 1)))"
    delta: "12.4"
  regime:
    k: [3.0, 20.0]
  provenance: proposed
  reason: >
    Connects Claessens et al.'s discrete 3D concentric hexagonal-shell bundle diameter in filaments
    D_fil = 2*k + 1 (p. 2, containing n_f = 1 + 3*k*(k + 1) total filaments) to Graham et al.'s 2D
    flat-sheet ring filament count N_fil = T_ring / delta (SI Section 2.1, Table 1, Section 2.6).
    Mapping the 3D hexagonal cross-section to its area-equivalent hydrated circular diameter
    T_ring(k) = 2 * sqrt(n_f(k) / (pi * rho_0)) = a_H * sqrt((2*sqrt(3)/pi) * (1 + 3*k*(k + 1)))
    [nm] at Claessens's SAXS lattice spacing a_H = 12.4 nm and setting delta = a_H = 12.4 nm (so
    a_H cancels identically) shows that Graham's linear 2D count T_ring / delta scales as the 1D
    transverse filament span D_fil ~ k (log-slopes in k agree within 0.48% for k >= 3, with
    continuum circle-to-hexagon prefactor sqrt(3*sqrt(3)/(2*pi)) ~= 0.9094), rather than as the
    3D cross-sectional total filament count n_f ~ k^2. At Claessens's saturated k = 2 fascin cap
    (n_f = 19, D_fil = 5), Graham's 2D flat-sheet model at delta = 15 nm assigns T_ring = 285 nm
    (300 nm at n_f = 20) — 5.0x wider than Claessens's hydrated 3D hexagonal width (56.8-57.0 nm).
  assumptions:
    - "Multi-shell continuum regime k in [3, 20] (n_f in [37, 1261]); at Claessens's 1-2 shell fascin bundles (k = 1-2, n_f = 7-19), finite-shell discreteness produces a 1.1-2.4% log-slope difference."
    - "Area-equivalent hydrated circular diameter pi*(T_ring/2)^2 = n_f / rho_0 with hexagonal areal density rho_0 = 2/(sqrt(3)*a_H^2) and delta = a_H = 12.4 nm."
    - "Geometric projection only: contrasts Graham's 2D monolayer sheet packing (N_fil ~ T_ring^1) with Claessens's 3D hexagonal packing (n_f ~ D_bundle^2, D_fil ~ D_bundle^1)."

- id: rel_claessens2008_hex_width_reduces_to_ring_filament_count
  kind: reduces_to
  a: claessens2008/hexagonal_shell_filaments
  b: graham2023/ring_filament_count
  output_map:
    N_fil: D_fil
  mapping:
    T_ring: "2 * k * 12.4 + 7.4"
    delta: "12.4"
  limit:
    k: "oo"
  regime:
    k: [1.0, 20.0]
  provenance: proposed
  reason: >
    Tests exact asymptotic equality (unit prefactor, not only log-slope) between Claessens et al.'s
    discrete vertex-to-vertex hexagonal diameter in filaments D_fil = 2*k + 1 (p. 2) and Graham et
    al.'s continuum 2D ribbon count N_fil = T_ring / delta (SI Table 1). Evaluated on the hydrated
    outer vertex-to-vertex physical width T_ring(k) = 2*k*a_H + d_0 [nm] at Claessens's SAXS
    lattice constant a_H = 12.4 nm and implied actin filament diameter d_0 = a_H - 5 nm = 7.4 nm
    (giving 57.0 nm at Claessens's k = 2, 19-filament bundle), Graham's formula yields
    2*k + d_0/a_H = 2*k + 0.597, differing from D_fil = 2*k + 1 by the finite fencepost offset
    1 - d_0/a_H = 0.403 filaments (13.4% at k = 1, 8.1% at k = 2) and converging to D_fil with
    zero relative error in the large-shell limit k -> oo.
  assumptions:
    - "Outer hydrated vertex-to-vertex width T_ring(k) = 2*k*a_H + d_0 across k concentric hexagonal shells with Claessens's a_H = 12.4 nm and d_0 = a_H - 5 nm = 7.4 nm."
    - "Large-shell limit k -> oo where the finite fencepost offset (1 - d_0/a_H)/(2*k + 1) vanishes."
    - "Compares Graham's 2D single-layer count T_ring/delta to the 1D equatorial span D_fil of a 3D hexagonal bundle, not to the 3D total filament count n_f = 1 + 3*k*(k + 1)."

