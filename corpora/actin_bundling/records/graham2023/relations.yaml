# Cross-record ModelAtlas relations with zwicker2015
# (Zwicker, Hyman & Jülicher, Phys. Rev. E 92:012317, 2015)
# Neither paper cites the other (0 shared references across 66 x 46 entries;
# 0 stated relations; 0 cited.yaml links). Full audit across all 31 runnable
# graham2023 x 81 runnable zwicker2015 = 2,511 model pairs yields 3 proposed
# non-too_plain structural relations (2 verified, 1 diagnostic not_verified):
# - Diffuse liquid-liquid droplet interface tanh profile (2 relations):
#   wetting_tension_profile_eqS5_corrected (11 ops) scales identically with
#   zwicker2015/flat_interface_profile (5 ops) across (e, gamma_AVD, k_e),
#   while printed wetting_tension_profile_eqS5 fails due to its inverted tanh
#   sign (q_eqS4_S5_wetting_sign_inverted).
# - 3D volume-equivalent sphere geometry (1 relation):
#   effective_spherical_diameter (5 ops, D = (a*b^2)^(1/3)) scales identically
#   with zwicker2015/system_radius_Rs (9 ops, R_s = (3*V_s/(4*pi))^(1/3))
#   under V_s = (pi/6)*a*b^2 (exact factor-of-2 diameter-vs-radius ratio).
# - Explicitly excluded: droplet_surface_energy_eqS12 (2 ops, too_plain; 2D
#   phenomenological line tension gamma_I [pN] * perimeter L [um]) vs
#   zwicker2015/surface_tension_gamma (3D microscopic Cahn-Hilliard tension
#   [J/m^2]; zwicker2015 declares no total interfacial energy model), plus all
#   other 10 too_plain graham2023 models and disjoint actin-bending / 2D-ellipse
#   vs 3D active-emulsion Ostwald-ripening dynamics.
# See q_zwicker2015_modelatlas_and_passive_vs_active_droplet_contrast in
# graham2023/questions.yaml and
# q_graham2023_modelatlas_and_active_vs_passive_droplet_contrast in
# zwicker2015/questions.yaml.
