# Cross-record ModelAtlas relations with weirich2017
# (Weirich, Banerjee, Dasbiswas, Witten, Vaikuntanathan & Gardel,
#  PNAS 114(9):2131-2136, 2017)
# Neither paper cites the other (graham2023 Discussion p. 10 cites only the
# Gardel-lab follow-up Scheff et al. 2020 as ref-40; the two reference lists
# share 1 exact entry: Blanchoin et al. 2014 [graham2023/ref-43, misprinted
# 2022] <-> weirich2017/ref-4; 0 stated relations; 0 cited.yaml links).
# Full audit across all 31 runnable graham2023 x 52 runnable weirich2017 =
# 1,612 model pairs yields 9 proposed non-too_plain (>2 ops / numeric)
# relations across three shared physical cores (7 verified, 2 honest
# diagnostic not_verified; 0 same_as families):
# 1. 2D isotropic droplet vs. 3D nematic tactoid interfacial free energy (5):
#    ring_rod_transition_energy.E_surf and weirich2017/tactoid_free_energy.F
#    reduce identically to one another in the circular/spherical isotropic
#    limit under gamma_I_3D = gamma_I_2D / (2*R), and Graham's discrete 2D
#    SLSQP minimizer (droplet_ring_minimization_corrected.total_energy)
#    reduces to the same spherical energy as T_ring -> 0; over moderate
#    aspect ratios AR in [1.01, 3.0], 2D constant-area E_surf approximates 3D
#    constant-volume isotropic tactoid F within 5.20% before diverging as
#    AR^(1/2) vs AR^(1/3) (diagnostic not_verified against
#    tactoid_rescaled_free_energy over AR in [2, 15]).
# 2. 3D nematic capillary cylinder vs. 2D droplet surface energy (2):
#    weirich2017/capillary_free_energy_integral.F reduces identically to
#    ring_rod_transition_energy.E_surf as perturbation amplitude u -> 0 (all
#    anchoring strengths omega) under slab tension gamma_I_2D = gamma_I_3D*lam,
#    and capillary_free_energy_per_length.F_over_lam scales identically in
#    (R_0, gamma_I).
# 3. 3D volume-equivalent droplet size & 2D vs. 3D axis elongation (2):
#    effective_spherical_diameter (D = (a*b^2)^(1/3)) scales identically with
#    weirich2017/director_crossover_parameter (chi = gamma_A*V^(1/3)/K) under
#    V = (pi/6)*a*b^2, whereas 2D constant-area ellipse_axes_constant_area.a
#    (~ AR^(1/2)) fails to match 3D constant-volume tactoid major axis L
#    (~ AR^(2/3)) (diagnostic not_verified).
# Explicitly excluded: all 11 too_plain (<=2 ops) graham2023 models (including
# droplet_surface_energy_eqS12, 2 ops) and 14 too_plain + 1 curve weirich2017
# models; the scheduler-flagged droplet_ring_minimization_corrected vs.
# capillary_energy_cost_corrected pair (positive 2D bending+surface energy vs.
# sign-changing O(u^2) Rayleigh-Plateau perturbation energy); and the spurious
# 2*pi*R circle-circumference coincidence between capillary_instability_threshold_*
# axial wavelength and ellipse_perimeter_* 2D droplet perimeter.
# See q_weirich2017_modelatlas_and_vasp_droplet_vs_tactoid_contrast in
