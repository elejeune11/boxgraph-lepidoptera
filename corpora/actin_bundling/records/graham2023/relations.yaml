- id: rel_zwicker2015_wetting_corrected_scales_flat_interface
  kind: scales_as
  a: graham2023/wetting_tension_profile_eqS5_corrected
  b: zwicker2015/flat_interface_profile
  mapping:
    psi: "gamma_AVD / 1e4"
    x: "5e-7 * (e - 1) / 2"
    w: "5e-7 / (2 * k_e)"
  regime:
    gamma_AVR: [1.0e-9, 1.0e-7]
    gamma_AVD: [1000.0, 10000.0]
    e: [0.97, 1.05]
    k_e: [16.0, 64.0]
  provenance: proposed
  reason: >
    Both papers represent a smooth diffuse phase boundary across a liquid-liquid phase-separated
    droplet interface using the hyperbolic-tangent kink (1/2)*[1 + tanh(z)]: zwicker2015's
    equilibrium Cahn-Hilliard flat-interface profile phi^B(x) = (1/2)*psi*[1 + tanh(x/w)] (Sec.
    II.A, p. 2, 5 ops) and graham2023's corrected actin-droplet wetting-tension profile
    gamma(e) = gamma_AVR + (1/2)*(gamma_AVD - gamma_AVR)*[1 + tanh(k_e*(e - 1))] (SI Eqs. S4-S5 /
    Extended Data Fig. 5c, 11 ops). Under linear wetting-tension interpolation with the dilute-phase
    volume fraction 1 - phi^B/psi in Graham's strong-confinement regime (gamma_AVR/gamma_AVD ~
    10^-12 << 1) and linearized radial distance x = R*(e - 1)/2 around a circular droplet of radius
    R = 500 nm (D = 1 um benchmark), Graham's corrected profile scales identically with Zwicker's
    tanh kink across all three mapped variables (e, gamma_AVD, k_e) with effective diffuse interface
    width w_eff = R / (2*k_e) (= 3.91 nm at D = 1 um, k_e = 64). Recorded as scales_as (not same_as)
    because wetting tension [pN/nm] and volume fraction [dimensionless] are distinct physical
    quantities, gamma_AVR = 1e-8 pN/nm is small but nonzero, and Graham's normalized quadratic
    coordinate e = r^2/R^2 makes w_eff scale linearly with R (and anisotropically on an ellipse)
    rather than remaining an intrinsic material width w = 2*sqrt(kappa/b).
  assumptions:
    - "Strong-confinement limit gamma_AVR << gamma_AVD (Table 1 ratio 10^-12) evaluated across the diffuse interface e in [0.97, 1.05] and k_e in [16, 64] (Extended Data Fig. 5c)."
    - "Linearized outward normal coordinate x = R*(e - 1)/2 around circular radius R = 500 nm (5e-7 m), with effective interface width w_eff = R/(2*k_e); the exact quadratic ellipse coordinate e = (1 + x/R)^2 adds a 1.5% curvature correction at x = 15 nm."
    - "Polarity correspondence: gamma(e) increases outward toward the dilute phase (e > 1), matching the dilute-phase kink 1 - phi^B(-x)/psi = (1/2)*[1 + tanh(x/w)]."

- id: rel_zwicker2015_wetting_printed_vs_flat_interface
  kind: scales_as
  a: graham2023/wetting_tension_profile_eqS5
  b: zwicker2015/flat_interface_profile
  mapping:
    psi: "gamma_AVD / 1e4"
    x: "5e-7 * (e - 1) / 2"
    w: "5e-7 / (2 * k_e)"
  regime:
    gamma_AVR: [1.0e-9, 1.0e-7]
    gamma_AVD: [1000.0, 10000.0]
    e: [0.97, 1.05]
    k_e: [16.0, 64.0]
  provenance: proposed
  reason: >
    Diagnostic cross-paper check testing graham2023's printed SI Eqs. S4-S5
    (wetting_tension_profile_eqS5) against zwicker2015/flat_interface_profile under the exact
    same outward diffuse-interface dictionary as rel_zwicker2015_wetting_corrected_scales_flat_interface.
    Expected to be not_verified because printed Eqs. S4-S5 swap gamma_AVR and gamma_AVD, inverting
    the tanh transition so gamma(e) decreases across e = 1 with opposite-sign log-slopes in e and
    k_e (independently corroborating graham2023/q_eqS4_S5_wetting_sign_inverted).
  assumptions:
    - "Identical diffuse-interface dictionary and regime as rel_zwicker2015_wetting_corrected_scales_flat_interface."

- id: rel_zwicker2015_effective_diameter_scales_system_radius
  kind: scales_as
  a: graham2023/effective_spherical_diameter
  b: zwicker2015/system_radius_Rs
  mapping:
    V_s: "(pi / 6) * a * b**2 * 1e-18"
  regime:
    a: [1.0, 10.0]
    b: [0.5, 7.0]
  provenance: proposed
  reason: >
    Connects graham2023's 3D prolate-spheroid volume-equivalent droplet diameter (Methods p. 15,
    effective_spherical_diameter: D = (a*b^2)^(1/3), 5 ops, conserving 3D spheroid volume
    V = (pi/6)*a*b^2 = (pi/6)*D^3) to zwicker2015's 3D volume-equivalent sphere radius (Sec.
    III.A.2 p. 5, system_radius_Rs: R_s = (3*V_s/(4*pi))^(1/3), 9 ops, the identical 3D
    sphere-from-volume conversion used for droplet radii R_bar in Zwicker Eqs. 20 and 23). Under
    the exact 3D prolate-spheroid volume mapping V_s = (pi/6)*a*b^2 * 1e-18 [m^3], both models
    share identical (+1/3, +2/3) log-slopes in (a, b) with an exact constant factor-of-2 ratio
    D = 2*R_eff (diameter vs. radius). Recorded as scales_as (not same_as) to respect both the
    factor-of-2 diameter-vs-radius convention and the distinct physical objects (single deformed
    droplet vs. equivalent spherical system size), while contrasting with graham2023's 2D
    simulation area conservation (ellipse_axes_constant_area: 4*a*b = D^2, under which 3D prolate
    volume shrinks as 1/sqrt(AR)).
  assumptions:
    - "Exact 3D prolate-spheroid volume V = (pi/6)*a*b^2 in m^3 (unit conversion 1 um^3 = 1e-18 m^3) for full major/minor axes a in [1, 10] um and b in [0.5, 7] um."
    - "Constant diameter-to-radius ratio D / R_s = 2 (factor absorbed by scales_as log-slope invariance)."

