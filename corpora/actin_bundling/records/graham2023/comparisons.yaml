# ==========================================================================
# 1. Reproduction of printed model predictions and derived values
# ==========================================================================
- id: cmp_ring_thickness_exponent_repro
  purpose: reproduction
  computed: ring_thickness_exponent_pred
  printed: pred_ring_thickness_exponent
  conditions_ok: "Pure theoretical scaling exponent from Eq. S24 with L = 2 pi R is independent of droplet diameter or experimental buffer conditions."
  note: "Verifies that d(ln u_m)/d(ln D) of Eq. S24 with L = 2*pi*R and constant L_p equals the printed exponent 1.5 (p. 6, Eq. S25)."

- id: cmp_ring_extension_length_ratio_repro
  purpose: reproduction
  computed: L_ratio_computed
  printed: derived_final_ring_length_ratio
  note: "Verifies 1 + 21 * 0.1 = 3.1 (L_final = 3.1 D in SI Section 2.6)."

- id: cmp_ring_rod_transition_ar_repro
  purpose: reproduction
  computed: ar_crit_fig5c
  printed: pred_ring_rod_transition_ar
  note: "Solving P(a/b) = 2L = 4*pi*R numerically via ring_rod_critical_aspect_ratio tests consistency with the paper's stated transition '> 9' (Fig. 5d caption p. 8, SI Section 2.11 p. 44); printed inequality has no finite upper bound so BoxGraph reports no verdict."

- id: cmp_monomer_rate_from_mean_repro
  purpose: reproduction
  computed: monomer_rate_from_mean_v
  printed: monomer_addition_rate_text
  note: "Checks conversion of measured average elongation rate 23 +/- 3 nm/s to 'about 8 to 9 monomers per second' (p. 9) using standard F-actin step 2.7 nm/monomer."

- id: cmp_monomer_rate_from_fit_repro
  purpose: reproduction
  computed: monomer_rate_from_fit_v
  printed: monomer_addition_rate_text
  note: "Checks conversion of Fig. 5h linear fit slope 0.0227 um/s (22.7 nm/s) to 'about 8 to 9 monomers per second' (p. 9)."

# ==========================================================================
# 2. Validation of theoretical scaling exponent against experimental fits
# ==========================================================================
- id: cmp_exponent_pred_vs_fig3f_ar_lt11
  purpose: validation
  computed: ring_thickness_exponent_pred
  printed: fit_fig3f_ar_lt11_b
  conditions_ok: "Compares theoretical single-filament fluctuation scaling exponent (1.5) against experimental power-law fit for AR < 1.1 droplets (1.8037, Fig. 3f)."

- id: cmp_exponent_pred_vs_fig4h_ar_lt11
  purpose: validation
  computed: ring_thickness_exponent_pred
  printed: fit_fig4h_ar_lt11_b
  conditions_ok: "Compares theoretical scaling exponent (1.5) against experimental AR < 1.1 overlay power-law fit in Fig. 4h (1.7195)."

- id: cmp_exponent_pred_vs_fig3e_rings
  purpose: validation
  computed: ring_thickness_exponent_pred
  printed: fit_fig3e_rings_b
  conditions_ok: "Compares theoretical scaling exponent (1.5) against experimental power-law fit for 3D rings with AR < 1.1 in Fig. 3e (1.9682)."

- id: cmp_exponent_pred_vs_lit_range
  purpose: validation
  computed: ring_thickness_exponent_pred
  printed: lit_ring_thickness_exponent_range
  conditions_ok: "Compares theoretical scaling exponent (1.5) against literature spherical-confinement exponent range 1.5 to 2 cited on p. 6."

# ==========================================================================
# 3. Internal consistency checks between printed values
# ==========================================================================
- id: cmp_frap_recovery_text_vs_fig1f
  purpose: consistency
  computed: frap_recovery_fig1f
  printed: frap_recovery_text
  note: "Checks consistency between Fig. 1f caption (93.9 +/- 4.89%) and main text p. 2 (94 +/- 5%)."

- id: cmp_elongation_rate_fit_vs_mean
  purpose: consistency
  computed: elongation_rate_fit_fig5h
  printed: elongation_rate_mean_text
  note: "Checks consistency between Fig. 5h linear fit slope (0.0227 um/s = 22.7 nm/s) and main text p. 9 mean rate (23 +/- 3 nm/s)."

- id: cmp_ar_lt11_exponent_fig3f_vs_text
  purpose: consistency
  computed: fit_fig3f_ar_lt11_b
  printed: exp_ring_thickness_exponent_text
  note: "Checks rounding of Fig. 3f AR < 1.1 fitted exponent (1.8037) to D^1.8 in main text p. 6."

- id: cmp_ar_lt11_exponent_fig3f_vs_fig4h
  purpose: consistency
  computed: fit_fig3f_ar_lt11_b
  printed: fit_fig4h_ar_lt11_b
  note: "Tests consistency between the two reported power-law exponents for experimentally observed AR < 1.1 droplets (1.8037 in Fig. 3f vs. 1.7195 in Fig. 4h)."

- id: cmp_ar_lt11_prefactor_fig3f_vs_fig4h
  purpose: consistency
  computed: fit_fig3f_ar_lt11_a
  printed: fit_fig4h_ar_lt11_a
  note: "Tests consistency between the two reported power-law prefactors for experimentally observed AR < 1.1 droplets (0.0629 in Fig. 3f vs. 0.0721 in Fig. 4h)."

# ==========================================================================
# 4. Printed vs. corrected wetting boundary behavior check
# ==========================================================================
- id: cmp_wetting_printed_inside_vs_gamma_avr
  purpose: consistency
  computed: gamma_wet_printed_inside
  printed: gamma_avr_table1
  note: "Tests whether printed Eqs. S4-S5 give gamma_AVR inside the droplet (e = 0.5); fails by 12 orders of magnitude because printed Eqs. S4-S5 invert inside and outside."

- id: cmp_wetting_corrected_inside_vs_gamma_avr
  purpose: consistency
  computed: gamma_wet_corrected_inside
  printed: gamma_avr_table1
  note: "Tests that the corrected wetting profile matching Extended Data Fig. 5c gives gamma_AVR inside the droplet (e = 0.5)."

- id: cmp_wetting_printed_outside_vs_gamma_avd
  purpose: consistency
  computed: gamma_wet_printed_outside
  printed: gamma_avd_table1
  note: "Tests whether printed Eqs. S4-S5 give gamma_AVD outside the droplet (e = 1.5); fails because printed Eqs. S4-S5 yield gamma_AVR outside."

- id: cmp_wetting_corrected_outside_vs_gamma_avd
  purpose: consistency
  computed: gamma_wet_corrected_outside
  printed: gamma_avd_table1
  note: "Tests that the corrected wetting profile matching Extended Data Fig. 5c gives gamma_AVD outside the droplet (e = 1.5)."

- id: cmp_actin_lp_table1_vs_text
  purpose: consistency
  computed: actin_lp_table1
  printed: actin_lp_range_text
  note: "Checks that the SI Table 1 single-filament persistence length (17.73 um, p. 39) lies within the main-text stated range (10 to 20 um, p. 3)."

- id: cmp_droplet_diam_median_vs_range
  purpose: consistency
  computed: droplet_diam_median_20uM
  printed: droplet_diam_range_obs
  note: "Checks that the Extended Data Fig. 4e median 20 uM VASP droplet diameter (2.86 um, p. 19) lies within the main-text stated range (1 to 7 um, p. 3)."

- id: cmp_droplet_diam_max_vs_range
  purpose: consistency
  computed: droplet_diam_max_20uM
  printed: droplet_diam_range_obs
  note: "Checks consistency between the Extended Data Fig. 4e maximum 20 uM VASP droplet diameter (7.22 um, p. 19) and the rounded main-text diameter range (1 to 7 um, p. 3)."

