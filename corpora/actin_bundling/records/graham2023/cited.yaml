# Cross-record cited links from graham2023 values to released simulation code (graham_code).
#
# Notes on scope:
# 1. All 41 shared parameters and 14 digitized figure curves (Extended Data Fig. 5c, Fig. 5c surface energy,
#    Fig. 4f, Fig. 4g x4, Extended Data Fig. 7 x5, Fig. 4h x2) between graham_code and graham2023 are
#    already linked in graham_code/data.yaml via `from_source: graham2023` + `from_datum` (41/41 checked
#    in BoxGraph Synthesis). Those 14 `target_*` tables in graham_code/data.yaml are copies of graham2023's
#    digitized PDF curves (not raw software outputs), so reverse links back from graham2023 to `target_*`
#    are intentionally omitted to avoid circularity; live code-vs-figure verification lives in
#    graham_code/runs.yaml and graham_code/comparisons.yaml.
# 2. The 6 `from_source` entries already in graham2023/data.yaml (`vasp_disordered_frac`,
#    `lit_ring_thickness_exponent_range`, `actin_lp_table1`, `filament_spacing_vasp_delta`,
#    `filament_spacing_ena`, `single_filament_k_stretch`) cite external literature (`ref-15`, `ref-27`,
#    `ref-si-8`, `ref-si-9`, `ref-si-10`), not graham_code.

- datum: ring_thickness_step_val
  from_source: graham_code
  from_datum: r_fil_code
  evidence: "Fig. 4e caption (p. 7) states the simulation protocol increases ring thickness in steps of 15 nm, which in VASPDroplet_simulate.ipynb (lines 888, 918, 924) is implemented by incrementing Nfil by 1 with R_fil = 15 nm (sparams.rcyl = R_fil * Nfil)."

