# Quantities declared for sekine_code (one quantity per distinct physical or algorithmic meaning)

- {id: frame_count, name: number of image frames processed, dimension: "dimensionless", description: "Total number of sequential .tif frames configured in Nanocluster_motion.m (Numb_of_Images)."}
- {id: frame_step, name: frame step between paired images, dimension: "dimensionless", description: "Index offset between consecutive paired frames t_n and t_{n+1} (Count and Count+1)."}
- {id: cluster_area_pixels, name: segmented cluster area in pixels, dimension: "dimensionless", description: "Projected area of a binary connected-component actin cluster measured as an integer pixel count."}
- {id: cluster_area_physical, name: segmented cluster physical area, dimension: "[area]", description: "Projected physical area of a segmented actin nanocluster in square micrometers."}
- {id: pixel_size, name: image pixel edge length, dimension: "[length]", description: "Physical side length represented by one square image pixel."}
- {id: cluster_perimeter_pixels, name: segmented cluster perimeter in pixels, dimension: "dimensionless", description: "Boundary perimeter of a segmented actin cluster in pixel edge units."}
- {id: cluster_circularity, name: cluster shape circularity, dimension: "dimensionless", description: "Shape circularity 4*pi*A/P^2 (1.0 for an ideal circle, approaching 0 for an elongated line)."}
- {id: cluster_area_ratio, name: inter-frame cluster area ratio, dimension: "dimensionless", description: "Ratio A(t_{n+1}) / A(t_n) of matched nanocluster areas across a single frame step."}
- {id: overlap_area_pixels, name: inter-frame pixel overlap count, dimension: "dimensionless", description: "Number of shared foreground pixels between a cluster at t_n and a candidate cluster at t_{n+1}."}
- {id: pixel_connectivity, name: 2D connected-component pixel connectivity, dimension: "dimensionless", description: "Neighborhood connectivity (4 or 8) used by bwlabel, bwareafilt, imclearborder, and bwselect."}
- {id: overlap_component_threshold, name: intersection component branch threshold, dimension: "dimensionless", description: "Number of 8-connected components in ref_Cell_Obj_Intersect selecting single-overlap vs multi-overlap tracking branches."}
- {id: binarize_threshold, name: normalized grayscale binarization threshold, dimension: "dimensionless", description: "Normalized luminance threshold on [0, 1] used by MATLAB im2bw(I) when no level argument is given."}
- {id: unmatched_sentinel, name: unmatched cluster output sentinel, dimension: "dimensionless", description: "Placeholder value written into columns 4-6 (x2, y2, A2) when a cluster has zero overlap at t_{n+1}."}
- {id: output_column_count, name: output table column count, dimension: "dimensionless", description: "Number of columns written per cluster row in ALL_Result (x1, y1, A1, x2, y2, A2)."}
- {id: excel_sheet_index, name: Excel output worksheet index, dimension: "dimensionless", description: "Worksheet index variable declared before xlswrite in Nanocluster_motion.m."}
- {id: tracked_cluster_count, name: number of matched cluster steps, dimension: "dimensionless", description: "Number of tracked cluster pairs with non-zero match in t_{n+1} (after any configured downstream filters)."}
- {id: unmatched_cluster_count, name: number of unmatched cluster rows, dimension: "dimensionless", description: "Number of t_n clusters recorded with zero-sentinel (0, 0, 0) because no t_{n+1} overlap was found."}
- {id: dropped_cluster_count, name: number of clusters omitted from output, dimension: "dimensionless", description: "Number of t_n clusters dropped before output by border clearing, circularity/size filtering, or silent try/catch frame abort."}
- {id: longitudinal_displacement, name: mean absolute longitudinal displacement |dx|, dimension: "[length]", description: "Mean absolute single-step cluster centroid displacement along the x (longitudinal) axis."}
- {id: circumferential_displacement, name: mean absolute circumferential displacement |dy|, dimension: "[length]", description: "Mean absolute single-step cluster centroid displacement along the y (circumferential) axis."}
- {id: step_distance, name: mean Euclidean step distance, dimension: "[length]", description: "Mean Euclidean single-step centroid displacement sqrt(dx^2 + dy^2)."}
- {id: motion_anisotropy_ratio, name: motion anisotropy ratio |dy|/|dx|, dimension: "dimensionless", description: "Ratio <|dy|> / <|dx|> of mean absolute circumferential to longitudinal single-step displacement."}
