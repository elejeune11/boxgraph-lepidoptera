# Verification runs for sekine_code:
# (1) Pixel-to-physical area conversions and tight implied pixel-size bounds (code line 40 vs README line 5)
# (2) Circularity 4*pi*A/P^2 check
# (3) Faithful MATLAB->Python port (nanocluster_motion_matlab) vs README/Methods specification
#     (nanocluster_motion_methods_spec) across 8 deterministic 50x50 ROI verification scenarios

# --- 1. Area unit conversion & pixel-bounds verification ---
- id: run_area_min_um2
  model: area_px_to_um2
  inputs: {A_px: area_min_t1_px_code, dx: pixel_size_added}
  settings: {}
  outputs: {A_phys: area_min_um2_pred}
  note: "Physical area corresponding to Nanocluster_motion.m line 40 lower cutoff 6 px at dx = 0.04325 um (0.011223 um^2 vs README 0.01 um^2)."

- id: run_area_max_um2
  model: area_px_to_um2
  inputs: {A_px: area_max_t1_px_code, dx: pixel_size_added}
  settings: {}
  outputs: {A_phys: area_max_um2_pred}
  note: "Physical area corresponding to Nanocluster_motion.m line 40 upper cutoff 53 px at dx = 0.04325 um (0.099140 um^2 vs README 0.1 um^2)."

- id: run_area_bounds_px
  model: area_um2_to_px_bounds
  inputs: {A_min: area_min_readme, A_max: area_max_readme, dx: pixel_size_added}
  settings: {}
  outputs: {N_min: area_min_px_pred, N_max: area_max_px_pred}
  note: "Exact interior integer pixel bounds [ceil(0.01/dx^2), floor(0.1/dx^2)] = [6, 53] at dx = 0.04325 um; alternatives dx = 3/69 = 0.043478 um and dx = 0.043 um shift N_max to 52 and 54 respectively."

- id: run_implied_pixel_size
  model: implied_pixel_size_bounds
  inputs: {N_min: area_min_t1_px_code, N_max: area_max_t1_px_code, A_min: area_min_readme, A_max: area_max_readme}
  settings: {}
  outputs: {dx_lo: implied_dx_lo, dx_hi: implied_dx_hi, dx_mid: implied_dx_mid}
  note: "Strict pixel-size interval (0.043033, 0.043437] um (midpoint 0.043235 um) for which [6, 53] is the exact integer pixel range inside [0.01, 0.1] um^2; encloses sekine2024's 0.04325 um and excludes both 3/69 (0.043478 um) and 0.043 um."

# --- 2. Circularity formula verification ---
- id: run_circularity_ideal_6px
  model: circularity_definition
  inputs: {A: area_min_t1_px_code, P: perimeter_ideal_6px_added}
  settings: {}
  outputs: {C: circ_ideal_6px_pred}
  note: "Checks 4*pi*A/P^2 = 1.0 for an ideal circle of area 6 px (alternatives P = 10 px for compact 3x2 rectangle -> C = 0.754, and P = 14 px for 1x6 rod -> C = 0.385 < 0.5)."

# --- 3. MATLAB port vs README/Methods spec across 8 verification scenarios ---
- id: run_matlab_aniso_translation
  model: nanocluster_motion_matlab
  inputs:
    area_min_t1: area_min_t1_px_code
    area_max_t1: area_max_t1_px_code
    area_min_t2: area_min_t2_px_code
    connectivity: connectivity_bwlabel_code
    binarize_level: binarize_level_added
    pixel_size: pixel_size_added
    ratio_min: area_ratio_min_readme
    ratio_max: area_ratio_max_readme
  settings: {scenario: anisotropic_translation, apply_downstream_area_ratio: false}
  outputs:
    matched_count: mat_aniso_matched
    unmatched_count: mat_aniso_unmatched
    dropped_count: mat_aniso_dropped
    mean_abs_dx: mat_aniso_dx
    mean_abs_dy: mat_aniso_dy
    mean_step_distance: mat_aniso_dist
    anisotropy_ratio: mat_aniso_ratio
    mean_area_ratio: mat_aniso_aratio
  note: "Clean baseline: two interior 4x4 clusters shifting (+1,+2) and (-1,+2) px; exact recovery of <|dx|>=43.25 nm, <|dy|>=86.50 nm, dist=96.71 nm, |dy|/|dx|=2.0."

- id: run_spec_aniso_translation
  model: nanocluster_motion_methods_spec
  inputs:
    area_min: area_min_readme
    area_max: area_max_readme
    circ_min: circularity_min_readme
    circ_max: circularity_max_readme
    ratio_min: area_ratio_min_readme
    ratio_max: area_ratio_max_readme
    overlap_min_px: overlap_min_px_readme
    connectivity: connectivity_bwlabel_code
    pixel_size: pixel_size_added
  settings: {scenario: anisotropic_translation}
  outputs:
    matched_count: spec_aniso_matched
    unmatched_count: spec_aniso_unmatched
    dropped_count: spec_aniso_dropped
    mean_abs_dx: spec_aniso_dx
    mean_abs_dy: spec_aniso_dy
    mean_step_distance: spec_aniso_dist
    anisotropy_ratio: spec_aniso_ratio
    mean_area_ratio: spec_aniso_aratio
  note: "Clean baseline under documented README/Methods spec: identical to MATLAB port."

