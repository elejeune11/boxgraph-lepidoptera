id: area_px_to_um2
name: convert MATLAB pixel area threshold to physical area in um^2 (Nanocluster_motion.m lines 39-40)
role: processing
stated:
  file: Nanocluster_motion.m
  lines: "39-40"
  quote: "Large_Obj_Image_1 = bwareafilt (BW_Image_1, [6 53]);"
  where: "Nanocluster_motion.m lines 39-40 vs README.md line 5"
equation: "A_phys = A_px * dx^2"
inputs:
  A_px: {quantity: cluster_area_pixels, unit: dimensionless}
  dx: {quantity: pixel_size, unit: um}
outputs:
  A_phys: {quantity: cluster_area_physical, unit: um^2}
settings: {}
stochastic: false
