id: area_um2_to_px_bounds
name: convert README physical area range [0.01, 0.1] um^2 to integer pixel bounds [6, 53] (Nanocluster_motion.m lines 39-40)
role: processing
stated:
  file: Nanocluster_motion.m
  lines: "39-40"
  quote: "%% Remove very small objects from image_1 and image_2 (6 to 53 pixels)"
  where: "Nanocluster_motion.m lines 39-40 vs README.md line 5"
equation: "N_min = ceil(A_min / dx^2); N_max = floor(A_max / dx^2)"
inputs:
  A_min: {quantity: cluster_area_physical, unit: um^2}
  A_max: {quantity: cluster_area_physical, unit: um^2}
  dx: {quantity: pixel_size, unit: um}
outputs:
  N_min: {quantity: cluster_area_pixels, unit: dimensionless}
  N_max: {quantity: cluster_area_pixels, unit: dimensionless}
settings: {}
stochastic: false
