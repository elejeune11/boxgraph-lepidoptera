id: implied_pixel_size_bounds
name: tight pixel-size interval implied by [6, 53] px matching [0.01, 0.1] um^2 (Nanocluster_motion.m line 40 & README.md line 5)
role: processing
stated:
  file: Nanocluster_motion.m
  lines: "40"
  quote: "Large_Obj_Image_1 = bwareafilt (BW_Image_1, [6 53]);"
  where: "Nanocluster_motion.m line 40 vs README.md line 5"
equation: "dx_lo = max(sqrt(A_min/N_min), sqrt(A_max/(N_max+1))); dx_hi = min(sqrt(A_min/(N_min-1)), sqrt(A_max/N_max)); dx_mid = (dx_lo + dx_hi)/2"
inputs:
  N_min: {quantity: cluster_area_pixels, unit: dimensionless}
  N_max: {quantity: cluster_area_pixels, unit: dimensionless}
  A_min: {quantity: cluster_area_physical, unit: um^2}
  A_max: {quantity: cluster_area_physical, unit: um^2}
outputs:
  dx_lo: {quantity: pixel_size, unit: um}
  dx_hi: {quantity: pixel_size, unit: um}
  dx_mid: {quantity: pixel_size, unit: um}
settings: {}
stochastic: false
