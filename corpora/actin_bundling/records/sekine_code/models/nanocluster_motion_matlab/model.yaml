id: nanocluster_motion_matlab
name: Python port of Nanocluster_motion.m nanocluster filtering and overlap tracking (lines 28-250)
role: processing
stated:
  file: Nanocluster_motion.m
  lines: "28-250"
  quote: "for Count = 1:Numb_of_Images-1"
  where: "Nanocluster_motion.m lines 28-250 (faithful MATLAB-to-Python port; no circularity or 0.5-2x area-ratio filter)"
equation: "im2bw(level=0.5) -> bwareafilt([6 53] / [1 Inf]) -> imclearborder -> immultiply -> Stage-1 centroid bwselect -> Stage-2 imfill+shrink+bwselect (largest on >=2 overlap, 0 sentinel on 0 overlap, try/catch abort)"
inputs:
  area_min_t1: {quantity: cluster_area_pixels, unit: dimensionless}
  area_max_t1: {quantity: cluster_area_pixels, unit: dimensionless}
  area_min_t2: {quantity: cluster_area_pixels, unit: dimensionless}
  connectivity: {quantity: pixel_connectivity, unit: dimensionless}
  binarize_level: {quantity: binarize_threshold, unit: dimensionless}
  pixel_size: {quantity: pixel_size, unit: um}
  ratio_min: {quantity: cluster_area_ratio, unit: dimensionless}
  ratio_max: {quantity: cluster_area_ratio, unit: dimensionless}
outputs:
  matched_count: {quantity: tracked_cluster_count, unit: dimensionless}
  unmatched_count: {quantity: unmatched_cluster_count, unit: dimensionless}
  dropped_count: {quantity: dropped_cluster_count, unit: dimensionless}
  mean_abs_dx: {quantity: longitudinal_displacement, unit: nm}
  mean_abs_dy: {quantity: circumferential_displacement, unit: nm}
  mean_step_distance: {quantity: step_distance, unit: nm}
  anisotropy_ratio: {quantity: motion_anisotropy_ratio, unit: dimensionless}
  mean_area_ratio: {quantity: cluster_area_ratio, unit: dimensionless}
settings:
  scenario: anisotropic_translation
  apply_downstream_area_ratio: false
stochastic: false
