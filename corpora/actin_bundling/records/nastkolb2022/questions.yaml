    28.09 / 12.4 = 2.27 merely mixes dehydrated TEM width with hydrated SAXS spacing while
    57.00 / 12.4 = 4.60 is circular (57.00 nm = 4*12.4 + 7.4 assumes k = 2, D_fil = 5).
