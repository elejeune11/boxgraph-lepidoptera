    page: 6
    printed_page: "6"
    quote: "forms liquid–liquid phase separation into a protein-enriched phase"
    where: "Results pp. 2, 6, 8, 11 vs weirich2017 Main Text pp. 2131-2135 & SI pp. SI-1 to SI-3"
  text: >
    Quantitative biophysical regime contrast between weirich2017 (3D passive filamin/F-actin liquid-
    crystalline tactoids and fluid threads) and nastkolb2022 (2D fluid supported lipid bilayer VASP
    phase separation and active polymerization-driven actin bundling):
    (1) Passive 3D nematic LLPS vs. 2D bilayer VASP LLPS + active polymerization feedback (and opposite
    roles of SLBs): both papers start from nearly identical dilute bulk actin (weirich2017: 2.6-2.64 uM
    = 0.11 mg/mL, pre-crosslink mesh size xi = 0.90 um; nastkolb2022: 2 uM = 0.084 mg/mL, hypothetical
    uncapped xi = 1.04 um) and comparable low-salt imidazole buffers (50 mM KCl, 1 mM MgCl2; Debye
    length lambda_D ~ 1.1-1.3 nm), and both form supported lipid bilayers on glass — yet for opposite
    purposes. weirich2017 uses an inert DOPC SLB solely to passivate glass against protein adsorption
    so pre-polymerized short F-actin stays suspended in 3D bulk (with 0.3 wt% methylcellulose
    crowding long filaments), where adding filamin triggers passive 100-fold actin co-condensation into
    ~250 uM 3D nematic tactoids (gamma_I ~ 300 nN/m, omega = 1.1-2.2, aspect ratio L/r ~ 3 -> 2
    decreasing with 2.5-15 mol% filamin, unbounded t^(0.47 +/- 0.01) coalescence coarsening, and near
    the liquid-solid boundary motor-free Rayleigh-Plateau pearling at lambda ~ 4-10 um plus 20-60%
    capillary bundle contraction over ~10 min). In nastkolb2022, a functionalized 10% DOGS-Ni-NTA SLB
    actively tethers His-tagged chimeric VASP (human VASP with high-affinity Dictyostelium GAB), which
    undergoes 2D LLPS by itself prior to actin addition (>=0.25-0.5 uM, cluster area 0.176-0.596 in
    Fig. S4H); upon adding G-actin + profilin + CP, VASP droplets coalesce onto nucleating filaments
    (Video S7), actively elongate and align barbed ends at bundle edges (Fig. 2F), locally exclude
    unbound Texas Red-DHPE lipids (~9% depletion relaxing to ~5% at 60 min, Fig. 5C), and grow wide 2D
    bundles (median 0.55 -> 4.36 um over 0.05-1 uM VASP up to 95% bilayer decoration) via positive
    VASP-recruitment feedback without pearling or contraction. Pre-polymerized F-actin added to the
    VASP bilayer is pulled down without bundling (Fig. S4D-E), proving active elongation — not passive
    cross-linking — drives bundling in nastkolb2022.
    (2) FRAP species, timescales (~700-880 s vs. ~6-24 s), and transport regimes: weirich2017 Fig. 1C
    bleaches TMR-labeled F-actin filaments (180 nm) inside a dense 3D tactoid (1.5 mol% CP, 5 mol%
    filamin), measuring slow internal filament diffusion with tau_R = 880 s (caption; ~900 s text;
    712 s unconstrained digitized fit -> t_1/2 = 610 s [494 s digitized]), D ~ 0.003 um^2/s, and
    Stokes-Einstein viscosity eta ~ 3 Pa*s. nastkolb2022 Fig. 4C instead bleaches Alexa532-labeled VASP
    tethered to the 2D membrane (circular spot d_b = 4.96 um, r_b = 2.48 um), measuring rapid 2D
    cross-linker/polymerase mobility prior to polymerization: t_1/2 = 0.102 min = 6.12 s (tau = 8.83 s,
    mobile fraction 0.97) on SLB and t_1/2 = 0.399 min = 23.94 s (tau = 34.54 s, mobile fraction 0.61)
    on ML — 25-100x faster than Weirich's 880 s (21-81x vs. 712 s). Applying 2D uniform-disk Soumpasis
    recovery (D = 0.224*r_b^2/t_1/2 = 0.155*r_b^2/tau) yields D_SLB = 0.225 um^2/s (75x Weirich's D)
    and D_ML = 0.058 um^2/s (19x Weirich's D; Weirich's unprefactored scaling r_b^2/tau gives 0.697
    and 0.178 um^2/s, 6.44x higher due to geometry prefactor). Post-polymerization (30 min Pol) drops
    SLB VASP mobile fraction from 0.97 to 0.65 (half-time unstated), and even a 4x drop in 2D VASP
    mobility on monolayers (still 19x more diffusive than Weirich's tactoid actin) completely abolishes
    active bundling because VASP elongation slows below CP-susceptible free polymerization.
    (3) Filament length and opposite functional roles of capping protein (0.18-1 um capped rods vs.
    long growing filaments in profilin + CP): weirich2017 uses 0.25-1.5 mol% CP (without profilin or
    elongators) under equilibrium stoichiometric capping L_f = 2.7 nm / r_CP to restrict F-actin to
    short rigid rods of 180-1080 nm (<= xi ~ 1 um, << l_p ~ 10 um), keeping assemblies inside the
    liquid droplet (0.1-0.55 um) and fluid bundle (0.36-1.08 um) windows of Fig. 1D before kinetically
    arrested viscoelastic networks form above 1-2 um. Paradoxically, nastkolb2022 uses HIGHER CP-to-actin
    stoichiometry (50 nM CP across 0.5-4 uM actin -> R_CP = 1.25-10 mol%, standard 2.5 mol% at 2 uM),
    where Weirich's actin_filament_length_cp would cap bulk filaments to just 108 nm (40 monomers;
    27-216 nm across 0.5-4 uM). Yet 10 uM profilin suppresses spontaneous bulk nucleation while
    bilayer-clustered VASP actively protects growing barbed ends from CP, producing >10-50 um filaments
    (>100x breakdown of L_f = 2.7 nm / r_CP); halving R_CP from 2.5% to 1.25% at 4 uM actin actually
    reduces median bundle width (0.942 -> 0.812 um, Fig. S3F) due to faster unaligned bulk/surface growth.
    (4) Cross-linker reach, dimensionality, and interfilament spacing (~50 nm vs. ~22-28 nm):
    weirich2017 uses long (~150 nm), flexible, transient homodimeric filamin (1-15 mol%, 0.26 uM at
    10%), yielding a ~250 uM 3D nematic phase with aligned filament areal density rho = c_A*N_A*a_m =
    4.06 x 10^-4 nm^-2 and mean center-to-center spacing d = rho^(-1/2) = 49.6 nm (53.3 nm hexagonal),
    equivalent to ~51 filaments across an R_0 = 200 nm fluid bundle (or ~319 filaments across a 1 um
    3D cylinder and ~20.2 filaments across a 1D 1 um cross-section). nastkolb2022 uses flexible
    IDR-bearing VASP tetramers (28-70 nm diameter, washed 0.05-1 uM incubation; monomeric
    VASP_DeltaTetra still bundles at median 0.584 um via 2D surface up-concentration), expecting
    14.3-35.7 filaments per 1 um 2D single-layer ribbon and measuring 45 +/- 12 filaments/um by
    integrated fluorescence -> effective 2D spacing 22.2 nm (range 17.5-30.3 nm), ~2.2x tighter
    laterally than Weirich's ~50 nm 3D spacing (consistent with tighter compaction or ~1.26 stacked
    layers at 28 nm), yet ~7.1x fewer filaments in cross-section than a 1 um 3D cylinder at Weirich's
    250 uM density.

