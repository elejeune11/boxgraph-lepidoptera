  text: >
    Extrapolating integrated transverse fluorescence intensity gives 45 +/- 12 filaments in a
    1-um-thick bundle (p. 11), which under a strictly 2D single-filament layer implies an
    effective lateral spacing of 1000 nm / 45 = 22.2 nm (range 17.5-30.3 nm for 33-57
    filaments). While 35.7 filaments (at 28 nm) sits inside [33, 57], 14.3 filaments (at 70 nm)
    is excluded, and the mean 22.2 nm lies below the stated 28-70 nm VASP diameter range. This
    suggests either tighter lateral filament compaction (closer to fascin's 12.4 nm in
    Claessens et al. 2008) or >1 stacked filament layer in Z within the TIRF evanescent field
    (consistent with finite axial thickness in confocal XZ Fig. S1F). The paper also omits
    which VASP concentration was sampled and whether +/-12 is SD or SEM.
