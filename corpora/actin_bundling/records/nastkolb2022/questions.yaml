    where: "Data analysis (p. 11) vs chandrasekaran2024 Results (Fig. 6D, p. 7) & Supp. Table 2 (pp. 17-18)"
  text: >
    No cross-record validations are entered in validations.yaml in either direction between
    nastkolb2022 (17 models: 11 runnable [11 output ports] + 6 non-runnable; 66 origin: measured
    datums) and chandrasekaran2024 (46 models: 42 runnable [56 output ports] + 4 non-runnable; 10
    origin: measured datums). Neither paper cites the other, neither imports values from the other
    (0 cited.yaml links), and their quantitative models are structurally disjoint (0 cross-record
    relations in relations.yaml).
    (1) Forward direction — all 17 nastkolb2022 models vs all 10 origin: measured Fig. 6D 3D
    VASP-droplet morphology datums in chandrasekaran2024 (110 runnable output-datum pairs; 70
    dimensionless matches across 7 dimensionless ports, 0 matches in [length] and [time]):
    - All 10 origin: measured datums in chandrasekaran2024 quantify 3D PEG8k-crowded VASP droplet
      Shell, Ring, and Disk percentage abundances across Actin:VASP = 1:20, 1:10, and 1:7.5 for
      WT VASP (replotted from graham2023) and VASP-GABmut (4 scalars: exp_wt_disk_pct_1_7p5 =
      '70 ± 13'%, exp_gabmut_disk_pct_1_7p5 = '< 10'% [inequality -> no verdict],
      exp_gabmut_ring_pct_1_7p5 = '53 ± 6'%, exp_gabmut_shell_pct_1_7p5 = '37 ± 4'%; plus 6
      digitized 3-bar Fig. 6D curves: fig6d_{wt,gabmut}_{shell,ring,disk}_fig).
    - None of nastkolb2022's 11 runnable models predicts 3D droplet morphology abundances:
      (a) the 6 FRAP models (frap_recovery_fit, frap_recovery_by_half_time, frap_half_time,
      frap_tau_from_half_time, frap_mobile_fraction_plateau, frap_mobility_ratio) have zero FRAP
      targets in chandrasekaran2024 (which performs no FRAP experiments at all);
      (b) the 3 2D bundle geometry/scaling models (bundle_filament_count_2d_spacing,
      bundle_effective_spacing, bundle_width_vasp_scaling) have zero measured bundle-width,
      filament-count, or interfilament-spacing targets in chandrasekaran2024 (diagnostically,
      CytoSim's reported spherical VASP diameter 2*vasp_radius = 60 nm evaluated in
      bundle_filament_count_2d_spacing on a 1-um 2D ribbon gives 16.67 filaments/um, or 8.33 at
      the 120 nm max crosslink reach, far below nastkolb2022's 45 +/- 12 measured filaments/um);
      (c) cp_to_actin_ratio and actin_concentration_fold_change have no targets because
      chandrasekaran2024 uses zero capping protein and zero profilin and records no measured
      actin fold-change; and
      (d) all 6 non-runnable image-processing/fit models (bilayer_actin_decoration,
      bundle_filament_intensity_extrapolation, bundle_intensity_ratio, bundle_width_lognormal_fit,
      frap_bleach_normalization, vasp_actin_spearman_colocalization) cannot execute and measure
      2D TIRF observables unrelated to 3D droplet morphology percentages. All remaining 214
      chandrasekaran2024 datums are non-measured (107 run, 88 reported, 15 derived, 3 predicted,
      1 assumed).
    (2) Reverse direction — all 46 chandrasekaran2024 models (42 runnable [56 output ports] + 4
    non-runnable) vs all 66 origin: measured datums in nastkolb2022 (3,696 total pairs; 1,269
    dimension-matching pairs): 0 genuine validations, because:
    - Diffusion/transport models (stokes_einstein_diffusion, einstein_diffusion_relation,
      langevin_overdamped_1d.D_eff) have 0 [length]^2/[time] measured targets in nastkolb2022
      (which prints FRAP t_1/2 = 0.102 min SLB and 0.399 min ML over a 4.96 um bleach disk
      without computing D, while chandrasekaran2024 lacks a 2D FRAP t_1/2 model; diagnostically
      2D Soumpasis D_SLB = 0.2251 um^2/s and D_ML = 0.0575 um^2/s vs 3D Stokes-Einstein
      D_SE = 0.01454 um^2/s at 0.5 Pa*s, 0.1454 um^2/s at 0.05 Pa*s, and CytoSim D_VASP =
      10 um^2/s [44.4x D_SLB, 173.8x D_ML]).
    - Elongation-rate models (brownian_ratchet_growth_rate, elongation_rate_from_growth_time,
      total_actin_addition_rate, monomer_depletion_elongation_rate) have 0 [length]/[time]
      measured targets in nastkolb2022 (q_no_elongation_velocity_quantified).
    - Length (117 pairs), area (4 pairs), concentration (8 pairs), time (12 pairs), and
      dimensionless (1,128 pairs) dimension matches all cross physically incompatible quantities:
      transverse 2D bundle widths (9 datums) vs single-filament contour length / Brownian step /
      3D droplet axes / persistence length; 2D network pore areas (4 curves) vs 3D spheroid
      surface area; 2D VASP LLPS incubation onset ('>= 0.5' uM, '0.25 to 2' uM) vs stoichiometry
      and 3D-droplet actin concentration conversions (final_actin_concentration,
      vasp_tetramer_concentration, etc.); pre-actin 2D lipid-tethered FRAP t_1/2, 0-80 s
      diffraction-limited width window, and 6 min mDia1 detachment onset vs VASP-actin bond
