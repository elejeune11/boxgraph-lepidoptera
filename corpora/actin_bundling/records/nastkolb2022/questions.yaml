  text: >
    Reciprocal cross-record ModelAtlas & biophysical contrast with graham2023 (Graham et al., Nat.
    Phys. 19:574-585, 2023; 3D PEG8k-crowded human VASP condensates driving peripheral actin rings
    and elastocapillary rod deformation). Neither paper cites the other (0 stated relations, 0
    cited.yaml links; 11 co-cited references, including Harker 2019 and Winkelman 2014), and across
    all 17 nastkolb2022 (11 runnable, 6 non-runnable) x 31 runnable graham2023 models there are 0
    non-trivial (!too_plain) proposed relations:
    (1) Excluded too_plain identity & disjoint model families: bundle_filament_count_2d_spacing
    (n_f = 1000*W/d_spacing, 2 ops; inverse bundle_effective_spacing, 2 ops) and
    graham2023/ring_filament_count (N_fil = T_ring/delta, 1 op) share the exact same 2D flat-sheet
    linear filament-counting formula and verify symbolically under same_as, but are excluded as
    too_plain (<= 2 ops; flagged and excluded from ModelAtlas families; both already bridge in 2 hops
    through claessens2008/hexagonal_shell_filaments). nastkolb2022's only two non-too_plain models
    (frap_recovery_fit, 6 ops; frap_recovery_by_half_time, 8 ops) have 0 FRAP model counterparts in
    graham2023 (which delegates to ImageJ FRAP_Profiler_v2.java without printing an equation;
    applying frap_recovery_by_half_time to graham2023 Fig. 1f at printed a = 0.939, t_1/2 = 18 s,
    c = 0 gives RMSE = 6.50%, vs. 2.78% free 3-parameter fit). Conversely, graham2023's elongation
    fits (linear_bundle_elongation, 23 +/- 3 nm/s; elongation_monomer_rate, ~8-9/s) have no velocity
    model in nastkolb2022, and graham2023's droplet-diameter thickness scaling (D^1.5-D^1.97) has a
    distinct control variable from bundle_width_vasp_scaling (W ~ c_vasp, 0 ops). Symbol collisions:
    a (FRAP amplitude vs. ellipse semi-major axis / power-law prefactor), t (FRAP time [min] vs.
    elongation time [s]), and y (normalized FRAP intensity vs. bundle growth length [um]).
    (2) Key biophysical contrasts (full details in
    graham2023/q_nastkolb2022_modelatlas_and_2d_vs_3d_vasp_contrast):
    (a) 2D PEG-free Ni-NTA SLB LLPS of chimeric Dicty-GAB His6-VASP (0.05-2 uM washed incubation,
    KMEI buffer I ~ 72 mM, + 10 uM profilin + 50 nM CP) vs. 3D 3% PEG8k-crowded LLPS of cysteine-
    light human VASP (2-20 uM monomer = 0.5-5 uM tetramer, 150 mM NaCl / 50 mM Tris I ~ 195 mM,
    0 uM profilin, 0 nM CP, PLL-PEG-passivated glass where bare SLBs cause droplet wetting, Fig. 1e).
    (b) FRAP diffusivity reversal after bleach-area normalization: raw t_1/2 = 6.12 s (SLB) <
    18 +/- 3 s (3D VASP droplet) < 23.94 s (ML), but nastkolb2022's 4.96 um bleach spot has 7.59x
    the area of graham2023 Fig. 1f's 1.8 um spot, so effective diffusivity in graham2023's 3D
    droplet (D ~ 0.0075-0.0113 um^2/s) is ~20-30x slower than nastkolb2022's SLB (0.225 um^2/s) and
    ~5-8x slower even than nastkolb2022's bundling-incompetent ML (0.0575 um^2/s) — yet graham2023
    still bundles because 0 nM CP removes rapid diffusive-recapture competition while droplet
    confinement + ~12.6x G-actin partitioning drives mechanical ring-to-rod buckling (arrested only
    at 10% PEG where whole-droplet FRAP recovery falls to ~2.3%).
    (c) Monomeric VASP_Delta_Tetra (stop at aa 270) still forms 2D bundles on fluid SLBs (median
    0.584 um, max 3.2 um) via 2D membrane up-concentration, whereas graham2023's monomeric
    VASP_Delta_tet (stop after aa 339, deleting coiled-coil aa 340-380) fails to form 3D droplets up
    to 56 uM and 5% PEG8k (while VASP_Delta_EVH1 impairment and salt dissolution directly test
    nastkolb2022's p. 9 EVH1-PRR/IDR LLPS hypothesis).
    (d) Interfilament spacing: nastkolb2022's 28-70 nm VASP-diameter expectation (14.3-35.7
    filaments/um, printed 14-40) and fluorescence-extrapolated 45 +/- 12 filaments/um (effective
    22.2 nm, range 17.5-30.3 nm) are 1.48x-4.67x wider than graham2023's assumed delta = 15 nm
    (66.7 filaments/um, which would scale graham2023's linear ring bending stiffness k_b down by
    1.48x at 22.2 nm or 1.87x at 28 nm).

