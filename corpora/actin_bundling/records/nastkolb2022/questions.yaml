  citation:
    page: 9
    printed_page: "9"
    quote: "In contrast with conventional cross-linkers like fascin and α-actinin"
    where: "Discussion"
  text: >
    No exact equivalence (same_as), cross-linker concentration scaling (scales_as), or cited.yaml
    datum link holds between the thickness-control models of claessens2008 and nastkolb2022, and
    the two papers exhibit opposing scaling, saturation, and concentration dependencies:
    (1) Cross-linker concentration scaling and absence of saturation: claessens2008 models bundle
    diameter as a sublinear power law in equilibrium bound fascin-to-actin ratio, D ~ (R*)^0.3
    (diameter_scaling_Rstar; Fig. 1C fit slope 0.327, implying n_f ~ (R*)^0.6 and R* ~ n_f^(5/3)),
    followed by a sharp equilibrium plateau at R* ~= 0.25 (n_f ~= 20, TEM D ~= 28.2 nm) enforced
    by helical-to-hexagonal angular mismatch (-13/6 -> -28/13, Delta_theta ~= 1 deg/monomer,
    E_twist ~= 10 k_B T vs. Delta G ~= 15 k_B T) and stoichiometric site saturation (1 fascin per
    ~4.5 actin monomers, u ~= 13-14, surface-to-bulk ratio scaling as n_f^(-1/2) in
    bundle_geometry_saturation). In contrast, nastkolb2022 states linear scaling W ~ c_VASP^1
    (bundle_width_vasp_scaling) with no finite thickness plateau: digitized Fig. 2E medians rise
    from 0.547 and 0.581 um (0.05-0.125 uM, diffraction/segmentation floor) to 0.945, 1.589, and
    4.357 um (0.25, 0.50, 1.00 uM; local log-slopes 0.70, 0.75, 1.46; OLS 0.685) up to 95%
    bilayer decoration (Fig. S2G), and grow even more steeply against sublinearly rising membrane
    VASP fluorescence (Fig. S2H, log-slope 0.45 over 0.25-2.0 uM -> W vs. VASP fluorescence slopes
    1.58-2.37). Moreover, c_VASP is a pre-wash incubation concentration (20x PBS wash before actin
    addition) rather than an equilibrium bound ratio R*, and in a 2D bilayer ribbon every filament
    contacts the membrane (contact area ~ N_f^1 rather than perimeter ~ n_f^(1/2)), feeding
    positive VASP recruitment and barbed-end elongation at the two lateral bundle borders (Fig. 2F).
    (2) Bundling potency at comparable actin concentration: at c_a = 0.1 mg/ml = 2.38 uM
    (claessens2008 Fig. 1C, close to nastkolb2022's standard 2 uM actin), reaching Claessens's
    R* = 0.25 plateau requires bulk c_fascin = 0.70 uM (R = 0.292 via effective_bound_ratio with
    K_d = 0.3 uM) and still caps thickness at ~20 filaments (~57 nm hydrated). In nastkolb2022,
    incubating 0.25 uM VASP (washed prior to actin addition) already yields median 0.942 um
    (~45 filaments, max 3 um), quantitatively corroborating Nast-Kolb's p. 9 claim of forming
    large bundles at comparatively low bundling-protein concentrations.
    (3) Actin-concentration dependence: claessens2008 finds bundle diameter independent of c_a at
    fixed R* (Fig. 1A-B, and decreasing with c_a at fixed c_f since R = c_f/c_a), whereas
    nastkolb2022 (Fig. S3F at 0.25 uM VASP) finds non-monotonic median widths (0.574, 0.770,
    0.942, 0.812 um at 0.5, 1, 2, 4 uM actin) controlled by G-actin supply up to 2 uM and
    declining at 4 uM as R_CP halves from 0.025 to 0.0125.
    (4) Disjoint sub-models and rejected too_plain coincidences: nastkolb2022's six FRAP kinetics
    models, actin_concentration_fold_change, and cp_to_actin_ratio have no counterparts in
    claessens2008, while claessens2008's SAXS Bragg/helical-mismatch, twist/binding-energy,
    mass-action R*, and droplet-confinement models have no counterparts in nastkolb2022. In
    particular, cp_to_actin_ratio (R_CP = c_CP/c_actin) and claessens2008/molar_ratio_fascin_actin
    (R = c_f/c_a) are excluded from relations.yaml as a too_plain ratio coincidence between
    functionally opposite proteins (barbed-end capper vs. filament cross-linker). Neither record
    imports any numerical datum from the other (no cited.yaml links apply).

