    (claessens2008/q_tem_vs_saxs_bundle_diameter: TEM plateau mean 28.09 nm [28.14 nm at R* = 0.70,
    28.04 nm at R* = 0.90] vs hydrated 2-shell SAXS width 50.35 nm flat-to-flat / 57.00 nm
    vertex-to-vertex). Moreover: (a) both measured total filament-count scalars (nf_max_abstract,
    nf_max_confinement) are printed with approximate "≈ 20" (no precision -> no verdict), and
    diagnostically W / a_H gives only 2.27 filaments (TEM 28.09 nm) or 4.06-4.60 filaments (hydrated
    50.35-57.00 nm), 4.3x-8.8x below 20 because 3D hexagonal bundles pack as n_f ~ (W / a_H)^2
    rather than 2D W / a_H; (b) D_fil_fig2d_text ("5 to 6") measures bundle_diameter_in_filaments
