    quote: "fitted using with the formula y = a∗(1 – e(-t/τ)) + c"
    where: "Data analysis (p. 11) vs graham2023 Fig. 1f (p. 2), Methods (p. 15) & SI Table 1 / Sec. 2.6 (pp. 39, 41)"
  text: >
    Reciprocal bidirectional cross-validation audit between nastkolb2022 (17 models: 11 runnable
    [11 output ports] + 6 non-runnable; 66 origin: measured datums) and graham2023 (31 runnable
    models [40 output ports]; 38 origin: measured datums) yields 2 checked CrossValidation entries
    (1 in each direction):
    (1) Forward direction — all 17 nastkolb2022 models vs all 38 origin: measured datums in
    graham2023 (418 runnable port-datum pairs; 234 dimension-matching: 224 dimensionless, 6
    [length], 4 [time]):
    - INCLUDED (1 entry in nastkolb2022/validations.yaml): val_frap_by_thalf_vs_graham_fig1f
      (purpose: fit_quality). Both papers normalize circular-ROI VASP FRAP with the exact same
      bleach-corrected 0%-100% double normalization (Siggia 2000 in nastkolb2022 p. 11; max
      pre-bleach and min post-bleach via ImageJ FRAP_Profiler_v2.java in graham2023 Methods
      p. 15), and graham2023 prints both t_1/2 = 18 +/- 3 s (graham2023/frap_t_half) and final
      recovery 93.9 +/- 4.89% (graham2023/frap_recovery_fig1f, entered as
      frap_amp_graham_fig1f_added = 0.939 because graham2023 does not explicitly print fit
      asymptote a and assigns shared quantity frap_recovery_fraction to both scalar recovery and
      curve) without printing any FRAP equation. Evaluating frap_recovery_by_half_time (c = 0)
      across graham2023/fig1f_frap_avg_fig yields verdict: not reproduced (3/13 reproduced, 4/13
      close, 6/13 not reproduced). Critically, while the single pre-bleach point t = -10 s
      (100.4% vs model -44.11%) lies outside the t >= 0 post-bleach domain, the 12 post-bleach
      points (t = 5-290 s) independently yield not reproduced (3/12 reproduced at 30, 240, 290 s;
      4/12 close at 5, 10, 18, 190 s; 5/12 not reproduced at 40, 60, 90, 120, 150 s; RMSE =
      6.50%, max |err| = 10.44% at 10 s), invariant across all 45 combinations of a in [87.91,
      89.01, 93.9, 94.0, 98.79]%, t_1/2 in [15, 18, 21] s, and c in [-2, 0, +2]% (RMSE >= 5.11%).
      This S-shaped early-underprediction / mid-overshoot residual mirrors nastkolb2022's own
      cmp_frap_by_thalf_slb_prepol_fig4c (3/15 reproduced), whereas 2D Soumpasis diffusive FRAP
      (c = 0) reproduces 11/12 post-bleach points (RMSE = 1.12%) and biexponential (c = 0)
      reproduces 12/12 (RMSE = 0.60%).
    - EXCLUDED (all remaining 417 runnable pairs + 6 non-runnable models):
      (a) frap_recovery_fit vs fig1f_frap_avg_fig: graham2023 prints t_1/2 (18 +/- 3 s), not tau
      (25.97 s unprinted), and would duplicate val_frap_by_thalf_vs_graham_fig1f identically.
      (b) frap_recovery_by_half_time / frap_recovery_fit vs fig6b_frap_3peg_fig (41.2% at 300 s,
      rising) and fig6b_frap_10peg_fig (pre-bleach t = 0 at 100.1%, flat 1.0-2.3% post-bleach):
      larger whole-droplet bleach area (caption p. 9 explicitly notes slower recovery than Fig.
      1f) with neither t_1/2 nor plateau printed anywhere in graham2023.
      (c) frap_mobile_fraction_plateau (y_inf = a + c) vs frap_recovery_fig1f / frap_recovery_text
      (tautological a + 0 = a on Graham's own a, and Nast-Kolb's 2D SLB/ML values do not model
      3D PEG condensates); frap_half_time, frap_tau_from_half_time, frap_mobility_ratio (only
      one t_1/2 printed, no tau, no SLB/ML pair; vasp_droplet_fusion_time ~1 s is droplet
      coalescence, not FRAP).
      (d) bundle_filament_count_2d_spacing, bundle_effective_spacing, bundle_width_vasp_scaling:
      graham2023 contains 0 origin: measured filament-count, interfilament-spacing (delta = 15 nm
      is assumed; Ena 12 nm is reported), or bundle-width-vs-c_VASP datums (its 3 [length]
      measured datums are actin-free droplet diameters at fixed 20 uM VASP, while Figs. 3e/3f/4h
      ring-thickness curves are origin: predicted power-law fits vs droplet diameter D).
      (e) cp_to_actin_ratio and actin_concentration_fold_change (graham2023 uses 0 nM CP and
      has no measured actin concentration fold-change); all 6 non-runnable models; and all 28
      remaining non-FRAP measured datums in graham2023 (morphology abundances, droplet aspect
      ratios, elongation intensity traces, partition coefficients, droplet size histograms,
      elongation velocity).
    (2) Reverse direction — all 31 runnable graham2023 models (40 ports) vs all 66 origin:
    measured datums in nastkolb2022 (2,640 port-datum pairs; 511 dimension-matching):
    - INCLUDED (1 entry in graham2023/validations.yaml):
      val_ring_filament_count_vs_nastkolb_1um (purpose: validation; zero added inputs). Evaluates
      graham2023/ring_filament_count (N_fil = T_ring/delta) with Graham's assumed delta = 15 nm
      at nastkolb2022/bundle_width_ref_1um (1 um) against filament_count_1um_intensity_measured
      (45 +/- 12), predicting 66.67 (+21.67, +48.1%, +1.81 uncertainty units -> verdict: close,
      outside [33, 57]).
    - EXCLUDED: all other 2,639 pairs (16 ports in unmatched stiffness/energy/tension/rate
      dimensions; 15 [length] droplet-geometry, longitudinal-elongation, and spherical-confinement
      ring-thickness ports vs 9 open-2D-SLB bundle-width datums; 7 dimensionless droplet/ring
      aspect/ratio/exponent ports vs 46 non-filament-count dimensionless datums; plus 10
      pore-area, LLPS-concentration, and time datums in nastkolb2022 with no matching graham2023
      output ports). See graham2023/q_nastkolb2022_cross_validation_summary for full details.

