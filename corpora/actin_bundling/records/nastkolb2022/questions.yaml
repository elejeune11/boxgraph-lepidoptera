    Cross-record ModelAtlas audit across all 17 nastkolb2022 models (11 runnable, 6 non-runnable)
    and all 52 weirich2017 models (51 scalar runnable, 1 curve model):
    (1) Citations and data provenance (0 cited.yaml links, 0 stated relations): nastkolb2022 does
    not cite weirich2017 anywhere in its text or 66 references (and weirich2017 predates
    nastkolb2022 by 5 years). Their bibliographies share exactly 3 references — Blanchoin et al.
    (2014) [ref-blanchoin2014 = weirich2017/ref-4], Falzone et al. (2012) [ref-falzone2012 =
    weirich2017/ref-11], and Spudich & Watt (1971) [ref-spudich1971 = weirich2017/ref-39]. Neither
    data.yaml borrows any numerical datum from the other (0 cited.yaml links).
    (2) Audit of FRAP and exponential relaxation models (0 proposed relations): the only two
    non-too_plain runnable models in nastkolb2022 are frap_recovery_fit (y = a*(1 - exp(-t/tau)) + c,
    6 ops, role: fit) and frap_recovery_by_half_time (y = a*(1 - exp(-t*ln(2)/t_half)) + c, 8 ops,
    role: fit). Neither forms a valid mathematical or physical ModelAtlas relation with weirich2017's
    exponential models:
    (a) vs. weirich2017/tactoid_exponential_relaxation (L(t) = L_f + (L_i - L_f)*exp(-t/tau), 5 ops,
    role: fit): output dimensions are incompatible (dimensionless fluorescence intensity vs. um
    tactoid major-axis length), ruling out same_as, reduces_to, derived_from, and approximated_by.
    Even a formal scales_as mapping (t -> 60*t, tau -> 60*tau, L_i -> c, L_f -> a + c) is physically
    spurious: it equates dimensionless normalized fluorescence to micrometers, evaluates Weirich's
    droplet-shortening fit in its unphysical elongating branch (L_f > L_i, reversing the sign of
    L_i - L_f; the converse forces a negative mobile fraction a = L_f - L_i < 0), and merely pairs
    two generic 3-parameter single-exponential empirical fits across unrelated mechanisms (2D
    membrane-bound VASP photobleach recovery vs. 3D nematic tactoid capillary-viscous shape
    shortening).
    (b) vs. weirich2017/tactoid_exponential_master_curve (L_scaled = exp(-t_scaled), 2 ops): flagged
    too_plain, decays monotonically from 1 to 0 rather than rising from c to a + c (matching would
    require unphysical a = -1, c = 1), and describes rescaled droplet shortening rather than FRAP.
    (c) vs. weirich2017's actual FRAP assay (Fig. 1C, p. 2132 & SI p. SI-1): Weirich et al. fit
    bleached-to-unbleached TMR-actin intensity ratio to a rising single exponential in words
    (tau_R = 880 s caption, ~900 s text) — conceptually matching nastkolb2022/frap_recovery_fit —
    but print no formula and no baseline/plateau parameters (and weirich2017/q_digitized_fig3a_slope_and_fig1c_fit_tau
    shows the digitized Fig. 1C dashed curve yields I_0 = 0.224, I_inf = 0.947, tau = 712 s when
    unconstrained vs. tau = 815 s at I_inf = 1.00 and tau_R = 880 s requiring I_inf ~ 1.03-1.05).
    Thus weirich2017 has no FRAP curve-fit model, and inventing one as a helper would fabricate an
    unstated parameterization. Conversely, weirich2017's FRAP transport models (frap_diffusion_scaling
    D ~ L_b^2/tau_R [2 ops, too_plain], stokes_einstein_ellipsoid_diffusion, and
    stokes_einstein_ellipsoid_viscosity) have no counterpart in nastkolb2022, which omits diffusivity
    D and viscosity eta entirely (q_frap_unstated_fit_params_and_diffusivity).
    (3) Explicitly rejected too_plain and structurally disjoint pairings across all remaining 9
    runnable nastkolb2022 models (all <= 2 ops):
    (a) frap_mobility_ratio (t_half_ml/t_half_slb, 1 op), frap_half_time (tau*ln(2), 2 ops),
    frap_tau_from_half_time (t_half/ln(2), 2 ops), and frap_mobile_fraction_plateau (a + c, 1 op) vs.
    weirich2017/frap_diffusion_scaling (L_b^2/tau_R, 2 ops): trivial 1-2 op algebra; mapping R_mob to
    D at fixed L_b only tests 1/t_half_slb scaling while dropping both L_b and t_half_ml.
    (b) actin_concentration_fold_change (c_high/c_std = 4 uM / 2 uM = 2, 1 op) vs.
    weirich2017/concentration_enrichment_ratio (c_dense/c_dilute = 250 uM / 2.6 uM ~ 100, 1 op):
    too_plain ratio coincidence on unrelated concepts (bulk recipe titration vs. 3D phase-coexistence
    partitioning).
    (c) cp_to_actin_ratio (R_cp = 1e-3*c_cp/c_actin, 2 ops) vs. weirich2017/actin_filament_length_cp
    (N_m = 1/r_CP, L_f = a_m/r_CP, 1 op) and filamin_concentration_from_fraction (c_A*f_fil, 1 op):
    too_plain, reciprocal/incompatible outputs, and physically Weirich's equilibrium capping length
    law breaks down by >100x in Nast-Kolb's profilin + anti-capping VASP assay.
    (d) bundle_filament_count_2d_spacing (1000*W/d_spacing, 2 ops), bundle_effective_spacing
    (1000*W/n_f, 2 ops), and bundle_width_vasp_scaling (W ~ c_vasp, 0 ops, prefactor: unknown):
    weirich2017 has no runnable model for bundle filament count, intra-bundle spacing, or bundle
    width vs. cross-linker concentration (R_0 ~ 200 nm is an unmodeled input, while tactoid aspect
    ratio L/r decreases with filamin concentration). Two non-runnable nastkolb2022 processing models
    have qualitative methodological parallels in weirich2017 SI p. SI-1:
    bundle_filament_intensity_extrapolation parallels Weirich's unformalized confocal cross-section
    intensity-ratio spacing estimate (2D linear d = W/N_f vs. 3D area d = sqrt(A_cross/N_f)), and
    frap_bleach_normalization (Siggia et al. 2000 reference ROI) parallels Weirich's bleached/unbleached
    half-tactoid intensity ratio (Fig. 1C, Fig. S1).
    (4) Symbol collisions across the two records: tau (2D VASP FRAP time constant [min] in
    nastkolb2022 vs. 3D tactoid shape-relaxation or F-actin FRAP time constant [s] in weirich2017),
    c (dimensionless FRAP baseline offset vs. actin mass concentration [mg/mL]), a (FRAP recovery
    amplitude vs. a_m monomer spacing [nm]), R (ratios R_CP, R_mob, R_actin, R_I vs. tactoid
    circular-arc radius R [um] and bundle radius R_0 [nm/um]), and D (absent as a model port in
    nastkolb2022 vs. diffusion coefficient [um^2/s] or dissipated power [W] in weirich2017).

