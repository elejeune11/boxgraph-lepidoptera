- id: q_claessens2008_2d_vs_3d_packing_and_spacing_contrast
  kind: unexplained_difference
  about:
    - bundle_filament_count_2d_spacing
    - bundle_effective_spacing
    - rel_claessens2008_hex_shells_scales_2d_spacing
    - rel_claessens2008_hex_width_reduces_to_2d_count
    - filament_count_1um_intensity_measured
    - vasp_diameter_range
    - vasp_diameter_min
    - ref-claessens2008
    - claessens2008/hexagonal_shell_filaments
    - claessens2008/hexagonal_lattice_spacing
    - claessens2008/diameter_filament_scaling
    - claessens2008/filament_number_from_diameter_ratio
    - claessens2008/aH_hex_saxs
    - claessens2008/interfilament_sep_fascin
    - claessens2008/nf_max_confinement
  citation:
    page: 11
    printed_page: "11"
    quote: "eter range from 28 to 70 nm of VASP, we expected a quantity of"
    where: "Data analysis"
  text: >
    Comparing lateral filament packing and interfilament spacing between claessens2008 (3D
    fascin-crosslinked bundles) and nastkolb2022 (2D VASP-mediated bundles on fluid supported
    lipid bilayers) exposes a fundamental dimensionality and lattice-spacing contrast:
    (1) 3D cross-sectional area vs. 2D single-layer ribbon scaling: claessens2008's packing
    models follow 3D cross-sectional area scaling n_f ~ D^2 (filament_number_from_diameter_ratio
    n_f = n_f_0 * D_ratio^2, diameter_filament_scaling D ~ n_f^(1/2), and hexagonal_shell_filaments
    n_f = 1 + 3*k*(k + 1)), whereas nastkolb2022's bundle_filament_count_2d_spacing assumes a
    single-layer 2D ribbon with linear scaling N_f = W / d_spacing ~ W^1 (log-slope 1 vs. 2 in
    bundle width). Consequently, nastkolb2022's 2D filament count corresponds geometrically only
    to the 1D transverse diameter in filaments D_fil = 2*k + 1 of a 3D hexagonal bundle
    (rel_claessens2008_hex_shells_scales_2d_spacing and
    rel_claessens2008_hex_width_reduces_to_2d_count), not to the 3D total filament count n_f.
    (2) Interfilament spacing (~12.4 nm vs. ~22-70 nm) and quantitative 1-um bundle check:
    claessens2008 measures a tight, rigid hexagonal center-to-center spacing a_H = 12.4 nm by SAXS
    (q_10 = 0.585 nm^-1, surface separation ~5 nm, areal density rho_0 = 2/(sqrt(3)*a_H^2) =
    7510 filaments/um^2), saturating at k = 2 shells (n_f = 19 ~= 20 filaments, D_fil = 5,
    hydrated vertex width 57.0 nm, flat-to-flat 50.4 nm, TEM plateau 28.2 nm). In contrast,
    nastkolb2022 assumes flexible tetrameric VASP (with intrinsically disordered regions) sets a
    2.3-5.6x wider spacing of 28-70 nm (14.3-35.7 filaments in a 1-um 2D bundle), and measures
    45 +/- 12 filaments per 1-um bundle by integrated fluorescence (effective 2D spacing
    22.2 nm, range 17.5-30.3 nm). A 3D hexagonal cylinder of diameter W = 1 um would hold
    ~5898 filaments at fascin's a_H = 12.4 nm (131x Nast-Kolb's 45), ~1157 filaments at VASP's
    28 nm (26x), or ~185 filaments even at 70 nm (4.1x), confirming that Nast-Kolb's bundles are
    genuinely quasi-2D (~1.26 stacked layers [0.92, 1.60] at 28 nm spacing, or a single slightly
    compacted layer at 22.2 nm; even a single 2D layer at fascin's 12.4 nm holds 80.6 filaments).
    Conversely, applying nastkolb2022's 2D bundle_effective_spacing (W / n_f) to claessens2008's
    saturated 3D 2-shell bundle (57.0 nm / 19) yields 3.00 nm (4.1x below a_H = 12.4 nm and
    narrower than a single actin filament), illustrating how multi-layer stacking depresses W/n_f.
    (3) Short-range electrostatics in both buffers: Claessens's F-buffer (100 mM KCl, 2 mM MgCl2,
    I ~= 111 mM, Debye length lambda_D ~= 0.91 nm) and Nast-Kolb's KMEI buffer (50 mM KCl,
    1 mM MgCl2, I ~= 72 mM, lambda_D ~= 1.13 nm) both screen electrostatics well below the
    interfilament surface separations (~5 nm for fascin, >= 20 nm for VASP).

