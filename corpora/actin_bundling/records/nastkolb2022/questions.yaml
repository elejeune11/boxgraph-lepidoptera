    quote: "limited by the reduced Brownian motion of large bundles. In con-"
    where: "Discussion"
  text: >
    In the Discussion (p. 9), nastkolb2022 groups Claessens et al. (2008) [ref-claessens2008]
    with alpha-actinin (Falzone et al., 2012) and talin/vinculin (Kelley et al., 2020), writing
    that 'These mechanisms ... rely on filament zippering through filament fluctuations to create
    bundles. Therefore the enlargement of bundles is limited by the reduced Brownian motion of
    large bundles.' While kinetic Brownian arrest limits alpha-actinin bundle growth (Falzone et
    al., 2012), claessens2008 (p. 1) explicitly tested preparation-history independence (comparing
    long vs. shortened pre-formed filaments and fascin present before vs. after polymerization)
    and rejected kinetic arrest for F-actin/fascin bundles, concluding instead that finite
    thickness (n_f ~= 20, two hexagonal shells) is an equilibrium thermodynamic limit set by
    helical-twist frustration (-13/6 -> -28/13 overtwist, E_twist ~= 10 k_B T vs. Delta G ~= 15 k_B T)
    and stoichiometric saturation of fascin binding sites (1:4.5).

