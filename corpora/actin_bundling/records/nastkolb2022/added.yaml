- id: frap_baseline_offset_added
  quantity: frap_baseline_offset
  unit: dimensionless
  printed: "0"
  basis: >
    FRAP recovery curves are normalized using the prebleach intensity and the first post-bleach
    frame (Siggia et al., 2000; p. 11), which maps t = 0 to y = 0 (consistent with Fig. 4C,
    where all four traces begin at 0.0 at t = 0). The paper does not print the fitted offset c
    in y = a*(1 - exp(-t/tau)) + c; small nonzero fit offsets reflect single-frame noise.
  alternatives: ["-0.02", "0.02"]
  stands_for: "c in y = a*(1 - exp(-t/tau)) + c (p. 11)"

- id: frap_observation_end_added
  quantity: frap_recovery_time
  unit: min
  printed: "1.3"
  basis: >
    End of the post-bleach recording time axis shown in Fig. 4C (p. 7, x-axis spans -0.2 to
    ~1.3 min), not printed as a number in the text. Used to evaluate fractional completion of
    the exponential FRAP recovery model at the end of the experimental window.
  alternatives: ["1.2", "1.4"]
  stands_for: "End time t_end of FRAP observation window in Fig. 4C (p. 7)"

- id: frap_amp_graham_fig1f_added
  quantity: vasp_mobile_fraction
  unit: dimensionless
  printed: "0.939"
  basis: >
    Exponential recovery amplitude a = 0.939 set to Graham et al. (2023) Fig. 1f caption's
    reported average VASP FRAP recovery 93.9 +/- 4.89% (graham2023/frap_recovery_fig1f,
    mean final recovery at t = 297 s across n = 7 remaining droplets; rounded to 94 +/- 5% in
    main text graham2023/frap_recovery_text). Graham et al. delegate FRAP fitting to ImageJ
    FRAP_Profiler_v2.java without printing the fitted exponential asymptote a or baseline c;
    because t = 290-297 s equals ~16*t_1/2 (1 - 2^(-16) = 0.999985), the final recovery equals
    a to 5 significant digits when c = 0. Entered in added.yaml both because a is not explicitly
    printed as a fit parameter in graham2023 and because graham2023 assigns the same quantity
    frap_recovery_fraction to both frap_recovery_fig1f and fig1f_frap_avg_fig whereas
    nastkolb2022/frap_recovery_by_half_time separates input vasp_mobile_fraction (a) from output
    frap_normalized_intensity (y).
  alternatives: ["0.8901", "0.9879", "0.94", "0.8791"]
  stands_for: "a in y = a*(1 - 2^(-t/t_1/2)) + c evaluated on graham2023 Fig. 1f (15 uM VASP, 3% PEG)"

