- id: cmp_nf_2d_min_repro
  purpose: reproduction
  computed: nf_2d_min_computed
  printed: filament_count_1um_expected_min
  note: Tests whether 1 um / 70 nm reproduces the printed lower bound of 14 filaments per 1-um bundle (14.29 lies inside [13.5, 14.5]).

- id: cmp_nf_2d_max_repro
  purpose: reproduction
  computed: nf_2d_max_computed
  printed: filament_count_1um_expected_max
  note: Tests whether 1 um / 28 nm reproduces the printed upper bound of 40 filaments per 1-um bundle (1000/28 = 35.71 falls 10.7% below 40).

- id: cmp_nf_2d_min_vs_intensity
  purpose: consistency
  computed: nf_2d_min_computed
  printed: filament_count_1um_intensity_measured
  note: Compares extended-VASP (70 nm spacing) geometric filament count (14.3) against the intensity-extrapolated count (45 +/- 12).

- id: cmp_nf_2d_max_vs_intensity
  purpose: consistency
  computed: nf_2d_max_computed
  printed: filament_count_1um_intensity_measured
  note: Compares compact-VASP (28 nm spacing) geometric filament count (35.7) against the intensity-extrapolated count (45 +/- 12, interval [33, 57]).

- id: cmp_spacing_intensity_vs_vasp_range
  purpose: consistency
  computed: d_spacing_from_intensity
  printed: vasp_diameter_range
  note: Compares effective 2D lateral spacing implied by 45 filaments/um (22.2 nm) against the stated 28-70 nm VASP diameter range.

- id: cmp_spacing_expected_40_vs_vasp_min
  purpose: consistency
  computed: d_spacing_from_expected_40
  printed: vasp_diameter_min
  note: Quantifies that 40 filaments in 1 um corresponds to 25.0 nm spacing rather than the stated 28 nm minimum VASP diameter.

- id: cmp_width_scaling_025
  purpose: validation
  computed: bundle_width_scaling_025
  printed: bundle_width_median_vasp_025
  note: Evaluates the prefactor-unknown scaling law W ~ c_VASP against the printed 0.25 uM VASP median bundle width (0.942 um), reporting the implied proportionality constant (3.768 um/uM).

- id: cmp_frap_mobility_ratio_repro
  purpose: reproduction
  computed: frap_mobility_ratio_computed
  printed: vasp_mobility_reduction_ml_vs_slb
  note: Tests whether the monolayer-to-bilayer FRAP half-time ratio (0.399 min / 0.102 min = 3.91) reproduces the printed factor of 4 mobility reduction.

- id: cmp_actin_conc_fold_change_repro
  purpose: reproduction
  computed: actin_conc_fold_change_computed
  printed: actin_conc_high_fold_change
  note: Tests whether 4 uM / 2 uM reproduces the printed p. 2 statement that 4 uM actin is 'double the amount compared with the general conditions'.

- id: cmp_width_scaling_fig2e_median
  purpose: validation
  computed: bundle_width_scaling_fig2e_median_pred
  printed: bundle_width_median_vs_vasp_fig2e
  note: "Tests whether the paper's linear scaling claim W ~ c_VASP (prefactor: unknown) reproduces the shape of all five Fig. 2E bundle width medians (0.05-1.00 uM VASP) within reading precision."

- id: cmp_width_scaling_fig2e_range
  purpose: validation
  computed: bundle_width_scaling_fig2e_range_pred
  printed: bundle_width_vs_vasp_fig2e
  note: "Tests whether the paper's linear scaling law W ~ c_VASP (prefactor: unknown) falls inside the broad 1-99th percentile bundle width boxplot whiskers across 0.05-1.00 uM VASP in Fig. 2E."

- id: cmp_frap_fit_slb_prepol_fig4c
  purpose: fit_quality
  computed: frap_fit_slb_prepol_curve_pred
  printed: frap_curve_slb_prepol_fig4c
  note: Compares the single-exponential FRAP curve y = a*(1 - exp(-t/tau)) + c (using printed a = 0.97, tau = 0.102/ln(2) min, c = 0) against the digitized Fig. 4C VASP SLB prePol recovery trace (0.05-1.3 min).

- id: cmp_frap_fit_ml_prepol_fig4c
  purpose: fit_quality
  computed: frap_fit_ml_prepol_curve_pred
  printed: frap_curve_ml_prepol_fig4c
  note: Compares the single-exponential FRAP curve y = a*(1 - exp(-t/tau)) + c (using printed a = 0.61, tau = 0.399/ln(2) min, c = 0) against the digitized Fig. 4C VASP ML prePol recovery trace (0.05-1.3 min).

- id: cmp_frap_by_thalf_slb_prepol_fig4c
  purpose: fit_quality
  computed: frap_by_thalf_slb_prepol_curve_pred
  printed: frap_curve_slb_prepol_fig4c
  note: Compares the half-time-parameterized FRAP curve y = a*(1 - 2^(-t/t_1/2)) + c (a = 0.97, t_1/2 = 0.102 min, c = 0) against the digitized Fig. 4C VASP SLB prePol recovery trace.

- id: cmp_frap_by_thalf_ml_prepol_fig4c
  purpose: fit_quality
  computed: frap_by_thalf_ml_prepol_curve_pred
  printed: frap_curve_ml_prepol_fig4c
  note: Compares the half-time-parameterized FRAP curve y = a*(1 - 2^(-t/t_1/2)) + c (a = 0.61, t_1/2 = 0.399 min, c = 0) against the digitized Fig. 4C VASP ML prePol recovery trace.

