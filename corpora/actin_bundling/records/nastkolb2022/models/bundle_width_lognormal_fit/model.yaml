id: bundle_width_lognormal_fit
name: log-normal fit of actin bundle width histograms
role: fit
runnable: false
not_runnable_reason: >
  The paper plots log-normal curves fitted to bundle width histograms (Fig. 2D, Supplemental
  Fig. S2I, Supplemental Fig. S4C) but does not state the functional form, normalization
  convention (density vs bin-area scaled), bin width, or any fitted log-normal parameters
  (mu, sigma, amplitude).
stated:
  page: 4
  printed_page: "4"
  quote: "with a log-normal fit of the distribution."
  where: "Fig. 2D caption"
inputs:
  W:
    quantity: bundle_width
    unit: um
    description: Local segmented actin bundle width W.
outputs:
  f_bundle:
    quantity: bundle_width_fraction
    unit: dimensionless
    description: Fitted fraction of bundles as a function of bundle width W.
settings: {}
stochastic: false
