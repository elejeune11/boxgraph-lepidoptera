id: vasp_actin_spearman_colocalization
name: VASP-to-actin Spearman rank colocalization coefficient (FIJI Coloc 2)
role: processing
runnable: false
not_runnable_reason: >
  The paper computes pixel-wise Spearman's rank correlation between 10-frame averaged,
  pseudo-flat-field-corrected VASP-Alexa532 and Actin-Atto488 images in FIJI Coloc 2 (Fig. 4B),
  but does not release raw paired fluorescence image stacks.
stated:
  page: 11
  printed_page: "11"
  quote: "Spearman’s rank correlation coefficient was calculated"
  where: "Data analysis"
inputs:
  I_vasp:
    quantity: fluorescence_intensity_vasp
    unit: dimensionless
    description: Pixel-wise VASP-Alexa532 fluorescence intensity field.
  I_actin:
    quantity: fluorescence_intensity_actin
    unit: dimensionless
    description: Pixel-wise Actin-Atto488 fluorescence intensity field.
outputs:
  rho_s:
    quantity: spearman_colocalization_score
    unit: dimensionless
    description: Spearman's rank correlation score between VASP and actin channels.
settings: {}
stochastic: false
