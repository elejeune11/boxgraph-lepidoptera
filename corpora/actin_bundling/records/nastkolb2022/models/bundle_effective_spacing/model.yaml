id: bundle_effective_spacing
name: effective 2D interfilament spacing from bundle width and filament count
role: processing
from_words: true
built_from:
  - bundle_filament_count_2d_spacing
stated:
  page: 11
  printed_page: "11"
  quote: "14–40 filaments in a 1-µm-thick bundle. We verified this by inte-"
  where: "Data analysis"
equation: "d_spacing = W / N_f"
inputs:
  W:
    quantity: bundle_width
    unit: um
    description: Two-dimensional lateral bundle width W.
  n_f:
    quantity: filaments_per_bundle
    unit: dimensionless
    description: Number of actin filaments across a bundle of width W.
outputs:
  d_spacing:
    quantity: interfilament_spacing
    unit: nm
    description: Implied effective center-to-center lateral spacing between filaments assuming a 2D single-filament layer.
settings: {}
stochastic: false
