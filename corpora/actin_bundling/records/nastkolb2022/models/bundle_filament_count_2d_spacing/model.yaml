id: bundle_filament_count_2d_spacing
name: 2D actin bundle filament count from VASP interfilament spacing
role: model
from_words: true
stated:
  page: 11
  printed_page: "11"
  quote: "eter range from 28 to 70 nm of VASP, we expected a quantity of"
  where: "Data analysis"
equation: "N_f = W / d_spacing"
inputs:
  W:
    quantity: bundle_width
    unit: um
    description: Two-dimensional lateral bundle width W (e.g. 1 um).
  d_spacing:
    quantity: interfilament_spacing
    unit: nm
    description: Center-to-center interfilament spacing set by VASP diameter (28 to 70 nm).
outputs:
  n_f:
    quantity: filaments_per_bundle
    unit: dimensionless
    description: Expected number of actin filaments across a 2D single-layer bundle of width W.
settings: {}
stochastic: false
