id: frap_bleach_normalization
name: reference-corrected FRAP trace normalization (Siggia et al., 2000)
role: processing
runnable: false
described_from: ref-siggia2000
not_runnable_reason: >
  The paper corrects FRAP traces for acquisition photobleaching using an unbleached reference
  region and normalizes by prebleach and first post-bleach frame intensities following Siggia
  et al. (2000) (Fig. 4C), but prints neither the exact normalization formula nor raw ROI and
  reference fluorescence traces.
stated:
  page: 11
  printed_page: "11"
  quote: "The data were normalized using the prebleach intensity and"
  where: "Data analysis"
inputs:
  I_roi:
    quantity: frap_raw_roi_intensity
    unit: dimensionless
    description: Raw fluorescence intensity in the 4.96-um circular bleached ROI.
  I_ref:
    quantity: frap_raw_reference_intensity
    unit: dimensionless
    description: Raw fluorescence intensity in an unbleached reference region.
outputs:
  y:
    quantity: frap_normalized_intensity
    unit: dimensionless
    description: Bleach-corrected normalized FRAP fluorescence intensity.
settings: {}
stochastic: false
