id: frap_mobile_fraction_plateau
name: asymptotic long-time plateau of FRAP recovery curve
role: processing
from_words: true
built_from:
  - frap_recovery_fit
stated:
  page: 11
  printed_page: "11"
  quote: "fitted using with the formula y = a∗(1 – e(-t/τ)) + c"
  where: "Data analysis"
equation: "y_inf = a + c"
inputs:
  a:
    quantity: vasp_mobile_fraction
    unit: dimensionless
    description: Exponential recovery amplitude a.
  c:
    quantity: frap_baseline_offset
    unit: dimensionless
    description: Post-bleach baseline offset c.
outputs:
  y:
    quantity: frap_normalized_intensity
    unit: dimensionless
    description: Long-time asymptotic normalized fluorescence recovery plateau y(t -> oo).
settings: {}
stochastic: false
