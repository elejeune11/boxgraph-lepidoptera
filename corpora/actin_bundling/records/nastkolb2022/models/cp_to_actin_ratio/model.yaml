id: cp_to_actin_ratio
name: capping protein to actin molar ratio
role: processing
from_words: true
stated:
  page: 2
  printed_page: "2"
  quote: "the faster polymerization and slightly lower CP to actin ratio leads"
  where: text
equation: "R_CP = c_CP / c_actin"
inputs:
  c_cp:
    quantity: cp_molar_concentration
    unit: nM
    description: Molar concentration of heterodimeric capping protein (CP).
  c_actin:
    quantity: actin_molar_concentration
    unit: uM
    description: Molar concentration of G-actin monomers.
outputs:
  R_cp:
    quantity: cp_to_actin_molar_ratio
    unit: dimensionless
    description: Dimensionless CP-to-actin molar ratio in the polymerization buffer.
settings: {}
stochastic: false
