id: frap_recovery_fit
name: single-exponential FRAP fluorescence recovery fit
role: fit
stated:
  page: 11
  printed_page: "11"
  quote: "fitted using with the formula y = a∗(1 – e(-t/τ)) + c"
  where: "Data analysis"
equation: "y = a*(1 - exp(-t/tau)) + c"
inputs:
  a:
    quantity: vasp_mobile_fraction
    unit: dimensionless
    description: Exponential recovery amplitude a (equals mobile fraction when c = 0).
  tau:
    quantity: frap_recovery_time_constant
    unit: min
    description: Characteristic exponential recovery time constant tau.
  c:
    quantity: frap_baseline_offset
    unit: dimensionless
    description: Additive post-bleach baseline offset c at t = 0.
  t:
    quantity: frap_recovery_time
    unit: min
    description: Elapsed time t after photobleaching.
outputs:
  y:
    quantity: frap_normalized_intensity
    unit: dimensionless
    description: Normalized fluorescence recovery intensity y(t).
settings: {}
stochastic: false
