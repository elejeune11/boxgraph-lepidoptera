id: bilayer_actin_decoration
name: bilayer actin decoration area fraction from ilastik segmentation
role: processing
runnable: false
not_runnable_reason: >
  The paper defines bilayer decoration (Supplemental Fig. S2G) as segmented bundle area
  divided by total imaged area using ilastik machine-learning segmentation after pseudo-flat-
  field correction, but does not publish raw images, field areas, segmented areas, or the
  trained ilastik pixel classifier.
stated:
  page: 11
  printed_page: "11"
  quote: "The average ratio and SD of segmented bundle area to total area"
  where: "Data analysis"
equation: "f_dec = A_bundle / A_total"
inputs:
  A_bundle:
    quantity: segmented_bundle_area
    unit: um^2
    description: Segmented two-dimensional area occupied by actin bundles.
  A_total:
    quantity: total_field_area
    unit: um^2
    description: Total imaged bilayer area in the TIRFM field of view.
outputs:
  f_dec:
    quantity: bilayer_actin_decoration_fraction
    unit: dimensionless
    description: Area fraction of the supported lipid bilayer decorated by actin bundles.
settings: {}
stochastic: false
