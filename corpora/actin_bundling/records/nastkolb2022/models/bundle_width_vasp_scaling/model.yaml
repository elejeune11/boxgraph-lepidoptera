id: bundle_width_vasp_scaling
name: linear scaling of 2D actin bundle width with VASP concentration
role: model
from_words: true
prefactor: unknown
stated:
  page: 2
  printed_page: "2"
  quote: "proportional to the VASP concentration was observed when incu-"
  where: text
equation: "W ~ c_VASP"
inputs:
  c_vasp:
    quantity: vasp_incubation_concentration
    unit: uM
    description: Incubated VASP concentration on the supported lipid bilayer.
outputs:
  W:
    quantity: bundle_width
    unit: um
    description: Two-dimensional actin bundle width (up to an unstated proportionality constant).
settings: {}
stochastic: false
