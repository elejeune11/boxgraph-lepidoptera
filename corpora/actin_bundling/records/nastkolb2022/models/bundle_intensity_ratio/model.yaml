id: bundle_intensity_ratio
name: under-bundle to adjacent-bilayer fluorescence intensity ratio
role: processing
runnable: false
not_runnable_reason: >
  The paper defines the VASP enrichment and lipid depletion ratios (Fig. 5C) as background-
  subtracted intensity underneath bundles divided by intensity next to bundles (averaged over
  5 bundles and 10 frames per time point for lipids), but does not publish the raw numerator
  and denominator fluorescence intensities.
stated:
  page: 11
  printed_page: "11"
  quote: "sity underneath the bundles was divided by the intensity next to"
  where: "Data analysis"
equation: "R_I = I_under / I_next"
inputs:
  I_under:
    quantity: fluorescence_intensity_under_bundle
    unit: dimensionless
    description: Background-subtracted VASP or lipid fluorescence intensity underneath actin bundles.
  I_next:
    quantity: fluorescence_intensity_next_to_bundle
    unit: dimensionless
    description: Background-subtracted VASP or lipid fluorescence intensity adjacent to actin bundles.
outputs:
  R_I:
    quantity: bundle_intensity_enrichment_ratio
    unit: dimensionless
    description: Dimensionless enrichment (>1 for VASP) or exclusion (<1 for lipids) intensity ratio.
settings: {}
stochastic: false
