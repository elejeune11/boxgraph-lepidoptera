id: actin_concentration_fold_change
name: elevated-to-standard actin concentration fold change
role: processing
from_words: true
stated:
  page: 2
  printed_page: "2"
  quote: "centration of 4 µM, which is double the amount compared with the"
  where: text
equation: "R_actin = c_actin_high / c_actin_std"
inputs:
  c_actin_high:
    quantity: actin_molar_concentration
    unit: uM
    description: Elevated G-actin monomer concentration (4 uM in Supplemental Fig. S3D).
  c_actin_std:
    quantity: actin_molar_concentration
    unit: uM
    description: Standard G-actin monomer concentration (2 uM in general assay conditions).
outputs:
  R_actin:
    quantity: concentration_fold_change
    unit: dimensionless
    description: Fold change of the elevated actin concentration relative to standard conditions.
settings: {}
stochastic: false
