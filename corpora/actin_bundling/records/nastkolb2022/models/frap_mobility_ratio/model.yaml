id: frap_mobility_ratio
name: VASP mobility reduction factor from FRAP half-time ratio (ML vs SLB)
role: processing
from_words: true
stated:
  page: 6
  printed_page: "6"
  quote: "formation. The mobility of VASP was reduced by a factor of 4 com-"
  where: text
equation: "R_mob = t_1/2,ML / t_1/2,SLB"
inputs:
  t_half_ml:
    quantity: frap_recovery_half_time
    unit: min
    description: FRAP recovery half-time of membrane-bound VASP on a lipid monolayer.
  t_half_slb:
    quantity: frap_recovery_half_time
    unit: min
    description: FRAP recovery half-time of membrane-bound VASP on a supported lipid bilayer.
outputs:
  R_mob:
    quantity: vasp_mobility_reduction_factor
    unit: dimensionless
    description: Ratio of monolayer to bilayer FRAP half-times (equals D_SLB / D_ML for identical circular bleach geometry).
settings: {}
stochastic: false
