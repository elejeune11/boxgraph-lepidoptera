id: bundle_filament_intensity_extrapolation
name: bundle filament count by transverse fluorescence intensity integration
role: processing
runnable: false
not_runnable_reason: >
  The paper verifies filament stoichiometry by integrating actin fluorescence intensity over
  bundle diameters and extrapolating to 1-um bundles (yielding 45 +/- 12 filaments; p. 11),
  but prints neither the reference single-filament integrated intensity, the integrated
  intensities of sampled bundles, nor the extrapolation equation.
stated:
  page: 11
  printed_page: "11"
  quote: "grating the intensity over the diameter of filament bundles and"
  where: "Data analysis"
equation: "N_f = I_bundle / I_single"
inputs:
  I_bundle:
    quantity: integrated_bundle_intensity
    unit: dimensionless
    description: Integrated transverse fluorescence intensity of a 1-um-thick actin bundle.
  I_single:
    quantity: integrated_single_filament_intensity
    unit: dimensionless
    description: Integrated transverse fluorescence intensity of a single actin filament.
outputs:
  n_f:
    quantity: filaments_per_bundle
    unit: dimensionless
    description: Extrapolated number of F-actin filaments per 1-um-thick bundle.
settings: {}
stochastic: false
