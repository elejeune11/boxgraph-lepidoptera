id: frap_recovery_by_half_time
name: single-exponential FRAP recovery parameterized by half-time
role: fit
from_words: true
built_from:
  - frap_recovery_fit
  - frap_half_time
stated:
  page: 11
  printed_page: "11"
  quote: "fitted using with the formula y = a∗(1 – e(-t/τ)) + c and the recovery"
  where: "Data analysis"
equation: "y = a*(1 - exp(-t*ln(2)/t_1/2)) + c"
inputs:
  a:
    quantity: vasp_mobile_fraction
    unit: dimensionless
    description: Exponential recovery amplitude a (equals mobile fraction when c = 0).
  t_half:
    quantity: frap_recovery_half_time
    unit: min
    description: FRAP recovery half-time t_1/2 = tau*ln(2).
  c:
    quantity: frap_baseline_offset
    unit: dimensionless
    description: Additive post-bleach baseline offset c at t = 0.
  t:
    quantity: frap_recovery_time
    unit: min
    description: Elapsed time t after photobleaching.
outputs:
  y:
    quantity: frap_normalized_intensity
    unit: dimensionless
    description: Normalized fluorescence recovery intensity y(t).
settings: {}
stochastic: false
