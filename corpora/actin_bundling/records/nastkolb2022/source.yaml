notes: >
  Full quantitative reading of Nast-Kolb, Bleicher, Payr & Bausch (2022), Mol. Biol. Cell
  33:ar91, 1-12 (PDF pages 1-12) and its complete Supplementary Materials (PDF pages 13-18;
  Supplemental Figures S1-S4).

  In scope:
  - 2D bundle filament-count geometric spacing model N_f = W / d_spacing (p. 11) for VASP
    diameter range 28-70 nm and 1-um bundle width (reproducing the lower bound 14 at 70 nm,
    while 1000/28 = 35.71 falls 10.7% short of the printed upper bound 40) and its inverse
    effective interfilament spacing model d_spacing = W / N_f (implying 22.2 nm for the
    intensity-extrapolated count of 45 +/- 12 filaments/um).
  - Stated linear bundle-width scaling W ~ c_VASP (p. 2, prefactor: unknown), evaluated at
    the printed 0.25 uM VASP median width (0.942 um; implied prefactor 3.768 um/uM) and ready
    for multi-concentration shape validation once Fig. 2E is digitized.
  - FRAP single-exponential recovery model y = a*(1 - exp(-t/tau)) + c, half-time relation
    t_1/2 = tau*ln(2), inverse tau = t_1/2 / ln(2), half-time-parameterized recovery curve
    y = a*(1 - 2^(-t/t_1/2)) + c, long-time mobile-fraction plateau y_inf = a + c, and
    monolayer-vs-bilayer mobility reduction ratio R_mob = t_1/2,ML / t_1/2,SLB (reproducing
    the printed factor of 4 from 0.399 min / 0.102 min = 3.91).
  - Capping-protein-to-actin molar ratio R_CP = c_CP / c_actin (p. 2) across the 0.5-4 uM
    actin concentration series at 50 nM CP.
  - Non-runnable stated fits and image-processing models: log-normal bundle width histogram
    fits (Fig. 2D, S2I, S4C), intensity-integration filament count extrapolation (45 +/- 12
    filaments/um, p. 11), under-bundle/next-to-bundle intensity ratio (Fig. 5C, p. 11),
    ilastik-segmented bilayer actin decoration fraction (Fig. S2G, p. 11), FIJI Coloc 2
    Spearman rank colocalization (Fig. 4B, p. 11), and Siggia et al. (2000) FRAP bleach
    correction and normalization (Fig. 4C, p. 11).
  - All printed experimental measurements (bundle median/max widths for tetrameric VASP and
    monomeric VASP_DeltaTetra, FRAP t_1/2 and mobile fractions pre- and post-polymerization
    on SLB and ML, intensity-extrapolated filament stoichiometry, lipid relaxation claim) and
    complete biophysical assay conditions (actin/profilin/CP/VASP/mDia1/alpha-actinin1b
    concentrations, Atto488 labeling fraction, KMEI buffer composition, SLB lipid mole
    fractions including 10% DOGS-Ni-NTA, SUV extrusion pore size, TIRF NA = 1.47, FRAP
    bleach diameter 4.96 um, VASP_DeltaTetra truncation at residue 270).
  - Out of scope (routine protein expression/purification and slide-cleaning boilerplate):
    E. coli BL21 expression conditions (IPTG, induction temperatures/durations), lysis and
    affinity/SEC column buffers, storage temperatures (-20 C, -80 C, 4 C, 5 C), glass
    cleaning (NaOH, piranha, Hellmanex), and oxygen-scavenging enzyme concentrations
    (catalase, glucose oxidase, glucose, DTT).

