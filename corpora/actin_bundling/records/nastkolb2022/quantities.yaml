- id: bundle_width
  name: actin bundle width
  dimension: "[length]"
  description: Two-dimensional lateral thickness (diameter W) of an F-actin bundle on a lipid bilayer or monolayer, measured as the local diameter on the distance ridge in FIJI.

- id: bundle_width_max
  name: maximum actin bundle width
  dimension: "[length]"
  description: Maximum observed lateral thickness of an F-actin bundle formed on a supported lipid bilayer under specified protein conditions.

- id: bundle_pore_size
  name: actin network pore size
  dimension: "[length]**2"
  description: Two-dimensional area of open pores between segmented F-actin bundles in a membrane-bound bundle network.

- id: interfilament_spacing
  name: interfilament spacing in bundle
  dimension: "[length]"
  description: Center-to-center lateral spacing between adjacent F-actin filaments within a 2D VASP-mediated actin bundle, set by the VASP molecular diameter (28-70 nm) or inferred from bundle width and filament count.

- id: filaments_per_bundle
  name: number of filaments per bundle
  dimension: dimensionless
  description: Number of F-actin filaments (N_f) across the cross-section of an actin bundle of specified width (e.g. 1 um).

- id: vasp_incubation_concentration
  name: VASP incubation concentration
  dimension: "[substance]/[length]**3"
  description: Bulk solution concentration of His-tagged VASP (tetrameric VASP or monomeric VASP_DeltaTetra) incubated on the lipid bilayer/monolayer or solid support prior to washing out unbound protein (or present in bulk solution control).

- id: actin_molar_concentration
  name: actin molar concentration
  dimension: "[substance]/[length]**3"
  description: Final molar concentration of G-actin monomers in the polymerization assay buffer (or exchange solution).

- id: actin_labeled_fraction
  name: fluorescently labeled actin fraction
  dimension: dimensionless
  description: Fraction (or percentage) of total G-actin monomers fluorescently labeled with Atto488 NHS-ester.

- id: profilin_molar_concentration
  name: profilin molar concentration
  dimension: "[substance]/[length]**3"
  description: Molar concentration of mouse profilin 2a in the actin polymerization assay mix.

- id: cp_molar_concentration
  name: capping protein molar concentration
  dimension: "[substance]/[length]**3"
  description: Molar concentration of heterodimeric barbed-end capping protein (CP) in the actin polymerization assay mix.

- id: cp_to_actin_molar_ratio
  name: CP-to-actin molar ratio
  dimension: dimensionless
  description: Dimensionless molar ratio R_CP = c_CP / c_actin between barbed-end capping protein and G-actin monomers in the polymerization mix.

- id: alpha_actinin_incubation_concentration
  name: alpha-actinin1b incubation concentration
  dimension: "[substance]/[length]**3"
  description: Bulk concentration of His-tagged Ca2+-independent human alpha-actinin1b incubated on the supported lipid bilayer.

- id: mdia1_incubation_concentration
  name: mDia1 incubation concentration
  dimension: "[substance]/[length]**3"
  description: Bulk concentration of His-tagged murine formin mDia1 incubated on the supported lipid bilayer.

- id: kcl_molar_concentration
  name: KCl molar concentration
  dimension: "[substance]/[length]**3"
  description: Potassium chloride concentration in KMEI polymerization buffer.

- id: mgcl2_molar_concentration
  name: MgCl2 molar concentration
  dimension: "[substance]/[length]**3"
  description: Magnesium chloride concentration in KMEI polymerization buffer.

- id: atp_molar_concentration
  name: ATP molar concentration
  dimension: "[substance]/[length]**3"
  description: Adenosine triphosphate concentration in the polymerization mix.

- id: buffer_ph
  name: buffer pH
  dimension: dimensionless
  description: Negative base-10 logarithm of hydrogen ion activity (pH) of KMEI polymerization buffer.

- id: lipid_mole_fraction
  name: lipid component mole fraction
  dimension: dimensionless
  description: Molar percentage (or fraction) of a lipid species (egg-PC, DOGS-Ni-NTA, DOPE-PEG2000, or DHPE-Texas Red / DSPE-Cy5) in the bilayer/monolayer lipid mixture.

- id: suv_extrusion_pore_diameter
  name: SUV extrusion membrane pore diameter
  dimension: "[length]"
  description: Nominal pore size of the polycarbonate membrane used to extrude small unilamellar vesicles (SUVs) for supported lipid bilayer formation.

- id: flow_chamber_volume
  name: flow chamber volume
  dimension: "[length]**3"
  description: Internal liquid volume of the parafilm flow channel housing the supported lipid bilayer.

- id: frap_bleach_diameter
  name: FRAP bleached circle diameter
  dimension: "[length]"
  description: Diameter of the circular region photobleached at 100% laser power during VASP FRAP experiments.

- id: objective_numerical_aperture
  name: microscope objective numerical aperture
  dimension: dimensionless
  description: Numerical aperture (NA) of the 100x oil-immersion TIRF objective.

- id: frap_recovery_time
  name: FRAP recovery time
  dimension: "[time]"
  description: Elapsed time t after photobleaching in a FRAP recovery curve.

- id: frap_recovery_time_constant
  name: FRAP exponential recovery time constant
  dimension: "[time]"
  description: Characteristic exponential recovery time constant tau in the FRAP fit y = a*(1 - exp(-t/tau)) + c.

- id: frap_recovery_half_time
  name: FRAP recovery half-time
  dimension: "[time]"
  description: Time t_1/2 = tau * ln(2) required for fluorescence recovery to reach half of its exponential recovery amplitude after photobleaching.

- id: vasp_mobile_fraction
  name: VASP mobile fraction
  dimension: dimensionless
  description: Mobile fraction of fluorescently labeled VASP on a lipid bilayer or monolayer measured by FRAP (corresponding to the recovery amplitude a when baseline offset c = 0).

- id: frap_baseline_offset
  name: FRAP post-bleach baseline offset
  dimension: dimensionless
  description: Additive offset constant c in the single-exponential FRAP recovery fit y = a*(1 - exp(-t/tau)) + c (expected near 0 after Siggia et al. 2000 first-bleach-frame normalization).

- id: frap_normalized_intensity
  name: normalized FRAP fluorescence intensity
  dimension: dimensionless
  description: Bleach-corrected fluorescence intensity y(t) normalized to prebleach intensity (1) and first post-bleach frame (0).

- id: vasp_mobility_reduction_factor
  name: VASP mobility reduction factor (SLB vs ML)
  dimension: dimensionless
  description: Factor by which lateral VASP mobility is reduced on a lipid monolayer relative to a supported lipid bilayer, evaluated from the FRAP recovery half-time ratio t_1/2,ML / t_1/2,SLB.

- id: assay_elapsed_time
  name: polymerization assay elapsed time
  dimension: "[time]"
  description: Time elapsed since initiation of actin polymerization (flow-in of actin polymerization mix).

- id: bundle_intensity_enrichment_ratio
  name: bundle-to-background fluorescence intensity ratio
  dimension: dimensionless
  description: Ratio of background-subtracted VASP or lipid fluorescence intensity underneath actin bundles to intensity next to actin bundles (I_under / I_next).

- id: lipid_intensity_relaxation_fraction
  name: lipid intensity relaxation ratio
  dimension: dimensionless
  description: Relative lipid fluorescence level (or displacement relaxation fraction; see open question) underneath actin bundles after 60 min of polymerization compared with initial state.

- id: bundle_width_fraction
  name: fraction of bundles in width bin
  dimension: dimensionless
  description: Normalized histogram fraction of segmented actin bundles falling within a bundle width bin.

- id: integrated_bundle_intensity
  name: integrated transverse bundle fluorescence intensity
  dimension: dimensionless
  description: Background-subtracted actin fluorescence intensity integrated across the diameter of an actin bundle (in arbitrary fluorescence units).

- id: integrated_single_filament_intensity
  name: integrated transverse single-filament fluorescence intensity
  dimension: dimensionless
  description: Reference background-subtracted actin fluorescence intensity integrated across the diameter of a single F-actin filament (in arbitrary fluorescence units).

- id: fluorescence_intensity_under_bundle
  name: fluorescence intensity underneath actin bundles
  dimension: dimensionless
  description: Background-subtracted VASP or lipid fluorescence intensity measured underneath segmented actin bundles (arbitrary units).

- id: fluorescence_intensity_next_to_bundle
  name: fluorescence intensity next to actin bundles
  dimension: dimensionless
  description: Background-subtracted VASP or lipid fluorescence intensity measured in bundle-free regions adjacent to actin bundles (arbitrary units).

- id: segmented_bundle_area
  name: segmented actin bundle area
  dimension: "[length]**2"
  description: Total two-dimensional area classified as actin bundles by ilastik segmentation within a microscopy field of view.

- id: total_field_area
  name: total microscopy field area
  dimension: "[length]**2"
  description: Total two-dimensional area of the analyzed TIRFM field of view.

- id: bilayer_actin_decoration_fraction
  name: bilayer actin decoration fraction
  dimension: dimensionless
  description: Ratio of segmented actin bundle area to total bilayer area (A_bundle / A_total).

- id: fluorescence_intensity_vasp
  name: pixel-wise VASP fluorescence intensity
  dimension: dimensionless
  description: Pseudo-flat-field-corrected 10-frame average VASP-Alexa532 fluorescence intensity for pixel-wise colocalization analysis.

- id: fluorescence_intensity_actin
  name: pixel-wise actin fluorescence intensity
  dimension: dimensionless
  description: Pseudo-flat-field-corrected 10-frame average Actin-Atto488 fluorescence intensity for pixel-wise colocalization analysis.

- id: spearman_colocalization_score
  name: Spearman rank colocalization coefficient
  dimension: dimensionless
  description: Pixel-wise Spearman's rank correlation coefficient between VASP and actin channels computed with FIJI Coloc 2.

- id: frap_raw_roi_intensity
  name: raw FRAP bleached-ROI fluorescence intensity
  dimension: dimensionless
  description: Unnormalized fluorescence intensity measured inside the bleached circular ROI during a FRAP time series.

- id: frap_raw_reference_intensity
  name: raw FRAP unbleached-reference fluorescence intensity
  dimension: dimensionless
  description: Unnormalized fluorescence intensity measured in an unbleached reference region used to compute the photobleaching correction factor.

- id: sample_count
  name: measurement sample size
  dimension: dimensionless
  description: Number of bundles, frames, or independent replicate experiments averaged in a quantitative analysis.

- id: substrate_type
  name: membrane or support substrate type
  dimension: dimensionless
  description: Categorical experimental condition specifying the VASP anchoring geometry (SLB = supported lipid bilayer, ML = lipid monolayer, Ni-agarose beads = solid support, bulk = free solution).

- id: vasp_oligomeric_state
  name: VASP oligomeric state
  dimension: dimensionless
  description: Categorical experimental condition specifying full-length homotetrameric VASP (tetramer) versus C-terminally truncated monomeric VASP_DeltaTetra (monomer, stop codon at residue 270).

- id: polymerization_state
  name: actin polymerization state during FRAP
  dimension: dimensionless
  description: Categorical condition indicating whether FRAP was performed prior to actin addition (prePol) or 30 min after initiating actin polymerization (30 min Pol).

- id: actin_label_dye
  name: actin fluorescent label identity
  dimension: dimensionless
  description: Categorical condition naming the fluorophore conjugated to actin monomers (Atto488 or Atto647N).

- id: vasp_label_dye
  name: VASP fluorescent label identity
  dimension: dimensionless
  description: Categorical condition naming whether VASP was unlabeled or maleimide-labeled with Alexa532.

- id: lipid_label_dye
  name: fluorescent lipid tracer identity
  dimension: dimensionless
  description: Categorical condition naming the trace fluorescent lipid (0.05% DHPE-Texas Red or 0.05% DSPE-Cy5).

- id: ni_nta_presence
  name: Ni-NTA lipid presence
  dimension: dimensionless
  description: Categorical condition indicating whether 10% DOGS-Ni-NTA anchoring lipid was included in the lipid mix (present or absent).

- id: actin_polymerization_mode
  name: actin polymerization mode
  dimension: dimensionless
  description: Categorical condition indicating active polymerization from G-actin monomers (polymerizing) versus addition of prepolymerized F-actin filaments (prepolymerized).

- id: concentration_fold_change
  name: actin concentration fold change
  dimension: dimensionless
  description: Ratio of an elevated actin concentration (4 uM) to the standard assay actin concentration (2 uM).

- id: cross_section_distance
  name: transverse bundle cross-section distance
  dimension: "[length]"
  description: Spatial distance along a linear cross-section drawn across one or more F-actin bundles in a TIRFM image (Fig. 2C, Fig. 5B).

- id: bundle_profile_actin_intensity
  name: transverse bundle actin fluorescence intensity
  dimension: dimensionless
  description: Background-subtracted TIRF actin-Atto488 fluorescence intensity (in arbitrary units) measured along a line cross-section of swelling bundles (Fig. 2C).

- id: tirf_actin_intensity_normalized
  name: normalized whole-field TIRF actin intensity
  dimension: dimensionless
  description: Normalized TIRF actin fluorescence intensity versus time comparing polymerization kinetics across different elongators and cross-linkers (Fig. 3E).

- id: bundle_actin_intensity_normalized
  name: normalized actin intensity in bundles
  dimension: dimensionless
  description: Normalized actin fluorescence intensity measured specifically underneath/within actin bundles (mean +/- SD of n = 5 bundles) over time (Fig. 5C).

- id: tirf_actin_intensity_raw
  name: raw TIRF actin fluorescence intensity
  dimension: dimensionless
  description: Background-subtracted raw TIRF actin fluorescence intensity (in arbitrary units) over polymerization time across VASP (Fig. S2F) or actin (Fig. S3E) titration series.

- id: cross_section_lipid_fluorescence_norm
  name: normalized lipid fluorescence along bundle cross-section
  dimension: dimensionless
  description: Normalized Texas Red-DHPE lipid fluorescence intensity along a single line cross-section across actin bundles on a supported lipid bilayer (Fig. 5B).

- id: cross_section_actin_fluorescence_norm
  name: normalized actin fluorescence along bundle cross-section
  dimension: dimensionless
  description: Normalized actin-Atto488 fluorescence intensity along a single line cross-section across actin bundles on a supported lipid bilayer (Fig. 5B).

- id: bilayer_vasp_fluorescence_raw
  name: bilayer VASP fluorescence intensity
  dimension: dimensionless
  description: Raw fluorescence intensity (in arbitrary units) of Alexa532-labeled VASP bound to a supported lipid bilayer after washing as a function of VASP incubation concentration (Fig. S2H).

- id: vasp_cluster_area_fraction
  name: area fraction of pre-actin VASP clusters
  dimension: dimensionless
  description: Average fraction of supported lipid bilayer area occupied by the VASP-enriched phase (clusters) prior to actin addition (Fig. S4H).

- id: elongator_condition_index
  name: elongator and cross-linker condition index
  dimension: dimensionless
  description: Categorical x-axis index for the five protein conditions in Fig. 3F (1 = VASP, 2 = VASP_DeltaTetra, 3 = alpha-actinin1b, 4 = mDia1, 5 = mDia1 + alpha-actinin1b).

- id: cp_substrate_condition_index
  name: capping protein and substrate condition index
  dimension: dimensionless
  description: Categorical x-axis index for the three 0.25 uM VASP conditions in Fig. S4F (1 = VASP +CP on SLB, 2 = VASP noCP on SLB, 3 = VASP noCP on ML).

