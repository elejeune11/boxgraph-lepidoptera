id: actin_density
name: actin density on Ld-accessible membrane area (p. 3)
role: processing
stated:
  page: 3
  printed_page: "26572"
  quote: "divide it by the available area: ρ = Iactin/Aactin"
  where: text
equation: "A_actin = A_total - A_Lo; rho = I_actin / A_actin"
inputs:
  A_total:
    quantity: domain_area
    unit: um^2
  A_Lo:
    quantity: domain_area
    unit: um^2
  I_actin:
    quantity: fluorescence_intensity
    unit: dimensionless
outputs:
  A_actin:
    quantity: domain_area
    unit: um^2
  rho:
    quantity: actin_surface_density
    unit: 1/um^2
settings: {}
stochastic: false
