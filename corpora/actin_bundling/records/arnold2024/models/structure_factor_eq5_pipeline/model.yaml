id: structure_factor_eq5_pipeline
name: 2D FFT static structure factor S(n) = |FFT(n)| and mean wave vector <k> (p. 4, Eq. 5)
role: processing
stated:
  page: 6
  printed_page: "26575"
  quote: "We define the mean wave vector ⟨k⟩ of actin"
  where: "p. 4 & Eq. 5 (p. 6)"
equation: "S(n) = |FFT(n)|; k = 2*pi*n/L (discard n=0 and 2*pi/k < 5 px); <k> = int k S(k) dk / int S(k) dk; wavelength = 2*pi/<k>"
inputs:
  L:
    quantity: image_width
    unit: um
  n0:
    quantity: fourier_mode_index
    unit: dimensionless
outputs:
  k_mean:
    quantity: wave_vector
    unit: 1/um
  wavelength:
    quantity: structure_factor_wavelength
    unit: um
settings:
  N: 64
  min_wavelength_px: 5
stochastic: false
