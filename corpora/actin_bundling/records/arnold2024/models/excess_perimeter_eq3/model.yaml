id: excess_perimeter_eq3
name: lipid domain excess perimeter and interfacial free energy (Eq. 3)
role: model
stated:
  page: 4
  printed_page: "26573"
  quote: "difference between the domain perimeter and the minimum"
  where: "Eq. 3"
equation: "L_0 = 2*sqrt(pi*A); L_ex = (L - L_0)/L_0 = L/(2*sqrt(pi*A)) - 1; Delta_F = lambda*(L - L_0)"
inputs:
  L:
    quantity: domain_perimeter
    unit: um
  A:
    quantity: domain_area
    unit: um^2
  lam:
    quantity: lipid_line_tension
    unit: pN
outputs:
  L0:
    quantity: domain_perimeter
    unit: um
  L_ex:
    quantity: excess_perimeter
    unit: dimensionless
  dF:
    quantity: interfacial_free_energy_change
    unit: pN*um
settings: {}
stochastic: false
