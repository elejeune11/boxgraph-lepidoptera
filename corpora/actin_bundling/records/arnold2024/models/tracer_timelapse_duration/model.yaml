id: tracer_timelapse_duration
name: tracer tracking time-lapse duration from frame count and interval (p. 3)
role: processing
from_words: true
stated:
  page: 3
  printed_page: "26572"
  quote: "images, 0.2 s between images) of the tracer"
  where: text
equation: "T_span = (N_frames - 1) * dt; T_total = N_frames * dt"
inputs:
  N_frames:
    quantity: frame_count
    unit: dimensionless
  dt:
    quantity: frame_interval
    unit: s
outputs:
  T_span:
    quantity: elapsed_time
    unit: s
  T_total:
    quantity: elapsed_time
    unit: s
settings: {}
stochastic: false
