id: ddm_image_structure_function_eq1_fourier_sq
name: DDM image structure function D(k, t) with squared Fourier transform (corrected variant of Eq. 1)
role: processing
stated:
  page: 13
  printed_page: "SI-4"
  quote: "The image structure function of actin D(k, t), defined in Eq. 1"
  where: "Eq. 1 & Fig. S3 y-axis"
equation: "D(k, t) = |FFT[I(x, t) - I(x, 0)]|^2 (radially averaged over 2D FFT)"
variant_of: ddm_image_structure_function_eq1
corrections:
  - equation: "Eq. 1 (p. 4)"
    change: "D(k, t) = |FFT[I(x, t) - I(x, 0)]|^2 instead of printed FFT[|I(x, t) - I(x, 0)|^2]"
    evidence: "SI Fig. S3 (p. 13) y-axis explicitly labels D(k, t) as <|Delta I_hat(k, t)^2|> (squaring in Fourier space, with strictly positive real values up to 2.5e10), and Refs. 32-33 define DDM as |FFT[Delta I]|^2; printed Eq. (1) yields zero power at the true spatial mode k0 and complex/negative values at 2*k0."
inputs:
  n0:
    quantity: fourier_mode_index
    unit: dimensionless
  dphi:
    quantity: phase_shift
    unit: rad
outputs:
  D_k0_real:
    quantity: image_structure_function
    unit: dimensionless
  D_k0_ratio:
    quantity: boolean_indicator
    unit: dimensionless
  D_2k0_real:
    quantity: image_structure_function
    unit: dimensionless
settings:
  N: 64
stochastic: false
