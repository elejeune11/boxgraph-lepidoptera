id: actin_buckling_force_euler
name: actin filament Euler buckling force (pi^2 variant of p. 5 inline)
role: model
stated:
  page: 5
  printed_page: "26574"
  quote: "of length L = 1 μm is Fb = π EI/L2 = 1 pN"
  where: text
equation: "F_b = pi^2 * EI / L^2"
variant_of: actin_buckling_force
corrections:
  - equation: "p. 5 (26574) inline buckling force"
    change: "F_b = pi^2 * EI / L^2 (standard pinned-pinned Euler critical buckling load) instead of printed F_b = pi * EI / L^2"
    evidence: "Standard Euler buckling load for an elastic rod of flexural rigidity EI and length L carries pi^2 (pinned-pinned: pi^2*EI/L^2; fixed-free cantilever: pi^2*EI/(4*L^2); fixed-fixed: 4*pi^2*EI/L^2), never pi^1; the exponent 2 on pi is omitted in the printed text."
inputs:
  EI:
    quantity: actin_flexural_rigidity
    unit: N*m^2
  L:
    quantity: actin_filament_length
    unit: um
outputs:
  F_b:
    quantity: actin_buckling_force
    unit: pN
settings: {}
stochastic: false
