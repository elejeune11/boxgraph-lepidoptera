  alternatives: ["49.0", "98.0"]
  stands_for: "A_Lo in p. 3 Actin Density definition"

- id: actin_density_I_added
  quantity: fluorescence_intensity
  unit: dimensionless
  printed: "1000.0"
  basis: "Arbitrary fluorescence intensity value (the paper does not report unnormalized camera counts I_actin, only normalized rho/rho_0 in Fig. 2C)."
  alternatives: ["500.0", "2000.0"]
  stands_for: "I_actin in p. 3 Actin Density definition"

- id: tracer_msd_bench_added
  quantity: tracer_msd
  unit: um^2
  printed: "2.0 x 10^-3"
  basis: "Representative 2D mean squared displacement scale (~2 x 10^-3 um^2, matching the 1-4 x 10^-3 um^2 scale of Fig. 4C) to evaluate the printed tracer variance formula <|Delta x|^2> - <|Delta x|>^2."
  alternatives: ["1.0 x 10^-3", "4.0 x 10^-3"]
  stands_for: "<|Delta x|^2> in Fig. 4C / p. 7 variance expression"

- id: tracer_mean_abs_disp_bench_added
  quantity: tracer_displacement
  unit: um
  printed: "0.03963327"
  basis: "Exact isotropic 2D zero-mean Gaussian expectation <|Delta x|> = sqrt(pi * <|Delta x|^2> / 4) for <|Delta x|^2> = 2 x 10^-3 um^2, quantifying the factor (1 - pi/4) = 0.2146 reduction in the printed scalar radial variance vs. vector variance."
  alternatives: ["0.0", "0.02802496"]
  stands_for: "<|Delta x|> in Fig. 4C / p. 7 variance expression"

- id: passive_coarsening_t_bench_added
  quantity: elapsed_time
  unit: s
  printed: "1500"
  basis: "Representative coarsening time matching the ~1500 s crossover noted in Fig. 3C and p. 7 for evaluating the prefactor-unknown scaling law a ~ t^(1/3)."
  alternatives: ["500", "4000"]
  stands_for: "t in passive coarsening scaling a ~ t^(1/3) (p. 7)"

- id: ddm_k0_ratio_expected_added
  quantity: boolean_indicator
  unit: dimensionless
  printed: "1.0"
  basis: "Exact normalized mode-power ratio D(k0)/|FFT[Delta I]|^2(k0) = 1.0 expected for any valid DDM image structure function at the signal wave vector k0 (matching SI Fig. S3 <|Delta I_hat(k, t)^2|> and Refs. 32-33)."
  alternatives: ["1.00"]
  stands_for: "expected normalized DDM signal ratio at mode k0"
