- id: lipid_composition_target_100
  quantity: lipid_mole_fraction
  unit: percent
  printed: "100"
  basis: "Mole/composition percentages of a complete lipid mixture sum to 100% by conservation."
  alternatives: ["100.0"]
  stands_for: "total percentage of GUV lipid mixture (p. 2 Methods and p. 4 Results)"

- id: guv_fitc_pct_results_zero
  quantity: lipid_mole_fraction
  unit: percent
  printed: "0"
  basis: "Results p. 4 prints 'trace' for DSPE-PEG2k-FITC alongside 46% DOPC, 35% DPPC, 15% cholesterol, 4% DOTAP; 0% tests whether the four stated percentages already sum to 100%."
  alternatives: ["0.3"]
  stands_for: "'trace' DSPE-PEG2k-FITC in Results (p. 4)"

- id: actin_bundle_width_low_added
  quantity: actin_bundle_width
  unit: um
  printed: "1"
  basis: "Lower bound of the printed estimate '~1-2 um actin bundles' (p. 5) used to verify the lower bound of '≈50-100 filaments thick'."
  alternatives: ["1.5", "2"]
  stands_for: "lower bound of ~1-2 um bundle width (p. 5)"

- id: actin_bundle_width_high_added
  quantity: actin_bundle_width
  unit: um
  printed: "2"
  basis: "Upper bound of the printed estimate '~1-2 um actin bundles' (p. 5) used to verify the upper bound of '≈50-100 filaments thick'."
  alternatives: ["1", "1.5"]
  stands_for: "upper bound of ~1-2 um bundle width (p. 5)"

- id: sf_diag_mode_sqrt2_added
  quantity: fourier_mode_index
  unit: dimensionless
  printed: "1.41421356"
  basis: "Numerical value of sqrt(2) from the paper's explicit radial binning example S(n = sqrt(2)) rounded to n = 1 (p. 4)."
  alternatives: ["1.414"]
  stands_for: "n = sqrt(2) in p. 4 radial binning example"

- id: image_width_fig_s3_fundamental_added
  quantity: image_width
  unit: um
  printed: "6.9813"
  basis: "If Fig. S3 wave vectors k = 0.9, 1.8, 2.7, 3.6 um^-1 correspond to Fourier modes n = 1, 2, 3, 4 via k = 2*pi*n/L (p. 4), then L = 2*pi/0.9 um^-1 = 6.9813 um. The paper does not state the cropped square image width L used for FFT analysis."
  alternatives: ["13.9626", "20.9440", "14.0"]
  stands_for: "square image width L in k = 2*pi*n/L (p. 4, Fig. S3)"

- id: domain_radius_bench_added
  quantity: domain_radius
  unit: um
  printed: "1.0"
  basis: "Representative micron-scale Lo domain radius (p. 5 states Lo domains are ~O(um) in size) for verifying Eq. (3), Eq. (4), and the smoothing-spline curvature pipeline."
  alternatives: ["0.5", "2.0"]
  stands_for: "characteristic micron-scale Lo domain radius R"

- id: domain_area_circle_r1_added
  quantity: domain_area
  unit: um^2
  printed: "3.14159265"
  basis: "Area A = pi * R^2 of a circular domain with R = 1.0 um for verifying Eq. (3) circular limit L_ex = 0."
  alternatives: ["0.785398", "12.56637"]
  stands_for: "circular domain area A in Eq. (3)"

- id: domain_perimeter_circle_r1_added
  quantity: domain_perimeter
  unit: um
  printed: "6.28318531"
  basis: "Perimeter L = 2 * pi * R of a circular domain with R = 1.0 um for verifying Eq. (3) circular limit L_ex = 0."
  alternatives: ["3.141593", "12.56637"]
  stands_for: "circular domain perimeter L in Eq. (3)"

- id: domain_perimeter_eq_triangle_r1_added
  quantity: domain_perimeter
  unit: um
  printed: "8.08106888"
  basis: "Exact Euclidean perimeter L = 3 * sqrt(4 * A / sqrt(3)) of an equilateral triangle with area A = pi um^2 (R_eq = 1 um), illustrating the analytic triangular limit L_ex = sqrt(3*sqrt(3)/pi) - 1 = 0.2861 in Eq. (3)."
  alternatives: ["7.089815"]
  stands_for: "equilateral triangle perimeter of equivalent area A = pi um^2"

- id: domain_aspect_ratio_circle_added
  quantity: domain_aspect_ratio
  unit: dimensionless
  printed: "1.0"
  basis: "Unit aspect ratio representing an undeformed circular Lo domain at low actin density (Fig. 2D panels 1-2)."
  alternatives: ["1.5", "2.0"]
  stands_for: "aspect ratio of circular domain in Fig. 2D curvature test"

- id: domain_aspect_ratio_deformed_added
  quantity: domain_aspect_ratio
  unit: dimensionless
  printed: "2.0"
  basis: "Representative 2:1 anisotropic deformation ratio for testing spatial curvature heterogeneity in the p. 3 smoothing-spline curvature pipeline."
  alternatives: ["1.5", "3.0"]
  stands_for: "anisotropic domain aspect ratio in curvature pipeline test"

- id: p_lo_bench_added
  quantity: surface_pressure
  unit: pN/um
  printed: "10.0"
  basis: "Representative 2D Lo internal surface pressure scale (O(lambda/R) with lambda = 1-10 pN, R ~ 1 um) for testing Eq. (4) modified Laplace-Young balance; the paper does not report absolute surface pressures."
  alternatives: ["5.0", "20.0"]
  stands_for: "P_Lo in Eq. (4) (p. 5)"

- id: p_ld_bench_added
  quantity: surface_pressure
  unit: pN/um
  printed: "5.0"
  basis: "Representative 2D Ld background surface pressure scale chosen so P_Lo - P_Ld > 0 for testing Eq. (4)."
  alternatives: ["2.0", "8.0"]
  stands_for: "P_Ld in Eq. (4) (p. 5)"

- id: sigma_el_zero_added
  quantity: elastic_stress_2d
  unit: pN/um
  printed: "0.0"
  basis: "Zero actin compressive stress limit (low actin density, Fig. 2D panel 1) reducing Eq. (4) to standard 2D Laplace-Young balance."
  alternatives: ["1.0", "3.0"]
  stands_for: "sigma_el in Eq. (4) at low actin density"

- id: sigma_el_compressed_added
  quantity: elastic_stress_2d
  unit: pN/um
  printed: "3.0"
  basis: "Positive compressive actin elastic stress (sigma_el < P_Lo - P_Ld) flattening local boundary curvature along an actin bundle in Eq. (4)."
  alternatives: ["1.0", "4.5"]
  stands_for: "sigma_el in Eq. (4) along an actin bundle"

- id: ddm_D0_bench_added
  quantity: image_structure_function
  unit: dimensionless
  printed: "1.0 x 10^8"
  basis: "Representative camera-noise baseline B(k) = D(k, t=0) (~10^8, well below Fig. S3 plateau ~10^9-10^10) to verify Eq. (2) asymptotic normalization."
  alternatives: ["0.0", "5.0 x 10^8"]
  stands_for: "D(k, t=0) = B(k) in Eq. (2) (p. 4)"

- id: ddm_Dinf_bench_added
  quantity: image_structure_function
  unit: dimensionless
  printed: "1.0 x 10^10"
  basis: "Representative long-time plateau D(k, t->inf) = A(k) + B(k) (order 10^10, matching Fig. S3 2-phase scale) to verify Eq. (2) asymptotic normalization."
  alternatives: ["1.0 x 10^9", "2.5 x 10^10"]
  stands_for: "D(k, t->inf) = A(k) + B(k) in Eq. (2) (p. 4)"

- id: ddm_Dmid_bench_added
  quantity: image_structure_function
  unit: dimensionless
  printed: "5.05 x 10^9"
  basis: "Midpoint (D_0 + D_inf)/2 = 5.05 x 10^9 verifying the half-life condition F(k, tau) = 0.5 in Eq. (2)."
  alternatives: ["5.0 x 10^9"]
  stands_for: "D(k, tau) at half-life F(k, tau) = 0.5 in Eq. (2)"

- id: ddm_phase_shift_test_added
  quantity: phase_shift
  unit: rad
  printed: "1.57079633"
  basis: "Quarter-wavelength phase shift (pi/2 rad) of a single-mode cosine test field used to verify printed Eq. (1) FFT[|Delta I|^2] vs. corrected DDM |FFT[Delta I]|^2."
  alternatives: ["0.78539816", "3.14159265"]
  stands_for: "test pattern displacement phase shift in Eq. (1) audit"

- id: ddm_test_mode_index_added
  quantity: fourier_mode_index
  unit: dimensionless
  printed: "4"
  basis: "Discrete spatial mode n_0 = 4 (well below N/5 high-k cutoff) in the deterministic 2D periodic pattern verifying Eq. (1) and Eq. (5) FFT pipelines."
  alternatives: ["2", "6"]
  stands_for: "probe Fourier mode n_0 in 2D FFT pipelines"

- id: sf_test_image_width_added
  quantity: image_width
  unit: um
  printed: "14.0"
  basis: "Representative square micrograph width L ~ 14 um (estimated from Fig. 3A 2.5 um scale bar and matching k = 0.9 um^-1 at n = 2) for testing the Eq. (5) structure-factor pipeline."
  alternatives: ["6.9813", "20.9440"]
  stands_for: "square image width L in Eq. (5) structure-factor pipeline"

- id: actin_density_Atotal_added
  quantity: domain_area
  unit: um^2
  printed: "196.0"
  basis: "Representative square image area (14 um)^2 = 196 um^2 for testing p. 3 actin density processing A_actin = A_total - A_Lo, rho = I_actin / A_actin."
