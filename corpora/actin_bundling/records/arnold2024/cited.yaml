#    than a standalone scalar datum for their ratio 2. Per BoxGraph rules (data.yaml is never
#    edited during relate, and values not recorded as a datum in the cited record stay unlinked),
#    active_coarsening_acceleration_ref7 remains unlinked here (see also
#    arnold2024/q_arnold2023_structure_factor_and_coarsening_audit regarding arnold2024 p. 1's
#    omission of "in the growth exponent").
