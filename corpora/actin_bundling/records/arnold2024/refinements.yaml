- id: ref_curvature_circle_n_edge
  run: run_curvature_circle
  setting: n_edge_pixels
  factors: [1, 2, 4]
  mode: multiply
  output: kappa_mean
  tolerance: "0.5%"
  tolerance_basis: "added: verifies spline + central finite-difference convergence of circular boundary curvature kappa = 1/R"
  tolerance_added: true

- id: ref_curvature_deformed_n_edge
  run: run_curvature_deformed
  setting: n_edge_pixels
  factors: [1, 2, 4]
  mode: multiply
  output: kappa_norm_min
  tolerance: "0.5%"
  tolerance_basis: "added: verifies spline + central finite-difference convergence of normalized minimum curvature ratio on a 2:1 deformed ellipse"
  tolerance_added: true

- id: ref_sf_eq5_grid_N
  run: run_sf_eq5_pipeline_bench
  setting: N
  factors: [1, 2, 4]
  mode: multiply
  output: wavelength
  tolerance: "0.1%"
  tolerance_basis: "added: verifies grid-resolution invariance of the 2D FFT + radial-binning Eq. (5) mean wavelength pipeline"
  tolerance_added: true

- id: ref_ddm_eq1_corr_grid_N
  run: run_ddm_eq1_corrected
  setting: N
  factors: [1, 2, 4]
  mode: multiply
  output: D_k0_ratio
  tolerance: "0.1%"
  tolerance_basis: "added: verifies grid-resolution invariance of corrected DDM normalized mode power ratio D(k0)/D_expected = 1"
  tolerance_added: true
