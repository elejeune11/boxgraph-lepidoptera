- id: q_tracer_variance_formula_scalar_vs_vector
  kind: reading
  about: [tracer_position_variance, run_tracer_variance_bench]
  citation:
    page: 6
    printed_page: "26575"
    quote: "variance in tracer positions ⟨|Δx|2⟩ − ⟨|Δx|⟩2 is tracked"
    where: "Fig. 4C caption & p. 7"
  text: >
    Fig. 4C and p. 7 print the tracer position variance as <|Delta x|^2> - <|Delta x|>^2 (taking the
    norm inside the average before squaring), which is the variance of the scalar radial displacement
    r = |Delta x| rather than the standard 2D vector positional variance <|Delta x|^2> - |<Delta x>|^2.
    For a zero-mean isotropic 2D Gaussian displacement with MSD = <|Delta x|^2>, the printed scalar
    formula equals (1 - pi/4) * MSD = 0.2146 * MSD (nearly 4.7x smaller than the vector variance MSD).
    Furthermore, Delta x itself is never defined (displacement from t=0, from trajectory mean, or
    frame-to-frame step).

- id: q_structure_factor_unsquared_fft
  kind: choice
  about: [structure_factor_eq5_pipeline, run_sf_eq5_pipeline_bench]
  citation:
    page: 4
    printed_page: "26573"
    quote: "Fourier coefficients to be S(n) = |FFT(n)| where n = 0"
    where: text
  text: >
    Page 4 explicitly defines the static structure factor as the unsquared modulus S(n) = |FFT(n)|
    rather than the standard power spectrum S(n) = |FFT(n)|^2. Compared to |FFT|^2, using |FFT| gives
    much greater weight to high-k tails up to the 5-pixel wavelength cutoff, which shifts <k> upward
    and compresses the inferred wavelength a, xi = 2*pi/<k> (contributing to Fig. 3C showing only a
    ~2.65 to 3.8 um change despite a larger visual domain coarsening in Fig. 3A).

- id: q_ddm_1phase_no_plateau_fig_s3
  kind: numerics
  about: [ddm_isf_eq2, tau_Ld_measured, relaxation_speedup_fig3a]
  citation:
    page: 13
    printed_page: "SI-4"
    quote: "image structure function of actin D(k, t), defined in Eq. 1"
    where: "Fig. S3 right panel & p. 4"
  text: >
    Page 4 determines D(k, t -> inf) = A(k) + B(k) by 'averaging the first and last few data points that
    qualitatively display asymptotic behavior'. However, SI Fig. S3 (right panel, p. 13) shows that for
    the 1-phase Ld bilayer, D(k, t) is still rising steeply up to the end of the recording (~6000-7000 s)
    with no visible plateau, and in Fig. 3B (p. 5) F(<k>, t) for the Ld-only curve drops below zero
    (down to ~-0.15) at late times. Thus tau_Ld ≈ 4100 s and the speedup ratio 2.6x depend sensitively
    on how the unreached long-time asymptote D(k, t -> inf) was truncated. Additionally, for a single
    non-ergodic trajectory starting at t = 0, D(k, 0) = 0 identically (so B(k) is actually estimated
    from small positive lag times rather than literally t = 0).

