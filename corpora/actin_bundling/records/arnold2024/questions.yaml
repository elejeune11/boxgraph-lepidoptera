    quote: "using the mean wave vector of the static structure factor"
    where: "Methods p. 4, Eq. 5 (p. 6), Results p. 7, & Intro p. 1 (ref-7) vs arnold2023 SI Sec. IV.A Eq. (47)"
  text: >
    Cross-record ModelAtlas, citation, and methods audit with arnold2023 (Arnold, Gubbala &
    Takatori, Phys. Rev. Lett. 131:128402, 2023; cited in arnold2024 as ref-7 on pp. 1 and 4;
    same laboratory, sharing 7 distinct bibliographic references including Veatch & Keller 2003,
    Camley & Brown 2011, Angelova & Dimitrov 1986, Spudich & Watt 1971, Schroer et al. 2020, and
    Tian et al. 2007).
    (1) Static structure-factor domain-size metric shift (and curve-port ModelAtlas boundary):
    arnold2023/structure_factor_first_moment_eq47 (SI Sec. IV.A Eq. 47, p. 14) takes a whole-curve
    input port S_k, so per ModelAtlas rules (record_guide.md & boxgraph/atlas.py) it cannot be
    tested directly against arnold2024/structure_factor_eq5_pipeline or mean_wavelength_from_k
    without producing an unverifiable status. Comparing their printed equations directly reveals
    three consecutive methodological shifts within the same lab: (a) length-scale factor of 2*pi —
    arnold2023 Eq. (47) defines inverse first moment a(t) = (int S(k) dk)/(int k S(k) dk) = 1/<k>
    (no 2*pi factor), whereas arnold2024 Eq. (5) & Fig. 3C define mean wavelength a, xi = 2*pi/<k>
    (6.283x larger in absolute units, cancelling in normalized ratios a/a_0); (b) squared vs.
    unsquared FFT magnitude — arnold2023 uses standard power spectrum S(k, t) = <|phi_k(t)|^2>,
    whereas arnold2024 p. 4 explicitly prints unsquared S(n) = |FFT(n)| (upweighting high-k tails;
    see arnold2024/q_structure_factor_unsquared_fft); and (c) high-k integration cutoff —
    arnold2023 truncates dynamically at k_cut = 2*k_max (tracking the shifting spectral peak),
    whereas arnold2024 discards n = 0 and wavelengths 2*pi/k < 5 px (fixed spatial pixel cutoff).
    (2) Coarsening scaling & active-vs-passive regime shift: 4 proposed ModelAtlas relations in
    arnold2024/relations.yaml verify that arnold2024/passive_coarsening_scaling (a ~= t^(1/3))
    shares exact +1/3 temporal scaling with arnold2023's passive power-law baseline
    (domain_growth_power_law_scaling at alpha = 1/3), 2D Ostwald ripening
    (lifshitz_slyozov_2d_asymptotic_eq11), and corrected late-time Brownian coalescence
    (smoluchowski_passive_approx_eq28_corrected), while honestly failing (not_verified, log-slope
    gap 1/3) against arnold2023's active myosin-driven shear coalescence (alpha = 2/3). All other
    arnold2024 models (DDM non-ergodic ISF, Euler buckling, 2D bundle ribbon packing, modified
    Laplace-Young, spline curvature, excess perimeter, cholesterol tracer tracking, lipid sum)
    have no equation counterparts in arnold2023.
    (3) Citation precision and cited.yaml audit for active_coarsening_acceleration_ref7: arnold2024
    p. 1 (citing ref-7) writes "accelerate domain coarsening by 2x compared to thermal coarsening",
    loosely omitting "in the growth exponent" from arnold2023 p. 1 ("grow as ~t^(2/3), a 2x
    acceleration in the growth exponent compared to passive ~t^(1/3) growth" — doubling a power-law
    exponent rather than a linear coarsening rate). Because arnold2023/data.yaml records
    alpha_passive_theory (1/3) and alpha_active_smoluchowski_theory (2/3) separately rather than a
