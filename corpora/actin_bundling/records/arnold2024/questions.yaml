- id: q_eq1_ddm_fft_square_order
  kind: possible_error
  about: [ddm_image_structure_function_eq1, ddm_image_structure_function_eq1_fourier_sq, run_ddm_eq1_printed, run_ddm_eq1_corrected]
  citation:
    page: 4
    printed_page: "26573"
    quote: "D(k , t ) = FFT[|I(x , t ) I(x , 0)|2 ]"
    where: "Eq. 1"
  text: >
    Eq. (1) prints D(k, t) = FFT[|I(x, t) - I(x, 0)|^2] (taking the FFT of the squared real-space
    difference) rather than the standard DDM definition D(k, t) = |FFT[I(x, t) - I(x, 0)]|^2
    (Refs. 32-33). On a deterministic single-mode cosine wave at Fourier mode n0, printed Eq. (1)
    produces zero signal at the true wave vector k0 (D_k0_ratio = 0) and moves power into DC and 2*k0
    with complex/sign-flipping values, whereas the paper's own SI Fig. S3 y-axis (p. 13) labels
    D(k, t) as <|Delta I_hat(k, t)^2|> with strictly positive real values up to 2.5e10. In addition,
    p. 4 line 13 prints 'k = k' without absolute value bars (corrected to 'k = |k|' on p. 6), and
    Fig. S3 prints ensemble brackets <...> despite p. 4 stating no ensemble average is taken.

- id: q_buckling_force_missing_pi_square
  kind: possible_error
  about: [actin_buckling_force, actin_buckling_force_euler, actin_buckling_force_printed, cmp_buckling_force_printed, cmp_buckling_force_euler]
  citation:
    page: 5
    printed_page: "26574"
    quote: "of length L = 1 μm is Fb = π EI/L2 = 1 pN"
    where: text
  text: >
    Page 5 prints the actin filament buckling force as F_b = pi * EI / L^2 = 1 pN for
    EI = 2 x 10^-25 N*m^2 (Ref. 36) and L = 1 um. The standard Euler critical buckling force for an
    elastic rod carries pi^2, not pi (pinned-pinned: pi^2 * EI / L^2; cantilever: pi^2 * EI / (4 L^2);
    fixed-fixed: 4 pi^2 * EI / L^2). Numerically, the printed formula gives 0.628 pN (37% below 1 pN,
    inside the 1-digit rounding interval [0.5, 1.5]), whereas pinned-pinned Euler pi^2 * EI / L^2 gives
    1.974 pN (~2 pN, verdict 'close'), and cantilever pi^2 * EI / (4 L^2) gives 0.493 pN. Using the
    exact '=' sign with '1 pN' does not match either 0.63 pN or 1.97 pN closely.

- id: q_excess_perimeter_triangle_vs_fig2c
  kind: unexplained_difference
  about: [excess_perimeter_eq3, run_excess_perimeter_circle, run_excess_perimeter_triangle, fig_s2_lex_range_without_outliers]
  citation:
    page: 4
    printed_page: "26573"
    quote: "difference between the domain perimeter and the minimum"
    where: "Eq. 3 & Fig. 2B-C"
  text: >
    By Eq. (3), L_ex = L / (2*sqrt(pi*A)) - 1 equals 0 for a circle, 0.128 for a square, and only
    sqrt(3*sqrt(3)/pi) - 1 = 0.286 for an equilateral triangle (an ellipse requires a ~10:1 aspect ratio
    to reach L_ex = 1.0). Yet Fig. 2C (p. 3) plots L_ex ≈ 0.20-0.25 at rho/rho_0 -> 0 (where Fig. 2B
    panel 1 domains are nearly circular), L_ex ≈ 1.0-1.2 at rho/rho_0 = 1 (where Fig. 2B panel 4 shows
    moderately triangular domains), and Fig. 4B reaches L_ex ≈ 1.6 (and Fig. S2C 'without outliers'
    assigns L_ex up to ~0.8-1.0 to modest oval/bean domains). Possible causes include pixel-staircase
    perimeter inflation (a 4-connected pixel circle has L/L_0 = 4/pi -> L_ex = 0.273), noisy binarized
    edges, an undocumented formula such as isoperimetric excess L^2/(4*pi*A) - 1 (0.654 for an
    equilateral triangle), or residual merged domains. Quantitative curve digitization is deferred to
    digitize:arnold2024.

