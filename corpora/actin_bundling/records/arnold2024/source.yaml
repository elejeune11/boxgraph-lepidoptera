notes: >
  Read stage of Arnold & Takatori, Langmuir 40, 26570-26578 (2024), covering both the main article
  (PDF pp. 1-9, journal pp. 26570-26578) and 100% of the Supporting Information (PDF pp. 10-13,
  SI pp. 1-4: Video S1-S3 descriptions, Supporting Note 1, and Figs. S1-S4). All 13 page images
  were visually inspected alongside extracted text to catch OCR omissions (e.g., Eq. 1/2/3/4/5
  operators, ~O(nm)/~O(um), and Fig. S3 legend wave vectors k = 0.9, 1.8, 2.7, 3.6 um^-1).
  Note that although this paper measures actin network viscoelasticity on phase-separated lipid
  bilayers (the experimental precursor to gubbala2025), it does not compute viscoelastic moduli
  G' or G''; instead it quantifies viscoelastic relaxation via non-ergodic DDM intermediate
  scattering function half-lives (tau_Ld ≈ 4100 s vs. tau_Lo+Ld ≈ 1600 s), static structure factor
  coarsening wavelengths a, xi = 2*pi/<k>, domain excess perimeter L_ex and spline boundary
  curvature div(n), modified 2D Laplace-Young balance, filament buckling/bundling estimates, and
  gelsolin-truncated tracer filament position variances during cholesterol insertion.
  In scope: 21 runnable models (including 2 corrected variants for evident misprints in Eq. 1 and
  the p. 5 buckling force formula), 31 runs, 28 comparisons, 4 numerical refinements (all settled,
  belongs_to = model), 1 stated model relation (Eq. 4 same_as effective-pressure form, verified to
  0.00e+00 max relative diff), all 45 main references (linking Ref. 7 to arnold2023), complete
  main-text and SI experimental parameters, and 19 open questions.
  Deferred to digitize:arnold2024: calibrated figure digitization of quantitative plots in Figs.
  2C, 3B, 3C, 4B, 4C, and S3 (documented in figures.md). Left out as qualitative micrographs,
  schematics, or spatial heatmaps: Figs. 1A-C, 2A-B, 2D, 3A, 4A, 4C inset, S1, S2A-C, S4A-B, and
  external Videos S1-S3 (whose printed text parameters and colorbar ranges are recorded).
  Key mathematical, numerical, and methodological findings:
  (1) Printed Eq. (1) (p. 4) reverses the square and FFT: D(k, t) = FFT[|I(x, t) - I(x, 0)|^2]
  instead of DDM |FFT[I(x, t) - I(x, 0)]|^2. On a deterministic single-mode test wave, printed
  Eq. (1) yields zero power at k0 (not reproduced: ratio 0.0 vs. 1.0) and puts complex/harmonic
  signal at 2*k0, whereas the corrected variant (evidenced by the paper's own SI Fig. S3 y-axis
  <|Delta I_hat(k, t)^2|> and Refs. 32-33) reproduces ratio 1.0 cleanly. Page 4 also prints
  'k = k' without absolute value bars.
  (2) Page 5 prints actin buckling force F_b = pi*EI/L^2 = 1 pN (missing the square on pi in
  Euler's critical load pi^2*EI/L^2). With EI = 2e-25 N*m^2 (Ref. 36) and L = 1 um, printed
  pi*EI/L^2 gives 0.628 pN (reproduced within 1-digit [0.5, 1.5], 37% below 1 pN), while pinned-
  pinned Euler pi^2*EI/L^2 gives 1.974 pN (close, ~2 pN).
  (3) Exact Euclidean excess perimeter Eq. (3) gives L_ex = 0 for a circle and only 0.286 for an
  equilateral triangle (requiring ~10:1 ellipse aspect ratio to reach L_ex = 1.0), contrasting
  sharply with Fig. 2C (~0.20-0.25 for circular domains at rho -> 0, ~1.0-1.2 for triangular
  domains at rho/rho_0 = 1) and Fig. 4B (up to ~1.6) — flagging potential pixelation inflation,
  alternative definition, or residual merged domains for digitize:arnold2024.
  (4) DDM relaxation speedup 4100 s / 1600 s = 2.5625 reproduces Fig. 3A '2.6x' (while Intro p. 1
  prints '~2.5x'), but SI Fig. S3 right panel reveals that 1-phase Ld D(k, t) never plateaus over
  the recording window (F(<k>, t) dips below 0 in Fig. 3B), making tau_Ld sensitive to asymptote
  truncation.
  (5) Static structure factor on p. 4 explicitly uses unsquared S(n) = |FFT(n)| (upweighting high-k
  tails relative to standard |FFT|^2); nearest-integer radial binning reproduces sqrt(2) -> 1; and
  k = 2*pi*n/L reproduces Fig. S3's four harmonics k = 0.9, 1.8, 2.7, 3.6 um^-1 (with unstated L).
  (6) Tracer tracking contains internal contradictions and ambiguities: Fig. 4C caption prints
  '<10 s' intervals vs. 20 s (100 images x 0.2 s = 19.8-20.0 s) in Methods p. 3, Results p. 7, and
  SI Video S3 p. 10; SI Video S3 mis-cites Fig. 3C instead of Fig. 4C; Fig. 4C caption prints
  n = 212 vs. n = 212-254 on p. 7; and the printed variance <|Delta x|^2> - <|Delta x|>^2 is the
  scalar radial variance ((1 - pi/4) = 0.2146 of 2D vector variance for isotropic Gaussian steps)
  without defining Delta x.
  (7) Unstated experimental parameters and minor protocol slips: single-phase Ld bilayer lipid
  composition, room temperature, individual <k> values for Fig. 3B, and FFT box width L are never
  stated; p. 3 defines rho = I_actin / A_actin using mean rather than integrated intensity; p. 7
  'additional ≈25%' matches initial Lo fraction (~25% in Fig. 4B) or relative gain 20%/80% = 25%
  rather than peak 50% Lo fraction; p. 2 writes 'actin/HMM-coated coverslip' before actin addition
  and 'Assembling Actomyosin Cortex' despite passive ATP-free HMM cushioning; and p. 2 Methods
  (45.7% DOPC + 0.3% FITC = 100.0%) is rounded on p. 4 Results (46% DOPC + trace FITC).

