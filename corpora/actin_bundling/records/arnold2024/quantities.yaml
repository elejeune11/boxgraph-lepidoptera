- id: actin_mesh_size
  name: actin network mesh size
  dimension: "[length]"
  description: "Characteristic pore or mesh size of an F-actin network."

- id: actin_filament_diameter
  name: actin filament diameter
  dimension: "[length]"
  description: "Diameter of a single filamentous actin (F-actin) strand."

- id: actin_filament_length
  name: actin filament length
  dimension: "[length]"
  description: "Contour length L of an F-actin filament (full-length or gelsolin-truncated tracer)."

- id: actin_filament_spacing
  name: inter-filament center-to-center spacing
  dimension: "[length]"
  description: "Periodic center-to-center spacing between aligned F-actin filaments within a 2D nematic bundle on a lipid bilayer."

- id: actin_bundle_width
  name: actin bundle width
  dimension: "[length]"
  description: "Lateral width of a 2D F-actin bundle adsorbed to the Ld membrane phase."

- id: actin_bundle_filament_count
  name: number of filaments per actin bundle
  dimension: dimensionless
  description: "Estimated number of parallel F-actin filaments spanning the width of an actin bundle."

- id: actin_flexural_rigidity
  name: actin filament flexural rigidity
  dimension: "[force] * [length] ** 2"
  description: "Bending stiffness EI of a single F-actin filament."

- id: actin_buckling_force
  name: actin filament buckling force
  dimension: "[force]"
  description: "Critical compressive force F_b required to buckle an F-actin filament of length L."

- id: lipid_line_tension
  name: Lo/Ld domain line tension
  dimension: "[force]"
  description: "Interfacial line tension lambda along the 2D boundary separating Lo and Ld lipid membrane phases."

- id: domain_area
  name: lipid domain area
  dimension: "[length] ** 2"
  description: "2D area A of a single Lo lipid domain or total Lo/Ld/membrane region."

- id: domain_perimeter
  name: lipid domain perimeter
  dimension: "[length]"
  description: "Interfacial contour perimeter L of a deformed Lo domain or equivalent circular perimeter L_0 = 2*sqrt(pi*A)."

- id: excess_perimeter
  name: lipid domain excess perimeter
  dimension: dimensionless
  description: "Dimensionless fractional excess perimeter L_ex = (L - L_0)/L_0 = L/(2*sqrt(pi*A)) - 1 (Eq. 3)."

- id: interfacial_free_energy_change
  name: interfacial free energy increase
  dimension: "[energy]"
  description: "Excess interfacial free energy Delta F = lambda * (L - L_0) from deforming a constant-area Lo domain away from a circle."

- id: domain_radius
  name: lipid domain radius
  dimension: "[length]"
  description: "Characteristic radius R of a circular or deformed Lo lipid domain."

- id: domain_aspect_ratio
  name: domain aspect ratio
  dimension: dimensionless
  description: "Major-to-minor axis ratio of a deformed elliptical lipid domain."

- id: domain_curvature
  name: local domain boundary curvature
  dimension: "1 / [length]"
  description: "Local 2D interfacial curvature div(n) along the Lo/Ld domain boundary."

- id: normalized_curvature
  name: normalized domain boundary curvature
  dimension: dimensionless
  description: "Local boundary curvature normalized by its maximum value |div(n)| / |div(n)|_max."

- id: surface_pressure
  name: 2D membrane surface pressure
  dimension: "[force] / [length]"
  description: "2D lateral surface pressure in the Lo phase (P_Lo), Ld phase (P_Ld), or effective outside pressure P_Ld^eff = P_Ld + sigma_el (Eq. 4)."

- id: elastic_stress_2d
  name: 2D compressive actin elastic stress
  dimension: "[force] / [length]"
  description: "2D compressive elastic stress sigma_el exerted by the Ld-adsorbed actin network on an Lo domain boundary (Eq. 4)."

- id: fluorescence_intensity
  name: actin fluorescence intensity
  dimension: dimensionless
  description: "Fluorescence intensity I_actin (arbitrary intensity units) of labeled F-actin used to compute actin surface density."

- id: actin_surface_density
  name: actin fluorescence density per Ld area
  dimension: "1 / [length] ** 2"
  description: "Actin density rho = I_actin / A_actin as defined in Image Analysis (p. 3), where A_actin = A_total - A_Lo."

- id: normalized_actin_density
  name: normalized actin density
  dimension: dimensionless
  description: "Actin density rho normalized by maximum sampled density rho_0 (Fig. 2C)."

- id: lipid_area_fraction
  name: membrane phase area fraction
  dimension: dimensionless
  description: "Fraction of total membrane area occupied by the Lo phase (phi_Lo), Ld phase (phi_Ld = 1 - phi_Lo), or fractional area gained upon phase mixing."

- id: image_width
  name: square image width
  dimension: "[length]"
  description: "Physical side length L of a square microscopy image analyzed by 2D FFT (L_x = L_y = L)."

- id: fourier_mode_index
  name: discrete Fourier mode index
  dimension: dimensionless
  description: "Radial integer or raw Fourier mode index n = 0, 1, 2, ... of a 2D FFT."

- id: wave_vector
  name: spatial wave vector magnitude
  dimension: "1 / [length]"
  description: "Magnitude k = |k| = 2*pi*n/L of the 2D spatial wave vector, or mean wave vector <k> from static structure factor S(k) (Eq. 5)."

- id: structure_factor_wavelength
  name: mean wavelength of static structure factor
  dimension: "[length]"
  description: "Characteristic length scale a = 2*pi/<k> (Lo domains) or xi = 2*pi/<k> (actin network), or single-mode wavelength 2*pi/k."

- id: image_structure_function
  name: DDM image structure function
  dimension: dimensionless
  description: "Image structure function D(k, t) and its time-independent DDM constants A(k), B(k) in Eqs. (1)-(2) (squared intensity units)."

- id: intermediate_scattering_function
  name: intermediate scattering function
  dimension: dimensionless
  description: "Normalized intermediate scattering function F(k, t) = 1 - (D(k, t) - B(k))/A(k) (Eq. 2)."

- id: relaxation_time
  name: actin network relaxation time
  dimension: "[time]"
  description: "Actin structural relaxation half-life tau defined by F(<k>, tau) = 0.5 on single-phase Ld (tau_Ld) or two-phase (tau_Lo+Ld) membranes."

- id: relaxation_speedup_factor
  name: relaxation time speedup factor
  dimension: dimensionless
  description: "Ratio tau_Ld / tau_Lo+Ld quantifying acceleration of actin network relaxation by coarsening Lo domains."

- id: coarsening_acceleration_factor
  name: active coarsening acceleration factor
  dimension: dimensionless
  description: "Factor by which active myosin-driven flows accelerate domain coarsening compared to thermal coarsening (cited from Ref. 7)."

- id: elapsed_time
  name: elapsed experimental time
  dimension: "[time]"
  description: "Time t elapsed during imaging, coarsening, cholesterol insertion, incubation, or protocol steps."

- id: frame_interval
  name: imaging frame interval
  dimension: "[time]"
  description: "Time interval dt between consecutive frames in a microscopy time-lapse."

- id: frame_count
  name: number of time-lapse frames
  dimension: dimensionless
  description: "Total count of frames captured in a short tracer-tracking time-lapse."

- id: tracer_displacement
  name: tracer filament mean displacement magnitude
  dimension: "[length]"
  description: "Mean magnitude <|Delta x|> of tracked tracer actin filament displacement over a short time-lapse."

- id: tracer_msd
  name: tracer filament mean squared displacement
  dimension: "[length] ** 2"
  description: "Mean squared displacement <|Delta x|^2> of tracked tracer actin filaments."

- id: tracer_position_variance
  name: tracer filament position variance
  dimension: "[length] ** 2"
  description: "Variance in tracked tracer actin filament positions printed as <|Delta x|^2> - <|Delta x|>^2 (Fig. 4C, p. 7)."

- id: sample_count
  name: number of samples or tracked filaments
  dimension: dimensionless
  description: "Count n of independent lipid bilayer/actin samples or tracked tracer filaments."

- id: pixel_count
  name: image object or wavelength pixel count
  dimension: dimensionless
  description: "Pixel count threshold or spatial wavelength cutoff in pixels for image segmentation and FFT filtering."

- id: oversample_factor
  name: parametric curve oversampling factor
  dimension: dimensionless
  description: "Ratio of parametric spline evaluation points to domain boundary edge pixels."

- id: threshold_fraction
  name: binarization threshold fraction
  dimension: dimensionless
  description: "Retained pixel percentage or iterative threshold decrement step used in merged-domain separation."

- id: lipid_mole_fraction
  name: lipid mixture component percentage
  dimension: dimensionless
  description: "Percentage of each lipid species (DOPC, DPPC, cholesterol, DOTAP, DSPE-PEG2k-FITC) in the GUV bilayer mixture."

- id: actin_tracer_mole_fraction
  name: labeled tracer actin mole percentage
  dimension: dimensionless
  description: "Mole percentage of fluorescently labeled G-actin-555 tracer monomers mixed into the F-actin network for tracer tracking (p. 3)."

- id: molar_concentration
  name: molar solute concentration
  dimension: "[substance] / [length] ** 3"
  description: "Molar concentration of buffer components, proteins (F-actin, HMM, gelsolin), sucrose, or mbetaCD."

- id: mass_concentration
  name: mass concentration
  dimension: "[mass] / [length] ** 3"
  description: "Mass concentration of polymer cushion solution (PLL-g-PEG)."

- id: sucrose_percentage
  name: sucrose storage concentration percentage
  dimension: dimensionless
  description: "Percentage of sucrose in frozen G-actin and HMM storage solutions."

- id: stoichiometric_ratio
  name: reagent mixing ratio
  dimension: dimensionless
  description: "Mixing ratio of cholesterol:mbetaCD or piranha sulfuric acid:hydrogen peroxide."

- id: ph_value
  name: buffer pH
  dimension: dimensionless
  description: "Acidity/alkalinity pH of aqueous assay and storage buffers."

- id: temperature
  name: temperature
  dimension: "[temperature]"
  description: "Temperature during lipid electroformation, bilayer rupture, actin incubation, depolymerization, or storage."

- id: electric_potential
  name: electroformation peak-to-peak voltage
  dimension: "[mass] * [length] ** 2 / [time] ** 3 / [current]"
  description: "Sinusoidal peak-to-peak voltage amplitude applied across ITO slides during GUV electroformation."

- id: frequency
  name: electroformation AC frequency
  dimension: "1 / [time]"
  description: "Frequency of sinusoidal electric field applied during GUV electroformation."

- id: electrical_resistance
  name: ITO slide sheet resistance
  dimension: "[mass] * [length] ** 2 / [time] ** 3 / [current] ** 2"
  description: "Nominal resistance specification of ITO-coated microscope slides."

- id: chamber_dimension
  name: experimental chamber or gasket dimension
  dimension: "[length]"
  description: "Physical thickness of electroformation rubber gasket or diameter of PDMS sample chamber."

- id: relative_centrifugal_force
  name: relative centrifugal force
  dimension: dimensionless
  description: "Centrifugation acceleration in multiples of standard gravity (x g)."

- id: optical_wavelength
  name: fluorescence optical wavelength
  dimension: "[length]"
  description: "Excitation/emission wavelength or filter center wavelength for fluorescence microscopy."

- id: optical_magnification
  name: microscope objective magnification
  dimension: dimensionless
  description: "Magnification factor of the microscope objective."

- id: numerical_aperture
  name: microscope objective numerical aperture
  dimension: dimensionless
  description: "Numerical aperture (NA) of the microscope objective."

- id: guv_splatter_size
  name: ruptured GUV planar membrane size
  dimension: "[length]"
  description: "Lateral size of an oblong planar lipid bilayer patch formed by rupturing a GUV on a cushioned coverslip (Fig. S1)."

- id: phase_shift
  name: sinusoidal pattern phase shift
  dimension: dimensionless
  description: "Spatial phase shift Delta phi (radians) of a periodic test pattern used to probe Eq. (1) vs. corrected DDM."

- id: boolean_indicator
  name: non-negativity or positivity ratio indicator
  dimension: dimensionless
  description: "Normalized amplitude ratio D(k0) / D_expected at the true spatial mode k0 for verifying Eq. (1) DDM structure function."
