- id: run_ddm_isf_tinf
  model: ddm_isf_eq2
  inputs:
    D_t: ddm_Dinf_bench_added
    D_0: ddm_D0_bench_added
    D_inf: ddm_Dinf_bench_added
  settings: {}
  outputs:
    A: ddm_A_tinf_pred
    B: ddm_B_tinf_pred
    F: ddm_F_tinf_pred

- id: run_ddm_isf_halflife
  model: ddm_isf_eq2
  inputs:
    D_t: ddm_Dmid_bench_added
    D_0: ddm_D0_bench_added
    D_inf: ddm_Dinf_bench_added
  settings: {}
  outputs:
    A: ddm_A_mid_pred
    B: ddm_B_mid_pred
    F: ddm_F_mid_pred

- id: run_relaxation_speedup
  model: relaxation_speedup_ratio
  inputs:
    tau_Ld: tau_Ld_measured
    tau_LoLd: tau_LoLd_measured
  settings: {}
  outputs:
    speedup: relaxation_speedup_pred

# ==============================================================================
