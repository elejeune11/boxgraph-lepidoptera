# 10. Digitized figure curve sweeps (digitize:arnold2024)
# ==============================================================================

- id: run_passive_coarsening_fig3c
  model: passive_coarsening_scaling
  inputs: {}
  sweep:
    t: fig3c_domain_a_measured
  settings: {}
  outputs:
    a: a_passive_fig3c_pred
  note: "Sweeps passive 2D coarsening scaling a ~ t^(1/3) (prefactor unknown; p. 7) across the digitized Fig. 3C Lo domain coarsening curve a(t) (t = 0 to 4000 s) to test the paper's claim that actin-coupled domain growth deviates markedly from sublinear t^(1/3) scaling."
