# ==============================================================================
# 1. Actin filament buckling force (p. 5): printed pi vs. standard Euler pi^2
# ==============================================================================

- id: run_buckling_printed
  model: actin_buckling_force
  inputs:
    EI: actin_flexural_rigidity
    L: actin_buckling_length
  settings: {}
  outputs:
    F_b: Fb_printed_pred
  note: "Evaluates printed F_b = pi * EI / L^2 with EI = 2e-25 N*m^2 (Ref. 36) and L = 1 um."

- id: run_buckling_euler
  model: actin_buckling_force_euler
  inputs:
    EI: actin_flexural_rigidity
    L: actin_buckling_length
  settings: {}
  outputs:
    F_b: Fb_euler_pred
  note: "Evaluates corrected Euler pinned-pinned buckling load F_b = pi^2 * EI / L^2 with the same inputs."

# ==============================================================================
# 2. Actin bundle thickness in number of filaments (p. 5)
# ==============================================================================

- id: run_bundle_count_mid
  model: bundle_filament_count
  inputs:
    w_bundle: actin_bundle_width
    d_spacing: actin_filament_spacing_ref29
  settings: {}
  outputs:
    N_fil: N_fil_mid_pred

- id: run_bundle_count_low
  model: bundle_filament_count
  inputs:
    w_bundle: actin_bundle_width_low_added
    d_spacing: actin_filament_spacing_ref29
  settings: {}
  outputs:
    N_fil: N_fil_low_pred

- id: run_bundle_count_high
  model: bundle_filament_count
  inputs:
    w_bundle: actin_bundle_width_high_added
    d_spacing: actin_filament_spacing_ref29
  settings: {}
  outputs:
    N_fil: N_fil_high_pred

# ==============================================================================
# 3. Excess perimeter Eq. (3) and interfacial free energy change (p. 4)
# ==============================================================================

- id: run_excess_perimeter_circle
  model: excess_perimeter_eq3
  inputs:
    L: domain_perimeter_circle_r1_added
    A: domain_area_circle_r1_added
    lam: lipid_line_tension_ref37
  settings: {}
  outputs:
    L0: L0_circle_pred
    L_ex: Lex_circle_pred
    dF: dF_circle_pred
  note: "Circular limit benchmark (R = 1 um): L_ex = 0, Delta F = 0."

- id: run_excess_perimeter_triangle
  model: excess_perimeter_eq3
  inputs:
    L: domain_perimeter_eq_triangle_r1_added
    A: domain_area_circle_r1_added
    lam: lipid_line_tension_ref37
  settings: {}
  outputs:
    L0: L0_triangle_pred
    L_ex: Lex_triangle_pred
    dF: dF_triangle_pred
  note: "Equilateral triangle benchmark (A = pi um^2): exact Euclidean L_ex = sqrt(3*sqrt(3)/pi) - 1 = 0.2861."

# ==============================================================================
# 4. Modified 2D Laplace-Young balance Eq. (4) & effective-pressure form (p. 5)
# ==============================================================================

- id: run_laplace_young_zero_stress
  model: modified_laplace_young_eq4
  inputs:
    P_Lo: p_lo_bench_added
    P_Ld: p_ld_bench_added
    sigma_el: sigma_el_zero_added
    lam: lipid_line_tension_ref37
  settings: {}
  outputs:
    P_Ld_eff: PLd_eff_zero_pred
    kappa: kappa_ly_zero_pred

- id: run_laplace_young_compressed
  model: modified_laplace_young_eq4
  inputs:
    P_Lo: p_lo_bench_added
    P_Ld: p_ld_bench_added
    sigma_el: sigma_el_compressed_added
    lam: lipid_line_tension_ref37
  settings: {}
  outputs:
    P_Ld_eff: PLd_eff_comp_pred
    kappa: kappa_ly_comp_pred

- id: run_effective_laplace_young_comp
  model: effective_laplace_young
  inputs:
    P_Lo: p_lo_bench_added
    P_Ld_eff: PLd_eff_comp_pred
    lam: lipid_line_tension_ref37
  settings: {}
  outputs:
    kappa: kappa_eff_comp_pred

# ==============================================================================
# 5. Domain curvature spline pipeline (p. 3, Fig. 2D)
# ==============================================================================

- id: run_curvature_circle
  model: domain_curvature_spline
  inputs:
    R: domain_radius_bench_added
    aspect_ratio: domain_aspect_ratio_circle_added
  settings:
    n_edge_pixels: 40
    oversample_factor: 5
    spline_s: 0.0
  outputs:
    kappa_mean: kappa_mean_circle_pred
    kappa_max: kappa_max_circle_pred
    kappa_norm_min: kappa_norm_min_circle_pred

- id: run_curvature_deformed
  model: domain_curvature_spline
  inputs:
    R: domain_radius_bench_added
    aspect_ratio: domain_aspect_ratio_deformed_added
  settings:
    n_edge_pixels: 40
    oversample_factor: 5
    spline_s: 0.0
  outputs:
    kappa_mean: kappa_mean_deformed_pred
    kappa_max: kappa_max_deformed_pred
    kappa_norm_min: kappa_norm_min_deformed_pred

# ==============================================================================
# 6. Actin density & Ld accessible area fraction (pp. 3, 7)
# ==============================================================================

- id: run_actin_density_bench
  model: actin_density
  inputs:
    A_total: actin_density_Atotal_added
    A_Lo: actin_density_ALo_added
    I_actin: actin_density_I_added
  settings: {}
  outputs:
    A_actin: A_actin_bench_pred
    rho: rho_bench_pred

- id: run_ld_area_initial
  model: ld_area_fraction
  inputs:
    phi_Lo: phi_Lo_initial_p7
  settings: {}
  outputs:
    phi_Ld: phi_Ld_init_pred
    delta_phi_total: delta_phi_tot_init_pred
    delta_phi_rel: delta_phi_rel_init_pred
  note: "At initial phi_Lo ≈ 20% (p. 7), full phase mixing adds 20% of total membrane area, which is a +25% relative increase over the initial 80% Ld area."

- id: run_ld_area_peak
  model: ld_area_fraction
  inputs:
    phi_Lo: phi_Lo_peak_p7
  settings: {}
  outputs:
    phi_Ld: phi_Ld_peak_pred
    delta_phi_total: delta_phi_tot_peak_pred
    delta_phi_rel: delta_phi_rel_peak_pred
  note: "At peak phi_Lo ≈ 50% (p. 7, t = 11 min), full phase mixing adds 50% of total membrane area (+100% relative to compressed Ld area)."

# ==============================================================================
# 7. DDM Eqs. (1)-(2) and relaxation speedup ratio (pp. 1, 4, 5, 6, 13)
# ==============================================================================

- id: run_ddm_eq1_printed
