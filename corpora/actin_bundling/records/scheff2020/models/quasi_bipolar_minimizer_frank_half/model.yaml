id: quasi_bipolar_minimizer_frank_half
name: equilibrium quasi bipolar tactoid shape minimizer with exact bend and Frank 1/2 prefactor
role: model
described_from: ref-34
variant_of: quasi_bipolar_minimizer_printed
corrections:
  - equation: "Eq. (2B)"
    change: "Replace printed bend term sin^2(xi)*cos^2(eta) with exact sin^2(xi)*sin^2(eta)"
    evidence: "Direct differentiation of the quasi-bipolar director field yields (curl n)^2 = sin^2(xi)*sin^2(eta)/N (ref. 34)."
  - equation: "Eq. (1) & Eq. (2B)"
    change: "Include standard Frank elastic prefactor 1/2 in F_el = (K/2) * int dV [(div n)^2 + (curl n)^2]"
    evidence: "Standard Frank elasticity (refs. 10, 34, 35) has prefactor K/2, recovering F_splay = 4*pi*K*R for an ideal bipolar sphere."
built_from:
  - quasi_bipolar_elastic_factor_frank_half
  - quasi_bipolar_anchoring_factor
  - tactoid_geometry_from_semimajor
stated:
  page: 3
  quote: "numerically minimizing the nondimensional free"
  where: "Methods, Quasi bipolar tactoid model (pp. 3–4)"
equation: "(x_eq, y_eq) = argmin_{x>=1, y>=1} [ (1/2) * (K/(gamma*V^(1/3))) * f_el_exact(x,y)/v(x)^(1/3) + (f_s(x) + omega*f_an(x,y))/v(x)^(2/3) ]"
inputs:
  V:
    quantity: tactoid_volume
    unit: um**3
  K_over_gamma:
    quantity: nematic_distortion_length
    unit: um
  omega:
    quantity: anchoring_ratio
    unit: dimensionless
outputs:
  x_eq:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
  y_eq:
    quantity: tactoid_bipolarity
    unit: dimensionless
  R_eq:
    quantity: tactoid_semimajor_axis
    unit: um
  r_eq:
    quantity: tactoid_semiminor_axis
    unit: um
  A_spindle:
    quantity: droplet_cross_sectional_area
    unit: um**2
  A_ellipse:
    quantity: droplet_cross_sectional_area
    unit: um**2
  F_nondim:
    quantity: tactoid_free_energy_nondim
    unit: dimensionless
settings:
  n_xi: 48
  n_eta: 24
  xtol: 1.0e-6
stochastic: false
