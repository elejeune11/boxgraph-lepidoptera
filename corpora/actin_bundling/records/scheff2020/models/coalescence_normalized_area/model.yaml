id: coalescence_normalized_area
name: normalized coalescence master curve exp(-t/tau)
role: model
described_from: ref-19
stated:
  page: 5
  quote: "Black dashed line indicates a single exponential"
  where: "Fig. 2(b) caption and text"
equation: "(A - A_f) / (A_i - A_f) = exp(-t_rescaled)"
inputs:
  t_rescaled:
    quantity: rescaled_time
    unit: dimensionless
outputs:
  A_norm:
    quantity: normalized_coalescence_area
    unit: dimensionless
settings: {}
stochastic: false
