id: quasi_bipolar_surface_factor_closed
name: closed-form nondimensional surface area shape factor f_s(x) (Eq. 2A)
role: model
described_from: ref-34
stated:
  page: 3
  quote: "results directly based on the derivation given in ref. 34"
  where: "Eq. (2A)"
equation: "f_s(x) = (2*pi / x^2) * (x + x^3 - (x^4 - 1) * tan^(-1)(x^(-1)))"
inputs:
  x:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
outputs:
  f_s:
    quantity: tactoid_surface_shape_factor
    unit: dimensionless
settings: {}
stochastic: false
