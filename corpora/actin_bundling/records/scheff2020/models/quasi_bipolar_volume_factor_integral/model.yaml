id: quasi_bipolar_volume_factor_integral
name: integral nondimensional volume shape factor v(x) (Eq. 2D)
role: model
described_from: ref-34
built_from:
  - bispherical_boundary_angle
  - bispherical_scale_factors
stated:
  page: 3
  quote: "factors corresponding to surface area and volume"
  where: "Eq. (2D)"
equation: "v(x) = int_0^{2*pi} dphi int_0^{pi} dxi int_0^{eta_0} deta h_phi * h_xi * h_eta"
inputs:
  x:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
outputs:
  v:
    quantity: tactoid_volume_shape_factor
    unit: dimensionless
settings:
  n_xi: 32
  n_eta: 24
stochastic: false
