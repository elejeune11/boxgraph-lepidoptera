id: quasi_bipolar_elastic_factor_frank_half
name: nondimensional nematic elastic shape factor f_el(x, y) with exact bend and Frank 1/2 prefactor
role: model
described_from: ref-34
variant_of: quasi_bipolar_elastic_factor_printed
corrections:
  - equation: "Eq. (2B)"
    change: "Replace printed bend term sin^2(xi)*cos^2(eta) with sin^2(xi)*sin^2(eta)"
    evidence: "Direct differentiation of the quasi-bipolar director field yields (curl n)^2 = sin^2(xi)*sin^2(eta)/N, vanishing on the symmetry axis eta = 0 and matching Prinsen & van der Schoot (2004, ref. 34)."
  - equation: "Eq. (1) & Eq. (2B)"
    change: "Include the standard Frank elastic prefactor 1/2 in F_el = (K/2) * int dV [(div n)^2 + (curl n)^2]"
    evidence: "Standard equal-constant Frank elasticity (refs. 10, 34, 35) has prefactor K/2, giving F_splay = 4*pi*K*R and F_el = 4.5326*pi*K*R for an ideal bipolar sphere (x = 1, y = 1); printed Eq. (1) + Eq. (2B) integrates over phi in [0, 2*pi] without 1/2 and doubles the elastic energy."
built_from:
  - bispherical_boundary_angle
  - bispherical_scale_factors
  - quasi_bipolar_factor_N
stated:
  page: 3
  quote: "related to the nematic elastic energy and the anchoring"
  where: "Eq. (2B)"
equation: "f_el(x, y) = (1/2) * int_0^{2*pi} dphi int_0^{pi} dxi int_0^{eta_0} deta h_phi * h_xi * h_eta * N^(-1) * (4*cos^2(xi) + sin^2(xi)*sin^2(eta))"
inputs:
  x:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
  y:
    quantity: tactoid_bipolarity
    unit: dimensionless
outputs:
  f_el:
    quantity: tactoid_elastic_shape_factor
    unit: dimensionless
settings:
  n_xi: 48
  n_eta: 24
stochastic: false
