id: coalescence_area_decay
name: exponential decay of droplet cross-sectional area during coalescence
role: fit
stated:
  page: 5
  quote: "extract a characteristic relaxation time, t, from the fit"
  where: "Results and discussion, Fig. 2(b) inset"
equation: "A(t) = A_f + (A_i - A_f) * exp(-t / tau)"
inputs:
  A_i:
    quantity: droplet_cross_sectional_area
    unit: um**2
  A_f:
    quantity: droplet_cross_sectional_area
    unit: um**2
  t:
    quantity: time
    unit: s
  tau:
    quantity: coalescence_relaxation_time
    unit: s
outputs:
  A:
    quantity: droplet_cross_sectional_area
    unit: um**2
  A_norm:
    quantity: normalized_coalescence_area
    unit: dimensionless
settings: {}
stochastic: false
