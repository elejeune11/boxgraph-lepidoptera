id: quasi_bipolar_aspect_vs_area_vtilde_inv
name: equilibrium aspect ratio vs area matching plotted Fig. 5c/S1 scaling (c = (K/gamma)^3/V, A = R*r, exact bend)
role: model
described_from: ref-34
variant_of: quasi_bipolar_aspect_vs_area_printed
corrections:
  - equation: "Nondimensional free energy F/(gamma*V^(2/3)) (pp. 3-4)"
    change: "Replace printed dimensionless elastic weight c = K/(gamma*V^(1/3)) = V_tilde^(-1/3) with V_tilde^(-1) = (K/gamma)^3 / V (omitting the cube root on V_tilde = V/(K/gamma)^3)"
    evidence: "All nine digitized theoretical curves in Fig. 5(c) (L ~ 135 nm) and ESI Fig. S1 (L ~ 90 nm, L ~ 270 nm) decay as x_eq - 1 ~ A^(-3/2) and scale with (K/gamma)^3/V rather than printed A^(-1/2); c = (K/gamma)^3/V matches all nine digitized curves to RMS 0.001-0.014, whereas printed c = K/(gamma*V^(1/3)) misses them by 0.05-1.4."
  - equation: "Eq. (2B) (p. 3)"
    change: "Replace printed bend term sin^2(xi)*cos^2(eta) with exact sin^2(xi)*sin^2(eta), retaining Eq. (1) normalization without Frank 1/2"
    evidence: "Exact differentiation of the quasi-bipolar director yields (curl n)^2 = sin^2(xi)*sin^2(eta)/N (ref. 34), and the digitized Fig. 5(c) and Fig. S1 curves match this exact bend integrand without the Frank 1/2 prefactor."
  - equation: "Cross-sectional area mapping (p. 4)"
    change: "Map equilibrium volume V and aspect ratio x to cross-sectional area via A = R*r = (V/v(x))^(2/3)/x rather than exact spindle area A_spindle"
    evidence: "Across all nine digitized curves in Fig. 5(c) and Fig. S1, A = R*r uniquely achieves RMS 0.0018 (L ~ 90 nm) and 0.0041 (L ~ 135 nm), outperforming A_spindle, pi*R*r, V^(2/3), and (3V/(4pi))^(2/3) by 2-4x or more."
built_from:
  - quasi_bipolar_minimizer_exact_bend
  - tactoid_geometry_from_semimajor
stated:
  page: 4
  quote: "compare the equilibrium aspect ratio vs. tactoid size"
  where: "Methods, Quasi bipolar tactoid model (p. 4 col 1, Fig. 5c, Fig. S1)"
equation: "x_eq(A; K/gamma, omega) from minimizing ((K/gamma)^3/V)*f_el_exact/v^(1/3) + (f_s + omega*f_an)/v^(2/3) with A = R*r"
inputs:
  A:
    quantity: droplet_cross_sectional_area
    unit: um**2
  K_over_gamma:
    quantity: nematic_distortion_length
    unit: um
  omega:
    quantity: anchoring_ratio
    unit: dimensionless
outputs:
  x_eq:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
  y_eq:
    quantity: tactoid_bipolarity
    unit: dimensionless
  V_eq:
    quantity: tactoid_volume
    unit: um**3
settings:
  n_xi: 48
  n_eta: 24
  xtol: 1.0e-6
stochastic: false
