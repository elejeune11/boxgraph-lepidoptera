id: tactoid_energy_size_scaling
name: interfacial and bulk nematic elastic energy size scaling with R
role: model
stated:
  page: 7
  quote: "characteristic length R, the interfacial energy grows as R2"
  where: "Results and discussion, p. 7 col 2"
equation: "F_s ~ gamma * R^2; F_el ~ K * R"
prefactor: unknown
from_words: true
inputs:
  R:
    quantity: tactoid_semimajor_axis
    unit: um
  K:
    quantity: frank_elastic_constant
    unit: pN
  gamma:
    quantity: interfacial_tension
    unit: "pN/um"
outputs:
  F_s:
    quantity: tactoid_free_energy
    unit: "pN*um"
  F_el:
    quantity: tactoid_free_energy
    unit: "pN*um"
settings: {}
stochastic: false
