id: quasi_bipolar_elastic_factor_printed
name: nondimensional nematic elastic shape factor f_el(x, y) as printed (Eq. 2B)
role: model
described_from: ref-34
built_from:
  - bispherical_boundary_angle
  - bispherical_scale_factors
  - quasi_bipolar_factor_N
stated:
  page: 3
  quote: "related to the nematic elastic energy and the anchoring"
  where: "Eq. (2B)"
equation: "f_el(x, y) = int_0^{2*pi} dphi int_0^{pi} dxi int_0^{eta_0} deta h_phi * h_xi * h_eta * N^(-1) * (4*cos^2(xi) + sin^2(xi)*cos^2(eta))"
inputs:
  x:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
  y:
    quantity: tactoid_bipolarity
    unit: dimensionless
outputs:
  f_el:
    quantity: tactoid_elastic_shape_factor
    unit: dimensionless
settings:
  n_xi: 48
  n_eta: 24
stochastic: false
