id: tactoid_geometry_from_semimajor
name: spindle tactoid surface area, volume, minor axis, and cross-sectional area
role: model
described_from: ref-34
built_from:
  - quasi_bipolar_surface_factor_closed
  - quasi_bipolar_volume_factor_closed
  - bispherical_boundary_angle
stated:
  page: 3
  quote: "The volume of the tactoid similarly scales as"
  where: "Methods, Quasi bipolar tactoid model"
equation: "S = R^2 * f_s(x); V = R^3 * v(x); r = R / x; A_spindle = 2 * R^2 * (eta_0 - sin(eta_0)*cos(eta_0)) / sin^2(eta_0); A_ellipse = pi * R^2 / x"
inputs:
  R:
    quantity: tactoid_semimajor_axis
    unit: um
  x:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
outputs:
  S:
    quantity: tactoid_surface_area
    unit: um**2
  V:
    quantity: tactoid_volume
    unit: um**3
  r:
    quantity: tactoid_semiminor_axis
    unit: um
  A_spindle:
    quantity: droplet_cross_sectional_area
    unit: um**2
  A_ellipse:
    quantity: droplet_cross_sectional_area
    unit: um**2
settings: {}
stochastic: false
