id: quasi_bipolar_minimizer_printed
name: equilibrium quasi bipolar tactoid shape minimizer at fixed volume (printed Eqs. 1–2D)
role: model
described_from: ref-34
built_from:
  - quasi_bipolar_free_energy_nondim_printed
  - tactoid_geometry_from_semimajor
stated:
  page: 3
  quote: "numerically minimizing the nondimensional free"
  where: "Methods, Quasi bipolar tactoid model (pp. 3–4)"
equation: "(x_eq, y_eq) = argmin_{x>=1, y>=1} [ (K/(gamma*V^(1/3))) * f_el_printed(x,y)/v(x)^(1/3) + (f_s(x) + omega*f_an(x,y))/v(x)^(2/3) ]"
inputs:
  V:
    quantity: tactoid_volume
    unit: um**3
  K_over_gamma:
    quantity: nematic_distortion_length
    unit: um
  omega:
    quantity: anchoring_ratio
    unit: dimensionless
outputs:
  x_eq:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
  y_eq:
    quantity: tactoid_bipolarity
    unit: dimensionless
  R_eq:
    quantity: tactoid_semimajor_axis
    unit: um
  r_eq:
    quantity: tactoid_semiminor_axis
    unit: um
  A_spindle:
    quantity: droplet_cross_sectional_area
    unit: um**2
  A_ellipse:
    quantity: droplet_cross_sectional_area
    unit: um**2
  F_nondim:
    quantity: tactoid_free_energy_nondim
    unit: dimensionless
settings:
  n_xi: 48
  n_eta: 24
  xtol: 1.0e-6
stochastic: false
