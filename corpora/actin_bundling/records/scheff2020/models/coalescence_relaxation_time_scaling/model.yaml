id: coalescence_relaxation_time_scaling
name: viscous-capillary scaling of coalescence relaxation time
role: model
described_from: ref-19
stated:
  page: 5
  quote: "interfacial tension, g, of the liquid as t"
  where: "Results and discussion, Fig. 2(c)–(d)"
equation: "tau ~ (eta / gamma) * Delta_l"
prefactor: unknown
inputs:
  eta_over_gamma:
    quantity: inverse_capillary_velocity
    unit: "s/um"
  delta_l:
    quantity: coalescence_relaxation_length
    unit: um
outputs:
