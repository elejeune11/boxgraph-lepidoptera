id: quasi_bipolar_factor_N
name: quasi bipolar director normalization factor N(xi, eta, y)
role: model
described_from: ref-34
stated:
  page: 3
  quote: "with the factor N defined as"
  where: "Methods, Quasi bipolar tactoid model"
equation: "N = (sin(xi)*cos(eta) + (1 + sin(xi)*cos(eta))*(y^2 - 1)/2)^2 + y^2 * sin^2(xi) * sin^2(eta)"
inputs:
  xi:
    quantity: bispherical_angle_xi
    unit: rad
  eta:
    quantity: bispherical_angle_eta
    unit: rad
  y:
    quantity: tactoid_bipolarity
    unit: dimensionless
outputs:
  N:
    quantity: quasi_bipolar_factor_N
    unit: dimensionless
settings: {}
stochastic: false
