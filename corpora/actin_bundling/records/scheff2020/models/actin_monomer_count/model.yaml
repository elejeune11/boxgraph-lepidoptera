id: actin_monomer_count
name: average actin monomers per filament from capping protein ratio
role: model
stated:
  page: 2
  quote: "number of monomers in a filament from the ratio"
  where: "Methods, Filament length"
equation: "N_m = [Actin] / [Capping Protein]"
inputs:
  c_actin:
    quantity: actin_concentration
    unit: uM
  c_cp:
    quantity: capping_protein_concentration
    unit: nM
outputs:
  N_m:
    quantity: monomers_per_filament
    unit: dimensionless
settings: {}
stochastic: false
