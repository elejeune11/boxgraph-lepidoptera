id: quasi_bipolar_free_energy_nondim_printed
name: nondimensional fixed-volume quasi bipolar tactoid free energy F/(gamma V^(2/3)) as printed
role: model
described_from: ref-34
built_from:
  - quasi_bipolar_surface_factor_closed
  - quasi_bipolar_volume_factor_closed
  - quasi_bipolar_elastic_factor_printed
  - quasi_bipolar_anchoring_factor
  - bulk_to_surface_ratio_def
  - tactoid_semimajor_from_volume
stated:
  page: 3
  quote: "expressed as a nondimensional free energy"
  where: "Methods, Quasi bipolar tactoid model"
equation: "F / (gamma * V^(2/3)) = (K / (gamma * V^(1/3))) * f_el(x, y) / v(x)^(1/3) + (f_s(x) + omega * f_an(x, y)) / v(x)^(2/3)"
inputs:
  V:
    quantity: tactoid_volume
    unit: um**3
  x:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
  y:
    quantity: tactoid_bipolarity
    unit: dimensionless
  K_over_gamma:
    quantity: nematic_distortion_length
    unit: um
  omega:
    quantity: anchoring_ratio
    unit: dimensionless
outputs:
  F_nondim:
    quantity: tactoid_free_energy_nondim
    unit: dimensionless
settings:
  n_xi: 48
  n_eta: 24
stochastic: false
