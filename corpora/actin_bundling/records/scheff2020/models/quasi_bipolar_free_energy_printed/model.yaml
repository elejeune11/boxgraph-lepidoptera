id: quasi_bipolar_free_energy_printed
name: total quasi bipolar tactoid free energy F(R; x, y) as printed (Eq. 1)
role: model
described_from: ref-34
built_from:
  - quasi_bipolar_surface_factor_closed
  - quasi_bipolar_elastic_factor_printed
  - quasi_bipolar_anchoring_factor
stated:
  page: 3
  quote: "write the total free energy in terms of the aspect ratio"
  where: "Eq. (1)"
equation: "F(R; x, y) = K * R * f_el(x, y) + gamma * R^2 * (f_s(x) + omega * f_an(x, y))"
inputs:
  R:
    quantity: tactoid_semimajor_axis
    unit: um
  x:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
  y:
    quantity: tactoid_bipolarity
    unit: dimensionless
  K:
    quantity: frank_elastic_constant
    unit: pN
  gamma:
    quantity: interfacial_tension
    unit: "pN/um"
  omega:
    quantity: anchoring_ratio
    unit: dimensionless
outputs:
  F:
    quantity: tactoid_free_energy
    unit: "pN*um"
settings:
  n_xi: 48
  n_eta: 24
stochastic: false
