id: sphere_geometry
name: spherical limit droplet surface area and volume (x -> 1)
role: model
stated:
  page: 3
  quote: "recover the expected surface area and volume factors"
  where: "Methods, Quasi bipolar tactoid model"
equation: "S = 4 * pi * R^2; V = (4/3) * pi * R^3"
from_words: true
inputs:
  R:
    quantity: tactoid_semimajor_axis
    unit: um
outputs:
  S:
    quantity: tactoid_surface_area
    unit: um**2
  V:
    quantity: tactoid_volume
    unit: um**3
settings: {}
stochastic: false
