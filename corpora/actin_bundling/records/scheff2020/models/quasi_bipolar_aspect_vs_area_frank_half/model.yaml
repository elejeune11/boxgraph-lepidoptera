id: quasi_bipolar_aspect_vs_area_frank_half
name: equilibrium aspect ratio vs cross-sectional area with exact bend and Frank 1/2 prefactor
role: model
described_from: ref-34
variant_of: quasi_bipolar_aspect_vs_area_printed
corrections:
  - equation: "Eq. (2B)"
    change: "Replace printed bend term sin^2(xi)*cos^2(eta) with exact sin^2(xi)*sin^2(eta)"
    evidence: "Direct differentiation of the quasi-bipolar director field yields (curl n)^2 = sin^2(xi)*sin^2(eta)/N (ref. 34)."
  - equation: "Eq. (1) & Eq. (2B)"
    change: "Include standard Frank elastic prefactor 1/2 in F_el = (K/2) * int dV [(div n)^2 + (curl n)^2]"
    evidence: "Standard Frank elasticity (refs. 10, 34, 35) has prefactor K/2, recovering F_splay = 4*pi*K*R for an ideal bipolar sphere."
built_from:
  - quasi_bipolar_minimizer_frank_half
  - tactoid_geometry_from_semimajor
stated:
  page: 4
  quote: "compare the equilibrium aspect ratio vs. tactoid size"
  where: "Methods, Quasi bipolar tactoid model (p. 4 col 1, Fig. 5c, Fig. S1)"
equation: "x_eq(A; K/gamma, omega) from minimizing F_frank_half/(gamma*V^(2/3)) subject to A_spindle(V, x_eq) = A"
inputs:
  A:
    quantity: droplet_cross_sectional_area
    unit: um**2
  K_over_gamma:
    quantity: nematic_distortion_length
    unit: um
  omega:
    quantity: anchoring_ratio
    unit: dimensionless
outputs:
  x_eq:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
  y_eq:
    quantity: tactoid_bipolarity
    unit: dimensionless
  V_eq:
    quantity: tactoid_volume
    unit: um**3
settings:
  n_xi: 48
  n_eta: 24
  xtol: 1.0e-6
stochastic: false
