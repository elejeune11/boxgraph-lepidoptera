id: quasi_bipolar_aspect_vs_area_exact_bend
name: equilibrium aspect ratio vs cross-sectional area with exact bend term (corrected Eq. 2B)
role: model
described_from: ref-34
variant_of: quasi_bipolar_aspect_vs_area_printed
corrections:
  - equation: "Eq. (2B)"
    change: "Replace printed bend term sin^2(xi)*cos^2(eta) with exact sin^2(xi)*sin^2(eta)"
    evidence: "Direct differentiation of the quasi-bipolar director field yields (curl n)^2 = sin^2(xi)*sin^2(eta)/N (ref. 34), vanishing at the symmetry axis eta = 0."
built_from:
  - quasi_bipolar_minimizer_exact_bend
  - tactoid_geometry_from_semimajor
stated:
  page: 4
  quote: "compare the equilibrium aspect ratio vs. tactoid size"
  where: "Methods, Quasi bipolar tactoid model (p. 4 col 1, Fig. 5c, Fig. S1)"
equation: "x_eq(A; K/gamma, omega) from minimizing F_exact_bend/(gamma*V^(2/3)) subject to A_spindle(V, x_eq) = A"
inputs:
  A:
    quantity: droplet_cross_sectional_area
    unit: um**2
  K_over_gamma:
    quantity: nematic_distortion_length
    unit: um
  omega:
    quantity: anchoring_ratio
    unit: dimensionless
outputs:
  x_eq:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
  y_eq:
    quantity: tactoid_bipolarity
    unit: dimensionless
  V_eq:
    quantity: tactoid_volume
    unit: um**3
settings:
  n_xi: 48
  n_eta: 24
  xtol: 1.0e-6
stochastic: false
