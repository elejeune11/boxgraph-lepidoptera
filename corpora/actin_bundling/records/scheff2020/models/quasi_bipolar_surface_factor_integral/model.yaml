id: quasi_bipolar_surface_factor_integral
name: integral nondimensional surface area shape factor f_s(x) (Eq. 2A)
role: model
described_from: ref-34
built_from:
  - bispherical_boundary_angle
  - bispherical_scale_factors
stated:
  page: 3
  quote: "results directly based on the derivation given in ref. 34"
  where: "Eq. (2A)"
equation: "f_s(x, y) = int_0^{2*pi} dphi int_0^{pi} dxi (h_phi * h_xi)|_{eta=eta_0}"
inputs:
  x:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
outputs:
  f_s:
    quantity: tactoid_surface_shape_factor
    unit: dimensionless
settings:
  n_xi: 32
stochastic: false
