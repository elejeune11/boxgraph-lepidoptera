id: quasi_bipolar_elastic_factor_exact_bend
name: nondimensional nematic elastic shape factor f_el(x, y) with exact bend term (corrected Eq. 2B)
role: model
described_from: ref-34
variant_of: quasi_bipolar_elastic_factor_printed
corrections:
  - equation: "Eq. (2B)"
    change: "Replace printed bend term sin^2(xi)*cos^2(eta) with sin^2(xi)*sin^2(eta)"
    evidence: "Direct differentiation of the quasi-bipolar director field in bispherical coordinates (Prinsen & van der Schoot 2004, ref. 34) gives (div n)^2 = 4*cos^2(xi)/N and (curl n)^2 = sin^2(xi)*sin^2(eta)/N; on the straight symmetry axis eta = 0 bend must vanish (sin^2(0) = 0), whereas printed cos^2(0) = 1 produces unphysical on-axis bend and yields only 25% of the Williams (1985) ideal bipolar sphere bend energy."
built_from:
  - bispherical_boundary_angle
  - bispherical_scale_factors
  - quasi_bipolar_factor_N
stated:
  page: 3
  quote: "related to the nematic elastic energy and the anchoring"
  where: "Eq. (2B)"
equation: "f_el(x, y) = int_0^{2*pi} dphi int_0^{pi} dxi int_0^{eta_0} deta h_phi * h_xi * h_eta * N^(-1) * (4*cos^2(xi) + sin^2(xi)*sin^2(eta))"
inputs:
  x:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
  y:
    quantity: tactoid_bipolarity
    unit: dimensionless
outputs:
  f_el:
    quantity: tactoid_elastic_shape_factor
    unit: dimensionless
settings:
  n_xi: 48
  n_eta: 24
stochastic: false
