id: tactoid_cylindrical_limit_scaling
name: cylindrical high-aspect-ratio surface area and volume scaling (x -> oo)
role: model
stated:
  page: 3
  quote: "surface area and volume scale as R2/x"
  where: "Methods, Quasi bipolar tactoid model"
equation: "S ~ R^2 / x = R * r; V ~ R^3 / x^2 = R * r^2"
prefactor: unknown
inputs:
  R:
    quantity: tactoid_semimajor_axis
    unit: um
  x:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
outputs:
  S:
    quantity: tactoid_surface_area
    unit: um**2
  V:
    quantity: tactoid_volume
    unit: um**3
settings: {}
stochastic: false
