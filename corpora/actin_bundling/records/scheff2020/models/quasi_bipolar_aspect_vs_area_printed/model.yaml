id: quasi_bipolar_aspect_vs_area_printed
name: equilibrium aspect ratio vs cross-sectional area from printed quasi bipolar model
role: model
described_from: ref-34
built_from:
  - quasi_bipolar_minimizer_printed
  - tactoid_geometry_from_semimajor
stated:
  page: 4
  quote: "compare the equilibrium aspect ratio vs. tactoid size"
  where: "Methods, Quasi bipolar tactoid model (p. 4 col 1, Fig. 5c, Fig. S1)"
equation: "x_eq(A; K/gamma, omega) from minimizing F/(gamma*V^(2/3)) subject to A_spindle(V, x_eq) = A"
inputs:
  A:
    quantity: droplet_cross_sectional_area
    unit: um**2
  K_over_gamma:
    quantity: nematic_distortion_length
    unit: um
  omega:
    quantity: anchoring_ratio
    unit: dimensionless
outputs:
  x_eq:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
  y_eq:
    quantity: tactoid_bipolarity
    unit: dimensionless
  V_eq:
    quantity: tactoid_volume
    unit: um**3
settings:
  n_xi: 48
  n_eta: 24
  xtol: 1.0e-6
stochastic: false
