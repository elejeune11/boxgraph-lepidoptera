id: quasi_bipolar_volume_factor_closed
name: closed-form nondimensional volume shape factor v(x) (Eq. 2D)
role: model
described_from: ref-34
stated:
  page: 3
  quote: "factors corresponding to surface area and volume"
  where: "Eq. (2D)"
equation: "v(x) = (pi / (2*x^3)) * (x + (2/3)*x^3 + x^5 - (x^2 - 1)*(x^2 + 1)^2 * tan^(-1)(x^(-1)))"
inputs:
  x:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
outputs:
  v:
    quantity: tactoid_volume_shape_factor
    unit: dimensionless
settings: {}
stochastic: false
