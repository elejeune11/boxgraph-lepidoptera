id: bispherical_scale_factors
name: bispherical coordinate metric scale factors h_phi, h_xi, h_eta, and Z
role: model
described_from: ref-34
stated:
  page: 3
  quote: "corresponding scale factors in the bispherical coordinate system"
  where: "Methods, Quasi bipolar tactoid model"
equation: "Z = 1 + sin(xi)*cos(eta); h_phi = sin(xi)*sin(eta)/Z; h_xi = 1/Z; h_eta = sin(xi)/Z"
inputs:
  xi:
    quantity: bispherical_angle_xi
    unit: rad
  eta:
    quantity: bispherical_angle_eta
    unit: rad
outputs:
  Z:
    quantity: bispherical_scale_factor
    unit: dimensionless
  h_phi:
    quantity: bispherical_scale_factor
    unit: dimensionless
  h_xi:
    quantity: bispherical_scale_factor
    unit: dimensionless
  h_eta:
    quantity: bispherical_scale_factor
    unit: dimensionless
settings: {}
stochastic: false
