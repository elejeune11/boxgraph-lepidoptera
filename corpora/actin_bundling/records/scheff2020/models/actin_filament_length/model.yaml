id: actin_filament_length
name: average actin filament length from actin and capping protein concentrations
role: model
described_from: ref-19
built_from:
  - actin_monomer_count
stated:
  page: 2
  quote: "filament length of 2.7 nm   [Actin]/[Capping Protein]"
  where: "Methods, Filament length"
equation: "L = 2.7 nm * [Actin] / [Capping Protein]"
inputs:
  d_mon:
    quantity: monomer_length_increment
    unit: nm
  c_actin:
    quantity: actin_concentration
    unit: uM
  c_cp:
    quantity: capping_protein_concentration
    unit: nM
outputs:
  L:
    quantity: actin_filament_length
    unit: nm
settings: {}
stochastic: false
