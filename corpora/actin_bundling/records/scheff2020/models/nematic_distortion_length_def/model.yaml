id: nematic_distortion_length_def
name: characteristic nematic distortion length scale K/gamma
role: processing
stated:
  page: 8
  quote: "characteristic nematic distortion length scale"
  where: "Results and discussion, p. 8 col 1"
equation: "R_c = K / gamma"
inputs:
  K:
    quantity: frank_elastic_constant
    unit: pN
  gamma:
    quantity: interfacial_tension
