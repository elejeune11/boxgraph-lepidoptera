id: tactoid_semimajor_from_volume
name: tactoid semi-major axis from fixed volume and aspect ratio
role: model
built_from:
  - quasi_bipolar_volume_factor_closed
stated:
  page: 3
  quote: "tactoid volume and aspect ratio, by using"
  where: "Methods, Quasi bipolar tactoid model"
equation: "R = (V / v(x))^(1/3)"
inputs:
  V:
    quantity: tactoid_volume
    unit: um**3
  x:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
outputs:
  R:
    quantity: tactoid_semimajor_axis
    unit: um
settings: {}
stochastic: false
