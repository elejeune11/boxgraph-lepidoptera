id: homogeneous_tactoid_minimizer
name: homogeneous (uniform director) small-droplet tactoid aspect ratio minimizer (R << K/gamma)
role: model
described_from: ref-20
built_from:
  - quasi_bipolar_surface_factor_closed
  - quasi_bipolar_volume_factor_closed
  - quasi_bipolar_anchoring_factor
stated:
  page: 8
  quote: "limit, the aspect ratio of the droplet is determined by"
  where: "Results and discussion, p. 8 col 1"
equation: "x_eq(omega) = argmin_{x>=1} [ (f_s(x) + omega * f_an(x, oo)) / v(x)^(2/3) ]"
from_words: true
inputs:
  omega:
    quantity: anchoring_ratio
    unit: dimensionless
outputs:
  x_eq:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
  F_nondim:
    quantity: tactoid_free_energy_nondim
    unit: dimensionless
settings:
  n_xi: 48
  xtol: 1.0e-8
stochastic: false
