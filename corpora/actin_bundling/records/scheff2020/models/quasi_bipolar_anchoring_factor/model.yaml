id: quasi_bipolar_anchoring_factor
name: nondimensional surface anchoring energy factor f_an(x, y) (Eq. 2C)
role: model
described_from: ref-34
built_from:
  - bispherical_boundary_angle
  - bispherical_scale_factors
  - quasi_bipolar_factor_N
stated:
  page: 3
  quote: "related to the nematic elastic energy and the anchoring"
  where: "Eq. (2C)"
equation: "f_an(x, y) = int_0^{2*pi} dphi int_0^{pi} dxi (h_phi * h_xi)|_{eta=eta_0} * (4*N)^(-1) * (y^2 - 1)^2 * cos^2(xi) * sin^2(eta_0)"
inputs:
  x:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
  y:
    quantity: tactoid_bipolarity
    unit: dimensionless
outputs:
  f_an:
    quantity: tactoid_anchoring_shape_factor
    unit: dimensionless
settings:
  n_xi: 48
stochastic: false
