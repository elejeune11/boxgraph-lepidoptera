id: quasi_bipolar_free_energy_exact_bend
name: total quasi bipolar tactoid free energy F(R; x, y) with exact bend term
role: model
described_from: ref-34
variant_of: quasi_bipolar_free_energy_printed
corrections:
  - equation: "Eq. (2B)"
    change: "Replace printed bend term sin^2(xi)*cos^2(eta) with exact sin^2(xi)*sin^2(eta)"
    evidence: "Exact differentiation of the quasi-bipolar director field yields (curl n)^2 = sin^2(xi)*sin^2(eta)/N (ref. 34), vanishing at the symmetry axis eta = 0."
built_from:
  - quasi_bipolar_surface_factor_closed
  - quasi_bipolar_elastic_factor_exact_bend
  - quasi_bipolar_anchoring_factor
stated:
  page: 3
  quote: "write the total free energy in terms of the aspect ratio"
  where: "Eq. (1)"
equation: "F(R; x, y) = K * R * f_el_exact(x, y) + gamma * R^2 * (f_s(x) + omega * f_an(x, y))"
inputs:
  R:
    quantity: tactoid_semimajor_axis
    unit: um
  x:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
  y:
    quantity: tactoid_bipolarity
    unit: dimensionless
  K:
    quantity: frank_elastic_constant
    unit: pN
  gamma:
    quantity: interfacial_tension
    unit: "pN/um"
  omega:
    quantity: anchoring_ratio
    unit: dimensionless
outputs:
  F:
    quantity: tactoid_free_energy
    unit: "pN*um"
settings:
  n_xi: 48
  n_eta: 24
stochastic: false
