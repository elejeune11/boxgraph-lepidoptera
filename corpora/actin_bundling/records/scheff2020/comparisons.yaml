# Exact consistency / reproduction of capping protein mole fraction and filament length predictions
- id: cmp_cp_mol_pct_low
  purpose: reproduction
  computed: cp_mol_pct_low_calc
  printed: cp_mol_pct_low
  note: "50 nM capping protein in 5 uM actin stock equals 1 mol% capping protein (p. 2 & p. 6)."

- id: cmp_cp_mol_pct_high
  purpose: reproduction
  computed: cp_mol_pct_high_calc
  printed: cp_mol_pct_high
  note: "150 nM capping protein in 5 uM actin stock equals 3 mol% capping protein (p. 2 & p. 6)."

- id: cmp_filament_length_270nm_conc
  purpose: reproduction
  computed: length_50nM_pred
  printed: filament_length_270nm
  note: "L = 2.7 nm * (5 uM / 50 nM) = 270 nm vs printed ~270 nm (approximate, no precision)."

- id: cmp_filament_length_270nm_mol
  purpose: reproduction
  computed: length_1pct_pred
  printed: filament_length_270nm
  note: "L = 2.7 nm / 1 mol% = 270 nm vs printed ~270 nm."

- id: cmp_filament_length_135nm_conc
  purpose: reproduction
  computed: length_100nM_pred
  printed: filament_length_135nm
  note: "L = 2.7 nm * (5 uM / 100 nM) = 135 nm vs printed ~135 nm (100 nM added as midpoint of 50–150 nM range)."

- id: cmp_filament_length_135nm_mol
  purpose: reproduction
  computed: length_2pct_pred
  printed: filament_length_135nm
  note: "L = 2.7 nm / 2 mol% = 135 nm vs printed ~135 nm (2 mol% added as midpoint of 1–3 mol%)."

- id: cmp_filament_length_90nm_conc
