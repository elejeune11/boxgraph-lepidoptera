# Quasi bipolar model consistency checks against printed qualitative claims & across variants
- id: cmp_90nm_med_printed_vs_claimed
  purpose: validation
  computed: x_area_printed_90nm_med
  printed: aspect_ratio_90nm_claimed
  note: "Printed quasi-bipolar model with fitted K/gamma = 1.2 um, omega = 0.2 at A = 15 um^2 predicts x_eq ~ 1.22 vs prose claim 'aspect ratios ~1' (p. 6 col 2) and sphere threshold < 1.1 (p. 7)."

- id: cmp_90nm_med_exact_bend_vs_claimed
  purpose: validation
  computed: x_area_exact_90nm_med
  printed: aspect_ratio_90nm_claimed
  note: "Exact-bend variant with fitted K/gamma = 1.2 um, omega = 0.2 at A = 15 um^2."

- id: cmp_90nm_med_frank_half_vs_claimed
  purpose: validation
  computed: x_area_frank_90nm_med
  printed: aspect_ratio_90nm_claimed
  note: "Exact-bend + Frank 1/2 variant with fitted K/gamma = 1.2 um, omega = 0.2 at A = 15 um^2."

- id: cmp_135nm_large_printed_vs_upper_bound
  purpose: consistency
  computed: x_area_printed_135nm_large
  printed: observed_aspect_ratio_upper
  note: "Checks equilibrium aspect ratio at A = 25 um^2 (L ~ 135 nm best fit) against stated R/r < 2.5 range."

- id: cmp_135nm_large_exact_bend_vs_upper_bound
  purpose: consistency
  computed: x_area_exact_135nm_large
  printed: observed_aspect_ratio_upper
  note: "Exact-bend variant at A = 25 um^2 (L ~ 135 nm best fit) against stated R/r < 2.5 range."

- id: cmp_135nm_large_frank_half_vs_upper_bound
  purpose: consistency
  computed: x_area_frank_135nm_large
  printed: observed_aspect_ratio_upper
  note: "Exact-bend + Frank 1/2 variant at A = 25 um^2 (L ~ 135 nm best fit) against stated R/r < 2.5 range."

- id: cmp_270nm_small_printed_vs_upper_bound
  purpose: consistency
  computed: x_area_printed_270nm_small
  printed: observed_aspect_ratio_upper
  note: "Checks equilibrium aspect ratio at A = 5 um^2 (L ~ 270 nm best fit: K/gamma = 1.7 um, omega = 2.8) against stated R/r < 2.5 (predicts ~3.0, exceeding 2.5)."

- id: cmp_270nm_small_exact_bend_vs_upper_bound
  purpose: consistency
  computed: x_area_exact_270nm_small
  printed: observed_aspect_ratio_upper
  note: "Exact-bend variant at A = 5 um^2 (L ~ 270 nm best fit: K/gamma = 1.7 um, omega = 2.8) against stated R/r < 2.5 (also exceeds 2.5)."

- id: cmp_270nm_small_frank_half_vs_upper_bound
  purpose: consistency
  computed: x_area_frank_270nm_small
  printed: observed_aspect_ratio_upper
  note: "Exact-bend + Frank 1/2 variant at A = 5 um^2 (L ~ 270 nm best fit: K/gamma = 1.7 um, omega = 2.8) against stated R/r < 2.5 (also exceeds 2.5)."

