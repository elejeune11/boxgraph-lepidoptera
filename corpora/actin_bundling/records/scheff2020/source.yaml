  Key algebraic, numerical, and internal-consistency findings captured via printed
  models, evidenced variant_of corrected models, within-paper ModelAtlas relations,
  and open questions:
  (1) Misprinted bend term in Eq. (2B) (p. 3 col 2): printed f_el(x, y) writes
  (4 cos^2 xi + sin^2 xi cos^2 eta) / N, whereas exact differentiation of the
  quasi-bipolar director field in bispherical coordinates yields (div n)^2 =
  4 cos^2 xi / N and (curl n)^2 = sin^2 xi sin^2 eta / N (Prinsen & van der Schoot
  2004, ref. 34). At the straight central symmetry axis eta = 0 the bend must vanish
  (sin^2 0 = 0), whereas printed cos^2 0 = 1 yields spurious bend on-axis and only
  25% of the Williams (1985) ideal bipolar sphere bend energy (0.134 pi vs 0.533 pi).
  (2) Omitted Frank 1/2 prefactor in Eq. (1) + Eq. (2B) (p. 3): standard equal-constant
  Frank elasticity F_el = (K/2) int dV [(div n)^2 + (curl n)^2] yields 4 pi K R for
  splay in an ideal bipolar sphere (x = 1, y = 1); Eq. (2B) integrates over phi in
  [0, 2 pi] without 1/2 and Eq. (1) writes K R f_el(x, y), doubling F_el relative to
  the standard Frank constant K (both exact-bend and exact-bend+Frank-1/2 variants are
  included alongside the verbatim printed model).
  (3) Major scaling discrepancy between the printed quasi-bipolar model (Eqs. 1–2D with
  c = K/(gamma V^(1/3))) and the plotted theoretical curves in Fig. 5c and Fig. S1:
  under c = K/(gamma V^(1/3)) ~ A^(-1/2), any bipolar tactoid model decays as
  x - 1 ~ A^(-1/2) at large area and changes c by at most ~6-7x across A = 1 to 35 um^2,
  predicting x ~ 1.41–1.46 at A = 20 um^2 for L ~ 135 nm (K/gamma = 1.7 um, omega = 0.45)
  and x ~ 2.4–2.6 for L ~ 270 nm (K/gamma = 1.7 um, omega = 2.8) versus plotted values
  ~1.14 and ~1.20. Inspection of all plotted curves in Fig. 5c and Fig. S1 shows they
  instead decay as x - 1 ~ A^(-3/2) with elastic weight (K/gamma)^3 / V (missing the
  cube root on dimensionless volume V_tilde = V/(K/gamma)^3) and A = R*r = (V/v(x))^(2/3)/x
  (omitting pi), using the exact sin^2(eta) bend term without the 1/2 factor (matching
  all curves to RMS ~ 0.002–0.007 in aspect ratio). Flagged in questions.yaml for direct
  verification when Fig. 5c and Fig. S1 are digitized.
  (4) Abstract vs Results sign reversal (p. 1 vs p. 5 & Fig. 2d): the Abstract states
  that as filament dopant concentration increases "the coalescence time decreases",
  whereas p. 5 col 2 and Fig. 2d report that eta/gamma increases ~20-fold with actin
  concentration, which via tau ~ (eta/gamma) Delta l means coalescence time increases.
  (5) Minor textual/editorial inconsistencies: Eq. (2A) LHS prints f_s(x, y) although
  it is independent of y (Eq. 1 writes f_s(x)); Fig. 2c caption verbally reverses
  Delta l = sqrt(A_i) - sqrt(A_f) as "final and initial areas"; p. 6 col 2 claims
  L ~ 90 nm droplets "of all sizes have aspect ratios ~1" while p. 7 col 2, Fig. 4c,
  and Fig. S1 left show ellipsoids with aspect ratio up to ~1.3 below 8 um^2;
  references 4/36 and 24/47 are duplicated.
