- id: q_eq2b_bend_misprint
  kind: possible_error
  about:
    - quasi_bipolar_elastic_factor_printed
    - quasi_bipolar_elastic_factor_exact_bend
    - quasi_bipolar_minimizer_printed
  citation:
    page: 3
    quote: "related to the nematic elastic energy and the anchoring"
    where: "Eq. (2B)"
  text: >
    Eq. (2B) prints the nematic elastic integrand as N^(-1) * (4*cos^2(xi) + sin^2(xi)*cos^2(eta)).
    Exact differentiation of the quasi-bipolar director field tangent to circular arcs meeting at
    virtual poles (0, +-y*R) in bispherical coordinates yields (div n)^2 = 4*cos^2(xi)/N and
    (curl n)^2 = sin^2(xi)*sin^2(eta)/N (matching Prinsen & van der Schoot 2004, ref. 34). On the
    central symmetry axis eta = 0 the director is straight so bend must vanish (sin^2(0) = 0),
    whereas printed cos^2(0) = 1 introduces spurious on-axis bend and reduces the ideal bipolar
    sphere (x = 1, y = 1) bend energy by a factor of 4 (0.134*pi vs exact Williams 1985 value
    0.533*pi). Corrected via variant_of models quasi_bipolar_elastic_factor_exact_bend and
    downstream variants.

- id: q_eq1_eq2b_missing_frank_half
  kind: possible_error
  about:
    - quasi_bipolar_free_energy_printed
    - quasi_bipolar_elastic_factor_printed
    - quasi_bipolar_elastic_factor_frank_half
    - quasi_bipolar_minimizer_frank_half
  citation:
    page: 3
    quote: "write the total free energy in terms of the aspect ratio"
    where: "Eq. (1) and Eq. (2B)"
  text: >
    Standard equal-constant Frank elasticity (de Gennes & Prost, ref. 10; Williams 1985, ref. 35;
    Prinsen & van der Schoot 2004, ref. 34) defines F_el = (K/2) * int dV [(div n)^2 + (curl n)^2],
    giving F_splay = 4*pi*K*R for an ideal bipolar sphere (x = 1, y = 1). In Scheff et al. (2020),
    Eq. (2B) integrates over phi in [0, 2*pi] with integrand [(div n)^2 + (curl n)^2] without the
    factor of 1/2, and Eq. (1) writes F = K*R*f_el(x, y) + ..., effectively doubling F_el (giving
    8*pi*K*R for splay alone) or redefining K as K/2. Both the verbatim printed normalization and
    the standard Frank 1/2 variant (quasi_bipolar_*_frank_half) are included.

- id: q_fig5c_figS1_volume_scaling_discrepancy
  kind: possible_error
  about:
    - quasi_bipolar_free_energy_nondim_printed
    - quasi_bipolar_minimizer_printed
    - quasi_bipolar_aspect_vs_area_printed
    - K_over_gamma_90nm_best
    - K_over_gamma_135nm_best
    - K_over_gamma_270nm_best
    - omega_90nm_best
    - omega_135nm_best
    - omega_270nm_best
  citation:
    page: 4
    quote: "compare the equilibrium aspect ratio vs. tactoid size"
    where: "Methods p. 3–4, Fig. 5(c), Fig. 5(d), and Fig. S1 (p. 11)"
  text: >
    There is a major scaling discrepancy between the printed quasi-bipolar model (Eqs. 1–2D with
    dimensionless elastic weight c = K/(gamma*V^(1/3)) ~ A^(-1/2)) and all nine theoretical
    best-fit and bounding curves plotted in Fig. 5(c) and Fig. S1. Under c = K/(gamma*V^(1/3)),
    any bipolar tactoid model decays asymptotically as x - 1 ~ A^(-1/2) at large area, and across
    A = 1 to 35 um^2 the factor V^(1/3) increases by only ~6-7x; with the printed best-fit
    parameters (e.g. K/gamma = 1.7 um, omega = 0.45 for L ~ 135 nm; K/gamma = 1.7 um, omega = 2.8
    for L ~ 270 nm), the printed model predicts x_eq ~ 1.46 (1.41 with Frank 1/2) and x_eq ~ 2.4–2.6
    at A = 20 um^2, far above the plotted red curves (~1.14 and ~1.20). Direct inspection of the
    plotted curves across Fig. 5(c) and Fig. S1 shows they instead decay as x - 1 ~ A^(-3/2) and
    scale with (K/gamma)^3, matching (to RMS 0.001–0.007 in aspect ratio across all curves) a
    computation that replaces K/(gamma*V^(1/3)) = V_tilde^(-1/3) by V_tilde^(-1) = (K/gamma)^3 / V
    (omitting the cube root on dimensionless volume V_tilde = V/(K/gamma)^3), uses the exact
    sin^2(eta) bend term without the Frank 1/2 factor, and sets cross-sectional area A = R*r =
    (V/v(x))^(2/3)/x (omitting pi). Consequently, the extracted K/gamma values in Fig. 5(c), 5(d),
    and Fig. S1 do not follow from the printed Eqs. (1)–(2D); this will be tested quantitatively
    point by point once Fig. 5(c) and Fig. S1 are digitized in the digitize stage.

- id: q_abstract_coalescence_time_sign_reversal
  kind: possible_error
  about:
    - coalescence_relaxation_time_scaling
  citation:
    page: 1
    quote: "filament dopants increases, the coalescence time decreases"
    where: "Abstract (p. 1) vs Results (p. 5 col 2 & Fig. 2d)"
  text: >
    The Abstract (p. 1) states: "As the concentration of the filament dopants increases, the
    coalescence time decreases, indicating that the dopants control viscosity relative to surface
    tension." This directly contradicts Results p. 5 col 2 and Fig. 2(d), which report that the
    slope eta/gamma increases ~20-fold with actin concentration (from ~1 s/um at 0 uM to ~19 s/um
    at 1 uM). Because tau ~ (eta/gamma) * Delta l, increasing eta/gamma implies the coalescence
    relaxation time tau increases (slower coalescence), not decreases.

