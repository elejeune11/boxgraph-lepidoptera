    curves (108/108 points reproduced) across all three filament lengths to RMS 0.0014-0.0023
    (L ~ 90 nm), 0.0039-0.0044 (L ~ 135 nm), and 0.0062-0.0113 (L ~ 270 nm). Consequently, the
