# 1. Filament length & Onsager scaling runs
- id: run_monomer_count_low_cp
  model: actin_monomer_count
  inputs: {c_actin: actin_stock_conc, c_cp: cp_conc_low}
  outputs: {N_m: monomer_count_50nM_pred}

- id: run_monomer_count_high_cp
  model: actin_monomer_count
  inputs: {c_actin: actin_stock_conc, c_cp: cp_conc_high}
  outputs: {N_m: monomer_count_150nM_pred}

- id: run_cp_mol_pct_low
  model: capping_protein_mol_fraction
  inputs: {c_actin: actin_stock_conc, c_cp: cp_conc_low}
  outputs: {f_cp: cp_mol_pct_low_calc}

- id: run_cp_mol_pct_high
  model: capping_protein_mol_fraction
  inputs: {c_actin: actin_stock_conc, c_cp: cp_conc_high}
  outputs: {f_cp: cp_mol_pct_high_calc}

- id: run_length_from_conc_50nM
  model: actin_filament_length
  inputs: {d_mon: actin_monomer_rise, c_actin: actin_stock_conc, c_cp: cp_conc_low}
  outputs: {L: length_50nM_pred}

- id: run_length_from_conc_100nM
  model: actin_filament_length
  inputs: {d_mon: actin_monomer_rise, c_actin: actin_stock_conc, c_cp: cp_conc_mid_added}
  outputs: {L: length_100nM_pred}

- id: run_length_from_conc_150nM
  model: actin_filament_length
  inputs: {d_mon: actin_monomer_rise, c_actin: actin_stock_conc, c_cp: cp_conc_high}
  outputs: {L: length_150nM_pred}

- id: run_length_from_mol_1pct
  model: actin_filament_length_from_mol_fraction
  inputs: {d_mon: actin_monomer_rise, f_cp: cp_mol_pct_low}
  outputs: {L: length_1pct_pred}

- id: run_length_from_mol_2pct
  model: actin_filament_length_from_mol_fraction
  inputs: {d_mon: actin_monomer_rise, f_cp: cp_mol_pct_mid_added}
  outputs: {L: length_2pct_pred}

- id: run_length_from_mol_3pct
  model: actin_filament_length_from_mol_fraction
  inputs: {d_mon: actin_monomer_rise, f_cp: cp_mol_pct_high}
  outputs: {L: length_3pct_pred}

- id: run_filament_aspect_90nm
  model: filament_aspect_ratio
  inputs: {L: filament_length_90nm, D: actin_filament_diameter}
  outputs: {a_f: filament_aspect_90nm_calc}

- id: run_filament_aspect_135nm
  model: filament_aspect_ratio
  inputs: {L: filament_length_135nm, D: actin_filament_diameter}
  outputs: {a_f: filament_aspect_135nm_calc}

- id: run_filament_aspect_270nm
  model: filament_aspect_ratio
  inputs: {L: filament_length_270nm, D: actin_filament_diameter}
  outputs: {a_f: filament_aspect_270nm_calc}

- id: run_onsager_phi_90nm
  model: onsager_critical_volume_fraction
  inputs: {L: filament_length_90nm, D: actin_filament_diameter}
  outputs: {phi_c: onsager_phi_90nm_pred}

- id: run_onsager_phi_135nm
  model: onsager_critical_volume_fraction
  inputs: {L: filament_length_135nm, D: actin_filament_diameter}
  outputs: {phi_c: onsager_phi_135nm_pred}

- id: run_onsager_phi_270nm
  model: onsager_critical_volume_fraction
  inputs: {L: filament_length_270nm, D: actin_filament_diameter}
  outputs: {phi_c: onsager_phi_270nm_pred}

# 2. Partitioning & coalescence probe runs
- id: run_partition_ratio_probe
  model: partition_intensity_ratio
  inputs: {I_inside: probe_I_inside_added, I_outside: probe_I_outside_added}
  outputs: {P_I: partition_ratio_probe_calc}

- id: run_coalescence_decay_probe
  model: coalescence_area_decay
  inputs: {A_i: probe_coal_Ai_added, A_f: probe_coal_Af_added, t: probe_coal_t_added, tau: probe_coal_tau_added}
  outputs: {A: coal_area_probe_fit, A_norm: coal_norm_probe_fit}

- id: run_coalescence_master_probe
  model: coalescence_normalized_area
  inputs: {t_rescaled: probe_coal_t_rescaled_added}
  outputs: {A_norm: coal_master_probe_pred}

- id: run_coalescence_length_probe
  model: coalescence_relaxation_length
  inputs: {A_i: probe_coal_Ai_added, A_f: probe_coal_Af_added}
  outputs: {delta_l: coal_delta_l_probe_calc}

- id: run_coalescence_tau_scaling_probe
  model: coalescence_relaxation_time_scaling
  inputs: {eta_over_gamma: probe_eta_over_gamma_added, delta_l: probe_delta_l_added}
  outputs: {tau: coal_tau_probe_pred}

# 3. Quasi bipolar tactoid definitions, coordinates & geometric limits
- id: run_aspect_ratio_def_probe
  model: tactoid_aspect_ratio_def
  inputs: {R: probe_semimajor_axis_added, r: probe_semiminor_axis_added}
  outputs: {x: tactoid_x_probe_calc}

- id: run_bipolarity_def_probe
  model: tactoid_bipolarity_def
  inputs: {R_tilde: probe_virtual_pole_added, R: probe_semimajor_axis_added}
  outputs: {y: tactoid_y_probe_calc}

- id: run_anchoring_ratio_def_probe
  model: anchoring_ratio_def
  inputs: {gamma_A: probe_gamma_A_added, gamma: probe_gamma_added}
  outputs: {omega: omega_def_probe_calc}

- id: run_distortion_length_def_probe
  model: nematic_distortion_length_def
  inputs: {K: probe_K_added, gamma: probe_gamma_added}
  outputs: {R_c: K_over_gamma_def_probe_calc}

- id: run_bulk_to_surface_ratio_135nm
  model: bulk_to_surface_ratio_def
  inputs: {K_over_gamma: K_over_gamma_135nm_best, V: probe_volume_typical_added}
  outputs: {c: bulk_to_surface_c_135nm_calc}

- id: run_bispherical_angle_probe
  model: bispherical_boundary_angle
  inputs: {x: probe_aspect_ratio_added}
  outputs: {eta0: eta0_probe_pred}

- id: run_bispherical_scales_probe
  model: bispherical_scale_factors
  inputs: {xi: probe_xi_added, eta: probe_eta_added}
  outputs: {Z: Z_probe_pred, h_phi: h_phi_probe_pred, h_xi: h_xi_probe_pred, h_eta: h_eta_probe_pred}

- id: run_factor_N_probe
  model: quasi_bipolar_factor_N
  inputs: {xi: probe_xi_added, eta: probe_eta_added, y: probe_bipolarity_added}
  outputs: {N: N_probe_pred}

- id: run_fs_closed_sphere
  model: quasi_bipolar_surface_factor_closed
  inputs: {x: sphere_aspect_ratio_ref}
  outputs: {f_s: fs_closed_sphere_pred}

- id: run_fs_closed_probe
  model: quasi_bipolar_surface_factor_closed
  inputs: {x: probe_aspect_ratio_added}
  outputs: {f_s: fs_closed_probe_pred}

- id: run_fs_integral_probe
  model: quasi_bipolar_surface_factor_integral
  inputs: {x: probe_aspect_ratio_added}
  outputs: {f_s: fs_integral_probe_pred}

- id: run_v_closed_sphere
  model: quasi_bipolar_volume_factor_closed
  inputs: {x: sphere_aspect_ratio_ref}
  outputs: {v: v_closed_sphere_pred}

- id: run_v_closed_probe
  model: quasi_bipolar_volume_factor_closed
  inputs: {x: probe_aspect_ratio_added}
  outputs: {v: v_closed_probe_pred}

- id: run_v_integral_probe
  model: quasi_bipolar_volume_factor_integral
  inputs: {x: probe_aspect_ratio_added}
  outputs: {v: v_integral_probe_pred}

- id: run_tactoid_geom_probe
  model: tactoid_geometry_from_semimajor
  inputs: {R: probe_semimajor_axis_added, x: probe_aspect_ratio_added}
  outputs: {S: S_probe_pred, V: V_probe_pred, r: r_probe_pred, A_spindle: A_spindle_probe_pred, A_ellipse: A_ellipse_probe_pred}

- id: run_semimajor_from_vol_probe
  model: tactoid_semimajor_from_volume
  inputs: {V: probe_volume_typical_added, x: probe_aspect_ratio_added}
  outputs: {R: R_from_vol_probe_pred}

- id: run_cylindrical_scaling_probe
  model: tactoid_cylindrical_limit_scaling
  inputs: {R: probe_semimajor_axis_added, x: probe_aspect_ratio_added}
  outputs: {S: S_cyl_probe_pred, V: V_cyl_probe_pred}

- id: run_sphere_geometry_probe
  model: sphere_geometry
  inputs: {R: probe_semimajor_axis_added}
  outputs: {S: S_sphere_probe_pred, V: V_sphere_probe_pred}

- id: run_energy_size_scaling_probe
  model: tactoid_energy_size_scaling
  inputs: {R: probe_semimajor_axis_added, K: probe_K_added, gamma: probe_gamma_added}
  outputs: {F_s: F_s_scaling_probe_pred, F_el: F_el_scaling_probe_pred}

# 4. Quasi bipolar anchoring, elastic integrals & free energy (printed + corrected variants)
