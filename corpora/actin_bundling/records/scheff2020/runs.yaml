  inputs: {V: probe_volume_typical_added, x: probe_aspect_ratio_added, y: probe_bipolarity_added, K_over_gamma: K_over_gamma_135nm_best, omega: omega_135nm_best}
  outputs: {F_nondim: F_nondim_printed_probe_pred}

