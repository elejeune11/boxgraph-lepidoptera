    (2019, SI Theory 3 Eq. 6) circular-arc bipolar tactoid volume V = 2*pi*R_arc^3*(sin(alpha) -
    alpha*cos(alpha) - sin^3(alpha)/3) into one verified ModelAtlas family across all three
    Gardel/Weirich tactoid papers under R_arc = R*(x^2+1)/(2*x) and alpha = 2*atan(1/x).
  assumptions:
    - "Exact circular-arc to bispherical coordinate dictionary; V in bipolar_tactoid_geometry_eq6 is independent of K and gamma (set to nominal 1.0 pN and 300.0 nN/m)."

