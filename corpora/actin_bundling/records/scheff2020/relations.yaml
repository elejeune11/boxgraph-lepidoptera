# ==========================================================================
# Cross-record ModelAtlas relations with weirich2017
# (Weirich, Banerjee, Dasbiswas, Witten, Vaikuntanathan & Gardel,
#  PNAS 114(9):2131-2136, 2017; cited by scheff2020 as ref-19)
#
# Audit summary (44 runnable scheff2020 x 52 runnable weirich2017 models):
# - 3 stated same_as relations explicitly citing ref-19: capping-protein
#   filament length formula (p. 2), normalized single-exponential coalescence
#   master curve (p. 5), and viscous-capillary coalescence time scaling (p. 5).
# - 4 proposed non-plain same_as relations forming exact ModelAtlas families:
#   circular-arc spindle tactoid surface area S <-> A and volume V <-> V
#   under the exact coordinate map R_arc = R*(x^2+1)/(2*x), alpha = 2*atan(1/x),
#   and the homogeneous tactoid equilibrium minimizer (both x_eq <-> aspect_ratio
#   and F_nondim <-> F_hat_min).
# - 3 proposed reduces_to limits proving that scheff2020's quasi-bipolar
#   free energy (y -> oo), nondimensional free energy (y -> oo), and full
#   quasi-bipolar minimizer (V -> 0) reduce identically to weirich2017's
#   homogeneous tactoid theory.
# - 2 proposed scales_as relations linking scheff2020's coalescence scaling
#   to weirich2017's isotropic energy balance and variational shape ODE.
# - Explicitly excluded: the scheduler-flagged pair
#   quasi_bipolar_free_energy_exact_bend vs capillary_energy_cost_corrected
#   (spurious shape match: positive total spindle-tactoid free energy vs
#   sign-changing O(u^2) Rayleigh-Plateau perturbation energy of a cylinder).
# ==========================================================================

