    alpha: "2 * atan(1 / x)"
  output_map:
    V: V
  regime:
    R: [0.5, 10.0]
    x: [1.05, 8.0]
  provenance: proposed
  reason: >
    Under the exact coordinate transformation R_arc = R*(x^2 + 1)/(2*x) and alpha = 2*atan(1/x)
    between bispherical semi-axis coordinates (R, x) in Scheff et al. (2020, Eq. 2D) and
    circular-arc coordinates (R_arc, alpha) in Weirich et al. (2017, SI p. 8), the tactoid volume
    V = R^3 * v(x) is algebraically identical to 2*pi*R_arc^3*(sin(alpha) - alpha*cos(alpha) -
    (1/3)*sin^3(alpha)).
  assumptions:
    - "Exact circular-arc to bispherical coordinate dictionary: alpha = 2*atan(1/x) and R_arc = R*(x^2 + 1)/(2*x)."

- id: rel_weirich2017_homogeneous_min_ar_same_as
  kind: same_as
  a: scheff2020/homogeneous_tactoid_minimizer
  b: weirich2017/tactoid_equilibrium_minimizer
  mapping:
    omega: "omega"
  output_map:
    aspect_ratio: x_eq
  regime:
    omega: [0.1, 10.0]
  tolerance: 1.0e-5
  provenance: proposed
  reason: >
    In the small-droplet homogeneous-director limit (y -> oo, R << K/gamma), Scheff et al. (2020,
    p. 8 col 1) minimize (f_s(x) + omega*f_an(x, oo)) / v(x)^(2/3) numerically over aspect ratio x
    (homogeneous_tactoid_minimizer), which is identically the same variational problem as Weirich
    et al. (2017, SI p. 8, tactoid_equilibrium_minimizer) minimizing F_hat(alpha, omega) over tip
    angle alpha = 2*atan(1/x). Across omega in [0.1, 10], equilibrium aspect ratios agree to < 1e-6.
  assumptions:
    - "Identical dimensionless Rapini-Papoular anchoring ratio omega = gamma_A / gamma in both records."

- id: rel_weirich2017_homogeneous_min_F_same_as
  kind: same_as
  a: scheff2020/homogeneous_tactoid_minimizer
  b: weirich2017/tactoid_equilibrium_minimizer
  mapping:
