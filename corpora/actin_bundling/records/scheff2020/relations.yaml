- id: rel_graham2023_ring_rod_reduces_qb_sphere
  kind: reduces_to
  a: graham2023/ring_rod_transition_energy
  b: scheff2020/quasi_bipolar_free_energy_frank_half
  mapping:
    R: "R"
    x: "1.0"
    y: "1.5"
    K: "0.0"
    gamma: "gamma_I / (2 * R)"
    omega: "0.0"
  output_map:
    F: E_surf
  limit:
    AR: "1"
  regime:
    R: [0.5, 3.5]
    L: [0.5, 2.5]
    k_b: [73000.0, 1500000.0]
    gamma_I: [1.0, 15.0]
    AR: [1.0, 10.0]
  tolerance: 1.0e-4
  provenance: proposed
  reason: >
    In the circular/spherical limit (AR -> 1), Graham et al.'s (2023, SI Section 2.11) 2D
    elliptical VASP droplet interfacial surface energy E_surf = gamma_I_2D * P(R, AR) reduces
    identically to 2*pi*R*gamma_I_2D, which equals Scheff et al.'s (2020, Eq. 1) 3D droplet
    interfacial free energy F = 4*pi*R^2*gamma_3D in the isotropic pure-protein-droplet limit
    (x = 1, K = 0, omega = 0) under the exact diameter-projected 2D-to-3D tension dictionary
    gamma_3D [pN/um] = gamma_I_2D [pN] / (2*R [um]) (with automatic pN*nm <-> pN*um conversion).
  assumptions:
    - "Circular droplet limit AR -> 1 matched to pure isotropic spherical condensate (x = 1, K = 0, omega = 0; y = 1.5 irrelevant when K = omega = 0)."
    - "Diameter-projected 2D-to-3D interfacial tension dictionary gamma_3D = gamma_I_2D / (2*R)."

