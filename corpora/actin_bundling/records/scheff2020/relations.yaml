    nematic actin elasticity (K -> 0) and anisotropic anchoring (omega -> 0) while approaching a
    spherical droplet (x -> 1) reduces Scheff's 3D free energy F identically to Graham et al.'s
    (2023) circular 2D droplet surface energy E_surf = 2*pi*R*gamma_I_2D with gamma_I_2D = 2*R*gamma.
  assumptions:
    - "Pure isotropic spherical condensate limit K -> 0, omega -> 0, x -> 1."
    - "Diameter-projected 2D line tension gamma_I_2D [pN] = 2*R [um] * gamma [pN/um]; L = R and k_b = 73000 pN*nm^2 do not affect E_surf."

- id: rel_graham2023_slsqp_reduces_qb_sphere
  kind: reduces_to
