#   diagnostic not_verified; 0 same_as families) bridging 2D elliptical
#   droplet mechanics in graham2023 to 3D quasi-bipolar tactoid geometry and
#   energetics in scheff2020:
#   * Mutual circular/spherical isotropic surface-energy reductions (2) and
#     SLSQP ring-vanishing T_ring -> 0 reduction (1) under gamma_3D = gamma_2D/(2*R).
#   * 2D-vs-3D isotropic surface-energy approximation within 5.20% over
#     AR in [1.01, 3.0] (1) and diagnostic AR^(1/2) vs AR^(1/3) dimensionality
#     exponent gap (1, honest not_verified).
