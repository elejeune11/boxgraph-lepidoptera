#   * Coalescence single-exponential decay scaling between scheff2020/
#     coalescence_area_decay.A_norm and feigeles2025's corrected Fig. S6B
#     decay (verified) vs misprinted exp(-tau/t) Fig. S6B equation (honest
#     not_verified).
#   * Coalescence viscocapillary timescale scaling between feigeles2025/
#     coalescence_capillary_velocity_figS6C.inv_v_cap and scheff2020/
#     coalescence_relaxation_time_scaling.tau in (eta, gamma).
#   * Fiber-free pure-FUS spherical droplet limit: feigeles2025/
#     unduloid_ode_eq3_lhs.aspect_ratio_eq (R_f -> 0, c -> 0) reduces to
#     scheff2020/homogeneous_tactoid_minimizer.x_eq (omega = 0, AR = 1).
# ==========================================================================

- id: rel_feigeles2025_coal_decay_corr_scales_area_norm
  kind: scales_as
  a: scheff2020/coalescence_area_decay
  b: feigeles2025/coalescence_exponential_decay_figS6B_corrected
  mapping:
    L_i: "1.0"
    L_f: "0.0"
    tau: "tau"
    t: "t"
  output_map:
    L: A_norm
  regime:
    A_i: [10.0, 40.0]
    A_f: [5.0, 25.0]
    t: [0.5, 40.0]
    tau: [2.0, 25.0]
  provenance: proposed
  reason: >
    Both Weirich/Gardel-group studies model the coalescence relaxation of Hyman-lab FUS-GFP
    protein condensates as a single exponential exp(-t/tau): Scheff et al. (2020, p. 5, Fig. 2b)
    fit cross-sectional area A(t) = A_f + (A_i - A_f)*exp(-t/tau) (normalized A_norm = exp(-t/tau)),
    while Feigeles et al. (2025, SI Fig. S6B, corrected variant) fit major-axis length
    L(t) = L_f + (L_i - L_f)*exp(-t/tau). Setting unit amplitude (L_i = 1 um, L_f = 0) verifies
    identical (-t/tau, +t/tau) log-slopes in (t, tau) across both non-trivial coalescence models.
  assumptions:
    - "Compares Feigeles's corrected Fig. S6B exponential decay (exp(-t/tau)) with zero baseline (L_f = 0, L_i = 1 um) against Scheff's normalized exponential decay A_norm = exp(-t/tau); scales_as is unit-invariant."

- id: rel_feigeles2025_coal_decay_printed_vs_area_norm_diagnostic
  kind: scales_as
  a: scheff2020/coalescence_area_decay
  b: feigeles2025/coalescence_exponential_decay_figS6B_printed
  mapping:
    L_i: "1.0"
    L_f: "0.0"
    tau: "tau"
    t: "t"
  output_map:
    L: A_norm
  regime:
    A_i: [10.0, 40.0]
    A_f: [5.0, 25.0]
    t: [0.5, 40.0]
    tau: [2.0, 25.0]
  provenance: proposed
  reason: >
    Diagnostic contrast against Feigeles et al.'s (2025, SI p. 14) verbatim printed Fig. S6B
    inset formula L = L_i + (L_i - L_f)*exp(-tau/t), which inverted the exponent to -tau/t and
    replaced the L_f baseline by L_i. Honestly not_verified: log-slopes in (t, tau) have opposite
    signs and different functional forms from Scheff et al.'s (2020) standard exp(-t/tau) decay.
  assumptions:
    - "Same mapping as rel_feigeles2025_coal_decay_corr_scales_area_norm applied to Feigeles's verbatim printed equation."

- id: rel_feigeles2025_inv_vcap_scales_coal_tau
  kind: scales_as
  a: feigeles2025/coalescence_capillary_velocity_figS6C
  b: scheff2020/coalescence_relaxation_time_scaling
  mapping:
    eta_over_gamma: "eta / gamma"
    delta_l: "1.0"
  output_map:
    tau: inv_v_cap
  regime:
    eta: [0.5, 20.0]
    gamma: [1.0, 120.0]
  provenance: proposed
  reason: >
    Both papers extract the FUS-GFP condensate viscocapillary timescale ratio eta/gamma [s/um]
    from linear coalescence scaling between relaxation time tau and characteristic length change
    Delta l: Scheff et al. (2020, p. 5, Fig. 2c-d) plot tau vs Delta l = sqrt(A_i) - sqrt(A_f)
    to extract slope eta/gamma directly, whereas Feigeles et al. (2025, SI Fig. S6C) plot
    Delta L vs tau (extracting capillary velocity gamma/eta and printing eta/gamma in the caption).
    Verifies exact (+1, -1) log-slopes in (viscosity eta, surface tension gamma) across FUS
    condensate regimes (with 1 Pa*s / (1 uN/m) = 1 s/um).
  assumptions:
    - "Fixed characteristic coalescence relaxation length delta_l = 1 um isolates the viscocapillary ratio eta/gamma."

- id: rel_feigeles2025_unduloid_ode_reduces_iso_sphere
  kind: reduces_to
  a: feigeles2025/unduloid_ode_eq3_lhs
  b: scheff2020/homogeneous_tactoid_minimizer
  mapping:
    omega: "0.0"
  output_map:
    x_eq: aspect_ratio_eq
  limit:
    R_f: "0"
    c: "0"
  regime:
    R_f: [0.05, 0.2]
    R_b: [0.8, 1.5]
    DeltaP_over_2sigma: [0.25, 0.5]
    c: [0.01, 0.1]
  tolerance: 1.0e-3
  provenance: proposed
  reason: >
    Unifies the two opposite actin-FUS condensate topologies in their common actin-free pure-FUS
    limit: Feigeles et al. (2025, p. 8 Eq. 3) integrate the 3D Young-Laplace unduloid ODE for a
    FUS droplet wetting an external rigid actin bundle of radius R_f (with aspect ratio defined as
    width/length <= 1), while Scheff et al. (2020, p. 8) minimize the 3D nematic tactoid free
    energy for a FUS droplet containing internal actin filaments (aspect ratio length/width >= 1).
    When the external bundle vanishes (R_f -> 0, unduloid constant c -> 0, spherical cap of radius
    1/(DeltaP/(2*sigma)) in [2, 4] um > R_b), Feigeles's unduloid ODE reduces to a free spherical
    FUS droplet (aspect_ratio_eq -> 1.000), matching Scheff's actin-free isotropic limit
    (omega = 0, x_eq = 1.000).
  assumptions:
    - "Fiber-free spherical-cap limit R_f -> 0, c -> 0 with cutoff radius R_b in [0.8, 1.5] um strictly inside the sphere radius 1/(DeltaP/(2*sigma)) in [2, 4] um."
    - "Tolerance 1e-3 accounts for the ~4e-4 numerical integration floor of feigeles2025/unduloid_ode_eq3_lhs near the spherical apex."

