- id: rel_weirich2017_tactoid_ode_iso_scales_coal_tau
  kind: scales_as
  a: scheff2020/coalescence_relaxation_time_scaling
  b: weirich2017/tactoid_shape_dynamics_ode
  mapping:
    omega: "0.001"
    v_cap: "1 / eta_over_gamma"
    L_eq: "2 * delta_l"
    L_i: "3 * delta_l"
    t_max: "10 * eta_over_gamma * delta_l"
  output_map:
    tau: tau
  regime:
    eta_over_gamma: [0.5, 25.0]
    delta_l: [0.5, 5.0]
  provenance: proposed
  reason: >
    Connects Scheff et al.'s (2020, p. 5) isotropic viscocapillary coalescence relaxation scaling
    tau ~ (eta/gamma) * Delta_l to Weirich et al.'s (2017, SI p. 9) full nonlinear Rayleigh-dissipation
    variational shape-dynamics ODE (dF/dt + D = 0 at constant volume) in the near-isotropic limit
    (omega = 0.001). For geometrically similar coalescing droplets (L_eq = 2*delta_l, L_i = 3*delta_l,
    giving L_i - L_eq = delta_l), Weirich's variational ODE yields tau = 0.9563 * (eta/gamma) * delta_l,
    sharing exact (+1, +1) log-slopes in (eta/gamma, delta_l) with Scheff's scaling law.
  assumptions:
    - "Near-isotropic droplet limit omega = 0.001 with fixed initial-to-final elongation ratio L_i/L_eq = 1.5 and scaled integration window t_max = 10 * (eta/gamma) * delta_l."

- id: rel_weirich2017_iso_energy_balance_scales_coal_tau
