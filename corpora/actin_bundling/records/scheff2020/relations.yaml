    Theory 3 Eq. 6: F_bare = K*R_arc*f_el(alpha) + gamma*R_arc^2*f_s(alpha) with f_el(alpha) =
    -pi*(7*alpha*cos(alpha) - 7*sin(alpha) + alpha^2*sin(alpha))) across all aspect ratios x > 1
    and all anchoring strengths omega (since f_an(x, 1) = 0 identically).
  assumptions:
    - "Ideal bipolar limit y = R_tilde/R -> 1 places the virtual boojums on the tactoid cusps, making the director strictly tangent to the boundary (f_an -> 0)."
    - "Uses identical Frank constant K [pN] and converts gamma [pN/um] to weirich2019's gamma [nN/m] = 1000 * gamma."

