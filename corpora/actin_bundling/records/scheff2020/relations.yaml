  tolerance: 1.0e-4
  provenance: proposed
  reason: >
    Bridges Graham et al.'s (2023) flagship discrete 2D SLSQP droplet-ring free-energy minimizer
    (droplet_ring_minimization_corrected) to Scheff et al.'s (2020) 3D free energy functional
    (quasi_bipolar_free_energy_frank_half): in the bare-droplet limit T_ring -> 0 (eliminating
    the encapsulated actin ring's mechanical and wetting energies), SLSQP relaxes the VASP droplet
    to a circle of minimized total_energy = pi*D_droplet*gamma_I_2D, matching Scheff's isotropic
    pure-condensate sphere F = 4*pi*(D_droplet/2)^2*gamma_3D under gamma_3D = gamma_I_2D / D_droplet.
  assumptions:
    - "Actin-free limit T_ring -> 0 in droplet_ring_minimization_corrected paired with K = 0, omega = 0, x = 1 in quasi_bipolar_free_energy_frank_half."
    - "Benchmarked over Graham's Fig. 4f-g diameter range D_droplet in [0.5, 1.5] um and line-tension range gamma_I in [1, 15] pN."

- id: rel_graham2023_2d_ellipse_approx_3d_iso_tactoid
  kind: approximated_by
  a: graham2023/ring_rod_transition_energy
  b: scheff2020/quasi_bipolar_free_energy_frank_half
  mapping:
    R: "R * (8 * AR**3 / (3 * (AR + (2/3)*AR**3 + AR**5 - (AR**2 - 1)*(AR**2 + 1)**2 * atan(1/AR))))**(1/3)"
    x: "AR"
    y: "1.5"
    K: "0.0"
    gamma: "gamma_I / (2 * R)"
    omega: "0.0"
  output_map:
    F: E_surf
  regime:
    R: [0.5, 3.5]
    L: [0.5, 2.5]
    k_b: [73000.0, 1500000.0]
    gamma_I: [1.0, 15.0]
    AR: [1.01, 3.0]
  tolerance: 0.06
  provenance: proposed
  reason: >
    Quantifies the exact 2D-vs-3D dimensionality error of Graham et al.'s (2023) constant-area 2D
    elliptical surface energy E_surf(R, AR) relative to Scheff et al.'s (2020) constant-volume 3D
    isotropic spindle surface energy F(R_sm, x=AR, K=0, omega=0) matched at equal spherical
    volume V = (4*pi/3)*R^3 (setting R_sm = R * ((4*pi/3)/v(AR))^(1/3)) and sphere-matched tension
    gamma_3D = gamma_I_2D / (2*R). Across Scheff's entire experimental aspect-ratio range
    AR in [1.01, 3.0], the 2D perimeter model approximates the 3D spindle surface energy within
    5.20% (0.91% at AR = 1.5, 2.34% at AR = 2.0, 5.20% at AR = 3.0) before diverging at Graham's
    high-aspect-ratio rod regime (AR > 10).
  assumptions:
    - "Purely isotropic droplet surface energy comparison (K = 0, omega = 0) at matched 3D volume V = (4*pi/3)*R^3 and aspect ratio x = AR."
    - "6% tolerance bounds the 5.20% maximum relative error at AR = 3.0."

