- id: rel_weirich2017_tactoid_surface_same_as
  kind: same_as
  a: scheff2020/tactoid_geometry_from_semimajor
  b: weirich2017/tactoid_geometry_circular_arc
  mapping:
    R: "R * (x**2 + 1) / (2 * x)"
    alpha: "2 * atan(1 / x)"
  output_map:
    A: S
  regime:
    R: [0.5, 10.0]
    x: [1.05, 8.0]
  provenance: proposed
  reason: >
    Both papers model a spindle tactoid as the exact same solid of revolution of a circular arc
    about its chord (following Kaznacheev et al. 2002 and Prinsen & van der Schoot 2003/2004).
    Scheff et al. (2020) parameterize the surface area in bispherical coordinates by semi-major
    axis R = L/2 and aspect ratio x = R/r (S = R^2 * f_s(x), Eq. 2A), while Weirich et al. (2017)
    parameterize it by generating arc radius R_arc and half-opening angle alpha (A = 4*pi*R_arc^2*
    (sin(alpha) - alpha*cos(alpha)), SI p. 8). Under the exact geometric change of variables
    R_arc = R*(x^2 + 1)/(2*x) and alpha = 2*atan(1/x) = eta_0, the two surface areas are
    algebraically identical to machine precision.
  assumptions:
    - "Exact circular-arc to bispherical coordinate dictionary: alpha = eta_0 = 2*atan(1/x) and R_arc = R / sin(alpha) = R*(x^2 + 1)/(2*x)."

- id: rel_weirich2017_tactoid_volume_same_as
  kind: same_as
  a: scheff2020/tactoid_geometry_from_semimajor
  b: weirich2017/tactoid_geometry_circular_arc
  mapping:
