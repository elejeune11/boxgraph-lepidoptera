    F_hat_min: F_nondim
  regime:
    omega: [0.1, 10.0]
  tolerance: 1.0e-6
  provenance: proposed
  reason: >
    Verifies that not only the equilibrium aspect ratio but also the minimized nondimensional
    homogeneous tactoid free energy F/(gamma * V^(2/3)) in Scheff et al. (2020) equals F_hat_min
    in Weirich et al. (2017) to machine precision (~1e-15) across omega in [0.1, 10], confirming
    that the y -> oo limit of Scheff's Eq. (2C) bispherical anchoring integral equals Weirich's
    closed-form Rapini-Papoular anchoring factor A_omega = 2*pi*R_arc^2*g(alpha) with prefactor 1.
  assumptions:
    - "Identical normalization F / (gamma * V^(2/3)) and identical dimensionless anchoring ratio omega = gamma_A / gamma."

- id: rel_weirich2017_qb_free_energy_reduces_homogeneous
  kind: reduces_to
  a: scheff2020/quasi_bipolar_free_energy_printed
  b: weirich2017/tactoid_free_energy
  mapping:
    R: "R * (x**2 + 1) / (2 * x)"
    alpha: "2 * atan(1 / x)"
    gamma_I: "1000 * gamma"
    gamma_A: "1000 * gamma * omega"
  output_map:
    F: F
  limit:
    y: "oo"
  regime:
    R: [0.5, 10.0]
    x: [1.05, 6.0]
    y: [1.5, 10.0]
    K: [0.5, 5.0]
    gamma: [0.1, 2.0]
    omega: [0.1, 5.0]
  tolerance: 1.0e-5
  provenance: proposed
  reason: >
    As the virtual defect poles recede to infinity (y = R_tilde/R -> oo), the quasi-bipolar
    director field becomes strictly uniform along the major axis, driving the bulk Frank elastic
    shape factor f_el(x, y) -> 0 (for both printed and exact-bend variants) while R^2*f_an(x, y)
    converges identically to Weirich et al.'s (2017, SI p. 8) closed-form anchoring area A_omega.
    Hence Scheff's full dimensional Eq. (1) free energy reduces identically to Weirich's homogeneous
    tactoid free energy F = gamma_I*A + gamma_A*A_omega (with 1 pN/um = 1000 nN/m and automatic
    pN*um <-> J conversion).
  assumptions:
    - "Uniform-director limit y -> oo eliminates bulk elasticity (f_el -> 0) and maps anchoring tension gamma_A = omega * gamma."

