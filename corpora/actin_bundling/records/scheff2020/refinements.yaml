# Minimization & quadrature convergence for equilibrium tactoid shape solvers
- id: ref_min_printed_n_xi
  run: run_min_printed_135nm_V10
  setting: n_xi
  factors: [1, 2]
  mode: multiply
  output: x_eq
  tolerance: "0.05%"
  tolerance_basis: "added: verifies equilibrium aspect ratio x_eq is converged with respect to xi quadrature resolution"
  tolerance_added: true

- id: ref_min_printed_xtol
  run: run_min_printed_135nm_V10
  setting: xtol
  factors: [1, 10, 100]
  mode: divide
  output: x_eq
  tolerance: "0.05%"
  tolerance_basis: "added: verifies optimizer tolerance convergence of equilibrium aspect ratio x_eq"
  tolerance_added: true

- id: ref_min_exact_bend_xtol
