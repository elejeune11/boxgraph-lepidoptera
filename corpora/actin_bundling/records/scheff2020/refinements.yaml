# Quadrature convergence for integral Eq. (2A) surface factor
- id: ref_fs_integral_n_xi
  run: run_fs_integral_probe
  setting: n_xi
  factors: [1, 2, 4]
  mode: multiply
  output: f_s
  tolerance: "0.01%"
  tolerance_basis: "added: tight quadrature convergence tolerance for Eq. (2A) surface integral well below experimental precision"
  tolerance_added: true

