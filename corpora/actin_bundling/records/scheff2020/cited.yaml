# Cross-record citation provenance links from scheff2020 values to paired records
# in corpora/actin_bundling/records/ (weirich2017, weirich2019, graham2023, feigeles2025).
#
# Full audit of all 95 datums in scheff2020/data.yaml and all 50 references in
# scheff2020/references.yaml:
# 1. weirich2017 (cited as ref-19, source: weirich2017):
#    - `actin_monomer_rise` ('2.7 nm', Methods p. 2, `from_source: ref-19`) is linked
#      below to `weirich2017/actin_monomer_spacing_si` ('~2.7 nm', SI p. 7 / SI-1).
#    - Results p. 8 qualitatively notes that K/gamma is "a few microns, similar to
#      estimates from pure actin tactoids [19]" without printing a numeric K/gamma
#      value from weirich2017 (weirich2017 itself does not print K or K/gamma; the
#      ~3.3 um ratio first appears numerically in weirich2019 SI p. 9).
#    - `actin_filament_diameter` ('~8 nm', p. 8) carries no ref-19 citation and
#      differs from weirich2017's 7 nm filament diameter (r = 3.5 nm).
# 2. weirich2019 (cited as ref-42, source: weirich2019):
#    - Cited once qualitatively on p. 9 col 1 ("template for droplet-scale spatial
#      structure.42-45"); 0 numerical datums in scheff2020/data.yaml come from weirich2019.
# 3. graham2023 (2023) and feigeles2025 (2025):
#    - Both post-date scheff2020 (2020), so 0 scheff2020 datums cite them. (Note:
#      feigeles2025/data.yaml records `short_actin_length_scheff2020 = "~100 nm"`
#      citing scheff2020 as ref-35, an order-of-magnitude paraphrase of scheff2020's
#      ~90, ~135, and ~270 nm conditions rather than a verbatim printed datum;
#      feigeles2025 is frozen outside this record's scope.)

- datum: actin_monomer_rise
  from_datum: actin_monomer_spacing_si
  evidence: "Methods, Filament length (p. 2, citing ref-19 Weirich et al. 2017) states 'the known value of ~1 monomer per 2.7 nm in a filament, leading to average filament length of 2.7 nm * [Actin]/[Capping Protein]', directly matching weirich2017/actin_monomer_spacing_si ('~2.7 nm', SI p. 7 / SI-1: 'monomer per 2.7 nm.')."
