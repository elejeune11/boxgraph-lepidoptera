- id: actin_concentration
  name: actin monomer concentration
  dimension: "[substance]/[length]**3"
  description: Molar concentration of actin monomers (polymerized into filaments or stock solution)

- id: capping_protein_concentration
  name: capping protein concentration
  dimension: "[substance]/[length]**3"
  description: Molar concentration of capping protein used to regulate actin filament length

- id: capping_protein_mole_fraction
  name: capping protein mole fraction
  dimension: "dimensionless"
  description: Molar ratio [Capping Protein]/[Actin] controlling mean actin filament length

- id: fus_concentration
  name: FUS-GFP concentration
  dimension: "[substance]/[length]**3"
  description: Bulk molar concentration of FUS-GFP protein forming condensates

- id: kcl_concentration
  name: KCl salt concentration
  dimension: "[substance]/[length]**3"
  description: Monovalent KCl salt concentration before or after mixing to trigger FUS phase separation

- id: monomer_length_increment
  name: actin monomer axial length increment
  dimension: "[length]"
  description: Axial length per actin monomer in an F-actin filament (2.7 nm per monomer)

- id: monomers_per_filament
  name: average monomers per actin filament
  dimension: "dimensionless"
  description: Mean number of actin monomers in a capped filament, approximated as [Actin]/[Capping Protein]

- id: actin_filament_length
  name: average actin filament length
  dimension: "[length]"
  description: Mean length L of pre-polymerized capped actin filaments

- id: actin_filament_diameter
  name: actin filament diameter
  dimension: "[length]"
  description: Cross-sectional diameter D of an actin filament (~8 nm)

- id: filament_aspect_ratio
  name: actin filament aspect ratio
  dimension: "dimensionless"
  description: Ratio of actin filament length to diameter, L/D

- id: nematic_critical_volume_fraction
  name: Onsager critical volume fraction
  dimension: "dimensionless"
  description: Critical rod volume fraction phi_c for isotropic-to-nematic transition scaling inversely with L/D

- id: fluorescence_intensity
  name: fluorescence intensity
  dimension: "dimensionless"
  description: Background-corrected or normalized fluorescence intensity inside or outside droplets

- id: partition_intensity_ratio
  name: actin partitioning intensity ratio
  dimension: "dimensionless"
  description: Ratio of average actin fluorescence intensity inside a droplet to exterior bulk solution, I_inside/I_outside

- id: time
  name: elapsed time
  dimension: "[time]"
  description: Elapsed time t during droplet coalescence or sample incubation

- id: rescaled_time
  name: rescaled coalescence time
  dimension: "dimensionless"
  description: Time normalized by characteristic coalescence relaxation time, t/tau

- id: coalescence_relaxation_time
  name: coalescence relaxation time
  dimension: "[time]"
  description: Characteristic exponential relaxation timescale tau of droplet cross-sectional area during coalescence

- id: droplet_cross_sectional_area
  name: droplet cross-sectional area
  dimension: "[length]**2"
  description: Midplane cross-sectional area A of a composite droplet (initial A_i, final A_f, or steady-state A)

- id: normalized_coalescence_area
  name: normalized coalescence area
  dimension: "dimensionless"
  description: Rescaled cross-sectional area (A - A_f)/(A_i - A_f) during droplet coalescence

- id: coalescence_relaxation_length
  name: coalescence relaxation length
  dimension: "[length]"
  description: Characteristic length change Delta l = sqrt(A_i) - sqrt(A_f) during droplet coalescence

- id: inverse_capillary_velocity
  name: viscosity to surface tension ratio
  dimension: "[time]/[length]"
  description: Ratio of droplet viscosity to interfacial tension, eta/gamma, extracted as the slope of tau vs Delta l

- id: tactoid_semimajor_axis
  name: tactoid semi-major axis
  dimension: "[length]"
  description: Half-length R of the major axis of a spindle tactoid droplet

- id: tactoid_semiminor_axis
  name: tactoid semi-minor axis
  dimension: "[length]"
  description: Half-width r of the minor axis of a spindle tactoid droplet

- id: virtual_defect_half_distance
  name: virtual defect half-distance
  dimension: "[length]"
  description: Half-distance R_tilde between virtual boojum poles outside a quasi bipolar tactoid

- id: tactoid_aspect_ratio
  name: droplet aspect ratio
  dimension: "dimensionless"
  description: Ratio of major to minor axes x = R/r of a tactoid or composite droplet

- id: tactoid_bipolarity
  name: director bipolarity parameter
  dimension: "dimensionless"
  description: Ratio y = R_tilde/R characterizing director bipolarity (y = 1 ideal bipolar; y -> oo homogeneous)

- id: bispherical_angle_xi
  name: bispherical coordinate xi
  dimension: "dimensionless"
  description: Polar-like bispherical coordinate xi in (0, pi)

- id: bispherical_angle_eta
  name: bispherical coordinate eta
  dimension: "dimensionless"
  description: Radial-like bispherical coordinate eta in (0, eta_0)

- id: bispherical_boundary_angle
  name: tactoid boundary bispherical angle
  dimension: "dimensionless"
  description: Boundary value eta_0 = 2 arctan(1/x) defining the tactoid surface in bispherical coordinates

- id: bispherical_scale_factor
  name: bispherical metric scale factor
  dimension: "dimensionless"
  description: Nondimensional bispherical coordinate metric scale factor (h_phi, h_xi, h_eta, or denominator Z)

- id: quasi_bipolar_factor_N
  name: quasi bipolar director factor N
  dimension: "dimensionless"
  description: Nondimensional denominator factor N(xi, eta, y) appearing in elastic and anchoring integrands (Eqs. 2B–2C)

- id: tactoid_surface_area
  name: tactoid 3D surface area
  dimension: "[length]**2"
  description: Three-dimensional surface area S = R^2 f_s(x) of a spindle tactoid

- id: tactoid_volume
  name: tactoid volume
  dimension: "[length]**3"
  description: Three-dimensional volume V = R^3 v(x) of a tactoid droplet

- id: tactoid_surface_shape_factor
  name: nondimensional surface area shape factor
  dimension: "dimensionless"
  description: Nondimensional surface area factor f_s(x) = S/R^2 in Eq. (2A)

- id: tactoid_elastic_shape_factor
  name: nondimensional elastic shape factor
  dimension: "dimensionless"
  description: Nondimensional bulk nematic elastic energy factor f_el(x, y) in Eq. (2B)

- id: tactoid_anchoring_shape_factor
  name: nondimensional anchoring shape factor
  dimension: "dimensionless"
  description: Nondimensional surface anchoring energy factor f_an(x, y) in Eq. (2C)

- id: tactoid_volume_shape_factor
  name: nondimensional volume shape factor
  dimension: "dimensionless"
  description: Nondimensional volume factor v(x) = V/R^3 in Eq. (2D)

- id: frank_elastic_constant
  name: nematic Frank elastic constant
  dimension: "[force]"
  description: Equal-constant nematic Frank elastic constant K for splay and bend deformations

- id: interfacial_tension
  name: isotropic droplet surface tension
  dimension: "[force]/[length]"
  description: Isotropic interfacial tension gamma of the composite FUS-actin droplet interface

- id: surface_anchoring_strength
  name: anisotropic surface anchoring tension
  dimension: "[force]/[length]"
  description: Anisotropic surface anchoring energy per unit area gamma_A penalizing director misalignment with the interface

- id: anchoring_ratio
  name: dimensionless surface anchoring strength
  dimension: "dimensionless"
  description: Dimensionless ratio omega = gamma_A/gamma of anisotropic surface anchoring to isotropic surface tension

- id: nematic_distortion_length
  name: nematic distortion length scale
  dimension: "[length]"
  description: Characteristic balance length scale K/gamma comparing bulk nematic elasticity to isotropic surface tension

- id: bulk_to_surface_energy_ratio
  name: dimensionless bulk-to-surface energy ratio
  dimension: "dimensionless"
  description: Nondimensional parameter K/(gamma V^(1/3)) controlling equilibrium tactoid shape for fixed volume V

- id: tactoid_free_energy
  name: tactoid total free energy
  dimension: "[energy]"
  description: Total bulk nematic elastic plus isotropic and anisotropic interfacial free energy F(R; x, y) (Eq. 1)

- id: tactoid_free_energy_nondim
  name: nondimensional tactoid free energy
  dimension: "dimensionless"
  description: Total tactoid free energy normalized by isotropic surface energy scale, F/(gamma V^(2/3))

- id: shape_occurrence_fraction
  name: droplet shape occurrence fraction
  dimension: "dimensionless"
  description: Fraction (or percentage) of droplets classified as tactoids, ellipsoids, or spheres

- id: droplet_count
  name: droplet sample size
  dimension: "dimensionless"
  description: Number of droplets n measured in a population distribution

- id: midplane_profile_distance
  name: droplet midplane profile distance
  dimension: "[length]"
  description: Spatial distance along a confocal fluorescence line scan across the droplet midplane (Fig. 1c)
