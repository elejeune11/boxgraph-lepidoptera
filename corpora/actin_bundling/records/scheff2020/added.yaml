- id: probe_I_outside_added
  quantity: fluorescence_intensity
  unit: dimensionless
  printed: "1"
  basis: "Reference exterior bulk fluorescence intensity set to unity to probe the partitioning ratio I_inside/I_outside."
  alternatives: ["0.5", "2"]
  stands_for: "Average exterior actin fluorescence intensity I_outside"

