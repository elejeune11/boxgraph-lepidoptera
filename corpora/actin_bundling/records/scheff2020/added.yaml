  stands_for: "Aspect ratio x = R/r"

- id: probe_bipolarity_added
  quantity: tactoid_bipolarity
  unit: dimensionless
  printed: "1.5"
  basis: "Representative finite quasi-bipolar parameter y = R_tilde/R > 1 used to probe Eqs. (2B), (2C), and N away from the y = 1 ideal-bipolar boundary."
  alternatives: ["1.1", "3.0"]
  stands_for: "Bipolarity parameter y = R_tilde/R"

- id: probe_semimajor_axis_added
  quantity: tactoid_semimajor_axis
  unit: um
  printed: "2.0"
  basis: "Representative micron-scale tactoid semi-major axis R matching experimental droplets of area ~5–15 um^2 (Figs. 3–5)."
  alternatives: ["1.0", "4.0"]
  stands_for: "Semi-major axis R in Eq. (1)"

- id: probe_semiminor_axis_added
  quantity: tactoid_semiminor_axis
  unit: um
  printed: "1.0"
  basis: "Representative semi-minor axis r yielding x = R/r = 2.0 when paired with R = 2.0 um."
  alternatives: ["0.8", "1.5"]
  stands_for: "Semi-minor axis r"

- id: probe_virtual_pole_added
  quantity: virtual_defect_half_distance
  unit: um
  printed: "3.0"
  basis: "Representative virtual boojum pole half-distance R_tilde > R yielding y = R_tilde/R = 1.5 when paired with R = 2.0 um."
  alternatives: ["2.2", "6.0"]
  stands_for: "Virtual defect half-distance R_tilde"

- id: probe_xi_added
  quantity: bispherical_angle_xi
  unit: rad
  printed: "0.7"
  basis: "Interior test angle xi in (0, pi) chosen to exercise bispherical scale factors and director normalization factor N."
  alternatives: ["1.0", "1.5"]
  stands_for: "Bispherical angle xi"

- id: probe_eta_added
  quantity: bispherical_angle_eta
  unit: rad
  printed: "0.5"
  basis: "Interior test angle eta in (0, eta_0) chosen to exercise bispherical scale factors and director normalization factor N."
  alternatives: ["0.3", "0.8"]
  stands_for: "Bispherical angle eta"

- id: probe_gamma_added
  quantity: interfacial_tension
  unit: "pN/um"
  printed: "1.0"
  basis: "Representative order-of-magnitude interfacial tension gamma = 1 pN/um = 1 uN/m (FUS / protein condensates are typically 0.1–10 uN/m; pure actin droplets in ref. 19 are ~0.3 uN/m); used only to probe dimensional Eq. (1) and ratio definitions since Scheff et al. do not measure gamma independently."
  alternatives: ["0.3", "5.0"]
  stands_for: "Isotropic interfacial tension gamma in Eq. (1)"

- id: probe_K_added
  quantity: frank_elastic_constant
  unit: pN
  printed: "1.7"
  basis: "Chosen as K = (K/gamma) * gamma = 1.7 pN when paired with K/gamma = 1.7 um (Fig. 5c best fit for L ~ 135 nm) and gamma = 1.0 pN/um; Scheff et al. measure only the ratio K/gamma."
  alternatives: ["0.51", "8.5"]
  stands_for: "Frank elastic constant K in Eq. (1)"

- id: probe_gamma_A_added
  quantity: surface_anchoring_strength
  unit: "pN/um"
  printed: "0.45"
  basis: "Chosen as gamma_A = omega * gamma = 0.45 pN/um when paired with omega = 0.45 (Fig. 5c best fit for L ~ 135 nm) and gamma = 1.0 pN/um; Scheff et al. measure only the ratio omega = gamma_A/gamma."
  alternatives: ["0.135", "2.25"]
  stands_for: "Anisotropic surface anchoring strength gamma_A"

- id: probe_I_inside_added
  quantity: fluorescence_intensity
  unit: dimensionless
  printed: "30"
  basis: "Representative interior fluorescence intensity yielding I_inside/I_outside = 30 within the stated ~25–40 partitioning ratio range (p. 4) when I_outside = 1."
  alternatives: ["25", "40"]
