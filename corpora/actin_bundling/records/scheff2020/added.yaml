  basis: "Midpoint of the stated 50–150 nM capping protein range (p. 2) in 5 uM actin stock, giving 2 mol% capping protein and L = 2.7 nm * (5 uM / 100 nM) = 135 nm as reported in Figs. 1d, 3e, 3f, 5c, and Movie S2."
