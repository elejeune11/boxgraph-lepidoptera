# Cross-record validation evaluating Mechanism 4b (bare Helfrich membrane-mediated bundling of
# protruding actin filaments, Liu et al. 2008) against micron-scale Lepidoptera actin bundle
# spacing in Lloyd et al. (2024).

- id: val_geometric_merge_200nm_vs_lloyd2024_blue
  model: filament_geometric_merge_bounds
  inputs:
    L: L_contour_bundling_added
  output: D_max
  against: lloyd2024/actin_bundle_spacing_blue
  purpose: validation
  quantities:
    "lloyd2024/actin_bundle_spacing": filament_base_separation
  conditions_ok: >
    Mechanism 4b (bare membrane-induced bundling without curved-protein recruitment): evaluates
    Liu et al. (2008) SI p. 3's upper-bound quarter-circle geometric capture distance
    D_max = 4*L/pi at Liu's baseline protruding filament contour length L = 200 nm
    (L_contour_bundling_added -> D_max = 254.6 nm = 0.255 um) against Lloyd et al. (2024)'s
    iridescent blue Heliconius sara pupal actin bundle spacing (1.07 +/- 0.02 um, Fig. 2K).
  basis: >
    Tests whether bare lipid-membrane-mediated filament attraction (Liu et al. 2008) can span
    micron-scale inter-bundle spacings in butterfly wing scales, or whether it is strictly a
    local sub-micron filament-bundling mechanism.
  note: >
    Computes D_max = 0.2546 um (254.6 nm) vs 1.07 +/- 0.02 um (-0.815 um, -76.2%, 4.20x smaller;
    not reproduced). Reaching 1.07 um via bare membrane-induced merging alone would require
    free uncrosslinked filament arcs of contour length L >= pi*1.07/4 = 840 nm deflecting by
    535 nm against membrane bending, whereas membrane-mediated attraction in Liu 2008 operates
    on local ~50-250 nm scales (nucleating individual bundles rather than spacing them at >1 um).
