# ==========================================================================
# 1. Reproduction of filament count from SI Section D force balance (SI p. 9, p. 790)
# ==========================================================================
- id: cmp_N_filaments_si
  purpose: reproduction
  computed: N_from_20pN_3pN
  printed: N_filaments_si
  note: "Dividing the paper's f_mem = 20 pN by fitted f_fil = 3 pN yields N = 6.67 (~7) filaments, whereas SI p. 9 states 'approximately 10' (~10, approximate so no verdict)."

- id: cmp_N_filaments_main
  purpose: reproduction
  computed: N_from_20pN_3pN
  printed: N_filaments_main
  note: "Same force-balance filament count N = 6.67 compared against main text p. 790 '~10 filaments'."

- id: cmp_N_filaments_from_sectionA_force
  purpose: consistency
  computed: N_from_eq_low_sigma
  printed: N_filaments_si
  note: "Using the equilibrium tube pulling force (11.55 pN) implied by Section A's own kappa = 20 k_B*T and sigma = 0.005 k_B*T/nm^2 yields only N = 3.85 filaments at 3 pN/filament."

# ==========================================================================
# 2. Order-of-magnitude buckling threshold and membrane resistance checks (p. 791)
# ==========================================================================
- id: cmp_f_buckle_bundle_order
  purpose: reproduction
  computed: f_buckle_bundle_20um
  printed: f_buckle_order_main
  note: "Classical Euler buckling threshold for L = 20 um and N = 10 uncrosslinked filaments (L_p = 150 um) is 3.80 fN (0.38 fN for a single filament; 2.64 fN at L = 24 um), matching 'of the order of femtonewtons' (10^0 fN, order-of-magnitude -> no verdict)."

- id: cmp_f_mem_eq_order_low
  purpose: reproduction
  computed: f_mem_eq_low_sigma
  printed: f_mem_order_main
  note: "Equilibrium tube resistance force minimizing SI Eq. (8) for kappa = 20 k_B*T, sigma = 0.005 k_B*T/nm^2 is 11.55 pN (at 298 K), matching 'tens of piconewtons' (10^1 pN -> no verdict)."

# ==========================================================================
# 3. Cross-section consistency: Section A elastic constants vs Section D 20 pN
# ==========================================================================
- id: cmp_f_mem_eq_vs_20pN_low
  purpose: consistency
  computed: f_mem_eq_low_sigma
  printed: f_mem_common_si
  note: "Minimizing SI Eq. (8) with Section A's own kappa = 20 k_B*T and sigma = 0.005 k_B*T/nm^2 gives f_mem,eq = 11.55 pN (11.6-12.0 pN for 298-310 K), nearly a factor of 2 below the 20 pN membrane resistance assumed in Section D."

- id: cmp_f_mem_eq_vs_20pN_high
  purpose: consistency
  computed: f_mem_eq_high_sigma
  printed: f_mem_common_si
  note: "Minimizing SI Eq. (8) at Fig. s2's higher tension sigma = 0.02 k_B*T/nm^2 gives f_mem,eq = 23.10 pN (at 298 K), closer to (though slightly above) the 20 pN value used in Section D."

# ==========================================================================
