- id: kBT_added
  quantity: thermal_energy
  unit: pN*nm
  printed: "4.11"
  basis: "Thermal energy k_B*T at room temperature (298 K); the paper expresses elastic constants and Eqs. (1)-(2), (5), (7), (12) in units of k_B*T without stating temperature T."
  alternatives: ["4.14", "4.28"]
  stands_for: "k_B*T in SI Eqs. (1), (2), (5), (7), (8), (12)"

- id: theta_quarter_circle_added
  quantity: filament_bend_angle
  unit: dimensionless
  printed: "1.5707963267948966"
  basis: "Quarter-circle bending angle pi/2 rad corresponding to the maximum lateral deflection geometry described on SI p. 3 ('a filament deformed into the shape of a quarter circle')."
  alternatives: ["0.7853981633974483", "1.0471975511965976"]
  stands_for: "total angular deflection theta = L / R_c of the constant-curvature arc in Fig. s1"

- id: L_contour_bundling_added
  quantity: filament_contour_length
  unit: nm
  printed: "200"
  basis: "Representative single-filament contour length L = L_0 + L_prot^B = 100 nm + 100 nm = 200 nm at the branch-limited protrusion length in Fig. 3a (L_0 = 100 nm, L - L_0 = 100 nm)."
  alternatives: ["180", "230"]
  stands_for: "L in SI Eqs. (2)-(3) and Fig. s1"

- id: D_base_bundling_added
  quantity: filament_base_separation
  unit: nm
  printed: "40"
  basis: "Representative filament base separation D within the plotted range (20-100 nm) of Fig. 3a."
  alternatives: ["20", "80"]
  stands_for: "D in SI Eq. (3) and Fig. s1"

- id: x_deflection_bundling_added
  quantity: filament_lateral_deflection
  unit: nm
  printed: "15"
  basis: "Representative lateral tip deflection x = (D - d_merge)/2 = (40 - 10)/2 = 15 nm bringing two filaments anchored at D = 40 nm to the 10 nm merging threshold."
  alternatives: ["5", "35"]
  stands_for: "x in SI Eq. (3) and Fig. s1"

- id: L_long_protrusion_added
  quantity: filament_contour_length
  unit: um
  printed: "20"
  basis: "Representative long protrusion contour length within the measured stationary range (1-25 um, p. 790) and comparable to Fig. 1a and Fig. 1d (~24 um) used to evaluate the femtonewton Euler buckling threshold claim (p. 791)."
  alternatives: ["10", "24"]
  stands_for: "L for the long protrusion in Fig. 1a (p. 791) and SI Eqs. (4)-(11)"

- id: a_buckling_small_added
  quantity: buckling_amplitude
  unit: nm
  printed: "10"
  basis: "Small lateral buckling amplitude a satisfying a/L << 1 (a/L = 5e-4 at L = 20 um) required by the small-amplitude expansion in SI Eqs. (4)-(11)."
  alternatives: ["1", "100"]
  stands_for: "a in SI Eqs. (4)-(11)"

- id: s_midpoint_added
  quantity: arc_length_coordinate
  unit: um
  printed: "10"
  basis: "Midpoint arc-length coordinate s = L/2 for evaluating the sinusoidal cantilever mode SI Eq. (4) at L = 20 um."
  alternatives: ["0", "20"]
  stands_for: "s in SI Eq. (4)"

- id: N_bundle_buckling_added
  quantity: filament_number
  unit: dimensionless
  printed: "10"
  basis: "Typical filament count (~10, p. 790 & SI p. 9) used to evaluate uncrosslinked bundle persistence length L_p = N * L_p1 in the Euler buckling analysis."
  alternatives: ["1", "7"]
  stands_for: "N in uncrosslinked parallel filament bundle persistence length L_p = N * L_p1"

- id: f_comp_test_added
  quantity: compressive_force
  unit: pN
  printed: "20"
  basis: "External compressive force equal to the common 20 pN membrane resistance force (SI p. 9) used to evaluate classical Euler buckling SI Eqs. (6)-(7)."
  alternatives: ["11.55", "1"]
  stands_for: "f_comp in SI Eqs. (6)-(7)"

- id: I_t_sample_added
  quantity: fluorescence_intensity
  unit: dimensionless
  printed: "0.5"
  basis: "Representative mid-polymerization normalized fluorescence intensity I(t) for evaluating SI Eq. (13); raw fluorescence intensity traces are not tabulated."
  alternatives: ["0.0", "1.0"]
  stands_for: "I(t) in SI Eq. (13)"

- id: I_inf_sample_added
  quantity: fluorescence_intensity
  unit: dimensionless
  printed: "1.0"
  basis: "Asymptotic normalized fluorescence intensity I(infinity) = 1.0 defining the denominator of SI Eq. (13)."
  alternatives: ["0.95", "1.05"]
  stands_for: "I(infinity) in SI Eq. (13)"

- id: L_mem_0_dimless_added
  quantity: dimensionless_protrusion_length
  unit: dimensionless
  printed: "2.6"
  basis: "Illustrative dimensionless initial length for evaluating printed SI Eq. (12) (no initial conditions L_mem(t_0) are tabulated in the paper; 2.6 matches the visual initial length in um of the red trace in Fig. s6)."
  alternatives: ["1.0", "5.0"]
  stands_for: "L_mem(t_0) in printed dimensionless SI Eq. (12)"

- id: int_c0_dimless_added
  quantity: dimensionless_concentration_time_integral
  unit: dimensionless
  printed: "150"
  basis: "Illustrative dimensionless concentration-time integral for evaluating printed SI Eq. (12) (Fig. s5 concentration curve is not tabulated; ~150 s is the approximate visual integral from t_0 ~ 250 s)."
  alternatives: ["100", "200"]
  stands_for: "integral_{t_0}^t c_0(t') dt' in printed dimensionless SI Eq. (12)"

- id: L_mem_0_phys_added
  quantity: membrane_tube_length
  unit: um
  printed: "2.6"
  basis: "Illustrative physical initial protrusion length for evaluating the dimensionally restored variant of SI Eq. (12)."
  alternatives: ["1.0", "5.0"]
  stands_for: "L_mem(t_0) in dimensionally restored SI Eq. (12)"

- id: int_c0_phys_added
  quantity: concentration_time_integral
  unit: s
  printed: "150"
  basis: "Illustrative physical time integral of c_0(t) for evaluating the dimensionally restored variant of SI Eq. (12)."
  alternatives: ["100", "200"]
  stands_for: "integral_{t_0}^t c_0(t') dt' in dimensionally restored SI Eq. (12)"

- id: L_star_added
  quantity: characteristic_diffusion_length
  unit: um
  printed: "1.0"
  basis: "Unstated characteristic monomer diffusion length L_* = D*A/(N*k_on) required for dimensional homogeneity of SI Eq. (12) (of order 0.2-10 um in Mogilner & Rubinstein 2005)."
  alternatives: ["0.25", "10.0"]
  stands_for: "omitted characteristic length scale L_* in SI Eq. (12)"

- id: v_0_added
  quantity: unconstrained_polymerization_velocity
  unit: um/s
  printed: "0.25"
  basis: "Unstated unconstrained barbed-end polymerization velocity v_0 = delta * k_on * a_0 required for dimensional homogeneity of SI Eq. (12) (~0.23-0.27 um/s for delta = 2.7 nm, k_on ~ 10-11.6 uM^-1 s^-1, a_0 ~ 8.5 uM)."
  alternatives: ["0.20", "1.0"]
  stands_for: "omitted characteristic velocity scale v_0 in SI Eq. (12)"

- id: c0_const_ode_added
  quantity: normalized_actin_concentration
  unit: dimensionless
  printed: "0.5"
  basis: "Constant dimensionless free G-actin concentration used to verify RK4 numerical integration of the ODE implied by SI Eq. (12) against closed-form Eq. (12)."
  alternatives: ["0.25", "1.0"]
  stands_for: "c_0(t) in ODE verification of SI Eq. (12)"

- id: dt_total_ode_added
  quantity: dimensionless_time
  unit: dimensionless
  printed: "300"
  basis: "Dimensionless time interval chosen so c_0 * Delta_t = 150 matches int_c0_dimless_added for direct consistency check against closed-form SI Eq. (12)."
  alternatives: ["200", "400"]
  stands_for: "t - t_0 in ODE verification of SI Eq. (12)"
