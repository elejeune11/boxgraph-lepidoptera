notes: >
  In scope: the paper's complete quantitative core across both the main Nature Physics
  Letter (PDF pp. 1-5, journal pp. 789-793) and the Supplementary Information (PDF pp.
  6-16, SI pp. 1-11) — namely (i) Section A elastic membrane bundling model (SI Eqs. 1-3,
  Helfrich membrane energy minimized with Surface Evolver [non-runnable without script/BCs],
  worm-like chain constant-curvature circular-arc filament geometry and energy, and the
  quarter-circle geometric bounds x_max = 2L/pi and D_max = 4L/pi); (ii) Section C stability
  against Euler buckling (SI Eqs. 4-11, sinusoidal cantilever mode, bending energy Eq. 5
  verified by direct quadrature of WLC Eq. 2, compression energy Eq. 6 verified against exact
  inextensible shortening, Euler buckling force f_buckle = pi^2*k_B*T*L_p/(4*L^2), membrane
  tube force/energy Eq. 8 and its equilibrium minimization R_eq = sqrt(kappa/(2*sigma)) and
  f_mem,eq = 2*pi*sqrt(2*kappa*sigma), Case I shortening buckling Eqs. 9-10 and critical
  length L_buckle = sqrt(pi^2*k_B*T*L_p/(4*f_mem)), and Case II conformal membrane
  stabilization Eq. 11); (iii) Section D Mogilner-Rubinstein-based protrusion growth kinetics
  (SI Eqs. 12-13, printed dimensionless Eq. 12 verified by RK4 ODE integration, dimensionally
  restored variant with L_* and v_0, and filament count N = f_mem/f_fil from 20 pN / 3 pN);
  and (iv) primary quantitative experimental observables (vesicle protrusion prevalence,
  protrusion lengths and initial growth rate, Arp2/3 and osmotic frequency reductions, and
  standard protein reconstitution concentrations).
  Left out: routine experimental protocol/instrumentation numbers that feed no quantitative
  model — lipid mole percentages (p. 792, SI p. 10; composition discrepancy noted in
  questions.yaml), pre-incubation concentrations/times (4 uM N-WASP >= 10 min, 0.75 uM
  Cdc42/RhoGDI, 0.18 uM DH-PH, 0.5 uM GTPgammaS, 10-fold dilution, 1 mM ATP, 100 nM
  C5-C8 BODIPY, 300 nM AF488 CP after 30 min), osmolarity matching (5%, 1x-2x buffer),
  flow-chamber dimensions (0.1 mm x 5 mm x 20 mm), microscopy optics/laser settings (100x
  and 63x 1.25 NA, 18 mW 488/458 nm, 10 min FRAP monitoring), and Student's t-test p-values
  in Fig. s3 (* p = 0.159, ** p = 0.048, N = 3-4 samples of ~25 vesicles each; left for the
  downstream digitize stage together with Fig. s3 bar heights and SEM error bars).
  Figures cataloged (left for downstream digitize stage — no figure digitization done here):
  Fig. 1a (PDF p. 2, p. 790): phase-contrast and spinning-disc confocal micrographs of GUV
  membrane and actin protrusions (scale bar 5 um); micrograph only, no numeric plot.
  Fig. 1b (PDF p. 2, p. 790): confocal micrograph of AF555 actin and AF488 capping protein
  (scale bar 10 um); micrograph only, no numeric plot.
  Fig. 1c (PDF p. 2, p. 790): numeric line plot of normalized fluorescence intensity (0.5-2.5
  a.u.) vs normalized position (0-1.0) for Actin (red, n = 7), Arp2/3/Actin (black, n = 4),
  and CP/Actin (blue, n = 3); digitize candidate (measured curves).
  Fig. 1d (PDF p. 2, p. 790): left, phase-contrast time-lapse micrographs (5-30 min, scale
  bar 3 um); right, numeric plot of protrusion Length (8-24 um) vs Time (0-25+ min) with
  membrane kymograph inset (scale bars 5 min, 3 um); right panel is a digitize candidate
  (measured trajectory).
  Fig. 2a (PDF p. 2, p. 790): confocal FRAP micrographs (Before bleach to 646 s, scale bar
  1 um); micrograph only, no numeric plot.
  Fig. 2b (PDF p. 2, p. 790): numeric plot of Delta_L (-0.1 to 0.2 um) vs Time (280-630+ s)
  for tip (blue), proximal bleach edge (black), and distal bleach edge (red); digitize
  candidate (measured trajectories).
  Fig. 3a (PDF p. 3, p. 791): numeric model phase diagram of base separation D (20-100 nm)
  vs protrusion length L - L_0 (40-180 nm) for sigma = 0.005 k_B*T/nm^2 with vertical lines
