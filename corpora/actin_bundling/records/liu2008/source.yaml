  Fig. s4 (PDF p. 13, SI p. 8): schematic of straight, Case I, and Case II buckling; no
  numeric plot.
  Fig. s5 (PDF p. 14, SI p. 9): numeric plot of Normalized actin concentration c_0(t)
  (0.0-1.0) vs Time (0-1600 s); digitize candidate (measured/interpolated input curve).
  Fig. s6 (PDF p. 14, SI p. 9): numeric plot of Length (0-12 um) vs Time (0-2000 s) for two
  protrusions (measured black squares and crosses) and model fits (red and blue lines) at
  3 pN/filament; digitize candidate (measured points + predicted curves).
  Fig. s7 (PDF p. 15, SI p. 10): numeric plot of Normalized intensity (0.48-0.52) vs Time
  (0-350 s) showing FRAP recovery (black circles) and single exponential fit (dotted red
  line); digitize candidate (measured points + fitted curve).
  Key quantitative and analytical findings:
  (1) SI Eqs. (4)-(11) Euler buckling derivation is completely exact: direct quadrature of
  WLC Eq. (2) on mode Eq. (4) reproduces Eq. (5) (factor 1/64, pi^4) to machine precision;
  exact inextensible shortening reproduces Eq. (6) (-1/16, pi^2) in the a/L << 1 limit; Eq. (7)
  reproduces f_buckle = pi^2*k_B*T*L_p/(4*L^2); Case I Eq. (10) yields L_buckle =
  sqrt(pi^2*k_B*T*L_p/(4*f_mem)) (verified from page-012.png; OCR dropped the square root);
  and Case II Eq. (11) lower bound equals E_bend > 0. For L = 20 um, f_buckle is 0.38 fN
  (single filament) and 3.8 fN (N = 10 uncrosslinked bundle), confirming "order of femtonewtons".
  (2) SI Eq. (12) is dimensionally inconsistent as printed: it sums dimensionless 1,
  L_mem(t_0)^2 ([length]^2), 2*L_mem(t_0) ([length]), and 2*exp(-f_mem*delta/(N*k_B*T))*
  integral c_0(t') dt' ([time], since Eq. 13 defines c_0 as dimensionless) without defining
  characteristic diffusion length L_* or polymerization velocity v_0 (or time scale t_* = L_*/v_0),
  and omits all kinetic fit parameters needed to reproduce Fig. s6. A dimensionally restored
  variant (filopodium_growth_eq12_dimensional) is provided alongside the printed dimensionless form.
  (3) Filament count arithmetic (SI p. 9): dividing f_mem = 20 pN by fitted f_fil = 3 pN gives
  N = 6.67 (~7), whereas the text reports "approximately 10" (~10), a 50% upward rounding.
  (4) Membrane resistance consistency: minimizing SI Eq. (8) with Liu et al.'s own Section A
  constants (kappa = 20 k_B*T, sigma = 0.005 k_B*T/nm^2, k_B*T = 4.11 pN*nm) gives R_eq =
  44.7 nm and f_mem,eq = 11.55 pN (11.6-12.0 pN for 298-310 K), nearly 2x lower than the
  20 pN value assumed in Section D (whereas Fig. s2's sigma = 0.02 k_B*T/nm^2 gives 23.1 pN).
  (5) Printed misprints/inconsistencies documented in questions.yaml: SI p. 4 writes
  "hyperosmotic solution (high sigma)" instead of "hypoosmotic solution (high sigma)"; SI p. 7
  calls tube radius R in Eq. (8) "the filopodium diameter R" (and SI p. 2 calls diameter
  R_ring = 1 um); Fig. 3b right prints E_mem = f_mem*L_mem despite text saying E_mem exceeds
  f_mem*L_mem; SI p. 3 geometric merge bound 4L/pi neglects the 10 nm finite merging threshold;
  and Methods vs SI Section G list different lipid compositions for phase-separating GUVs.
