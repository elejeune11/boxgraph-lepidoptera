- id: thermal_energy
  name: thermal energy
  dimension: "[energy]"
  description: Thermal energy scale k_B * T at experimental temperature T.

- id: membrane_surface_tension_kBT
  name: membrane surface tension in k_B*T per area
  dimension: "1/[length]**2"
  description: Membrane surface tension sigma / (k_B * T) expressed in units of k_B*T / nm^2 as printed in Liu et al. (pp. 790, SI 2, SI 4).

- id: membrane_bending_rigidity_kBT
  name: membrane bending rigidity in k_B*T
  dimension: "dimensionless"
  description: Membrane bending rigidity kappa / (k_B * T) expressed in units of thermal energy k_B*T as printed in SI p. 2.

- id: membrane_ring_diameter
  name: pinned membrane boundary ring diameter
  dimension: "[length]"
  description: Diameter R_ring of the circular pinned boundary of the elastic membrane sheet in Surface Evolver calculations (SI p. 2).

- id: membrane_tube_radius
  name: membrane tube radius
  dimension: "[length]"
  description: Radius R of a cylindrical membrane tube enclosing a filopodium-like protrusion in SI Eq. (8), f_mem = pi*kappa/R + 2*pi*R*sigma.

- id: membrane_tube_length
  name: membrane tube length
  dimension: "[length]"
  description: Contour length L_mem of the cylindrical membrane tube enclosing a thin actin filament protrusion.

- id: membrane_energy
  name: membrane elastic energy
  dimension: "[energy]"
  description: Helfrich elastic deformation energy E_mem of a lipid bilayer membrane or cylindrical tube (SI Eqs. 1, 8).

- id: membrane_energy_change
  name: change in membrane energy upon buckling
  dimension: "[energy]"
  description: Change in cylindrical membrane tube energy Delta_E_mem associated with longitudinal shortening during buckling (SI Eq. 9).

- id: membrane_resistance_force
  name: membrane resistance force
  dimension: "[force]"
  description: Membrane tube pulling / resistance force f_mem opposing protrusion elongation (SI Eqs. 8, 9, 10, 12).

- id: single_filament_persistence_length
  name: single actin filament persistence length
  dimension: "[length]"
  description: Bending persistence length L_p of an individual actin filament (SI p. 2, Eq. 2).

- id: filament_persistence_length
  name: effective filament bundle persistence length
  dimension: "[length]"
  description: Combined effective persistence length L_p of a semiflexible filament or parallel filament bundle entering Euler buckling Eqs. (5)-(11).

- id: filament_contour_length
  name: filament contour length
  dimension: "[length]"
  description: Fixed contour length L of a protruding actin filament or filament bundle.

- id: filament_anchor_depth
  name: filament anchor depth below unperturbed membrane
  dimension: "[length]"
  description: Depth L_0 below the unperturbed membrane plane at which protruding filaments are anchored orthogonally (p. 790, SI p. 2).

- id: protrusion_length
  name: membrane protrusion length
  dimension: "[length]"
  description: Height L_prot above the unperturbed membrane base height produced by a protruding actin filament (SI pp. 2-4, Fig. 3a).

- id: filament_base_separation
  name: filament separation at anchored bases
  dimension: "[length]"
  description: Lateral distance D separating the anchored bases of two protruding actin filaments (p. 790, SI pp. 2-3).

- id: filament_tip_separation
  name: filament separation at tips
  dimension: "[length]"
  description: Lateral distance d = D - 2*x between the tips of two deflected actin filaments at the membrane (SI pp. 2-3).

- id: filament_thickness
  name: single actin filament thickness
  dimension: "[length]"
  description: Effective diameter / thickness of a single actin filament used as the merging cutoff d < 10 nm (p. 790, SI p. 2).

- id: filament_lateral_deflection
  name: filament lateral deflection
  dimension: "[length]"
  description: Lateral deflection x of a bent filament tip (SI pp. 2-3) or lateral contour displacement r_x(s) (SI Eq. 4).

- id: filament_vertical_shortening
  name: filament vertical shortening
  dimension: "[length]"
  description: Vertical tip shortening y(x, L) due to lateral bending of an inextensible filament of fixed contour length L (SI pp. 2-3, Fig. s1).

- id: filament_bend_angle
  name: constant-curvature filament bend angle
  dimension: "dimensionless"
  description: Total angular deflection theta = L / R_c (in radians) of a filament anchored normal to the base and bent into a circular arc of constant curvature.

- id: arc_length_coordinate
  name: filament arc length coordinate
  dimension: "[length]"
  description: Arc-length position s along a filament contour from the anchored base (s = 0) to the tip (s = L) in SI Eqs. (2) and (4).

- id: buckling_amplitude
  name: buckling lateral displacement amplitude
  dimension: "[length]"
  description: Small lateral displacement amplitude a (a / L << 1) of the sinusoidal cantilever buckling mode in SI Eqs. (4)-(11).

- id: filament_bending_energy
  name: filament worm-like chain bending energy
  dimension: "[energy]"
  description: Elastic bending energy E_fil (SI Eq. 2) or E_bend (SI Eq. 5) of a deformed actin filament or filament bundle.

- id: compressive_force
  name: external compressive force
  dimension: "[force]"
  description: External longitudinal compressive force f_comp applied along the endpoint vector of a filament bundle (SI Eqs. 6-7).

- id: compression_energy_change
  name: compressive potential energy change
  dimension: "[energy]"
  description: Change in external compressive potential energy Delta_E_comp upon filament buckling (SI Eq. 6).

- id: total_buckling_energy_change
  name: total buckling energy change
  dimension: "[energy]"
  description: Total energy change Delta_E_tot upon buckling relative to the straight state (SI Eqs. 7, 10, 11).

- id: euler_buckling_force
  name: Euler buckling critical force
  dimension: "[force]"
  description: Classical clamped-free Euler buckling threshold force f_buckle = pi^2 * k_B * T * L_p / (4 * L^2) (SI p. 6).

- id: critical_buckling_length
  name: critical Euler buckling length
  dimension: "[length]"
  description: Critical protrusion length L_buckle = sqrt(pi^2 * k_B * T * L_p / (4 * f_mem)) above which Case I predicts buckling (SI p. 7).

- id: polymerization_force_per_filament
  name: polymerization force per filament
  dimension: "[force]"
  description: Force f_fil = f_mem / N exerted per polymerizing actin filament at the protrusion tip (SI p. 9).

- id: monomer_length_increment
  name: filament length increment per added monomer
  dimension: "[length]"
  description: Increase in actin filament length delta = 2.7 nm upon addition of a single actin monomer (SI p. 8, Eq. 12).

- id: filament_number
  name: number of filaments in protrusion
  dimension: "dimensionless"
  description: Number N of parallel polymerizing actin filaments inside a single filopodium-like membrane protrusion (p. 790, SI pp. 8-9).

- id: fluorescence_intensity
  name: normalized total actin fluorescence intensity
  dimension: "dimensionless"
  description: Background- and photobleaching-corrected integrated fluorescence intensity I(t) or asymptotic I(infinity) of the polymerizing dendritic actin network (SI pp. 8-9, Eq. 13).

- id: normalized_actin_concentration
  name: normalized free G-actin concentration
  dimension: "dimensionless"
  description: Dimensionless concentration c_0(t) = 1 - I(t) / I(infinity) of free G-actin monomers in the sample (SI pp. 8-9, Eqs. 12-13).

- id: dimensionless_protrusion_length
  name: dimensionless membrane protrusion length
  dimension: "dimensionless"
  description: Nondimensionalized filopodium length L_mem / L_* entering printed SI Eq. (12) without explicit scale factors.

- id: dimensionless_time
  name: dimensionless elongation time
  dimension: "dimensionless"
  description: Nondimensionalized time t / t_* entering the ODE implied by printed SI Eq. (12).

- id: dimensionless_concentration_time_integral
  name: dimensionless integrated free actin concentration
  dimension: "dimensionless"
  description: Dimensionless integral int_{t_0}^t c_0(t') dt' entering printed SI Eq. (12).

- id: concentration_time_integral
  name: integrated free actin concentration over physical time
  dimension: "[time]"
  description: Physical-time integral int_{t_0}^t c_0(t') dt' of the dimensionless free G-actin concentration c_0(t) (SI Eq. 12, Fig. s5).

- id: characteristic_diffusion_length
  name: characteristic monomer diffusion length
  dimension: "[length]"
  description: Unstated characteristic diffusion length scale L_* required to make SI Eq. (12) dimensionally consistent in physical length units.

- id: unconstrained_polymerization_velocity
  name: unconstrained barbed-end polymerization velocity
  dimension: "[length]/[time]"
  description: Unstated characteristic free-polymerization velocity v_0 = delta * k_on * a_0 required to make SI Eq. (12) dimensionally consistent in physical units.

- id: protrusion_growth_rate
  name: protrusion elongation rate
  dimension: "[length]/[time]"
  description: Measured initial linear elongation velocity of a thin actin filament protrusion (p. 790, Fig. 1d).

- id: protrusion_fraction
  name: fraction of vesicles with protrusions
  dimension: "dimensionless"
  description: Fraction of giant unilamellar vesicles exhibiting filopodium-like protrusions, or fractional reduction in protrusion frequency (pp. 789, 791).

- id: vesicle_diameter
  name: giant unilamellar vesicle diameter
  dimension: "[length]"
  description: Diameter of giant unilamellar vesicles (GUVs) observed in reconstitution assays (p. 789).

- id: protein_concentration
  name: bulk protein molar concentration
  dimension: "[substance]/[length]**3"
  description: Bulk molar concentration of G-actin, Arp2/3 complex, or N-WASP in the reconstitution buffer (pp. 791-792).

- id: time
  name: elapsed experimental time
  dimension: "[time]"
  description: Elapsed time during protrusion elongation or FRAP imaging (Figs. 1d, 2b, s5, s6, s7).

- id: normalized_protrusion_position
  name: normalized position along protrusion
  dimension: "dimensionless"
  description: Normalized longitudinal position coordinate along a thin actin filament protrusion from base (0) to tip (1) in Fig. 1c.

- id: normalized_linescan_intensity
  name: normalized linescan fluorescence intensity
  dimension: "dimensionless"
  description: Normalized actin fluorescence intensity, or normalized Arp2/3 or capping protein intensity divided by normalized actin, along a thin actin filament protrusion in Fig. 1c (a.u.).

- id: protrusion_position_change
  name: protrusion feature displacement
  dimension: "[length]"
  description: Displacement Delta_L relative to the initial post-bleach position of the protrusion tip or proximal/distal photobleached spot edges in Fig. 2b.

- id: osmolarity_condition_index
  name: osmotic solution condition index
  dimension: "dimensionless"
  description: Categorical index of external solution osmolality in Fig. s3 (1 = Hypoosmotic, N = 3; 2 = Isoosmotic, N = 4; 3 = Hyperosmotic, N = 3).

- id: frap_normalized_intensity
  name: FRAP normalized fluorescence intensity
  dimension: "dimensionless"
  description: Normalized actin fluorescence intensity within the photobleached region of a protrusion during fluorescence recovery in Fig. s7.

