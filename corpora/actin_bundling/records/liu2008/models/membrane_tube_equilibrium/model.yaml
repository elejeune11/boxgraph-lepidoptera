id: membrane_tube_equilibrium
name: equilibrium cylindrical membrane tube radius and pulling force minimizing SI Eq. (8)
role: model
stated:
  page: 11
  printed_page: "SI 6"
  quote: "where fmem = πκ/R + 2πRσ."
  where: "text below SI Eq. 8"
built_from:
  - membrane_tube_force_energy_eq8
described_from: ref-s1
reconstructed: "Equilibrium tube radius R_eq = sqrt(kappa/(2*sigma)) and pulling force f_mem_eq = 2*pi*sqrt(2*kappa*sigma) obtained by minimizing SI Eq. (8) with respect to R (Derenyi et al. 2002, ref-17/ref-s1), used to check consistency between Section A elastic constants and Section D's 20 pN resistance force."
equation: "R_eq = sqrt(kappa / (2 * sigma)); f_mem_eq = 2 * pi * sqrt(2 * kappa * sigma)"
inputs:
  kappa_kBT: {quantity: membrane_bending_rigidity_kBT, unit: dimensionless}
  sigma_kBT: {quantity: membrane_surface_tension_kBT, unit: 1/nm^2}
  kBT: {quantity: thermal_energy, unit: pN*nm}
outputs:
  R_eq: {quantity: membrane_tube_radius, unit: nm}
  f_mem_eq: {quantity: membrane_resistance_force, unit: pN}
settings: {}
stochastic: false
