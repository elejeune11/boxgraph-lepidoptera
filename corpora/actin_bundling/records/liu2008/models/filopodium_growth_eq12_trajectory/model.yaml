id: filopodium_growth_eq12_trajectory
name: filopodium elongation trajectory from SI Eq. (12) on measured c_0(t) curve
role: model
stated:
  page: 13
  printed_page: "SI 8"
  quote: "yielding the following analytic expression for filopodium length, Lmem(t), as a function of time"
  where: "SI Eq. 12 & Figs. s5-s6"
built_from:
  - filopodium_growth_eq12
described_from: ref-s5
equation: "L_mem(t) = sqrt(1 + L_mem(t_0)^2 + 2*L_mem(t_0) + 2*exp(-f_mem*delta/(N*k_B*T)) * integral_{t_0}^t c_0(t') dt') - 1"
inputs:
  c0_curve:
    quantity: normalized_actin_concentration
    unit: dimensionless
    curve: {quantity: time, unit: s}
  target_curve:
    quantity: membrane_tube_length
    unit: um
    curve: {quantity: time, unit: s}
  f_mem: {quantity: membrane_resistance_force, unit: pN}
  delta: {quantity: monomer_length_increment, unit: nm}
  N: {quantity: filament_number, unit: dimensionless}
  kBT: {quantity: thermal_energy, unit: pN*nm}
outputs:
  L_mem_curve:
    quantity: membrane_tube_length
    unit: um
    curve: {quantity: time, unit: s}
settings:
  n_substeps: 100
stochastic: false
