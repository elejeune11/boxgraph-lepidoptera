id: compression_energy_exact_shortening
name: exact inextensible compressive potential energy change for sinusoidal mode (SI Eq. 4)
role: model
stated:
  page: 11
  printed_page: "SI 6"
  quote: "The external potential of compression offsets this energetic penalty by"
  where: "SI Eq. 6"
built_from:
  - buckling_profile_eq4
reconstructed: "Exact inextensible end-to-end shortening Delta_E_comp = -f_comp * integral_0^L (1 - sqrt(1 - (dr_x/ds)^2)) ds built to verify the small-amplitude expansion SI Eq. (6)."
equation: "Delta_E_comp = -f_comp * integral_0^L (1 - sqrt(1 - (dr_x(s)/ds)^2)) ds"
inputs:
  f_comp: {quantity: compressive_force, unit: pN}
  a: {quantity: buckling_amplitude, unit: nm}
  L: {quantity: filament_contour_length, unit: um}
outputs:
  Delta_E_comp: {quantity: compression_energy_change, unit: pN*nm}
settings:
  n_grid: 100
stochastic: false
