id: wlc_bending_integral_eq2_on_eq4
name: direct quadrature of WLC bending energy (SI Eq. 2) on buckling mode (SI Eq. 4)
role: model
stated:
  page: 7
  printed_page: "SI 2"
  quote: "The energy of a simple worm-like chain is"
  where: "SI Eqs. 2, 4"
built_from:
  - buckling_profile_eq4
equation: "E_bend = k_B*T * (L_p / 2) * integral_0^L (d^2 r_x(s) / ds^2)^2 ds"
inputs:
  kBT: {quantity: thermal_energy, unit: pN*nm}
  L_p: {quantity: filament_persistence_length, unit: um}
  a: {quantity: buckling_amplitude, unit: nm}
  L: {quantity: filament_contour_length, unit: um}
outputs:
  E_bend: {quantity: filament_bending_energy, unit: pN*nm}
settings:
  n_grid: 100
stochastic: false
