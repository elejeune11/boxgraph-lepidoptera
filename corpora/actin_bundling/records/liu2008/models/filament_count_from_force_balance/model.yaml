id: filament_count_from_force_balance
name: number of polymerizing filaments from membrane resistance and fitted force per filament (SI p. 9)
role: model
stated:
  page: 14
  printed_page: "SI 9"
  quote: "Taking a common value of 20 pN for the membrane resistance s2 our result suggests that approximately 10 polymerizing filaments"
  where: text
from_words: true
equation: "N = f_mem / f_fil"
inputs:
  f_mem: {quantity: membrane_resistance_force, unit: pN}
  f_fil: {quantity: polymerization_force_per_filament, unit: pN}
outputs:
  N: {quantity: filament_number, unit: dimensionless}
settings: {}
stochastic: false
