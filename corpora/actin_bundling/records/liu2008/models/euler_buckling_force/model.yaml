id: euler_buckling_force
name: classical clamped-free Euler buckling critical force (SI p. 6)
role: model
stated:
  page: 11
  printed_page: "SI 6"
  quote: "Here we have defined the Euler buckling force"
  where: "text below SI Eq. 7"
equation: "f_buckle = pi^2 * k_B*T * L_p / (4 * L^2)"
inputs:
  kBT: {quantity: thermal_energy, unit: pN*nm}
  L_p: {quantity: filament_persistence_length, unit: um}
  L: {quantity: filament_contour_length, unit: um}
outputs:
  f_buckle: {quantity: euler_buckling_force, unit: fN}
settings: {}
stochastic: false
