id: filopodium_growth_ode_check
name: RK4 integration of the dimensionless growth ODE implied by SI Eq. (12)
role: model
stated:
  page: 13
  printed_page: "SI 8"
  quote: "yielding the following analytic expression for filopodium length, Lmem(t), as a function of time"
  where: "SI Eq. 12"
reconstructed: "Direct RK4 integration of the dimensionless ODE dL_mem/dt = c_0 * exp(-f_mem*delta/(N*k_B*T)) / (1 + L_mem) obtained by differentiating SI Eq. (12), verifying exact analytic equivalence."
equation: "dL_mem/dt = c_0 * exp(-f_mem * delta / (N * k_B * T)) / (1 + L_mem)"
inputs:
  L_mem_0: {quantity: dimensionless_protrusion_length, unit: dimensionless}
  c_0: {quantity: normalized_actin_concentration, unit: dimensionless}
  dt_total: {quantity: dimensionless_time, unit: dimensionless}
  f_mem: {quantity: membrane_resistance_force, unit: pN}
  delta: {quantity: monomer_length_increment, unit: nm}
  N: {quantity: filament_number, unit: dimensionless}
  kBT: {quantity: thermal_energy, unit: pN*nm}
outputs:
  L_mem: {quantity: dimensionless_protrusion_length, unit: dimensionless}
settings:
  n_steps: 200
stochastic: false
