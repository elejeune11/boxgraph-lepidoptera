id: filopodium_growth_eq12_dimensional
name: dimensionally restored filopodium elongation trajectory (variant of SI Eq. 12)
role: model
stated:
  page: 13
  printed_page: "SI 8"
  quote: "yielding the following analytic expression for filopodium length, Lmem(t), as a function of time"
  where: "SI Eq. 12"
variant_of: filopodium_growth_eq12
corrections:
  - equation: "SI Eq. 12"
    change: "Restore omitted characteristic diffusion length L_star and unconstrained polymerization velocity v_0 (time scale t_star = L_star / v_0): L_mem(t) = L_star * (sqrt(1 + (L_mem(t_0)/L_star)^2 + 2*(L_mem(t_0)/L_star) + (2*v_0/L_star)*exp(-f_mem*delta/(N*k_B*T))*integral_{t_0}^t c_0(t') dt') - 1)"
    evidence: "Printed SI Eq. (12) (p. 13, SI p. 8) sums dimensionless 1, L_mem(t_0)^2 ([length]^2), 2*L_mem(t_0) ([length]), and 2*exp(-f_mem*delta/(N*k_B*T))*integral c_0(t') dt' ([time], since Eq. 13 defines c_0(t) as dimensionless), while Fig. s6 (p. 14, SI p. 9) plots L_mem in um vs t in s. Dimensional homogeneity requires characteristic length L_star and velocity v_0 = L_star / t_star."
equation: "L_mem(t) = L_star * (sqrt(1 + (L_mem(t_0)/L_star)^2 + 2*(L_mem(t_0)/L_star) + (2*v_0/L_star)*exp(-f_mem*delta/(N*k_B*T))*integral_{t_0}^t c_0(t') dt') - 1)"
inputs:
  L_mem_0: {quantity: membrane_tube_length, unit: um}
  int_c0: {quantity: concentration_time_integral, unit: s}
  f_mem: {quantity: membrane_resistance_force, unit: pN}
  delta: {quantity: monomer_length_increment, unit: nm}
  N: {quantity: filament_number, unit: dimensionless}
  kBT: {quantity: thermal_energy, unit: pN*nm}
  L_star: {quantity: characteristic_diffusion_length, unit: um}
  v_0: {quantity: unconstrained_polymerization_velocity, unit: um/s}
outputs:
  L_mem: {quantity: membrane_tube_length, unit: um}
settings: {}
stochastic: false
