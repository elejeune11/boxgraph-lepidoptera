id: filament_bending_energy_eq5
name: small-amplitude filament bundle bending energy (SI Eq. 5)
role: model
stated:
  page: 10
  printed_page: "SI 5"
  quote: "whose combined effective persistence length we denote Lp, has an internal energy"
  where: "SI Eq. 5"
built_from:
  - buckling_profile_eq4
equation: "E_bend = (k_B*T * L_p / 64) * a^2 * (pi^4 / L^3)"
inputs:
  kBT: {quantity: thermal_energy, unit: pN*nm}
  L_p: {quantity: filament_persistence_length, unit: um}
  a: {quantity: buckling_amplitude, unit: nm}
  L: {quantity: filament_contour_length, unit: um}
outputs:
  E_bend: {quantity: filament_bending_energy, unit: pN*nm}
settings: {}
stochastic: false
