id: membrane_buckling_case1_eq9_eq10
name: Case I shortening membrane tube buckling energy change (SI Eqs. 9-10)
role: model
stated:
  page: 12
  printed_page: "SI 7"
  quote: "The change in total energy thus has a form similar to equation (7)"
  where: "SI Eqs. 9-10"
built_from:
  - filament_bending_energy_eq5
  - euler_buckling_force
equation: "Delta_E_mem = -(f_mem / 16) * a^2 * (pi^2 / L); Delta_E_tot = (pi^2 * a^2 / (16 * L)) * (f_buckle - f_mem)"
inputs:
  kBT: {quantity: thermal_energy, unit: pN*nm}
  L_p: {quantity: filament_persistence_length, unit: um}
  a: {quantity: buckling_amplitude, unit: nm}
  L: {quantity: filament_contour_length, unit: um}
  f_mem: {quantity: membrane_resistance_force, unit: pN}
outputs:
  Delta_E_mem: {quantity: membrane_energy_change, unit: pN*nm}
  Delta_E_tot: {quantity: total_buckling_energy_change, unit: pN*nm}
settings: {}
stochastic: false
