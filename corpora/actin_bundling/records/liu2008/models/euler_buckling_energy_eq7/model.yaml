id: euler_buckling_energy_eq7
name: total energy change for classical Euler buckling (SI Eq. 7)
role: model
stated:
  page: 11
  printed_page: "SI 6"
  quote: "Summing equations (5) and (6), we obtain"
  where: "SI Eq. 7"
built_from:
  - filament_bending_energy_eq5
  - compression_energy_eq6
  - euler_buckling_force
equation: "Delta_E_tot = a^2 * (pi^2 / (16 * L)) * (f_buckle - f_comp)"
inputs:
  kBT: {quantity: thermal_energy, unit: pN*nm}
  L_p: {quantity: filament_persistence_length, unit: um}
  a: {quantity: buckling_amplitude, unit: nm}
  L: {quantity: filament_contour_length, unit: um}
  f_comp: {quantity: compressive_force, unit: pN}
outputs:
  Delta_E_tot: {quantity: total_buckling_energy_change, unit: pN*nm}
settings: {}
stochastic: false
