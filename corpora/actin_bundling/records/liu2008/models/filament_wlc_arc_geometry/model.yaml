id: filament_wlc_arc_geometry
name: constant-curvature worm-like chain filament arc geometry and bending energy (SI Eq. 2 & Fig. s1)
role: model
stated:
  page: 8
  printed_page: "SI 3"
  quote: "filaments can bend into segments of constant curvature, thus deflecting the tip laterally by x"
  where: "SI Eq. 2 & Fig. s1"
described_from: ref-s3
from_words: true
equation: "x = L*(1 - cos(theta))/theta; y = L*(1 - sin(theta)/theta); d = D - 2*x; L_prot = L - L_0 - y; E_fil = k_B*T * (L_p / (2*L)) * theta^2"
inputs:
  theta: {quantity: filament_bend_angle, unit: dimensionless}
  L: {quantity: filament_contour_length, unit: nm}
  D: {quantity: filament_base_separation, unit: nm}
  L_0: {quantity: filament_anchor_depth, unit: nm}
  L_p: {quantity: single_filament_persistence_length, unit: um}
  kBT: {quantity: thermal_energy, unit: pN*nm}
outputs:
  x: {quantity: filament_lateral_deflection, unit: nm}
  y: {quantity: filament_vertical_shortening, unit: nm}
  d: {quantity: filament_tip_separation, unit: nm}
  L_prot: {quantity: protrusion_length, unit: nm}
  E_fil: {quantity: filament_bending_energy, unit: pN*nm}
settings: {}
stochastic: false
