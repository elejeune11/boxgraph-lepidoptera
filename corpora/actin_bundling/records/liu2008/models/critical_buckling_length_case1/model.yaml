id: critical_buckling_length_case1
name: critical protrusion length for Case I Euler buckling (SI p. 7)
role: model
stated:
  page: 12
  printed_page: "SI 7"
  quote: "According to this result, sufficiently long protrusions"
  where: "text below SI Eq. 10"
built_from:
  - euler_buckling_force
equation: "L_buckle = sqrt(pi^2 * k_B*T * L_p / (4 * f_mem))"
inputs:
  kBT: {quantity: thermal_energy, unit: pN*nm}
  L_p: {quantity: filament_persistence_length, unit: um}
  f_mem: {quantity: membrane_resistance_force, unit: pN}
outputs:
  L_buckle: {quantity: critical_buckling_length, unit: um}
settings: {}
stochastic: false
