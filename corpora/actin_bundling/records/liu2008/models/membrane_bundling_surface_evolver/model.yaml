id: membrane_bundling_surface_evolver
name: Helfrich membrane-mediated bundling of two actin filaments (SI Eqs. 1 & 3)
role: model
stated:
  page: 7
  printed_page: "SI 2"
  quote: "Together, the total energy of the system can be written as"
  where: "SI Eqs. 1, 3"
described_from: ref-s1
equation: "E_tot = E_mem(d, L_prot) + 2*E_fil(x, L), where E_mem = integral((sigma + 2*kappa*H^2) dS)"
inputs:
  sigma_kBT: {quantity: membrane_surface_tension_kBT, unit: 1/nm^2}
  kappa_kBT: {quantity: membrane_bending_rigidity_kBT, unit: dimensionless}
  L_p: {quantity: single_filament_persistence_length, unit: um}
  R_ring: {quantity: membrane_ring_diameter, unit: um}
  L_0: {quantity: filament_anchor_depth, unit: nm}
  L: {quantity: filament_contour_length, unit: nm}
  D: {quantity: filament_base_separation, unit: nm}
  d_merge: {quantity: filament_thickness, unit: nm}
outputs:
  D_attr: {quantity: filament_base_separation, unit: nm}
settings: {}
runnable: false
not_runnable_reason: >
  The membrane deformation energy E_mem(d, L_prot) is minimized numerically using the
  Surface Evolver software (ref-s4), but the paper and SI do not provide the Surface Evolver
  input script, mesh discretization, outer-ring boundary slope condition (clamped vs hinged
  at diameter R_ring = 1 um), finite-size tip regularization for the two pinned height
  points, or the single-filament polymerization force used to determine the force-limited
  protrusion length L_prot^F plotted in Fig. 3a and Fig. s2.
stochastic: false
