id: buckling_profile_eq4
name: sinusoidal clamped-free filament buckling profile (SI Eq. 4)
role: model
stated:
  page: 10
  printed_page: "SI 5"
  quote: "Assuming a sinusoidal form, with one fixed and one free endpoint"
  where: "SI Eq. 4"
equation: "r_x(s) = a * cos(pi * s / (2 * L)) - a"
inputs:
  a: {quantity: buckling_amplitude, unit: nm}
  L: {quantity: filament_contour_length, unit: um}
  s: {quantity: arc_length_coordinate, unit: um}
outputs:
  r_x: {quantity: filament_lateral_deflection, unit: nm}
settings: {}
stochastic: false
