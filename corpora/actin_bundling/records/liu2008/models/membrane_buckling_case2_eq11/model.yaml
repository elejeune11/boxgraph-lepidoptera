id: membrane_buckling_case2_eq11
name: Case II conformal membrane tube buckling lower bound (SI Eq. 11)
role: model
stated:
  page: 12
  printed_page: "SI 7"
  quote: "Without an energetically advantageous membrane response, filopodium compression is expressly unfavorable"
  where: "SI Eq. 11"
built_from:
  - euler_buckling_force
equation: "Delta_E_tot > (pi^2 * a^2 / (16 * L)) * f_buckle"
inputs:
  kBT: {quantity: thermal_energy, unit: pN*nm}
  L_p: {quantity: filament_persistence_length, unit: um}
  a: {quantity: buckling_amplitude, unit: nm}
  L: {quantity: filament_contour_length, unit: um}
outputs:
  Delta_E_tot: {quantity: total_buckling_energy_change, unit: pN*nm}
settings: {}
stochastic: false
