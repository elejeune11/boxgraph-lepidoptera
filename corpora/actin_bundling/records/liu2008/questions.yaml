- id: q_audit_eq6_load_direction_wording
  kind: possible_error
  about:
    - compression_energy_eq6
    - compression_energy_exact_shortening
    - euler_buckling_energy_eq7
    - euler_buckling_force
  text: >
    SI p. 5 (PDF p. 10) states that the filament bundle is subject to an external compressive
    force f_comp "along the vector separating its endpoints". However, SI Eq. (6)
    (Delta_E_comp = -(f_comp/16)*a^2*(pi^2/L), p. 11) and the resulting clamped-free Euler
    buckling force f_buckle = pi^2*k_B*T*L_p/(4*L^2) use the axial shortening
    Delta_z = (1/2)*integral_0^L (dr_x/ds)^2 ds = pi^2*a^2/(16*L), which corresponds to a vertical
    compressive load along the fixed undeformed filament axis (normal to the clamped base), not
    along the deflected chord connecting the two endpoints. For mode Eq. (4) (r_x(L) = -a), the
    Euclidean endpoint-to-endpoint chord shortens only by
    L - sqrt((L - Delta_z)^2 + a^2) ≈ ((pi^2 - 8)/16)*(a^2/L) (~18.94% of Eq. 6, over 5x smaller).
  citation:
    page: 10
    printed_page: "SI 5"
    quote: "subject to an external compressive force fcomp along the vector separating its endpoints"
    where: "SI p. 5 & Eq. 6"

