- id: q_digitize_figs5_figs6_slope_inconsistency
  kind: unexplained_difference
  about:
    - filopodium_growth_eq12_trajectory
    - filopodium_growth_eq12_dimensional_trajectory
    - figs5_free_actin_data
    - figs6_pred_red_data
    - figs6_pred_blue_data
    - cmp_eq12_traj_figs6_red
    - cmp_eq12_traj_figs6_blue
    - cmp_eq12_dim_traj_figs6_red
    - cmp_eq12_dim_traj_figs6_blue
  text: >
    Calibrated digitization of Fig. s5 (c_0(t)) and Fig. s6 (red and blue model curves) shows that
    the mismatch with SI Eq. (12) goes beyond the omitted dimensional scales L_star and v_0
    (q_eq12_dimensional_inconsistency, q_eq12_unstated_fit_parameters). Evaluating printed SI Eq. (12)
    on digitized Fig. s5 c_0(t) at f_fil = 3 pN predicts asymptotes of only 6.25 um (red, vs plotted
    9.56 um) and 7.31 um (blue, vs plotted 10.78 um), and the dimensionally restored variant at
    L_star = 1.0 um, v_0 = 0.25 um/s predicts even less. More fundamentally, ANY choice of positive
    parameters (L_star, v_0, f_fil) in SI Eq. (12) requires (dL_mem/dt) / c_0(t) =
    v_0 * exp(-f_fil*delta/(k_B*T)) / (1 + L_mem/L_star) to decrease monotonically as L_mem grows,
    whereas digitized Fig. s6 divided by Fig. s5 on the same time axis yields (dL_mem/dt) / c_0(t)
    INCREASING ~3-fold from ~0.037 um/s at t = 260 s to ~0.11 um/s at t = 900-1100 s; moreover, at
    matching times t in [350, 1000] s, the longer blue curve grows as fast or faster than the shorter
    red curve (L_blue - L_red widens from 0.96 um at 350 s to 1.24 um at 1000 s). Shifting Fig. s5
    later by ~300-350 s removes most of the drift (reducing CV of ((L+1)^2 - (L_0+1)^2)/(2*int c_0)
    to ~1-4%), suggesting either an unstated time-origin offset between Fig. s5 and Fig. s6 or distinct
    unstated c_0(t) traces/parameters per protrusion.
  citation:
    page: 14
    printed_page: "SI 9"
    quote: "Elongation of two parallel filament protrusions (black squares and black crosses) and predicted"
    where: "Figs. s5 & s6"

