- id: q_fmem_inconsistency_sectionA_vs_sectionD
  kind: unexplained_difference
  about:
    - membrane_tube_equilibrium
    - membrane_tube_force_energy_eq8
    - cmp_f_mem_eq_vs_20pN_low
    - cmp_f_mem_eq_vs_20pN_high
    - cmp_N_filaments_from_sectionA_force
    - sigma_low_si
    - kappa_si
    - f_mem_common_si
  text: >
    Using Liu et al.'s own Section A membrane elastic constants (kappa = 20 k_B*T, sigma = 0.005
    k_B*T/nm^2, ref-s2), minimizing SI Eq. (8) (f_mem = pi*kappa/R + 2*pi*R*sigma) yields equilibrium
    tube radius R_eq = sqrt(kappa/(2*sigma)) = 44.7 nm and resistance force f_mem,eq =
    2*pi*sqrt(2*kappa*sigma) = 2.81 k_B*T/nm = 11.55 pN at 298 K (11.6-12.0 pN across 298-310 K),
    nearly a factor of 2 below the "common value of 20 pN" adopted in Section D from the same
    reference (ref-s2). Dividing 11.55 pN by 3 pN/filament would yield only N = 3.85 (~4) filaments.
    The 20 pN value is instead closer to the higher tension sigma = 0.02 k_B*T/nm^2 shown in Fig. s2,
    which gives R_eq = 22.4 nm and f_mem,eq = 23.10 pN at 298 K.
  citation:
    page: 7
    printed_page: "SI 2"
    quote: "We choose σ = 0.005 kBT/nm2 and κ = 20 kBT for the elastic constants"
    where: "SI p. 2 & SI p. 9"

