- id: q_eq12_dimensional_inconsistency
  kind: possible_error
  about:
    - filopodium_growth_eq12
    - filopodium_growth_eq12_dimensional
    - filopodium_growth_ode_check
  text: >
    Printed SI Eq. (12) (p. 13, SI p. 8) reads L_mem(t) = sqrt(1 + L_mem(t_0)^2 + 2*L_mem(t_0) +
    2*exp(-f_mem*delta/(N*k_B*T)) * integral_{t_0}^t c_0(t') dt') - 1, which is dimensionally
    inconsistent as written: it sums dimensionless 1, L_mem(t_0)^2 ([length]^2), 2*L_mem(t_0)
    ([length]), and 2*exp(-f_mem*delta/(N*k_B*T))*integral c_0(t') dt' ([time], because SI Eq. 13
    explicitly defines c_0(t) as dimensionless), while Fig. s6 (p. 14, SI p. 9) plots L_mem in um
    versus time in s. The characteristic diffusion length scale L_star and unconstrained
    polymerization velocity v_0 (or time scale t_star = L_star / v_0) were omitted without stating
    a nondimensionalization. Furthermore, differentiating Eq. (12) gives dL_tilde/dt_tilde =
    c_0(t)*exp(-f_mem*delta/(N*k_B*T))/(1 + L_tilde), in which the load factor exp(-f_mem*delta/
    (N*k_B*T)) is absent from the diffusion-depletion denominator (unlike exact steady-state
    diffusion-consumption flux balance where tip consumption is also slowed by the load factor,
    making force drop out in the diffusion-limited regime L >> L_star*exp(f_mem*delta/(N*k_B*T))).
  citation:
    page: 13
    printed_page: "SI 8"
    quote: "yielding the following analytic expression for filopodium length, Lmem(t), as a function of time"
    where: "SI Eq. 12"

