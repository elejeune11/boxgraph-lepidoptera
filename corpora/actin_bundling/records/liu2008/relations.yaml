  provenance: proposed
  reason: >
    Confirms that the algebraically corrected variant of Graham et al.'s (2023) Eq. (1)
    (fixing the O(u_m^2) fluctuation coefficient from (2 + m^4) to (1/2)*(1 + 6*m^2 + m^4))
    reduces identically in the u_m -> 0 limit to Liu et al.'s (2008) constant-curvature WLC
    arc bending energy E_fil.
  assumptions:
    - "Zero radial fluctuation amplitude u_m -> 0 isolates the shared constant-curvature WLC baseline."

- id: rel_graham2023_bathe_eqS1_weak_scales_liu2008_uncrosslinked
  kind: scales_as
  a: graham2023/bundle_bending_rigidity_bathe_eqS1
  b: liu2008/uncrosslinked_bundle_persistence_length
  mapping:
    N: "N"
    L_p1: "k_b_fil / 4110"
  output_map:
    L_p: k_b
  regime:
    k_b_fil: [40000.0, 80000.0]
    N: [2.0, 30.0]
    chi: [0.5, 2.0]
    c_qj: [0.5, 2.0]
    alpha: [1.0e-6, 1.0e-5]
  provenance: proposed
  reason: >
    Both Graham et al. (2023, SI Section 2.1, Eq. S1 from Bathe et al. 2008 in the weak-coupling
    fluid-VASP limit alpha << 1) and Liu et al. (2008, SI Section C, uncrosslinked parallel
    filament bundle inside a lipid membrane tube) model an actin bundle without rigid shear
    crosslinking as N mechanically decoupled filaments whose bending stiffness scales linearly
    with filament count N and single-filament stiffness k_b_fil = k_B*T * L_p1 (log-slopes +1
    in N and +1 in k_b_fil, in contrast to the N^2 strong-coupling limit alpha >> 1).
  assumptions:
    - "Weak interfilament shear coupling alpha in [1e-6, 1e-5] recovers the uncrosslinked linear bundle regime k_b = N * k_b_fil = N * k_B*T * L_p1."

- id: rel_liu2008_wlc_arc_scales_graham2023_discrete_kbend
  kind: scales_as
  a: liu2008/filament_wlc_arc_geometry
  b: graham2023/discrete_bending_constant
  mapping:
    N_fil: "1"
    L_p: "L_p"
    kBT: "kBT"
    L_cyl: "L"
  output_map:
    k_bend: E_fil
  regime:
    theta: [0.1, 1.5]
    L: [50.0, 500.0]
    D: [20.0, 100.0]
    L_0: [80.0, 120.0]
    L_p: [10.0, 20.0]
    kBT: [4.0, 4.3]
  provenance: proposed
  reason: >
    Liu et al.'s (2008) continuum constant-curvature WLC bending energy E_fil = (theta^2 / 2) *
    (k_B*T * L_p / L) and Graham et al.'s (2023, SI Eq. S2 & Table 1) discrete WLC segment bending
    stiffness constant k_bend = N_fil * k_B*T * L_p / L_cyl share the identical single-filament
    (N_fil = 1, L_cyl = L) worm-like chain energy scale k_B*T * L_p / L (matching log-slopes
    +1 in kBT, +1 in L_p, and -1 in L, differing only by the dimensionless bend-angle factor
    theta^2 / 2).
  assumptions:
    - "Single filament (N_fil = 1) with discrete segment length L_cyl identified with filament contour length L."

- id: rel_liu2008_eq12_dim_reduces_to_graham2023_linear_growth
  kind: reduces_to
  a: liu2008/filopodium_growth_eq12_dimensional
  b: graham2023/linear_bundle_elongation
  mapping:
    v: "v_0"
    t: "int_c0"
  output_map:
    y: L_mem
  regime:
    L_mem_0: [0.5, 3.0]
    int_c0: [10.0, 100.0]
    f_mem: [5.0, 25.0]
    delta: [2.7, 2.75]
    N: [5.0, 20.0]
    kBT: [4.0, 4.3]
    L_star: [1.0, 10.0]
    v_0: [0.01, 0.3]
  limit:
    f_mem: "0"
    L_star: "oo"
    L_mem_0: "0"
  provenance: proposed
  reason: >
    In the zero-membrane-load (f_mem -> 0), fast-diffusion / reaction-limited (L_star -> oo), and
    negligible-initial-length (L_mem_0 -> 0) limit with an undepleted monomer pool (c_0 = 1 so
    int_c0 = t), Liu et al.'s (2008) dimensionally restored Mogilner-Rubinstein filopodium
    elongation model (SI Eq. 12) reduces identically to Graham et al.'s (2023, Fig. 5h)
    constant-velocity linear actin bundle elongation law y(t) = v * t with v = v_0.
  assumptions:
    - "Joint zero-load (f_mem -> 0), fast-diffusion (L_star -> oo), zero-seed (L_mem_0 -> 0) limit with undepleted monomer concentration c_0(t) = 1 (so int_c0 equals elapsed time t)."

# ==========================================================================
# Cross-record ModelAtlas relations with graham2024
# (graham2024 cites liu2008 qualitatively as ref-52 on p. 10; relations entered
