    L_p: [15.0, 200.0]
    a: [1.0, 50.0]
    L: [5.0, 30.0]
    f_comp: [5.0, 30.0]
  provenance: stated
  citation:
    page: 12
    printed_page: "SI 7"
    quote: "The change in total energy thus has a form similar to equation (7)"
    where: "SI Eq. 10"
  assumptions:
    - "Hypothetical Case I where the membrane tube stays straight and shortens by the filament's end-to-end shortening"

# ==========================================================================
# 4. Case II lower bound Eq. (11) equals filament bending energy Eq. (5)
# ==========================================================================
- id: rel_case2_eq11_same_as_eq5
  kind: same_as
  a: liu2008/filament_bending_energy_eq5
  b: liu2008/membrane_buckling_case2_eq11
  mapping:
    kBT: "kBT"
    L_p: "L_p"
    a: "a"
