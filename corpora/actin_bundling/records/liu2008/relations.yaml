# ==========================================================================
# 1. Exact verification of SI Eq. (5) from WLC SI Eq. (2) + mode SI Eq. (4)
# ==========================================================================
- id: rel_wlc_quadrature_eq5
  kind: same_as
  a: liu2008/wlc_bending_integral_eq2_on_eq4
  b: liu2008/filament_bending_energy_eq5
  mapping:
    kBT: "kBT"
    L_p: "L_p"
    a: "a"
    L: "L"
  output_map:
    E_bend: E_bend
  regime:
    kBT: [4.0, 4.3]
    L_p: [15.0, 200.0]
    a: [1.0, 50.0]
    L: [5.0, 30.0]
  tolerance: 1.0e-4
  provenance: stated
  citation:
    page: 10
    printed_page: "SI 5"
    quote: "In this bent configuration the semi-flexible filament bundle, whose combined effective persistence length we denote Lp, has an internal energy"
    where: "SI Eq. 5"
  assumptions:
    - "Small lateral amplitude a/L << 1 so curvature squared is (d^2 r_x / ds^2)^2"

# ==========================================================================
# 2. Small-amplitude compression Eq. (6) from exact inextensible shortening
# ==========================================================================
- id: rel_exact_shortening_approximated_by_eq6
  kind: approximated_by
  a: liu2008/compression_energy_exact_shortening
  b: liu2008/compression_energy_eq6
  mapping:
    f_comp: "f_comp"
    a: "a"
    L: "L"
  output_map:
    Delta_E_comp: Delta_E_comp
  regime:
    f_comp: [1.0, 30.0]
    a: [1.0, 50.0]
    L: [10.0, 30.0]
  tolerance: 1.0e-4
  provenance: stated
  citation:
    page: 10
    printed_page: "SI 5"
    quote: "For our stability analysis, it is sufficient to consider small amplitudes"
    where: "SI Eqs. 4, 6"
  assumptions:
    - "Small amplitude a/L << 1 (in regime, a/L <= 0.005 so O((a/L)^2) correction < 10^-5)"

# ==========================================================================
