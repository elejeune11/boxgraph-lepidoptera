# ==========================================================================
# Cross-record ModelAtlas relations with gov2018
# (gov2018 cites liu2008 qualitatively as ref 19 on p. 2; relations entered here
# as provenance: proposed per Wave 6 liu2008 record isolation)
# ==========================================================================

- id: rel_liu2008_tube_eq_same_as_gov2018_tube_radius
  kind: same_as
  a: liu2008/membrane_tube_equilibrium
  b: gov2018/tube_equilibrium_radius
  mapping:
    kappa: "kappa_kBT * kBT / 1000"
    sigma: "sigma_kBT * kBT * 1000"
  output_map:
    R_tube: R_eq
  regime:
    kappa_kBT: [1.0, 100.0]
    sigma_kBT: [0.001, 0.05]
    kBT: [4.0, 4.3]
  provenance: proposed
  reason: >
    Both Liu et al. (2008, SI Eq. 8 minimization, citing Derenyi, Julicher & Prost 2002 [ref-17/s1])
    and Gov (2018, Section 4 p. 6 col. 1, citing Shlomovitz & Gov 2009 [ref-88]; Gov also cites
    Liu et al. 2008 as ref 19 on p. 2) obtain the identical equilibrium bare-Helfrich cylindrical
    membrane tube radius R_eq = R_tube = sqrt(kappa / (2*sigma)) from the balance of membrane
    bending rigidity kappa and surface tension sigma (with kappa [pN*um] = kappa_kBT * kBT / 1000
    and sigma [pN/um] = sigma_kBT * kBT * 1000).
  assumptions:
    - "Bare fluid lipid bilayer tube with zero spontaneous curvature (no curved membrane components, n = 0)."
    - "Unit conversions: kappa [pN*um] = kappa_kBT * kBT [pN*nm] / 1000; sigma [pN/um] = sigma_kBT [1/nm^2] * kBT [pN*nm] * 1000."

- id: rel_gov2018_eq2_1_bare_scales_liu2008_eq8
  kind: scales_as
  a: gov2018/free_energy_density_eq2_1
  b: liu2008/membrane_tube_force_energy_eq8
  mapping:
    kappa_kBT: "kappa / kBT"
    sigma_kBT: "sigma / (kBT * 1e6)"
    kBT: "kBT * 1000"
    R: "1000 / H"
    L_mem: "H / (2 * pi)"
  output_map:
    E_mem: f
  regime:
    kappa: [0.04, 0.2]
    H: [5.0, 50.0]
    n: [1.0e-10, 1.0e-9]
    H0: [1.0, 20.0]
    sigma: [10.0, 100.0]
    kBT: [0.004, 0.0043]
    ns: [100.0, 1000.0]
    J: [1.0e-10, 1.0e-9]
    grad_n: [1.0e-10, 1.0e-9]
  provenance: proposed
  reason: >
    In the bare-membrane limit (vanishing curved-membrane-component coverage n -> 0, grad_n -> 0,
    J -> 0), Gov (2018) Eq. (2.1)'s Helfrich free-energy density f = (1/2)*kappa*H^2 + sigma
    (where Gov uses total curvature H = c_1 + c_2 = 1/R for a cylinder) is identical to the
    Helfrich integrand (2*kappa*H_mean^2 + sigma with mean curvature H_mean = 1/(2*R)) integrated
    over a cylindrical tube in Liu et al. (2008) SI Eqs. (1) and (8), E_mem = 2*pi*R*L_mem *
    (kappa/(2*R^2) + sigma). Evaluating E_mem on a unit-area cylindrical patch (A = 2*pi*R*L_mem
    = 1 um^2, i.e., L_mem = H/(2*pi) um at R = 1000/H nm) matches all nonlinear log-slopes of
    gov2018/free_energy_density_eq2_1 across the bending-to-tension crossover in kappa, sigma, H,
    and kBT.
  assumptions:
    - "Bare membrane limit n in [1e-10, 1e-9], grad_n in [1e-10, 1e-9], J in [1e-10, 1e-9] eliminates CMC spontaneous curvature, entropy, and aggregation terms (relative contribution < 1e-7)."
    - "Cylindrical geometry identifies Gov's total curvature H = c_1 + c_2 = 1/R with twice Liu's mean curvature H_mean = 1/(2*R), and fixes lateral cylinder area A = 2*pi*R*L_mem = 1 um^2 so E_mem [pN*nm] = 1000 * f_bare [pN/um * um^2]."

# ==========================================================================
# Cross-record ModelAtlas relations with graham2023 (proposed; uncited pair)
# ==========================================================================

- id: rel_liu2008_wlc_arc_same_as_graham2023_ring_bending
  kind: same_as
  a: liu2008/filament_wlc_arc_geometry
  b: graham2023/ring_confinement_bending_energy
  mapping:
    k_b: "kBT * L_p * 1000"
    L: "L / 1000"
    R: "(L / theta) / 1000"
  output_map:
    E_bend_0: E_fil
  regime:
    theta: [0.1, 1.57]
    L: [120.0, 2000.0]
    D: [20.0, 100.0]
    L_0: [80.0, 120.0]
    L_p: [10.0, 20.0]
    kBT: [4.0, 4.3]
  provenance: proposed
  reason: >
    Both Liu et al. (2008, SI Eq. 2 & Fig. s1, constant-curvature circular-arc WLC bending energy
    E_fil = k_B*T * (L_p / (2*L)) * theta^2 for an arc of contour length L and bend angle
    theta = L / R_c) and Graham et al. (2023, Main Eq. 1 / SI Eq. S21 zero-fluctuation circular
    ring confinement bending energy E_bend_0 = (k_b / 2) * L / R^2) implement the exact same
    constant-curvature worm-like chain circular-arc bending energy with flexural rigidity
    k_b = k_B*T * L_p and radius of curvature R = L / theta.
  assumptions:
    - "Uniform constant curvature kappa_c = 1/R = theta/L along filament contour length L."
    - "Flexural rigidity k_b [pN*nm^2] = kBT [pN*nm] * L_p [um] * 1000 [nm/um]."

- id: rel_graham2023_ring_eq1_reduces_to_liu2008_wlc_arc
  kind: reduces_to
  a: graham2023/ring_bending_energy_eq1
  b: liu2008/filament_wlc_arc_geometry
  mapping:
    theta: "L / R"
    L: "L * 1000"
    D: "100.0"
    L_0: "100.0"
    L_p: "k_b / 4110"
    kBT: "4.11"
  output_map:
    E_fil: E_bend
  regime:
    k_b: [40000.0, 500000.0]
    L: [3.0, 25.0]
    R: [0.5, 4.0]
    m: [1.0, 5.0]
    u_m: [0.005, 0.1]
  limit:
    u_m: "0"
  provenance: proposed
  reason: >
    In the zero-radial-fluctuation limit (u_m -> 0), Graham et al.'s (2023) printed fluctuating
    circular actin-ring WLC bending energy Eq. (1) reduces identically to Liu et al.'s (2008)
    constant-curvature circular-arc WLC bending energy E_fil = k_B*T * (L_p/(2*L)) * theta^2
    with total bend angle theta = L/R and k_B*T * L_p = k_b (where kBT = 4.11 pN*nm cancels
    identically between L_p = k_b/(1000*kBT) and kBT).
  assumptions:
    - "Zero radial thermal fluctuation amplitude u_m -> 0 leaves only the uniform-curvature circular arc baseline (k_b/2)*(L/R^2)."
    - "Anchor geometry parameters D and L_0 in liu2008/filament_wlc_arc_geometry do not enter E_fil."

- id: rel_graham2023_ring_eq1_corr_reduces_to_liu2008_wlc_arc
  kind: reduces_to
  a: graham2023/ring_bending_energy_eq1_corrected
  b: liu2008/filament_wlc_arc_geometry
  mapping:
    theta: "L / R"
    L: "L * 1000"
    D: "100.0"
    L_0: "100.0"
    L_p: "k_b / 4110"
    kBT: "4.11"
  output_map:
    E_fil: E_bend
  regime:
    k_b: [40000.0, 500000.0]
    L: [3.0, 25.0]
    R: [0.5, 4.0]
    m: [1.0, 5.0]
    u_m: [0.005, 0.1]
  limit:
