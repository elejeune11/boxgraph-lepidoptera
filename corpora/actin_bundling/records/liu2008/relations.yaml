- id: rel_liu2008_eq8_reduces_to_weirich2017_capillary_energy
  kind: reduces_to
  a: liu2008/membrane_tube_force_energy_eq8
  b: weirich2017/capillary_free_energy_integral
  mapping:
    R_0: "R / 1000"
    u: "0"
    lam: "L_mem"
    gamma_I: "sigma_kBT * kBT * 1e6"
    omega: "2.0"
  output_map:
    F: E_mem
  regime:
    kappa_kBT: [10.0, 30.0]
    sigma_kBT: [0.002, 0.03]
    kBT: [4.0, 4.3]
    R: [20.0, 200.0]
    L_mem: [2.0, 20.0]
  limit:
    kappa_kBT: "0"
  provenance: proposed
  reason: >
    In the zero-bending-rigidity (pure surface-tension) limit kappa -> 0, Liu et al.'s (2008,
    SI Eq. 8) cylindrical membrane-tube elastic energy E_mem = (pi*kappa/R + 2*pi*R*sigma)*L_mem
    reduces identically to the isotropic interfacial free energy F = 2*pi*R_0*lambda*gamma_I of
    Weirich et al.'s (2017, SI p. 9) unperturbed (u = 0) straight nematic actin liquid cylinder
    (where the Rapini-Papoular anchoring area A_omega vanishes identically because the axial
    director is strictly tangent to the lateral cylinder wall; unit conversions R_0 = R/1000 um
    and gamma_I [nN/m] = 10^6 * sigma [pN/nm] = 10^6 * sigma_kBT * kBT).
  assumptions:
    - "Zero bilayer bending rigidity (kappa -> 0) transitions from a bending-elastic lipid membrane tube to a pure interfacial-tension fluid cylinder."
    - "Unperturbed uniform cylinder (u = 0) in Weirich SI p. 9 makes A_omega = 0 identically for arbitrary anchoring strength omega."

