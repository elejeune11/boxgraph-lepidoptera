# ==========================================================================
# 7. Equilibrium tube force equals SI Eq. (8) evaluated at R = R_eq
# ==========================================================================
- id: rel_eq8_at_equilibrium_radius
  kind: same_as
  a: liu2008/membrane_tube_equilibrium
  b: liu2008/membrane_tube_force_energy_eq8
  mapping:
    kappa_kBT: "kappa_kBT"
    sigma_kBT: "sigma_kBT"
