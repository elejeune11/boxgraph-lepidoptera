- id: rel_liu2008_eq12_dim_reduces_to_graham2024_vca_ode
  kind: reduces_to
  a: liu2008/filopodium_growth_eq12_dimensional
  b: graham2024/cytosim_vca_ode_filament_length
  mapping:
    k_grow: "v_0"
    N_fil: "N"
    L_0: "L_mem_0"
    L_total: "2 * N * (L_mem_0 + v_0 * int_c0)"
    t_end: "-(2 * (L_mem_0 + v_0 * int_c0) / v_0) * log(1 - v_0 * int_c0 / (L_mem_0 + 2 * v_0 * int_c0))"
    k_bind: "0"
    C_vca: "0"
    factor_Gmax: "1"
    R_drop: "1"
    l_mono: "delta"
  output_map:
    L_fil: L_mem
  regime:
    L_mem_0: [0.5, 3.0]
    int_c0: [5.0, 50.0]
    f_mem: [5.0, 25.0]
    delta: [2.7, 2.75]
    N: [5.0, 20.0]
    kBT: [4.0, 4.3]
    L_star: [1.0, 10.0]
    v_0: [0.05, 0.3]
  limit:
    f_mem: "0"
    L_star: "oo"
  tolerance: 1.0e-5
  provenance: proposed
  reason: >
    Both Liu et al. (2008, SI Eq. 12, dimensionally restored Mogilner-Rubinstein filopodium
    elongation) and Graham et al. (2024, SI Eq. 2 / cytosim_vca_ode_filament_length without VCA
    competitor, C_vca = 0) govern barbed-end actin elongation slowed by global free-monomer
    depletion c_0(t) = [G-actin](t)/[T-actin], dL/dt = v_0 * c_0(t) * (load & diffusion factors).
    In the zero-membrane-load (f_mem -> 0) and well-mixed fast-diffusion (L_star -> oo) limit,
    liu2008/filopodium_growth_eq12_dimensional reduces identically to L_0 + v_0 * int_c0, matching
    graham2024/cytosim_vca_ode_filament_length (at C_vca = 0) evaluated over the exact elapsed time
    t_end at which Graham's self-consistent monomer-depletion ODE accumulates the identical
    cumulative free-monomer exposure integral_0^{t_end} (1 - N*L(t')/L_total) dt' = int_c0.
  assumptions:
    - "Zero membrane resistance force (f_mem -> 0) and fast monomer diffusion (L_star -> oo) remove Liu's Brownian-ratchet load and 1D tube diffusion impedance."
    - "Zero VCA sequestration (C_vca = 0, k_bind = 0) in Graham's CytoSim ODE; finite polymer pool L_total = 2*N*(L_mem_0 + v_0*int_c0) yields exact analytical depletion time t_end matching int_c0."

- id: rel_liu2008_eq13_same_as_graham2024_eq1
