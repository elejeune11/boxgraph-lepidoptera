    I_inf: [1.0, 2.0]
  provenance: proposed
  reason: >
    Liu et al. (2008, SI Eq. 13: c_0(t) = 1 - I(t)/I(infinity), where integrated network
    fluorescence I(t) is proportional to polymerized F-actin and I(infinity) to total actin)
    and Graham et al. (2024, SI Eq. 1: free_fraction = [G-actin]/[T-actin] = 1 - [F-actin]/[T-actin])
    express the exact same normalized free-monomer conservation law (flagged too_plain by ModelAtlas
    because 1 - x/y has 2 operations, so it does not inflate model families).
  assumptions:
    - "Linear proportionality between background/photobleaching-corrected F-actin fluorescence I(t) and polymerized concentration [F-actin](t), with complete polymerization at t -> infinity (I_inf <-> T_actin)."

