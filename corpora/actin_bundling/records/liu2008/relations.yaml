    printed_page: "SI 6"
    quote: "where fmem = πκ/R + 2πRσ."
    where: "SI Eq. 8"
  assumptions:
    - "Cylindrical tube adopts its equilibrium radius R_eq = sqrt(kappa / (2 * sigma))"

