  provenance: proposed
  reason: >
    Converse limit across Weirich et al.'s (2017) experimental liquid-bundle regime (R_0 in
    50-500 nm, lam in 2-10 um, gamma_I in 100-1000 nN/m, omega in 0.5-5): as the Rayleigh-Plateau
