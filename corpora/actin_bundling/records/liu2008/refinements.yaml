- id: ref_wlc_quadrature_ngrid
  run: run_wlc_bending_quadrature
  setting: n_grid
  factors: [1, 2, 4, 8]
  mode: multiply
  output: E_bend
  tolerance: "0.01%"
  tolerance_basis: "added: tight relative tolerance confirming grid convergence of trapezoidal WLC quadrature to analytic SI Eq. (5)"
  tolerance_added: true

- id: ref_compression_exact_ngrid
  run: run_compression_energy_exact
  setting: n_grid
  factors: [1, 2, 4, 8]
  mode: multiply
  output: Delta_E_comp
  tolerance: "0.01%"
  tolerance_basis: "added: tight relative tolerance confirming grid convergence of exact inextensible shortening quadrature"
  tolerance_added: true

- id: ref_growth_ode_nsteps
  run: run_growth_ode_check
  setting: n_steps
  factors: [1, 2, 4, 8]
  mode: multiply
  output: L_mem
  tolerance: "0.01%"
  tolerance_basis: "added: tight relative tolerance confirming RK4 step-size convergence to analytic SI Eq. (12)"
  tolerance_added: true

- id: ref_arc_by_deflection_rtol
  run: run_arc_by_deflection
  setting: rtol
  factors: [1, 10, 100]
  mode: divide
  output: E_fil
  tolerance: "0.001%"
  tolerance_basis: "added: root-finding tolerance refinement confirming convergence of inverted arc angle theta and WLC energy E_fil(x, L)"
  tolerance_added: true

- id: ref_eq12_traj_nsubsteps
  run: run_eq12_traj_figs6_red
  setting: n_substeps
  factors: [1, 2, 4, 8]
  mode: multiply
  output: L_mem_curve
  tolerance: "0.01%"
  tolerance_basis: "added: trapezoidal quadrature convergence of cumulative integral of digitized Fig. s5 c_0(t) well below figure reading uncertainty"
  tolerance_added: true

- id: ref_eq12_dim_traj_nsubsteps
  run: run_eq12_dim_traj_figs6_red
  setting: n_substeps
  factors: [1, 2, 4, 8]
  mode: multiply
  output: L_mem_curve
  tolerance: "0.01%"
  tolerance_basis: "added: trapezoidal quadrature convergence of cumulative integral of digitized Fig. s5 c_0(t) in dimensionally restored SI Eq. (12)"
  tolerance_added: true

