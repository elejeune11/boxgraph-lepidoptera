- id: vasp_concentration_tetramer
  name: VASP tetramer concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of tetrameric VASP (default convention throughout the manuscript unless stated otherwise).

- id: vasp_concentration_monomer
  name: VASP monomer concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of VASP polypeptide subunits (4x the tetramer concentration).

- id: actin_concentration
  name: actin concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of monomeric (G-actin) or filamentous (F-actin) actin subunits.

- id: profilin_concentration
  name: profilin concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of human profilin I (wild-type or point mutant).

- id: capping_protein_concentration
  name: capping protein concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of mouse capping protein (MmCP alpha1beta2).

- id: kcl_concentration
  name: KCl concentration
  dimension: "[substance] / [length] ** 3"
  description: Potassium chloride concentration controlling buffer ionic strength.

- id: latrunculin_b_concentration
  name: Latrunculin B concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of Latrunculin B used to sequester monomeric actin.

- id: barbed_end_elongation_rate
  name: barbed-end elongation rate
  dimension: "1 / [time]"
  description: Actin filament barbed-end polymerization rate in actin subunits per second (sub/s).

- id: barbed_end_actin_on_rate
  name: barbed-end actin association rate constant
  dimension: "[length] ** 3 / [substance] / [time]"
  description: Apparent second-order rate constant (slope of elongation rate vs [actin]) for monomer addition to barbed ends.

- id: vasp_barbed_end_kd
  name: VASP barbed-end dissociation constant
  dimension: "[substance] / [length] ** 3"
  description: Apparent equilibrium dissociation constant (K_d) of VASP tetramers for growing actin filament barbed ends.

- id: vasp_barbed_end_koff
  name: VASP barbed-end off-rate
  dimension: "1 / [time]"
  description: First-order dissociation rate constant (K_off = 1/tau_1) of VASP tetramers from growing actin filament barbed ends.

- id: vasp_barbed_end_kon
  name: VASP barbed-end on-rate
  dimension: "[length] ** 3 / [substance] / [time]"
  description: Second-order barbed-end association rate constant (k_on = K_off / K_d) for VASP tetramers.

- id: vasp_barbed_end_dwell_time
  name: VASP barbed-end dwell time
  dimension: "[time]"
  description: Characteristic exponential residence time (tau_1) of a single Cy3-VASP tetramer on an actin filament barbed end.

- id: vasp_side_dwell_time
  name: VASP filament-side dwell time
  dimension: "[time]"
  description: Characteristic exponential dwell time (tau_1 short/diffusive or tau_2 long/static) of Cy3-VASP tetramers laterally bound to F-actin.

- id: cy3_photobleaching_time
  name: single Cy3 fluorophore photobleaching lifetime
  dimension: "[time]"
  description: Single-exponential photobleaching lifetime of one Cy3 fluorophore under TIRF imaging conditions.

- id: monomers_delivered_per_binding
  name: actin monomers delivered per VASP binding event
  dimension: "dimensionless"
  description: Average number of actin subunits incorporated at the barbed end during one processive VASP tetramer association event.

- id: fold_rate_enhancement
  name: barbed-end polymerization fold enhancement
  dimension: "dimensionless"
  description: Ratio of barbed-end elongation rate or association rate constant with VASP to the basal rate without VASP.

- id: dwell_time_reduction_fraction
  name: fractional barbed-end dwell time reduction
  dimension: "dimensionless"
  description: Relative decrease in VASP barbed-end dwell time between two actin concentrations.

- id: capping_observed_rate
  name: observed barbed-end capping rate
  dimension: "1 / [time]"
  description: Pseudo-first-order rate constant (K_obs) governing termination of filament barbed-end growth by capping protein.

- id: capping_protein_on_rate
  name: capping protein barbed-end association rate constant
  dimension: "[length] ** 3 / [substance] / [time]"
  description: Second-order association rate constant (K_+) of mouse capping protein for actin filament barbed ends.

- id: capping_rate_reduction_factor
  name: capping rate fold reduction
  dimension: "dimensionless"
  description: Ratio of capping protein association rate constant without VASP to that in the presence of 50 nM VASP.

- id: capping_protein_lifetime
  name: capping protein barbed-end lifetime
  dimension: "[time]"
  description: Residence lifetime of capping protein bound to an actin filament barbed end in vitro.

- id: capped_barbed_end_fraction
  name: fraction of capped barbed ends
  dimension: "dimensionless"
  description: Cumulative fraction of tracked actin filament barbed ends that have been capped by time t.

- id: free_barbed_end_fraction
  name: fraction of free barbed ends
  dimension: "dimensionless"
  description: Fraction of tracked actin filament barbed ends remaining uncapped at time t.

- id: survival_fraction
  name: dwell-time survival fraction (1 - CF)
  dimension: "dimensionless"
  description: Complementary cumulative distribution (1 - cumulative frequency) of single-molecule binding lifetimes.

- id: binding_mode_count
  name: single-molecule binding event count
  dimension: "dimensionless"
  description: Count (n) of single Cy3-VASP filament-binding events in a behavioral category or fit dataset.

- id: binding_mode_fraction
  name: single-molecule binding mode fraction
  dimension: "dimensionless"
  description: Fraction or percentage of Cy3-VASP binding events belonging to a binding mode or exponential decay component.

- id: barbed_end_localization_probability
  name: barbed-end localization probability
  dimension: "dimensionless"
  description: Percentage of single-molecule filament-binding events localized to pixel position 1 (the apparent barbed end).

- id: barbed_to_side_transition_fraction
  name: barbed-end to lateral-binding transition fraction
  dimension: "dimensionless"
  description: Percentage of barbed-end-associated VASP tetramers that transition to a lateral side-binding interaction instead of dissociating.

- id: bundling_fluorescence_increase_per_filament
  name: bundling Cy3-VASP fluorescence increase per filament
  dimension: "dimensionless"
  description: Relative increase in background-subtracted Cy3-VASP fluorescence intensity per filament at bundle overlap sites compared with single filaments.

- id: time
  name: time or filament subunit age
  dimension: "[time]"
  description: Elapsed time in an assay or age of an F-actin subunit since incorporation into a filament.

- id: atp_hydrolysis_rate
  name: F-actin ATP hydrolysis rate constant
  dimension: "1 / [time]"
  description: First-order rate constant (k_1) for irreversible ATP hydrolysis on polymerized actin subunits.

- id: pi_release_rate
  name: F-actin inorganic phosphate release rate constant
  dimension: "1 / [time]"
  description: First-order rate constant (k_2) for release of inorganic phosphate from ADP-Pi actin subunits.

- id: pi_release_half_life
  name: inorganic phosphate release half-life
  dimension: "[time]"
  description: Time from polymerization until 50% of subunits have released inorganic phosphate (P_ADP = 0.5) in the two-step ATP -> ADP-Pi -> ADP model.

- id: nucleotide_state_probability
  name: F-actin subunit nucleotide-state probability
  dimension: "dimensionless"
  description: Probability that an actin filament subunit of age t is in the ATP, ADP-Pi, or ADP state.

- id: molecular_weight
  name: molecular weight
  dimension: "[mass]"
  description: Molecular mass of a protein monomer, oligomer, or complex (in kDa; numerically equal to kg/mol).

- id: profilin_stoichiometry
  name: profilin-to-VASP binding stoichiometry
  dimension: "dimensionless"
  description: Number of human profilin I molecules bound per Cy3-VASP1-240aa construct.

- id: molar_extinction_coefficient
  name: molar extinction coefficient
  dimension: "[length] ** 2 / [substance]"
  description: Molar absorption coefficient used to quantify VASP or Cy3-VASP concentration spectrophotometrically.

- id: dye_a280_correction_fraction
  name: Cy3 absorbance contribution at 280 nm
  dimension: "dimensionless"
  description: Fractional/percentage contribution of Cy3 fluorophore absorbance to the 280 nm protein absorbance signal.

- id: labeling_efficiency
  name: Cy3-VASP labeling efficiency
  dimension: "dimensionless"
  description: Percentage of VASP subunits labeled with Cy3-maleimide.

- id: temperature
  name: temperature
  dimension: "[temperature]"
  description: Absolute or Celsius temperature of TIRF microscopy or analytical ultracentrifugation experiments.

- id: centrifuge_speed
  name: ultracentrifuge rotor speed
  dimension: "1 / [time]"
  description: Rotational speed (RPM) or angular velocity (rad/s) of the analytical ultracentrifuge rotor.

- id: auc_speed_factor
  name: AUC squared speed factor
  dimension: "dimensionless"
  description: Ratio (omega / omega_ref)^2 scaling reduced effective molecular weights relative to the 10,000 RPM reference speed.

- id: auc_reduced_molecular_weight
  name: AUC reduced effective molecular weight
  dimension: "1 / [length] ** 2"
  description: Buoyant reduced effective molecular weight sigma = M omega^2 (1 - vbar rho)/(R T) in cm^-2.

- id: partial_specific_volume
  name: protein partial specific volume
  dimension: "[length] ** 3 / [mass]"
  description: Partial specific volume (vbar) of a protein in aqueous buffer (cm^3/g).

- id: solvent_density
  name: solvent density
  dimension: "[mass] / [length] ** 3"
  description: Mass density (rho) of the ultracentrifugation buffer (g/cm^3).

- id: auc_radial_coordinate_x
  name: AUC transformed radial coordinate X
  dimension: "[length] ** 2"
  description: Radial coordinate X = (r^2 - r_m^2)/2 (or cell span delta_X = X_max - X_min) in cm^2.

- id: auc_actin_vasp_ratio
  name: actin-to-VASP molar ratio in AUC
  dimension: "dimensionless"
  description: Molar concentration ratio R_av = [actin]/[VASP] in sedimentation equilibrium mixtures.

- id: auc_actin_binding_site_index
  name: VASP actin-binding site index
  dimension: "dimensionless"
  description: Integer index i = 1, 2, 3, 4 denoting the number of bound actin monomers or sequential binding step on a VASP tetramer.

- id: auc_normalized_association_constant
  name: AUC normalized association constant K_a
  dimension: "dimensionless"
  description: Fitted association constant K_a of the first actin monomer in Fig. S5 normalized coordinates (printed without units as 1.11).

- id: auc_cooperativity_factor
  name: negative cooperativity factor beta
  dimension: "dimensionless"
  description: Dimensionless factor beta multiplying each successive actin binding affinity (K_a, beta K_a, beta^2 K_a, beta^3 K_a) on a VASP tetramer.

- id: vasp_g_actin_kd
  name: VASP-to-monomeric-actin dissociation constant
  dimension: "[substance] / [length] ** 3"
  description: Stepwise equilibrium dissociation constant (K_d) for binding of the i-th actin monomer to a VASP tetramer in Fig. S5B.

- id: auc_meniscus_concentration_norm
  name: area-normalized meniscus concentration
  dimension: "1 / [length] ** 2"
  description: Area-normalized free VASP (V_o) or free actin (A_o) meniscus concentration in Fig. S5 Eqns. 3-5 (units cm^-2 when integral over dX is 1).

- id: vasp_actin_bound_count
  name: average actin monomers bound per VASP tetramer
  dimension: "dimensionless"
  description: Cell-averaged mean number of actin monomers bound per VASP tetramer at sedimentation equilibrium.

- id: vasp_actin_saturation_fraction
  name: fractional saturation of VASP actin-binding sites
  dimension: "dimensionless"
  description: Fraction of the four actin-monomer binding sites on a VASP tetramer occupied at equilibrium (mean bound / 4).

- id: auc_base_to_meniscus_ratio
  name: AUC base-to-meniscus VASP concentration ratio
  dimension: "dimensionless"
  description: Ratio V(X_max)/V(X_min) of total labeled VASP concentration across the centrifuge cell data window.

- id: r_squared
  name: coefficient of determination R^2
  dimension: "dimensionless"
  description: Goodness-of-fit R^2 reported for exponential fits of dwell-time distributions.

- id: pyrene_fluorescence
  name: pyrene-actin fluorescence intensity
  dimension: "dimensionless"
  description: Bulk pyrene-labeled actin polymerization fluorescence signal in arbitrary units (A.U.), Fig. 1C.

- id: binding_event_frequency
  name: single-molecule binding event frequency
  dimension: "dimensionless"
  description: Number of single-molecule Cy3-VASP binding events per histogram bin (Figs. 2E, 4E) or filament-age bin (Fig. 3F).

- id: filament_pixel_position
  name: actin filament pixel position
  dimension: "dimensionless"
  description: Discrete pixel position along an actin filament from apparent barbed end (pixel 1) to lateral side (pixels 2-10), Fig. 3C.

- id: filament_localization_frequency
  name: Cy3-VASP filament localization frequency
  dimension: "dimensionless"
  description: Fractional probability of single-molecule Cy3-VASP binding events localized at a given filament pixel position, Fig. 3C.

- id: condition_index
  name: experimental condition index
  dimension: "dimensionless"
  description: Integer index labeling discrete construct, mutant, or assay conditions on categorical bar charts (Figs. 3D, 5B, 5D, 5E, S1B, S3D, S4D).

- id: subunits_added_before_capping
  name: actin subunits added before capping
  dimension: "dimensionless"
  description: Average number of actin subunits incorporated at barbed ends before growth termination by capping protein (Figs. 6B, S2D(i)).

- id: auc_radius
  name: AUC radial position
  dimension: "[length]"
  description: Radial distance from the ultracentrifuge rotor axis (cm) in sedimentation equilibrium absorbance scans (Fig. 5A).

- id: auc_absorbance_550nm
  name: AUC absorbance at 550 nm
  dimension: "dimensionless"
  description: Optical absorbance at 550 nm monitoring Cy3-labeled VASP1-240aa in sedimentation equilibrium (Fig. 5A).

- id: auc_vasp_signal_e
  name: AUC normalized Cy3-VASP signal e(X)
  dimension: "dimensionless"
  description: Normalized Cy3-VASP sedimentation equilibrium concentration profile e(X) plotted in Fig. S5C.

- id: cy3_vasp_fold_signal
  name: Cy3-VASP fluorescence fold signal
  dimension: "dimensionless"
  description: Fold increase in Cy3-VASP fluorescence signal plotted for single filaments, parallel bundles, and anti-parallel bundles in Fig. S4D.

