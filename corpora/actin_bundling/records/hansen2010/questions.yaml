- id: q_auc_missing_statistical_factors
  kind: possible_error
  about:
    - auc_vasp_actin_equilibrium_quintic
    - auc_cooperative_kd_ladder
    - auc_beta_optimum_figs5b
    - auc_beta_text_rounded
    - auc_kd_four_sites_table
  citation:
    page: 21
    printed_page: "Fig. S5 (3)"
    where: "Fig. S5 Eqn. 2 (p. 21) and cooperativity text (pp. 22-23)"
    quote: "It is important to note that this model assumes that all the binding events are equivalent and occur with identical association constants."
    none: "PDF pages 19-23 (Fig. S5) are rasterized images with no embedded text layer (text/page-019..023.txt are blank)."
  text: >
    Fig. S5 Eqn. 2 (PDF p. 21) writes V_TOT = V_o I_o + K_a A_o V_o I_1 + K_a^2 A_o^2 V_o I_2
    + K_a^3 A_o^3 V_o I_3 + K_a^4 A_o^4 V_o I_4 without the binomial combinatorial degeneracy
    factors C(4, i) = (1, 4, 6, 4, 1) required for four equivalent, independent binding sites on
    a tetramer. Page 22 then claims 'If beta=1, occupancy does not change affinity' and p. 23
    concludes that fitted beta = 0.213 (< 1.0) indicates strong negative cooperativity. In fact,
    for four truly independent equivalent sites with microscopic affinity k, the macroscopic
    stepwise association constants are K_1 = 4k, K_2 = (3/2)k = 0.375 K_1, K_3 = (2/3)k =
    0.444 K_2, and K_4 = (1/4)k = 0.375 K_3 (geometric mean stepwise ratio 16^(-1/3) = 0.397,
    and K_d4 / K_d1 = 16 purely from site statistics). Omitting C(4, i) conflates statistical
    depletion of free sites with physical negative cooperativity: the fitted beta = 0.2125
    (K_d4 / K_d1 = 104) corresponds to a true microscopic cooperativity factor of ~0.54 per step
    (~6.5x across three steps rather than 104x).

