- id: q_capping_eq_misprint
  kind: possible_error
  about:
    - capping_fraction_exponential_printed
    - capping_fraction_exponential_corrected
    - k_obs_capping_50mM_kcl_no_vasp
    - k_obs_capping_50mM_kcl_50nM_vasp
  citation:
    page: 9
    printed_page: "579"
    quote: "Calculation of Kobs was achieved by fitting data to the"
    where: "Fig. 6C caption (and Fig. S2D caption p. S2)"
  text: >
    Both Fig. 6C caption (p. 579) and Fig. S2D(iii-iiii) caption (p. S2) print the KaleidaGraph
    capping fit equation as '[BE]_free * exp^(-k/tau_1)' (or 'exp^(-k/tau)'). This printed form
    has three errors: (1) it omits the time variable t, (2) dividing a rate k by a time constant
    tau_1 gives a dimensionally invalid exponent (1/s^2), and (3) a decaying exponential contradicts
    the y-axis 'Fraction of capped barbed ends', which rises from 0 to 1. Evaluating the corrected
    variant f_capped(t) = 1 - exp(-K_obs * t) at the printed Fig. 6C table rates reproduces the
    plotted curves (e.g., 0.914 at t = 50 s for 4 nM CP without VASP; 0.716 at t = 200 s for
    2 nM CP + 50 nM VASP).

- id: q_auc_ka_to_kd_normalization_gap
  kind: unexplained_difference
  about:
    - auc_ka_to_kd_area_normalized
    - auc_ka_optimum_figs5b
    - auc_kd1_vasp_g_actin
    - cmp_auc_kd1_from_ka_area_norm
    - auc_vasp_actin_equilibrium_quintic
  citation:
    page: 23
    printed_page: "Fig. S5 (5)"
    where: "Fig. S5B caption and Fig. S5C"
    quote: "The optimum values of the two parameters are Ka=1.11 and beta=0.2125. Converting the affinity to units of concentration yields Kd s for the four sites of: 0.43, 2.0, 9.5, and 45 uM."
    none: "PDF pages 19-23 (Fig. S5) are rasterized images with no embedded text layer (text/page-019..023.txt are blank)."
  text: >
    Fig. S5 (p. 21) states 'normalize the data so that the area under each of the curves is 1'
    (V_TOT = 1 in Eqns. 3-5) and Fig. S5B (p. 23) reports optimum K_a = 1.11 (unitless) and
    converted K_d = 0.43, 2.0, 9.5, 45 uM at [VASP] = 1.43 uM, without stating the conversion
    formula. Under strict unit-area normalization, K_a_norm = K_a_phys * (C_vasp * delta_X), so
    K_d1 = C_vasp * delta_X / K_a = 1.43 * 1.45 / 1.11 = 1.87 uM (4.3x larger than 0.43 uM; even
    without delta_X, 1.43 / 1.11 = 1.29 uM). Direct inspection of Fig. S5C shows that the plotted
    curves do NOT have unit area: their y-axis ('e') spans 0-12 with mean y ~ 2.8-3.0 and area
    ~ 3.7-4.2 over delta_X ~ 1.3-1.45 cm^2. Using 1 e-unit ~ 1.43 / 3.0 = 0.477 uM converts
    K_a = 1.11 e^-1 to K_d1 = 0.477 / 1.11 = 0.43 uM, and the resulting physical binding strength
    matches the base-to-meniscus steepness of the red fit curves in Fig. S5C. Thus K_a = 1.11
    was fitted in unstated 'e'-units (~3 e-units per 1.43 uM VASP) rather than the area-1
    normalization described on p. 21.

- id: q_auc_sigma_ratio_mismatch
  kind: unexplained_difference
  about:
    - auc_reduced_molecular_weight
    - auc_sigma_o_vasp
    - auc_sigma_a_actin
    - cmp_auc_sigma_o_vasp
