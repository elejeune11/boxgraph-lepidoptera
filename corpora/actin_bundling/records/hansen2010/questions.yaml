    - graham2023/monomer_addition_rate_text
    - graham2023/linear_bundle_elongation
    - graham2023/elongation_monomer_rate
  text: >
    No cross-record validations are entered between hansen2010 and graham2023 (0 entries in both
    directions) and 0 cited.yaml links apply. Notably, graham2023 p. 582 (p. 9, Fig. 5h) explicitly
    cites hansen2010 (ref-2) when reporting VASP-droplet actin bundle elongation at 150 mM NaCl,
    10 uM VASP monomer (2.5 uM tetramer), 2 uM actin, 3% PEG, no profilin: '23 +/- 3 nm s^-1, about
    8 to 9 monomers per second (Fig. 5h). This rate is consistent with previously measured rates of
    VASP-catalysed single filament elongation at physiological ionic strength [ref-2].' However,
    hansen2010/michaelis_menten_barbed_end_rate cannot be validly run on graham2023's conditions
    because it lacks [salt] and [actin] inputs and is parameterized exclusively at low salt (50 mM
    KCl, 1 uM actin: v_0 = 10 sub/s, delta_v_max = 23 sub/s, K_d = 9.2 nM -> 32.9 sub/s at 2.5 uM
    VASP tetramer, 3.9x above Graham's 8-9 sub/s), whereas hansen2010 Fig. 1D (d_fig1d_100mM_vasp)
    itself proved that raising salt to 100 mM KCl without profilin suppresses VASP's ~3x speedup to
    ~20% (8.29 -> 9.42-10.28 sub/s at 1 uM actin; no Michaelis-Menten curve is fitted at 100 mM KCl).
    Thus graham2023 p. 582 is a direct measurement-to-measurement comparison (and notably Graham's
    8-9 sub/s at 2 uM bulk actin matches Hansen's 1 uM rather than 2 uM actin rate, suggesting
    monomer depletion or confinement load inside elongating droplets), while monomer_addition_rate_text
    is derived rather than directly measured. Conversely, graham2023's ring/droplet mechanical models
    and linear_bundle_elongation (y = v * t) predict no observable measured in hansen2010.

