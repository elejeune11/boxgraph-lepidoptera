  citation:
    page: 20
    printed_page: "Fig. S5 (2)"
    where: "Fig. S5 p. 2"
    quote: "sigma_o = 1.78, sigma_a = 0.57, sigma_1 = 2.35, sigma_2 = 2.92, sigma_3 = 3.50, sigma_4 = 4.07"
    none: "PDF pages 19-23 (Fig. S5) are rasterized images with no embedded text layer (text/page-019..023.txt are blank)."
  text: >
    Fig. S5 states neither temperature T, partial specific volume vbar, nor solvent density rho
    for calculating sigma = M omega^2 (1 - vbar rho)/(RT) at 10,000 RPM. With standard values
    (T = 20 degC, vbar = 0.73 cm^3/g, rho = 1.00 g/cm^3), 161 kD VASP tetramer gives
    sigma_o = 1.96 cm^-2 (10% above printed 1.78) while 42 kD actin gives sigma_a = 0.51 cm^-2
    (11% below printed 0.57). Because the errors have opposite signs, no single common vbar or T
    reproduces both: the printed ratio sigma_o / sigma_a = 1.78 / 0.57 = 3.12 disagrees with
    M_VASP / M_actin = 161 / 42 = 3.83 (reproducing both simultaneously requires vbar_VASP ~ 0.754
    and vbar_actin ~ 0.698 cm^3/g at 20 degC, or distinct effective buoyant masses).

