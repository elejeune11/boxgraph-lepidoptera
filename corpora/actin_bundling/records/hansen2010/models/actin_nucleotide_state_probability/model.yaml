id: actin_nucleotide_state_probability
name: F-actin subunit ATP, ADP-Pi, and ADP nucleotide-state probabilities vs filament age (Fig. 3F/I, S3E)
role: model
from_words: true
stated:
  page: 17
  printed_page: "S3"
  quote: "Model of nucleotide hydrolysis and inorganic phosphate release from F-actin"
  where: "Fig. S3E"
equation: "P_ATP(t) = exp(-k1*t); P_ADP_Pi(t) = k1/(k1 - k2)*(exp(-k2*t) - exp(-k1*t)); P_ADP(t) = 1 - P_ATP(t) - P_ADP_Pi(t)"
inputs:
  k1:
    quantity: atp_hydrolysis_rate
    unit: 1/s
  k2:
    quantity: pi_release_rate
    unit: 1/s
  t:
    quantity: time
    unit: s
outputs:
  p_atp:
    quantity: nucleotide_state_probability
    unit: dimensionless
  p_adp_pi:
    quantity: nucleotide_state_probability
    unit: dimensionless
  p_adp:
    quantity: nucleotide_state_probability
    unit: dimensionless
settings: {}
stochastic: false
