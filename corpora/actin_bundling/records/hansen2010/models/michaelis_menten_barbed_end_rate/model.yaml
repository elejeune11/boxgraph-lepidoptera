id: michaelis_menten_barbed_end_rate
name: Offset Michaelis-Menten fit of barbed-end growth rate vs VASP concentration (Fig. 4G)
role: fit
from_words: true
stated:
  page: 7
  printed_page: "577"
  quote: "Data fit to Michaelis-Menten equation with a y-axis offset of 10"
  where: "Fig. 4G caption"
equation: "v = v_0 + delta_v_max * C_vasp / (K_d + C_vasp)"
inputs:
  v_0:
    quantity: barbed_end_elongation_rate
    unit: 1/s
  delta_v_max:
    quantity: barbed_end_elongation_rate
    unit: 1/s
  C_vasp:
    quantity: vasp_concentration_tetramer
    unit: nM
  K_d:
    quantity: vasp_barbed_end_kd
    unit: nM
outputs:
  v:
    quantity: barbed_end_elongation_rate
    unit: 1/s
settings: {}
stochastic: false
