id: capping_fraction_exponential_printed
name: Printed exponential capping fit equation (Fig. 6C, Fig. S2D)
role: fit
runnable: false
not_runnable_reason: >
  The printed fit formula '[BE]_free * exp^(-k/tau_1)' (Fig. 6C caption, p. 579) and
  '[BE]_free * exp^(-k/tau)' (Fig. S2D caption, p. S2) omits the independent time variable t,
  places a rate divided by a time constant (dimension 1/[time]^2) inside the exponential, and
  describes a decaying free-barbed-end curve rather than the rising 'Fraction of capped barbed
  ends' plotted in Fig. 6C and Fig. S2D(iii-iiii). See corrected variant
  capping_fraction_exponential_corrected.
stated:
  page: 9
  printed_page: "579"
  quote: "Calculation of Kobs was achieved by fitting data to the"
  where: "Fig. 6C caption"
equation: "f = [BE]_free * exp^(-k / tau_1)"
inputs:
  BE_free:
    quantity: free_barbed_end_fraction
    unit: dimensionless
  k:
    quantity: capping_observed_rate
    unit: 1/s
  tau_1:
    quantity: time
    unit: s
outputs:
  f_capped:
    quantity: capped_barbed_end_fraction
    unit: dimensionless
settings: {}
stochastic: false
