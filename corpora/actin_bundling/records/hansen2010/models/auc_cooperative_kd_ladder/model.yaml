id: auc_cooperative_kd_ladder
name: Stepwise cooperative dissociation constants K_d,i for the four actin binding sites on a VASP tetramer (Fig. S5A/B)
role: model
from_words: true
stated:
  page: 22
  printed_page: "Fig. S5 (4)"
  where: "Fig. S5 p. 4"
  quote: "In this scheme, the first monomer binds with association constant Ka, the second binds with beta Ka, the third with beta^2 Ka, and the fourth with beta^3 Ka."
  none: "PDF pages 19-23 (Fig. S5) are rasterized images with no embedded text layer (text/page-019..023.txt are blank)."
equation: "K_d_i = K_d_1 / beta^(i - 1)"
inputs:
  K_d_1:
    quantity: vasp_g_actin_kd
    unit: uM
  beta:
    quantity: auc_cooperativity_factor
    unit: dimensionless
  i:
    quantity: auc_actin_binding_site_index
    unit: dimensionless
outputs:
  K_d_i:
    quantity: vasp_g_actin_kd
    unit: uM
settings: {}
stochastic: false
