id: barbed_end_association_rate
name: VASP barbed-end association rate constant from K_off and K_d
role: model
from_words: true
stated:
  page: 7
  printed_page: "577"
  quote: "we calculated a barbed end association rate constant of 75"
  where: "Fig. 4G caption"
equation: "k_on = K_off / K_d"
inputs:
  K_off:
    quantity: vasp_barbed_end_koff
    unit: 1/s
  K_d:
    quantity: vasp_barbed_end_kd
    unit: uM
outputs:
  k_on:
    quantity: vasp_barbed_end_kon
    unit: uM^-1*s^-1
settings: {}
stochastic: false
