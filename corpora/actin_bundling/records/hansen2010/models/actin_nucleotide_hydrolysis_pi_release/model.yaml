id: actin_nucleotide_hydrolysis_pi_release
name: Two-step F-actin ATP hydrolysis and inorganic phosphate release half-life (Fig. S3E)
role: model
from_words: true
stated:
  page: 17
  printed_page: "S3"
  quote: "Using MatLab, a half-life of 296 s was calculated for release of inorganic phosphate"
  where: "Fig. S3E caption"
equation: "ATP --k1--> ADP-Pi --k2--> ADP; P_ADP(t_half) = 1 - (k1*exp(-k2*t_half) - k2*exp(-k1*t_half))/(k1 - k2) = 0.5"
inputs:
  k1:
    quantity: atp_hydrolysis_rate
    unit: 1/s
  k2:
    quantity: pi_release_rate
    unit: 1/s
outputs:
  t_half:
    quantity: pi_release_half_life
    unit: s
settings:
  xtol: 1.0e-12
stochastic: false
