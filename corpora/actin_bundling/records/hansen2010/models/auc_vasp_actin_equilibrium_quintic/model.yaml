id: auc_vasp_actin_equilibrium_quintic
name: Cooperative 4-site VASP-tetramer / monomeric-actin AUC sedimentation equilibrium model (Fig. S5 Eqns. 1-5)
role: model
built_from:
  - auc_complex_reduced_mw
  - auc_speed_factor
  - auc_actin_vasp_ratio
stated:
  page: 22
  printed_page: "Fig. S5 (4)"
  where: "Fig. S5 Eqns. 1-5"
  quote: "The coefficients for eqn. 3 become: B0 = -Rav Io ... B5 = beta^6 Ka^4 Ia I4 And eqn. 4 now becomes: Vo = 1 / (Io + Ka Ao {I1 + beta Ka Ao [I2 + beta^2 Ka Ao (I3 + beta^3 Ka Ao I4)]}) (eqn. 5)"
  none: "PDF pages 19-23 (Fig. S5) are rasterized images with no embedded text layer (text/page-019..023.txt are blank)."
equation: "B_5*A_o^5 + B_4*A_o^4 + B_3*A_o^3 + B_2*A_o^2 + B_1*A_o + B_0 = 0; V_o = 1 / sum_{i=0}^4 beta^(i(i-1)/2) (K_a A_o)^i I_i"
inputs:
  sigma_o:
    quantity: auc_reduced_molecular_weight
    unit: cm^-2
  sigma_a:
    quantity: auc_reduced_molecular_weight
    unit: cm^-2
  C_actin:
    quantity: actin_concentration
    unit: uM
  C_vasp:
    quantity: vasp_concentration_tetramer
    unit: uM
  omega:
    quantity: centrifuge_speed
    unit: rpm
  omega_ref:
    quantity: centrifuge_speed
    unit: rpm
  K_a:
    quantity: auc_normalized_association_constant
    unit: dimensionless
  beta:
    quantity: auc_cooperativity_factor
    unit: dimensionless
  X_min:
    quantity: auc_radial_coordinate_x
    unit: cm^2
  X_max:
    quantity: auc_radial_coordinate_x
    unit: cm^2
outputs:
  A_o:
    quantity: auc_meniscus_concentration_norm
    unit: cm^-2
  V_o:
    quantity: auc_meniscus_concentration_norm
    unit: cm^-2
  mean_actin_bound:
    quantity: vasp_actin_bound_count
    unit: dimensionless
  fractional_saturation:
    quantity: vasp_actin_saturation_fraction
    unit: dimensionless
  V_base_to_meniscus:
    quantity: auc_base_to_meniscus_ratio
    unit: dimensionless
settings: {}
stochastic: false
