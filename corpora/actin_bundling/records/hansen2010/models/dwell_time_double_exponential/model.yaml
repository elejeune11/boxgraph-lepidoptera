id: dwell_time_double_exponential
name: Double-exponential dwell-time survival fit (1 - CF, Materials and methods)
role: fit
stated:
  page: 12
  printed_page: "582"
  quote: "nential equation, f(x) = x0"
  where: "Materials and methods"
equation: "f(x) = x0 * exp^(-x / tau_1) + (1 - x0) * exp^(-x / tau_2)"
inputs:
  x:
    quantity: time
    unit: s
  x0:
    quantity: binding_mode_fraction
    unit: dimensionless
  tau_1:
    quantity: vasp_side_dwell_time
    unit: s
  tau_2:
    quantity: vasp_side_dwell_time
    unit: s
outputs:
  survival:
    quantity: survival_fraction
    unit: dimensionless
settings: {}
stochastic: false
