id: capping_fraction_exponential_corrected
name: Corrected exponential capping cumulative curve (variant of Fig. 6C fit equation)
role: fit
variant_of: capping_fraction_exponential_printed
corrections:
  - equation: "Fig. 6C and Fig. S2D(iii-iiii) capping fit formula"
    change: "f_capped(t) = 1 - exp(-K_obs * t) instead of printed [BE]_free * exp^(-k/tau_1)"
    evidence: >
      Fig. 6C (p. 579) and Fig. S2D(iii-iiii) (p. S2) plot 'Fraction of capped barbed ends' rising
      monotonically from 0 at t = 0 toward 1.0, and evaluating 1 - exp(-K_obs * t) at the printed
      Fig. 6C table values (K_obs = 0.049, 0.024, 0.0099, 0.0063 s^-1) matches all four plotted
      curves (e.g., 0.914 at t = 50 s for 4 nM CP without VASP; 0.716 at t = 200 s for 2 nM CP
      + 50 nM VASP), whereas the printed exponent -k/tau_1 lacks time t and has dimension 1/s^2.
stated:
  page: 9
  printed_page: "579"
  quote: "Calculation of Kobs was achieved by fitting data to the"
  where: "Fig. 6C caption"
equation: "f_capped(t) = 1 - exp(-K_obs * t)"
inputs:
  K_obs:
    quantity: capping_observed_rate
    unit: 1/s
  t:
    quantity: time
    unit: s
outputs:
  f_capped:
    quantity: capped_barbed_end_fraction
    unit: dimensionless
  f_free:
    quantity: free_barbed_end_fraction
    unit: dimensionless
settings: {}
stochastic: false
