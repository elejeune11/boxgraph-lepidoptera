id: auc_sedphat_profilin_fit
name: Global sedimentation equilibrium fitting of Cy3-VASP1-240aa + hProI in NIH Sedphit/Sedphat (Fig. 5A)
role: fit
runnable: false
not_runnable_reason: >
  Global fitting of three multi-speed (10, 14, 20 K rpm) absorbance equilibrium traces in NIH
  Sedphit/Sedphat cannot be run because the paper does not report the raw radial absorbance
  traces, meniscus/bottom radii, buffer density, partial specific volume, or fitted VASP-profilin
  dissociation constants.
stated:
  page: 12
  printed_page: "582"
  quote: "Global fitting of three equilibrium traces (e.g., 10, 14, 20 K rpm) for each"
  where: "Materials and methods"
inputs:
  C_profilin:
    quantity: profilin_concentration
    unit: uM
  MW_vasp:
    quantity: molecular_weight
    unit: kDa
  MW_profilin:
    quantity: molecular_weight
    unit: kDa
outputs:
  MW_obs:
    quantity: molecular_weight
    unit: kDa
  n_profilin:
    quantity: profilin_stoichiometry
    unit: dimensionless
settings: {}
stochastic: false
