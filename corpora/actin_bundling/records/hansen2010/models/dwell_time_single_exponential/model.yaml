id: dwell_time_single_exponential
name: Single-exponential dwell-time survival fit (1 - CF, Materials and methods)
role: fit
stated:
  page: 12
  printed_page: "582"
  quote: "a single exponential equation, f(x) = x0"
  where: "Materials and methods"
equation: "f(x) = x0 * exp^(-x / tau_1)"
inputs:
  x:
    quantity: time
    unit: s
  x0:
    quantity: survival_fraction
    unit: dimensionless
  tau_1:
    quantity: vasp_barbed_end_dwell_time
    unit: s
outputs:
  survival:
    quantity: survival_fraction
    unit: dimensionless
settings: {}
stochastic: false
