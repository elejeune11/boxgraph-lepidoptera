id: auc_ka_to_kd_area_normalized
name: First-site K_d implied by Fig. S5 unit-area normalization of V_TOT = 1
role: model
from_words: true
stated:
  page: 21
  printed_page: "Fig. S5 (3)"
  where: "Fig. S5 p. 3 and p. 5"
  quote: "If we normalize the data so that the area under each of the curves is 1, we now have two equations with only two unknowns (Vo and Ao)."
  none: "PDF pages 19-23 (Fig. S5) are rasterized images with no embedded text layer (text/page-019..023.txt are blank)."
equation: "K_d_1 = C_vasp * delta_X / K_a"
inputs:
  C_vasp:
    quantity: vasp_concentration_tetramer
    unit: uM
  delta_X:
    quantity: auc_radial_coordinate_x
    unit: cm^2
  K_a:
    quantity: auc_normalized_association_constant
    unit: dimensionless
outputs:
  K_d_1:
    quantity: vasp_g_actin_kd
    unit: uM
settings: {}
stochastic: false
