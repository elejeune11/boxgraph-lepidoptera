id: auc_reduced_molecular_weight
name: AUC reduced effective molecular weight sigma_o (Fig. S5)
role: model
stated:
  page: 19
  printed_page: "Fig. S5 (1)"
  where: "Fig. S5 p. 1"
  quote: "The constant, sigma_o is the reduced, effective molecular weight of the species, given by sigma_o = M omega^2 (1 - vbar rho) / RT"
  none: "PDF pages 19-23 (Fig. S5) are rasterized images with no embedded text layer (text/page-019..023.txt are blank)."
equation: "sigma_o = M * omega^2 * (1 - vbar * rho) / (R * T)"
inputs:
  M:
    quantity: molecular_weight
    unit: kDa
  omega:
    quantity: centrifuge_speed
    unit: rad/s
  vbar:
    quantity: partial_specific_volume
    unit: cm^3/g
  rho:
    quantity: solvent_density
    unit: g/cm^3
  T:
    quantity: temperature
    unit: K
outputs:
  sigma_o:
    quantity: auc_reduced_molecular_weight
    unit: cm^-2
settings: {}
stochastic: false
