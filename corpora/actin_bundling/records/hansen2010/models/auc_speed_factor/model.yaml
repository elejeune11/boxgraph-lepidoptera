id: auc_speed_factor
name: AUC speed factor scaling reduced molecular weight relative to reference speed (Fig. S5)
role: model
from_words: true
stated:
  page: 19
  printed_page: "Fig. S5 (1)"
  where: "Fig. S5 p. 1"
  quote: "adjust the reduced effective molecular weights using a speed factor (the square of the ratio of the speed at which data was collected with respect to some reference speed)"
  none: "PDF pages 19-23 (Fig. S5) are rasterized images with no embedded text layer (text/page-019..023.txt are blank)."
equation: "speed_factor = (omega / omega_ref)^2"
inputs:
  omega:
    quantity: centrifuge_speed
    unit: rpm
  omega_ref:
    quantity: centrifuge_speed
    unit: rpm
outputs:
  speed_factor:
    quantity: auc_speed_factor
    unit: dimensionless
settings: {}
stochastic: false
