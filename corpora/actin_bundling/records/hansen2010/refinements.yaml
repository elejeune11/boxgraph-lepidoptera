- id: ref_pi_release_xtol
  run: run_pi_release_half_life
  setting: xtol
  factors: [1, 10, 100]
  mode: divide
  output: t_half
  tolerance: "0.01%"
  tolerance_basis: "added: three orders of magnitude tighter than the 1 s rounding precision of the printed 296 s half-life"
  tolerance_added: true
