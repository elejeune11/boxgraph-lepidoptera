- id: delta_v_max_fig4g_added
  quantity: barbed_end_elongation_rate
  unit: 1/s
  printed: "23"
  basis: >
    Fig. 4G caption states a Michaelis-Menten fit with y-axis offset 10 sub/s and K_d = 9.2 +/- 1.4 nM,
    but does not state the fitted asymptotic amplitude delta_v_max. Reaching 29.1 sub/s at 50 nM VASP
    (84.5% of saturation) and ~31 sub/s at 100 nM VASP in Fig. 4G implies delta_v_max ~ 22.6-23 sub/s
    (whereas taking the p. 572 '~30 sub/s' maximum rate as the asymptote gives delta_v_max = 20 sub/s).
  alternatives: ["20", "22.6", "24"]
  stands_for: "V_max - v_0 in Fig. 4G offset Michaelis-Menten curve"
  conditions:
    actin_concentration: "1 uM"
    kcl_concentration: "50 mM"
    temperature: "23 degC"

- id: auc_temperature_added
  quantity: temperature
  unit: degC
  printed: "20"
  basis: >
    Materials and methods (p. 582) does not specify the Beckman XL-I analytical ultracentrifuge
    temperature; 20 degC is the standard AUC sedimentation equilibrium temperature (alternatives
    cover TIRF room temperature 23 degC and cosedimentation temperature 25 degC reported elsewhere
    in the paper).
  alternatives: ["23", "25"]
  stands_for: "T in Fig. S5 sigma_o = M omega^2 (1 - vbar rho) / (R T)"

- id: auc_vbar_protein_added
  quantity: partial_specific_volume
  unit: cm^3/g
  printed: "0.73"
  basis: >
    Fig. S5 (p. 19) defines vbar as the partial specific volume of the protein species but does not
    print its numerical value; 0.73 cm^3/g is the standard globular protein partial specific volume
    (0.75 cm^3/g reproduces sigma_o = 1.78 cm^-2 for 161 kDa VASP; 0.70 cm^3/g is needed for 42 kDa
    actin to reach sigma_a = 0.57 cm^-2).
  alternatives: ["0.70", "0.74", "0.75"]
  stands_for: "vbar in Fig. S5 sigma_o = M omega^2 (1 - vbar rho) / (R T)"

- id: auc_solvent_density_added
  quantity: solvent_density
  unit: g/cm^3
  printed: "1.00"
  basis: >
    Fig. S5 (p. 19) defines rho as the solvent density of 1x KMEI + 1 mM TCEP buffer but does not
    print a numerical value; dilute aqueous KMEI (50 mM KCl, 10 mM imidazole) has rho ~ 1.000-1.003 g/cm^3.
  alternatives: ["1.003", "1.005"]
  stands_for: "rho in Fig. S5 sigma_o = M omega^2 (1 - vbar rho) / (R T)"

- id: auc_delta_x_cell_added
  quantity: auc_radial_coordinate_x
  unit: cm^2
  printed: "1.45"
  basis: >
    Fig. S5 (p. 21) normalizes V_TOT = integral V(X) dX = 1 across the centrifuge cell without
    stating the meniscus/base X bounds. The Fig. S5C data windows span X ~ 0.28-1.72 cm^2
    (delta_X ~ 1.44 cm^2 for 2 uM actin) and X ~ 0.20-1.54 cm^2 (delta_X ~ 1.34 cm^2 for 25 uM actin);
    integrating from X = 0 to 1.72 gives 1.72 cm^2.
  alternatives: ["1.30", "1.50", "1.72"]
  stands_for: "delta_X = X_base - X_meniscus for converting area-normalized K_a to concentration K_d"

- id: auc_x_min_2uM_added
  quantity: auc_radial_coordinate_x
  unit: cm^2
  printed: "0.28"
  basis: "Left edge of the plotted data/fit trace in Fig. S5C left panel (2 uM actin); meniscus is at X = 0."
  alternatives: ["0.0", "0.20"]
  stands_for: "X_min integration bound in Fig. S5 Eqns. 2-5"

- id: auc_x_max_2uM_added
  quantity: auc_radial_coordinate_x
  unit: cm^2
  printed: "1.72"
  basis: "Right edge of the plotted data/fit trace in Fig. S5C left panel (2 uM actin)."
  alternatives: ["1.54", "1.80"]
  stands_for: "X_max integration bound in Fig. S5 Eqns. 2-5"

