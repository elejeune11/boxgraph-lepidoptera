notes: >
  Full quantitative reading of Hansen and Mullins (2010), J. Cell Biol. 191(3):571-584
  (PDF pages 1-14) and its complete Supplemental Material (Figs. S1-S5, Videos 1-8,
  SI reference; PDF pages 15-25). All 25 page text files and all 25 page PNGs were
  inspected directly; PDF pages 19-23 (Fig. S5 mathematical appendix) are rasterized
  images with no embedded text layer (text/page-019.txt through page-023.txt are blank),
  so all equations and parameters from Fig. S5 were transcribed directly from the PNGs.

  In scope:
  - Single-molecule VASP barbed-end processivity and kinetic models (pp. 1, 6-7, 11):
    barbed-end dissociation rate k_off = 1/tau_1 (0.69 s^-1 from tau_1 = 1.45 +/- 0.02 s),
    association rate constant k_on = k_off / K_d (75 uM^-1 s^-1 from K_d = 9.2 +/- 1.4 nM),
    average monomers delivered per binding event N = v * tau_1 (42 monomers at 1 uM actin),
    and the offset Michaelis-Menten elongation rate fit v(C_VASP) = v_0 + delta_v_max * C / (K_d + C).
  - Elongation rate enhancement and anti-capping fold-change ratios (pp. 2, 6, 8-9, 16):
    2.7-fold slope enhancement (24 vs 9 uM^-1 s^-1), 2.5-fold profilin-actin enhancement
    (28.2 vs 11.4 sub/s; also cited as ~250% and 2.4x in Fig. 6B), 6.3-fold capping rate
    reduction at 50 mM KCl (12 vs 1.9 uM^-1 s^-1), and 2.7-fold reduction at 100 mM KCl
    (10 vs 3.7 uM^-1 s^-1).
  - Capping kinetics models (Fig. 6C-D p. 9; Fig. S2D p. 16): linear pseudo-first-order
    capping rate K_obs = K_+ * [CP] (tested against the 4 printed K_obs values in Fig. 6C,
    revealing sub-linearity at 2-4 nM CP in +50 nM VASP), the printed exponential fit
    equation [BE]_free * exp^(-k/tau_1) (non-runnable misprint: omits time t, invalid
    exponent dimension 1/s^2, decays instead of rising), and a corrected variant
    f_capped(t) = 1 - exp(-K_obs * t) matching Fig. 6C and Fig. S2D(iii-iiii).
  - Dwell-time survival curve models (p. 12) and binding-mode event counts/percentages
    (pp. 2-5; Fig. 2D/E/H, Fig. 3D/G, Fig. 4C/E), including consistency checks on total
    event counts (719 + 116 + 222 = 1057; 909 + 148 = 1057; vs n = 936 in Fig. 2E) and
    the Fig. 3G caption vs panel rounding (1.0 vs 1.01 s).
  - Sequential two-step F-actin nucleotide hydrolysis and Pi release model
    ATP --k1--> ADP-Pi --k2--> ADP (Fig. S3E p. 17, k1 = 0.035 s^-1, k2 = 0.0026 s^-1
    from Melki et al. 1996), reproducing the printed 296 s Pi-release half-life (296.28 s).
  - Stoichiometry and molecular weight checks: VASP tetramer/monomer molar conversion
    (250 nM / 4 = 62.5 nM vs 63 nM, Fig. 1C), VASP tetramer MW (4 x 40 kD vs 161/162 kD,
    Fig. 1B & p. 11), and Cy3-VASP1-240aa + hProI sedimentation equilibrium complex MW
    (Fig. 5A, 24.8 kD + n * 15 kD vs printed MW_pred = 38, 45, 53 kD), plus the
    non-runnable NIH Sedphit/Sedphat global fit model.
  - Complete Fig. S5 analytical ultracentrifugation (AUC) mathematical appendix (pp. 19-23):
    reduced molecular weight sigma = M omega^2 (1 - vbar rho)/(RT) (exposing a VASP/actin
    sigma_o/sigma_a ratio mismatch vs 161/42 kD), additive complex reduced weights
    sigma_i = sigma_o + i * sigma_a (exposing +0.01 rounding on sigma_3 = 3.50 and
    sigma_4 = 4.07), speed factors (omega/omega_ref)^2 (reproducing 0.25, 0.49, 1.00),
    actin-to-VASP ratios R_av = [actin]/[VASP] (reproducing 1.4 and 17.5), stepwise
    cooperative K_d ladder K_{d,i} = K_{d,1} / beta^(i-1) (reproducing 2.0, 9.5, 45 uM
    from 0.43 uM and beta = 0.2125), area-normalized K_a-to-K_d conversion (exposing a
    4.3-fold discrepancy between the p. 21 area-1 normalization and the printed K_{d,1} =
    0.43 uM from K_a = 1.11, consistent with Fig. S5C curves having mean y ~ 3 rather than
    unit area), and the full cooperative 5th-order polynomial equilibrium solver (Eqns. 1-5).

  Left out (feed no quantitative model):
  - Protein expression/purification buffer compositions, column protocols, slide silanization
    and PEGylation recipes, oxygen scavenger reagent concentrations, TIRF laser powers (40 mW),
    frame exposure/interval timings (50-100 ms), cosedimentation rotor speed/g-force
    (48,000 rpm / 102,611 g), and qualitative mutagenesis or video descriptions.

