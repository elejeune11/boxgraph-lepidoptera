id: actin_t_actin_solver_eq2_printed
name: inverse boundary-value solver for [T-actin] from printed SI Eq. (2) (p. 22)
role: model
stated:
  page: 22
  printed_page: "SI-10"
  quote: "Solving this numerically in Python using scipy.integrate, we find that [T-actin]=138.38 uM."
  where: "SI Methods, Eqs. (1)-(2)"
equation: "Solve d[F-actin]/dt = k_grow * N_fil * (1 - [F-actin] / [T-actin]) with [F-actin](0) = F_0 and [F-actin](t_end) = F_end for [T-actin]"
built_from:
  - actin_polymerization_ode_eq2_printed
inputs:
  k_grow: {quantity: filament_growth_rate, unit: um/s}
  N_fil: {quantity: filament_count, unit: dimensionless}
  F_0: {quantity: actin_concentration, unit: uM}
  F_end: {quantity: actin_concentration, unit: uM}
  t_end: {quantity: time, unit: s}
outputs:
  T_actin: {quantity: actin_concentration, unit: uM}
settings:
  dt: 1.0
stochastic: false
