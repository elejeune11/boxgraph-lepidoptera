id: langevin_overdamped_1d
name: 1D single-particle overdamped Langevin integrator (SI Methods, p. 23)
role: model
stated:
  page: 23
  printed_page: "SI-11"
  quote: "Cytosim through a Langevin equation framework."
  where: "SI Methods (Position evolution)"
equation: "dx^{ij}(t) = mu * f^{ij}_tot(t) * dt + dB_j(t); dB_j ~ N(0, sqrt(2 * D^i * dt)); D^i = mu * k_B * T"
built_from:
  - einstein_diffusion_relation
inputs:
  mu: {quantity: mobility, unit: um/(pN*s)}
  kBT: {quantity: thermal_energy, unit: pN*nm}
  f: {quantity: force, unit: pN}
outputs:
  D_eff: {quantity: diffusion_coefficient, unit: um^2/s}
  mean_dx: {quantity: displacement, unit: um}
settings:
  dt: 0.001
  t_sim: 0.2
  n_particles: 2000
  seed: 42
stochastic: true
