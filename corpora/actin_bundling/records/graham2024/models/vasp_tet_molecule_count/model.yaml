id: vasp_tet_molecule_count
name: discrete VASP tetramer molecule count in a spherical droplet (Table S1, p. 20)
role: processing
stated:
  page: 20
  printed_page: "SI-8"
  quote: "(1000 molecules of VASP-tetramer)"
  where: "Table S1"
equation: "N_VASP = [VASP-tet] * (4/3) * pi * R_drop^3 * N_A"
inputs:
  C: {quantity: vasp_tetramer_concentration, unit: uM}
  R_drop: {quantity: droplet_radius, unit: um}
outputs:
  N: {quantity: molecule_count, unit: dimensionless}
settings: {}
from_words: true
stochastic: false
