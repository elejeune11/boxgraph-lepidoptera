id: vasp_to_actin_molar_ratio
name: VASP-to-actin and actin-to-VASP molar concentration ratios (pp. 3, 7-8)
role: processing
stated:
  page: 3
  printed_page: "3"
  quote: "ratio of 1:7.5 (Fig. 2E). The concentration of VCA was 4 uM."
  where: "Results (Figs. 2E, 6A, 6B)"
equation: "R_VASP_actin = [VASP_mono] / [actin]; R_actin_VASP = [actin] / [VASP_mono]"
inputs:
  C_vasp: {quantity: vasp_monomer_concentration, unit: uM}
  C_actin: {quantity: actin_concentration, unit: uM}
outputs:
  vasp_to_actin: {quantity: vasp_to_actin_ratio, unit: dimensionless}
  actin_to_vasp: {quantity: actin_to_vasp_ratio, unit: dimensionless}
settings: {}
from_words: true
stochastic: false
