id: actin_polymerization_ode_eq2_printed
name: monomer-depletion F-actin polymerization ODE as printed (SI Eq. 2, p. 22)
role: model
stated:
  page: 22
  printed_page: "SI-10"
  quote: "solved the following ordinary differential equations in series"
  where: "SI Methods, Eq. (2)"
equation: "d[F-actin]/dt = k_grow * N_fil * (1 - [F-actin] / [T-actin])"
inputs:
  k_grow: {quantity: filament_growth_rate, unit: um/s}
  N_fil: {quantity: filament_count, unit: dimensionless}
  F_0: {quantity: actin_concentration, unit: uM}
  T_actin: {quantity: actin_concentration, unit: uM}
  t_end: {quantity: time, unit: s}
outputs:
  F_end: {quantity: actin_concentration, unit: uM}
  G_end: {quantity: actin_concentration, unit: uM}
settings:
  dt: 1.0
stochastic: false
