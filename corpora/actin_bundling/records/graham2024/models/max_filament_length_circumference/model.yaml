id: max_filament_length_circumference
name: maximum actin filament contour length around droplet equator (Table S1, p. 19)
role: model
stated:
  page: 19
  printed_page: "SI-7"
  quote: "Maximum length 2πRdrop μm Rdrop is radius of droplet"
  where: "Table S1"
equation: "L_max = 2 * pi * R_drop; N_seg = L_max / L_seg"
inputs:
  R_drop: {quantity: droplet_radius, unit: um}
  L_seg: {quantity: filament_segment_length, unit: um}
outputs:
  L_max: {quantity: filament_length, unit: um}
  N_seg: {quantity: segment_count, unit: dimensionless}
settings: {}
stochastic: false
