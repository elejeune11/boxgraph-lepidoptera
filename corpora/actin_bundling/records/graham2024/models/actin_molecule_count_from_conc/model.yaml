id: actin_molecule_count_from_conc
name: discrete actin monomer count in a spherical droplet from concentration (SI Methods, p. 22)
role: processing
stated:
  page: 22
  printed_page: "SI-10"
  quote: "calculated to be 69,823 molecules.The boundary condition corresponds"
  where: "SI Methods"
equation: "N_actin = [F-actin] * (4/3) * pi * R_drop^3 * N_A"
inputs:
  C: {quantity: actin_concentration, unit: uM}
  R_drop: {quantity: droplet_radius, unit: um}
outputs:
  N: {quantity: molecule_count, unit: dimensionless}
settings: {}
from_words: true
stochastic: false
