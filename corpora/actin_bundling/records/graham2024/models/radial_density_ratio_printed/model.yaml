id: radial_density_ratio_printed
name: radial shell-to-bulk F-actin density ratio as printed (SI Methods, p. 23)
role: processing
stated:
  page: 23
  printed_page: "SI-11"
  quote: "local density within shells and the bulk density as"
  where: "SI Methods (Analysis of trajectories)"
equation: "rho(r, delta_r) / rho(R_drop) = (N(r, delta_r) / (r^2 * delta_r)) / (N_total / R^3)"
inputs:
  N_shell: {quantity: molecule_count, unit: dimensionless}
  r: {quantity: radial_coordinate, unit: um}
  delta_r: {quantity: shell_thickness, unit: um}
  N_total: {quantity: molecule_count, unit: dimensionless}
  R_drop: {quantity: droplet_radius, unit: um}
outputs:
  density_ratio: {quantity: radial_density_ratio, unit: dimensionless}
settings: {}
stochastic: false
