id: filament_polymer_to_concentration
name: F-actin polymer length to monomer count and droplet concentration (SI Methods, pp. 22, 24)
role: processing
stated:
  page: 22
  printed_page: "SI-10"
  quote: "calculated to be 69,823 molecules.The boundary condition corresponds"
  where: "SI Methods (pp. 22, 24)"
equation: "L_total = N_fil * L_fil; N_monomers = L_total / l_mono; [F-actin] = N_monomers / ((4/3) * pi * R_drop^3 * N_A)"
inputs:
  N_fil: {quantity: filament_count, unit: dimensionless}
  L_fil: {quantity: filament_length, unit: um}
  l_mono: {quantity: actin_monomer_rise, unit: nm}
  R_drop: {quantity: droplet_radius, unit: um}
outputs:
  L_total: {quantity: total_polymer_length, unit: um}
  N_monomers: {quantity: molecule_count, unit: dimensionless}
  C_F: {quantity: actin_concentration, unit: uM}
settings: {}
from_words: true
stochastic: false
