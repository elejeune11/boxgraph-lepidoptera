id: vasp_tetramer_from_monomer
name: VASP tetramer concentration from monomer concentration (p. 2)
role: processing
stated:
  page: 2
  printed_page: "2"
  quote: "monomer concentration; 5 uM of VASP tetramer) in"
  where: "Results"
equation: "[VASP_tet] = [VASP_monomer] / valency"
inputs:
  C_mono: {quantity: vasp_monomer_concentration, unit: uM}
  valency: {quantity: binding_valency, unit: dimensionless}
outputs:
  C_tet: {quantity: vasp_tetramer_concentration, unit: uM}
settings: {}
from_words: true
stochastic: false
