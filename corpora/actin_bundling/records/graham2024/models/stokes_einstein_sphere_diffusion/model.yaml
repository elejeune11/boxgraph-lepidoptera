id: stokes_einstein_sphere_diffusion
name: Stokes-Einstein diffusivity of a spherical VASP tetramer in droplet medium (reconstructed consistency check)
role: model
stated:
  page: 19
  printed_page: "SI-7"
  quote: "Viscosity of droplet 0.5 pN.s/um2 50x water"
  where: "Table S1 (p. 19) & SI Methods (p. 23)"
equation: "D = k_B * T / (6 * pi * eta * r)"
inputs:
  eta: {quantity: dynamic_viscosity, unit: pN*s/um^2}
  r: {quantity: molecular_radius, unit: um}
  kBT: {quantity: thermal_energy, unit: pN*nm}
outputs:
  D: {quantity: diffusion_coefficient, unit: um^2/s}
  mu: {quantity: mobility, unit: um/(pN*s)}
settings: {}
reconstructed: "The paper writes D^i = mu k_B T (p. 23) and prints droplet viscosity eta = 0.5 pN*s/um^2, VASP sphere radius r = 30 nm, and VASP diffusion rate D = 10 um^2/s (Table S1, p. 19) without printing Stokes' drag mobility mu = 1/(6 pi eta r); this reconstructed Stokes-Einstein check evaluates the hydrodynamic diffusivity implied by eta and r."
stochastic: false
