id: radial_density_ratio_corrected
name: radial shell-to-bulk F-actin density ratio with spherical geometry factor 1/3 (variant of p. 23)
role: processing
stated:
  page: 23
  printed_page: "SI-11"
  quote: "local density within shells and the bulk density as"
  where: "SI Methods (Analysis of trajectories)"
equation: "rho(r, delta_r) / rho(R_drop) = (N(r, delta_r) / (4*pi*r^2*delta_r)) / (N_total / ((4/3)*pi*R^3)) = (1/3) * (N(r, delta_r)/(r^2*delta_r)) / (N_total/R^3)"
variant_of: radial_density_ratio_printed
corrections:
  - equation: "SI Methods radial density ratio (p. 23)"
    change: "multiply by 1/3 = ((4/3)*pi) / (4*pi), accounting for the ratio of spherical volume (4/3)*pi*R^3 to thin shell volume 4*pi*r^2*delta_r"
    evidence: "For a homogeneous distribution of monomers inside a sphere of radius R, N(r, delta_r)/N_total = (4*pi*r^2*delta_r)/((4/3)*pi*R^3) = 3*r^2*delta_r/R^3, so the printed formula without 1/3 evaluates to 3.0 instead of 1.0; Fig. 5B (p. 8) and Fig. S5c (p. 17) show that homogeneous actin at [Arp2/3] = 150 nM sits at rho(r, delta_r)/rho(R_drop) = 1.0, confirming the omitted 1/3 factor is a typographical misprint."
inputs:
  N_shell: {quantity: molecule_count, unit: dimensionless}
  r: {quantity: radial_coordinate, unit: um}
  delta_r: {quantity: shell_thickness, unit: um}
  N_total: {quantity: molecule_count, unit: dimensionless}
  R_drop: {quantity: droplet_radius, unit: um}
outputs:
  density_ratio: {quantity: radial_density_ratio, unit: dimensionless}
settings: {}
stochastic: false
