id: boundary_harmonic_force
name: spherical droplet boundary harmonic confinement force (Fig. S4c, p. 16)
role: model
stated:
  page: 16
  printed_page: "SI-4"
  quote: "within the droplet volume through harmonic potentials."
  where: "Supplemental Fig. S4c & Table S1 (p. 19)"
equation: "F_boundary = k_boundary * d (for d > 0 outside droplet boundary)"
inputs:
  k_boundary: {quantity: spring_stiffness, unit: pN/um}
  d: {quantity: boundary_excursion, unit: um}
outputs:
  F_boundary: {quantity: force, unit: pN}
settings: {}
stochastic: false
