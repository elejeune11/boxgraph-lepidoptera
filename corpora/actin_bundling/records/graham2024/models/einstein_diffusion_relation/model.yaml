id: einstein_diffusion_relation
name: Einstein mobility-diffusion relation (SI Methods, p. 23)
role: model
stated:
  page: 23
  printed_page: "SI-11"
  quote: "where the diffusion coefficient is given by"
  where: "SI Methods (Position evolution)"
equation: "D^i = mu * k_B * T (inverse: mu = D^i / (k_B * T))"
inputs:
  D: {quantity: diffusion_coefficient, unit: um^2/s}
  kBT: {quantity: thermal_energy, unit: pN*nm}
outputs:
  mu: {quantity: mobility, unit: um/(pN*s)}
settings: {}
stochastic: false
