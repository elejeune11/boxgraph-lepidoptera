id: vca_fiber_parameters
name: VCA competitor fiber CytoSim growth speed and max length (SI Methods, p. 24)
role: model
stated:
  page: 24
  printed_page: "SI-12"
  quote: "kbind NVCA = 8675. 68um/s Assuming each actin"
  where: "SI Methods (VCA sample calculation)"
equation: "k_bind^fiber = k_bind * N_VCA; L_Gmax = l_mono * factor_Gmax * N_VCA"
inputs:
  k_bind: {quantity: vca_binding_speed_per_molecule, unit: um/s}
  N_VCA: {quantity: molecule_count, unit: dimensionless}
  l_mono: {quantity: actin_monomer_rise, unit: nm}
  factor_Gmax: {quantity: vca_sequestration_factor, unit: dimensionless}
outputs:
  k_bind_fiber: {quantity: vca_fiber_growth_speed, unit: um/s}
  L_Gmax: {quantity: total_polymer_length, unit: um}
settings: {}
stochastic: false
