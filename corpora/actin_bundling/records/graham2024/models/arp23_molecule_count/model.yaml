  printed_page: "SI-8"
  quote: "{0, 25, 63, 126, 189, 252, 315, 378 } molecules"
  where: "Table S1"
equation: "N_Arp23 = [Arp2/3] * (4/3) * pi * R_drop^3 * N_A"
inputs:
  C: {quantity: arp23_concentration, unit: nM}
  R_drop: {quantity: droplet_radius, unit: um}
outputs:
