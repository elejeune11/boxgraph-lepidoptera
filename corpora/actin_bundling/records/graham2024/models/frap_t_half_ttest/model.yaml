id: frap_t_half_ttest
name: unpaired two-tailed Student t-test for FRAP recovery half-time (Fig. 1E)
role: processing
stated:
  page: 3
  printed_page: "3"
  quote: "mobile fraction for each condition, with corresponding P-values from an unpaired two-tailed t-test."
  where: "Fig. 1E caption & inset table"
equation: "t = (mean_1 - mean_2) / sqrt(s_p^2 * (1/n_1 + 1/n_2)); p = 2 * (1 - F_t(|t|, df = n_1 + n_2 - 2))"
inputs:
  mean_1: {quantity: frap_half_time, unit: s}
  sd_1: {quantity: frap_half_time_sd, unit: s}
  n_1: {quantity: droplet_count, unit: dimensionless}
  mean_2: {quantity: frap_half_time, unit: s}
  sd_2: {quantity: frap_half_time_sd, unit: s}
  n_2: {quantity: droplet_count, unit: dimensionless}
outputs:
  t_stat: {quantity: t_statistic, unit: dimensionless}
  p_value: {quantity: p_value, unit: dimensionless}
settings: {}
from_words: true
stochastic: false
