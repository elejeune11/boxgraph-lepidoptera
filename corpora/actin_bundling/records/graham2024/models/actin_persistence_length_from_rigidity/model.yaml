id: actin_persistence_length_from_rigidity
name: actin persistence length from flexural rigidity (p. 7 & Table S1 p. 19)
role: model
stated:
  page: 7
  printed_page: "7"
  quote: "persistence length of actin, ~17 um (42)"
  where: "Results (p. 7) & Table S1 (p. 19)"
equation: "L_p = K_bend / (k_B * T)"
inputs:
  K_bend: {quantity: flexural_rigidity, unit: pN*um^2}
  T: {quantity: temperature, unit: K}
outputs:
  L_p: {quantity: persistence_length, unit: um}
settings: {}
from_words: true
stochastic: false
