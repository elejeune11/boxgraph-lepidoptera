id: vca_molecule_count
name: discrete VCA molecule count in a spherical droplet (SI Methods, p. 24)
role: processing
stated:
  page: 24
  printed_page: "SI-12"
  quote: "radius 1um, [VCA] = 1uM"
  where: "SI Methods (VCA sample calculation)"
equation: "N_VCA = [VCA] * (4/3) * pi * R_drop^3 * N_A"
inputs:
  C: {quantity: vca_concentration, unit: uM}
  R_drop: {quantity: droplet_radius, unit: um}
outputs:
  N: {quantity: molecule_count, unit: dimensionless}
settings: {}
from_words: true
stochastic: false
