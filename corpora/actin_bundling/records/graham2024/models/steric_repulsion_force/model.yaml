id: steric_repulsion_force
name: steric harmonic repulsion force (Fig. S4d, p. 16)
role: model
stated:
  page: 16
  printed_page: "SI-4"
  quote: "Steric repulsion potentials prevent spatial"
  where: "Supplemental Fig. S4d & Table S1 (pp. 19-20)"
equation: "F_steric = k_steric * (d - r)"
inputs:
  k_steric: {quantity: spring_stiffness, unit: pN/um}
  d: {quantity: pair_separation, unit: um}
  r: {quantity: molecular_radius, unit: um}
outputs:
  F_steric: {quantity: force, unit: pN}
settings: {}
stochastic: false
