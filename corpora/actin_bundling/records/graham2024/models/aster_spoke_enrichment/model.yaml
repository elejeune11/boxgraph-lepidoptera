id: aster_spoke_enrichment
name: actin-normalized spoke-to-core relative enrichment (Methods, p. 11)
role: processing
stated:
  page: 11
  printed_page: "11"
  quote: "the average intensities of the proteins in the spokes were divided by the average"
  where: "Methods (Image Analysis)"
equation: "E_protein = (I_spoke_protein / I_core_protein) / (I_spoke_actin / I_core_actin)"
inputs:
  I_spoke_protein: {quantity: fluorescence_intensity, unit: dimensionless}
  I_core_protein: {quantity: fluorescence_intensity, unit: dimensionless}
  I_spoke_actin: {quantity: fluorescence_intensity, unit: dimensionless}
  I_core_actin: {quantity: fluorescence_intensity, unit: dimensionless}
outputs:
  enrichment: {quantity: relative_actin_enrichment, unit: dimensionless}
settings: {}
from_words: true
stochastic: false
