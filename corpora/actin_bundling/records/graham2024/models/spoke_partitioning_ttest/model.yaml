id: spoke_partitioning_ttest
name: unpaired two-tailed Student t-test for aster spoke partitioning across experiments (Fig. 6F, p. 9)
role: processing
stated:
  page: 9
  printed_page: "9"
  quote: "Asterisks indicates data tested for significance via an unpaired two-tailed t-test, with P < 0.001."
  where: "Fig. 6F caption & Results (p. 9)"
equation: "t = (mean_1 - mean_2) / sqrt(s_p^2 * (1/n_1 + 1/n_2)); p = 2 * (1 - F_t(|t|, df = n_1 + n_2 - 2))"
inputs:
  mean_1: {quantity: spoke_partitioning, unit: percent}
  sd_1: {quantity: spoke_partitioning_sd, unit: percent}
  n_1: {quantity: replicate_count, unit: dimensionless}
  mean_2: {quantity: spoke_partitioning, unit: percent}
  sd_2: {quantity: spoke_partitioning_sd, unit: percent}
  n_2: {quantity: replicate_count, unit: dimensionless}
outputs:
  t_stat: {quantity: t_statistic, unit: dimensionless}
  p_value: {quantity: p_value, unit: dimensionless}
settings: {}
from_words: true
stochastic: false
