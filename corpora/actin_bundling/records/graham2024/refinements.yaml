- id: ref_ode_eq2_printed_dt
  run: run_ode_eq2_printed
  setting: dt
  factors: [1, 2, 4, 8]
  mode: divide
  output: F_end
  tolerance: "0.01%"
  tolerance_basis: "added: well below the 0.04% printed precision of [F-actin](600) = 27.68 uM"
  tolerance_added: true

- id: ref_ode_eq2_converted_dt
  run: run_ode_eq2_converted
  setting: dt
  factors: [1, 2, 4, 8]
  mode: divide
  output: F_end
  tolerance: "0.01%"
  tolerance_basis: "added: well below the 0.04% printed precision of [F-actin](600) = 27.68 uM"
  tolerance_added: true

- id: ref_ode_eq3_printed_dt
  run: run_ode_eq3_printed
  setting: dt
  factors: [1, 2, 4, 8]
  mode: divide
  output: delta_F
  tolerance: "0.1%"
  tolerance_basis: "added: well below the printed 1 uM calibration precision on p. 24"
  tolerance_added: true

- id: ref_ode_eq3_converted_dt
  run: run_ode_eq3_converted
  setting: dt
  factors: [1, 2, 4, 8]
  mode: divide
  output: delta_F
  tolerance: "0.1%"
  tolerance_basis: "added: well below the printed 1 uM calibration precision on p. 24"
  tolerance_added: true

- id: ref_langevin_dt
  run: run_langevin_vasp
  setting: dt
  factors: [1, 2, 4, 8]
  mode: divide
  output: D_eff
  tolerance: "5%"
  tolerance_basis: "added: below the 5% printed precision of D_VASP = 10 um^2/s (half-unit 0.5/10)"
  tolerance_added: true

- id: ref_langevin_n_particles
  run: run_langevin_vasp
  setting: n_particles
  factors: [1, 2, 4, 8]
  mode: multiply
  output: D_eff
  tolerance: "5%"
  tolerance_basis: "added: below the 5% printed precision of D_VASP = 10 um^2/s (half-unit 0.5/10)"
  tolerance_added: true

- id: ref_ode_eq2_printed_solve_t_actin_dt
  run: run_ode_eq2_printed_solve_t_actin
  setting: dt
  factors: [1, 2, 4, 8]
  mode: divide
  output: T_actin
  tolerance: "0.01%"
  tolerance_basis: "added: well below the 0.004% printed precision of [T-actin] = 138.38 uM"
  tolerance_added: true

- id: ref_figs5b_vca_ode_length_dt
  run: run_figs5b_vca_ode_length
  setting: dt
  factors: [1, 2, 4, 8]
  mode: divide
  output: L_fil
  tolerance: "0.01%"
  tolerance_basis: "added: well below the ~1.7% digitization reading uncertainty on Supplemental Fig. S5b filament lengths"
  tolerance_added: true


