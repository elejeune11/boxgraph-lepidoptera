- id: water_viscosity_20C
  quantity: dynamic_viscosity
  unit: pN*s/um^2
  printed: "0.001"
  basis: "Standard dynamic viscosity of water at 20 degC (1.002 mPa*s = 0.001 pN*s/um^2); Table S1 states droplet viscosity 0.5 pN*s/um^2 as '50x water' without printing the reference water viscosity."
  alternatives: ["0.00089", "0.00069"]
  stands_for: "water viscosity in Table S1 note '50x water'"

- id: temperature_room_K
  quantity: temperature
  unit: K
  printed: "298.15"
  basis: "Standard room temperature (25 degC) for in vitro assays and CytoSim Brownian dynamics; neither T nor k_B T is stated in Table S1 or SI Methods."
  alternatives: ["293.15", "300", "310"]
  stands_for: "T in D^i = mu k_B T (p. 23) and L_p = K_bend / (k_B T)"

- id: thermal_energy_room
  quantity: thermal_energy
  unit: pN*nm
  printed: "4.116"
  basis: "k_B * T at 298.15 K (1.380649e-23 J/K * 298.15 K = 4.1164 pN*nm); neither T nor k_B T is printed in the paper."
  alternatives: ["4.047", "4.142", "4.280"]
  stands_for: "k_B T in D^i = mu k_B T (p. 23)"

- id: sim_actin_init_length_added
  quantity: filament_length
  unit: um
  printed: "0.1"
  basis: "Initial seed length of the 30 actin filaments at t = 0 is not printed in Table S1, but equals the segment length L_seg = 100 nm (0.1 um) and the initial VCA fiber length (0.1 um, p. 25), and yields 30 * 0.1 um / 0.0027 um / 2522.55 = 0.4405 uM matching printed [F-actin](0) = 0.44 uM."
  alternatives: ["0.095", "0.105"]
  stands_for: "initial filament length L_0 at t = 0 in SI Methods (p. 22)"

- id: zero_force_added
  quantity: force
  unit: pN
  printed: "0"
  basis: "Zero deterministic external force used to test free Brownian diffusivity D_eff = <dx^2> / (2 t) of the 1D overdamped Langevin integrator on p. 23."
  alternatives: ["1.0"]
  stands_for: "f_tot in overdamped Langevin equation (p. 23)"

- id: vca_zero_conc_added
  quantity: vca_concentration
  unit: uM
  printed: "0"
  basis: "Reference zero-VCA condition used to evaluate the reduction delta_[F-actin] = [F-actin](VCA=0) - [F-actin](VCA=1 uM) at t = 600 s in SI Eq. 3 (p. 24)."
  alternatives: ["0.001"]
  stands_for: "baseline [VCA] = 0 condition for SI Eq. 3 calibration"

- id: test_boundary_excursion_added
  quantity: boundary_excursion
  unit: um
  printed: "0.05"
  basis: "Representative 50 nm excursion outside the spherical droplet boundary to evaluate Fig. S4c harmonic confinement force F_boundary = k_boundary * d."
  alternatives: ["0.01", "0.1"]
  stands_for: "d in F_boundary = k_boundary(d) (Fig. S4c, p. 16)"

- id: test_pair_separation_added
  quantity: pair_separation
  unit: nm
  printed: "20"
  basis: "Representative 20 nm center-to-center overlap distance (< 30 nm VASP radius) to evaluate Fig. S4d steric repulsion force F_steric = k_steric(d - r)."
  alternatives: ["10", "25"]
  stands_for: "d in F_steric = k_steric(d - r) (Fig. S4d, p. 16)"

- id: uniform_shell_r_added
  quantity: radial_coordinate
  unit: um
  printed: "0.5"
  basis: "Mid-radius spherical shell (r = 0.5 um = R/2, highlighted in Fig. 5B inset) used to test the uniform-distribution normalization of the printed vs corrected radial density ratio equation on p. 23."
  alternatives: ["0.4", "0.8"]
  stands_for: "r in rho(r, delta_r) / rho(R_drop) (p. 23)"

- id: uniform_shell_monomers_added
  quantity: molecule_count
  unit: dimensionless
  printed: "1309.2"
  basis: "Expected monomer count N(r, dr) = N_total * 3 * r^2 * dr / R^3 for a homogeneous distribution of N_total = 69823 monomers in a thin shell at r = 0.5 um, dr = 25 nm inside R = 1 um (exact shell volume gives 1309.5)."
  alternatives: ["1309.5"]
  stands_for: "N(r, delta_r) for a uniform actin distribution on p. 23"

- id: test_rho_core_added
  quantity: radial_density_ratio
  unit: dimensionless
  printed: "1.0"
  basis: "Representative core maximum normalized density at high [Arp2/3] to exercise the R.A.E. = rho(c, dr) / rho(p, dr) formula (p. 24)."
  alternatives: ["0.5", "1.2"]
  stands_for: "rho(c, delta_r) in R.A.E. (p. 24)"

- id: test_rho_periphery_added
  quantity: radial_density_ratio
  unit: dimensionless
  printed: "1.8"
  basis: "Representative periphery maximum normalized density at high [Arp2/3] to exercise the R.A.E. = rho(c, dr) / rho(p, dr) formula (p. 24)."
  alternatives: ["1.5", "5.0"]
  stands_for: "rho(p, delta_r) in R.A.E. (p. 24)"

- id: test_I_spoke_protein_added
  quantity: fluorescence_intensity
  unit: dimensionless
  printed: "68"
  basis: "Illustrative spoke protein fluorescence intensity (6.8% of core intensity 1000) to exercise the Methods p. 11 actin-normalized spoke enrichment equation."
  alternatives: ["6.9"]
  stands_for: "I_spoke_protein in Methods (p. 11)"

- id: test_I_core_protein_added
  quantity: fluorescence_intensity
  unit: dimensionless
  printed: "1000"
  basis: "Illustrative core protein fluorescence intensity to exercise the Methods p. 11 actin-normalized spoke enrichment equation."
  alternatives: ["500", "2000"]
  stands_for: "I_core_protein in Methods (p. 11)"

- id: test_I_spoke_actin_added
  quantity: fluorescence_intensity
  unit: dimensionless
  printed: "120"
  basis: "Illustrative spoke actin fluorescence intensity (12% of core intensity 1000) showing how raw 6.8% vs 0.69% spoke/core ratios yield ~0.57 vs ~0.06 when normalized to actin (cf. Fig. 6F)."
  alternatives: ["100", "150"]
  stands_for: "I_spoke_actin in Methods (p. 11)"

- id: test_I_core_actin_added
  quantity: fluorescence_intensity
  unit: dimensionless
  printed: "1000"
  basis: "Illustrative core actin fluorescence intensity to exercise the Methods p. 11 actin-normalized spoke enrichment equation."
  alternatives: ["500", "2000"]
  stands_for: "I_core_actin in Methods (p. 11)"
