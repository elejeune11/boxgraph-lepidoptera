# Cross-record ModelAtlas relations for all 10 pairs sharing graham2024.
#
# Audit summary of the 5 zero-relation pairs (honest 0 relations, 0 cited links):
# - graham_code (VASPDroplet_simulate.ipynb, Graham et al. 2023): all 8 models
#   implement 2D continuum SLSQP droplet-ring deformation mechanics (wetting
#   tension, Gauss-Kummer perimeter energy, Bathe bundle rigidity, critical
#   ring thickness), disjoint from graham2024's rigid-sphere 3D CytoSim ODEs
#   and trajectory analyses (the shape-flagged pair langevin_overdamped_1d vs
#   notebook_droplet_ring_slsqp is a spurious dimensional coincidence).
# - graham_source_data (MOESM12-22_ESM.xlsx, Graham et al. 2023): all 11 models
#   are fixed-spreadsheet Excel readers over 2023 microscopy tables.
# - nastkolb2022 (MBoC 33, ar91, 2022; cited qualitatively as ref-61 on p. 10):
#   its runnable models cover exponential FRAP recovery fits (graham2024 models
#   only two-sample Student t-tests on FRAP summary statistics, not recovery
#   curves), planar-SLB 2D bundle spacing W/d_spacing, and simple 1-2 op ratios
#   of unrelated species (CP/actin, ML/SLB mobility).
# - chandrasekaran_source_data (MOESM9_ESM.xlsx, Chandrasekaran et al. 2024):
#   all 20 models are fixed-workbook Excel readers over 2024 sheets (sharing
#   only the Rangamani-lab notebook processing fingerprint on FigureS10B/C/F
#   already audited in graham2024_code, not analytical equations).
# - feigeles2025 (Soft Matter 2025; cites graham2024 qualitatively as ref-33 on
#   p. 6): all 34 models concern axisymmetric Young-Laplace unduloid capillary
#   pressure, droplet coalescence viscocapillary scaling, and Gaussian FWHM
#   bundle widths, sharing no equations with graham2024.
