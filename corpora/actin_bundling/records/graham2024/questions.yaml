    higher). Likewise Fig. S5d at 150 nM Arp2/3 across VCA = {0, 1, 2, 5, 10} uM (0.5985, 0.5714,
    0.5211, 0.3721, 0.2734) matches code argmax(N) (0.5978, 0.5701, 0.5195, 0.3698, 0.2675) while
