  text: >
    Zero valid BoxGraph CrossValidation entries exist in either direction between graham2024 and
    nastkolb2022 (ref-61):
    (1) Forward direction (graham2024 models -> nastkolb2022 measurements): nastkolb2022 measures
    2D SLB-tethered VASP actin bundle widths, pore sizes, intensity-calibrated filament counts
    (45 +/- 12 per 1 um width), TIRF polymerization kinetics, and 2D SLB/ML FRAP recovery curves,
    completely disjoint from the output quantities of graham2024's 39 runnable models.
    (2) Reverse direction (nastkolb2022 models -> graham2024 measurements):
    (a) FRAP time-origin mismatch prevents direct BoxGraph sweep of nastkolb2022/frap_recovery_by_half_time
    and frap_recovery_fit against graham2024's Fig. 1E FRAP curves (fig1e_frap_vasp_fig,
    fig1e_frap_composite_fig). Although units convert cleanly (s <-> min, percent <-> dimensionless),
    nastkolb2022's single-exponential formula y(t) = a*(1 - exp(-t*ln(2)/t_1/2)) + c hardcodes
    photobleaching at t = 0 with no t_bleach offset port (port t = frap_recovery_time, 'Elapsed time
    t after photobleaching'), whereas graham2024 Fig. 1E plots total assay time starting pre-bleach
    (t = 2 s at 99.67%) with photobleaching at t_bleach = 6 s (confirmed by Fig. 1F 6 s micrograph).
    Sweeping unshifted t directly yields a spurious +41.0% / +35.6% time-offset artifact at t = 8 s
    (65.41% vs 24.43% VASP-only, RMSE 25.43%, 3/15 in band; 51.48% vs 15.87% composite, RMSE 15.35%,
    2/14 in band).
    (b) Offline post-bleach fit-quality check on shifted time dt = t - 6 s (n = 14 post-bleach points,
    dt = 2..78 s) with graham2024's printed parameters (c = 0; VASP-only a = 96.86%, t_1/2 = 4.93 s;
    composite a = 96.20%, t_1/2 = 7.24 s) uncovers the exact same S-shaped diffusive-vs-single-exponential
    residual signature found in nastkolb2022 Fig. 4C and graham2023 Fig. 1f: VASP-only gives 7/14 in
    digitization band, RMSE 3.31%, max error +6.31% at t = 25 s (dt = 19 s; free 3-parameter
    single-exp fit still gives RMSE 2.20% at a = 95.05%, t_1/2 = 5.62 s, t_0 = 5.18 s); composite gives
    4/14 in band, RMSE 3.04%, max error +5.47% at t = 30 s (dt = 24 s; free single-exp RMSE 2.19%).
    Both traces are underpredicted early (-3.14% / -3.57% at dt = 4 s), systematically overpredicted
    across mid-recovery (dt = 14..44 s), and converge at the late plateau (dt = 78 s). By contrast,
    2D Soumpasis circular-disk diffusive recovery reduces RMSE 7x-12x to 0.27% (VASP-only) and 0.44%
    (composite), confirming non-single-exponential diffusive FRAP kinetics across all three VASP papers.
    (c) All other nastkolb2022 models (2D SLB bundle width scaling, 2D spacing/filament counts,
    frap_mobile_fraction_plateau tautology) have no corresponding non-tautological graham2024 targets.
  citation: {page: 3, printed_page: "3", quote: "Composite droplets formed of 20 uM VASP", where: "Fig. 1E-F (p. 3) vs nastkolb2022 Data analysis (p. 11)"}

