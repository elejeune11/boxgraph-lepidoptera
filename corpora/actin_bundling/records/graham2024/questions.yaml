    origin: measured at 0, 100, 150 nM Arp2/3 with 0, 4, 6 uM VCA: 0.0924 +/- 0.0025, 0.2831 +/-
    0.1002, 0.3079 +/- 0.0636; single-droplet Fig. 4C: 0.10, 0.26, 0.24): without VCA (dataset:
