    ModelAtlas family alongside chandrasekaran2024, chandrasekaran_cytosim, graham2024_code, and
    walker2025_code, confirming the identical 673x-687x Wrist-diffusion-ignored discrepancy
    (0.0146-0.0149 um^2/s vs stated 10 um^2/s) across all three Rangamani-lab droplet papers.
