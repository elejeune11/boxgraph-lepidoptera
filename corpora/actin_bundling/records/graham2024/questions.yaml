- id: q_fig6f_pvalue_n3_vs_n30
  kind: possible_error
  about: [fig6f_pvalue, spoke_partitioning_vasp, spoke_partitioning_arp23, fig6f_experiments_n, fig6f_droplets_per_exp, spoke_partitioning_ttest, spoke_partitioning_ttest_droplets]
  text: >
    Main text on p. 9 reports spoke partitioning of 6.8 ± 2.3% (VASP) vs 0.69 ± 0.52% (Arp2/3), and Fig. 6F
    caption states 'Bars are mean ± SD across n = 3 experiments, with 10 droplets analyzed per experiment.
    Asterisks indicates data tested for significance via an unpaired two-tailed t-test, with P < 0.001.'
    However, an unpaired two-tailed t-test on 6.8 ± 2.3% vs 0.69 ± 0.52% with n = 3 experiments yields
    t = 4.49, df = 4, p = 0.0109 (Welch p = 0.0385), which does not satisfy P < 0.001 (the same holds for
    the ~0.56 ± 0.17 vs ~0.07 ± 0.08 bar heights plotted in Fig. 6F). Achieving P < 0.001 requires pooling
    all 3 x 10 = 30 individual droplets as independent observations (t = 14.19, df = 58, p = 1.60 x 10^-20),
    indicating either droplet-level pseudoreplication in the t-test or an inconsistency with the stated n = 3.
  citation: {page: 9, printed_page: "9", quote: "are mean ± SD across n = 3 experiments, with 10 droplets analyzed per experiment.", where: "Fig. 6F caption & Results (p. 9)"}

