    (4) graham2024's digitized CytoSim figure curves (Fig. 5B-E, Fig. S5b, Fig. S5d) are not linked
    in cited.yaml because graham2024_code/data.yaml exposes PLOTCSVFILES via live software models
    rather than authored table datums; cross-validation of those curves against live software
    adapters belongs to the cross-validation stage.
