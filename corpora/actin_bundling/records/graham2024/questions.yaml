    total_polymer_from_concentration on ode_f_actin_600s = 27.68 uM is a trivial unit conversion
    of the paper's own boundary condition rather than a validation against independent data.
    (2) Reverse direction (graham2024_code live software: true models -> graham2024 datums;
    structurally belongs in graham2024_code/validations.yaml per BoxGraph CrossValidation.model
    ownership): offline evaluation yields two major quantitative cross-validation findings:
