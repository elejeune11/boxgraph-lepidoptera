- id: q_cytosim_not_runnable
  kind: unstated_model
  about: [cytosim_actin_vasp_arp23_vca]
  text: >
    The full 3D CytoSim simulation (Fig. 5, Fig. S4-S6, Table S1, SI Methods pp. 22-25) cannot be
    executed solely from the printed paper and SI because it requires a custom-modified C++ CytoSim
    build (fiber_set.cc edit on p. 25, GitHub repo ref-63) and leaves several simulation parameters
    unstated: temperature T (or k_B T) for Brownian noise, Arp2/3 diffusion coefficient, crosslinker
    spring stiffnesses for VASP and Arp2/3, initial filament length at t = 0 (only implied as 0.1 um
    from [F-actin](0) = 0.44 uM), exact Brownian ratchet force-velocity functional form, exact
    force-dependent unbinding law k(F)_unbind, and random seeds.
  citation: {page: 19, printed_page: "SI-7", quote: "Table S1. Table of parameters used to set up the actin model in Cytosim.", where: "Table S1"}

- id: q_eq2_unit_mismatch_and_bc_inconsistency
  kind: possible_error
  about: [actin_polymerization_ode_eq2_printed, actin_polymerization_ode_eq2_converted, ode_f_actin_600s, ode_t_actin_solved, sim_k_grow]
  text: >
    SI Eq. (2) on p. 22, d[F-actin]/dt = k_grow * N_fil * (1 - [F-actin]/[T-actin]), has two
    separate problems. First, it is dimensionally inconsistent as printed: the LHS is in uM/s while
    k_grow = 0.0103 um/s is in um/s without the polymer-length-to-concentration factor
    1/(l_mono * (4/3)*pi*R_drop^3 * N_A) (1/6.8109 uM/um); integrating literally yields 102.25 uM
    instead of 27.68 uM. Second, even after restoring the length-to-concentration conversion
    (actin_polymerization_ode_eq2_converted), integrating from F(0) = 0.44 uM with N_fil = 30,
    k_grow = 0.0103 um/s, and [T-actin] = 138.38 uM yields [F-actin](600) = 25.07 uM (5.69 um per
    filament), not the stated boundary condition 27.68 uM (2*pi = 6.283 um per filament). Because
    even without depletion 0.1 + 0.0103 * 600 = 6.280 um < 2*pi = 6.2832 um, no finite positive
    [T-actin] satisfies Eq. (2) with k_grow = 0.0103 um/s. Notably, (2*pi - 0.1)/600 = 0.010305 um/s
    is the zero-depletion average elongation speed, while total_polymer = 942.4777960769379 um (p. 24)
    equals 300*pi = 5 * (30 * 2*pi) to double precision (giving [T-actin] = 138.378 uM = 138.38 uM);
    reaching 27.68 uM at t = 600 s with [T-actin] = 138.38 uM requires k_grow = 0.01152 um/s.
  citation: {page: 22, printed_page: "SI-10", quote: "we find that [T-actin]=138.38 uM", where: "SI Methods, Eqs. (1)-(2)"}

- id: q_eq3_unit_mismatch_and_calibration
  kind: possible_error
  about: [actin_vca_competition_ode_eq3_printed, actin_vca_competition_ode_eq3_converted, vca_f_actin_reduction_target, vca_l_gmax_1uM]
  text: >
    SI Eq. (3) on p. 24 repeats the dimensional mismatch of Eq. (2) by equating d[VCA-actin]/dt (uM/s)
    to k_bind * N_VCA * (1 - delta) with k_bind = 3.44 um/s (um/s), and the sample calculation writes
    L_Gmax = [G_max] = 0.0027 * 5 * N_VCA = 34.047 um, equating a concentration symbol [G_max] to a
    length in um. With consistent length-to-concentration conversion (actin_vca_competition_ode_eq3_converted),
    [VCA] = 1 uM reduces [F-actin](600) by 0.893 uM (within the printed 1-sig-fig precision of '1 uM',
    though 10.7% below 1.00 uM because k_grow = 0.0103 um/s falls short of 27.68 uM; with k_grow =
    0.01152 um/s the reduction is 0.987 uM).
  citation: {page: 24, printed_page: "SI-12", quote: "such that [VCA] = 1uM reduces [F - actin] at t=600s by 1uM", where: "SI Methods, Eq. (3)"}

- id: q_frap_mobile_sd_hundredfold_error
  kind: possible_error
  about: [frap_mobile_vasp_only, frap_mobile_composite, frap_mobile_pvalue, frap_mobile_fraction_ttest]
  text: >
    The Fig. 1E inset table (p. 3) reports '% mobile' as 96.86 ± 0.02 (VASP alone) vs 96.20 ± 0.02
    (+Arp2/3 +VCA) for n = 13 droplets per condition, with an unpaired two-tailed t-test p-value of
    0.407. Evaluating the t-test on the printed numbers literally gives t = 84.13 and p = 3.58 x 10^-31
    (not reproduced by 30 orders of magnitude). By contrast, if the SD was 2% (0.02 as a dimensionless
    fraction before converting to percentage), the t-test yields t = 0.841 and p = 0.408 (matching
    0.407), strongly indicating that the means were multiplied by 100 to convert fractions to percent
    while the SD (0.02) was accidentally left unscaled.
  citation: {page: 3, printed_page: "3", quote: "VASP alone 4.93 ± 1.16 96.86 ± 0.02", where: "Fig. 1E inset table"}

- id: q_viscosity_50x_vs_500x_water
  kind: possible_error
  about: [sim_droplet_viscosity, sim_viscosity_ratio_water, droplet_viscosity_water_ratio]
  text: >
    Table S1 (p. 19) lists 'Viscosity of droplet medium' as 0.5 pN*s/um^2 with note '50x water'.
    Because 1 pN*s/um^2 = 1 Pa*s and water has viscosity ~0.001 Pa*s at 20 C (0.00089 Pa*s at 25 C),
    0.5 pN*s/um^2 is 500x-562x water viscosity, not 50x water (a 10-fold error; 50x water would be
    0.05 pN*s/um^2).
  citation: {page: 19, printed_page: "SI-7", quote: "Viscosity of droplet 0.5 pN.s/um2 50x water", where: "Table S1"}

- id: q_vasp_diffusion_stokes_einstein_mismatch
  kind: unexplained_difference
  about: [sim_vasp_diffusion_rate, sim_droplet_viscosity, sim_vasp_radius, stokes_einstein_sphere_diffusion]
  text: >
    Table S1 (p. 19) specifies droplet viscosity eta = 0.5 pN*s/um^2, VASP tetramer sphere radius
    r = 30 nm, and VASP diffusion rate D = 10 um^2/s. Under Stokes-Einstein hydrodynamic drag
    (D = k_B T / (6 pi eta r)), a 30 nm sphere in a 0.5 pN*s/um^2 medium at 298 K has D = 0.0146 um^2/s,
    687-fold smaller than the printed 10 um^2/s (even in pure water at 0.001 Pa*s, D = 7.28 um^2/s).
  citation: {page: 19, printed_page: "SI-7", quote: "Diffusion rate 10 um2/s", where: "Table S1"}

- id: q_langevin_mu_viscosity_misprint
  kind: possible_error
  about: [langevin_overdamped_1d, einstein_diffusion_relation]
  text: >
    SI Methods (p. 23) prints the overdamped Langevin equation dx^{ij}(t) = mu f^{ij}_tot(t) dt + dB_j(t)
    and D^i = mu k_B T, but immediately defines mu as 'the viscosity of solvent'. Dimensionally and
    physically, mu is the particle mobility (1 / drag coefficient, units um/(pN*s)), not solvent
    viscosity (units pN*s/um^2).
  citation: {page: 23, printed_page: "SI-11", quote: "Here, u is the viscosity of solvent, and", where: "SI Methods (Position evolution)"}

- id: q_radial_density_missing_one_third
  kind: possible_error
  about: [radial_density_ratio_printed, radial_density_ratio_corrected]
  text: >
    SI Methods (p. 23) prints rho(r, delta_r)/rho(R_drop) = [N(r, delta_r)/(r^2 delta_r)] / [N_total/R^3],
    omitting the factor of 1/3 = ((4/3) pi) / (4 pi) arising from the ratio of sphere volume (4/3) pi R^3
    to thin spherical shell volume 4 pi r^2 delta_r. For a homogeneous distribution inside a sphere, the
    printed equation yields 3.0 rather than 1.0, whereas Fig. 5B (p. 8) and Fig. S5c (p. 17) approach 1.0
    for homogeneous networks at [Arp2/3] = 150 nM. Note that the missing factor of 1/3 cancels out in the
    core-to-periphery ratio R.A.E. = rho(c, delta_r) / rho(p, delta_r) on p. 24.
  citation: {page: 23, printed_page: "SI-11", quote: "local density within shells and the bulk density as", where: "SI Methods (Analysis of trajectories)"}

