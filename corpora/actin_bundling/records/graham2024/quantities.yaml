# Concentrations
- id: vasp_monomer_concentration
  name: VASP monomer molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of monomeric VASP subunits used to form droplets in experiments.

- id: vasp_tetramer_concentration
  name: VASP tetramer molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of native VASP tetramers [VASP-tet] in experiments or CytoSim droplets.

- id: actin_concentration
  name: actin molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of actin (added monomeric actin, unpolymerized [G-actin], polymerized [F-actin], total pool [T-actin], or change delta_[F-actin]).

- id: arp23_concentration
  name: Arp2/3 complex molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of the branched-actin nucleator Arp2/3 complex.

- id: vca_concentration
  name: N-WASP VCA domain molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of the GST-tagged N-WASP VCA activator domain.

- id: vca_actin_concentration
  name: VCA-sequestered actin molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of actin bound/sequestered by VCA ([VCA-actin] or saturation cap [G_max]) in SI Eq. 3.

- id: ck666_concentration
  name: CK666 inhibitor molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of the small-molecule Arp2/3 inhibitor CK666.

- id: buffer_concentration
  name: buffer or reagent molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of buffer salts, reducing agents, chelators, or ATP in assay and storage buffers.

# Concentration ratios, percentages, chemical conditions
- id: vca_to_arp23_ratio
  name: VCA-to-Arp2/3 molar ratio
  dimension: dimensionless
  description: Molar ratio [VCA] / [Arp2/3] (printed as 40:1 VCA:Arp2/3 or 1:40 Arp2/3:VCA).

- id: vasp_to_actin_ratio
  name: VASP-to-actin molar ratio
  dimension: dimensionless
  description: Molar ratio [VASP_monomer] / [actin] (denominator 7.5 in printed actin:VASP = 1:7.5).

- id: actin_to_vasp_ratio
  name: actin-to-VASP molar ratio
  dimension: dimensionless
  description: Molar ratio [actin] / [VASP_monomer] (e.g. 1:1 or 4:1 in Fig. 6).

- id: vasp_to_arp23_ratio
  name: VASP-to-Arp2/3 molar ratio
  dimension: dimensionless
  description: Molar ratio [VASP_monomer] / [Arp2/3] (e.g. 100-fold for 5 uM VASP vs 50 nM Arp2/3).

- id: vca_sequestration_factor
  name: VCA-to-G_max empirical sequestration multiplier
  dimension: dimensionless
  description: Dimensionless empirical multiplier relating [G_max] to [VCA] in SI Methods ([G_max] = 5 * [VCA]).

- id: dye_to_protein_molar_ratio
  name: dye-to-protein labeling molar excess
  dimension: dimensionless
  description: Molar excess of maleimide fluorophore over protein during labeling.

- id: peg_to_pll_molar_ratio
  name: PEG-to-poly-L-lysine conjugation molar ratio
  dimension: dimensionless
  description: Molar ratio of mPEG-SVA to poly-L-lysine used for coverslip passivation (1:5).

- id: labeling_fraction
  name: fluorescent protein labeling ratio
  dimension: dimensionless
  description: Fraction or percentage of protein monomers conjugated to fluorophore.

- id: mass_volume_percent
  name: mass-per-volume percentage
  dimension: dimensionless
  description: Weight-per-volume percentage (% w/v) of PEG8000 crowder, glycerol, or sucrose.

- id: volume_percent
  name: volume percentage
  dimension: dimensionless
  description: Volume percentage of cosolvent (e.g. 2% DMSO vehicle control in Fig. S2).

- id: ph
  name: solution pH
  dimension: dimensionless
  description: Negative base-10 logarithm of hydrogen ion activity in buffer solutions.

- id: binding_valency
  name: VASP tetramer actin-binding valency
  dimension: dimensionless
  description: Number of F-actin binding sites (and monomers) per native VASP tetramer.

# Lengths and geometries
- id: droplet_radius
  name: spherical droplet radius
  dimension: "[length]"
  description: Radius R_drop of a spherical VASP droplet in CytoSim simulations.

- id: droplet_diameter
  name: droplet or bleach region diameter
  dimension: "[length]"
  description: Droplet diameter, minor-axis filtering threshold, or circular FRAP bleach spot diameter.

- id: filament_length
  name: single actin filament contour length
  dimension: "[length]"
  description: Contour length of an individual actin filament (initial seed, Arp2/3 daughter nucleus, or maximum length L_max = 2 pi R_drop).

- id: total_polymer_length
  name: total polymer contour length in droplet
  dimension: "[length]"
  description: Sum of contour lengths across filaments or effective polymer length parameter in CytoSim (total_polymer, L_Gmax).

- id: filament_segment_length
  name: discretized filament segment length
  dimension: "[length]"
  description: Upper-limit segment length L_seg of discretized fibers in CytoSim.

- id: actin_monomer_rise
  name: actin monomer axial length increment
  dimension: "[length]"
  description: Filament contour length increase per polymerized actin monomer (2.7 nm).

- id: persistence_length
  name: actin filament persistence length
  dimension: "[length]"
  description: Bending persistence length L_p = K_bend / (k_B T) of F-actin.

- id: molecular_radius
  name: particle or steric interaction radius
  dimension: "[length]"
  description: Radius of a spherical VASP tetramer, Arp2/3 complex, or actin filament steric core.

- id: filament_diameter
  name: actin filament diameter
  dimension: "[length]"
  description: Diameter of an F-actin filament (7 nm).

- id: binding_distance
  name: crosslinker or nucleator binding capture distance
  dimension: "[length]"
  description: Maximum proximity r_bind required for stochastic binding of VASP or Arp2/3 to F-actin.

- id: boundary_excursion
  name: excursion distance outside droplet boundary
  dimension: "[length]"
  description: Distance d by which a particle or fiber vertex moves outside the spherical droplet boundary (Fig. S4c).

- id: pair_separation
  name: center-to-center steric pair separation
  dimension: "[length]"
  description: Center-to-center distance d between interacting particles or filament segments in Fig. S4d.

- id: radial_coordinate
  name: radial distance from droplet center or surface
  dimension: "[length]"
  description: Radial shell coordinate r, core/periphery cutoff radius r_c or r_p, or radial offset from aster core.

- id: shell_thickness
  name: spherical sampling shell thickness
  dimension: "[length]"
  description: Finite thickness delta_r of overlapping radial shells used in radial actin density analysis.

- id: displacement
  name: Brownian particle 1D displacement
  dimension: "[length]"
  description: Position increment dx along one Cartesian axis in overdamped Langevin dynamics.

- id: gasket_thickness
  name: imaging chamber gasket thickness
  dimension: "[length]"
  description: Thickness of silicone imaging gaskets (1.5 mm).

- id: laser_wavelength
  name: FRAP laser wavelength
  dimension: "[length]"
  description: Wavelength of the photobleaching laser (405 nm).

# Times and rates
- id: time
  name: elapsed time or duration
  dimension: "[time]"
  description: Total simulation duration, experimental incubation/polymerization duration, or fusion/labeling time.

- id: time_step
  name: numerical integration time step
  dimension: "[time]"
  description: Implicit Langevin or ODE integration step size dt.

- id: frap_half_time
  name: FRAP fluorescence recovery half-time
  dimension: "[time]"
  description: Characteristic recovery half-time t_1/2 of photobleached VASP droplets.

- id: frap_half_time_sd
  name: FRAP recovery half-time standard deviation
  dimension: "[time]"
  description: Sample standard deviation of t_1/2 across FRAP droplets.

- id: filament_growth_rate
  name: single-filament actin elongation speed
  dimension: "[length] / [time]"
  description: Linear barbed-end extension speed k_grow of a single actin filament.

- id: vca_binding_speed_per_molecule
  name: per-molecule VCA effective fiber growth speed
  dimension: "[length] / [time]"
  description: Empirical per-molecule VCA actin-sequestration growth speed parameter k_bind in SI Eq. 3 (3.44 um/s).

- id: vca_fiber_growth_speed
  name: total VCA competitor fiber growth speed
  dimension: "[length] / [time]"
  description: Product k_bind^fiber = k_bind * N_VCA used as growing_speed of the passive VCA fiber in CytoSim.

- id: binding_rate
  name: stochastic filament binding rate
  dimension: "1 / [time]"
  description: First-order attachment rate k_bind for VASP or Arp2/3 within binding distance of F-actin.

- id: unbinding_rate
  name: zero-force stochastic unbinding rate
  dimension: "1 / [time]"
  description: First-order detachment rate k_unbind for VASP or Arp2/3 from F-actin.

- id: nucleation_rate
  name: Arp2/3 daughter branch nucleation rate
  dimension: "1 / [time]"
  description: First-order rate k_nucleate at which bound Arp2/3 nucleates a daughter filament.

- id: centrifugation_speed
  name: centrifugation rotational speed
  dimension: "1 / [time]"
  description: Rotor speed used to remove aggregates after protein labeling (rpm).

# Forces, stiffnesses, rigidities, energies, transport, mass
- id: force
  name: mechanical force
  dimension: "[force]"
  description: Polymerization stall force, characteristic unbinding force, harmonic confinement/steric force, or total Langevin force.

- id: spring_stiffness
  name: linear spring stiffness
  dimension: "[force] / [length]"
  description: Harmonic confinement or steric repulsion spring constant k_boundary or k_steric.

- id: flexural_rigidity
  name: filament bending flexural rigidity
  dimension: "[force] * [length] ** 2"
  description: Flexural rigidity K_bend of F-actin (or dummy rigidity of the inert VCA fiber).

- id: angular_stiffness
  name: branch junction angular stiffness
  dimension: "[force] * [length]"
  description: Torsional spring stiffness maintaining the 70 deg Arp2/3 branch angle (pN*um/rad).

- id: thermal_energy
  name: thermal energy scale k_B T
  dimension: "[energy]"
  description: Product of Boltzmann constant k_B and absolute temperature T.

- id: temperature
  name: thermodynamic temperature
  dimension: "[temperature]"
  description: Absolute or Celsius temperature of simulations or experimental storage/centrifugation steps.

- id: dynamic_viscosity
  name: medium dynamic viscosity
  dimension: "[force] * [time] / [length] ** 2"
  description: Dynamic viscosity eta of the VASP droplet interior or reference water medium.

- id: viscosity_ratio
  name: droplet-to-water viscosity ratio
  dimension: dimensionless
  description: Dimensionless ratio eta_droplet / eta_water.

- id: diffusion_coefficient
  name: translational diffusion coefficient
  dimension: "[length] ** 2 / [time]"
  description: Brownian translational diffusivity D of VASP tetramers or Langevin particles.

- id: mobility
  name: hydrodynamic translational mobility
  dimension: "[length] / [force] / [time]"
  description: Inverse drag mobility mu = D / (k_B T) appearing in overdamped Langevin dynamics (misprinted as 'viscosity' on p. 23).

- id: molecular_weight
  name: polymer or molecular weight cutoff mass
  dimension: "[mass]"
  description: Molecular weight of PEG, mPEG-SVA, poly-L-lysine, or desalting column MWCO.

# Angles, counts, morphometrics, enrichment, FRAP, statistics
- id: branching_angle
  name: Arp2/3 filament branching angle
  dimension: dimensionless
  description: Equilibrium angle between parent and Arp2/3-nucleated daughter actin filaments (70 deg).

- id: filament_count
  name: actin filament count
  dimension: dimensionless
  description: Number of actin filaments N_fil in a simulated droplet.

- id: filament_nucleation_fold_change
  name: Arp2/3-induced filament count fold increase
  dimension: dimensionless
  description: Fold increase in filament count relative to initial filament number (e.g. 10x at 50 nM Arp2/3).

- id: segment_count
  name: filament segment count
  dimension: dimensionless
  description: Number of discrete line segments of length L_seg along a filament of length L_max.

- id: molecule_count
  name: discrete molecule or monomer count
  dimension: dimensionless
  description: Number of VASP tetramers, Arp2/3 complexes, VCA molecules, or actin monomers in a droplet or shell.

- id: droplet_count
  name: analyzed droplet sample size
  dimension: dimensionless
  description: Number of droplets n quantified in microscopy or FRAP experiments.

- id: replicate_count
  name: experimental or simulation replicate count
  dimension: dimensionless
  description: Number of independent experiments, simulation trajectories, or analyzed trajectory snapshots.

- id: spoke_count
  name: aster droplet spoke count
  dimension: dimensionless
  description: Number of actin-rich spokes radiating from an aster droplet core (threshold >= 4).

- id: mobile_fraction
  name: FRAP mobile protein fraction
  dimension: dimensionless
  description: Percentage of mobile VASP recovered after photobleaching (% mobile in Fig. 1E).

- id: mobile_fraction_sd
  name: FRAP mobile fraction standard deviation
  dimension: dimensionless
  description: Reported sample standard deviation of the FRAP mobile fraction (printed as 0.02 in Fig. 1E table).

- id: aspect_ratio
  name: droplet aspect ratio
  dimension: dimensionless
  description: Ratio of major to minor axis of a VASP droplet after actin polymerization.

- id: radial_density_ratio
  name: normalized radial F-actin shell density ratio
  dimension: dimensionless
  description: Ratio rho(r, delta_r) / rho(R_drop) of local shell F-actin density to bulk droplet F-actin density.

- id: relative_actin_enrichment
  name: core-to-periphery relative actin enrichment
  dimension: dimensionless
  description: Ratio R.A.E. = rho(c, delta_r) / rho(p, delta_r) in simulations or center-to-periphery fluorescence intensity ratio in experiments.

- id: spoke_partitioning
  name: spoke-to-core protein partitioning percentage
  dimension: dimensionless
  description: Reported spoke-to-core relative partitioning of VASP or Arp2/3 in aster droplets (text p. 9).

- id: spoke_partitioning_sd
  name: spoke-to-core protein partitioning standard deviation
  dimension: dimensionless
  description: Sample standard deviation of reported spoke-to-core relative partitioning of VASP or Arp2/3 in aster droplets (text p. 9).

- id: spoke_partitioning_ratio
  name: VASP-to-Arp2/3 spoke partitioning fold ratio
  dimension: dimensionless
  description: Fold ratio of VASP spoke partitioning over Arp2/3 spoke partitioning (text p. 9).

- id: fluorescence_intensity
  name: fluorescence intensity
  dimension: dimensionless
  description: Measured fluorescence intensity (arbitrary units) in aster droplet spokes or cores.

- id: hedges_g
  name: Hedges' g effect size
  dimension: dimensionless
  description: Standardized mean difference effect size (Hedges' g) reported in Figs. 3C, 3E, and S2.

- id: p_value
  name: two-tailed t-test p-value
  dimension: dimensionless
  description: Statistical significance p-value from unpaired two-tailed t-tests (Figs. 1E, 3C, 3E, 6F, S2, S3).

- id: t_statistic
  name: Student two-sample t-statistic
  dimension: dimensionless
  description: Unpaired two-sample Student t-statistic computed from group means, SDs, and sample sizes.

- id: free_polymer_fraction
  name: normalized free actin monomer fraction
  dimension: dimensionless
  description: Fraction (1 - delta) = 1 - used_polymer / total_polymer governing fiber elongation in SI Eqs. 2-3 and fiber_set.cc.

# Digitized figure quantities
- id: normalized_frequency
  name: normalized histogram bin frequency
  dimension: dimensionless
  description: Normalized frequency (fraction of total droplets per diameter bin) in droplet size histograms (Fig. 1C).

- id: frap_recovery
  name: FRAP fluorescence recovery percentage
  dimension: dimensionless
  description: Percentage fluorescence recovery after photobleaching as a function of time in FRAP curves (Fig. 1E).

- id: experimental_condition_index
  name: categorical experimental condition index
  dimension: dimensionless
  description: Integer index identifying discrete multi-component experimental conditions or proteins along a categorical axis (Figs. 3C, 3E, 6F, S2).

- id: morphology_category_index
  name: 3D actin morphology category index
  dimension: dimensionless
  description: "Integer index for 3D peripheral actin morphology categories: 1 = Shell, 2 = Ring, 3 = Disc (Figs. 4F, S3)."

- id: peripheral_actin_abundance
  name: peripheral actin droplet abundance
  dimension: dimensionless
  description: "Percentage of droplets displaying peripheral actin accumulation (Fig. 4B)."

- id: line_profile_distance
  name: 1D intensity line profile distance
  dimension: "[length]"
  description: "Spatial distance along a 1D fluorescence intensity line profile across a droplet (Fig. 4C)."

- id: normalized_fluorescence_intensity
  name: max-normalized fluorescence intensity
  dimension: dimensionless
  description: "Fluorescence intensity normalized to the peak intensity along a droplet line profile (Fig. 4C)."

- id: morphology_abundance
  name: droplet morphology percentage abundance
  dimension: dimensionless
  description: "Percentage of droplets adopting a specified morphology class: shell, ring, or disc (Figs. 4F, S3) or rod or aster (Fig. 6C)."

- id: filament_length_cdf
  name: actin filament length cumulative density function
  dimension: dimensionless
  description: "Cumulative density function (CDF) of actin filament contour lengths in CytoSim simulations (Figs. 5E, S5b)."

- id: spoke_relative_enrichment
  name: actin-normalized aster spoke relative enrichment
  dimension: dimensionless
  description: "Actin-normalized relative enrichment of a protein (VASP or Arp2/3) in aster spokes relative to the droplet core (Fig. 6F; distinct from core-to-periphery relative_actin_enrichment)."

