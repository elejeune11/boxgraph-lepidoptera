notes: >
  Complete reading of Graham, Chandrasekaran, Wang, Yang, Lafer, Rangamani & Stachowiak (PNAS 121,
  e2309152121, 2024), covering both the main article and Methods (PDF pp. 1-12) and 100% of the
  Supplemental Information (PDF pp. 13-26: Supplemental Figs. S1-S6, Table S1, Supplemental Movies,
  Supplemental Methods Eqs. 1-3, CytoSim VCA fiber config, fiber_set.cc code edit, and SI Refs 1-10).
  Every equation, table, figure annotation, and numerical value was checked directly against the
  rendered page images (pages/page-001.png through pages/page-026.png).

  In scope: (1) Full 3D agent-based CytoSim simulation of actin-VASP-Arp2/3-VCA droplets recorded
  explicitly as runnable: false with all missing specifications documented; (2) all printed
  equations, from-words formulas, geometric/concentration conversions, mechanical/kinetic formulas,
  trajectory analysis definitions, ODE models (SI Eqs. 1-3), 1D overdamped Langevin integrator,
  and statistical consistency checks (Fig. 1E FRAP t-tests), together with evidenced corrected
  variants (variant_of) for three evident equation misprints (unit mismatch in SI Eq. 2, unit
  mismatch in SI Eq. 3, and missing 1/3 geometric factor in the spherical shell density ratio on
  p. 23) and a reconstructed Stokes-Einstein check; (3) all experimental conditions, concentrations,
  ratios, FRAP parameters, Hedges' g and p-values, sample counts, aster partitioning percentages,
  and Table S1 / SI Methods CytoSim parameters; (4) numerical refinements on the ODE solvers and
  1D stochastic Langevin integrator; and (5) stated within-paper model relations and open questions
  documenting misprints and internal inconsistencies.

  Out of scope for this read stage: calibrated figure digitization (deferred to digitize:graham2024;
  un-digitized quantitative plots include Figs. 1C, 1E, 2B, 2D, 2F, 3A, 3C, 3E, 4B, 4C profiles, 4D,
  4F, 5B-E, 6C, 6F, S1, S2, S3, and S5a-d) and external repository inspection of ref-63
  (https://github.com/achansek/CytoSim_VASP_Arp_VCA/).
