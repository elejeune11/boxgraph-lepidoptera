# Cross-record provenance audit of cited numerical values between haviv2008 and the 4 remaining
# ready Wave 6 partner records (claessens2008, dutta2016, graham2024, grason2007).
# (borukhov2005+haviv2008, gov2008+haviv2008, haviv2008+henle2005, and haviv2008+shin2009 were
# already audited inside those partner records.)
#
# Audit of all 4 pairs:
# 1. claessens2008 + haviv2008:
#    - claessens2008 cites haviv2008 qualitatively as ref-27 on p. 1 (printed p. 8819, col. 2):
#      "The bundle diameter could, in principle, be either kinetically (25-27) or thermodynamically
#      (19, 20) constrained." Zero datums in claessens2008/data.yaml take a value from ref-27
#      (its only from_source datums cite ref-35 [Tsuda et al. 1996] and ref-36 [Ono et al. 1997]).
#    - haviv2008 does not cite claessens2008 (both published 2008; haviv2008 cites Lieleg et al.
#      2007, not claessens2008). Zero cited-value links.
#
# 2. dutta2016 + haviv2008:
#    - dutta2016 cites haviv2008 qualitatively as ref-6 inside the introductory cluster [1-7] on
#      p. 2 (printed 28001-p1, col. 1): "often form self-assembled structures like bundles, gels or
#      clumps [1-7]." Both from_source datums in dutta2016/data.yaml (`screening_length_actin` ~1 nm
#      and `filament_thickness_actin` ~8 nm) cite ref-11, not ref-6.
#    - haviv2008 (2008) predates dutta2016 (2016). Zero cited-value links.
#
# 3. graham2024 + haviv2008:
#    - FALSE-POSITIVE CITATION MATCH: Neither paper cites the other. graham2024 ref-34 (p. 12,
#      cited p. 8 col. 2 on bead-free Arp2/3 + VCA + fascin asters) is Ideses, Brill-Karniely,
#      Haviv, Ben-Shaul & Bernheim-Groswasser, PLoS One 3, e3297 (2008), a different 2008 paper
#      from the same group, NOT haviv2008 (Eur. Biophys. J. 37, 447-454, 2008). Zero datums in
#      graham2024/data.yaml cite ref-34, and haviv2008 predates graham2024. Zero cited-value links.
#
# 4. grason2007 + haviv2008:
#    - haviv2008 cites grason2007 (`ref-grason2007`, source: grason2007) qualitatively twice — on
#      p. 3 (printed p. 449 col. 2) and p. 7 (printed p. 453 col. 1) — as an equilibrium elastic
#      mechanism proposed to limit the width of aggregating long filaments, contrasting it with
#      haviv2008's simultaneous nucleation/polymerization/bundling kinetics.
#    - Zero datums in haviv2008/data.yaml take a numerical value from ref-grason2007 (haviv2008's
#      only from_source datums are `effective_filament_diameter_Df` from ref-ishikawa2003 [outside
#      corpus] and `fascin_actin_binding_energy_eps` from ref-borukhov2005 [already audited in
#      borukhov2005/questions.yaml#q_haviv2008_no_cross_validation]).
#    - grason2007 (2007) predates haviv2008 (2008). Zero cited-value links.
#
# Accordingly, zero CitedLink entries apply to haviv2008 across all 4 pairs.
