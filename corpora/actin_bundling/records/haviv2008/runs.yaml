  outputs:
    P: P_eq1_fig2b_data_pred
  note: "Sweeps peak-normalized Eq. (1) at Table 1 phi = 3/1 parameters over all 19 digitized nonzero measured bins of Fig. 2(b)."

- id: run_off_rate_arrhenius_fig2c_curve
