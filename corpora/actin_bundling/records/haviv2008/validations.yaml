# Cross-record validation audit of haviv2008 models against independent measurements (and partner
# models against haviv2008 measurements) across the 4 remaining ready Wave 6 partner records
# (claessens2008, dutta2016, graham2024, grason2007).
# (borukhov2005+haviv2008, gov2008+haviv2008, haviv2008+henle2005, and haviv2008+shin2009 were
# already audited inside those partner records.)
#
# Result: 0 physically valid cross-record validations across all 4 pairs. Every pair was audited
# individually in both directions and documented in haviv2008/questions.yaml:
#
# - claessens2008 + haviv2008 (see q_claessens2008_cross_audit_and_no_validation):
#   * haviv2008 models -> claessens2008 measurements (26 origin: measured datums):
#     (a) haviv2008's size_distribution_eq1, eq1_peak_normalization, eq1_distribution_moments_table,
#         peak_bundle_size_eq1/from_eq1_max/table_eval, and rate-scaling models require fitted
#         exponential bundle-size distributions P(N_b) or rates (2*k_on/D, k_off/D), none of which
#         claessens2008 measures (claessens2008 reports uniform thickness, SAXS Bragg/helical peaks,
#         overtwist Delta_theta(R*), droplet ring-splitting boundaries, and TEM diameter D(R*)).
#     (b) haviv2008's peak_size_coat_hindered_scaling (N_peak propto n_a^2 * p_fa(phi)^2; prefactor:
#         unknown) outputs filament number N_peak as a function of total ratio phi = [F]/[A] and
#         cannot sweep claessens2008's D_fig1c_measured (y = air-dried stained TEM diameter D in nm
#         with ~2x hydration/width-metric ambiguity [q_tem_vs_saxs_bundle_diameter], x = bound ratio
#         R* <= 1 rather than total phi) or Rstar_figS1_experiment (inverted axes: y = R*, x = n_f),
#         nor be judged on single scalar plateaus (nf_max_abstract/confinement ~ 20) due to unknown
#         prefactor. Moreover, haviv2008 predicts N_peak ~ n_a^2 whereas claessens2008 observes
#         actin-concentration-independent thickness (p. 8819 col. 2, Fig. 1A-B, Fig. 3D).
#     (c) haviv2008's bundle_filament_number_cylinder (N_b = (D_b/D_f)^2 with cryo-TEM D_f = 9 nm)
#         has no matching scalar hydrated bundle-diameter datum in claessens2008 (D_fig1c_measured
#         is an air-dried negatively stained TEM curve plateauing at 28.1 nm vs ~50-57 nm hydrated
#         SAXS width from a_H = 12.4 nm).
#   * claessens2008 models -> haviv2008 measurements (6 origin: measured datums):
#     (a) claessens2008's empirical fit diameter_scaling_Rstar (D ~ (R*)^0.3) takes bound ratio R*
#         (<= 1, effective_bound_ratio), not total fascin/actin ratio phi = 0.2..6 indexing haviv2008
#         Table S1 (table_s1_Db_mean: 42.4..75.7 nm), and claessens2008 asserts a preparation-
#         independent hard cap n_f <= 20 (R* >= 0.25) directly contradicting haviv2008's broad
#         exponential distributions (N_b up to ~300-400) and assembly-route dependence (Fig. 4).
#     (b) claessens2008's remaining models (SAXS Bragg/overtwist, droplet ring confinement,
#         hexagonal shell counts, R(n_f) saturation) predict none of haviv2008's measured datums.
#
# - dutta2016 + haviv2008 (see q_dutta2016_cross_audit_and_no_validation):
#   * dutta2016 is a purely theoretical paper with 0 origin: measured datums.
#   * Conversely, dutta2016's RPA microphase-separation models cannot validate against haviv2008's
#     measurements: haviv2008's 0.1 M KCl + 2 mM MgCl2 buffer strongly screens electrostatics
#     (lambda_D ~ 0.9 nm, lambda_R/D_f ~ 0.10, inside dutta2016's infinite-bundle macrophase region
#     lambda_R < 0.385; explicitly ruled out by haviv2008 p. 449 col. 2), and dutta2016's
#     dimensionless parameters (rho*, Gamma_R, Gamma_A, lambda_A, epsilon) do not map onto phi.
#
# - graham2024 + haviv2008 (see q_graham2024_cross_audit_and_no_validation):
#   * Completely disjoint experimental systems and observables: graham2024 studies fascin-free
#     ("Importantly, our system lacks fascin", p. 8 col. 2) VASP liquid-like condensates + Arp2/3 +
#     VCA in PEG-crowded droplets, and none of its 60 origin: measured datums (aspect ratio, FRAP,
#     radial fluorescence enrichment, morphology percentages, spoke partitioning, Hedges' g/p)
#     measures bundle diameter, filament count, or bundle-size distribution; conversely, none of
#     graham2024's models predicts fascin bundle thickness or P(N_b).
#
# - grason2007 + haviv2008 (see q_grason2007_cross_audit_and_no_validation):
#   * grason2007 is a purely analytical theory paper with 0 origin: measured datums.
#   * Conversely, grason2007's continuum chiral-elasticity models cannot validate against haviv2008's
#     measurements: lambda_3perp_microscopic is a prefactor-unknown, phi-independent order-of-
#     magnitude estimate for sliding hexagonal-columnar onset radius (giving 2*lambda_3perp ~
#     60-190 nm for d = 9 nm, Delta E = 10 k_B T, l_p = 1-10 um), whereas haviv2008 measures
#     phi-dependent non-equilibrium disc-nucleus diameters (table_s1_Db_mean) and exponential
#     distributions (P_fig2a/b) cross-linked by rigid fascin (which suppresses axial sliding,
#     placing bundles in Grason's hexagonal-solid regime Eq. 9 with unstated mu_par, mu_perp, P,
#     Sigma).
#
# Lepidoptera bundle-size cross-validations (Mechanism 3: bundle-size control & packing):
# Tests haviv2008's cylindrical cross-sectional packing model N_b = (D_b / D_f)^2 (with
# haviv2008's own printed effective filament diameter D_f = 9 nm) evaluated on Lloyd et al.
# (2024)'s measured Heliconius sara pupal actin bundle widths (438 nm blue, 456 nm black, and
# PSF-deconvolved 360 nm lower bound) against Totz et al. (2024)'s reported Lepidoptera
# actin bundle filament count (~20 to 200 filaments per bundle).

- id: val_filaments_lloyd_blue_vs_totz2024
  model: bundle_filament_number_cylinder
  inputs:
    D_b: D_b_lloyd_blue_added
    D_f: effective_filament_diameter_Df
  output: N_b
  against: totz2024/actin_filaments_per_bundle
  purpose: validation
  quantities:
    "totz2024/actin_filaments_per_bundle": filament_number
  conditions_ok: >
    Mechanism 3 (bundle-size control & packing geometry): applies Haviv et al. (2008)'s
    cylindrical packing relation N_b = (D_b / D_f)^2 with Haviv's printed effective F-actin
    inter-filament diameter D_f = 9 nm (p. 448 col 2; dense fascin-like hexagonal bundle) to
    Lloyd et al. (2024)'s measured iridescent blue Heliconius sara pupal actin bundle width
    (D_b = 438 nm, Fig. 2J) and tests the implied filament number against Totz et al. (2024)'s
    reported Lepidoptera longitudinal actin bundle count (~20 to 200 filaments per bundle).
  basis: >
    Directly tests whether butterfly scale actin bundles of measured width 438 nm can be
    modeled as dense cylindrical twist/crosslinker-limited bundles of 20-200 filaments (like
    Claessens 2008's ~20-filament fascin cylinders or Haviv 2008's in vitro bundles).
  note: >
    Computes N_b = 2,368 filaments vs ~20 to 200 filaments (11.8x above upper bound 200;
    still 1,332 filaments = 6.7x above 200 even at looser 12 nm fascin Bragg spacing, and
    979 filaments = 4.9x above 200 at 14 nm). Demonstrates that 438 nm butterfly scale bundles
    cannot be simple dense cylindrical Claessens/Haviv-type bundles of 20-200 filaments.

- id: val_filaments_lloyd_black_vs_totz2024
  model: bundle_filament_number_cylinder
  inputs:
    D_b: D_b_lloyd_black_added
    D_f: effective_filament_diameter_Df
  output: N_b
  against: totz2024/actin_filaments_per_bundle
  purpose: validation
  quantities:
    "totz2024/actin_filaments_per_bundle": filament_number
  conditions_ok: >
    Mechanism 3 (bundle-size control & packing geometry): applies Haviv et al. (2008)'s
    cylindrical packing model (D_f = 9 nm) to Lloyd et al. (2024)'s non-iridescent black
    Heliconius sara pupal actin bundle width (D_b = 456 nm, Fig. 2J) against Totz et al.
    (2024)'s reported Lepidoptera bundle filament count (~20 to 200).
  basis: >
    Evaluates dense cylindrical packing for non-iridescent black scale actin bundles (456 nm)
    and pairs with blue scales (438 nm) to test width-to-spacing mass conservation.
  note: >
    Computes N_b = 2,567 filaments vs ~20 to 200 (12.8x above upper bound 200). Together with
    blue scales (2,368 filaments), cylindrical N_b ~ D_b^2 drops by only -7.7% from black to
    blue while Lloyd's measured bundle count jumps +25% (32 -> 40) and spacing drops -12.3%
    (1.22 -> 1.07 um), implying +15% to +20% more total cortical actin in iridescent blue scales
    rather than strict fixed-actin mass conservation.

- id: val_filaments_lloyd_blue_psf_corr_vs_totz2024
  model: bundle_filament_number_cylinder
  inputs:
    D_b: D_b_lloyd_blue_psf_corr_added
    D_f: effective_filament_diameter_Df
  output: N_b
  against: totz2024/actin_filaments_per_bundle
  purpose: validation
  quantities:
    "totz2024/actin_filaments_per_bundle": filament_number
  conditions_ok: >
    Mechanism 3 optical-broadening control: repeats Haviv et al. (2008)'s cylindrical packing
    calculation after subtracting a generous 250 nm confocal PSF FWHM in quadrature from Lloyd
    et al. (2024)'s 438 nm blue bundle width (D_b = sqrt(438^2 - 250^2) = 360 nm) against
    Totz et al. (2024)'s ~20 to 200 filaments/bundle.
  basis: >
    Tests whether diffraction-limited confocal broadening of Fig. 2J alone accounts for the
    12x excess in implied cylindrical filament number.
  note: >
    Computes N_b = 1,600 filaments vs ~20 to 200 (8.0x above upper bound 200; still 900 filaments
    at D_f = 12 nm). Confirms the mismatch is not merely a confocal PSF artifact: butterfly scale
    actin bundles must either contain ~1,000+ filaments (analogous to large Drosophila bristle
    bundles) or adopt flattened/loose multi-sub-bundle ribbon cross-sections rather than dense
    twist-limited fascin cylinders.

