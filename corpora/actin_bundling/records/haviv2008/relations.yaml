# claessens2008 + haviv2008 (claessens2008 cites haviv2008 as ref-27, p. 8819)
# ------------------------------------------------------------------------------
- id: rel_claessens2008_effective_bound_reduces_to_langmuir
  kind: reduces_to
  a: claessens2008/effective_bound_ratio
  b: haviv2008/fascin_adsorption_probability
  mapping:
    phi: "R"
    beta: "c_a * 1e-6"
    eps_kBT: "-log(K_d * 1e-6)"
  limit:
    c_a: "0"
    R: "oo"
  regime:
    R: [0.1, 1.0]
    K_d: [0.2, 5.0]
    c_a: [0.1, 1.0]
  provenance: proposed
  reason: >
    Connects the two papers' equilibrium fascin-to-actin binding isotherms.
    Claessens et al. (2008, Methods p. 8822) solve canonical 1:1 stoichiometric
    mass action WITH free-fascin ligand depletion, yielding
    R* = (1/2)*((1 + R + K_d/c_a) - sqrt((1 + R + K_d/c_a)^2 - 4*R)), while
    Haviv et al. (2008, p. 453 col 1) write the grand-canonical Langmuir
    adsorption probability WITHOUT ligand depletion,
    p_fa = beta*phi*exp(eps/k_B T) / (1 + beta*phi*exp(eps/k_B T)).
    Identifying Haviv's fascin concentration parameter beta*phi = c_f / (1 M) =
    R * (c_a * 1e-6) and binding energy eps/(k_B T) = -ln(K_d / 1 M) =
    -log(K_d * 1e-6) (Claessens's sign-corrected Delta_G/(k_B T), p. 8821) gives
    w = beta*phi*exp(eps/k_B T) = R*c_a/K_d = c_f/K_d. Taking the dilute-actin,
    excess-ligand non-depleting bath limit (c_a -> 0, R -> oo with total fascin
    c_f = R*c_a held finite and O(1 uM) across K_d in [0.2, 5.0] uM) eliminates
    ligand depletion and reduces R* identically to the full nonlinear Langmuir
    curve p_fa = (c_f/K_d)/(1 + c_f/K_d) across the saturation crossover. At
    Haviv's actual experimental c_a = 5 uM >> K_d = 0.3 uM, free-fascin
    depletion is substantial for phi <= 1, explaining why Haviv's non-depleting
    Langmuir fit (beta*exp(10) = 6.06) yields a weaker apparent K_{d,eff} =
    5/6.06 = 0.825 uM than Claessens's K_d = 0.3 uM.
  assumptions:
    - "Standard-state concentration c_0 = 1 M converts uM to molar units (1 uM = 1e-6 M) and relates K_d to eps/(k_B T) = -ln(K_d / 1 M)."
    - "Simultaneous limit c_a -> 0, R -> oo maintains constant total fascin concentration c_f = R*c_a = 1 uM (non-depleting ligand bath) while sampling the full nonlinear Langmuir saturation curve w = c_f/K_d in [0.2, 5.0]."
    - "1:1 monomer binding stoichiometry in claessens2008/effective_bound_ratio is compared structurally with single-site short-filament attachment probability p_fa in haviv2008/fascin_adsorption_probability."

- id: rel_claessens2008_hexagonal_shells_scales_cylinder
  kind: scales_as
  a: claessens2008/hexagonal_shell_filaments
  b: haviv2008/bundle_filament_number_cylinder
  output_map:
    N_b: n_f
  mapping:
    D_b: "9 * (2 * k + 1)"
    D_f: "9"
  regime:
    k: [5.0, 50.0]
  provenance: proposed
  reason: >
    Connects Claessens et al.'s (2008, p. 8820) discrete concentric hexagonal-shell
    filament count n_f = 1 + 3*k*(k + 1) (with vertex-to-vertex diameter
    D_fil = 2*k + 1 filaments across) to Haviv et al.'s (2008, p. 448 col 2)
    continuum circular cross-section area formula N_b = (D_b / D_f)^2 evaluated at
    D_b = D_fil * D_f = (2*k + 1) * 9 nm and D_f = 9 nm. In the multi-shell
    continuum regime k in [5, 50] (n_f in [91, 7651]), both scale quadratically
    with k (log-slope difference <= 0.005), mirroring claessens2008's own
    rel_hexagonal_shells_scales_grason_diameter. Asymptotically n_f / N_b -> 3/4
    (reflecting the area ratio of a regular hexagon to its circumscribed circular
    packing, (sqrt(3)/2)^2 = 3/4), while at Claessens's 1-2 shell fascin bundles
    (k = 1-2, n_f = 7-19) finite-size shell discreteness gives (2k+1)^2 = 9-25
    and a 1.3-2.1% log-slope difference.
  assumptions:
    - "Multi-shell continuum regime k in [5, 50] (at k = 1-2, discrete hexagonal shell corrections exceed 1% in log-slope)."
    - "Vertex-to-vertex bundle diameter D_b = D_fil * D_f = (2*k + 1)*D_f evaluated at Haviv's effective filament diameter D_f = 9 nm."

