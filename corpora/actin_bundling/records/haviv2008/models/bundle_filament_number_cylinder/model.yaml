id: bundle_filament_number_cylinder
name: bundle filament number from cylindrical cross-section areas (p. 448 col 2)
role: processing
stated:
  page: 2
  printed_page: "448"
  quote: "filaments Nb from the ratio Ab/Af"
  where: "Materials and methods, p. 448 col 2"
equation: "N_b = A_b / A_f, where A_b = (pi/4) * D_b^2 and A_f = (pi/4) * D_f^2"
inputs:
  D_b:
    quantity: bundle_diameter
    unit: nm
  D_f:
    quantity: effective_filament_diameter
    unit: nm
outputs:
  A_b:
    quantity: bundle_cross_section_area
    unit: "nm**2"
  A_f:
    quantity: effective_filament_cross_section_area
    unit: "nm**2"
  N_b:
    quantity: filament_number
    unit: dimensionless
settings: {}
stochastic: false
