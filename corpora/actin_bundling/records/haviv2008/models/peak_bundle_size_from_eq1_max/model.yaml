id: peak_bundle_size_from_eq1_max
name: numerical maximizer of Eq. (1) steady-state size distribution
role: model
stated:
  page: 5
  printed_page: "451"
  quote: "peak in the distribution of Eq. (1) is given by"
  where: "Results, p. 451 col 2 (numerical maximum of Eq. 1)"
equation: "N_peak = argmax_{N_b > 0} [exp(2 * (k_on / D) * sqrt(N_b) - (k_off / D) * N_b)]"
built_from:
  - size_distribution_eq1
inputs:
  kon_over_D:
    quantity: on_rate_over_noise
    unit: dimensionless
  koff_over_D:
    quantity: off_rate_over_noise
    unit: dimensionless
outputs:
  N_peak:
    quantity: peak_filament_number
    unit: dimensionless
settings:
  xatol: 1.0e-7
stochastic: false
