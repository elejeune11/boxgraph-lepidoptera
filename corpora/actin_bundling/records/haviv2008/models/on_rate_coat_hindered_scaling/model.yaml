id: on_rate_coat_hindered_scaling
name: fascin-coat hindered on-rate scaling proportional to n_af * k_off (p. 453 col 1, Fig. 2c dotted red line)
role: model
stated:
  page: 7
  printed_page: "453"
  quote: "off-rate, so that we get, kon"
  where: "Results, p. 453 col 1 (Fig. 2c red dotted line)"
equation: "k_on propto n_af * k_off (with constant D, 2 * k_on / D propto n_a * [beta * phi * exp(eps / k_B T) / (1 + beta * phi * exp(eps / k_B T))] * exp(-alpha * phi * eps / k_B T))"
prefactor: unknown
built_from:
  - fascin_attached_actin_concentration
  - fascin_adsorption_probability
  - off_rate_arrhenius_scaling
inputs:
  n_a:
    quantity: actin_concentration
    unit: uM
  phi:
    quantity: fascin_actin_ratio
    unit: dimensionless
  beta:
    quantity: fascin_volume_fraction_prefactor
    unit: dimensionless
  alpha:
    quantity: arrhenius_barrier_coupling
    unit: dimensionless
  eps_kBT:
    quantity: binding_energy_in_kBT
    unit: dimensionless
outputs:
  two_kon_over_D:
    quantity: double_on_rate_over_noise
    unit: dimensionless
settings: {}
stochastic: false
