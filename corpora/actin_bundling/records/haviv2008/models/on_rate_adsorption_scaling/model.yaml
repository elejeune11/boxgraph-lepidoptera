id: on_rate_adsorption_scaling
name: Langmuir adsorption on-rate scaling proportional to n_af (p. 453 col 1, Fig. 2c dashed red line)
role: model
stated:
  page: 7
  printed_page: "453"
  quote: "including the effect of fascin adsorption"
  where: "Results, p. 453 col 1 (Fig. 2c red dashed line)"
equation: "k_on propto n_af = n_a * beta * phi * exp(eps / k_B T) / (1 + beta * phi * exp(eps / k_B T)) (with constant D, 2 * k_on / D propto n_af)"
prefactor: unknown
built_from:
  - fascin_attached_actin_concentration
  - fascin_adsorption_probability
inputs:
  n_a:
    quantity: actin_concentration
    unit: uM
  phi:
    quantity: fascin_actin_ratio
    unit: dimensionless
  beta:
    quantity: fascin_volume_fraction_prefactor
    unit: dimensionless
  eps_kBT:
    quantity: binding_energy_in_kBT
    unit: dimensionless
outputs:
  two_kon_over_D:
    quantity: double_on_rate_over_noise
    unit: dimensionless
settings: {}
stochastic: false
