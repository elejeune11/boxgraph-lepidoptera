id: on_rate_from_double
name: conversion from tabulated 2*k_on/D to k_on/D (Table 1)
role: processing
stated:
  page: 5
  printed_page: "451"
  quote: "combined parameters used for the fits in Table 1"
  where: "Results, p. 451 col 2 and Table 1"
equation: "k_on / D = (2 * k_on / D) / 2"
inputs:
  two_kon_over_D:
    quantity: double_on_rate_over_noise
    unit: dimensionless
outputs:
  kon_over_D:
    quantity: on_rate_over_noise
    unit: dimensionless
settings: {}
stochastic: false
