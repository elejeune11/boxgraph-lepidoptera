id: peak_size_adsorption_on_scaling
name: peak bundle size scaling for Langmuir adsorption on-rate and Arrhenius off-rate (Fig. 2d dashed line)
role: model
stated:
  page: 4
  printed_page: "450"
  quote: "The different fits correspond to those in c"
  where: "Fig. 2d caption (p. 450) and Results (p. 453 col 1)"
equation: "N_peak = (k_on / k_off)^2 propto n_af^2 * exp(2 * alpha * phi * eps / k_B T)"
prefactor: unknown
built_from:
  - peak_bundle_size_eq1
  - on_rate_adsorption_scaling
  - off_rate_arrhenius_scaling
inputs:
  n_a:
    quantity: actin_concentration
    unit: uM
  phi:
    quantity: fascin_actin_ratio
    unit: dimensionless
  beta:
    quantity: fascin_volume_fraction_prefactor
    unit: dimensionless
  alpha:
    quantity: arrhenius_barrier_coupling
    unit: dimensionless
  eps_kBT:
    quantity: binding_energy_in_kBT
    unit: dimensionless
outputs:
  N_peak:
    quantity: peak_filament_number
    unit: dimensionless
settings: {}
stochastic: false
