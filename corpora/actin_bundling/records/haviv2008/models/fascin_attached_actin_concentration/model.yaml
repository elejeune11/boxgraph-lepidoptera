id: fascin_attached_actin_concentration
name: concentration of short actin filaments bearing attached fascin (p. 452 col 2)
role: model
stated:
  page: 6
  printed_page: "452"
  quote: "This concentration is given by, naf = napfa"
  where: "Results, p. 452 col 2"
equation: "n_af = n_a * p_fa"
built_from:
  - fascin_adsorption_probability
inputs:
  n_a:
    quantity: actin_concentration
    unit: uM
  p_fa:
    quantity: fascin_attachment_probability
    unit: dimensionless
outputs:
  n_af:
    quantity: fascin_attached_actin_concentration
    unit: uM
settings: {}
stochastic: false
