id: peak_bundle_size_table_eval
name: evaluation of N_peak = (k_on / k_off)^2 across all Table 1 fascin/actin ratios
role: processing
stated:
  page: 5
  printed_page: "451"
  quote: "peak in the distribution of Eq. (1) is given by"
  where: "Results, p. 451 col 2 and Table 1 (p. 452)"
equation: "N_peak(phi) = ((2 * k_on / D) / (2 * k_off / D))^2"
built_from:
  - peak_bundle_size_eq1
  - on_rate_from_double
inputs:
  two_kon_over_D:
    quantity: double_on_rate_over_noise
    unit: dimensionless
    curve:
      quantity: fascin_actin_ratio
      unit: dimensionless
  koff_over_D:
    quantity: off_rate_over_noise
    unit: dimensionless
    curve:
      quantity: fascin_actin_ratio
      unit: dimensionless
outputs:
  N_peak:
    quantity: peak_filament_number
    unit: dimensionless
    curve:
      quantity: fascin_actin_ratio
      unit: dimensionless
settings: {}
stochastic: false
