id: mean_diameter_to_naive_filament_number
name: naive mean-diameter plug-in into cylindrical cross-section formula (Table S1)
role: processing
stated:
  page: 2
  printed_page: "448"
  quote: "filaments Nb from the ratio Ab/Af"
  where: "Materials and methods, p. 448 col 2 (applied to Table S1 D_{b,mean})"
equation: "N_{b,naive}(phi) = (D_{b,mean}(phi) / D_f)^2"
built_from:
  - bundle_filament_number_cylinder
inputs:
  D_b_mean:
    quantity: mean_bundle_diameter
    unit: nm
    curve:
      quantity: fascin_actin_ratio
      unit: dimensionless
  D_f:
    quantity: effective_filament_diameter
    unit: nm
outputs:
  N_b_mean:
    quantity: mean_filament_number
    unit: dimensionless
    curve:
      quantity: fascin_actin_ratio
      unit: dimensionless
settings: {}
stochastic: false
