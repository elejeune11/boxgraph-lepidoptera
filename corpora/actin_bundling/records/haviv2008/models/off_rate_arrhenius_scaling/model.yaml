id: off_rate_arrhenius_scaling
name: Arrhenius off-rate scaling with fascin-to-actin ratio (p. 452 col 1-2)
role: model
stated:
  page: 6
  printed_page: "452"
  quote: "Arhenius thermal excitation process: koff"
  where: "Results, p. 452 col 1-2"
equation: "k_off propto exp(-alpha * phi * eps / k_B T) (with constant D, k_off / D propto exp(-alpha * phi * eps / k_B T))"
prefactor: unknown
inputs:
  phi:
    quantity: fascin_actin_ratio
    unit: dimensionless
  alpha:
    quantity: arrhenius_barrier_coupling
    unit: dimensionless
  eps_kBT:
    quantity: binding_energy_in_kBT
    unit: dimensionless
outputs:
  koff_over_D:
    quantity: off_rate_over_noise
    unit: dimensionless
settings: {}
stochastic: false
