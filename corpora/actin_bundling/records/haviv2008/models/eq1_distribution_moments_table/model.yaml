id: eq1_distribution_moments_table
name: analytical distribution means <N_b> and <D_b> implied by Eq. (1) and Table 1
role: processing
stated:
  page: 5
  printed_page: "451"
  quote: "steady-state size distribution of the disc-like clusters, using this"
  where: "Eq. 1 (p. 451), Table 1 (p. 452), and Table S1 (p. 10)"
equation: "<N_b> = int_{N_min}^{oo} N P(N) dN / int_{N_min}^{oo} P(N) dN; <D_b> = D_f * <sqrt(N_b)>"
reconstructed: "The paper reports Eq. (1) fit parameters in Table 1 and experimental means D_{b,mean} and N_{b,mean} in Table S1 without printing closed-form moment expressions; this model evaluates exact closed-form Gaussian/erfc moments of Eq. (1) over [N_min, infinity) to test consistency between Table 1 and Table S1."
built_from:
  - size_distribution_eq1
  - bundle_filament_number_cylinder
  - on_rate_from_double
inputs:
  two_kon_over_D:
    quantity: double_on_rate_over_noise
    unit: dimensionless
    curve:
      quantity: fascin_actin_ratio
      unit: dimensionless
  koff_over_D:
    quantity: off_rate_over_noise
    unit: dimensionless
    curve:
      quantity: fascin_actin_ratio
      unit: dimensionless
  D_f:
    quantity: effective_filament_diameter
    unit: nm
  N_min:
    quantity: filament_number
    unit: dimensionless
outputs:
  N_b_mean:
    quantity: mean_filament_number
    unit: dimensionless
    curve:
      quantity: fascin_actin_ratio
      unit: dimensionless
  D_b_mean:
    quantity: mean_bundle_diameter
    unit: nm
    curve:
      quantity: fascin_actin_ratio
      unit: dimensionless
settings: {}
stochastic: false
