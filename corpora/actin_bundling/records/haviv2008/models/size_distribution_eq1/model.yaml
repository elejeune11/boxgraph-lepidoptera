id: size_distribution_eq1
name: steady-state disc-like cluster size distribution (Eq. 1)
role: model
described_from: ref-gov2006
stated:
  page: 5
  printed_page: "451"
  quote: "steady-state size distribution of the disc-like clusters, using this"
  where: "Eq. 1, p. 451 col 2"
equation: "P(N_b) = R_n * exp(2 * (k_on / D) * sqrt(N_b)) * exp(-(k_off / D) * N_b)"
inputs:
  R_n:
    quantity: distribution_normalization
    unit: dimensionless
  kon_over_D:
    quantity: on_rate_over_noise
    unit: dimensionless
  koff_over_D:
    quantity: off_rate_over_noise
    unit: dimensionless
  N_b:
    quantity: filament_number
    unit: dimensionless
outputs:
  P:
    quantity: bundle_size_distribution
    unit: dimensionless
settings: {}
stochastic: false
