id: peak_size_coat_hindered_scaling
name: peak bundle size saturation scaling for fascin-coat hindered on-rate (p. 453 col 1, Fig. 2d dotted line)
role: model
stated:
  page: 7
  printed_page: "453"
  quote: "now given by Npeak = (kon/koff)2"
  where: "Results, p. 453 col 1 (Fig. 2d dotted line, misreferenced as Fig. 3d)"
equation: "N_peak = (k_on / k_off)^2 propto n_af^2 = n_a^2 * [beta * phi * exp(eps / k_B T) / (1 + beta * phi * exp(eps / k_B T))]^2"
prefactor: unknown
built_from:
  - peak_bundle_size_eq1
  - on_rate_coat_hindered_scaling
  - off_rate_arrhenius_scaling
inputs:
  n_a:
    quantity: actin_concentration
    unit: uM
  phi:
    quantity: fascin_actin_ratio
    unit: dimensionless
  beta:
    quantity: fascin_volume_fraction_prefactor
    unit: dimensionless
  eps_kBT:
    quantity: binding_energy_in_kBT
    unit: dimensionless
outputs:
  N_peak:
    quantity: peak_filament_number
    unit: dimensionless
settings: {}
stochastic: false
