id: fascin_adsorption_probability
name: equilibrium Langmuir probability of fascin attachment to a short actin filament (p. 453 col 1)
role: model
described_from: ref-callen1985
stated:
  page: 7
  printed_page: "453"
  quote: "attached to a fascin cross-linker, given by (Callen 1985):"
  where: "Results, p. 453 col 1"
equation: "p_fa = beta * phi * exp(eps / k_B T) / (1 + beta * phi * exp(eps / k_B T))"
inputs:
  phi:
    quantity: fascin_actin_ratio
    unit: dimensionless
  beta:
    quantity: fascin_volume_fraction_prefactor
    unit: dimensionless
  eps_kBT:
    quantity: binding_energy_in_kBT
    unit: dimensionless
outputs:
  p_fa:
    quantity: fascin_attachment_probability
    unit: dimensionless
settings: {}
stochastic: false
