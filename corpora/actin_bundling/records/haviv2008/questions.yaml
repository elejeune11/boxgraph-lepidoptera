    (1) Citations & cited.yaml: haviv2008 cites grason2007 (ref-grason2007) qualitatively on p. 449
    col. 2 and p. 453 col. 1 as an equilibrium elastic mechanism limiting the width of aggregating
    long preformed filaments, explicitly contrasting it with haviv2008's non-equilibrium simultaneous
    nucleation, polymerization, and cross-linking of short flat disc-like nuclei (and noting on
    p. 451 col. 2 that elastic/defect mechanisms are irrelevant during initial disc formation).
    Zero numerical datums in haviv2008/data.yaml come from ref-grason2007, and grason2007 predates
    haviv2008.
    (2) ModelAtlas: All 35 grason2007 continuum chiral-elasticity models (hexagonal-columnar Eq. 5-8,
    hexagonal-solid Eq. 9, microscopic twist/bend/stability scalings) and all 18 haviv2008 kinetic
    disc-nucleus, Langmuir/Arrhenius, and cylinder-area models are algebraically and physically
    disjoint. In particular, comparing their bundle-size distributions highlights opposite sign
    structure: grason2007 Eq. (7) is a grand-canonical equilibrium chain-fraction weight
    P(R) propto R^2 * exp(-(Delta F(R) - mu*rho_0*pi*R^2)/(k_B T)) where achiral surface tension
    +2*pi*Sigma*R enters the exponent with a NEGATIVE sign (-2*pi*Sigma*L*R/(k_B T), suppressing
    finite clusters unless overcome by chiral twist -f_0*R^(4/3)/(lambda_{3 perp}^2 + R^2)^(1/3)),
    whereas haviv2008 Eq. (1) is a non-equilibrium Fokker-Planck cluster-number distribution
    P(N_b) = R_n * exp(+2*(k_on/D)*sqrt(N_b) - (k_off/D)*N_b) where rim attachment enters the
    exponent with a POSITIVE linear-in-R (+sqrt(N_b)) sign and no R^2 mass-weighting prefactor.
    Furthermore, grason2007 predicts equilibrium bundle radius decreasing with surface tension
    (R_0 ~ Sigma^(-3), Sigma^(-1/3), Sigma^(-1/5)), whereas haviv2008 predicts N_peak increasing
    and saturating with fascin ratio phi (stronger cross-linking).
    (3) Cross-validation: grason2007 is purely analytical theory with 0 origin: measured datums (its
    literature F-actin values are origin: reported from Lai et al. 2007 and Ikawa et al. 2007).
    In reverse, grason2007/lambda_3perp_microscopic (lambda_{3 perp} ~ sqrt(d*l_p*k_B T/Delta E),
    prefactor: unknown) gives an order-of-magnitude phi-independent sliding-columnar onset diameter
    2*lambda_{3 perp} ~ 60-190 nm at haviv2008's D_f = 9 nm, eps = 10 k_B T, and l_p = 1-10 um
    (spanning haviv2008 Table S1's 42.4-75.7 nm only at l_p ~ 1 um and overshooting 2.5-4.5x at
    realistic l_p = 10-17 um), cannot predict haviv2008's phi-dependent Table S1 curve or Fig. 2
    histograms, and applies to sliding hexagonal-columnar bundles rather than rigid fascin
    cross-links (which correspond to Grason's 3D hexagonal-solid phase Eq. 9 with unstated
    mu_par, mu_perp, P, and Sigma).
