  text: >
    Cross-record ModelAtlas, citation, and validation audit of claessens2008 + haviv2008 yields
    2 verified proposed ModelAtlas relations, 0 cited-value links, and 0 physically valid
    cross-validations, while highlighting a major experimental and mechanistic discrepancy between
    two in vitro F-actin/fascin bundling studies published in the same year:
    (1) Citations & cited.yaml: claessens2008 cites haviv2008 qualitatively as ref-27 on p. 8819
    col. 2 ("either kinetically (25-27) or thermodynamically (19, 20) constrained") without taking
    any numerical datum from haviv2008 (claessens2008's only from_source datums cite ref-35 and
    ref-36); haviv2008 does not cite claessens2008 (citing Lieleg et al. 2007 instead).
    (2) ModelAtlas:
    (a) rel_claessens2008_effective_bound_reduces_to_langmuir (reduces_to, proposed): Claessens's
    canonical 1:1 mass-action bound ratio R*(R, K_d, c_a) reduces identically to Haviv's
    grand-canonical Langmuir probability p_fa(phi, beta, eps_kBT) in the non-depleting bath limit
    (c_a -> 0, R -> oo at constant total fascin c_f = R*c_a) under phi = R, beta = c_a*1e-6, and
    eps_kBT = -ln(K_d*1e-6) (Claessens's binding_energy_fascin_sign_corrected). At Haviv's actual
    c_a = 5 uM >> K_d = 0.3 uM, free-fascin depletion is strong for phi <= 1 (e.g. at phi = 0.2,
    R* = 0.186 vs non-depleting p_fa = 0.769 at K_d = 0.3 uM), explaining why Haviv's fitted
    beta*exp(10) = 6.06 implies a 2.75x weaker apparent K_{d,eff} = 5/6.06 = 0.825 uM than
    Claessens's K_d = 0.3 uM (Ono et al. 1997, also cited in haviv2008 as ref-ono1997).
    (b) rel_claessens2008_hexagonal_shells_scales_cylinder (scales_as, proposed): Claessens's
    discrete hexagonal-shell count n_f = 1 + 3*k*(k+1) scales identically (log-slope diff <= 0.005
    for k in [5, 50]) with Haviv's cylinder area formula N_b = (D_b/D_f)^2 at D_b = (2k+1)*D_f,
    with asymptotic area ratio n_f/N_b -> 3/4. The direct algebraic identity between
    bundle_filament_number_cylinder (N_b = (D_b/D_f)^2) and claessens2008/filament_number_from_diameter_ratio
    (n_f = n_f_0*D_ratio^2, 2 ops) at n_f_0 = 1 is excluded from same_as as too_plain (<= 2 ops).
    (c) Mechanistic contrast: Haviv's peak_size_coat_hindered_scaling predicts N_peak ~ n_a^2*p_fa^2
    (quadratic in actin concentration n_a, smooth Langmuir saturation), whereas Claessens's
    empirical diameter_scaling_Rstar (D ~ (R*)^0.3) and helical-overtwist arrest predict thickness
    independent of c_a (Fig. 1A-B, Fig. 3D) with a sharp plateau at R* ~= 0.25 (n_f ~= 20).
    (3) Experimental discrepancy & spacing reconciliation: Haviv reports wide exponential cryo-TEM
    distributions (N_b up to ~300-400, N_{b,mean} = 26.7..85.2, N_peak = 7.6..32.3, D_{b,mean} =
    42.4..75.7 nm) and strong assembly-route dependence (Fig. 4: preformed F-actin + fascin gives
    thin disordered bundles), whereas Claessens reports uniform negatively stained TEM widths
    (D_fig1c_measured = 8.4..28.1 nm, n_f <= 20) independent of preparation method (p. 8819 col. 2).
    Notably, Claessens's hydrated SAXS hexagonal spacing a_H = 12.4 nm implies a Voronoi area per
    filament (sqrt(3)/2)*a_H^2 = 133.2 nm^2 — 2.09x larger than Haviv's circular area (pi/4)*D_f^2
    = 63.6 nm^2 at D_f = 9 nm (p. 448 col. 2); rescaling Haviv's cryo-TEM diameters by this 2.09x
    area factor lowers Haviv's N_peak from 7.6..32.3 down to 3.6..15.4 filaments, bringing its
    mode filament count into the n_f <= 20 range observed by Claessens even though the two studies
    still conflict on polydispersity, actin-concentration scaling, and preparation-route dependence.
    (4) Cross-validation: Zero valid entries in either direction because Haviv's N_peak models
    output dimensionless filament count (prefactor: unknown) as a function of total phi (whereas
    Claessens's D_fig1c_measured gives air-dried stained TEM diameter D [nm] vs bound ratio R*,
    subject to ~2x TEM-vs-SAXS width ambiguity in claessens2008/q_tem_vs_saxs_bundle_diameter, and
    Rstar_figS1_experiment has inverted axes R* vs n_f), and Claessens's diameter_scaling_Rstar
    takes bound R* <= 1 rather than total phi = 0.2..6 indexing Haviv Table S1.
  citation:
    page: 2
    printed_page: "448"
    quote: "kept constant at 9 nm (Ishikawa et al. 2003)"
    where: "Materials and methods, p. 448 col 2; and Results, pp. 451-453"

