# ==========================================================================
# Experimental setup parameters & thresholds (Materials & Methods, Results)
# ==========================================================================
- id: actin_conc_na
  quantity: actin_concentration
  unit: uM
  origin: reported
  printed: "5"
  citation:
    page: 2
    printed_page: "448"
    quote: "cryo-TEM experiments: actin 5 lM"
    where: "Materials and methods, p. 448 col 1"
  note: "Total G-actin concentration [A] = n_a kept constant at 5 uM across all cryo-TEM experiments (also reiterated on p. 452 col 2 and Figs. 1 and 4)."

- id: effective_filament_diameter_Df
  quantity: effective_filament_diameter
  unit: nm
  origin: reported
  printed: "9"
  from_source: ref-ishikawa2003
  citation:
    page: 2
    printed_page: "448"
    quote: "kept constant at 9 nm (Ishikawa et al. 2003)"
    where: "Materials and methods, p. 448 col 2"
  note: "Effective actin filament diameter (inter-filament center-to-center spacing) in actin/fascin bundles, cited from Ishikawa et al. (2003)."

- id: phi_no_bundles_threshold
  quantity: fascin_actin_ratio
  unit: dimensionless
  origin: measured
  printed: "< 0.005"
  conditions:
    actin_concentration: "5 uM"
    temperature: "25 degC"
    polymerization_time: "1 h"
  citation:
    page: 2
    printed_page: "448"
    quote: "Below a certain fascin concentration [fascin]/[G-actin]"
    where: "Results, p. 448 col 2"
  note: "Printed as '[F]/[A] < 1/200])' (with stray closing bracket) on p. 448 col 2: below 1/200 = 0.005, no bundles formed and only individual actin filaments were observed (Fig. 1a). Supporting Table S1 (p. 10) misprints this threshold with an inverted inequality as '>=1/200'."

- id: phi_bundle_onset_threshold
  quantity: fascin_actin_ratio
  unit: dimensionless
  origin: measured
  printed: "0.0125"
  conditions:
    actin_concentration: "5 uM"
    temperature: "25 degC"
    polymerization_time: "1 h"
  citation:
    page: 2
    printed_page: "448"
    quote: "individual actin filaments (Fig. 1a). Above [F]/[A] = 1/80"
    where: "Results, p. 448 col 2"
  note: "Printed as fraction [F]/[A] = 1/80 = 0.0125; bundles begin forming in negligible amounts above this ratio."

- id: phi_compact_bundle_threshold
  quantity: fascin_actin_ratio
  unit: dimensionless
  origin: measured
  printed: "0.2"
  conditions:
    actin_concentration: "5 uM"
    temperature: "25 degC"
    polymerization_time: "1 h"
  citation:
    page: 2
    printed_page: "448"
    quote: "At [F]/[A] = 1/5 and above, straight and well"
    where: "Results, p. 448 col 2"
  note: "Printed as fraction [F]/[A] = 1/5 = 0.2; onset of straight, well-ordered 3D compact bundles used for quantitative thickness-distribution analysis."

# ==========================================================================
# Model physical and fit parameters (pp. 6-7, printed pp. 452-453)
# ==========================================================================
- id: fascin_actin_binding_energy_eps
  quantity: binding_energy_in_kBT
  unit: dimensionless
  origin: estimated
  printed: "≈ 10"
  from_source: ref-borukhov2005
  citation:
    page: 6
    printed_page: "452"
    quote: "actin bond can be estimated to be: e & 10kBT"
    where: "Results, p. 452 col 2"
  note: "Single fascin-actin bond adsorption energy printed on page image as 'eps ~= 10 k_B T (Borukhov et al. 2005)' (OCR renders eps as 'e' and '~=' as '&')."

- id: arrhenius_alpha_fit
  quantity: arrhenius_barrier_coupling
  unit: dimensionless
  origin: fitted
  printed: "≈ 0.032"
  conditions:
    actin_concentration: "5 uM"
    temperature: "25 degC"
    polymerization_time: "1 h"
  citation:
    page: 6
    printed_page: "452"
    quote: "solid black line in Fig. 2c, using"
    where: "Results, p. 452 col 2"
  note: "Fit parameter printed on page image as 'alpha ~= 0.032' (OCR renders as 'a & 0.032') for the Arrhenius off-rate curve k_off/D propto exp(-alpha * phi * eps / k_B T) in Fig. 2c."

- id: langmuir_beta_fit
  quantity: fascin_volume_fraction_prefactor
  unit: dimensionless
  origin: fitted
  printed: "≈ 2.75 x 10^-4"
  conditions:
    actin_concentration: "5 uM"
    temperature: "25 degC"
    polymerization_time: "1 h"
  citation:
    page: 7
    printed_page: "453"
    quote: "using b & 2.75 9 10-4"
    where: "Results, p. 453 col 1"
  note: "Fit parameter printed on page image as 'beta ~= 2.75 x 10^-4' (OCR renders as 'b & 2.75 9 10-4') in p_fa = beta*phi*exp(eps/k_B T) / (1 + beta*phi*exp(eps/k_B T))."

- id: rate_fit_rel_uncertainty
  quantity: rate_relative_uncertainty
  unit: dimensionless
  origin: estimated
  printed: "0.20"
  conditions:
    actin_concentration: "5 uM"
    temperature: "25 degC"
    polymerization_time: "1 h"
  citation:
    page: 7
    printed_page: "453"
    quote: "errors in the determination of the on/off rates"
    where: "Results, p. 453 col 1"
  note: "Printed as '(+/- 20%)', estimated by slightly changing histogram binning; yields error bars of ~+/- 20% on rates in Fig. 2c and larger propagated error bars (~+/- 44%) on N_peak in Fig. 2d."

