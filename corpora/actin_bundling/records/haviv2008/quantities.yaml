- id: bundle_diameter
  name: actin bundle diameter
  dimension: "[length]"
  description: Diameter D_b of an individual compact cylindrical actin/fascin bundle measured from cryo-TEM micrographs (p. 2 col 2, Fig. 1).

- id: mean_bundle_diameter
  name: mean actin bundle diameter
  dimension: "[length]"
  description: Sample or distribution mean bundle diameter D_{b,mean} = <D_b> at a given fascin-to-actin ratio (Table S1, p. 10).

- id: effective_filament_diameter
  name: effective actin filament diameter in bundle
  dimension: "[length]"
  description: Effective diameter D_f corresponding to the typical center-to-center distance between two actin filaments inside an actin/fascin bundle (D_f = 9 nm; p. 2 col 2, Fig. 1e).

- id: bundle_cross_section_area
  name: bundle cross-sectional area
  dimension: "[length]**2"
  description: Cross-sectional area A_b = (pi/4) * D_b^2 of a cylindrical actin bundle (p. 2 col 2).

- id: effective_filament_cross_section_area
  name: effective filament cross-sectional area in bundle
  dimension: "[length]**2"
  description: Effective cross-sectional area A_f = (pi/4) * D_f^2 of a single actin filament inside a bundle (p. 2 col 2).

- id: filament_number
  name: number of filaments per bundle
  dimension: "dimensionless"
  description: Number of actin filaments N_b = A_b / A_f in a bundle cross section (p. 2 col 2, Eq. 1).

- id: mean_filament_number
  name: mean number of filaments per bundle
  dimension: "dimensionless"
  description: Sample or distribution mean number of actin filaments per bundle N_{b,mean} = <N_b> at a given fascin-to-actin ratio (Table S1, p. 10).

- id: peak_filament_number
  name: peak bundle filament number
  dimension: "dimensionless"
  description: Peak (mode) filament number N_peak = (k_on / k_off)^2 of the steady-state bundle size distribution Eq. (1) (p. 5 col 2, Table 1, Fig. 2d).

- id: fascin_actin_ratio
  name: fascin-to-actin molar ratio
  dimension: "dimensionless"
  description: Molar concentration ratio phi = [fascin] / [G-actin] = [F] / [A] (p. 2 col 1, Table 1, Table S1, Fig. 2c-d).

- id: actin_concentration
  name: bulk actin monomer concentration
  dimension: "[substance] / [length]**3"
  description: Total monomeric G-actin concentration in solution n_a = [A] = 5 uM, kept constant across cryo-TEM experiments (p. 2 col 1, p. 6 col 2).

- id: fascin_attached_actin_concentration
  name: concentration of fascin-attached short actin filaments
  dimension: "[substance] / [length]**3"
  description: Concentration n_af = n_a * p_fa of short actin filaments in solution having an attached fascin cross-linker (p. 6 col 2).

- id: fascin_attachment_probability
  name: probability of fascin attachment to a short actin filament
  dimension: "dimensionless"
  description: Equilibrium Langmuir probability p_fa = beta * phi * exp(eps / k_B T) / (1 + beta * phi * exp(eps / k_B T)) that a short actin filament in solution carries an attached fascin cross-linker (p. 6 col 2 - p. 7 col 1).

- id: on_rate_over_noise
  name: rim attachment rate to noise ratio
  dimension: "dimensionless"
  description: Ratio k_on / D of the rim attachment rate constant k_on to the growth-fluctuation noise parameter D in Eq. (1) (p. 5 col 2).

- id: double_on_rate_over_noise
  name: doubled rim attachment rate to noise ratio
  dimension: "dimensionless"
  description: Combined fit parameter 2 * k_on / D multiplying sqrt(N_b) in Eq. (1) and tabulated in Table 1 (p. 5 col 2, Table 1 p. 6).

- id: off_rate_over_noise
  name: bulk dissociation rate to noise ratio
  dimension: "dimensionless"
  description: Combined fit parameter k_off / D multiplying -N_b in Eq. (1) and tabulated in Table 1 (p. 5 col 2, Table 1 p. 6).

- id: distribution_normalization
  name: steady-state distribution normalization constant
  dimension: "dimensionless"
  description: Normalization constant R_n multiplying the exponential factors in Eq. (1) (p. 5 col 2).

- id: peak_amplitude_factor
  name: normalized peak amplitude factor
  dimension: "dimensionless"
  description: Normalized amplitude f of the peak of the fitted distribution P(N_b) relative to the maximal experimental data point (p. 5 col 2, Table 1 p. 6).

- id: bundle_size_distribution
  name: bundle size distribution
  dimension: "dimensionless"
  description: Steady-state distribution P(N_b) of disc-like bundle nucleus sizes (Eq. 1, p. 5 col 2, Fig. 2a-b).

- id: binding_energy_in_kBT
  name: fascin-actin bond energy in units of k_B T
  dimension: "dimensionless"
  description: "Adsorption/binding energy eps / (k_B T) of a single fascin-actin bond expressed in thermal energy units (p. 6 col 2: eps ~= 10 k_B T)."

- id: arrhenius_barrier_coupling
  name: Arrhenius off-rate coupling fit parameter
  dimension: "dimensionless"
  description: "Dimensionless fit parameter alpha in the Arrhenius off-rate scaling k_off propto exp(-alpha * phi * eps / k_B T) (p. 6 col 1-2: alpha ~= 0.032)."

- id: fascin_volume_fraction_prefactor
  name: fascin volume-fraction Langmuir prefactor
  dimension: "dimensionless"
  description: "Dimensionless fit parameter beta such that beta * phi is proportional to fascin volume fraction in solution in p_fa (p. 7 col 1: beta ~= 2.75 x 10^-4)."

- id: rate_relative_uncertainty
  name: relative uncertainty of fitted rate ratios
  dimension: "dimensionless"
  description: "Estimated fractional uncertainty in the determination of on/off rate parameters from histogram binning variations (p. 7 col 1: +/- 20%)."

- id: temperature
  name: experimental temperature
  dimension: "[temperature]"
  description: Solution quench temperature prior to cryo-TEM vitrification (25 degC; p. 2 col 1).

- id: polymerization_time
  name: polymerization incubation time
  dimension: "[time]"
  description: Incubation duration allowed for actin/fascin assembly at room temperature prior to cryo-TEM vitrification (1 h; p. 2 col 1).
