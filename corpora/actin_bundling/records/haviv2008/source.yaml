notes: >
  In scope: the paper's complete quantitative core — cylindrical cross-section filament
  counting N_b = A_b/A_f = (D_b/D_f)^2 with D_f = 9 nm (p. 448 col 2), cryo-TEM bundling
  onset thresholds (<1/200, 1/80, 1/5; p. 448 col 2), steady-state disc-like nucleus
  distribution Eq. (1) P(N_b) = R_n * exp(2*k_on*sqrt(N_b)/D) * exp(-k_off*N_b/D) and its
  peak formula N_peak = (k_on/k_off)^2 (p. 451 col 2), numerical maximization and exact
  analytical erfc moments of Eq. (1), all Table 1 fit parameters (2*k_on/D, k_off/D, f,
  N_peak at phi = 1/5, 1/2, 1/1, 3/1, 6/1; p. 452), all Supporting Table S1 empirical means
  (D_{b,mean} +/- SE, N_{b,mean} +/- SE, and individual-filament N_b = 1; p. 10), and all
  five kinetic phi-scaling models on pp. 452-453 (Arrhenius k_off propto exp(-alpha*phi*eps/k_B T)
  with eps ~= 10 k_B T and alpha ~= 0.032, Langmuir adsorption p_fa and n_af = n_a*p_fa
  with n_a = 5 uM and beta ~= 2.75e-4, constant/adsorption/coat-hindered on-rate scalings,
  and the three corresponding N_peak scalings).
  Left out (numbers feeding no quantitative model): buffer composition (10 mM HEPES pH 7.6,
  5.5 mM DTT, 0.12 mM Dabco, 0.1 M KCl, 2 mM MgCl2, 1.7 mM Mg-ATP), vitrification/TEM
  settings (3 uL volume, 300 mesh lacey carbon grid, 100% relative humidity, 120 kV,
  -180 degC imaging, few micrometers underfocus; 25 degC quench temperature and 1 h
  polymerization time are retained as condition metadata), qualitative strong-crosslinker
  binding energy range ~10-30 kT (p. 449 col 2), polymerization timescales ("about a minute"
  / "less than a minute" with fascin vs "several minutes" lag without fascin, pp. 449-450),
  and micrograph scale bars (0.2 um in Figs. 1 and 4c-d; 20 um in Fig. 4a-b).
  Figures cataloged (left for downstream digitize stage):
  Fig. 1 (p. 3 / 449): cryo-TEM micrographs (a: phi = 1/200, b: 1/2, c: 1/1, d: 6/1; bars
  0.2 um) and schematic (e: bundle diameter D_b and effective filament spacing D_f); no
  plotted axes.
  Fig. 2 (p. 4 / 450) — primary quantitative figure (4 panels):
  (a) Linear plot of measured P(N_b) vs N_b (0-450) at phi = 3/1 (symbols) with peak-normalized
  Eq. (1) solid curve (f = 1.0, P(0) ~= 0.30).
  (b) Semi-log plot of Log(P(N_b)) vs N_b (0-450, y from -5 to 0) at phi = 3/1; note that
  'Log' is natural logarithm ln P(N_b) (verified by ln P(0) = -1.21, ln P(280) = -5.05),
  not log10.
  (c) Fitted rates vs Fascin/Actin ratio phi (0-10, y 0-1.1) with +/-20% error bars (p. 453):
  note critical mislabeling — black circles + black solid curve plot 10*k_off/D, and red
  squares + three red curves plot 2*k_on/D (NOT k_on/D as printed on the y-axis, and opposite
  to the caption's swapped "black squares and red circles").
  (d) Fitted N_peak vs phi (0-10, y 0-50) with propagated error bars (~+/-44% from quadratic
  dependence on +/-20% rate uncertainty) and solid/dashed/dotted model curves (dotted curve
  is misreferenced as "Fig. 3d" on p. 453 col 1).
  Fig. 3 (p. 5 / 451): schematic diagram (panels a-b) of disc-like nucleus growth at low and
  high phi; no plotted axes.
  Fig. 4 (p. 6 / 452): fluorescence (a, b; bars 20 um) and cryo-TEM (c, d; bars 0.2 um)
  micrographs at [A]/[F] = 1/1, [A] = 5 uM (caption prints typo "(A] = 5 uM"); no axes.
  Fig. S1 (caption on p. 9 / SI-1): describes linear (a,c,e,g) and semi-log (b,d,f,h) plots
  of P(N_b) with Eq. (1) fits for phi = 1/5, 1/2, 1/1, 6/1, but the actual image panels are
  absent from the archived PDF (pages 9-10 converted from 249_2007_236_MOESM1_ESM.doc hold
  only the captions and Table S1).
  Key quantitative findings and discrepancies:
  (1) Table 1 internal reproduction: N_peak = ((2*k_on/D)/(2*k_off/D))^2 reproduces all 5
  printed N_peak values (7.6, 12.8, 21.1, 30.2, 32.3) to the last decimal digit, confirmed
  by direct numerical maximization of Eq. (1) (refined over xatol; belongs to model) and
  all 5 verified symbolic/asymptotic model relations.
  (2) Table S1 Jensen's-inequality structure & misprint: naive (D_{b,mean}/D_f)^2 systematically
  underestimates Table S1's N_{b,mean} by 14-18% across all 5 ratios because N_{b,mean} =
  <D_b^2>/D_f^2 = (<D_b>^2 + Var(D_b))/D_f^2, implying CV(D_b) = 0.40-0.47 and n = 114-312
  bundles per ratio (consistent with "a few hundred bundles", p. 448). Table S1's bottom row
  misprints the individual-filament threshold as ">=1/200" instead of "<=1/200" or "<1/200"
  (contradicting main text p. 448 "[F]/[A] < 1/200" and Table S1's descending row order).
  (3) Table 1 Eq. (1) moments vs Table S1 empirical means: exact closed-form erfc moments of
  Eq. (1) reproduce Table S1 at phi = 1/2 (30.9 vs 32.7 +/- 2.0; 46.4 vs 46.9 +/- 1.2 nm)
  and are close at 1/5 and 3/1, but undershoot Table S1 at phi = 1/1 (44.8 vs 62.9 +/- 4.2,
  -29% / 4.3 SE; 56.1 vs 64.5 +/- 2.2 nm, -13% / 3.8 SE) and overshoot at phi = 6/1 (106.4
  vs 85.2 +/- 7.3, +25% / 2.9 SE; 85.2 vs 75.7 +/- 3.2 nm, +12.5% / 3.0 SE), insensitive to
  lower cutoff N_min in {0, 1, 2}.
  (4) Kinetic scaling laws (pp. 452-453): all five proportionality laws omit prefactors.
  Judged on shape (prefactor: unknown), the coat-hindered model captures the non-monotonic
  2*k_on/D turnover and N_peak saturation far better than constant or Langmuir-only models,
  but the stated alpha ~= 0.032 (at eps ~= 10 k_B T) decays steeper than log-OLS (alpha =
  0.0260) or linear NLLS (alpha = 0.0285) on Table 1's k_off/D, causing residuals up to
  -22.2% on k_off/D and -28.9% on 2*k_on/D at phi = 6/1 and +25.9% on N_peak at phi = 1/2.
  (5) Figure/reference errors: Fig. 2c swaps black squares / red circles in its caption and
  mislabels 2*k_on/D as k_on/D on its y-axis; p. 453 col 1 cites nonexistent "Fig. 3d"
  instead of Fig. 2d; Eq. (1) leaves R_n unstated and carries substantial nonzero density at
  N_b = 0 (P(0)/P(N_peak) = 0.27-0.54).
