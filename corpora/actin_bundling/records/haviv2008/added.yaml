- id: D_b_single_filament_added
  quantity: bundle_diameter
  unit: nm
  printed: "9"
  basis: "Effective diameter of a single unbundled actin filament set equal to D_f = 9 nm (p. 448 col 2) so that N_b = (D_b/D_f)^2 = 1 for individual filaments in Table S1; physical bare F-actin diameter is ~7-8 nm."
  alternatives: ["7", "8"]
  stands_for: "D_b for an individual actin filament (N_b = 1 in Table S1)"

- id: N_min_moments_added
  quantity: filament_number
  unit: dimensionless
  printed: "0"
  basis: "Natural lower domain bound N_b >= 0 of the continuous steady-state distribution Eq. (1) (cf. Fig. 2a-b x-axis starting at 0) used when integrating Eq. (1) to compute mean filament number <N_b> and mean bundle diameter <D_b> = D_f <sqrt(N_b)>."
  alternatives: ["1", "2"]
  stands_for: "lower integration limit N_min for continuous Eq. (1) moments"

- id: N_b_eval_phi3_added
  quantity: filament_number
  unit: dimensionless
  printed: "30.2"
  basis: "Evaluation point N_b = N_peak = 30.2 (Table 1, phi = 3/1) for checking peak-normalized Eq. (1) directly at its peak where P(N_peak) = f = 1.0."
  alternatives: ["10", "100"]
  stands_for: "N_b evaluation point for standalone scalar run of Eq. (1)"

- id: D_b_lloyd_blue_added
