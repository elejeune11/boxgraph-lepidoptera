- id: D_b_lloyd_blue_psf_corr_added
  quantity: bundle_diameter
  unit: nm
  printed: "360"
  basis: "Confocal PSF-deconvolved lower bound sqrt(438^2 - 250^2) = 360 nm on Heliconius sara iridescent blue pupal actin bundle width (lloyd2024/actin_bundle_width_blue = 438 nm), subtracting a generous 250 nm diffraction-limited confocal FWHM in quadrature to test whether optical broadening explains the discrepancy with totz2024/actin_filaments_per_bundle (~20-200 filaments)."
