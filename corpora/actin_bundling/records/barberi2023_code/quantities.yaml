# Core nondimensional model parameters & fields (matching barberi2023 quantity ids)
- id: dimless_system_size
  name: dimensionless system size
  dimension: "dimensionless"
  description: Nondimensional domain length L = l / lambda (10*pi in all four Julia scripts).

- id: dimless_diffusivity_c
  name: dimensionless actomyosin diffusivity
  dimension: "dimensionless"
  description: Nondimensional effective actomyosin diffusion constant Dc (1e-2 across all scripts).

- id: dimless_diffusivity_a
  name: dimensionless active nucleator diffusivity
  dimension: "dimensionless"
  description: Nondimensional active nucleator diffusion constant Da (1e-1 across all scripts).

- id: dimless_diffusivity_i
  name: dimensionless inactive nucleator diffusivity
  dimension: "dimensionless"
  description: Nondimensional inactive nucleator diffusion constant Di = 1 (explicit in 2D/InputParameters.jl, implicit 1 in 1D scripts).

- id: dimless_diffusivity_sum
  name: dimensionless sum of nucleator diffusivities
  dimension: "dimensionless"
  description: Combined nucleator diffusivity Da+ = Da + Di (= 1.1 in 1D/stabilitydiagram.jl and 2D/InputParameters.jl).

- id: dimless_diffusivity_diff
  name: dimensionless difference of nucleator diffusivities
  dimension: "dimensionless"
  description: Combined nucleator diffusivity Da- = Da - Di (= -0.9 in 1D/stabilitydiagram.jl and 2D/InputParameters.jl).

- id: dimless_assembly_rate
  name: dimensionless actomyosin assembly rate
  dimension: "dimensionless"
  description: Nondimensional actomyosin assembly rate A (= 1 across all scripts).

- id: dimless_disassembly_rate
  name: dimensionless actomyosin disassembly rate
  dimension: "dimensionless"
  description: Nondimensional actomyosin disassembly rate Kd (= 1 across all scripts).

- id: dimless_basal_activation_rate
  name: dimensionless basal activation rate
  dimension: "dimensionless"
  description: Nondimensional spontaneous nucleator activation rate Omega_0 (= 0.5 across all scripts).

- id: dimless_cooperative_activation
  name: dimensionless cooperative activation parameter
  dimension: "dimensionless"
  description: Nondimensional quadratic nucleator self-activation strength Omega.

- id: dimless_actin_inactivation
  name: dimensionless actin-mediated inactivation rate
  dimension: "dimensionless"
  description: Nondimensional actomyosin-induced nucleator inactivation rate Omega_d (= 10 across all scripts).

- id: dimless_spontaneous_inactivation
  name: dimensionless spontaneous inactivation rate
  dimension: "dimensionless"
  description: Nondimensional spontaneous nucleator inactivation rate Omega_d0 (0 in 1D scripts, 10 in shipped 2D/InputParameters.jl).

- id: dimless_active_stress_coeff
  name: dimensionless contractile active stress parameter
  dimension: "dimensionless"
  description: Nondimensional contractile active stress strength Z in Pi(C) = Z C^2 - B C^3.

- id: dimless_passive_stress_coeff
  name: dimensionless passive stress parameter
  dimension: "dimensionless"
  description: Nondimensional cubic steric stress strength B (= Z across all scripts).

- id: dimless_mean_nucleator_density
  name: dimensionless average total nucleator density
  dimension: "dimensionless"
  description: Spatially averaged total conserved nucleator density N_bar (1 in all initial conditions).

- id: dimless_actomyosin_density
  name: dimensionless actomyosin density
  dimension: "dimensionless"
  description: Nondimensional actomyosin network density C.

- id: dimless_active_nucleator_density
  name: dimensionless active nucleator density
  dimension: "dimensionless"
  description: Nondimensional active nucleator density Na.

- id: dimless_inactive_nucleator_density
  name: dimensionless inactive nucleator density
  dimension: "dimensionless"
  description: Nondimensional inactive nucleator density Ni.

- id: dimless_velocity
  name: dimensionless cortical flow velocity
  dimension: "dimensionless"
  description: Nondimensional active fluid velocity V.

- id: dimless_position
  name: dimensionless spatial coordinate
  dimension: "dimensionless"
  description: Nondimensional 1D position coordinate X in [-L/2, L/2 - dx].

- id: dimless_wavenumber
  name: dimensionless spatial wavenumber
  dimension: "dimensionless"
  description: Nondimensional Fourier wavenumber K (Kmin = 2*pi/L, Kmax = pi/dx).

- id: dimless_growth_rate
  name: dimensionless linear growth rate
  dimension: "dimensionless"
  description: Real part of the leading eigenvalue Re(Phi) of the 3x3 stability matrix M(K).

- id: dimless_oscillation_frequency
  name: dimensionless linear oscillation frequency
  dimension: "dimensionless"
  description: Imaginary part magnitude |Im(Phi)| of the leading eigenvalue of M(K).

- id: dimless_time
  name: dimensionless time
  dimension: "dimensionless"
  description: Nondimensional simulation time, time step, or saving interval (FinalTime, dt, FrameTimeStep, MinTimeStep, MaxTimeStep).

- id: dimless_grad_c_sq_mean
  name: spatial mean squared actomyosin density gradient
  dimension: "dimensionless"
  description: Bifurcation order parameter <(d_X C)^2> = (1/L) int (d_X C)^2 dX (Fig. 2).

- id: system_size_multiple
  name: system size multiple of L = 10 pi
  dimension: "dimensionless"
  description: Multiplicative domain size factor L_sys / (10*pi) (1, 2, 4, 8, 16, 32 in SM Fig. 3).

- id: viscous_stress_ratio_1d
  name: dimensionless 1D viscous stress coefficient
  dimension: "dimensionless"
  description: Coefficient multiplying K^2 in the 1D Fourier force balance (1 + c K^2) V_hat = i K Pi_hat (1 in both 1D codes and Eq. SM3).

- id: viscous_stress_ratio_2d
  name: dimensionless 2D longitudinal viscous stress coefficient
  dimension: "dimensionless"
  description: Coefficient multiplying |K|^2 in the 2D longitudinal Fourier force balance (1 + c |K|^2) V_hat = i K Pi_hat (2 in 2D/kernels.jl traceless operator vs 2.5 from printed Eq. 3).

# Numerical discretization, solver, initial-condition, and GPU code parameters
- id: grid_point_count
  name: grid point or mode count
  dimension: "dimensionless"
  description: Number of discrete grid nodes or parameter/wavenumber scan intervals (Nx, Ny, N, NPar1, NPar2, Nk).

- id: dimless_grid_spacing
  name: dimensionless spatial or parameter grid spacing
  dimension: "dimensionless"
  description: Uniform spatial or parameter-scan step size (dx, dy, dPar1, dPar2).

- id: relative_error_tolerance
  name: adaptive time-stepper relative error tolerance
  dimension: "dimensionless"
  description: Maximum relative step-doubling tolerance ErrorTolerance in 1D adaptive midpoint integrators.

- id: noise_amplitude
  name: initial condition uniform noise amplitude
  dimension: "dimensionless"
  description: Half-amplitude epsilon of uniform random perturbation in epsilon*[-1, 1].

- id: bump_width_param
  name: initial localized perturbation width parameter
  dimension: "dimensionless"
  description: Half-width of 1D square bump (5) or Gaussian width parameter VarBump / VarStripe in 2D.

- id: bump_height
  name: initial localized perturbation amplitude
  dimension: "dimensionless"
  description: Relative height of the initial localized perturbation (1 for 1D square bump).

- id: rng_seed
  name: random number generator seed
  dimension: "dimensionless"
  description: Integer seed passed to Julia Random.seed! (123 across 1D and 2D scripts).

- id: step_count
  name: discrete step or saved-frame count
  dimension: "dimensionless"
  description: Integer count of time steps or saved output frames (Nt, PrintEvery, TotPrints, plotframes).

- id: gpu_block_size
  name: CUDA threads per block dimension
  dimension: "dimensionless"
  description: Number of CUDA threads per block along each 2D axis (WrapsT = 16 in 2D/InputParameters.jl).

- id: stability_regime_code
  name: linear stability diagram integer code
  dimension: "dimensionless"
  description: Integer classification in 1D/stabilitydiagram.jl (0 = stable HSS, 1 = real/Turing unstable, 2 = complex/Hopf unstable).

- id: dimensionless_residual
  name: dimensionless numerical residual or conservation drift
  dimension: "dimensionless"
  description: Infinity norm of discrete steady-state RHS residual, transverse variation, or nucleator mass drift.

- id: cfl_number
  name: dimensionless diffusive stability number
  dimension: "dimensionless"
  description: Explicit Euler diffusive stability ratio dt * D_i * (kx_max^2 + ky_max^2) (must be < 2 for stability).
