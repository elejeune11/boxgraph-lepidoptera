- id: rel_mirza2025_code_stability_reduces_eqC7
  kind: reduces_to
  a: barberi2023_code/code_stability_point_1d
  b: mirza2025/dispersion_1d_eqC7
  mapping:
    nu: "pi / L"
    k_d: "Kd"
    L: "1"
    c_0: "10"
    b: "20"
    eta_rot: "0.1"
    beta: "0"
    lambda_o: "6"
    kappa: "0"
    lam: "4 * (2 * Z * (A / Kd) - 3 * Z * (A / Kd)**2) * (A / Kd)"
    q_0: "0"
  output_map:
    alpha_plus: MaxEigenvRe
  limit:
    Omega_d: "0"
    Dap: "oo"
    Dam: "oo"
  regime:
    A: [0.35, 0.48]
    Kd: [0.8, 1.0]
    Dc: [0.25, 0.25]
    Dap: [1.0, 1.0]
    Dam: [1.0, 1.0]
    Omega0: [5.0, 15.0]
    Omega_d: [0.1, 1.0]
    Z: [30.0, 55.0]
    Omega: [0.5, 5.0]
    L: [2.5, 6.0]
    Nx: [4.0, 4.0]
  provenance: proposed
  reason: >
    Connects Barberi & Kruse's released 1D/stabilitydiagram.jl stability matrix directly to
    Mirza et al.'s isotropic active-gel dispersion Eq. (C7) (mirza2025 pp. 2, 8 cites
    barberi2023 as part of the compressible isotropic active-gel patterning family). At
    single mode Nx = 4 (K = 2*pi/L = 2*nu) and Dc = 1/4, taking the decoupled fast-diffusing
    nucleator limit (Omega_d -> 0, Dap -> oo, Dam -> oo) reduces 1D/stabilitydiagram.jl's
    positive leading growth rate MaxEigenvRe identically to mirza2025 Eq. (C7)'s decoupled
    isotropic density mode alpha_+(nu) = -k_d - nu^2 + lam*nu^2/(1 + 4*nu^2) with
    lam = 4*Pi'_H*C_H (using B = Z hardcoded on line 90 of 1D/stabilitydiagram.jl). The
    factors of 2 on wavenumber (K = 2*nu) and 4 on Dc = 1/4 and lam encode mirza2025's 4*eta
    1D uniaxial viscosity versus barberi2023_code's 1*eta viscous operator (1 + K^2).
  assumptions:
    - "Decoupled isotropic nematic limit (kappa = beta = q_0 = 0, fast nematic relaxation c_0/eta_rot = 100) in mirza2025 Eq. (C7)."
    - "Unstable contractile regime (C_H = A/Kd < 2/3, Z in [30, 55], MaxEigenvRe > 0) so 1D/stabilitydiagram.jl line 52's uninitialized zero column does not clamp the leading eigenvalue."

