# Cross-record ModelAtlas relations for barberi2023_code (Barberi-Kruse-2022 Julia repository)
# paired with:
#   - barberi2023 (Barberi & Kruse, Phys. Rev. Lett. 131, 238401, 2023)
#   - mirza2025   (Mirza et al., eLife 13:RP93097, 2024/2025; cites barberi2023 pp. 2, 8)
#
# Structure:
# - Section 1: 1D homogeneous steady state and linear stability (code_stability_point_1d vs
#   barberi2023/homogeneous_steady_state, linear_stability_1d_sm15, stability_boundary_smfig1).
# - Section 2: 1D periodic and no-flux PDE steady-state solvers (code_1d_periodic_pde and
#   code_1d_noflux_pde vs barberi2023/pde_1d_steady_state_sm1_5 and pde_1d_spike_scaling_smfig3,
#   plus internal comparison between shipped 1D/NoFlux and 1D/PeriodicBoundaries).
# - Section 3: 2D periodic PDE solver (code_2d_periodic_pde vs barberi2023/pde_2d_time_eq1_5_printed
#   [stated, refuted: traceless 1 + 2|K|^2 vs printed Eq. 3's 1 + 2.5|K|^2] and
#   barberi2023/pde_2d_time_eq1_5 [proposed, verified approximated_by]).
# - Section 4: Cross-paper isotropic active-gel dispersion bridge to mirza2025
#   (code_stability_point_1d vs mirza2025/dispersion_1d_eqC7 and fastest_growing_mode_eqC7).
#
# Notes on unlinked models (full 7 x 24 barberi2023 & 7 x 49 mirza2025 audit):
# - Curve-port models (barberi2023_code/code_stability_diagram_1d, code_1d_periodic_profile;
#   barberi2023/pde_1d_profile_sm1_5, pde_1d_snaking_branch_sm1_5, pde_1d_flux_profile_sm4,
#   pde_1d_phase_orbit_sm1_5, profile_fwhm_from_curve) cannot be tested directly in ModelAtlas
#   (boxgraph/atlas.py tests single-valued scalar ports only); their underlying scalar engines are
#   tested below and their full curves are verified directly in comparisons.yaml (see
#   q_cross_record_curve_relations_and_mirza2025).
# - barberi2023_code/code_grid_config_derived encodes Julia-specific discretization/CFL/frame-count
#   formulas with no counterpart model in barberi2023 or mirza2025.
# - barberi2023/pde_1d_time_sm1_5 runs time integration of passive travelling waves (SM Fig. 2),
#   whereas code_1d_periodic_pde defaults to steady-state newton_krylov on the spike branch.
# - barberi2023's dimensional scale models (hydrodynamic_length, diffusive_timescale), viscous/
#   nonviscous constitutive helpers, 8D spatial dynamics (spatial_dynamics_*_sm24), and local
#   inner-wavelength LSA (inner_wavelength_lsa_*) have no released script in Barberi-Kruse-2022
#   (q_missing_analysis_scripts).
# - mirza2025's dimensional scale, nematic Q-tensor, Landau free energy, entropy-production, and
#   CytoSim agent-based models have no counterpart in purely dimensionless isotropic barberi2023_code.

# ==============================================================================
# 1. 1D Homogeneous Steady State & Linear Stability (1D/stabilitydiagram.jl vs barberi2023)
# ==============================================================================

