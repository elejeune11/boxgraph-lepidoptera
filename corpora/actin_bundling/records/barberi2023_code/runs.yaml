# ==============================================================================
# 4. 1D/PeriodicBoundaries Fourier pseudo-spectral solver runs
# ==============================================================================
- id: run_per1d_shipped_adaptive
  model: code_1d_periodic_pde
  inputs:
    L_base: per1d_L
    L_mult: per1d_L_mult_1
    N_base: per1d_Nx
    Dc: per1d_Dc
    Da: per1d_Da
    A: per1d_A
    Kd: per1d_Kd
    Omega0: per1d_Omega0
    Omega: per1d_Omega
    Omega_d: per1d_Omega_d
    Omega_d0: per1d_Omega_d0
    Z: per1d_Z
    B: per1d_B
    T_end: per1d_FinalTime
    ErrorTolerance: per1d_ErrorTolerance
    dt_init: per1d_dt_init
  settings:
    solver: "adaptive_midpoint"
    adapt_steps: 5
  outputs:
    C_HSS: per1d_ad_CH
    C_min: per1d_ad_Cmin
    C_max: per1d_ad_Cmax
    C_center: per1d_ad_Ccenter
    grad_c_sq_mean: per1d_ad_grad_c_sq
    mean_N: per1d_ad_mean_N
    max_rhs: per1d_ad_max_rhs
    dt_first_step: per1d_ad_dt_first
  note: "Verbatim 1D/PeriodicBoundaries AdaptiveTimeStep! on shipped square ZeroMeanBump IC (Z = 9.3, Omega = 12, Nx = 512): confirms Gibbs ringing halves step 1 fifteen times to dt = 6.104e-7."

