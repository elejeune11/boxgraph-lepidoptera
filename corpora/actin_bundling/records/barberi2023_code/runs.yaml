    TotPrints_2d_intended: cfg_TotPrints_2d_intended
    cfl_diff_2d: cfg_cfl_diff_2d
  note: "Verifies exact derived grid/mode counts across all four Julia scripts and exposes 2D/InputParameters.jl:61 TotPrints = floor(1e4 / 1e6) = 0 vs intended 100."

# ==============================================================================
# 2. Pointwise 1D linear stability checks (1D/stabilitydiagram.jl)
# ==============================================================================
- id: run_stab_point_Z15_Om6
  model: code_stability_point_1d
  inputs:
    A: stab_A
    Kd: stab_Kd
    Dc: stab_Dc
    Dap: stab_Dap
    Dam: stab_Dam
    Omega0: stab_Omega0
    Omega_d: stab_Omega_d
    Z: nf1d_Z
    Omega: paper_Omega_LP0
    L: stab_L
    Nx: stab_Nx
  settings:
    include_uninit_col: true
  outputs:
    Na_HSS: stab_pt_Z15_Om6_NaH
    C_HSS: stab_pt_Z15_Om6_CH
    MaxEigenvRe: stab_pt_Z15_Om6_max_re
    MaxEigenvIm: stab_pt_Z15_Om6_max_im
    K_dominant: stab_pt_Z15_Om6_Kdom
    regime_code: stab_pt_Z15_Om6_code
    Omega_crit_discrete: stab_pt_Z15_Om6_Om_crit
    K_crit_discrete: stab_pt_Z15_Om6_K_crit
  note: "Pointwise 1D/stabilitydiagram.jl at Fig. 1(a) LP0 (Z = 15, Omega = 6): confirms discrete finite-domain onset Omega_c = 8.3177 at K_1 = 0.2 (vs continuum 8.1435) and MaxEigenvRe = 0 clamped by uninitialized column Nk+1."

