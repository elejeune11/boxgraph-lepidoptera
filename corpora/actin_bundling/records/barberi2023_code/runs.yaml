    N_2d: code2d_N
    dt_2d: code2d_dt
    Di: code2d_Di
    T_2d: code2d_FinalTime
    save_div: code2d_save_divisor
  settings: {}
  outputs:
    dZ_stab: cfg_dZ_stab
    Kmin_stab: cfg_Kmin_stab
    Kmax_stab: cfg_Kmax_stab
    Nk_stab: cfg_Nk_stab
