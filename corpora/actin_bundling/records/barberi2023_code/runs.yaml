# ==============================================================================
# 1. Derived numerical grid, wavenumber, CFL, and frame-count checks
# ==============================================================================
- id: run_grid_config_derived
  model: code_grid_config_derived
  inputs:
    L: stab_L
    MinZ: stab_MinPar1_Z
    MaxZ: stab_MaxPar1_Z
    NPar1: stab_NPar1
    Nx_stab: stab_Nx
    Nx_nf: nf1d_Nx
