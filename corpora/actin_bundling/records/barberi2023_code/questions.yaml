  text: >
    Direct ports of both shipped 1D PDE codes settle the exact numerical origin of SM Fig. 3's digitized
    inset spike heights (0.65272, 0.66710, 0.67374, 0.67694, 0.67850, 0.67928 ± 0.00004 at L x 1..32,
    Delta X = L/1024; barberi2023 q_digitize_smfig3_inset_discretization):
    (1) 1D/NoFlux (1st-order conservative upwind advection) does NOT reproduce SM Fig. 3 at Delta X = L/1024:
    its O(dx) upwind numerical diffusivity (~|v|dx/2, comparable to Dc = 0.01) yields 0.62130..0.66291
    (half-cell symmetric, -0.016 to -0.031 too low) or 0.66042..0.70484 (node-centered, +0.008 to +0.026
    too high) and a 55-75% too-large L x 2 - L x 1 jump (0.0233-0.0251 vs 0.01438).
    (2) 1D/PeriodicBoundaries (un-dealiased Fourier pseudo-spectral) node-centered at X = 0 with N_bar = 1
    yields continuum peaks 0.66446..0.69305 (+0.012 to +0.014 above SM Fig. 3).
    (3) However, two exact discretization artifacts of 1D/PeriodicBoundaries/InputParameters.jl (lines 6, 35, 44)
    together reproduce all six SM Fig. 3 inset dots to 5 significant digits (0.00001-0.00005):
    (a) half-grid-cell peak centering at X = -Delta X/2 (midpoint of the half-open grid
    x = [-L/2 + i*dx for i = 0:Nx-1], directly matching SM Fig. 3 main panel's digitized X_peak = -0.0165),
    which samples the continuum spike at +-Delta X/2 (0.65102..0.67928 for N_bar = 1), and
    (b) normalizing conserved nucleator density via integrate(x, Na + Ni)/L = 1 on the span [-L/2, L/2 - dx]
    of width L - dx (omitting the periodic wrap interval [L/2 - dx, L/2]), which inflates the discrete
    periodic mean to N_bar = Nx/(Nx - 1) and yields 0.65275, 0.66711, 0.67376, 0.67697, 0.67855, 0.67933
    (matching 4/6 points inside ±0.00004 and the remaining two at L x 16, 32 within 0.00005).
  citation:
    file: 1D/PeriodicBoundaries/InputParameters.jl
    lines: "5-6"
    quote: "x = [-L/2 + i*Δx for i = 0:Nx-1]"

