- id: q_1d_adaptive_stepper_and_ic_bugs
  kind: possible_error
  about:
    - code_1d_periodic_pde
    - code_1d_noflux_pde
    - per1d_Z
    - per1d_Omega
    - per1d_FinalTime
    - per1d_dt_init
    - per1d_ErrorTolerance
  text: >
    Both 1D time-stepping drivers share four implementation bugs/quirks plus a non-figure default parameter set:
    (1) Inside AdaptiveTimeStep!'s while loop (1D/PeriodicBoundaries/functions.jl:73 and 1D/NoFlux/functions.jl:90),
    the relative error expression drops abs() on the denominator (abs.(FL .- FS) ./ FL instead of
    abs.((FL .- FS) ./ FL) used on line 56/73 before the loop), so any negative density overshoot would
    produce a negative error ratio and falsely exit the halving loop.
    (2) AdaptiveTimeStep! computes two half-steps Fields_ShortStep (2nd-order midpoint at 0.5*dt) and one
    full step Fields_LongStep (at dt), then discards the more accurate Fields_ShortStep and advances with
    Fields_LongStep (PeriodicBoundaries/functions.jl:78, NoFlux/functions.jl:95).
    (3) Discontinuous square ZeroMeanBump on 1D/PeriodicBoundaries's un-dealiased rfft grid induces immediate
    Gibbs ringing that halves step 1 fifteen times from dt = 0.02 down to 6.104e-7.
    (4) SavedFields allocates plotframes = floor(Int64, FinalTime / FrameTimeStep) slots while storing t = 0
    at ThisFrame = 1, risking a BoundsError at ThisFrame = plotframes + 1 if the final save hits FinalTime;
    and Savedv[:, 1] stores all zeros rather than the initial velocity.
    (5) Shipped 1D/PeriodicBoundaries/InputParameters.jl sets Z = B = 9.3, Omega = 12, FinalTime = 10, which
    does not match any published figure in barberi2023 (it sits inside the subcritical oscillatory LS regime
    below Omega_c(9.3) ~= 13.4).
  citation:
    file: 1D/PeriodicBoundaries/functions.jl
    lines: "73-79"
    quote: "MaxError = findmax(abs.(Fields_LongStep .- Fields_ShortStep) ./ Fields_LongStep)[1]"

- id: q_1d_noflux_mass_leak_and_stencil_typos
  kind: possible_error
  about:
    - code_1d_noflux_pde
    - nf1d_Nx
    - nf1d_Omega
  text: >
    1D/NoFlux contains a boundary mass-conservation bug and two minor typos:
    (1) 1D/NoFlux/functions.jl lines 15-18 compute upwind boundary fluxes ∂xFieldsv[:, 1] and ∂xFieldsv[:, Nx],
    which are dead code because lines 26-28 evaluate RHS only on interior nodes 2:Nx-1 and lines 32-33
    overwrite RHS[:, 1] = RHS[:, 2] and RHS[:, Nx] = RHS[:, Nx-1]. When boundary velocity points outward
    (v[2] < 0 or v[Nx-1] > 0), the interior upwind flux -|v[2]|*F[:, 2]/dx (or -|v[Nx-1]|*F[:, Nx-1]/dx)
    leaves the interior without returning, leaking conserved nucleator mass (our T = 5 outward-flow probe
    exhibits mass_drift = -0.0125). For centered contractile localized states (inward boundary flow v[2] >= 0,
    v[Nx-1] <= 0), interior mass is conserved, though O(dx) upwind diffusivity still smears the sharp C profile
    (explaining why 1D/NoFlux/InputParameters.jl raises Nx to 4096 vs 512 in 1D/PeriodicBoundaries).
    (2) The commented-out 5-point viscous matrix A in 1D/NoFlux/main.jl lines 57 and 60 writes (2 + Δx)
    instead of (2 + Δx^2) before dividing by Δx^2 on line 66.
    (3) 1D/NoFlux/main.jl line 120 comments "provided Δt never less than MaxTimeStep" (inverted for "never greater
    than MaxTimeStep"), and ZeroMeanNoise uses integrate(x, Noise)/L on [-L/2, L/2 - dx] (span L - dx).
  citation:
    file: 1D/NoFlux/functions.jl
    lines: "15-34"
    quote: "RHS[:,1] = RHS[:,2];"

