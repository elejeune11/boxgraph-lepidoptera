  text: >
    2D/kernels.jl lines 54-55 explicitly solve fV = i*k*fPi / (1 + 2*(kx^2 + ky^2)), implementing the
    true traceless 2D viscous operator (coefficient 2) rather than the non-traceless strain-rate tensor
    printed in Main Text Eq. (3) (coefficient 2.5 in d = 2 with eta = eta_tilde). This definitively
    settles barberi2023 q_eq3_non_traceless_strain_rate and q_audit_eq3_2d_printed_vs_traceless: our
    2D code port sustains Fig. 4(a) circular and Fig. 4(c) band localized states at coefficient 2
    (C_max ~ 0.94 and 0.82), whereas substituting printed Eq. (3)'s 2.5 decays back toward H (C_max = 0.219).
    Furthermore, 2D/InputParameters.jl line 44 explicitly sets Omega_d = 10, settling barberi2023
    q_fig4_omega_d_unstated (omitted from Fig. 4's caption). Conversely, shipped 2D/InputParameters.jl
    lines 45-48 set placeholder parameters Omega_d0 = 10, Omega = 10, Z = B = 10 (not Fig. 4's
    Omega_d0 = 0, Z = 30, Omega = 0 or 9), at which H is stable (C_H = 0.0465) and the initial bump decays.
