    - stab_MaxPar2_Omega
    - stab_NPar1
    - stab_NPar2
    - paper_smfig1_boundary_Is
    - paper_smfig1_boundary_Io
  text: >
    1D/stabilitydiagram.jl completely explains both SM Fig. 1's upward offset relative to the continuum
    K -> 0+ Type II_s boundary and the Type I_s label (settling barberi2023 q_sm_fig1_long_wave_type_iis
    and q_digitize_smfig1_finite_domain_offset): (1) Lines 43-49 and 103-104 evaluate the 3x3 stability
    matrix only on the discrete finite-domain periodic wavenumbers K_p = p * (2*pi/L) = 0.2*p for
    p = 1..255 (Kmin = 0.2, Kmax = 51.2, Nk = 255), which pushes the long-wave onset upward (e.g.
    at Z = 15, Omega_c rises from continuum 8.1435 to discrete 8.3177 at K_1 = 0.2) and causes the
    K_1 = 0.2 real eigenvalue to be flagged as a finite-wavelength Turing (Type I_s) bifurcation.
    (2) BifurcationLines (lines 138, 142) detects the lower boundary solely via the one-sided i-transition
    (i > 1 && SD[i,j] == 1/2 && SD[i-1,j] == 0), recording the first unstable grid node Z_i = ceil(Z_crit/dZ)*dZ
    (shifting the plotted curve right by 0..+dZ and truncating Z = 0, visibly why SM Fig. 1's dashed
    I_o curve stops before the Z = 0 axis), while the j-transition clause (SD[i,j] == 0 && SD[i,j-1] == 1/2)
    detects only the upper restabilization boundary at high Omega ~ 70-95 (where C_H > 2/3 makes Pi'(C_H) < 0).
    (3) Shipped lines 26-34 set MaxPar1 = MaxPar2 = 100, NPar1 = NPar2 = 500 (dZ = dOm = 0.2), which
    reproduces 14/17 digitized SM Fig. 1 I_s points (median |diff| = 0.092, max 0.301 at Z = 24.2),
    whereas running the identical algorithm on SM Fig. 1's plotted [0, 30] x [0, 30] window with
    NPar1 = NPar2 = 100 (dZ = dOm = 0.3) reproduces all 17/17 digitized I_s points to 0.0001-0.0081
    (median 0.0038) and matches Z(Om = 0) = 24.6 and the dashed I_o start at Z = 0.3.
    (4) Two minor implementation quirks: line 52 allocates EigenvStabilityMatrix with Nk + 1 = 256 columns
    while lines 103-110 fill only 1:Nk (255), leaving column 256 identically zero (clamping MaxEigenvRe >= 0
    even when H is stable); and Omega_d0 = 0 is hardcoded (omitted from Pars and lines 76-81).
  citation:
    file: 1D/stabilitydiagram.jl
    lines: "43-52"
    quote: "Kmin = 2*π / L"

- id: q_smfig3_half_cell_and_trapz_mass_artifact
  kind: numerics
  about:
