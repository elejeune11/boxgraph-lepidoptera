  text: >
    Cross-record ModelAtlas audit for barberi2023_code paired with barberi2023 and mirza2025:
    (1) Curve-port models cannot be tested directly by ModelAtlas (boxgraph/atlas.py rejects any
    model with a curve input or output port as unverifiable). Thus barberi2023_code/code_stability_diagram_1d
    (query_curve -> Omega_boundary) vs barberi2023/stability_boundary_smfig1 and
    barberi2023_code/code_1d_periodic_profile (target_curve -> C_profile) vs
    barberi2023/pde_1d_profile_sm1_5 and pde_1d_snaking_branch_sm1_5 are omitted from relations.yaml.
    Their exact mathematical correspondences are verified instead via their scalar model engines
    (code_stability_point_1d, code_1d_periodic_pde, code_1d_noflux_pde) in relations.yaml and
    against the full digitized SM Fig. 1, Fig. 1(a), Fig. 2 LP0, Fig. 3(a), and SM Fig. 3 curves
    in comparisons.yaml.
    (2) Against mirza2025 (which cites barberi2023 pp. 2, 8 as part of the isotropic compressible
    active-gel family), barberi2023_code ships purely dimensionless isotropic equations (no dimensional
    hydrodynamic_length or diffusive_timescale models and no nematic Q-tensor fields). The exact
    bridge lives in rel_mirza2025_code_stability_reduces_eqC7 and
    rel_mirza2025_code_stability_approx_fastest_mode, which link 1D/stabilitydiagram.jl's matrix M(K)
    directly to mirza2025 Eq. (C7)'s decoupled isotropic density dispersion and fastest-growing mode
    under the 4x viscous rescaling (Dc = 1/4, nu = K/2 = pi/L, lam = 4*Pi'_H*C_H).
  citation:
    file: README.md
    lines: "2-12"
    quote: 'This repo provides the code used in the article [_"Localized states in active fluids"_](https://arxiv.org/abs/2209.02581), Barberi &amp; Kruse, arXiv:2209.02581.'

