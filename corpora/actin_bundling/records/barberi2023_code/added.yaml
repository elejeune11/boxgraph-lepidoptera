  alternatives: ["100"]
  stands_for: "MaxPar1 for the SM Fig. 1 [0, 30] x [0, 30] parameter-scan window"

- id: smfig1_MaxPar2_added
  quantity: dimless_cooperative_activation
  unit: dimensionless
  printed: "30"
  basis: "SM Fig. 1 plots Omega in [0, 30], whereas shipped 1D/stabilitydiagram.jl:30 sets MaxPar2 = 100."
  alternatives: ["100"]
  stands_for: "MaxPar2 for the SM Fig. 1 [0, 30] x [0, 30] parameter-scan window"

- id: smfig1_NPar_added
  quantity: grid_point_count
  unit: dimensionless
  printed: "100"
  basis: "On [0, 30] x [0, 30], NPar1 = NPar2 = 100 gives Delta Z = Delta Omega = 0.3, reproducing all 17/17 digitized SM Fig. 1 Type I_s boundary points to median |diff| = 0.0038 (vs shipped NPar = 500 on [0, 100] giving Delta = 0.2)."
  alternatives: ["150", "300"]
  stands_for: "NPar1 = NPar2 grid point count generating the plotted SM Fig. 1 staircase"

- id: viscous_coeff_2d_eq3_printed_added
  quantity: viscous_stress_ratio_2d
  unit: dimensionless
  printed: "2.5"
  basis: "Longitudinal Fourier viscous coefficient implied by Main Text Eq. (3) as printed (non-traceless v = (1/2)[grad v + (grad v)^T - (div v / d) 1]) in d = 2 with eta = eta_tilde, probed to contrast against 2D/kernels.jl:54-55's traceless coefficient 2."
  alternatives: ["2"]
  stands_for: "Coefficient of (kx^2 + ky^2) in 2D velocity denominator under verbatim printed Eq. (3)"

- id: T_end_2d_cpu_added
  quantity: dimless_time
  unit: dimensionless
  printed: "100"
  basis: "Affordable CPU integration horizon for the 2D Euler-forward port (shipped GPU 2D/InputParameters.jl:51 uses FinalTime = 1e4 with dt = 1e-4, i.e., 10^8 steps); T = 100 relaxes Fig. 4(a),(c) localized states and shipped-parameter decay cleanly on CPU."
  alternatives: ["50", "150"]
  stands_for: "FinalTime for CPU validation runs of the 2D GPU Euler-forward port"

- id: T_end_wave_cpu_added
  quantity: dimless_time
