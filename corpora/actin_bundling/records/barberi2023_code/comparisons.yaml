# ==============================================================================
# 2. SM Fig. 3 spike height C_max vs L x 1..32 (1D/PeriodicBoundaries vs 1D/NoFlux)
# ==============================================================================
- id: cmp_smfig3_per1d_half_trapz
  purpose: reproduction
  computed: per1d_smfig3_half_trapz_C_max
  printed: paper_smfig3_inset_Cmax
  note: "Exact 1D/PeriodicBoundaries Fourier pseudo-spectral steady state with InputParameters.jl:6,35,44 half-cell peak centering (X_peak = -dx/2) and trapezoidal normalization on [-L/2, L/2 - dx] (N_bar = Nx/(Nx - 1)): matches all 6 digitized SM Fig. 3 inset heights (0.65272..0.67928) to 0.00001-0.00005."

- id: cmp_smfig3_per1d_node
  purpose: reproduction
  computed: per1d_smfig3_node_C_max
  printed: paper_smfig3_inset_Cmax
  note: "1D/PeriodicBoundaries Fourier steady state centered on a grid node (X_peak = 0) with exact N_bar = 1: continuum peaks 0.66446..0.69305 lie +0.012 to +0.014 above SM Fig. 3, demonstrating the half-cell sampling offset."

- id: cmp_smfig3_nf1d_half
  purpose: reproduction
  computed: nf1d_smfig3_half_C_max
  printed: paper_smfig3_inset_Cmax
  note: "1D/NoFlux upwind finite-difference steady state (half-cell symmetric, Delta X = L/1024): O(dx) upwind numerical diffusion depresses C_max to 0.62130..0.66291 and inflates the 2L - 1L jump by 62%, ruling out 1D/NoFlux as the generator of SM Fig. 3."

- id: cmp_smfig3_nf1d_node
  purpose: reproduction
  computed: nf1d_smfig3_node_C_max
  printed: paper_smfig3_inset_Cmax
  note: "1D/NoFlux upwind finite-difference steady state (node-centered, Delta X = L/1024): overshoots SM Fig. 3 to 0.66042..0.70484 with a 75% too-large 2L - 1L jump, confirming SM Fig. 3 came from 1D/PeriodicBoundaries."

- id: cmp_smfig3_asymptotic_scalar
  purpose: reproduction
  computed: per1d_smfig3_L32_half_trapz_C_max
  printed: paper_C_max_spike_asymptotic
  note: "1D/PeriodicBoundaries half-cell + trapz spike peak at 32*L (0.67933) directly reproduces SM Fig. 3 caption's printed asymptotic value C_max ~= 0.68."

