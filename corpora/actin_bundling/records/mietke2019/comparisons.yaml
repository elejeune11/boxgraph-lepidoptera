# --- Spherical linear stability & Eq. (S71) misprint check (p. 19-20) ---

- id: cmp_sphere_lambda1_eqs72
  purpose: reproduction
  computed: lambda1_threshold_eqs72_pred
  printed: sphere_threshold_lambda1_predicted
  note: "Direct check of Eq. (S72) at alpha = alpha_s^* (Eq. 26)."

- id: cmp_sphere_mode_l1_eqs71_printed
  purpose: reproduction
  computed: sphere_l1_threshold_printed_pred
  printed: sphere_threshold_lambda1_predicted
  note: "Printed Eq. (S71) contains R0^2*D*l(l+1) instead of D*l(l+1)/R0^2, failing lambda_1 = 0 by -599.94 s^-1 at R0 = 10 um, D = 3 um^2/s."

- id: cmp_sphere_mode_l1_eqs71_corrected
  purpose: reproduction
  computed: sphere_l1_threshold_corrected_pred
  printed: sphere_threshold_lambda1_predicted
  note: "Corrected Eq. (S71) variant with D*l(l+1)/R0^2 reproduces lambda_1 = 0 identically."

- id: cmp_sphere_mode_l1_eqs70_71_corrected
  purpose: reproduction
  computed: sphere_l1_threshold_s70_s71_corrected_pred
  printed: sphere_threshold_lambda1_predicted
  note: "Jointly corrected Eqs. (S70)-(S71) variant also reproduces lambda_1 = 0 identically (l = 1 is independent of kappa)."

- id: cmp_sphere_mode_l2_kappa_s70_vs_corrected
  purpose: consistency
  computed: sphere_l2_kappa_s70_s71_corrected_pred
  printed: sphere_l2_kappa_s71_only_pred
  note: "At l = 2 and finite kappa = 625 pN*um (R0 = 10 um), printed Eq. (S70) understates bending stiffness by a factor of 2 compared to exact Eq. (S33) linearization."

