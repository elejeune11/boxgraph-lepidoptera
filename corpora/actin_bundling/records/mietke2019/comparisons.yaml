# --- Calibrated figure comparisons (Figs. 2B, 3A, 3D, S1B-C, S2A-B) ---

# Fig. 2B: reported m = 2 (Table S1) fails; hypothesis m = 1 reproduces all four profiles
- id: cmp_fig2b_c_m2
  purpose: reproduction
  computed: fig2b_c_m2_pred
  printed: fig2b_c_fig
  note: "Table S1's reported m = 2 overpredicts the polar concentration peak (19.53 vs 18.63 at s/L=0.02) and narrows the patch relative to Fig. 2B."

- id: cmp_fig2b_vs_m2
  purpose: reproduction
  computed: fig2b_vs_m2_pred
  printed: fig2b_vs_fig
  note: "Reported m = 2 shifts the velocity minimum to s/L = 0.265 (-2.13) vs Fig. 2B's s/L = 0.31 (-2.034)."

- id: cmp_fig2b_Css_m2
  purpose: reproduction
  computed: fig2b_Css_m2_pred
  printed: fig2b_Css_fig
  note: "Reported m = 2 misses Fig. 2B's meridional curvature strongly (pole 0.518 vs 0.578; peak 1.914 at 0.35 vs 1.721 at 0.38)."

- id: cmp_fig2b_Cphi_m2
  purpose: reproduction
  computed: fig2b_Cphi_m2_pred
  printed: fig2b_Cphi_fig
  note: "Reported m = 2 misses Fig. 2B's azimuthal curvature profile by up to 0.099."

- id: cmp_fig2b_c_m1_hypothesis
  purpose: consistency
  computed: fig2b_c_m1_pred
  printed: fig2b_c_fig
  note: "Hypothesis test with Hill exponent m = 1 quantitatively settles q_fig2b_hill_exponent_discrepancy across the entire Fig. 2B concentration profile."

- id: cmp_fig2b_vs_m1_hypothesis
  purpose: consistency
  computed: fig2b_vs_m1_pred
  printed: fig2b_vs_fig
  note: "Hypothesis test with Hill exponent m = 1 reproduces Fig. 2B's in-plane velocity profile across all 14 calibrated points (rms ~ 0.01)."

- id: cmp_fig2b_Css_m1_hypothesis
  purpose: consistency
  computed: fig2b_Css_m1_pred
  printed: fig2b_Css_fig
  note: "Hypothesis test with Hill exponent m = 1 reproduces Fig. 2B's meridional curvature profile across all 14 calibrated points (rms = 0.0059, 22x lower than m = 2)."

- id: cmp_fig2b_Cphi_m1_hypothesis
  purpose: consistency
  computed: fig2b_Cphi_m1_pred
  printed: fig2b_Cphi_fig
  note: "Hypothesis test with Hill exponent m = 1 reproduces Fig. 2B's unoccluded azimuthal curvature profile across all 10 calibrated interior points."

