#       friction identically to zero (f_j^ext = 0, p. 6 / SI p. 13). In Eqs. (S80)-(S82)
#       (cylinder_jacobian_eqs80_82), both the geometric driving term T(k) = -kappa_tilde*(2*k^4 - k^2 + 3)
#       + (1 + xi*f0/gamma)*(1 - k^2) (strictly decreasing in k^2 wherever T(k) > 0) and the active
#       concentration term alpha - D_tilde*k^2 - k_tilde are strictly maximized at k_n -> 0. Thus
#       mietke2019's cylindrical active-surface model exhibits a long-wavelength (Type-II) instability
#       with k_max -> 0 (lambda_max -> infinity) across all parameters and NEVER selects an intrinsic
#       finite periodic ring spacing lambda_max, unlike hannezo2015's friction-screened Type-I
#       instability lambda_c = 2*pi*(D*tau*eta/xi)^(1/4).
