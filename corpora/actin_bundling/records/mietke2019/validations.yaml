#       circumference 15.0 um (30x WT 0.5 um) / 9.7 um (>2x kkv1 4.5 um) for alpha <= alpha_c^* and
#       depends arbitrarily on unmeasured supercriticality alpha above alpha_c^*.
#   (3) No mietke2019 model outputs FRAP recovery kinetics, ring counts, fluorescence intensity
#       ramps, or dimensional tube diameters/wavelengths.
