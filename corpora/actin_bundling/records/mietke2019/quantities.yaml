# Physical and dimensionless quantities for Mietke, Jülicher & Sbalzarini (2019)

- id: surface_tension
  name: equilibrium surface tension
  dimension: "[mass] / [time] ** 2"
  description: Equilibrium isotropic surface tension gamma in the Helfrich free energy (Eq. 5).

- id: active_contractility
  name: active contractility amplitude
  dimension: "[mass] / [time] ** 2"
  description: Maximum active contractile tension amplitude xi in xi_a = xi * f(c) (Eq. 9, p. 3).

- id: bending_rigidity
  name: bending rigidity
  dimension: "[mass] * [length] ** 2 / [time] ** 2"
  description: Bending rigidity kappa in the Helfrich free energy F_H = int dA [gamma + kappa*(C_k^k)^2] (Eq. 5).

- id: bulk_surface_viscosity
  name: 2D surface bulk viscosity
  dimension: "[mass] / [time]"
  description: Two-dimensional surface bulk viscosity eta_b in deviatoric tension tensor Eq. (9).

- id: shear_surface_viscosity
  name: 2D surface shear viscosity
  dimension: "[mass] / [time]"
  description: Two-dimensional surface shear viscosity eta_s in deviatoric tension tensor Eq. (9).

- id: surface_viscosity_ratio
  name: surface shear-to-bulk viscosity ratio
  dimension: dimensionless
  description: Dimensionless ratio eta_s / eta_b (Table S1).

- id: viscosity_parameter
  name: cylindrical linear-stability viscosity parameter
  dimension: dimensionless
  description: Dimensionless viscosity combination nu_bar = (eta_s + eta_b) / (4 * eta_s) in SI Sec. 4.2 (Eq. S84).

- id: characteristic_viscocapillary_timescale
  name: viscocapillary timescale
  dimension: "[time]"
  description: Characteristic timescale tau = eta_b / gamma (Fig. 2B caption, Table S1).

- id: sphere_radius
  name: reference sphere radius
  dimension: "[length]"
  description: Radius R_0 of the homogeneous reference sphere with volume V = (4*pi/3) R_0^3.

- id: cylinder_radius
  name: reference cylinder radius
  dimension: "[length]"
  description: Radius r_0 of the homogeneous reference cylindrical tube.

- id: cylinder_length
  name: periodic cylinder axial length
  dimension: "[length]"
  description: Periodic axial length L_0 of the tubular surface.

- id: surface_diffusion_coefficient
  name: surface diffusion coefficient
  dimension: "[length] ** 2 / [time]"
  description: Isotropic in-plane diffusion constant D of the stress regulator (Eq. 13).

- id: regulator_turnover_rate
  name: stress-regulator turnover rate
  dimension: "1 / [time]"
  description: First-order turnover / relaxation rate k of the stress regulator toward c_0 (Eq. 13).

- id: regulator_concentration
  name: stress-regulator concentration (dimensionless)
  dimension: dimensionless
  description: Dimensionless surface concentration c_tilde = c / c_0 of the active-stress regulator.

- id: preferred_regulator_concentration
  name: reference stress-regulator concentration (dimensionless)
  dimension: dimensionless
  description: Preferred / homogeneous steady-state concentration c_0 in normalized units (c_0 = 1).

- id: hill_coefficient
  name: Hill regulation exponent
  dimension: dimensionless
  description: Hill exponent m in f(c) = c^m / (c_0^m + c^m) (Eq. 12).

- id: active_tension_regulation_factor
  name: active-tension regulation factor
  dimension: dimensionless
  description: Dimensionless Hill regulation function f(c) = c^m / (c_0^m + c^m) (Eq. 12).

- id: hill_sensitivity_at_c0
  name: logarithmic Hill sensitivity at c0
  dimension: dimensionless
  description: Dimensionless slope c_0 * d_c f(c_0) = m / 4 entering the contractility parameter alpha (Eq. 25, Table S1).

- id: dimensionless_active_contractility
  name: dimensionless active contractility xi/gamma
  dimension: dimensionless
  description: Ratio xi / gamma of active contractility amplitude to passive surface tension (Table S1).

- id: dimensionless_homogeneous_active_tension
  name: dimensionless homogeneous active tension xi*f(c0)/gamma
  dimension: dimensionless
  description: Ratio xi * f(c_0) / gamma entering total homogeneous surface tension gamma + xi*f(c_0) in Eqs. (S70), (S80)–(S81).

- id: dimensionless_contractility_parameter
  name: dimensionless contractility parameter alpha
  dimension: dimensionless
  description: Mechanochemical feedback strength alpha = (xi / gamma) * c_0 * d_c f(c_0) (Eq. 25).

- id: sphere_critical_contractility
  name: critical contractility of a sphere
  dimension: dimensionless
  description: Linear instability threshold alpha_s^* = (eta_b/gamma)*(2D/R_0^2 + k) for the polar l=1 mode on a sphere (Eq. 26).

- id: cylinder_critical_contractility
  name: critical contractility of a cylinder
  dimension: dimensionless
  description: Critical contractility alpha_c^* = (eta_b/gamma)*(D/r_0^2 + k) separating Plateau–Rayleigh and active regimes on a cylinder (Eq. 27).

- id: dimensionless_bending_rigidity
  name: dimensionless bending rigidity
  dimension: dimensionless
  description: Dimensionless bending rigidity kappa_tilde = kappa / (gamma * l_c^2) with l_c = R_0 or r_0 (Fig. 3A, Table S1).

- id: dimensionless_diffusivity
  name: dimensionless surface diffusivity
  dimension: dimensionless
  description: Dimensionless diffusion parameter D * tau / l_c^2 (Table S1).

- id: dimensionless_turnover_rate
  name: dimensionless turnover rate
  dimension: dimensionless
  description: Dimensionless turnover parameter k * tau (Table S1).

- id: dimensionless_tube_aspect_ratio
  name: normalized tube aspect ratio L0/(2*pi*r0)
  dimension: dimensionless
  description: Ratio L_0 / (2*pi*r_0) of periodic cylinder length to circumference (Fig. 3A, Table S1).

- id: tube_aspect_ratio
  name: tube aspect ratio L0/r0
  dimension: dimensionless
  description: Geometric aspect ratio L_0 / r_0 of a periodic cylinder (Plateau–Rayleigh threshold 2*pi, p. 5 & Eq. S83).

- id: dimensionless_enclosed_volume
  name: dimensionless enclosed sphere volume V/R0^3
  dimension: dimensionless
  description: Enclosed volume divided by R_0^3, conserved at 4*pi/3 on spherical surfaces (Table S1).

- id: relative_enclosed_volume
  name: normalized conserved volume V/V0
  dimension: dimensionless
  description: Ratio of final to initial enclosed volume V(t) / V(0) (conserved at 1 by Eq. S59).

- id: relative_molecule_number
  name: normalized total molecule number Nc/Nc0
  dimension: dimensionless
  description: Ratio of final to initial total regulator amount N_c(t) / N_c(0) (conserved at 1 when k = 0, Eq. S62).

- id: relative_conservation_error
  name: relative numerical conservation error
  dimension: dimensionless
  description: Relative conservation error |X(t) - X(0)| / |X(0)| for volume V or molecule number N_c (Fig. S2C).

- id: spheroid_eccentricity
  name: prolate spheroid eccentricity
  dimension: dimensionless
  description: Eccentricity e = sqrt(1 - a^2/b^2) of an initial prolate spheroidal surface (Figs. 2C, S2A, S2C).

- id: dimensionless_semi_axis
  name: dimensionless spheroid semi-axis
  dimension: dimensionless
  description: Semi-axis (a/R_0 or b/R_0) of a volume-preserving prolate spheroid.

- id: dimensionless_time
  name: dimensionless simulation time t/tau
  dimension: dimensionless
  description: Time normalized by the viscocapillary timescale tau = eta_b / gamma.

- id: dimensionless_velocity
  name: dimensionless surface velocity
  dimension: dimensionless
  description: Velocity component (v_s, v_n, or wave speed v_0) normalized by l_c / tau.

- id: dimensionless_curvature
  name: dimensionless principal curvature
  dimension: dimensionless
  description: Meridional curvature C_tilde_s^s = l_c * C_s^s or azimuthal curvature C_tilde_phi^phi = l_c * C_phi^phi.

- id: dimensionless_radius
  name: dimensionless surface radius r/lc
  dimension: dimensionless
  description: Radial coordinate r normalized by reference radius l_c (R_0 or r_0).

- id: dimensionless_pressure
  name: dimensionless internal pressure
  dimension: dimensionless
  description: Homogeneous internal pressure p * l_c / gamma acting as Lagrange multiplier for volume conservation.

- id: internal_pressure
  name: physical internal pressure
  dimension: "[mass] / [length] / [time] ** 2"
  description: Homogeneous internal pressure p_0^s or p_0^c balancing equilibrium surface stresses (SI pp. 19–20).

- id: spherical_harmonic_degree
  name: spherical harmonic mode degree l
  dimension: dimensionless
  description: Axisymmetric spherical harmonic degree l >= 1 in Eqs. (S63)–(S72).

- id: axial_mode_number
  name: cylindrical Fourier mode index n
  dimension: dimensionless
  description: Axial Fourier mode index n >= 1 in k_n = 2*pi*n / L_0 (Eqs. S73–S82).

- id: wavenumber
  name: axial perturbation wavenumber
  dimension: "1 / [length]"
  description: Axial wavenumber k_n = 2*pi*n / L_0 of a periodic cylindrical perturbation.

- id: dimensionless_wavenumber
  name: dimensionless axial wavenumber k_n*r0
  dimension: dimensionless
  description: Dimensionless wavenumber k_tilde_n = k_n * r_0 (Plateau–Rayleigh threshold k_tilde_n = 1, Eqs. S84–S86).

- id: cylinder_bending_response
  name: cylindrical bending stiffness factor Bc
  dimension: "1 / [length] ** 4"
  description: Bending rigidity linear-response factor B_c(k_n r_0) in Eq. (S79).

- id: growth_rate
  name: physical linear growth rate
  dimension: "1 / [time]"
  description: Real part of perturbation growth rate lambda in physical inverse-time units (Eq. S72).

- id: oscillation_frequency
  name: physical linear oscillation frequency
  dimension: "1 / [time]"
  description: Imaginary part |Im(lambda)| of a linear stability eigenvalue in physical inverse-time units.

- id: dimensionless_growth_rate
  name: dimensionless linear growth rate
  dimension: dimensionless
  description: Maximum real part Re(lambda) * tau of the linear stability Jacobian eigenvalues.

- id: dimensionless_oscillation_frequency
  name: dimensionless linear oscillation frequency
  dimension: dimensionless
  description: Magnitude |Im(lambda)| * tau of the imaginary part of complex Jacobian eigenvalues.

- id: dimensionless_oscillation_period
  name: dimensionless oscillation period T/tau
  dimension: dimensionless
  description: Oscillation period T / tau = 2*pi / (|Im(lambda)| * tau) of oscillatory cylindrical modes.

- id: dimensionless_jacobian_trace
  name: dimensionless Jacobian trace
  dimension: dimensionless
  description: Trace Tr(J) * tau of the cylindrical linear stability Jacobian Eq. (S82).

- id: dimensionless_jacobian_determinant
  name: dimensionless Jacobian determinant
  dimension: dimensionless
  description: Determinant det(J) * tau^2 of the cylindrical linear stability Jacobian Eq. (S82).

- id: grid_point_count
  name: number of collocation points N
  dimension: dimensionless
  description: Number of spatial collocation points N discretizing the reference arc-length domain S_0 (Sec. 3.1–3.2).

- id: time_step_count
  name: number of explicit Euler time steps Nt
  dimension: dimensionless
  description: Number of explicit Euler time steps N_t used in temporal convergence validation (Fig. S2B).

- id: convergence_order
  name: numerical error convergence order
  dimension: dimensionless
  description: Power-law convergence exponent p in ||f - f^h||_inf ~ N^-p or ~ N_t^-p (SI Sec. 3.1–3.2, Fig. S2A–B).

- id: perturbation_amplitude
  name: initial concentration perturbation amplitude
  dimension: dimensionless
  description: Small dimensionless initial perturbation amplitude applied to homogeneous concentration c/c_0 = 1.

- id: normalized_arc_length
  name: normalized meridional arc length s/L
  dimension: dimensionless
  description: Arc-length coordinate s divided by total meridional length L (Figs. 2B, 3D, S1).

- id: normalized_reference_coordinate
  name: normalized reference coordinate u/L0
  dimension: dimensionless
  description: Reference-space coordinate u divided by initial meridional arc length L_0 (Fig. S1B).

- id: coordinate_transformation_factor
  name: dynamic coordinate transformation factor h
  dimension: dimensionless
  description: Local arc-length stretch factor h = ds/du mapping reference space S_0 to deformed surface S (Fig. 1B, Eq. 20, Fig. S1B).

- id: max_norm_discretization_error
  name: maximum-norm numerical discretization error
  dimension: dimensionless
  description: Maximum-norm error ||f - f^h||_inf of dimensionless velocity or principal curvature fields relative to a high-resolution reference solution (Figs. S2A, S2B).

