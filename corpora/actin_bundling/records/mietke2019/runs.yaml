# Model runs for Mietke, Jülicher & Sbalzarini (2019)

# --- Group 1: Constitutive relations, scales, and homogeneous equilibrium ---

- id: run_tau_phys
  model: characteristic_timescale
  inputs:
    eta_b: phys_eta_b_added
    gamma: phys_gamma_added
  outputs:
    tau: tau_phys_pred

- id: run_hill_m2
  model: hill_regulation_eq12
  inputs:
    c: c_homogeneous_dimless
    c0: c0_dimless
    m: hill_m_main
  outputs:
    f: hill_f_c0_pred
    c0_df_dc0: hill_slope_c0_pred

- id: run_alpha_fig2b
  model: contractility_parameter_eq25
  inputs:
    xi_over_gamma: fig2b_xi_over_gamma
    c0_df_dc0: hill_slope_c0_pred
  outputs:
    alpha: alpha_fig2b_pred

- id: run_alpha_fig2c
  model: contractility_parameter_eq25
  inputs:
    xi_over_gamma: fig2c_xi_over_gamma
    c0_df_dc0: hill_slope_c0_pred
  outputs:
    alpha: alpha_fig2c_pred

- id: run_alpha_fig3
  model: contractility_parameter_eq25
  inputs:
    xi_over_gamma: fig3_xi_over_gamma
    c0_df_dc0: hill_slope_c0_pred
  outputs:
    alpha: alpha_fig3_pred

- id: run_p0_sphere
  model: sphere_equilibrium_pressure_si
  inputs:
    gamma: phys_gamma_added
    xi: phys_xi_fig2b_added
    f_c0: hill_f_c0_pred
    R0: phys_R0_added
  outputs:
    p0_s: p0_sphere_phys_pred

- id: run_p0_cylinder
  model: cylinder_equilibrium_pressure_si
  inputs:
    gamma: phys_gamma_added
    xi: phys_xi_fig2b_added
    f_c0: hill_f_c0_pred
    kappa: phys_kappa_fig3d_added
    r0: phys_r0_added
  outputs:
    p0_c: p0_cylinder_phys_pred

- id: run_spheroid_fig2c
  model: prolate_spheroid_geometry
  inputs:
    e: fig2c_eccentricity
    V_over_R03: sphere_vol_dimless
  outputs:
    a_over_R0: spheroid_fig2c_a_pred
    b_over_R0: spheroid_fig2c_b_pred
    Css_pole_dimless: spheroid_fig2c_Css_pole_pred
    Css_eq_dimless: spheroid_fig2c_Css_eq_pred
    Cphi_eq_dimless: spheroid_fig2c_Cphi_eq_pred

- id: run_spheroid_figs2a
  model: prolate_spheroid_geometry
  inputs:
    e: figs2a_eccentricity
    V_over_R03: sphere_vol_dimless
  outputs:
    a_over_R0: spheroid_figs2a_a_pred
    b_over_R0: spheroid_figs2a_b_pred
    Css_pole_dimless: spheroid_figs2a_Css_pole_pred
    Css_eq_dimless: spheroid_figs2a_Css_eq_pred
    Cphi_eq_dimless: spheroid_figs2a_Cphi_eq_pred

# --- Group 2: Spherical linear stability (Eq. 26 & Eqs. S69-S72) ---

