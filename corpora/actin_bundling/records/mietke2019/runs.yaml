# --- Group 4: Hydrodynamics, convergence validation, and nonlinear PDEs ---

- id: run_sphere_hydro_s2a
  model: sphere_hydrodynamics_single_step_eqs32_33
  inputs:
    e: figs2a_eccentricity
    V_over_R03: sphere_vol_dimless
    xi_over_gamma: figs2a_xi_over_gamma
    kappa_tilde: figs2a_kappa_tilde
    eta_s_over_eta_b: viscosity_ratio_main
    m: hill_m_main
  settings:
    N: 101
  outputs:
    vn_max_dimless: s2a_vn_max_pred
    vs_max_dimless: s2a_vs_max_pred
    vn_pole_dimless: s2a_vn_pole_pred
    p_dimless: s2a_p_pred

- id: run_sphere_hydro_s2a_kappa025_printed
  model: sphere_hydrodynamics_single_step_eqs32_33
  inputs:
    e: figs2a_eccentricity
    V_over_R03: sphere_vol_dimless
    xi_over_gamma: figs2a_xi_over_gamma
    kappa_tilde: finite_kappa_test_added
    eta_s_over_eta_b: viscosity_ratio_main
    m: hill_m_main
  settings:
    N: 101
  outputs:
    vn_max_dimless: s2a_k025_vn_max_printed_pred
    vs_max_dimless: s2a_k025_vs_max_printed_pred
    vn_pole_dimless: s2a_k025_vn_pole_printed_pred
    p_dimless: s2a_k025_p_printed_pred

- id: run_sphere_hydro_s2a_kappa025_corrected
  model: sphere_hydrodynamics_single_step_eqs32_33_corrected
  inputs:
    e: figs2a_eccentricity
    V_over_R03: sphere_vol_dimless
    xi_over_gamma: figs2a_xi_over_gamma
    kappa_tilde: finite_kappa_test_added
    eta_s_over_eta_b: viscosity_ratio_main
    m: hill_m_main
  settings:
    N: 101
  outputs:
    vn_max_dimless: s2a_k025_vn_max_corrected_pred
    vs_max_dimless: s2a_k025_vs_max_corrected_pred
    vn_pole_dimless: s2a_k025_vn_pole_corrected_pred
    p_dimless: s2a_k025_p_corrected_pred

- id: run_conv_s2a_kappa0
  model: sphere_spatial_convergence_s2a
  inputs:
    e: figs2a_eccentricity
    V_over_R03: sphere_vol_dimless
    xi_over_gamma: figs2a_xi_over_gamma
    kappa_tilde: figs2a_kappa_tilde
    eta_s_over_eta_b: viscosity_ratio_main
    m: hill_m_main
  settings:
    N_base: 51
    N_ref: 801
  outputs:
    order_vn: s2a_order_vn_pred
    order_vs: s2a_order_vs_pred
  note: "Uses N_ref = 801 instead of the paper's 3201 for speed; nested N = 51, 101, 201 already isolate the O(N^-4) slope accurately."

- id: run_conv_s2a_kappa025_printed
  model: sphere_spatial_convergence_s2a
  inputs:
    e: figs2a_eccentricity
    V_over_R03: sphere_vol_dimless
    xi_over_gamma: figs2a_xi_over_gamma
    kappa_tilde: finite_kappa_test_added
    eta_s_over_eta_b: viscosity_ratio_main
    m: hill_m_main
  settings:
    N_base: 51
    N_ref: 801
  outputs:
    order_vn: s2a_k025_order_vn_printed_pred
    order_vs: s2a_k025_order_vs_printed_pred

- id: run_conv_s2a_kappa025_corrected
  model: sphere_spatial_convergence_s2a_corrected
  inputs:
    e: figs2a_eccentricity
    V_over_R03: sphere_vol_dimless
    xi_over_gamma: figs2a_xi_over_gamma
    kappa_tilde: finite_kappa_test_added
    eta_s_over_eta_b: viscosity_ratio_main
    m: hill_m_main
  settings:
    N_base: 51
    N_ref: 801
  outputs:
    order_vn: s2a_k025_order_vn_corrected_pred
    order_vs: s2a_k025_order_vs_corrected_pred

- id: run_conv_s2b
  model: tube_temporal_convergence_s2b
  inputs:
    L_over_2pi_r0: figs2b_L_over_2pi_r0
    xi_over_gamma: figs2b_xi_over_gamma
    kappa_tilde: figs2b_kappa_tilde
    eta_s_over_eta_b: viscosity_ratio_main
    t_end_tilde: figs2b_conv_time_added
  settings:
    N: 25
    Nt_base: 50
    Nt_ref: 1600
  outputs:
    order_Css: s2b_order_Css_pred
    order_Cphi: s2b_order_Cphi_pred
  note: "Uses Nt_ref = 1600 over t/tau = 0.2 instead of the paper's 3.2e5 (full stationary convergence) to verify explicit-Euler O(Nt^-1) convergence in under 2 seconds."

- id: run_pde_fig2b
  model: sphere_active_surface_pde
  inputs:
    e_init: sphere_zero_eccentricity
    V_over_R03: sphere_vol_dimless
    xi_over_gamma: fig2b_xi_over_gamma
    kappa_tilde: fig2b_kappa_tilde
