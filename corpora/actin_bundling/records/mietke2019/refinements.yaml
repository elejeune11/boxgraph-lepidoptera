# Numerical refinement series for every numerical/PDE solver in mietke2019

- id: ref_sphere_hydro_N
  run: run_sphere_hydro_s2a
  setting: N
  factors: [1, 2, 4]
  mode: multiply
  output: vn_max_dimless
  tolerance: "0.1%"
  tolerance_basis: "added: tight single-step accuracy benchmark matching Fig. S2A's O(N^-4) spatial discretization"
  tolerance_added: true

- id: ref_fig2b_N
  run: run_pde_fig2b
  setting: N
  factors: [1, 1.16, 1.33]
  mode: multiply
  output: c_pole_dimless
  tolerance: "1%"
  tolerance_basis: "added: below visual resolution of Fig. 2B steady-state concentration profile (c_tilde ~ 20)"
  tolerance_added: true

- id: ref_fig2b_rtol
  run: run_pde_fig2b
  setting: rtol
  factors: [1, 10]
  mode: divide
  output: c_pole_dimless
  tolerance: "0.5%"
  tolerance_basis: "added: confirms BDF temporal integration has converged well below spatial discretization error"
  tolerance_added: true

- id: ref_fig2c_N
  run: run_pde_fig2c
  setting: N
  factors: [1, 1.5, 2]
  mode: multiply
  output: c_pole_dimless
  tolerance: "0.5%"
  tolerance_basis: "added: well below the Fig. 2C color-bar dynamic range (0.95 to 1.1)"
  tolerance_added: true

- id: ref_figs2c_N
  run: run_pde_figs2c
  setting: N
  factors: [1, 1.5, 2]
  mode: multiply
  output: volume_ratio
  tolerance: "0.1%"
  tolerance_basis: "added: matches Fig. S2C's 10^-4 volume-conservation scale"
  tolerance_added: true

- id: ref_fig3d_N
  run: run_pde_fig3d
  setting: N
  factors: [1, 1.18, 1.36]
  mode: multiply
  output: wave_speed_dimless
  tolerance: "1%"
  tolerance_basis: "added: verifies spectral spatial convergence of the Fig. 3D steady peristaltic wave speed"
  tolerance_added: true

- id: ref_fig3c_N
  run: run_pde_fig3c
  setting: N
  factors: [1, 1.5, 2]
  mode: multiply
  output: c_max_dimless
  tolerance: "0.5%"
  tolerance_basis: "added: verifies spectral spatial convergence of the Fig. 3C oscillatory concentration peak"
  tolerance_added: true

- id: ref_fig3a_scan
  run: run_cyl_stab_fig3a_k025_a3
  setting: n_scan
  factors: [1, 2, 4]
  mode: multiply
  output: L_crit_over_2pi_r0
  tolerance: "0.01%"
  tolerance_basis: "added: verifies root-bracketing scan density does not affect Fig. 3A stability boundary"
  tolerance_added: true
