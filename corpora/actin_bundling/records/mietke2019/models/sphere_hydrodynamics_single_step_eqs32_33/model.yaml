id: sphere_hydrodynamics_single_step_eqs32_33
name: single-step axisymmetric hydrodynamic solver on a prolate spheroid (Eqs. S32-S33, S41)
role: model
stated:
  page: 10
  printed_page: "SI-4"
  quote: "hydrodynamic equations for the active fluid film on axisymmetric surfaces"
  where: "Eqs. (S32), (S33), (S41), (S54), (S59) / Fig. S2A"
equation: "4th-order centered FD discretization of Eqs. (S32), (S33), volume constraint Eq. (S59), and pole Eq. (S41) as printed (-8*kappa*d_s^2 C_s^s)"
inputs:
  e:
    quantity: spheroid_eccentricity
    unit: dimensionless
  V_over_R03:
    quantity: dimensionless_enclosed_volume
    unit: dimensionless
  xi_over_gamma:
    quantity: dimensionless_active_contractility
    unit: dimensionless
  kappa_tilde:
    quantity: dimensionless_bending_rigidity
    unit: dimensionless
  eta_s_over_eta_b:
    quantity: surface_viscosity_ratio
    unit: dimensionless
  m:
    quantity: hill_coefficient
    unit: dimensionless
outputs:
  vn_max_dimless:
    quantity: dimensionless_velocity
    unit: dimensionless
  vs_max_dimless:
    quantity: dimensionless_velocity
    unit: dimensionless
  vn_pole_dimless:
    quantity: dimensionless_velocity
    unit: dimensionless
  p_dimless:
    quantity: dimensionless_pressure
    unit: dimensionless
settings:
  N: 101
stochastic: false
