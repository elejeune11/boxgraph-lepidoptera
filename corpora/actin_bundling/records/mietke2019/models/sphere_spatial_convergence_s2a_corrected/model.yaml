id: sphere_spatial_convergence_s2a_corrected
name: spatial grid convergence order of single-step spherical solver (Eq. S41 corrected)
role: model
variant_of: sphere_spatial_convergence_s2a
corrections:
  - equation: "Eq. (S41)"
    change: "Use exact pole bending coefficient -(16/3)*kappa*d_s^2 C_s^s instead of printed -8*kappa*d_s^2 C_s^s"
    evidence: "At nonzero bending rigidity (e.g. kappa_tilde = 0.25 on the Fig. S2A prolate spheroid e = 0.6), printed Eq. (S41) creates a persistent O(1) discontinuity in vn at the poles and yields negative convergence order, whereas -(16/3) restores the claimed O(N^-4) fourth-order convergence."
stated:
  page: 17
  printed_page: "SI-11"
  quote: "Figure S2 A shows the corresponding behaviour of the maximum error norm"
  where: "Sec. 3.2 / Fig. S2A"
equation: "||f - f^h||_inf ~ N^(-p_N) using corrected Eq. (S41) pole bending coefficient -(16/3)*kappa*d_s^2 C_s^s"
inputs:
  e:
    quantity: spheroid_eccentricity
    unit: dimensionless
  V_over_R03:
    quantity: dimensionless_enclosed_volume
    unit: dimensionless
  xi_over_gamma:
    quantity: dimensionless_active_contractility
    unit: dimensionless
  kappa_tilde:
    quantity: dimensionless_bending_rigidity
    unit: dimensionless
  eta_s_over_eta_b:
    quantity: surface_viscosity_ratio
    unit: dimensionless
  m:
    quantity: hill_coefficient
    unit: dimensionless
outputs:
  order_vn:
    quantity: convergence_order
    unit: dimensionless
  order_vs:
    quantity: convergence_order
    unit: dimensionless
settings:
  N_base: 51
  N_ref: 801
stochastic: false
built_from:
  - sphere_spatial_convergence_s2a
  - sphere_hydrodynamics_single_step_eqs32_33_corrected
