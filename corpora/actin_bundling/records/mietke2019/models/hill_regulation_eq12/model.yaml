id: hill_regulation_eq12
name: Hill active-tension regulation function and sensitivity at c0 (Eq. 12)
role: model
stated:
  page: 3
  printed_page: "31"
  quote: "regulation is represented by a saturating Hill function"
  where: "Eq. 12 / Table S1"
equation: "f(c) = c^m / (c0^m + c^m); c0 * d_c f(c0) = m / 4"
inputs:
  c:
    quantity: regulator_concentration
    unit: dimensionless
  c0:
    quantity: preferred_regulator_concentration
    unit: dimensionless
  m:
    quantity: hill_coefficient
    unit: dimensionless
outputs:
  f:
    quantity: active_tension_regulation_factor
    unit: dimensionless
  c0_df_dc0:
    quantity: hill_sensitivity_at_c0
    unit: dimensionless
settings: {}
stochastic: false
