id: tube_active_surface_pde
name: nonlinear axisymmetric periodic tubular active surface PDE (Eqs. 12-24, S32-S34, S46, S48-S53, S59)
role: model
stated:
  page: 5
  printed_page: "33"
  quote: "We also study the surface dynamics beyond the linear regime,"
  where: "Eqs. (12)-(24), SI Eqs. (S32)-(S34), (S46), (S48)-(S53), (S59) / Figs. 3B, 3C, 3D"
equation: "Coupled periodic axisymmetric Stokes surface hydrodynamics and dynamic Eulerian geometry/concentration PDE on a volume-conserving tubular surface"
