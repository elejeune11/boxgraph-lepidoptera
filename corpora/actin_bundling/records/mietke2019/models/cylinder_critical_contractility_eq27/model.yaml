id: cylinder_critical_contractility_eq27
name: critical contractility threshold for cylindrical active surface (Eq. 27)
role: model
stated:
  page: 4
  printed_page: "32"
  quote: "For α < αc∗ with"
  where: "Eq. 27"
equation: "alpha_c_star = (eta_b / gamma) * (D / r0^2 + k)"
inputs:
  eta_b:
    quantity: bulk_surface_viscosity
    unit: pN*s/um
  gamma:
    quantity: surface_tension
    unit: pN/um
  D:
    quantity: surface_diffusion_coefficient
    unit: um^2/s
  r0:
    quantity: cylinder_radius
    unit: um
  k:
    quantity: regulator_turnover_rate
    unit: 1/s
outputs:
  alpha_c_star:
    quantity: dimensionless_contractility_parameter
    unit: dimensionless
settings: {}
stochastic: false
