id: sphere_active_surface_arc_profiles
name: spatial profiles along normalized arc length s/L from spherical active surface PDE (Figs. 2B, S1C)
role: model
stated:
  page: 4
  printed_page: "32"
  quote: "concentration c̃ = c/c0 , in-plane flow"
  where: "Fig. 2B (Right) / Fig. S1C / Eqs. (12)-(24), SI Eqs. (S32)-(S59)"
equation: "Resampled steady or transient axisymmetric spherical profiles (c, v_s, v_n, C_s^s, C_phi^phi)(s/L)"
inputs:
  e_init:
    quantity: spheroid_eccentricity
    unit: dimensionless
  V_over_R03:
    quantity: dimensionless_enclosed_volume
    unit: dimensionless
  xi_over_gamma:
    quantity: dimensionless_active_contractility
    unit: dimensionless
  kappa_tilde:
    quantity: dimensionless_bending_rigidity
    unit: dimensionless
  D_tilde:
    quantity: dimensionless_diffusivity
    unit: dimensionless
  k_tilde:
    quantity: dimensionless_turnover_rate
    unit: dimensionless
  eta_s_over_eta_b:
    quantity: surface_viscosity_ratio
    unit: dimensionless
  m:
    quantity: hill_coefficient
    unit: dimensionless
  pert_amp:
    quantity: perturbation_amplitude
    unit: dimensionless
  t_end_tilde:
    quantity: dimensionless_time
    unit: dimensionless
  c_init_dimless:
    quantity: regulator_concentration
    unit: dimensionless
  sample_curve:
    quantity: dimensionless_velocity
    unit: dimensionless
    curve:
      quantity: normalized_arc_length
      unit: dimensionless
outputs:
  c_profile:
    quantity: regulator_concentration
    unit: dimensionless
    curve:
      quantity: normalized_arc_length
      unit: dimensionless
  vs_profile:
    quantity: dimensionless_velocity
    unit: dimensionless
    curve:
      quantity: normalized_arc_length
      unit: dimensionless
  vn_profile:
    quantity: dimensionless_velocity
    unit: dimensionless
    curve:
      quantity: normalized_arc_length
      unit: dimensionless
  Css_profile:
    quantity: dimensionless_curvature
    unit: dimensionless
    curve:
      quantity: normalized_arc_length
      unit: dimensionless
  Cphi_profile:
    quantity: dimensionless_curvature
    unit: dimensionless
    curve:
      quantity: normalized_arc_length
      unit: dimensionless
settings:
  N: 61
  rtol: 1.0e-5
  atol: 1.0e-7
stochastic: false
built_from:
  - sphere_active_surface_pde
  - sphere_hydrodynamics_single_step_eqs32_33
