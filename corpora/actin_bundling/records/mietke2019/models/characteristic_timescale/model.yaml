id: characteristic_timescale
name: viscocapillary characteristic timescale tau = eta_b / gamma
role: model
stated:
  page: 18
  printed_page: "SI-12"
  quote: "characteristic time-scale is given by τ = ηb /γ"
  where: "Table S1 / Fig. 2B caption"
equation: "tau = eta_b / gamma"
inputs:
  eta_b:
    quantity: bulk_surface_viscosity
    unit: pN*s/um
  gamma:
    quantity: surface_tension
    unit: pN/um
outputs:
  tau:
    quantity: characteristic_viscocapillary_timescale
    unit: s
settings: {}
stochastic: false
