id: plateau_rayleigh_growth_rate_eqs83
name: passive zero-bending Plateau-Rayleigh growth rate on a cylinder (Eq. S83)
role: model
stated:
  page: 21
  printed_page: "SI-15"
  quote: "For a passive tubular surface (ξ = 0) without bending"
  where: "Eqs. (S80), (S83)"
described_from: ref-35
equation: "lambda_PR_tilde = ((eta_s_over_eta_b + 1) / (4 * eta_s_over_eta_b)) * (1 - (n / L_over_2pi_r0)^2)"
inputs:
  L_over_2pi_r0:
    quantity: dimensionless_tube_aspect_ratio
    unit: dimensionless
  n_mode:
    quantity: axial_mode_number
    unit: dimensionless
  eta_s_over_eta_b:
    quantity: surface_viscosity_ratio
    unit: dimensionless
outputs:
  max_re_lambda_tilde:
    quantity: dimensionless_growth_rate
    unit: dimensionless
settings: {}
stochastic: false
