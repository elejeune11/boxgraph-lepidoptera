id: sphere_mode_l_stability_eqs69_71_s70_s71_corrected
name: spherical harmonic mode-l linear stability (Eq. S70 bending 2*kappa and Eq. S71 R0^-2 corrected)
role: model
variant_of: sphere_mode_l_stability_eqs69_71
corrections:
  - equation: "Eq. (S70)"
    change: "Replace (kappa/R0^2)*l*(l+1) with (2*kappa/R0^2)*l*(l+1)"
    evidence: "Under Eq. (5) F_H = int dA [gamma + kappa*(C_k^k)^2] (where kappa = kappa_H/2), the normal force balance Eq. (S33) carries -2*kappa*Delta_Gamma C_k^k; linearizing around a sphere R = R0 + delta_R_l*Y_l yields +(2*kappa/R0^4)*l*(l+1)*(l-1)*(l+2)*delta_R_l, i.e., (2*kappa/R0^2)*l*(l+1) in Eq. (S70) (verified symbolically and numerically against Eq. S33: l=2 decay rate at kappa_tilde=0.5, xi=0 is -17.500 vs printed Eq. S70's -10.000)."
  - equation: "Eq. (S71)"
    change: "Replace [R0^2 * D * l*(l+1) + k] with [D * l*(l+1) / R0^2 + k]"
    evidence: "Dimensional consistency requires D/R0^2 (1/[time]) to add to k (1/[time]), whereas R0^2*D has dimension [length]^4/[time]; Eq. (S72) on the same page (p. 19) prints -2D/R0^2 - k for l=1, and Eq. (26) (p. 4) prints 2D/R0^2 + k."
stated:
  page: 19
  printed_page: "SI-13"
  quote: "linearisation of the force balance equations and the dynamic equation"
  where: "Eqs. (S69)-(S71)"
equation: "Eqs. (S69)-(S71) with corrected (2*kappa/R0^2)*l*(l+1) in Eq. (S70) and [D * l*(l+1) / R0^2 + k] in Eq. (S71)"
inputs:
  l:
    quantity: spherical_harmonic_degree
    unit: dimensionless
  eta_s:
    quantity: shear_surface_viscosity
    unit: pN*s/um
  eta_b:
    quantity: bulk_surface_viscosity
    unit: pN*s/um
  gamma:
    quantity: surface_tension
    unit: pN/um
  xi:
    quantity: active_contractility
    unit: pN/um
  f_c0:
    quantity: active_tension_regulation_factor
    unit: dimensionless
  c0_df_dc0:
    quantity: hill_sensitivity_at_c0
    unit: dimensionless
  kappa:
    quantity: bending_rigidity
    unit: pN*um
  R0:
    quantity: sphere_radius
    unit: um
  D:
    quantity: surface_diffusion_coefficient
    unit: um^2/s
  k:
    quantity: regulator_turnover_rate
    unit: 1/s
outputs:
  max_re_lambda:
    quantity: growth_rate
    unit: 1/s
  im_lambda:
    quantity: oscillation_frequency
    unit: 1/s
settings: {}
stochastic: false
