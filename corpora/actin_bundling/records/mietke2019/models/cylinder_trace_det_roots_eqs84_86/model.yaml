id: cylinder_trace_det_roots_eqs84_86
name: analytical trace and determinant zero roots for zero-bending cylinder (Eqs. S84-S86)
role: model
stated:
  page: 21
  printed_page: "SI-15"
  quote: "The condition Tr(J) = 0 defines the critical wavenumber"
  where: "Eqs. (S84)-(S86)"
equation: "k_tilde_c = sqrt((alpha - k_tilde + nu_bar*(1 + xi_f0_over_gamma)) / (D_tilde + nu_bar*(1 + xi_f0_over_gamma))); k_tilde_1 = 1; k_tilde_2 = sqrt((alpha - (1 + eta_s_over_eta_b)*k_tilde) / ((1 + eta_s_over_eta_b)*D_tilde))"
inputs:
  alpha:
    quantity: dimensionless_contractility_parameter
    unit: dimensionless
  xi_f0_over_gamma:
    quantity: dimensionless_homogeneous_active_tension
    unit: dimensionless
  D_tilde:
    quantity: dimensionless_diffusivity
    unit: dimensionless
  k_tilde:
    quantity: dimensionless_turnover_rate
    unit: dimensionless
  nu_bar:
    quantity: viscosity_parameter
    unit: dimensionless
  eta_s_over_eta_b:
    quantity: surface_viscosity_ratio
    unit: dimensionless
outputs:
  k_tilde_trace_zero:
    quantity: dimensionless_wavenumber
    unit: dimensionless
  k_tilde_det_root1:
    quantity: dimensionless_wavenumber
    unit: dimensionless
  k_tilde_det_root2:
    quantity: dimensionless_wavenumber
    unit: dimensionless
  L_crit_over_2pi_r0:
    quantity: dimensionless_tube_aspect_ratio
    unit: dimensionless
settings: {}
stochastic: false
