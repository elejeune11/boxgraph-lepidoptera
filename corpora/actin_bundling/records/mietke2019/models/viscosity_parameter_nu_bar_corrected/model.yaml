id: viscosity_parameter_nu_bar_corrected
name: cylindrical linear-stability viscosity parameter nu_bar (division slash corrected)
role: model
variant_of: viscosity_parameter_nu_bar
corrections:
  - equation: "SI Sec. 4.2 (p. 21, inline definition of nu_bar)"
    change: "Replace (eta_s + eta_b)*(4*eta_s) with (eta_s + eta_b)/(4*eta_s)"
    evidence: "In Eq. (S80) the Jacobian entry J11 carries (eta_s + eta_b)/(4*eta_s*eta_b) = nu_bar/eta_b; Eq. (S84) adds nu_bar*[gamma + xi*f(c0)] to alpha*gamma requiring nu_bar to be dimensionless; and the stated lower bound nu_bar > 1/4 holds identically for (eta_s + eta_b)/(4*eta_s) = 1/4 + eta_b/(4*eta_s) but fails for (eta_s + eta_b)*(4*eta_s) when viscosities are small."
stated:
  page: 21
  printed_page: "SI-15"
  quote: "and a viscosity parameter ν̄ = (ηs + ηb )(4ηs ) > 1/4"
  where: "SI Sec. 4.2"
equation: "nu_bar = (eta_s + eta_b) / (4 * eta_s)"
inputs:
  eta_s:
    quantity: shear_surface_viscosity
    unit: pN*s/um
  eta_b:
    quantity: bulk_surface_viscosity
    unit: pN*s/um
outputs:
  nu_bar:
    quantity: viscosity_parameter
    unit: dimensionless
settings: {}
stochastic: false
