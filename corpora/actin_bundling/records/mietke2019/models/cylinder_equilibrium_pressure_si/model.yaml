id: cylinder_equilibrium_pressure_si
name: homogeneous cylindrical steady-state internal pressure (SI Sec. 4.2)
role: model
stated:
  page: 20
  printed_page: "SI-14"
  quote: "The internal pressure is given by pc0 = (γ + ξf (c0 ) − κr0−2 )/r0"
  where: "SI Sec. 4.2"
equation: "p0_c = (gamma + xi * f_c0 - kappa / r0^2) / r0"
inputs:
  gamma:
    quantity: surface_tension
    unit: pN/um
  xi:
    quantity: active_contractility
    unit: pN/um
  f_c0:
    quantity: active_tension_regulation_factor
    unit: dimensionless
  kappa:
    quantity: bending_rigidity
    unit: pN*um
  r0:
    quantity: cylinder_radius
    unit: um
outputs:
  p0_c:
    quantity: internal_pressure
    unit: Pa
settings: {}
stochastic: false
