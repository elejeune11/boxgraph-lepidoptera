id: tube_active_surface_arc_profiles
name: spatial profiles along normalized arc length s/L from periodic tubular active surface PDE (Fig. 3D)
role: model
stated:
  page: 5
  printed_page: "33"
  quote: "Steady state of directed surface flows relative to a constricted shape"
  where: "Fig. 3D / Eqs. (12)-(24), SI Eqs. (S32)-(S59)"
equation: "Periodic steady peristaltic wave profiles (c, v_s, C_s^s, C_phi^phi)(s/L) aligned to concentration peak s_peak/L"
inputs:
  L_over_2pi_r0:
    quantity: dimensionless_tube_aspect_ratio
    unit: dimensionless
  xi_over_gamma:
    quantity: dimensionless_active_contractility
    unit: dimensionless
  kappa_tilde:
    quantity: dimensionless_bending_rigidity
    unit: dimensionless
  D_tilde:
    quantity: dimensionless_diffusivity
    unit: dimensionless
  k_tilde:
    quantity: dimensionless_turnover_rate
    unit: dimensionless
  eta_s_over_eta_b:
    quantity: surface_viscosity_ratio
    unit: dimensionless
  m:
    quantity: hill_coefficient
    unit: dimensionless
  pert_amp:
    quantity: perturbation_amplitude
    unit: dimensionless
  t_end_tilde:
    quantity: dimensionless_time
    unit: dimensionless
  c_peak_s_over_L:
    quantity: normalized_arc_length
    unit: dimensionless
  sample_curve:
    quantity: regulator_concentration
    unit: dimensionless
    curve:
      quantity: normalized_arc_length
      unit: dimensionless
outputs:
  c_profile:
    quantity: regulator_concentration
    unit: dimensionless
    curve:
      quantity: normalized_arc_length
      unit: dimensionless
  vs_profile:
    quantity: dimensionless_velocity
    unit: dimensionless
    curve:
      quantity: normalized_arc_length
      unit: dimensionless
  Css_profile:
    quantity: dimensionless_curvature
    unit: dimensionless
    curve:
      quantity: normalized_arc_length
      unit: dimensionless
  Cphi_profile:
    quantity: dimensionless_curvature
    unit: dimensionless
    curve:
      quantity: normalized_arc_length
      unit: dimensionless
settings:
  N: 45
  rtol: 1.0e-5
  atol: 1.0e-7
  asym_pert: 0.02
stochastic: false
built_from:
  - tube_active_surface_pde
