id: sphere_polar_growth_rate_eqs72
name: polar l=1 perturbation growth rate on a contractile sphere (Eq. S72)
role: model
stated:
  page: 19
  printed_page: "SI-13"
  quote: "dynamic equation of the concentration field, this yields"
  where: "Eq. (S72)"
equation: "lambda_1 = -2 * D / R0^2 - k + (xi / eta_b) * c0_df_dc0"
inputs:
  D:
    quantity: surface_diffusion_coefficient
    unit: um^2/s
  R0:
    quantity: sphere_radius
    unit: um
  k:
    quantity: regulator_turnover_rate
    unit: 1/s
  xi:
    quantity: active_contractility
    unit: pN/um
  eta_b:
    quantity: bulk_surface_viscosity
    unit: pN*s/um
  c0_df_dc0:
    quantity: hill_sensitivity_at_c0
    unit: dimensionless
outputs:
  lambda_1:
    quantity: growth_rate
    unit: 1/s
settings: {}
stochastic: false
