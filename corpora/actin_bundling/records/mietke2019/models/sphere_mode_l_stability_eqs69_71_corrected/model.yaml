id: sphere_mode_l_stability_eqs69_71_corrected
name: spherical harmonic mode-l linear stability (Eq. S71 diffusion R0^-2 corrected)
role: model
variant_of: sphere_mode_l_stability_eqs69_71
corrections:
  - equation: "Eq. (S71)"
    change: "Replace [R0^2 * D * l*(l+1) + k] with [D * l*(l+1) / R0^2 + k]"
    evidence: "Dimensional consistency requires D/R0^2 (1/[time]) to add to k (1/[time]), whereas R0^2*D has dimension [length]^4/[time]; Eq. (S72) on the same page (p. 19) prints -2D/R0^2 - k for l=1, and Eq. (26) (p. 4) prints 2D/R0^2 + k."
stated:
  page: 19
  printed_page: "SI-13"
  quote: "linearisation of the force balance equations and the dynamic equation"
  where: "Eqs. (S69)-(S71)"
equation: "Eqs. (S69)-(S71) with corrected [D * l*(l+1) / R0^2 + k] in Eq. (S71)"
inputs:
  l:
    quantity: spherical_harmonic_degree
    unit: dimensionless
  eta_s:
    quantity: shear_surface_viscosity
    unit: pN*s/um
  eta_b:
    quantity: bulk_surface_viscosity
    unit: pN*s/um
  gamma:
    quantity: surface_tension
    unit: pN/um
  xi:
    quantity: active_contractility
    unit: pN/um
  f_c0:
    quantity: active_tension_regulation_factor
    unit: dimensionless
  c0_df_dc0:
    quantity: hill_sensitivity_at_c0
    unit: dimensionless
  kappa:
    quantity: bending_rigidity
    unit: pN*um
  R0:
    quantity: sphere_radius
    unit: um
  D:
    quantity: surface_diffusion_coefficient
    unit: um^2/s
  k:
    quantity: regulator_turnover_rate
    unit: 1/s
outputs:
  max_re_lambda:
    quantity: growth_rate
    unit: 1/s
  im_lambda:
    quantity: oscillation_frequency
    unit: 1/s
settings: {}
stochastic: false
built_from:
  - sphere_mode_l_stability_eqs69_71
