id: sphere_equilibrium_pressure_si
name: homogeneous spherical steady-state internal pressure (SI Sec. 4.1)
role: model
stated:
  page: 19
  printed_page: "SI-13"
  quote: "The internal pressure is given by ps0 = 2[γ + ξf (c0 )]/R0"
  where: "SI Sec. 4.1"
equation: "p0_s = 2 * (gamma + xi * f_c0) / R0"
inputs:
  gamma:
    quantity: surface_tension
    unit: pN/um
  xi:
    quantity: active_contractility
    unit: pN/um
  f_c0:
    quantity: active_tension_regulation_factor
    unit: dimensionless
  R0:
    quantity: sphere_radius
    unit: um
outputs:
  p0_s:
    quantity: internal_pressure
    unit: Pa
settings: {}
stochastic: false
