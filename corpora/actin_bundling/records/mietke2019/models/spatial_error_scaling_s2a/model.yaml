id: spatial_error_scaling_s2a
name: fourth-order spatial error scaling law (Fig. S2A)
role: model
stated:
  page: 17
  printed_page: "SI-11"
  quote: "confirming fourth-order convergence"
  where: "Sec. 3.2 / Fig. S2A"
equation: "||f - f^h||_inf ~ N^(-4)"
prefactor: unknown
inputs:
