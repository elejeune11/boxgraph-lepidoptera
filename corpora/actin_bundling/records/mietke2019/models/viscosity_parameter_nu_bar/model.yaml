id: viscosity_parameter_nu_bar
name: cylindrical linear-stability viscosity parameter nu_bar as printed (SI Sec. 4.2)
role: model
stated:
  page: 21
  printed_page: "SI-15"
  quote: "and a viscosity parameter ν̄ = (ηs + ηb )(4ηs ) > 1/4"
  where: "SI Sec. 4.2"
equation: "nu_bar = (eta_s + eta_b) * (4 * eta_s)"
inputs:
  eta_s:
    quantity: shear_surface_viscosity
    unit: pN*s/um
  eta_b:
    quantity: bulk_surface_viscosity
    unit: pN*s/um
outputs:
  nu_bar:
    quantity: viscosity_parameter
    unit: dimensionless
settings: {}
stochastic: false
