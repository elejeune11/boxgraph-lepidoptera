id: prolate_spheroid_geometry
name: volume-preserving prolate spheroid semi-axes and principal curvatures
role: model
from_words: true
stated:
  page: 4
  printed_page: "32"
  quote: "starting with a spheroidal shape with eccentricity 0.75"
  where: "Fig. 2C caption / Table S1"
equation: "a/R0 = (3*V/(4*pi*R0^3))^(1/3)*(1-e^2)^(1/6); b/R0 = (3*V/(4*pi*R0^3))^(1/3)*(1-e^2)^(-1/3); Css_pole = b/a^2; Css_eq = a/b^2; Cphi_eq = 1/a"
inputs:
  e:
    quantity: spheroid_eccentricity
    unit: dimensionless
  V_over_R03:
    quantity: dimensionless_enclosed_volume
    unit: dimensionless
outputs:
  a_over_R0:
    quantity: dimensionless_semi_axis
    unit: dimensionless
  b_over_R0:
    quantity: dimensionless_semi_axis
    unit: dimensionless
  Css_pole_dimless:
    quantity: dimensionless_curvature
    unit: dimensionless
  Css_eq_dimless:
    quantity: dimensionless_curvature
    unit: dimensionless
  Cphi_eq_dimless:
    quantity: dimensionless_curvature
    unit: dimensionless
settings: {}
stochastic: false
