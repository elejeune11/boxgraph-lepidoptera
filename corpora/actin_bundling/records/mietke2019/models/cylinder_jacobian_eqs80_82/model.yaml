id: cylinder_jacobian_eqs80_82
name: linear stability Jacobian and eigenvalues of a deforming active cylinder (Eqs. S80-S82)
role: model
stated:
  page: 21
  printed_page: "SI-15"
  quote: "Equations (S80) and (S81) define a Jacobian J(kn ) for each mode"
  where: "Eqs. (S80)-(S82) / Fig. 3A"
equation: "J11*tau = ((eta_s+eta_b)/(4*eta_s))*[-kappa_tilde*(2*k^4-k^2+3) + (1+xi_f0_over_gamma)*(1-k^2)]; J12*tau = -alpha/2; J21*tau = (1/2)*[kappa_tilde*(2*k^4-k^2+3) - (1+xi_f0_over_gamma)*(1-k^2)]; J22*tau = alpha - D_tilde*k^2 - k_tilde"
inputs:
  L_over_2pi_r0:
    quantity: dimensionless_tube_aspect_ratio
    unit: dimensionless
  n_mode:
    quantity: axial_mode_number
    unit: dimensionless
  alpha:
    quantity: dimensionless_contractility_parameter
    unit: dimensionless
  xi_f0_over_gamma:
    quantity: dimensionless_homogeneous_active_tension
    unit: dimensionless
  kappa_tilde:
    quantity: dimensionless_bending_rigidity
    unit: dimensionless
  D_tilde:
    quantity: dimensionless_diffusivity
    unit: dimensionless
  k_tilde:
    quantity: dimensionless_turnover_rate
    unit: dimensionless
  eta_s_over_eta_b:
    quantity: surface_viscosity_ratio
    unit: dimensionless
outputs:
  max_re_lambda_tilde:
    quantity: dimensionless_growth_rate
    unit: dimensionless
  im_lambda_tilde:
    quantity: dimensionless_oscillation_frequency
    unit: dimensionless
  oscillation_period_tilde:
    quantity: dimensionless_oscillation_period
    unit: dimensionless
  tr_tilde:
    quantity: dimensionless_jacobian_trace
    unit: dimensionless
  det_tilde:
    quantity: dimensionless_jacobian_determinant
    unit: dimensionless
settings: {}
stochastic: false
