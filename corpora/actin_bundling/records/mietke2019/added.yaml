# Unstated inputs needed to evaluate dimensional equations and initialize PDE simulations
# in Mietke, Jülicher & Sbalzarini (2019). Every item includes plausible alternatives.

# --- Physical scale choices for evaluating dimensional formulas Eqs. (26), (27), (S69)-(S72), (S79), nu_bar ---
# The paper states all simulation parameters in dimensionless groups (Table S1) and never assigns
# dimensional units; typical actomyosin cortex scales (gamma ~ 100-1000 pN/um, R0 ~ 10 um,
# tau ~ 1-10 s) are used here to exercise the dimensional formulas and expose dimensional misprints.

- id: phys_gamma_added
  quantity: surface_tension
  unit: pN/um
  printed: "100"
  basis: "Paper nondimensionalizes tensions by gamma (Table S1) without giving a physical value; 100 pN/um (0.1 mN/m) is typical of cell cortex tension."
  alternatives: ["1000", "1"]
  stands_for: "gamma in Eqs. (26), (27), (S69)-(S72), and equilibrium pressures p0^s, p0^c"

- id: phys_eta_b_added
  quantity: bulk_surface_viscosity
  unit: pN*s/um
  printed: "1000"
  basis: "Chosen with gamma = 100 pN/um to yield characteristic viscocapillary timescale tau = eta_b/gamma = 10 s, typical of cellular cortex turnover."
  alternatives: ["100", "1"]
  stands_for: "eta_b in Eqs. (26), (27), (S69)-(S72), and nu_bar"

- id: phys_eta_s_added
  quantity: shear_surface_viscosity
  unit: pN*s/um
  printed: "1000"
  basis: "Set equal to phys_eta_b_added to honor Table S1's stated ratio eta_s/eta_b = 1."
  alternatives: ["100", "1"]
  stands_for: "eta_s in Eqs. (S69)-(S72) and nu_bar"

- id: phys_eta_b_small_limit_added
  quantity: bulk_surface_viscosity
  unit: pN*s/um
  printed: "0.0001"
  basis: "Small bulk-to-shear viscosity limit (eta_b/eta_s = 1e-4 with eta_s = 1 pN*s/um) to probe the printed infimum nu_bar > 1/4 on SI p. 21."
  alternatives: ["0.001", "0.00001"]
  stands_for: "eta_b -> 0+ limit in nu_bar = (eta_s + eta_b)/(4*eta_s) > 1/4"

- id: phys_eta_s_unit_added
  quantity: shear_surface_viscosity
  unit: pN*s/um
  printed: "1"
  basis: "Unit shear viscosity paired with phys_eta_b_small_limit_added and phys_eta_b_unit_added to test the printed nu_bar = (eta_s + eta_b)(4*eta_s) > 1/4 misprint."
  alternatives: ["0.1", "10"]
  stands_for: "eta_s in nu_bar = (eta_s + eta_b)(4*eta_s) > 1/4"

- id: phys_eta_b_unit_added
  quantity: bulk_surface_viscosity
  unit: pN*s/um
  printed: "1"
  basis: "Unit bulk viscosity matching Table S1's eta_s/eta_b = 1 when paired with phys_eta_s_unit_added = 1 pN*s/um."
  alternatives: ["0.1", "10"]
  stands_for: "eta_b in nu_bar for equal viscosities eta_s = eta_b"

- id: phys_R0_added
  quantity: sphere_radius
  unit: um
  printed: "10"
  basis: "Paper nondimensionalizes lengths by sphere radius R0 without stating a physical radius; 10 um is a standard eukaryotic cell radius and exposes the R0^2 vs 1/R0^2 misprint in Eq. (S71)."
  alternatives: ["5", "20"]
  stands_for: "R0 in Eqs. (26), (S69)-(S72), and p0^s"

- id: phys_r0_added
  quantity: cylinder_radius
  unit: um
  printed: "5"
  basis: "Paper nondimensionalizes tubular lengths by cylinder radius r0 without stating a physical value; 5 um is representative of an epithelial tube."
  alternatives: ["1", "10"]
  stands_for: "r0 in Eqs. (27), (S76)-(S81), and p0^c"

- id: phys_D_fig2b_added
  quantity: surface_diffusion_coefficient
  unit: um^2/s
  printed: "3"
  basis: "Derived from Table S1 Fig. 2B D*tau/R0^2 = 0.3 with R0 = 10 um and tau = 10 s: D = 0.3 * 100 / 10 = 3 um^2/s."
  alternatives: ["0.3", "30"]
  stands_for: "D in Eqs. (26) and (S71)-(S72) for Fig. 2B"

- id: phys_k_zero_added
  quantity: regulator_turnover_rate
  unit: 1/s
  printed: "0"
  basis: "From Table S1 Fig. 2B k*tau = 0 (no turnover/degradation)."
  alternatives: ["0.01", "0.1"]
  stands_for: "k in Eqs. (26) and (S71)-(S72) for Fig. 2B"

- id: phys_xi_threshold_fig2b_added
  quantity: active_contractility
  unit: pN/um
  printed: "120"
  basis: "Threshold active contractility xi^* = 2*alpha_s^* * gamma = 2 * 0.6 * 100 = 120 pN/um (for m = 2, D*tau/R0^2 = 0.3, k*tau = 0) at which Eq. (S72) predicts lambda_1 = 0."
  alternatives: ["1000", "200"]
  stands_for: "xi at the spherical instability threshold alpha = alpha_s^* in Eqs. (S69)-(S72)"

- id: phys_xi_fig2b_added
  quantity: active_contractility
  unit: pN/um
  printed: "1000"
  basis: "From Table S1 Fig. 2B xi/gamma = 10 with gamma = 100 pN/um."
  alternatives: ["120", "1500"]
  stands_for: "xi in p0^s and Eqs. (S69)-(S72) for Fig. 2B"

- id: phys_kappa_zero_added
  quantity: bending_rigidity
  unit: pN*um
  printed: "0"
  basis: "From Table S1 Fig. 2B kappa/(gamma*R0^2) = 0."
  alternatives: ["2500", "1000"]
  stands_for: "kappa in Eq. (S70)"

- id: phys_kappa_fig3d_added
  quantity: bending_rigidity
  unit: pN*um
  printed: "625"
  basis: "From Table S1 Fig. 3D kappa/(gamma*r0^2) = 0.25 with gamma = 100 pN/um and r0 = 5 um."
  alternatives: ["0", "1250"]
  stands_for: "kappa in p0^c and Eq. (S79)"

- id: phys_D_fig3_added
  quantity: surface_diffusion_coefficient
  unit: um^2/s
  printed: "0.125"
  basis: "From Table S1 Fig. 3B-D D*tau/r0^2 = 0.05 with r0 = 5 um and tau = 10 s: D = 0.05 * 25 / 10 = 0.125 um^2/s."
  alternatives: ["0.05", "0.5"]
  stands_for: "D in Eq. (27) for Fig. 3"

- id: phys_k_fig3_added
  quantity: regulator_turnover_rate
  unit: 1/s
  printed: "0.195"
  basis: "From Table S1 Fig. 3B-D k*tau = 1.95 with tau = 10 s: k = 0.195 s^-1."
  alternatives: ["0.0975", "0.39"]
  stands_for: "k in Eq. (27) for Fig. 3"

- id: phys_kn_rayleigh_added
  quantity: wavenumber
  unit: 1/um
  printed: "0.2"
  basis: "Plateau-Rayleigh wavenumber k_n = 1/r0 = 0.2 um^-1 for r0 = 5 um (k_n*r0 = 1)."
  alternatives: ["0.1", "0.4"]
  stands_for: "k_n in Eq. (S79)"

# --- Unstated Fig. 3A parameter sweep protocol and simulation initial conditions ---

- id: fig3a_xi_f0_fixed_added
  quantity: dimensionless_homogeneous_active_tension
  unit: dimensionless
  printed: "3"
  basis: "Fig. 3A does not explicitly state how xi*f(c0)/gamma varies as alpha is swept. Holding xi*f(c0)/gamma = 3 (from Table S1 Fig. 3B-D: xi/gamma = 6, f(c0) = 1/2) reproduces the vertical kappa_tilde = 0.25 stability boundary at L0/(2*pi*r0) = 1.129 for alpha < 1.989 and every curve point in Fig. 3A."
  alternatives: ["0", "2", "4"]
  stands_for: "xi*f(c0)/gamma in Eqs. (S80)-(S81) when constructing Fig. 3A"

- id: pde_init_pert_small_added
  quantity: perturbation_amplitude
  unit: dimensionless
  printed: "0.05"
  basis: "Fig. 2B and Fig. 3B-D describe 'a small concentration perturbation' without stating its amplitude or profile; 0.05 seeds the unstable mode cleanly while staying in the linear onset regime."
  alternatives: ["0.01", "0.1"]
  stands_for: "Initial concentration perturbation amplitude delta_c/c0 for unstable sphere/tube PDEs"

- id: pde_init_pert_zero_added
  quantity: perturbation_amplitude
  unit: dimensionless
  printed: "0"
  basis: "Figs. 2C and S2C start from a spheroidal shape with homogeneous concentration c = c0 (zero concentration perturbation)."
  alternatives: ["0.001", "0.01"]
  stands_for: "Initial concentration perturbation amplitude delta_c/c0 for homogeneous spheroid relaxation"

- id: fig2b_steady_time_added
  quantity: dimensionless_time
  unit: dimensionless
  printed: "8"
  basis: "Fig. 2B shows the steady state (t -> infinity) without stating a final simulation time; t/tau = 8 reaches max|v_n| < 1e-5."
  alternatives: ["5", "12"]
  stands_for: "Integration horizon t/tau for Fig. 2B steady state"

- id: fig3c_sim_time_added
  quantity: dimensionless_time
  unit: dimensionless
  printed: "10"
  basis: "Fig. 3C shows snapshots over one oscillation period (t/tau = 0, 1.3, 4.5, 5.8) without stating the full simulation end time; t/tau = 10 spans more than one complete linear oscillation period (T/tau = 8.79)."
  alternatives: ["6", "15"]
  stands_for: "Integration horizon t/tau for Fig. 3C oscillatory cylinder"

- id: fig3d_steady_time_added
  quantity: dimensionless_time
  unit: dimensionless
  printed: "22"
  basis: "Fig. 3D shows the steady peristaltic travelling wave without stating a final simulation time; t/tau = 22 converges to residual max|v_n + v_0*cos(psi)| < 1e-5."
  alternatives: ["18", "30"]
  stands_for: "Integration horizon t/tau for Fig. 3D steady peristaltic wave"

- id: figs2b_conv_time_added
  quantity: dimensionless_time
  unit: dimensionless
  printed: "0.2"
  basis: "Fig. S2B does not state the fixed final time used for its explicit-Euler temporal convergence test; t/tau = 0.2 evolves nontrivial curvature deformation cleanly within the explicit stability window for testing O(Nt^-1) convergence."
  alternatives: ["0.1", "0.4"]
  stands_for: "Fixed final time point in Fig. S2B temporal convergence test"

- id: finite_kappa_test_added
  quantity: dimensionless_bending_rigidity
  unit: dimensionless
  printed: "0.25"
  basis: "Nonzero bending rigidity (matching Fig. 3A/3D kappa_tilde = 0.25) used to test the spherical pole bending term Eq. (S41), which is masked when kappa = 0 in all spherical runs of the paper."
  alternatives: ["0.1", "0.5"]
  stands_for: "kappa_tilde in Eq. (S41) pole bending convergence test"

# --- Added inputs for calibrated figure profile comparisons ---

- id: hill_m_1_hypothesis_added
  quantity: hill_coefficient
  unit: dimensionless
  printed: "1"
  basis: "Alternative Hill exponent m = 1 tested against digitized Fig. 2B profiles to quantitatively evaluate q_fig2b_hill_exponent_discrepancy alongside Table S1's stated m = 2."
  alternatives: ["2"]
  stands_for: "Alternative Hill coefficient m = 1 hypothesis in Eq. (12) for Fig. 2B"

- id: fig2b_steady_time_clean_added
  quantity: dimensionless_time
  unit: dimensionless
  printed: "5"
  basis: "Steady-state integration horizon t/tau = 5 for Fig. 2B profile extraction, where max|v_n| < 1e-3 prior to the centered-FD Nyquist drift observed at t/tau >= 8 (see q_sphere_pde_nyquist_drift_fig2b)."
  alternatives: ["4", "8"]
  stands_for: "Steady-state integration horizon t/tau for Fig. 2B spatial profiles"

- id: fig3d_c_peak_phase_added
  quantity: normalized_arc_length
  unit: dimensionless
  printed: "0.506"
  basis: "Periodic phase origin placing the concentration maximum c_max at s/L = 0.506 as plotted in Fig. 3D (bottom left). Because the periodic tubular PDE is translation-invariant in s, this single phase anchor fixes the origin while all relative phase offsets among c, v_s, C_s^s, and C_phi^phi remain parameter-free predictions."
  alternatives: ["0.503", "0.510"]
  stands_for: "Arbitrary periodic origin s_peak/L of the travelling peristaltic wave in Fig. 3D"

- id: figs1_t1_time_added
  quantity: dimensionless_time
  unit: dimensionless
  printed: "0"
  basis: "Initial snapshot time t_1/tau = 0 in Fig. S1, where the caption explicitly states collocation points are initially homogeneously spaced (h = 1) on the prolate spheroid."
  alternatives: ["0.002", "0.004"]
  stands_for: "Initial time t_1/tau in Fig. S1"

- id: figs1_t2_time_added
  quantity: dimensionless_time
  unit: dimensionless
  printed: "0.073"
  basis: "Intermediate relaxation snapshot time t_2/tau in Fig. S1 (not printed numerically in Fig. S1 caption, corresponding to Fig. 2C's transient snapshot t/tau = 0.07)."
  alternatives: ["0.07", "0.075"]
  stands_for: "Intermediate snapshot time t_2/tau in Fig. S1"

- id: figs1_t3_time_added
  quantity: dimensionless_time
  unit: dimensionless
  printed: "1"
  basis: "Relaxed spherical steady-state horizon t_3/tau = 1 in Fig. S1 (where C_s^s -> 1 and v_s, v_n -> 0 within 10^-3)."
  alternatives: ["0.5", "2"]
  stands_for: "Final relaxed steady-state time t_3/tau in Fig. S1"

- id: figs1_c_init_conserved_added
  quantity: regulator_concentration
  unit: dimensionless
  printed: "0.9723"
  basis: "Initial homogeneous concentration c_init/c_0 = 4*pi*R_0^2 / A_0 = 0.97232 on the volume-preserving e = 0.75 prolate spheroid (area A_0 = 1.02847 * 4*pi*R_0^2), giving total molecule number N_c = 4*pi*R_0^2*c_0 so the final relaxed sphere reaches c = c_0 = 1 (matching Fig. 2C's dark-blue t = 0 color and Fig. S1C's t_1 velocity amplitude to 0.03%)."
  alternatives: ["1"]
  stands_for: "Initial homogeneous concentration c(s, t=0)/c_0 in Fig. 2C / Fig. S1"

