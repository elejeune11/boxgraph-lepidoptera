# Open questions, verified mathematical/typographical errors, and unstated choices in mietke2019

- id: q_eqs71_R0_squared_misprint
  kind: possible_error
  about:
    - sphere_mode_l_stability_eqs69_71
    - sphere_mode_l_stability_eqs69_71_corrected
    - cmp_sphere_mode_l1_eqs71_printed
  text: >
    SI Eq. (S71) (PDF p. 19, SI p. 13) prints the linearized diffusion-turnover bracket on the sphere
    as [R0^2 * D * l*(l+1) + k], multiplying D by R0^2 instead of dividing by R0^2. This is dimensionally
    inconsistent ([length]^4/[time] added to 1/[time]) and contradicts Eq. (S72) on the very same page
    (-2*D/R0^2 - k for l=1) as well as main-text Eq. (26) (2*D/R0^2 + k). At R0 = 10 um and
    D = 3 um^2/s, the printed Eq. (S71) misses the threshold condition lambda_1 = 0 by -599.94 s^-1,
    whereas the corrected variant with D*l*(l+1)/R0^2 reproduces Eq. (S72) and lambda_1 = 0 identically.
  citation:
    page: 19
    printed_page: "SI-13"
    quote: "R02 Dl(l + 1) + k"
    where: "Eq. (S71)"

- id: q_nu_bar_missing_slash
  kind: possible_error
  about:
    - viscosity_parameter_nu_bar
    - viscosity_parameter_nu_bar_corrected
    - cmp_nu_bar_infimum_printed
    - cmp_cyl_Lcrit_a3_printed_nu_vs_jac
  text: >
    SI Sec. 4.2 (PDF p. 21, SI p. 15) defines the viscosity parameter as
    "nu_bar = (eta_s + eta_b)(4*eta_s) > 1/4", omitting the division slash. The printed product has
    dimension [mass]^2/[time]^2 rather than dimensionless, violates nu_bar > 1/4 whenever viscosities
    are small, and breaks Eq. (S84) (giving L_crit/(2*pi*r0) = 0.985 instead of the Jacobian's 0.820
    at alpha = 3, kappa = 0). Restoring the slash to nu_bar = (eta_s + eta_b)/(4*eta_s) matches
    Eq. (S80)'s prefactor (eta_s + eta_b)/(4*eta_s*eta_b) = nu_bar/eta_b, strictly satisfies > 1/4,
    and reproduces the Jacobian stability boundary to machine precision.
  citation:
    page: 21
    printed_page: "SI-15"
    quote: "and a viscosity parameter ν̄ = (ηs + ηb )(4ηs ) > 1/4"
    where: "SI Sec. 4.2"

- id: q_eqs41_pole_bending_factor
  kind: possible_error
  about:
    - sphere_hydrodynamics_single_step_eqs32_33
    - sphere_hydrodynamics_single_step_eqs32_33_corrected
    - sphere_spatial_convergence_s2a
    - sphere_spatial_convergence_s2a_corrected
    - cmp_s2a_kappa025_order_vn_printed
  text: >
    SI Eq. (S41) (PDF p. 11, SI p. 5) states the pole limit of the normal force balance Eq. (S33) as
    4*eta_b*C_s^s*(d_s v_s + C_s^s v_n) + 2*(xi*f(c) + gamma)*C_s^s - 8*kappa*d_s^2 C_s^s = p.
    However, near a smooth axisymmetric pole with C_s^s(s) = c0 + (c2/2)*s^2 + O(s^4), integrating
    psi(s) = c0*s + (c2/6)*s^3 and r(s) = s - (c0^2/6)*s^3 gives C_phi^phi(s) = sin(psi)/r =
    c0 + (c2/6)*s^2 + O(s^4), so d_s^2 C_phi^phi|_0 = (1/3)*d_s^2 C_s^s|_0 (not d_s^2 C_s^s|_0).
    Consequently d_s^2 C_k^k|_0 = (4/3)*d_s^2 C_s^s|_0, and the bending term
    -2*kappa*(d_s^2 C_k^k + Gamma_phi_s^phi d_s C_k^k)|_0 = -4*kappa*d_s^2 C_k^k|_0 equals
    -(16/3)*kappa*d_s^2 C_s^s|_0 rather than -8*kappa*d_s^2 C_s^s|_0. All spherical simulations in
    the paper set kappa = 0, masking the error; at kappa_tilde = 0.25 on the Fig. S2A spheroid,
    printed -8 creates an O(1) discontinuity in vn at the poles and destroys O(N^-4) convergence
    (order ~ -0.08), whereas -(16/3) restores smooth O(N^-4) convergence.
  citation:
    page: 11
    printed_page: "SI-5"
    quote: "Using Eqs. (S36)–(S37), it follows that Eq. (S32) vanishes identically"
    where: "Eq. (S41)"

- id: q_fig2b_hill_exponent_discrepancy
  kind: unexplained_difference
  about:
    - sphere_active_surface_pde
    - run_pde_fig2b
    - hill_m_main
  text: >
    Table S1 (p. 18) and SI Video 1 (p. 23) state that all simulations in the main text use Hill
    exponent m = 2 (f(c) = c^2/(c0^2 + c^2)). With m = 2, our periodic tubular PDE solver reproduces
    Fig. 3D's steady peristaltic wave to three significant figures (c_max = 2.85, vs_cm in [0.04, 1.59],
    C_s^s in [-0.95, 0.33], C_phi^phi_max = 4.54). For Fig. 2B (xi/gamma = 10, D*tau/R0^2 = 0.3,
    k*tau = 0, kappa = 0), however, m = 2 converges to c_tilde(0) = 19.9, vs_min = -2.14 at s/L = 0.27,
    C_s^s(0) = 0.52, and C_s^s_max = 1.92 at s/L = 0.35, whereas the plotted curves in Fig. 2B show
    c_tilde(0) ~ 18.9, vs_min ~ -2.07 at s/L ~ 0.31, C_s^s(0) ~ 0.58, and C_s^s_max ~ 1.72 at s/L ~ 0.38.
    Running the exact same solver with Hill exponent m = 1 yields C_s^s(0) = 0.580, C_s^s_max = 1.723
    at s/L = 0.382, vs_min = -2.034 at s/L = 0.311, and c_tilde(0) = 18.7 (19.1 with 2% initial mean
    excess from a random perturbation), matching every feature of Fig. 2B. This suggests Fig. 2B may
    have been generated with m = 1 rather than the reported m = 2; calibrated curve digitization in the
    next stage will test this quantitatively.
  citation:
    page: 18
    printed_page: "SI-12"
    quote: "The Hill-coefficient m in Eq. (12) was in all simulations shown in the main text set to m = 2"
    where: "Table S1 / Fig. 2B"

- id: q_fig3a_unstated_xi_f0_protocol
  kind: unstated_input
  about:
    - fig3a_xi_f0_fixed_added
    - cylinder_stability_boundary_fig3a
    - run_cyl_stab_fig3a_k025_a0
    - run_cyl_stab_fig3a_k025_a3
  text: >
    The text and caption of Fig. 3A (p. 5) do not state the values of D*tau/r0^2, k*tau, or how
    the homogeneous active tension xi*f(c0)/gamma is treated as alpha is varied along the vertical
    axis. Matching the plotted curves reveals that Fig. 3A uses Table S1's D*tau/r0^2 = 0.05,
    k*tau = 1.95, eta_s/eta_b = 1 (giving alpha_c^* = 2.0) and holds xi*f(c0)/gamma = 3 FIXED
    (corresponding to Table S1's xi/gamma = 6, f(c0) = 1/2 while varying the Hill slope c0*d_c f(c0)
    independently). Holding xi*f(c0)/gamma = 3 fixed produces the vertical red dashed kappa_tilde = 0.25
    boundary at L0/(2*pi*r0) = 1.129 for alpha < alpha_c^*(0.25) = 1.989 and matches both boundaries
    across alpha in [0, 5]. If instead xi/gamma were varied at fixed m = 2 (xi*f(c0)/gamma = alpha),
    the kappa_tilde = 0.25 boundary would curve strongly rightwards below alpha = 2 to L0/(2*pi*r0) =
    1.887 at alpha = 0, contradicting Fig. 3A.
  citation:
    page: 5
    printed_page: "33"
    quote: "Stable and unstable regions are separated by"
    where: "Fig. 3A caption"

- id: q_sphere_re_lambda_overstated_stable
  kind: overstated_claim
  about:
    - sphere_mode_l_stability_eqs69_71_corrected
    - sphere_polar_growth_rate_eqs72
  text: >
    SI Sec. 4.1 (PDF p. 20, SI p. 14) claims unconditionally that "the general Jacobian of this
    system for l >= 2 yields growth-rates lambda_l with Re(lambda_l) < lambda_1, such that the polar
    mode l = 1 always becomes unstable first and growth fastest." Because J11 < 0, J22 < lambda_1,
    and J12*J21 < 0 for all l >= 2, Re(lambda_l) < max(J11, J22) < lambda_1 indeed holds rigorously
    whenever lambda_1 >= 0 (so l = 1 always destabilizes first and grows fastest in the unstable
    regime). However, in the deep stable regime (lambda_1 < 0, e.g., small alpha and large D or
    large eta_s/eta_b), the hydrodynamic shape-relaxation rate J11 < 0 can be less negative than
    the l = 1 diffusive decay rate lambda_1 < 0, yielding 0 > Re(lambda_l) > lambda_1.
  citation:
    page: 20
    printed_page: "SI-14"
    quote: "general Jacobian of this system for l ≥ 2 yields growth-rates"
    where: "SI Sec. 4.1"

- id: q_eqs23_extraneous_tn_phi
  kind: possible_error
  about:
    - sphere_hydrodynamics_single_step_eqs32_33
  text: >
    SI Eq. (S23) (PDF p. 9, SI p. 3) prints the axisymmetric normal force balance as
    d_s t_n^s + Gamma_phi_s^phi*(t_n^s + t_n^phi) - C_s^s t_s^s - C_phi^phi t_phi^phi = -f_n^ext.
    The "+ t_n^phi" inside the Christoffel term is extraneous and dimensionally mismatched with t_n^s:
    the covariant divergence nabla_i t_n^i = d_s t_n^s + Gamma_phi_s^phi * t_n^s contains no t_n^phi
    term. Because t_n^phi = 0 by axisymmetry, the slip cancels before Eq. (S33).
  citation:
    page: 9
    printed_page: "SI-3"
    quote: "∂s tsn + Γφφs tsn + tφn − C ss tss − C φφ tφφ = −fnext"
    where: "Eq. (S23)"

