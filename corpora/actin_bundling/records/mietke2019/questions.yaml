    saturating Hill regulation f(c) = c^m/(c0^m + c^m) (Eq. 12). Bois et al. use m = 1
    (f(c) = c/(1 + c), giving c0*d_c f(c0) = 1/4 at c0 = 1), whereas Mietke Table S1 reports m = 2
    (c0*d_c f(c0) = 1/2) for all main-text figures — yet calibrated digitization
    (q_fig2b_digitized_m1_settled) shows Mietke Fig. 2B actually matches Bois's m = 1 exponent.
    Structurally, Mietke's cylindrical determinant root k_tilde_n^(2) = sqrt((alpha -
    (1 + eta_s/eta_b)*k_tilde)/((1 + eta_s/eta_b)*D_tilde)) (Eq. S86, cylinder_trace_det_roots_eqs84_86)
    is precisely the marginal wavenumber (lambda = 0) of the fixed-geometry zero-friction active
    fluid (Bois Eq. 12 / Hannezo Eq. 7 with delta_r = 0 and viscosity eta_s + eta_b), whereas
    allowing radial shape deformations lowers the threshold to alpha_c^* = D_tilde + k_tilde
    (Eq. 27, viscosity eta_b alone, smaller by a factor of 1 + eta_s/eta_b = 2 for eta_s = eta_b).
