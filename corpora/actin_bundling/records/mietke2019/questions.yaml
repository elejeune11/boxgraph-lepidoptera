  text: >
    Cross-record comparison between mietke2019 and gov2018 establishes three exact Helfrich-membrane
    results: (1) Bending-modulus factor of 2: mietke2019 Eq. (5) writes F_H = int dA [gamma +
    kappa*(C_k^k)^2] (so f_bend = kappa_M*(c_1 + c_2)^2), whereas gov2018 Eq. (2.1) writes
    f_bend = (1/2)*kappa_G*(H - n*H0)^2 with H = c_1 + c_2, giving exact equivalence kappa_Gov =
    2*kappa_Mietke. This independently confirms q_eqs70_bending_factor_two (SI Eq. S70 dropped the
    factor of 2 in front of kappa_M): only the corrected variant sphere_mode_l_stability_eqs69_71_s70_s71_corrected
    reduces identically to gov2018/flat_membrane_dispersion under kappa_Gov = 2*kappa_Mietke
    (rel_gov2018_sphere_mode_l_reduces_flat_disp). (2) Zero-pressure equilibrium tube radius: setting
    p0^c = 0 and xi = 0 in mietke2019/cylinder_equilibrium_pressure_si yields r0 = sqrt(kappa_M/gamma)
    = sqrt(kappa_G/(2*sigma)), matching gov2018/tube_equilibrium_radius identically (with active
    extension r0 = sqrt(kappa_M/(gamma + xi*f(c0)))). (3) Intermediate-wavenumber cylindrical second
    variation: substituting zero-pressure tension gamma = kappa_M/r0^2 into mietke2019 Eqs. (S77)+(S79)
    (exact Ou-Yang & Helfrich 1989) gives restoring stiffness (kappa_M/r0^4)*[(2*k^4 - k^2 + 3) +
    (k^2 - 1)] = (kappa_G/r0^4)*(q^4*r0^4 + 1) with exact cancellation of the q^2*r0^2 term, whereas
    gov2018/cylindrical_ring_dispersion (reconstructed at H0 = 0 using c_theta = 1/R without the
    1/sqrt(1 + h'^2) slope-softening factor) gives (kappa_G/R0^4)*(q^4*R0^4 + q^2*R0^2 + 1), which
    agrees in both q*R0 >> 1 and q*R0 << 1 scaling limits (rel_gov2018_cyl_bending_scales_cyl_ring_short/long)
    but is up to 1.5x stiffer at q*R0 = 1.
  citation:
