    Cross-record analysis between mietke2019 and mirza2025 reveals three structural points:
    (1) 2D viscous constitutive mapping: mirza2025's 2D viscous stress sigma^diss = 2*eta*(d + tr(d)*I)
    decomposes into traceless shear plus isotropic bulk stress as 2*eta*(d - (1/2)*tr(d)*I) +
    3*eta*tr(d)*I, matching mietke2019 Eq. (9) exactly at eta_s = h*eta and eta_b = 3*h*eta
