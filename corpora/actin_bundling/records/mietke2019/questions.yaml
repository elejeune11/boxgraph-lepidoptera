  text: >
    Cross-validation audit of mietke2019 against all 4 related records {bois2011, hannezo2015,
    gov2018, mirza2025} finds 0 physically well-posed cross-validations (validations.yaml left empty):
    (1) bois2011, gov2018, and mirza2025 are pure theory/simulation records with 0 `origin: measured`
    datums. (2) hannezo2015 contains 35 measured Drosophila tracheal datums, including circumferential
    actin ring spacing (WT stage-16 embryo 0.5 +/- 0.1 um, early larva 1.2 +/- 0.1 um, late larva
    1.45 +/- 0.3 um, Src42A 0.8 +/- 0.2 um, moesin RNAi 1.8 +/- 0.5 um, chitin-depleted kkv1
    4.5 +/- 2 um), FRAP diffusivity D = 0.04 +/- 0.03 um^2/s and turnover time tau = 15 +/- 7 s,
    and tracheal diameters (WT mean r0 = 2.388 um from Fig. 4F; kkv1 mean r0 = 1.539 um from Fig. 3C).
    Quantitative analysis of mietke2019's cylindrical active-surface model Eqs. (S80)-(S82)
    (cylinder_jacobian_eqs80_82) proves it CANNOT select a finite periodic ring wavelength: because
    mietke2019 sets external tangential substrate friction identically to zero (f_j^ext = 0, p. 6 /
    SI p. 13), long-wavelength in-plane flows are unscreened. Analytically, the geometric driving
    function T(k) = -kappa_tilde*(2*k^4 - k^2 + 3) + (1 + xi*f0/gamma)*(1 - k^2) is strictly
    decreasing in k^2 wherever T(k) > 0 (an interior maximum in k^2 requires kappa_tilde >
    1 + xi*f0/gamma, where T_max < -1.875*kappa_tilde < 0), and the active diagonal entry
    J_22 = alpha - D_tilde*k^2 - k_tilde is strictly decreasing in k^2. Numerical evaluation across
    Drosophila tracheal scales (r0 = 1.539-2.388 um, D = 0.04 um^2/s, k = 1/15 s^-1, eta_b = 10-1000
    pN*s/um, gamma = 100 pN/um, kappa_tilde in [0, 10], alpha/alpha_c^* in [0.5, 5]) confirms
    k_max -> 0 (lambda_max -> infinity, Type-II long-wavelength coarsening to 1 constriction per
    periodic box) in every case, in fundamental contrast to hannezo2015's friction-screened Type-I
    wavelength selection lambda_c = 2*pi*(D*tau*eta/xi)^(1/4). Moreover, cylinder_stability_boundary_fig3a
    outputs only the dimensionless minimum unstable box aspect ratio L_crit/(2*pi*r0) (not a
    dimensional wavelength [length] and not lambda_max; converting L_crit = 2*pi*r0/k_crit yields
    the Plateau-Rayleigh circumference 15.0 um for WT / 9.7 um for kkv1 at alpha <= alpha_c^*,
    and varies arbitrarily with unmeasured supercriticality alpha above alpha_c^*), and no mietke2019
    model predicts FRAP recovery, ring counts, or fluorescence ramps.
