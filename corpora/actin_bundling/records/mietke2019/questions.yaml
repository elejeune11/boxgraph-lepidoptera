- id: q_pde_time_integrator_choice
  kind: choice
  about:
    - sphere_active_surface_pde
    - tube_active_surface_pde
    - run_pde_fig2b
    - run_pde_fig3d
  text: >
    While SI Sec. 3.1 uses explicit Euler time stepping (which faces a severe O(du^4/kappa) step-size
    restriction when kappa > 0, e.g. Nt = 3.2e5 in Fig. S2B), our full nonlinear PDE solvers
    sphere_active_surface_pde and tube_active_surface_pde use adaptive implicit BDF integration
    (and odd-N periodic spectral differentiation on tubes to avoid centered-FD Nyquist decoupling)
    so each run completes in a few seconds while solving the identical continuum PDEs. Explicit Euler
    O(Nt^-1) convergence is verified directly in tube_temporal_convergence_s2b, and spatial/temporal
    convergence of the BDF runs is verified in refinements.yaml.
  citation:
    page: 17
    printed_page: "SI-11"
    quote: "using explicit Euler time stepping with step size δt"
    where: "SI Sec. 3.1"

- id: q_eqs70_bending_factor_two
  kind: possible_error
  about:
    - sphere_mode_l_stability_eqs69_71
    - sphere_mode_l_stability_eqs69_71_corrected
    - sphere_mode_l_stability_eqs69_71_s70_s71_corrected
    - cmp_sphere_mode_l2_kappa_s70_vs_corrected
  text: >
    SI Eq. (S70) (PDF p. 19, SI p. 13) prints the linearized spherical normal force balance bending
    term as (kappa/R0^2)*l*(l+1)*(l-1)*(l+2)*delta_R_l, omitting a factor of 2. Because the paper's
    Helfrich free energy Eq. (5) is F_H = int dA [gamma + kappa*(C_k^k)^2] (so Mietke's kappa equals
    half the standard Helfrich modulus kappa_H = 2*kappa), the axisymmetric normal force balance
    Eq. (S33) correctly contains -2*kappa*Delta_Gamma C_k^k (and cylindrical Eq. S79 correctly contains
    2*k_n^4). Linearizing -2*kappa*Delta_Gamma C_k^k around a sphere R = R0 + delta_R_l*Y_l yields
    +(2*kappa/R0^4)*l*(l+1)*(l-1)*(l+2)*delta_R_l, requiring (2*kappa/R0^2)*l*(l+1) in Eq. (S70)
    (verified both symbolically with SymPy for l = 2, 3 and numerically against the Eq. S33
    hydrodynamic solver: at l = 2, kappa_tilde = 0.5, xi = 0, eta_s = eta_b = 1, the exact Eq. S33
    decay rate is J11 = -17.500 vs printed Eq. S70's -10.000). The error vanishes for l = 1 (where
    (l-1)*(l+2) = 0) and for kappa = 0 (all spherical simulations in the paper), so Eq. (S72),
    Eq. (26), and Figs. 2B–C and S2A–C are unaffected.
  citation:
    page: 19
    printed_page: "SI-13"
    quote: "l(l + 1) + γ + ξf (c0 ) (l − 1)(l + 2)δRl Yl = 0"
    where: "Eq. (S70)"

- id: q_si_sec42_root_k2_and_alpha_c_kappa
  kind: overstated_claim
  about:
    - cylinder_trace_det_roots_eqs84_86
    - cylinder_stability_boundary_fig3a
  text: >
    Two analytical omissions appear in SI Sec. 4.2 (PDF p. 21, SI p. 15) and its cross-reference on
    p. 5: (1) Below Eq. (S86), the text writes that alpha < alpha_c^* implies k_tilde_n^(2) < 1 and
    k_tilde_n^(2) < k_tilde_n^c < 1, with det(J) < 0 for k_tilde_n^(2) < k_tilde_n < 1. However,
    whenever alpha*gamma < (eta_b + eta_s)*k, the radicand of Eq. (S86) is negative so no real
    positive root k_tilde_n^(2) exists (det(J) < 0 on all of 0 <= k_tilde_n < 1); for the paper's
    own Fig. 3 parameters (eta_s = eta_b, k*tau = 1.95, D*tau/r0^2 = 0.05), (eta_b + eta_s)*k/gamma
    = 3.9 > alpha_c^* = 2.0, so k_tilde_n^(2) is purely imaginary throughout alpha < alpha_c^* (and
    at alpha = 3). Moreover, when k_tilde_n^(2) is real (requiring eta_s*k < eta_b*D/r0^2), one has
    det(J) > 0 for 0 < k_tilde_n < k_tilde_n^(2) < 1 and instability there follows from Tr(J) > 0
    rather than det(J) < 0 (the final stability conclusion k_tilde_n < 1 unstable / > 1 stable for
    alpha < alpha_c^* remains valid). (2) Main text p. 5 states that alpha_c^* depends on kappa and
    cites the SI Appendix, but SI Sec. 4.2 analyzes only kappa = 0 analytically and never derives
    alpha_c^*(kappa).
  citation:
    page: 21
    printed_page: "SI-15"
    quote: "From this, we see that α < αc∗ implies"
    where: "SI Sec. 4.2 / Eq. (S86)"

- id: q_sphere_pde_nyquist_drift_fig2b
  kind: numerics
  about:
    - sphere_active_surface_pde
    - run_pde_fig2b
    - fig2b_steady_time_added
  text: >
    Audit check of run_pde_fig2b (sphere_active_surface_pde at N = 61, t/tau = 8): the basis note of
    fig2b_steady_time_added in added.yaml states that t/tau = 8 reaches max|v_n| < 1e-5, whereas the
    actual output pde_fig2b_vn_max_pred is 8.32e-3. Tracking max|v_n|(t) shows it reaches a minimum
    of 8.2e-5 near t/tau = 4 and subsequently grows due to centered-FD Nyquist decoupling in Eq. (S49)
    (D1o @ D1e at kappa = 0), causing BDF step-size failure before t/tau = 10 (so the listed
    alternative t/tau = 12 in added.yaml crashes). Solving the exact vn = 0 steady-state first-order
    BVP independently (rms residual 5e-8) confirms that run_pde_fig2b at t/tau = 8 remains accurate
    to 0.2% on c(0) (19.919 vs exact 19.8825) and 0.75% on C_s^s_max (1.933 vs exact 1.9187), and
    independently confirms q_fig2b_hill_exponent_discrepancy (exact m = 1 BVP: c(0) = 18.6922,
    vs_min = -2.0340 at s/L = 0.3156, C_s^s(0) = 0.5798, C_s^s_max = 1.7241 at s/L = 0.3870). Also
    noted: solve_hydro_sphere and solve_hydro_tube use Vn_lz = +inv_An * cos_psi rather than the
    physical z-force sign -inv_An * cos_psi; this is benign here because lam_z ~ 1e-4 -> 0, though
    -cos_psi ensures strictly positive projection int (sin^2 psi + cos^2 psi) r ds > 0 on arbitrarily
    oblate shapes.
  citation:
    page: 4
    printed_page: "32"
    quote: "deformed steady-state shape emerges with a localized patch of stress regulator"
    where: "Fig. 2B"

