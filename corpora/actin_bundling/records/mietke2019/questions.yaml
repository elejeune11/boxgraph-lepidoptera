- id: q_fig2b_digitized_m1_settled
  kind: unexplained_difference
  about:
    - fig2b_c_fig
    - fig2b_vs_fig
    - fig2b_Css_fig
    - fig2b_Cphi_fig
    - cmp_fig2b_c_m2
    - cmp_fig2b_vs_m2
    - cmp_fig2b_Css_m2
    - cmp_fig2b_Cphi_m2
    - cmp_fig2b_c_m1_hypothesis
    - cmp_fig2b_vs_m1_hypothesis
    - cmp_fig2b_Css_m1_hypothesis
    - cmp_fig2b_Cphi_m1_hypothesis
  text: >
    Calibrated digitization of all four Fig. 2B profiles (52 calibrated points across c_tilde,
    v_s_tilde, C_s^s_tilde, and C_phi^phi_tilde) quantitatively settles q_fig2b_hill_exponent_discrepancy.
    Evaluating the spherical PDE with Table S1's reported Hill exponent m = 2 fails reproduction on
    every curve (RMS deviations 0.36 on c_tilde, 0.094 on v_s_tilde, 0.131 on C_s^s_tilde, and 0.052
    on C_phi^phi_tilde; e.g., C_s^s_tilde(0.02) = 0.518 vs digitized 0.578 and peak 1.914 at s/L = 0.35
    vs digitized 1.721 at s/L = 0.38). Substituting Hill exponent m = 1 reproduces every single
    calibrated point across all four curves within its reading interval (14/14 on c_tilde, 14/14 on
    v_s_tilde, 14/14 on C_s^s_tilde, 10/10 on C_phi^phi_tilde), cutting RMS error by 7-22x (to 0.0059
    on C_s^s_tilde and 0.010 on v_s_tilde). By contrast, Fig. 3D (c_tilde and v_s_tilde) and Fig. S1 /
    Fig. 2C quantitatively confirm m = 2, indicating Fig. 2B alone was generated with m = 1 despite
    Table S1 and SI Video 1 stating m = 2 for all main-text simulations.
  citation:
    page: 4
    printed_page: "32"
    quote: "concentration c̃ = c/c0 , in-plane flow"
    where: "Fig. 2B (Right) / Table S1"

- id: q_fig3d_curvature_vertical_offset
  kind: possible_error
  about:
    - fig3d_Css_fig
    - fig3d_Cphi_fig
    - cmp_fig3d_Css
    - cmp_fig3d_Cphi
  text: >
    Calibrated digitization of Fig. 3D (bottom right) reveals a rigid upward vertical misalignment of
    Delta_C ~ +0.130 (~28 px at 2400 dpi, ~0.85 pt in PDF coordinates) affecting both plotted curvature
    curves (C_s^s_tilde and C_phi^phi_tilde) relative to the y-axis ticks (0, 2, 4) and the horizontal
    dashed reference lines at 0 and 1. This misalignment is independently proved by differential
    geometry: on any periodic axisymmetric tube, Eq. (17) (d_s psi = C_s^s) requires
    int_0^1 C_s^s_tilde d(s/L) = (r_0/L)[psi(L) - psi(0)] = 0 identically, whereas integrating the
    plotted blue C_s^s_tilde curve across 97 densely sampled points yields +0.123 (+0.130 over [0, 1],
    implying an impossible +52 deg net tangent-angle drift per period). Relative to our m = 2 tubular
    PDE solution (which reproduces Fig. 3D's c_tilde across all 14 points with RMS = 0.018), both
    plotted curvature curves sit rigidly higher by the same constant offset (+0.132 +/- 0.011 for
    C_s^s_tilde; +0.122 +/- 0.028 for C_phi^phi_tilde), consistent with an accidental vertical nudge
    of the grouped curve artwork during figure assembly. Smaller (~11-12 px at 2400 dpi) vertical
    offsets also appear between the overlaid left and right y-axes in Fig. 2B (top) and Fig. 3D
    (bottom left), though in those panels the right tick marks shifted together with the orange curve.
  citation:
    page: 5
    printed_page: "33"
    quote: "and principle curvatures"
    where: "Fig. 3D (bottom right)"

