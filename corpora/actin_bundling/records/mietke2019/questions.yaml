    (gamma*D*kappa*beta/(2*eta*c_0)) = k_d*kappa*beta/(2*c_0) is strictly independent of substrate
    friction gamma. Sending gamma -> 0 at fixed contractile anisotropy kappa*beta < 0 therefore hits
    Mirza's singular boundary 4 + 4*k_bar_d*delta <= 0 rather than reducing to mietke2019's isotropic
    threshold; convergence to mietke2019 requires taking kappa -> 0 first (|k_bar_d*delta| << 1,
    verified in rel_mirza2025_caseA_L0_approx_cyl_dimless). (3) Bibliographic disambiguation:
    mirza2025/references.yaml entry ref-mietke2019 refers to Mietke et al., Phys. Rev. Lett.
    123:188101 (2019) ("Minimal model of cellular symmetry breaking"), a different article from
