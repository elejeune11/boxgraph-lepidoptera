notes: >
  Full quantitative read of Mietke, Jülicher & Sbalzarini, PNAS 116(1), 29–34 (2019),
  covering the 6-page main article (PDF pp. 1–6) and the 17-page Supporting Information
  including SI Video captions (PDF pp. 7–23). All 23 page texts and page images containing
  equations, tables, and plots were inspected directly.

  Scope included: constitutive Hill regulation Eq. (12) and contractility parameter Eq. (25);
  viscocapillary timescale tau = eta_b/gamma; homogeneous equilibrium pressures on spheres
  (SI Sec. 4.1) and cylinders (SI Sec. 4.2); prolate spheroid volume-preserving geometry;
  linear stability of spherical active surfaces (Eq. 26, SI Eqs. S69–S72 including the
  printed Eq. S71 misprint R0^2*D*l(l+1) and its corrected variant D*l(l+1)/R0^2); linear
  stability of periodic tubular active surfaces (Eq. 27, SI Eqs. S76–S86 including the
  printed viscosity parameter misprint nu_bar = (eta_s+eta_b)(4*eta_s) and its corrected
  variant (eta_s+eta_b)/(4*eta_s), bending factor Bc Eq. S79, numerical Jacobian stability
  diagram Fig. 3A, classical Plateau–Rayleigh limit Eq. S83, and analytical trace/determinant
  roots Eqs. S84–S86); axisymmetric single-step hydrodynamic solver Eqs. (S32)–(S33) and
  pole limit Eq. (S41) (including both printed -8*kappa*d_s^2 C_s^s and corrected
  -(16/3)*kappa*d_s^2 C_s^s variants) plus spatial convergence test Fig. S2A; full nonlinear
  axisymmetric PDE solvers for spherical active surfaces (reproducing Figs. 2B, 2C, S2C)
  and periodic tubular active surfaces (reproducing Figs. 3B, 3C, 3D, and explicit-Euler
  temporal convergence Fig. S2B). Exact symbolic constants printed by the paper (4*pi/3,
  2*pi, 1/2, 1/4) are entered in decimal form where required by the printed-value parser,
  with their printed symbolic forms noted.

  Key mathematical and quantitative findings documented in questions.yaml and variant
  models: (1) Eq. (S71) (p. 19) prints [R0^2 D l(l+1) + k] instead of [D l(l+1)/R0^2 + k];
  (2) SI p. 21 prints nu_bar = (eta_s + eta_b)(4*eta_s) > 1/4 without the division slash;
  (3) Eq. (S41) (p. 11) prints -8*kappa*d_s^2 C_s^s at the spherical poles instead of
  -(16/3)*kappa*d_s^2 C_s^s (masked by kappa = 0 in all spherical runs of the paper, but
  creating an O(1) pole jump and breaking O(N^-4) convergence for kappa > 0); (4) Fig. 3A
  holds homogeneous active tension xi*f(c0)/gamma = 3 fixed while sweeping alpha independently,
  an unstated protocol required to produce the vertical kappa_tilde = 0.25 boundary at
  L0/(2*pi*r0) = 1.129 for alpha < 1.989; (5) Fig. 2B's plotted steady-state profiles match
  Hill coefficient m = 1 rather than the m = 2 stated in Table S1 and SI Video 1, whereas
  Fig. 3D matches m = 2 to three significant figures; (6) minor SI slips in Eq. (S23)
  (extraneous + t_n^phi), SI p. 20 (Re(lambda_l) < lambda_1 fails in the deep stable regime),
  SI p. 16 ("Figs. 4 B–D" for Figs. 3 B–D), Fig. S1 C tick label ("0.5" for "-0.5"), and
  SI Videos 3–5 ("D*tau/R0^2" for "D*tau/r0^2").

  Left out: (1) grant number 031L0044, postal codes, dates, and bibliographic metadata that
  feed no model; (2) the unparameterized external stabilizing force test f_ext = F0(r0/r-1)e_r
  (p. 5), for which neither F0 nor any numerical output is printed (recorded as an open
  question); (3) calibrated digitization of plotted curves in Figs. 2B, 3A, 3D, S1, and S2,
  which belongs to the separate digitize stage—all analytical and PDE models needed for
  those curves are implemented, validated, and refined here.
