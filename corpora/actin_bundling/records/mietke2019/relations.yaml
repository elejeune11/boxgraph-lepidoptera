- id: rel_gov2018_sphere_mode_l_reduces_flat_disp
  kind: reduces_to
  a: mietke2019/sphere_mode_l_stability_eqs69_71_s70_s71_corrected
  b: gov2018/flat_membrane_dispersion
  mapping:
    q: "sqrt(floor(l + 0.5) * (floor(l + 0.5) + 1)) / R0"
    kappa: "2 * kappa"
    sigma: "gamma"
    kBT: "0.00411"
    Lambda: "D / 0.00411"
    H0: "0"
    ns: "100"
    n0: "0.1"
    J: "0"
    xi: "4 * eta_s / R0**2"
    A: "0"
  output_map:
    omega_real: max_re_lambda
  limit:
    xi: "0"
    k: "0"
    eta_b: "oo"
  regime:
    l: [2.0, 12.0]
    eta_s: [10.0, 100.0]
    eta_b: [100.0, 1000.0]
    gamma: [10.0, 200.0]
    xi: [0.1, 10.0]
    f_c0: [0.5, 0.5]
    c0_df_dc0: [0.25, 1.0]
    kappa: [1.0, 50.0]
    R0: [2.0, 10.0]
    D: [0.05, 5.0]
    k: [0.001, 0.1]
  provenance: proposed
  reason: >
    In the passive (xi -> 0), conserved (k -> 0), and 2D-incompressible (eta_b -> oo) limit of
    Mietke's corrected spherical stability model Eqs. (S69)-(S71), the two eigenvalues decouple
    into Helfrich shape relaxation J_11 -> -(gamma*q^2 + 2*kappa*q^4)/(4*eta_s/R0^2) and Fickian
    surface diffusion J_22 -> -D*q^2 with q = sqrt(l*(l+1))/R0 for every harmonic degree l >= 2.
    Both branches match Gov's passive flat Helfrich membrane dispersion (A = H0 = J = 0)
    identically under exact physical units: kappa_Gov = 2*kappa_Mietke (reflecting Mietke Eq. 5's
    kappa*(C_k^k)^2 vs Gov Eq. 2.1's (1/2)*kappa*H^2, independently corroborating
    q_eqs70_bending_factor_two), sigma = gamma, Einstein mobility Lambda = D/(k_B*T), and
    effective normal viscous drag xi_Gov = 4*eta_s/R0^2 [pN*s/um^3].
  assumptions:
    - "Passive (xi -> 0), conserved (k -> 0), 2D-incompressible (eta_b -> oo) spherical surface on Mietke's corrected Eq. (S70)+(S71) model."
    - "Passive bare membrane (A = 0, H0 = 0, J = 0) in Gov with Helfrich modulus convention kappa_Gov = 2*kappa_Mietke and effective normal drag xi_Gov = 4*eta_s/R0^2."
    - "Einstein relation D = Lambda*k_B*T (k_B*T = 0.00411 pN*um cancels identically)."

- id: rel_gov2018_cyl_bending_scales_flat_disp
