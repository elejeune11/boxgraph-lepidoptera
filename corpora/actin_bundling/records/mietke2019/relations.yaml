    B_c(k_n*r0) = 2*k_n^4 - k_n^2/r0^2 + 3/r0^4 (Eq. S79) and Gov's passive cylindrical tube
    shape relaxation rate omega_h = -(kappa/(xi*R0^4))*(1 + q^2*R0^2 + q^4*R0^4) share identical
    log-slopes in both axial wavenumber (+4 in k_n = q) and tube radius (0 in r0 = R0).
  assumptions:
    - "Short-wavelength regime k_n*r0 in [50, 1000]."
    - "Passive bare cylindrical membrane (A = 0, H0 = 0) in Gov with fast diffusion so omega_real selects the Helfrich bending mode."

- id: rel_gov2018_cyl_bending_scales_cyl_ring_long
  kind: scales_as
