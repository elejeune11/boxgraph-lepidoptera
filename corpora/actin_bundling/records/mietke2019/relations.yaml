    r0: [5.0, 20.0]
  provenance: proposed
  reason: >
    In the short-wavelength flat-sheet regime k_n*r0 >> 1 (here k_n*r0 in [50, 1000]), Mietke's
    Ou-Yang-Helfrich cylindrical bending response factor B_c(k_n*r0) = 2*k_n^4 - k_n^2/r0^2 + 3/r0^4
    (Eq. S79) approaches 2*k_n^4, sharing the exact fourth-power Helfrich bending scaling q^4 with
    Gov's tensionless passive flat-membrane shape relaxation rate omega_h = -(kappa/xi)*q^4.
  assumptions:
    - "Short-wavelength flat-sheet regime k_n*r0 >> 1 (k_n*r0 in [50, 1000])."
    - "Tensionless passive bare membrane (sigma = A = H0 = J = 0) in Gov with fast diffusion so omega_real selects the bending shape branch."

- id: rel_gov2018_cyl_bending_scales_cyl_ring_short
