  b: mietke2019/sphere_critical_contractility_dimless
  mapping:
    D_tilde: D * (eta_b / gamma) / (R0 ** 2)
    k_tilde: k * (eta_b / gamma)
  output_map:
    alpha_s_star: alpha_s_star
  regime:
    eta_b: [10.0, 2000.0]
    gamma: [10.0, 500.0]
    D: [0.1, 20.0]
    R0: [1.0, 20.0]
    k: [0.0, 2.0]
  provenance: stated
