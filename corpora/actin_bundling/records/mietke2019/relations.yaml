# ==============================================================================
# Cross-record relations with mirza2025 (Mirza et al., eLife 14:RP93097, 2025;
# isotropic zero-friction limit of 2D active nematic cortex)
# ==============================================================================

- id: rel_mirza2025_iso_dimless_reduces_cyl_dimless
  kind: reduces_to
  a: mirza2025/isotropic_threshold_dimless
  b: mietke2019/cylinder_critical_contractility_dimless
  mapping:
    D_tilde: "0"
    k_tilde: "4 * k_d"
  output_map:
    alpha_c_star: lambda_crit_0
  limit:
    k_d: "oo"
  regime:
    k_d: [1.0e4, 1.0e6]
  provenance: proposed
  reason: >
    In Mirza et al. (2025), the dimensionless turnover parameter is k_bar_d = k_d*eta/(gamma*D),
    so vanishing cortical-substrate friction (gamma -> 0) corresponds to k_bar_d -> oo. In this
    limit, the isotropic active-gel instability threshold lambda_crit_0 = (1 + 2*sqrt(k_bar_d))^2
    approaches 4*k_bar_d = 4*eta*k_d/(gamma*D) (while the critical wavenumber nu_crit_0 -> 0 in
    physical units). This matches Mietke's flat-limit (r0 -> oo, D_tilde = 0) critical contractility
    alpha_c^* = k_tilde = eta_eff*k/gamma_ref, where the exact factor of 4 reflects Mirza's 2D
    compressible viscous stress 2*eta*(d + tr(d)*I) -> 4*eta*d_x v in 1D (equivalent to Mietke Eq. 9
    with eta_s = h*eta and eta_b = 3*h*eta, so eta_s + eta_b = 4*h*eta).
  assumptions:
    - "Zero substrate friction limit k_bar_d = k_d*eta/(gamma*D) -> oo on Mirza's isotropic branch."
    - "Infinite-radius flat limit r0 -> oo (D_tilde = 0) on Mietke's cylindrical threshold, with effective 1D viscosity 4*eta and tension normalization gamma_ref = gamma*D*h."

- id: rel_mirza2025_caseA_L0_approx_cyl_dimless
  kind: approximated_by
  a: mirza2025/caseA_critical_L0_eqC13
  b: mietke2019/cylinder_critical_contractility_dimless
  mapping:
    D_tilde: "0"
    k_tilde: "4 * k_d"
  output_map:
    alpha_c_star: lambda_crit
  regime:
    k_d: [1.0e4, 1.0e5]
    c_0: [5.0, 20.0]
    beta: [-0.5, -0.05]
    kappa: [-1.0e-7, 1.0e-7]
  tolerance: 0.015
  provenance: proposed
  reason: >
    In Mirza's full nematic Case A (L = 0) critical threshold Eq. (C13), the dimensionless product
    k_bar_d*delta = k_d*kappa*beta/(2*c_0) is strictly independent of substrate friction gamma, so
    the isotropic (kappa -> 0) and zero-friction (k_bar_d -> oo) limits do not commute (see
    q_mirza2025_viscosity_and_noncommuting_zero_friction_limit). In the joint low-friction
    (k_bar_d in [10^4, 10^5]) and weak-nematic-coupling (|k_bar_d*delta| << 1) regime, Case A
    Eq. (C13) is approximated within 1.5% by Mietke's flat-limit isotropic threshold 4*k_bar_d.
  assumptions:
    - "Low-friction regime k_bar_d in [10^4, 10^5] and weak nematic coupling |k_bar_d*delta| = |k_d*kappa*beta/(2*c_0)| << 1."
    - "Flat limit r0 -> oo (D_tilde = 0) on Mietke with 1D longitudinal viscosity 4*eta."

- id: rel_mirza2025_disp_1d_approx_cyl_jac
  kind: approximated_by
  a: mirza2025/dispersion_1d_eqC7
  b: mietke2019/cylinder_jacobian_eqs80_82
  mapping:
    L_over_2pi_r0: "1 / nu"
    n_mode: "1"
    alpha: "lam"
    xi_f0_over_gamma: "0"
    kappa_tilde: "100000"
    D_tilde: "1"
    k_tilde: "k_d"
    eta_s_over_eta_b: "3"
  output_map:
    max_re_lambda_tilde: alpha_plus
  regime:
    nu: [6.0, 15.0]
    k_d: [1.0, 20.0]
    L: [1.0, 2.0]
    c_0: [500.0, 1000.0]
    b: [20.0, 20.0]
    eta_rot: [0.5, 1.0]
    beta: [0.0, 0.0]
    lambda_o: [6.0, 6.0]
    kappa: [0.0, 0.0]
    lam: [2500.0, 5000.0]
    q_0: [0.0, 0.0]
  tolerance: 0.015
  provenance: proposed
  reason: >
    In the decoupled isotropic limit (kappa = beta = q_0 = 0, fast nematic relaxation c_0 >> 1),
    Mirza Eq. (C7)'s hydrodynamic density branch simplifies to alpha_plus = -k_d - nu^2 +
    lam*nu^2/(1 + 4*nu^2). In the viscous-dominated regime 4*nu^2 >> 1 (here nu in [6, 15],
    4*nu^2 in [144, 900]), this approaches -k_d - nu^2 + lam/4, matching within 1.5% Mietke's
    rigid-cylinder (kappa_tilde = 10^5, delta_r -> 0) Jacobian Eqs. (S80)-(S82) with D_tilde = 1,
    k_tilde = k_d, k_tilde_n = nu, alpha = lam, and 1 + eta_s/eta_b = 4 (reflecting Mirza's 4*eta
    longitudinal viscosity in timescale t_0 = eta/(gamma*D)).
  assumptions:
    - "Decoupled isotropic state (kappa = beta = q_0 = 0) with fast nematic relaxation (c_0 in [500, 1000]) so alpha_plus selects the density branch."
    - "Viscous-dominated supercritical regime nu in [6, 15] and rigid fixed cylinder (kappa_tilde = 10^5) with 1 + eta_s/eta_b = 4."

- id: rel_mirza2025_iso_dim_scales_cyl_eq27
  kind: scales_as
  a: mirza2025/isotropic_threshold_dimensional_eq9
  b: mietke2019/cylinder_critical_contractility_eq27
  mapping:
    eta_b: "4 * eta"
    gamma: "100"
    D: "D"
    r0: "1000"
    k: "k_d"
  output_map:
    alpha_c_star: lambda_crit_0
  regime:
    gamma: [1.0e10, 1.0e12]
    D: [0.01, 0.1]
    k_d: [0.1, 2.0]
    eta: [1.0e3, 1.0e5]
  provenance: proposed
  reason: >
    In the low-friction turnover-dominated regime of Mirza Eq. (9) (gamma*D << 4*k_d*eta) and
    the large-radius flat regime of Mietke Eq. (27) (D/r0^2 << k_d), both critical active-stress
    thresholds collapse onto the universal viscous-turnover law sigma_{a,c} ~ eta*k_d, matching
    log-slopes in all three shared parameters D (0), eta (+1), and k_d (+1).
  assumptions:
    - "Low-friction regime gamma*D << 4*k_d*eta on the Mirza side and large-radius flat regime r0 = 1000 um >> sqrt(D/k_d) on the Mietke side."

