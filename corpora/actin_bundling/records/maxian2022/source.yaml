notes: >
  Complete reading of Maxian, Donev, and Mogilner, Biophysical Journal 121, 1230-1245 (2022)
  together with its Supporting Material (PDF pp. 1-26: main article pp. 1-16 / journal pp.
  1230-1245; SI cover p. 17; Supplemental Text & Figs. S1-S8 pp. 18-26 / SI pp. 1-9). All 26
  extracted text pages (text/page-001.txt..page-026.txt) and all 26 rendered page PNGs
  (pages/page-001.png..page-026.png) were inspected to verify every equation, symbol, subscript,
  exponent, Table 1 entry, Table S1 entry, and figure legend formula (including legend equations
  absent from OCR text).

  In scope (33 models total: 2 non-runnable HPC many-body models, 25 printed/from-words runnable
  models, 2 variant_of misprint-corrected models, and 4 reconstructed models):
  (1) Non-runnable HPC simulations: semiflexible_actin_network_sim (Eqs. 1-7) and
  rigid_brownian_actin_network_sim (Eqs. 6-20, S1-S12), recorded explicitly with runnable: false
  and open questions citing unprinted algorithms from Maxian et al. (2021) [refs. 3, 21].
  (2) Table 1 parameter consistency checks: thermal_energy_kbt (4.116e-3 vs 4e-3 pN*um at 25 C),
  persistence_length_actin (17.5 um with Table 1 kBT and 17.005 um with exact 25 C kBT vs 17 um),
  cytoplasm_viscosity_ratio (100x water at 0.001 Pa*s, 112.4x at 25 C water viscosity 0.00089 Pa*s),
  and fiber_aspect_ratio (epsilon = 0.004 for L = 1 um, 0.008 for L = 0.5 um).
  (3) Cross-linker mechanics and site capacity: cl_spring_fluctuation_eq7 (delta_ell = 20 nm exact),
  cl_binding_cutoff_brownian (40 nm), detailed_balance_binding_rate_eq20, max_links_per_fiber_p7
  (verbatim ceil(dsu/cw)*L/dsu = 76.92 vs printed 80) and its corrected variant
  max_links_per_fiber_exact_sites using N_u = L/dsu + 1 from p. 4 (78.92 at 0.026 um; 80 exactly at
  N_u = 40, dsu = 1/39 = 0.02564 um).
  (4) Network geometry: initial_mesh_size (exact reproduction of all 6 simulated (F, L_d, L) -> ell_m
  configurations on pp. 6, 10, 11) and reconstructed g_actin_concentration_from_mesh (15.36 uM at
  370 monomers/um vs 10-15 uM; 14.94 uM at 360 monomers/um).
  (5) Nonlocal slender-body rigid mobility and translational diffusion: reconstructed
  sbt_rigid_mobility_reconstructed (Eqs. 4, 5, 11, 12 with C^1 ellipsoidal-cap regularization over
  delta = 0.1 L, matching all 21 Table S1 entries within 0.2%-0.6% and converging under N refinement),
  rigid_mobility_trace_eq12 (3*alpha + beta = 1.6698 vs 1.67 in Eq. 22; anisotropy ratio 1.650 vs
  asymptotic claim of 2 on p. 9), translational_diffusion_eq22 and
  translational_diffusion_eq22_printed_coeff (6 D_t = 0.1336 um^2/s vs ~0.13 um^2/s), and
  mesh_diffusion_time (tau_m = 0.2994 s vs ~0.30 s for L = 1 um; 0.1727 s vs exact 0.17 s for
  L = 0.5 um, reproduced; speedup ratio 1.733 vs 'factor of two').
  (6) Phenomenological fits, speedup ratios, and scaling laws: percent_in_bundles_single_exp
  (t_50 = 11.78 s vs 12 s; P(16 s) = 60.98% vs 60%), percent_in_bundles_double_exp (t_50 = 3.22 s
  vs about 3 s; t_80 = 9.51 s vs ~8 s), bundle_density_exp_decay (Fig. 3), verbatim
  bundle_density_exp_decay_figS5_printed and its sign-corrected variant
  bundle_density_exp_decay_figS5_corrected (Fig. S5), all speedup ratio checks (4, 4, 2, 3 vs 4,
  2.4), diffusion_limited_bundling_scaling (prefactor: unknown; tau_c ~ ell_m^2 fails on [9, 17, 56]
  s), and linear_length_bundling_scaling (prefactor: unknown; tau_c ~ L).
  (7) Supporting Material Sec. C: analytical gibbs_boltzmann_spring_pdf_eqS13 (mode 0.06275 um,
  peak 22.11 um^-1, mean 0.06381 um, std 0.01786 um), reconstructed two_fiber_local_drag_stability
  (dt_max = 0.00561 s vs printed 0.005 s), and stochastic two_fiber_brownian_strang_sim with dt
  refinement series showing that at dt = 0.0025 s (50% of stability limit), std_x = 0.02227 um is
  24.7% broader than exact Eq. S13 and belongs_to: numerics under 5% tolerance.

  Key discrepancies and findings documented in questions.yaml:
  (1) Fig. S5 legend sign misprint: prints 1.4 e^{(-t-30)/60} and 1.4 e^{(-t-10)/25} instead of
  -(t-30)/60 and -(t-10)/25 (evaluating to 0.515 and 0.629 at t = t_0 vs plotted 1.4; fixed in
  variant bundle_density_exp_decay_figS5_corrected).
  (2) p. 7 max links formula ceil(dsu/cw) * L/dsu gives 76.92 instead of 80 because p. 4 defines
  N_u = L/dsu + 1 sites (N_u = 40 gives dsu = 0.02564 um and 80 links; fixed in variant
  max_links_per_fiber_exact_sites). Also 'Link density = 2C/(LF)' (p. 5) has units 1/um while
  p. 7 and Figs. 2-3 treat it as dimensionless per fiber (numerically equal only for L = 1 um).
  (3) p. 10 and Fig. 4 caption (p. 11) misprint k_on units as (um*s) instead of 1/(um*s).
  (4) Introduction p. 2 inverts the mesh-size trend ('decreases with increasing actin network mesh
  size'), contradicting Abstract, pp. 6 & 11, Fig. 4, and Conclusion p. 14.
  (5) SM p. 19 below Eq. S8 misprints alpha_1 = -Omega . n_2 instead of +Omega . n_2.
  (6) p. 5 cross-references Eq. S10 instead of Eq. S12 for N^{1/2}, and 'To satisfy Eq. 19'
  instead of Eq. 18.
  (7) p. 10 claims the Brownian/non-Brownian tau_c ratio remains unchanged (4x) at F_B = 5, whereas
  Fig. S5 caption (p. 24) reports 3x (30 s vs 10 s).
  (8) p. 11 small-k_on scaling [9, 17, 56] s is not reproduced by tau_c ~ ell_m^2 (doubling ratios
  1.89x and 3.29x rather than 4x).
  (9) SM Sec. C (pp. 20-21) overstates equilibrium accuracy at dt = 0.0025 s (midpoint std_x is
  inflated ~25% by O(dt) Strang-splitting bias, matching Fig. S1 right's ~17.5 vs ~22.1 peak).
  (10) p. 9 states N_tt parallel eigenvalue is 2x perpendicular (true ratio is 1.65 at eps = 0.004).
  (11) Minor inconsistencies: Table 1 lists L_d = 2-4 um while p. 10 uses L_d = 6 um; non-Brownian
  tau_c varies between ~16 s, ~15 s (p. 11), and ~20 s (Fig. 6 caption); ell_m = 0.4 high-k_on
  tau_c is ~3 s (p. 10) vs ~2.5 s (Fig. 5 caption); SM Sec. C calls sigma/L 'CL variance' instead
  of standard deviation.

  Figure catalog (15 figures total; figure digitization is left to the downstream digitize stage):
  - Quantitative plots for downstream digitization:
    * Fig. 2 (p. 8 / 1237): 6-panel bundling statistics vs t for kappa = 0.07, 0.007, rigid (SEM, 5 trials), incl. 100(1 - e^{-t/17}).
    * Fig. 3 (p. 9 / 1238): 6-panel bundling statistics vs t with/without diffusion (SEM, 5 trials) + inset + exponential fits.
    * Fig. 4 (p. 11 / 1240): 3 bundle-density trajectories for ell_m = 0.2, 0.4, 0.8 um (inset on 0.8 um) + 3x3 tau_c heatmap.
    * Fig. 6 (p. 13 / 1242): 6-panel length comparison (L = 0.5 vs 1 um) without (a) and with (b) diffusion (SEM, 5 trials).
    * Fig. 7 (p. 13 / 1242): 2-panel steady-state turnover trajectories vs t/tau_f for tau_f/tau_c = 1/2, 1, 2 (SEM, 5 trials).
    * Fig. S1 (p. 21 / SI-4): 2-panel steady-state spring extension histograms at dt = 5e-4 and 2.5e-3 s with analytical Eq. S13 red curves.
    * Fig. S2 (p. 22 / SI-5): 6-panel domain-size invariance test (L_d = 2, 3, 4 um at ell_m = 0.2 um).
    * Fig. S3 (p. 23 / SI-6): 6-panel bundle-size histograms at t = 5, 10, 16, 25, 40, 60 s.
    * Fig. S4 (p. 24 / SI-7): 3-panel normalized sqrt(MSD) (0.05 s lag) vs t/tau_c for varying k_on and ell_m.
    * Fig. S5 (p. 24 / SI-7): Bundle density vs t for F_B = 5 with/without diffusion and misprinted legend decay fits.
    * Fig. S7 (p. 25 / SI-8): Normalized sqrt(MSD) (0.05 s lag) vs t/tau_c for L = 0.5, 1 um and ell_m = 0.2, 0.4, 0.8 um.
  - Qualitative 3D network snapshots (no curves to digitize):
    * Fig. 1 (p. 7 / 1236): 3-filament and bulk bundling snapshots at t = 5, 10, 20, 40 s.
    * Fig. 5 (p. 12 / 1241): Network snapshots at t = tau_c for ell_m = 0.4 um and varying k_on.
    * Fig. S6 (p. 25 / SI-8): Rigid-fiber network snapshots at t = tau_c without (16 s) and with (4 s) diffusion.
    * Fig. S8 (p. 26 / SI-9): 6-panel turnover steady-state snapshots for tau_f = tau_c/2, tau_c, 2 tau_c.

