id: bundle_density_exp_decay
name: post-peak exponential decay fit to bundle density (Fig. 3)
role: fit
stated:
  page: 10
  printed_page: "1239"
  quote: "difference is only a factor of two; an exponential fit to the de-"
  where: "Fig. 3 legend; text"
equation: "rho_B(t) = A * exp(-(t - t_0) / tau_dec)"
inputs:
  t: {quantity: time, unit: s}
  A: {quantity: bundle_density, unit: 1/um^3}
  t0: {quantity: time, unit: s}
  tau_dec: {quantity: bundling_fit_timescale, unit: s}
outputs:
  rho_B: {quantity: bundle_density, unit: 1/um^3}
settings: {}
stochastic: false
