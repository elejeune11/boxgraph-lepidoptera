id: g_actin_concentration_from_mesh
name: G-actin molar concentration estimated from initial mesh size (reconstructed, p. 6)
role: model
reconstructed: >
  Page 6 states that ell_m = 0.2 um corresponds to 10-15 uM G-actin concentration without printing
  the conversion formula or F-actin linear monomer density; we reconstruct c_G = rho_G / (ell_m^2 * N_A)
  using the standard actin linear monomer density rho_G = 370 monomers/um (added input).
stated:
  page: 6
  printed_page: "1235"
  quote: "corresponds to 10-15 mM G-actin concentration often used in in vitro experiments"
  where: "text"
equation: "c_G = rho_G / (ell_m^2 * N_A)"
inputs:
  ell_m: {quantity: initial_mesh_size, unit: um}
  rho_G: {quantity: actin_linear_monomer_density, unit: 1/um}
outputs:
  c_G: {quantity: g_actin_concentration, unit: uM}
settings: {}
stochastic: false
