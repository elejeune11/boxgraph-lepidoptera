id: detailed_balance_binding_rate_eq20
name: detailed-balance stretch-dependent second-end binding rate (Eqs. 19-20)
role: model
stated:
  page: 5
  printed_page: "1234"
  quote: "where kon;s and koff;s are the transition rates for a link at rest length"
  where: "Eqs. 19-20"
equation: "k_on,s(ell_k') = k_on,s^0 * exp(-K_c * (ell_k' - ell)^2 / (2 k_B T)); k_on,s(ell_k')/k_off,s(ell_k') = (k_on,s^0/k_off,s^0) * exp(-K_c * (ell_k' - ell)^2 / (2 k_B T))"
inputs:
  kons0: {quantity: cl_second_end_binding_rate, unit: 1/(um*s)}
  koffs0: {quantity: cl_unbinding_rate, unit: 1/s}
  Kc: {quantity: cl_spring_stiffness, unit: pN/um}
  ell: {quantity: cl_rest_length, unit: um}
  ell_k: {quantity: cl_stretch_length, unit: um}
  kBT: {quantity: thermal_energy, unit: pN*um}
outputs:
  kons: {quantity: cl_second_end_binding_rate, unit: 1/(um*s)}
  rate_ratio: {quantity: cl_binding_rate_ratio, unit: 1/um}
settings: {}
stochastic: false
