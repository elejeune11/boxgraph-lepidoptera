id: max_links_per_fiber_exact_sites
name: maximum cross-links per fiber using N_u = L/Delta s_u + 1 sites (variant of p. 7)
role: model
variant_of: max_links_per_fiber_p7
corrections:
  - equation: "p. 7 inline formula ceil(Delta s_u / c_w) * L / Delta s_u"
    change: "Replace site count L / Delta s_u with N_u = L / Delta s_u + 1"
    evidence: "Page 4 explicitly defines Delta s_u = L / (N_u - 1), so N_u = L / Delta s_u + 1 sites per fiber (e.g. N_u = 40 gives Delta s_u = 1/39 = 0.02564 um ≈ 0.026 um and 2 * 40 = 80 links, whereas printed L / Delta s_u yields 76.92 even across Table 1's rounding range [0.0255, 0.0265] um)."
stated:
  page: 4
  printed_page: "1233"
  quote: "discretize each fiber into Nu uniformly spaced binding sites with distance Dsu = L=(Nu - 1)"
  where: "text"
equation: "n_max = ceil(Delta s_u / c_w) * (L / Delta s_u + 1)"
inputs:
  dsu: {quantity: binding_site_spacing, unit: um}
  cw: {quantity: binding_site_width, unit: um}
  L: {quantity: fiber_length, unit: um}
outputs:
  n_max: {quantity: max_links_per_fiber, unit: dimensionless}
settings: {}
stochastic: false
