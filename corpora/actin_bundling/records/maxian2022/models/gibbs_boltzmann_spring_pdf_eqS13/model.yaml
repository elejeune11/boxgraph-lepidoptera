id: gibbs_boltzmann_spring_pdf_eqS13
name: equilibrium 3D Gibbs-Boltzmann probability density of cross-linker spring extension (Eq. S13)
role: model
stated:
  page: 20
  printed_page: "SI-3"
  quote: "We expect the steady state probability density function (pdf) to be the Gibbs-Boltzmann distribution"
  where: "Eq. S13"
equation: "P(x) = Z * x^2 * exp(-K_c * (x - ell)^2 / (2 k_B T)), with int_0^inf P(x) dx = 1"
inputs:
  x: {quantity: cl_stretch_length, unit: um}
  Kc: {quantity: cl_spring_stiffness, unit: pN/um}
  ell: {quantity: cl_rest_length, unit: um}
  kBT: {quantity: thermal_energy, unit: pN*um}
outputs:
  pdf: {quantity: spring_extension_pdf, unit: 1/um}
  x_mode: {quantity: mode_spring_extension, unit: um}
  mean_x: {quantity: mean_spring_extension, unit: um}
  std_x: {quantity: std_spring_extension, unit: um}
settings: {}
stochastic: false
