id: bundle_density_exp_decay_figS5_printed
name: post-peak exponential decay fit to F_B=5 bundle density (verbatim Fig. S5 legend)
role: fit
stated:
  page: 24
  printed_page: "SI-7"
  quote: "Comparing Brownian and non-Brownian filaments with a minimum of FB = 5"
  where: "Fig. S5 legend"
equation: "rho_B(t) = A * exp((-t - t_0) / tau_dec)"
inputs:
  t: {quantity: time, unit: s}
  A: {quantity: bundle_density, unit: 1/um^3}
  t0: {quantity: time, unit: s}
  tau_dec: {quantity: bundling_fit_timescale, unit: s}
outputs:
  rho_B: {quantity: bundle_density, unit: 1/um^3}
settings: {}
stochastic: false
