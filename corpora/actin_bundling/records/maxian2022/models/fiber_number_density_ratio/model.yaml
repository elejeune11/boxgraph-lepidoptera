id: fiber_number_density_ratio
name: filament number density ratio at fixed initial mesh size (p. 11)
role: processing
from_words: true
stated:
  page: 11
  printed_page: "1240"
  quote: "filaments are twice as short and there are twice as many of them if"
  where: "text"
equation: "rho_short = F_short / Ld_short^3; rho_long = F_long / Ld_long^3; ratio = rho_short / rho_long"
inputs:
  F_short: {quantity: fiber_count, unit: dimensionless}
  Ld_short: {quantity: domain_extent, unit: um}
  F_long: {quantity: fiber_count, unit: dimensionless}
  Ld_long: {quantity: domain_extent, unit: um}
outputs:
  rho_short: {quantity: fiber_number_density, unit: 1/um^3}
  rho_long: {quantity: fiber_number_density, unit: 1/um^3}
  ratio: {quantity: fiber_density_ratio, unit: dimensionless}
settings: {}
stochastic: false
