id: time_step_stability_fraction
name: time step expressed as percentage of explicit stability limit (Fig. S1, pp. 20-21)
role: processing
from_words: true
stated:
  page: 21
  printed_page: "SI-4"
  quote: "=10% of the stability limit on the left"
  where: "Fig. S1 caption"
equation: "frac_pct = 100 * (Delta t / Delta t_max)"
inputs:
  dt: {quantity: time_step, unit: s}
  dt_max: {quantity: time_step, unit: s}
outputs:
  frac_pct: {quantity: time_step_stability_fraction, unit: percent}
settings: {}
stochastic: false
