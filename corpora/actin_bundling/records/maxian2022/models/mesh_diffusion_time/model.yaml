id: mesh_diffusion_time
name: characteristic time for a rigid fiber to diffuse across one initial mesh size (p. 9)
role: model
stated:
  page: 9
  printed_page: "1238"
  quote: "mesh size is given by t m = l2m /(6Dt )zl2m /0:13 s"
  where: "text"
equation: "tau_m = ell_m^2 / (6 D_t)"
inputs:
  ell_m: {quantity: initial_mesh_size, unit: um}
  six_D_t: {quantity: msd_slope, unit: um^2/s}
outputs:
  tau_m: {quantity: mesh_diffusion_time, unit: s}
settings: {}
stochastic: false
