id: percent_in_bundles_double_exp
name: double-exponential fit to percentage of fibers in bundles with Brownian diffusion (Fig. 3)
role: fit
stated:
  page: 10
  printed_page: "1239"
  quote: "case requires two timescales for fitting, which are 3 s"
  where: "Fig. 3 legend; text"
equation: "P(t) = 100 * (1 - w_1 * exp(-t / tau_1) - (1 - w_1) * exp(-t / tau_2))"
inputs:
  t: {quantity: time, unit: s}
  w1: {quantity: fit_weight, unit: dimensionless}
  tau1: {quantity: bundling_fit_timescale, unit: s}
  tau2: {quantity: bundling_fit_timescale, unit: s}
outputs:
  percent: {quantity: percent_in_bundles, unit: percent}
  t_50: {quantity: half_bundling_time, unit: s}
  t_80: {quantity: eighty_percent_bundling_time, unit: s}
settings: {}
stochastic: false
