id: cl_binding_cutoff_brownian
name: Brownian cross-linker two-sigma binding stretch cutoff (p. 5)
role: model
stated:
  page: 5
  printed_page: "1234"
  quote: "two standard deviations of the Gaussian in Eq. 20"
  where: "text"
equation: "delta_ell_B = 2 * sqrt(k_B T / K_c)"
inputs:
  kBT: {quantity: thermal_energy, unit: pN*um}
  Kc: {quantity: cl_spring_stiffness, unit: pN/um}
outputs:
  delta_ell_B: {quantity: cl_binding_cutoff, unit: um}
settings: {}
stochastic: false
