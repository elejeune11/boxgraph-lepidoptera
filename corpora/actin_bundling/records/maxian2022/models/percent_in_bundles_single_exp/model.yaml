id: percent_in_bundles_single_exp
name: single-exponential fit to percentage of fibers in bundles without diffusion (Figs. 2, 3)
role: fit
stated:
  page: 10
  printed_page: "1239"
  quote: "case, where a single timescale fits the data, the Brownian"
  where: "Fig. 2 legend; Fig. 3 legend; text"
equation: "P(t) = 100 * (1 - exp(-t / tau_1)); t_50 = tau_1 * ln(2)"
inputs:
  t: {quantity: time, unit: s}
  tau1: {quantity: bundling_fit_timescale, unit: s}
outputs:
  percent: {quantity: percent_in_bundles, unit: percent}
  t_50: {quantity: half_bundling_time, unit: s}
settings: {}
stochastic: false
