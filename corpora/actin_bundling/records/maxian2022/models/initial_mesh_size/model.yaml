id: initial_mesh_size
name: initial isotropic filament suspension mesh size (p. 5)
role: model
stated:
  page: 5
  printed_page: "1234"
  quote: "initial mesh size (37) of the suspension"
  where: "text"
equation: "ell_m = sqrt(L_d^3 / (F * L))"
inputs:
  Ld: {quantity: domain_extent, unit: um}
  F: {quantity: fiber_count, unit: dimensionless}
  L: {quantity: fiber_length, unit: um}
outputs:
  ell_m: {quantity: initial_mesh_size, unit: um}
settings: {}
stochastic: false
