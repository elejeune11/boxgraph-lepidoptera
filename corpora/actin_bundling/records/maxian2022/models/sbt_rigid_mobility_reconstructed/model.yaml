id: sbt_rigid_mobility_reconstructed
name: straight rigid fiber mobility coefficients from nonlocal slender-body theory (Eqs. 4, 5, 11, 12; Table S1)
role: model
reconstructed: >
  Eqs. 4, 5, 11, and 12 state the nonlocal slender-body mobility operator and rigid-body Schur
  complement, but cite Maxian et al. (2021) [ref. 21, Sec. 2.1 and Sec. 4.2] for the exact
  functional form of the endpoint regularization over delta = 0.1 L and the matrix discretization
  of M. We reconstruct the endpoint regularization with a C^1 ellipsoidal-cap radius taper
  a(s)^2 = a^2 * s*(2*delta - s) / delta^2 over delta = 0.1 L and exact Legendre finite-part
  quadrature on N Chebyshev Type-1 collocation nodes.
stated:
  page: 4
  printed_page: "1233"
  quote: "The mobility N can be obtained numerically from the slender-body"
  where: "Eqs. 4, 5, 11, 12; Table S1"
equation: "(8 pi mu)(M f)(s) = [c(s)(I + tau tau^T) + (I - 3 tau tau^T)] f(s) + int_0^L [(I + r_hat r_hat^T)/r f(s') - (I + tau tau^T)/|s - s'| f(s)] ds'; N = (K_r^* M^-1 K_r)^dagger; N_tt = (alpha I + beta tau tau^T)/(mu L), N_rr = gamma (I - tau tau^T)/(mu L^3)"
inputs:
  epsilon: {quantity: fiber_aspect_ratio, unit: dimensionless}
  delta_rel: {quantity: relative_regularization_length, unit: dimensionless}
outputs:
  alpha: {quantity: mobility_alpha, unit: dimensionless}
  beta: {quantity: mobility_beta, unit: dimensionless}
  gamma: {quantity: mobility_gamma, unit: dimensionless}
settings:
  N: 16
stochastic: false
