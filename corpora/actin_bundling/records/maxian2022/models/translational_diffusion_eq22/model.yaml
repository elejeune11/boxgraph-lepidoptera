id: translational_diffusion_eq22
name: straight rigid fiber translational diffusion coefficient from mobility matrix (Eqs. 12, 22)
role: model
stated:
  page: 9
  printed_page: "1238"
  quote: "translational diffusion coefficient of a straight fiber, derived in (33)"
  where: "Eq. 22"
equation: "D_t = (k_B T / 3) tr(N_tt) = (k_B T / (3 mu L)) * (3 alpha + beta); 6 D_t = 2 k_B T (3 alpha + beta) / (mu L)"
inputs:
  kBT: {quantity: thermal_energy, unit: pN*um}
  mu: {quantity: dynamic_viscosity, unit: Pa*s}
  L: {quantity: fiber_length, unit: um}
  alpha: {quantity: mobility_alpha, unit: dimensionless}
  beta: {quantity: mobility_beta, unit: dimensionless}
outputs:
  D_t: {quantity: translational_diffusivity, unit: um^2/s}
  six_D_t: {quantity: msd_slope, unit: um^2/s}
settings: {}
stochastic: false
