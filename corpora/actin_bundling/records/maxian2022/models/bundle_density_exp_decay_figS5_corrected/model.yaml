id: bundle_density_exp_decay_figS5_corrected
name: post-peak exponential decay fit to F_B=5 bundle density (sign-corrected variant of Fig. S5)
role: fit
variant_of: bundle_density_exp_decay_figS5_printed
corrections:
  - equation: "Fig. S5 legend (1.4 e^{(-t-30)/60} and 1.4 e^{(-t-10)/25})"
    change: "Replace exponent (-t - t_0)/tau_dec with -(t - t_0)/tau_dec"
    evidence: "Fig. S5 (p. 24) clearly plots the dashed curve starting at rho_B = 1.4 at t = 30 s and the dotted curve starting at rho_B = 1.4 at t = 10 s (matching Fig. 3's 4.7 e^{-(t-16)/40} and 4.7 e^{-(t-5)/20}); the printed (-t - t_0)/tau_dec evaluates to 0.515 and 0.629 at t = t_0."
stated:
  page: 24
  printed_page: "SI-7"
  quote: "Comparing Brownian and non-Brownian filaments with a minimum of FB = 5"
  where: "Fig. S5 legend"
equation: "rho_B(t) = A * exp(-(t - t_0) / tau_dec)"
inputs:
  t: {quantity: time, unit: s}
  A: {quantity: bundle_density, unit: 1/um^3}
  t0: {quantity: time, unit: s}
  tau_dec: {quantity: bundling_fit_timescale, unit: s}
outputs:
  rho_B: {quantity: bundle_density, unit: 1/um^3}
settings: {}
stochastic: false
