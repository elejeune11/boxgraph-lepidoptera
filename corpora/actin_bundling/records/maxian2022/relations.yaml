- id: rel_kierfeld2005_persistence_length_scales_as_actin
  kind: scales_as
  a: maxian2022/persistence_length_actin
  b: kierfeld2005/persistence_length_def
  mapping:
    kappa: "1000000 * kappa"
    T: "1000 * kBT"
  output_map:
    L_p: l_p
  regime:
    kappa: [0.01, 0.2]
    kBT: [0.003, 0.005]
  provenance: proposed
  reason: >
    Both models relate semiflexible filament persistence length to bending rigidity and thermal energy
    with identical scaling exponents (+1 in kappa, -1 in k_B T), while differing by the exact factor-of-2
    dimensionality convention between 3D wormlike chains in maxian2022 (l_p = kappa / (k_B T)) and
    2D planar (d = 1+1) wormlike chains in kierfeld2005 (L_p = 2 * kappa / T).
  assumptions:
    - "Unit conversion: 1 pN*um^2 = 10^6 pN*nm^2 and 1 pN*um = 10^3 pN*nm."
    - "Dimensionality factor L_p^(2D) / l_p^(3D) = 2."

- id: rel_weirich2017_ellipsoid_diff_same_as_eq22_coeff
  kind: same_as
  a: weirich2017/stokes_einstein_ellipsoid_diffusion
  b: maxian2022/translational_diffusion_eq22_printed_coeff
  mapping:
    kBT: "1.380649e-5 * T"
    mu: "eta"
    L: "2 * L / 1000"
    c_tr: "log(2 * L / r) / pi"
  output_map:
    D_t: D
  regime:
    T: [290.0, 310.0]
    L: [50.0, 1000.0]
    r: [2.0, 6.0]
    eta: [0.001, 5.0]
  provenance: proposed
  reason: >
    Identifies Weirich et al. (2017)'s prolate-ellipsoid Stokes-Einstein diffusivity
    D = k_B T * ln(2 L / r) / (6 pi eta L) (with semi-major half-length L = L_f / 2) as the
    leading-order slender-body limit c_tr = ln(L_f / r) / pi = ln(1 / epsilon) / pi of
    Maxian et al. (2022) Eq. (22) D_t = (k_B T / (3 mu L_f)) * c_tr. For Table S1 actin
    (eps = 0.004), ln(250)/pi = 1.7575 exceeds the full regularized-SBT value c_tr = 1.6698 by +5.3%
    due to O(1) finite-part hydrodynamic drag corrections.
  assumptions:
    - "Weirich et al. L denotes filament half-length L_f / 2 (in nm); Maxian et al. L denotes full length L_f (in um)."
    - "k_B = 1.380649e-5 pN*um/K."

- id: rel_weirich2017_ellipsoid_diff_same_as_eq22_asymptotic
  kind: same_as
  a: weirich2017/stokes_einstein_ellipsoid_diffusion
  b: maxian2022/translational_diffusion_eq22
  mapping:
    kBT: "1.380649e-5 * T"
    mu: "eta"
    L: "2 * L / 1000"
    alpha: "log(2 * L / r) / (4 * pi)"
    beta: "log(2 * L / r) / (4 * pi)"
  output_map:
    D_t: D
  regime:
    T: [290.0, 310.0]
    L: [50.0, 1000.0]
    r: [2.0, 6.0]
    eta: [0.001, 5.0]
  provenance: proposed
  reason: >
    Maps Weirich et al. (2017)'s prolate-ellipsoid diffusivity directly onto Maxian et al. (2022)
    Eq. (22)'s anisotropic (alpha, beta) decomposition in the leading-order slender-rod limit
    alpha = beta = ln(1 / eps) / (4 pi) (where parallel/perpendicular mobility ratio (alpha + beta)/alpha = 2,
    matching the asymptotic limit invoked on maxian2022 p. 9, vs finite-eps Table S1 ratio 1.650 at eps = 0.004).
  assumptions:
    - "Leading-order slender-rod asymptotic limit alpha = beta = ln(L_f / r) / (4 pi)."

- id: rel_freedman2019_persistence_length_same_as_actin
  kind: same_as
  a: freedman2019/persistence_length_from_kappa_b
  b: maxian2022/persistence_length_actin
  mapping:
    kappa: "kappa_B"
    kBT: "1.380649e-5 * T"
  output_map:
    l_p: L_p
  regime:
    kappa_B: [0.01, 0.5]
    T: [290.0, 310.0]
  provenance: proposed
  reason: >
    Identical 3D wormlike-chain persistence-length relation L_p = kappa / (k_B T) used for F-actin
    (l_p = 17 um) in both Freedman et al. (2019) and Maxian et al. (2022).

- id: rel_freedman2019_stokes_diff_same_as_eq22_hydrodynamic_radius
  kind: same_as
  a: maxian2022/translational_diffusion_eq22_printed_coeff
  b: freedman2019/stokes_mobility_si_eq6
  mapping:
    R: "L / (2 * pi * c_tr)"
    nu: "mu"
    T: "kBT / 1.380649e-5"
  output_map:
    D: D_t
  regime:
    kBT: [0.003, 0.005]
    mu: [0.001, 1.0]
    L: [0.5, 2.0]
    c_tr: [1.2, 2.2]
  provenance: proposed
  reason: >
    Both models express 3D overdamped translational diffusion via the Stokes-Einstein relation
    D = k_B T * M; matching Maxian et al. (2022) Eq. (22)'s orientation-averaged slender-rod
    diffusivity D_t = k_B T * c_tr / (3 mu L) to Freedman et al. (2019) SI Eq. (6)'s spherical bead
    diffusivity D = k_B T / (6 pi nu R) defines the exact equivalent hydrodynamic radius
    R_H = L / (2 pi c_tr) (giving R_H = 0.0953 um for L = 1 um, c_tr = 1.67 actin filaments).

- id: rel_freedman2019_switching_rate_scales_as_eq20
  kind: scales_as
  a: maxian2022/detailed_balance_binding_rate_eq20
  b: freedman2019/switching_rate_1d_model
  mapping:
    mu_on_same: "kons0"
    epsilon_kBT: "Kc * (ell_k - ell)**2 / (2 * kBT)"
  output_map:
    mu_on_diff: kons
  regime:
    kons0: [10.0, 100.0]
    koffs0: [0.5, 2.0]
    Kc: [5.0, 20.0]
    ell: [0.04, 0.06]
    ell_k: [0.065, 0.09]
    kBT: [0.003, 0.005]
  provenance: proposed
  reason: >
    Both Maxian et al. (2022) Eq. (20) (cross-linker spring stretching energy U_stretch / k_B T =
    K_c (ell_k - ell)^2 / (2 k_B T)) and Freedman et al. (2019) 1D switching kinetics (filament
    gap-bending energy barrier epsilon / k_B T) suppress cross-linker binding via the identical
    Boltzmann kinetic factor k_on = k_on^0 * exp(-Delta U_mech / k_B T), differing only in rate
    normalization (per-length 1/(um*s) in maxian2022 Eq. 20 vs per-site 1/s in freedman2019).

