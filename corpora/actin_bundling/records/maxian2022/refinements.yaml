- id: ref_sbt_N_alpha
  run: run_sbt_eps0004_single
  setting: N
  factors: [1, 2, 4]
  mode: multiply
  output: alpha
  tolerance: "0.0001"
  tolerance_basis: "added: matches the 4-decimal printed precision of Table S1 (0.4575)"
  tolerance_added: true

- id: ref_sbt_N_gamma
  run: run_sbt_eps0004_single
  setting: N
  factors: [1, 2, 4]
  mode: multiply
  output: gamma
  tolerance: "0.001"
  tolerance_basis: "added: tight relative precision (~0.02%) against Table S1's 4-decimal gamma (4.3073)"
  tolerance_added: true

- id: ref_local_drag_N_dtmax
  run: run_local_drag_stability_sm_c
  setting: N
  factors: [1, 2, 4]
  mode: multiply
  output: dt_max
  tolerance: "1%"
  tolerance_basis: "added: well inside the 1-sig-fig printed precision of Delta t = 0.005 s"
  tolerance_added: true

- id: ref_two_fiber_bd_dt_std
  run: run_two_fiber_bd_large_dt
  setting: dt
  factors: [1, 2, 4, 8]
  mode: divide
  output: std_x
  tolerance: "5%"
  tolerance_basis: "added: tests SM Sec. C's claim (pp. 20-21) that Delta t = 0.0025 s (50% of stability limit) reproduces the equilibrium Gibbs-Boltzmann width within 5%"
  tolerance_added: true

- id: ref_two_fiber_bd_dt_mean
  run: run_two_fiber_bd_large_dt
  setting: dt
  factors: [1, 2, 4, 8]
  mode: divide
  output: mean_x
  tolerance: "2%"
  tolerance_basis: "added: tests convergence of the equilibrium mean spring extension from Delta t = 0.0025 s to smaller time steps"
  tolerance_added: true
