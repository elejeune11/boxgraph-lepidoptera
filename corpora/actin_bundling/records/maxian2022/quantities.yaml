- id: fiber_radius
  name: actin fiber radius
  dimension: "[length]"
  description: Cross-sectional radius a of an actin filament.

- id: fiber_length
  name: actin fiber length
  dimension: "[length]"
  description: Contour length L of a single actin filament.

- id: fiber_aspect_ratio
  name: fiber aspect ratio
  dimension: "dimensionless"
  description: Slenderness aspect ratio epsilon = a / L of an actin filament.

- id: fiber_count
  name: number of fibers
  dimension: "dimensionless"
  description: Total number F of actin filaments in the periodic simulation box.

- id: domain_extent
  name: simulated domain extent
  dimension: "[length]"
  description: Side length L_d of the periodic cubic simulation cell.

- id: dynamic_viscosity
  name: fluid dynamic viscosity
  dimension: "[mass] / [length] / [time]"
  description: Dynamic viscosity mu of the suspending medium (cytoplasm or water).

- id: viscosity_ratio
  name: viscosity ratio to water
  dimension: "dimensionless"
  description: Ratio of suspending cytoplasm viscosity mu to water viscosity mu_water.

- id: bending_stiffness
  name: fiber bending stiffness
  dimension: "[force] * [length] ** 2"
  description: Flexural rigidity kappa of an actin filament.

- id: persistence_length
  name: fiber persistence length
  dimension: "[length]"
  description: Thermal persistence length l_p = kappa / (k_B T) of an actin filament.

- id: cl_spring_stiffness
  name: cross-linker spring stiffness
  dimension: "[force] / [length]"
  description: Hookean elastic spring stiffness K_c of a cross-linker.

- id: cl_rest_length
  name: cross-linker rest length
  dimension: "[length]"
  description: Equilibrium rest length ell of a cross-linker spring.

- id: cl_length_fluctuation
  name: cross-linker thermal length fluctuation
  dimension: "[length]"
  description: Characteristic thermal length stretch scale delta_ell = sqrt(k_B T / K_c) of a cross-linker spring.

- id: cl_binding_cutoff
  name: Brownian cross-linker binding stretch cutoff
  dimension: "[length]"
  description: Maximum allowed link stretch delta_ell_B = 2 * sqrt(k_B T / K_c) used to search binding pairs in Brownian simulations.

- id: cl_stretch_length
  name: cross-linker instantaneous length
  dimension: "[length]"
  description: Instantaneous end-to-end distance x or ell_k of a cross-linker spring connecting two filaments.

- id: cl_first_end_binding_rate
  name: cross-linker first-end binding rate per unit length
  dimension: "1 / [length] / [time]"
  description: Coarse-grained binding rate k_on of one cross-linker end per unit filament arclength.

- id: cl_second_end_binding_rate
  name: cross-linker second-end binding rate per unit length
  dimension: "1 / [length] / [time]"
  description: Binding rate k_on,s (or rest-length value k_on,s^0) of the second end of a singly bound cross-linker.

- id: cl_unbinding_rate
  name: cross-linker unbinding rate
  dimension: "1 / [time]"
  description: Unbinding rate k_off (singly bound) or k_off,s (doubly bound) of a cross-linker end.

- id: cl_binding_rate_ratio
  name: cross-linker detailed-balance rate ratio
  dimension: "1 / [length]"
  description: Ratio k_on,s(ell_k') / k_off,s(ell_k') constrained by detailed balance in Eqs. 18-19.

- id: binding_site_width
  name: actin-binding site steric width
  dimension: "[length]"
  description: Cross-linker width c_w setting maximum bound cross-linkers per binding site.

- id: binding_site_spacing
  name: uniform binding site spacing
  dimension: "[length]"
  description: Uniform arclength spacing Delta s_u = L / (N_u - 1) between discrete binding sites on a fiber.

- id: binding_site_count
  name: number of binding sites per fiber
  dimension: "dimensionless"
  description: Number N_u of uniformly spaced discrete binding sites along a filament.

- id: max_links_per_fiber
  name: maximum cross-links per fiber
  dimension: "dimensionless"
  description: Saturation maximum number of bound cross-link ends per fiber determined by steric site cap and binding site count.

- id: thermal_energy
  name: thermal energy
  dimension: "[energy]"
  description: Thermal energy scale k_B T.

- id: temperature
  name: absolute temperature
  dimension: "[temperature]"
  description: Thermodynamic temperature T of the suspension.

- id: chebyshev_points
  name: number of Chebyshev collocation points
  dimension: "dimensionless"
  description: Number N of Chebyshev nodes used to discretize each fiber centerline.

- id: time_step
  name: integration time step
  dimension: "[time]"
  description: Numerical time step size Delta t (or stability limit Delta t_max).

- id: relative_regularization_length
  name: dimensionless endpoint regularization length
  dimension: "dimensionless"
  description: Ratio delta / L of the slender-body endpoint regularization length to fiber length.

- id: relative_gaussian_width
  name: dimensionless Gaussian force-spreading width
  dimension: "dimensionless"
  description: Ratio sigma / L of the Gaussian kernel standard deviation in Eq. 6 to fiber length.

- id: initial_mesh_size
  name: initial actin network mesh size
  dimension: "[length]"
  description: Characteristic filament spacing ell_m = sqrt(L_d^3 / (F L)) of an initially isotropic unbundled suspension.

- id: g_actin_concentration
  name: G-actin molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Equivalent monomeric G-actin concentration corresponding to the simulated F-actin density.

- id: actin_linear_monomer_density
  name: F-actin linear monomer density
  dimension: "1 / [length]"
  description: Number of G-actin monomers per unit F-actin filament contour length.

- id: mobility_alpha
  name: perpendicular translational mobility coefficient
  dimension: "dimensionless"
  description: Dimensionless rigid-rod perpendicular translational mobility coefficient alpha(epsilon) in Eq. 12 and Eq. S12.

- id: mobility_beta
  name: anisotropic translational mobility coefficient
  dimension: "dimensionless"
  description: Dimensionless rigid-rod parallel-excess translational mobility coefficient beta(epsilon) in Eq. 12 and Eq. S12.

- id: mobility_gamma
  name: rotational mobility coefficient
  dimension: "dimensionless"
  description: Dimensionless rigid-rod rotational mobility coefficient gamma(epsilon) in Eq. 12 and Eq. S12.

- id: mobility_trace_coefficient
  name: translational mobility trace coefficient
  dimension: "dimensionless"
  description: Dimensionless trace factor mu * L * tr(N_tt) = 3 * alpha + beta appearing in Eq. 22.

- id: mobility_anisotropy_ratio
  name: parallel-to-perpendicular mobility eigenvalue ratio
  dimension: "dimensionless"
  description: Ratio (alpha + beta) / alpha of the parallel and perpendicular eigenvalues of N_tt.

- id: translational_diffusivity
  name: center-of-mass translational diffusion coefficient
  dimension: "[length] ** 2 / [time]"
  description: Orientation-averaged 3D translational diffusion coefficient D_t = (k_B T / 3) tr(N_tt) of a straight rigid fiber (Eq. 22).

- id: msd_slope
  name: 3D mean-square-displacement rate
  dimension: "[length] ** 2 / [time]"
  description: Rate 6 D_t of 3D center-of-mass mean square displacement <r^2(t)> = 6 D_t t.

- id: mesh_diffusion_time
  name: mesh-size diffusion time
  dimension: "[time]"
  description: Characteristic time tau_m = ell_m^2 / (6 D_t) for a freely diffusing rigid fiber to diffuse one initial mesh size.

- id: time
  name: simulation time
  dimension: "[time]"
  description: Elapsed time t during network bundling or equilibration.

- id: bundling_time
  name: critical bundling coalescence time
  dimension: "[time]"
  description: Critical bundling timescale tau_c defined as the time of maximum bundle density (composite bundle state).

- id: turnover_time
  name: mean filament turnover lifetime
  dimension: "[time]"
  description: Mean actin filament lifetime tau_f in simulations with filament turnover.

- id: half_bundling_time
  name: time to reach 50 percent of fibers in bundles
  dimension: "[time]"
  description: Time t_50 required for 50% of filaments to be in bundles.

- id: eighty_percent_bundling_time
  name: time to reach 80 percent of fibers in bundles
  dimension: "[time]"
  description: Time t_80 required for 80% of filaments to be in bundles.

- id: bundling_fit_timescale
  name: exponential bundling fit timescale
  dimension: "[time]"
  description: Characteristic exponential relaxation timescale in fits to percentage of fibers in bundles or decaying bundle density.

- id: fit_weight
  name: exponential component weight
  dimension: "dimensionless"
  description: Amplitude fraction w_1 of the fast exponential mode in the double-exponential fit to percentage of fibers in bundles.

- id: percent_in_bundles
  name: percentage of fibers in bundles
  dimension: "dimensionless"
  description: Percentage of filaments connected to at least one other filament by two cross-links separated by at least d_bund = L/4.

- id: bundle_density
  name: bundle number density
  dimension: "1 / [length] ** 3"
  description: Number of bundles per unit volume B / L_d^3 for bundles of at least F_B filaments.

- id: min_bundle_size
  name: minimum filaments per bundle
  dimension: "dimensionless"
  description: Threshold number F_B of connected filaments required to count a connected component as a bundle.

- id: timescale_ratio
  name: bundling or diffusion timescale ratio
  dimension: "dimensionless"
  description: Ratio of two characteristic timescales (e.g. non-Brownian to Brownian speedup ratio, or turnover-to-bundling ratio tau_f / tau_c).

- id: spring_extension_pdf
  name: steady-state spring extension probability density
  dimension: "1 / [length]"
  description: Equilibrium probability density P(x) of the 3D end-to-end distance x of a cross-linker spring (Eq. S13).

- id: mean_spring_extension
  name: mean steady-state spring extension
  dimension: "[length]"
  description: Equilibrium or simulated time-averaged mean end-to-end distance <x> of a cross-linker spring.

- id: std_spring_extension
  name: standard deviation of steady-state spring extension
  dimension: "[length]"
  description: Equilibrium or simulated standard deviation sigma_x of the end-to-end distance x of a cross-linker spring.

- id: mode_spring_extension
  name: mode of steady-state spring extension
  dimension: "[length]"
  description: Most probable spring end-to-end distance x_mode maximizing Eq. S13.

- id: orientation_parameter
  name: bundle nematic orientation parameter
  dimension: "dimensionless"
  description: Maximum eigenvalue of the bundle tangent covariance matrix Q in Eq. 21, taking values in [1/3, 1].

- id: binding_rate_relative
  name: relative cross-linker binding rate
  dimension: "dimensionless"
  description: Ratio k_on / k_on^(0) of first-end binding rate to base value k_on^(0) = 5 1/(um*s).

- id: fiber_number_density
  name: filament number density
  dimension: "1 / [length] ** 3"
  description: Number of actin filaments per unit volume F / L_d^3 in the periodic simulation box.

- id: fiber_density_ratio
  name: filament number density ratio
  dimension: "dimensionless"
  description: Ratio of filament number densities (F / L_d^3) between shorter- and longer-filament networks at fixed initial mesh size.

- id: time_step_stability_fraction
  name: integration time step as percentage of stability limit
  dimension: "dimensionless"
  description: Ratio 100 * Delta t / Delta t_max expressing a simulation time step as a percentage of the explicit stability limit.

- id: link_density_per_fiber
  name: cross-link density per fiber
  dimension: "dimensionless"
  description: Mean number of cross-linker ends bound per actin filament (plotted as 'Link density (per fiber)' in Figs. 2, 3, and S2).

- id: mean_bundle_size
  name: mean bundle size
  dimension: "dimensionless"
  description: Average number of actin filaments per bundle across all bundles (Figs. 2, 3, 6, S2).

- id: max_bundle_size
  name: maximum bundle size
  dimension: "dimensionless"
  description: Number of actin filaments in the largest bundle in the simulation domain (Figs. 2, 3, S2).

- id: bundle_size
  name: bundle size
  dimension: "dimensionless"
  description: Number of filaments in a bundle (or logarithmically binned bundle-size bin center in Fig. S3).

- id: percent_fibers_in_bundle_size
  name: percentage of fibers in bundles of given size
  dimension: "dimensionless"
  description: Percentage of all filaments belonging to bundles of a given size or size bin (Fig. S3).

- id: normalized_time_by_tau_f
  name: time normalized by filament turnover lifetime
  dimension: "dimensionless"
  description: Dimensionless elapsed time t / tau_f normalized by the mean filament lifetime tau_f (Fig. 7).

- id: normalized_time_by_tau_c
  name: time normalized by critical bundling time
  dimension: "dimensionless"
  description: Dimensionless elapsed time t / tau_c normalized by the critical bundling coalescence time tau_c (Figs. S4, S7).

- id: normalized_rms_displacement
  name: normalized root-mean-square fiber center displacement
  dimension: "dimensionless"
  description: Square root of average fiber-center mean square displacement over a 0.05 s lag, normalized by the free-space diffusion value for a fiber of the same length (Figs. S4, S7).


