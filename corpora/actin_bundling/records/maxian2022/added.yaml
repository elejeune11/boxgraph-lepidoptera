- id: mu_water_added
  quantity: dynamic_viscosity
  unit: Pa*s
  printed: "0.001"
  basis: Standard room-temperature (20 degC) viscosity of liquid water used to check Table 1's note '100 x water'; at 25 degC (Table 1's stated temperature for k_B T), water viscosity is 0.00089 Pa*s.
  alternatives: ["0.00089"]
  stands_for: "water viscosity in Table 1 Note '100 x water'"

- id: rho_g_actin_added
  quantity: actin_linear_monomer_density
  unit: 1/um
  printed: "370"
  basis: Standard F-actin helical monomer density (~2.70 nm per monomer, 370 monomers/um) used to convert F-actin contour length density 1/ell_m^2 to G-actin molar concentration for p. 6's '10-15 uM' claim.
  alternatives: ["360", "377"]
  stands_for: "G-actin monomers per um of F-actin contour length (unstated on p. 6)"

- id: x_test_rest_added
  quantity: cl_stretch_length
  unit: nm
  printed: "50"
  basis: Cross-linker rest length ell = 50 nm (Table 1) used as a canonical evaluation point for Eq. 20 and Eq. S13.
  alternatives: ["70", "90"]
  stands_for: "evaluation link length ell_k' in Eq. 20 and x in Eq. S13"
