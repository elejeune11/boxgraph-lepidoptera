  inputs: {tau_dec_nb: fit_figS5_tau_dec_nb, tau_dec_b: fit_figS5_tau_dec_b}
  outputs: {ratio: speedup_coalescence_FB5_computed}

- id: run_scaling_small_kon_lm2
  model: diffusion_limited_bundling_scaling
  inputs: {}
  sweep: {ell_m: tau_c_small_kon_vs_lm}
  outputs: {tau_c: tau_c_small_kon_lm2_pred}

- id: run_scaling_length_linear
  model: linear_length_bundling_scaling
  inputs: {}
  sweep: {L: tau_c_vs_length_b}
  outputs: {tau_c: tau_c_length_linear_pred}

# =============================================================================
# Supporting Material Section C: Eq. S13, local-drag stability, 2-fiber BD
# =============================================================================
- id: run_eqS13_gibbs_boltzmann
  model: gibbs_boltzmann_spring_pdf_eqS13
  inputs:
    x: x_test_rest_added
    Kc: cl_spring_stiffness_Kc
    ell: cl_rest_length_ell
    kBT: thermal_energy_kBT_table1
  outputs:
    pdf: eqS13_pdf_at_rest
    x_mode: eqS13_x_mode
    mean_x: eqS13_mean_x
    std_x: eqS13_std_x

- id: run_local_drag_stability_sm_c
  model: two_fiber_local_drag_stability
  inputs:
    epsilon: fiber_aspect_ratio_0004_printed
    delta_rel: endpoint_reg_delta_rel
    Kc: cl_spring_stiffness_Kc
    mu: cytoplasm_viscosity_mu
    L: fiber_length_L_1
  settings: {N: 50}
  outputs:
    alpha: loc_alpha_sm_c
    beta: loc_beta_sm_c
    gamma: loc_gamma_sm_c
    dt_max: dt_max_sm_c_pred

- id: run_two_fiber_bd_small_dt
  model: two_fiber_brownian_strang_sim
  inputs:
    alpha: loc_alpha_sm_c
    beta: loc_beta_sm_c
    gamma: loc_gamma_sm_c
    Kc: cl_spring_stiffness_Kc
    ell: cl_rest_length_ell
    mu: cytoplasm_viscosity_mu
    L: fiber_length_L_1
    kBT: thermal_energy_kBT_table1
  settings: {dt: 0.0005, t_max: 100.0, burn_t: 1.0, seed: 0}
  replicates: 5
  outputs:
    mean_x: bd_small_dt_mean_x
    std_x: bd_small_dt_std_x

- id: run_two_fiber_bd_large_dt
  model: two_fiber_brownian_strang_sim
  inputs:
    alpha: loc_alpha_sm_c
    beta: loc_beta_sm_c
    gamma: loc_gamma_sm_c
    Kc: cl_spring_stiffness_Kc
    ell: cl_rest_length_ell
    mu: cytoplasm_viscosity_mu
    L: fiber_length_L_1
    kBT: thermal_energy_kBT_table1
  settings: {dt: 0.0025, t_max: 100.0, burn_t: 1.0, seed: 0}
  replicates: 5
  outputs:
    mean_x: bd_large_dt_mean_x
    std_x: bd_large_dt_std_x

