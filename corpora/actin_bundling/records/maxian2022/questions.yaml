- id: q_eq17_detailed_balance_unit_mismatch
  kind: possible_error
  about: [detailed_balance_binding_rate_eq20, cl_second_end_kons, cl_koffs]
  text: >
    Table 1 (p. 6) gives k_on,s = 50 1/(um*s) (a rate per unit length) and k_off,s = 1 1/s
    (a rate per second). On p. 4, the text explicitly multiplies the first-end binding rate by
    binding-site spacing (k_on * Delta s_u per second), but omits Delta s_u for the second end
    ('can bind to a nearby fiber with rate k_on,s'). Likewise, detailed balance Eq. 17 (p. 5),
    P_eq(C, x) k_on,s(ell_k') = P_eq(C', x) k_off,s(ell_k'), equates probabilities of discrete
    link configurations C and C' at fixed fiber positions x, requiring both transition rates to
    have dimensions 1/s (i.e. site-level rate k_on,s * Delta s_u) unless the prefactor ratio
    zeta(C')/zeta(C) in Eq. 18 absorbs Delta s_u.
