  text: >
    Cross-record relate and validate audit across all 9 paired actin_bundling records finds 28 verified
    ModelAtlas relations in `relations.yaml` (22 with maxian2022_code, 1 with kierfeld2005, 2 with
    weirich2017, 3 with freedman2019), 0 new `cited.yaml` links, and 0 genuine `validations.yaml`
    entries:
    (1) Why 0 `validations.yaml` entries: 5 partners (maxian2022_code, borukhov2005, kierfeld2005,
    chandrasekaran2019, popov2016) have 0 `origin: measured` empirical datums; bathe2008 (6 measured)
    and claessens2006 (18 measured) measure wormlike-bundle bending stiffness kappa_B(N) and droplet
    ring radii/fuzzy diameters/equilibration times; weirich2017 (35 measured) measures liquid-crystal
    tactoid aspect ratios, coalescence lengths/times, capillary wavelengths, and FRAP fluorescence
    intensity (its `D_frap_est` and `mesh_size_dilute_main` are `origin: estimated` with `~` and no
    precision, and `eta_frap_est` was inferred from `D_frap_est`); freedman2019 (8 measured) measures
    TIRF polymerization rates and fascin/alpha-actinin sorting domain lengths. None of maxian2022's
    models predicts any of these experimental observables.
    (2) Key shared-physics links that cannot be entered as same-output runnable relations:
    (a) `maxian2022` Eq. (21) orientation parameter `q = max eig((1/(b L)) sum int tau tau^T ds)` in
    `[1/3, 1]` (non-runnable in maxian2022; audited in `maxian2022_code/bundle_detection_adapter`) maps
    linearly to the traceless 3D nematic order parameter `S = (3/2)(q - 1/3)` in `[0, 1]` of
    `popov2016/nematic_order_parameter_eq14` and `chandrasekaran2019/nematic_order_parameter_eqS18`;
    (b) `maxian2022/persistence_length_actin` (`l_p = kappa / k_B T`, output `[length]`) is the exact
    algebraic inverse of `claessens2006/bending_stiffness_persistence` (`kappa_a = l_p * k_B T`, output
    `[force]*[length]^2`), and similarly `maxian2022/mesh_diffusion_time` (`tau_m = ell_m^2 / (6 D_t)`,
    output `[time]`) is the inverse of `popov2016/kuramoto_length_s2eq1` (`l_k = sqrt(6 D tau)`, output
    `[length]`), while F-actin mass balance `F*L/V = c_F * N_A * l_mon` links `maxian2022` (`ell_m`, `c_G`)
    with `claessens2006/droplet_filament_count` (`L_tot`) and `popov2016/mean_filament_length_mass_balance`
    (`L_mean`) across complementary solved variables;
    (c) `popov2016/alpha_actinin_slip_bond_s3eq6` and `chandrasekaran2019/crosslinker_slip_bond_unbinding_eqS15`
    model force-enhanced Bell slip-bond unbinding (`k_off ~ exp(F / F_0)`), physically contrasting with
    `maxian2022` Eq. (20)'s force-independent `k_off` and harmonic Boltzmann binding penalty
    `k_on ~ exp(-K_c (r - ell)^2 / (2 k_B T))`.
