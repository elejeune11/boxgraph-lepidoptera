- id: q_max_links_per_fiber_discrepancy
  kind: possible_error
  about: [max_links_per_fiber_p7, max_links_per_fiber_exact_sites, max_links_per_fiber_printed, cmp_max_links_p7_printed, cmp_max_links_exact_sites_variant]
  text: >
    Page 7 writes that the number of links per fiber approaches the maximum
    ceil(Delta s_u / c_w) * L / Delta s_u = 80. Using Table 1 values (Delta s_u = 0.026 um,
    c_w = 20 nm, L = 1 um), the printed formula gives 2 * (1 / 0.026) = 76.92 (even across
    Table 1's rounding range [0.0255, 0.0265] um it spans [75.47, 78.43], never reaching 80).
    However, p. 4 defines Delta s_u = L / (N_u - 1), so there are N_u = L / Delta s_u + 1
    binding sites including both endpoints: for N_u = 40 sites, Delta s_u = 1/39 = 0.02564 um
    (rounding to 0.026 um in Table 1) and 2 * N_u = 80 exactly. Our variant
    max_links_per_fiber_exact_sites reproduces 80 within Table 1's rounding. Note also a minor
    dimensional slip: p. 5 defines 'Link density = 2C/(LF)' (units 1/um), whereas p. 7 and
    Figs. 2-3 treat it as dimensionless links per fiber (numerically identical only for L = 1 um).
  citation:
    page: 7
    printed_page: "1236"
    quote: "approach the maximum of dDsu =cw e L=Dsu = 80"
    where: "text"

