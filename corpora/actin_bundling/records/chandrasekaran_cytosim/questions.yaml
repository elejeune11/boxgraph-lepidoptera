- id: q_vasp_stokes_vs_couple_diffusion_contradiction
  kind: possible_error
  about: [cytosim_sphere_solid_bead_diffusion, cytosim_semi_implicit_langevin_1d, paper_vasp_radius, paper_vasp_diffusion_rate, paper_vasp_valency, paper_boundary_stiffness_vasp, cmp_vasp_stokes_D_vs_paper, cmp_vasp_meca_free_D_vs_paper, cmp_vasp_couple_uniform_D_vs_paper]
  text: >
    Major architectural contradiction between chandrasekaran2024's VASP specification and CytoSim's
    C++ object classes (deepening chandrasekaran2024/q_viscosity_unit_and_50x_water_error).
    chandrasekaran2024 specifies VASP tetramers as 30 nm spheres with 4 surface actin-binding sites,
    boundary confinement stiffness 100 pN/um, steric repulsion (radius 30 nm, stiffness 1.0 pN/um),
    droplet viscosity 0.5 pN*s/um^2, AND diffusion rate 10 um^2/s. In CytoSim C++: (1) a Couple
    accepts an independent diffusion = 10 (couple_prop.cc:146, moving via uniform steps
    [-sqrt(6*D*dt), +sqrt(6*D*dt)]), but has only 2 hands (not 4), zero steric interactions
    (meca_steric.cc only iterates fibers, spheres, beads, solids), and explicitly throws an error
    if confine[1] stiffness is set (couple_prop.cc:100); (2) a Sphere or Solid supports radius 30 nm,
    4 surface Wrist Singles, confine = inside 100, and sterics, but NEITHER SphereProp nor SolidProp
    accepts a diffusion parameter — both hardcode Stokes' law drag = 6*pi*eta*R (sphere.cc:282,
    solid.cc:1289; Solid also ignores SolidProp::drag, which only Bead reads at bead.cc:132), giving
    D = kT/(6*pi*0.5*0.03) = 0.01485 um^2/s (673x slower than 10 um^2/s, or 67x slower even at
    0.05 Pa*s)! (3) Crucially, SingleProp parses diffusion = 10 without error (single_prop.cc:131),
    and Wrist's guard checking p->diffusion > 0 is commented out under '#if ( 0 )' (wrist.cc:19-22),
    while Wrist::stepF() (wrist.cc:55-60) NEVER calls diffuse() — meaning setting diffusion = 10 on
    the 4 VASP Wrist Singles is silently ignored! Achieving D = 10 um^2/s on a 30 nm Sphere/Solid
    would require overriding per-class viscosity to 7.43e-4 pN*s/um^2 (lower than pure water!).
  citation:
    file: src/sim/sphere.cc
    lines: "280-284"
    quote: "spDrag    = ( 6 * M_PI ) * vr;"

