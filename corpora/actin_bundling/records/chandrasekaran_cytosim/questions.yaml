- id: q_eq1_mu_and_semi_implicit_meca
  kind: possible_error
  about: [cytosim_semi_implicit_langevin_1d, cmp_semi_implicit_var_vs_boltzmann]
  text: >
    CytoSim's Meca::solve() (src/sim/meca.cc:522-564) and Bead::addBrownianForces() (bead.cc:109-119)
    confirm chandrasekaran2024/q_eq1_mu_called_viscosity: the coefficient multiplying force in
    overdamped Langevin dynamics is mobility = 1/drag (um/(pN*s)), not solvent viscosity. Moreover,
    chandrasekaran2024 Eq. (1) omits three actual CytoSim numerical features: (1) inextensibility and
    rigid-body constraint projection P (meca.cc:528); (2) semi-implicit linear solve
    (I - dt*mu*P*M)(X_new - X_old) = dt*mu*P*(F + Noise) (meca.cc:552), which damps harmonic-trap
    stationary variance by 1/(1 + 0.5*mu*k*dt) (a ~26% reduction for a 30 nm sphere at mu = 3.54
    um/(pN*s), k = 100 pN/um, dt = 0.002 s); and (3) uniform [-sqrt(6*D*dt), +sqrt(6*D*dt)] stepping
    (rather than Gaussian Langevin noise) for free diffusing Couples and Singles (couple_prop.cc:146,
    single_prop.cc:207).
  citation:
    file: src/sim/meca.cc
    lines: "550-556"
    quote: "( I - time_step * mobP * M ) ( Xnew - Xold ) = time_step * mobP * ( F + Noise )"

