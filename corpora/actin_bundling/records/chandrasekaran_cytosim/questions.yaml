- id: q_hidden_fiber_drag_radius_default
  kind: unstated_input
  about: [cyto_default_drag_radius, cyto_default_drag_length, cyto_tirado_ct_code, cyto_tirado_ct_doc, cytosim_fiber_drag_and_brownian, run_fiber_drag_default_radius, run_fiber_drag_actin_radius]
  text: >
    chandrasekaran2024 does not specify fiber:drag_radius or fiber:drag_length in Supplementary
    Table 2. CytoSim's built-in default is FiberProp::drag_radius = 0.0125 um (a microtubule radius,
    src/sim/fiber_prop.cc:307) with drag_length = 5 um (line 308), whereas actin has radius 3.5 nm
    (explicitly overridden in cym/arp23.cym:31 but omitted in cym/actin.cym). Leaving drag_radius at
    default increases a 2*pi-um filament's cylindrical drag by +22.7% (5.27 vs 4.30 pN*s/um; +74.6%
    for a 0.1 um seed filament). Additionally, Fiber::dragCoefficientCylinder() hardcodes end-correction
    0.32 on line 988 while its docstring on line 956 cites Tirado & de la Torre (1979)'s 0.312.
  citation:
    file: src/sim/fiber_prop.cc
    lines: "307-308"
    quote: "drag_radius = 0.0125;  // radius of a Microtubule"

- id: q_steric_global_stiffness_and_ultrasoft_barrier
  kind: choice
  about: [cytosim_steric_repulsion, paper_actin_steric_stiffness, cyto_cym_bundle_steric_push, run_steric_actin_actin, run_steric_vasp_vasp, run_steric_actin_cyto_example]
  text: >
    Two hidden CytoSim steric mechanics findings: (1) In CytoSim, repulsive steric stiffness
    steric_stiff_push[0] is a single global SimulProp parameter (simul_prop.cc:93, meca_steric.cc:80)
    applied to all pairwise interactions (with cutoff d0 = r1 + r2, locus_grid.cc:99,123,404), NOT
    independently configurable for actin vs VASP (though chandrasekaran2024 lists 1.0 pN/um for both).
    (2) A stiffness of 1.0 pN/um is 10,000x softer than CytoSim's bundled actin bundle example
    (cym/bundle_steric.cym:10 uses steric = 1, 10000): under CytoSim's exact potential
    E = 0.5*k*(d0 - d)^2 (fiber_prop.h:270), complete actin-actin overlap (d0 = 7 nm) creates a
    maximum force of only 0.007 pN and a barrier of 0.0058 kT (VASP-VASP complete overlap at d0 =
    60 nm gives 0.06 pN and 0.43 kT < 1 kT), allowing easy thermal interpenetration rather than
    hard excluded volume.
  citation:
    file: src/sim/meca_steric.cc
    lines: "79-83"
    quote: "locusGrid.stiffness(prp.steric_stiff_push[0]);"

- id: q_monomer_depletion_and_nucleator_settled
  kind: reading
  about: [cytosim_polymerization_ratchet_depletion, cytosim_nucleation_monomer_depletion_sim, nucleated_fiber_init_length_added, cmp_figs6c_max_length_depletion, cmp_figs6b_nuc50_timeseries, cmp_figs6b_nuc150_timeseries]
  text: >
    Settles chandrasekaran2024/q_monomer_depletion_per_filament_vs_total and explains Supplementary
    Fig. 6B-C quantitatively. CytoSim's FiberSet::steps() (fiber_set.cc:239) computes
    free_polymer = max(0, 1 - used_polymer/total_polymer) and GrowingFiber::step() (growing_fiber.cc:72)
    advances EACH filament at growing_speed * free_polymer (no N_fil multiplier), proving Supp.
    Table 4's k_grow*N_fil*(1 - [F]/[T]) denotes the total network growth rate, not per-filament speed.
    Furthermore, CytoSim's Nucleator defaults to hold_end = MINUS_END (nucleator_prop.cc:33), so each
    unbound nucleator fires rapidly at 0.2/s (producing an initial ~0.95*N_nuc burst in ~10 s) and
    remains bound/inactive until detaching at unbinding_rate = 0.005/s (Single::stepA, single.cc:148).
    Porting these exact C++ rules reproduces both Supp. Fig. 6B filament-count curves (12/12 points
    across 50 and 150 nM) and Supp. Fig. 6C upper filament lengths across 0..150 nM (with minor
    sensitivity to the unstated initial length of newly nucleated fibers, nucleated_fiber_init_length_added,
    and minor wall-force Brownian ratchet slowdown). Also confirms GrowingFiber::step() uses a
    one-sided Brownian ratchet clamp: only antagonistic force (projectedForceEndP() < 0) scales speed
    by exp(force / growing_force), while tensile force (>= 0) leaves speed unchanged.
  citation:
    file: src/sim/fiber_set.cc
    lines: "238-248"
    quote: "fp->free_polymer = 1.0 - fp->used_polymer / fp->total_polymer;"

- id: q_unstated_crosslinker_stiffness_and_hand_kinetics
  kind: unstated_input
  about: [cytosim_hand_binding_unbinding, cytosim_hand_gillespie_mc, crosslinker_stiffness_probe_added, cyto_check_stiffness_kT_limit, cmp_hand_gillespie_mc_vs_discrete]
  text: >
    chandrasekaran2024 omits the crosslinker spring stiffness (SingleProp::stiffness or
    CoupleProp::stiffness), even though link force F = stiffness*||d|| directly drives Bell's law
    unbinding in Hand::checkKramersDetachment() (hand.h:286-302). At binding_range = 30 nm and
    kT = 0.0042 pN*um, CytoSim's HandProp::checkStiffness() (hand_prop.cc:314-333) warns of
    thermodynamically unfavorable binding (stiffness*r_bind^2/kT > 10) whenever stiffness > 46.7
    pN/um (reaching 21.4 kT at 100 pN/um). Four additional hidden C++ kinetic details are documented:
    (1) binding_prob = -expm1(-k_bind*dt) (hand_prop.cc:247, 0.99% below k_bind*dt at 10/s, dt = 2 ms);
    (2) FiberGrid::tryToAttach() (BIND_CLOSEST_FIBER = 1, fiber_grid.cc:374-393) tests every segment
    within binding_range from closest to farthest, so M nearby segments increase total attachment
    probability to 1 - exp(-M*k_bind*dt); (3) Couple::stepFF() flips a coin (couple.cc:175-178) that
    halves a free Couple's first-binding rate, whereas 4 Wrist Singles on a Sphere/Solid all attempt
    binding every step; and (4) discrete-step float32 Gillespie subtraction in checkKramersDetachment()
    adds an upward mean lifetime bias E[tau] = dt/(1 - exp(-k_off*dt)) (~+0.16% at 5 pN, +2.0% at
    30 pN for k_unbind0 = 1/s, and +21% at 30 pN for k_unbind0 = 10/s).
  citation:
    file: src/sim/hand_prop.cc
    lines: "314-323"
    quote: "real en = ( stiff * dis * dis ) / kT;"

- id: q_bending_resegmentation_and_endpoint_correction
  kind: numerics
  about: [cytosim_fiber_bending_mechanics, cmp_bending_cyto_vs_continuum]
  text: >
    CytoSim's Chain::adjustSegmentation() (chain.cc:36-40,1351-1371) chooses N_seg to minimize
    |L/N_seg - segmentation|, so actual segment length s fluctuates over (2/3, 4/3)*segmentation
    during filament growth (s = 0.09973 um with N_seg = 63 at L = 2*pi um, segmentation = 0.1 um).
    Furthermore, Mecafil::addRigidity() (mecafil.cc:276-313) with iRigidity = rigidity/s^3
    (fiber.cc:1097) differentiates the quadratic Hamiltonian over N_seg - 1 interior hinges
    (0.23188 pN*um for an inextensible chord-spaced 2*pi ring, 1.59% or 1/63 below continuum
    0.5*kappa*L/R^2 = 0.23562 pN*um), whereas Fiber::bendingEnergy() (chain.cc:1190) multiplies
    by N_seg/(N_seg - 1) to report 0.23562 pN*um (identical to continuum for chord-spaced circular
    vertices).
  citation:
    file: src/sim/chain.cc
    lines: "1186-1190"
    quote: "e *= ( lsp + 1 ) / ( fnCut * lsp );"

- id: q_confinement_sphere_vs_ellipse_and_all_inside
  kind: choice
  about: [cytosim_confinement_sphere_ellipse, cmp_ellipse_thomsen_vs_exact_surface]
  text: >
    CytoSim's SpaceSphere::setConfinement() (space_sphere.cc:99 -> Meca::addSphereClamp) and
    SpaceEllipse's inherited Space::setConfinement() (space.cc:359-367 -> Newton projectEllipsoid()
    + Meca::addPlaneClamp) both produce the exact normal Hookean restoring force F = stiff * delta at
    the current position X = W. However, two subtle C++ differences exist: (1) during the implicit
    linear solve, SpaceSphere retains full spherical curvature in addSphereClamp while SpaceEllipse
    linearizes onto a flat tangent plane via addPlaneClamp (and SpaceEllipse::surface() uses Knud
    Thomsen p = 1.6075, giving 13.5225 vs 13.5306 um^2, -0.060% below exact prolate area at AR = 2);
    and (2) chandrasekaran2024 does not specify whether VASP spheres used confine = inside (center
    inside R) or confine = all_inside (entire 30 nm sphere inside R - 30 nm, sphere.cc:336-341,
    space_sphere.cc:103-107).
  citation:
    file: src/sim/space.cc
    lines: "359-367"
    quote: "meca.addPlaneClamp(mp, dir, -dot(prj,dir), stiff/n);"

