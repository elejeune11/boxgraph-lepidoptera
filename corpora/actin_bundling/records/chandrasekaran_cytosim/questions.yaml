- id: q_source_data_nucleator_burst_and_excess_polymer
  kind: unexplained_difference
  about:
    - cytosim_nucleation_monomer_depletion_sim
    - cytosim_polymerization_ratchet_depletion
    - cytosim_fiber_bending_mechanics
    - chandrasekaran_source_data/nucleator_timecourse_reader
    - chandrasekaran_source_data/nucleator_conc_sweep_reader
  text: >
    Direct cross-attachment check of CytoSim's ported Nucleator/depletion mechanics against raw
    Excel Source Data sheets FigureS10B (8 concentrations x 601 timepoints) and FigureS10C (full
    99-bin filament-length CDFs) yields two confirmations and a new quantitative discrepancy not
    visible from upper-tail figure digitization alone: (1) FigureS10B confirms CytoSim's 2-state
    hold_end = MINUS_END cycle across all 8 concentrations from the 1-s burst through t = 600 s
    (t = 600 s counts within -1.6% to +2.1%; 4,093/4,197 nonzero-SD points within 2 SD; e.g., at
    150 nM, t = 1, 10, 100, 600 s give 98.5 vs 97 +/- 11, 361.9 vs 362 +/- 5, 574.1 vs 574 +/- 11,
    1496.0 vs 1488 +/- 36), and its constant late-time nucleation rate (179-193 filaments/100 s
    across t = 100..600 s at 150 nM, vs theoretical 184.4/100 s) empirically confirms that
    Nucleator::stepUnattached() (nucleator.cc:171-201) never gates nucleation on free_polymer;
    (2) at 0 nM (30 seeds only), FigureS10C spans 5.515..5.712 um (median 5.581 um, CDF = 0.96 at
    5.659 um) versus the force-free CytoSim depletion ceiling 5.692-5.702 um (dl = 2.7-2.75 nm,
    total_polymer = 942.5-959.9 um), resolving a ~2.0% downward spread from CytoSim's one-sided
    Brownian ratchet under wall confinement; (3) however, for [Nucleator] >= 75 nM, combining
    FigureS10B N(585 s) with FigureS10C's CDF mean length E[L] yields total polymerized contour
    length 1,010.5 um (75 nM), 1,099.8 um (100 nM), 1,184.6 um (125 nM), and 1,246.6 um (150 nM,
    or 1,198.6 um using conservative left bin edges) — up to +32% above [T-actin] = 138.38 uM
    (942.5 um at 2.7 nm/monomer) — while every nucleator CDF (10..150 nM) is strictly 0.0 for
    L <= 0.1313 um before jumping abruptly in [0.1313, 0.1970) um (22.5% at 150 nM) and shows a
    150 nM median (0.684 um) >2x the unfiltered 942.5 um model (0.315-0.337 um). This points to
    either post-processing exclusion of 2-vertex fibers (L < 4/3 * segmentation = 0.1333 um from
    Chain::bestNumberOfPoints(), chain.cc:36-40) from FigureS10C, a larger total_polymer / nonzero
    L_nuc_init overshoot after free_polymer clamps to 0 in the unreleased .cym config, or both.
  citation:
    file: src/sim/hands/nucleator.cc
    lines: "176-185"
    quote: "float damp = 1.f - float(fip->nbFibers()) * prop()->nucleation_limit;"

