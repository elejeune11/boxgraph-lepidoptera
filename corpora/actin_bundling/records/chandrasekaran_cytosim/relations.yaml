  reason: "Above CytoSim's hydrodynamic cutoff length (L >= drag_length, which includes a full 2*pi-um ring at default drag_length = 5 um), cylindrical drag scales purely linearly with viscosity * L, so fiber CoM Brownian displacement std dev scales identically as sqrt(kT * dt / (viscosity * L)) with chandrasekaran2024/brownian_noise_from_mobility."

