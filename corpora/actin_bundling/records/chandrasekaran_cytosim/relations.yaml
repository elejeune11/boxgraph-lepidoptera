  b: chandrasekaran2024/stokes_einstein_diffusion
  mapping:
    kBT: "1000 * kT"
    eta: "viscosity"
    r: "radius"
  output_map:
    D_SE: D_stokes
  regime:
    radius: [5.0, 100.0]
    viscosity: [0.001, 2.0]
    kT: [0.0035, 0.005]
    dt: [0.0005, 0.01]
    D_prescribed: [0.01, 20.0]
  provenance: proposed
  reason: "CytoSim Sphere::setDragCoefficient() (sphere.cc:280-284) and Solid::setDragCoefficient() (solid.cc:1289) hardcode Stokes drag 6*pi*eta*R, making D_stokes = kT/(6*pi*eta*R) symbolically identical to chandrasekaran2024/stokes_einstein_diffusion (confirming the 673x VASP diffusion discrepancy)."

