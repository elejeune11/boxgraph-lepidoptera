  reason: "In the slender-rod regime (L > 2*drag_radius*exp(0.68)), CytoSim fiber center-of-mass diffusivity D_com = kT / drag_total matches chandrasekaran2024/einstein_diffusion_relation with Tirado-de la Torre cutoff mobility mu = (ln(0.5*min(L, drag_length)/drag_radius) + 0.32) / (3*pi*viscosity*L)."

