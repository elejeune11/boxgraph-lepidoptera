# ModelAtlas relations between CytoSim C++ source ports (chandrasekaran_cytosim)
# and printed/from-words models in chandrasekaran2024 (Nat. Commun. 15, 3139, 2024).
#
# Structure:
# - Section 1: Relations explicitly stated in CytoSim C++ source comments/code (provenance: stated).
# - Section 2: Mathematically/physically justified relations across all six CytoSim physics domains
#   (sterics, confinement, Bell/Gillespie hand kinetics, drag & Langevin diffusion, Brownian ratchet
#   & monomer depletion, and coupled nucleation/depletion dynamics; provenance: proposed).
#
# Note on chandrasekaran_source_data:
# - 0 mathematical ModelAtlas relations between chandrasekaran_cytosim (10 ported C++ physics models)
#   and chandrasekaran_source_data (20 `role: processing`, `software: true` Excel workbook readers
#   performing fixed-sheet lookups/interpolations on 41467_2024_46726_MOESM9_ESM.xlsx). Empirical
#   validation of CytoSim physics predictions against raw Source Data measurements is handled
#   separately via cross-record validations, with cross-attachment findings recorded in questions.yaml.

# ---------------------------------------------------------------------------
# 1. Stated in CytoSim C++ source
# ---------------------------------------------------------------------------
- id: rel_cyto_fiber_drag_sphere_limit
  kind: reduces_to
  a: chandrasekaran_cytosim/cytosim_fiber_drag_and_brownian
  b: chandrasekaran_cytosim/cytosim_sphere_solid_bead_diffusion
  mapping:
    radius: "1000 * drag_radius"
    viscosity: "viscosity"
    kT: "kT"
    dt: "dt"
    D_prescribed: "10"
  output_map:
    drag_trans: drag_total
  limit:
    L: "0"
  regime:
    L: [0.05, 5.0]
    segmentation: [0.05, 0.2]
    viscosity: [0.001, 2.0]
    viscosity_water: [0.001, 0.001]
    drag_radius: [0.003, 0.015]
    drag_length: [2.0, 10.0]
    kT: [0.0035, 0.005]
    dt: [0.0005, 0.005]
  provenance: stated
  citation:
    file: src/sim/fiber.cc
    lines: "958-964"
    quote: "Hence we also calculate the drag of a sphere with"
    where: "Fiber::dragCoefficientCylinder()"
  assumptions:
    - "Below min_len = 2 * drag_radius * exp(0.68), Fiber::dragCoefficientCylinder() clamps cylindrical drag to spherical Stokes drag 6*pi*viscosity*drag_radius."

- id: rel_cyto_couple_halfwidth_scales_brownian
  kind: scales_as
  a: chandrasekaran_cytosim/cytosim_sphere_solid_bead_diffusion
  b: chandrasekaran2024/brownian_noise_stddev
  mapping:
    D: "D_prescribed"
    dt: "dt"
  output_map:
    sigma_B: halfwidth_uniform_couple
  regime:
    radius: [5.0, 100.0]
    viscosity: [0.001, 2.0]
    kT: [0.0035, 0.005]
    dt: [0.0005, 0.01]
    D_prescribed: [0.01, 20.0]
  provenance: stated
  citation:
    file: src/sim/couple_prop.cc
    lines: "140-146"
    quote: "and we need `diffusion_dt^2 = 6 D time_step`"
    where: "CoupleProp::complete()"
  assumptions:
    - "CytoSim Couple::diffuse() uniform step half-width sqrt(6*D*dt) scales identically as sqrt(D*dt) with Gaussian Brownian std dev sqrt(2*D*dt), differing by the constant factor sqrt(3) because Var(U[-1,1]) = 1/3."

# ---------------------------------------------------------------------------
# 2. Steric repulsion & spherical/ellipsoidal confinement
# ---------------------------------------------------------------------------
- id: rel_cyto_steric_harmonic_force
  kind: same_as
  a: chandrasekaran_cytosim/cytosim_steric_repulsion
  b: chandrasekaran2024/harmonic_repulsion_force
  mapping:
    k_spring: "k_push"
    delta: "r1 + r2 - d"
  output_map:
    F: F_repulsive
  regime:
    r1: [3.5, 30.0]
    r2: [3.5, 30.0]
    d: [0.5, 6.5]
    k_push: [1.0, 10000.0]
    kT: [0.0035, 0.005]
  provenance: proposed
  reason: "In the overlapping regime 0 < d < r1 + r2 (above CytoSim's REAL_EPSILON^0.5 = 1e-3 nm singularity guard in locus_grid.cc:82), CytoSim's repulsive steric force k_push*(r1 + r2 - d) equals chandrasekaran2024/harmonic_repulsion_force with overlap delta = r1 + r2 - d."

- id: rel_cyto_ellipse_pole_confinement_force
  kind: same_as
  a: chandrasekaran_cytosim/cytosim_confinement_sphere_ellipse
  b: chandrasekaran2024/harmonic_repulsion_force
  mapping:
    k_spring: "stiff"
    delta: "excursion"
  output_map:
    F: F_ellipse_pole
  regime:
    R_sphere: [0.5, 3.0]
    a_z: [1.1, 4.0]
    b_xy: [0.3, 1.0]
    excursion: [1.0, 100.0]
    stiff: [10.0, 500.0]
  provenance: proposed
  reason: "At the Z pole (0, 0, a_z + excursion) of a prolate SpaceEllipse, CytoSim's Newton ellipsoid projection (project_ellipse.cc:154-254) plus tangent-plane clamp (space.cc:359-367) recovers the exact normal Hookean restoring force stiff * excursion."

- id: rel_cyto_ellipse_surface_exact
  kind: same_as
  a: chandrasekaran_cytosim/cytosim_confinement_sphere_ellipse
  b: chandrasekaran2024/prolate_spheroid_volume_conserving
  mapping:
    a: "a_z"
    R_drop: "(a_z * b_xy**2)**(1/3)"
  output_map:
    surface_area: surface_exact
  regime:
    R_sphere: [0.5, 2.0]
    a_z: [1.1, 3.5]
    b_xy: [0.3, 1.0]
    excursion: [1.0, 50.0]
    stiff: [50.0, 300.0]
  provenance: proposed
  reason: "Under the equal-volume sphere radius R_drop = (a_z * b_xy^2)^(1/3), the exact analytical prolate spheroid surface area in cytosim_confinement_sphere_ellipse matches chandrasekaran2024/prolate_spheroid_volume_conserving identically."

- id: rel_cyto_ellipse_thomsen_approx
  kind: approximated_by
  a: chandrasekaran2024/prolate_spheroid_volume_conserving
  b: chandrasekaran_cytosim/cytosim_confinement_sphere_ellipse
  mapping:
    R_sphere: "R_drop"
    a_z: "a"
    b_xy: "sqrt(R_drop**3 / a)"
    excursion: "10"
    stiff: "200"
  output_map:
    surface_thomsen: surface_area
  regime:
    a: [1.1, 3.14]
    R_drop: [0.8, 1.0]
  tolerance: 0.01
  provenance: proposed
  reason: "CytoSim SpaceEllipse::surface() (space_ellipse.cc:112-118) approximates exact prolate spheroid surface area using Knud Thomsen's formula (p = 1.6075), which holds within 1% across the constant-volume droplet deformation regime (aspect ratios up to ~7.8)."

