- id: rel_cyto_brownian_ratchet_assisting_discrepancy
  kind: same_as
  a: chandrasekaran2024/brownian_ratchet_growth_rate
  b: chandrasekaran_cytosim/cytosim_polymerization_ratchet_depletion
  mapping:
    growing_speed: "k_grow"
    growing_force: "f_grow"
    projected_force: "-f"
    used_polymer: "0"
    total_polymer: "1000"
    n_filaments: "30"
    L0: "0.1"
    R_drop: "1"
  output_map:
    v_per_filament: v
  regime:
    k_grow: [5.0, 20.0]
    f: [-10.0, -0.5]
    f_grow: [5.0, 15.0]
  provenance: proposed
  reason: "Tests assisting/tensile tip forces (f < 0, projected_force = -f > 0) in the undepleted limit: unclipped k_grow*exp(-f/f_grow) accelerates exponentially under tension, whereas CytoSim GrowingFiber::step() (growing_fiber.cc:75: 'if ((forceP < 0) & (addP > 0))') applies a one-sided clamp (no acceleration for tensile loads), yielding an honest refutation."

