# --- Global simulation defaults (src/sim/simul_prop.h, src/sim/simul_prop.cc) ---
- id: cyto_default_viscosity
  quantity: dynamic_viscosity
  unit: pN*s/um^2
  origin: reported
  printed: "1"
  citation:
    file: src/sim/simul_prop.cc
    lines: "24"
    quote: "viscosity = 1;"
  note: "CytoSim default ambient viscosity = 1 pN*s/um^2 (= 1 Pa*s; unit explicitly documented in src/sim/simul_prop.h:83 and doc/sim/units.md:7)."

- id: cyto_water_viscosity_doc
  quantity: dynamic_viscosity
  unit: pN*s/um^2
  origin: reported
