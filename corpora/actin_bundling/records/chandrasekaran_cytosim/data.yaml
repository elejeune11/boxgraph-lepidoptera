    lines: "308"
    quote: "drag_length = 5;"
  note: "Default hydrodynamic cutoff length fiber:drag_length = 5 um in Fiber::dragCoefficientCylinder()."

- id: cyto_fiber_drag_prefactor
  quantity: dimensionless_factor
  unit: dimensionless
  origin: reported
  printed: "3"
  citation:
    file: src/sim/fiber.cc
    lines: "884"
    quote: "constexpr real DRAG = 3;"
  note: "Orientation-averaged cylindrical drag prefactor DRAG = 3 (yielding 3*pi*eta*L / (ln(L/(2r)) + 0.32))."

- id: cyto_tirado_ct_code
  quantity: dimensionless_factor
  unit: dimensionless
  origin: reported
  printed: "0.32"
  citation:
    file: src/sim/fiber.cc
    lines: "988"
    quote: "const real drag_cylinder = DRAG * len / ( std::log(0.5*lenc/prop->drag_radius) + 0.32 );"
  note: "Hardcoded Tirado-de la Torre end-correction constant 0.32 in Fiber::dragCoefficientCylinder() (differs slightly from 0.312 cited in the docstring on line 956)."

- id: cyto_tirado_ct_doc
  quantity: dimensionless_factor
  unit: dimensionless
  origin: reported
  printed: "0.312"
  citation:
    file: src/sim/fiber.cc
    lines: "956"
    quote: "drag_cylinder = 3 * PI * viscosity * length / ( log(shape) + 0.312 );"
  note: "Tirado & de la Torre (1979) infinite-aspect-ratio constant 0.312 printed in comment, vs 0.32 implemented on line 988."

# --- Hand, Couple & Single kinetics / diffusion constants ---
- id: cyto_pool_unattached
  quantity: dimensionless_factor
  unit: dimensionless
  origin: reported
  printed: "1"
  citation:
    file: src/sim/hand_prop.h
    lines: "27"
    quote: "#define POOL_UNATTACHED 1"
  note: "Default compile-time pooling factor POOL_UNATTACHED = 1 (unpooled single-step attachment trials)."

- id: cyto_check_stiffness_kT_limit
  quantity: energy_in_kbt
  unit: dimensionless
  origin: reported
  printed: "10.0"
  citation:
    file: src/sim/hand_prop.cc
    lines: "319"
    quote: "if ( en > 10.0 && binding_rate > 0 )"
  note: "Thermodynamic warning threshold stiffness * (binding_range - length)^2 / kT > 10 in HandProp::checkStiffness()."

- id: cyto_check_stiffness_unbind_limit
  quantity: dimensionless_factor
  unit: dimensionless
  origin: reported
  printed: "10.0"
  citation:
    file: src/sim/hand_prop.cc
    lines: "327"
    quote: "if ( ap > 10.0 )"
  note: "Immediate-unbinding warning threshold exp(stiffness * (binding_range - length) / unbinding_force) > 10 in HandProp::checkStiffness()."

- id: cyto_couple_min_loop_default
  quantity: filament_length
  unit: um
  origin: reported
  printed: "1"
  citation:
    file: src/sim/couple_prop.cc
    lines: "48"
    quote: "min_loop       = 1;"
  note: "Default CoupleProp::min_loop = 1 um preventing both hands of a Couple from binding within 1 um on the same fiber."

- id: cyto_couple_diffusion_uniform_factor
  quantity: dimensionless_factor
  unit: dimensionless
  origin: reported
  printed: "6.0"
  citation:
    file: src/sim/couple_prop.cc
    lines: "146"
    quote: "diffusion_dt = std::sqrt(6.0 * diffusion * time_step(sim) * POOL_UNATTACHED);"
  note: "Uniform-distribution diffusion step half-width sqrt(6*D*dt) for free Couples (and Singles, single_prop.cc:207), yielding Var(dx) = 2*D*dt via Uniform[-1, 1] rather than Gaussian noise."

