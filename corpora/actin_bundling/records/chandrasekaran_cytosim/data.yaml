    quote: "Water                 |  0.001    |"
  note: "Reference water viscosity 0.001 pN*s/um^2 (= 1 mPa*s) tabulated in SimulProp::viscosity documentation; confirms chandrasekaran2024's 0.5 pN*s/um^2 is 500x water rather than '50x water'."

- id: cyto_default_kT
