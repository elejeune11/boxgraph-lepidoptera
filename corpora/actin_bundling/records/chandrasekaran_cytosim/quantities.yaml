- id: dynamic_viscosity
  name: dynamic shear viscosity
  dimension: "[mass] / [length] / [time]"
  description: Dynamic viscosity eta of the solvent or droplet medium in CytoSim (units pN*s/um^2 = Pa*s).

- id: viscosity_ratio
  name: droplet-to-water viscosity ratio
  dimension: dimensionless
  description: Dimensionless ratio eta_drop / eta_water of droplet viscosity relative to water (0.001 Pa*s).

- id: thermal_energy
  name: thermal energy scale
  dimension: "[energy]"
  description: Thermal energy k_B T (CytoSim default 0.0042 pN*um = 4.2 pN*nm).

- id: boltzmann_constant
  name: Boltzmann constant
  dimension: "[energy] / [temperature]"
  description: Boltzmann constant k_B used by CytoSim to convert Kelvin temperature to thermal energy kT.

- id: time_step
  name: numerical integration time step
  dimension: "[time]"
  description: Simulation time step dt (simul:time_step).

- id: time
  name: elapsed simulation time
  dimension: "[time]"
  description: Physical simulation duration t or growth timescale.

- id: solver_tolerance
  name: linear solver convergence tolerance
  dimension: dimensionless
  description: Dimensionless tolerance multiplier relative to minimum Brownian displacement in Meca::solve().

- id: probability
  name: single-step event probability or threshold
  dimension: dimensionless
  description: Discrete-time attachment/unbinding probability per time step or CytoSim acceptable_prob warning threshold.

- id: flexural_rigidity
  name: filament flexural rigidity
  dimension: "[force] * [length] ** 2"
  description: Bending elasticity modulus kappa = l_p * k_B T (fiber:rigidity in pN*um^2).

- id: discrete_rigidity_modulus
  name: discrete bending rigidity spring constant
  dimension: "[force] / [length]"
  description: Per-vertex discrete bending modulus iRigidity = rigidity / s^3 used in Mecafil::addRigidity().

- id: bending_energy
  name: filament bending energy
  dimension: "[energy]"
  description: Elastic bending energy of a curved filament (discrete Hamiltonian, CytoSim endpoint-corrected bendingEnergy(), or continuum 1/2 kappa L / R^2).

- id: persistence_length
  name: filament persistence length
  dimension: "[length]"
  description: Thermal persistence length l_p = rigidity / kT.

- id: filament_length
  name: filament contour length
  dimension: "[length]"
  description: Contour length of an F-actin filament (initial seed length, nucleated fiber length, current length, or maximum length).

- id: filament_segment_length
  name: discretized filament segment length
  dimension: "[length]"
  description: Requested target segmentation length (fiber:segmentation) or actual segment length s = L / N_seg after Chain::adjustSegmentation().

- id: filament_count
  name: actin filament count
  dimension: dimensionless
  description: Number of actin filaments N_fil in the simulation.

- id: segment_count
  name: filament segment count
  dimension: dimensionless
  description: Number of rigid segments N_seg = N_pts - 1 discretizing a filament in CytoSim.

- id: point_count
  name: filament vertex count
  dimension: dimensionless
  description: Number of vertices N_pts = bestNumberOfPoints(L / segmentation) discretizing a filament in CytoSim.

- id: particle_radius
  name: steric or hydrodynamic particle radius
  dimension: "[length]"
  description: Cross-sectional radius of a filament (steric_radius or drag_radius) or spherical radius of a VASP Sphere/Solid/Bead.

- id: hydrodynamic_cutoff_length
  name: fiber hydrodynamic drag cutoff length
  dimension: "[length]"
  description: Length cutoff fiber:drag_length above which cylindrical drag scales linearly with contour length.

- id: drag_coefficient
  name: translational viscous drag coefficient
  dimension: "[force] * [time] / [length]"
  description: Translational drag coefficient gamma = F / v of a fiber or spherical particle.

- id: rotational_drag_coefficient
  name: rotational viscous drag coefficient
  dimension: "[force] * [length] * [time]"
  description: Rotational drag coefficient gamma_rot = 8 * pi * eta * R^3 of a spherical particle in CytoSim.

- id: mobility
  name: translational mobility
  dimension: "[length] / [force] / [time]"
  description: Inverse drag coefficient mu = 1 / gamma (or per-vertex fiber mobility iPointMobility = N_pts / gamma).

- id: diffusion_coefficient
  name: translational diffusion coefficient
  dimension: "[length] ** 2 / [time]"
  description: Translational diffusivity D = kT / gamma (Stokes-Einstein) or prescribed Couple/Single diffusion coefficient.

- id: displacement
  name: spatial displacement or separation
  dimension: "[length]"
  description: Brownian step amplitude/std, steric separation/overlap, boundary excursion, or uniform step half-width.

- id: variance_position
  name: positional variance
  dimension: "[length] ** 2"
  description: Mean squared displacement or stationary positional variance Var(x) of a trapped Brownian particle.

- id: force
  name: mechanical force
  dimension: "[force]"
  description: Applied load, steric repulsion force, confinement force, Brownian ratchet force, Bell characteristic unbinding force, or bending node force.

- id: spring_stiffness
  name: linear Hookean spring stiffness
  dimension: "[force] / [length]"
  description: Linear spring stiffness for steric repulsion (steric_stiff_push), space confinement (confine_stiff), or crosslinker link (stiffness).

- id: interaction_energy
  name: mechanical interaction potential energy
  dimension: "[energy]"
  description: Potential energy E = 1/2 k delta^2 of a steric overlap or harmonic link.

- id: energy_in_kbt
  name: dimensionless energy in thermal units
  dimension: dimensionless
  description: Dimensionless energy ratio E / kT (including HandProp::checkStiffness criterion k * r_bind^2 / kT).

- id: binding_rate
  name: binding or nucleation rate
  dimension: "1 / [time]"
  description: First-order attachment rate hand:binding_rate or nucleation rate nucleator:rate.

- id: unbinding_rate
  name: unbinding rate
  dimension: "1 / [time]"
  description: Zero-force or load-dependent detachment rate hand:unbinding_rate * exp(F / f_u).

- id: residence_time
  name: mean bound lifetime
  dimension: "[time]"
  description: Continuum (1 / k_off) or discrete-step Gillespie mean bound lifetime of a Hand.

- id: binding_distance
  name: crosslinker binding capture distance
  dimension: "[length]"
  description: Capture radius hand:binding_range within which a Hand can attach to a fiber segment.

- id: binding_section_rate
  name: 3D binding cross-section rate per unit fiber length
  dimension: "[length] ** 2 / [time]"
  description: HandProp::bindingSectionRate() = pi * binding_range^2 * binding_rate in 3D.

- id: binding_valency
  name: crosslinker binding valency
  dimension: dimensionless
  description: Number of actin-binding sites per crosslinker molecule (4 for VASP tetramer; 2 for CytoSim Couple).

- id: elongation_rate
  name: single-filament actin elongation speed
  dimension: "[length] / [time]"
  description: Barbed-end growth speed growing_speed of one filament (before or after free_polymer and Brownian ratchet factors).

- id: network_elongation_rate
  name: total network actin contour addition rate
  dimension: "[length] / [time]"
  description: Summed F-actin contour-length growth rate across N_fil growing filaments.

- id: polymer_pool_length
  name: total or used polymer contour length
  dimension: "[length]"
  description: Total available polymer contour length FiberProp::total_polymer or currently polymerized length used_polymer.

- id: free_polymer_fraction
  name: free monomer pool fraction
  dimension: dimensionless
  description: Normalized unpolymerized monomer fraction free_polymer = max(0, 1 - used_polymer / total_polymer).

- id: actin_concentration
  name: actin molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of polymerized F-actin or total actin pool [T-actin].

- id: actin_monomer_rise
  name: actin monomer axial rise
  dimension: "[length]"
  description: Contour length per G-actin subunit along an F-actin filament.

- id: nucleator_concentration
  name: linear nucleator molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of linear actin nucleators inside the spherical droplet.

- id: molecule_count
  name: discrete molecule count
  dimension: dimensionless
  description: Number of discrete nucleator or crosslinker molecules in the droplet.

- id: droplet_radius
  name: spherical droplet radius
  dimension: "[length]"
  description: Radius R of a SpaceSphere confinement volume.

- id: spheroid_axis
  name: ellipsoid semi-axis
  dimension: "[length]"
  description: Semi-axis a_z (major) or b_xy (minor) of a SpaceEllipse confinement volume.

- id: aspect_ratio
  name: droplet aspect ratio
  dimension: dimensionless
  description: Ratio a_z / b_xy of major to minor semi-axis of a prolate SpaceEllipse.

- id: surface_area
  name: confinement boundary surface area
  dimension: "[length] ** 2"
  description: Surface area of a SpaceSphere or SpaceEllipse (Knud Thomsen approximation vs exact analytic spheroid).

- id: volume
  name: confinement volume
  dimension: "[length] ** 3"
  description: Volume 4/3 * pi * R^3 or 4/3 * pi * a * b * c of a SpaceSphere or SpaceEllipse.

- id: dimensionless_factor
  name: dimensionless numerical constant or multiplier
  dimension: dimensionless
  description: Dimensionless C++ formula constant (DRAG=3, Tirado end correction 0.32/0.312, POOL_UNATTACHED=1, uniform diffusion factor 6, Thomsen exponent 1.6075, or unbinding acceleration factor).
