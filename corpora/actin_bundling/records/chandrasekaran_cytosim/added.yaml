  alternatives: ["943.44", "959.94"]
  stands_for: "FiberProp::total_polymer corresponding to [T-actin] = 138.38 uM"

- id: fiber_length_2pi_added
  quantity: filament_length
  unit: um
  printed: "6.283185"
