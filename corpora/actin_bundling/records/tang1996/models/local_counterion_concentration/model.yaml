id: local_counterion_concentration
name: local counterion concentration in condensation zone
role: model
described_from: ref-12
stated: {page: 4, printed_page: "8559", quote: "dicts the local ion concentration of Lys18 as cloc 5 u18/VP 5 0.02", where: text}
equation: "c_loc = theta_18 / V_P"
inputs:
  theta_18: {quantity: bound_polycation_per_charge, unit: dimensionless}
  V_P: {quantity: condensation_volume, unit: 1/M}
outputs:
  c_loc: {quantity: local_counterion_concentration, unit: M}
settings: {}
stochastic: false
