id: manning_onset_salt_scaling
name: trace Manning bundling-onset concentration scaling with KCl
role: model
from_words: true
prefactor: unknown
built_from: [manning_salt_dependence_eq3, association_constant]
stated: {page: 4, printed_page: "8559", quote: "and log[KCl] with a slope between 1 and 3", where: "text / Eq. 3"}
equation: "[C]_onset ~ [KCl]^N"
inputs:
  c_KCl: {quantity: monovalent_salt_concentration, unit: mM}
  N: {quantity: counterion_valence, unit: dimensionless}
outputs:
  c_onset: {quantity: cation_bundling_concentration, unit: mM}
settings: {}
stochastic: false
