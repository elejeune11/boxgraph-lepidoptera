id: chemical_binding_atp_eq5
name: chemical binding mass balance with ATP-Lys18 complex (Appendix Eq. 5)
role: model
built_from: [chemical_binding_eq4]
stated: {page: 7, printed_page: "8562", quote: "taken into account. The complete expression based on Eq. 4 is", where: "Eq. 5"}
equation: "[Lys_18]_o = [Lys_18]_f + [Lys_18(ATP)_m] + k * v * [Lys_18]_f"
inputs:
  c_free: {quantity: free_counterion_concentration, unit: M}
  c_atp: {quantity: atp_concentration, unit: M}
  k: {quantity: counterion_association_constant, unit: dimensionless}
  v: {quantity: condensation_volume_fraction, unit: dimensionless}
outputs:
  c_total: {quantity: cation_bundling_concentration, unit: M}
settings: {}
runnable: false
not_runnable_reason: >
  The paper does not specify the stoichiometry m or equilibrium association constant
  for Lys_18(ATP)_m complex formation at 0.5 mM ATP, so [Lys_18(ATP)_m] cannot be
  computed from c_atp and c_free.
stochastic: false
