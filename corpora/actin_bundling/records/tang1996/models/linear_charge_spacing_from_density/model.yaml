id: linear_charge_spacing_from_density
name: average linear charge spacing from linear charge density
role: processing
from_words: true
stated: {page: 2, printed_page: "8557", quote: "charge spacing along the filament axis is sufficiently small", where: text}
equation: "b = 1 / sigma"
inputs:
  sigma: {quantity: linear_charge_density, unit: 1/nm}
outputs:
  b: {quantity: linear_charge_spacing, unit: angstrom}
settings: {}
stochastic: false
