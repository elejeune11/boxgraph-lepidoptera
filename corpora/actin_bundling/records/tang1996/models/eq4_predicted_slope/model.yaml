id: eq4_predicted_slope
name: predicted linear slope of onset Lys18 vs F-actin from Eq. 4 and V_P
role: model
from_words: true
built_from: [chemical_binding_eq4, condensation_volume_fraction]
stated: {page: 4, printed_page: "8559", quote: "is directly proportional to the molar concentration of actin", where: "text / Eq. 4"}
equation: "s = k * V_P * q_net * c_free"
inputs:
  k: {quantity: counterion_association_constant, unit: dimensionless}
  V_P: {quantity: condensation_volume, unit: 1/M}
  q_net: {quantity: subunit_net_charge, unit: dimensionless}
  c_free: {quantity: free_counterion_concentration, unit: M}
outputs:
  s: {quantity: bound_polycation_per_monomer, unit: dimensionless}
settings: {}
stochastic: false
