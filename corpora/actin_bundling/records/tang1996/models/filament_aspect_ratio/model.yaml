id: filament_aspect_ratio
name: cylindrical aspect ratio of a short F-actin filament
role: processing
from_words: true
stated: {page: 4, printed_page: "8559", quote: "drical filaments of sufficiently large aspect ratios (.20:1)", where: text}
equation: "aspect_ratio = L / d_fil"
inputs:
  L: {quantity: filament_length, unit: nm}
  d_fil: {quantity: filament_diameter, unit: nm}
outputs:
  aspect_ratio: {quantity: filament_aspect_ratio, unit: dimensionless}
settings: {}
stochastic: false
