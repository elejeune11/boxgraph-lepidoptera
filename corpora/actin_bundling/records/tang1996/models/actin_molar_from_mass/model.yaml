id: actin_molar_from_mass
name: F-actin monomer molar concentration from mass concentration
role: processing
from_words: true
stated: {page: 3, printed_page: "8558", quote: "mM KCl at 3 representative concentrations: 0.1, 2.0, and 6.0 mg/ml", where: "Fig. 3a-b"}
equation: "c_molar = c_mass / M_actin"
inputs:
  c_mass: {quantity: actin_mass_concentration, unit: mg/ml}
  M_actin: {quantity: actin_molar_mass, unit: g/mol}
outputs:
  c_molar: {quantity: actin_molar_concentration, unit: uM}
settings: {}
stochastic: false
