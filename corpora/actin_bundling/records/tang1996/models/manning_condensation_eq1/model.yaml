id: manning_condensation_eq1
name: Manning counterion condensation fraction (Eq. 1)
role: model
described_from: ref-12
stated: {page: 1, printed_page: "8556", quote: "densed counterions is determined as the following equation", where: "Eq. 1"}
equation: "theta = (1 - 1 / (N * zeta))"
inputs:
  N: {quantity: counterion_valence, unit: dimensionless}
  zeta: {quantity: manning_charge_parameter, unit: dimensionless}
outputs:
  theta: {quantity: condensed_charge_fraction, unit: dimensionless}
settings: {}
stochastic: false
