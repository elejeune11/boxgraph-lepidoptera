id: actin_linear_charge_density
name: F-actin linear charge density from monomer charge and density
role: processing
from_words: true
stated: {page: 2, printed_page: "8557", quote: "likely to be protonated at pH 7.2. Based on 370 monomers per", where: text}
equation: "sigma = q_net * rho_mon"
inputs:
  q_net: {quantity: subunit_net_charge, unit: dimensionless}
  rho_mon: {quantity: monomer_linear_density, unit: 1/nm}
outputs:
  sigma: {quantity: linear_charge_density, unit: 1/nm}
settings: {}
stochastic: false
