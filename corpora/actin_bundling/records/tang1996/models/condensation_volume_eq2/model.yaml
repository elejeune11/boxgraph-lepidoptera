id: condensation_volume_eq2
name: Manning counterion condensation volume per molar charge (Eq. 2)
role: model
described_from: ref-12
stated: {page: 4, printed_page: "8559", quote: "At excess univalent electrolyte, VP can be", where: "Eq. 2"}
equation: "V_P = 41.1 * (zeta - 1) * b^3"
inputs:
  zeta: {quantity: manning_charge_parameter, unit: dimensionless}
  b: {quantity: linear_charge_spacing, unit: angstrom}
outputs:
  V_P: {quantity: condensation_volume, unit: cm^3/mol}
settings: {}
stochastic: false
