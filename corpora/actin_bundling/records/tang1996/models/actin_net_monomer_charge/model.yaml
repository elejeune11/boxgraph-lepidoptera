id: actin_net_monomer_charge
name: net negative charge per polymerized actin monomer
role: processing
from_words: true
stated: {page: 2, printed_page: "8557", quote: "each subunit of an actin filament bears 14 excess negative", where: text}
equation: "q_net = q_raw - n_His"
inputs:
  q_raw: {quantity: subunit_raw_charge, unit: dimensionless}
  n_His: {quantity: protonated_histidines_per_monomer, unit: dimensionless}
outputs:
  q_net: {quantity: subunit_net_charge, unit: dimensionless}
settings: {}
stochastic: false
