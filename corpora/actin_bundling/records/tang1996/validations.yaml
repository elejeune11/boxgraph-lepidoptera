# Cross-record validation audit of tang1996 models against independent measurements
# (and partner models against tang1996 measurements) across the three remaining
# ready Wave 6 partner records (claessens2008, feigeles2025, grason2007).
# (Note: angelini2003+tang1996, borukhov2005+tang1996, henle2005+tang1996, and
# pelletier2003+tang1996 were previously audited inside those partner records.)
#
# Result: 0 physically valid cross-record validations across these three pairs.
# Every pair was audited in both directions and recorded in tang1996/questions.yaml:
#
# - claessens2008 + tang1996 (see q_claessens2008_relate_validate_audit):
#   * tang1996's runnable models compute aqueous Bjerrum length, Manning charge
#     parameter zeta = lambda_B/b, single-counterion condensation fraction
#     theta = 1 - 1/(N*zeta), Manning condensation volume V_P, Appendix Eq. 4
#     linear polycation-actin partitioning ([Lys18]_o vs [Actin]), Fig. 5b salt
#     power-law fits for Mn^2+ and Co(NH3)6^3+, gelsolin filament contour length
#     and aspect ratio, Pi-release charge fraction, and mass-to-molar conversion.
#   * claessens2008's `origin: measured` datums are TEM fascin-actin bundle
#     diameters D(R*) and filament counts (n_f ~ 20, D_fil ~ 5-6), saturated
#     fascin bound ratio Rstar_plateau (~0.25) and R*(n_f), confined emulsion
#     droplet ring/two-bundle boundaries, hexagonal SAXS wavevector q_10 and
#     intensity curves I(q), helical layer lines and monomer overtwist
#     Delta_theta(R*), and espin+fascin diameter ratio (~3). claessens2008 p. 1
#     (8819) explicitly shows that fascin bundle assembly is salt-independent
#     (unchanged down to 2 mM MgCl2, no KCl) and controlled by helical-twist
#     mechanics rather than Manning electrostatics; thus no tang1996 model
#     predicts any claessens2008 measurement (actin_molar_from_mass is only a
#     unit-conversion processing helper and ca_fig1a/ca_fig4cd are `origin:
#     reported` sample preparations, not measurements).
#   * Conversely, tang1996's 58 `origin: measured` datums are 90-deg static
#     light-scattering curves and bundling-onset threshold concentrations of
#     multivalent cations, polylysines, MARCKS, and calponin; tang1996 never
#     measures bundle diameter, filament count, hexagonal SAXS peaks, helical
#     overtwist, or fascin stoichiometry, so no claessens2008 model predicts any
#     tang1996 measurement.
#
# - feigeles2025 + tang1996 (see q_feigeles2025_relate_validate_audit):
#   * feigeles2025's `origin: measured` datums are fluorescence bundle width
#     (0.23 +- 0.10 um), bundle straightness (>40 um, Fig. S2), intensity
#     profiles (Fig. 1E), FUS condensate wetting contact angles (39.5 +- 9.01
#     deg, Figs. 2C/S4), barrel droplet aspect ratios (Figs. 2B/S3), unduloid
#     profile geometry (Fig. 5B), rescaled-radius histograms (Fig. S5), and
#     droplet coalescence decay curves (Figs. 3C/S6B-C). These bundles form via
#     FUS liquid-condensate capillary bridging in low-divalent buffer (2 mM
#     MgCl2, 20 mM KCl — far below tang1996's 27 mM Mg^2+ counterion bundling
#     threshold), and no tang1996 polyelectrolyte model predicts any wetting,
#     capillary, coalescence, or bundle-width observable.
#   * Conversely, tang1996's 58 `origin: measured` light-scattering and
#     counterion/polycation onset measurements contain no liquid protein
#     condensates, wetting droplets, contact angles, or microscopy bundle widths,
#     so no feigeles2025 capillary/wetting model applies to tang1996.
#
# - grason2007 + tang1996 (see q_grason2007_relate_validate_audit):
#   * grason2007 is a purely theoretical continuum-elasticity PRL with 0
#     `origin: measured` datums (its two experimental literature values,
#     factin_diameter_lai2007 40-100 nm and factin_twist_pitch_ikawa2007 ~100 nm,
#     are `origin: reported` and neither is predicted by any tang1996 model).
#   * Conversely, grason2007's 36 models predict chiral hexagonal bundle radius
#     R_0, torsion Omega_0, elastic energy, critical surface tension Sigma_c, and
#     cluster-size weights P(R) with no electrostatic or ionic concentration
#     variables, whereas tang1996 measures only 90-deg light-scattering curves
#     and polycation/divalent bundling-onset concentrations (never bundle radius,
#     twist pitch, or size distributions).
