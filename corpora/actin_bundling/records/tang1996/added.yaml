- id: d_actin_added
  quantity: filament_diameter
  unit: nm
  printed: "7"
  basis: >
    Tang & Janmey (1996) do not state an F-actin filament diameter, but on p. 4 (8559)
    translate a 50-monomer filament length (140 nm) into an aspect ratio ">20:1", which
    corresponds to an effective cylindrical diameter d <= 7 nm (standard F-actin diameter
    is ~7-8 nm).
  alternatives: ["6", "8", "10"]
  stands_for: "F-actin cylindrical diameter d in aspect ratio L/d (>20:1) on p. 4 (8559)"

- id: M_actin_added
  quantity: actin_molar_mass
  unit: g/mol
  printed: "42000"
  basis: >
    Standard molecular weight of rabbit skeletal muscle alpha-actin monomer (~42 kDa),
    not printed in Tang & Janmey (1996) but consistent with Fig. 3a-b (p. 3 / 8558),
    where the highest mass concentration 6.0 mg/ml corresponds to ~143 uM on the Fig. 3b
    abscissa. Used to evaluate the Appendix Eq. 4 condensation volume fraction v << 1.
  alternatives: ["41800", "43000"]
  stands_for: "actin monomer molecular weight converting mg/ml to uM in Fig. 3 and Appendix Eq. 4"
