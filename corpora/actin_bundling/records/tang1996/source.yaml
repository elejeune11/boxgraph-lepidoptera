notes: >
  Full quantitative reading of Tang & Janmey (1996), J. Biol. Chem. 271(15), 8556-8563
  (PDF pages 1-8).

  In scope:
  - Bjerrum length lambda_B = e^2 / (4*pi*epsilon_0*epsilon*k*T) in water at 20 degC (epsilon = 80,
    printed lambda_B = 7.1 A, p. 1).
  - Manning dimensionless charge-density parameter zeta = lambda_B / b for dsDNA (b = 1.7 A,
    zeta = 4.2, p. 1) and F-actin (b = 2.5 A, zeta = 2.8, p. 4).
  - Manning counterion condensation fraction Eq. 1: theta = 1 - 1/(N*zeta) evaluated for dsDNA
    (N = 1 -> 76%, N = 2 -> 88%, N = 3 vs 90% condensation threshold, p. 1) and F-actin (N = 1
    vs printed "about 60%", p. 2; N = 2 -> 82%, p. 3).
  - F-actin monomer net negative charge (14 - ~3 His = 11 e, pp. 2, 4), linear charge density
    (11 * 370/um ~= 4 e/nm, p. 2), average charge spacing (b = 2.5 A, p. 4), and fractional charge
    reduction upon Pi release (1/11 ~= 9%, p. 7).
  - Lys18 bundling onset vs F-actin concentration linear fit [Lys18] = 19.4 + 0.26*[Actin] (uM,
    Fig. 3b, pp. 3-4), bound Lys18 per actin charge theta_18 = 0.26/11 = 0.024, neutralized charge
    fraction theta_18*18 ~= 40% (exact 43.2%), Manning condensation volume Eq. 2 V_P = 41.1*(zeta-1)*b^3
    = 1.2e3 cm^3/mol = 1.2 M^-1, local concentration c_loc = theta_18/V_P = 0.02 M, and apparent
    association constant K = c_loc/c_18 ~ 10^3 (p. 4).
  - Appendix chemical binding model Eq. 4 ([Lys18]_o = [Lys18]_f + k*v*[Lys18]_f) coupled to the
    condensation volume fraction v = V_P*q_net*[Actin] (verifying v << 1 and slope consistency with
    Fig. 3b), plus Eq. 5 with ATP complexation [Lys18(ATP)_m] recorded as non-runnable because
    stoichiometry m and complexation equilibrium constant are unstated (p. 7).
  - Ionic strength dependence Eq. 3 (log K = constant - N*log c, prefactor unknown) and implied
    bundling-onset salt scaling (slope alpha = N in trace limit, 1 to N in one-variable Manning
    theory), contrasted with empirical Fig. 5b power-law fits [Co(NH3)6^3+] = 0.068*[KCl]^0.74 and
    [Mn^2+] = 3.11*[KCl]^0.20 (mM, pp. 4-5) and cross-checked against the Fig. 1 Mn^2+ threshold
    (7 mM at 150 mM KCl, p. 2).
  - Filament length calculations from gelsolin:actin ratios (1:500 -> 1.35 um in Fig. 4 caption vs
    1.6 um in p. 4 text citing ref-30; 1:50 -> 135.1 nm vs printed 140 nm) and cylinder aspect ratio
    >20:1 (p. 4).
  - Measured experimental bundling threshold concentrations stated in text for divalent cations
    (Co^2+ 5.5 mM, Mn^2+ 7 mM, Ca^2+ 20 mM, Mg^2+ 27 mM at 0.5 mg/ml F-actin, p. 2), Cu^2+ and
    Cu^2+/Mg^2+ synergy (0.4 mM Cu^2+ alone; 25-50 uM Cu^2+ with 20 mM MgCl2; 15 mM vs ~30 mM MgCl2
    with 50 vs 0 uM Cu^2+, p. 3), MARCKS peptide (14 reported net positive charges, p. 6), and
    calponin (~8 net positive charges; no sharp bundling up to 6 uM at 150 mM KCl, p. 6).

  Left out of data.yaml (non-model experimental preparation/instrumental numbers):
  - Nonpolymerizing G-actin buffer recipe (4 mM Hepes pH 7.2, 0.2 mM CaCl2, 0.5 mM NaN3), modified
    Cu^2+ Tris buffer (2 mM Tris pH 7.5), gelsolin elution buffer (30 mM NaCl, 3 mM CaCl2, 25 mM
    Tris pH 7.4, -80 degC storage), calponin dialysis buffer (3 M KCl, 50 mM Hepes, 5 mM DTT, 0.1 M
    KCl pH 7.5, 100 uM stock, specific absorbance 0.74 (mg/ml)^-1 cm^-1 at 280 nm), MARCKS stock
    (200 uM in 50 mM Hepes pH 7.5), polylysine degree of polymerization >10, stock concentration
    >=20x and ignored <5% dilution (p. 2).
  - Spectrometer optical settings (90 deg angle, 365/375 nm and 365/370 nm excitation/emission,
    3 nm and 5 nm slits) and cuvette geometries/volumes (10x5 mm, 600 uL; 6 mm glass tubes; 10x10 mm,
    1200 uL; p. 2), initial scattering baseline ~0.07 in Fig. 7 (p. 5), ~5 min CuCl2 preincubation
    (p. 3), ~10 min calponin preincubation (p. 6), and qualitative ~4 uM equimolar calponin
    co-sedimentation note (p. 6).
  - Background literature mentions on p. 1 (physiological 2 mM MgCl2 / 100 mM KCl, >10 mM Mg^2+,
    low pH <5.5) and histidine side-chain pK 6.5 (p. 2).

