    the excess K+ to make up to 80% as the criterion for bundling to occur." The paper only prints
    single-counterion Eq. 1 and omits Manning's two-variable mixed-counterion equations (ref-12)
    needed to compute co-condensed K+. Moreover, in the limiting-law (c -> 0) Manning two-variable
    theory, total neutralization remains fixed at theta_1 + N*theta_N = 1 - 1/zeta = 64.3% whenever
    K+ remains condensed (leaving ~21% K+, not ~40%); reaching ~77-80% total neutralization
    (~34-37% K+ plus 43% Lys18) requires evaluating Manning's finite-salt two-variable equation at
    150 mM KCl (kappa*b ~= 0.32), which is neither stated nor within the c < 0.1 M low-salt limit
    cited on p. 4.
