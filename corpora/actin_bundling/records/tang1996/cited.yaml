# Cross-record provenance audit of values cited between tang1996 and the three
# remaining Wave 6 ready partner records (claessens2008, feigeles2025, grason2007).
# (Note: angelini2003+tang1996, borukhov2005+tang1996, henle2005+tang1996, and
# pelletier2003+tang1996 were previously audited inside those partner records.)
#
# 1. claessens2008 -> tang1996 (ref-9):
#    claessens2008 (2008, 12 years after tang1996) cites tang1996 (Ref. [9]:
#    "Tang JX, Janmey PA (1996) The polyelectrolyte nature of F-actin and the
#    mechanism of actin bundle formation. J Biol Chem 271:8556-8563.") strictly
#    in one qualitative introductory sentence on p. 1 (8819), col. 1:
#    "In the presence of nonadsorbing polymer and/or multivalent counterions,
#    charged biopolymers such as F-actin, microtubules, or DNA generally form a
#    phase of bundles with a well defined thickness (9-16)."
#    Zero datums in claessens2008/data.yaml carry from_source: ref-9 or tang1996
#    (its only from_source datums are tau_actin from ref-35 Tsuda et al. 1996
#    and Kd_fascin / DeltaG_fascin_printed from ref-36 Ono et al. 1997). Note
#    that both records independently add M_actin_added = 42000 g/mol in
#    added.yaml, and print unreferenced F-actin monomer axial spacings that
#    differ by 7.3% (d_monomer = 2.9 nm in claessens2008 vs rho_actin_monomers =
#    370/um = 2.703 nm/monomer in tang1996), with no citation between them.
#    tang1996 (1996) precedes claessens2008 and cites nothing from it.
#
# 2. feigeles2025 -> tang1996 (ref-40):
#    feigeles2025 (2025, 29 years after tang1996) cites tang1996 (Ref. [40]:
#    "J. X. Tang and P. A. Janmey, The Polyelectrolyte Nature of F-actin and
#    the Mechanism of Actin Bundle Formation, J. Biol. Chem., 1996, 271,
#    8556-8563.") strictly in one qualitative Discussion sentence on p. 6
#    (7877), col. 1: "Ion species and valency is known to be important in both
#    cytoskeletal filament polymerization and interaction with other proteins,
#    as well as for FUS condensate phase separation.40-42"
#    Zero datums in feigeles2025/data.yaml carry from_source: ref-40 or tang1996
#    (its four from_source datums come from ref-22 Gittes 1993, ref-35 Scheff
#    2020, and ref-27 Ijavi 2021). Note that feigeles2025 prints an unreferenced
#    actin_filament_diameter_lit = "~7" nm on p. 6 while tang1996 does not print
#    a filament diameter (d_actin_added = 7 nm in tang1996/added.yaml).
#    tang1996 (1996) precedes feigeles2025 and cites nothing from it.
#
# 3. grason2007 + tang1996:
#    Neither paper cites the other. tang1996 (1996) precedes grason2007 (2007)
#    by 11 years. Crucially, grason2007 Ref. [3] ("J. X. Tang et al., Ber.
#    Bunsenges. Phys. Chem. 100, 796 (1996).", cited qualitatively on p. 1
#    col. 1 in "[3-6]") is a DIFFERENT 1996 publication (Tang, Wong, Tran, &
#    Janmey 1996, which tang1996 itself cites as ref-43), NOT corpus record
#    tang1996 (Tang & Janmey 1996, J. Biol. Chem. 271:8556-8563). Moreover,
#    grason2007/data.yaml takes numerical values solely from ref-12 (Lai et al.
#    2007) and ref-22 (Ikawa et al. 2007).
#
# Accordingly, zero CitedLink entries apply to tang1996 for these three pairs.
[]
