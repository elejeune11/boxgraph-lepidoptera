- id: temperature
  name: solution temperature
  dimension: "[temperature]"
  description: Absolute or Celsius temperature of the electrolyte solution.

- id: dielectric_constant
  name: solvent dielectric constant
  dimension: "dimensionless"
  description: Relative static permittivity epsilon of the aqueous solvent.

- id: bjerrum_length
  name: Bjerrum length
  dimension: "[length]"
  description: Distance lambda_B = e^2 / (4*pi*epsilon_0*epsilon*k_B*T) at which electrostatic interaction between two elementary charges equals k_B*T.

- id: linear_charge_spacing
  name: linear charge spacing
  dimension: "[length]"
  description: Average axial spacing b between elementary charges along a linear polyelectrolyte.

- id: manning_charge_parameter
  name: Manning linear charge density parameter
  dimension: "dimensionless"
  description: Dimensionless Manning parameter zeta = lambda_B / b.

- id: counterion_valence
  name: counterion valence
  dimension: "dimensionless"
  description: Positive electrical valence N (elementary charges per ion) of a counterion species.

- id: condensed_charge_fraction
  name: condensed counterion charge fraction
  dimension: "dimensionless"
  description: Fraction theta of polyelectrolyte bare surface charge compensated by condensed counterions.

- id: subunit_raw_charge
  name: raw excess negative charge per actin subunit
  dimension: "dimensionless"
  description: Excess negative elementary charges per alpha-skeletal muscle actin subunit (including 3-methylhistidine, acetylated N-terminus, tightly bound divalent cation and ATP) prior to histidine protonation.

- id: protonated_histidines_per_monomer
  name: protonated histidines per actin monomer
  dimension: "dimensionless"
  description: Number of histidine side chains protonated per actin monomer at neutral pH (pH 7.2).

- id: subunit_net_charge
  name: net negative charge per actin monomer
  dimension: "dimensionless"
  description: Net elementary negative charge magnitude carried by one monomer in polymerized F-actin.

- id: subunit_charge_change
  name: monomer elementary charge change
  dimension: "dimensionless"
  description: Change in elementary charge per actin monomer (e.g. upon Pi release after ATP hydrolysis).

- id: fractional_charge_change
  name: fractional change in filament surface charge density
  dimension: "dimensionless"
  description: Relative reduction in F-actin linear surface charge density delta_q / q_net.

- id: monomer_linear_density
  name: actin monomer linear density
  dimension: "1/[length]"
  description: Number of actin subunits per unit filament contour length.

- id: linear_charge_density
  name: linear charge density
  dimension: "1/[length]"
  description: Number of elementary negative charges per unit contour length along a polyelectrolyte filament.

- id: actin_mass_concentration
  name: F-actin mass concentration
  dimension: "[mass]/[length]**3"
  description: Mass concentration of polymerized F-actin in solution.

- id: actin_molar_concentration
  name: F-actin monomer molar concentration
  dimension: "[substance]/[length]**3"
  description: Molar concentration of actin subunits in polymerized F-actin suspension.

- id: actin_molar_mass
  name: actin monomer molar mass
  dimension: "[mass]/[substance]"
  description: Molecular weight (molar mass) of a single skeletal-muscle actin monomer.

- id: cation_bundling_concentration
  name: bundling onset polycation concentration
  dimension: "[substance]/[length]**3"
  description: Threshold total concentration of a polycation species required to induce F-actin bundle formation.

- id: free_counterion_concentration
  name: free counterion concentration at bundling onset
  dimension: "[substance]/[length]**3"
  description: Concentration of unbound polycation in bulk solution at the onset of bundling (e.g. c_18 or [Lys18]_f).

- id: local_counterion_concentration
  name: local condensed counterion concentration
  dimension: "[substance]/[length]**3"
  description: Local concentration c_loc (or [Lys18]_b) of counterions within the Manning condensation zone around F-actin.

- id: monovalent_salt_concentration
  name: monovalent salt concentration
  dimension: "[substance]/[length]**3"
  description: Bulk concentration c of excess monovalent electrolyte (KCl) setting solution ionic strength.

- id: preincubation_cation_concentration
  name: co-present divalent cation concentration
  dimension: "[substance]/[length]**3"
  description: Concentration of a background or preincubated divalent cation (Mg^2+ or Cu^2+) in mixed-cation bundling assays.

- id: atp_concentration
  name: buffer ATP concentration
  dimension: "[substance]/[length]**3"
  description: Concentration of ATP present in the F-actin buffer solution.

- id: complex_concentration
  name: polycation-ATP complex concentration
  dimension: "[substance]/[length]**3"
  description: Concentration of the polycation-ATP complex [Lys18(ATP)_m] in solution (Appendix Eq. 5).

- id: bound_polycation_per_monomer
  name: bound polycation per actin monomer
  dimension: "dimensionless"
  description: Molar ratio (slope of onset [Lys18] vs [Actin]) of bound polycation molecules per actin monomer in the bundled state.

- id: bound_polycation_per_charge
  name: bound polycation molecules per filament elementary charge
  dimension: "dimensionless"
  description: Number of bound polycation molecules per elementary negative charge on the F-actin filament (theta_18).

- id: polycation_neutralized_charge_fraction
  name: actin charge fraction neutralized by polycation
  dimension: "dimensionless"
  description: Fraction of F-actin surface charge neutralized specifically by the added polycation species (theta_18 * N).

- id: condensation_volume
  name: Manning condensation volume per molar charge
  dimension: "[length]**3/[substance]"
  description: Volume V_P of the counterion condensation zone per mole of polyelectrolyte elementary charge (cm^3/mol or M^-1).

- id: condensation_volume_fraction
  name: condensation zone volume fraction
  dimension: "dimensionless"
  description: Dimensionless volume fraction v of solution occupied by the F-actin condensation zone.

- id: counterion_association_constant
  name: counterion association constant
  dimension: "dimensionless"
  description: Apparent dimensionless partitioning/association constant K = c_loc / c_free (or k = [Lys18]_b / [Lys18]_f).

- id: salt_dependence_slope
  name: ionic strength power-law slope
  dimension: "dimensionless"
  description: Log-log slope d(log[C]_onset)/d(log[KCl]) (or -d(log K)/d(log c)) describing salt dependence of counterion binding and bundling onset.

- id: power_law_prefactor_mM
  name: mM-normalized power-law fit prefactor
  dimension: "dimensionless"
  description: Dimensionless numerical prefactor A in the empirical Fig. 5b fit ([C]_onset / 1 mM) = A * ([KCl] / 1 mM)^alpha.

- id: monomers_per_filament
  name: average monomers per actin filament
  dimension: "dimensionless"
  description: Mean number of actin subunits per filament controlled by the molar ratio of actin to gelsolin.

- id: filament_length
  name: average F-actin filament length
  dimension: "[length]"
  description: Mean contour length L of gelsolin-capped F-actin filaments.

- id: filament_diameter
  name: F-actin filament diameter
  dimension: "[length]"
  description: Effective cylindrical diameter d of an individual F-actin filament.

- id: filament_aspect_ratio
  name: F-actin filament aspect ratio
  dimension: "dimensionless"
  description: Contour length-to-diameter aspect ratio L / d of an actin filament.

- id: peptide_net_charge
  name: net positive charge of bundling peptide or protein
  dimension: "dimensionless"
  description: Net positive elementary charge carried by a peptide (MARCKS) or actin-binding protein (calponin) at neutral pH.

- id: solution_pH
  name: solution pH
  dimension: "dimensionless"
  description: Hydrogen-ion pH of the aqueous buffer solution.

- id: relative_error
  name: experimental relative measurement uncertainty
  dimension: "dimensionless"
  description: Stated experimental relative error margin in threshold bundling concentration measurements.

- id: light_scattering_intensity
  name: 90-degree static light scattering intensity
  dimension: "dimensionless"
  description: Arbitrary spectrometer light-scattering signal (Perkin-Elmer LS-5B, 90-degree angle) tracking F-actin bundle formation and dissociation.

- id: polycation_concentration
  name: titrated polycation concentration
  dimension: "[substance]/[length]**3"
  description: Total added concentration of a bundling polycation, basic peptide, or actin-binding protein in light-scattering titration curves.

- id: nucleotide_concentration
  name: added nucleoside phosphate concentration
  dimension: "[substance]/[length]**3"
  description: Total added concentration of a nucleoside phosphate polyanion (ATP, CTP, GTP, ADP, AMP) used to dissociate preformed F-actin bundles.

- id: gelsolin_to_actin_ratio
  name: gelsolin-to-actin molar ratio
  dimension: "dimensionless"
  description: Molar ratio of gelsolin to actin monomers setting average F-actin filament length in Fig. 4.

- id: bundle_polycation_concentration
  name: initial bundling polycation concentration
  dimension: "[substance]/[length]**3"
  description: Fixed concentration of Lys18 or calponin used to preform F-actin bundles prior to nucleotide dissociation assays (Figs. 6 and 8b).

