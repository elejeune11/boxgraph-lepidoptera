id: one_mode_homogeneous_eigenvalues
name: linear stability eigenvalues of homogeneous state F_H (Eqs. 8, S12-S13)
role: model
stated:
  page: 4
  printed_page: "19770"
  quote: "Linearizing Eq. 3 about the homogeneous state reveals that, in this state, the dynamics of fluctuations is controlled by two eigenvalues given by"
  where: "Eq. 8, p. 19770 (and SI Eqs. S12-S13, p. 9, Fig. S2)"
equation: "lambda_pm^h = -(1/2)*(alpha_A + alpha_B) +- (1/2)*sqrt((alpha_A - alpha_B)^2 + 4*(kappa^2 - delta^2))"
inputs:
  alpha_A:
    quantity: effective_linear_rate
    unit: dimensionless
  alpha_B:
    quantity: effective_linear_rate
    unit: dimensionless
  kappa:
    quantity: reciprocal_cross_diffusivity
    unit: dimensionless
  delta:
    quantity: nonreciprocity_parameter
    unit: dimensionless
outputs:
  re_lambda_plus:
    quantity: growth_rate
    unit: dimensionless
  re_lambda_minus:
    quantity: growth_rate
    unit: dimensionless
  im_lambda_plus:
    quantity: eigenvalue_imaginary_part
    unit: dimensionless
    description: Non-negative imaginary part Im[lambda_+^h] = -Im[lambda_-^h].
  delta_complex_over_kappa:
    quantity: nonreciprocity_ratio
    unit: dimensionless
    description: Ratio delta/kappa = sqrt(1 + (alpha_A - alpha_B)^2 / (4*kappa^2)) where eigenvalues change from real to complex conjugate (Fig. S2).
settings: {}
stochastic: false
