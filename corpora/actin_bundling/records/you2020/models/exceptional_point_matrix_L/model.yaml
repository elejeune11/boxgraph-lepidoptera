id: exceptional_point_matrix_L
name: exceptional-point eigenmodes of steady-state D_s and 4x4 fluctuation matrix L (SI Eqs. S21-S30, Fig. S3)
role: model
stated:
  page: 11
  printed_page: "SI-5"
  quote: "The linear matrix L has four eigenvalues"
  where: "SI Sec. III, Eqs. S21-S30, pp. 11-12 (SI pp. 5-6), Fig. S3"
equation: "D_s = [[-(kappa^2 - delta^2)/alpha_B, -(kappa - delta)], [-(kappa + delta), -alpha_B]]; Delta_1 = [alpha_B + (kappa^2 - delta^2)/alpha_B]^2; lambda_1^pm = (1/2)[-alpha_B - (kappa^2 - delta^2)/alpha_B +- sqrt(Delta_1)]; u_1^pm(1) = -u_1^pm(3) = (1/2)[alpha_B - (kappa^2 - delta^2)/alpha_B +- sqrt(Delta_1)]"
inputs:
  alpha_B:
    quantity: effective_linear_rate
    unit: dimensionless
  kappa:
    quantity: reciprocal_cross_diffusivity
    unit: dimensionless
  delta_over_dc:
    quantity: normalized_nonreciprocity
    unit: dimensionless
outputs:
  det_Ds:
    quantity: matrix_determinant
    unit: dimensionless
    description: Determinant det[D_s] of Eq. (S24), identically zero at F_S.
  lambda_1_plus:
    quantity: growth_rate
    unit: dimensionless
    description: Upper phase-sector eigenvalue lambda_1^+ of L (blue curve in Fig. S3a; 0 for delta <= delta_c).
  lambda_1_minus:
    quantity: growth_rate
    unit: dimensionless
    description: Lower phase-sector eigenvalue lambda_1^- of L (red curve in Fig. S3a; vanishes at delta = delta_c).
  u1_plus_1:
    quantity: eigenvector_component
    unit: dimensionless
    description: First component of eigenvector u_1^+ (blue curve in Fig. S3b, assuming real phi_hat_A^s with theta_0 = 0).
  u1_minus_1:
    quantity: eigenvector_component
    unit: dimensionless
    description: First component of eigenvector u_1^- (red curve in Fig. S3b).
  u1_plus_3:
    quantity: eigenvector_component
    unit: dimensionless
    description: Third component of eigenvector u_1^+ = -u_1^+(1) (blue curve in Fig. S3c).
  u1_minus_3:
    quantity: eigenvector_component
    unit: dimensionless
    description: Third component of eigenvector u_1^- = -u_1^-(1) (red curve in Fig. S3c).
settings: {}
stochastic: false
