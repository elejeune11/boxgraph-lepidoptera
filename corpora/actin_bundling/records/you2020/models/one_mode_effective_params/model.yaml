id: one_mode_effective_params
name: effective one-mode linear parameters alpha_A and alpha_B (below Eqs. 3 and S32)
role: model
stated:
  page: 3
  printed_page: "19769"
  quote: "where αA = χA + γA + (φ0A )2 can be negative and αB = χB > 0."
  where: "One-Mode Approximation, p. 19769 (and SI Eq. S32 p. 14: alpha_mu = chi_mu + gamma_mu + (phi_mu^0)^2)"
equation: "alpha_A = chi_A + gamma_A + (phi0_A)^2; alpha_B = chi_B + gamma_B + (phi0_B)^2"
inputs:
  chi_A:
    quantity: control_parameter
    unit: dimensionless
  gamma_A:
    quantity: interfacial_stiffness
    unit: dimensionless
  phi0_A:
    quantity: mean_phase_field
    unit: dimensionless
  chi_B:
    quantity: control_parameter
    unit: dimensionless
  gamma_B:
    quantity: interfacial_stiffness
    unit: dimensionless
  phi0_B:
    quantity: mean_phase_field
    unit: dimensionless
outputs:
  alpha_A:
    quantity: effective_linear_rate
    unit: dimensionless
  alpha_B:
    quantity: effective_linear_rate
    unit: dimensionless
settings: {}
stochastic: false
