id: active_passive_1d_pde
name: 1D active-passive Brownian mixture continuum PDE (SI Eqs. S39-S40, Fig. S7)
role: model
stated:
  page: 17
  printed_page: "SI-11"
  quote: "The corresponding coarse-grained equations as derived in [12] are given by"
  where: "SI Sec. VI.B, Eqs. S39-S40, pp. 17-18 (SI pp. 11-12), Fig. S7"
equation: "d_t rho_A = d_x[D_AA d_x rho_A + D_AP d_x rho_P] - kappa d_x^4 rho_A; d_t rho_P = d_x[D_PA d_x rho_A + D_PP d_x rho_P] - kappa d_x^4 rho_P"
described_from: ref-47
inputs:
  v_0:
    quantity: propulsion_speed
    unit: dimensionless
  D_R:
    quantity: rotational_diffusivity
    unit: dimensionless
  a0_AA:
    quantity: motility_suppression_coeff
    unit: dimensionless
  a0_AP:
    quantity: motility_suppression_coeff
    unit: dimensionless
  a1:
    quantity: steric_diffusivity_coeff
    unit: dimensionless
  kappa_ap:
    quantity: biharmonic_stiffness
    unit: dimensionless
  rho_A0:
    quantity: mean_number_density
    unit: dimensionless
  rho_P0:
    quantity: mean_number_density
    unit: dimensionless
  L:
    quantity: domain_size
    unit: dimensionless
outputs:
  amp_A:
    quantity: local_number_density
    unit: dimensionless
    description: Steady-state first Fourier mode amplitude |rho_hat_A^1|.
  rho_A_max:
    quantity: local_number_density
    unit: dimensionless
  rho_A_min:
    quantity: local_number_density
    unit: dimensionless
  omega_travel:
    quantity: wave_angular_frequency
    unit: dimensionless
    description: Angular drift speed |dtheta_1/dt| of the traveling domain.
  period_travel:
    quantity: wave_transit_period
    unit: dimensionless
    description: Periodic box transit period T = 2*pi/omega_travel (None if static/homogeneous).
  state_code:
    quantity: pattern_state_code
    unit: dimensionless
    description: 0 = homogeneous mixed, 1 = static demixed, 2 = traveling demixed.
settings:
  N: 64
  dt: 0.05
  t_max: 800.0
  seed: 1
stochastic: false
