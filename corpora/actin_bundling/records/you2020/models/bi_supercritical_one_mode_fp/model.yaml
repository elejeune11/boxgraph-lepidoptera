id: bi_supercritical_one_mode_fp
name: exact analytical traveling fixed point of bi-supercritical one-mode Eqs. (S32)-(S35)
role: model
stated:
  page: 14
  printed_page: "SI-8"
  quote: "In the amplitude-phase space, Eq. S32 can be rewritten as"
  where: "SI Sec. V, Eqs. S33a-d and S34-S35, p. 14 (SI p. 8)"
equation: "rho_A^t = sqrt(-(delta - kappa)*(alpha_A + alpha_B)/(2*delta)); rho_B^t = sqrt(-(delta + kappa)*(alpha_A + alpha_B)/(2*delta)); v = sqrt(delta^2 - kappa^2 - ((alpha_A - alpha_B)/2 + kappa*(alpha_A + alpha_B)/(2*delta))^2)"
inputs:
  alpha_A:
    quantity: effective_linear_rate
    unit: dimensionless
  alpha_B:
    quantity: effective_linear_rate
    unit: dimensionless
  kappa:
    quantity: reciprocal_cross_diffusivity
    unit: dimensionless
  delta:
    quantity: nonreciprocity_parameter
    unit: dimensionless
outputs:
  delta_c_over_kappa:
    quantity: nonreciprocity_critical_ratio
    unit: dimensionless
    description: Exact critical ratio delta_c/kappa where v = 0 in Eqs. (S33a-d); for alpha_A = alpha_B = alpha, delta_c/kappa = sqrt((1 + sqrt(1 + 4*alpha^2/kappa^2))/2).
  v:
    quantity: traveling_velocity
    unit: dimensionless
    description: Exact traveling speed v = |dPhi/dt|/2 solving printed Eqs. (S33a-d) (note non-constant delta^-2 term, unlike paper's constant-delta_c claim).
  rho_A_t:
    quantity: fourier_mode_amplitude
    unit: dimensionless
  rho_B_t:
    quantity: fourier_mode_amplitude
    unit: dimensionless
settings: {}
stochastic: false
