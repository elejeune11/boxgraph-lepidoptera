id: one_mode_phase_boundaries
name: one-mode analytical phase boundaries of Fig. 1A (Eqs. 6, 8, S10, S16)
role: model
stated:
  page: 4
  printed_page: "19770"
  quote: "The largest eigenvalue λ+ becomes positive, signaling an instability, when δ2 = κ2 − αA αB . This diffusive instability is displayed as a blue line in Fig. 1A."
  where: "Linear Stability Analysis, p. 19770 (Fig. 1A boundaries)"
equation: "|chi_A|_diff = gamma_A + (phi0_A)^2 + (delta^2 - kappa^2)/alpha_B; |chi_A|_osc = gamma_A + (phi0_A)^2 + alpha_B; delta_c/kappa = sqrt(1 + alpha_B^2/kappa^2)"
inputs:
  gamma_A:
    quantity: interfacial_stiffness
    unit: dimensionless
  phi0_A:
    quantity: mean_phase_field
    unit: dimensionless
  alpha_B:
    quantity: effective_linear_rate
    unit: dimensionless
  kappa:
    quantity: reciprocal_cross_diffusivity
    unit: dimensionless
  delta:
    quantity: nonreciprocity_parameter
    unit: dimensionless
outputs:
  abs_chi_A_diff:
    quantity: control_parameter_magnitude
    unit: dimensionless
    description: Diffusive instability boundary |chi_A| (blue curve in Fig. 1A) from delta^2 = kappa^2 - alpha_A * alpha_B.
  abs_chi_A_osc:
    quantity: control_parameter_magnitude
    unit: dimensionless
    description: Oscillatory instability boundary |chi_A| (red horizontal line in Fig. 1A) from alpha_A = -alpha_B.
  delta_c_over_kappa:
    quantity: nonreciprocity_critical_ratio
    unit: dimensionless
    description: Static-to-traveling drift bifurcation boundary delta_c/kappa (black vertical line in Fig. 1A).
settings: {}
stochastic: false
built_from:
  - one_mode_homogeneous_eigenvalues
  - one_mode_traveling_fp
