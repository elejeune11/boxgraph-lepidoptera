id: bi_supercritical_1d_pde_ratio
name: 1D bi-supercritical Cahn-Hilliard PDE swept over delta/kappa (Eq. S31, Fig. S5c)
role: model
stated:
  page: 13
  printed_page: "SI-7"
  quote: "Numerical integration of Eq. (S31) yields again stationary demixed states that transition to traveling ones"
  where: "SI Sec. V, Eq. (S31), p. 13 and Fig. S5(c), p. 14"
equation: "d_t phi_mu = d_x^2 [(chi_mu + phi_mu^2 - gamma_mu d_x^2) phi_mu + kappa_munu phi_nu] with both A,B supercritical and delta = (delta/kappa)*kappa"
inputs:
  chi_A: {quantity: control_parameter, unit: dimensionless}
  chi_B: {quantity: control_parameter, unit: dimensionless}
  gamma_A: {quantity: interfacial_stiffness, unit: dimensionless}
  gamma_B: {quantity: interfacial_stiffness, unit: dimensionless}
  kappa: {quantity: reciprocal_cross_diffusivity, unit: dimensionless}
  delta_over_kappa: {quantity: nonreciprocity_ratio, unit: dimensionless}
  L: {quantity: domain_size, unit: dimensionless}
  phi0_A: {quantity: mean_phase_field, unit: dimensionless}
  phi0_B: {quantity: mean_phase_field, unit: dimensionless}
outputs:
  rho_A: {quantity: fourier_mode_amplitude, unit: dimensionless}
  rho_B: {quantity: fourier_mode_amplitude, unit: dimensionless}
  v: {quantity: traveling_velocity, unit: dimensionless}
  state_code: {quantity: pattern_state_code, unit: dimensionless}
built_from:
  - bi_supercritical_1d_pde
settings:
  N: 64
  dt: 2.0
  t_max: 20000.0
  seed: 42
stochastic: false
