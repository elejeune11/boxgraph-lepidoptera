id: bi_supercritical_one_mode_fp_ratio
name: bi-supercritical exact one-mode traveling fixed point vs delta/kappa (Eqs. S33a-d, Fig. S5c)
role: model
stated:
  page: 14
  printed_page: "SI-8"
  quote: "In the amplitude-phase space, Eq. S32 can be rewritten as"
  where: "SI Sec. V, Eqs. (S33a)-(S33d), p. 14"
equation: "delta = (delta/kappa)*kappa; v = sqrt(delta^2 - kappa^2 - ((alpha_A - alpha_B)/2 + kappa*(alpha_A + alpha_B)/(2*delta))^2)"
inputs:
  alpha_A: {quantity: effective_linear_rate, unit: dimensionless}
  alpha_B: {quantity: effective_linear_rate, unit: dimensionless}
  kappa: {quantity: reciprocal_cross_diffusivity, unit: dimensionless}
  delta_over_kappa: {quantity: nonreciprocity_ratio, unit: dimensionless}
outputs:
  delta_c_over_kappa: {quantity: nonreciprocity_critical_ratio, unit: dimensionless}
  v: {quantity: traveling_velocity, unit: dimensionless}
  rho_A_t: {quantity: fourier_mode_amplitude, unit: dimensionless}
  rho_B_t: {quantity: fourier_mode_amplitude, unit: dimensionless}
built_from:
  - bi_supercritical_one_mode_fp
settings: {}
stochastic: false
