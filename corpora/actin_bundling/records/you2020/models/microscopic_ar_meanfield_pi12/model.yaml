id: microscopic_ar_meanfield_pi12
name: 2D coarse-grained mean-field interaction coefficient R_munu (corrected pi/12 angular average)
role: model
stated:
  page: 16
  printed_page: "SI-10"
  quote: "Using the piecewise linear form of the forces, to lowest order in gradients of the density, the mean field force can be evaluated to give"
  where: "SI Sec. VI.A, unnumbered continuum mean-field equations, p. 16 (SI p. 10)"
equation: "R_munu = (k_r * sigma_r^4 + k_munu * sigma_munu^4) * (pi / 12); kappa_munu_eff = k_r * sigma_r^4 * (pi / 12) * phi_mu; delta_munu_eff = k_munu * sigma_munu^4 * (pi / 12) * phi_mu"
variant_of: microscopic_ar_meanfield
corrections:
  - equation: "SI Sec. VI.A unnumbered R_munu, kappa_munu, delta_munu (p. 16)"
    change: "Replace geometric prefactor pi/6 by pi/12 in R_munu, kappa_munu, and delta_munu"
    evidence: "Evaluating the printed 2D mean-field integral on p. 16 to first order in grad phi gives -grad(phi) * int_0^{2*pi} cos^2(theta) dtheta * int_0^sigma s^2*(sigma - s) ds = -grad(phi) * pi * (sigma^4 / 12) = -(pi/12)*sigma^4*grad(phi). The printed pi/6 omits the 1/2 factor from the 2D angular average <cos^2 theta> = 1/2 (using 2*pi * sigma^4/12 = pi*sigma^4/6 instead of pi * sigma^4/12)."
inputs:
  k_r:
    quantity: interaction_strength
    unit: dimensionless
  sigma_r:
    quantity: interaction_range
    unit: dimensionless
  k_munu:
    quantity: interaction_strength
    unit: dimensionless
  sigma_munu:
    quantity: interaction_range
    unit: dimensionless
  phi_mu:
    quantity: mean_phase_field
    unit: dimensionless
outputs:
  R_munu:
    quantity: meanfield_interaction_coeff
    unit: dimensionless
  kappa_eff:
    quantity: effective_cross_diffusivity_mf
    unit: dimensionless
  delta_eff:
    quantity: effective_cross_diffusivity_mf
    unit: dimensionless
settings: {}
stochastic: false
