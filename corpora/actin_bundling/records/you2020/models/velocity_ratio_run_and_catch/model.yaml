id: velocity_ratio_run_and_catch
name: run-and-catch velocity ratio and near-critical PT-breaking rates (Eqs. 9, 11)
role: model
stated:
  page: 4
  printed_page: "19770"
  quote: "To establish the precise condition for the onset of the traveling state, it is useful to examine the ratio of the two velocity"
  where: "Eq. 9, p. 19770 (and Eq. 11, p. 19771)"
equation: "v_A/v_B = -(kappa - delta)*rho_B^2 / ((kappa + delta)*rho_A^2); at F_S: v_A^s/v_B^s = (delta^2 - kappa^2)/alpha_B^2; near delta_c: dpsi/dt = (2*delta_c*(delta - delta_c)/alpha_B)*psi, dPhi_T/dt = 2*alpha_B*psi"
inputs:
  alpha_B:
    quantity: effective_linear_rate
    unit: dimensionless
  kappa:
    quantity: reciprocal_cross_diffusivity
    unit: dimensionless
  delta:
    quantity: nonreciprocity_parameter
    unit: dimensionless
  rho_A:
    quantity: fourier_mode_amplitude
    unit: dimensionless
  rho_B:
    quantity: fourier_mode_amplitude
    unit: dimensionless
outputs:
  v_ratio_general:
    quantity: velocity_ratio
    unit: dimensionless
    description: General velocity ratio v_A/v_B = -(kappa - delta)*rho_B^2 / ((kappa + delta)*rho_A^2) (Eq. 9).
  v_ratio_fs:
    quantity: velocity_ratio
    unit: dimensionless
    description: Velocity ratio evaluated at static fixed point F_S, v_A^s/v_B^s = (delta^2 - kappa^2)/alpha_B^2 (Fig. 3B).
  psi_growth_rate_near_dc:
    quantity: phase_growth_slope
    unit: dimensionless
    description: Linearized phase-shift growth rate 2*delta_c*(delta - delta_c)/alpha_B near delta_c (Eq. 11).
  sum_phase_slope_near_dc:
    quantity: sum_phase_velocity_slope
    unit: dimensionless
    description: Near-critical sum-phase rate coefficient dPhi_T/dt / psi = 2*alpha_B (p. 19771).
settings: {}
stochastic: false
