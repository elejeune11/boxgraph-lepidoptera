id: one_mode_ode_1d
name: one-mode polar amplitude-phase ODE integration (Eqs. 4a-4d, S7a-S7d, Fig. 3C)
role: model
stated:
  page: 3
  printed_page: "19769"
  quote: "φ̂1µ = ρµ e iθµ , Eq. 3 can be written as"
  where: "Eqs. 4a-4d, p. 19769 (and SI Eqs. S7a-S7d, p. 8; Fig. 3C)"
equation: "drho_A/dt = -(alpha_A + rho_A^2)*rho_A - (kappa - delta)*rho_B*cos(theta); drho_B/dt = -alpha_B*rho_B - (kappa + delta)*rho_A*cos(theta); dtheta/dt = [(kappa - delta)*rho_B/rho_A + (kappa + delta)*rho_A/rho_B]*sin(theta); dPhi/dt = [(kappa - delta)*rho_B/rho_A - (kappa + delta)*rho_A/rho_B]*sin(theta)"
inputs:
  alpha_A:
    quantity: effective_linear_rate
    unit: dimensionless
  alpha_B:
    quantity: effective_linear_rate
    unit: dimensionless
  kappa:
    quantity: reciprocal_cross_diffusivity
    unit: dimensionless
  delta:
    quantity: nonreciprocity_parameter
    unit: dimensionless
  psi_probe:
    quantity: phase_shift_from_pi
    unit: dimensionless
    description: Intermediate phase shift psi = theta - pi along the F_S -> F_T drift orbit at which to sample v_A/v_B and rho_A/rho_B (Fig. 3C).
outputs:
  rho_A_final:
    quantity: fourier_mode_amplitude
    unit: dimensionless
  rho_B_final:
    quantity: fourier_mode_amplitude
    unit: dimensionless
  v_final:
    quantity: traveling_velocity
    unit: dimensionless
  psi_final:
    quantity: phase_shift_from_pi
    unit: dimensionless
  amp_ratio_final:
    quantity: amplitude_ratio
    unit: dimensionless
  v_ratio_final:
    quantity: velocity_ratio
    unit: dimensionless
  v_ratio_at_probe:
    quantity: velocity_ratio
    unit: dimensionless
  amp_ratio_at_probe:
    quantity: amplitude_ratio
    unit: dimensionless
settings:
  rtol: 1.0e-8
  atol: 1.0e-11
  t_max: 25000.0
  psi_init: 1.0e-4
stochastic: false
