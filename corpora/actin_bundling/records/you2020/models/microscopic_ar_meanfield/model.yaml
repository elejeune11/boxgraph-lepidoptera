id: microscopic_ar_meanfield
name: 2D coarse-grained mean-field interaction coefficient R_munu (SI Sec. VI.A, p. 16, printed pi/6)
role: model
stated:
  page: 16
  printed_page: "SI-10"
  quote: "Using the piecewise linear form of the forces, to lowest order in gradients of the density, the mean field force can be evaluated to give"
  where: "SI Sec. VI.A, unnumbered continuum mean-field equations, p. 16 (SI p. 10)"
equation: "R_munu = (k_r * sigma_r^4 + k_munu * sigma_munu^4) * (pi / 6); kappa_munu_eff = k_r * sigma_r^4 * (pi / 6) * phi_mu; delta_munu_eff = k_munu * sigma_munu^4 * (pi / 6) * phi_mu"
inputs:
  k_r:
    quantity: interaction_strength
    unit: dimensionless
  sigma_r:
    quantity: interaction_range
    unit: dimensionless
  k_munu:
    quantity: interaction_strength
    unit: dimensionless
  sigma_munu:
    quantity: interaction_range
    unit: dimensionless
  phi_mu:
    quantity: mean_phase_field
    unit: dimensionless
outputs:
  R_munu:
    quantity: meanfield_interaction_coeff
    unit: dimensionless
  kappa_eff:
    quantity: effective_cross_diffusivity_mf
    unit: dimensionless
  delta_eff:
    quantity: effective_cross_diffusivity_mf
    unit: dimensionless
settings: {}
stochastic: false
