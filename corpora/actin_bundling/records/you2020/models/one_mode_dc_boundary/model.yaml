id: one_mode_dc_boundary
name: static-to-traveling critical nonreciprocity boundary delta_c/kappa vs |chi_A| (Fig. 1A, Eq. 6)
role: model
stated:
  page: 4
  printed_page: "19770"
  quote: "This boundary δ = δc corresponds to the appearance of FT"
  where: "Linear Stability Analysis, p. 19770 (Fig. 1A)"
equation: "delta_c / kappa = sqrt(1 + (alpha_B / kappa)^2) for |chi_A| >= gamma_A + (phi0_A)^2 + alpha_B"
inputs:
  abs_chi_A: {quantity: control_parameter_magnitude, unit: dimensionless}
  gamma_A: {quantity: interfacial_stiffness, unit: dimensionless}
  phi0_A: {quantity: mean_phase_field, unit: dimensionless}
  alpha_B: {quantity: effective_linear_rate, unit: dimensionless}
  kappa: {quantity: reciprocal_cross_diffusivity, unit: dimensionless}
outputs:
  delta_c_over_kappa: {quantity: nonreciprocity_critical_ratio, unit: dimensionless}
built_from:
  - one_mode_phase_boundaries
settings: {}
stochastic: false
