id: one_mode_phase_boundaries_ratio
name: one-mode phase boundaries as functions of delta/kappa (Fig. 1A, Eq. 8)
role: model
stated:
  page: 4
  printed_page: "19770"
  quote: "This diffusive instability is displayed as a blue line in Fig. 1A."
  where: "Linear Stability Analysis, p. 19770 (Fig. 1A)"
equation: "|chi_A|_diff = gamma_A + (phi0_A)^2 + kappa^2*((delta/kappa)^2 - 1)/alpha_B; |chi_A|_osc = gamma_A + (phi0_A)^2 + alpha_B; delta_c/kappa = sqrt(1 + (alpha_B/kappa)^2)"
inputs:
  gamma_A: {quantity: interfacial_stiffness, unit: dimensionless}
  phi0_A: {quantity: mean_phase_field, unit: dimensionless}
  alpha_B: {quantity: effective_linear_rate, unit: dimensionless}
  kappa: {quantity: reciprocal_cross_diffusivity, unit: dimensionless}
  delta_over_kappa: {quantity: nonreciprocity_ratio, unit: dimensionless}
outputs:
  abs_chi_A_diff: {quantity: control_parameter_magnitude, unit: dimensionless}
  abs_chi_A_osc: {quantity: control_parameter_magnitude, unit: dimensionless}
  delta_c_over_kappa: {quantity: nonreciprocity_critical_ratio, unit: dimensionless}
built_from:
  - one_mode_phase_boundaries
settings: {}
stochastic: false
