id: decoupled_ground_state
name: decoupled Cahn-Hilliard ground state (below Eq. 1)
role: model
stated:
  page: 2
  printed_page: "19768"
  quote: "with ground states φgµ = 0 for χµ > 0, describing homogeneous states, and φgµ = ± −3χµ when χµ < 0"
  where: "Continuum Model, p. 19768 (inline below Eq. 1)"
equation: "phi_g = 0 for chi_mu >= 0; phi_g = sqrt(-3 * chi_mu) (positive branch of +-sqrt(-3*chi_mu)) for chi_mu < 0"
inputs:
  chi_mu:
    quantity: control_parameter
    unit: dimensionless
outputs:
  phi_g:
    quantity: phase_field_ground_state
    unit: dimensionless
    description: Non-negative ground-state magnitude |phi_mu^g| (0 for chi_mu >= 0, sqrt(-3*chi_mu) for chi_mu < 0).
settings: {}
stochastic: false
