id: one_mode_homogeneous_eigenvalues_ratio
name: homogeneous-state eigenvalues lambda_pm^h vs delta/kappa (Eq. 8 / S13, Fig. S2)
role: model
stated:
  page: 9
  printed_page: "SI-3"
  quote: "Real (blue lines) and imaginary (red lines) parts of eigenvalues"
  where: "SI Sec. II, Eq. (S13) and Fig. S2, p. 9"
equation: "lambda_pm^h = -(alpha_A + alpha_B)/2 +- sqrt((alpha_A - alpha_B)^2 + 4*kappa^2*(1 - (delta/kappa)^2))/2"
inputs:
  alpha_A: {quantity: effective_linear_rate, unit: dimensionless}
  alpha_B: {quantity: effective_linear_rate, unit: dimensionless}
  kappa: {quantity: reciprocal_cross_diffusivity, unit: dimensionless}
  delta_over_kappa: {quantity: nonreciprocity_ratio, unit: dimensionless}
outputs:
  re_lambda_plus: {quantity: growth_rate, unit: dimensionless}
  re_lambda_minus: {quantity: growth_rate, unit: dimensionless}
  im_lambda_plus: {quantity: eigenvalue_imaginary_part, unit: dimensionless}
built_from:
  - one_mode_homogeneous_eigenvalues
settings: {}
stochastic: false
