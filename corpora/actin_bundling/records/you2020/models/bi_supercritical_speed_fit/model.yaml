id: bi_supercritical_speed_fit
name: paper's constant-delta_c speed fit for bi-supercritical system (SI p. 14, Fig. S5c)
role: fit
stated:
  page: 14
  printed_page: "SI-8"
  quote: "The red line is a fit to the mean-field theory with v = δ 2 − δc2 , where δc = 1.5κ is extracted from the best fit to the data."
  where: "SI Sec. V, below Eq. (S35) and Fig. S5(c) caption, p. 14 (SI p. 8)"
equation: "v = sqrt(delta^2 - (delta_c_over_kappa * kappa)^2)"
inputs:
  kappa:
    quantity: reciprocal_cross_diffusivity
    unit: dimensionless
  delta:
    quantity: nonreciprocity_parameter
    unit: dimensionless
  delta_c_over_kappa:
    quantity: nonreciprocity_critical_ratio
    unit: dimensionless
outputs:
  v:
    quantity: traveling_velocity
    unit: dimensionless
settings: {}
stochastic: false
