id: continuum_1d_pde
name: 1D nonreciprocal Cahn-Hilliard PDE with subcritical B (Eqs. 1-2, SI Eqs. S1, S4)
role: model
stated:
  page: 2
  printed_page: "19768"
  quote: "We have studied, numerically, Eq. 1 in a 1D box of length"
  where: "Eqs. 1-2, p. 19768 (and SI Eqs. S1a-b, S4a-b, p. 7)"
equation: "d_t phi_A = d_x[(chi_A + phi_A^2 - gamma_A d_x^2) d_x phi_A] + (kappa - delta) d_x^2 phi_B; d_t phi_B = chi_B d_x^2 phi_B + (kappa + delta) d_x^2 phi_A"
inputs:
  chi_A:
    quantity: control_parameter
    unit: dimensionless
  chi_B:
    quantity: control_parameter
    unit: dimensionless
  gamma_A:
    quantity: interfacial_stiffness
    unit: dimensionless
  kappa:
    quantity: reciprocal_cross_diffusivity
    unit: dimensionless
  delta:
    quantity: nonreciprocity_parameter
    unit: dimensionless
  L:
    quantity: domain_size
    unit: dimensionless
  phi0_A:
    quantity: mean_phase_field
    unit: dimensionless
  phi0_B:
    quantity: mean_phase_field
    unit: dimensionless
outputs:
  rho_A:
    quantity: fourier_mode_amplitude
    unit: dimensionless
    description: Steady-state first Fourier mode amplitude |phi_hat_A^1|.
  rho_B:
    quantity: fourier_mode_amplitude
    unit: dimensionless
    description: Steady-state first Fourier mode amplitude |phi_hat_B^1|.
  rho_A_3:
    quantity: fourier_mode_amplitude
    unit: dimensionless
    description: Steady-state third Fourier mode amplitude |phi_hat_A^3| (Fig. S1).
  rho_B_3:
    quantity: fourier_mode_amplitude
    unit: dimensionless
    description: Steady-state third Fourier mode amplitude |phi_hat_B^3| (Fig. S1).
  v:
    quantity: traveling_velocity
    unit: dimensionless
    description: Steady traveling pattern speed |dtheta_1/dt| / q_1 (Eq. 6, Fig. 2B).
  psi:
    quantity: phase_shift_from_pi
    unit: dimensionless
    description: Steady relative phase shift |theta_A - theta_B - pi| in [0, pi].
  amp_ratio:
    quantity: amplitude_ratio
    unit: dimensionless
    description: Steady first-mode amplitude ratio rho_A / rho_B.
  state_code:
    quantity: pattern_state_code
    unit: dimensionless
    description: 0 = homogeneous mixed, 1 = static demixed, 2 = traveling demixed.
settings:
  N: 64
  dt: 2.0
  t_max: 20000.0
  seed: 42
stochastic: false
