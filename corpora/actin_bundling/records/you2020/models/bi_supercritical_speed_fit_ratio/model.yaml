id: bi_supercritical_speed_fit_ratio
name: bi-supercritical constant-delta_c speed fit vs delta/kappa (Fig. S5c)
role: fit
stated:
  page: 14
  printed_page: "SI-8"
  quote: "The red line is a fit to the mean-field theory with v = δ 2 − δc2 , where δc = 1.5κ is extracted from the best fit to the data."
  where: "Fig. S5(c) caption, SI p. 8"
equation: "v = kappa * sqrt((delta/kappa)^2 - (delta_c/kappa)^2)"
inputs:
  kappa: {quantity: reciprocal_cross_diffusivity, unit: dimensionless}
  delta_over_kappa: {quantity: nonreciprocity_ratio, unit: dimensionless}
  delta_c_over_kappa: {quantity: nonreciprocity_critical_ratio, unit: dimensionless}
outputs:
  v: {quantity: traveling_velocity, unit: dimensionless}
built_from:
  - bi_supercritical_speed_fit
settings: {}
stochastic: false
