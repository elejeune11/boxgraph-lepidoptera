id: microscopic_ar_particles
name: microscopic overdamped attractive-repulsive particle mixture (SI Eqs. S36-S37, Fig. S6)
role: model
stated:
  page: 14
  printed_page: "SI-8"
  quote: "microdynamics of the particles’ positions"
  where: "SI Sec. VI.A, Eqs. S36-S37, pp. 14-16 (SI pp. 8-10), Fig. S6"
equation: "d_t r_i^mu = sum_j F^{mu,mu}(r_i^mu, r_j^mu) + sum_j F^{mu,nu}(r_i^mu, r_j^nu) + eta_i^mu; F^{mu,nu} = [k_r Theta(sigma_r, r_ij) + k_{mu,nu} Theta(sigma_{mu,nu}, r_ij)] r_hat_ij"
inputs:
  N_A:
    quantity: particle_count
    unit: dimensionless
  N_B:
    quantity: particle_count
    unit: dimensionless
  L_x:
    quantity: box_length
    unit: dimensionless
  L_y:
    quantity: box_length
    unit: dimensionless
  sigma_r:
    quantity: interaction_range
    unit: dimensionless
  sigma_AB:
    quantity: interaction_range
    unit: dimensionless
  k_r:
    quantity: interaction_strength
    unit: dimensionless
  k_AA:
    quantity: interaction_strength
    unit: dimensionless
  k_AB:
    quantity: interaction_strength
    unit: dimensionless
  k_BA:
    quantity: interaction_strength
    unit: dimensionless
  D:
    quantity: translational_diffusivity
    unit: dimensionless
outputs:
  state_code:
    quantity: pattern_state_code
    unit: dimensionless
runnable: false
not_runnable_reason: >
  Intra-species interaction ranges sigma_AA and sigma_BB, initial dense-cluster width
  and packing, and the Brownian dynamics time-stepping scheme/step size dt are unstated
  in SI Sec. VI.A and Movie S4-S5 captions; additionally p. 15 misprints the white-noise
  variance as sqrt(2D) instead of 2D, and Fig. S6 reports only qualitative snapshots,
  noisy single-realization density histograms, and kymographs without quantitative scalar
  or curve observables.
settings:
  seed: 0
stochastic: true
