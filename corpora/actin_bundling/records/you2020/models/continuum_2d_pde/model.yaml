id: continuum_2d_pde
name: 2D nonreciprocal Cahn-Hilliard PDE in periodic square box (Eq. 1, SI Sec. IV, Fig. S4)
role: model
stated:
  page: 12
  printed_page: "SI-6"
  quote: "We have integrated numerically Eq. (1) from the main text in a two-dimensional periodic box of size L × L, with L = 2π"
  where: "SI Sec. IV, pp. 12-13 (SI pp. 6-7), Fig. S4"
equation: "d_t phi_A = div[(chi_A + phi_A^2 - gamma_A nabla^2) grad phi_A] + (kappa - delta) nabla^2 phi_B; d_t phi_B = chi_B nabla^2 phi_B + (kappa + delta) nabla^2 phi_A"
inputs:
  chi_A:
    quantity: control_parameter
    unit: dimensionless
  chi_B:
    quantity: control_parameter
    unit: dimensionless
  gamma_A:
    quantity: interfacial_stiffness
    unit: dimensionless
  kappa:
    quantity: reciprocal_cross_diffusivity
    unit: dimensionless
  delta:
    quantity: nonreciprocity_parameter
    unit: dimensionless
  L:
    quantity: domain_size
    unit: dimensionless
  phi0_A:
    quantity: mean_phase_field
    unit: dimensionless
  phi0_B:
    quantity: mean_phase_field
    unit: dimensionless
outputs:
  v:
    quantity: traveling_velocity
    unit: dimensionless
    description: Traveling band drift speed in 2D (Fig. S4g; zero in static or oscillatory states).
  freq_osc:
    quantity: oscillation_frequency
    unit: dimensionless
    description: Fundamental field oscillation frequency f = 1/T of splitting-and-merging 2D oscillatory state (Fig. S4h).
  state_code:
    quantity: pattern_state_code
    unit: dimensionless
    description: 0 = homogeneous mixed, 1 = static demixed, 2 = traveling demixed.
settings:
  N: 32
  dt: 2.0
  t_max: 10000.0
  init_mode: stripe
  seed: 7
stochastic: false
