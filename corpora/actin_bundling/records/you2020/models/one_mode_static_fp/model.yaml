id: one_mode_static_fp
name: one-mode static demixed fixed point F_S (Eqs. 5a-5b, S8a-S8c)
role: model
stated:
  page: 3
  printed_page: "19769"
  quote: "The state FS describes out-of-phase spatial variations"
  where: "Eqs. 5a-5b, p. 19769 (and SI Eqs. S8a-S8c, p. 8)"
equation: "rho_A^s = sqrt((kappa^2 - delta^2 - alpha_A * alpha_B) / alpha_B); rho_B^s = (kappa + delta) * rho_A^s / alpha_B; theta^s = pi"
inputs:
  alpha_A:
    quantity: effective_linear_rate
    unit: dimensionless
  alpha_B:
    quantity: effective_linear_rate
    unit: dimensionless
  kappa:
    quantity: reciprocal_cross_diffusivity
    unit: dimensionless
  delta:
    quantity: nonreciprocity_parameter
    unit: dimensionless
outputs:
  rho_A_s:
    quantity: fourier_mode_amplitude
    unit: dimensionless
  rho_B_s:
    quantity: fourier_mode_amplitude
    unit: dimensionless
  theta_s:
    quantity: phase_difference
    unit: dimensionless
  amp_ratio_s:
    quantity: amplitude_ratio
    unit: dimensionless
    description: Steady static amplitude ratio rho_A^s / rho_B^s = alpha_B / (kappa + delta).
  v_s:
    quantity: traveling_velocity
    unit: dimensionless
    description: Zero drift velocity of static modulation F_S.
settings: {}
stochastic: false
