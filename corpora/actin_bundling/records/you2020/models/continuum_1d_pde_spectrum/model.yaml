id: continuum_1d_pde_spectrum
name: 1D subcritical-B Cahn-Hilliard PDE steady Fourier mode spectrum |phi_hat_mu^j| (Eq. S4, Fig. S1)
role: model
stated:
  page: 8
  printed_page: "SI-2"
  quote: "Amplitudes of Fourier modes |φ̂jµ | at the steady (a) static and (b) traveling states."
  where: "SI Sec. I, Eq. (S4) and Fig. S1, p. 8"
equation: "Steady-state Fourier spectrum |phi_hat_mu^j| = |FFT(phi_mu)[j]|/N of Eq. (S1)/(S4) at wavenumber q_j = j"
inputs:
  chi_A: {quantity: control_parameter, unit: dimensionless}
  chi_B: {quantity: control_parameter, unit: dimensionless}
  gamma_A: {quantity: interfacial_stiffness, unit: dimensionless}
  kappa: {quantity: reciprocal_cross_diffusivity, unit: dimensionless}
  delta: {quantity: nonreciprocity_parameter, unit: dimensionless}
  L: {quantity: domain_size, unit: dimensionless}
  phi0_A: {quantity: mean_phase_field, unit: dimensionless}
  phi0_B: {quantity: mean_phase_field, unit: dimensionless}
  q_j: {quantity: wavenumber, unit: dimensionless}
outputs:
  amp_A: {quantity: fourier_mode_amplitude, unit: dimensionless}
  amp_B: {quantity: fourier_mode_amplitude, unit: dimensionless}
built_from:
  - continuum_1d_pde
settings:
  N: 64
  dt: 2.0
  t_max: 20000.0
  seed: 42
stochastic: false
