id: velocity_ratio_run_and_catch_ratio
name: run-and-catch velocity ratio v_A^s / v_B^s vs delta/kappa (Eq. 9, Fig. 3B)
role: model
stated:
  page: 4
  printed_page: "19770"
  quote: "Ratio of velocities of the two species as given by Eq. 9"
  where: "Fig. 3B and Eq. (9), p. 19770"
equation: "v_A^s / v_B^s = (kappa^2 * ((delta/kappa)^2 - 1)) / alpha_B^2"
inputs:
  alpha_B: {quantity: effective_linear_rate, unit: dimensionless}
  kappa: {quantity: reciprocal_cross_diffusivity, unit: dimensionless}
  delta_over_kappa: {quantity: nonreciprocity_ratio, unit: dimensionless}
outputs:
  v_ratio_fs: {quantity: velocity_ratio, unit: dimensionless}
built_from:
  - velocity_ratio_run_and_catch
settings: {}
stochastic: false
