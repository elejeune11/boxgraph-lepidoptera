id: static_fp_stability_eqS14_S16
name: polar Jacobian linear stability of static state F_S (SI Eqs. S14-S16)
role: model
stated:
  page: 10
  printed_page: "SI-4"
  quote: "To investigate the stability of FS , we evaluate the Jacobian matrix given in Eq. (S11) at the fixed point"
  where: "SI Eqs. S14-S16, p. 10 (SI p. 4)"
equation: "lambda_pm^s = (1/2)[2*alpha_A - alpha_B - 3*(kappa^2 - delta^2)/alpha_B] +- (1/2)*sqrt([2*alpha_A + alpha_B - 3*(kappa^2 - delta^2)/alpha_B]^2 + 4*(kappa^2 - delta^2)); lambda_theta^s = -(delta_c^2 - delta^2)/alpha_B"
inputs:
  alpha_A:
    quantity: effective_linear_rate
    unit: dimensionless
  alpha_B:
    quantity: effective_linear_rate
    unit: dimensionless
  kappa:
    quantity: reciprocal_cross_diffusivity
    unit: dimensionless
  delta:
    quantity: nonreciprocity_parameter
    unit: dimensionless
outputs:
  re_lambda_s_plus:
    quantity: growth_rate
    unit: dimensionless
  re_lambda_s_minus:
    quantity: growth_rate
    unit: dimensionless
  lambda_theta_s:
    quantity: growth_rate
    unit: dimensionless
    description: Relative-phase eigenvalue lambda_theta^s = -(delta_c^2 - delta^2)/alpha_B (Eq. S16).
settings: {}
stochastic: false
