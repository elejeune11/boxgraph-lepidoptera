id: bi_supercritical_1d_pde
name: bi-supercritical 1D nonreciprocal Cahn-Hilliard PDE (SI Eq. S31, Fig. S5)
role: model
stated:
  page: 13
  printed_page: "SI-7"
  quote: "In this case, restoring the term φ2B − γB ∂x2 , the equations become"
  where: "SI Sec. V, Eq. S31a-b, p. 13 (SI p. 7), Fig. S5"
equation: "d_t phi_A = d_x[(chi_A + phi_A^2 - gamma_A d_x^2) d_x phi_A] + (kappa - delta) d_x^2 phi_B; d_t phi_B = d_x[(chi_B + phi_B^2 - gamma_B d_x^2) d_x phi_B] + (kappa + delta) d_x^2 phi_A"
inputs:
  chi_A:
    quantity: control_parameter
    unit: dimensionless
  chi_B:
    quantity: control_parameter
    unit: dimensionless
  gamma_A:
    quantity: interfacial_stiffness
    unit: dimensionless
  gamma_B:
    quantity: interfacial_stiffness
    unit: dimensionless
  kappa:
    quantity: reciprocal_cross_diffusivity
    unit: dimensionless
  delta:
    quantity: nonreciprocity_parameter
    unit: dimensionless
  L:
    quantity: domain_size
    unit: dimensionless
  phi0_A:
    quantity: mean_phase_field
    unit: dimensionless
  phi0_B:
    quantity: mean_phase_field
    unit: dimensionless
outputs:
  rho_A:
    quantity: fourier_mode_amplitude
    unit: dimensionless
  rho_B:
    quantity: fourier_mode_amplitude
    unit: dimensionless
  rho_A_3:
    quantity: fourier_mode_amplitude
    unit: dimensionless
  rho_B_3:
    quantity: fourier_mode_amplitude
    unit: dimensionless
  v:
    quantity: traveling_velocity
    unit: dimensionless
  state_code:
    quantity: pattern_state_code
    unit: dimensionless
settings:
  N: 64
  dt: 2.0
  t_max: 20000.0
  seed: 42
stochastic: false
