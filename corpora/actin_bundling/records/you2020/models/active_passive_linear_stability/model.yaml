id: active_passive_linear_stability
name: linear stability and diffusivities of active-passive continuum Eqs. (S39)-(S40)
role: model
stated:
  page: 17
  printed_page: "SI-11"
  quote: "The corresponding coarse-grained equations as derived in [12] are given by"
  where: "SI Sec. VI.B, Eqs. S39-S40, pp. 17-18 (SI pp. 11-12), Fig. S7"
equation: "v = v_0*(1 - a_0^AA*rho_A - a_0^AP*rho_P); D_AA = a_1^AA*rho_A + (v/(2*D_R))*(v - a_0^AA*v_0*rho_A); D_AP = a_1^AP*rho_A - (v/(2*D_R))*a_0^AP*v_0*rho_A; D_PA = a_1^PA*rho_P; D_PP = a_1^PP*rho_P; M(q_1) = -q_1^2*[[D_AA + kappa*q_1^2, D_AP], [D_PA, D_PP + kappa*q_1^2]]"
described_from: ref-47
inputs:
  v_0:
    quantity: propulsion_speed
    unit: dimensionless
  D_R:
    quantity: rotational_diffusivity
    unit: dimensionless
  a0_AA:
    quantity: motility_suppression_coeff
    unit: dimensionless
  a0_AP:
    quantity: motility_suppression_coeff
    unit: dimensionless
  a1:
    quantity: steric_diffusivity_coeff
    unit: dimensionless
  kappa_ap:
    quantity: biharmonic_stiffness
    unit: dimensionless
  rho_A0:
    quantity: mean_number_density
    unit: dimensionless
  rho_P0:
    quantity: mean_number_density
    unit: dimensionless
  L:
    quantity: domain_size
    unit: dimensionless
outputs:
  D_AA:
    quantity: ap_diffusivity
    unit: dimensionless
  D_AP:
    quantity: ap_diffusivity
    unit: dimensionless
  D_PA:
    quantity: ap_diffusivity
    unit: dimensionless
  D_PP:
    quantity: ap_diffusivity
    unit: dimensionless
  max_re_lambda_q1:
    quantity: growth_rate
    unit: dimensionless
    description: Largest real part of linear growth rate of mode q_1 = 2*pi/L around uniform (rho_A0, rho_P0).
  L_min_unstable:
    quantity: domain_size
    unit: dimensionless
    description: Minimum periodic domain length L_min = 2*pi*sqrt(kappa_ap / max_re_eig(-D)) required for mode q_1 to be linearly unstable.
settings: {}
stochastic: false
