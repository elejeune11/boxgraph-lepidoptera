id: continuum_2d_pde_ratio
name: 2D nonreciprocal Cahn-Hilliard PDE swept over delta/kappa (SI Sec. IV, Figs. S4g-h)
role: model
stated:
  page: 12
  printed_page: "SI-6"
  quote: "two-dimensional periodic box of size L × L, with L = 2π"
  where: "SI Sec. IV, p. 12 and Fig. S4(g-h), p. 13"
equation: "d_t phi_mu = nabla^2 [(chi_mu + phi_mu^2 - gamma_mu nabla^2) phi_mu + kappa_munu phi_nu] in 2D with delta = (delta/kappa)*kappa"
inputs:
  chi_A: {quantity: control_parameter, unit: dimensionless}
  chi_B: {quantity: control_parameter, unit: dimensionless}
  gamma_A: {quantity: interfacial_stiffness, unit: dimensionless}
  kappa: {quantity: reciprocal_cross_diffusivity, unit: dimensionless}
  delta_over_kappa: {quantity: nonreciprocity_ratio, unit: dimensionless}
  L: {quantity: domain_size, unit: dimensionless}
  phi0_A: {quantity: mean_phase_field, unit: dimensionless}
  phi0_B: {quantity: mean_phase_field, unit: dimensionless}
outputs:
  v: {quantity: traveling_velocity, unit: dimensionless}
  freq_osc: {quantity: oscillation_frequency, unit: dimensionless}
  state_code: {quantity: pattern_state_code, unit: dimensionless}
built_from:
  - continuum_2d_pde
settings:
  N: 32
  dt: 2.0
  t_max: 10000.0
  init_mode: stripe
  seed: 7
stochastic: false
