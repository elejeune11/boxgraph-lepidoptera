id: one_mode_traveling_fp
name: one-mode traveling demixed fixed point F_T (Eqs. 6, 7a-7c, S9a-S9c)
role: model
stated:
  page: 3
  printed_page: "19769"
  quote: "The FT state is a spatial modulation traveling at constant speed"
  where: "Eqs. 6, 7a-7c, p. 19769 (and SI Eqs. S9a-S9c, p. 9)"
equation: "delta_c = sqrt(kappa^2 + alpha_B^2); v = sqrt(delta^2 - delta_c^2); rho_A^t = sqrt(-alpha_A - alpha_B); rho_B^t = sqrt((delta + kappa)/(delta - kappa)) * rho_A^t; theta^t = arccos(-sqrt(alpha_B^2 / (delta^2 - kappa^2)))"
inputs:
  alpha_A:
    quantity: effective_linear_rate
    unit: dimensionless
  alpha_B:
    quantity: effective_linear_rate
    unit: dimensionless
  kappa:
    quantity: reciprocal_cross_diffusivity
    unit: dimensionless
  delta:
    quantity: nonreciprocity_parameter
    unit: dimensionless
outputs:
  delta_c:
    quantity: nonreciprocity_parameter
    unit: dimensionless
    description: Critical nonreciprocity parameter delta_c = sqrt(kappa^2 + alpha_B^2) for the static-to-traveling transition.
  delta_c_over_kappa:
    quantity: nonreciprocity_critical_ratio
    unit: dimensionless
  v:
    quantity: traveling_velocity
    unit: dimensionless
  rho_A_t:
    quantity: fourier_mode_amplitude
    unit: dimensionless
  rho_B_t:
    quantity: fourier_mode_amplitude
    unit: dimensionless
  theta_t:
    quantity: phase_difference
    unit: dimensionless
  psi_t:
    quantity: phase_shift_from_pi
    unit: dimensionless
    description: Positive phase shift magnitude psi^t = pi - theta^t = |theta^t - pi| plotted in Fig. 3C.
  amp_ratio_t:
    quantity: amplitude_ratio
    unit: dimensionless
    description: Traveling amplitude ratio rho_A^t / rho_B^t = sqrt((delta - kappa)/(delta + kappa)).
settings: {}
stochastic: false
