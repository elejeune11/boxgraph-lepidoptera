notes: >
  Read stage of You, Baskaran & Marchetti, PNAS 117, 19767-19772 (2020), together with
  its 13-page Supplemental Material and movie captions (PDF pp. 1-19). All 19 pages of
  extracted text and all equation- and figure-bearing page images (pages/page-002.png
  through page-018.png) were inspected directly.
  Scope included: (1) main-text 1D nonreciprocal Cahn-Hilliard (coupled Model B) PDE
  Eqs. (1)-(2) / SI Eqs. (S1)-(S4), decoupled ground states, cross-diffusivity
  parametrization, and direct Fourier-Galerkin pseudospectral 1D PDE simulation;
  (2) one-mode approximation Eqs. (3)-(7) / SI Eqs. (S5)-(S10), including effective
  parameters alpha_A and alpha_B, static fixed point F_S, traveling fixed point F_T,
  and numerical ODE integration of Eqs. (3)-(4); (3) linear stability of F_H Eq. (8) /
  (S12)-(S13) and analytical Fig. 1A phase boundaries + Fig. S2 eigenvalues;
  (4) run-and-catch velocity ratio Eq. (9) and PT-breaking near-critical scaling Eq. (11)
  (Fig. 3B-C); (5) linear stability of F_S and exceptional-point coalescing Goldstone
  eigenmodes of the 3x3 polar Jacobian M_S and 4x4 complex Jacobian L (SI Eqs. S11,
  S14-S30, Fig. S3); (6) 2D periodic PDE Eq. (1) traveling stripe velocity (Fig. S4g)
  and oscillatory splitting-merging frequency (Fig. S4h); (7) bi-supercritical 1D PDE
  SI Eq. (S31), exact analytical solution of its one-mode Eqs. (S32)-(S33), and the
  paper's constant-delta_c fit formula v = sqrt(delta^2 - delta_c^2) (Fig. S5c);
  (8) SI Sec. VI.A microscopic attractive-repulsive particle model Eqs. (S36)-(S37)
  (recorded as runnable: false due to unstated sigma_AA, sigma_BB, dt, and noise-variance
  misprint) plus its unnumbered 2D mean-field coefficient R_munu on p. 16 together with a
  variant_of correction replacing pi/6 by pi/12; and (9) SI Sec. VI.B coarse-grained
  active-passive Brownian mixture PDE Eqs. (S39)-(S40) and its linear stability (Fig. S7).
  Key quantitative findings and discrepancies uncovered:
  (a) SI Fig. S1(a) (p. 8) claims to show Fourier mode amplitudes of the main-text
  subcritical-B model at chi_A = -0.05, delta = kappa, but plots |phi_B^1| ~ 0.1335 and
  |phi_A^1| ~ 0.1005 (ratio 1.33, with |phi_B^3| ~ 0.0023 > |phi_A^3| ~ 0.0010), which
  disagrees with the main-text model (|phi_B^1| = 0.2010, ratio 2.00, as plotted in
  Fig. 2A) and matches instead the bi-supercritical 1D PDE Eq. (S31) at delta = kappa
  (|phi_A^1| = 0.1005, |phi_B^1| = 0.1335, |phi_A^3| = 0.00103, |phi_B^3| = 0.00233);
  meanwhile Fig. S1(b) (delta = 3*kappa) matches the main-text subcritical-B model.
  (b) In SI Sec. V (p. 14), the text claims Eqs. (S34)-(S35) "immediately give
  v = +-sqrt(delta^2 - delta_c^2)" and Fig. S5(c) fits delta_c = 1.5*kappa, whereas exact
  solution of the printed bi-supercritical one-mode Eqs. (S33a)-(S33d) yields
  v = +-sqrt(delta^2 - kappa^2 - (kappa*alpha/delta)^2) with non-constant shift and onset
  delta_c/kappa = sqrt((1 + sqrt(17))/2) = 1.6005; direct 1D PDE Eq. (S31) confirms the
  system is still static at delta = 1.5*kappa (v = 0) and tracks the exact one-mode curve
  above the paper's constant-delta_c fit (e.g. v = 0.01919 vs 0.01920 exact 1-mode vs
  0.01854 fitted curve at delta/kappa = 4).
  (c) In SI Sec. VI.B (pp. 17-18), the domain length L for active-passive Eqs. (S39)-(S40)
  is unstated in prose while Fig. S7(b-d) label x in [0, 2*pi]; with L = 2*pi and printed
  kappa = 1000 the homogeneous state is strongly stabilized (kappa*q_1^2 = 1000 >> max Re
  eig ~ 60) everywhere in Fig. S7(a), whereas L = 64 (matching N = 64 at h = 1,
  kappa*q_1^2 = 9.638) reproduces the exact Fig. S7(a) onset (including the isolated static
  point at v_0 = 50, rho_A^0 = 0.625), static/traveling transition (v_0 = 60 static,
  v_0 = 70 traveling), density profiles, and Fig. S7(c-d) time scale (period ~ 79).
  (d) In SI Sec. VI.A (p. 16), the printed 2D mean-field coefficient R_munu =
  (k_r*sigma_r^4 + k_munu*sigma_munu^4)*pi/6 misses a factor of 1/2 from the 2D angular
  average <cos^2 theta> = 1/2 (exact integral gives pi/12), and on p. 15 the white-noise
  variance is misprinted as sqrt(2D) instead of 2D.
  (e) In SI Fig. S4(h) (p. 13), the y-axis is labeled T while the caption states
  oscillating frequency and the plotted values (~0.001-0.0021) match frequency f = 1/T
  (reproduced directly by 2D PDE simulation).
  (f) The main text (pp. 1, 3, 5, 18) repeatedly calls the stationary spinodal pitchfork
  bifurcation F_H -> F_S at delta = 0 a "Hopf bifurcation", while correctly calling it a
  "supercritical pitchfork bifurcation" on p. 4.
  Left out: (1) calibrated figure digitization (figures.yaml and figures.md), deferred to
  the separate digitize stage (eye-read approximate figure values are recorded with '~'
  for digitize:you2020 to replace); (2) qualitative kymographs, 2D snapshots, and particle
  trajectory movies (Figs. 1B-D, 3A, 3D, S4a-f, S5a-b, S6, S7b-d; Movies S1-S5).
