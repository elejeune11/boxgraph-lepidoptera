- id: control_parameter
  name: Cahn-Hilliard bulk control parameter chi_mu
  dimension: dimensionless
  description: Quadratic bulk coefficient chi_mu in Eq. (1); chi_mu < 0 is supercritical (spinodal demixing), chi_mu > 0 is subcritical.

- id: control_parameter_magnitude
  name: magnitude of supercritical control parameter |chi_A|
  dimension: dimensionless
  description: Positive magnitude |chi_A| = -chi_A used on the vertical axis of the Fig. 1A state diagram.

- id: interfacial_stiffness
  name: interfacial gradient stiffness gamma_mu
  dimension: dimensionless
  description: Fourth-order gradient coefficient gamma_mu in Cahn-Hilliard Eq. (1).

- id: reciprocal_cross_diffusivity
  name: reciprocal cross-diffusivity kappa
  dimension: dimensionless
  description: Symmetric (reciprocal) part kappa = (kappa_AB + kappa_BA)/2 of cross-diffusivity in Eq. (2).

- id: nonreciprocity_parameter
  name: nonreciprocity parameter delta
  dimension: dimensionless
  description: Antisymmetric (nonreciprocal) part delta = (kappa_BA - kappa_AB)/2 of cross-diffusivity in Eq. (2).

- id: nonreciprocity_ratio
  name: nonreciprocity ratio delta/kappa
  dimension: dimensionless
  description: Dimensionless ratio delta/kappa tuning nonreciprocity in Figs. 1-3 and Figs. S2, S4, S5.

- id: nonreciprocity_critical
  name: critical nonreciprocity delta_c
  dimension: dimensionless
  description: Critical nonreciprocity threshold delta_c for the static-to-traveling PT-breaking drift bifurcation.

- id: nonreciprocity_critical_ratio
  name: critical nonreciprocity ratio delta_c/kappa
  dimension: dimensionless
  description: Critical nonreciprocity normalized by reciprocal coupling, delta_c/kappa.

- id: normalized_nonreciprocity
  name: normalized nonreciprocity delta/delta_c
  dimension: dimensionless
  description: Nonreciprocity normalized by critical threshold delta_c, used on the horizontal axis of Fig. S3.

- id: cross_diffusivity
  name: directed cross-diffusivity kappa_munu
  dimension: dimensionless
  description: Directed cross-diffusivity kappa_AB or kappa_BA in Eq. (1)-(2).

- id: effective_linear_rate
  name: effective one-mode linear coefficient alpha_mu
  dimension: dimensionless
  description: Effective linear coefficient alpha_mu = chi_mu + gamma_mu + (phi_mu^0)^2 for the q_1 = 1 Fourier mode in Eq. (3) and Eq. (S32).

- id: mean_phase_field
  name: spatially conserved mean phase field phi_mu^0
  dimension: dimensionless
  description: Spatial average (zeroth Fourier mode) of conserved field phi_mu.

- id: phase_field_ground_state
  name: decoupled ground-state phase field phi_mu^g
  dimension: dimensionless
  description: Uniform ground state value phi_mu^g of decoupled Cahn-Hilliard field (kappa_munu = 0).

- id: domain_size
  name: periodic 1D/2D domain length L
  dimension: dimensionless
  description: Linear size L of the periodic simulation domain.

- id: grid_spacing
  name: finite-difference grid spacing h
  dimension: dimensionless
  description: Uniform spatial grid spacing h = L/N.

- id: time_step
  name: numerical integration time step Delta_t
  dimension: dimensionless
  description: Time-marching step size Delta_t for PDE integration.

- id: wavenumber
  name: Fourier mode wavenumber q_j
  dimension: dimensionless
  description: Discrete periodic wavenumber q_j = 2*pi*j/L.

- id: fourier_mode_amplitude
  name: Fourier mode amplitude rho_mu = |phi_hat_mu^j|
  dimension: dimensionless
  description: Modulus of complex spatial Fourier mode amplitude |phi_hat_mu^j| (first mode rho_mu unless higher harmonic specified).

- id: amplitude_ratio
  name: first-mode amplitude ratio rho_A/rho_B
  dimension: dimensionless
  description: Ratio of species A to species B first-Fourier-mode amplitudes rho_A/rho_B (Fig. 3C).

- id: phase_difference
  name: relative phase difference theta = theta_A - theta_B
  dimension: dimensionless
  description: Relative phase angle (in radians) between first Fourier modes of species A and B.

- id: phase_shift_from_pi
  name: phase shift from antiphase psi = |theta - pi|
  dimension: dimensionless
  description: Magnitude of relative phase deviation psi = theta - pi (in radians) from the antiphase static pattern (Fig. 3C).

- id: traveling_velocity
  name: traveling pattern drift speed v
  dimension: dimensionless
  description: Constant drift speed v = |dPhi/dt|/2 of the traveling spatial modulation (Eq. 6, Figs. 2B, S4g, S5c).

- id: velocity_ratio
  name: field velocity ratio v_A/v_B
  dimension: dimensionless
  description: Ratio v_A/v_B of instantaneous phase velocities of species A and B modulations (Eq. 9, Fig. 3B-C).

- id: oscillation_frequency
  name: 2D oscillatory pattern frequency f
  dimension: dimensionless
  description: Oscillation frequency (1/period) of periodic splitting-and-merging domains in 2D (Fig. S4h).

- id: growth_rate
  name: linear stability eigenvalue or real part Re[lambda]
  dimension: dimensionless
  description: Real eigenvalue or real part of complex eigenvalue governing linear stability (Eqs. 8, S13, S15, S16, S21-S23, S28; Figs. S2, S3a).

- id: eigenvalue_imaginary_part
  name: imaginary part of linear stability eigenvalue Im[lambda]
  dimension: dimensionless
  description: Imaginary part Im[lambda_pm^h] of homogeneous-state eigenvalues (Eq. 8 / S13, Fig. S2).

- id: eigenvector_component
  name: component of stability eigenvector u_1^pm(k)
  dimension: dimensionless
  description: Component of the 4-vector eigenmode u_1^pm of complex fluctuation matrix L (Eq. S29, Fig. S3b-c).

- id: matrix_determinant
  name: steady-state operator determinant det[D_s]
  dimension: dimensionless
  description: Determinant of the 2x2 non-Hermitian matrix D_s = D[phi_hat_A^s] at F_S (Eq. S24).

- id: pattern_state_code
  name: dynamical state classification code
  dimension: dimensionless
  description: "Discrete state code from PDE dynamics: 0 = homogeneous mixed (F_H), 1 = static demixed (F_S), 2 = traveling demixed (F_T)."

- id: phase_growth_slope
  name: near-critical phase perturbation growth rate dpsi/dt / psi
  dimension: dimensionless
  description: Linearized growth rate 2*delta_c*(delta - delta_c)/alpha_B of phase shift psi near delta_c (Eq. 11).

- id: sum_phase_velocity_slope
  name: near-critical sum-phase velocity slope dPhi_T/dt / psi
  dimension: dimensionless
  description: Linearized coefficient 2*alpha_B relating sum-phase rate dPhi_T/dt to phase shift psi near delta_c (p. 5).

- id: particle_count
  name: microscopic particle count per species N_mu
  dimension: dimensionless
  description: Number of particles N_A or N_B in the microscopic attractive-repulsive simulation (SI Sec. VI.A).

- id: box_length
  name: microscopic simulation box edge length
  dimension: dimensionless
  description: Horizontal (L_x) or vertical (L_y) periodic box dimension in SI Sec. VI.A.

- id: interaction_range
  name: pairwise interaction range sigma
  dimension: dimensionless
  description: Cutoff range sigma_r or sigma_munu of piecewise-linear pair forces in Eq. (S37).

- id: interaction_strength
  name: pairwise interaction strength k
  dimension: dimensionless
  description: Force stiffness constant k_r or k_munu in Eq. (S37).

- id: translational_diffusivity
  name: Brownian translational diffusivity D
  dimension: dimensionless
  description: Translational diffusion constant D in overdamped Langevin Eq. (S36).

- id: meanfield_interaction_coeff
  name: coarse-grained mean-field coefficient R_munu
  dimension: dimensionless
  description: Gradient-expansion interaction coefficient R_munu in SI Sec. VI.A continuum macrodynamics (p. 16).

- id: effective_cross_diffusivity_mf
  name: coarse-grained effective cross-diffusivity analog
  dimension: dimensionless
  description: Reciprocal (kappa_munu) or nonreciprocal (delta_munu) cross-diffusivity analog in SI Sec. VI.A (p. 16).

- id: mean_number_density
  name: mean particle number density rho_mu^0
  dimension: dimensionless
  description: Spatially averaged density of active (rho_A^0) or passive (rho_P^0) particles in SI Sec. VI.B (Fig. S7).

- id: local_number_density
  name: local density amplitude or extremum in active-passive mixture
  dimension: dimensionless
  description: Local active or passive density value or first-mode amplitude in Eqs. (S39)-(S40).

- id: propulsion_speed
  name: active Brownian propulsion speed v_0
  dimension: dimensionless
  description: Bare self-propulsion speed v_0 of active particles in Eqs. (S38)-(S40) and Fig. S7.

- id: rotational_diffusivity
  name: active rotational diffusivity D_R
  dimension: dimensionless
  description: Rotational diffusion coefficient D_R of ABP orientation in Eqs. (S38) and (S40).

- id: motility_suppression_coeff
  name: collision motility-suppression coefficient a_0^munu
  dimension: dimensionless
  description: Linear density-slowdown coefficient a_0^AA or a_0^AP in v = v_0(1 - a_0^AA rho_A - a_0^AP rho_P) (Eq. S40).

- id: steric_diffusivity_coeff
  name: steric diffusivity coefficient a_1^munu
  dimension: dimensionless
  description: Repulsive pair-interaction diffusivity coefficient a_1^munu in Eq. (S40).

- id: biharmonic_stiffness
  name: biharmonic interfacial stiffness kappa_AP
  dimension: dimensionless
  description: Fourth-order gradient damping coefficient kappa in active-passive PDE Eq. (S39).

- id: ap_diffusivity
  name: active-passive direct or cross diffusivity D_munu
  dimension: dimensionless
  description: Density-dependent diffusivity D_AA, D_AP, D_PA, or D_PP in Eq. (S40).

- id: wave_angular_frequency
  name: traveling wave angular frequency omega
  dimension: dimensionless
  description: Angular phase velocity |dtheta_1/dt| = 2*pi/T of the first spatial harmonic in the active-passive 1D PDE.

- id: wave_transit_period
  name: traveling wave box-transit period T
  dimension: dimensionless
  description: Time T = 2*pi/omega for a traveling domain to traverse the periodic 1D box once (Fig. S7d).
