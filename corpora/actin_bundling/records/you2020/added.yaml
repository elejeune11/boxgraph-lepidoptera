- id: L_ap_added
  quantity: domain_size
  unit: dimensionless
  printed: "64"
  basis: >
    SI Sec. VI.B (pp. 17-18) does not state the 1D domain length L for active-passive
    Eqs. (S39)-(S40), whereas Fig. S7(b-d) label the horizontal axis 0, pi, 2*pi.
    With L = 2*pi (q_1 = 1) and the printed kappa = 1000, biharmonic damping
    kappa*q_1^2 = 1000 exceeds the maximum instability eigenvalue (~60) everywhere in
    Fig. S7(a), giving only homogeneous decay. With L = 64 (consistent with N = 64
    grid points at unit spacing h = 1, giving kappa*q_1^2 = 9.6383), Eqs. (S39)-(S40)
    reproduce the exact Fig. S7(a) linear onset (isolated static point at v_0 = 50,
    rho_A^0 = 0.625 where max Re eig = 9.70 > 9.64 > 9.32 at rho_A^0 = 0.60), the
    static-to-traveling transition between v_0 = 60 and 70 at rho_A^0 = 0.6, and the
    Fig. S7(c-d) time scale t in [0, 600] (transit period ~79).
  alternatives: ["6.283185307179586", "62.83185307179586"]
  stands_for: "Unstated 1D periodic domain length L in SI Sec. VI.B Eqs. (S39)-(S40)"

- id: phi_mf_uniform_added
  quantity: mean_phase_field
  unit: dimensionless
  printed: "0.14583333333333334"
  basis: >
    Mean particle number density N_mu / (L_x * L_y) = 525 / (120 * 30) = 7/48 from the
    SI Sec. VI.A simulation parameters (p. 16), used to evaluate the unnumbered
    mean-field cross-diffusivity analogs kappa_munu and delta_munu at uniform density.
  alternatives: ["0.5", "1.0"]
  stands_for: "Local density phi_mu in kappa_munu = k_r*sigma_r^4*(pi/6)*phi_mu and delta_munu = k_munu*sigma_munu^4*(pi/6)*phi_mu (SI p. 16)"

- id: psi_mid_fig3c_added
