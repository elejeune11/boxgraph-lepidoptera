- id: q_eqS15_amplitude_eigenvalues_positive_real_part
  kind: possible_error
  about:
    - static_fp_stability_eqS14_S16
    - run_fs_stab_chi006_dk2
  text: >
    SI Sec. II (p. 10 / SI-4, directly below Eq. S15) claims that the coupled amplitude
    eigenvalues lambda_pm^s of the static fixed point F_S "always have a negative real part
    in the region of parameters where F_S exists, hence are stable." Analytically, the
    top-left 2x2 block of M_S in Eq. (S14) has det = 2*alpha_B*R > 0 (where R = (rho_A^s)^2
    = (kappa^2 - delta^2)/alpha_B - alpha_A > 0 whenever F_S exists) and trace =
    -3*R - alpha_A - alpha_B. Whenever alpha_A < -alpha_B (above the red line in Fig. 1A)
    and kappa^2 + alpha_B*(alpha_B - 2*alpha_A)/3 < delta^2 < kappa^2 - alpha_A*alpha_B
    (inside the F_S existence band between the black line delta = delta_c and the dashed
    blue line in Fig. 1A), trace > 0 and det > 0 so BOTH amplitude eigenvalues lambda_pm^s
    have strictly positive real part. For instance, at chi_A = -0.06, delta = 2*kappa
    (run_fs_stab_chi006_dk2, where R = 0.005 > 0) Re[lambda_pm^s] = 0 exactly, and at
    chi_A = -0.05, delta = 1.7*kappa (R = 0.00055 > 0) Re[lambda_pm^s] = +0.001675 > 0.
    The statement holds only for delta <= delta_c, not across the full existence domain of F_S.
  citation:
    page: 10
    printed_page: "SI-4"
    quote: "which always have a negative real part in the region of parameters where FS exists, hence are stable."
    where: "SI Sec. II, below Eq. (S15), p. 10 (SI p. 4)"

- id: q_eqS19_Ds_modes_never_complex_conjugate
  kind: possible_error
  about:
    - exceptional_point_matrix_L
  text: >
    SI Sec. III (p. 11 / SI-5, lines 6-7, below Eqs. S19-S20) states: "Substituting
    phi_A^0 = phi_A^s, we find that the modes change from real to complex conjugates at
    delta = delta_c = sqrt(kappa^2 + alpha_B^2). At this point, solutions change from
    stationary to oscillatory." However, substituting |phi_hat_A^s|^2 = (kappa^2 - delta^2)/alpha_B
    - alpha_A into Delta = (alpha_B - alpha_A - |phi_hat_A^0|^2)^2 + 4*(kappa^2 - delta^2)
    gives Delta(phi_hat_A^s) = [alpha_B + (kappa^2 - delta^2)/alpha_B]^2 =
    [(delta_c^2 - delta^2)/alpha_B]^2 >= 0 identically for all real delta. Thus Delta
    touches zero tangentially at the exceptional point delta = delta_c (where the two
    eigenvalues and eigenvectors coalesce) and never becomes negative; as confirmed by the
    paper's own Eqs. (S21)-(S23), the eigenvalues of D_s remain purely real for both
    delta < delta_c and delta > delta_c and never become complex conjugate.
  citation:
    page: 11
    printed_page: "SI-5"
    quote: "we find that the modes change from real to complex conjugates at δ = δc"
    where: "SI Sec. III, above Eq. (S21), p. 11 (SI p. 5)"

- id: q_micro_meanfield_same_sign_cross_diffusivity
  kind: unexplained_difference
  about:
    - microscopic_ar_meanfield
    - microscopic_ar_meanfield_pi12
    - run_micro_mf_AB_printed
    - run_micro_mf_BA_printed
  text: >
    In SI Sec. VI.A (p. 16 / SI-10), the paper derives a low-density mean-field cross-diffusion
    coefficient R_munu = (k_r*sigma_r^4 + k_munu*sigma_munu^4)*(pi/6) (or pi/12 after fixing
    the 2D angular average) and identifies kappa_munu = k_r*sigma_r^4*(pi/6)*phi_mu and
    delta_munu = k_munu*sigma_munu^4*(pi/6)*phi_mu to map the attractive-repulsive particle
    simulation onto the main-text antagonistic cross-diffusivity model (where traveling states
    require opposite-sign total cross-diffusivities, kappa_AB*kappa_BA < 0). Evaluating this
    printed formula at the paper's own traveling-state simulation parameters (k_r = 2000,
    sigma_r = 1, k_AB = -2, k_BA = 1, sigma_AB = sigma_BA = 3) gives k_r*sigma_r^4 = 2000 >>
    |k_AB|*sigma_AB^4 = 162, so both R_AB = 962.37 (481.19 with pi/12) and R_BA = 1089.61
    (544.80 with pi/12) remain strictly POSITIVE (same sign, |delta_AB|/kappa_AB = 0.081 << 1).
    This occurs because the naive g(r) = 1 mean-field integral overweights the hard-core overlap
    region r < sigma_r where large k_r = 2000 actually suppresses particle overlap (g(r) ~ 0)
    in the microscopic simulation.
  citation:
    page: 16
    printed_page: "SI-10"
    quote: "Focussing on the cross diffusion coefficient, note that in this model, the analog of the reciprocal part"
    where: "SI Sec. VI.A, p. 16 (SI p. 10)"

