  text: >
    In SI Sec. VI.B (pp. 17-18), the text specifies D_R = 3, a_0^AA = 1, a_0^AP = 0.7,
    a_1^munu = 25, kappa = 1000, and rho_P^0 = 0.3 for Eqs. (S39)-(S40), but never states
    the 1D periodic box length L, while Fig. S7(b-d) label the spatial axis 0, pi, 2*pi
    (implying L = 2*pi). With L = 2*pi (q_1 = 1) and kappa = 1000, biharmonic damping
    kappa*q_1^2 = 1000 completely stabilizes the uniform state everywhere in Fig. S7(a)
    (max Re eig(-D) < 60, requiring L_min > 25 even at v_0 = 80 and L_min = 63.79 at
    v_0 = 50, rho_A^0 = 0.625). Setting L = 64 (consistent with N = 64 grid points at
    unit spacing h = 1, giving kappa*q_1^2 = 9.6383) reproduces the exact Fig. S7(a) onset
    (including the isolated static square at v_0 = 50, rho_A^0 = 0.625 where max Re = 9.70
    > 9.64 > 9.32 at rho_A^0 = 0.60), the static/traveling transition between v_0 = 60 and
    v_0 = 70 at rho_A^0 = 0.6, and the Fig. S7(c-d) time scale (period T = 78.03 vs ~3.8
    box transits in t in [300, 600]). Thus Fig. S7(b-d) almost certainly rescaled or
    mislabeled x from [0, 64] as [0, 2*pi].
  citation:
    page: 18
    printed_page: "SI-12"
    quote: "= 25, and κ = 1000. We have fixed ρ0P = 0.3 and tuned ρ0A and v0"
    where: "SI Sec. VI.B, p. 12 (and Fig. S7b-d x-axis labels 0, pi, 2*pi on p. 11)"

