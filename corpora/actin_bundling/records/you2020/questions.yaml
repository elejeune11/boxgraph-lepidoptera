    19, 20) establishes an exact mathematical equivalence together with three key nonlinear
    and bifurcation contrasts:
    (1) Exact PDE isomorphism (SI Eq. S31 <-> Frohoff Eq. 4): under length scale
    L_0 = (L*gamma_A)^(1/4), time scale tau_0 = L_0^4/gamma_A = L, field scale
    phi_hat = sqrt(3*gamma_A)/L_0 with phi_A = phi_hat*phi_1 and phi_B = -phi_hat*phi_2,
