  text: >
    In SI Sec. VI.A (p. 16), the unnumbered 2D gradient expansion of the mean-field force
    prints R_munu = (k_r*sigma_r^4 + k_munu*sigma_munu^4)*(pi/6) and correspondingly
    kappa_munu = k_r*sigma_r^4*(pi/6)*phi_mu and delta_munu = k_munu*sigma_munu^4*(pi/6)*phi_mu.
    Direct evaluation of the printed 2D polar integral gives
    (int_0^{2*pi} cos^2(theta) dtheta) * (int_0^sigma s^2*(sigma - s) ds) = pi * (sigma^4 / 12)
    = (pi/12)*sigma^4, half of the printed pi/6 (omitting the 1/2 from the 2D angular average
    <cos^2 theta> = 1/2). A corrected variant_of model microscopic_ar_meanfield_pi12 is
    included alongside the verbatim printed model.
