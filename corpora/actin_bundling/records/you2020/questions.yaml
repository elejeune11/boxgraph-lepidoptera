    drift-pitchfork integral I_DP = int [(phi_1 - phi_bar_1)^2 + (1/Q)*((rho+alpha)/(rho-alpha))
    *(phi_2 - phi_bar_2)^2] dx = 0 on a single-mode static profile with Q = 1, rho = kappa,
    alpha = -delta yields (rho_A)^2 + ((kappa - delta)/(kappa + delta))*(rho_B)^2 = 0,
    which is algebraically identical to You Eq. (9) run-and-catch velocity-ratio criterion
    v_A/v_B = -((kappa - delta)*rho_B^2)/((kappa + delta)*rho_A^2) = 1 and to You SI Eq. (S16)
