- id: q_figS1a_wrong_model_spectrum
  kind: possible_error
  about:
    - rho_B_figS1a_dk1_eye
    - continuum_1d_pde
    - bi_supercritical_1d_pde
    - cmp_figS1a_rhoB_main_pde
    - cmp_figS1a_rhoB_bisup_pde
  text: >
    SI Fig. S1(a) (p. 8) is presented in SI Sec. I as the Fourier mode spectrum of the
    main-text subcritical-B 1D PDE Eq. (S1) (chi_A = -0.05, chi_B = 0.005, gamma_A = 0.04,
    gamma_B = 0, ignoring phi_B^2) at steady static state delta = kappa. However, both
    one-mode Eq. (5) (rho_A^s = 0.1000, rho_B^s = 0.2000) and converged 1D PDE Eq. (S1)
    (|phi_hat_A^1| = 0.1005, |phi_hat_B^1| = 0.2010, |phi_hat_A^3| = 0.00103,
    |phi_hat_B^3| = 0.00205) yield |phi_hat_B^1| / |phi_hat_A^1| = 2.00 (matching main
    Fig. 2A at delta/kappa = 1), whereas Fig. S1(a) has top y-tick 0.14 and plots
    |phi_hat_A^1| ~ 0.100, |phi_hat_B^1| ~ 0.1335 (ratio 1.33, with |phi_hat_B^3| ~ 0.0023
    > |phi_hat_A^3| ~ 0.0010). This matches the bi-supercritical 1D PDE Eq. (S31) at
    delta = kappa (|phi_hat_A^1| = 0.1005, |phi_hat_B^1| = 0.13352, |phi_hat_A^3| = 0.00103,
    |phi_hat_B^3| = 0.00233) to four significant figures, suggesting Fig. S1(a) accidentally
    plotted a bi-supercritical static spectrum while Fig. S1(b) (delta = 3*kappa) plotted
    the subcritical-B traveling spectrum (|phi_hat_A^1| = 0.070, |phi_hat_B^1| = 0.099).
  citation:
    page: 8
    printed_page: "SI-2"
    quote: "Amplitudes of Fourier modes |φ̂jµ | at the steady (a) static and (b) traveling states. We used χA = −0.05 and (a) δ = κ and (b) δ = 3κ."
    where: "Fig. S1 caption, SI p. 2"

- id: q_bisup_speed_formula_and_dc
  kind: possible_error
  about:
    - bi_supercritical_one_mode_fp
    - bi_supercritical_speed_fit
    - bi_supercritical_1d_pde
    - delta_c_over_kappa_bisup_fitted
    - cmp_bisup_dc_exact1m_vs_fitted
  text: >
    In SI Sec. V (p. 14), the text below Eq. (S35) states that Eqs. (S34)-(S35)
    "immediately give v = +-sqrt(delta^2 - delta_c^2)" and Fig. S5(c) fits this form with
    constant delta_c = 1.5*kappa. Solving the printed bi-supercritical one-mode Eqs.
    (S33a)-(S33d) analytically instead gives rho_A^2 = -(delta - kappa)*(alpha_A + alpha_B)/(2*delta),
    sqrt(delta^2 - kappa^2)*cos(theta) = (alpha_A - alpha_B)/2 + kappa*(alpha_A + alpha_B)/(2*delta),
    and v = +-sqrt(delta^2 - kappa^2 - ((alpha_A - alpha_B)/2 + kappa*(alpha_A + alpha_B)/(2*delta))^2),
    which does NOT have a constant delta_c^2 shift. For the Fig. S5 parameters
    (alpha_A = alpha_B = -0.01, kappa = 0.005), exact Eqs. (S33a)-(S33d) yield
    delta_c/kappa = sqrt((1 + sqrt(17))/2) = 1.6005 (not 1.5) and a higher large-delta
    asymptote sqrt(delta^2 - kappa^2). Direct 1D PDE Eq. (S31) confirms the system is
    still static at delta = 1.5*kappa (v = 0) and tracks the exact one-mode formula closely
    (at delta/kappa = 4: PDE v = 0.01919, exact one-mode v = 0.01920, whereas the paper's
    constant-delta_c = 1.5*kappa curve gives 0.01854, visibly below the plotted triangles
    in Fig. S5c).
  citation:
    page: 14
    printed_page: "SI-8"
    quote: "The red line is a fit to the mean-field theory with v = δ 2 − δc2 , where δc = 1.5κ is extracted from the best fit to the data."
    where: "SI Sec. V, Fig. S5(c) caption and text below Eq. (S35), p. 14"

