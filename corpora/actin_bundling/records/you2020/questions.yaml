    (3) Nonlinear subcriticality contrast (omitted phi_B^3 in You main text Eq. 1): You main
    text drops the cubic nonlinearity phi_B^3/3 from the subcritical species B, which keeps the
    primary stationary pitchfork F_H -> F_S unconditionally supercritical (cubic coefficient
    C_3 = +1 > 0) across all delta, producing the unstable F_S existence band between delta =
    delta_c and the dashed blue line in Fig. 1A. In Frohoff Eq. (4)/(7), retaining +phi_2^3
    yields C_3 = 1 - (delta^2 - kappa^2)*(delta + kappa)^2/alpha_B^4 (matching Frohoff Eq. D19
    subcriticality condition xi^2 - Delta*Sigma < 0), which turns negative (subcritical) BEFORE
    delta reaches delta_c, causing the steady n = 1 branch to fold backwards rather than
