    gamma_A = gamma_B = 0.04, kappa = 0.005: v_you = 0.013742 vs v_fro = 0.013744 at
    delta/kappa = 3 [rel diff 1.25e-4] and v_you = 0.019189 vs v_fro = 0.019197 at
    delta/kappa = 4 [rel diff 3.88e-4]).
