# Numerical refinement checks for all ODE and PDE models

- id: ref_ode_dk1p5_rtol
  run: run_ode_dk1p5
  setting: rtol
  factors: [1, 10, 100]
  mode: divide
  output: v_final
  tolerance: "0.01%"
  tolerance_basis: "added: verifies RK45 time integration of Eqs. (4a-4d) converges well below 0.01% relative error on steady drift speed"
  tolerance_added: true

- id: ref_pde1d_dk2_N
  run: run_pde1d_dk2
  setting: N
  factors: [1, 2]
  mode: multiply
  output: v
  tolerance: "0.1%"
  tolerance_basis: "added: verifies spatial spectral convergence (N = 64 -> 128) of 1D PDE Eq. (1) traveling velocity at delta = 2*kappa"
  tolerance_added: true

- id: ref_pde1d_dk2_dt
  run: run_pde1d_dk2
  setting: dt
  factors: [1, 2, 4]
  mode: divide
  output: v
  tolerance: "0.1%"
  tolerance_basis: "added: verifies temporal SBDF2 convergence (dt = 2.0 -> 1.0 -> 0.5) of 1D PDE Eq. (1) traveling velocity"
  tolerance_added: true

- id: ref_pde1d_dk1_rhoB_N
  run: run_pde1d_dk1
  setting: N
  factors: [1, 2]
  mode: multiply
  output: rho_B
  tolerance: "0.1%"
  tolerance_basis: "added: confirms static-state |phi_hat_B^1| = 0.20101 is spatially converged, ruling out discretization error in the Fig. S1(a) discrepancy"
  tolerance_added: true

