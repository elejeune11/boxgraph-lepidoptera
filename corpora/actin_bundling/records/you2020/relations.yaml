# ==============================================================================
# Cross-record relations with tjhung2018 (Tjhung, Nardini & Cates,
# Phys. Rev. X 8, 031080, 2018).
# Note: Neither paper cites the other (you2020 cites Wittkowski et al. 2014
# [Active Model B], Cates & Tailleur 2015, Wittkowski-Stenhammar-Cates 2017,
# and Cates 2019 arXiv:1904.01330, but not Tjhung PRX 2018). All cross-record
# relations below therefore carry provenance: proposed. Under the exact passive
# single-field Model B dictionary A = -chi_A, K = gamma_A, phi = phi_A / sqrt(-3*chi_A)
# (no space or time rescaling), You Eq. (1) in its decoupled/one-way limit
# (kappa = delta = 0 or delta = kappa where kappa_AB = 0) and Tjhung Eqs. (2)-(4)
# in their passive limit (zeta = lambda = 0) collapse onto the identical Model B
# PDE, quartic bulk potential, binodals, bulk curvature, and spinodal length scale,
# while both papers' microscopic coarse-grainings share the identical 2D ABP/AOUP
# swim diffusivity (tau = 1/(2*D_R)) and 2D pair-interaction virial integral.
# ==============================================================================

