# ==============================================================================
# Cross-record relations with frohoff2021 (Frohoff-Hülsmann, Wrembel & Thiele,
# Phys. Rev. E 103, 042602, 2021).
# Note: frohoff2021 (2021) cites you2020 (2020) as Ref. [44] (pp. 2, 3, 19, 20)
# and identifies you2020 as the limiting case kappa = 0 (main text) and
# kappa = Q = 1 (SI Sec. V) of its nonvariational two-field Cahn-Hilliard PDE.
# Because you2020 predates frohoff2021 and does not cite it, all cross-record
# relations authored inside you2020/relations.yaml carry provenance: proposed.
# ==============================================================================

# --- 1. Exact Conserved Two-Field Nonreciprocal Linear Dispersion Family ---

- id: rel_frohoff2021_eq12_same_as_one_mode_eig_re
  kind: same_as
  a: you2020/one_mode_homogeneous_eigenvalues
  b: frohoff2021/linear_dispersion_general_eq12
  mapping:
    q: "1"
    f1_pp: "alpha_A - 1"
    f2_pp: "alpha_B"
    Q: "1"
    kappa: "0"
    rho: "kappa"
    alpha: "delta"
  output_map:
    re_lam_plus: re_lambda_plus
  regime:
    alpha_A: [0.05, 0.20]
    alpha_B: [0.005, 0.02]
    kappa: [0.005, 0.015]
    delta: [0.001, 0.01]
  provenance: proposed
  reason: >
    Exact symbolic identity between You et al. (2020) Eq. (8) / SI Eq. (S12) mode-1
    homogeneous linear stability eigenvalue Re(lambda_+^h) (at L = 2*pi, q_1 = 1) and
    Frohoff-Hülsmann et al. (2021) Eq. (12) general conserved two-field dispersion relation
    Re(lambda_+(q)) at q = 1, Q = 1, kappa_F = 0 (matching Frohoff Sec. VII p. 20, which
    explicitly identifies Ref. [44] as the kappa = 0, Q = 1 limit), with effective bulk
    curvatures f_1'' = alpha_A - 1, f_2'' = alpha_B, variational coupling rho = kappa, and
    nonvariational coupling alpha = delta (yielding identical Delta = alpha^2 - rho^2 =
    delta^2 - kappa^2).
  assumptions:
    - "Unit mobility ratio Q = 1, zero second-species interfacial rigidity kappa_F = 0, and fundamental wavenumber q = 1 (L = 2*pi)."
    - "Positive real-eigenvalue regime (alpha_A > alpha_B, discriminant > 0) for symbolic verification; algebraic equivalence holds across all real alpha_A, alpha_B."

