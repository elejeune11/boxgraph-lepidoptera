    - "Opposite sign convention: Re(lambda_+^s) = -2*A = -beta_over_Rs (at epsilon = 1)."

# --- 3. Equilibrium Interfacial Width vs. Pure-Active MIPS Spinodal Wavelength ---

- id: rel_tjhung2018_eq_interface_scales_ap_mips_Lmin
  kind: scales_as
  a: you2020/active_passive_linear_stability
  b: tjhung2018/equilibrium_interface_p4
  mapping:
    A: "(v_0**2 / (2 * D_R)) * (1 - a0_AA * rho_A0) * (2 * a0_AA * rho_A0 - 1) - a1 * rho_A0"
    K: "kappa_ap"
  output_map:
    xi_eq: L_min_unstable
  regime:
    v_0: [60.0, 90.0]
    D_R: [2.0, 4.0]
    a0_AA: [0.95, 1.05]
    a0_AP: [0.7, 0.7]
    a1: [5.0, 15.0]
    kappa_ap: [500.0, 1500.0]
    rho_A0: [0.62, 0.78]
    rho_P0: [0.0, 0.0]
    L: [64.0, 64.0]
  provenance: proposed
  reason: >
    In the pure active Brownian particle limit (rho_P0 = 0, passive species absent), You et al.
    (2020) SI Sec. VI.B Eq. (S39a) reduces to single-field supercritical Model B with effective
    negative diffusivity D_AA = a1*rho_A0 - (v_0^2/(2*D_R))*(1 - a0_AA*rho_A0)*(2*a0_AA*rho_A0 - 1)
    < 0 and biharmonic stiffness K = kappa_ap, yielding minimum unstable spinodal box length
    L_min = 2*pi*sqrt(kappa_ap/(-D_AA)). Under the exact Model B spinodal identification
    A = -D_AA and K = kappa_ap, L_min equals 2*pi*sqrt(2)*xi_eq identically relative to Tjhung
    et al. (2018) p. 4 equilibrium interfacial width xi_eq = sqrt(K/(2*A)), matching nonlinear
    log-slopes across all six active-Brownian parameters (v_0, D_R, a0_AA, a1, kappa_ap, rho_A0)
    simultaneously to machine precision.
  assumptions:
    - "Pure active-particle MIPS limit rho_P0 = 0 inside the spinodal window D_AA < 0 (giving constant Model B geometric ratio L_min / xi_eq = 2*pi*sqrt(2))."

# --- 4. Microscopic Coarse-Graining Bridges (AOUP/ABP Swim Diffusivity & 2D Pair-Force Virial Integral) ---

- id: rel_tjhung2018_cg_mobility_reduces_from_ap_DAA
  kind: reduces_to
  a: you2020/active_passive_linear_stability
  b: tjhung2018/cg_aoup_mobility_mu_eq36_39
  mapping:
    rho: "1"
    tau: "1 / (2 * D_R)"
    v: "v_0 * (1 - a0_AP * rho_P0)"
    T: "a1 * rho_A0"
  output_map:
    M_cg: D_AA
  limit:
    a0_AA: "0"
  regime:
    v_0: [20.0, 80.0]
    D_R: [1.0, 5.0]
    a0_AA: [0.1, 1.0]
    a0_AP: [0.2, 0.8]
    a1: [5.0, 30.0]
    kappa_ap: [500.0, 1500.0]
    rho_A0: [0.2, 0.6]
    rho_P0: [0.1, 0.4]
    L: [50.0, 80.0]
  provenance: proposed
  reason: >
    Directly bridges both papers' microscopic coarse-grainings of overdamped active particles.
    In You et al. (2020) SI Sec. VI.B Eq. (S40a) (citing Wittkowski-Stenhammar-Cates 2017),
    active-species diffusivity D_AA = a1*rho_A0 + (v/(2*D_R))*(v - a0_AA*v_0*rho_A0) combines
    steric virial repulsion a1*rho_A0 with 2D ABP swim diffusivity v^2/(2*D_R) and MIPS
    crowding derivative (v/(2*D_R))*rho_A0*(dv/drho_A). As self-slowing vanishes (a0_AA -> 0,
    retaining passive crowding v = v_0*(1 - a0_AP*rho_P0)), D_AA reduces identically to Tjhung
    et al. (2018) Sec. VI Eq. (36) coarse-grained quorum-sensing AOUP effective diffusivity
    M[rho]/rho = tau*v^2 + T under the exact 2D ABP persistence-time correspondence
    tau = 1/(2*D_R) and effective passive/virial diffusivity T = a1*rho_A0.
  assumptions:
    - "Vanishing active self-slowdown limit a0_AA -> 0 with exact 2D persistence-time dictionary tau = 1/(2*D_R) and unit density normalization rho = 1."

- id: rel_tjhung2018_cg_pair_C_scales_micro_ar_meanfield_pi12
  kind: scales_as
  a: you2020/microscopic_ar_meanfield_pi12
  b: tjhung2018/cg_pair_moments_eq45_46
  mapping:
    d: "2"
    U_0: "k_r * sigma_r**2 / 2"
    ell: "sigma_r"
  output_map:
    C: R_munu
  regime:
    k_r: [100.0, 5000.0]
    sigma_r: [0.5, 3.0]
    k_munu: [0.0, 0.0]
    sigma_munu: [1.0, 3.0]
    phi_mu: [0.1, 1.0]
  provenance: proposed
  reason: >
    Links both papers' lowest-order 2D gradient-expansion pair-interaction virial integrals
    -(Omega_2 / 2) * int_0^oo s^2 U'(s) ds = int_{R^2} U(r) d^2r. You et al. (2020) SI Sec.
    VI.A's corrected 2D angular-averaged mean-field coefficient R_munu = (pi/12)*k_r*sigma_r^4
    (at k_munu = 0, for soft harmonic repulsive core U_harm(s) = (1/2)*k_r*(sigma_r - s)^2 of
    peak energy U_0 = k_r*sigma_r^2/2 and range sigma_r) and Tjhung et al. (2018) Sec. VI
    Eq. (46)'s pair-potential integral C = 2*pi*U_0*ell^2 (at d = 2, for Gaussian U_Gauss(s) =
    U_0*exp(-s^2/(2*ell^2))) compute the exact same physical virial integral and share identical
    scaling exponents (+1 in k_r, +4 in sigma_r), differing only by the dimensionless radial
    shape-factor ratio C_Gauss / R_harm = 12.
  assumptions:
    - "Pure reciprocal repulsive core k_munu = 0 in d = 2 with matched peak barrier U_0 = k_r*sigma_r^2/2 and interaction range ell = sigma_r."


