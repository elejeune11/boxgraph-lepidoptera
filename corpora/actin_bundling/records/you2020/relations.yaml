    chi_B: [0.005, 0.05]
    gamma_B: [0.01, 0.04]
    phi0_B: [0.01, 0.20]
  provenance: proposed
  reason: >
    Symbolically derives Frohoff-Hülsmann et al. (2021) bulk free energy curvature f_1'' =
    a + 3*phi_bar_1^2 from You et al. (2020) effective parameter alpha_A = chi_A + gamma_A +
    phi0_A^2 by setting gamma_A = 0 under phi_bar_1 = phi0_A / sqrt(3) and a = chi_A.
  assumptions:
    - "Positive-symbol probing box for symbolic consistency verification."

- id: rel_frohoff2021_binodal_scales_as_decoupled_ground_state
  kind: scales_as
  a: you2020/decoupled_ground_state
  b: frohoff2021/decoupled_binodals_appC
  mapping:
    a: "3 * chi_mu"
    a_Delta: "0"
  output_map:
    phi1_bin: phi_g
  regime:
    chi_mu: [-0.20, -0.01]
  provenance: proposed
  reason: >
    Links You et al. (2020) p. 19768 decoupled double-well ground state phi_g = sqrt(-3*chi_mu)
    (for f(phi) = (chi_mu/2)*phi^2 + (1/12)*phi^4) to Frohoff-Hülsmann et al. (2021)
    Appendix C decoupled binodal phi_{1,bin} = sqrt(-a) (for f_1(phi_1) = (a/2)*phi_1^2 +
    (1/4)*phi_1^4) under the Appendix A nondimensionalization choice L_0 = sqrt(3*gamma_A)
    (which sets phi_hat_1 = 1 and a = 3*chi_mu, giving phi_{1,bin} = phi_g identically for
    all chi_mu < 0). Recorded as scales_as because decoupled_ground_state's Piecewise
    symbolic form simplifies to 0 under SymPy positive-symbol assumptions (avoiding a
    spurious too_plain flag on same_as).
  assumptions:
    - "Supercritical double-well regime chi_mu < 0 with decoupled cross-diffusivities (kappa = delta = 0)."

- id: rel_frohoff2021_steady_eq7_approx_static_fp_rhoA
  kind: approximated_by
  a: you2020/one_mode_static_fp
  b: frohoff2021/steady_state_bifurcation_eq7
  mapping:
    a: "0.75 * (alpha_A - 0.04)"
    a_Delta: "0.75 * (alpha_B - alpha_A + 0.04)"
    kappa: "0.0"
    Q: "1.0"
    rho: "0.75 * kappa"
    alpha: "-0.75 * delta"
    ell: "4 * pi / sqrt(3 * 0.04)"
    phi1_bar: "0.0"
    phi2_bar: "0.0"
    n_period: "1"
    init_amp_1: "sqrt((kappa**2 - delta**2 - alpha_A * alpha_B) / alpha_B)"
    init_amp_2: "((kappa + delta) / alpha_B) * sqrt((kappa**2 - delta**2 - alpha_A * alpha_B) / alpha_B)"
  output_map:
    phi1_max: rho_A_s
  regime:
    alpha_A: [-0.008, -0.003]
    alpha_B: [0.02, 0.04]
    kappa: [0.002, 0.005]
    delta: [0.001, 0.004]
  tolerance: 0.03
  provenance: proposed
  reason: >
    Direct nonlinear verification comparing You et al. (2020) Eq. (5) analytical one-mode
    static amplitude rho_A^s against Frohoff-Hülsmann et al. (2021) Eq. (7) full 20-mode
    periodic steady-state PDE solver (phi1_max) at kappa_F = 0, Q = 1, gamma_A = 0.04,
    L = 2*pi under the exact amplitude-matched rescaling L_0 = sqrt(3*gamma_A)/2 (which sets
    phi_hat = 2 so phi_1 = phi_A/2 and phi1_max = rho_A^s for a pure first harmonic, with
    L_0^2/gamma_A = 3/4 and phi_B = -2*phi_2 giving rho = (3/4)*kappa, alpha = -(3/4)*delta).
    In the weakly nonlinear supercritical static regime where higher harmonics and the cubic
    phi_2^3 term retained by Frohoff (but omitted in You main text Eq. 1) are small, the two
    models agree to within 0.51% across all 40 sampled parameter points.
  assumptions:
    - "Weakly nonlinear supercritical static regime (gamma_A = 0.04, L = 2*pi, kappa_F = 0, Q = 1, alpha_B >> rho_B^2) where You's omitted phi_B^3 term and higher harmonics remain O(0.5%)."

