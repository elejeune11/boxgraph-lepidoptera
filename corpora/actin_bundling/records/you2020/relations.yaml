# --- 3. Bulk Free Energy Curvature, Decoupled Binodals & Nonlinear Steady States ---

- id: rel_frohoff2021_bulk_curv_reduces_from_eff_params
  kind: reduces_to
  a: you2020/one_mode_effective_params
  b: frohoff2021/bulk_energy_curvature_eq3_4
  mapping:
    a: "chi_A"
    a_Delta: "chi_B - chi_A"
    phi1_bar: "phi0_A / sqrt(3)"
    phi2_bar: "phi0_B / sqrt(3)"
  output_map:
    f1_pp: alpha_A
  limit:
    gamma_A: "0"
  regime:
    chi_A: [-0.20, -0.05]
    gamma_A: [0.01, 0.05]
    phi0_A: [0.02, 0.15]
    chi_B: [0.005, 0.05]
    gamma_B: [0.0, 0.04]
    phi0_B: [0.0, 0.2]
  provenance: proposed
  reason: >
    In the zero-interfacial-rigidity / long-wavelength bulk limit gamma_A -> 0, You et al.
    (2020) SI Eq. (S6) effective one-mode control parameter alpha_A = chi_A + gamma_A +
    (phi0_A)^2 reduces identically to Frohoff-Hülsmann et al. (2021) Eqs. (3)-(4) bulk free
    energy second derivative f_1'' = a + 3*(phi_bar_1)^2 under the exact field rescaling
    phi0_A = sqrt(3)*phi_bar_1 (mapping f_A = (chi_A/2)*phi_A^2 + (1/12)*phi_A^4 onto
    f_1 = (a/2)*phi_1^2 + (1/4)*phi_1^4 with a = chi_A).
  assumptions:
    - "Bulk limit gamma_A -> 0 with chi_A + phi0_A^2 bounded away from zero."
    - "Exact Landau field rescaling phi_A = sqrt(3)*phi_1."

- id: rel_frohoff2021_bulk_curv_derived_from_eff_params
  kind: derived_from
