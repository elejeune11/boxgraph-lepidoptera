- id: rel_frohoff2021_eq12_same_as_active_passive_lin_stab
  kind: same_as
  a: you2020/active_passive_linear_stability
  b: frohoff2021/linear_dispersion_general_eq12
  mapping:
    q: "(2 * pi / L) * kappa_ap**(1/4)"
    f1_pp: "(a1 * rho_A0 + (v_0 * (1 - a0_AA * rho_A0 - a0_AP * rho_P0) / (2 * D_R)) * (v_0 * (1 - a0_AA * rho_A0 - a0_AP * rho_P0) - a0_AA * v_0 * rho_A0)) / sqrt(kappa_ap)"
    f2_pp: "a1 * rho_P0 / sqrt(kappa_ap)"
    Q: "1"
    kappa: "1"
    rho: "-(a1 * rho_A0 - (v_0 * (1 - a0_AA * rho_A0 - a0_AP * rho_P0) / (2 * D_R)) * a0_AP * v_0 * rho_A0 + a1 * rho_P0) / (2 * sqrt(kappa_ap))"
    alpha: "-(a1 * rho_A0 - (v_0 * (1 - a0_AA * rho_A0 - a0_AP * rho_P0) / (2 * D_R)) * a0_AP * v_0 * rho_A0 - a1 * rho_P0) / (2 * sqrt(kappa_ap))"
  output_map:
    re_lam_plus: max_re_lambda_q1
  regime:
    v_0: [40.0, 85.0]
    D_R: [2.0, 5.0]
    a0_AA: [0.8, 1.1]
    a0_AP: [0.5, 0.8]
    a1: [15.0, 35.0]
    kappa_ap: [500.0, 1500.0]
    rho_A0: [0.4, 0.7]
    rho_P0: [0.2, 0.4]
    L: [40.0, 80.0]
  provenance: proposed
  reason: >
    Exact linear-operator isomorphism between the coarse-grained active-passive Brownian
    mixture PDE of You et al. (2020) SI Sec. VI.B Eqs. (S39)-(S40) (explicitly cited by
    Frohoff-Hülsmann et al. 2021 Sec. VII p. 19 as a microscopic coarse-grained realization
    of their nonvariational two-field Cahn-Hilliard model) and Frohoff Eq. (12) at Q = 1,
    kappa_F = 1. Rescaling wavenumber as q_F = (2*pi/L)*kappa_ap^(1/4) absorbs the equal
    interfacial stiffness kappa_ap into unit stiffness while mapping the diffusivity matrix
    entries directly onto f_1'' = D_AA/sqrt(kappa_ap), f_2'' = D_PP/sqrt(kappa_ap),
    rho = -(D_AP + D_PA)/(2*sqrt(kappa_ap)), and alpha = -(D_AP - D_PA)/(2*sqrt(kappa_ap)).
    In the motility-induced phase separation regime where passive crowding reverses D_AP < 0
    while D_PA > 0, Delta = alpha^2 - rho^2 = -D_AP*D_PA/kappa_ap > 0 directly realizes
    Frohoff's nonvariational-dominated regime |alpha| > |rho|.
  assumptions:
    - "Equal interfacial stiffness kappa_ap for active and passive densities (Q = 1, kappa_F = 1) evaluated at fundamental mode q_1 = 2*pi/L."

