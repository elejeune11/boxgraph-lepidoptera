# --- 1. Passive Bulk Double-Well Coexistence & Planar Binodal Limits ---

- id: rel_zwicker2015_coex_eqA1_reduces_decoupled_ground_state
  kind: reduces_to
  a: zwicker2015/coexistence_exact_eqA1
  b: you2020/decoupled_ground_state
  mapping:
    chi_mu: "-psi**2 / 3"
  output_map:
    phi_g: phi_minus_B
  limit:
    R: "oo"
  regime:
    b: [1.0, 10.0]
    psi: [0.1, 1.0]
    gamma: [1.0e-4, 1.0e-3]
    R: [1.0, 10.0]
  provenance: proposed
  reason: >
    In the flat-interface thermodynamic limit R -> oo (vanishing Laplace pressure
    2*gamma/R -> 0), Zwicker et al. (2015) Appendix A Eq. (A1) exact curved-interface dense
    coexistence fraction phi_-^B(R) reduces to the planar double-well minimum psi, matching
    You et al. (2020) p. 19768 decoupled ground state phi_g = sqrt(-3*chi_mu) under the exact
    Landau mapping chi_mu = -psi^2 / 3 (closing the commutative triangle with
    frohoff2021/rel_zwicker2015_coex_eqA1_reduces_decoupled_binodal where a = 3*chi_mu = -psi^2).
  assumptions:
    - "Flat-interface / infinite-droplet thermodynamic limit R -> oo."
    - "Double-well mapping chi_mu = -psi^2 / 3 aligning You's decoupled ground state sqrt(-3*chi_mu) with Zwicker's dense planar binodal psi."

- id: rel_zwicker2015_flat_interface_reduces_decoupled_ground_state
  kind: reduces_to
  a: zwicker2015/flat_interface_profile
  b: you2020/decoupled_ground_state
  mapping:
    chi_mu: "-psi**2 / 3"
  output_map:
    phi_g: phi_B
  limit:
    x: "oo"
  regime:
    psi: [0.1, 1.0]
    x: [1.0e-6, 1.0e-5]
    w: [1.0e-7, 1.0e-6]
  provenance: proposed
  reason: >
    Far inside the dense bulk phase (x/w -> oo), Zwicker et al. (2015) passive tanh flat
    interface profile phi^B(x) = (psi/2)*(1 + tanh(x/w)) reduces identically to the bulk
    minimum psi = sqrt(-3*chi_mu) of You et al. (2020) decoupled_ground_state at
    chi_mu = -psi^2 / 3.
  assumptions:
    - "Dense-phase far-field bulk limit x -> oo at fixed interface width w > 0."

# --- 2. Passive Single-Field Cahn-Hilliard Linear Dispersion Limit ---

- id: rel_zwicker2015_eqF1_corrected_passive_reduces_you2020_eig
  kind: reduces_to
  a: zwicker2015/homogeneous_dispersion_eqF1_corrected
  b: you2020/one_mode_homogeneous_eigenvalues
  mapping:
    alpha_A: "(q * w)**2 * ((q * w)**2 / 4 - (4 * k_f * k_b - k_f**2 - k_b**2) / (k_f + k_b)**2)"
    alpha_B: "(q * w)**2 * ((q * w)**2 / 4 - (4 * k_f * k_b - k_f**2 - k_b**2) / (k_f + k_b)**2)"
    kappa: "1"
    delta: "1"
  output_map:
    re_lambda_plus: lam_q_norm
  limit:
    D_B: "oo"
  regime:
    D_B: [1.0e-12, 1.0e-11]
    w: [1.0e-7, 1.0e-6]
    k_f: [1.0e-4, 1.0e-2]
    k_b: [1.0e-4, 1.0e-2]
    q: [5.0e5, 2.0e6]
  provenance: proposed
  reason: >
    In the passive slow-reaction limit (k_f + k_b)/k_0 = (k_f + k_b)*w^2/D_B -> 0 (taken via
    D_B -> oo at fixed steady-state background composition phi_0^B = k_f/(k_f + k_b)),
    Zwicker et al. (2015) exact active Cahn-Hilliard dispersion relation Eq. (F1_corrected)
    normalized by k_0 = D_B/w^2 reduces identically to the passive Cahn-Hilliard dispersion
    of You et al. (2020) Eq. (8) evaluated on the one-way decoupling boundary delta = kappa
    (where kappa_AB = kappa - delta = 0, Delta = delta^2 - kappa^2 = 0, so species A executes
    decoupled passive Model B dynamics with effective rate alpha_A = q_F^2*(q_F^2 - 1 +
    3*(2*phi_0^B - 1)^2) for q_F = q*w/sqrt(2); setting kappa = delta = 1 avoids 0/0 in
    delta_ep_over_k while keeping Delta = 0 exactly).
  assumptions:
    - "Passive slow-reaction limit D_B -> oo at arbitrary fixed composition phi_0^B = k_f/(k_f + k_b)."
    - "One-way decoupled passive sector delta = kappa = 1 (kappa_AB = 0, Delta = 0) with alpha_B = alpha_A."

- id: rel_zwicker2015_eqF1_corrected_passive_derived_you2020_eig
