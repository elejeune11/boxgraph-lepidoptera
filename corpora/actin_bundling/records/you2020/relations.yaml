# --- 3. Active Adiabatic Nonreciprocal-to-Reactive Bridge (Fast-Slaved Species B) ---

- id: rel_zwicker2015_eqF1_corrected_approx_you2020_adiabatic
  kind: approximated_by
  a: you2020/one_mode_homogeneous_eigenvalues
  b: zwicker2015/homogeneous_dispersion_eqF1_corrected
  mapping:
    D_B: "1"
    w: "1"
    q: "1"
    k_f: "((delta**2 - kappa**2) / (2 * alpha_B)) * (1 + sqrt((2 * alpha_A + 1/2) / 3))"
    k_b: "((delta**2 - kappa**2) / (2 * alpha_B)) * (1 - sqrt((2 * alpha_A + 1/2) / 3))"
  output_map:
    lam_q_norm: re_lambda_plus
  regime:
    alpha_A: [-0.20, -0.10]
    alpha_B: [50.0, 200.0]
    kappa: [0.5, 1.0]
    delta: [1.5, 2.5]
  tolerance: 0.02
  provenance: proposed
  reason: >
    Quantifies the active adiabatic bridge between You et al. (2020) conserved two-field
    nonreciprocal dispersion Eq. (8) and Zwicker et al. (2015) single-field reactive
    Cahn-Hilliard dispersion Eq. (F1_corrected). When the subcritical species B relaxes
    rapidly (alpha_B in [50, 200] >> |alpha_A|) under nonreciprocal dominance (delta > kappa),
    adiabatic elimination of phi_B produces an effective non-conserved linear damping term
    -(delta^2 - kappa^2)/alpha_B in the phi_A equation, matching Zwicker's exact normalized
    reactive dispersion lam_q_norm = -alpha_A - (k_f + k_b)/k_0 with effective total reaction
    rate (k_f + k_b)/k_0 = (delta^2 - kappa^2)/alpha_B and composition u = 2*phi_0^B - 1 =
    sqrt((2*alpha_A + 1/2)/3) at q*w = 1 to within 0.18% (well below the 2% tolerance).
  assumptions:
    - "Adiabatic fast-relaxing species B regime (alpha_B in [50, 200]) with nonreciprocal dominance delta > kappa > 0."
    - "Unstable mode-1 spinodal range alpha_A in [-0.20, -0.10] mapped to q*w = 1 (q_F^2 = 1/2) where 2*alpha_A + 1/2 in [0.1, 0.3] yields physical fractions phi_0^B in (0, 1)."

