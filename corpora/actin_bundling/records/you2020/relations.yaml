    gamma_A + phi0_A^2 + (delta^2 - kappa^2)/alpha_B in the long-wavelength zero-mean limit
    (gamma_A = 0, phi0_A = 0) and Frohoff-Hülsmann et al. (2021) Eq. (20) general conserved
    Cahn-Hilliard threshold f_1''^CH = -(alpha^2 - rho^2)/f_2''. Because the two records use
    opposite sign conventions (|chi_A| = -chi_A > 0 vs f_1'' < 0 for delta > kappa), scales_as
    verifies identical non-power-law log-slopes across all three shared parameters
    (alpha_B, kappa, delta) to machine precision.
  assumptions:
    - "Long-wavelength zero-mean limit gamma_A = 0, phi0_A = 0 with delta > kappa > 0."
    - "Opposite sign convention: abs_chi_A_diff = -f1_pp_CH."

