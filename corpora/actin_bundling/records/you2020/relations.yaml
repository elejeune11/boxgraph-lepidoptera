# --- 2. Conserved-Hopf Frequency, Traveling Velocity, Exceptional Points & Phase Boundaries ---

- id: rel_frohoff2021_hopf_freq_same_as_traveling_v
  kind: same_as
  a: you2020/one_mode_traveling_fp
  b: frohoff2021/hopf_threshold_general_eq14_15
  mapping:
    f2_pp: "alpha_B"
    Q: "1"
    rho: "kappa"
    alpha: "delta"
  output_map:
    omega_tilde_c: v
  regime:
    alpha_A: [-0.04, -0.015]
    alpha_B: [0.002, 0.01]
    kappa: [0.002, 0.01]
    delta: [0.02, 0.05]
  provenance: proposed
  reason: >
    Exact mathematical equivalence between the nonlinear one-mode traveling-wave phase
    velocity v = sqrt(delta^2 - kappa^2 - alpha_B^2) of You et al. (2020) Eq. (7) (at
    q_1 = 1, L = 2*pi) and the linear conserved-Hopf scaled critical frequency
    omega_tilde_c = sqrt(Q)*sqrt(alpha^2 - rho^2 - Q*(f_2'')^2) of Frohoff-Hülsmann et al.
    (2021) Eq. (15) at Q = 1, f_2'' = alpha_B, rho = kappa, alpha = delta. Physically,
    amplitude saturation (rho_A^t)^2 = -alpha_A - alpha_B pins the effective renormalized
    curvature alpha_A_eff = alpha_A + (rho_A^t)^2 = -alpha_B identically onto Frohoff's
    conserved-Hopf neutrality line f_1'' + Q*f_2'' = 0, so the finite-amplitude phase speed
    equals the linear Hopf critical frequency exactly across the entire traveling phase.
  assumptions:
    - "Traveling-state domain delta > delta_c = sqrt(kappa^2 + alpha_B^2) and alpha_A < -alpha_B with Q = 1 and q_1 = 1."

- id: rel_frohoff2021_hopf_freq_same_as_bisup_traveling_v
  kind: same_as
  a: you2020/bi_supercritical_one_mode_fp
  b: frohoff2021/hopf_threshold_general_eq14_15
  mapping:
    f2_pp: "(alpha_B - alpha_A) / 2 - kappa * (alpha_A + alpha_B) / (2 * delta)"
    Q: "1"
    rho: "kappa"
    alpha: "delta"
  output_map:
    omega_tilde_c: v
  regime:
    alpha_A: [-0.02, -0.005]
    alpha_B: [-0.02, -0.005]
    kappa: [0.002, 0.006]
    delta: [0.025, 0.06]
  provenance: proposed
  reason: >
    Extends the conserved-Hopf neutrality identity to You et al. (2020) SI Sec. V
    bi-supercritical one-mode traveling fixed point Eqs. (S33a)-(S33d). Nonlinear saturation
    of both cubic amplitudes (rho_A^t)^2 = -(delta - kappa)*(alpha_A + alpha_B)/(2*delta)
    and (rho_B^t)^2 = -(delta + kappa)*(alpha_A + alpha_B)/(2*delta) drives the renormalized
    effective curvatures to f_2_eff'' = alpha_B + (rho_B^t)^2 = -f_1_eff'' =
    (alpha_B - alpha_A)/2 - kappa*(alpha_A + alpha_B)/(2*delta), so the exact bi-supercritical
    traveling velocity v equals Frohoff-Hülsmann et al. (2021) Eq. (15) Hopf critical
    frequency omega_tilde_c identically at Q = 1, rho = kappa, alpha = delta.
  assumptions:
    - "Bi-supercritical traveling regime alpha_A + alpha_B < 0 and delta > delta_c with Q = 1, q_1 = 1."

- id: rel_frohoff2021_pure_nonvar_im_reduces_from_bisup_v
  kind: reduces_to
  a: you2020/bi_supercritical_one_mode_fp
  b: frohoff2021/linear_dispersion_pure_nonvar_limit
  mapping:
    q: "1"
    a: "alpha_A - 1"
    a_Delta: "alpha_B - alpha_A"
    kappa: "1"
    phi1_bar: "0"
    phi2_bar: "0"
    alpha: "delta"
  output_map:
    im_lam_plus: v
  limit:
    kappa: "0"
  regime:
    alpha_A: [-0.02, -0.005]
    alpha_B: [-0.02, -0.005]
    kappa: [0.001, 0.005]
    delta: [0.02, 0.05]
  provenance: proposed
  reason: >
    In the purely nonreciprocal limit kappa -> 0 (rho = 0), the delta-dependent shift in
    You et al. (2020) bi-supercritical one-mode Eqs. (S33) vanishes, leaving equal saturated
    amplitudes (rho_A^t)^2 = (rho_B^t)^2 = -(alpha_A + alpha_B)/2 and traveling speed
    v = sqrt(delta^2 - (alpha_A - alpha_B)^2 / 4), which reduces identically to the linear
    imaginary frequency Im(lambda_+(q=1)) of Frohoff-Hülsmann et al. (2021) purely
    nonvariational dispersion limit (kappa_F = 1, Q = 1, a_Delta = alpha_B - alpha_A,
    alpha = delta).
  assumptions:
    - "Purely nonreciprocal limit kappa -> 0 in the bi-supercritical traveling regime (alpha_A + alpha_B < 0, delta > |alpha_A - alpha_B|/2)."

- id: rel_frohoff2021_alpha_H_n_same_as_traveling_dc
  kind: same_as
  a: you2020/one_mode_traveling_fp
  b: frohoff2021/subcriticality_zero_mean_eqD17_D19
  mapping:
    q_n: "1"
    a_Delta: "1 + 2 * alpha_B"
    kappa: "0"
    rho: "kappa"
    alpha: "delta"
    eps: "0.01"
  output_map:
    alpha_H_n: delta_c
  regime:
    alpha_A: [0.005, 0.02]
    alpha_B: [0.002, 0.02]
    kappa: [0.002, 0.02]
    delta: [0.002, 0.02]
  provenance: proposed
  reason: >
    Exact symbolic equivalence between You et al. (2020) Eq. (7) exceptional-point traveling
    threshold delta_c = sqrt(kappa^2 + alpha_B^2) (where the conserved-Hopf and stationary CH
    boundaries intersect in Fig. 1A and static F_S loses stability to traveling F_T) and
    Frohoff-Hülsmann et al. (2021) Appendix D Eq. (D17) mode-n primary-bifurcation collision
    / Hopf threshold alpha_{H,n} = sqrt(rho^2 + M_n^2 / 4) evaluated at q_n = 1, kappa_F = 0,
    and the conserved-Hopf neutrality shift M_n = alpha_A - alpha_B = -2*alpha_B (a_Delta =
    1 + 2*alpha_B), rho = kappa.
  assumptions:
    - "Mode n = 1 (q_n = 1, kappa_F = 0) at conserved-Hopf neutrality alpha_A = -alpha_B (M_n = -2*alpha_B)."

- id: rel_frohoff2021_alpha_H_n_same_as_homogeneous_ep
