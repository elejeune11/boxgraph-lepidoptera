- id: ref_shell_min_rtol
  run: run_equilibrium_radius_shell_from_energy
  setting: rtol
  factors: [1, 2, 4, 8]
  mode: divide
  output: R_0
  tolerance: "0.001%"
  tolerance_basis: "added: well below any physical or printed precision to confirm numerical convergence of the Brent root-finder"
  tolerance_added: true

