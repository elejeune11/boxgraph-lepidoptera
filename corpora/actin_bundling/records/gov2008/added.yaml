# All non-a parameters are unstated numerically in gov2008 (pure analytical theory).
# Baseline values are representative F-actin bundle parameters chosen to evaluate every
# model in physical regimes, each paired with plausible alternatives.

- id: R_eval_added
  quantity: bundle_radius
  unit: nm
  printed: "50"
  basis: "Typical in-vitro cross-linked F-actin bundle radius (~50 nm, ~5 filament radii at a ~ 10 nm) used to evaluate energy functionals and growth flux at a representative point."
  alternatives: ["30", "100"]
  stands_for: "R in Eqs. (1), (2), (4)-(6), (10)"

- id: R_large_tail_added
  quantity: bundle_radius
  unit: nm
  printed: "100000"
  basis: "Asymptotic large-radius evaluation point (R = 10^5 nm = 400*R_{0,s} = 10^4*a) cleanly inside the R >> R_0, R >> a tail regime for evaluating large-R distribution exponents (p. 4 col 2)."
  alternatives: ["25000", "1000000"]
  stands_for: "large R in p. 4 col 2 asymptotic P(R) tails"

- id: eps_b_added
  quantity: adhesion_energy_per_length
  unit: pN
  printed: "1.0"
  basis: "Representative F-actin cross-linking adhesion energy per unit length (~0.24 k_B T/nm, consistent with a few k_B T per ~10-36 nm cross-linker spacing, cf. p. 2 col 1)."
  alternatives: ["0.5", "4.0"]
  stands_for: "eps_b in Eqs. (1), (3), (7)-(9)"

- id: eps_b_weak_added
  quantity: adhesion_energy_per_length
  unit: pN
  printed: "1e-6"
  basis: "Weak-binding regime (eps_b << rho*a*lambda*E_c and eps_b << k'_b*(a^2*rho)^2 across all baseline parameter alternatives) chosen to test the paper's 'limit of weak binding' scaling claims on p. 4 col 1."
  alternatives: ["1e-8", "1e-7"]
  stands_for: "weak-binding eps_b -> 0 on p. 4 col 1"

- id: L_defect_spacing_added
  quantity: defect_spacing
  unit: nm
  printed: "50"
  basis: "Representative cross-sectional defect spacing L = 5*a = 50 nm giving areal density rho = 1/L^2 = 4e-4 nm^-2 (a^2*rho = 0.04)."
  alternatives: ["30", "100"]
  stands_for: "L in rho = 1/L^2 (p. 2 col 2, Fig. 2)"

- id: lam_shell_added
  quantity: empty_shell_thickness
  unit: nm
  printed: "20"
  basis: "Defect-free outer shell thickness lambda = 2*a = 20 nm (two outer filament layers) for the empty-shell model Eqs. (2)-(3)."
  alternatives: ["10", "30"]
  stands_for: "lambda in Eqs. (2)-(3)"

- id: Ec_added
  quantity: defect_core_energy_per_length
  unit: pN
  printed: "25.0"
  basis: "Defect core energy per unit length E_c = 2*E_c* = 25 pN (above critical threshold E_c* = 12.5 pN at baseline parameters) so the empty-shell model Eq. (3) yields a finite equilibrium radius R_{0,shell} = 40 nm."
  alternatives: ["15.0", "50.0"]
  stands_for: "E_c in Eqs. (2)-(3)"

- id: Ec_over_Ecstar_near_added
  quantity: core_energy_threshold_ratio
  unit: dimensionless
  printed: "1.01"
  basis: "Dimensionless ratio E_c / E_c* = 1.01 (1% above threshold E_c*) chosen to probe the E_c -> E_c*+ limit on p. 3 col 1 independently of baseline parameter scale."
  alternatives: ["1.001", "1.05"]
  stands_for: "E_c / E_c* -> 1+ on p. 3 col 1"

- id: kb_prime_added
  quantity: monopole_elastic_stiffness
  unit: pN
  printed: "1.0"
  basis: "Effective bulk monopole elastic stiffness k'_b ~ eps_b = 1.0 pN (giving dimensionless alpha_b = 1 and equilibrium bundle radius R_{0,b} ~ 52.5 nm > a)."
  alternatives: ["0.5", "2.0"]
  stands_for: "k'_b in Eqs. (4) and (7)"

- id: ks_prime_added
  quantity: monopole_elastic_stiffness
  unit: pN
  printed: "1.0"
  basis: "Effective surface monopole elastic stiffness k'_s ~ eps_b = 1.0 pN (giving dimensionless alpha_s = 1 and equilibrium bundle radius R_{0,s} = 250 nm > a)."
  alternatives: ["0.5", "2.0"]
  stands_for: "k'_s in Eqs. (5) and (8)"

- id: K_bending_added
  quantity: filament_bending_modulus
  unit: "pN * nm**2"
  printed: "4.11e4"
  basis: "Standard F-actin bending modulus K = k_B T * l_p with k_B T = 4.11 pN*nm and persistence length l_p = 10 um = 10^4 nm (dimensional bending rigidity [energy]*[length] required by Eq. 6 RHS and Eq. 9)."
  alternatives: ["2.0e4", "7.0e4"]
  stands_for: "K in Eqs. (6) and (9)"

- id: Lp_healing_added
  quantity: defect_healing_length
  unit: nm
  printed: "100"
  basis: "Representative defect axial healing length L_p = 10*a = 100 nm (satisfying L_b >> L_p and yielding R'_{0,b} ~ 124 nm in Eq. 9)."
  alternatives: ["50", "200"]
  stands_for: "L_p in Fig. 1, Eqs. (6) and (9)"

- id: c_crosslinker_added
  quantity: crosslinker_concentration
  unit: dimensionless
  printed: "0.01"
  basis: "Low dimensionless cross-linker concentration c << exp(-epsilon) probing the weak-concentration regime of the Langmuir binding relation (p. 4 col 1)."
  alternatives: ["0.001", "0.1"]
  stands_for: "c in eps_b ~ c*exp(epsilon)/(1 + c*exp(epsilon)) (p. 4 col 1)"

- id: eps_binding_free_energy_added
  quantity: crosslinker_binding_free_energy
  unit: dimensionless
  printed: "1.0"
  basis: "Low dimensionless cross-linker-actin binding free energy epsilon = 1 (in k_B T units) on p. 4 col 1."
  alternatives: ["0.5", "5.0"]
  stands_for: "epsilon in eps_b ~ c*exp(epsilon)/(1 + c*exp(epsilon)) (p. 4 col 1)"

- id: rho_ac_added
  quantity: filament_concentration
  unit: "1 / nm**3"
  printed: "1e-9"
  basis: "Representative in-vitro F-actin filament number concentration (~1 filament per um^3 = 1e-9 nm^-3, consistent with ~uM G-actin polymerized into ~um-long filaments) for evaluating Eq. (10)."
  alternatives: ["1e-10", "1e-8"]
  stands_for: "rho_ac in Eq. (10)"

- id: gamma_friction_added
  quantity: effective_friction_coefficient
  unit: "pN * s / nm**2"
  printed: "1e-9"
  basis: "Water dynamic viscosity scale (~1 mPa*s = 10^-9 pN*s/nm^2) for the effective drag coefficient per unit length gamma in Eq. (10)."
  alternatives: ["1e-10", "1e-8"]
  stands_for: "gamma in Eq. (10)"

- id: F_R_eval_added
  quantity: radial_force_per_length
  unit: "pN / nm"
  printed: "0.025"
  basis: "Representative radial thermodynamic driving force -dE_total/dR ~ 2*pi*a*eps_b/R^2 = 0.025 pN/nm at R = 50 nm, a = 10 nm, eps_b = 1 pN for evaluating Eq. (10)."
  alternatives: ["0.01", "0.1"]
  stands_for: "-dE_total/dR in Eq. (10)"

- id: D_R_added
  quantity: radius_diffusion_coefficient
  unit: "nm**2 / s"
  printed: "10000"
  basis: "Representative radius-space diffusion coefficient D_R = 10^4 nm^2/s (matching Einstein-scale ~k_B T * beta / nm and giving 2*beta/D_R ~ 0.63 pN^-1 at baseline beta = 3141.6 nm^2/(pN*s)) for evaluating Fokker-Planck steady-state distributions from Eq. (11) (p. 4 col 2)."
  alternatives: ["5000", "50000"]
  stands_for: "D_R in Eq. (11) and steady-state P(R)"

- id: E_0_added
  quantity: energy_per_length_per_filament
  unit: pN
  printed: "0.0"
  basis: "Reference normalization energy offset E_0 = 0 pN in the unnormalized Boltzmann weight exp[-2*beta*(E_total(R) - E_0)/D_R] (p. 4 col 2); shifts only the multiplicative normalization constant."
  alternatives: ["-1.0", "1.0"]
  stands_for: "E_0 in P(R) ~ exp[-2*beta*(E_total(R) - E_0)/D_R]"

- id: c_crosslinker_low_added
  quantity: crosslinker_concentration
  unit: dimensionless
  printed: "1e-12"
  basis: "Asymptotic low-concentration regime (c*exp(eps) << 1 across all alternatives of eps_binding_free_energy_added) chosen to test the paper's 'At low concentrations and low binding energy eps' radius-vs-concentration scaling predictions on p. 4 col 1 without finite-c Langmuir saturation bias."
  alternatives: ["1e-14", "1e-11"]
  stands_for: "low concentration c -> 0 in p. 4 col 1 radius-vs-c scaling"

- id: eps_b_sat_added
  quantity: adhesion_energy_per_length
  unit: pN
  printed: "1.0"
  basis: "Unstated saturation proportionality prefactor eps_b_max in the Langmuir relation eps_b = eps_b_max * c*exp(eps)/(1 + c*exp(eps)) (p. 4 col 1), set to the baseline F-actin adhesion scale (~1 pN) with decade alternatives."
  alternatives: ["0.1", "10.0"]
  stands_for: "unstated prefactor in eps_b propto c*exp(eps)/(1 + c*exp(eps)) on p. 4 col 1"
