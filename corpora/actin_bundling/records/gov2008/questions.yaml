- id: q_continuum_elasticity_multipole_decay_2d_vs_3d
  kind: reading
  about:
    - bulk_monopole_defect_energy_eq4
    - surface_monopole_defect_energy_eq5
  text: >
    On p. 2 col 2, within a 2D cross-sectional continuum description, the paper writes that an isolated splay /
    local dilation ("monopole" force defect) induces a strain field u ~ 1/r whose 2D elastic energy diverges
    logarithmically, and that a quadrupole force center produces a strain field u ~ 1/r^4 [16]. In 2D linear
    elasticity (Landau & Lifshitz [16]), a local center of dilation (isotropic force dipole) produces displacement
    ~ 1/r and strain ~ 1/r^2 (with finite 2D strain energy), whereas a point force or edge dislocation produces
    strain ~ 1/r (logarithmically diverging energy); similarly, a quadrupole produces strain ~ 1/r^3 in 2D and
    ~ 1/r^4 in 3D. Although either 1/r^3 or 1/r^4 yields finite integrated strain energy in 2D (preserving the
    paper's qualitative conclusion for higher multipoles), the stated 1/r^4 exponent and identification of a
    2D local dilation with a 1/r strain field mix 2D and 3D/dislocation elasticity scalings.
  citation:
    page: 2
    printed_page: "011916-2"
    quote: "quadropole force center decays as u"
    where: "text, p. 2 col 2"

