- id: q_eq6_middle_missing_Lp_and_K_dimension
  kind: possible_error
  about:
    - incompressible_defect_energy_eq6_middle
    - incompressible_defect_energy_eq6_middle_corrected
    - incompressible_defect_energy_eq6
    - equilibrium_radius_incompressible_eq9
    - bend_to_binding_area_def
  text: >
    Three linked dimensional and algebraic discrepancies appear in Eq. (6) and its surrounding text (p. 3 col 2 - p. 4 col 1):
    (1) Substituting rho_v = rho / L_p into the printed middle expression of Eq. (6),
    K * rho_v * L_p * (a / L_p^2)^2 * R^2 * L_p, yields K * rho * a^2 * R^2 / L_p^3, which is larger by a
    factor of L_p than the printed right-hand side K * rho * (R/L_p)^4 / (R/a)^2 = K * rho * a^2 * R^2 / L_p^4.
    Physically, the middle expression gives the bending energy per filament inside one slice of length L_p
    (omitting division by L_p to obtain energy per unit length, and dropping the factor of pi from rho_v*L_p*pi*R^2).
    Dividing by L_p (variant incompressible_defect_energy_eq6_middle_corrected) makes both expressions
    symbolically identical (verified by rel_eq6_middle_corrected_same_as_rhs).
    (2) Immediately below Eq. (6), the text defines K as "the bending modulus of the filaments (energy per unit length)",
    and below Eq. (9) defines alpha' = K / eps_b alongside dimensionless alpha_{b,s} = k'_{b,s} / eps_b.
    However, a filament bending rigidity has dimension [energy]*[length] (e.g. k_B T * l_p), NOT [energy]/[length].
    If K had dimension [energy]/[length], then Eq. (6) RHS would have dimension [energy]/[length]^3 (incompatible
    with E_bind in [energy]/[length]) and Eq. (9), R'_{0,b}/a = [pi*(L_p/a)^4/(alpha'*rho)]^(1/3), would have
    dimension [length]^(2/3) instead of dimensionless (since rho = 1/L^2 has dimension 1/[length]^2).
    With the true physical dimension [energy]*[length] for K, alpha' = K/eps_b has dimension [length]^2,
    alpha'*rho is dimensionless, and both Eq. (6) RHS and Eq. (9) are dimensionally exact and mutually consistent.
    (3) Two sentences above Eq. (6), the text states "develops a curvature of ~a/L_p" (missing the exponent 2;
    Fig. 1 caption, two sentences earlier on p. 3 col 2, and Eq. 6 itself correctly write a/L_p^2).
  citation:
    page: 3
    printed_page: "011916-3"
    quote: "where K is the bending modulus of the filaments"
    where: "Eq. 6 and text, p. 3 col 2"

- id: q_fp_eq11_drift_sign_error
  kind: possible_error
  about:
    - fokker_planck_eq11_printed
    - fokker_planck_eq11_corrected
    - fokker_planck_steady_state_boltzmann
    - cmp_fp_eq11_printed_boltzmann_coeff
    - cmp_fp_eq11_corrected_boltzmann_coeff
    - rel_fp_eq11_printed_vs_boltzmann
  text: >
    Eq. (11) (p. 4 col 2) is printed with a plus sign on the drift divergence:
    dP/dt = (1/2)*D_R*d^2P/dR^2 + d(R_dot*P)/dR, where Eq. (10) defines R_dot = -beta*dE_total/dR.
    The standard 1D Fokker-Planck continuity equation is dP/dt = -dJ/dR = (1/2)*D_R*d^2P/dR^2 - d(R_dot*P)/dR.
    Integrating the printed equation at zero flux yields P(R) propto exp[+2*beta*(E_total(R) - E_0)/D_R]
    (coefficient +2 instead of -2, unnormalizable and minimizing P at the energy minimum R_0), contradicting
    the steady-state solution P(R) propto exp[-2*beta*(E_total(R) - E_0)/D_R] printed immediately below Eq. (11).
    Replacing + with - (variant fokker_planck_eq11_corrected) reproduces the paper's printed steady-state
    Boltzmann distribution exactly. The sign slip likely arose from writing +d(beta*(dE/dR)*P)/dR and then
    substituting R_dot without flipping the sign.
  citation:
    page: 4
    printed_page: "011916-4"
    quote: "can then be derived from a standard Fokker"
    where: "Eq. 11"

