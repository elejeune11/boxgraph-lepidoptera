    local log-log slope d(ln R_{0,shell})/d(ln rho) = -rho*/(rho - rho*) diverges to -infinity rather than -1.
    By contrast, a 1/rho decay occurs only for the excess width R_{0,shell} - lambda ~ lambda*rho*/rho in the
    OPPOSITE limit of large defect density rho >> rho* (E_c >> E_c*).
