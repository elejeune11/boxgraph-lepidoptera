- id: q_weak_binding_scaling_shell_and_bulk_monopole
  kind: possible_error
  about:
    - equilibrium_radius_shell_eq3
    - equilibrium_radius_bulk_monopole_eq7
    - scaling_exponents_shell
    - scaling_exponent_bulk_monopole
    - cmp_weak_binding_exp_shell
    - cmp_weak_binding_exp_bulk_monopole
    - rel_R0_shell_scales_epsb_weak
    - rel_R0_bulk_scales_epsb_weak
  text: >
    On p. 4 col 1, the paper claims: "in the limit of weak binding R_{0,shell}, R_{0,b}, R_{0,s} propto eps_b,
    while R'_{0,b} propto eps_b^(1/3)". While R_{0,s} propto eps_b and R'_{0,b} propto eps_b^(1/3) hold
    identically, neither R_{0,shell} nor R_{0,b} is proportional to eps_b in the weak-binding limit (eps_b -> 0):
    (1) From Eq. (3), R_{0,shell} = lambda / (1 - eps_b/(rho*a*lambda*E_c)) = lambda + eps_b/(rho*a*E_c) + O(eps_b^2),
    so R_{0,shell} approaches the nonzero constant lambda (log-slope d(ln R_{0,shell})/d(ln eps_b) -> 0);
    only the excess width R_{0,shell} - lambda scales linearly with eps_b.
    (2) From Eq. (7), exact differentiation of the Lambert-W solution yields
    d(ln R_{0,b})/d(ln eps_b) = (1/3)*W(C)/(1 + W(C)) with C = 3*exp(3/2)*eps_b/(2*k'_b*(a^2*rho)^2).
    Because W(C) > 0 for all positive parameters, this scaling exponent lies strictly in (0, 1/3) for ALL eps_b > 0
    and never approaches 1: as eps_b -> 0 (weak binding), R_{0,b}/a -> exp(-1/2) + (e/(2*k'_b*(a^2*rho)^2))*eps_b
    (approaching the unphysical sub-filament constant e^(-1/2) ~ 0.607 < 1, with log-slope -> 0), while for
    large eps_b (strong binding, R_{0,b} >> a), R_{0,b} ~ (eps_b / ln eps_b)^(1/3) (log-slope -> 1/3).
    Both errors appear to stem from keeping the O(eps_b) linear Taylor term while overlooking the nonzero
    constant offsets lambda and a*exp(-1/2).
  citation:
    page: 4
    printed_page: "011916-4"
    quote: "We find that in the limit of"
    where: "text, p. 4 col 1"

