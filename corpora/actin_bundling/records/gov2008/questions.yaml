    as "The total filament flux at the surface of a bundle of radius R (per unit length)", without stating the
    dimensions of rho_ac or gamma. Because N = (R/a)^2 is the dimensionless number of filaments in the bundle
    cross-section, N_dot has dimension 1/[time] (not per unit length). With -dE_total/dR in [energy]/[length]^2
    (force per unit length), dimensional consistency requires either: (i) rho_ac is a 3D filament number density
    (1/[length]^3) and gamma has viscosity dimensions ([energy]*[time]/[length]^3), making 2*pi*R*a the surface
    area of an axial slice of thickness a (rather than unit length or bundle length L_b); or (ii) rho_ac is a 2D
    cross-sectional density (1/[length]^2) with a factor of length absorbed into gamma. In addition, using
    -dE_total/dR (derivative of energy per filament) as the single-filament attachment force implicitly absorbs
    the reservoir chemical potential at E_total(R_0).
  citation:
    page: 4
    printed_page: "011916-4"
    quote: "total filament flux at the surface of a bundle of"
