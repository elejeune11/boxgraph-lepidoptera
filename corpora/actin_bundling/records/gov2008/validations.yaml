# Cross-record validation audit of gov2008 models against independent measurements across the
# 7 remaining ready Wave 6 partner records (claessens2006, claessens2008, dutta2016, gov2018,
# grason2007, haviv2008, mietke2019). (borukhov2005, henle2005, kierfeld2005, shin2009 were
# audited in those partner records.)
#
# Result: 0 physically valid cross-record validations from gov2008 models to measurements in
# these 7 partner records (and gov2008 itself is purely analytical theory with 0 origin: measured
# datums in data.yaml, printing only a single physical input parameter a ~ 10 nm while leaving
# all energy, defect-density, elastic-stiffness, mobility, and diffusivity parameters unstated).
# Every pair was audited individually and recorded in gov2008/questions.yaml:
#
# - claessens2006 + gov2008 (see q_claessens2006_cross_audit_and_no_validation):
#   * claessens2006's 18 origin: measured datums measure confined droplet ring radii
#     (R_ring_si1a/b), thermal fuzzy diameters and equilibration dynamics (D_sat_si1a/b_eye,
#     tau_eq_si1a/b_eye, si_fig1a/b_D_vs_t_meas), and 10 bundle bending-stiffness curves
#     kappa_B(n) across plastin, fascin, alpha-actinin, and PEG (fig3a-d_*_meas), where bundle
#     filament count n is imposed externally by droplet volume.
#   * gov2008 models equilibrium bundle radius R_0 and radius distribution P(R) from quenched
#     packing defects and predicts neither bundle bending stiffness kappa_B(n) nor ring dynamics.
#
# - claessens2008 + gov2008 (see q_claessens2008_cross_audit_and_no_validation):
#   * claessens2008's 26 origin: measured datums measure TEM fascin-actin bundle diameters D(R*)
#     (D_fig1c_measured), maximum bundle size (nf_max_abstract/confinement ~ 20, D_fil_fig2d_*
#     ~ 5-6), saturation plateau Rstar_plateau (~0.25), fascin+espin diameter ratio
#     (D_ratio_fig4d ~ 3), droplet ring-splitting boundaries (ca_fig2e_*), SAXS hexagonal peak
#     q10_saxs (0.585 nm^-1), helical layer lines, SAXS profiles (I_saxs_*), helical overtwist
#     Delta_theta(R*) (Delta_theta_fig3d_*), and derived R*(n_f) (Rstar_figS1_experiment).
#   * gov2008 has no helical-twist, SAXS, or droplet-confinement model. Its equilibrium-radius
#     models output bundle radius R_0 (not diameter D) as functions of adhesion energy eps_b [pN]
#     and unstated defect parameters (rho, k'_b, k'_s, K, L_p, lam, E_c), not as functions of
#     effective bound ratio R* (dimensionless). Even on shape, gov2008's weak-binding third-root
#     law R'_{0,b} ~ eps_b^(1/3) takes eps_b [pN] (incompatible dimension/quantity with R*),
#     cannot reproduce the measured saturation plateau at R* ~ 0.25 (since R* is already bound
#     occupancy), and rests on quenched achiral packing defects contradicted by Claessens's
#     preparation-independent equilibrium helical overtwist (-28/13 symmetry).
#
# - dutta2016 + gov2008 (see q_dutta2016_cross_audit_and_no_validation):
#   * Both records are pure analytical theory papers with 0 origin: measured datums.
#
# - gov2008 + gov2018 (see q_gov2018_cross_audit_and_no_validation):
#   * Both records are pure theory/review papers with 0 origin: measured datums, and treat
#     disjoint physical systems (packing defects in actin bundles vs curved membrane proteins).
#
# - gov2008 + grason2007 (see q_grason2007_cross_audit_and_no_validation):
#   * Both records are pure analytical theory papers with 0 origin: measured datums.
#
# - gov2008 + haviv2008 (see q_haviv2008_cross_audit_and_no_validation):
#   * haviv2008's 6 origin: measured datums are 3 fascin/actin bundling thresholds
#     (phi_no_bundles_threshold < 0.005, phi_bundle_onset_threshold = 0.0125,
#     phi_compact_bundle_threshold = 0.2), Table S1 mean bundle diameters D_{b,mean}(phi)
#     (table_s1_Db_mean across phi = 0.2..6), and cryo-TEM bundle-size histograms P(N_b) and
#     ln P(N_b) vs filament number N_b at phi = 3/1 (P_fig2a_measured, lnP_fig2b_measured).
#   * gov2008 predicts no bundling-onset concentration threshold, prints none of the parameters
#     entering R_0 or P(R) (except a ~ 10 nm, which is ~2x Haviv's effective filament radius
#     D_f/2 = 4.5 nm), outputs mode radius R_0 (not mean diameter D_{b,mean}, which exceeds
#     2*R_peak by 45-71% across Haviv's skewed distributions) as a function of eps_b [pN] rather
#     than phi [dimensionless], and parameterizes P(R) by bundle radius R [nm] rather than
#     filament count N_b [dimensionless] (preventing direct sweep over P_fig2a/lnP_fig2b without
#     violating quantity/dimension identity and fitting every unstated parameter to Haviv's data).
#   * Physically, haviv2008 Fig. 2 and Table S1 come from monomeric co-polymerization (short flat
#     disc-like nuclei where haviv2008 p. 451 col. 2 explicitly excludes packing defects),
#     whereas mixing preformed long filaments with fascin (Gov 2008's assumed route) yielded
#     disordered bundles with no extractable width distribution (haviv2008 Fig. 4a,c).
#
# - gov2008 + mietke2019 (see q_mietke2019_cross_audit_and_no_validation):
#   * Both records are pure theory/simulation papers with 0 origin: measured datums, and treat
#     disjoint physical systems (packing defects in actin bundles vs active fluid surfaces).
