- id: bundle_radius
  name: bundle radius
  dimension: "[length]"
  description: Radius R (or equilibrium radius R_0) of a cylindrical biopolymer bundle.
- id: dimensionless_bundle_radius
  name: dimensionless bundle radius
  dimension: "dimensionless"
  description: Normalized bundle radius R_0 / a relative to the effective filament radius a (Eqs. 7-9).
- id: filament_radius
  name: effective filament radius
  dimension: "[length]"
  description: Radius a of an individual filament and surrounding cross-linkers (a ~ 10 nm, p. 2 col 1).
- id: defect_healing_length
  name: defect healing length
  dimension: "[length]"
  description: Axial healing length L_p over which a packing defect bends the surrounding filaments (Fig. 1, Eqs. 6 and 9).
- id: empty_shell_thickness
  name: defect-free outer shell thickness
  dimension: "[length]"
  description: Thickness lambda of the defect-free outer shell in the empty-shell model (Fig. 2a, Eqs. 2-3).
- id: defect_spacing
  name: cross-sectional defect spacing
  dimension: "[length]"
  description: Mean cross-sectional distance L between packing defects, related to areal density by rho = 1/L^2 (p. 2 col 2, Fig. 2).
- id: filament_curvature
  name: defect-induced filament curvature
  dimension: "1 / [length]"
  description: Curvature ~a/L_p^2 induced on bundle filaments by a packing defect over healing length L_p (Fig. 1 caption, p. 3 col 2).
- id: defect_areal_density
  name: cross-sectional defect areal density
  dimension: "1 / [length]**2"
  description: Areal density of packing defects in the bundle cross-section, rho = 1/L^2 (p. 2 col 2, Eqs. 2, 4-9).
- id: defect_volumetric_density
  name: volumetric defect density
  dimension: "1 / [length]**3"
  description: Three-dimensional volumetric density of packing defects, rho_v = rho / L_p (p. 3 col 2, Eq. 6).
- id: adhesion_energy_per_length
  name: adhesion energy per unit length
  dimension: "[energy] / [length]"
  description: Cross-linking adhesion (binding) energy per unit length eps_b (p. 2 col 1, Eq. 1).
- id: energy_per_length_per_filament
  name: energy per unit length per filament
  dimension: "[energy] / [length]"
  description: Bundle energy per unit length per filament (E_bind, E_defect, E_defects_b, E_defects_s, E_total, or normalization offset E_0; Eqs. 1-2, 4-6, 10-11).
- id: defect_energy_per_slice_per_filament
  name: defect bending energy per healing-length slice per filament
  dimension: "[energy]"
  description: Bending energy per filament inside one axial slice of length L_p given by the printed middle expression of Eq. (6), K*rho_v*L_p*(a/L_p^2)^2*R^2*L_p, before dividing by L_p.
- id: defect_core_energy_per_length
  name: defect core energy per unit length
  dimension: "[energy] / [length]"
  description: Core energy per unit length E_c of a localized packing defect, or critical threshold E_c* = eps_b/(rho*a*lambda) (Fig. 2a, Eqs. 2-3).
- id: core_energy_threshold_ratio
  name: defect core energy ratio E_c / E_c*
  dimension: "dimensionless"
  description: Dimensionless ratio E_c / E_c* measuring proximity to the empty-shell finite-width threshold E_c -> E_c*+ (p. 3 col 1).
- id: monopole_elastic_stiffness
  name: monopole defect elastic stiffness
  dimension: "[energy] / [length]"
  description: Effective elastic interaction stiffness per unit length k'_b (bulk) or k'_s (surface) for 2D monopole defects (Eqs. 4-5).
- id: stiffness_to_binding_ratio
  name: monopole stiffness-to-binding ratio
  dimension: "dimensionless"
  description: Dimensionless ratio alpha_{b,s} = k'_{b,s} / eps_b entering Eqs. (7) and (8) (p. 4 col 1).
- id: filament_bending_modulus
  name: filament bending modulus
  dimension: "[energy] * [length]"
  description: Bending rigidity K (energy * length, e.g. k_B T * l_p) of an individual semiflexible biopolymer filament, required for dimensional consistency of Eq. (6) RHS and Eq. (9) (mislabelled '(energy per unit length)' in prose below Eq. 6).
- id: bend_to_binding_area
  name: bend-to-binding stiffness ratio alpha_prime
  dimension: "[length]**2"
  description: Ratio alpha' = K / eps_b of filament bending modulus K ([energy]*[length]) to adhesion energy per unit length eps_b ([energy]/[length]), entering Eq. (9) via the dimensionless product alpha'*rho.
- id: crosslinker_concentration
  name: dimensionless cross-linker concentration
  dimension: "dimensionless"
  description: Normalized concentration c of cross-linking agent in the equilibrium Langmuir binding relation (p. 4 col 1).
- id: crosslinker_binding_free_energy
  name: dimensionless cross-linker binding free energy
  dimension: "dimensionless"
  description: Dimensionless cross-linker-actin binding free energy epsilon (in units of k_B T) in eps_b ~ c*exp(epsilon)/(1 + c*exp(epsilon)) (p. 4 col 1).
- id: filament_concentration
  name: actin filament concentration
  dimension: "1 / [length]**3"
  description: Concentration rho_ac of actin filaments in solution entering the surface flux Eq. (10) (p. 4 col 2).
- id: effective_friction_coefficient
  name: effective radial friction coefficient
  dimension: "[energy] * [time] / [length]**3"
  description: Effective drag/friction coefficient per unit length gamma (dimensionally dynamic viscosity) in Eq. (10) (p. 4 col 2).
- id: radial_force_per_length
  name: radial thermodynamic force per unit length
  dimension: "[energy] / [length]**2"
  description: Effective radial driving force -dE_total/dR per unit length per filament driving bundle radius growth in Eq. (10).
- id: radius_mobility
  name: bundle radius growth mobility
  dimension: "[length]**3 / ([energy] * [time])"
  description: Effective mobility beta = pi*a^3*rho_ac/gamma relating R_dot = beta*(-dE_total/dR) in Eq. (10) (p. 4 col 2).
- id: radius_growth_rate
  name: bundle radius growth rate
  dimension: "[length] / [time]"
  description: Radial drift velocity R_dot = dR/dt of a growing bundle (Eqs. 10-11).
- id: bundle_filament_flux
  name: bundle filament flux
  dimension: "1 / [time]"
  description: Rate of change N_dot = (2*R/a^2)*R_dot of the number of filaments in a bundle cross-section (Eq. 10).
- id: radius_diffusion_coefficient
  name: radius-space diffusion coefficient
  dimension: "[length]**2 / [time]"
  description: Diffusion coefficient D_R in bundle-radius space in the Fokker-Planck equation Eq. (11) (p. 4 col 2).
- id: boltzmann_radius_weight
  name: unnormalized bundle radius probability weight
  dimension: "dimensionless"
  description: Unnormalized steady-state Fokker-Planck probability weight P(R) ~ exp[-2*beta*(E_total(R) - E_0)/D_R] and its large-R asymptotic tails (p. 4 col 2).
- id: boltzmann_exponent_coefficient
  name: Fokker-Planck steady-state Boltzmann exponent coefficient
  dimension: "dimensionless"
  description: Dimensionless coefficient c_FP in the zero-flux steady-state solution P(R) ~ exp[c_FP * beta * (E_total(R) - E_0) / D_R] of Eq. (11) (printed as -2 on p. 4 col 2).
- id: surface_tail_exponent_prefactor
  name: surface-monopole power-law tail exponent prefactor
  dimension: "dimensionless"
  description: Dimensionless prefactor c_s in the large-R surface-monopole power-law tail P(R) ~ R^(c_s * pi * a^2 * rho * beta * k'_s / D_R) (printed as -2 on p. 4 col 2).
- id: binding_scaling_exponent
  name: binding-energy scaling exponent of equilibrium radius
  dimension: "dimensionless"
  description: Local log-log scaling exponent d(ln R_0)/d(ln eps_b) of equilibrium bundle radius with respect to binding energy per unit length eps_b (p. 4 col 1).
- id: defect_density_scaling_exponent
  name: defect-density scaling exponent of equilibrium radius
  dimension: "dimensionless"
  description: Local log-log scaling exponent d(ln R_0)/d(ln rho) of equilibrium bundle radius with respect to cross-sectional defect density rho (p. 3 col 1).
- id: gaussian_tail_exponent
  name: large-R stretched-exponential decay exponent
  dimension: "dimensionless"
  description: Local power exponent q = d(ln(-ln P(R)))/d(ln R) characterizing the large-R decay P(R) ~ exp(-const * R^q) (printed as 2 for Gaussian decay on p. 4 col 2).
- id: concentration_scaling_exponent
  name: cross-linker concentration scaling exponent of equilibrium radius
  dimension: "dimensionless"
  description: Local log-log scaling exponent d(ln R_0)/d(ln c) of equilibrium bundle radius with respect to cross-linker concentration c via the Langmuir binding relation eps_b ~ c*exp(eps)/(1 + c*exp(eps)) (p. 4 col 1).
