    P: P_surface_tail_corrected_largeR

- id: run_surface_monopole_tail_exponent_from_eq5
  model: surface_monopole_tail_exponent_from_eq5
  inputs:
    R: R_large_tail_added
    a: filament_radius_a_printed
    eps_b: eps_b_added
    k_s_prime: ks_prime_added
    rho: rho_baseline
    beta: beta_baseline
    D_R: D_R_added
  outputs:
    tail_prefactor: surface_tail_coeff_from_eq5

- id: run_bulk_monopole_boltzmann
  model: bulk_monopole_boltzmann_dist
  inputs:
    R: R_eval_added
    a: filament_radius_a_printed
    eps_b: eps_b_added
    k_b_prime: kb_prime_added
    rho: rho_baseline
    beta: beta_baseline
    D_R: D_R_added
    E_0: E_0_added
  outputs:
    P: P_bulk_boltzmann_baseline

- id: run_incompressible_boltzmann
  model: incompressible_boltzmann_dist
  inputs:
    R: R_eval_added
    a: filament_radius_a_printed
    eps_b: eps_b_added
    K: K_bending_added
    rho: rho_baseline
    L_p: Lp_healing_added
    beta: beta_baseline
    D_R: D_R_added
    E_0: E_0_added
  outputs:
    P: P_incomp_boltzmann_baseline

- id: run_incompressible_gaussian_tail
  model: incompressible_gaussian_tail
  inputs:
    R: R_eval_added
    a: filament_radius_a_printed
    K: K_bending_added
    rho: rho_baseline
    L_p: Lp_healing_added
    beta: beta_baseline
    D_R: D_R_added
  outputs:
