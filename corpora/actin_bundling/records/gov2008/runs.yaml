# ==========================================================================
# 7. Low-concentration radius scaling via Langmuir binding (p. 4 col 1)
# ==========================================================================
- id: run_conc_scaling_exp_surface_low
  model: conc_scaling_exponent_surface_monopole
  inputs:
    c: c_crosslinker_low_added
