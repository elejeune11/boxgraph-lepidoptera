- id: run_conc_scaling_exp_bulk_low
  model: conc_scaling_exponent_bulk_monopole
  inputs:
    c: c_crosslinker_low_added
    eps: eps_binding_free_energy_added
    eps_b_max: eps_b_sat_added
    k_b_prime: kb_prime_added
    a: filament_radius_a_printed
    rho: rho_baseline
  outputs:
