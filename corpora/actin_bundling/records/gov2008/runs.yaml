    eps: eps_binding_free_energy_added
  outputs:
    exp_c: exp_R0_bp_c_low

- id: run_conc_scaling_exp_shell_low
  model: conc_scaling_exponent_shell
  inputs:
    c: c_crosslinker_low_added
    eps: eps_binding_free_energy_added
    eps_b_max: eps_b_sat_added
    rho: rho_baseline
    a: filament_radius_a_printed
    lam: lam_shell_added
    E_c: Ec_added
