notes: >
  In scope: the paper's complete analytical theory of finite equilibrium widths and
  steady-state width distributions of biopolymer bundles with quenched packing defects —
  bundle adhesion energy Eq. (1), defect density definitions (rho = 1/L^2, rho_v = rho/L_p),
  defect curvature scaling (~a/L_p^2), uniform localized defect energy, the empty-shell model
  (Eqs. 2-3 and critical core energy E_c* = eps_b/(rho*a*lambda)), long-range 2D monopole
  elastic defect energies in bulk and on the surface (Eqs. 4-5) and their equilibrium radii
  (Eqs. 7-8), the incompressible tightly packed bundle bending model (Eqs. 6 and 9), exact
  numerical energy minimizers verifying Eqs. (3) and (7)-(9), weak-binding and defect-density
  scaling predictions (pp. 3-4), cross-linker concentration Langmuir binding relation (p. 4),
  radial bundle growth flux Eq. (10), Fokker-Planck equation Eq. (11), its steady-state
  Boltzmann radius distribution, and all three large-R asymptotic tail claims (p. 4).
  Left out: qualitative prose remarks that feed no quantitative model — "a few k_B T" for
  binding energy per unit length (p. 2 col 1, also missing a length unit), qualitative
  multipole strain decay mentions u ~ 1/r and u ~ 1/r^4 (p. 2 col 2, audited in
  questions.yaml because 1/r^4 is the 3D rather than 2D quadrupole strain decay), and
  "thousands of actin filaments" in stereocilia (p. 4 col 2, Ref. 21).
  Figures cataloged (left for downstream digitize stage — no calibrated numeric data):
  Fig. 1 (p. 1, 011916-1): purely schematic drawing of (a) twist and splay defects inside a
  bundle of radius R, length L_b, and healing length L_p, (b) 2D hexagonal array of spacing a,
  and (c) schematic displacement arrows in the defect plane; no axes or plotted data.
  Fig. 2 (p. 3, 011916-3): purely schematic cylinders illustrating (a) the empty-shell model
  (radius R, shell thickness lambda, defect spacing L), (b) uniform bulk monopole charges,
  and (c) surface monopole charges; no axes or plotted data.
  Key analytical findings from symbolic and numerical verification:
  (1) Eqs. (3), (7), (8), and (9) are verified as exact global minimizers of E_bind + E_defect
  using Eqs. (1)+(2), (1)+(4), (1)+(5), and (1)+(6 RHS), respectively (modulo the unstated
  assumption lambda = 0 rather than merely E_c < E_c* for Eqs. 7-9).
  (2) Eq. (6) and Eq. (9): the middle expression of Eq. (6), K*rho_v*L_p*(a/L_p^2)^2*R^2*L_p,
  omits division by slice length L_p (giving energy per slice rather than energy per unit
  length, differing from Eq. 6 RHS by a factor of L_p); additionally, the prose mislabels the
  filament bending modulus K as "(energy per unit length)" instead of energy*length — only
  with K in [energy]*[length] (making alpha' = K/eps_b have dimension [length]^2) are Eq. (6)
  RHS and Eq. (9) dimensionally consistent.
  (3) Weak-binding scaling (p. 4 col 1): R_{0,s} propto eps_b and R'_{0,b} propto eps_b^{1/3}
  reproduce exactly, whereas R_{0,shell} -> lambda + eps_b/(rho*a*E_c) approaches the constant
  lambda (log-slope -> 0, not 1) and R_{0,b} has exact log-slope (1/3)*W(C)/(1 + W(C)) strictly
  in (0, 1/3) for all eps_b > 0 (never linear in eps_b; weak binding gives R_{0,b}/a -> e^{-1/2} < 1).
  (4) Empty-shell density scaling (p. 3 col 1): as E_c -> E_c* (rho -> rho*), R_{0,shell}
  diverges as lambda*rho/(rho - rho*) with log-slope -> -infinity, not as 1/rho (exponent -1).
  (5) Eq. (11) Fokker-Planck sign error (p. 4 col 2): printed +d(R_dot*P)/dR gives steady state
  exp[+2*beta*(E_total - E_0)/D_R] (opposite sign, unnormalizable); the standard minus sign
  -d(R_dot*P)/dR reproduces the paper's printed Boltzmann steady state exp[-2*beta*(E_total - E_0)/D_R].
  (6) Large-R distribution tails (p. 4 col 2): for surface monopoles (Eq. 5), the exact
  power-law exponent is -4*pi*a^2*rho*beta*k'_s/D_R, a factor of 2 larger than the printed
  -2*pi*a^2*rho*beta*k/D_R; for the empty shell (Eq. 2), printed exp(-1/a - 1/R) is
  dimensionally invalid, has the wrong sign on 1/R (grows instead of decays with R), and
  ignores non-normalizability; for bulk monopoles, Eq. (6) gives an exact Gaussian exp(-c*R^2)
  whereas Eq. (4) gives a super-Gaussian exp(-c*R^2*ln(R/a)).
