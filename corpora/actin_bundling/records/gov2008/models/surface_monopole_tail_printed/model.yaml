id: surface_monopole_tail_printed
name: printed large-R power-law tail for surface monopole defects (p. 4 col 2)
role: model
stated:
  page: 4
  printed_page: "011916-4"
  quote: "decays as a power-law for large R, in the form"
  where: "text, p. 4 col 2"
equation: "P(R) ~ R^(-2 * pi * a^2 * rho * beta * k / D_R)"
prefactor: unknown
inputs:
  R:
    quantity: bundle_radius
    unit: nm
  a:
    quantity: filament_radius
    unit: nm
  rho:
    quantity: defect_areal_density
    unit: "1 / nm**2"
  beta:
    quantity: radius_mobility
    unit: "nm**2 / (pN * s)"
  k_s_prime:
    quantity: monopole_elastic_stiffness
    unit: pN
  D_R:
    quantity: radius_diffusion_coefficient
    unit: "nm**2 / s"
outputs:
  P:
    quantity: boltzmann_radius_weight
    unit: dimensionless
settings: {}
stochastic: false
