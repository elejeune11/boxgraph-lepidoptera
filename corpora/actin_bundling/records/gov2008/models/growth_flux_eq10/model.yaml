id: growth_flux_eq10
name: bundle surface filament flux and radial growth drift equation (Eq. 10)
role: model
stated:
  page: 4
  printed_page: "011916-4"
  quote: "total filament flux at the surface of a bundle of"
  where: "Eq. 10"
equation: "N_dot = (2*R/a^2)*R_dot = 2*pi*R*a*rho_ac*(1/gamma)*(-dE_total/dR) => R_dot = beta*(-dE_total/dR), beta = pi*a^3*rho_ac/gamma"
inputs:
  R:
    quantity: bundle_radius
    unit: nm
  a:
    quantity: filament_radius
    unit: nm
  rho_ac:
    quantity: filament_concentration
    unit: "1 / nm**3"
  gamma:
    quantity: effective_friction_coefficient
    unit: "pN * s / nm**2"
  F_R:
    quantity: radial_force_per_length
    unit: "pN / nm"
outputs:
  beta:
    quantity: radius_mobility
    unit: "nm**2 / (pN * s)"
  R_dot:
    quantity: radius_growth_rate
    unit: "nm / s"
  N_dot:
    quantity: bundle_filament_flux
    unit: "1 / s"
settings: {}
stochastic: false
