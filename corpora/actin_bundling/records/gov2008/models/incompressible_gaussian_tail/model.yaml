id: incompressible_gaussian_tail
name: large-R Gaussian tail of steady-state distribution for incompressible bundle (Eq. 6, p. 4 col 2)
role: model
stated:
  page: 4
  printed_page: "011916-4"
  quote: "we find a Gaussian decay"
  where: "text, p. 4 col 2 (Eq. 6)"
equation: "P(R) ~ exp[-2 * beta * K * rho * a^2 * R^2 / (D_R * L_p^4)]"
prefactor: unknown
inputs:
  R:
    quantity: bundle_radius
    unit: nm
  a:
    quantity: filament_radius
    unit: nm
  K:
    quantity: filament_bending_modulus
    unit: "pN * nm**2"
  rho:
    quantity: defect_areal_density
    unit: "1 / nm**2"
  L_p:
    quantity: defect_healing_length
    unit: nm
  beta:
    quantity: radius_mobility
    unit: "nm**2 / (pN * s)"
  D_R:
    quantity: radius_diffusion_coefficient
    unit: "nm**2 / s"
outputs:
  P:
    quantity: boltzmann_radius_weight
    unit: dimensionless
settings: {}
stochastic: false
