id: fokker_planck_eq11_printed
name: zero-flux steady state of Fokker-Planck Eq. (11) as printed (+ drift sign)
role: model
stated:
  page: 4
  printed_page: "011916-4"
  quote: "can then be derived from a standard Fokker"
  where: "Eq. 11"
equation: "dP/dt = (1/2)*D_R*d^2P/dR^2 + d(R_dot*P)/dR with R_dot = -beta*dE_total/dR => P_ss = exp[+2*beta*(E_total - E_0)/D_R]"
inputs:
  beta:
    quantity: radius_mobility
    unit: "nm**2 / (pN * s)"
  E_total:
    quantity: energy_per_length_per_filament
    unit: pN
  E_0:
    quantity: energy_per_length_per_filament
    unit: pN
  D_R:
    quantity: radius_diffusion_coefficient
    unit: "nm**2 / s"
outputs:
  boltzmann_coeff:
    quantity: boltzmann_exponent_coefficient
    unit: dimensionless
  P:
    quantity: boltzmann_radius_weight
    unit: dimensionless
settings: {}
stochastic: false
