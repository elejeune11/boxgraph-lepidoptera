id: equilibrium_radius_bulk_monopole_from_energy
name: exact numerical minimizer of bulk monopole total energy (Eqs. 1 and 4)
role: model
stated:
  page: 3
  printed_page: "011916-3"
  quote: "has a global minimum at a finite"
  where: "text, p. 3 col 2 (from Eqs. 1 and 4)"
equation: "R_0 = argmin_{R > 0} [E_bind(R) + E_defects_b(R)]"
built_from:
  - bulk_monopole_total_energy
inputs:
  a:
    quantity: filament_radius
    unit: nm
  eps_b:
    quantity: adhesion_energy_per_length
    unit: pN
  k_b_prime:
    quantity: monopole_elastic_stiffness
    unit: pN
  rho:
    quantity: defect_areal_density
    unit: "1 / nm**2"
outputs:
  R_0_over_a:
    quantity: dimensionless_bundle_radius
    unit: dimensionless
  R_0:
    quantity: bundle_radius
    unit: nm
settings:
  rtol: 1.0e-10
  h_rel: 1.0e-6
stochastic: false
