id: bulk_gaussian_tail_exponent_eq4
name: large-R stretched-exponential decay exponent for bulk monopole defects (Eq. 4)
role: processing
stated:
  page: 4
  printed_page: "011916-4"
  quote: "we find a Gaussian decay"
  where: "text, p. 4 col 2 (from Eqs. 1, 4, and Boltzmann P(R))"
equation: "q(R) = d(ln(-ln P(R)))/d(ln R) = R * dE_total/dR / (E_total(R) - E_0) -> 2 + 1/ln(R/a)"
built_from:
  - bulk_monopole_total_energy
  - fokker_planck_steady_state_boltzmann
inputs:
  R:
    quantity: bundle_radius
    unit: nm
  a:
    quantity: filament_radius
    unit: nm
  eps_b:
    quantity: adhesion_energy_per_length
    unit: pN
  k_b_prime:
    quantity: monopole_elastic_stiffness
    unit: pN
  rho:
    quantity: defect_areal_density
    unit: "1 / nm**2"
  E_0:
    quantity: energy_per_length_per_filament
    unit: pN
outputs:
  tail_exponent:
    quantity: gaussian_tail_exponent
    unit: dimensionless
settings: {}
stochastic: false
