id: equilibrium_radius_shell_eq3
name: equilibrium bundle radius in the empty-shell model (Eq. 3)
role: model
stated:
  page: 3
  printed_page: "011916-3"
  quote: "the system has an minimum"
  where: "Eq. 3"
equation: "R_0_shell = lam / (1 - E_c_star / E_c) for E_c > E_c_star"
inputs:
  lam:
    quantity: empty_shell_thickness
    unit: nm
  E_c:
    quantity: defect_core_energy_per_length
    unit: pN
  E_c_star:
    quantity: defect_core_energy_per_length
    unit: pN
outputs:
  R_0:
    quantity: bundle_radius
    unit: nm
settings: {}
stochastic: false
