id: surface_monopole_boltzmann_dist
name: steady-state Boltzmann radius distribution for surface monopole defects (Eqs. 1, 5, 11)
role: model
stated:
  page: 4
  printed_page: "011916-4"
  quote: "The steady-state solutions of this equation using the"
  where: "text, p. 4 col 2 (Eqs. 1 and 5)"
equation: "P(R) = exp[-2 * beta * (E_total_s(R) - E_0) / D_R]"
built_from:
  - surface_monopole_total_energy
  - fokker_planck_steady_state_boltzmann
inputs:
  R:
    quantity: bundle_radius
    unit: nm
  a:
    quantity: filament_radius
    unit: nm
  eps_b:
    quantity: adhesion_energy_per_length
    unit: pN
  k_s_prime:
    quantity: monopole_elastic_stiffness
    unit: pN
  rho:
    quantity: defect_areal_density
    unit: "1 / nm**2"
  beta:
    quantity: radius_mobility
    unit: "nm**2 / (pN * s)"
  D_R:
    quantity: radius_diffusion_coefficient
    unit: "nm**2 / s"
  E_0:
    quantity: energy_per_length_per_filament
    unit: pN
outputs:
  P:
    quantity: boltzmann_radius_weight
    unit: dimensionless
settings: {}
stochastic: false
