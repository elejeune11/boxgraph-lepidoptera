id: critical_core_energy_shell
name: critical defect core energy in the empty-shell model (p. 3 col 1)
role: model
stated:
  page: 3
  printed_page: "011916-3"
  quote: "the system has an minimum"
  where: "text, p. 3 col 1"
equation: "E_c_star = eps_b / (rho * a * lam)"
inputs:
  eps_b:
    quantity: adhesion_energy_per_length
    unit: pN
  rho:
    quantity: defect_areal_density
    unit: "1 / nm**2"
  a:
    quantity: filament_radius
    unit: nm
  lam:
    quantity: empty_shell_thickness
    unit: nm
outputs:
  E_c_star:
    quantity: defect_core_energy_per_length
    unit: pN
settings: {}
stochastic: false
