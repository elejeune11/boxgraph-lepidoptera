id: defect_energy_uniform_localized
name: defect energy for uniform localized packing defects (p. 2 col 2)
role: model
stated:
  page: 2
  printed_page: "011916-2"
  quote: "A uniform distribution of such defects, of cross-sectional"
  where: "text, p. 2 col 2"
equation: "E_defect = rho * pi * a^2 * E_c"
inputs:
  rho:
    quantity: defect_areal_density
    unit: "1 / nm**2"
  a:
    quantity: filament_radius
    unit: nm
  E_c:
    quantity: defect_core_energy_per_length
    unit: pN
outputs:
  E_defect:
    quantity: energy_per_length_per_filament
    unit: pN
settings: {}
stochastic: false
