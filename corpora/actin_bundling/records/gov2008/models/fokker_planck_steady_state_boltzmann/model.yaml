id: fokker_planck_steady_state_boltzmann
name: printed steady-state Boltzmann bundle-radius distribution (p. 4 col 2)
role: model
stated:
  page: 4
  printed_page: "011916-4"
  quote: "The steady-state solutions of this equation using the"
  where: "text, p. 4 col 2"
equation: "P(R) = exp[-2 * beta * (E_total(R) - E_0) / D_R]"
inputs:
  beta:
    quantity: radius_mobility
    unit: "nm**2 / (pN * s)"
  E_total:
    quantity: energy_per_length_per_filament
    unit: pN
  E_0:
    quantity: energy_per_length_per_filament
    unit: pN
  D_R:
    quantity: radius_diffusion_coefficient
    unit: "nm**2 / s"
outputs:
  P:
    quantity: boltzmann_radius_weight
    unit: dimensionless
settings: {}
stochastic: false
