id: surface_monopole_defect_energy_eq5
name: surface monopole defect interaction energy per filament (Eq. 5)
role: model
stated:
  page: 3
  printed_page: "011916-3"
  quote: "interaction energy per filament due to a distribution of monopole"
  where: "Eq. 5"
equation: "E_defects_s = 2 * pi * k_s_prime * (1 / (R / a)^2) * R^2 * rho * ln(R / a)"
inputs:
  R:
    quantity: bundle_radius
    unit: nm
  a:
    quantity: filament_radius
    unit: nm
  k_s_prime:
    quantity: monopole_elastic_stiffness
    unit: pN
  rho:
    quantity: defect_areal_density
    unit: "1 / nm**2"
outputs:
  E_defects_s:
    quantity: energy_per_length_per_filament
    unit: pN
settings: {}
stochastic: false
