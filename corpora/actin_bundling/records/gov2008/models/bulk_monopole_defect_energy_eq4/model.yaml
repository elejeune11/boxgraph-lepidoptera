id: bulk_monopole_defect_energy_eq4
name: bulk monopole defect interaction energy per filament (Eq. 4)
role: model
stated:
  page: 3
  printed_page: "011916-3"
  quote: "interaction energy per filament due to a distribution of monopole"
  where: "Eq. 4"
equation: "E_defects_b = 2 * pi * k_b_prime * (1 / (R / a)^2) * R^4 * rho^2 * ln(R / a)"
inputs:
  R:
    quantity: bundle_radius
    unit: nm
  a:
    quantity: filament_radius
    unit: nm
  k_b_prime:
    quantity: monopole_elastic_stiffness
    unit: pN
  rho:
    quantity: defect_areal_density
    unit: "1 / nm**2"
outputs:
  E_defects_b:
    quantity: energy_per_length_per_filament
    unit: pN
settings: {}
stochastic: false
