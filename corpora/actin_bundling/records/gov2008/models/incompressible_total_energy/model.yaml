id: incompressible_total_energy
name: total energy per filament for incompressible tightly packed bundle (Eqs. 1 and 6)
role: model
stated:
  page: 3
  printed_page: "011916-3"
  quote: "has a global minimum at a finite"
  where: "text, p. 3 col 2 (Eqs. 1 and 6)"
equation: "E_total = E_bind + E_defects_b"
built_from:
  - binding_energy_eq1
  - incompressible_defect_energy_eq6
inputs:
  R:
    quantity: bundle_radius
    unit: nm
  a:
    quantity: filament_radius
    unit: nm
  eps_b:
    quantity: adhesion_energy_per_length
    unit: pN
  K:
    quantity: filament_bending_modulus
    unit: "pN * nm**2"
  rho:
    quantity: defect_areal_density
    unit: "1 / nm**2"
  L_p:
    quantity: defect_healing_length
    unit: nm
outputs:
  E_total:
    quantity: energy_per_length_per_filament
    unit: pN
settings: {}
stochastic: false
