id: empty_shell_total_energy
name: empty-shell total energy per unit length per filament (Eqs. 1 and 2)
role: model
stated:
  page: 3
  printed_page: "011916-3"
  quote: "The total energy per unit length per filament is now"
  where: "text, p. 3 col 1 (Eqs. 1-2)"
equation: "E_total = E_bind + E_defect = -pi*(R/a)*eps_b*[(R/a)-2]/(R/a)^2 + rho*pi*(R-lam)^2*E_c/(R/a)^2"
built_from:
  - binding_energy_eq1
  - empty_shell_defect_energy_eq2
inputs:
  R:
    quantity: bundle_radius
    unit: nm
  a:
    quantity: filament_radius
    unit: nm
  eps_b:
    quantity: adhesion_energy_per_length
    unit: pN
  rho:
    quantity: defect_areal_density
    unit: "1 / nm**2"
  lam:
    quantity: empty_shell_thickness
    unit: nm
  E_c:
    quantity: defect_core_energy_per_length
    unit: pN
outputs:
  E_total:
    quantity: energy_per_length_per_filament
    unit: pN
settings: {}
stochastic: false
