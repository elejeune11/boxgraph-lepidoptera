id: empty_shell_defect_energy_eq2
name: empty-shell defect energy per unit length per filament (Eq. 2)
role: model
stated:
  page: 3
  printed_page: "011916-3"
  quote: "overall energy of the defects"
  where: "Eq. 2"
equation: "E_defect = rho * pi * (R - lam)^2 * E_c / (R / a)^2"
inputs:
  R:
    quantity: bundle_radius
    unit: nm
  a:
    quantity: filament_radius
    unit: nm
  rho:
    quantity: defect_areal_density
    unit: "1 / nm**2"
  lam:
    quantity: empty_shell_thickness
    unit: nm
  E_c:
    quantity: defect_core_energy_per_length
    unit: pN
outputs:
  E_defect:
    quantity: energy_per_length_per_filament
    unit: pN
settings: {}
stochastic: false
