id: scaling_exponents_shell
name: exact binding-energy and defect-density scaling exponents of empty-shell Eq. (3)
role: processing
stated:
  page: 3
  printed_page: "011916-3"
  quote: "the system has an minimum"
  where: "Eq. 3 (logarithmic derivatives)"
equation: "d(ln R_0_shell)/d(ln eps_b) = (E_c_star/E_c)/(1 - E_c_star/E_c); d(ln R_0_shell)/d(ln rho) = -(E_c_star/E_c)/(1 - E_c_star/E_c)"
built_from:
  - critical_core_energy_shell
  - equilibrium_radius_shell_eq3
inputs:
  eps_b:
    quantity: adhesion_energy_per_length
    unit: pN
  rho:
    quantity: defect_areal_density
    unit: "1 / nm**2"
  a:
    quantity: filament_radius
    unit: nm
  lam:
    quantity: empty_shell_thickness
    unit: nm
  E_c:
    quantity: defect_core_energy_per_length
    unit: pN
outputs:
  exp_eps_b:
    quantity: binding_scaling_exponent
    unit: dimensionless
  exp_rho:
    quantity: defect_density_scaling_exponent
    unit: dimensionless
settings: {}
stochastic: false
