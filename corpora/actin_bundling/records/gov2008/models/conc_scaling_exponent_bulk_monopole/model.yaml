id: conc_scaling_exponent_bulk_monopole
name: exact concentration scaling exponent of bulk monopole Eq. (7) via Langmuir binding
role: processing
stated:
  page: 4
  printed_page: "011916-4"
  quote: "should increase either linearly or as the third root of the"
  where: "text, p. 4 col 1 (Eq. 7 + Langmuir binding)"
equation: "d(ln R_0_b)/d(ln c) = [(1/3) * W(C) / (1 + W(C))] / (1 + c * exp(eps)), eps_b = eps_b_max * c * exp(eps) / (1 + c * exp(eps))"
built_from:
  - binding_energy_vs_concentration
  - stiffness_to_binding_ratio_def
  - equilibrium_radius_bulk_monopole_eq7
inputs:
  c:
    quantity: crosslinker_concentration
    unit: dimensionless
  eps:
    quantity: crosslinker_binding_free_energy
    unit: dimensionless
  eps_b_max:
    quantity: adhesion_energy_per_length
    unit: pN
  k_b_prime:
    quantity: monopole_elastic_stiffness
    unit: pN
  a:
    quantity: filament_radius
    unit: nm
  rho:
    quantity: defect_areal_density
    unit: "1 / nm**2"
outputs:
  exp_c:
    quantity: concentration_scaling_exponent
    unit: dimensionless
settings: {}
stochastic: false
