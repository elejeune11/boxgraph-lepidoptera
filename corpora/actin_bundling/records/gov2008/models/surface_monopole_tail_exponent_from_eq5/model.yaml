id: surface_monopole_tail_exponent_from_eq5
name: large-R power-law tail exponent prefactor derived from Eq. (5) and steady-state Boltzmann P(R)
role: processing
stated:
  page: 4
  printed_page: "011916-4"
  quote: "decays as a power-law for large R, in the form"
  where: "text, p. 4 col 2 (from Eqs. 1, 5, and Boltzmann P(R))"
equation: "c_s(R) = [d(ln P)/d(ln R)] / (pi * a^2 * rho * beta * k_s_prime / D_R) = -4 + 4 * eps_b / (k_s_prime * a * rho * R)"
built_from:
  - surface_monopole_boltzmann_dist
inputs:
  R:
    quantity: bundle_radius
    unit: nm
  a:
    quantity: filament_radius
    unit: nm
  eps_b:
    quantity: adhesion_energy_per_length
    unit: pN
  k_s_prime:
    quantity: monopole_elastic_stiffness
    unit: pN
  rho:
    quantity: defect_areal_density
    unit: "1 / nm**2"
  beta:
    quantity: radius_mobility
    unit: "nm**2 / (pN * s)"
  D_R:
    quantity: radius_diffusion_coefficient
    unit: "nm**2 / s"
outputs:
  tail_prefactor:
    quantity: surface_tail_exponent_prefactor
    unit: dimensionless
settings: {}
stochastic: false
