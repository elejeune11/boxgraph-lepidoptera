id: bulk_gaussian_tail_exponent_eq6
name: large-R stretched-exponential decay exponent for incompressible bundle (Eq. 6)
role: processing
stated:
  page: 4
  printed_page: "011916-4"
  quote: "we find a Gaussian decay"
  where: "text, p. 4 col 2 (from Eqs. 1, 6, and Boltzmann P(R))"
equation: "q(R) = d(ln(-ln P(R)))/d(ln R) = R * dE_total/dR / (E_total(R) - E_0)"
built_from:
  - incompressible_total_energy
  - fokker_planck_steady_state_boltzmann
inputs:
  R:
    quantity: bundle_radius
    unit: nm
  a:
    quantity: filament_radius
    unit: nm
  eps_b:
    quantity: adhesion_energy_per_length
    unit: pN
  K:
    quantity: filament_bending_modulus
    unit: "pN * nm**2"
  rho:
    quantity: defect_areal_density
    unit: "1 / nm**2"
  L_p:
    quantity: defect_healing_length
    unit: nm
  E_0:
    quantity: energy_per_length_per_filament
    unit: pN
outputs:
  tail_exponent:
    quantity: gaussian_tail_exponent
    unit: dimensionless
settings: {}
stochastic: false
