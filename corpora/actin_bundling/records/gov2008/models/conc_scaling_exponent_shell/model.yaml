id: conc_scaling_exponent_shell
name: exact concentration scaling exponent of empty-shell Eq. (3) via Langmuir binding
role: processing
stated:
  page: 4
  printed_page: "011916-4"
  quote: "should increase either linearly or as the third root of the"
  where: "text, p. 4 col 1 (Eq. 3 + Langmuir binding)"
equation: "d(ln R_0_shell)/d(ln c) = [(E_c_star/E_c)/(1 - E_c_star/E_c)] / (1 + c * exp(eps)), eps_b = eps_b_max * c * exp(eps) / (1 + c * exp(eps))"
built_from:
  - binding_energy_vs_concentration
  - critical_core_energy_shell
  - equilibrium_radius_shell_eq3
inputs:
  c:
    quantity: crosslinker_concentration
    unit: dimensionless
  eps:
    quantity: crosslinker_binding_free_energy
    unit: dimensionless
  eps_b_max:
    quantity: adhesion_energy_per_length
    unit: pN
  rho:
    quantity: defect_areal_density
    unit: "1 / nm**2"
  a:
    quantity: filament_radius
    unit: nm
  lam:
    quantity: empty_shell_thickness
    unit: nm
  E_c:
    quantity: defect_core_energy_per_length
    unit: pN
outputs:
  exp_c:
    quantity: concentration_scaling_exponent
    unit: dimensionless
settings: {}
stochastic: false
