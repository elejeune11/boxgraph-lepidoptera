id: empty_shell_tail_printed
name: printed large-R empty-shell distribution tail (p. 4 col 2)
role: model
stated:
  page: 4
  printed_page: "011916-4"
  quote: "we get a very shallow decay of"
  where: "text, p. 4 col 2"
equation: "P(R) ~ exp(-1/a - 1/R)"
prefactor: unknown
runnable: false
not_runnable_reason: "Exponent (-1/a - 1/R) has dimension 1/[length] rather than dimensionless because the paper omits the dimensional length prefactor 4*pi*beta*a^2*rho*lam*(E_c - E_c*)/D_R; moreover the printed negative sign on -1/R produces a weight that increases rather than decays for R > R_{0,shell}, and the true Boltzmann weight exp[const + C/R] approaches a nonzero plateau as R -> oo (non-normalizable)."
inputs:
  R:
    quantity: bundle_radius
    unit: nm
  a:
    quantity: filament_radius
    unit: nm
outputs:
  P:
    quantity: boltzmann_radius_weight
    unit: dimensionless
settings: {}
stochastic: false
