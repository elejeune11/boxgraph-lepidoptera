id: incompressible_defect_energy_eq6_middle_corrected
name: incompressible bundle defect energy per unit length (Eq. 6 middle divided by L_p)
role: model
variant_of: incompressible_defect_energy_eq6_middle
corrections:
  - equation: "Eq. 6"
    change: "Divide the printed middle expression K * rho_v * L_p * (a / L_p^2)^2 * R^2 * L_p by the axial slice length L_p to obtain bending energy per unit length per filament."
    evidence: "Substituting rho_v = rho / L_p into the printed middle expression gives K * rho * a^2 * R^2 / L_p^3 (dimension [energy], energy per slice of length L_p), exceeding the printed right-hand side K * rho * (R/L_p)^4 / (R/a)^2 = K * rho * a^2 * R^2 / L_p^4 (dimension [energy]/[length]) by a factor of L_p. Dividing by L_p makes both sides of Eq. (6) symbolically identical and dimensionally consistent with E_bind and Eq. (9)."
stated:
  page: 3
  printed_page: "011916-3"
  quote: "we finally get that the defects' energy per unit length per"
  where: "Eq. 6 (middle expression, corrected)"
equation: "E_defects_b = (1 / L_p) * K * rho_v * L_p * (a / L_p^2)^2 * R^2 * L_p"
inputs:
  K:
    quantity: filament_bending_modulus
    unit: "pN * nm**2"
  rho_v:
    quantity: defect_volumetric_density
    unit: "1 / nm**3"
  L_p:
    quantity: defect_healing_length
    unit: nm
  a:
    quantity: filament_radius
    unit: nm
  R:
    quantity: bundle_radius
    unit: nm
outputs:
  E_defects_b:
    quantity: energy_per_length_per_filament
    unit: pN
settings: {}
stochastic: false
