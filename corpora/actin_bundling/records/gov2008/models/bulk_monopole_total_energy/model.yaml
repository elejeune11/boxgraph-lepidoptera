id: bulk_monopole_total_energy
name: total energy per filament for uniform bulk monopole defects (Eqs. 1 and 4)
role: model
stated:
  page: 3
  printed_page: "011916-3"
  quote: "has a global minimum at a finite"
  where: "text, p. 3 col 2 (Eqs. 1 and 4)"
equation: "E_total = E_bind + E_defects_b"
built_from:
  - binding_energy_eq1
  - bulk_monopole_defect_energy_eq4
inputs:
  R:
    quantity: bundle_radius
    unit: nm
  a:
    quantity: filament_radius
    unit: nm
  eps_b:
    quantity: adhesion_energy_per_length
    unit: pN
  k_b_prime:
    quantity: monopole_elastic_stiffness
    unit: pN
  rho:
    quantity: defect_areal_density
    unit: "1 / nm**2"
outputs:
  E_total:
    quantity: energy_per_length_per_filament
    unit: pN
settings: {}
stochastic: false
