id: binding_energy_eq1
name: bundle adhesion energy per unit length per filament (Eq. 1)
role: model
stated:
  page: 2
  printed_page: "011916-2"
  quote: "adhesion energy per unit length per filament can be simply"
  where: "Eq. 1"
equation: "E_bind = -pi * (R / a) * eps_b * ((R / a) - 2) / (R / a)^2"
inputs:
  R:
    quantity: bundle_radius
    unit: nm
  a:
    quantity: filament_radius
    unit: nm
  eps_b:
    quantity: adhesion_energy_per_length
    unit: pN
outputs:
  E_bind:
    quantity: energy_per_length_per_filament
    unit: pN
settings: {}
stochastic: false
