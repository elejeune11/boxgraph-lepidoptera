id: equilibrium_radius_shell_from_energy
name: exact numerical minimizer of empty-shell total energy (Eqs. 1-2)
role: model
stated:
  page: 3
  printed_page: "011916-3"
  quote: "The total energy per unit length per filament is now"
  where: "text, p. 3 col 1 (from Eqs. 1-2)"
equation: "R_0 = argmin_{R > lam} [E_bind(R) + E_defect(R)]"
built_from:
  - empty_shell_total_energy
inputs:
  a:
    quantity: filament_radius
    unit: nm
  eps_b:
    quantity: adhesion_energy_per_length
    unit: pN
  rho:
    quantity: defect_areal_density
    unit: "1 / nm**2"
  lam:
    quantity: empty_shell_thickness
    unit: nm
  E_c:
    quantity: defect_core_energy_per_length
    unit: pN
outputs:
  R_0:
    quantity: bundle_radius
    unit: nm
settings:
  rtol: 1.0e-10
  h_rel: 1.0e-6
stochastic: false
