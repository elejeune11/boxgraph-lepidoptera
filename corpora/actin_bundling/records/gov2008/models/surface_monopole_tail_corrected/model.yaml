id: surface_monopole_tail_corrected
name: corrected large-R power-law tail for surface monopole defects (factor of 4 in exponent)
role: model
variant_of: surface_monopole_tail_printed
corrections:
  - equation: "p. 4 col 2 inline power-law tail for Eq. (5)"
    change: "Replace exponent -2*pi*a^2*rho*beta*k/D_R with -4*pi*a^2*rho*beta*k_s_prime/D_R."
    evidence: "Substituting Eq. (5), E_{defects,s} = 2*pi*k'_s*a^2*rho*ln(R/a), into the paper's steady-state Boltzmann solution P(R) ~ exp[-2*beta*(E_total(R) - E_0)/D_R] multiplies the factor of 2 in Eq. (5) by the factor of 2 in the Boltzmann exponent, yielding (R/a)^(-4*pi*a^2*rho*beta*k'_s/D_R), a factor of 2 larger in the power-law exponent than printed."
stated:
  page: 4
  printed_page: "011916-4"
  quote: "decays as a power-law for large R, in the form"
  where: "text, p. 4 col 2 (corrected)"
equation: "P(R) ~ (R / a)^(-4 * pi * a^2 * rho * beta * k_s_prime / D_R)"
prefactor: unknown
inputs:
  R:
    quantity: bundle_radius
    unit: nm
  a:
    quantity: filament_radius
    unit: nm
  rho:
    quantity: defect_areal_density
    unit: "1 / nm**2"
  beta:
    quantity: radius_mobility
    unit: "nm**2 / (pN * s)"
  k_s_prime:
    quantity: monopole_elastic_stiffness
    unit: pN
  D_R:
    quantity: radius_diffusion_coefficient
    unit: "nm**2 / s"
outputs:
  P:
    quantity: boltzmann_radius_weight
    unit: dimensionless
settings: {}
stochastic: false
