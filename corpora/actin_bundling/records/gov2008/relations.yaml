    - "Cylindrical cross-section filament count N_b = (R/a)^2 with Gaussian-in-R / exponential-in-N_b decay constant k_off/D = 2*beta*K*rho*a^4/(D_R*L_p^4)"
    - "Agreement holds only in the large-R tail; at small R, Haviv Eq. (1) rises via exp(+2*(k_on/D)*(R/a)) (finite P(0) = R_n) whereas Gov Eq. (1)+(6) suppresses small R via exp(-4*pi*beta*a*eps_b/(D_R*R)) (vanishing as R -> 0+)"

- id: rel_haviv2008_eq1_reduces_to_incomp_gaussian_tail
  kind: reduces_to
  a: haviv2008/size_distribution_eq1
  b: gov2008/incompressible_gaussian_tail
  output_map:
    P: P
  mapping:
    R: "10 * sqrt(N_b)"
    a: "10"
    K: "50000"
    rho: "1000 * koff_over_D"
    L_p: "100"
    beta: "1"
    D_R: "10000"
  limit:
    kon_over_D: "0"
  regime:
    R_n: [1.0, 1.0]
    kon_over_D: [0.01, 0.5]
    koff_over_D: [0.01, 0.1]
    N_b: [10.0, 200.0]
  provenance: proposed
  reason: >
    Formalizes the exact equivalence between the large-size decay of Haviv et al. (2008) Eq. (1)
    (P(N_b) = R_n*exp(2*(k_on/D)*sqrt(N_b) - (k_off/D)*N_b), exponential in filament count N_b
    and equivalently Gaussian in radius R = a*sqrt(N_b)) and Gov (2008, p. 4 col. 2)'s large-R
    incompressible-bundle Gaussian tail P(R) = exp(-2*beta*K*rho*a^2*R^2/(D_R*L_p^4)). At unit
    normalization (R_n = 1) as the rim-attachment rising term vanishes (k_on/D -> 0), Haviv
    Eq. (1) reduces identically to Gov's incompressible Gaussian tail under N_b = (R/a)^2 and
    k_off/D = 2*beta*K*rho*a^4/(D_R*L_p^4) (illustrated at Gov's baseline scale a = 10 nm,
    L_p = 100 nm, K = 5e4 pN*nm^2, beta = 1, D_R = 1e4 nm^2/s).
  assumptions:
    - "Unit normalization prefactor R_n = 1 (incompressible_gaussian_tail omits normalization R_n)"
    - "Vanishing rim-attachment growth term k_on/D -> 0 isolating the pure exponential-in-N_b / Gaussian-in-R tail"
    - "Cylindrical packing relation N_b = (R/a)^2 with a = 10 nm and k_off/D = 2*beta*K*rho*a^4/(D_R*L_p^4)"

