# ==========================================================================
# 5. Cross-record ModelAtlas relations (Wave 6 remaining 7 partner pairs:
#    claessens2006, claessens2008, dutta2016, gov2018, grason2007,
#    haviv2008, mietke2019)
#    - claessens2006+gov2008: 1 proposed Langmuir relation
#    - claessens2008+gov2008: 1 proposed dilute-actin Langmuir relation
#    - gov2008+haviv2008: 4 relations (1 proposed Langmuir, 2 stated tail
#      scaling tests for Eqs. 6 and 4 vs Haviv Eq. 1, 1 proposed reduction
#      of Haviv Eq. 1 to incompressible_gaussian_tail as kon_over_D -> 0)
#    - dutta2016+gov2008, gov2008+gov2018, gov2008+grason2007,
#      gov2008+mietke2019: 0 relations (see questions.yaml for each pair)
# ==========================================================================

- id: rel_claessens2006_langmuir_binding_energy
  kind: scales_as
  a: gov2008/binding_energy_vs_concentration
  b: claessens2006/abp_chemical_equilibrium
  output_map:
    theta: eps_b
  mapping:
    c_ABP: "c"
    K_d: "exp(-eps)"
    delta_max: "33"
  regime:
    c: [1.0e-5, 1.0e-1]
    eps: [2.0, 12.0]
  provenance: proposed
  reason: >
    Both Gov (2008, p. 4 col. 1; citing Claessens et al. 2006 as ref-1 on p. 1 col. 1) and
    Claessens et al. (2006, Methods p. 12) model equilibrium non-cooperative cross-linker
    binding to F-actin with the identical two-state Langmuir isotherm: eps_b ~ c*exp(eps)/(1 +
    c*exp(eps)) in Gov (prefactor: unknown, carrying adhesion-energy-per-length unit pN) and
    bound fraction theta = c_ABP / (K_d + c_ABP) = (c_ABP/K_d)/(1 + c_ABP/K_d) in Claessens
    (determining axial cross-link spacing delta = delta_max/theta). Identifying K_d/c_0 =
    exp(-eps) and c_ABP/c_0 = c (with unit concentration scale c_0 = 1 uM so c_ABP/K_d =
    c*exp(eps)), both functions have identical log-slopes in (c, eps) across both the linear
    dilute regime (c*exp(eps) << 1) and the saturated occupancy plateau (c*exp(eps) >> 1).
  assumptions:
    - "Excess-ABP (non-depleted) Langmuir equilibrium in both models, with c_ABP/K_d = c*exp(eps)"
    - "Linear proportionality between Gov's average adhesion energy per unit length eps_b and bound cross-linker fraction theta"
    - "Minimum axial cross-link spacing delta_max = 33 nm does not enter theta"

- id: rel_claessens2008_bound_ratio_scales_langmuir
  kind: scales_as
  a: claessens2008/effective_bound_ratio
  b: gov2008/binding_energy_vs_concentration
  output_map:
    eps_b: R_star
  mapping:
    c: "R * c_a * 1e-6"
    eps: "log(1e6 / K_d)"
  regime:
    R: [50.0, 500.0]
    K_d: [0.3, 1.0]
    c_a: [0.0005, 0.005]
  provenance: proposed
  reason: >
    Claessens et al. (2008, Methods p. 4) compute the bound fascin-to-actin molar ratio
    R* = (1/2)*[(1 + R + K_d/c_a) - sqrt((1 + R + K_d/c_a)^2 - 4*R)] from closed-system
    mass-action equilibrium accounting for fascin depletion by F-actin, whereas Gov (2008,
    p. 4 col. 1) uses the grand-canonical (non-depleted) Langmuir isotherm
    eps_b ~ c*exp(eps)/(1 + c*exp(eps)). Under standard-state normalization c_0 = 1 M = 10^6 uM
    (c = c_f/c_0 = R*c_a*1e-6 and eps = -ln(K_d/c_0) = ln(1e6/K_d), matching Claessens p. 3's
    Delta G / k_B T = -ln(K_d/c_0) ~= 15 for fascin), in the dilute-actin crossover regime
    (c_a << K_d, R >> 1 so c*exp(eps) = R*c_a/K_d spans [0.025, 8.33] across the nonlinear
    Langmuir knee), R* approaches (R*c_a/K_d)/(1 + R*c_a/K_d) and shares the exact log-slopes
    of Gov's Langmuir binding energy in all three variables (R, K_d, c_a). In Claessens's
    actual experimental regime (c_a = 0.1-3 mg/ml ~= 2.4-71 uM >> K_d = 0.3 uM), fascin
    depletion breaks this equivalence.
  assumptions:
    - "Dilute-actin reservoir limit c_a in [0.0005, 0.005] uM << K_d in [0.3, 1.0] uM with stoichiometric excess R in [50, 500]"
    - "Standard-state thermodynamic mapping c = c_f / (1 M) and eps = -ln(K_d / (1 M))"
    - "Linear proportionality between adhesion energy eps_b and bound cross-linker occupancy R*"

- id: rel_haviv2008_langmuir_binding_energy
  kind: scales_as
  a: gov2008/binding_energy_vs_concentration
  b: haviv2008/fascin_adsorption_probability
  output_map:
    p_fa: eps_b
  mapping:
    phi: "c"
    beta: "1"
    eps_kBT: "eps"
  regime:
    c: [1.0e-5, 1.0e-1]
    eps: [2.0, 12.0]
  provenance: proposed
  reason: >
    Both Gov (2008, p. 4 col. 1, citing Haviv et al. 2008 [ref-6] for bundle thickness increasing
    with cross-linker concentration) and Haviv, Gov, Ideses & Bernheim-Groswasser (2008, p. 7
    col. 1, co-authored by Gov) employ the exact same equilibrium Langmuir binding isotherm:
    eps_b ~ c*exp(eps)/(1 + c*exp(eps)) in Gov (prefactor: unknown, unit pN) and
    p_fa = beta*phi*exp(eps/k_B T)/(1 + beta*phi*exp(eps/k_B T)) in Haviv (dimensionless
    probability that a short actin filament carries an attached fascin cross-linker, where
    beta*phi is proportional to the fascin volume fraction in solution). Identifying c = beta*phi
    (mapped at beta = 1) and eps = eps_kBT yields identical log-slopes in (c, eps) throughout
    both the linear weak-binding and saturated regimes.
  assumptions:
    - "Gov's dimensionless cross-linker concentration c corresponds directly to Haviv's volume-fraction factor beta*phi (mapped with beta = 1)"
    - "Single-bond binding free energy eps (in k_B T units) equals Haviv's eps_kBT"

- id: rel_haviv2008_incomp_boltzmann_scales_eq1_tail
  kind: scales_as
  a: gov2008/incompressible_boltzmann_dist
