# ==========================================================================
# 4. Reproduction checks of low-concentration scaling claims (p. 4 col 1)
# ==========================================================================
- id: cmp_low_conc_exp_surface_monopole
  purpose: reproduction
  computed: exp_R0_s_c_low
  printed: low_conc_exp_surface_printed
  note: "Combining Eq. (8) with Langmuir binding eps_b propto c*exp(eps)/(1 + c*exp(eps)) gives d(ln R_{0,s})/d(ln c) = 1/(1 + c*exp(eps)) -> 1 at low c and eps, reproducing linear concentration scaling."

- id: cmp_low_conc_exp_incompressible
  purpose: reproduction
  computed: exp_R0_bp_c_low
  printed: low_conc_exp_incomp_printed
  note: "Combining Eq. (9) with Langmuir binding gives d(ln R'_{0,b})/d(ln c) = (1/3)/(1 + c*exp(eps)) -> 1/3 at low c and eps, reproducing cube-root concentration scaling."

- id: cmp_low_conc_exp_shell
  purpose: reproduction
  computed: exp_R0_shell_c_low
  printed: low_conc_exp_shell_printed
  note: "Combining Eq. (3) with Langmuir binding gives d(ln R_{0,shell})/d(ln c) -> 0 as c -> 0 (approaching constant lambda), refuting linear scaling with concentration c."

- id: cmp_low_conc_exp_bulk_monopole
  purpose: reproduction
  computed: exp_R0_b_c_low
  printed: low_conc_exp_bulk_printed
  note: "Combining Eq. (7) with Langmuir binding gives d(ln R_{0,b})/d(ln c) = [(1/3)*W(C)/(1 + W(C))]/(1 + c*exp(eps)) < 1/3 for all c > 0 (vanishing as c -> 0), refuting linear scaling with concentration c."
