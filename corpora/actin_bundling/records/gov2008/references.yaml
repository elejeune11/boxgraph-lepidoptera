- id: ref-15
  label: "15"
  text: "The total adhesion and packing energy of a finite number N of aggregating filaments, when arranged into identical bundles of equal thickness (each with N_b filaments), is E_tot = (N / N_b) E_bundle = N (E_bundle / N_b), i.e. the total number of filaments times the energy per filament inside the bundle. Up to the constant N this is the energy we use throughout this paper, in Eqs. (1), (2), and (4)-(6)."
