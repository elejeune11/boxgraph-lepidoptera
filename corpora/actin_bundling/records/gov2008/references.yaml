- id: ref-17
  label: "17"
  text: "Note that a dilation (monopole) term due to a twist defect should vanish in the limit of a dilute bundle where the interfilament separation is large compared to the filament radius. We wish here to consider the general case where this term might also have a significant contribution to the defect energy."
