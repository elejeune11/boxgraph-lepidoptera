# Cross-record provenance audit of cited numerical values between gov2008 and the 7 remaining
# ready Wave 6 partner records (claessens2006, claessens2008, dutta2016, gov2018, grason2007,
# haviv2008, mietke2019). (borukhov2005, henle2005, kierfeld2005, shin2009 were already audited
# in those partner records.)
#
# Audit of all 7 pairs:
# 1. gov2008 -> claessens2006 (ref-1):
#    gov2008 cites claessens2006 qualitatively on p. 1 col. 1 ("determines the mechanical
#    properties of artificial networks that form in vitro [1-3]"). Zero datums in
#    gov2008/data.yaml take a numerical value from ref-1. claessens2006 (2006) predates gov2008.
#
# 2. claessens2008 + gov2008:
#    Neither paper cites the other (claessens2008 ref-27 is Haviv, Gov, Ideses &
#    Bernheim-Groswasser 2008 [haviv2008], not gov2008). Zero cited-value links.
#
# 3. dutta2016 -> gov2008 (ref-22):
#    dutta2016 cites gov2008 qualitatively on p. 2 col. 2 ("Gov [22] proposes that quenched
#    packing defects (splay and twist) limit the size of the bundles in cells' cytoskeleton").
#    (dutta2016 ref-6 is haviv2008.) Both from_source datums in dutta2016/data.yaml come from
#    ref-11 (Borukhov et al. 2005), not gov2008. Zero cited-value links.
#
# 4. gov2008 + gov2018:
#    Neither paper cites the other (gov2018 ref-33, ref-87, ref-117 are Shlomovitz & Gov 2008
#    papers on membrane waves and contractile ring initiation, not gov2008). Zero cited-value links.
#
# 5. gov2008 -> grason2007 (ref-8):
#    gov2008 cites grason2007 qualitatively on p. 1 col. 1 ("attributes the finite size of the
#    actin bundles to the inherent chirality of the packing of actin filaments [8]"). Zero datums
#    in gov2008/data.yaml take a numerical value from ref-8. grason2007 (2007) predates gov2008.
#
# 6. gov2008 -> haviv2008 (ref-6):
#    gov2008 cites haviv2008 qualitatively on p. 1 col. 1 ("broad distribution of radii [6]";
#    "chemically cross linked by larger proteins [2,3,5,6]"), p. 2 col. 1 ("widths ... seem to be
#    constrained [5,6]"), p. 4 col. 1 ("average thickness ... increases with concentration [2,3,6]"),
#    and p. 4 col. 2 ("width distribution ... was measured [6], and found to behave as a Guassian").
#    On p. 2 col. 1, gov2008 prints `a ~ 10 nm is the radius of the individual filaments and
#    surrounding cross linkers [5,6]` (`filament_radius_a_printed`), co-citing ref-5 (Lai et al.
#    2007, outside the corpus) and ref-6 (haviv2008). This datum CANNOT be linked to
#    `haviv2008/effective_filament_diameter_Df` ("9" nm, itself cited from Ishikawa et al. 2003)
#    for two independent reasons:
#    (a) Physical/quantity mismatch (factor-of-2 error): gov2008 defines `a ~ 10 nm` as filament
#        RADIUS (used via N = (R/a)^2 in Eqs. 1-6), whereas haviv2008 defines D_f = 9 nm as
#        effective filament DIAMETER (center-to-center spacing, used via N_b = (D_b/D_f)^2), so
#        haviv2008's effective filament radius is D_f/2 = 4.5 nm (~2x smaller than Gov's a ~ 10 nm;
#        cf. q_audit_filament_radius_vs_spacing_ambiguity and q_haviv2008_cross_audit_and_no_validation).
#    (b) Schema provenance constraint: `gov2008/data.yaml` sets `from_source: ref-5` on
#        `filament_radius_a_printed` (immutable per relate rules), and boxgraph validate forbids
#        overriding a datum's existing `from_source` in cited.yaml.
#    haviv2008 (published earlier in 2008) does not cite gov2008.
#
# 7. gov2008 + mietke2019:
#    Neither paper cites the other (mietke2019 ref-17 is Shlomovitz & Gov 2008, Biophys. J. 94,
#    1155-1168, not gov2008). Zero cited-value links.
#
# Accordingly, zero CitedLink entries apply to gov2008 across all 7 pairs.
[]
