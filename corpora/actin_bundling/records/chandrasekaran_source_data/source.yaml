  Nature Communications 15, 3139 (2024) (record `chandrasekaran2024`). No .xlsx files or raw dumps
  are copied into this record; 20 zero-dependency Python stdlib (zipfile + xml.etree.ElementTree)
  `software: true` reader models under models/ load 41467_2024_46726_MOESM9_ESM.xlsx directly from
  $BOXGRAPH_SOURCE on every build to verify all 37 sheets, recompute exact summary statistics from
  raw replicates/snapshots, test 45 intra-record comparisons (15 targets linked via
  `from_source: chandrasekaran2024` + `from_datum`), and run 101 cross-record validations directly
  against chandrasekaran2024's printed tables and all 99 workbook-backed blindly digitized figure
  curves (out of 106 digitized curves total; 7 curves are absent or overwritten in the workbook).

  BLIND-DIGITIZATION CROSS-CHECK SUMMARY (99 workbook-backed curves + Fig. 7Aii table):
  Across 99 workbook-backed digitized figure curves in chandrasekaran2024, live cross-validation
  yields 52 `reproduced` (every digitized point inside its reading band), 42 `close`, and only 5
  `not reproduced` (two thin-bar-edge Fig. 3D curves, heavily overlapping Fig. 4B.ii 5*pi/3, 1/28
  steep interface marker in Supp. Fig. 1B, and 0-width/cliff points in Supp. Fig. 6F 0 nM) — 94/99
  (94.9%) `reproduced` or `close` with sub-percent accuracy across Fig. 5D (<=0.017% except one
  0.49% clip at 100%), Fig. 6B (<=0.04%, 42/42 bars), Fig. 6D GABmut (<=0.095%, 9/9 bars), Fig. 7B
  (MAE 0.0032, 10/10 bars), Fig. 7F surface energy (MAE 0.0032), Supp. Fig. 2B (MAE 0.00030 um),
  Supp. Fig. 2C (MAE 0.0022, 36/36 bars), Supp. Figs. 5 & 10 spans (MAE 0.0014 um, 18/18 medians),
  Supp. Fig. 6B filament counts (MAE 0.04-2.3 out of 1500, 48/48 pts), Supp. Fig. 6C (MAE 0.0048 um),
  Supp. Fig. 6E (MAE 0.0043), and Supp. Fig. 13C (MAE 0.26 uM). Crucially, blind digitization
  independently uncovered an off-by-one header shift in sheet `Figure4B`.

  KEY DISCREPANCIES & SETTLED OPEN QUESTIONS:
  (1) `Figure4B` off-by-one header shift & missing 2*pi curve: only 7 blocks exist (headers skipping
      2*pi/3), and matching against digitized Fig. 4B proves blocks 4-7 labeled {1.0, 4/3, 5/3, 2}*pi
      actually hold {2/3, 1.0, 4/3, 5/3}*pi (MAE 0.017-0.042 vs 0.112-0.129 literal), while true 2*pi
      is absent.
  (2) `Figure6D` settles SD vs SEM AND exposes a buggy SEM formula & omitted WT data: rows 1-19 (WT
      replotted from graham2023) are blank; N = 3 GABmut replicates (655 total droplets) reproduce
      stored AVERAGE and sample SD (ddof=1: 37.39 +/- 6.87% shell, 52.71 +/- 9.63% ring, 9.89 +/- 6.90%
      disc at 1:7.5, matching Fig. 6D error bars), and true SEM = SD/sqrt(3) (3.97% -> 4%, 5.56% -> 6%)
      matches main text p. 7, whereas workbook cells L36:N38 erroneously store SD/3 (2.29%, 3.21%, 2.30%).
  (3) `Figure3E`, `FigureS5`, `FigureS9` scrambled cluster legends & inverted spans: `Figure3E`/`FigureS5`
      Row 2 legend ('0-Ring, 1-Shell-SB, 2-Shell-WB, 3-Shell') is wrong (actual codes: 0=Shell, 1=Shell-SB,
      2=Ring, 3=Shell-WB); `FigureS9` Row 2 ('0-Ring, 1-Shell-SB') is inverted (0=Shell-SB, 1=Ring);
      columns A-C ('spanc, spanb, spana') are ordered largest-to-smallest (plotted a >= b >= c).
  (4) Supplementary Table 3 settled: `Figure3E` matches 35/36 cells verbatim and proves (1.0, 10.0) is
      15/15 Cluster 0 (Shell; AF=0.5016, 95.62% unbound VASP), confirming a Table 3 typo. At (1.0, 1.0),
      `Figure3E` (N=3) and `Figure5C` give 100% Shell-SB (matching Table 3), whereas `Figure6B` (N=5)
      gives 40% Ring / 60% Shell-SB; `Figure6B` cell E5 also literally stores the '1.5625' typo (for
      1.15625), 0.1 uses N=3 (0.67/0.33), and 1.375 stores 0.5/0.5 (even split despite caption 'N=5').
  (5) Replicate counts settled across every study: `Figure5C` (900 T_2piR rows = 30 cells x 6 reps x 5
      snaps) reproduces 30/30 `Figure5D` entries to 0.0 diff -> N = 6 replicates (refuting both '10'
      and '5'); `Figure7B` has 5 raw replicate cols D..H (refuting caption 'six replicates', using
      ddof=0, and containing all 10 Fig. 7C representative ARs verbatim); `FigureS2C`, `Figure3D`,
      `FigureS10D`, `FigureS10E` all have 93 raw cols = 3 reps x 31 frames (t=570..600 s; refuting
      captions claiming 5 reps x 30 = 150, using ddof=0); `FigureS11C` has 6 reps (30 snaps) for 11/12
      cells and 5 reps (25 snaps) at ([VASP]=2.0, N_fil=165).
  (6) PCA captions & missing `FigureS11Bi`: `FigureS4A` PC1-3 = 95.83% (PC1-2 = 86.16%; refutes main
      text 97.64% and proves Supp. Fig. 4A caption mislabeled 3 PCs as 'two PCs'); `FigureS8A` (=Supp.
      Fig. 9A) PC1-3 = 99.06% (PC1-2 = 94.95%; same 3-PC mislabel); `FigureS12A` PC1-3 = 94.72% (exact
      match); `FigureS11Bi` is an exact duplicate of Varimax matrix `FigureS11Bii` (omitting Supp.
      Fig. 11B.i variance data). `FigureS11Biii` confirms k=4 (0.5789) and k=9 (0.5755) > k=3 (0.5754).
  (7) `FigureS2B` confirms area-equivalent equilateral triangle side lengths ('Side of equilateral
      triangle (um) RAW DATA') and uncovers 1,281-column truncation (B..AWH) for n = 4 (missing 3,839
      of 5,120 faces) and n = 5 (missing 19,199 of 20,480 faces).
  (8) Twelve SI sheet tabs retain pre-revision numbering (`FigureS6`->S8, `FigureS8A-C`->S9A-C,
      `FigureS9`->S10, `FigureS10B-F`->S6B-F, `FigureS11`->S11D, `FigureS14C`->S13C). `FigureS6`
      stores all-zero placeholder clusters; `FigureS14C` starts at Clocal = 90.99 uM (>80 uM plot
      ceiling) and reproduces all 6 Fig. 7A.ii (time, AR) labels verbatim.

