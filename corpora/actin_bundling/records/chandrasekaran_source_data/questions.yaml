  text: >
    Direct cross-workbook audit of 41467_2024_46726_MOESM9_ESM.xlsx ('Figure6D') against
    graham_source_data (MOESM14 'Fig 3d' and MOESM20 'Fig S4c') establishes exact WT provenance,
    aggregation-method asymmetry, and how the EDTA/EGTA buffer choice alters the VASP-GABmut shift
    (0 ModelAtlas relations across all 20 x 11 = 220 reader pairs; 0 direct cited.yaml links across
    all 77 x 94 datums because the two workbooks are strictly complementary on both crossover panels):
    (1) Exact WT provenance & aggregation asymmetry: MOESM9 'Figure6D' leaves WT rows 1-19 completely
    blank and holds only N = 3 VASP-GABmut replicates in rows 20-43 (192 + 265 + 198 = 655 total
    droplets: [42, 48, 48] = 138 at 1:20, [59, 115, 103] = 277 at 1:10, [91, 102, 47] = 240 at 1:7.5;
    pooled per-replicate counts, EDTA/EGTA-free buffer). Conversely, graham_source_data MOESM14
    'Fig 3d' holds the exact WT replicate counts (302 + 181 + 231 = 714 total droplets across 0.5 mM
    EDTA + 0.5 mM EGTA buffer: [75, 51, 52] = 178 over [8, 6, 5] images at 1:20, [116, 57, 107] = 280
    over [8, 5, 5] images at 1:10, [111, 73, 72] = 256 over [6, 5, 5] images at 1:7.5; refuting
    Graham's caption '>= 600 droplets per replicate'). MOESM14's stored image-mean summary table
    (AD7:AI9: 1:20 58.18 +/- 9.25% shell, 31.25 +/- 2.75% ring, 10.57 +/- 6.54% disc; 1:10 20.16 +/-
    9.40%, 57.13 +/- 3.67%, 22.72 +/- 12.86%; 1:7.5 5.93 +/- 6.81%, 24.38 +/- 16.06%, 69.69 +/- 21.65%
    [SEM = 12.50%, matching chandrasekaran2024 p. 7 '70 +/- 13%']) matches all 9 digitized WT bars and
    9 SD error bars of chandrasekaran2024 Fig. 6D to <= 0.09 pp (mean) and <= 0.07 pp (SD), proving
    Fig. 6D juxtaposes unweighted per-image-mean WT statistics from EDTA/EGTA buffer (MOESM14 'Fig 3d')
    against pooled-replicate GABmut statistics from EDTA/EGTA-free buffer (MOESM9 'Figure6D'; note
    MOESM14 pooled means differ by up to 2.0 pp at 1:20: 56.90 +/- 13.86% shell, 30.49 +/- 6.06% ring,
    12.61 +/- 7.86% disc).
    (2) Quantitative GABmut shift vs MOESM14 'Fig 3d' (EDTA/EGTA) AND buffer-matched MOESM20 'Fig S4c'
    (EDTA/EGTA-free WT control: 170 + 110 + 137 = 417 total droplets across 3 images/replicate: [50,
    43, 36] = 129 at 1:20, [54, 35, 51] = 140 at 1:10, [66, 32, 50] = 148 at 1:7.5):
    - At Actin:VASP = 1:20, GABmut (75.10 +/- 9.25% shell, 21.33 +/- 8.74% ring, 3.57 +/- 2.32% disc)
      looks shifted relative to EDTA-containing 'Fig 3d' (+16.92 pp shell p = 0.089, -9.92 pp ring
      p = 0.134, -7.00 pp disc p = 0.156), YET is statistically indistinguishable from buffer-matched
      EDTA-free 'Fig S4c' (image-mean: 72.32 +/- 14.88% shell, 25.46 +/- 14.56% ring, 2.22 +/- 2.22%
      disc -> Delta = +2.78, -4.13, +1.35 pp, all two-tailed p >= 0.51; pooled: 72.03 / 25.76 / 2.22%
      -> Delta = +3.07, -4.43, +1.35 pp, all p >= 0.52). Nearly the entire visual 1:20 WT-vs-GABmut
      gap in Fig. 6D is therefore an EDTA/EGTA buffer effect rather than a GABmut phenotype.
    - At 1:10, GABmut (39.23 +/- 4.66% shell, 55.17 +/- 3.75% ring, 5.60 +/- 2.02% disc) elevates
      shells consistently against BOTH controls (+19.07 pp vs 'Fig 3d' Student p = 0.035 / Welch
      p = 0.053; +18.60 pp vs 'Fig S4c' image-mean 20.63 +/- 8.11%, Student p = 0.026 / Welch
      p = 0.037), leaves rings unchanged (-1.95 pp vs 3d, +2.52 pp vs S4c), and suppresses discs much
      more decisively against buffer-matched 'Fig S4c' (-21.12 pp vs 26.71 +/- 5.20%, Student
      p = 0.0028 / Welch p = 0.011; pooled -20.78 pp, p = 0.0021) than against noisy 'Fig 3d'
      (-17.12 pp vs 22.72 +/- 12.86%, Student p = 0.085 / Welch p = 0.144).
    - At 1:7.5, GABmut (37.39 +/- 6.87% shell, 52.71 +/- 9.63% ring, 9.89 +/- 6.90% disc) strongly
      suppresses discs and accumulates rings/shells — and the shift is LARGER and more statistically
      decisive against buffer-matched 'Fig S4c' (image-mean: 3.46 +/- 4.79% shell, 16.74 +/- 5.65%
      ring, 79.80 +/- 0.98% disc -> Delta = +33.93 pp shell p = 0.0022, +35.97 pp ring p = 0.0050
      [Welch 0.0093], -69.90 pp disc p = 6.4e-5 [Welch 0.0028]; pooled: 3.63 / 17.94 / 78.43% ->
      Delta = +33.76 / +34.78 / -68.54 pp, all p <= 0.0037) than against EDTA-containing 'Fig 3d'
      (Delta = +31.46 pp shell p = 0.0049, +28.33 pp ring p = 0.059 [borderline due to 16.06% SD],
      -59.80 pp disc p = 0.0104 [Welch 0.031]).
