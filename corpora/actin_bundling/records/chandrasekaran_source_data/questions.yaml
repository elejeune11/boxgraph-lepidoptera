  text: >
    Cross-attachment audit against CytoSim's ported C++ physics (chandrasekaran_cytosim) reveals
    four direct links between 41467_2024_46726_MOESM9_ESM.xlsx and the underlying solver:
    (1) FigureS10B's 8 x 601 raw filament-count trajectories confirm CytoSim's hold_end = MINUS_END
    Nucleator cycle from the 1-s burst through t = 600 s (t = 600 s within -1.6%..+2.1%;
    4,093/4,197 nonzero-SD points within 2 SD) and show an undiminished late-time nucleation slope
    (179-193 filaments/100 s at 150 nM), confirming Nucleator::stepUnattached() does not gate on
    free_polymer; (2) FigureS10C's full CDFs show 0.0 mass for L <= 0.1313 um across all 10..150 nM
    curves before jumping in [0.1313, 0.1970) um (22.5% at 150 nM), and combining FigureS10B
    N(585 s) with FigureS10C E[L] yields total F-actin length 1,010.5..1,246.6 um for 75..150 nM
