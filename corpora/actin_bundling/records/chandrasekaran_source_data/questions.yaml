  text: >
    Reverse complementarity on Fig. 7F vs Graham 2023 Fig. 5c plus cross-workbook physical-domain
    comparisons between MOESM9_ESM.xlsx and MOESM12-22_ESM.xlsx:
    (1) MOESM9 'Figure7F' supplies the missing numerical Source Data for Graham 2023 Fig. 5c: All 26
    theoretical/simulation panels of graham2023 (including Fig. 5c) were omitted from
    graham_source_data (MOESM12-22; graham_source_data/q_simulation_and_theory_panels_omitted),
    whereas chandrasekaran_source_data MOESM9 'Figure7F' (19 rows: AR = 1..9 in steps of 1.0 and
    9.1..10.0 in steps of 0.1; unitless headers 'Aspect Ratio', ' Bending Energy', ' Surface Energy ')
    actually contains the exact numerical table plotted in both Graham Fig. 5c and Chandrasekaran
    Fig. 7F. Linear interpolation of MOESM9 'Figure7F' matches 12/12 blindly digitized points of
    graham2023/fig5c_bending_fig (MAE 0.0768, max 0.323 at the AR = 9.7 cliff) and 10/10 points of
    graham2023/fig5c_surface_fig (MAE 0.0304, max 0.0669) inside their reading bands (and 12/12 +
    10/10 of chandrasekaran2024 Fig. 7F).
    (2) Machine-precision mathematical fingerprint (3.55e-15 match to Graham Eq. S11 / graham_code):
    Across all 19 rows (AR = 1..10), column B ('Bending Energy') reproduces exact numerical quadrature
    of Graham SI Section 2.11's minimum-bending-energy arc of length L = 2*pi on a constant-area
    ellipse (a = sqrt(AR), b = 1/sqrt(AR)) to <= 2.84e-5 (<= 5.12e-7 for AR <= 9.5; grid peak
    19.687006 at AR = 9.5 just below the exact continuous peak 19.798353 at P = 2*L critical AR_crit
    = 9.536210, then plunging to 11.915142, 4.722508, 2.100398, 1.101010, and 0.655778 at AR = 9.6..
    10.0 as the arc shifts onto one flatter flank without crossing either sharp pole). Crucially,
    column C ('Surface Energy') differs systematically from the exact complete elliptic integral
    4*sqrt(AR)*E(1 - AR^-2) by -3.9e-10 (AR = 2) growing monotonically to -3.164e-4 (AR = 10), and
    instead matches Graham SI Eq. S11 / graham_code/notebook_surface_energy's 7-term truncated
    Gauss-Kummer series pi*(a+b)*sum_{k=0..6} c_k*h^k (h = ((a-b)/(a+b))^2, c_6 = 441/1048576) to
    machine precision (max |diff| = 3.55e-15 across all 19 rows) — forensically proving 'Figure7F'
    comes directly from Graham et al.'s own continuum script.
    (3) Direct workbook confirmation of BOTH Fig. 5c / Fig. 7F anomalies (10^6 unit scale & AR = 10 >
    pi^2): At AR = 1.0, cells B2 = 3.1415926535897927 (= pi) and C2 = 6.283185307179586 (= 2*pi;
    ratio E_surf/E_bend = 2.0) confirm dimensionless R = 1, L = 2*pi, k_b = 1, gamma_I = 1 (i.e.,
    R = 1 nm for 'Energy (pN*nm)', or R = 1 um with k_b = 1 pN*um^2 yielding 'pN*um'), contrasting by
    exactly 10^6 with Graham Fig. 5c's literal caption parameters R = 1 um = 1000 nm, k_b = 1 pN*nm^2,
    gamma_I = 1 pN (which give E_bend(1) = pi/1000 = 0.003142 pN*nm and E_surf(1) = 2000*pi =
    6283.185 pN*nm, ratio 2 x 10^6; graham2023/q_fig5c_unit_mismatch). Furthermore, rows 19-20
    explicitly tabulate AR = 9.9 (2*a = 6.2929*R > 2*pi*R) and AR = 10.0 (2*a = 6.3246*R > 2*pi*R),
    confirming graham2023/q_audit_fig5d_ar_exceeds_pi_squared (exceeding (a/b)_max = pi^2 = 9.8696)
    while explaining why E_bend(10) = 0.6558 remains well-defined mathematically (half-perimeter
    P/2 = 6.4255*R > L = 6.2832*R along the curved flank even though chord 2*a > L).
    (4) Cross-workbook empirical AR, droplet-size, and elongation-timescale bounds: Against CytoSim's
    deformed-droplet ceiling in MOESM9 ('Figure7B' peak mean 5.073 at L_fil^max = pi um, max replicate
    5.458; 'FigureS14C' max 5.564 <= pi^(3/2) = 5.568 at fixed D = 2.0 um), raw experimental ARs in
    graham_source_data MOESM16 'Fig S5a' at 1:7.5 (n = 589, max 12.86) have 63/589 (10.70%) > 5.073,
    45/589 (7.64%) > pi^(3/2), and 3/589 (0.51%) > pi^2 (rising in MOESM22 'Fig S9e' 3% PEG, n = 877,
    max 26.52, to 533/877 = 60.8% > pi^(3/2) and 260/877 = 29.6% > pi^2), while only 21.93% of
    experimental 20 uM VASP droplets in MOESM20 'Fig S4e' (n = 1655, median 2.86 um, IQR 2.13-3.75 um)
    have D <= 2.0 um. Meanwhile, MOESM16 'Fig 5h''s measured linear bundle elongation rate (0.022734
    um/s) maps to T_{2piR} = (2*pi - 0.1)/0.022734 = 272.0 s at R = 1 um (395.2 s at median D = 2.86
    um), placing experimental growth squarely between the 200 s and 450 s columns of MOESM9 'Figure5D'
    (ring probability 36.7-86.7% at [VASP] = 0.8 uM and 83.3-100% at 0.4 uM).
