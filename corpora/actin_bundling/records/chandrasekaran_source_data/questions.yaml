    37 sheets / 20 readers / 77 datums) and VASPDroplet_simulate.ipynb (graham_code, 8 adapters /
    72 datums) yields 2 verified ModelAtlas `approximated_by` relations (out of 20 x 8 = 160 model
    pairs) and 0 direct cited.yaml links (out of 77 x 72 = 5,544 datum pairs, avoiding scalar-vs-table
    incompatibility and backwards provenance against graham_code/target_fig5c_surface), while
    establishing two sharp quantitative cross-code/workbook findings:
    (1) Bit-for-bit IEEE-754 forensic provenance of MOESM9 'Figure7F' Column C from
    VASPDroplet_simulate.ipynb::getsurfaceF(): Executing live graham_code/notebook_surface_energy
    (2D branch, R = 1 nm, gamma_I = 1 pN, h = (a-b)*(a-b)/((a+b)*(a+b)), pmeter = pi*(a+b)*(1 + h/4 +
    h^2/64 + h^3/256 + 25*h^4/16384 + 49*h^5/65536 + 441*h^6/1048576)) reproduces all 19/19 stored
    cells of MOESM9 sheet 'Figure7F' Column C (AR = 1..9 step 1.0, 9.1..10.0 step 0.1) to 0.000e+00
    (0 ULPs, bit-for-bit IEEE-754 float64 identity; generic sum(c_k*h^k) or Horner reordering differs
    by up to 3.55e-15 = 2 ULPs, confirming even the left-to-right Python expression order). Every
    alternative perimeter formula diverges by 10^10-10^11x more: exact complete elliptic integral
    4*sqrt(AR)*E(1 - AR^-2) differs monotonically from -3.905e-10 (AR = 2) to -3.164e-4 (2.46e-5 rel,
    AR = 10); the commented-out Ramanujan formula on VASPDroplet_simulate.ipynb line 351 differs by
    up to -1.678e-4 (1.31e-5 rel); 6-term truncation (to h^5) by +4.136e-4; and 8-term truncation
    (to h^7) by -1.709e-4. Column A likewise stores exact Python decimal float literals [9.1..10.0]
    (10/10 exact, vs np.arange failing 8/10 and np.linspace differing at 9.3). At AR = 1.0, cells
    B2 = 3.1415926535897927 (= pi) and C2 = 6.2831853071795862 (= 2*pi) independently lock in the
    consistent R = 1 nm, gamma_I = 1 pN unit normalization (confirming graham_code/cmp_fig5c_surface_1nm
    vs cmp_fig5c_surface_1um's 1000x mismatch and graham2023/q_fig5c_unit_mismatch's 10^6x ratio error).
    In ModelAtlas, rel_notebook_surface_approx_fig7f_table verifies fig7f_continuum_energy_reader
    approximates notebook_surface_energy across AR in [1, 10] to max relative error 1.43e-2 (<= 0.02,
    purely piecewise-linear chord error peaking at 1.438% at AR = 1.391 between integer nodes 1 and 2,
    dropping to 9.34e-4 on [2, 9]), while rel_notebook_surface_approx_fig7f_fine_grid on the dAR = 0.1
    cliff grid AR in [9, 10] verifies max relative error 2.80e-6 (true peak 3.04e-6 <= 1e-5) — nearly
    10x tighter than exact complete elliptic integral graham2023/ring_rod_transition_energy (2.68e-5,
    failing 1e-5) — executably fingerprinting Figure7F Column C as getsurfaceF()'s 7-term series.
    (Column B's continuum bending quadrature is not present in VASPDroplet_simulate.ipynb.)
    (2) CytoSim 3D aspect ratios ('Figure7B' & 'FigureS14C') vs graham_code's 2D open-ring AR plateau:
    Because VASPDroplet_simulate.ipynb::generatering() constructs an indivisible open elastic ring of
    fixed length 2.9*D (double off-by-one bug: 29 segments of 0.1*D, or 2.8*D at IEEE-754 truncated
    diameters) with no filament sliding or ring rupture, live graham_code/notebook_droplet_ring_slsqp
    saturates at AR = 1.56-1.75 at gamma_I = 5 pN (D = 1 um: 1.5618 at Fig. 4f max T_ring = 480 nm,
    1.7545 at T_ring = 3000 nm / Nfil = 200; at CytoSim-matched D = 2 um: 1.3800 at 850 nm -> 1.6576
    at 3000 nm) and AR = 1.70-1.80 at gamma_I = 1 pN (D = 1 um: 1.7489 -> 1.7989; D = 2 um: 1.7045 ->
