    150 nM median (0.684 um) >2x the unfiltered 942.5 um CytoSim prediction (0.315-0.337 um) —
    pointing to either post-processing exclusion of 2-vertex fibers (L < 4/3 * 0.1 = 0.1333 um from
    Chain::bestNumberOfPoints()) or a larger total_polymer / nonzero L_nuc_init overshoot in the
    unreleased .cym config; (3) Figure3D (frac_4 up to 0.6673 at (10, 1)) and FigureS10D (frac_4 =
    0.7027 at 150 nM) empirically prove VASP used 4-hand Sphere/Solid + Wrist objects rather than
