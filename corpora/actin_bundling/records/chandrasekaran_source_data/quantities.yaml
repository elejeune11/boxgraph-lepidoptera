# Quantities measured or tabulated across all 37 sheets of 41467_2024_46726_MOESM9_ESM.xlsx,
# aligned 1:1 in naming and dimensionality with chandrasekaran2024/quantities.yaml.

- id: time
  name: simulation time or elongation timescale
  dimension: "[time]"
  description: Elapsed simulation time t (0-600 s or 604.5-1028.5 s) or filament elongation timescale T_{2*pi*R}.

- id: binding_rate
  name: VASP-actin binding rate
  dimension: "1 / [time]"
  description: First-order binding rate k_bind of VASP crosslinker sites to F-actin.

- id: unbinding_rate
  name: VASP-actin unbinding rate
  dimension: "1 / [time]"
  description: Zero-force unbinding rate k_unbind of VASP crosslinker sites from F-actin.

- id: vasp_tetramer_concentration
  name: VASP tetramer concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of tetrameric VASP crosslinkers [VASP-tet] in uM.

- id: nucleator_concentration
  name: linear nucleator concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of linear actin nucleators [Nucleator] in nM.

- id: actin_concentration
  name: local or bulk actin concentration
  dimension: "[substance] / [length] ** 3"
  description: Actin molar concentration in uM (e.g., polar-cap local concentration Clocal in FigureS14C).

- id: vasp_to_actin_ratio
  name: VASP-to-actin molar ratio
  dimension: dimensionless
  description: Molar ratio of VASP monomers to actin monomers (denominator r in Actin:VASP = 1:r, i.e., 20, 10, 7.5).

- id: vasp_variant
  name: VASP protein variant label
  dimension: dimensionless
  description: Categorical experimental condition distinguishing wild-type VASP (WT) and G-actin-binding mutant (GABmut).

- id: filament_length
  name: actin filament contour length
  dimension: "[length]"
  description: Contour length or prescribed maximum filament length L_fil^max in um.

- id: filament_count
  name: actin filament count
  dimension: dimensionless
  description: Number of actin filaments N_fil in a droplet simulation.

- id: filament_count_sd
  name: actin filament count standard deviation
  dimension: dimensionless
  description: Standard deviation of filament count across replicates.

- id: sample_count
  name: sample or snapshot count
  dimension: dimensionless
  description: Number of raw rows, droplets, faces, or trajectory snapshots in a Source Data table.

- id: replicate_count
  name: replicate count
  dimension: dimensionless
  description: Number of independent experimental or simulation replicates.

- id: icosphere_subdivision
  name: icosphere subdivision level
  dimension: dimensionless
  description: Recursive subdivision depth n = 0..5 of an icosahedron approximating a spherical droplet surface.

- id: triangle_edge_length
  name: area-equivalent equilateral triangle side length
  dimension: "[length]"
  description: Side length s = sqrt(4 A_face / sqrt(3)) of equilateral triangles with area matching projected icosphere faces (FigureS2B).

- id: surface_area_fraction
  name: actin-covered droplet surface area fraction
  dimension: dimensionless
  description: Fraction of subdivided icosphere faces (5120 faces at n = 4) occupied by peripheral actin monomers.

- id: surface_area_fraction_sd
  name: actin-covered surface area fraction standard deviation
  dimension: dimensionless
  description: Standard deviation of actin-covered surface area fraction across replicates/snapshots.

- id: vasp_frac_0fil
  name: fraction of unbound VASP tetramers (0 filaments)
  dimension: dimensionless
  description: Fraction of VASP tetramers bound to 0 actin filaments (Figure3D, FigureS10D).

- id: vasp_frac_1fil
  name: fraction of VASP tetramers bound to 1 filament
  dimension: dimensionless
  description: Fraction of VASP tetramers bound to 1 actin filament (Figure3D, FigureS10D).

- id: vasp_frac_2fil
  name: fraction of VASP tetramers bound to 2 filaments
  dimension: dimensionless
  description: Fraction of VASP tetramers bound to 2 actin filaments (Figure3D, FigureS10D).

- id: vasp_frac_3fil
  name: fraction of VASP tetramers bound to 3 filaments
  dimension: dimensionless
  description: Fraction of VASP tetramers bound to 3 actin filaments (Figure3D, FigureS10D).

- id: vasp_frac_4fil
  name: fraction of VASP tetramers bound to 4 filaments
  dimension: dimensionless
  description: Fraction of VASP tetramers bound to 4 actin filaments (Figure3D, FigureS10D).

- id: vasp_frac_sd
  name: VASP bound-filament fraction standard deviation
  dimension: dimensionless
  description: Standard deviation of a VASP valency fraction across raw snapshots.

- id: pairwise_end_distance
  name: pairwise distance between filament ends
  dimension: "[length]"
  description: 3D Euclidean distance between pairs of actin filament ends inside a spherical droplet (Figure4B).

- id: distance_probability_density
  name: pairwise filament-end distance probability density
  dimension: "1 / [length]"
  description: Probability density function (per um) of pairwise filament-end distances (Figure4B).

- id: cumulative_distribution_function
  name: filament length cumulative density function
  dimension: dimensionless
  description: Cumulative distribution function (0 to 1) of actin filament contour lengths (FigureS10C).

- id: radial_distance
  name: spherical subvolume shell radius
  dimension: "[length]"
  description: Radial distance r from the droplet center for concentric shell density profiles (FigureS10F).

- id: normalized_radial_density
  name: normalized radial actin density ratio
  dimension: dimensionless
  description: Ratio of actin density in concentric shell (r, dr) to bulk droplet density (FigureS10F).

- id: lj_length
  name: reduced Lennard-Jones radial distance
  dimension: dimensionless
  description: Radial distance in LAMMPS Lennard-Jones sigma units (FigureS1B).

- id: lj_density
  name: reduced Lennard-Jones number density
  dimension: dimensionless
  description: Radial number density in 1/sigma^3 of VASP droplet or crowder beads (FigureS1B).

- id: asphericity_index
  name: LAMMPS droplet asphericity index
  dimension: dimensionless
  description: Final droplet asphericity index (c^2 / (a b))^(1/3) in LAMMPS MD simulations (FigureS1EF).

- id: aspect_ratio
  name: droplet aspect ratio
  dimension: dimensionless
  description: Major-to-minor droplet aspect ratio (a/b in CytoSim/continuum Figs. 7B, 7F, S14C; c/a in LAMMPS Fig. S1EF).

- id: aspect_ratio_sd
  name: droplet aspect ratio standard deviation
  dimension: dimensionless
  description: Standard deviation of maximum droplet aspect ratio across simulation replicates (Figure7B).

- id: droplet_bending_energy
  name: 2D droplet actin-bending energy
  dimension: "[energy]"
  description: Continuum 2D actin-bending energy (pN*nm) vs aspect ratio (Figure7F).

- id: droplet_surface_energy
  name: 2D droplet surface energy
  dimension: "[energy]"
  description: Continuum 2D droplet interfacial surface energy (pN*nm) vs aspect ratio (Figure7F).

- id: ring_abundance
  name: actin ring percentage abundance
  dimension: dimensionless
  description: Percentage or fraction of simulated trajectories or experimental droplets exhibiting an actin ring.

- id: shell_abundance
  name: actin shell percentage abundance
  dimension: dimensionless
  description: Percentage or fraction of simulated trajectories or experimental droplets exhibiting an actin shell.

- id: shell_sb_abundance
  name: shell with strong bundling percentage abundance
  dimension: dimensionless
  description: Percentage or fraction of simulated trajectories classified as 'Shell with strong bundling' (or 'ring-like').

- id: shell_wb_abundance
  name: shell with weak bundling percentage abundance
  dimension: dimensionless
  description: Percentage or fraction of simulated trajectories classified as 'Shell with weak bundling'.

- id: disk_abundance
  name: deformed disk droplet percentage abundance
  dimension: dimensionless
  description: Percentage of experimental droplets deformed into planar actin-containing disks (Figure6D).

- id: abundance_sd
  name: morphology abundance standard deviation
  dimension: dimensionless
  description: Standard deviation of percentage morphology abundance across experimental replicates (Figure6D).

- id: abundance_sem
  name: morphology abundance standard error of the mean
  dimension: dimensionless
  description: Standard error of the mean of percentage morphology abundance across experimental replicates (Figure6D).

- id: ring_shell_sb_probability
  name: ring-shell with strong bundling probability
  dimension: dimensionless
  description: Cluster 0 probability in high-actin simulations (FigureS11 / FigureS11C).

- id: ring_multiring_probability
  name: ring or multi-ring probability
  dimension: dimensionless
  description: Cluster 1 probability in high-actin simulations (FigureS11 / FigureS11C).

- id: locally_bundled_probability
  name: locally-bundled network probability
  dimension: dimensionless
  description: Cluster 2 probability in high-actin simulations (FigureS11 / FigureS11C).

- id: percentage_abundance
  name: percentage variance explained or abundance
  dimension: dimensionless
  description: Cumulative PCA variance explained expressed as a percentage (0-100%), matching chandrasekaran2024 PCA caption datums.

- id: pca_component_index
  name: principal component index
  dimension: dimensionless
  description: Ordinal index k = 1..5 of principal components in PCA variance plots.

- id: cumulative_explained_variance
  name: cumulative PCA explained variance ratio
  dimension: dimensionless
  description: Cumulative fraction (0 to 1) of total variance explained by the first k principal components.

- id: varimax_loading
  name: PCA Varimax loading or mean squared communality
  dimension: dimensionless
  description: Individual Varimax factor loading or unweighted mean squared loading across the 5 order parameters.

- id: cluster_count
  name: k-means cluster count
  dimension: dimensionless
  description: Number of clusters k = 2..10 in k-means silhouette analysis.

- id: silhouette_coefficient
  name: k-means silhouette coefficient
  dimension: dimensionless
  description: Mean k-means silhouette score as a function of cluster count k.

- id: cluster_category_index
  name: cluster category index
  dimension: dimensionless
  description: Ordinal index identifying k-means morphology cluster categories along boxplot x-axes (Supp. Figs. 5 and 10).

- id: ellipsoid_span_a
  name: gyration ellipsoid major span a
  dimension: "[length]"
  description: Largest principal span a (a >= b >= c, stored under header 'spanc' in FigureS5 and FigureS9).

- id: ellipsoid_span_b
  name: gyration ellipsoid intermediate span b
  dimension: "[length]"
  description: Intermediate principal span b (a >= b >= c, stored under header 'spanb' in FigureS5 and FigureS9).

- id: ellipsoid_span_c
  name: gyration ellipsoid minor span c
  dimension: "[length]"
  description: Smallest principal span c (a >= b >= c, stored under header 'spana' in FigureS5 and FigureS9).

- id: max_abs_difference
  name: maximum absolute numerical discrepancy
  dimension: dimensionless
  description: Maximum absolute residual between raw rows and stored summary cells or duplicated sheets.
