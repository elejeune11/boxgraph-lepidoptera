- id: val_fig6d_gabmut_shell_1_7p5_text
  model: fig6d_gabmut_experiment_reader
  inputs: {vasp_to_actin_ratio: q_ratio_7p5}
  settings: {}
  output: shell_mean
  against: "chandrasekaran2024/exp_gabmut_shell_pct_1_7p5"
  purpose: validation
  quantities: {"chandrasekaran2024/shell_abundance": shell_abundance}
  conditions_ok: >
    fig6d_gabmut_experiment_reader reads exclusively the N = 3 experimental VASP-GABmut cohort
    (MOESM9 sheet 'Figure6D', rows 20-43; WT rows 1-19 blank) and is evaluated at input
    vasp_to_actin_ratio = q_ratio_7p5 (7.5, i.e., Actin:VASP = 1:7.5, n = [91, 102, 47] = 240
    droplets), matching chandrasekaran2024/exp_gabmut_shell_pct_1_7p5 conditions
    {vasp_variant: 'GABmut', vasp_to_actin_ratio: '7.5'}.
  basis: >
    Chandrasekaran et al. (2024, Results p. 7) state 'more than a third of droplets composed of
    VASP-GABmut contained actin shells, even at an actin to VASP ratio of 1:7.5 (37 ± 4% mean ±
    SEM)'. Recomputing directly from the raw 3-replicate droplet counts in MOESM9 sheet 'Figure6D'
    (rows 25, 34, 43) verifies this main-text origin: measured scalar live against the released
    Source Data (completing Section 5's two printed main-text stats alongside the Fig. 6D bar
    sweeps).
  note: >
    Computes 37.3926% (sample SD 6.8681%, true SEM = SD/sqrt(3) = 3.9653% -> rounds to 4%,
    whereas workbook cell L38 erroneously stores SD/3 = 2.2894%) vs printed '37 ± 4%'
    (+0.3926 pp): reproduced.

