    vasp_to_actin_ratio = q_ratio_7p5 (7.5, i.e., Actin:VASP = 1:7.5, n = [91, 102, 47] = 240
    droplets), matching chandrasekaran2024/exp_gabmut_ring_pct_1_7p5 conditions
    {vasp_variant: 'GABmut', vasp_to_actin_ratio: '7.5'}.
  basis: >
    Chandrasekaran et al. (2024, Results p. 7) state 'with the majority consisting of spherical
    droplets that contained actin rings (53 ± 6% mean ± SEM) (Fig. 6D)'. Recomputing directly
    from the raw 3-replicate droplet counts in MOESM9 sheet 'Figure6D' (rows 25, 34, 43) verifies
    this main-text origin: measured scalar live against the released Source Data (completing
    Section 5's two printed main-text stats alongside the Fig. 6D bar sweeps).
  note: >
    Computes 52.7138% (sample SD 9.6272%, true SEM = SD/sqrt(3) = 5.5583% -> rounds to 6%,
