  mapping:
    aspect_ratio: "AR"
  output_map:
    surface_energy: E_surf
  regime:
    R: [1.0, 1.0]
    AR: [1.0, 10.0]
    gamma_I: [1.0, 1.0]
  tolerance: 0.02
  provenance: proposed
  reason: >
    41467_2024_46726_MOESM9_ESM.xlsx sheet 'Figure7F' Column C tabulates live
    VASPDroplet_simulate.ipynb::getsurfaceF() (graham_code/notebook_surface_energy, 7-term
    Gauss-Kummer series with c_6 = 441/1048576) at the consistent Fig. 5c / Fig. 7F normalization
    R = 1 nm, gamma_I = 1 pN with 0.00e+00 (19/19 bit-for-bit IEEE-754 float64) discrepancy at all
    19 stored nodes (AR = 1..9 step 1.0, 9.1..10.0 step 0.1). Between nodes,
    fig7f_continuum_energy_reader performs piecewise-linear interpolation, approximating continuous
    notebook_surface_energy across AR in [1.0, 10.0] within 1.44% (max relative error 1.43e-2
    sampled across 40 log-uniform points, peaking at AR = 1.391 between integer nodes 1 and 2,
    dropping below 9.34e-4 on [2, 9] and 3.04e-6 on [9, 10]).
