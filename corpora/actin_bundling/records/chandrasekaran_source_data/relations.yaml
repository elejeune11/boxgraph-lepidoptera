# No ModelAtlas symbolic equation relations between chandrasekaran_source_data and either
# chandrasekaran2024 or chandrasekaran_cytosim:
# All 20 models in chandrasekaran_source_data are `role: processing`, `software: true` workbook
# reader/summary adapters that load fixed raw tables from 41467_2024_46726_MOESM9_ESM.xlsx under
# $BOXGRAPH_SOURCE (discrete row lookups and piecewise-linear interpolations) rather than defining
# continuous mathematical laws over free inputs. Cross-record quantitative checks against
# chandrasekaran2024 live in data.yaml (`from_source: chandrasekaran2024`, `from_datum: <id>`),
# cited.yaml (both records), comparisons.yaml, and validations.yaml (101 live validations).
# Testing chandrasekaran_cytosim's 10 ported C++ physics models against raw Source Data sheets
# (e.g., FigureS10B/C, FigureS2B, Figure7B) is an empirical validation task rather than a ModelAtlas
# equation equivalence; cross-attachment findings are documented in questions.yaml.
#
# Audit against graham_source_data (all 20 x 11 = 220 model pairs): 0 ModelAtlas equation relations.
# All 11 models in graham_source_data are likewise `role: processing`, `software: true` spreadsheet
# readers over fixed experimental tables (MOESM12-22) rather than analytical equations over free
# physical inputs, and the two archives have strictly complementary coverage on their crossover panels
# (MOESM9 Figure6D omits WT rows 1-19 supplied by MOESM14 Fig 3d / MOESM20 Fig S4c; MOESM12-22 omits
# Fig. 5c supplied by MOESM9 Figure7F). Full cross-workbook comparisons are documented in questions.yaml.
#
# Audit against graham_code (all 20 x 8 = 160 model pairs): 2 verified `approximated_by` relations
# on the single shared deterministic function (`graham_code/notebook_surface_energy` <->
# `chandrasekaran_source_data/fig7f_continuum_energy_reader`); 0 relations on the other 159 pairs.
# Unlike the other 19 Excel readers (experimental/CytoSim/LAMMPS/PCA tables), sheet 'Figure7F'
# Column C is literally a 19-row tabulated evaluation of `VASPDroplet_simulate.ipynb::getsurfaceF()`
# (7-term Gauss-Kummer perimeter series, c_6 = 441/1048576) at R = 1 nm, gamma_I = 1 pN — matching
# bit-for-bit (`0.00e+00`, 0 ULPs across all 19 rows; `<= 3.55e-15` under generic summation order).
# Because `fig7f_continuum_energy_reader` fixes R = 1 nm, gamma_I = 1 pN and linearly interpolates
# between the 19 discrete nodes (coarse integer grid AR = 1..9, fine dAR = 0.1 grid AR = 9.0..10.0),
# `same_as` is refuted across continuous AR (median diff 5.49e-4, peak 1.44% at AR = 1.391), whereas
# `approximated_by` cleanly measures the exact piecewise-linear table error on [1, 10] (`1.43e-2`
# <= 0.02) and on the refined [9, 10] cliff window (`2.80e-6` <= 1e-5, nearly 10x tighter than the
# `2.68e-5` error against exact complete elliptic integral `graham2023/ring_rod_transition_energy`).

- id: rel_notebook_surface_approx_fig7f_table
