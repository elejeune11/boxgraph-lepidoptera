id: silhouette_cluster_reader
name: K-means silhouette coefficient curve reader (FigureS4C, FigureS8C, FigureS11Biii, FigureS12C)
role: processing
software: true
stated:
  none: "binary xlsx workbook in Source Data archive"
  where: "41467_2024_46726_MOESM9_ESM.xlsx, sheets 'FigureS4C', 'FigureS8C' (=Supp. Fig. 9C), 'FigureS11Biii', and 'FigureS12C' (cells A1:B10)"
inputs:
  k: {quantity: cluster_count, unit: dimensionless}
outputs:
  silhouette: {quantity: silhouette_coefficient, unit: dimensionless}
  optimal_k: {quantity: cluster_count, unit: dimensionless}
  optimal_silhouette: {quantity: silhouette_coefficient, unit: dimensionless}
settings:
  study: "s4"
stochastic: false
