id: figs1ef_lammps_shape_reader
name: LAMMPS final droplet asphericity, aspect ratio, and implied triaxiality reader (FigureS1EF)
role: processing
software: true
stated:
  none: "binary xlsx workbook in Source Data archive"
  where: "41467_2024_46726_MOESM9_ESM.xlsx, sheet 'FigureS1EF', cells A1:C3 ('Number of Filaments, Asphericity, Aspect Ratio')"
inputs:
  n_fil: {quantity: filament_count, unit: dimensionless}
outputs:
  asphericity: {quantity: asphericity_index, unit: dimensionless}
  aspect_ratio: {quantity: aspect_ratio, unit: dimensionless}
  implied_b_over_a: {quantity: aspect_ratio, unit: dimensionless}
settings: {}
stochastic: false
