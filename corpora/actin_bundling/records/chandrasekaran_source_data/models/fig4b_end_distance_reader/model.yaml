id: fig4b_end_distance_reader
name: Pairwise filament-end distance probability density reader (Figure4B)
role: processing
software: true
stated:
  none: "binary xlsx workbook in Source Data archive"
  where: "41467_2024_46726_MOESM9_ESM.xlsx, sheet 'Figure4B', cells A1:B708 ('Lfilmax=... Distance, Prob. density')"
inputs:
  distance: {quantity: pairwise_end_distance, unit: um}
outputs:
  prob_density: {quantity: distance_probability_density, unit: 1/um}
  peak_density: {quantity: distance_probability_density, unit: 1/um}
  pdf_integral: {quantity: sample_count, unit: dimensionless}
  n_blocks_present: {quantity: sample_count, unit: dimensionless}
settings:
  block_header_pi_mult: 0.25
stochastic: false
