id: ellipsoid_spans_reader
name: Actin network gyration ellipsoid span boxplot median reader (FigureS5, FigureS9)
role: processing
software: true
stated:
  none: "binary xlsx workbook in Source Data archive"
  where: "41467_2024_46726_MOESM9_ESM.xlsx, sheets 'FigureS5' (A1:D544) and 'FigureS9' (=Supp. Fig. 10, A1:D1038; headers spanc/spanb/spana = plotted a>=b>=c)"
inputs:
  category: {quantity: cluster_category_index, unit: dimensionless}
outputs:
  span_a_median: {quantity: ellipsoid_span_a, unit: um}
  span_b_median: {quantity: ellipsoid_span_b, unit: um}
  span_c_median: {quantity: ellipsoid_span_c, unit: um}
  n_snapshots: {quantity: sample_count, unit: dimensionless}
settings:
  study: "s5"
stochastic: false
