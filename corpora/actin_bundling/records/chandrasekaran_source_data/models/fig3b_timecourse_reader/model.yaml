id: fig3b_timecourse_reader
name: Actin-covered surface area fraction time-course reader (Figure3B)
role: processing
software: true
stated:
  none: "binary xlsx workbook in Source Data archive"
  where: "41467_2024_46726_MOESM9_ESM.xlsx, sheet 'Figure3B', cells A1:F21709 ('Time, Replicate1..3, Mean, Std')"
inputs:
  t: {quantity: time, unit: s}
outputs:
  surface_area_mean: {quantity: surface_area_fraction, unit: dimensionless}
  surface_area_sd_pop: {quantity: surface_area_fraction_sd, unit: dimensionless}
  surface_area_mean_stored: {quantity: surface_area_fraction, unit: dimensionless}
  n_replicates: {quantity: replicate_count, unit: dimensionless}
  internal_mean_max_diff: {quantity: max_abs_difference, unit: dimensionless}
  internal_sd_pop_max_diff: {quantity: max_abs_difference, unit: dimensionless}
settings:
  k_bind: 10.0
  k_unbind: 1.0
stochastic: false
