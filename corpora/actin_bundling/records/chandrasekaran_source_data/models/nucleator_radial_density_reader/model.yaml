id: nucleator_radial_density_reader
name: Linear nucleator normalized radial actin density profile reader (FigureS10F)
role: processing
software: true
stated:
  none: "binary xlsx workbook in Source Data archive"
  where: "41467_2024_46726_MOESM9_ESM.xlsx, sheet 'FigureS10F', cells A1:AP17 ('Radius um, Shell density/Bulk density'; =published Supp. Fig. 6F)"
inputs:
  r: {quantity: radial_distance, unit: um}
outputs:
  normalized_density: {quantity: normalized_radial_density, unit: dimensionless}
  peak_density: {quantity: normalized_radial_density, unit: dimensionless}
  peak_radius: {quantity: radial_distance, unit: um}
settings:
  nuc_conc_nM: 0
stochastic: false
