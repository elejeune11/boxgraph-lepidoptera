id: figs11_actin_vasp_reader
name: High-actin N_fil x [VASP-tet] cluster probability recomputation reader (FigureS11C, FigureS11)
role: processing
software: true
stated:
  none: "binary xlsx workbook in Source Data archive"
  where: "41467_2024_46726_MOESM9_ESM.xlsx, sheets 'FigureS11C' (A1:D496) and 'FigureS11' (=Supp. Fig. 11D, A1:E19)"
inputs:
  n_fil: {quantity: filament_count, unit: dimensionless}
outputs:
  ring_shell_sb_prob: {quantity: ring_shell_sb_probability, unit: dimensionless}
  ring_multiring_prob: {quantity: ring_multiring_probability, unit: dimensionless}
  locally_bundled_prob: {quantity: locally_bundled_probability, unit: dimensionless}
  n_snapshots: {quantity: sample_count, unit: dimensionless}
  n_replicates: {quantity: replicate_count, unit: dimensionless}
  s11c_vs_s11_max_diff: {quantity: max_abs_difference, unit: dimensionless}
settings:
  vasp_uM: 2.0
stochastic: false
