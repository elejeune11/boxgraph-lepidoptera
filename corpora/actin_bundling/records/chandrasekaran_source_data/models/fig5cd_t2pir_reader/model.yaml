id: fig5cd_t2pir_reader
name: T_2piR and [VASP-tet] ring probability recomputation and FigureS6 audit (Figure5C, Figure5D, FigureS6)
role: processing
software: true
stated:
  none: "binary xlsx workbook in Source Data archive"
  where: "41467_2024_46726_MOESM9_ESM.xlsx, sheets 'Figure5C' (A1:F1036), 'Figure5D' (A1:G7), and 'FigureS6' (A1:F901)"
inputs:
  t_2pir: {quantity: time, unit: s}
outputs:
  ring_prob_from_5c: {quantity: ring_abundance, unit: percent}
  ring_prob_stored_5d: {quantity: ring_abundance, unit: percent}
  n_snapshots_per_cell: {quantity: sample_count, unit: dimensionless}
  n_replicates: {quantity: replicate_count, unit: dimensionless}
  max_5c_vs_5d_diff: {quantity: max_abs_difference, unit: dimensionless}
  figs6_nonzero_cluster_count: {quantity: sample_count, unit: dimensionless}
settings:
  vasp_uM: 0.8
stochastic: false
