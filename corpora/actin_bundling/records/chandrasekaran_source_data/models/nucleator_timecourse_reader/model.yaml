id: nucleator_timecourse_reader
name: Linear nucleator filament-count time-course reader (FigureS10B)
role: processing
software: true
stated:
  none: "binary xlsx workbook in Source Data archive"
  where: "41467_2024_46726_MOESM9_ESM.xlsx, sheet 'FigureS10B', cells A1:C4817 ('Time, Number of filaments Mean, Std'; =published Supp. Fig. 6B)"
inputs:
  t: {quantity: time, unit: s}
outputs:
  filament_count_mean: {quantity: filament_count, unit: dimensionless}
  filament_count_sd: {quantity: filament_count_sd, unit: dimensionless}
settings:
  nuc_conc_nM: 0
stochastic: false
