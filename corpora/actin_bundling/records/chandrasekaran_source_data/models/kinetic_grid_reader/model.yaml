id: kinetic_grid_reader
name: 6x6 (k_bind, k_unbind) surface area, VASP valency, and cluster classification reader (FigureS2C, Figure3D, Figure3E, Figure3B)
role: processing
software: true
stated:
  none: "binary xlsx workbook in Source Data archive"
  where: "41467_2024_46726_MOESM9_ESM.xlsx, sheets 'FigureS2C' (A1:CS37), 'Figure3D' (A1:CR252), 'Figure3E' (A1:E545), and 'Figure3B' (A1:F21709)"
inputs:
  k_unbind: {quantity: unbinding_rate, unit: 1/s}
outputs:
  surface_area_mean: {quantity: surface_area_fraction, unit: dimensionless}
  surface_area_sd_pop: {quantity: surface_area_fraction_sd, unit: dimensionless}
  frac_0: {quantity: vasp_frac_0fil, unit: dimensionless}
  frac_1: {quantity: vasp_frac_1fil, unit: dimensionless}
  frac_2: {quantity: vasp_frac_2fil, unit: dimensionless}
  frac_3: {quantity: vasp_frac_3fil, unit: dimensionless}
  frac_4: {quantity: vasp_frac_4fil, unit: dimensionless}
  valency_sd_0: {quantity: vasp_frac_sd, unit: dimensionless}
  valency_sd_4: {quantity: vasp_frac_sd, unit: dimensionless}
  shell_pct: {quantity: shell_abundance, unit: percent}
  shell_wb_pct: {quantity: shell_wb_abundance, unit: percent}
  shell_sb_pct: {quantity: shell_sb_abundance, unit: percent}
  ring_pct: {quantity: ring_abundance, unit: percent}
  n_raw_snapshots: {quantity: sample_count, unit: dimensionless}
  n_cluster_snapshots: {quantity: sample_count, unit: dimensionless}
  s2c_vs_fig3b_last31_max_diff: {quantity: max_abs_difference, unit: dimensionless}
  internal_raw_vs_stored_max_diff: {quantity: max_abs_difference, unit: dimensionless}
settings:
  k_bind: 1.0
stochastic: false
