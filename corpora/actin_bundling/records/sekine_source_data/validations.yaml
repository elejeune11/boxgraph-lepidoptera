# Cross-record validations directly comparing software: true Source Data reader models
# against the printed values recorded in sekine2024/data.yaml.

# --- Supplementary Table 1 (Stage 15 & Stage 16 cluster morphometry from Fig. 1e-f) ---
- id: val_st15_n_clusters
  model: cluster_morphometry_reader
  settings: {stage: 15}
  output: n_clusters
  against: sekine2024/st15_cluster_count
  quantities: {"sekine2024/cluster_count": cluster_count}
  basis: "Source-data_Fig1ef.xlsx provides all individual Stage 15 cluster rows summarized in Supplementary Table 1."

- id: val_st15_area_mean
  model: cluster_morphometry_reader
  settings: {stage: 15}
  output: area_mean
  against: sekine2024/st15_area_mean
  quantities: {"sekine2024/cluster_area": cluster_area}
  basis: "Stage 15 mean cluster area recomputed from Source-data_Fig1ef.xlsx vs Supplementary Table 1."

- id: val_st15_area_sd
  model: cluster_morphometry_reader
  settings: {stage: 15}
  output: area_sd
  against: sekine2024/st15_area_sd
  quantities: {"sekine2024/cluster_area_sd": cluster_area_sd}
  basis: "Stage 15 cluster area sample SD (N-1) recomputed from Source-data_Fig1ef.xlsx vs Supplementary Table 1."

- id: val_st15_major_mean
  model: cluster_morphometry_reader
  settings: {stage: 15}
  output: major_mean
  against: sekine2024/st15_major_mean
  quantities: {"sekine2024/cluster_major_length": cluster_major_length}
  basis: "Stage 15 mean major axis length recomputed from Source-data_Fig1ef.xlsx vs Supplementary Table 1."

- id: val_st15_major_sd
  model: cluster_morphometry_reader
  settings: {stage: 15}
  output: major_sd
  against: sekine2024/st15_major_sd
  quantities: {"sekine2024/cluster_major_length_sd": cluster_major_length_sd}
  basis: "Stage 15 major axis sample SD recomputed from Source-data_Fig1ef.xlsx vs Supplementary Table 1."

- id: val_st15_minor_mean
  model: cluster_morphometry_reader
  settings: {stage: 15}
  output: minor_mean
  against: sekine2024/st15_minor_mean
  quantities: {"sekine2024/cluster_minor_length": cluster_minor_length}
  basis: "Stage 15 mean minor axis length recomputed from Source-data_Fig1ef.xlsx vs Supplementary Table 1."

- id: val_st15_minor_sd
  model: cluster_morphometry_reader
  settings: {stage: 15}
  output: minor_sd
  against: sekine2024/st15_minor_sd
  quantities: {"sekine2024/cluster_minor_length_sd": cluster_minor_length_sd}
  basis: "Stage 15 minor axis sample SD recomputed from Source-data_Fig1ef.xlsx vs Supplementary Table 1."

- id: val_st15_ar_mean
  model: cluster_morphometry_reader
  settings: {stage: 15}
  output: ar_mean
  against: sekine2024/st15_aspect_ratio_mean
  quantities: {"sekine2024/cluster_aspect_ratio": cluster_aspect_ratio}
  basis: "Stage 15 mean aspect ratio recomputed from Source-data_Fig1ef.xlsx vs Supplementary Table 1."

- id: val_st15_ar_sd
  model: cluster_morphometry_reader
  settings: {stage: 15}
  output: ar_sd
  against: sekine2024/st15_aspect_ratio_sd
  quantities: {"sekine2024/cluster_aspect_ratio_sd": cluster_aspect_ratio_sd}
  basis: "Stage 15 aspect ratio sample SD recomputed from Source-data_Fig1ef.xlsx vs Supplementary Table 1."

- id: val_st16_n_clusters
  model: cluster_morphometry_reader
  settings: {stage: 16}
  output: n_clusters
  against: sekine2024/st16_cluster_count
  quantities: {"sekine2024/cluster_count": cluster_count}
  basis: "Stage 16 cluster count in Source-data_Fig1ef.xlsx vs Supplementary Table 1."

- id: val_st16_major_mean
  model: cluster_morphometry_reader
  settings: {stage: 16}
  output: major_mean
  against: sekine2024/st16_major_mean
  quantities: {"sekine2024/cluster_major_length": cluster_major_length}
  basis: "Stage 16 mean major axis length recomputed from Source-data_Fig1ef.xlsx vs Supplementary Table 1."

- id: val_st16_minor_mean
  model: cluster_morphometry_reader
  settings: {stage: 16}
  output: minor_mean
  against: sekine2024/st16_minor_mean
  quantities: {"sekine2024/cluster_minor_length": cluster_minor_length}
  basis: "Stage 16 mean minor axis length recomputed from Source-data_Fig1ef.xlsx vs Supplementary Table 1."

- id: val_st16_ar_mean
  model: cluster_morphometry_reader
  settings: {stage: 16}
  output: ar_mean
  against: sekine2024/st16_aspect_ratio_mean
  quantities: {"sekine2024/cluster_aspect_ratio": cluster_aspect_ratio}
  basis: "Stage 16 mean aspect ratio recomputed from Source-data_Fig1ef.xlsx vs Supplementary Table 1."

- id: val_fig1f_ar_ks_pval
  model: cluster_morphometry_reader
  settings: {stage: 15}
  output: ks_p_ar
  against: sekine2024/pval_fig1f_ar_ks
  quantities: {"sekine2024/p_value": p_value}
  basis: "R-asymptotic two-sample KS P-value comparing Stage 15 vs Stage 16 aspect ratios in Source-data_Fig1ef.xlsx vs Fig. 1f caption."

# --- Cable interval (Supp. Fig. 1d vs main text p. 3) ---
- id: val_cable_interval_in_vivo
  model: cable_interval_reader
  settings: {}
  output: interval_mean
  against: sekine2024/cable_interval_in_vivo
  quantities: {"sekine2024/pattern_interval": pattern_interval}
  basis: "Unweighted mean of N = 8 embryo cable intervals in Source-data_SupplementaryFig1d.xlsx vs printed 450 ± 13.2 nm."

# --- Fig. 2b Kruskal-Wallis & pairwise Wilcoxon P-values ---
- id: val_fig2b_0min_kw_pval
  model: fusion_stability_reader
  settings: {time_min: 0}
  output: kw_p
  against: sekine2024/pval_fig2b_0min_kw
  quantities: {"sekine2024/p_value": p_value}
  basis: "Two-sided Kruskal-Wallis P-value across angle bins at 0* min from raw events in Source-data_Fig2b.xlsx vs Fig. 2b caption."

- id: val_fig2b_0min_pair_bonf_pval
  model: fusion_stability_reader
  settings: {time_min: 0}
  output: wilcox_circum_vs_diag_bonf_p
  against: sekine2024/pval_fig2b_0min_pair
  quantities: {"sekine2024/p_value": p_value}
  basis: "Bonferroni-adjusted (x3) pairwise Wilcoxon rank-sum P-value at 0* min (as stated in Fig. 2b caption) vs printed p = 0.0151 (which is actually the unadjusted P = 0.01508)."

- id: val_fig2b_0min_pair_unadj_pval
  model: fusion_stability_reader
  settings: {time_min: 0}
  output: wilcox_circum_vs_diag_unadj_p
  against: sekine2024/pval_fig2b_0min_pair
  quantities: {"sekine2024/p_value": p_value}
  basis: "Unadjusted two-sided Wilcoxon rank-sum P-value (60-90 deg vs 30-60 deg at 0* min) from Source-data_Fig2b.xlsx reproducing Fig. 2b's printed p = 0.0151."

# --- Fig. 4e Welch P-values (from raw Source-data_Fig4d.xlsx) ---
- id: val_fig4e_1m_pval
  model: motion_anisotropy_reader
  settings: {dataset: "fig4d", condition: "1-M", override_um_per_px: 0.0}
  output: welch_p
  against: sekine2024/pval_fig4e_1m
  quantities: {"sekine2024/p_value": p_value}
  basis: "Two-sided Welch t-test between |dx| and |dy| in Source-data_Fig4d.xlsx (1-M) vs Fig. 4e caption."

- id: val_fig4e_2m_pval
  model: motion_anisotropy_reader
  settings: {dataset: "fig4d", condition: "2-M", override_um_per_px: 0.0}
  output: welch_p
  against: sekine2024/pval_fig4e_2m
  quantities: {"sekine2024/p_value": p_value}
  basis: "Two-sided Welch t-test between |dx| and |dy| in Source-data_Fig4d.xlsx (2-M) vs Fig. 4e caption."

- id: val_fig4e_4m_pval
  model: motion_anisotropy_reader
  settings: {dataset: "fig4d", condition: "4-M", override_um_per_px: 0.0}
  output: welch_p
  against: sekine2024/pval_fig4e_4m
  quantities: {"sekine2024/p_value": p_value}
  basis: "Two-sided Welch t-test between |dx| and |dy| in Source-data_Fig4d.xlsx (4-M) vs Fig. 4e caption."

# --- Fig. 4f coherency vs sekine2024 Supplementary Table 3 (sim_4m_coherency) ---
- id: val_fig4f_max_vs_sim_4m_coherency
  model: sim_4m_timecourse_reader
  settings: {}
  output: coherency_max
  against: sekine2024/sim_4m_coherency
  quantities: {"sekine2024/orientation_coherency": orientation_coherency}
  basis: "Maximum 4-M coherency across frames 1-41 in Source-data_Fig4f.xlsx (0.223) vs Supplementary Table 3 (0.30)."

# --- Fig. 5d anisotropy ratio vs sekine2024 Fig. 5d printed label (1.60) ---
- id: val_fig5d_ctrl_ratio_vs_paper
  model: motion_anisotropy_reader
  settings: {dataset: "fig5d", condition: "Control", override_um_per_px: 0.0}
  output: aniso_ratio
  against: sekine2024/aniso_ratio_st16_ctrl_fig5d
  quantities: {"sekine2024/motion_anisotropy_ratio": motion_anisotropy_ratio}
  basis: "Anisotropy ratio |dy|/|dx| computed from all n = 497 Control events in Source-data_Fig5d.xlsx (1.735) vs Fig. 5d printed 1.60 (n = 352 in Table 5)."

- id: val_fig5d_myosin_ratio_vs_paper
  model: motion_anisotropy_reader
  settings: {dataset: "fig5d", condition: "Myosin II[DN]", override_um_per_px: 0.0}
  output: aniso_ratio
  against: sekine2024/aniso_ratio_st16_myosin_dn_fig5d
  quantities: {"sekine2024/motion_anisotropy_ratio": motion_anisotropy_ratio}
  basis: "Anisotropy ratio |dy|/|dx| computed from all n = 955 Myosin II[DN] events in Source-data_Fig5d.xlsx (1.197) vs Fig. 5d printed 1.20."

