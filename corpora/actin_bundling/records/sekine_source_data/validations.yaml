# --- Supp. Fig. 5d RhoGEF2 colocalization P-value (true Stage 16 vs cross-stage diagnostic!) ---
- id: val_figs5d_rhogef2_true_st16_pval
  model: colocalization_reader
  settings: {stage: 16, protein: "RhoGEF2::mCherry", control_stage: 16}
  output: welch_p_vs_gfp
  against: sekine2024/pval_figs5d_rhogef2
  quantities: {"sekine2024/p_value": p_value}
  basis: "True Stage 16 RhoGEF2 vs Stage 16 GFP Welch P-value (0.0160, explaining the '*' on the plot) vs Supp. Fig. 5d caption's printed p = 0.0641."

- id: val_figs5d_rhogef2_cross_stage_pval
  model: colocalization_reader
  settings: {stage: 15, protein: "RhoGEF2::mCherry", control_stage: 16}
  output: welch_p_vs_gfp
  against: sekine2024/pval_figs5d_rhogef2
  quantities: {"sekine2024/p_value": p_value}
  basis: "Cross-stage diagnostic testing Stage 15 RhoGEF2 (Fig. 3d) against Stage 16 GFP (Supp. Fig. 5d): yields Welch P = 0.06411, reproducing the Supp. Fig. 5d caption's p = 0.0641."
