# Physical quantities declared for sekine_source_data (aligned with sekine2024).

# --- Cluster morphometry & orientation ---
- {id: cluster_count, name: number of analyzed clusters, dimension: "dimensionless", description: "Count of segmented actin clusters in ellipse-fitting statistics."}
- {id: roi_count, name: number of analyzed ROIs, dimension: "dimensionless", description: "Number of regions of interest analyzed per condition."}
- {id: sample_count, name: number of biological or statistical samples, dimension: "dimensionless", description: "Number of tracheal tubes, embryos, cables, conditions, or tracked motion/fusion events."}
- {id: cluster_area, name: actin cluster projected area, dimension: "[area]", description: "Mean projected area of ellipse-fitted segmented actin clusters."}
- {id: cluster_area_sd, name: actin cluster projected area SD, dimension: "[area]", description: "Standard deviation of segmented actin cluster areas."}
- {id: cluster_major_length, name: actin cluster major axis length, dimension: "[length]", description: "Mean major axis length of ellipse-fitted actin clusters."}
- {id: cluster_major_length_sd, name: actin cluster major axis length SD, dimension: "[length]", description: "Standard deviation of fitted cluster major axis lengths."}
- {id: cluster_minor_length, name: actin cluster minor axis length, dimension: "[length]", description: "Mean minor axis length of ellipse-fitted actin clusters."}
- {id: cluster_minor_length_sd, name: actin cluster minor axis length SD, dimension: "[length]", description: "Standard deviation of fitted cluster minor axis lengths."}
- {id: cluster_aspect_ratio, name: actin cluster aspect ratio, dimension: "dimensionless", description: "Mean aspect ratio (Major/Minor) of fitted actin cluster ellipses."}
- {id: cluster_aspect_ratio_sd, name: actin cluster aspect ratio SD, dimension: "dimensionless", description: "Standard deviation of fitted cluster aspect ratios."}
- {id: pattern_orientation, name: actin pattern orientation angle, dimension: "dimensionless", description: "Axial orientation angle relative to tube longitudinal axis (0 deg = longitudinal, 90 deg = circumferential): OrientationJ dominant direction, median orientation, or folded ellipse angle."}
- {id: pattern_orientation_sd, name: actin pattern orientation angle SD, dimension: "dimensionless", description: "Standard deviation of OrientationJ dominant direction across live-imaged tracheal tubes."}
- {id: orientation_coherency, name: OrientationJ coherency, dimension: "dimensionless", description: "Gradient structure tensor coherency (0 to 1) quantifying actin pattern connectivity/alignment."}
- {id: orientation_coherency_sd, name: OrientationJ coherency SD, dimension: "dimensionless", description: "Standard deviation of OrientationJ coherency across live-imaged tracheal tubes."}
- {id: probability_sum, name: orientation distribution probability sum, dimension: "dimensionless", description: "Sum of binned OrientationJ orientation probability distribution (1.0 when normalized)."}

# --- Periodic cable interval, tube geometry, skeleton & junctional intensity ---
- {id: pattern_interval, name: periodic cable or structure interval, dimension: "[length]", description: "Mean center-to-center spacing between periodic circumferential actin cables or simulated stripe structures."}
- {id: pattern_interval_sd, name: periodic cable interval SD, dimension: "[length]", description: "Sample standard deviation (N-1) of per-embryo mean cable intervals."}
- {id: pattern_interval_sem, name: periodic cable interval SEM, dimension: "[length]", description: "Standard error of the mean of per-embryo cable intervals."}
- {id: tube_diameter, name: tracheal tube diameter, dimension: "[length]", description: "Mean dorsal trunk luminal diameter during stage 15 expansion (Fig. 1j)."}
- {id: tube_diameter_sd, name: tracheal tube diameter SD, dimension: "[length]", description: "Sample standard deviation of tracheal tube diameter across N = 6 tubes."}
- {id: tube_length, name: tracheal tube length, dimension: "[length]", description: "Mean dorsal trunk length between TC5 and DB6 (Fig. 1k; duplicated from Fig. 1j in Source Data)."}
- {id: tube_duplication_residual, name: max absolute difference between Fig. 1k and Fig. 1j values, dimension: "[length]", description: "Maximum absolute difference across all 36 tube measurements between Source-data_Fig1k.xlsx and Source-data_Fig1j.xlsx (0 indicates verbatim duplication)."}
- {id: skeleton_length, name: mean maximum actin skeleton length, dimension: "[length]", description: "Mean length of maximum actin skeleton branches per image (Supp. Fig. 1g)."}
- {id: skeleton_length_sd, name: actin skeleton length SD, dimension: "[length]", description: "Population standard deviation (N) of mean maximum skeleton lengths across images (Supp. Fig. 1g)."}
- {id: junction_intensity_ratio, name: junctional RFP::RhoGEF2 intensity ratio, dimension: "dimensionless", description: "Mean intensity ratio of RFP::RhoGEF2 at longitudinal vs circumferential junctions (Supp. Fig. 1f)."}
- {id: junction_intensity_ratio_sd, name: junctional RFP::RhoGEF2 intensity ratio SD, dimension: "dimensionless", description: "Sample standard deviation of junctional RFP::RhoGEF2 intensity ratio across N = 5 images."}

# --- Fusion duration, colocalization & simulation parameters ---
- {id: frame_count, name: number of frames, dimension: "dimensionless", description: "Number of consecutive imaging or simulation frames (e.g. fusion duration in frames or Fig. 4f simulation frames)."}
- {id: pearson_r, name: Pearson colocalization correlation coefficient, dimension: "dimensionless", description: "Pearson's R correlation coefficient between a tagged protein and actin (Fig. 3d, Supp. Fig. 5d)."}
- {id: pearson_r_sd, name: Pearson correlation coefficient SD, dimension: "dimensionless", description: "Sample standard deviation of Pearson's R across ROIs."}
- {id: molecular_rest_length, name: molecular rest length, dimension: "[length]", description: "Crosslinker rest length parameter listed in Supplementary Table 3 / Source-data_Fig4c.xlsx."}
- {id: turnover_rate, name: molecular turnover or unbinding rate, dimension: "1/[time]", description: "Crosslinker turnover rate listed in Supplementary Table 3 / Source-data_Fig4c.xlsx."}

# --- Structure factor Gaussian fit parameters (Supplementary Table 4 / Supp. Fig. 7c) ---
- {id: structure_factor, name: static structure factor S(q), dimension: "dimensionless", description: "Gaussian peak height A / (sqrt(2*pi) * sigma) of the fitted static structure factor S(q)."}
- {id: structure_factor_fit_amplitude, name: Gaussian structure factor amplitude A, dimension: "1/[length]", description: "Amplitude parameter A in Supplementary Table 4 / Source-data_SupplementaryFig7c.xlsx."}
- {id: structure_factor_peak_frequency, name: structure factor peak spatial frequency mu/(2*pi), dimension: "1/[length]", description: "Peak center mu/(2*pi) in Supplementary Table 4 / Source-data_SupplementaryFig7c.xlsx."}
- {id: structure_factor_fit_width, name: Gaussian structure factor width sigma, dimension: "1/[length]", description: "Gaussian width sigma in Supplementary Table 4 / Source-data_SupplementaryFig7c.xlsx."}

# --- Nanocluster motion anisotropy & PIV displacement rates ---
- {id: mean_longitudinal_displacement, name: mean absolute longitudinal displacement |dx|, dimension: "[length]", description: "Mean absolute single-step cluster displacement along the longitudinal (x) axis."}
- {id: longitudinal_displacement_sd, name: longitudinal displacement SD, dimension: "[length]", description: "Sample standard deviation (N-1) of absolute single-step |dx| displacements."}
- {id: mean_circumferential_displacement, name: mean absolute circumferential displacement |dy|, dimension: "[length]", description: "Mean absolute single-step cluster displacement along the circumferential (y) axis."}
- {id: circumferential_displacement_sd, name: circumferential displacement SD, dimension: "[length]", description: "Sample standard deviation (N-1) of absolute single-step |dy| displacements."}
- {id: motion_anisotropy_ratio, name: motion anisotropy ratio |dy|/|dx| or Vy/Vx, dimension: "dimensionless", description: "Ratio of mean circumferential to mean longitudinal displacement or PIV velocity."}
- {id: mean_step_distance, name: mean Euclidean cluster step distance, dimension: "[length]", description: "Mean Euclidean displacement sqrt(dx^2 + dy^2) of tracked small nanoclusters."}
- {id: step_distance_sd, name: Euclidean step distance SD, dimension: "[length]", description: "Sample standard deviation (N-1) of tracked Euclidean step distances."}
- {id: pixel_size, name: spreadsheet pixel-to-micron conversion factor, dimension: "[length]", description: "Physical length per pixel implied by Excel formulas dx / (x2 - x1) in Figs. 4d, 5a, 5d."}
- {id: piv_velocity_x, name: PIV mean longitudinal displacement rate Vx, dimension: "[length]/[time]", description: "Mean longitudinal PIV displacement rate |Vx| (note unit mislabeling in Source-data_Fig5c.xlsx and Source-data_Fig5f.xlsx)."}
- {id: piv_velocity_x_sd, name: PIV longitudinal displacement rate SD, dimension: "[length]/[time]", description: "Sample standard deviation of PIV |Vx| across embryos."}
- {id: piv_velocity_y, name: PIV mean circumferential displacement rate Vy, dimension: "[length]/[time]", description: "Mean circumferential PIV displacement rate |Vy| (note unit mislabeling in Source-data_Fig5c.xlsx and Source-data_Fig5f.xlsx)."}
- {id: piv_velocity_y_sd, name: PIV circumferential displacement rate SD, dimension: "[length]/[time]", description: "Sample standard deviation of PIV |Vy| across embryos."}
- {id: p_value, name: statistical hypothesis test P value, dimension: "dimensionless", description: "Two-sided P value computed from raw Source Data (Welch t, Student t, R-asymptotic KS, Kruskal-Wallis, or Wilcoxon rank-sum)."}
