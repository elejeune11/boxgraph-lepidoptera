     all 36 tube measurements (2.22-4.65 um, averages 2.60-3.94 um) are an exact verbatim duplicate
     of Source-data_Fig1j.xlsx (Tube Diameter), contradicting Fig. 1k in the paper which plots
     tube length rising from ~17 to ~24 um; actual tube length data are absent from the archive.
