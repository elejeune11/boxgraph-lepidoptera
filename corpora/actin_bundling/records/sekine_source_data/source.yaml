notes: >
  Complete BoxGraph record of the unpacked Source Data archive MOESM11_ESM.zip released with
  Sekine et al., Nature Communications 15, 464 (2024) (record `sekine2024`), containing 27
  per-figure Excel (.xlsx) spreadsheets covering Main Figures 1-5 and Supplementary Figures 1, 3,
  5, 6, and 7 (no separate spreadsheet exists for Figure 6, as the article has Figures 1-5 only).
  No .xlsx files are copied into this record; 12 Python `software: true` reader/summary models
  under models/ load the released spreadsheets directly from $BOXGRAPH_SOURCE on every build to
  recompute exact means, SDs (sample N-1 and population N), SEMs, medians, anisotropy ratios,
  sample counts, implied pixel scales, and statistical test P-values (Welch t, Student t,
  R-asymptotic Kolmogorov-Smirnov, Kruskal-Wallis, and Wilcoxon rank-sum).

  COMPLETE FILE-BY-FILE INVENTORY (27 .xlsx files, 1,284,487 bytes total):
  1. Source-data_Fig1ef.xlsx (67,092 B) - sheet 'Figure 1e, f': raw ImageJ ellipse-fitting tables
     for Stage 15 (n = 356 clusters, rows 7-362, cols B-K) and Stage 16 (n = 271 clusters, rows
     7-277, cols N-W): Area, Major, Minor, Angle, Circ., AR, Round, Solidity; 0 formulas. Exact
     reproduction of all 16 Stage 15/16 means and sample SDs (N-1) in Supplementary Table 1 and
     R-asymptotic KS P-values for AR (3.17e-4, Fig. 1f), Major (0.00981, Supp. Fig. 1b), and Minor
     (0.329, Supp. Fig. 1c).
  2. Source-data_Fig1h.xlsx (11,458 B) - sheet 'Figure 1h': live-imaging OrientationJ dominant
     direction (deg) across 11 timepoints (-80 to +20 min, rows 7-17) for up to 9 tracheal tubes
     (cols C-K) plus formula Average (col L), population SD via STDEVP (col M), and COUNT (col N);
     33 formulas. Reproduces stored averages/SDs/counts to machine precision.
  3. Source-data_Fig1i.xlsx (11,391 B) - sheet 'Figure 1i': live-imaging OrientationJ coherency
     (0-1) across 11 timepoints (-80 to +20 min, rows 7-17) for up to 9 tracheal tubes (cols C-K)
     plus formula Average (col L), population SD via STDEVP (col M), and COUNT (col N); 33 formulas.
     Reproduces stored averages/SDs/counts to machine precision.
  4. Source-data_Fig1j.xlsx (10,609 B) - sheet 'Figure 1j': tracheal tube diameter (um) across 6
     timepoints (-80 to +20 min, rows 7-12) for 6 tracheal tubes (cols C-H) plus formula Average
     (col I) and sample SD via STDEV (col J); 12 formulas. Mean rises from 2.674 um (-80 min) to
     3.940 um (0 min), matching Fig. 1j.
  5. Source-data_Fig1k.xlsx (10,520 B) - sheet 'Figure 1k': titled 'Tube length', 6 timepoints
