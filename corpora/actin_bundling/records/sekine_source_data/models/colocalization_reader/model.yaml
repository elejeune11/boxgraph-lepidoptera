id: colocalization_reader
name: Actin colocalization Pearson's R summary and Welch/Student t-tests vs GFP (Fig. 3d, Supp. Fig. 5d)
role: processing
software: true
stated:
  none: "binary xlsx spreadsheet in unpacked Source Data archive"
  where: "Source-data_Fig3d.xlsx (sheet 'Figure 3d', rows 7-60) and Source-data_SupplementaryFig5d.xlsx (sheet 'Supplementary Figure 5d', rows 7-69)"
inputs: {}
outputs:
  n_rois: {quantity: roi_count, unit: dimensionless}
  r_mean: {quantity: pearson_r, unit: dimensionless}
  r_sd: {quantity: pearson_r_sd, unit: dimensionless}
  r_median: {quantity: pearson_r, unit: dimensionless}
  welch_p_vs_gfp: {quantity: p_value, unit: dimensionless}
  student_p_vs_gfp: {quantity: p_value, unit: dimensionless}
settings:
  stage: 16
  protein: "RhoGEF2::mCherry"
  control_stage: 16
stochastic: false
