id: live_imaging_orientation_reader
name: Live-imaging OrientationJ dominant direction and coherency time course (Fig. 1h, 1i)
role: processing
software: true
stated:
  none: "binary xlsx spreadsheet in unpacked Source Data archive"
  where: "Source-data_Fig1h.xlsx (sheet 'Figure 1h', rows 7-17) and Source-data_Fig1i.xlsx (sheet 'Figure 1i', rows 7-17)"
inputs: {}
outputs:
  n_samples: {quantity: sample_count, unit: dimensionless}
  dominant_direction_mean: {quantity: pattern_orientation, unit: deg}
  dominant_direction_sd_pop: {quantity: pattern_orientation_sd, unit: deg}
  coherency_mean: {quantity: orientation_coherency, unit: dimensionless}
  coherency_sd_pop: {quantity: orientation_coherency_sd, unit: dimensionless}
settings:
  time_min: 0
stochastic: false
