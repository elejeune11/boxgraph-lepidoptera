id: piv_displacement_reader
name: PIV mean displacement rates Vx, Vy, ratio Vy/Vx, and Welch/Student t-tests (Fig. 5c, 5f)
role: processing
software: true
stated:
  none: "binary xlsx spreadsheet in unpacked Source Data archive"
  where: "Source-data_Fig5c.xlsx (sheet 'Figure 5c', rows 7-10) and Source-data_Fig5f.xlsx (sheet 'Figure 5f', rows 7-19)"
inputs: {}
outputs:
  n_images: {quantity: sample_count, unit: dimensionless}
  vx_mean: {quantity: piv_velocity_x, unit: nm/s}
  vx_sd: {quantity: piv_velocity_x_sd, unit: nm/s}
  vy_mean: {quantity: piv_velocity_y, unit: nm/s}
  vy_sd: {quantity: piv_velocity_y_sd, unit: nm/s}
  aniso_ratio: {quantity: motion_anisotropy_ratio, unit: dimensionless}
  welch_p: {quantity: p_value, unit: dimensionless}
  student_p: {quantity: p_value, unit: dimensionless}
settings:
  dataset: "fig5f"
  condition: "Control"
stochastic: false
