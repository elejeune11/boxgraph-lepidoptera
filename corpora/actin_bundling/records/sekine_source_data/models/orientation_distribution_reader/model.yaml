id: orientation_distribution_reader
name: Genetic/RNAi OrientationJ orientation distribution medians (Supp. Fig. 3a)
role: processing
software: true
stated:
  none: "binary xlsx spreadsheet in unpacked Source Data archive"
  where: "Source-data_SupplementaryFig3a.xlsx, sheet 'Supplementary Fig 3a', cells B7:AC97"
inputs: {}
outputs:
  median_orientation_asc: {quantity: pattern_orientation, unit: deg}
  median_orientation_prev: {quantity: pattern_orientation, unit: deg}
  median_orientation_interp: {quantity: pattern_orientation, unit: deg}
  pdf_sum: {quantity: probability_sum, unit: dimensionless}
  n_genotypes_present: {quantity: sample_count, unit: dimensionless}
settings:
  genotype: "attP40"
stochastic: false
