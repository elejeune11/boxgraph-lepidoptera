id: motion_anisotropy_reader
name: Small-nanocluster displacement, anisotropy ratio |dy|/|dx|, step distance, implied pixel scale, and Welch P-value (Fig. 4d, 5a, 5d)
role: processing
software: true
stated:
  none: "binary xlsx spreadsheet in unpacked Source Data archive"
  where: "Source-data_Fig4d.xlsx ('Figure 4d'), Source-data_Fig5a.xlsx ('Figure 5a'), and Source-data_Fig5d.xlsx ('Figure 5d')"
inputs: {}
outputs:
  n_clusters: {quantity: sample_count, unit: dimensionless}
  dx_mean: {quantity: mean_longitudinal_displacement, unit: nm}
  dx_sd: {quantity: longitudinal_displacement_sd, unit: nm}
  dy_mean: {quantity: mean_circumferential_displacement, unit: nm}
  dy_sd: {quantity: circumferential_displacement_sd, unit: nm}
  aniso_ratio: {quantity: motion_anisotropy_ratio, unit: dimensionless}
  dist_mean: {quantity: mean_step_distance, unit: nm}
  dist_sd: {quantity: step_distance_sd, unit: nm}
  welch_p: {quantity: p_value, unit: dimensionless}
  implied_um_per_px: {quantity: pixel_size, unit: um}
settings:
  dataset: "fig4d"
  condition: "1-M"
  override_um_per_px: 0.0
stochastic: false
