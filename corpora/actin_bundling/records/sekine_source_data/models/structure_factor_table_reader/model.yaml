id: structure_factor_table_reader
name: Structure factor Gaussian fit parameters, peak height, and periodic interval check (Supp. Fig. 7c / Fig. 5f stray sheet)
role: processing
software: true
stated:
  none: "binary xlsx spreadsheet in unpacked Source Data archive"
  where: "Source-data_SupplementaryFig7c.xlsx (sheet 'Supplementary Figure 7c', rows 9-12) and duplicate sheet 'Supplementary Figure 6e' in Source-data_Fig5f.xlsx"
inputs: {}
outputs:
  A: {quantity: structure_factor_fit_amplitude, unit: 1/um}
  mu_over_2pi: {quantity: structure_factor_peak_frequency, unit: 1/um}
  sigma: {quantity: structure_factor_fit_width, unit: 1/um}
  interval_stored: {quantity: pattern_interval, unit: nm}
  interval_from_mu: {quantity: pattern_interval, unit: nm}
  peak_height: {quantity: structure_factor, unit: dimensionless}
settings:
  condition: "1-M"
stochastic: false
