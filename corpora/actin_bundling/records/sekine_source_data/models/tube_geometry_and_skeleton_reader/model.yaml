id: tube_geometry_and_skeleton_reader
name: Tracheal tube diameter, duplicated Fig. 1k tube length, and actin skeleton length time course (Fig. 1j-k, Supp. Fig. 1g)
role: processing
software: true
stated:
  none: "binary xlsx spreadsheet in unpacked Source Data archive"
  where: "Source-data_Fig1j.xlsx (sheet 'Figure 1j'), Source-data_Fig1k.xlsx (sheet 'Figure 1k'), and Source-data_SupplementaryFig1g.xlsx (sheet 'Supplementary Figure 1g')"
inputs: {}
outputs:
  tube_diameter_mean: {quantity: tube_diameter, unit: um}
  tube_diameter_sd: {quantity: tube_diameter_sd, unit: um}
  fig1k_stored_length_mean: {quantity: tube_length, unit: um}
  fig1k_minus_fig1j_max_abs: {quantity: tube_duplication_residual, unit: um}
  skeleton_length_mean: {quantity: skeleton_length, unit: um}
  skeleton_length_sd_pop: {quantity: skeleton_length_sd, unit: um}
  skeleton_n: {quantity: sample_count, unit: dimensionless}
settings:
  time_min: 0
stochastic: false
