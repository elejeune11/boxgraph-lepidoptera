id: cluster_morphometry_reader
name: Stage 15 and Stage 16 actin nanocluster ellipse-fitting summary and KS tests (Fig. 1e-f, Supp. Fig. 1b-c)
role: processing
software: true
stated:
  none: "binary xlsx spreadsheet in unpacked Source Data archive"
  where: "Source-data_Fig1ef.xlsx (sheet 'Figure 1e, f') and Source-data_SupplementaryFig1bc.xlsx (sheet 'Supplementary Figures 1b, c')"
inputs: {}
outputs:
  n_clusters: {quantity: cluster_count, unit: dimensionless}
  area_mean: {quantity: cluster_area, unit: um^2}
  area_sd: {quantity: cluster_area_sd, unit: um^2}
  major_mean: {quantity: cluster_major_length, unit: um}
  major_sd: {quantity: cluster_major_length_sd, unit: um}
  minor_mean: {quantity: cluster_minor_length, unit: um}
  minor_sd: {quantity: cluster_minor_length_sd, unit: um}
  ar_mean: {quantity: cluster_aspect_ratio, unit: dimensionless}
  ar_sd: {quantity: cluster_aspect_ratio_sd, unit: dimensionless}
  angle_median_folded: {quantity: pattern_orientation, unit: deg}
  ks_p_ar: {quantity: p_value, unit: dimensionless}
  ks_p_major: {quantity: p_value, unit: dimensionless}
  ks_p_minor: {quantity: p_value, unit: dimensionless}
  dup_s1bc_max_diff: {quantity: cluster_major_length, unit: um}
settings:
  stage: 15
stochastic: false
