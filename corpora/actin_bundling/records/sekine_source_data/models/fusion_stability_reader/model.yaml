id: fusion_stability_reader
name: Nanocluster fusion duration by orientation bin and Kruskal-Wallis / Wilcoxon tests (Fig. 2b)
role: processing
software: true
stated:
  none: "binary xlsx spreadsheet in unpacked Source Data archive"
  where: "Source-data_Fig2b.xlsx, sheet 'Figure 2b', raw per-tube fusion event blocks cols I-EJ"
inputs: {}
outputs:
  n_circum: {quantity: sample_count, unit: dimensionless}
  n_diag: {quantity: sample_count, unit: dimensionless}
  n_long: {quantity: sample_count, unit: dimensionless}
  mean_dur_circum: {quantity: frame_count, unit: dimensionless}
  mean_dur_diag: {quantity: frame_count, unit: dimensionless}
  mean_dur_long: {quantity: frame_count, unit: dimensionless}
  median_dur_circum: {quantity: frame_count, unit: dimensionless}
  median_dur_diag: {quantity: frame_count, unit: dimensionless}
  median_dur_long: {quantity: frame_count, unit: dimensionless}
  kw_p: {quantity: p_value, unit: dimensionless}
  wilcox_circum_vs_diag_unadj_p: {quantity: p_value, unit: dimensionless}
  wilcox_circum_vs_diag_bonf_p: {quantity: p_value, unit: dimensionless}
settings:
  time_min: 0
stochastic: false
