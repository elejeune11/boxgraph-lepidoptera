- id: ref_nb_slsqp_ftol
  run: run_nb_bench_300nm
  setting: ftol
  factors: [1, 10]
  mode: divide
  output: aspect_ratio
  tolerance: "0.5%"
  tolerance_basis: "added: well below the ~1-2% digitized aspect-ratio uncertainty of Fig. 4f-g"
  tolerance_added: true

- id: ref_nb_slsqp_polish_iter
  run: run_nb_bench_300nm
  setting: polish_maxiter
  factors: [1, 2]
  mode: multiply
  output: aspect_ratio
  tolerance: "0.5%"
  tolerance_basis: "added: verifies direct live ns['gettotalenergy'] polishing is converged by polish_maxiter = 12"
  tolerance_added: true

- id: ref_nb_plus2_ftol
  run: run_nb_plus2_bench_300nm
  setting: ftol
  factors: [1, 10]
  mode: divide
  output: aspect_ratio
  tolerance: "0.5%"
  tolerance_basis: "added: below digitized Fig. 4g colorbar precision"
  tolerance_added: true

- id: ref_nb_tcrit_ftol
  run: run_nb_tcrit_bench_d2
  setting: ftol
  factors: [1, 10]
  mode: divide
  output: T_crit
  tolerance: "1%"
  tolerance_basis: "added: below the ~15 nm (single-filament) resolution of Fig. 4h"
  tolerance_added: true
