- id: rel_tcrit_scales_as_eqS25
  kind: scales_as
  a: graham_code/notebook_critical_ring_thickness
  b: graham2023/ring_thickness_scaling_eqS25
  mapping:
    R: "D_droplet / 2"
    L_p: "kflex_fil / (4.1117 * 1000)"
  output_map: {u_m: T_crit}
  regime:
    D_droplet: [1.0, 1.0]
    gamma_I: [2.5, 10.0]
    AR_thresh: [1.1, 1.1]
    R_fil: [15.0, 15.0]
    kflex_fil: [50000.0, 100000.0]
    lcyl_fixed: [100.0, 100.0]
    lcyl_scale_frac: [0.1, 0.1]
    kstr: [100.0, 100.0]
    gamma_AVR: [1.0e-8, 1.0e-8]
    gamma_AVD: [5000.0, 5000.0]
    noisefactor: [1.0, 1.0]
    ellipse_com: [8000.0, 8000.0]
  provenance: proposed
  reason: "Tests whether the simulated 2D droplet-buckling threshold T_crit(D, kflex_fil) from Fig. 4h obeys the continuum thermal-fluctuation equipartition scaling Eq. S25 (u_m ~ R^1.5 / sqrt(L_p)). Not verified: mechanical energy balance E_bend ~ (T_crit/R_fil)*kflex_fil/D ~ E_surf ~ gamma_I*D yields T_crit ~ D^2.03 * gamma_I^1.00 * kflex_fil^-1.01 on constant-Nbeads=30 diameters (distinct from D^1.5 * L_p^-0.5), and across general floating-point D the IEEE-754 Nbeads=29/30 jump makes T_crit(D) piecewise discontinuous."

- id: rel_tcrit_scales_as_power_law_fig4h
  kind: scales_as
  a: graham_code/notebook_critical_ring_thickness
  b: graham2023/power_law_thickness_fit
  mapping:
    D: "D_droplet"
    a: "0.0721"
    b: "1.7195"
  output_map: {T_ring: T_crit}
  regime:
    D_droplet: [1.0, 1.0]
    gamma_I: [2.5, 10.0]
    AR_thresh: [1.1, 1.1]
    R_fil: [15.0, 15.0]
    kflex_fil: [72900.0, 72900.0]
    lcyl_fixed: [100.0, 100.0]
    lcyl_scale_frac: [0.1, 0.1]
    kstr: [100.0, 100.0]
    gamma_AVR: [1.0e-8, 1.0e-8]
    gamma_AVD: [5000.0, 5000.0]
    noisefactor: [1.0, 1.0]
    ellipse_com: [8000.0, 8000.0]
  provenance: proposed
  reason: "Compares the diameter scaling exponent of Fig. 4h's simulated critical thickness curve T_crit(D) (at IEEE-754-safe Nbeads=30 D = 1.0 um) against the experimental AR < 1.1 power-law trendline y = 0.0721 * D^1.7195 overlaid on Fig. 4h. Not verified because the 2D mechanical buckling balance scales as D^~2.03 rather than D^1.7195 (slope difference ~0.31-0.34)."
