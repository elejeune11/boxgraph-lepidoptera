  text: >
    Cross-record ModelAtlas scaling analysis between graham_code/notebook_critical_ring_thickness (Fig. 4h
    simulated circle-to-ellipse transition T_crit at AR = 1.1) and graham2023/ring_thickness_scaling_eqS25
    (continuum thermal-fluctuation law u_m ~ R^1.5 / sqrt(L_p)) shows that the two models obey different
    power laws: on constant-Nbeads = 30 diameters (D = 1.0, 2.0, 2.5, 4.0 um), the 2D SLSQP buckling
    threshold balances discrete ring bending energy E_bend ~ (T_crit / R_fil) * kflex_fil / D against
    droplet line-tension energy E_surf ~ gamma_I * D, giving T_crit ~ D^2.03 * gamma_I^1.00 * kflex_fil^-1.01
    (distinct from both Eq. S25's D^1.5 * L_p^-0.5 and Fig. 4h's overlaid empirical power-law fit D^1.7195).
    Furthermore, across general floating-point diameters D, the IEEE-754 truncation bug
    int(D*1e3 / (D*0.1*1e3)) flips Nbeads discontinuously between 29 and 30 on dense sets of floats,
    making T_crit(D) piecewise discontinuous (~12% jumps) and nowhere smooth in D.
  citation:
    file: VASPDroplet_simulate.ipynb
    lines: "893-895"
    quote: "lcylvec = [diavec[0]*0.1*1e3]#convert from microns to nanometer"

