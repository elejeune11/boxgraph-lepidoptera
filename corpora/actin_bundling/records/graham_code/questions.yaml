- id: q_notebook_unrunnable_scoping_and_runtime_bugs
  kind: possible_error
  about:
    - sample_dimval_code
    - bounds_lo_code
    - bounds_hi_code
    - notebook_droplet_ring_slsqp
    - notebook_wetted_fraction_check
  text: >
    VASPDroplet_simulate.ipynb cannot execute simulate() or generatering() as shipped due to numerous
    scoping, interface, and logic bugs (apparently left over from refactoring a main.py script into a notebook):
    (1) Cell 13 line 672 calls main.simulate(...) before simulate() is defined, and main is never imported.
    (2) generatering(sparams) (cell 15, line 689) reads 11 undefined globals (lcylvec, Nfilvec, Lp_fil,
    fTolvec, diavec, dimval, bnds, failcounter, failtol, failEstrtol, counter) that are locals of simulate().
    (3) generatering() returns the scipy OptimizeResult object res (line 835), whereas simulate() line 913
    treats its return value opt_var as a coordinate array (len(opt_var), addrandomnoise(opt_var, ...)).
    (4) simulate() appends to uninitialized solnlistvec (line 929), references undefined diameter/liter/ftolval
    on line 986, compares scalar Nfil == array targetNfil on line 985, writes typo sys.sterr (line 905) then
    closes sys.stderr (line 994), and leaves nonlinearbool/alphaval unbound when len(args) < 4.
    (5) Reusing a single Bounds(1e-9, 1e10) object across growing opt_var lengths crashes modern SciPy
    (which broadcasts bounds.lb in place).
    (6) getlinefracinsidedroplet() lines 313-314 overwrite leninside/lenoutside using '=' instead of '+='
    and swap the inside/outside fractions when a single segment intersects the droplet boundary twice
    (verified in run_wetted_frac_two_intersect_bug: returns 0.1667 instead of 0.8333).
    (7) getwettingF2() line 528 uses bitwise '~areEqual(sprev, 1.0)' on Python bool (always truthy: ~True = -2,
    ~False = -1), appending an extra endpoint sample even when sprev == 1.0.
    (8) getsurfaceF() 3D branch (lines 368-380) omits sysparams.surface_T[0]* on the sphere formula (line 370),
    passes k instead of m = k^2 to scipy.special.ellipeinc/ellipkinc (line 380), and never imports scipy.special.
    (9) Unused helpers initializezigzag() and initializestraight() (lines 577, 581, 595) reference global
    sparams.Nbeads instead of their parameter sysparams.Nbeads.
  citation:
    file: VASPDroplet_simulate.ipynb
    lines: "672"
    quote: "main.simulate(2,diavec,Nfil,gamma_VP,0,True,1e-06, False,10000.0)"

