- id: q_generatering_double_off_by_one_and_ieee754_sawtooth
  kind: possible_error
  about:
    - lcyl_scale_frac_code
    - lcyl_fixed_code
    - paper_final_ring_length_ratio
    - notebook_ring_discretization
    - notebook_droplet_ring_slsqp
    - notebook_critical_ring_thickness
    - cmp_lratio_d1_vs_paper
    - cmp_lratio_d1p5_vs_paper
    - cmp_nb_fig4h_gI5
    - cmp_nb_fig4h_gI15
  text: >
    MAJOR DISCOVERY SETTLING graham2023 q_digitize_slsqp_systematic_ar_discrepancy AND q_extension_step_100nm_vs_01D:
    graham2023 SI Section 2.6 states that an initial filament of length L = D is extended by 0.1*D for
    21 cycles to L_final = 3.1*D (~ pi*D), and Table 1 lists a fixed L_cyl = 100 nm. In VASPDroplet_simulate.ipynb:
    (1) When lcylscalewithD = True (as in sample call line 672), line 895 scales the segment length itself
    as lcyl = D * 0.1 * 1e3 (so lcyl = 200 nm at D = 2 um, 400 nm at D = 4 um). Running with Table 1's
    fixed lcyl = 100 nm at D = 2 um, gamma_I = 1 pN (cmp_nb_fig4g_d2_gI1_fixed_lcyl) overshoots to AR = 1.89
    vs published 1.701, whereas lcyl = 200 nm matches the plateau 1.705.
    (2) generatering() contains TWO off-by-one bugs: line 722 sets Nbeads = int(D*1e3/lcyl) = 10 beads
    (= 9 segments = 0.9*D, not 1.0*D), and lines 725-744 loop range(0, 21) where trialidx == 0 initializes
    and only trialidx = 1..20 (20 iterations, not 21) call extendstraight(). Thus the actual ring has
    Nbeads = 30 (29 segments, L_final = 2.9*D) rather than 32 beads (31 segments, 3.1*D)! An open arc of
    2.9*D leaves a ~0.24*D gap so its ends push outward smoothly and saturate at AR ~ 1.57 (gamma_I = 5 pN)
    and ~ 1.74 (gamma_I = 1 pN), explaining why graham2023's literal 3.1*D model underpredicted deformation
    by 2x at low T_ring and buckled discontinuously to AR = 1.93-2.19 at high T_ring.
    (3) Worse, IEEE-754 floating-point division in int(D*1e3 / (D*0.1*1e3)) evaluates to 9.999999999999998
    and truncates to Nbeads_init = 9 (Nbeads_final = 29, 28 segments, L_final = 2.8*D) specifically for
    D = 0.75, 1.5, 1.75, 3.0, and 3.5 um! Because a shorter 2.8*D arc deforms the droplet at lower T_ring
    than a 2.9*D arc, this IEEE-754 bug directly produces the non-monotonic sawtooth dips visible at
    D = 3.0 and 3.5 um across every curve in published Fig. 4h!
  citation:
    file: VASPDroplet_simulate.ipynb
    lines: "712-745"
    quote: "sparams.Nbeads = int(diameter*1e3/sparams.lcyl)"

