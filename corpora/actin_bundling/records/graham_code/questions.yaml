- id: q_kstr_not_scaled_by_nfil
  kind: possible_error
  about:
    - kstr_default_code
    - notebook_droplet_ring_slsqp
  text: >
    graham2023 SI Table 1 (p. 39) states k_stretch = N_fil * 100 pN/nm (proportional to filament count).
    In VASPDroplet_simulate.ipynb, kstr is set once to 100.0 (line 76) / 1e2 (line 892) and is NEVER
    multiplied by Nfil in the thickness-ramping loop (lines 918-926 only update sparams.rcyl and
    sparams.kbend). Numerical ablation at D = 1 um, gamma_I = 5 pN, Nfil = 20 shows this has negligible
    effect on equilibrium AR (1.4620 at kstr = 100 vs 1.4624 at kstr = 2000 pN/nm) because segments remain
    near rest length lcyl.
  citation:
    file: VASPDroplet_simulate.ipynb
    lines: "892"
    quote: "sparams.kstr = 1e2;"

