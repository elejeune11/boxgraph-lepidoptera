  text: >
    Cross-record ModelAtlas synthesis between graham_code (VASPDroplet_simulate.ipynb, accompanying
    Graham et al. 2023) and claessens2008 (Claessens, Semmrich, Ramos & Bausch, PNAS 105:8819-8822,
    2008) yields 0 cited.yaml links and 0 genuine mathematical relations across all 8 x 28 = 224
    runnable model pairs, driven by a citation disambiguation and four structural physical contrasts:
    (1) Citation clarification (Bathe et al. 2008 Biophys. J. vs Claessens et al. 2008 PNAS):
    graham_code/ref-bathe2008 (cited at VASPDroplet_simulate.ipynb line 73 '# Bathe et al Nonlinear'
    for getkbend's inactive nonlinearbool branch) refers to Bathe, Heussinger, Claessens, Bausch &
    Frey (2008), Biophys. J. 94, 2955-2964 ("Cytoskeletal bundle mechanics"), NOT to claessens2008
    ("Helical twist controls the thickness of F-actin bundles", PNAS 105, 8819-8822, 2008). Neither
    graham_code nor graham2023 cites claessens2008; instead, claessens2008 (ref-3, p. 1) and
    graham_code (ref-bathe2008) co-cite Bathe et al. (2008) (not yet in the corpus). Neither
    record's data.yaml imports any value from the other (graham_code's only non-graham2023
    from_source is ref-gittes1993 for kflex_rigidity_f_code = 7.29e-26 N*m^2; claessens2008 cites
    Tsuda 1996 ref-35 and Ono 1997 ref-36).
    (2) Rejection of coincidental dimensional shape match (notebook_bundle_kbend vs
    claessens2008/twist_energy_per_monomer and twist_energy_per_monomer_half): these are the sole
    models across both records sharing the non-dimensionless signature
    ([mass]*[length]^3/[time]^2, [length]) -> [energy], yet they represent orthogonal elastic modes
    and distinct algebraic roles. claessens2008/twist_energy_per_monomer evaluates actual torsional
    strain energy per actin monomer, E_twist = tau*(Delta_theta)^2/d (or with 1/2 in _half), using
    single-filament torsional rigidity tau = 8.0e-26 N*m^2 (Tsuda 1996), physical monomer rise
    d = 2.9 nm, and helical overtwist Delta_theta = 0.989 deg = 0.01726 rad (giving 8.22 pN*nm =
    2.03 k_B T printed, or 4.11 pN*nm = 1.02 k_B T with 1/2), quadratic in Delta_theta. By contrast,
    notebook_bundle_kbend (at its declared default nonlinearbool = False) outputs a discrete hinge
    bending spring constant k_bend = kflex_fil * Nfil / lcyl (using bending flexural rigidity
    kflex_fil = 7.29e-26 N*m^2 from Gittes 1993 and numerical discretization length lcyl = 100-400 nm
    = 0.1*D), linear in filament count Nfil with no angular deformation input (bending energy
    kbend*(1 - cos theta) is evaluated separately in getfilamentmechF, giving 14.53 pN*nm per 100 nm
    hinge or 0.103 k_B T per 2.9 nm monomer for Nfil = 1 in a 1 um ring). Forcing same_as or
    scales_as would either equate filament count Nfil to squared twist angle (Delta_theta)^2
    (unphysical) or fix Nfil = 1, Delta_theta = 1 rad to yield a too_plain bare ratio rigidity/length
    (sp.count_ops = 1-2) conflating bending EI with torsion GJ.
    (3) Bundle rigidity scaling (Nfil) vs 3D hexagonal packing (D ~ n_f^(1/2)) and internal notebook
    geometry tension: under its active nonlinearbool = False setting (fluid, weakly coupled VASP),
    notebook_bundle_kbend scales linearly as k_flex_bundle = kflex_fil * Nfil^1 (log-slope 1.000),
    incompatible in both output quantity and exponent with claessens2008/diameter_filament_scaling
    (D ~ n_f^(1/2), log-slope 0.5). Moreover, simulate() line 924 sets ring thickness linearly as
    rcyl = R_fil * Nfil = 15 * Nfil nm (2D monolayer ribbon scaling T_ring ~ Nfil^1, except 5 nm at
    Nfil = 1), giving T_ring = 285-300 nm at Nfil = 19-20 — 5.0-5.2x wider than claessens2008's 3D
    2-shell hexagonal fascin bundle (hydrated SAXS area-equivalent 56.8-58.2 nm at a_H = 12.4 nm,
    vertex-to-vertex 57.0 nm, TEM plateau 28.2 nm). Conversely, getkbend's inactive Bathe nonlinear
    branch (nonlinearbool = True, lines 177-204) encodes 3D coherent-bundle bending whose denominator
    Nfil + sqrt(Nfil) reflects 3D surface-to-bulk perimeter scaling (conceptually parallel to
    claessens2008/bundle_geometry_saturation's 3 +/- 3.5*n_f^(-1/2)) and transitions in log-slope at
    Nfil = 20 from 1.000 (alpha -> 0) through 1.17 (alpha = 1) and 1.59 (alpha = 100) to 1.99
    (alpha = 10^4) and 2.05 (alpha -> oo, approaching I_bundle ~ D^4 ~ Nfil^2, inflated 10x by the
    10-mode sum j = 1..10 with hidden constants df = 10 nm, t = 15 nm -> center-to-center 25 nm,
    Ef = 2.6 GPa, chi^2 = 145.9) — internally contradicting simulate()'s active linear 2D rcyl = 15*Nfil.
    (4) Confined droplet actin rings (rigid emulsion mass conservation vs soft VASP elastocapillary
    buckling): both records study confined actin rings in droplets with quadratic D^2 scalings, yet
    for physically opposite reasons. claessens2008 (droplet_ring_filament_number,
    droplet_critical_concentration, Fig. 2E) confines actin inside rigid spherical water-in-oil
    emulsion droplets (D_d ~ 6-30 um, closed equatorial ring L_ring = pi*D_d), where 3D mass
    conservation sets n_f = (1/6)*D_d^2*(c_a/M_actin)*N_A*d ~ D_d^2 until helical-twist frustration
    caps single rings at n_f ~= 20 and forces splitting into two bundles (c_a ~ D_d^-2). By contrast,
    graham_code (notebook_droplet_ring_slsqp, notebook_critical_ring_thickness,
    notebook_ring_discretization, Figs. 4f-h) models soft deformable 2D VASP droplets (D ~ 1-4 um,
    gamma_I = 1-15 pN) containing an open 2.9*D (or IEEE-754 truncated 2.8*D) discrete arc with
    exogenous twist-uncapped Nfil (up to 32 in Fig. 4f, ~112 in Fig. 4h, 200 in sample call), where
    elastocapillary balance (Nfil*kflex_fil/D ~ gamma_I*D) yields T_crit ~ D^2.03 * gamma_I^1.00 *
    kflex_fil^-1.01 on constant-Nbeads = 30 diameters (T_crit/D^2 = 0.0445-0.0467 um^-1 at
    gamma_I = 5 pN) with piecewise ~12% discontinuities at Nbeads = 29 diameters (0.0404-0.0407 um^-1
    at D = 1.5, 3.0 um). See also claessens2008/q_graham_code_bathe2008_citation_and_physics_contrast.

