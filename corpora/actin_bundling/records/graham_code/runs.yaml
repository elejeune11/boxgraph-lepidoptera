# ==========================================================================
# 1. Live notebook component tests (wetting, kbend, surfaceF, discretization, wetted frac)
# ==========================================================================
- id: run_edfig5c_ke64_code_gavd
  model: notebook_wetting_tension
  inputs: {gamma_AVR: gamma_avr_code, gamma_AVD: gamma_avd_code}
  sweep: {e: target_edfig5c_ke64}
  settings: {}
  outputs: {gamma: gamma_edfig5c_code_gavd}
  note: "Calls live getsurfaceTension() with the notebook's hardcoded gamma_AVD = 0.5e4 pN/nm (half of Table 1's 1e4 pN/nm)."

- id: run_edfig5c_ke64_paper_gavd
  model: notebook_wetting_tension
  inputs: {gamma_AVR: gamma_avr_code, gamma_AVD: paper_gamma_avd}
  sweep: {e: target_edfig5c_ke64}
  settings: {}
  outputs: {gamma: gamma_edfig5c_paper_gavd}
  note: "Calls live getsurfaceTension() with Table 1's gamma_AVD = 1e4 pN/nm; confirms code sign matches Extended Data Fig. 5c (settling q_eqS4_S5_wetting_sign_inverted)."

- id: run_kbend_linear_n1
  model: notebook_bundle_kbend
  inputs: {Nfil: nfil_default_code, lcyl: lcyl_fixed_code, kflex_fil: kflex_rigidity_f_code, alpha: alpha_default_code}
  settings: {nonlinearbool: false}
  outputs: {k_bend: kbend_linear_n1, k_flex_bundle: kflex_linear_n1}
  note: "Linear getkbend() for Nfil = 1, lcyl = 100 nm (729 pN*nm vs generatering line 697's 726.93 pN*nm)."

- id: run_kbend_linear_n20
  model: notebook_bundle_kbend
  inputs: {Nfil: test_nfil_20_added, lcyl: lcyl_fixed_code, kflex_fil: kflex_rigidity_f_code, alpha: alpha_default_code}
  settings: {nonlinearbool: false}
  outputs: {k_bend: kbend_linear_n20, k_flex_bundle: kflex_linear_n20}
  note: "Linear getkbend() for Nfil = 20 (T_ring = 300 nm), lcyl = 100 nm."

- id: run_kbend_nonlinear_n20
  model: notebook_bundle_kbend
  inputs: {Nfil: test_nfil_20_added, lcyl: lcyl_fixed_code, kflex_fil: kflex_rigidity_f_code, alpha: sample_alpha_code}
  settings: {nonlinearbool: true}
  outputs: {k_bend: kbend_nonlinear_n20, k_flex_bundle: kflex_nonlinear_n20}
  note: "Nonlinear 10-mode Bathe getkbend() for Nfil = 20, alpha = 10000 (sample call line 672) using hidden constants df=10, delta=50, t=15, Ef=2600 pN/nm^2."

- id: run_fig5c_surface_1um
  model: notebook_surface_energy
  inputs: {R: paper_fig5c_radius_1um, gamma_I: paper_fig5c_gamma_i}
  sweep: {AR: target_fig5c_surface}
  settings: {}
  outputs: {E_surf: esurf_fig5c_1um}
  note: "Live getsurfaceF() with SI Section 2.11 literal R = 1 um, gamma_I = 1 pN (1000x too large vs Fig. 5c)."

- id: run_fig5c_surface_1nm
  model: notebook_surface_energy
  inputs: {R: fig5c_radius_1nm_added, gamma_I: paper_fig5c_gamma_i}
  sweep: {AR: target_fig5c_surface}
  settings: {}
  outputs: {E_surf: esurf_fig5c_1nm}
  note: "Live getsurfaceF() with consistent R = 1 nm, gamma_I = 1 pN; reproduces Fig. 5c surface energy across AR = 1 to 9.8."

- id: run_ring_disc_d1
  model: notebook_ring_discretization
  inputs: {D_droplet: paper_diam_1um, lcyl_fixed: lcyl_fixed_code, lcyl_scale_frac: lcyl_scale_frac_code, noisefactor: noisefactor_code, ellipse_com: ellipse_com_sim_code}
  settings: {lcylscalewithD: true, seed: 0}
  outputs: {n_reps: nreps_d1, n_beads_final: nbeads_d1, L_ratio_final: lratio_d1, noise_amp: noise_amp_code_run}
  note: "Live generatering() discretization at D = 1 um: Nreps = 21, Nbeads_final = 30 (29 segments -> L_final/D = 2.9, not 3.1), noise_amp = 1.0 nm (not 0.1 nm)."

- id: run_ring_disc_d1p5
  model: notebook_ring_discretization
  inputs: {D_droplet: sample_diam_code, lcyl_fixed: lcyl_fixed_code, lcyl_scale_frac: lcyl_scale_frac_code, noisefactor: noisefactor_code, ellipse_com: ellipse_com_sim_code}
  settings: {lcylscalewithD: true, seed: 0}
  outputs: {n_reps: nreps_d1p5, n_beads_final: nbeads_d1p5, L_ratio_final: lratio_d1p5, noise_amp: noise_amp_d1p5}
  note: "Live generatering() discretization at sample D = 1.5 um: IEEE-754 int(1.5*1e3/(1.5*0.1*1e3)) = int(9.999999999999998) = 9 gives Nbeads_final = 29 (28 segments -> L_final/D = 2.8)."

- id: run_wetted_frac_edfig6_11seg
  model: notebook_wetted_fraction_check
  inputs: {D_droplet: paper_diam_1um, lcyl: lcyl_fixed_code, ellipse_com: ellipse_com_sim_code}
  settings: {scenario: edfig6_11seg}
  outputs: {wetted_fraction: wf_edfig6_11seg}
  note: "Live getlinefracinsidedroplet() on 12-bead (11-segment = 1.1 um) chord in 1.0 um droplet -> 10/11 = 0.9091 (matching Extended Data Fig. 6A's 0.9092)."

- id: run_wetted_frac_edfig6_12seg
  model: notebook_wetted_fraction_check
  inputs: {D_droplet: paper_diam_1um, lcyl: lcyl_fixed_code, ellipse_com: ellipse_com_sim_code}
  settings: {scenario: edfig6_12seg}
  outputs: {wetted_fraction: wf_edfig6_12seg}
  note: "Live getlinefracinsidedroplet() on 13-bead (12-segment = 1.2 um) chord in 1.0 um droplet -> 10/12 = 0.8333."

- id: run_wetted_frac_two_intersect_bug
  model: notebook_wetted_fraction_check
  inputs: {D_droplet: paper_diam_1um, lcyl: lcyl_fixed_code, ellipse_com: ellipse_com_sim_code}
  settings: {scenario: single_chord_two_intersect}
  outputs: {wetted_fraction: wf_two_intersect_bug}
  note: "Exposes lines 313-314 bug in getlinefracinsidedroplet() (= overwrite and inside/outside swap): returns 0.1667 instead of 0.8333 for a 1.2 um single segment crossing a 1.0 um droplet."

