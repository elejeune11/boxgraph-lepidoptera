# ==========================================================================
# 1. Wetting tension, surface energy, and ring-discretization checks
# ==========================================================================
- id: cmp_edfig5c_ke64_code_gavd
  purpose: reproduction
  computed: gamma_edfig5c_code_gavd
  printed: target_edfig5c_ke64
  note: "Live getsurfaceTension() with code's hardcoded gamma_AVD = 0.5e4 pN/nm fails Extended Data Fig. 5c plateau (5000 vs 10000 pN/nm), confirming code/paper parameter mismatch."

- id: cmp_edfig5c_ke64_paper_gavd
  purpose: reproduction
  computed: gamma_edfig5c_paper_gavd
  printed: target_edfig5c_ke64
  note: "Live getsurfaceTension() with Table 1's gamma_AVD = 1e4 pN/nm reproduces Extended Data Fig. 5c (6/6), settling graham2023 q_eqS4_S5_wetting_sign_inverted."

- id: cmp_fig5c_surface_1um
  purpose: reproduction
  computed: esurf_fig5c_1um
  printed: target_fig5c_surface
  note: "Live getsurfaceF() with SI Section 2.11 literal R = 1 um gives 1000x larger surface energy than Fig. 5c (confirming graham2023 q_fig5c_unit_mismatch)."

- id: cmp_fig5c_surface_1nm
  purpose: reproduction
  computed: esurf_fig5c_1nm
  printed: target_fig5c_surface
  note: "Live getsurfaceF() with consistent R = 1 nm, gamma_I = 1 pN reproduces Fig. 5c surface energy across all 10 aspect ratios."

- id: cmp_nreps_vs_paper
  purpose: reproduction
  computed: nreps_d1
  printed: paper_ring_extension_cycles
  note: "Live generatering() loop count Nreps = int((pi - 1) * D / (0.1 * D)) = 21 matches SI Section 2.6's 21 cycles."

- id: cmp_lratio_d1_vs_paper
  purpose: reproduction
  computed: lratio_d1
  printed: paper_final_ring_length_ratio
  note: "Live generatering() at D = 1.0 um yields L_final / D = 2.9 (30 beads = 29 segments), disagreeing with SI Section 2.6's printed L_final = 3.1 D due to double off-by-one bug."

- id: cmp_lratio_d1p5_vs_paper
  purpose: reproduction
  computed: lratio_d1p5
  printed: paper_final_ring_length_ratio
  note: "Live generatering() at sample D = 1.5 um yields L_final / D = 2.8 (29 beads = 28 segments) due to additional IEEE-754 int(9.999999999999998) = 9 truncation."

- id: cmp_noise_amp_vs_paper
  purpose: consistency
  computed: noise_amp_code_run
  printed: paper_noise_amp
  note: "Live addrandomnoise() with noisefactor = 1 applies uniform [0, 1.0] nm noise, 10x larger than SI Section 2.6's stated [0, 0.1] nm."

