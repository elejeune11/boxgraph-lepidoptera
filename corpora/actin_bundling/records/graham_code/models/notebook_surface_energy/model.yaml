id: notebook_surface_energy
name: live notebook adapter for getsurfaceF(opt_var, sysparams) 2D ellipse surface energy (VASPDroplet_simulate.ipynb)
role: model
software: true
stated:
  file: VASPDroplet_simulate.ipynb
  lines: "343-356"
  quote: "def getsurfaceF(opt_var,sysparams, printStatus=False):"
  where: "VASPDroplet_simulate.ipynb cell 9 (getsurfaceF, 2D 7-term Gauss-Kummer branch)"
equation: "a = R * sqrt(AR); b = R^2 / a; h = ((a-b)/(a+b))^2; E_surf = gamma_I * pi * (a+b) * sum_{n=0..6} c_n h^n"
inputs:
  R: {quantity: droplet_radius, unit: nm}
  AR: {quantity: droplet_aspect_ratio, unit: dimensionless}
  gamma_I: {quantity: droplet_line_tension, unit: pN}
outputs:
  E_surf: {quantity: surface_energy, unit: pN*nm}
settings: {}
stochastic: false
