id: notebook_bundle_kbend
name: live notebook adapter for getkbend(sysparams) linear and nonlinear Bathe stiffness (VASPDroplet_simulate.ipynb)
role: model
software: true
stated:
  file: VASPDroplet_simulate.ipynb
  lines: "170-204"
  quote: "def getkbend(sysparams):"
  where: "VASPDroplet_simulate.ipynb cell 7 (getkbend)"
equation: "linear: kbend = kflex_rigidity_f * Nfil / lcyl; nonlinear: kbend = kflex_rigidity_f * Nfil * (1 + sum_{j=1..10} chi^2 (Nfil-1) / (1 + c_qj (Nfil + sqrt(Nfil)) / alpha)) / lcyl"
inputs:
  Nfil: {quantity: filament_count, unit: dimensionless}
  lcyl: {quantity: segment_length, unit: nm}
  kflex_fil: {quantity: flexural_rigidity, unit: pN*nm^2}
  alpha: {quantity: crosslinker_coupling, unit: dimensionless}
outputs:
  k_bend: {quantity: discrete_bending_constant, unit: pN*nm}
  k_flex_bundle: {quantity: flexural_rigidity, unit: pN*nm^2}
settings:
  nonlinearbool: false
stochastic: false
