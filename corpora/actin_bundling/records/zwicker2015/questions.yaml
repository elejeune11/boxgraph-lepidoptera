- id: q_audit_appD_exact_eigenvalues_always_real
  kind: reading
  about:
    - binary_jacobian_eqD3_D4
    - binary_jacobian_eqD3_D4_corrected
    - binary_multidroplet_stability_solver
    - q_eqD3b_spurious_N_factor
  text: >
    Audit disagreement with the closing remark of q_eqD3b_spurious_N_factor: the paper's claim on p. 12 that the
    Jacobian eigenvalues are real and ordered e_- < e_+ < e_tilde IS mathematically exact at every physical steady
    state of Eqs. (13)-(14) once the spurious N in printed Eq. (D3b) is removed. Proof: at any steady state of
    Eq. (13), D_B*phi_0^B/R_bar^2 = D_B*gamma*beta/R_bar^3 + k_b/3. Letting A = 4*pi*D_B*N*R_bar/V_s > 0 and
    B = D_B*phi_0^B/R_bar^2 > 0 gives J_ii = B - k_b, J_00 = -(k_f + k_b) - A, so J_00 - J_ii = -(k_f + A + B) < 0
    always, and 4*N*J_0i*J_i0 = -4*A*B (for exact J_0i without N). Hence the discriminant is
    (J_00 - J_ii)^2 + 4*N*J_0i*J_i0 = (k_f + A + B)^2 - 4*A*B = (A - B)^2 + k_f^2 + 2*k_f*(A + B) > 0 strictly
    for all steady states (verified across 50,000 random steady states). Complex conjugate eigenvalues arise ONLY
    when using the misprinted extra factor N in Eq. (D3b) (giving -4*N*A*B, which is negative at Fig. 4b and across
    most N >= 2 steady states) or when evaluating Eqs. (D3)-(D4) off the steady-state manifold.
  citation:
    page: 12
    printed_page: "012317-12"
    quote: "values are ordered, e− < e+ < ẽ, since J0i Ji0 < 0 and"
    where: Appendix D, p. 12

- id: q_audit_sec4_autocat_bg_bistability
  kind: overstated_claim
  about:
    - autocatalytic_emulsion_solver
    - autocatalytic_stability_Qstab_eq25
    - coarse_grained_droplet_eq9_12
    - fig10b_one_below_Qstab_max_droplets
    - Q1_below_Qstab_fig10b
    - cmp_fig10b_one_below_Qstab
  text: >
    Solving the paper's stated Sec. IV system (Eq. 22 coupled to full Eq. 10 including +k*phi_0^A*phi_0^B and Eq. 12,
    which reproduces Figs. 7a, 8a, 8b, 10a, and 10b steady volumes) reveals an internal tension with p. 9 col 1 and
    p. 10 col 1. Because droplet steady state enforces k*phi_0^A ≈ k_b, the net background decay rate (k_b - k*phi_0^A)
    in Eq. (10) cancels by a factor of ~60 for Fig. 7-10 parameters, keeping phi_0^B ≈ 0.93*phi_+^B rather than
    phi_0^B ≈ 0 even though V_s/(N*l^3) ≈ 98 >> 1 with l = (D_B/k_b)^(1/2). Consequently, linear Ostwald stability
    (lambda < 0) of two droplets begins far below Eq. (25)'s phi_0^B = 0 threshold (Q_stab = 209.4 w^3 k_0): at
    Q ≈ 79.0 w^3 k_0 for equal cores (Fig. 9b, phibar = 0.02) and at a saddle-node fold Q_1 ≈ 133.5 w^3 k_0 for
    unequal cores (Q_2 = 300 w^3 k_0, Fig. 10b). Thus p. 10's claim that 'if only one of the catalytic activities is
    larger than Q_stab while the other one is smaller, only a single droplet is stable' is overstated: for
    133.5 < Q_1/(w^3 k_0) < 213.9 (including Q_1 = 150 < Q_stab = 209.4), the system is bistable between the 1-droplet
    and 2-droplet states. The sharp transitions plotted near Q ≈ 212-214 w^3 k_0 in Figs. 9(b) and 10(b) match the
    spontaneous nucleation threshold of a second droplet (Q*phi_0^A = 4*pi*D_B*gamma*beta: 212.6 in Fig. 9b, 213.9 in
    Fig. 10b) rather than the linear Ostwald-stability threshold.
  citation:
    page: 10
    printed_page: "012317-10"
    quote: "smaller, only a single droplet is stable, see Fig. 10(b)."
    where: Sec. IV.B text, p. 10 & Fig. 9(b), p. 9

