    D = 1 um, k_e = 64, scaling linearly with R rather than remaining Zwicker's intrinsic
    Cahn-Hilliard material width w = 2*sqrt(kappa/b)). Testing the identical mapping against
    Graham's printed SI Eqs. S4-S5 (wetting_tension_profile_eqS5) returns not_verified (log-slope
    error up to 1.2e2; rel_zwicker2015_wetting_printed_vs_flat_interface), independently diagnosing
    graham2023/q_eqS4_S5_wetting_sign_inverted.
    (b) 3D volume-equivalent sphere geometry: zwicker2015/system_radius_Rs (9 ops, R_s =
    (3*V_s/(4*pi))^(1/3), the same 3D spherical conversion used for droplet radii R_bar in Eqs. 20
    and 23) scales identically with graham2023/effective_spherical_diameter (5 ops, D = (a*b^2)^(1/3),
    Methods p. 15) to 2.2e-13 under V_s = (pi/6)*a*b^2*1e-18 [m^3] with exact factor-of-2 ratio
    D = 2*R_eff (rel_zwicker2015_effective_diameter_scales_system_radius), in contrast to Graham's
    2D simulation area conservation (4*a*b = D^2, which shrinks 3D prolate volume by 1/sqrt(AR),
    losing 68.2% at AR = pi^2).
    (c) Excluded too_plain & disjoint models: graham2023/droplet_surface_energy_eqS12 (2 ops,
    too_plain; 2D line tension gamma_I [pN] * perimeter L [um]) cannot be non-tautologically linked
    to zwicker2015/surface_tension_gamma (3D Cahn-Hilliard tension [J/m^2]; zwicker2015 declares no
    total surface-energy model 4*pi*R^2*gamma), though 2D-to-3D energy parity gamma_3D = gamma_I/D
    maps Graham's gamma_I = 1-15 pN (D = 1-2.86 um) to 0.35-15 uN/m (5.0 uN/m at D = 1 um, 5 pN),
    matching canonical biomolecular condensate tensions. All elastic actin-ring bending, 2D-ellipse
    SLSQP, and polymerization models in graham2023 are mathematically disjoint from zwicker2015's
    3D spherical active-emulsion coarsening and stability models.
    (3) Biophysical contrast — chemically active emulsions stabilized against Ostwald ripening vs.
    passive equilibrium VASP LLPS mechanically deformed by actin rings:
    (a) Zwicker 2015 studies strictly spherical (AR = 1) 3D droplets whose phase-separating
    material B undergoes fuel-driven, detailed-balance-breaking chemical interconversion A <-> B
    (Eq. 4), suppressing diffusive Ostwald ripening above R_stab = (3*D_B*gamma*beta/(2*k_b))^(1/3)
    ~ (D_B*w/k_b)^(1/3) (Eq. 19; first-order binary emulsions) or via localized catalytic cores
    Q > Q_stab (Eq. 25; ternary autocatalytic emulsions), while explicitly neglecting hydrodynamics
    and coalescence (pp. 2, 11).
    (b) Graham 2023's VASP droplets undergo purely passive equilibrium LLPS (3% PEG8k crowding +
    VASP tetramerization, k_f = k_b = 0 for VASP), showing classic passive-condensate dynamics:
    hydrodynamic fusion/re-rounding in ~1 s (Fig. 1d, 0-924 ms; eta/gamma_3D ~ 1 s/um), broad
    polydisperse diameters (D = 1-7 um, median 2.86 um, max 7.22 um, n = 1656), and diffusive FRAP
    exchange (t_1/2 = 18 +/- 3 s, D_VASP ~ 0.0101 um^2/s). Suppressing passive Ostwald ripening at
    median R = 1.43 um via Eq. (19) would require active VASP turnover k_b >= 8.6e-6 s^-1 (dense-
    limited) to 0.026 s^-1 (dilute-limited), completely absent from Graham's assay; 10% PEG halts
    coalescence by viscoelastic gelation (FRAP ~2%) rather than chemical turnover and blocks rod
    formation.
    (c) The sole nonequilibrium chemistry in graham2023 — ATP-driven polymerization of client
    G-actin into stiff F-actin (23 +/- 3 nm/s, L_p = 17.73 um, zero F-actin FRAP turnover k_b ~ 0)
    — acts in the opposite physical direction from Zwicker's emulsion stabilization: it amplifies
    droplet-to-droplet actin heterogeneity via monomer competition (analogous to Zwicker's unstable
    core-free Q = 0 autocatalytic regime, Sec. IV.A) and drives elastocapillary symmetry breaking
    from spheres to ellipses and rods (AR > 15) when bundle bending rigidity overcomes droplet
    surface tension. See also graham2023/q_zwicker2015_modelatlas_and_passive_vs_active_droplet_contrast.
