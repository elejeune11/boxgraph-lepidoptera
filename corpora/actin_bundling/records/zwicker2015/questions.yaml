  text: >
    Cross-paper ModelAtlas synthesis with hannezo2015 (Hannezo et al., PNAS 112:8620-8625, 2015;
    both papers published in July 2015, neither cites the other, no cited.yaml links) establishes
    exact mathematical bridges for turnover/reaction-arrested finite-wavelength patterning alongside
    six irreducible structural contrasts.
    Verified bridges in zwicker2015/relations.yaml (8 verified, 5 diagnostic not_verified):
    (1) Exact shared turnover/reaction-diffusion screening length l = sqrt(D_B/(k_f + k_b)) =
    sqrt(D*tau) = l_t (same_as verified symbolically; and Zwicker Eq. 16 dilute droplet radius
    R_bar = sqrt(3*k_f/k_b)*l scales identically with l_t in D and tau at fixed k_f/k_b).
    (2) Exact long-wavelength O(q^4) expansion (series: q -> 0, 5) and vanishing-viscosity limit
    (eta -> 0) of Hannezo SI Eq. (7) reduce identically to Zwicker Appendix F Eq. (F1_corrected)
    under D_B = D, k_f + k_b = 1/tau, c_spin = chi - 1, and w = 2*l_h*sqrt(chi) (showing active
    hydrodynamic viscosity D*chi*l_h^2 plays the exact role of Cahn-Hilliard interfacial stiffness
    D_B*w^2/4).
    (3) Exact all-wavenumber factorization at finite turnover:
    lambda_H(q) = lambda_Z^corr(q) / (1 + l_h^2*q^2) identically for all q under D_B = D,
    w = 2*l_h = 2*sqrt(eta/xi), k_f + k_b = 1/tau, and c_spin = chi - 1 - phi (generalizing the
    Bois-Frohoff passive factorization to finite turnover phi = (l_h/l_t)^2). Both dispersions thus
    share the exact same unstable band [q_-, q_+], onset threshold chi_c = (1 + sqrt(phi))^2 <->
    c_spin = w/l = 2*sqrt(phi), and finite-domain mode thresholds chi_i^(0), with uniform relative
    difference (l_h*q)^2/(1 + (l_h*q)^2) (< 3.5% across Drosophila cortical scales).
    (4) Exact peak-growth-rate identity: evaluating Hannezo Eq. (7) at q_max = sqrt((sqrt(chi) - 1)/l_h^2)
    yields Zwicker Eq. (F1_corrected)'s lam_max identically under w = 2*l_h, k_f + k_b = 1/tau,
    and c_spin = 2*(sqrt(chi) - 1) for 1 < chi < 25/16.
    (5) Universal turnover-arrested linear-onset wavelength family: Hannezo Main Eq. (3)
    lambda_c = 2*pi*(l_h*l_t)^(1/2) and corrected SI 1/q_c join Zwicker Appendix F's marginal mode
    lambda_c = pi*sqrt(2)*(w*l)^(1/2) (homogeneous_onset_wavelength_eqF1) under w = 2*l_h and
    k_f + k_b = 1/tau — notably invariant to printed Eq. (F1)'s q^2 factor-of-2 error because
    marginal q_c = (gamma_0/B)^(1/4) depends only on the q^0 sink and q^4 stiffness.
    (6) Cross-paper diagnostics independently flag both Zwicker's printed Appendix F factor-of-2
    error (eqF1 fails O(q^4) series, eta -> 0 limit, and lam_max by 4x; q_appF_factor_of_2_error)
    and Hannezo SI p. 11's extraneous factor of pi in printed 1/q_c (factor 1/pi = 0.31831;
    hannezo2015/q_si_inv_qc_extra_pi).
    Six irreducible structural contrasts (explaining why no other model pairs are linked):
    (i) Shape-match false positive: hannezo2015/critical_inverse_wavenumber_si_corrected and
    zwicker2015/autocatalytic_emulsion_solver share input/output dimensional shapes (length from
    diffusivity, length, and rates) purely superficially — Hannezo computes a closed-form 1D linear
    onset wavenumber while Zwicker solves nonlinear 3D sharp-interface ternary autocatalytic
    droplet radii with localized catalytic cores (Q_1, Q_2) and finite-volume mass conservation.
    (ii) Bounded vs unbounded driving & hard upper turnover cutoff: Hannezo's active stress chi is
    unconstrained so linear instability chi_c = (1 + sqrt(phi))^2 exists for all phi > 0 (and
    low-friction chaos arises for phi > (2*pi)^4), whereas Zwicker's chemical rates simultaneously
    fix k_f + k_b and phi_0^B = k_f/(k_f + k_b), bounding c_spin <= 1/2 (mapping to chi_max = 25/16
    in the peak dictionary or 3/2 in the O(q^4) series dictionary) and imposing a hard upper
    turnover cutoff (k_f + k_b)_max = k_0/4 (phi_max = 1/16 under w = 2*l_h; printed Eq. F2 gives
    k_0 <-> phi = 1/4) above which the homogeneous state is unconditionally stable.
    (iii) Three-tier turnover length-scale hierarchy (1/4 vs 1/3 vs 1/2): for w = 2*l_h << l = l_t,
    both papers share the linear onset wavelength lambda_c ~ (l_h*l_t)^(1/2) ~ tau^(1/4), whereas
    Zwicker's strongly nonlinear 3D sharp-interface Ostwald-ripening arrest balances Gibbs-Thomson
    capillary coarsening D_B*gamma*beta/R^3 against bulk turnover -(2/3)*k_b (Eqs. 18-19), giving
    R_stab ~ (w*l^2)^(1/3) ~ k_b^(-1/3) (rel_hannezo2015_lambda_c_vs_Rstab_eq19_scaling is
    not_verified with exponent gap 1/12 = 0.0833 in all four variables D, tau, eta, xi), and dilute
    single droplets scale as R_bar ~ l ~ k_b^(-1/2) (Eq. 16). Hannezo's 1D active-gel PDE lacks
    equilibrium surface tension and 3D capillary coarsening, keeping ring spacing near tau^(1/4).
    (iv) Non-local advective hydrodynamics vs local gradient-flow phase separation: Hannezo's
    non-variational Brinkman advection (-eta*d_xx + xi)*v = chi*d_x rho produces a non-self-adjoint
    steady-state operator, a tricritical point at phi = 1/4, and spatiotemporal merging-emerging
    chaos when nonlinear turnover epsilon > 0 makes R''(rho_0) < 0; Zwicker's local Cahn-Hilliard
    Eq. (3b) and corrected Appendix D Jacobian have strictly real spectra and stationary emulsions.
    (v) Autocatalytic second-order kinetics and catalytic cores (Zwicker Sec. IV, Eqs. 22-25) have
    no counterpart in Hannezo's linear first-order actin treadmilling model.
    (vi) Symbol collisions: chi (active Peclet contractility in hannezo2015 vs multi-droplet
    stability number Eq. 21 in zwicker2015), phi (turnover ratio (l_h/l_t)^2 in hannezo2015 vs
    volume fraction phi^B in zwicker2015), and l/L (cell length l and hydrodynamic length L in
    hannezo2015 vs reaction-diffusion length l in zwicker2015).
