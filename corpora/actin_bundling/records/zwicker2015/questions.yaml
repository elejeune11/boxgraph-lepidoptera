  text: >
    Cross-paper ModelAtlas synthesis with bois2011 (Bois, Jülicher & Grill, PRL 106:028103, 2011;
    neither paper cites the other despite shared co-author F. Jülicher and shared Turing 1952
    citation, and neither data.yaml has any from_source link to the other, so 0 cited.yaml links
    are added) closes the 4-paper active-turnover and passive-conserved commutative squares across
    bois2011, hannezo2015, frohoff2021, and zwicker2015 while documenting seven irreducible
    physical and structural contrasts.
    Verified bridges in zwicker2015/relations.yaml (11 verified, 5 diagnostic not_verified):
    (1) Characteristic scales: Zwicker's short-range interface width w = 2*sqrt(kappa/b) scales
    identically with Bois's hydrodynamic screening length ell = sqrt(eta/gamma) under kappa/b <->
    eta/gamma (honoring w = 2*ell in the dispersion factorization); Zwicker's reaction-diffusion
    length l = sqrt(D_B/(k_f + k_b)) shares the same Helmholtz screening-operator scaling
    (1 - L^2*nabla^2) as ell (recorded as scales_as rather than same_as so chemical turnover length
    l = l_t and hydrodynamic length ell = l_h remain separate ModelAtlas families whose square
    ratio phi = (ell/l)^2 = tau_D*(k_f + k_b) governs turnover arrest); and Zwicker's interface
    diffusion rate k_0 = D_B/w^2 scales identically with Bois Eq. (12)'s passive diffusion rate
    lambda(k = 1/w, Pe = 0) = -D/w^2 = -1/(4*tau_D) (reciprocal of bois2011/diffusive_timescale
    tau_D = ell^2/D under w = 2*ell, D_B = D).
    (2) Active finite-turnover linear dispersion (closing the bois2011-hannezo2015-zwicker2015
    triangle): Bois Eq. (15) (N = 1, single_species_rda_dispersion_eq15) yields Zwicker Appendix F
    Eq. (F1_corrected) identically via O(k^4) small-wavenumber expansion (series: k -> 0, 5) and
    vanishing hydrodynamic length reduction (ell -> 0 at finite k) under D_B = D, k_f + k_b = -dR/dc,
    c_spin = P_eff - 1 (P_eff = Pe*c_0*df_dc in (0, 3/2)), and w = 2*ell*sqrt(P_eff). At arbitrary
    wavenumber k, Bois Eq. (15) factors identically as lambda_Bois15(k) = lambda_Z^corr(k)/(1 +
    ell^2*k^2) under w = 2*ell, D_B = D, k_f + k_b = -dR/dc, and c_spin = P_eff - 1 - phi (sharing
    exact unstable band [k_-, k_+], marginal onset wavenumber q_c = [(-dR/dc)/(D*ell^2)]^(1/4),
    and onset threshold P_eff,c = (1 + sqrt(phi))^2 <-> c_spin = w/l = 2*sqrt(phi), with uniform
    relative error (k*ell)^2/(1 + (k*ell)^2) <= 1.92% across cortical scales). At its fastest-growing
    wavenumber k_max = sqrt(sqrt(P_eff) - 1)/ell, Bois Eq. (15) reproduces Zwicker Eq. (F1_corrected)'s
    lam_max symbolically under w = 2*ell and c_spin = 2*(sqrt(P_eff) - 1) for 1 < P_eff < 25/16.
    (3) Passive conserved limit (k_f, k_b -> 0) and exact Hill-to-double-well equivalence (closing
    the bois2011-frohoff2021-zwicker2015 passive triangle): identifying the odds ratio
    c_0 = k_f/k_b = phi_0^B/(1 - phi_0^B) makes Bois's Hill active-stress function f(c_0) =
    c_0/(1 + c_0) equal phi_0^B identically, so at Pe = 6 Bois's active driving Pe*c_0*f'(c_0) - 1
    (= Eq. 10 potential curvature ell^2*V''(ln c_0)) equals Zwicker's negative quartic double-well
    curvature -f''(phi_0^B)/b = 6*phi_0^B*(1 - phi_0^B) - 1 = c_spin identically across all
    compositions (sharing spinodal bounds 2 - sqrt(3) < c_0 = k_f/k_b < 2 + sqrt(3)). Zwicker
    Eq. (F1_corrected) reduces to Bois Eq. (12) under both arbitrary-composition (D_B -> oo, w -> 0)
    and explicit vanishing-rate (k_f -> 0, k_b -> 0, w -> 0) limits, and its dimensionless
    lam_q_norm reduces with unit prefactor to single_species_dispersion_hill under Frohoff
    Appendix A's k*ell = q*w/sqrt(2).
    (4) Classic 2-species Turing ASDM determinant isomorphism (closing the bois2011/asdm_dispersion_pe0-
    frohoff2021/eq12-zwicker2015/eqF1_corrected Turing triangle): under D_B = w = 1, q =
    (4*D_a/D_s)^(1/4)*k*ell, k_f + k_b = rho_a*rho_s, and c_spin = (rho_a - (D_a/D_s)*rho_s)/(2*sqrt(D_a/D_s)),
    Zwicker Eq. (F1_corrected)'s lam_q_norm equals -det(tau_D*A_ASDM) identically across all four
    ASDM parameters, matching stationary neutral manifolds, critical wavenumbers, and Turing thresholds.
    (5) Five independent cross-paper diagnostics against printed zwicker2015/homogeneous_dispersion_eqF1
    (O(k^4) series, ell -> 0 limit, lam_max 4x active error, passive eq12 factor-of-2 error, and
    ASDM determinant log-slope mismatch) all return not_verified, independently confirming
    zwicker2015/q_appF_factor_of_2_error.
    Seven irreducible physical/structural contrasts (explaining rejected links):
    (i) Spurious shape-match rejection: bois2011/single_species_dispersion_eq12 and
    zwicker2015/autocatalytic_emulsion_solver share dimensional port shapes (rate from diffusivity
    and length) purely superficially — Bois computes a closed-form 1D conserved linear active-fluid
    dispersion relation with Brinkman hydrodynamics and zero chemical reactions, whereas Zwicker
    numerically solves nonlinear 3D sharp-interface ternary autocatalytic multi-droplet steady
    states and coarsening with localized catalytic cores (Q_1, Q_2) and finite-volume mass
    conservation. No relation is entered between them.
    (ii) Non-local Brinkman hydrodynamic advection vs local gradient-flow Cahn-Hilliard phase
    separation: Bois's 1/(1 + k^2*ell^2) kernel derives from 1D momentum balance (-eta*d_xx + gamma)*v
    = d_x(sigma_act) driving steady advective flows (v = D*d_x ln c, Eq. 8) balanced against
    Fickian diffusion, whereas Zwicker explicitly neglects hydrodynamics (p. 2, p. 11) and evolves
    conserved fields by local thermodynamic chemical-potential gradients d_t phi^B = m_B*nabla^2(mu^B -
    kappa*nabla^2 phi^B) + s with interfacial surface tension gamma.
    (iii) Nonlinear coarsening vs 3D Ostwald-ripening arrest: in Bois's conserved 1D active fluid
    (Eqs. 1-13, Fig. 4, R = 0), multipeaked states are unstable and coarsen to a single peak (1D
    Ostwald-ripening analog); in Zwicker's 3D active emulsions (Secs. III-IV), first-order turnover
    arrests Gibbs-Thomson capillary Ostwald ripening (lambda = D_B*gamma*beta/R^3 - 2*k_b/3, Eq. 18)
    above R_stab ~ (w*l^2)^(1/3) ~ k_b^(-1/3) (Eq. 19, distinct from linear onset lambda_c ~
    (w*l)^(1/2) ~ (k_f + k_b)^(-1/4) and dilute single-droplet radius R_bar ~ l ~ k_b^(-1/2), Eq. 16),
    while ternary autocatalytic emulsions require localized catalytic cores Q > Q_stab (Eq. 25) to
    stabilize multiple droplets.
    (iv) Bounded vs unbounded driving & hard upper turnover cutoff: Bois's active driving
    P_eff = Pe*c_0*f'(c_0) is unbounded above so instability exists for any finite turnover rate
    -dR/dc at sufficiently large Pe, whereas Zwicker's double-well spinodal curvature is bounded by
    c_spin <= 1/2 (mapping to P_eff <= 3/2 in the O(k^4) series, P_eff <= 25/16 in the peak map,
    and Pe = 6 for Hill stress), enforcing a hard upper turnover cutoff (k_f + k_b)_max = k_0/4
    (printed Eq. F2: k_0) above which the homogeneous state is unconditionally stable.
    (v) Hydrodynamic 2-species ASDM (Pe > 0) and oscillatory instabilities: Bois's active ASDM
    (Eqs. 14-15, Fig. 5) combines non-local advective co-transport of both species with cubic
    activator-substrate kinetics and exhibits complex-conjugate Hopf/wave instabilities (Im(lambda)
    != 0 in Regions III-V), whereas Zwicker's 1-field binary Eq. (F1) and corrected Appendix D
    multi-droplet Jacobian have strictly real spectra (q_audit_appD_exact_eigenvalues_always_real).
    (vi) Nonlinear steady-state geometry: Bois's 1D conservative anharmonic oscillator (Eqs. 9-10)
    uses exponential concentration c = exp(u) with no thermodynamic phase coexistence or surface
    tension, whereas Zwicker's 3D droplets obey sharp-interface Gibbs-Thomson Laplace coexistence
    (Eq. 6, App. A) and finite-volume spherical diffusion profiles (App. C Eq. C1).
    (vii) Symbol collisions across records: l (hydrodynamic screening length ell = sqrt(eta/gamma)
    in bois2011 vs chemical reaction-diffusion length l = sqrt(D_B/(k_f + k_b)) in zwicker2015),
    gamma (substrate friction [Pa*s/m^2] in bois2011 vs interfacial surface tension [J/m^2] in
    zwicker2015), beta (boundary-condition factor in {1, 2} in bois2011 vs Laplace-pressure
    coefficient 2/(b*psi) [m^3/J] in zwicker2015), and k (spatial wavenumber [1/m] in bois2011 vs
    second-order autocatalytic rate constant [1/s] in zwicker2015).
