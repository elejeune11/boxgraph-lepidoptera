    output Laplace-shifted volume fractions phi_-^B and phi_+^B separately rather than a bulk
    fluorescence partition coefficient K_p = I_in/I_out).
    (4) [time] (2 graham2023 measured datums vs 0 [time] output ports in zwicker2015):
    vasp_droplet_fusion_time ('about 1' s, approximate hydrodynamic viscoelastic coalescence —
