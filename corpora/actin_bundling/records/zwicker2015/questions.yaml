    activities, fixed-point and monodisperse droplet counts N_max, volume fractions, stability
    number chi, etc.). Specifically, zwicker2015 restricts all droplets to strictly spherical
    geometry (AR = 1; no aspect-ratio or actin-morphology outputs), lacks FRAP tracer-bleaching
    and elongating-bundle fluorescence intensity models, predicts deterministic monodisperse
    steady states (N_max = 1 for passive emulsions) rather than polydisperse diameter histograms,
