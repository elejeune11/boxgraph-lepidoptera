  text: >
    No cross-record validations are entered in validations.yaml between zwicker2015 and graham2023
    (0 entries in both directions; neither paper cites the other — zwicker2015 precedes graham2023
    by 8 years and graham2023 cites zero Zwicker papers across all 52 main + 14 SI references):
    Direction 1 (graham2023's 31 runnable models [40 output ports] against zwicker2015's 108 total
    datums): zwicker2015 is a purely theoretical and computational continuum-physics paper
    containing exactly 0 origin: measured entries in zwicker2015/data.yaml (30 assumed
    dimensionless parameters, 5 derived ratios/fractions, 4 reported theoretical bounds and PDE
    grid sizes, 56 predicted analytical/numerical curves and fixed-point counts, 11 axisymmetric
    PDE simulation run curves, and 2 exponential fits to PDE simulation runs fig5a_dV and
    fig5c_dV). Consequently graham2023 has zero empirical measurements in zwicker2015 to validate
    against (graham2023/validations.yaml retains only its preexisting nastkolb2022 validation).
    Direction 2 (zwicker2015's 81 runnable models [204 output ports] against graham2023's 38
    origin: measured datums = 7,752 port-datum pairs, of which 3,505 match dimensionally: 78
    [length] + 3 [length]/[time] + 3,424 dimensionless): 0 valid CrossValidation entries. Two
    fundamental barriers preclude honest empirical testing without fabricating unmeasured active
    kinetics or violating quantity identity: (a) graham2023's VASP droplets undergo strictly
    passive, equilibrium LLPS induced by 3% (w/v) PEG-8000 crowding and VASP tetramerization at
    constant temperature with zero active chemical interconversion of the droplet-forming species
    VASP (k_f = k_b = 0, no active A <-> B turnover or catalytic cores Q_i); and (b) graham2023
    measures none of zwicker2015's continuum Cahn-Hilliard or reaction-diffusion parameters
    (bulk free-energy modulus b, gradient coefficient kappa, interface width w = 2*sqrt(kappa/b),
    3D surface tension gamma, capillary length gamma*beta, volume fractions psi/phi_0^B/phibar,
    dilute-phase diffusivity D_B, system volume V_s corresponding to counted droplets, or coarsening
    aging time t). Every audited dimension group is excluded as follows:
    (1) [length] (26 zwicker2015 ports x 3 graham2023 measured datums = 78 pairs; targets:
    droplet_diam_range_obs '1 to 7' um, droplet_diam_median_20uM '2.86' um, droplet_diam_max_20uM
    '7.22' um, actin-free 20 uM VASP, n = 1656 in Extended Data Fig. 4e): all 3 measured datums
    are droplet_diameter (D = 2*R), whereas zwicker2015's 26 [length] ports output droplet_radius
    R (12 ports), critical_droplet_radius R_crit (3), stability_threshold_radius R_stab (2),
    capillary_length gamma*beta (5), interface_width w (1), reaction_diffusion_length l (1),
    system_radius R_s (1), and spinodal onset length scales inv_qc and lambda_c (2) — none of
    which equals droplet_diameter. Furthermore, all active binary and autocatalytic radius models
    (binary_single_radius_eq16, binary_stability_radius_eq19, binary_dense_volume_eq20,
    binary_single_droplet_ss_solver, binary_multidroplet_stability_solver, Rbar_kb_scaling,
    Rstab_kb_scaling, autocatalytic_volume_eq23, autocatalytic_critical_radius,
    autocatalytic_emulsion_solver, reaction_diffusion_length_l, homogeneous_onset_wavelength_eqF1)
    require nonzero active rates (k_f, k_b, k, Q > 0) and diverge or become undefined (0/0) at
    k_f = k_b = 0; passive lifshitz_slyozov_scaling_corrected (<R> ~ w*(t*D_B/w^2)^(1/3),
    prefactor: unknown) lacks time-resolved <R(t)> measurements (unstated aging time t, unmeasured
    dilute D_B and w, single-snapshot diameter median/range/max, and coarsening proceeds via ~1 s
    hydrodynamic Brownian coalescence explicitly neglected on pp. 2 and 11 rather than pure
    Ostwald ripening; lifshitz_slyozov_scaling_printed also omits factor w);
    binary_critical_radius_approx (R_crit = gamma*beta/phi_0^B) predicts an unstable nucleation
    radius rather than macroscopic droplet diameters with neither gamma*beta nor phi_0^B measured;
    and microscopic/domain length-scale models (capillary_length_*, interface_width_w,
    system_radius_Rs, unnormalize_*_params) do not predict individual droplet diameters (and
    graham2023 reports no measured droplet volumes paired with droplet_diam_median_20uM).
    (2) [length]/[time] (3 zwicker2015 ports x 1 graham2023 measured datum = 3 pairs; target:
    elongation_rate_mean_text = '23 +/- 3' nm/s): linear 1D barbed-end ATP-driven polymerization
    speed of F-actin rods (AR > 15, Fig. 5h), physically incompatible with isotropic 3D spherical
    droplet radial growth dR/dt in binary_droplet_growth_eq13, autocatalytic_growth_eq22, and
    coarse_grained_droplet_eq9_12 (all inputs also unmeasured).
    (3) dimensionless (107 zwicker2015 ports x 32 graham2023 measured datums = 3,424 pairs):
    zero physical-quantity overlap between graham2023's 7 dimensionless observable families —
    morphology_abundance (11: fig2d_*, fig3d_*, fig6d_*, edfig4c_*), frap_recovery_fraction (5:
