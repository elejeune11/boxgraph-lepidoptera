    - binary_cahn_hilliard_1d_pde
  text: >
    Appendix F Eq. (F1) prints lambda(q) = 2*D_B*q^2 * [(4*k_f*k_b - k_f^2 - k_b^2)/(k_f + k_b)^2 - (w^2/8)*q^2] - k_f - k_b,
    whose q^2 coefficient is twice the exact linearization of Eq. (3b) with the stated binary free energy
    f(phi^B) = (b/2)*(phi^B)^2*(1 - phi^B)^2, D_B = m_B*b, and w = 2*(kappa/b)^(1/2) (so kappa = b*w^2/4).
    The exact dispersion relation is lambda(q) = D_B*q^2 * [(4*k_f*k_b - k_f^2 - k_b^2)/(k_f + k_b)^2 - (w^2/4)*q^2] - k_f - k_b
    (matching the q^4 term -D_B*w^2*q^4/4 of Eq. F1, but with half the q^2 term). Because Eq. (F2) is derived
    directly from printed Eq. (F1), it overpredicts the upper reaction-rate cutoff for linear instability by a
    factor of 4: printed k_f + k_b < D_B/w^2 = k_0 versus exact k_f + k_b < D_B/(4*w^2) = k_0/4. Direct 1D
    pseudospectral integration of Eq. (3b) (binary_cahn_hilliard_1d_pde) confirms the exact dispersion relation
    and the cutoff (k_f + k_b)/k_0 = 0.25 (e.g., at k_f = k_b = 0.2*k_0, printed Eq. F1 predicts instability
    while Eq. 3b is strictly stable). Visual inspection of Fig. 6(b) indicates the dashed curve was plotted
    using printed Eq. (F2) (apex near k_f = k_b = 0.5*k_0).
  citation:
    page: 12
    printed_page: "012317-12"
    quote: "This equation only has solutions for kf + kb < DB /w 2 ,"
    where: Appendix F, Eqs. (F1)-(F2)

