    for larval, Src42A, moesin RNAi, and kkv1 conditions). Hannezo measures turnover time tau =
    15 +- 7 s ([time]) rather than separate forward/backward conversion rates k_f, k_b (1/[time]),
    and never measures a Cahn-Hilliard diffuse phase-boundary width w = 2*sqrt(kappa/b) — nor even
    its own cortical hydrodynamic length l_h = sqrt(eta/xi) (lh_derived_main ≈ 0.1 um is derived
    from external non-Drosophila literature viscosity/thickness/friction, and lh_inverted_si =
    10^-8 m [exact 8.175 nm] is circularly back-solved from ring_wavelength_embryo_wt itself).
    Hydrodynamic screening length l_h and equilibrium Cahn-Hilliard interface width w are distinct
    physical quantities (and differ by a factor of 2 in the formal dispersion map w = 2*l_h), so
    they cannot be mapped in CrossValidation `quantities:`; running homogeneous_onset_wavelength_eqF1
    as a CrossValidation would require hand-computing 3/4 inputs (w, k_f, k_b) from hannezo2015
    into zwicker2015/added.yaml, duplicating the already-checked Synthesis same_as cross-check.
    Moreover, Zwicker's homogeneous spinodal onset requires k_f/(k_f + k_b) = phi_0^B in (0.211,
    0.789) (absent at Zwicker's own binary droplet ratio k_b = 10*k_f, phi_0^B = 1/11) and is
    driven by passive double-well liquid-liquid demixing with hydrodynamics explicitly neglected
    (pp. 2, 11), directly contradicted by Hannezo's experiments proving myosin-II contractility is
    essential (250 uM Y-27632 abolishes rings, Fig. 2C) and ECM-cortex friction controls spacing
    (Src42A, moesin RNAi, kkv1, Figs. 3-4).
    (b) binary_stability_radius_eq19 (R_stab = [3*D_B*gamma*beta/(2*k_b)]^(1/3)) and
    binary_single_radius_eq16 (R_bar = sqrt(3*D_B*k_f/((k_f + k_b)*k_b)) = sqrt(3*k_f/k_b)*l) fail
    on both quantity and inputs: R_stab (3D spherical droplet minimum threshold radius arresting
    Gibbs-Thomson Ostwald ripening) and R_bar (isolated 3D spherical droplet equilibrium radius)
    are not 1D circumferential actin-ring center-to-center wavelengths; neither capillary length
    gamma*beta nor separate rates (k_f, k_b) are measured in Drosophila trachea; R_bar varies
    arbitrarily across (0, 0.775] um with the unmeasured ratio k_f/k_b (and at Main p. 3's
    w = 200 nm, k_b = 10*k_f violates Eq. 17 droplet existence, k_b/k_0 = 0.0606 > 0.0120); and
    R_stab ~ tau^(1/3) lies in a distinct scaling class from linear onset lambda_c ~ tau^(1/4)
    (already documented in rel_hannezo2015_lambda_c_vs_Rstab_eq19_scaling).
    (c) reaction_diffusion_length_l outputs screening length l = sqrt(D_B/(k_f + k_b)) (not ring
    wavelength), whose counterpart hannezo2015/lt_derived_main = 0.8 +- 0.5 um is origin: derived
    (not measured) and already automatically cross-checked via same_as.
    (2) Both measured ring counts per cell (rings_per_cell_embryo_wt = "15 to 20",
    rings_per_cell_kkv1 = "~1"): Zwicker's droplet-count models (binary_stability_number_eq21 N_max,
