    - unnormalize_ternary_params
    - autocatalytic_emulsion_solver
    - autocatalytic_stability_Qstab_eq25
    - psi_autocat
  text: >
    In Sec. II (pp. 2-3), the continuum interface width w = 2*(kappa/b)^(1/2) satisfies gamma*beta = w*psi/6.
    For the binary fluid (Sec. III, psi = 1), w = 6*gamma*beta identically (stated in Figs. 3 and 4 captions).
    In Sec. IV (psi = 0.1), the captions of Figs. 7, 8, 9, and 10 normalize quantities by w and k_0 = D_B/w^2
    without restating the relation between w and gamma*beta. Quantitative checks reveal two incompatible
    conventions within Sec. IV (differing by a factor of 1/psi = 10): Figs. 7, 8, 9(b), and 10 (coarse-grained
    Eqs. 22 and 25) use gamma*beta = w/6 (reproducing R_crit = 16.7 w, peak Rdot/(w*k_0) = 1.5e-3 in Fig. 7a,
    Q_stab/(w^3*k_0) = 209.4 in Fig. 9b, and R_1 = 110 w, R_2 = 63 w in Fig. 10a), whereas Fig. 9(a) (continuum
    Eq. 3 PDE vs Eq. 24) uses the true continuum relation gamma*beta = w*psi/6 = w/60 (giving lambda/k_0 = 7.0e-5
    and 2.1e-4 at V_bar/w^3 = 10^4). Downstream figure digitization must distinguish these two conventions.
  citation:
    page: 8
    printed_page: "012317-8"
    quote: "parameters are k/k0 = 0.02, kb /k0 = 2 × 10−4"
    where: Figs. 7-10 captions

- id: q_Qc_vs_Qstab_inequality_tension
  kind: possible_error
  about:
    - autocatalytic_nucleation_Qc
    - autocatalytic_stability_Qstab_eq25
  text: >
    On p. 8 col 1, the paper derives the critical catalytic activity for guaranteed nucleation as
    Q_c ≈ 4*pi*D_B*gamma*beta / phi_0^A with phi_0^A = k_b / k (giving Q_c = 4*pi*D_B*gamma*beta*k/k_b).
    On p. 9 col 2, the paper then claims that Q_stab (Eq. 25) is generally larger than Q_c 'in the limit
    phi_0^B ≈ 0 in the parameter regime where droplets form (k > k_b / phibar)'. However, evaluating Eq. (25)
    at k_f = 0 (k_s = k*psi) and phi_0^B = 0 gives Q_stab = 4*pi*D_B*gamma*beta*k/k_b, which is IDENTICAL to
    Q_c evaluated at phi_0^A = k_b/k (not larger). The strict inequality Q_stab > Q_c for k > k_b/phibar holds
    only if Q_c is evaluated at the droplet-free homogeneous pre-nucleation state phi_0^B = 0, phi_0^A = phibar
    (giving Q_c,hom = 4*pi*D_B*gamma*beta/phibar < 4*pi*D_B*gamma*beta*k/k_b = Q_stab when k > k_b/phibar).
  citation:
    page: 9
    printed_page: "012317-9"
    quote: "Generally, the stability threshold Qstab is"
    where: Sec. IV.B text, p. 9

