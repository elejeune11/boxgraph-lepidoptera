notes: >
  In scope: the entire analytical and numerical theory of active emulsions in Zwicker, Hyman,
  and Jülicher (2015), including ternary and binary Cahn-Hilliard free energies (Eqs. 1-2,
  Sec. III p. 4), flat-interface width w and surface tension gamma, Gibbs-Thomson curved-interface
  coexistence (Eq. 6, Appendix A Eqs. A1-A2), reaction-diffusion length scale l and fluxes
  (Eqs. 4, 7-8, 11, Appendix C Eq. C1), general coarse-grained droplet dynamics (Eqs. 9-12),
  binary first-order reaction emulsions (Eqs. 13-21, Appendix D Eqs. D1-D4, Fig. 6b bound,
  scaling laws on pp. 7 and 10), binary homogeneous-state linear stability (Appendix F
  Eqs. F1-F2), ternary autocatalytic emulsions with and without catalytically active cores
  (Eqs. 22-25, Appendix B Eq. B1, Appendix G Eqs. G1-G3, unequal-core volume ratio), and
  reconstructed numerical solvers for 1D and 3D axisymmetric cylindrical Cahn-Hilliard
  reaction-diffusion PDEs (Eq. 3b, Appendix E) and multi-droplet steady-state/stability systems.
  Figures inventory (left to the dedicated digitize stage): Figs. 1 and 2 are qualitative
  schematics with no quantitative axes; Figs. 3(a)-(d), 4(a)-(b), 5(a)-(d), 6(a)-(b),
  7(a)-(b), 8(a)-(b), 9(a)-(b), and 10(a)-(b) contain quantitative model curves, phase
  portraits, stability diagrams, and PDE simulation markers (with legend equation-number
  typos in Figs. 5b, 5d, and 9a, and an unstated change in the normalization length scale w
  between Fig. 9a and Figs. 7, 8, 9b, 10).
  Key algebraic and verification findings documented via variant_of models, relations.yaml,
  and questions.yaml: (1) Appendix F Eq. (F1) doubles the q^2 coefficient relative to the
  exact linearization of Eq. (3b) with f(phi^B) = (b/2)(phi^B)^2(1-phi^B)^2 and w = 2(kappa/b)^(1/2),
  causing Eq. (F2) to overpredict the upper reaction-rate cutoff (k_f + k_b < D_B/w^2) by a
  factor of 4 (exact: D_B/(4 w^2)); (2) Eq. (24) prints k instead of k_s = k_f + k*psi in the
  denominator of the catalytic-core term (off by factor 1/psi = 10 for k_f = 0, psi = 0.1,
  and singular at k = 0), inconsistent with Appendix G Eq. (G2) and Eq. (25); (3) Appendix B
  Eq. (B1) has an extra factor k*phibar/k_b on the surface-tension correction term compared to
  the exact linear expansion of the Appendix B quadratic equation; (4) Appendix D Eq. (D3b)
  includes a spurious factor of N in J_{0i}, double-counting N when inserted into Eq. (D4a);
  (5) Sec. III.B.3 (p. 7) prints Lifshitz-Slyozov scaling <R> proportional to (t D_B / w^2)^(1/3),
  which is dimensionless on the RHS instead of having dimension of length (missing factor w);
  (6) Sec. IV figures inconsistently normalize by w = 6*gamma*beta in Figs. 7, 8, 9b, 10 vs.
  the continuum interface width w = 6*gamma*beta/psi in Fig. 9a (factor of 10 when psi = 0.1);
  (7) p. 8 col 1 defines Q_c using phi_0^A = k_b/k, which makes Q_c identically equal to
  Q_stab(phi_0^B = 0) from Eq. (25), in tension with p. 9 col 2 claiming Q_stab > Q_c for
  k > k_b/phibar (which requires pre-nucleation phi_0^A = phibar).
