# --- 6.1 Shared Turnover / Reaction-Diffusion Screening Length Scale ---

- id: rel_hannezo2015_reaction_diffusion_length_same_as_lt
  kind: same_as
  a: zwicker2015/reaction_diffusion_length_l
  b: hannezo2015/turnover_diffusion_length
  mapping:
    D: "D_B * 10**12"
    tau: "1 / (k_f + k_b)"
  output_map:
    l_t: l
  regime:
    D_B: [1.0e-14, 1.0e-11]
    k_f: [1.0e-3, 1.0]
    k_b: [1.0e-3, 1.0]
  provenance: proposed
  reason: >
    Both papers balance Fickian diffusion against first-order linear chemical turnover around a
    uniform steady state (-rho/tau in Hannezo Main Eq. 1; -(k_f + k_b)*phi^B in Zwicker Eq. 3b /
    App. C Eq. C1), producing the identical reaction-diffusion screening length l = sqrt(D_B/(k_f + k_b))
    = sqrt(D*tau) = l_t above which concentration perturbations relax predominantly by turnover
    rather than diffusion.
  assumptions:
    - "Identifies Fickian diffusivity D = D_B (converting m^2/s to um^2/s) and total first-order relaxation rate 1/tau = k_f + k_b."

- id: rel_hannezo2015_lt_scales_as_binary_single_radius_eq16
  kind: scales_as
  a: hannezo2015/turnover_diffusion_length
  b: zwicker2015/binary_single_radius_eq16
  mapping:
    D_B: "D / 10**12"
    k_f: "1 / (11 * tau)"
    k_b: "10 / (11 * tau)"
  regime:
    D: [0.005, 0.5]
    tau: [1.0, 100.0]
  provenance: proposed
  reason: >
    In Zwicker's dilute binary active emulsion (Eq. 16), the stationary single-droplet radius
    R_bar = sqrt(3*D_B*k_f/((k_f + k_b)*k_b)) = sqrt(3*k_f/k_b)*l is proportional to the
    reaction-diffusion length l = l_t = sqrt(D*tau) at fixed reaction ratio k_f/k_b (here
    k_b = 10*k_f, phi_0^B = 1/11 as in Zwicker Figs. 3-6, with k_f + k_b = 1/tau), sharing exact
    power-law exponents +1/2 in both diffusivity D and turnover time tau (k_b^(-1/2)).
  assumptions:
    - "Fixed rate ratio k_b/k_f = 10 (phi_0^B = 1/11) with total relaxation rate k_f + k_b = 1/tau and D_B = D."

# --- 6.2 Linear Dispersion Relation: Active Gel SI Eq. (7) <-> Active Cahn-Hilliard App. F Eq. (F1) ---

- id: rel_hannezo2015_eq7_series_derived_eqF1_corrected
  kind: derived_from
  a: hannezo2015/dispersion_relation_eq7
  b: zwicker2015/homogeneous_dispersion_eqF1_corrected
  mapping:
    D_B: "D / 10**12"
    w: "2 * sqrt(sigma_a * eta * 10**12 / (D * xi**2))"
    k_f: "(1 + sqrt(1 - 2 * sigma_a * 10**12 / (3 * xi * D))) / (2 * tau)"
    k_b: "(1 - sqrt(1 - 2 * sigma_a * 10**12 / (3 * xi * D))) / (2 * tau)"
    q: "q * 10**6"
  output_map:
    lam_q: lam
  steps:
    - "series: q -> 0, 5"
    - simplify
  regime:
    tau: [20.0, 200.0]
    D: [0.04, 0.05]
    sigma_a: [4.2e-5, 5.8e-5]
    xi: [1.0e9, 1.1e9]
    eta: [1.0e-7, 1.0e-6]
    q: [1.5, 5.0]
  provenance: proposed
  reason: >
    Symbolically proves that expanding Hannezo SI Eq. (7)'s active-gel dispersion relation
    lambda_H(q) = -1/tau - D*q^2 + (sigma_a/xi)*q^2/(1 + l_h^2*q^2) to fourth order in q (O(q^4))
    yields Zwicker's exact active Cahn-Hilliard dispersion relation Appendix F Eq. (F1_corrected),
    lambda_Z(q) = D_B*q^2*(c_spin - w^2*q^2/4) - (k_f + k_b), identically across all three terms:
    q^0 turnover -(k_f + k_b) = -1/tau, q^2 spinodal/contractile driving D_B*c_spin = D*(chi - 1)
    with chi = sigma_a/(xi*D), and q^4 short-wavelength stabilization D_B*w^2/4 = D*chi*l_h^2
    (identifying effective interfacial width w = 2*l_h*sqrt(chi) and double-well curvature
    c_spin = chi - 1 in (-1, 1/2) for 0 < chi < 3/2).
  assumptions:
    - "Long-wavelength O(q^4) expansion (l_h*q << 1) in the weakly-to-moderately active regime chi = sigma_a/(xi*D) in (0, 3/2), where c_spin = chi - 1 lies inside Zwicker's quartic double-well curvature range (-1, 1/2)."
    - "Preserves physical diffusivity D_B = D, wavenumber q_Z = q_H, and turnover rate k_f + k_b = 1/tau."

