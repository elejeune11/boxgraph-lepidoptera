# ==============================================================================
# 1. Interface Scales, Coexistence, and Flux Limits (Sec. II, App. A & C)
# ==============================================================================
- id: rel_capillary_length_micro_to_gb
  kind: same_as
  a: zwicker2015/capillary_length_from_micro
  b: zwicker2015/capillary_length_gb
  mapping:
    w: "2 * sqrt(kappa / b)"
    psi: "psi"
  regime:
    b: [0.5, 10.0]
    kappa: [1.0e-13, 1.0e-11]
    psi: [0.1, 1.0]
  provenance: stated
  citation:
    page: 3
    printed_page: "012317-3"
    quote: "which is related to the interface width by"
    where: Sec. II.C text, p. 3
  assumptions:
    - "Flat-interface width w = 2*(kappa/b)^(1/2), surface tension gamma = (1/6)*psi^2*(b*kappa)^(1/2), and beta = 2/(b*psi)"

- id: rel_coexistence_eqA1_to_eq6_plus
  kind: reduces_to
  a: zwicker2015/coexistence_exact_eqA1
  b: zwicker2015/gibbs_thomson_eq6
  mapping:
    psi: "psi"
    gamma_beta: "2 * gamma / (b * psi)"
    R: "R"
  output_map:
    phi_plus_B: phi_plus_B
  regime:
    b: [1.0, 10.0]
    psi: [0.5, 1.0]
    gamma: [1.0e-4, 1.0e-3]
    R: [1.0, 10.0]
  limit:
    gamma: "0"
  provenance: stated
  citation:
    page: 11
    printed_page: "012317-11"
    quote: "which result from Eqs. (A1), can be expanded to first order"
    where: Appendix A, Eq. (A2)
  assumptions:
    - "Small surface tension limit gamma << psi*R/beta (vanishing Laplace pressure)"

- id: rel_coexistence_eqA1_to_eqA2_minus
