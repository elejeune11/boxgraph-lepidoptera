- id: rel_bois2011_eqF1_corrected_passive_reduces_hill
  kind: reduces_to
  a: zwicker2015/homogeneous_dispersion_eqF1_corrected
  b: bois2011/single_species_dispersion_hill
  mapping:
    k_l: "q * w / sqrt(2)"
    c0: "1"
    Pe: "4 * (10 * k_f * k_b - k_f**2 - k_b**2) / (k_f + k_b)**2"
  output_map:
    lam_dimless: lam_q_norm
  limit:
    D_B: "oo"
    w: "0"
  regime:
    D_B: [0.5, 2.0]
    w: [0.05, 0.2]
    k_f: [0.4, 1.0]
    k_b: [0.4, 1.0]
    q: [0.5, 2.0]
  provenance: proposed
  reason: >
    Closes the dimensionless passive commutative square with frohoff2021/linear_dispersion_variational_limit:
    under Frohoff Appendix A's exact nondimensionalization (q_F = q*w/sqrt(2) = k*ell, tau = 1/k_0,
    f_1'' = -2*c_spin = 1 - Pe*c_0/(1 + c_0)^2, giving Pe = 4*(1 + 2*c_spin) at c_0 = 1), taking the
    passive long-wavelength limit (D_B -> oo, w -> 0) reduces Zwicker's dimensionless dispersion
    lam_q_norm = lam_q/k_0 identically (with unit prefactor) to Bois's dimensionless Hill dispersion
    lam_dimless = tau_D*lam (Fig. 3a).
  assumptions:
    - "Passive slow-reaction (D_B -> oo) and long-wavelength (w -> 0) limit in the spinodal regime c_spin > 0 (Pe in [5.8, 8.0] at c_0 = 1)."
    - "Frohoff Appendix A wavenumber normalization k*ell = q*w/sqrt(2) reconciling k_0 = D_B/w^2 with 1/tau_D = D/ell^2 at unit prefactor."

# --- 7.4 Two-Species Classic Turing ASDM Determinant <-> One-Species Reactive Cahn-Hilliard ---

- id: rel_bois2011_asdm_pe0_det_scales_eqF1_corrected
  kind: scales_as
  a: bois2011/asdm_dispersion_pe0
  b: zwicker2015/homogeneous_dispersion_eqF1_corrected
  mapping:
    D_B: "1"
    w: "1"
    q: "(4 * Da_over_Ds)**(1/4) * k_l"
    k_f: "(rho_a * rho_s / 2) * (1 + sqrt((1 - (rho_a - Da_over_Ds * rho_s) / sqrt(Da_over_Ds)) / 3))"
    k_b: "(rho_a * rho_s / 2) * (1 - sqrt((1 - (rho_a - Da_over_Ds * rho_s) / sqrt(Da_over_Ds)) / 3))"
  output_map:
    lam_q_norm: det_dimless
  regime:
    k_l: [0.3, 2.0]
    Da_over_Ds: [0.4, 1.0]
    rho_a: [0.5, 0.8]
    rho_s: [0.6, 1.2]
  provenance: proposed
  reason: >
    Formalizes Zwicker Sec. V (p. 11)'s remark connecting active emulsions to Turing patterns and
    closes the bois2011/asdm_dispersion_pe0-frohoff2021/eq12-zwicker2015/eqF1_corrected Turing
    triangle: Bois's Pe = 0 2x2 activator-substrate depletion model stability determinant
    det(tau_D*A) = d*(k*ell)^4 - (rho_a - d*rho_s)*(k*ell)^2 + rho_a*rho_s (with d = D_a/D_s)
    has the exact biquadratic polynomial structure of -lambda_Z^corr(q)/k_0 = (q*w)^4/4 -
    c_spin*(q*w)^2 + (k_f + k_b)/k_0. Under D_B = w = 1, q = (4*d)^(1/4)*k*ell, k_f + k_b = rho_a*rho_s,
    and c_spin = (rho_a - d*rho_s)/(2*sqrt(d)), lam_q_norm = -det_dimless identically across all
    four parameters (k_l, D_a/D_s, rho_a, rho_s), proving identical stationary neutral-stability
    manifolds (det = 0 <-> lam_Z = 0), critical wavenumbers q_c = (rho_a*rho_s/d)^(1/4), and Turing
    onset thresholds (c_spin = sqrt(k_f + k_b) <-> D_a/D_s = (3 - 2*sqrt(2))*rho_a/rho_s).
  assumptions:
    - "Classic reaction-diffusion ASDM (Pe = 0) in parameter window where -1 < c_spin = (rho_a - d*rho_s)/(2*sqrt(d)) < 1/2 (spanning both non-Turing and Turing-unstable regimes)."
    - "Sign reversal lam_q_norm = -det_dimless reflects 2x2 Turing instability det(A) < 0 vs 1D growth rate lambda > 0."

