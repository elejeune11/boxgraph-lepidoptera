  assumptions:
    - "Consistent hydrodynamic length L = sqrt(eta/xi) = w/2 (mapped at unit reference friction xi = 1 Pa*s/m so eta = (w/2)^2), D = D_B, and tau = 1/(k_f + k_b)."

