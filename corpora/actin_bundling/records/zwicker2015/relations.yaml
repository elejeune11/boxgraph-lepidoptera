  reason: >
    Exact algebraic factorization of Hannezo SI Eq. (7) at finite turnover proves
    lambda_H(q) = lambda_Z^corr(q) / (1 + l_h^2*q^2) identically for all wavenumbers q under the
    turnover-shifted dictionary D_B = D, w = 2*l_h = 2*sqrt(eta/xi), k_f + k_b = 1/tau, and
