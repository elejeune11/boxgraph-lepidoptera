- id: rel_bois2011_eq15_exactfactor_approx_eqF1_corrected
  kind: approximated_by
  a: bois2011/single_species_rda_dispersion_eq15
  b: zwicker2015/homogeneous_dispersion_eqF1_corrected
  mapping:
    D_B: "D"
    w: "2 * l"
    k_f: "-(dR_dc / 2) * (1 + sqrt(1 - (2 / 3) * (Pe * c0 * df_dc + l**2 * dR_dc / D)))"
    k_b: "-(dR_dc / 2) * (1 - sqrt(1 - (2 / 3) * (Pe * c0 * df_dc + l**2 * dR_dc / D)))"
    q: "k"
  output_map:
    lam_q: lam
  regime:
    k: [1.5e6, 6.0e6]
    D: [4.0e-14, 5.0e-14]
    dR_dc: [-0.05, -0.005]
    Pe: [1.05, 1.45]
    c0: [0.95, 1.0]
    df_dc: [0.95, 1.0]
    l: [1.0e-8, 3.0e-8]
  tolerance: 0.05
  provenance: proposed
  reason: >
    Exact all-wavenumber algebraic factorization of Bois Eq. (15) at finite turnover proves
    lambda_Bois15(k) = lambda_Z^corr(k) / (1 + ell^2*k^2) identically for all wavenumbers k under
    the turnover-shifted dictionary D_B = D, w = 2*ell, k_f + k_b = -dR_dc, and
    c_spin = P_eff - 1 - phi (where phi = -ell^2*dR_dc/D = (ell/l_RD)^2 = tau_D*(k_f + k_b) > 0),
    directly closing the 4-paper commutative square with hannezo2015/dispersion_relation_eq7.
    Because 1 + ell^2*k^2 > 0 everywhere, the two dispersion relations share the EXACT same
    unstable wavenumber band [k_-, k_+], marginal onset wavenumber k_c = [(-dR_dc)/(D*ell^2)]^(1/4)
    = [4*(k_f + k_b)/(D_B*w^2)]^(1/4) (zwicker2015/homogeneous_onset_wavelength_eqF1), and
    instability threshold P_eff,c = (1 + sqrt(phi))^2 <-> c_spin = w/l_RD = 2*sqrt(phi), with
    uniform relative difference (k*ell)^2/(1 + (k*ell)^2) across stable, unstable, and neutral-
    crossing points (<= 3.1% for k*ell <= 0.18, measured max 1.92% within tolerance 0.05).
  assumptions:
    - "Cortical-scale long-to-intermediate wavelength window with k*ell <= 0.18, dR_dc < 0, and 0 < P_eff - phi < 3/2 (putting c_spin = P_eff - 1 - phi inside Zwicker's double-well range (-1, 1/2))."

- id: rel_bois2011_eq15_kmax_derived_eqF1_corrected_lammax
  kind: derived_from
  a: bois2011/single_species_rda_dispersion_eq15
  b: zwicker2015/homogeneous_dispersion_eqF1_corrected
  mapping:
    D_B: "D"
    w: "2 * l"
    k_f: "-(dR_dc / 2) * (1 + sqrt((5 - 4 * sqrt(Pe * c0 * df_dc)) / 3))"
    k_b: "-(dR_dc / 2) * (1 - sqrt((5 - 4 * sqrt(Pe * c0 * df_dc)) / 3))"
    q: "k"
  output_map:
    lam_max: lam
  steps:
    - "subs: k = sqrt(sqrt(Pe * c0 * df_dc) - 1) / l"
    - simplify
  regime:
    k: [1.0e6, 1.0e7]
    D: [4.0e-14, 4.5e-14]
    dR_dc: [-0.2, -0.02]
    Pe: [1.2, 1.45]
    c0: [0.95, 1.0]
    df_dc: [0.95, 1.0]
    l: [3.0e-8, 1.0e-7]
  provenance: proposed
  reason: >
    Symbolically proves that evaluating Bois Eq. (15) at its exact fastest-growing wavenumber
    k_max = sqrt(sqrt(P_eff) - 1)/ell yields lambda_max^Bois15 = (D/ell^2)*(sqrt(P_eff) - 1)^2 + dR_dc,
    which is IDENTICAL to Zwicker Eq. (F1_corrected)'s peak growth rate
    lambda_max^Z = (D_B/w^2)*c_spin^2 - (k_f + k_b) under D_B = D, w = 2*ell, k_f + k_b = -dR_dc,
    and c_spin = 2*(sqrt(P_eff) - 1) (valid for 1 < P_eff < 25/16 = 1.5625, where c_spin in (0, 1/2)).
    Under this dictionary, both models also share the exact fastest wavenumber k_max = q_max and
    exact onset manifold P_eff,c = (1 + sqrt(phi))^2 <-> c_spin = 2*sqrt(phi), terminating at
    Zwicker's spinodal apex c_spin = 1/2 ((k_f + k_b)/k_0 = 1/4, phi = 1/16).
  assumptions:
    - "Supercritical active-contractility window 1 < P_eff = Pe*c0*df_dc < 25/16 = 1.5625 so c_spin = 2*(sqrt(P_eff) - 1) lies strictly in (0, 1/2)."

- id: rel_bois2011_eq15_kmax_vs_eqF1_printed_lammax
  kind: derived_from
  a: bois2011/single_species_rda_dispersion_eq15
  b: zwicker2015/homogeneous_dispersion_eqF1
  mapping:
    D_B: "D"
    w: "2 * l"
    k_f: "-(dR_dc / 2) * (1 + sqrt((5 - 4 * sqrt(Pe * c0 * df_dc)) / 3))"
    k_b: "-(dR_dc / 2) * (1 - sqrt((5 - 4 * sqrt(Pe * c0 * df_dc)) / 3))"
    q: "k"
  output_map:
    lam_max: lam
  steps:
    - "subs: k = sqrt(sqrt(Pe * c0 * df_dc) - 1) / l"
    - simplify
  regime:
    k: [1.0e6, 1.0e7]
    D: [4.0e-14, 4.5e-14]
    dR_dc: [-0.2, -0.02]
    Pe: [1.2, 1.45]
    c0: [0.95, 1.0]
    df_dc: [0.95, 1.0]
    l: [3.0e-8, 1.0e-7]
  provenance: proposed
  reason: >
    Diagnostic check of the exact peak-growth-rate derivation against Zwicker's printed Appendix F
    Eq. (F1). Expected to be not_verified because printed Eq. (F1)'s spurious factor of 2 on q^2
    quadruples the active peak term from (D_B/w^2)*c_spin^2 to (4*D_B/w^2)*c_spin^2, producing the
    4x overprediction of the upper reaction-rate cutoff in printed Eq. (F2) ((k_f + k_b)_max = k_0
    instead of k_0/4; zwicker2015/q_appF_factor_of_2_error).
  assumptions:
    - "Same supercritical window and peak-growth-rate dictionary as rel_bois2011_eq15_kmax_derived_eqF1_corrected_lammax."

# --- 7.3 Passive Conserved Reductions & Exact Hill-to-Double-Well Equivalence (Eq. F1 -> Eq. 12 / Hill) ---

- id: rel_bois2011_eqF1_corrected_passive_reduces_eq12
  kind: reduces_to
  a: zwicker2015/homogeneous_dispersion_eqF1_corrected
  b: bois2011/single_species_dispersion_eq12
  mapping:
    k: "q"
    D: "D_B"
    Pe: "6"
    c0: "k_f / k_b"
    df_dc: "1 / (1 + k_f / k_b)**2"
    l: "w / 2"
  output_map:
    lam: lam_q
  limit:
    D_B: "oo"
    w: "0"
  regime:
    D_B: [0.5, 2.0]
    w: [0.05, 0.2]
    k_f: [0.4, 1.0]
    k_b: [0.4, 1.0]
    q: [0.5, 2.0]
  provenance: proposed
  reason: >
    Establishes a striking exact correspondence between Zwicker's quartic double-well spinodal
    curvature and Bois's Hill active-stress function f(c) = c/(1 + c) (Fig. 3): identifying the
    odds ratio c_0 = k_f/k_b = phi_0^B/(1 - phi_0^B) makes Bois's Hill function identically
    f(c_0) = phi_0^B and gives Pe*c_0*df_dc - 1 = 6*phi_0^B*(1 - phi_0^B) - 1 = c_spin = -f''(phi_0^B)/b
    at Pe = 6 across ALL compositions (sharing exact spinodal bounds 2 - sqrt(3) < c_0 = k_f/k_b
    < 2 + sqrt(3) and matching Bois Eq. 10's potential curvature ell^2*V''(ln c_0) = c_spin).
    Taking the passive slow-reaction and thin-interface limit (D_B -> oo, w -> 0, sending
    (k_f + k_b)/k_0 -> 0 and q*w -> 0 at arbitrary composition k_f/k_b), Zwicker Eq. (F1_corrected)
    reduces identically to Bois's conserved single-species dispersion Eq. (12) under D = D_B,
    k = q, ell = w/2, Pe = 6, c_0 = k_f/k_b, and Hill slope df_dc = 1/(1 + c_0)^2.
  assumptions:
    - "Passive slow-reaction (D_B -> oo) and long-wavelength/thin-interface (w -> 0) limit across varying spinodal compositions k_f, k_b in [0.4, 1.0] s^-1 (c_spin in [0.22, 0.50])."
    - "Hill active-stress constitutive correspondence Pe = 6, c_0 = k_f/k_b = phi_0^B/(1 - phi_0^B), df_dc = 1/(1 + c_0)^2."

- id: rel_bois2011_eqF1_printed_passive_vs_eq12
  kind: reduces_to
