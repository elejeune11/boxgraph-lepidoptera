  provenance: proposed
  reason: >
    Diagnostic scaling test contrasting turnover-arrested linear-onset patterning in Hannezo Eq. (3)
    (lambda_c ~ (l_h*l_t)^(1/2) ~ D^(1/4)*tau^(1/4)*(eta/xi)^(1/4), identically shared with Zwicker
    Appendix F's linear onset (w*l)^(1/2) ~ (k_f + k_b)^(-1/4)) against Zwicker Eq. (19)'s strongly
    nonlinear 3D sharp-interface arrested Ostwald-ripening radius R_stab = (3*D_B*gamma*beta/(2*k_b))^(1/3)
    ~ (w*l^2)^(1/3) ~ D^(1/3)*tau^(1/3)*(eta/xi)^(1/6) (with gamma*beta = w/6 = l_h/3 at psi = 1
    and k_b = 1/(2*tau)). Expected to be not_verified because all four scaling exponents differ by
    1/12 = 0.0833 (1/4 vs 1/3 in D and tau; +/-1/4 vs +/-1/6 in eta and xi), proving that linear
    spinodal/cortical onset and nonlinear Gibbs-Thomson Ostwald arrest are distinct scaling regimes.
  assumptions:
    - "Binary sharp-interface capillary length gamma*beta = w/6 = l_h/3 (psi = 1, w = 2*l_h) and symmetric backward rate k_b = 1/(2*tau)."

# ==============================================================================
# 7. Cross-record relations with bois2011 (Bois, Jülicher & Grill, PRL 106:028103, 2011)
# Note: Neither paper cites the other (despite shared co-author F. Jülicher and shared
# Turing 1952 citation); all mathematical and diagnostic relations below carry
# provenance: proposed. Together with hannezo2015 and frohoff2021, these relations close
# the 4-paper active-turnover and passive-conserved commutative squares.
# ==============================================================================

# --- 7.1 Characteristic Screening Lengths & Interface Diffusion Rate ---

- id: rel_bois2011_interface_width_scales_as_ell
  kind: scales_as
  a: zwicker2015/interface_width_w
  b: bois2011/hydrodynamic_length
  mapping:
    eta: "kappa"
    gamma: "b"
  regime:
    kappa: [1.0e-13, 1.0e-11]
    b: [0.5, 10.0]
  provenance: proposed
  reason: >
    Both papers define their short-range spatial regularization length as the square-root ratio
    of a gradient penalty/viscous modulus to a local restoring/friction modulus: Zwicker's
    Cahn-Hilliard half-interface width w/2 = sqrt(kappa/b) (p. 2) and Bois's Brinkman
    hydrodynamic screening length ell = sqrt(eta/gamma) (p. 2). Under the exact dispersion
    factorization lambda_Bois15(k) = lambda_Z^corr(k)/(1 + ell^2*k^2), w/2 plays the exact
    short-wavelength regularization role of ell (w = 2*ell), sharing identical (+1/2, -1/2)
    log-slopes in (kappa <-> eta, b <-> gamma).
  assumptions:
    - "Gradient-to-bulk screening ratio correspondence kappa/b <-> eta/gamma (both dimension [length]^2), preserving the exact dispersion factor w = 2*ell."

- id: rel_bois2011_reaction_length_scales_as_ell_helmholtz
  kind: scales_as
  a: zwicker2015/reaction_diffusion_length_l
  b: bois2011/hydrodynamic_length
  mapping:
    eta: "D_B"
    gamma: "k_f + k_b"
  regime:
    D_B: [1.0e-14, 1.0e-11]
    k_f: [1.0e-3, 1.0]
    k_b: [1.0e-3, 1.0]
  provenance: proposed
  reason: >
    Both Zwicker's reaction-diffusion length l = sqrt(D_B/(k_f + k_b)) (Sec. II.C, App. C Eq. C1)
    and Bois's hydrodynamic screening length ell = sqrt(eta/gamma) (Eq. 3, p. 2) arise as the
    screening length L of a linear Helmholtz operator (1 - L^2*nabla^2), sharing identical
    (+1/2, -1/2) scaling in transport coefficient over local damping rate. Recorded as scales_as
    (not same_as) because they are physically distinct screening lengths whose ratio
    phi = (ell/l)^2 = tau_D*(k_f + k_b) controls finite-turnover pattern arrest (whereas l joins
    the chemical turnover family with hannezo2015/turnover_diffusion_length and ell joins the
    hydrodynamic family with hannezo2015/hydrodynamic_length).
  assumptions:
    - "Formal Helmholtz screening-operator correspondence (D_B <-> eta, k_f + k_b <-> gamma); physically distinct length scales whose square ratio phi = (ell/l)^2 = tau_D*(k_f + k_b) sets the dimensionless turnover parameter."

- id: rel_bois2011_k0_scales_as_eq12_passive_rate
  kind: scales_as
  a: zwicker2015/interface_diffusion_rate_k0
  b: bois2011/single_species_dispersion_eq12
  mapping:
    k: "1 / w"
    D: "D_B"
    Pe: "0"
    c0: "1"
    df_dc: "1"
    l: "w / 2"
  output_map:
    lam: k_0
  regime:
    D_B: [1.0e-14, 1.0e-11]
    w: [1.0e-8, 1.0e-5]
  provenance: proposed
  reason: >
    Zwicker nondimensionalizes rates by the interface diffusion rate k_0 = D_B/w^2 (p. 5),
    while Bois nondimensionalizes time by the diffusive timescale across one hydrodynamic length
    tau_D = ell^2/D (Fig. 3a, bois2011/diffusive_timescale), giving the exact reciprocal
    conversion k_0 = 1/(4*tau_D) under D_B = D and w = 2*ell. Evaluating Bois Eq. (12) in the
    passive diffusion limit (Pe = 0) at wavenumber k = 1/w gives lambda = -D_B/w^2 = -k_0
    identically up to sign, matching log-slopes in both diffusivity D_B and length w.
  assumptions:
    - "Passive diffusion limit Pe = 0 evaluated at inverse interface width k = 1/w with D = D_B and ell = w/2 (giving lambda = -k_0 = -1/(4*tau_D))."

# --- 7.2 Active Finite-Turnover Dispersion: Bois Eq. (15, N=1) <-> Zwicker App. F Eq. (F1) ---

- id: rel_bois2011_eq15_series_derived_eqF1_corrected
  kind: derived_from
  a: bois2011/single_species_rda_dispersion_eq15
  b: zwicker2015/homogeneous_dispersion_eqF1_corrected
  mapping:
    D_B: "D"
    w: "2 * l * sqrt(Pe * c0 * df_dc)"
    k_f: "-(dR_dc / 2) * (1 + sqrt(1 - (2 / 3) * Pe * c0 * df_dc))"
    k_b: "-(dR_dc / 2) * (1 - sqrt(1 - (2 / 3) * Pe * c0 * df_dc))"
    q: "k"
  output_map:
    lam_q: lam
  steps:
    - "series: k -> 0, 5"
    - simplify
  regime:
    k: [0.5, 2.0]
    D: [0.5, 2.0]
    dR_dc: [-0.5, -0.05]
    Pe: [1.0, 2.0]
    c0: [0.5, 1.0]
    df_dc: [0.4, 0.7]
    l: [0.05, 0.2]
  provenance: proposed
  reason: >
    Symbolically proves that expanding Bois's single-species reacting active-fluid dispersion
    relation Eq. (15) (lambda_Bois15 = -D*k^2 + dR_dc + D*k^2*P_eff/(1 + ell^2*k^2), with
    P_eff = Pe*c0*df_dc) to fourth order in wavenumber k (O(k^4)) yields Zwicker's exact
    active Cahn-Hilliard dispersion relation Appendix F Eq. (F1_corrected) identically across
    all three terms: k^0 turnover -(k_f + k_b) = dR_dc < 0, k^2 spinodal/contractile driving
    D_B*c_spin = D*(P_eff - 1), and k^4 short-wavelength stabilization D_B*w^2/4 = D*P_eff*ell^2
    (identifying effective interface width w = 2*ell*sqrt(P_eff) and c_spin = P_eff - 1 in
    (-1, 1/2) for 0 < P_eff < 3/2). Directly closes the bois2011-hannezo2015-zwicker2015
    O(k^4) commutative triangle.
  assumptions:
    - "Long-wavelength O(k^4) expansion (k*ell << 1) with stabilizing first-order reaction dR_dc < 0 and weakly-to-moderately active driving 0 < Pe*c0*df_dc < 3/2 (putting c_spin = P_eff - 1 strictly inside Zwicker's quartic double-well range (-1, 1/2))."
    - "Preserves physical diffusivity D_B = D, wavenumber q = k, and total turnover rate k_f + k_b = -dR_dc."

- id: rel_bois2011_eq15_series_vs_eqF1_printed
  kind: derived_from
  a: bois2011/single_species_rda_dispersion_eq15
  b: zwicker2015/homogeneous_dispersion_eqF1
  mapping:
    D_B: "D"
    w: "2 * l * sqrt(Pe * c0 * df_dc)"
    k_f: "-(dR_dc / 2) * (1 + sqrt(1 - (2 / 3) * Pe * c0 * df_dc))"
    k_b: "-(dR_dc / 2) * (1 - sqrt(1 - (2 / 3) * Pe * c0 * df_dc))"
    q: "k"
  output_map:
    lam_q: lam
  steps:
    - "series: k -> 0, 5"
    - simplify
  regime:
    k: [0.5, 2.0]
    D: [0.5, 2.0]
    dR_dc: [-0.5, -0.05]
    Pe: [1.0, 2.0]
    c0: [0.5, 1.0]
    df_dc: [0.4, 0.7]
    l: [0.05, 0.2]
  provenance: proposed
  reason: >
    Diagnostic cross-paper check testing the exact O(k^4) small-wavenumber expansion of Bois
    Eq. (15) against Zwicker's printed Appendix F Eq. (F1) under the exact diffusivity-preserving
    dictionary (D_B = D, k_f + k_b = -dR_dc, c_spin = P_eff - 1, w = 2*ell*sqrt(P_eff)). Expected
    to be not_verified because printed Eq. (F1) doubles the q^2 coefficient (2*D_B*c_spin*q^2
    instead of D_B*c_spin*q^2), independently corroborating zwicker2015/q_appF_factor_of_2_error.
  assumptions:
    - "Same exact O(k^4) dictionary and regime as rel_bois2011_eq15_series_derived_eqF1_corrected."

- id: rel_bois2011_eq15_lowell_reduces_eqF1_corrected
  kind: reduces_to
  a: bois2011/single_species_rda_dispersion_eq15
  b: zwicker2015/homogeneous_dispersion_eqF1_corrected
  mapping:
    D_B: "D"
    w: "2 * l * sqrt(Pe * c0 * df_dc)"
    k_f: "-(dR_dc / 2) * (1 + sqrt(1 - (2 / 3) * Pe * c0 * df_dc))"
    k_b: "-(dR_dc / 2) * (1 - sqrt(1 - (2 / 3) * Pe * c0 * df_dc))"
    q: "k"
  output_map:
    lam_q: lam
  limit:
    l: "0"
  regime:
    k: [0.5, 2.0]
    D: [0.5, 2.0]
    dR_dc: [-0.5, -0.05]
    Pe: [1.0, 2.0]
    c0: [0.5, 1.0]
    df_dc: [0.4, 0.7]
    l: [0.05, 0.2]
  provenance: proposed
  reason: >
    In the friction-dominated vanishing hydrodynamic screening length limit ell -> 0 (w -> 0)
    at finite wavenumber k > 0, both the k^0 turnover sink dR_dc = -(k_f + k_b) and the k^2
    contractile/spinodal diffusion term D*(P_eff - 1)*k^2 = D_B*c_spin*k^2 survive at O(1),
    and Bois Eq. (15) reduces identically to Zwicker Appendix F Eq. (F1_corrected) with quartic
    O(ell^4*k^6) convergence across both subcritical (P_eff < 1) and supercritical (1 < P_eff < 3/2)
    regimes.
  assumptions:
    - "Vanishing hydrodynamic screening length ell -> 0 (w -> 0) at finite wavenumber k in [0.5, 2.0] m^-1."

