    4x overprediction of the upper reaction-rate cutoff in printed Eq. (F2) ((k_f + k_b)_max = k_0
    instead of k_0/4; zwicker2015/q_appF_factor_of_2_error).
  assumptions:
    - "Same supercritical window and peak-growth-rate dictionary as rel_hannezo2015_eq7_qmax_derived_eqF1_corrected_lammax."

# --- 6.3 Linear Onset Wavelength Family (tau^(1/4)) vs. Nonlinear Ostwald-Arrest Radius (k_b^(-1/3)) ---

- id: rel_hannezo2015_lambda_c_eq3_same_as_eqF1_onset
  kind: same_as
  a: hannezo2015/critical_wavelength_eq3
  b: zwicker2015/homogeneous_onset_wavelength_eqF1
  mapping:
    D_B: "D / 10**12"
    w: "2 * sqrt(eta / xi)"
    k_f: "1 / (2 * tau)"
    k_b: "1 / (2 * tau)"
  output_map:
    lambda_c: lambda_c
  regime:
    D: [0.005, 0.5]
    tau: [1.0, 100.0]
    eta: [1.0e-7, 1.0e-3]
    xi: [1.0e7, 1.0e11]
  provenance: proposed
  reason: >
    Symbolically joins Hannezo Main Eq. (3)'s critical wavelength lambda_c = 2*pi*(D*tau*eta/xi)^(1/4)
    = 2*pi*sqrt(l_h*l_t) and Zwicker Appendix F's marginal linear-onset wavelength
    lambda_c = pi*sqrt(2)*(D_B*w^2/(k_f + k_b))^(1/4) = 2*pi*sqrt((w/2)*l) into a single turnover-
    arrested finite-wavelength onset family under D_B = D, w = 2*l_h = 2*sqrt(eta/xi), and
    k_f + k_b = 1/tau (invariant to how 1/tau is partitioned between k_f and k_b, and notably
    invariant to printed Eq. F1's factor-of-2 q^2 error because marginal q_c = (gamma_0/B)^(1/4)
    depends only on the q^0 sink and q^4 stiffness).
  assumptions:
    - "Short-range regularization length identification w/2 = sqrt(kappa/b) = l_h = sqrt(eta/xi), diffusivity D_B = D, and total first-order turnover rate k_f + k_b = 1/tau."

- id: rel_hannezo2015_inv_qc_corrected_same_as_eqF1_onset
