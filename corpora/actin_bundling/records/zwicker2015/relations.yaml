- id: rel_hannezo2015_eq7_exactfactor_approx_eqF1_corrected
  kind: approximated_by
  a: hannezo2015/dispersion_relation_eq7
  b: zwicker2015/homogeneous_dispersion_eqF1_corrected
  mapping:
