    lambda_max^Z = (D_B/w^2)*c_spin^2 - (k_f + k_b) under D_B = D, w = 2*l_h, k_f + k_b = 1/tau,
    and c_spin = 2*(sqrt(chi) - 1) (valid for 1 < chi < 25/16 = 1.5625, where c_spin in (0, 1/2)).
    Under this same dictionary, both models also share the exact fastest wavenumber q_max^H = q_max^Z
    and the exact instability onset manifold chi_c = (1 + sqrt(phi))^2 <-> c_spin = w/l = 2*sqrt(phi),
    terminating at Zwicker's double-well spinodal apex c_spin = 1/2 (phi = 1/16, (k_f + k_b)/k_0 = 1/4).
  assumptions:
    - "Supercritical active-contractility window 1 < chi = sigma_a/(xi*D) < 25/16 = 1.5625 so c_spin = 2*(sqrt(chi) - 1) lies strictly in (0, 1/2) (covering both sub-threshold lam_max < 0 and unstable lam_max > 0 states)."

- id: rel_hannezo2015_eq7_qmax_vs_eqF1_printed_lammax
  kind: derived_from
