- id: rel_hannezo2015_lambda_c_vs_Rstab_eq19_scaling
  kind: scales_as
  a: hannezo2015/critical_wavelength_eq3
  b: zwicker2015/binary_stability_radius_eq19
  mapping:
    D_B: "D / 10**12"
    gamma_beta: "sqrt(eta / xi) / 3"
