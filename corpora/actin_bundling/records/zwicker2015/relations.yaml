    gamma_beta: [0.1, 0.5]
    k_f: [1.0e-4, 1.0e-3]
    k_b: [1.0e-3, 5.0e-3]
    k: [1.0e-4, 1.0e-3]
    Q: [0.1, 1.0]
    phi_0_A: [0.01, 0.1]
    phi_0_B: [0.05, 0.15]
    phibar: [0.1, 0.2]
    V_s: [1.0e7, 1.0e8]
