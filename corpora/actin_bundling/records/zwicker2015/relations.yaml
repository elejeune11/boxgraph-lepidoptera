    Pe: "6"
    c0: "k_f / k_b"
    df_dc: "1 / (1 + k_f / k_b)**2"
    l: "w / 2"
  output_map:
    lam: lam_q
  limit:
    D_B: "oo"
    w: "0"
  regime:
    D_B: [0.5, 2.0]
    w: [0.05, 0.2]
    k_f: [0.4, 1.0]
    k_b: [0.4, 1.0]
    q: [0.5, 2.0]
  provenance: proposed
  reason: >
    Diagnostic cross-paper check of Zwicker's printed Appendix F Eq. (F1) in the passive conserved
    limit (D_B -> oo, w -> 0) under the exact Hill-to-double-well dictionary (Pe = 6, c_0 = k_f/k_b).
    Expected to be not_verified with persistent relative error 0.50 (factor of 2) because printed
    Eq. (F1) doubles the q^2 spinodal driving term even in the conserved passive limit
    (zwicker2015/q_appF_factor_of_2_error).
  assumptions:
    - "Same passive limit and exact Hill-to-double-well dictionary as rel_bois2011_eqF1_corrected_passive_reduces_eq12."

- id: rel_bois2011_eqF1_corrected_kfkb0_reduces_eq12
  kind: reduces_to
