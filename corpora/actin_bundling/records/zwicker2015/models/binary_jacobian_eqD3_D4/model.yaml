id: binary_jacobian_eqD3_D4
name: linear stability eigenvalues of N binary droplets as printed (Appendix D, Eqs. D3-D4)
role: model
stated:
  page: 12
  printed_page: "012317-12"
  quote: "where the components of the Jacobian J are"
  where: Appendix D, Eqs. (D3a)-(D4b)
equation: "J_00 = -k_f - k_b - 4*pi*D_B*N*R_bar/V_s; J_0i = -4*pi*D_B*N*phi_0^B/V_s; J_i0 = D_B/R_bar; J_ii = D_B*(2*gamma*beta/R_bar^3 - phi_0^B/R_bar^2) - k_b/3; e_pm = (1/2)*[J_00 + J_ii +/- sqrt((J_00 - J_ii)^2 + 4*N*J_0i*J_i0)]; e_tilde = J_ii"
inputs:
  k_f: {quantity: forward_reaction_rate, unit: 1/s}
  k_b: {quantity: backward_reaction_rate, unit: 1/s}
  D_B: {quantity: diffusivity_B, unit: m^2/s}
  gamma_beta: {quantity: capillary_length, unit: m}
  R_bar: {quantity: droplet_radius, unit: m}
  phi_0_B: {quantity: background_volume_fraction_B, unit: dimensionless}
  V_s: {quantity: system_volume, unit: m^3}
  N: {quantity: droplet_count, unit: dimensionless}
outputs:
  e_plus: {quantity: perturbation_growth_rate, unit: 1/s}
  e_minus: {quantity: perturbation_growth_rate, unit: 1/s}
  e_tilde: {quantity: perturbation_growth_rate, unit: 1/s}
settings: {}
stochastic: false
