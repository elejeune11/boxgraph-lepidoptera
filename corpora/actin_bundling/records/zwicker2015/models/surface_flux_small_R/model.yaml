id: surface_flux_small_R
name: small-droplet interfacial flux J (R << l limit of Eqs. 8, 11)
role: model
stated:
  page: 3
  printed_page: "012317-3"
  quote: "for small droplets or small reaction rates"
  where: Sec. II.C text, below Eq. 8
equation: "J = 4 * pi * D_B * (gamma*beta - R * phi_0^B)"
inputs:
  R: {quantity: droplet_radius, unit: m}
  D_B: {quantity: diffusivity_B, unit: m^2/s}
  gamma_beta: {quantity: capillary_length, unit: m}
  phi_0_B: {quantity: background_volume_fraction_B, unit: dimensionless}
outputs:
  J: {quantity: surface_material_flux, unit: m^3/s}
built_from: [surface_flux_eq8_11]
settings: {}
stochastic: false
