id: binary_growth_inf_norm
name: normalized single binary droplet growth rate in an infinite system (Eq. 13, Fig. 3a)
role: model
stated:
  page: 5
  printed_page: "012317-5"
  quote: "Growth rate Ṙ = dR/dt given in Eq. (13)"
  where: Fig. 3(a) caption
equation: "(dR/dt)/(w*k_0) from Eq. (13) with R = R_norm*w, gamma*beta = w/6, k_0 = D_B/w^2, and phi_0^B = phi_B_bar (passive) or k_f/(k_f+k_b) (active, Eq. 15)"
inputs:
  R_norm: {quantity: normalized_droplet_radius, unit: dimensionless}
  k_f_norm: {quantity: normalized_forward_rate, unit: dimensionless}
  k_b_norm: {quantity: normalized_backward_rate, unit: dimensionless}
  phi_B_bar: {quantity: mean_volume_fraction_B, unit: dimensionless}
  w: {quantity: interface_width, unit: m}
  D_B: {quantity: diffusivity_B, unit: m^2/s}
outputs:
  dR_dt_norm: {quantity: normalized_droplet_radius_growth_rate, unit: dimensionless}
built_from: []
settings: {}
stochastic: false
