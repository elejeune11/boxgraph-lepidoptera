id: coexistence_exact_eqA1
name: exact nonlinear curved-interface coexistence (Appendix A, Eq. A1)
role: model
stated:
  page: 11
  printed_page: "012317-11"
  quote: "The conditions for equilibrium at the interface between two"
  where: Appendix A, Eqs. (A1a)-(A1c)
equation: "mu^B(phi_-^B) = mu^B(phi_+^B); (phi_-^B - phi_+^B)*mu^B(phi_-^B) + f(phi_+^B) - f(phi_-^B) = 2*gamma/R"
inputs:
  b: {quantity: interaction_modulus_B, unit: J/m^3}
  psi: {quantity: equilibrium_droplet_volume_fraction, unit: dimensionless}
  gamma: {quantity: surface_tension, unit: J/m^2}
  R: {quantity: droplet_radius, unit: m}
outputs:
  phi_plus_B: {quantity: interface_volume_fraction_B_outside, unit: dimensionless}
  phi_minus_B: {quantity: interface_volume_fraction_B_inside, unit: dimensionless}
built_from: [ternary_free_energy_eq1]
settings:
  tol: 1.0e-8
stochastic: false
