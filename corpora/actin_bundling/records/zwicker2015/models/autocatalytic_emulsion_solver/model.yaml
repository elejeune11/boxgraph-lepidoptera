id: autocatalytic_emulsion_solver
name: numerical steady-state, fixed-point, and stability solver for autocatalytic droplets with cores (Eqs. 22, 10, 12)
role: model
stated:
  page: 8
  printed_page: "012317-8"
  quote: "of the state variables R1 and R2 following"
  where: Figs. 7, 8, 9(b), and 10
equation: "Eq. (22) coupled to steady-state background Eq. (10) and mass conservation Eq. (12) for 1 and 2 droplets with core activities Q_1, Q_2"
inputs:
  D_B: {quantity: diffusivity_B, unit: m^2/s}
  gamma_beta: {quantity: capillary_length, unit: m}
  psi: {quantity: equilibrium_droplet_volume_fraction, unit: dimensionless}
  k_f: {quantity: forward_reaction_rate, unit: 1/s}
  k_b: {quantity: backward_reaction_rate, unit: 1/s}
  k: {quantity: autocatalytic_reaction_rate, unit: 1/s}
  phibar: {quantity: total_reactive_volume_fraction, unit: dimensionless}
  V_s: {quantity: system_volume, unit: m^3}
  Q_1: {quantity: core_catalytic_activity, unit: m^3/s}
  Q_2: {quantity: core_catalytic_activity, unit: m^3/s}
outputs:
  R_single_bar: {quantity: droplet_radius, unit: m}
  R1_pair: {quantity: droplet_radius, unit: m}
  R2_pair: {quantity: droplet_radius, unit: m}
  V1_over_V2: {quantity: volume_ratio, unit: dimensionless}
  lam_pair: {quantity: perturbation_growth_rate, unit: 1/s}
  n_stable_states: {quantity: fixed_point_count, unit: dimensionless}
  n_crit_radii: {quantity: fixed_point_count, unit: dimensionless}
  n_total_fixed_points: {quantity: fixed_point_count, unit: dimensionless}
  max_stable_droplets: {quantity: droplet_count, unit: dimensionless}
built_from: [autocatalytic_growth_eq22, coarse_grained_droplet_eq9_12]
settings:
  rtol: 1.0e-6
stochastic: false
