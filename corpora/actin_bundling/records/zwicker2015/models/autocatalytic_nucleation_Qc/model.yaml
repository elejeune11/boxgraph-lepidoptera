id: autocatalytic_nucleation_Qc
name: critical core catalytic activity Q_c for guaranteed droplet nucleation (Sec. IV.A)
role: model
stated:
  page: 8
  printed_page: "012317-8"
  quote: "Considering Eq. (22) in the steady"
  where: Sec. IV.A text, p. 8
equation: "Q_c = 4 * pi * D_B * gamma*beta / phi_0^A; with phi_0^A = k_b / k: Q_c = 4 * pi * D_B * gamma*beta * k / k_b"
inputs:
  D_B: {quantity: diffusivity_B, unit: m^2/s}
  gamma_beta: {quantity: capillary_length, unit: m}
  k_b: {quantity: backward_reaction_rate, unit: 1/s}
  k: {quantity: autocatalytic_reaction_rate, unit: 1/s}
outputs:
  Q_c: {quantity: core_catalytic_activity, unit: m^3/s}
built_from: [autocatalytic_growth_eq22]
settings: {}
stochastic: false
