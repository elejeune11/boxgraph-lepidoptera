  quote: "numerically solving Eq. (3) in a three-dimensional, cylindrical"
  where: Appendix E and Fig. 5
equation: "d_t phi^B = Laplacian[phi^B*(1-phi^B)*(1-2*phi^B) - (1/4)*Laplacian(phi^B)] + (k_f/k_0)*(1 - phi^B) - (k_b/k_0)*phi^B in 3D cylindrical (r, z)"
