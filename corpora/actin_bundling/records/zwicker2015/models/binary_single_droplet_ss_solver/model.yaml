id: binary_single_droplet_ss_solver
name: exact numerical steady-state and saddle-node solver for binary single droplet (Eq. 13)
role: model
stated:
  page: 5
  printed_page: "012317-5"
  quote: "were determined by solving Eq. (13) numerically."
  where: Fig. 3(b) caption and Sec. III.A.1
equation: "0 = D_B * (phi_0^B / R - gamma*beta / R^2) - k_b * R / 3; phi_0^B = k_f / (k_f + k_b)"
inputs:
  D_B: {quantity: diffusivity_B, unit: m^2/s}
  gamma_beta: {quantity: capillary_length, unit: m}
  k_f: {quantity: forward_reaction_rate, unit: 1/s}
  k_b: {quantity: backward_reaction_rate, unit: 1/s}
outputs:
  R_crit: {quantity: critical_droplet_radius, unit: m}
  R_bar: {quantity: droplet_radius, unit: m}
  k_f_c: {quantity: critical_forward_rate, unit: 1/s}
built_from: [binary_droplet_growth_eq13, binary_background_ss_eq15]
settings:
  rtol: 1.0e-6
stochastic: false
