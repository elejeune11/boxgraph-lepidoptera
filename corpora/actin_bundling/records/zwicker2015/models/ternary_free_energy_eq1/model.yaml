id: ternary_free_energy_eq1
name: ternary bulk free energy density and chemical potentials (Eq. 1)
role: model
stated:
  page: 2
  printed_page: "012317-2"
  quote: "where the positive parameters a and b characterize molecular"
  where: Eq. 1
equation: "f(phi^A, phi^B) = (a/2)*(phi^A)^2 + (b/(2*psi^2))*(phi^B)^2*(psi - phi^B)^2; mu^A = df/dphi^A; mu^B = df/dphi^B"
inputs:
  a: {quantity: interaction_modulus_A, unit: J/m^3}
  b: {quantity: interaction_modulus_B, unit: J/m^3}
  psi: {quantity: equilibrium_droplet_volume_fraction, unit: dimensionless}
  phi_A: {quantity: volume_fraction_A, unit: dimensionless}
  phi_B: {quantity: volume_fraction_B, unit: dimensionless}
outputs:
  f: {quantity: free_energy_density, unit: J/m^3}
  mu_A: {quantity: chemical_potential_A, unit: J/m^3}
  mu_B: {quantity: chemical_potential_B, unit: J/m^3}
settings: {}
stochastic: false
