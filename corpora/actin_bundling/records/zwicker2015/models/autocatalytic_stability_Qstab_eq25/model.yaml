id: autocatalytic_stability_Qstab_eq25
name: threshold core catalytic activity Q_stab for suppressing Ostwald ripening (Eq. 25)
role: model
stated:
  page: 9
  printed_page: "012317-9"
  quote: "In particular, autocatalytic droplets are stable if Q exceeds the"
  where: Eq. 25
equation: "Q_stab = 4 * pi * D_B * k_s * R * (3 * phi_+^B - 2 * phi_0^B) / (3 * psi * k_b); large-system (phi_0^B = 0): Q_stab_inf = 4 * pi * D_B * k_s * gamma*beta / (psi * k_b)"
inputs:
  D_B: {quantity: diffusivity_B, unit: m^2/s}
  k_s: {quantity: effective_droplet_reaction_rate, unit: 1/s}
  R: {quantity: droplet_radius, unit: m}
  gamma_beta: {quantity: capillary_length, unit: m}
  phi_0_B: {quantity: background_volume_fraction_B, unit: dimensionless}
  psi: {quantity: equilibrium_droplet_volume_fraction, unit: dimensionless}
  k_b: {quantity: backward_reaction_rate, unit: 1/s}
outputs:
  Q_stab: {quantity: core_catalytic_activity, unit: m^3/s}
  Q_stab_inf: {quantity: core_catalytic_activity, unit: m^3/s}
built_from: [ternary_coarsening_rate_eq24_corrected, gibbs_thomson_eq6]
settings: {}
stochastic: false
