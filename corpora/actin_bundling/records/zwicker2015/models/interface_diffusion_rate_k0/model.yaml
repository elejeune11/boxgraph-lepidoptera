id: interface_diffusion_rate_k0
name: characteristic rate of diffusion across the interface k_0
role: model
stated:
  page: 5
  printed_page: "012317-5"
  quote: "of diffusion across the interface for a single"
  where: Sec. III.A.1 text, p. 5
equation: "k_0 = D_B / w^2"
inputs:
  D_B: {quantity: diffusivity_B, unit: m^2/s}
  w: {quantity: interface_width, unit: m}
outputs:
  k_0: {quantity: interface_diffusion_rate, unit: 1/s}
settings: {}
stochastic: false
