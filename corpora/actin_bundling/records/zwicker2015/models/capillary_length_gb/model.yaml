id: capillary_length_gb
name: Gibbs-Thomson capillary length gamma*beta from interface width
role: model
stated:
  page: 3
  printed_page: "012317-3"
  quote: "which is related to the interface width by"
  where: Sec. II.C text, p. 3
equation: "gamma*beta = w * psi / 6"
inputs:
  w: {quantity: interface_width, unit: m}
  psi: {quantity: equilibrium_droplet_volume_fraction, unit: dimensionless}
outputs:
  gamma_beta: {quantity: capillary_length, unit: m}
settings: {}
stochastic: false
