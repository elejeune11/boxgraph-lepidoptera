id: binary_stability_number_eq21
name: dimensionless stability number chi, maximal droplet count N_max, and critical density n_c (Eq. 21)
role: model
stated:
  page: 7
  printed_page: "012317-7"
  quote: "This can be summarized in a single"
  where: Eq. 21
equation: "chi = (V_s / (2 * pi * D_B * gamma*beta * N)) * (k_f * k_b / (k_f + k_b)); n_c = (1 / (2 * pi * D_B * gamma*beta)) * (k_f * k_b / (k_f + k_b))"
inputs:
  V_s: {quantity: system_volume, unit: m^3}
  D_B: {quantity: diffusivity_B, unit: m^2/s}
  gamma_beta: {quantity: capillary_length, unit: m}
  N: {quantity: droplet_count, unit: dimensionless}
  k_f: {quantity: forward_reaction_rate, unit: 1/s}
  k_b: {quantity: backward_reaction_rate, unit: 1/s}
outputs:
  chi: {quantity: stability_number_chi, unit: dimensionless}
  N_max: {quantity: droplet_count, unit: dimensionless}
  n_c: {quantity: droplet_number_density, unit: 1/m^3}
built_from: [binary_coarsening_rate_eq18, binary_dense_volume_eq20]
settings: {}
stochastic: false
