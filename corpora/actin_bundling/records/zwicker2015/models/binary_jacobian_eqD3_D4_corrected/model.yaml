id: binary_jacobian_eqD3_D4_corrected
name: linear stability eigenvalues of N binary droplets with corrected Eq. (D3b)
role: model
stated:
  page: 12
  printed_page: "012317-12"
  quote: "where the components of the Jacobian J are"
  where: Appendix D, Eqs. (D2)-(D4b)
equation: "J_0i = -4*pi*D_B*phi_0^B/V_s (removing spurious N from printed Eq. D3b so 4*N*J_0i*J_i0 in Eq. D4a matches Eq. D2)"
variant_of: binary_jacobian_eqD3_D4
corrections:
  - equation: Eq. (D3b)
    change: "J_0i = -4*pi*D_B*phi_0^B*V_s^-1 instead of printed -4*pi*D_B*N*phi_0^B*V_s^-1"
    evidence: "Differentiating printed Eq. (D2) with respect to each individual droplet radius perturbation R_i_hat gives -4*pi*D_B*phi_0^B/V_s without N; Eq. (D4a) already supplies the factor N via 4*N*J_0i*J_i0, so printed Eq. (D3b) double-counts N as N^2 for N >= 2."
inputs:
  k_f: {quantity: forward_reaction_rate, unit: 1/s}
  k_b: {quantity: backward_reaction_rate, unit: 1/s}
  D_B: {quantity: diffusivity_B, unit: m^2/s}
  gamma_beta: {quantity: capillary_length, unit: m}
  R_bar: {quantity: droplet_radius, unit: m}
  phi_0_B: {quantity: background_volume_fraction_B, unit: dimensionless}
  V_s: {quantity: system_volume, unit: m^3}
  N: {quantity: droplet_count, unit: dimensionless}
outputs:
  e_plus: {quantity: perturbation_growth_rate, unit: 1/s}
  e_minus: {quantity: perturbation_growth_rate, unit: 1/s}
  e_tilde: {quantity: perturbation_growth_rate, unit: 1/s}
settings: {}
stochastic: false
