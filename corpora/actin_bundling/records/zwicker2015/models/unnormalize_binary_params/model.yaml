id: unnormalize_binary_params
name: dimensional parameter reconstruction for normalized binary emulsion figures (Sec. III)
role: processing
stated:
  page: 5
  printed_page: "012317-5"
  quote: "quantities are normalized to the length scale"
  where: Fig. 3 caption, p. 5
equation: "k_0 = D_B / w^2; gamma*beta = w / 6; k_f = kf_norm * k_0; k_b = kb_norm * k_0; V_s = Vs_norm * w^3"
inputs:
  kf_norm: {quantity: normalized_forward_rate, unit: dimensionless}
  kb_norm: {quantity: normalized_backward_rate, unit: dimensionless}
  Vs_norm: {quantity: normalized_system_volume, unit: dimensionless}
  w: {quantity: interface_width, unit: m}
  D_B: {quantity: diffusivity_B, unit: m^2/s}
outputs:
  k_0: {quantity: interface_diffusion_rate, unit: 1/s}
  k_f: {quantity: forward_reaction_rate, unit: 1/s}
  k_b: {quantity: backward_reaction_rate, unit: 1/s}
  V_s: {quantity: system_volume, unit: m^3}
  gamma_beta: {quantity: capillary_length, unit: m}
built_from: [interface_diffusion_rate_k0, capillary_length_gb]
settings: {}
stochastic: false
