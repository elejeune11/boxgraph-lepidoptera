id: unnormalize_ternary_params
name: dimensional parameter reconstruction for normalized ternary autocatalytic figures (Sec. IV)
role: processing
stated:
  page: 8
  printed_page: "012317-8"
  quote: "and ψ = 0.1, with"
  where: Fig. 7 caption, p. 8
equation: "k_0 = D_B / w^2; k_f = kf_norm*k_0; k_b = kb_norm*k_0; k = k_norm*k_0; k_s = k_f + k*psi; V_s = Vs_norm*w^3; Q = Q_norm*w^3*k_0; gb_continuum = w*psi/6; gb_capillary = w/6"
inputs:
  kf_norm: {quantity: normalized_forward_rate, unit: dimensionless}
  kb_norm: {quantity: normalized_backward_rate, unit: dimensionless}
  k_norm: {quantity: normalized_autocatalytic_rate, unit: dimensionless}
  Vs_norm: {quantity: normalized_system_volume, unit: dimensionless}
  Q_norm: {quantity: normalized_core_activity, unit: dimensionless}
  psi: {quantity: equilibrium_droplet_volume_fraction, unit: dimensionless}
  w: {quantity: interface_width, unit: m}
  D_B: {quantity: diffusivity_B, unit: m^2/s}
outputs:
  k_0: {quantity: interface_diffusion_rate, unit: 1/s}
  k_f: {quantity: forward_reaction_rate, unit: 1/s}
  k_b: {quantity: backward_reaction_rate, unit: 1/s}
  k: {quantity: autocatalytic_reaction_rate, unit: 1/s}
  k_s: {quantity: effective_droplet_reaction_rate, unit: 1/s}
  V_s: {quantity: system_volume, unit: m^3}
  Q: {quantity: core_catalytic_activity, unit: m^3/s}
  gamma_beta_continuum: {quantity: capillary_length, unit: m}
  gamma_beta_capillary: {quantity: capillary_length, unit: m}
built_from: [interface_diffusion_rate_k0, effective_rate_ks, capillary_length_gb]
settings: {}
stochastic: false
