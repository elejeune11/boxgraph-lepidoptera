id: system_radius_Rs
name: equivalent spherical system size R_s
role: model
stated:
  page: 5
  printed_page: "012317-5"
  quote: "system size Rs = (3Vs /4π )1/3 compares to the characteristic"
  where: Sec. III.A.2 text, p. 5
equation: "R_s = (3 * V_s / (4 * pi))^(1/3)"
inputs:
  V_s: {quantity: system_volume, unit: m^3}
outputs:
  R_s: {quantity: system_radius, unit: m}
settings: {}
stochastic: false
