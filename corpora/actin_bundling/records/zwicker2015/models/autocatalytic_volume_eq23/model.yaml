id: autocatalytic_volume_eq23
name: stationary volume of a single autocatalytic droplet in a finite system (Eq. 23)
role: model
stated:
  page: 8
  printed_page: "012317-8"
  quote: "This volume is smaller than the system size and"
  where: Eq. 23
equation: "V_bar = (V_s / psi) * (phibar - k_b / k); R_bar = (3 * V_bar / (4 * pi))^(1/3)"
inputs:
  V_s: {quantity: system_volume, unit: m^3}
  psi: {quantity: equilibrium_droplet_volume_fraction, unit: dimensionless}
  phibar: {quantity: total_reactive_volume_fraction, unit: dimensionless}
  k_b: {quantity: backward_reaction_rate, unit: 1/s}
  k: {quantity: autocatalytic_reaction_rate, unit: 1/s}
outputs:
  V_bar: {quantity: droplet_volume, unit: m^3}
  R_bar: {quantity: droplet_radius, unit: m}
built_from: [autocatalytic_growth_eq22]
settings: {}
stochastic: false
