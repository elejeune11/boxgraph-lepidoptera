id: capillary_length_from_micro
name: Gibbs-Thomson capillary length gamma*beta from microscopic parameters
role: model
stated:
  page: 3
  printed_page: "012317-3"
  quote: "which is related to the interface width by"
  where: Sec. II.C text, p. 3
equation: "gamma*beta = [(1/6)*psi^2*(b*kappa)^(1/2)] * [2/(b*psi)]"
inputs:
  b: {quantity: interaction_modulus_B, unit: J/m^3}
  kappa: {quantity: gradient_coefficient_B, unit: J/m}
  psi: {quantity: equilibrium_droplet_volume_fraction, unit: dimensionless}
outputs:
  gamma_beta: {quantity: capillary_length, unit: m}
built_from: [surface_tension_gamma, laplace_coeff_beta]
settings: {}
stochastic: false
