id: ternary_coarsening_rate_eqG1
name: ternary emulsion linear stability coarsening rate from Appendix G (Eqs. G1-G3)
role: model
stated:
  page: 13
  printed_page: "012317-13"
  quote: "Inserting these two expressions into Eq. (G1) results in"
  where: Appendix G, Eqs. (G1)-(G3)
equation: "lambda = D_B*phi_0^B/(psi*R_bar^2) + k_s*phi_0^A/psi - k_b; phi_0^A = [k_b*psi*V_bar + 4*pi*D_B*(gamma*beta - phi_0^B*R_bar)]/(k_s*V_bar) * (1 - Q/(k_s*V_bar)); phi_0^B = gamma*beta/R_bar - J/(4*pi*R_bar*D_B)"
inputs:
  D_B: {quantity: diffusivity_B, unit: m^2/s}
  gamma_beta: {quantity: capillary_length, unit: m}
  psi: {quantity: equilibrium_droplet_volume_fraction, unit: dimensionless}
  V_bar: {quantity: droplet_volume, unit: m^3}
  J: {quantity: surface_material_flux, unit: m^3/s}
  Q: {quantity: core_catalytic_activity, unit: m^3/s}
  k_b: {quantity: backward_reaction_rate, unit: 1/s}
  k_s: {quantity: effective_droplet_reaction_rate, unit: 1/s}
outputs:
  lam: {quantity: perturbation_growth_rate, unit: 1/s}
  phi_0_A: {quantity: background_volume_fraction_A, unit: dimensionless}
  phi_0_B: {quantity: background_volume_fraction_B, unit: dimensionless}
built_from: [autocatalytic_growth_eq22]
settings: {}
stochastic: false
