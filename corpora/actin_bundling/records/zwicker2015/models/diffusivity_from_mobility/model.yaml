id: diffusivity_from_mobility
name: component B diffusivity from mobility and interaction parameter (Eq. 7)
role: model
stated:
  page: 3
  printed_page: "012317-3"
  quote: "where DA = mA a and DB = mB b are diffusivities."
  where: Sec. II.C text, Eq. 7
equation: "D_B = m_B * b"
inputs:
  m_B: {quantity: mobility_B, unit: m^5/(J*s)}
  b: {quantity: interaction_modulus_B, unit: J/m^3}
outputs:
  D_B: {quantity: diffusivity_B, unit: m^2/s}
settings: {}
stochastic: false
