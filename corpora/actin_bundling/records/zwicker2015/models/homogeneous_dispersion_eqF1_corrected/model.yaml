id: homogeneous_dispersion_eqF1_corrected
name: exact linear dispersion relation of Eq. (3b) around binary homogeneous state (corrected Eq. F1)
role: model
stated:
  page: 12
  printed_page: "012317-12"
  quote: "turbations of this state grow with a rate"
  where: Appendix F, Eq. (F1)
equation: "lambda(q) = D_B * q^2 * [(4*k_f*k_b - k_f^2 - k_b^2) / (k_f + k_b)^2 - (w^2 / 4) * q^2] - k_f - k_b"
variant_of: homogeneous_dispersion_eqF1
corrections:
  - equation: Eq. (F1)
    change: "Remove the spurious factor of 2 on the q^2 term: lambda(q) = D_B*q^2*[(4*k_f*k_b - k_f^2 - k_b^2)/(k_f + k_b)^2 - (w^2/4)*q^2] - k_f - k_b"
    evidence: "Direct linearization of Eq. (3b) with f(phi^B) = (b/2)*(phi^B)^2*(1 - phi^B)^2, D_B = m_B*b, and w = 2*(kappa/b)^(1/2) (so kappa = b*w^2/4) gives f''(phi_0^B) = b*(k_f^2 - 4*k_f*k_b + k_b^2)/(k_f + k_b)^2 and lambda(q) = -m_B*q^2*(f''(phi_0^B) + kappa*q^2) - (k_f + k_b), which matches the q^4 term (-D_B*w^2*q^4/4) of printed Eq. (F1) but has half the printed q^2 coefficient; independently confirmed by direct 1D pseudospectral integration of Eq. (3b)."
inputs:
  D_B: {quantity: diffusivity_B, unit: m^2/s}
  w: {quantity: interface_width, unit: m}
  k_f: {quantity: forward_reaction_rate, unit: 1/s}
  k_b: {quantity: backward_reaction_rate, unit: 1/s}
  q: {quantity: perturbation_wavenumber, unit: 1/m}
outputs:
  lam_q: {quantity: perturbation_growth_rate, unit: 1/s}
  lam_q_norm: {quantity: normalized_coarsening_rate, unit: dimensionless}
  lam_max: {quantity: perturbation_growth_rate, unit: 1/s}
settings: {}
stochastic: false
