id: homogeneous_onset_wavelength_eqF1
name: marginal linear-onset critical wavenumber and wavelength from Appendix F Eqs. (F1)-(F2)
role: model
stated:
  page: 12
  printed_page: "012317-12"
  quote: "is unstable if there exists a q for which"
  where: "Appendix F, Eqs. (F1)-(F2) marginal mode"
equation: "q_c = [4*(k_f + k_b)/(D_B*w^2)]^(1/4) = sqrt(2/(w*l)); 1/q_c = [D_B*w^2/(4*(k_f + k_b))]^(1/4) = sqrt(w*l/2); lambda_c = 2*pi/q_c = pi*sqrt(2)*(w*l)^(1/2)"
built_from:
  - homogeneous_dispersion_eqF1_corrected
  - homogeneous_instability_eqF2_corrected
  - reaction_diffusion_length_l
inputs:
  D_B: {quantity: diffusivity_B, unit: m^2/s}
  w: {quantity: interface_width, unit: m}
  k_f: {quantity: forward_reaction_rate, unit: 1/s}
  k_b: {quantity: backward_reaction_rate, unit: 1/s}
outputs:
  q_c: {quantity: perturbation_wavenumber, unit: 1/m}
  inv_qc: {quantity: critical_inverse_wavenumber, unit: m}
  lambda_c: {quantity: critical_wavelength, unit: m}
settings: {}
stochastic: false
