id: lifshitz_slyozov_scaling_corrected
name: dimensionally corrected Lifshitz-Slyozov mean droplet radius scaling
role: model
stated:
  page: 7
  printed_page: "012317-7"
  quote: "the typical Lifshitz-Slyozov kinetics, where the mean droplet"
  where: Sec. III.B.3 text, p. 7
equation: "<R> ~ w * (t * D_B / w^2)^(1/3) = (t * D_B * w)^(1/3)"
prefactor: unknown
variant_of: lifshitz_slyozov_scaling_printed
corrections:
  - equation: Sec. III.B.3 inline scaling (p. 7)
    change: "Multiply printed (t * D_B / w^2)^(1/3) by w to give <R> ~ (t * D_B * w)^(1/3), i.e. <R>/w ~ (t * D_B / w^2)^(1/3)"
    evidence: "Dimension argument and passive coarsening rate Eq. (18): t * D_B / w^2 = t * k_0 is dimensionless while <R> has dimension [length]; from Eq. (18) passive rate lambda = D_B * gamma*beta / R_bar^3 with gamma*beta = w/6 (psi = 1), balancing lambda ~ 1/t yields <R> ~ (D_B * w * t)^(1/3)."
inputs:
  t: {quantity: time, unit: s}
  D_B: {quantity: diffusivity_B, unit: m^2/s}
  w: {quantity: interface_width, unit: m}
outputs:
  R_mean: {quantity: droplet_radius, unit: m}
settings: {}
stochastic: false
