  quote: "droplets do not form if kf exceeds the critical value"
  where: Eq. 17
equation: "k_f^c = (4 * D_B / (3 * gamma*beta)^2) * (phi_0^B)^4 / (1 - phi_0^B); k_b^c = k_f^c * (1 - phi_0^B) / phi_0^B"
