id: binary_free_energy_sec3
name: binary fluid bulk free energy density as printed in Sec. III
role: model
stated:
  page: 4
  printed_page: "012317-4"
  quote: "associated free energy density is f (φ B )"
  where: Sec. III text, p. 4
equation: "f(phi^B) = (b/2)*(phi^B)^2*(psi - phi^B)^2"
inputs:
  b: {quantity: interaction_modulus_B, unit: J/m^3}
  psi: {quantity: equilibrium_droplet_volume_fraction, unit: dimensionless}
  phi_B: {quantity: volume_fraction_B, unit: dimensionless}
outputs:
  f: {quantity: free_energy_density, unit: J/m^3}
  mu_B: {quantity: chemical_potential_B, unit: J/m^3}
settings: {}
stochastic: false
