id: autocatalytic_volume_quad_appB
name: exact quadratic steady-state volume of autocatalytic droplet for phi_0^B = 0 (Appendix B)
role: model
stated:
  page: 11
  printed_page: "012317-11"
  quote: "Inserting this solution into Eq. (22) in steady state leads"
  where: Appendix B, p. 11
equation: "k*psi^2*V^2 - V_s*psi*(k*phibar - k_b - Q/V_s)*V - V_s*(Q*phibar - 4*pi*D_B*gamma*beta) = 0"
inputs:
  V_s: {quantity: system_volume, unit: m^3}
  psi: {quantity: equilibrium_droplet_volume_fraction, unit: dimensionless}
  phibar: {quantity: total_reactive_volume_fraction, unit: dimensionless}
  k_b: {quantity: backward_reaction_rate, unit: 1/s}
  k: {quantity: autocatalytic_reaction_rate, unit: 1/s}
  Q: {quantity: core_catalytic_activity, unit: m^3/s}
  D_B: {quantity: diffusivity_B, unit: m^2/s}
  gamma_beta: {quantity: capillary_length, unit: m}
outputs:
  V_bar: {quantity: droplet_volume, unit: m^3}
  delta_V: {quantity: droplet_volume, unit: m^3}
built_from: [autocatalytic_growth_eq22]
settings: {}
stochastic: false
