id: reaction_diffusion_length_l
name: reaction-diffusion characteristic length scale l
role: model
stated:
  page: 3
  printed_page: "012317-3"
  quote: "varies on a characteristic length scale l ="
  where: Sec. II.C text, p. 3
equation: "l = [D_B / (k_f + k_b)]^(1/2)"
inputs:
  D_B: {quantity: diffusivity_B, unit: m^2/s}
  k_f: {quantity: forward_reaction_rate, unit: 1/s}
  k_b: {quantity: backward_reaction_rate, unit: 1/s}
outputs:
  l: {quantity: reaction_diffusion_length, unit: m}
settings: {}
stochastic: false
