id: autocatalytic_critical_radius
name: critical nucleation radius R_crit for an autocatalytic droplet without core (Sec. IV.A)
role: model
stated:
  page: 8
  printed_page: "012317-8"
  quote: "This critical radius can be estimated by"
  where: Sec. IV.A text, p. 8
equation: "R_crit = gamma*beta / (phibar - k_b / k)"
inputs:
  gamma_beta: {quantity: capillary_length, unit: m}
  phibar: {quantity: total_reactive_volume_fraction, unit: dimensionless}
  k_b: {quantity: backward_reaction_rate, unit: 1/s}
  k: {quantity: autocatalytic_reaction_rate, unit: 1/s}
outputs:
  R_crit: {quantity: critical_droplet_radius, unit: m}
settings: {}
stochastic: false
