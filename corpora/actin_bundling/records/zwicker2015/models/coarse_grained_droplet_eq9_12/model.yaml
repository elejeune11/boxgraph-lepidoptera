id: coarse_grained_droplet_eq9_12
name: general coarse-grained active droplet dynamics and mass conservation (Eqs. 9-12)
role: model
stated:
  page: 4
  printed_page: "012317-4"
  quote: "two effects, the volume growth rate can be expressed as"
  where: Eqs. 9, 10, 12
equation: "psi * dV/dt = (k_f*phi_0^A - k_b*psi + k*phi_0^A*psi)*V + Q*phi_0^A - J; phi_0^A = phibar - ((V_s - V_tot)/V_s)*phi_0^B - (V_tot/V_s)*psi"
