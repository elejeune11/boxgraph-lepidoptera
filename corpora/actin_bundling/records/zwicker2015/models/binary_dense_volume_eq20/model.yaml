id: binary_dense_volume_eq20
name: stationary droplet volume V_bar in high-density binary emulsion (Eq. 20)
role: model
stated:
  page: 6
  printed_page: "012317-6"
  quote: "considering that this volume must be distributed among the N"
  where: Eq. 20
equation: "V_bar = k_f * V_s / ((k_f + k_b) * N); R_bar = (3 * V_bar / (4 * pi))^(1/3)"
inputs:
  k_f: {quantity: forward_reaction_rate, unit: 1/s}
  k_b: {quantity: backward_reaction_rate, unit: 1/s}
  V_s: {quantity: system_volume, unit: m^3}
  N: {quantity: droplet_count, unit: dimensionless}
outputs:
  V_bar: {quantity: droplet_volume, unit: m^3}
  R_bar: {quantity: droplet_radius, unit: m}
built_from: [binary_background_ss_eq15]
settings: {}
stochastic: false
