id: binary_multidroplet_stability_solver
name: numerical steady-state, phase-portrait fixed-point, and linear stability solver for N binary droplets (Eqs. 13-14)
role: model
stated:
  page: 7
  printed_page: "012317-7"
  quote: "is obtained from a numerical linear stability analysis of Eq. (13)."
  where: Figs. 4 and 6(a), Appendix D
equation: "0 = D_B*(phi_0^B/R - gamma*beta/R^2) - k_b*R/3 coupled to Eq. (14) steady state and full (N+1)x(N+1) Jacobian"
inputs:
  D_B: {quantity: diffusivity_B, unit: m^2/s}
  gamma_beta: {quantity: capillary_length, unit: m}
  k_f: {quantity: forward_reaction_rate, unit: 1/s}
  k_b: {quantity: backward_reaction_rate, unit: 1/s}
  V_s: {quantity: system_volume, unit: m^3}
  phi_B_bar: {quantity: mean_volume_fraction_B, unit: dimensionless}
  N: {quantity: droplet_count, unit: dimensionless}
outputs:
  R_sym: {quantity: droplet_radius, unit: m}
  phi_0_B_sym: {quantity: background_volume_fraction_B, unit: dimensionless}
  lam_sym: {quantity: perturbation_growth_rate, unit: 1/s}
  e_plus_exact: {quantity: perturbation_growth_rate, unit: 1/s}
  n_stable_pair: {quantity: fixed_point_count, unit: dimensionless}
  n_small_unstable_pair: {quantity: fixed_point_count, unit: dimensionless}
  n_large_sym_unstable_pair: {quantity: fixed_point_count, unit: dimensionless}
  N_max: {quantity: droplet_count, unit: dimensionless}
built_from: [binary_droplet_growth_eq13]
settings:
  rtol: 1.0e-6
stochastic: false
