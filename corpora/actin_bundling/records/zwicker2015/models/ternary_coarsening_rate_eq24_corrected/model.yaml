id: ternary_coarsening_rate_eq24_corrected
name: coarsening/relaxation rate lambda for general ternary active emulsion with k_s (corrected Eq. 24)
role: model
stated:
  page: 9
  printed_page: "012317-9"
  quote: "The rate λ at which droplets exchange material reads"
  where: Eq. 24 and Appendix G (Eqs. G1-G3)
equation: "lambda = 4*pi*D_B*gamma*beta/(3*psi*V_bar) + 2*J/(3*psi*V_bar) - (Q/(V_bar*k_s))*(k_b + J/(psi*V_bar))"
variant_of: ternary_coarsening_rate_eq24
corrections:
  - equation: Eq. (24)
    change: "Replace k with k_s = k_f + k*psi in the denominator of the catalytic-core term Q/(V_bar*k_s)"
    evidence: "Inserting Appendix G Eqs. (G2)-(G3) into Eq. (G1) yields Q/(V_bar*k_s) identically; Eq. (25) directly below Eq. (24) carries k_s in the numerator (requiring k_s in Eq. 24); and Eq. (24) is stated to hold for k_f >= 0, k >= 0, where printed 1/k diverges at k = 0 and omits a factor of psi = 0.1 for autocatalytic droplets (k_f = 0, k_s = k*psi)."
inputs:
  D_B: {quantity: diffusivity_B, unit: m^2/s}
  gamma_beta: {quantity: capillary_length, unit: m}
  psi: {quantity: equilibrium_droplet_volume_fraction, unit: dimensionless}
  V_bar: {quantity: droplet_volume, unit: m^3}
  J: {quantity: surface_material_flux, unit: m^3/s}
  Q: {quantity: core_catalytic_activity, unit: m^3/s}
  k_b: {quantity: backward_reaction_rate, unit: 1/s}
  k_s: {quantity: effective_droplet_reaction_rate, unit: 1/s}
outputs:
  lam: {quantity: perturbation_growth_rate, unit: 1/s}
built_from: [ternary_coarsening_rate_eqG1]
settings: {}
stochastic: false
