# Volume fractions and composition fields
- id: volume_fraction_A
  name: volume fraction of soluble building blocks A
  dimension: dimensionless
  description: Local volume fraction phi^A(r, t) of soluble component A.

- id: volume_fraction_B
  name: volume fraction of droplet material B
  dimension: dimensionless
  description: Local volume fraction phi^B(r, t) of phase-separating droplet material B.

- id: equilibrium_droplet_volume_fraction
  name: equilibrium B volume fraction inside droplets
  dimension: dimensionless
  description: Bulk equilibrium volume fraction psi of component B inside the B-rich droplet phase (Eq. 1).

- id: total_reactive_volume_fraction
  name: conserved total reactive volume fraction
  dimension: dimensionless
  description: System-averaged total volume fraction phibar = phibar^A + phibar^B conserved by A <-> B reactions (Eq. 5).

- id: mean_volume_fraction_B
  name: average volume fraction of component B
  dimension: dimensionless
  description: System-averaged volume fraction phibar^B of droplet material B (Eq. 5).

- id: background_volume_fraction_A
  name: background volume fraction of A
  dimension: dimensionless
  description: Average volume fraction phi_0^A of soluble component A in the background fluid (Eq. 12).

- id: background_volume_fraction_B
  name: background volume fraction of B
  dimension: dimensionless
  description: Average volume fraction phi_0^B of droplet material B in the background fluid (Eqs. 10, 14, 15).

- id: interface_volume_fraction_B_inside
  name: equilibrium B volume fraction inside interface
  dimension: dimensionless
  description: Local thermodynamic equilibrium volume fraction phi_-^B of component B just inside a curved droplet interface (Eqs. 6, A2).

- id: interface_volume_fraction_B_outside
  name: equilibrium B volume fraction outside interface
  dimension: dimensionless
  description: Local thermodynamic equilibrium volume fraction phi_+^B(R) of component B just outside a curved droplet interface (Eqs. 6, A2).

- id: min_volume_fraction_B
  name: minimum B volume fraction in PDE domain
  dimension: dimensionless
  description: Spatial-temporal minimum of phi^B across a numerical Cahn-Hilliard PDE solution, monitored for positivity and undershoot convergence.

# Free energy, chemical potentials, and interfacial parameters
- id: free_energy_density
  name: bulk free energy density
  dimension: "[energy] / [length] ** 3"
  description: Local bulk free energy density f(phi^A, phi^B) (Eq. 1) or binary f(phi^B) (Sec. III, Appendix F).

- id: interaction_modulus_A
  name: free-energy interaction parameter a
  dimension: "[energy] / [length] ** 3"
  description: Positive quadratic free-energy coefficient a for component A (Eq. 1).

- id: interaction_modulus_B
  name: free-energy interaction parameter b
  dimension: "[energy] / [length] ** 3"
  description: Positive double-well free-energy coefficient b for phase-separating component B (Eq. 1).

- id: gradient_coefficient_B
  name: gradient energy coefficient kappa
  dimension: "[energy] / [length]"
  description: Interfacial gradient penalty coefficient kappa for component B in the total free energy F (Eq. 2).

- id: chemical_potential_A
  name: chemical potential of component A
  dimension: "[energy] / [length] ** 3"
  description: Local chemical potential mu^A = df/dphi^A (Appendix A).

- id: chemical_potential_B
  name: chemical potential of component B
  dimension: "[energy] / [length] ** 3"
  description: Local chemical potential mu^B = df/dphi^B (Appendix A).

- id: surface_tension
  name: interfacial surface tension
  dimension: "[energy] / [length] ** 2"
  description: Interfacial free energy per unit area gamma = (1/6)*psi^2*(b*kappa)^(1/2) (p. 2).

- id: laplace_composition_coeff
  name: Laplace-pressure volume-fraction coefficient beta
  dimension: "[length] ** 3 / [energy]"
  description: Coefficient beta = 2/(b*psi) relating Laplace pressure to the shift in equilibrium volume fraction at a curved interface (p. 3, Appendix A).

- id: capillary_length
  name: Gibbs-Thomson capillary length
  dimension: "[length]"
  description: Length scale gamma*beta = w*psi/6 setting the curvature-induced solubility shift phi_+^B(R) = gamma*beta/R (Eq. 6, p. 3).

- id: normalized_surface_tension
  name: dimensionless surface tension
  dimension: dimensionless
  description: Dimensionless interfacial energy gamma / (b * w), equal to 1/12 for a flat binary interface with psi = 1.

# Transport and mobility
- id: mobility_A
  name: diffusive mobility of component A
  dimension: "[length] ** 5 / [energy] / [time]"
  description: Mobility coefficient m_A in the continuum Cahn-Hilliard equation for component A (Eq. 3a).

- id: mobility_B
  name: diffusive mobility of component B
  dimension: "[length] ** 5 / [energy] / [time]"
  description: Mobility coefficient m_B in the continuum Cahn-Hilliard equation for component B (Eq. 3b).

- id: diffusivity_A
  name: diffusivity of component A
  dimension: "[length] ** 2 / [time]"
  description: Diffusion coefficient D_A = m_A * a of soluble component A (Eq. 7a).

- id: diffusivity_B
  name: diffusivity of component B
  dimension: "[length] ** 2 / [time]"
  description: Diffusion coefficient D_B = m_B * b of droplet material B (Eq. 7b).

# Lengths, curvatures, wavenumbers, volumes, densities
- id: interface_width
  name: diffuse interface width
  dimension: "[length]"
  description: Equilibrium flat-interface width w = 2*(kappa/b)^(1/2) (p. 2); also used as the length normalization scale in Figs. 3-10.

- id: normal_coordinate
  name: coordinate normal to a flat interface
  dimension: "[length]"
  description: Spatial coordinate x perpendicular to a planar interface (p. 2).

- id: radial_coordinate
  name: radial distance from droplet center
  dimension: "[length]"
  description: Spherical radial coordinate r from the center of a droplet (Appendix C, Eq. C1).

- id: reaction_diffusion_length
  name: reaction-diffusion length scale
  dimension: "[length]"
  description: Characteristic screening length l = [D_B / (k_f + k_b)]^(1/2) governing concentration profiles around droplets (p. 3, Eq. C1).

- id: droplet_radius
  name: droplet radius
  dimension: "[length]"
  description: Radius R (or stationary radius R_bar, or mean radius <R>) of a spherical droplet.

- id: critical_droplet_radius
  name: critical nucleation radius
  dimension: "[length]"
  description: Unstable critical radius R_crit above which a droplet grows and below which it dissolves.

- id: stability_threshold_radius
  name: stability threshold droplet radius
  dimension: "[length]"
  description: Threshold radius R_stab = [3*D_B*gamma*beta/(2*k_b)]^(1/3) above which multiple droplets in a binary active emulsion are stable (Eq. 19).

- id: interface_mean_curvature
  name: mean curvature of droplet interface
  dimension: "1 / [length]"
  description: Mean curvature H = 1/R of a spherical droplet interface (Appendix A, Eq. A1c).

- id: perturbation_wavenumber
  name: spatial perturbation wavenumber
  dimension: "1 / [length]"
  description: Wave-vector magnitude q = |q| of a linear spatial perturbation mode around the homogeneous state (Appendix F, Eq. F1).

- id: droplet_volume
  name: single-droplet volume
  dimension: "[length] ** 3"
  description: Volume V = (4*pi/3)*R^3 (or stationary volume V_bar) of an individual spherical droplet.

- id: total_droplet_volume
  name: total volume of all droplets
  dimension: "[length] ** 3"
  description: Sum V_tot = sum_i V_i of all droplet volumes in the emulsion (Eqs. 10, 12).

- id: system_volume
  name: system volume
  dimension: "[length] ** 3"
  description: Total volume V_s of the emulsion system (Eqs. 5, 10, 14).

- id: system_radius
  name: equivalent spherical system radius
  dimension: "[length]"
  description: Linear system size R_s = [3*V_s / (4*pi)]^(1/3) compared against reaction-diffusion length l (p. 5).

- id: normalized_system_volume
  name: dimensionless system volume
  dimension: dimensionless
  description: Normalized system volume V_s / w^3 used in finite-system calculations and Figs. 3-10.

- id: droplet_number_density
  name: droplet number density
  dimension: "1 / [length] ** 3"
  description: Number of droplets per unit volume n = N / V_s, or maximal stable droplet density n_c (p. 6-7).

- id: radius_to_reaction_length_ratio
  name: ratio of stationary droplet radius to reaction-diffusion length
  dimension: dimensionless
  description: Dimensionless ratio R_bar / l = (3*k_f/k_b)^(1/2) controlling validity of the small-droplet limit (p. 5).

- id: volume_ratio
  name: ratio of two droplet volumes
  dimension: dimensionless
  description: Steady-state volume ratio V_1 / V_2 for two droplets with unequal catalytic cores (p. 9).

# Time, rates, fluxes, catalytic activity
- id: time
  name: elapsed time
  dimension: "[time]"
  description: Physical time t in droplet growth and coarsening dynamics.

- id: forward_reaction_rate
  name: first-order forward reaction rate constant
  dimension: "1 / [time]"
  description: Rate constant k_f for the first-order conversion A -> B (Eq. 4).

- id: backward_reaction_rate
  name: first-order backward reaction rate constant
  dimension: "1 / [time]"
  description: Rate constant k_b for the first-order conversion B -> A (Eq. 4).

- id: autocatalytic_reaction_rate
  name: second-order autocatalytic reaction rate constant
  dimension: "1 / [time]"
  description: Rate constant k for the autocatalytic reaction A + B -> 2B (Eq. 4).

- id: effective_droplet_reaction_rate
  name: effective production rate constant inside droplets
  dimension: "1 / [time]"
  description: Combined rate constant k_s = k_f + k*psi governing B production inside droplets (Eq. 22).

- id: interface_diffusion_rate
  name: characteristic interface diffusion rate
  dimension: "1 / [time]"
  description: Characteristic rate k_0 = D_B / w^2 of diffusion across the interface width w (p. 5, 8).

- id: critical_forward_rate
  name: critical forward reaction rate
  dimension: "1 / [time]"
  description: Upper bound k_f^c on the forward reaction rate above which droplets dissolve at fixed phi_0^B (Eq. 17).

- id: critical_backward_rate
  name: critical backward reaction rate
  dimension: "1 / [time]"
  description: Upper bound k_b^c on the backward reaction rate above which B-rich droplets cannot exist at fixed phi_0^B (Fig. 6b caption).

- id: normalized_forward_rate
  name: dimensionless forward reaction rate
  dimension: dimensionless
  description: Normalized forward reaction rate constant k_f / k_0.

- id: normalized_backward_rate
  name: dimensionless backward reaction rate
  dimension: dimensionless
  description: Normalized backward reaction rate constant k_b / k_0.

- id: normalized_autocatalytic_rate
  name: dimensionless autocatalytic reaction rate
  dimension: dimensionless
  description: Normalized autocatalytic reaction rate constant k / k_0.

- id: backward_to_forward_rate_ratio
  name: ratio of backward to forward reaction rate
  dimension: dimensionless
  description: Dimensionless ratio k_b / k_f of first-order rate constants.

- id: forward_to_backward_rate_ratio
  name: ratio of forward to backward reaction rate
  dimension: dimensionless
  description: Dimensionless ratio k_f / k_b of first-order rate constants.

- id: normalized_total_rate_cutoff
  name: dimensionless upper reaction-rate cutoff for homogeneous instability
  dimension: dimensionless
  description: Maximum value of (k_f + k_b) / k_0 for which the homogeneous state phi_0^B = k_f/(k_f+k_b) can be linearly unstable (Appendix F, Eq. F2).

- id: instability_margin_rate
  name: homogeneous instability margin rate
  dimension: "1 / [time]"
  description: Margin RHS - |k_f - k_b| of Eq. (F2); positive when the homogeneous state is linearly unstable.

- id: chemical_reaction_flux
  name: local chemical reaction source flux
  dimension: "1 / [time]"
  description: Net local volume-fraction production rate s(phi^A, phi^B) of component B (Eq. 4).

- id: background_fraction_rate
  name: rate of change of background B volume fraction
  dimension: "1 / [time]"
  description: Time derivative d(phi_0^B)/dt of the background volume fraction of B (Eqs. 10, 14).

- id: droplet_radius_growth_rate
  name: droplet radius growth rate
  dimension: "[length] / [time]"
  description: Time derivative dR/dt of a droplet radius (Eq. 13).

- id: droplet_volume_growth_rate
  name: droplet volume growth rate
  dimension: "[length] ** 3 / [time]"
  description: Time derivative dV/dt of a droplet volume (Eqs. 9, 22).

- id: surface_material_flux
  name: interfacial volume flux of droplet material
  dimension: "[length] ** 3 / [time]"
  description: Total diffusive volume flux J of component B leaving a spherical droplet interface (Eqs. 8, 11).

- id: core_catalytic_activity
  name: catalytic activity of an active core
  dimension: "[length] ** 3 / [time]"
  description: Point-source catalytic activity Q_i (or nucleation threshold Q_c, or stability threshold Q_stab) converting A -> B at a core (Eqs. 4, 9, 22, 25).

- id: normalized_core_activity
  name: dimensionless core catalytic activity
  dimension: dimensionless
  description: Normalized core catalytic activity Q / (w^3 * k_0) used in Figs. 7-10.

- id: perturbation_growth_rate
  name: linear perturbation growth or coarsening rate
  dimension: "1 / [time]"
  description: Linear growth/coarsening rate lambda (or Jacobian eigenvalue e_+, e_-, e_tilde) of droplet size differences or homogeneous spatial modes (Eqs. 18, 24, D4, F1, G1).

- id: normalized_coarsening_rate
  name: dimensionless coarsening or mode growth rate
  dimension: dimensionless
  description: Normalized linear growth/coarsening rate lambda / k_0.

# Counts, dimensionless stability numbers, and numerical/geometric settings
- id: droplet_count
  name: number of droplets
  dimension: dimensionless
  description: Number N of coexisting droplets (or maximal stable droplet count N_max).

- id: stability_number_chi
  name: dimensionless emulsion stability number
  dimension: dimensionless
  description: Stability parameter chi = [V_s / (2*pi*D_B*gamma*beta*N)] * [k_f*k_b / (k_f + k_b)]; multiple droplets are stable for chi > 1 (Eq. 21).

- id: fixed_point_count
  name: count of phase-portrait fixed points or critical radii
  dimension: dimensionless
  description: Number of stable, unstable, or total steady-state fixed points (or critical radii) in a 1- or 2-droplet dynamical system.

- id: grid_point_count
  name: spatial discretization support point count
  dimension: dimensionless
  description: Number of axial or radial spectral support points used in numerical PDE simulations (Appendix E).

- id: cylinder_aspect_ratio
  name: cylindrical domain aspect ratio
  dimension: dimensionless
  description: Ratio L_z / (2*R_cyl) of cylinder length to diameter in 3D axisymmetric cylindrical PDE simulations.

- id: droplet_separation_fraction
  name: fractional axial droplet separation
  dimension: dimensionless
  description: Center-to-center axial separation of two droplets divided by cylinder length L_z.

- id: initial_radius_asymmetry
  name: initial fractional radius difference
  dimension: dimensionless
  description: Initial perturbation (R_1 - R_bar) / R_bar = (R_bar - R_2) / R_bar breaking symmetry between two droplets.

- id: normalized_simulation_horizon
  name: dimensionless PDE integration duration
  dimension: dimensionless
  description: Total dimensionless integration time T * k_0 of a Cahn-Hilliard PDE simulation.

- id: normalized_domain_length
  name: dimensionless 1D domain length
  dimension: dimensionless
  description: Periodic domain length L / w in 1D Cahn-Hilliard PDE simulations.

- id: perturbation_amplitude
  name: initial spatial perturbation amplitude
  dimension: dimensionless
  description: Small initial Fourier-mode amplitude epsilon around the homogeneous state phi_0^B.

- id: normalized_wavenumber
  name: dimensionless perturbation wavenumber
  dimension: dimensionless
  description: Dimensionless wavenumber q * w of a Fourier perturbation mode.

- id: normalized_interface_width
  name: dimensionless measured interface width
  dimension: dimensionless
  description: Numerically measured flat-interface width w_num / w from PDE relaxation.

# Normalized dimensionless quantities plotted in Figs. 3-10
- id: normalized_droplet_radius
  name: dimensionless droplet radius
  dimension: dimensionless
  description: Normalized droplet radius R / w (or R_bar / w, R_crit / w, R_1 / w, R_2 / w) plotted in Figs. 3, 4, 7, 8, and 10(a).

- id: normalized_droplet_radius_growth_rate
  name: dimensionless droplet radius growth rate
  dimension: dimensionless
  description: Normalized radial growth rate (dR/dt) / (w * k_0) plotted in Figs. 3(a), 3(c), and 7(a).

- id: normalized_droplet_volume
  name: dimensionless droplet volume
  dimension: dimensionless
  description: Normalized droplet volume V / w^3 (or V_bar / w^3, V_1 / w^3, V_2 / w^3, (V_1 + V_2) / w^3) plotted in Figs. 5, 9(a), and 10(b).

- id: normalized_droplet_volume_difference
  name: dimensionless droplet volume difference
  dimension: dimensionless
  description: Normalized volume difference Delta V / w^3 = |V_1 - V_2| / w^3 between two droplets plotted in Figs. 5(a) and 5(c).

- id: normalized_time
  name: dimensionless elapsed time
  dimension: dimensionless
  description: Normalized time t * k_0 plotted in Figs. 5(a) and 5(c).

- id: normalized_droplet_number_density
  name: dimensionless droplet number density
  dimension: dimensionless
  description: Normalized maximal stable droplet number density n_c * w^3 (Fig. 6b colorbar).

- id: critical_wavelength
  name: linear-onset critical pattern wavelength
  dimension: "[length]"
  description: Critical spatial wavelength lambda_c = 2*pi / q_c = pi*sqrt(2)*(w*l)^(1/2) at the marginal homogeneous instability boundary of Appendix F Eqs. (F1)-(F2).

- id: critical_inverse_wavenumber
  name: linear-onset critical inverse wavenumber
  dimension: "[length]"
  description: Critical inverse wavenumber 1/q_c = sqrt(w*l/2) = [D_B*w^2 / (4*(k_f + k_b))]^(1/4) at the marginal homogeneous instability boundary of Appendix F Eqs. (F1)-(F2).


