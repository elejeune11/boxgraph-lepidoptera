# Reference dimensional scales (the paper reports dimensionless ratios normalized by w and k_0 = D_B/w^2)
- id: w_ref
  quantity: interface_width
  unit: m
  printed: "1.0e-6"
  basis: "Reference length scale w to instantiate dimensional equations for dimensionless-ratio tests; dimensionless observables are invariant under rescaling w."
  alternatives: ["1.0e-8", "1.0"]
  stands_for: "w in Figs. 3-10 normalization"

- id: DB_ref
  quantity: diffusivity_B
  unit: m^2/s
  printed: "1.0e-12"
  basis: "Reference diffusivity D_B (1 um^2/s, typical macromolecular diffusivity) to instantiate dimensional rates via k_0 = D_B/w^2; dimensionless observables are invariant under rescaling D_B."
  alternatives: ["1.0e-10", "1.0"]
  stands_for: "D_B in k_0 = D_B/w^2"

- id: b_ref
  quantity: interaction_modulus_B
  unit: J/m^3
  printed: "1.0"
  basis: "Reference bulk free-energy modulus b (not numerically specified in the paper) used to evaluate Eq. (1), Eq. (2), and Appendix A coexistence; dimensionless ratios and equilibrium volume fractions are independent of b at fixed gamma*beta/R."
  alternatives: ["10.0", "0.5"]
  stands_for: "b in Eq. (1)"

- id: a_ref
  quantity: interaction_modulus_A
  unit: J/m^3
  printed: "1.0"
  basis: "Reference quadratic free-energy modulus a for component A (not numerically specified in the paper)."
  alternatives: ["10.0", "0.1"]
  stands_for: "a in Eq. (1)"

- id: kappa_ref
  quantity: gradient_coefficient_B
  unit: J/m
  printed: "2.5e-13"
  basis: "Chosen via kappa = b * w^2 / 4 with b = 1 J/m^3 and w = 1 um so that w = 2*(kappa/b)^(1/2) matches w_ref."
  alternatives: ["1.0e-12", "5.0e-14"]
  stands_for: "kappa in Eq. (2)"

- id: mB_ref
  quantity: mobility_B
  unit: m^5/(J*s)
  printed: "1.0e-12"
  basis: "Chosen via m_B = D_B / b with D_B = 1e-12 m^2/s and b = 1 J/m^3."
  alternatives: ["1.0e-10", "1.0e-14"]
  stands_for: "m_B in Eq. (3b)"

# Probe points for exercising analytical equations whose outputs are curves/functions
- id: x_probe_interface
  quantity: normal_coordinate
  unit: m
  printed: "1.0e-6"
  basis: "Probe distance x = w_ref normal to a flat interface to evaluate the tanh profile phi^B(x) = (psi/2)[1 + tanh(x/w)]."
  alternatives: ["0.0", "2.0e-6"]
  stands_for: "x in flat interface profile (p. 2)"

- id: R_probe_small
  quantity: droplet_radius
  unit: m
  printed: "1.0e-5"
  basis: "Representative droplet radius R = 10 w_ref (in the R >> w sharp-interface regime) used to evaluate Eq. (6), Eq. (8), Eq. (13), Eq. (22), and Appendix A/C."
  alternatives: ["5.0e-6", "5.0e-5"]
  stands_for: "R in Eqs. (6), (8), (13), (22)"

- id: r_probe_outer
  quantity: radial_coordinate
  unit: m
  printed: "2.0e-5"
  basis: "Representative outer radial coordinate r = 2 R = 20 w_ref to evaluate the Yukawa-like concentration profile Eq. (C1)."
  alternatives: ["1.5e-5", "5.0e-5"]
  stands_for: "r in Eq. (C1)"

- id: phiA_probe
  quantity: volume_fraction_A
  unit: dimensionless
  printed: "0.01"
  basis: "Representative volume fraction phi^A = 0.01 (matching kb/k = 0.01 in Fig. 7) to evaluate Eq. (1) and Eq. (4)."
  alternatives: ["0.005", "0.05"]
  stands_for: "phi^A in Eqs. (1), (4)"

- id: phiB_probe
  quantity: volume_fraction_B
  unit: dimensionless
  printed: "0.05"
  basis: "Representative volume fraction phi^B = 0.05 (intermediate between 0 and psi = 0.1) to evaluate Eq. (1) and Eq. (4)."
  alternatives: ["0.01", "0.09"]
  stands_for: "phi^B in Eqs. (1), (4)"

- id: t_probe_LS
  quantity: time
  unit: s
  printed: "1000.0"
  basis: "Representative coarsening time t = 1000 / k_0 (matching Fig. 5 snapshot timescale) to exercise the Lifshitz-Slyozov scaling models."
  alternatives: ["100.0", "10000.0"]
  stands_for: "t in Lifshitz-Slyozov scaling (p. 7)"

- id: N_pair
  quantity: droplet_count
  unit: dimensionless
  printed: "2"
  basis: "Two-droplet pair (N = 2) analyzed in Sec. III.B.1 (Figs. 4-5) and Sec. IV.B (Figs. 8-10)."
  alternatives: ["3", "5"]
  stands_for: "N in Eqs. (20), (21), (D3)-(D4)"

# Unstated numerical/geometric parameters for reconstructed PDE solvers (Eq. 3b, Appendix E, Appendix F)
- id: pde_1d_L_over_w
  quantity: normalized_domain_length
  unit: dimensionless
  printed: "20.0"
  basis: "Unstated 1D periodic domain length L/w for direct pseudospectral verification of Eq. (3b) dispersion relation Eq. (F1) and flat-interface equilibrium."
  alternatives: ["15.0", "40.0"]
  stands_for: "1D domain length L/w for Eq. (3b)"

- id: pde_1d_eps
  quantity: perturbation_amplitude
  unit: dimensionless
  printed: "1.0e-6"
  basis: "Small initial cosine perturbation amplitude around phi_0^B so Eq. (3b) evolves strictly in the linear regime."
  alternatives: ["1.0e-7", "1.0e-5"]
  stands_for: "linear perturbation amplitude in Eq. (3b)"

- id: pde_1d_T_k0
  quantity: normalized_simulation_horizon
  unit: dimensionless
  printed: "5.0"
  basis: "Dimensionless integration time T*k_0 for measuring the linear mode growth rate of Eq. (3b)."
  alternatives: ["2.0", "10.0"]
  stands_for: "integration horizon for linear mode extraction"

- id: pde_1d_qw_probe
  quantity: normalized_wavenumber
  unit: dimensionless
  printed: "0.9424778"
  basis: "Dimensionless wavenumber q*w = 2*pi*3/20 (mode m=3 on L=20w, near the peak-growth wavenumber q*w = 1) to test Eq. (F1)."
  alternatives: ["0.6283185", "1.2566371"]
  stands_for: "q*w in Eq. (F1)"

- id: pde_1d_kf_test_unstable
  quantity: normalized_forward_rate
  unit: dimensionless
  printed: "0.05"
  basis: "Symmetric reaction rate k_f/k_0 = k_b/k_0 = 0.05 (k_f+k_b = 0.1 k_0 < 0.25 k_0) in the unstable spinodal regime where both printed and exact Eq. (F1) predict growth, but differ by a factor of ~4."
  alternatives: ["0.02", "0.08"]
  stands_for: "k_f/k_0 = k_b/k_0 for testing Eq. (F1)"

- id: pde_1d_kf_test_discrepancy
  quantity: normalized_forward_rate
  unit: dimensionless
  printed: "0.2"
  basis: "Symmetric reaction rate k_f/k_0 = k_b/k_0 = 0.2 (k_f+k_b = 0.4 k_0, strictly between exact cutoff 0.25 k_0 and printed cutoff 1.0 k_0) where printed Eq. (F1) predicts instability (+0.35 k_0) while direct Eq. (3b) PDE integration is stable (-0.15 k_0)."
  alternatives: ["0.15", "0.3"]
  stands_for: "k_f/k_0 = k_b/k_0 discriminating printed vs exact Eq. (F2)"

- id: axi_aspect_ratio
  quantity: cylinder_aspect_ratio
  unit: dimensionless
  printed: "1.2"
  basis: "Unstated cylinder aspect ratio L_z / (2*R_cyl) in Appendix E (only total volume V_s is stated in Fig. 5)."
  alternatives: ["1.0", "1.5"]
  stands_for: "L_z / (2*R_cyl) in Appendix E cylindrical geometry"

- id: axi_sep_frac
  quantity: droplet_separation_fraction
  unit: dimensionless
  printed: "0.5"
  basis: "Unstated axial center-to-center droplet separation as a fraction of cylinder length L_z (droplets placed symmetrically at z = L_z/4 and 3*L_z/4)."
  alternatives: ["0.4", "0.6"]
  stands_for: "initial droplet axial spacing in Appendix E"

- id: axi_dr_frac
  quantity: initial_radius_asymmetry
  unit: dimensionless
  printed: "0.05"
  basis: "Unstated small initial fractional radius difference (R_1 - R_bar)/R_bar = 5% to initiate linear coarsening/equalization of the two droplets in Fig. 5."
  alternatives: ["0.02", "0.08"]
  stands_for: "initial volume difference in Appendix E"

- id: axi_T_k0
  quantity: normalized_simulation_horizon
  unit: dimensionless
  printed: "1500.0"
  basis: "Unstated integration duration T*k_0 for extracting the exponential coarsening rate lambda of Delta V(t) in Appendix E (Fig. 5a/5c plots extend to ~9000 k_0^-1; 1500 k_0^-1 captures clean linear exponential behavior after fast background equilibration)."
  alternatives: ["1000.0", "2500.0"]
  stands_for: "integration horizon in Appendix E"

- id: pde_1d_kb_test_unstable
  quantity: normalized_backward_rate
  unit: dimensionless
  printed: "0.05"
  basis: "Symmetric backward rate k_b/k_0 = k_f/k_0 = 0.05 pairing with pde_1d_kf_test_unstable to test Eq. (F1) in the spinodal unstable regime."
  alternatives: ["0.02", "0.08"]
  stands_for: "k_b/k_0 = k_f/k_0 for testing Eq. (F1)"

- id: pde_1d_kb_test_discrepancy
  quantity: normalized_backward_rate
  unit: dimensionless
  printed: "0.2"
  basis: "Symmetric backward rate k_b/k_0 = k_f/k_0 = 0.2 pairing with pde_1d_kf_test_discrepancy where printed Eq. (F2) predicts instability while direct Eq. (3b) PDE integration is stable."
  alternatives: ["0.15", "0.3"]
  stands_for: "k_b/k_0 = k_f/k_0 discriminating printed vs exact Eq. (F2)"

- id: q_probe_disp
  quantity: perturbation_wavenumber
  unit: 1/m
  printed: "9.424778e5"
  basis: "Physical perturbation wavenumber q = qw / w_ref = 0.9424778 / (1e-6 m) matching pde_1d_qw_probe for evaluating Eq. (F1)."
  alternatives: ["6.283185e5", "1.256637e6"]
  stands_for: "q in Eq. (F1)"

- id: phi0A_probe
  quantity: background_volume_fraction_A
  unit: dimensionless
  printed: "0.01"
  basis: "Representative background volume fraction phi_0^A = k_b/k = 0.01 (Fig. 7 parameters) for evaluating Eqs. (9)-(12)."
  alternatives: ["0.005", "0.02"]
  stands_for: "phi_0^A in Eqs. (9)-(10)"

- id: phi0B_probe_autocat
  quantity: background_volume_fraction_B
  unit: dimensionless
  printed: "0.001"
  basis: "Representative small background B volume fraction 0 <= phi_0^B < phi_+^B(R_bar) ≈ 1.41e-3 for Sec. IV autocatalytic droplets (Fig. 7/9b parameters), ensuring physical efflux J > 0 and nonnegative phi_0^A in Eqs. (9)-(12), (22), (24), (25), and (G1)."
  alternatives: ["0.0", "0.0013"]
  stands_for: "phi_0^B in Sec. IV Eqs. (9)-(12), (22), (25)"

- id: Q1_below_Qstab_fig10b
  quantity: normalized_core_activity
  unit: dimensionless
  printed: "100"
  basis: "Representative weaker-core activity Q_1 < Q_stab ≈ 209.4 w^3 k_0 paired with Q_2 = 300 w^3 k_0 > Q_stab in Fig. 10(b) to test the p. 10 claim that only a single droplet is stable when only one core exceeds Q_stab; alternative 150 lies inside the bistable window 133.5 < Q_1/(w^3 k_0) < 213.9."
  alternatives: ["50", "150"]
  stands_for: "Q_1/(w^3 k_0) < Q_stab/(w^3 k_0) in Fig. 10(b)"

- id: D_B_insect_cortex_added
  quantity: diffusivity_B
  unit: m^2/s
  printed: "4e-14"
  basis: "Insect epithelial cortical F-actin FRAP diffusivity D = 0.04 um^2/s = 4e-14 m^2/s from Hannezo et al. (2015) (hannezo2015/diffusion_coeff_frap, +/- 0.03 um^2/s -> [1e-14, 7e-14] m^2/s), used as the closest measured insect-cortex transport baseline for Lepidoptera scale cells where FRAP has not yet been performed."
  alternatives: ["1e-14", "7e-14"]
  stands_for: "droplet/condensate component diffusivity D_B in Appendix F Eq. (F1) for an insect cortical sheet"

- id: k_half_insect_cortex_added
  quantity: forward_reaction_rate
  unit: 1/s
  printed: "0.033333"
  basis: "Symmetric split k_f = k_b = 1/(2*tau) = 1/30 s^-1 = 0.033333 s^-1 so total chemical turnover rate k_f + k_b = 1/tau = 1/15 s^-1 matches Hannezo et al. (2015)'s insect cortical FRAP turnover time tau = 15 +/- 7 s (hannezo2015/turnover_time_frap, giving k_f = k_b in [0.0227, 0.0625] s^-1)."
  alternatives: ["0.0227", "0.0625"]
  stands_for: "forward reaction rate k_f = 1/(2*tau) in Appendix F Eq. (F1) for insect cortical actin turnover"

- id: k_b_half_insect_cortex_added
  quantity: backward_reaction_rate
  unit: 1/s
  printed: "0.033333"
  basis: "Symmetric backward turnover rate k_b = 1/(2*tau) = 1/30 s^-1 paired with k_half_insect_cortex_added so k_f + k_b = 1/15 s^-1 matches Hannezo et al. (2015)'s FRAP turnover time tau = 15 +/- 7 s."
  alternatives: ["0.0227", "0.0625"]
  stands_for: "backward reaction rate k_b = 1/(2*tau) in Appendix F Eq. (F1) for insect cortical actin turnover"

- id: w_lloyd_blue_half_added
  quantity: interface_width
  unit: m
  printed: "2.19e-7"
  basis: "Half of the measured Heliconius sara iridescent blue actin bundle width (0.438 um / 2 = 0.219 um = 2.19e-7 m, lloyd2024/actin_bundle_width_blue) used as an upper-bound proxy for the phase-field interface width w in Zwicker Appendix F Eq. (F1); alternatives span the bare hydrodynamic screening scale 0.10 um (hannezo2015) and full confocal bundle width 0.438 um."
  alternatives: ["1.0e-7", "4.38e-7"]
  stands_for: "Cahn-Hilliard interfacial width w estimated from Lloyd 2024 pupal actin bundle half-width"

- id: w_hannezo_lh_added
  quantity: interface_width
  unit: m
  printed: "1.0e-7"
  basis: "Hydrodynamic/cortical screening scale l_h = 0.10 um = 1.0e-7 m from Hannezo et al. (2015) Main p. 3 (equivalent to w = sqrt(2)*l_c in ModelAtlas's verified Zwicker-Hannezo onset family), representing a sharper bundle interface than the confocal-broadened 0.219 um half-width."
  alternatives: ["5.0e-8", "2.19e-7"]
  stands_for: "Cahn-Hilliard interfacial width w set to Hannezo 2015's 0.10 um cortical screening scale"

