# ==============================================================================
# 1. Dimensional Scales, Continuum Free Energy & Interface Coexistence (Sec. II, App. A, C)
# ==============================================================================
- id: run_ternary_free_energy
  model: ternary_free_energy_eq1
  inputs: {a: a_ref, b: b_ref, psi: psi_autocat, phi_A: phiA_probe, phi_B: phiB_probe}
  outputs: {f: f_ternary_probe, mu_A: muA_probe, mu_B: muB_probe}

- id: run_binary_free_energy
  model: binary_free_energy_sec3
  inputs: {b: b_ref, psi: psi_binary, phi_B: phiB_probe}
  outputs: {f: f_binary_probe, mu_B: muB_binary_probe}

- id: run_interface_width
  model: interface_width_w
  inputs: {kappa: kappa_ref, b: b_ref}
  outputs: {w: w_from_micro}

- id: run_surface_tension
  model: surface_tension_gamma
  inputs: {psi: psi_binary, b: b_ref, kappa: kappa_ref}
  outputs: {gamma: gamma_from_micro}

- id: run_flat_interface_profile
  model: flat_interface_profile
  inputs: {psi: psi_binary, x: x_probe_interface, w: w_from_micro}
  outputs: {phi_B: phiB_flat_probe}

- id: run_laplace_beta
  model: laplace_coeff_beta
  inputs: {b: b_ref, psi: psi_binary}
  outputs: {beta: beta_from_micro}

- id: run_capillary_length_gb
  model: capillary_length_gb
  inputs: {w: w_from_micro, psi: psi_binary}
  outputs: {gamma_beta: gb_from_w}

- id: run_capillary_length_micro
  model: capillary_length_from_micro
  inputs: {b: b_ref, kappa: kappa_ref, psi: psi_binary}
  outputs: {gamma_beta: gb_from_micro}

- id: run_diffusivity
  model: diffusivity_from_mobility
  inputs: {m_B: mB_ref, b: b_ref}
  outputs: {D_B: DB_from_mobility}

- id: run_k0_ref
  model: interface_diffusion_rate_k0
  inputs: {D_B: DB_ref, w: w_ref}
  outputs: {k_0: k0_ref}

- id: run_gibbs_thomson_eq6
  model: gibbs_thomson_eq6
  inputs: {psi: psi_binary, gamma_beta: gb_from_w, R: R_probe_small}
  outputs: {phi_plus_B: phi_plus_B_eq6, phi_minus_B: phi_minus_B_eq6}

- id: run_coexistence_eqA1
  model: coexistence_exact_eqA1
  inputs: {b: b_ref, psi: psi_binary, gamma: gamma_from_micro, R: R_probe_small}
  outputs: {phi_plus_B: phi_plus_B_eqA1, phi_minus_B: phi_minus_B_eqA1}

# ==============================================================================
# 2. Binary First-Order Emulsions: Parameter Unnormalization & Analytical Models (Sec. III)
# ==============================================================================
- id: run_params_fig3a
  model: unnormalize_binary_params
  inputs: {kf_norm: kf_over_k0_fig3a, kb_norm: kb_over_k0_fig3a, Vs_norm: Vs_over_w3_fig3cd, w: w_ref, D_B: DB_ref}
  outputs: {k_0: k0_fig3a, k_f: kf_fig3a, k_b: kb_fig3a, V_s: Vs_fig3cd, gamma_beta: gb_fig3}

- id: run_system_radius_fig3cd
  model: system_radius_Rs
  inputs: {V_s: Vs_fig3cd}
  outputs: {R_s: Rs_fig3cd}

- id: run_reaction_length_fig3a
  model: reaction_diffusion_length_l
  inputs: {D_B: DB_ref, k_f: kf_fig3a, k_b: kb_fig3a}
  outputs: {l: l_fig3a}

- id: run_phi0B_fig3a
  model: binary_background_ss_eq15
  inputs: {k_f: kf_fig3a, k_b: kb_fig3a}
  outputs: {phi_0_B: phi0B_fig3a_pred}

# Boundary checks on p. 5: 3 k_f = k_b -> phi_0^B = 1/4, R_bar / l = 1; k_f = k_b -> phi_0^B = 1/2; k_f = 3 k_b -> phi_0^B = 3/4
- id: run_kb_at_Bdroplet_bound
  model: rate_from_ratio
  inputs: {k_f_in: kf_fig3a, kb_over_kf: kb_over_kf_Bdroplet_bound}
  outputs: {k_b: kb_at_Bdroplet_bound}

- id: run_phi0B_Bdroplet_bound
  model: binary_background_ss_eq15
  inputs: {k_f: kf_fig3a, k_b: kb_at_Bdroplet_bound}
  outputs: {phi_0_B: phi0B_Bdroplet_bound_pred}

- id: run_Rbar_at_Bdroplet_bound
  model: binary_single_radius_eq16
  inputs: {D_B: DB_ref, k_f: kf_fig3a, k_b: kb_at_Bdroplet_bound}
  outputs: {R_bar: Rbar_at_Bdroplet_bound}

- id: run_l_at_Bdroplet_bound
  model: reaction_diffusion_length_l
  inputs: {D_B: DB_ref, k_f: kf_fig3a, k_b: kb_at_Bdroplet_bound}
  outputs: {l: l_at_Bdroplet_bound}

- id: run_Rbar_over_l_at_quarter
  model: ratio_Rbar_over_l
  inputs: {R_bar: Rbar_at_Bdroplet_bound, l: l_at_Bdroplet_bound}
  outputs: {Rbar_over_l: Rbar_over_l_at_quarter_pred}

- id: run_kb_at_symmetric
  model: rate_from_ratio
  inputs: {k_f_in: kf_fig3a, kb_over_kf: kb_over_kf_symmetric}
  outputs: {k_b: kb_at_symmetric}

- id: run_phi0B_bicontinuous
  model: binary_background_ss_eq15
  inputs: {k_f: kf_fig3a, k_b: kb_at_symmetric}
  outputs: {phi_0_B: phi0B_bicontinuous_pred}

- id: run_kf_at_Adroplet_bound
  model: forward_rate_from_ratio
  inputs: {k_b_in: kb_fig3a, kf_over_kb: kf_over_kb_Adroplet_bound}
  outputs: {k_f: kf_at_Adroplet_bound}

- id: run_phi0B_Adroplet_bound
  model: binary_background_ss_eq15
  inputs: {k_f: kf_at_Adroplet_bound, k_b: kb_fig3a}
  outputs: {phi_0_B: phi0B_Adroplet_bound_pred}

# Single-droplet & flux models evaluated at Fig. 3(a)
- id: run_outer_profile_eqC1
  model: outer_profile_eqC1
  inputs: {phi_0_B: phi0B_fig3a_pred, phi_plus_B: phi_plus_B_eq6, R: R_probe_small, r: r_probe_outer, l: l_fig3a}
  outputs: {phi_B: phiB_outer_probe}

- id: run_surface_flux_eq8
  model: surface_flux_eq8_11
  inputs: {R: R_probe_small, D_B: DB_ref, l: l_fig3a, gamma_beta: gb_fig3, phi_0_B: phi0B_fig3a_pred}
  outputs: {J: J_eq8_fig3a}

- id: run_surface_flux_small_R
  model: surface_flux_small_R
  inputs: {R: R_probe_small, D_B: DB_ref, gamma_beta: gb_fig3, phi_0_B: phi0B_fig3a_pred}
  outputs: {J: J_smallR_fig3a}

- id: run_binary_growth_eq13
  model: binary_droplet_growth_eq13
  inputs: {R: R_probe_small, D_B: DB_ref, phi_0_B: phi0B_fig3a_pred, gamma_beta: gb_fig3, k_b: kb_fig3a}
  outputs: {dR_dt: dRdt_fig3a}

- id: run_binary_Rbar_eq16_fig3a
  model: binary_single_radius_eq16
  inputs: {D_B: DB_ref, k_f: kf_fig3a, k_b: kb_fig3a}
  outputs: {R_bar: Rbar_eq16_fig3a}

- id: run_binary_Rcrit_fig3a
  model: binary_critical_radius_approx
  inputs: {gamma_beta: gb_fig3, phi_0_B: phi0B_fig3a_pred}
  outputs: {R_crit: Rcrit_approx_fig3a}

- id: run_binary_kfc_eq17_fig3b
  model: binary_critical_rate_eq17
  inputs: {D_B: DB_ref, gamma_beta: gb_fig3, phi_0_B: phi0B_fig3a_pred}
  outputs: {k_f_c: kfc_eq17_fig3b, k_b_c: kbc_eq17_fig3b}

- id: run_binary_kbc_fig6b
  model: binary_critical_kb_fig6b
  inputs: {k_0: k0_fig3a, phi_0_B: phi0B_fig3a_pred}
  outputs: {k_b_c: kbc_fig6b_pred}

- id: run_binary_single_ss_fig3a
  model: binary_single_droplet_ss_solver
  inputs: {D_B: DB_ref, gamma_beta: gb_fig3, k_f: kf_fig3a, k_b: kb_fig3a}
  outputs: {R_crit: Rcrit_exact_fig3a, R_bar: Rbar_exact_fig3a, k_f_c: kfc_exact_fig3b}

# Multi-droplet binary stability: Fig. 4(a), Fig. 4(b), Fig. 6(a), Appendix D
