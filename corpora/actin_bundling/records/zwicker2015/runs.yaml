  outputs: {R_stab: Rstab_fig4b}

- id: run_dense_volume_eq20_fig4b
  model: binary_dense_volume_eq20
  inputs: {k_f: kf_fig4b, k_b: kb_fig4b, V_s: Vs_fig4, N: N_pair}
