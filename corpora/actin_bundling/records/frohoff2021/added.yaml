# ==========================================================================
# Representative dimensional parameters for Appendix A scale model
# (paper is nondimensional and prints no dimensional physical constants)
# ==========================================================================

- id: L0_dim_added
  quantity: length_dim
  unit: m
  printed: "1.0 x 10^-6"
  basis: "Representative mesoscopic reference length scale L_0 = 1 um for phase-separating soft matter / ternary mixtures; Appendix A gives no dimensional values."
  alternatives: ["1.0 x 10^-7", "1.0 x 10^-5"]
  stands_for: "L_0 in Appendix A, Eqs. (A2)-(A6)"

- id: L_dim_added
  quantity: length_dim
  unit: m
  printed: "1.2566370614359172 x 10^-5"
  basis: "Chosen so L / L_0 = ell = 4*pi matching Figs. 2, 3, 6-8, 10-13, 16."
  alternatives: ["2.5132741228718345 x 10^-5", "3.141592653589793 x 10^-5"]
  stands_for: "L = ell * L_0 in Appendix A"

- id: Q1_dim_added
  quantity: mobility_dim
  unit: m^5/(J*s)
  printed: "1.0 x 10^-15"
  basis: "Representative CH mobility Q_1 = 10^-15 m^5/(J*s) (consistent with diffusivity D ~ Q_1 * f'' ~ 10^-12 m^2/s for f'' ~ 10^3 Pa); Appendix A prints no dimensional mobilities."
  alternatives: ["1.0 x 10^-16", "1.0 x 10^-14"]
  stands_for: "Q_1 in Eq. (A1) and tau = L_0^4 / (Q_1 * kappa_1)"

- id: Q2_dim_added
  quantity: mobility_dim
  unit: m^5/(J*s)
  printed: "1.0 x 10^-15"
  basis: "Chosen equal to Q_1 so Q = Q_2 / Q_1 = 1 as fixed throughout the paper."
  alternatives: ["5.0 x 10^-16", "2.0 x 10^-15"]
  stands_for: "Q_2 in Eq. (A1) and Eq. (A3)"

- id: kappa1_dim_added
  quantity: interface_stiffness_dim
  unit: J/m
  printed: "1.0 x 10^-9"
  basis: "Representative interfacial stiffness kappa_1 = 1 nJ/m giving capillary/gradient energy kappa_1/L_0^2 = 10^3 J/m^3; Appendix A prints no dimensional stiffness."
  alternatives: ["1.0 x 10^-10", "1.0 x 10^-8"]
  stands_for: "kappa_1 in Eq. (A1) and Eqs. (A3)-(A6)"

- id: kappa2_dim_added
  quantity: interface_stiffness_dim
  unit: J/m
  printed: "3.82 x 10^-9"
  basis: "Chosen so kappa = kappa_2 / kappa_1 = 3.82 matching Figs. 1(b), 2, 4, 11-13."
  alternatives: ["1.4 x 10^-10", "1.0 x 10^-9"]
  stands_for: "kappa_2 in Eq. (A1) and Eq. (A3)"

- id: zeta_dim_added
  quantity: bulk_energy_prefactor
  unit: dimensionless
  printed: "1.0"
  basis: "Unit bulk energy prefactor zeta_1 = zeta_2 = 1; Appendix A does not specify dimensional zeta_i."
  alternatives: ["0.5", "2.0"]
  stands_for: "zeta_1, zeta_2 in Eq. (A1) and Eqs. (A3), (A6)"

- id: a1_dim_added
  quantity: landau_coeff_dim
  unit: J/m^3
  printed: "-5.5 x 10^2"
  basis: "Chosen so a = a_1 / (b_1 * phi_hat_1^2) = -0.55 matching Fig. 2(a) with kappa_1/L_0^2 = 10^3 J/m^3."
  alternatives: ["-1.5 x 10^3", "1.44 x 10^3"]
  stands_for: "a_1 in Eq. (A5)"

- id: a2_dim_added
  quantity: landau_coeff_dim
  unit: J/m^3
  printed: "-9.3 x 10^2"
  basis: "Chosen so a_Delta = a_tilde_2 - a_tilde_1 = -0.38 matching Fig. 2(a) with b_1 = b_2."
  alternatives: ["-2.45 x 10^3", "-5.5 x 10^2"]
  stands_for: "a_2 in Eq. (A5)"

- id: b_dim_added
  quantity: landau_coeff_dim
  unit: J/m^3
  printed: "1.0 x 10^3"
  basis: "Chosen so phi_hat_i = sqrt(kappa_1 / (zeta_i * b_i * L_0^2)) = 1; Appendix A prints no dimensional Landau quartic coefficients."
  alternatives: ["5.0 x 10^2", "2.0 x 10^3"]
  stands_for: "b_1, b_2 in Eqs. (A5)-(A6)"

- id: gamma1_dim_added
  quantity: coupling_strength_dim
  unit: J/m^3
  printed: "2.601 x 10^3"
  basis: "Chosen so gamma_tilde_1 = rho + alpha = 2.601 (rho = 1.3, alpha = 1.301, Fig. 11c) with kappa_1/L_0^2 = 10^3 J/m^3."
  alternatives: ["5.0 x 10^2", "2.95 x 10^3"]
  stands_for: "gamma_1 in Eq. (A1) and Eq. (A3)"

- id: gamma2_dim_added
  quantity: coupling_strength_dim
  unit: J/m^3
  printed: "-1.0"
  basis: "Chosen so gamma_tilde_2 = rho - alpha = -0.001 (rho = 1.3, alpha = 1.301, Fig. 11c) with kappa_1/L_0^2 = 10^3 J/m^3."
  alternatives: ["5.0 x 10^2", "-2.5 x 10^2"]
  stands_for: "gamma_2 in Eq. (A1) and Eq. (A3)"

# ==========================================================================
# Unstated probe points for Fig. 1 general stability models and Appendix D/E
# ==========================================================================

- id: alpha_fig1ab_added
  quantity: nonvariational_coupling
  unit: dimensionless
  printed: "0.5"
  basis: "Fig. 1(a)-(b) specifies only Delta = alpha^2 - rho^2 = 0.25 (p. 5); choosing rho = 0, alpha = 0.5 gives Delta = 0.25 exactly, and all Eqs. (12)-(21) depend on (rho, alpha) solely through Delta."
  alternatives: ["1.0", "1.5"]
  stands_for: "alpha yielding Delta = 0.25 in Fig. 1(a)-(b)"

- id: f2_pp_fig1a_probe_added
  quantity: bulk_energy_curvature
  unit: dimensionless
  printed: "-0.25"
  basis: "Interior point along the Fig. 1(a) Turing boundary between f_2''^cd2 = -0.3282 and f_2''^{T_end} = -0.1871; the paper plots curves in Fig. 1(a) without printing tabular coordinates."
  alternatives: ["-0.30", "-0.20"]
  stands_for: "f_2'' probe on Turing line in Fig. 1(a)"

- id: f2_pp_fig1b_probe_added
  quantity: bulk_energy_curvature
  unit: dimensionless
  printed: "0.2"
  basis: "Interior point along the Fig. 1(b) Hopf boundary (|f_2''| < sqrt(Delta/Q) = 0.5) and CH hyperbola; Fig. 1(b) plots curves without tabular coordinates."
  alternatives: ["0.1", "0.35"]
  stands_for: "f_2'' probe on Hopf/CH curves in Fig. 1(b)"

- id: eps_subcrit_probe_added
  quantity: bifurcation_distance
  unit: dimensionless
  printed: "0.01"
  basis: "Small positive distance epsilon > 0 into the subcritical side of the bifurcation in Eq. (D17) to evaluate leading-order amplitude A_0 for Fig. 8(d); the paper does not tabulate A_0 at a specific epsilon."
  alternatives: ["0.001", "0.05"]
  stands_for: "epsilon in Eq. (D17)"

- id: amp1_eqE_test_added
  quantity: order_parameter
  unit: dimensionless
  printed: "0.8"
  basis: "Representative smooth field amplitude for verifying operator equivalence between Eq. (4) at rho = 0 and Eqs. (E1)-(E3) and non-monotonicity of F_tilde (pp. 26-27)."
  alternatives: ["0.3", "1.2"]
  stands_for: "test amplitude of phi_1 in Eqs. (E1)-(E3)"

- id: amp2_eqE_test_added
  quantity: order_parameter
  unit: dimensionless
  printed: "0.6"
  basis: "Representative smooth field amplitude for phi_2 in verifying Eqs. (E1)-(E3) equivalence and sign of d(F_tilde)/dt."
  alternatives: ["0.2", "1.0"]
  stands_for: "test amplitude of phi_2 in Eqs. (E1)-(E3)"

