id: linear_dispersion_variational_limit
name: passive variational limit (alpha = 0) linear dispersion relation (Sec. III B)
role: model
stated:
  page: 7
  printed_page: "042602-7"
  quote: "is a Lyapunov functional, the discriminant in Eqs. (12) is"
  where: "Sec. III B / Fig. 2"
equation: "lambda_pm(q) = (1/2)*q^2 * (-[q^2*(1+kappa) + 2*a + a_Delta + 3*(phi_bar_1^2 + phi_bar_2^2)] +- sqrt([q^2*(1-kappa) + 3*(phi_bar_1^2 - phi_bar_2^2) - a_Delta]^2 + 4*rho^2))"
inputs:
  q: {quantity: rescaled_wavenumber, unit: dimensionless}
  a: {quantity: effective_temperature, unit: dimensionless}
  a_Delta: {quantity: temperature_shift, unit: dimensionless}
  kappa: {quantity: rigidity_ratio, unit: dimensionless}
  phi1_bar: {quantity: mean_concentration, unit: dimensionless}
  phi2_bar: {quantity: mean_concentration, unit: dimensionless}
  rho: {quantity: variational_coupling, unit: dimensionless}
outputs:
  lam_plus: {quantity: growth_rate_dimless, unit: dimensionless}
  lam_minus: {quantity: growth_rate_dimless, unit: dimensionless}
settings: {}
stochastic: false
