id: linear_dispersion_general_eq12
name: general two-field Cahn-Hilliard linear dispersion relation (Eqs. 10-12)
role: model
stated:
  page: 4
  printed_page: "042602-4"
  quote: "the resulting dispersion relations"
  where: "Eqs. (10)-(12)"
equation: "lambda_tilde_pm = (1/2)*[-tr(B) +- sqrt((tr B)^2 - 4*det(B))], lambda_pm = q^2 * lambda_tilde_pm, tr(B) = q^2*(1 + Q*kappa) + f_1'' + Q*f_2'', det(B) = Q*(q^2 + f_1'')*(kappa*q^2 + f_2'') + Q*(alpha^2 - rho^2)"
inputs:
  q: {quantity: rescaled_wavenumber, unit: dimensionless}
  f1_pp: {quantity: bulk_energy_curvature, unit: dimensionless}
  f2_pp: {quantity: bulk_energy_curvature, unit: dimensionless}
  Q: {quantity: mobility_ratio, unit: dimensionless}
  kappa: {quantity: rigidity_ratio, unit: dimensionless}
  rho: {quantity: variational_coupling, unit: dimensionless}
  alpha: {quantity: nonvariational_coupling, unit: dimensionless}
outputs:
  re_lam_plus: {quantity: growth_rate_dimless, unit: dimensionless}
  re_lam_minus: {quantity: growth_rate_dimless, unit: dimensionless}
  im_lam_plus: {quantity: oscillation_frequency_dimless, unit: dimensionless}
  re_lam_tilde_plus: {quantity: rescaled_growth_rate, unit: dimensionless}
  tr_B: {quantity: matrix_trace, unit: dimensionless}
  det_B: {quantity: matrix_determinant, unit: dimensionless}
  discriminant: {quantity: eigenvalue_discriminant, unit: dimensionless}
settings: {}
stochastic: false
