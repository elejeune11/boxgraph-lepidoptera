id: steady_state_profile_eq7
name: 1D periodic steady-state spatial profile evaluator phi_1(x), phi_2(x) (Eqs. 5, 7, Figs. 5c, 6c, 15b)
role: model
stated:
  page: 4
  printed_page: "042602-4"
  quote: "For steady states without mean flow, we can integrate"
  where: "Eqs. (5), (7), and Figs. 5(c), 6(c), 15(b)"
equation: "0 = -(1/ell^2)*d_xx phi_1 + f_1'(phi_1) - (rho+alpha)*phi_2 - mu_1, 0 = -(kappa/ell^2)*d_xx phi_2 + f_2'(phi_2) - (rho-alpha)*phi_1 - mu_2; periodic BCs on [-1/2, 1/2], evaluated at x with periodic translation gauge phase_x0"
built_from:
  - steady_state_continuation_eq7
inputs:
  x: {quantity: position_dimless, unit: dimensionless}
  a: {quantity: effective_temperature, unit: dimensionless}
  a_Delta: {quantity: temperature_shift, unit: dimensionless}
  kappa: {quantity: rigidity_ratio, unit: dimensionless}
  Q: {quantity: mobility_ratio, unit: dimensionless}
  rho: {quantity: variational_coupling, unit: dimensionless}
  alpha: {quantity: nonvariational_coupling, unit: dimensionless}
  ell: {quantity: domain_size_dimless, unit: dimensionless}
  phi1_bar: {quantity: mean_concentration, unit: dimensionless}
  phi2_bar: {quantity: mean_concentration, unit: dimensionless}
  n_period: {quantity: mode_number, unit: dimensionless}
  init_amp_1: {quantity: order_parameter, unit: dimensionless}
  init_amp_2: {quantity: order_parameter, unit: dimensionless}
outputs:
  phi1: {quantity: order_parameter, unit: dimensionless}
  phi2: {quantity: order_parameter, unit: dimensionless}
settings:
  n_modes: 36
  tol: 1.0e-11
  start_a: null
  start_phi2_bar: null
  step_size: 0.15
  warm_start_steps: 0
  warm_start_dt: 0.05
  linear_seed: null
  phase_x0: 0.0
stochastic: false
