id: general_stability_boundaries_delta
name: general linear stability boundaries parameterized directly by Delta (Eqs. 14, 19, 20, Fig. 1)
role: model
stated:
  page: 5
  printed_page: "042602-5"
  quote: "Linear stability diagrams in the"
  where: "Fig. 1 and Eqs. (14), (19), (20)"
equation: "f_1''^H = -Q*f_2'' (Delta > Q*f_2''^2); f_1''^T = (f_2'' -+ 2*sqrt(kappa*Delta))/kappa (kappa >=/< 1/Q); f_1''^CH = -Delta / f_2''"
built_from:
  - hopf_threshold_general_eq14_15
  - turing_threshold_general_eq17_19
  - ch_threshold_general_eq20
inputs:
  f2_pp: {quantity: bulk_energy_curvature, unit: dimensionless}
  Q: {quantity: mobility_ratio, unit: dimensionless}
  kappa: {quantity: rigidity_ratio, unit: dimensionless}
  Delta: {quantity: coupling_difference, unit: dimensionless}
outputs:
  f1_pp_H: {quantity: bulk_energy_curvature, unit: dimensionless}
  f1_pp_T: {quantity: bulk_energy_curvature, unit: dimensionless}
  f1_pp_CH: {quantity: bulk_energy_curvature, unit: dimensionless}
settings: {}
stochastic: false
