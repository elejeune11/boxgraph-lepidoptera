id: steady_state_continuation_eq7
name: parameter-continued periodic steady-state branch solver (Eq. 7)
role: model
stated:
  page: 4
  printed_page: "042602-4"
  quote: "Numerical path continuation—we use the"
  where: "Sec. II, Eqs. (7)-(8)"
equation: "0 = -q_n^2 d_xx phi_1 + f_1'(phi_1) - (rho + alpha)*phi_2 - mu_1, 0 = -kappa*q_n^2 d_xx phi_2 + f_2'(phi_2) - (rho - alpha)*phi_1 - mu_2, continued along a or phi_bar_2"
built_from:
  - steady_state_bifurcation_eq7
inputs:
  a: {quantity: effective_temperature, unit: dimensionless}
  a_Delta: {quantity: temperature_shift, unit: dimensionless}
  kappa: {quantity: rigidity_ratio, unit: dimensionless}
  Q: {quantity: mobility_ratio, unit: dimensionless}
  rho: {quantity: variational_coupling, unit: dimensionless}
  alpha: {quantity: nonvariational_coupling, unit: dimensionless}
  ell: {quantity: domain_size_dimless, unit: dimensionless}
  phi1_bar: {quantity: mean_concentration, unit: dimensionless}
  phi2_bar: {quantity: mean_concentration, unit: dimensionless}
  n_period: {quantity: mode_number, unit: dimensionless}
  init_amp_1: {quantity: order_parameter, unit: dimensionless}
  init_amp_2: {quantity: order_parameter, unit: dimensionless}
outputs:
  norm_dphi: {quantity: solution_norm, unit: dimensionless}
  phi1_min: {quantity: order_parameter, unit: dimensionless}
  phi1_max: {quantity: order_parameter, unit: dimensionless}
  phi2_min: {quantity: order_parameter, unit: dimensionless}
  phi2_max: {quantity: order_parameter, unit: dimensionless}
settings:
  n_modes: 24
  tol: 1.0e-11
  start_a: null
  start_phi2_bar: null
  step_size: 0.1
  warm_start_steps: 0
  warm_start_dt: 0.2
  linear_seed: null
stochastic: false
