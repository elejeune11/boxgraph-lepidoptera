id: subcriticality_zero_mean_eqD17_D19
name: weakly nonlinear amplitude and subcriticality criterion at zero mean concentrations (Eqs. 23, D17-D19)
role: model
stated:
  page: 26
  printed_page: "042602-26"
  quote: "Then the corresponding bifurcation is subcritical if"
  where: "Eqs. (D17)-(D19) and Eqs. (23)-(24)"
equation: "M_n = q_n^2*(1 - kappa) - a_Delta, xi_{n,pm} = (M_n/2 +- sqrt(M_n^2/4 - Delta))^2, R_{n,pm} = (Delta - xi_{n,pm}) / (-Delta*Sigma + xi_{n,pm}^2) > 0, A_0 = sqrt(eps/(3*sqrt(2)) * R_{n,pm}), Delta_H(q_n) = M_n^2/4, alpha_H(q_n) = sqrt(rho^2 + M_n^2/4)"
inputs:
  q_n: {quantity: rescaled_wavenumber, unit: dimensionless}
  a_Delta: {quantity: temperature_shift, unit: dimensionless}
  kappa: {quantity: rigidity_ratio, unit: dimensionless}
  rho: {quantity: variational_coupling, unit: dimensionless}
  alpha: {quantity: nonvariational_coupling, unit: dimensionless}
  eps: {quantity: bifurcation_distance, unit: dimensionless}
outputs:
  M_n: {quantity: subcriticality_param_M, unit: dimensionless}
  xi_plus: {quantity: subcriticality_param_xi, unit: dimensionless}
  xi_minus: {quantity: subcriticality_param_xi, unit: dimensionless}
  subcrit_ratio_plus: {quantity: subcriticality_ratio, unit: dimensionless}
  subcrit_ratio_minus: {quantity: subcriticality_ratio, unit: dimensionless}
  Delta_H_n: {quantity: coupling_difference, unit: dimensionless}
  alpha_H_n: {quantity: nonvariational_coupling, unit: dimensionless}
  A0_plus: {quantity: weakly_nonlinear_amplitude, unit: dimensionless}
settings: {}
stochastic: false
