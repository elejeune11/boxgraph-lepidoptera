id: linear_dispersion_specific_eqB1
name: double-well coupled CH linear dispersion relation at Q = 1 (Eq. B1)
role: model
stated:
  page: 22
  printed_page: "042602-22"
  quote: "temperature a as main control parameter."
  where: "Eq. (B1)"
equation: "lambda_pm(q) = (1/2)*q^2 * (-[q^2*(1+kappa) + 2*a + a_Delta + 3*(phi_bar_1^2 + phi_bar_2^2)] +- sqrt([q^2*(1-kappa) + 3*(phi_bar_1^2 - phi_bar_2^2) - a_Delta]^2 - 4*Delta))"
inputs:
  q: {quantity: rescaled_wavenumber, unit: dimensionless}
  a: {quantity: effective_temperature, unit: dimensionless}
  a_Delta: {quantity: temperature_shift, unit: dimensionless}
  kappa: {quantity: rigidity_ratio, unit: dimensionless}
  phi1_bar: {quantity: mean_concentration, unit: dimensionless}
  phi2_bar: {quantity: mean_concentration, unit: dimensionless}
  rho: {quantity: variational_coupling, unit: dimensionless}
  alpha: {quantity: nonvariational_coupling, unit: dimensionless}
outputs:
  re_lam_plus: {quantity: growth_rate_dimless, unit: dimensionless}
  re_lam_minus: {quantity: growth_rate_dimless, unit: dimensionless}
  im_lam_plus: {quantity: oscillation_frequency_dimless, unit: dimensionless}
  discriminant: {quantity: eigenvalue_discriminant, unit: dimensionless}
settings: {}
stochastic: false
