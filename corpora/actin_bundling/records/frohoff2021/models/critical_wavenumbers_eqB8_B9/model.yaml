id: critical_wavenumbers_eqB8_B9
name: zero-crossing wave numbers of stationary and oscillatory dispersion branches (Eqs. B8-B9)
role: model
stated:
  page: 22
  printed_page: "042602-22"
  quote: "the dispersion relation crosses zero"
  where: "Eqs. (B8)-(B9)"
equation: "q_pm = sqrt((-f_2'' - kappa*f_1'' +- sqrt((f_2'' - kappa*f_1'')^2 - 4*kappa*Delta)) / (2*kappa)), q_o = sqrt(-(2*a + a_Delta + 3*(phi_bar_1^2 + phi_bar_2^2)) / (1 + kappa)), k = ell*q"
inputs:
