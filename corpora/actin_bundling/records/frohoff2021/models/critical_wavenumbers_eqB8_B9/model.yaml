  phi2_bar: {quantity: mean_concentration, unit: dimensionless}
  rho: {quantity: variational_coupling, unit: dimensionless}
  alpha: {quantity: nonvariational_coupling, unit: dimensionless}
  ell: {quantity: domain_size_dimless, unit: dimensionless}
outputs:
  q_plus: {quantity: rescaled_wavenumber, unit: dimensionless}
  q_minus: {quantity: rescaled_wavenumber, unit: dimensionless}
  k_plus: {quantity: wavenumber_dimless, unit: dimensionless}
  k_minus: {quantity: wavenumber_dimless, unit: dimensionless}
  q_o: {quantity: rescaled_wavenumber, unit: dimensionless}
  k_o: {quantity: wavenumber_dimless, unit: dimensionless}
settings: {}
stochastic: false
