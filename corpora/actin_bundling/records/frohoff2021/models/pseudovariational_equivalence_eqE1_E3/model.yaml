id: pseudovariational_equivalence_eqE1_E3
name: pseudovariational gradient-dynamics reformulation at rho = 0 (Appendix E, Eqs. E1-E3)
role: model
stated:
  page: 26
  printed_page: "042602-26"
  quote: "tional coupling also represents a special case regarding model"
  where: "Eqs. (E1)-(E3), pp. 26-27"
equation: "d_t phi_i = d_x((Q_i/ell^2)*d_x(delta F_tilde / delta phi_i)), F_tilde = int [-(1/(2*ell^2))*|d_x phi_1|^2 - f_1(phi_1) + (kappa/(2*ell^2))*|d_x phi_2|^2 + f_2(phi_2) + alpha*phi_1*phi_2] dx, Q_1 = -1, Q_2 = Q"
inputs:
  a: {quantity: effective_temperature, unit: dimensionless}
  a_Delta: {quantity: temperature_shift, unit: dimensionless}
  kappa: {quantity: rigidity_ratio, unit: dimensionless}
  Q: {quantity: mobility_ratio, unit: dimensionless}
  alpha: {quantity: nonvariational_coupling, unit: dimensionless}
  ell: {quantity: domain_size_dimless, unit: dimensionless}
  amp1: {quantity: order_parameter, unit: dimensionless}
  amp2: {quantity: order_parameter, unit: dimensionless}
outputs:
  rhs_max_diff: {quantity: rhs_residual, unit: dimensionless}
  dF_tilde_dt: {quantity: pseudovariational_energy_rate, unit: dimensionless}
settings:
  n_grid: 64
stochastic: false
