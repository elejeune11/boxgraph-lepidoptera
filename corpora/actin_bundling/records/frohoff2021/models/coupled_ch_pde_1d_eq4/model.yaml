id: coupled_ch_pde_1d_eq4
name: 1D coupled Cahn-Hilliard PDE direct time simulator (Eqs. 4-5, 8)
role: model
stated:
  page: 3
  printed_page: "042602-3"
  quote: "striction to one spatial dimension and nondimensionalization"
  where: "Eqs. (4)-(5), (8)"
equation: "d_t phi_1 = (1/ell^2)*d_xx(-(1/ell^2)*d_xx phi_1 + a*phi_1 + phi_1^3 - (rho+alpha)*phi_2), d_t phi_2 = (Q/ell^2)*d_xx(-(kappa/ell^2)*d_xx phi_2 + (a+a_Delta)*phi_2 + phi_2^3 - (rho-alpha)*phi_1)"
inputs:
  a: {quantity: effective_temperature, unit: dimensionless}
  a_Delta: {quantity: temperature_shift, unit: dimensionless}
  kappa: {quantity: rigidity_ratio, unit: dimensionless}
  Q: {quantity: mobility_ratio, unit: dimensionless}
  rho: {quantity: variational_coupling, unit: dimensionless}
  alpha: {quantity: nonvariational_coupling, unit: dimensionless}
  ell: {quantity: domain_size_dimless, unit: dimensionless}
  phi1_bar: {quantity: mean_concentration, unit: dimensionless}
  phi2_bar: {quantity: mean_concentration, unit: dimensionless}
  noise_amp: {quantity: noise_amplitude, unit: dimensionless}
  t_end: {quantity: time_dimless, unit: dimensionless}
outputs:
  n_dominant_final: {quantity: mode_number, unit: dimensionless}
  norm_final: {quantity: solution_norm, unit: dimensionless}
  norm_osc_std: {quantity: solution_norm, unit: dimensionless}
  drift_speed_final: {quantity: drift_velocity_dimless, unit: dimensionless}
  phi1_min_final: {quantity: order_parameter, unit: dimensionless}
  phi1_max_final: {quantity: order_parameter, unit: dimensionless}
  phi1_mean_final: {quantity: mean_concentration, unit: dimensionless}
  phi2_mean_final: {quantity: mean_concentration, unit: dimensionless}
settings:
  n_grid: 64
  dt: 0.1
  S_stab: 6.0
  seed: 0
  init_type: "homogeneous"
stochastic: true
