id: stability_borders_k_eqB3_B5
name: wave-number-dependent stability borders indexed by domain wave number k (Eqs. 11, B3, B5, Figs. 2-4)
role: model
stated:
  page: 22
  printed_page: "042602-22"
  quote: "Then, Hopf bifurcations of modes with wave number q occur"
  where: "Eqs. (11), (B3), (B5), Figs. 2(b), 3(b), 4(b,d)"
equation: "q = k / ell; a_o(k) = -(1/2)*(q^2*(1+kappa) + a_Delta + 3*(phi_bar_1^2 + phi_bar_2^2)); a_pm(k) = a_o(k) +- (1/2)*sqrt((q^2*(1-kappa) + 3*(phi_bar_1^2 - phi_bar_2^2) - a_Delta)^2 - 4*Delta)"
built_from:
  - stability_borders_eqB3_B5
inputs:
  k: {quantity: wavenumber_dimless, unit: dimensionless}
  ell: {quantity: domain_size_dimless, unit: dimensionless}
  a_Delta: {quantity: temperature_shift, unit: dimensionless}
  kappa: {quantity: rigidity_ratio, unit: dimensionless}
  phi1_bar: {quantity: mean_concentration, unit: dimensionless}
  phi2_bar: {quantity: mean_concentration, unit: dimensionless}
  rho: {quantity: variational_coupling, unit: dimensionless}
  alpha: {quantity: nonvariational_coupling, unit: dimensionless}
outputs:
  a_o: {quantity: effective_temperature, unit: dimensionless}
  a_plus: {quantity: effective_temperature, unit: dimensionless}
  a_minus: {quantity: effective_temperature, unit: dimensionless}
  a_border: {quantity: effective_temperature, unit: dimensionless}
settings: {}
stochastic: false
