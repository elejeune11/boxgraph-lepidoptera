id: bulk_free_energy_eq3_A1
name: dimensional Landau double-well bulk free energy and chemical potential (Eqs. 3, A5)
role: model
stated:
  page: 21
  printed_page: "042602-21"
  quote: "We assume the bulk energies to be double-well potentials, i.e.,"
  where: "Eq. (3) (p. 3) and Appendix A Eq. (A5) (p. 21)"
equation: "f(phi) = (a_1 / 2) * phi^2 + (b_1 / 4) * phi^4; mu(phi) = f'(phi) = a_1 * phi + b_1 * phi^3; f''(phi) = a_1 + 3 * b_1 * phi^2"
inputs:
  a1:
    quantity: landau_coeff_dim
    unit: J/m^3
  b1:
    quantity: landau_coeff_dim
    unit: J/m^3
  phi:
    quantity: order_parameter
    unit: dimensionless
outputs:
  f:
    quantity: bulk_free_energy_density_dim
    unit: J/m^3
  mu:
    quantity: chemical_potential_dim
    unit: J/m^3
  f_pp:
    quantity: bulk_energy_curvature_dim
    unit: J/m^3
settings: {}
stochastic: false
