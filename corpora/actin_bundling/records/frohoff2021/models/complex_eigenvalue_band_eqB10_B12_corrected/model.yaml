id: complex_eigenvalue_band_eqB10_B12_corrected
name: wave-number band of complex eigenvalues with corrected kappa > 1 interval ordering (Eqs. B10-B12)
role: model
stated:
  page: 22
  printed_page: "042602-22"
  quote: "eigenvalues occur by setting the discriminant in Eq. (B1) to"
  where: "Eqs. (B10)-(B12)"
variant_of: complex_eigenvalue_band_eqB10_B12
corrections:
  - equation: "Eq. (B12), row 1"
    change: "Use [q_+^o, q_-^o] instead of the printed [q_-^o, q_+^o] for 3*(phi_bar_1^2 - phi_bar_2^2) - a_Delta > 2*sqrt(Delta) and kappa > 1"
    evidence: "In Eq. (B10), q_pm^o = sqrt((+-2*sqrt(Delta) - X)/(1 - kappa)); when X > 2*sqrt(Delta) and kappa > 1, both numerators and the denominator (1 - kappa) are negative, so 0 < q_+^o < q_-^o. The printed [q_-^o, q_+^o] gives lower bound > upper bound (e.g. Fig. 4(c)-(d) at alpha = 1.4: q_-^o = 0.7859 > q_+^o = 0.3027, whereas the plotted band is [k_+^o, k_-^o] = [3.80, 9.88] with lower bound reaching k = 0 at alpha = sqrt(1.35^2 + 0.25) = 1.4396)."
equation: "q_pm^o = sqrt((+-2*sqrt(Delta) - 3*(phi_bar_1^2 - phi_bar_2^2) + a_Delta) / (1 - kappa)); band [q_+^o, q_-^o] for X > 2*sqrt(Delta) and kappa > 1, [0, q_-+^o] for |X| < 2*sqrt(Delta) and kappa >/< 1, [q_-^o, q_+^o] for X < -2*sqrt(Delta) and kappa < 1"
inputs:
  a_Delta: {quantity: temperature_shift, unit: dimensionless}
  kappa: {quantity: rigidity_ratio, unit: dimensionless}
  phi1_bar: {quantity: mean_concentration, unit: dimensionless}
  phi2_bar: {quantity: mean_concentration, unit: dimensionless}
  rho: {quantity: variational_coupling, unit: dimensionless}
  alpha: {quantity: nonvariational_coupling, unit: dimensionless}
  ell: {quantity: domain_size_dimless, unit: dimensionless}
outputs:
  q_plus_o: {quantity: rescaled_wavenumber, unit: dimensionless}
  q_minus_o: {quantity: rescaled_wavenumber, unit: dimensionless}
  q_band_lo: {quantity: rescaled_wavenumber, unit: dimensionless}
  q_band_hi: {quantity: rescaled_wavenumber, unit: dimensionless}
  k_band_lo: {quantity: wavenumber_dimless, unit: dimensionless}
  k_band_hi: {quantity: wavenumber_dimless, unit: dimensionless}
  alpha_k0: {quantity: nonvariational_coupling, unit: dimensionless}
settings: {}
stochastic: false
