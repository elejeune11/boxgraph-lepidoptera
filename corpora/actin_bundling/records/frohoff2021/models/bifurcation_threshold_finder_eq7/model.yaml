id: bifurcation_threshold_finder_eq7
name: secondary pitchfork, saddle-node fold, and drift-pitchfork locus finder along steady branches (Eq. 7)
role: model
stated:
  page: 4
  printed_page: "042602-4"
  quote: "stability of steady states is determined and, hence, all kinds of"
  where: "Eq. (7), Secs. IV-VI, Appendix E"
equation: "F(phi, a) = 0 with (i) stability_1st/2nd: Re(lambda_k(a)) = 0, (ii) drift_pitchfork: int [(phi_1 - phi_bar_1)^2 + (1/Q)*((rho+alpha)/(rho-alpha))*(phi_2 - phi_bar_2)^2] dx = 0, (iii) fold: pseudo-arclength continuation da/ds = 0"
built_from:
  - steady_state_bifurcation_eq7
inputs:
  a_start: {quantity: effective_temperature, unit: dimensionless}
  a_end: {quantity: effective_temperature, unit: dimensionless}
  a_Delta: {quantity: temperature_shift, unit: dimensionless}
  kappa: {quantity: rigidity_ratio, unit: dimensionless}
  Q: {quantity: mobility_ratio, unit: dimensionless}
  rho: {quantity: variational_coupling, unit: dimensionless}
  alpha: {quantity: nonvariational_coupling, unit: dimensionless}
  ell: {quantity: domain_size_dimless, unit: dimensionless}
  phi1_bar: {quantity: mean_concentration, unit: dimensionless}
  phi2_bar: {quantity: mean_concentration, unit: dimensionless}
  n_period: {quantity: mode_number, unit: dimensionless}
  init_amp_1: {quantity: order_parameter, unit: dimensionless}
  init_amp_2: {quantity: order_parameter, unit: dimensionless}
outputs:
  a_crit: {quantity: effective_temperature, unit: dimensionless}
  a_crit_2: {quantity: effective_temperature, unit: dimensionless}
  norm_at_crit: {quantity: solution_norm, unit: dimensionless}
settings:
  mode: "stability_1st"
  n_modes: 20
  n_cell: 48
  ds_max: 0.03
  tol: 1.0e-11
  warm_start: false
stochastic: false
