id: instability_onsets_eqB4_B6_B7
name: Hopf, Cahn-Hilliard, and Turing instability onset temperatures at Q = 1 (Eqs. B4, B6, B7)
role: model
stated:
  page: 22
  printed_page: "042602-22"
  quote: "In particular, the onset of a CH instability is at"
  where: "Eqs. (B4), (B6), (B7)"
equation: "a^H = -(1/2)*[a_Delta + 3*(phi_bar_1^2 + phi_bar_2^2)], a^CH = (1/2)*(-[a_Delta + 3*(phi_bar_1^2 + phi_bar_2^2)] + sqrt([3*(phi_bar_1^2 - phi_bar_2^2) - a_Delta]^2 - 4*Delta)), a^T = (1/(kappa - 1))*[a_Delta + 3*(phi_bar_2^2 - kappa*phi_bar_1^2) -+ 2*sqrt(kappa*Delta)] for kappa >/< 1"
inputs:
  a_Delta: {quantity: temperature_shift, unit: dimensionless}
  kappa: {quantity: rigidity_ratio, unit: dimensionless}
  phi1_bar: {quantity: mean_concentration, unit: dimensionless}
  phi2_bar: {quantity: mean_concentration, unit: dimensionless}
  rho: {quantity: variational_coupling, unit: dimensionless}
  alpha: {quantity: nonvariational_coupling, unit: dimensionless}
outputs:
  a_H: {quantity: effective_temperature, unit: dimensionless}
  a_CH: {quantity: effective_temperature, unit: dimensionless}
  a_T: {quantity: effective_temperature, unit: dimensionless}
settings: {}
stochastic: false
