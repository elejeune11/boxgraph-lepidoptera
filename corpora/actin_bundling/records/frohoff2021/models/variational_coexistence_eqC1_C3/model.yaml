id: variational_coexistence_eqC1_C3
name: variational ternary two-phase thermodynamic coexistence (Appendix C, Eqs. C1-C3)
role: model
stated:
  page: 23
  printed_page: "042602-23"
  quote: "As a result, we have the three conditions"
  where: "Eqs. (C1)-(C3)"
equation: "mu_1 = a*phi_1 + phi_1^3 - rho*phi_2, mu_2 = (a + a_Delta)*phi_2 + phi_2^3 - rho*phi_1, omega = f_1 + f_2 - rho*phi_1*phi_2 - mu_1*phi_1 - mu_2*phi_2; mu_1^A = mu_1^B, mu_2^A = mu_2^B, omega^A = omega^B"
inputs:
  a: {quantity: effective_temperature, unit: dimensionless}
  a_Delta: {quantity: temperature_shift, unit: dimensionless}
  rho: {quantity: variational_coupling, unit: dimensionless}
  phi1_A: {quantity: order_parameter, unit: dimensionless}
outputs:
  phi2_A: {quantity: order_parameter, unit: dimensionless}
  phi1_B: {quantity: order_parameter, unit: dimensionless}
  phi2_B: {quantity: order_parameter, unit: dimensionless}
  mu1: {quantity: chemical_potential_dimless, unit: dimensionless}
  mu2: {quantity: chemical_potential_dimless, unit: dimensionless}
  omega: {quantity: grand_potential_density, unit: dimensionless}
settings:
  tol: 1.0e-8
stochastic: false
