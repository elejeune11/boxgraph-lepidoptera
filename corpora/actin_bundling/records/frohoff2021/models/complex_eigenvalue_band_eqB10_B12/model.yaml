id: complex_eigenvalue_band_eqB10_B12
name: wave-number band of complex eigenvalues as printed (Eqs. B10-B12)
role: model
stated:
  page: 22
  printed_page: "042602-22"
  quote: "eigenvalues occur by setting the discriminant in Eq. (B1) to"
  where: "Eqs. (B10)-(B12)"
equation: "q_pm^o = sqrt((+-2*sqrt(Delta) - 3*(phi_bar_1^2 - phi_bar_2^2) + a_Delta) / (1 - kappa)); band printed as [q_-^o, q_+^o] for X > 2*sqrt(Delta) and kappa > 1, [0, q_-+^o] for |X| < 2*sqrt(Delta) and kappa >/< 1, [q_-^o, q_+^o] for X < -2*sqrt(Delta) and kappa < 1, with X = 3*(phi_bar_1^2 - phi_bar_2^2) - a_Delta"
inputs:
  a_Delta: {quantity: temperature_shift, unit: dimensionless}
  kappa: {quantity: rigidity_ratio, unit: dimensionless}
  phi1_bar: {quantity: mean_concentration, unit: dimensionless}
  phi2_bar: {quantity: mean_concentration, unit: dimensionless}
  rho: {quantity: variational_coupling, unit: dimensionless}
  alpha: {quantity: nonvariational_coupling, unit: dimensionless}
  ell: {quantity: domain_size_dimless, unit: dimensionless}
outputs:
  q_plus_o: {quantity: rescaled_wavenumber, unit: dimensionless}
  q_minus_o: {quantity: rescaled_wavenumber, unit: dimensionless}
  q_band_lo: {quantity: rescaled_wavenumber, unit: dimensionless}
  q_band_hi: {quantity: rescaled_wavenumber, unit: dimensionless}
  k_band_lo: {quantity: wavenumber_dimless, unit: dimensionless}
  k_band_hi: {quantity: wavenumber_dimless, unit: dimensionless}
  alpha_k0: {quantity: nonvariational_coupling, unit: dimensionless}
settings: {}
stochastic: false
