id: fastest_linear_mode_eqB1
name: discrete fastest-growing and primary-bifurcation mode selector on periodic domain (Eqs. B1, B5)
role: model
stated:
  page: 11
  printed_page: "042602-11"
  quote: "develops corresponding to the fastest growing"
  where: "Secs. IV, V A, V B, VI A / Eqs. (B1), (B5)"
equation: "n_fastest = argmax_{n >= 1} Re(lambda_+(2*pi*n/ell)); n_first_bif = argmax_{n >= 1} a_+(2*pi*n/ell)"
built_from:
  - linear_dispersion_specific_eqB1
  - stability_borders_eqB3_B5
inputs:
  a: {quantity: effective_temperature, unit: dimensionless}
  a_Delta: {quantity: temperature_shift, unit: dimensionless}
  kappa: {quantity: rigidity_ratio, unit: dimensionless}
  phi1_bar: {quantity: mean_concentration, unit: dimensionless}
  phi2_bar: {quantity: mean_concentration, unit: dimensionless}
  rho: {quantity: variational_coupling, unit: dimensionless}
  alpha: {quantity: nonvariational_coupling, unit: dimensionless}
  ell: {quantity: domain_size_dimless, unit: dimensionless}
outputs:
  n_fastest: {quantity: mode_number, unit: dimensionless}
  lam_fastest: {quantity: growth_rate_dimless, unit: dimensionless}
  n_first_bif: {quantity: mode_number, unit: dimensionless}
  a_first_bif: {quantity: effective_temperature, unit: dimensionless}
  n_second_bif: {quantity: mode_number, unit: dimensionless}
  a_second_bif: {quantity: effective_temperature, unit: dimensionless}
settings:
  n_max: 25
stochastic: false
