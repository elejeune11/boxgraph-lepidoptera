notes: >
  Read stage of Frohoff-Hülsmann, Wrembel & Thiele, Phys. Rev. E 103, 042602 (2021),
  a 29-page theoretical and numerical study of two coupled Cahn-Hilliard (CH) equations
  with variational (reciprocal, rho) and nonvariational (nonreciprocal, alpha) linear
  coupling, including Appendices A-E. All 29 pages of text and all equation- and
  figure-bearing page images (pages/page-003.png through page-027.png, plus a 400-dpi
  zoom of Eq. B12 on p. 22) were inspected directly because pdftotext omits ell, Delta,
  Sigma, subscript Delta on a_Delta, primes on f_i, and inequality symbols.
  Scope included: (1) nondimensionalization scale definitions from dimensional Eq. (A1)
  to Eqs. (4)/(A8) via Eqs. (A2)-(A7) with symbolic() forms; (2) general two-field linear
  stability analysis Eqs. (9)-(22): dispersion relation Eq. (12), Hopf threshold Eqs. (13)-(15),
  Turing threshold and critical wavenumber Eqs. (16)-(19), CH threshold Eq. (20), and
  Hopf-Turing codimension-2 point and endpoints Eqs. (21)-(22); (3) specific double-well
  linear stability at Q = 1 (Appendix B, Eqs. B1-B13), passive variational limit (alpha = 0,
  Sec. III B), purely nonvariational limit (rho = 0, Appendix E), discrete fastest-growing
  and first-bifurcating modes, and a variant_of correction for the inverted band interval
  in Eq. (B12) row 1; (4) variational thermodynamic coexistence Eqs. (C1)-(C3) and decoupled
  rho -> 0 binodal limit (Appendix C); (5) weakly nonlinear amplitude analysis and
  subcriticality criteria Eqs. (23)-(24) and Eqs. (D1)-(D19), including the decoupled
  one-field CH threshold Eq. (D11) and footnote 8; (6) 1D periodic steady-state BVP Eq. (7)
  with conservation Eq. (5) and norm Eq. (8), Bloch-Floquet spectral stability, fold/pitchfork/
  drift-pitchfork continuation (verifying the drift-pitchfork integral condition on p. 17),
  and direct pseudospectral CNAB2 1D PDE time integration of Eq. (4) (checking coarsening in
  Fig. 5d, reverse coarsening in Fig. 7a, and traveling/standing waves in Fig. 12a,c), plus
  verification of the pseudovariational reformulation Eqs. (E1)-(E3) for rho = 0.
  Key quantitative findings: (a) Eq. (B12) row 1 prints [q_-^o, q_+^o] for kappa > 1, but
  denominator (1 - kappa) < 0 in Eq. (B10) makes q_+^o < q_-^o so the band is [q_+^o, q_-^o];
  (b) at a = -2.3 (Fig. 10b, p. 15) the prose states the fastest linear mode is n = 6,
  whereas Eq. (B1) gives n = 8 (lam_8 = 30.92 > lam_7 = 30.02 > lam_9 = 27.19 > lam_6 = 26.06);
  (c) in Fig. 6(a)/7(b) (alpha = 1.5), converged spectral stability locates the n = 3
  stabilizing secondary pitchfork at a = 1.12113, so the continuum n = 3 steady state is
  already weakly linearly stable at a = 1.12 (lam_max = -1.09e-4), whereas a coarse 2nd-order
  finite-difference mesh (Nx ~ 48) shifts the threshold below 1.12; (d) in Fig. 5(b) (p. 8)
  the prose gives the n = 1 hysteresis unstable sub-branch as -1.1 < a < -0.6, whereas exact
  continuation (consistent with the plotted curve in Fig. 5b) gives folds at a = -1.0111 and
  a = -0.8483; (e) in Fig. 4(d) (p. 7) the complex-band onset at alpha = rho = 1.35 occurs at
  k = 7.483 (19% above the cited k ≈ k_{n=1} = 2*pi = 6.283), whereas the left-edge k = 0
  crossing alpha = 1.4396 reproduces the printed 1.44; (f) all other printed thresholds
  (Fig. 6b secondary pitchforks 1.416/1.412, Fig. 8a fold ~1.41 and n=2 stab ≲ 0.4, Fig. 11c
  fold -0.591, Fig. 16a antiphase DP ≲ -1.22, App. C plateaus ±1.25, fn. 8 B^2 = 4.5, etc.)
  reproduce cleanly.
  Left out: (1) figure digitization of plotted curves and bifurcation diagrams (Figs. 1-16),
  deferred to the separate digitize stage (no figures.yaml or figures.md created here);
  (2) the generic Z2 x Z2 normal form (p. 11) and global homoclinic/modulated-wave branch
  continuation in Fig. 11(c) (a ≈ -0.588) for which the paper gives no explicit normal-form
  coefficients or time-periodic continuation equations.
