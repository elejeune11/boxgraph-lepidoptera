# --- 3. Active Nonreciprocal Conserved-to-Reactive Adiabatic Elimination & Finite-Q Isomorphism ---

- id: rel_zwicker2015_eq12_adiabatic_reduces_eqF1_corrected
  kind: reduces_to
  a: frohoff2021/linear_dispersion_general_eq12
  b: zwicker2015/homogeneous_dispersion_eqF1_corrected
  mapping:
    D_B: "1"
    w: "1"
    q: "sqrt(2) * q"
    k_f: "((alpha**2 - rho**2) / (2 * kappa)) * (1 + sqrt((1 + f1_pp) / 3))"
    k_b: "((alpha**2 - rho**2) / (2 * kappa)) * (1 - sqrt((1 + f1_pp) / 3))"
  output_map:
    lam_q_norm: re_lam_plus
  limit:
    Q: "oo"
    f2_pp: "0"
  regime:
    q: [0.3, 1.5]
    f1_pp: [-0.95, 1.5]
    f2_pp: [0.01, 0.2]
    Q: [0.5, 1.0]
    kappa: [0.5, 2.0]
    rho: [0.1, 0.4]
    alpha: [0.5, 1.0]
  provenance: proposed
  reason: >
    Adiabatic elimination of a fast-diffusing (Q = Q_2/Q_1 -> oo), neutrally stable (f_2'' -> 0) second
    conserved field phi_2 in Frohoff's doubly conserved nonreciprocal Cahn-Hilliard system Eq. (4)/(12)
    gives kappa*d_xx(phi_2) = -(rho - alpha)*phi_1, which enters d_t(phi_1) as an effective non-conserved
    linear reaction sink -(Delta/kappa)*phi_1 (with Delta = alpha^2 - rho^2 > 0). Consequently, at every
    finite wavenumber q > 0 and every bulk curvature f_1'' in (-1, 2) (both inside and outside the spinodal),
    Frohoff's conserved eigenvalue Re(lambda_+(q)) reduces identically to Zwicker's active reaction-diffusion
    Cahn-Hilliard dispersion Eq. (F1_corrected) normalized by k_0 = D_B/w^2, with effective total reaction
