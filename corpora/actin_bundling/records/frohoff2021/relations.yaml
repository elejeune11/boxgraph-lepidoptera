    alpha: "sqrt(0.0025 / tau)"
  output_map:
    det_B: lam
  regime:
    tau: [5.0, 50.0]
    D: [0.04, 0.04]
    sigma_a: [6.0e-5, 2.0e-4]
    xi: [1.0e9, 1.0e9]
    eta: [1.0e-7, 1.0e-7]
    q: [10.0, 10.0]
  provenance: proposed
  reason: >
    Directly links Hannezo's dimensional dispersion relation SI Eq. (7) (lam [1/s]) to Frohoff's
    dimensionless stability determinant Eq. (12) (det_B) under the exact-factorization identity
    lam_H(q) = -[D / (l_h^2 * (1 + l_h^2*q^2))] * det(B). At fixed cortical diffusivity, viscosity,
    friction, and wavenumber (D = 0.04 um^2/s, eta = 1e-7 Pa*s*m, xi = 1e9 Pa*s/m, q = 10 um^-1,
    giving l_h = 10 nm, q_hat = 0.1, phi = 0.0025/tau, chi = 25000*sigma_a), varying both ATP-driven
    active controls (motor contractility sigma_a and actin turnover time tau) yields identical
    strongly nonlinear log-slopes across the two models.
  assumptions:
    - "Fixed cortical transport geometry (D = 0.04 um^2/s, eta = 1e-7 Pa*s*m, xi = 1e9 Pa*s/m, q = 10 um^-1) so the Brinkman screening factor 1/(1 + l_h^2*q^2) and diffusive time T = eta/(xi*D) are constant while active controls sigma_a and tau vary."

# --- 2. Linear Dispersion Bridges: Conserved Passive Limit, Vanishing Viscosity, and Adiabatic Window ---

- id: rel_hannezo2015_eq8_passive_longwave_reduces_variational
  kind: reduces_to
  a: hannezo2015/dispersion_relation_dimless_eq8
  b: frohoff2021/linear_dispersion_variational_limit
  mapping:
    q: "q_hat"
    a: "1 - chi"
    a_Delta: "0"
    kappa: "1"
    phi1_bar: "0"
    phi2_bar: "0"
    rho: "0"
  output_map:
    lam_plus: lam_hat
  limit:
    q_hat: "0"
  regime:
    q_hat: [0.2, 1.0]
    chi: [0.2, 5.0]
    phi: [0.0, 0.0]
  provenance: proposed
  reason: >
    In the no-turnover conserved limit (phi = 0, i.e., tau -> oo), Hannezo's dimensionless
    dispersion relation factors identically as lam_hat(q_hat) = -q_hat^2*(q_hat^2 + 1 - chi)/(1 + q_hat^2)
    = lam_CH(q_hat; a = 1 - chi)/(1 + q_hat^2), commuting identically with the Bois Eq. (12) leg
    of the square. As q_hat -> 0, it reduces identically to Frohoff's decoupled passive variational
    Cahn-Hilliard dispersion across both stable (chi < 1) and spinodally unstable (chi > 1) regimes.
  assumptions:
    - "Conserved no-turnover limit phi = 0 (tau -> oo) and long-wavelength hydrodynamic limit q_hat = l_h*q -> 0."
    - "Decoupled identical passive Cahn-Hilliard fields (rho = 0, a_Delta = 0, kappa = 1, phi_bar = 0) in Frohoff."

