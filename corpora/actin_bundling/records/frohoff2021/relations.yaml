# --- 4. Exact Turing Onset Threshold & Finite-Domain Critical Mode Equivalence (Eq. 10 & Sec. 2.6.1 <-> Eqs. B5, B7) ---

- id: rel_hannezo2015_eq10_scales_eqB7_aT
  kind: scales_as
  a: hannezo2015/dimensionless_critical_contractility_eq10
  b: frohoff2021/instability_onsets_eqB4_B6_B7
  mapping:
    a_Delta: "0"
    kappa: "2"
    phi1_bar: "sqrt((1 + phi) / 3)"
    phi2_bar: "0"
    rho: "0"
    alpha: "sqrt(2 * phi)"
  output_map:
    a_T: chi_c
  regime:
    phi: [1.0e-4, 100.0]
  provenance: proposed
  reason: >
    Non-circular exact threshold equivalence between Hannezo SI Eq. (10)'s dimensionless critical
    contractility chi_c^(0) = (1 + sqrt(phi))^2 and Frohoff Appendix B Eq. (B7)'s Turing onset
    a^T = [a_Delta + 3*(phi_bar_2^2 - kappa*phi_bar_1^2) - 2*sqrt(kappa*Delta)]/(kappa - 1) for
    kappa > 1. Setting a_Delta = 0, phi_bar_2 = 0, 3*phi_bar_1^2 = 1 + phi (purely linear
    diffusive+turnover diagonal shift, without inserting sqrt(phi)), and Delta/kappa = phi gives
    a^T = -(kappa/(kappa - 1))*(1 + sqrt(phi))^2 = -2*chi_c^(0) at kappa = 2 identically for all
    phi > 0, matching the non-power-law crossover log-slope d(ln chi_c)/d(ln phi) = sqrt(phi)/(1 + sqrt(phi))
    to machine precision from phi = 10^-4 to phi = 10^2.
  assumptions:
    - "Rigidity ratio kappa = 2 > 1 (yielding exact constant prefactor -kappa/(kappa - 1) = -2), a_Delta = 0, phi_bar_2 = 0, 3*phi_bar_1^2 = 1 + phi, and Delta/kappa = phi."
    - "Opposite signs reflect opposite control-parameter conventions (destabilization by raising chi vs. lowering effective temperature a)."

- id: rel_hannezo2015_finite_threshold_phi0_scales_eqB5
  kind: scales_as
  a: hannezo2015/finite_domain_bifurcation_threshold
  b: frohoff2021/stability_borders_eqB3_B5
  mapping:
    q: "i * pi / alpha"
    a_Delta: "0"
    kappa: "1"
    phi1_bar: "1 / sqrt(3)"
    phi2_bar: "1 / sqrt(3)"
    rho: "0"
    alpha: "0"
  output_map:
    a_plus: chi_i0
  regime:
    alpha: [2.0, 30.0]
    phi: [0.0, 0.0]
    i: [1.0, 8.0]
  provenance: proposed
  reason: >
    In the turnover-free conserved limit (phi = 0), Hannezo's finite-domain cosine-mode bifurcation
    threshold chi_i^(0) = 1 + (i*pi/alpha)^2 matches Frohoff's decoupled Cahn-Hilliard stability
    border Eq. (B5) a_+(q_i) = -(1 + q_i^2) at q_i = i*pi/alpha and canonical spinodal reference
    phi_bar_1 = phi_bar_2 = 1/sqrt(3) (up to the destabilization sign flip), commuting identically
    with the Bois Eq. (13) leg of the 4-paper square and sharing exact finite-size crossover
    log-slopes in both cell size alpha and mode index i.
  assumptions:
    - "No-turnover conserved limit phi = 0 on the Hannezo side and decoupled passive CH border (rho = alpha = 0, phi_bar = 1/sqrt(3)) on the Frohoff side."

- id: rel_hannezo2015_finite_threshold_stiff_scales_eqB5
  kind: scales_as
  a: hannezo2015/finite_domain_bifurcation_threshold
  b: frohoff2021/stability_borders_eqB3_B5
  mapping:
    q: "i * pi / alpha"
    a_Delta: "0"
    kappa: "1000000"
    phi1_bar: "sqrt((1 + phi) / 3)"
    phi2_bar: "0"
    rho: "0"
    alpha: "sqrt(1000000 * phi)"
  output_map:
    a_plus: chi_i0
  regime:
    alpha: [5.0, 20.0]
    phi: [0.01, 2.0]
    i: [1.0, 8.0]
  provenance: proposed
  reason: >
    Extends the finite-domain bifurcation equivalence to arbitrary finite actin turnover phi > 0:
    in the stiff-slaved second-field limit kappa -> oo at fixed Delta/kappa = phi (with a_Delta = 0,
    phi_bar_2 = 0, 3*phi_bar_1^2 = 1 + phi), Frohoff's stationary stability border Eq. (B5)
    converges analytically to a_+(q) -> -[1 + q^2 + phi*(1 + 1/q^2)] = -chi_i^(0)(q_i = i*pi/alpha)
    outside Frohoff's small-q conserved-Hopf band q^2 < 2*sqrt(phi/kappa). At kappa = 10^6,
    q_i^2 in [0.025, 25] lies strictly outside the Hopf band (2*sqrt(phi/kappa) <= 0.0028) while
    straddling both sides of the Turing minimum q_c = phi^(1/4), so the two U-shaped Turing
    mode-threshold curves share identical non-monotonic log-slopes across all three variables
    (alpha, phi, i) (max log-slope discrepancy < 4e-4).
  assumptions:
    - "Stiff-slaved second field (kappa = 10^6 >> 1) with Delta/kappa = phi, a_Delta = 0, phi_bar_2 = 0, and 3*phi_bar_1^2 = 1 + phi, strictly outside Frohoff's small-q Hopf band q^2 < 2*sqrt(phi/kappa)."
    - "Opposite signs reflect opposite control-parameter conventions (chi > chi_i^(0) vs. a < a_+(q_i))."

