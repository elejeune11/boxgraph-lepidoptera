# ==============================================================================
# Cross-record relations with zwicker2015 (Zwicker, Hyman & Jülicher, PRE 92:012317, 2015; cited as ref-15)
# Note: frohoff2021 cites zwicker2015 qualitatively on pp. 1-2 to contrast reactive coupling
# keeping one overall conservation law against doubly conserved nonvariational coupling;
# all mathematical mappings below are therefore recorded with provenance: proposed.
# ==============================================================================

# --- 1. Bulk Double-Well Free Energy, Chemical Potential & Planar Coexistence ---

- id: rel_zwicker2015_free_energy_eq1_same_as_eq3_A1
  kind: same_as
  a: zwicker2015/ternary_free_energy_eq1
  b: frohoff2021/bulk_free_energy_eq3_A1
  mapping:
    a1: "-b / 2"
    b1: "2 * b / psi**2"
    phi: "phi_B - psi / 2"
  output_map:
    mu: mu_B
  regime:
    a: [0.5, 5.0]
    b: [0.5, 10.0]
    psi: [0.1, 1.0]
    phi_A: [0.01, 0.2]
    phi_B: [0.02, 0.98]
  provenance: proposed
  reason: >
    Shifting Zwicker Eq. (1)'s B-component double-well potential f_B(phi^B) = (b/(2*psi^2))*(phi^B)^2*(psi - phi^B)^2
    to its midpoint phi = phi^B - psi/2 yields f_B = b*psi^2/32 + (-b/2)*phi^2/2 + (2*b/psi^2)*phi^4/4.
    Up to the irrelevant additive energy constant b*psi^2/32, the bulk chemical potential
    mu^B = df/dphi^B = (b/psi^2)*phi^B*(psi - phi^B)*(psi - 2*phi^B) is symbolically identical to
    Frohoff Eqs. (3)/(A5)'s Landau double-well chemical potential mu = a_1*phi + b_1*phi^3 with
    a_1 = -b/2 and b_1 = 2*b/psi^2.
  assumptions:
    - "Midpoint-shifted order parameter phi = phi^B - psi/2 with Landau parameters a_1 = -b/2 and b_1 = 2*b/psi^2."

- id: rel_zwicker2015_binary_free_energy_sec3_same_psi1
  kind: same_as
  a: zwicker2015/binary_free_energy_sec3
  b: frohoff2021/bulk_free_energy_eq3_A1
  mapping:
    a1: "-b / 2"
    b1: "2 * b"
    phi: "phi_B - 1 / 2"
  output_map:
    mu: mu_B
  regime:
    b: [0.5, 10.0]
    psi: [1.0, 1.0]
    phi_B: [0.05, 0.95]
  provenance: proposed
  reason: >
    In the strong-segregation binary limit psi = 1 used throughout Zwicker Sec. III and Appendix F,
    f(phi^B) = (b/2)*(phi^B)^2*(1 - phi^B)^2 yields mu^B identically equal to Frohoff Eqs. (3)/(A5)
    with a_1 = -b/2, b_1 = 2*b, and phi = phi^B - 1/2.
  assumptions:
    - "Binary strong-segregation limit psi = 1."

- id: rel_zwicker2015_binary_free_energy_sec3_general_psi
  kind: same_as
  a: zwicker2015/binary_free_energy_sec3
  b: frohoff2021/bulk_free_energy_eq3_A1
  mapping:
    a1: "-b / 2"
    b1: "2 * b / psi**2"
    phi: "phi_B - psi / 2"
  output_map:
    mu: mu_B
  regime:
    b: [0.5, 10.0]
    psi: [0.1, 0.8]
    phi_B: [0.02, 0.08]
  provenance: proposed
  reason: >
    Diagnostic cross-paper check of Zwicker Sec. III's printed f(phi^B) = (b/2)*(phi^B)^2*(psi - phi^B)^2
    against Frohoff's Landau double-well family under the Eq. (1) dictionary (a_1 = -b/2, b_1 = 2*b/psi^2).
    Expected to be refuted for psi != 1 by factor psi^2, independently corroborating Zwicker's missing
    1/psi^2 factor in Sec. III (zwicker2015/q_binary_free_energy_sec3_missing_psi2).
  assumptions:
    - "Tests general psi in [0.1, 0.8] under the Eq. (1) Landau dictionary."

- id: rel_zwicker2015_free_energy_muB_scales_coex_mu1
  kind: scales_as
  a: frohoff2021/variational_coexistence_eqC1_C3
  b: zwicker2015/ternary_free_energy_eq1
  mapping:
    a: "1.0"
    b: "(a**2 + 1e-300)**(3/4)"
    psi: "1.0"
    phi_A: "0.0"
    phi_B: "0.5 * (1 + phi1_A / (a**2 + 1e-300)**(1/4))"
  output_map:
    mu_B: mu1
  regime:
    a: [-2.0, -0.5]
    a_Delta: [-0.3, 0.3]
    rho: [0.0, 0.0]
    phi1_A: [1.6, 2.5]
  provenance: proposed
  reason: >
    Directly links Frohoff's dimensionless variational coexistence chemical potential mu_1 = a*phi_1 + phi_1^3
    (at decoupled rho = 0) to Zwicker's dimensional Eq. (1) chemical potential mu^B [J/m^3]. Scaling
    the binodal-normalized coordinate u = phi_1/sqrt(-a) = 2*phi^B - 1 and modulus b proportional to (-a)^(3/2)
    yields mu^B = (1/4)*(-a)^(3/2)*(u^3 - u) = (1/4)*mu_1, matching log-slopes identically in both a and phi_1^A.
  assumptions:
    - "Decoupled variational limit (rho = 0) with a < 0 and phi_1^A above the binodal sqrt(-a)."
    - "(a**2 + 1e-300)**(1/4) evaluates sqrt(|a|) for negative a < 0 under SymPy positive-symbol parsing."

- id: rel_zwicker2015_coex_eqA1_reduces_decoupled_binodal
  kind: reduces_to
  a: zwicker2015/coexistence_exact_eqA1
  b: frohoff2021/decoupled_binodals_appC
  mapping:
    a: "-psi**2"
    a_Delta: "0"
  output_map:
    phi1_bin: phi_minus_B
  limit:
    R: "oo"
  regime:
    b: [1.0, 10.0]
    psi: [0.1, 1.0]
    gamma: [1.0e-4, 1.0e-3]
    R: [1.0, 10.0]
  provenance: proposed
  reason: >
    In the flat-interface thermodynamic limit R -> oo (vanishing Laplace pressure 2*gamma/R -> 0),
    Zwicker Appendix A Eq. (A1)'s exact curved-interface dense-phase coexistence fraction phi_-^B(R)
    reduces to the planar binodal psi, matching Frohoff Appendix C's decoupled double-well binodal
    phi_{1,bin} = sqrt(-a) under the Appendix A nondimensionalization choice L_0 = psi*w/sqrt(2)
    (which sets phi_hat_1 = 1/2 and a = -psi^2).
  assumptions:
    - "Flat-interface / infinite-droplet thermodynamic limit R -> oo."
    - "Appendix A reference length L_0 = psi*w/sqrt(2) giving phi_hat_1 = 1/2 and effective temperature a = -psi^2."

# --- 2. Passive Single-Field Cahn-Hilliard Linear Dispersion Limit ---

- id: rel_zwicker2015_eqF1_corrected_passive_reduces_variational
  kind: reduces_to
  a: zwicker2015/homogeneous_dispersion_eqF1_corrected
  b: frohoff2021/linear_dispersion_variational_limit
  mapping:
    q: "q * w / sqrt(2)"
    a: "-1"
    a_Delta: "0"
    kappa: "1"
    phi1_bar: "(k_f - k_b) / (k_f + k_b)"
    phi2_bar: "(k_f - k_b) / (k_f + k_b)"
    rho: "0"
  output_map:
    lam_plus: lam_q_norm
  limit:
    D_B: "oo"
  regime:
    D_B: [1.0e-12, 1.0e-11]
    w: [1.0e-7, 1.0e-6]
    k_f: [1.0e-4, 1.0e-2]
    k_b: [1.0e-4, 1.0e-2]
    q: [5.0e5, 2.0e6]
  provenance: proposed
  reason: >
    Under Frohoff Appendix A's exact nondimensionalization of Zwicker's binary Cahn-Hilliard free energy
    (a_1 = -b/2, b_1 = 2*b, kappa_1 = b*w^2/4, Q_1 = D_B/b, L_0 = w/sqrt(2), phi_hat_1 = 1/2, a = -1,
    tau = w^2/D_B = 1/k_0, q_F = q*w/sqrt(2), phi_bar_1 = 2*phi_0^B - 1 = (k_f - k_b)/(k_f + k_b)),
    taking the slow-reaction / passive Cahn-Hilliard limit (k_f + k_b)/k_0 = (k_f + k_b)*w^2/D_B -> 0
    (via D_B -> oo at arbitrary fixed composition phi_0^B = k_f/(k_f + k_b)) reduces Zwicker's exact
    linear dispersion relation Eq. (F1_corrected) identically to Frohoff's decoupled passive variational
    Cahn-Hilliard dispersion lambda_+(q_F) = -q_F^2*(q_F^2 - 1 + 3*phi_bar_1^2) across all wavenumbers
    and compositions (both inside and outside the spinodal).
  assumptions:
    - "Passive slow-reaction limit (k_f + k_b)*w^2/D_B -> 0 at arbitrary fixed steady-state background fraction phi_0^B = k_f/(k_f + k_b)."
    - "Decoupled identical passive fields (rho = 0, a_Delta = 0, kappa = 1, phi_bar_2 = phi_bar_1) in Frohoff's variational limit."

- id: rel_zwicker2015_eqF1_corrected_passive_derived_variational
