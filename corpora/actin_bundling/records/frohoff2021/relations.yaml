  reason: >
    Symbolically proves that the 2x2 stability determinant det(B(q)) of Frohoff Eq. (12) is identically
    equal to det(tau_D * A(k*ell)) of Bois's Pe = 0 ASDM under the canonical dictionary
    (q = k*ell, f_1'' = rho_s, f_2'' = -rho_a, Q = 1, kappa = D_a/D_s, Delta = 2*rho_a*rho_s).
    Because the conservation prefactor q^2 > 0 cancels from stationary zeros at q > 0, both models share
    the exact same finite-wavelength stationary neutral-stability manifold det = 0 (and hence the exact same
    Turing instability threshold and unstable wavenumber band).
  assumptions:
    - "Canonical ASDM-to-Frohoff operator dictionary (Q = 1, kappa = D_a/D_s, f_1'' = rho_s, f_2'' = -rho_a, Delta = 2*rho_a*rho_s)."

- id: rel_bois2011_asdm_eq15_reduces_eq12_pe0
  kind: reduces_to
