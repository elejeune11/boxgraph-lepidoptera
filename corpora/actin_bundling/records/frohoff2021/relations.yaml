    tau_0 = eta/(xi*D), f_1'' = f_2'' = 1 - chi), with both converging to the active-diffusion rate
    D*(chi - 1)*q^2 = (sigma_a/xi - D)*q^2.
  assumptions:
    - "Simultaneous slow-turnover (tau -> oo) and vanishing-viscosity (eta -> 0) limit at finite wavenumber q in [0.05, 0.2] um^-1 in the supercritical regime chi > 1."

