- id: rel_bois2011_asdm_eq15_highk_approx_eq12
  kind: approximated_by
  a: bois2011/asdm_dispersion_eq15
  b: frohoff2021/linear_dispersion_general_eq12
  mapping:
    q: "k_l"
    f1_pp: "rho_s"
    f2_pp: "-(rho_a + Pe / 4)"
    Q: "1"
    kappa: "Da_over_Ds"
    rho: "rho_s - Pe / 8 - rho_a / 2"
    alpha: "rho_s - Pe / 8 + rho_a / 2"
  output_map:
    re_lam_tilde_plus: re_lam_dimless
  regime:
    k_l: [5.0, 15.0]
    Da_over_Ds: [0.4, 1.5]
    rho_a: [0.5, 2.0]
    rho_s: [0.5, 2.0]
    Pe: [10.0, 30.0]
  tolerance: 0.05
  provenance: proposed
  reason: >
    In the viscous-dominated short-wavelength regime k*ell >> 1 (eta*k^2 >> gamma), Bois's Brinkman active
    advection kernel (Pe/4)*(k*ell)^2/(1 + (k*ell)^2) saturates to the k-independent shift Pe/4 in both
    A_aa and A_sa. Consequently, Bois Eq. (15) is approximated by Frohoff's rescaled Eq. (12) with actively
    renormalized activator curvature f_2'' = -(rho_a + Pe/4) and effective coupling invariant
    Delta_eff = rho_a*(2*rho_s - Pe/4) (note that for Pe > 8*rho_s, advective co-transport flips Delta_eff
    negative from nonreciprocal Turing coupling to reciprocal-like attraction). Across k*ell in [5, 15] and
    Pe in [10, 30], including this Pe/4 renormalization reduces max relative error from ~30% (unshifted
    Pe = 0 operator) down to 1.66%, well within the 5% tolerance.
  assumptions:
    - "Viscous-dominated short-wavelength regime k*ell in [5, 15] with strong active flow Pe in [10, 30], bounded away from neutral crossings."

- id: rel_bois2011_asdm_turing_reduces_eq17_qc
  kind: reduces_to
  a: bois2011/asdm_stability_boundary
  b: frohoff2021/turing_threshold_general_eq17_19
  mapping:
    f2_pp: "-rho_a"
    Q: "1"
    kappa: "(3 - 2*sqrt(2)) * rho_a / rho_s"
    rho: "rho_s - rho_a / 2"
    alpha: "rho_s + rho_a / 2"
  output_map:
    qc: k_crit_l
  limit:
    Pe: "0"
  regime:
    rho_a: [0.5, 1.5]
    rho_s: [2.0, 5.0]
    Pe: [0.5, 10.0]
  tolerance: 0.005
  provenance: proposed
  reason: >
    Under the canonical ASDM-to-Frohoff dictionary (f_1'' = rho_s, f_2'' = -rho_a, Q = 1,
    Delta = 2*rho_a*rho_s), solving Frohoff's Turing threshold Eq. (19) f_1''^T = (f_2'' + 2*sqrt(kappa*Delta))/kappa
    (kappa < 1/Q branch) for kappa = D_a/D_s yields the exact classic ASDM Turing boundary
    (D_a/D_s)_c = (3 - 2*sqrt(2))*rho_a/rho_s (Bois Fig. 5a), and Frohoff Eq. (17) gives critical wavenumber
    q_c = sqrt((sqrt(2) + 1)*rho_s). As Pe -> 0, Bois's numerical active Turing boundary finder
    asdm_stability_boundary (k_crit_l) reduces to Frohoff's closed-form q_c within its fixed dk = 0.1
    discrete wavenumber grid resolution (~5e-4 relative error, well within tolerance 0.005).
  assumptions:
    - "Homogeneous stability regime rho_s > rho_a (Region I/II boundary), with Pe -> 0."
    - "Tolerance 0.005 accounts for asdm_stability_boundary's default discrete k-grid spacing dk = 0.1 (n_k = 200, k_max = 20)."

- id: rel_bois2011_asdm_hopf_freq_derived_eq15
  kind: derived_from
