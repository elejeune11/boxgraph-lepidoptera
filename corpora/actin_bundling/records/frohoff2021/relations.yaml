    In the vanishing active-stress / no-flow limit Pe -> 0, the hydrodynamic Brinkman advection term
    (Pe/4)*(k*ell)^2/(1 + (k*ell)^2) drops out of Bois's active ASDM dispersion matrix Eq. (15), reducing
