# --- 1. Exact 2x2 Linear Operator & Neutral-Stability Equivalence (SI Eq. 9 <-> Eq. 12) ---

- id: rel_hannezo2015_eq9_operator_det_same_as_eq12
  kind: same_as
  a: hannezo2015/dispersion_relation_dimless_eq8
  b: frohoff2021/linear_dispersion_general_eq12
  mapping:
    q: "q_hat"
    f1_pp: "1"
    f2_pp: "phi - chi"
    Q: "1"
    kappa: "1"
    rho: "(chi - 1) / 2"
    alpha: "(chi + 1) / 2"
  output_map:
    det_B: det_L
  regime:
    q_hat: [0.1, 4.0]
    chi: [0.5, 10.0]
    phi: [0.01, 5.0]
  provenance: proposed
  reason: >
    Proves that Hannezo SI Eq. (9)'s 2x2 stationary linear stress-density operator
    L(q_hat) = [[q_hat^2 + 1, -chi], [1, q_hat^2 + phi - chi]] is entry-for-entry identical to
    Frohoff Eq. (11)-(12)'s nonreciprocal Cahn-Hilliard matrix B(q) at Q = 1, kappa = 1,
    f_1'' = 1 (Brinkman stress screening), f_2'' = phi - chi (turnover minus contractility),
    and linear couplings rho = (chi - 1)/2, alpha = (chi + 1)/2 (yielding intrinsic nonreciprocity
    Delta = alpha^2 - rho^2 = chi > 0, which directly explains why Hannezo's operator L is
    non-self-adjoint in SI Section 2.6.2). The determinants det(L) = det(B) =
    q_hat^4 + (1 + phi - chi)*q_hat^2 + phi = -(1 + q_hat^2)*lam_hat match symbolically across
    all (q_hat, chi, phi).
  assumptions:
    - "Identifies Frohoff species (phi_1, phi_2) with Hannezo's dimensionless stress and density perturbations (s, rho) at Q = 1, kappa = 1, Delta = chi > 0."

- id: rel_hannezo2015_eq9_operator_tr_same_as_eq12
  kind: same_as
  a: hannezo2015/dispersion_relation_dimless_eq8
  b: frohoff2021/linear_dispersion_general_eq12
  mapping:
    q: "q_hat"
    f1_pp: "1"
    f2_pp: "phi - chi"
    Q: "1"
    kappa: "1"
    rho: "(chi - 1) / 2"
    alpha: "(chi + 1) / 2"
  output_map:
    tr_B: tr_L
  regime:
    q_hat: [0.1, 4.0]
    chi: [0.5, 10.0]
    phi: [0.01, 5.0]
  provenance: proposed
  reason: >
    Complements rel_hannezo2015_eq9_operator_det_same_as_eq12 under the identical SI Eq. (9)
    stress-density dictionary: tr(L) = tr(B) = 2*q_hat^2 + 1 + phi - chi symbolically for all
    (q_hat, chi, phi). Together, matching both tr and det proves that Hannezo's 2x2 elliptic
    steady-state operator L(q_hat) and Frohoff's 2x2 nonreciprocal operator B(q) are identically
    isospectral.
  assumptions:
    - "Exact SI Eq. (9) 2x2 stress-density dictionary (Q = 1, kappa = 1, f_1'' = 1, f_2'' = phi - chi, rho = (chi - 1)/2, alpha = (chi + 1)/2)."

- id: rel_hannezo2015_eq8_adiab_det_same_as_eq12
  kind: same_as
  a: hannezo2015/dispersion_relation_dimless_eq8
  b: frohoff2021/linear_dispersion_general_eq12
  mapping:
    q: "q_hat"
    f1_pp: "1 + phi - chi"
    f2_pp: "0"
    Q: "1"
    kappa: "1"
    rho: "0"
    alpha: "sqrt(phi)"
  output_map:
    det_B: det_L
  regime:
    q_hat: [0.1, 4.0]
    chi: [0.5, 10.0]
    phi: [0.01, 5.0]
  provenance: proposed
  reason: >
    Verifies symbolically that the adiabatic neutral-second-field dictionary closing the
    frohoff2021 <-> zwicker2015 <-> hannezo2015 commutative square (f_2'' = 0, kappa = 1,
    purely nonvariational Delta = alpha^2 = phi = (k_f + k_b)/k_0, effective bulk curvature
    f_1'' = 1 + phi - chi = -c_spin) produces the exact same stability determinant
    det(B) = Q*[q_hat^4 + (1 + phi - chi)*q_hat^2 + phi] = -Q*(1 + q_hat^2)*lam_hat (shown here
    at Q = 1; Q enters only as an overall positive prefactor). Hence both models share the exact
    same neutral-stability manifold det = 0, unstable wavenumber band [q_-, q_+], and onset
    threshold chi_c = (1 + sqrt(phi))^2 at any finite Q (with Q*kappa > 1 for stationary Turing dominance).
  assumptions:
    - "Zwicker-commuting neutral-second-field dictionary (f_2'' = 0, kappa = 1, Q = 1, rho = 0, alpha = sqrt(phi), f_1'' = 1 + phi - chi)."

- id: rel_hannezo2015_eq7_scales_eq12_detB
  kind: scales_as
  a: hannezo2015/dispersion_relation_eq7
  b: frohoff2021/linear_dispersion_general_eq12
  mapping:
    q: "0.1"
    f1_pp: "1 + 0.0025 / tau - 25000 * sigma_a"
    f2_pp: "0"
