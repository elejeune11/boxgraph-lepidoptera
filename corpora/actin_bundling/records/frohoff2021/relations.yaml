    - simplify
  regime:
    q_hat: [0.1, 0.5]
    chi: [0.5, 5.0]
    phi: [0.0, 0.0]
  provenance: proposed
  reason: >
    Symbolically derives Frohoff's decoupled single-field Cahn-Hilliard dispersion -q^2*(q^2 + a)
    from Hannezo SI Eq. (8) in the conserved limit (phi = 0) via O(q_hat^4) small-wavenumber
    expansion: lam_hat = (chi - 1)*q_hat^2 - chi*q_hat^4 + O(q_hat^6). Rescaling q = chi^(1/4)*q_hat
    and a = (1 - chi)/sqrt(chi) matches both the O(q^2) active-spinodal driving and the O(q^4)
    viscous regularization (effective gradient stiffness kappa_eff = D*chi*l_h^2 = sigma_a*eta/xi^2)
    identically.
  assumptions:
