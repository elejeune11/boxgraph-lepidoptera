    domain size L/ell across small- and large-domain regimes.
  assumptions:
    - "Decoupled passive Cahn-Hilliard border at spinodal reference phi_bar_1 = phi_bar_2 = 1/sqrt(3) (f_1'' = a + 1 = 1 - P_eff)."

