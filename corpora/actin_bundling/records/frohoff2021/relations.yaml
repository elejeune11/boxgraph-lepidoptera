# --- 2. Single-Species Conserved Active Fluid (Brinkman) <-> Single-Field Conserved Cahn-Hilliard ---

- id: rel_bois2011_eq12_longwave_reduces_ch
  kind: reduces_to
  a: bois2011/single_species_dispersion_eq12
  b: frohoff2021/linear_dispersion_variational_limit
  mapping:
    q: "k * l"
    a: "1 - Pe * c0 * df_dc"
    a_Delta: "0"
    kappa: "1"
    phi1_bar: "0"
    phi2_bar: "0"
    rho: "0"
  output_map:
    lam_plus: lam_dimless
  limit:
    k: "0"
  regime:
    k: [0.5, 2.0]
    D: [0.5, 2.0]
    Pe: [0.5, 15.0]
    c0: [0.3, 3.0]
    df_dc: [0.1, 0.8]
    l: [0.5, 2.0]
  provenance: proposed
  reason: >
    Exact algebraic factorization of Bois Eq. (12) yields
    tau_D * lambda_Bois(k) = -(k*ell)^2 * ((k*ell)^2 + 1 - Pe*c0*df_dc) / (1 + (k*ell)^2)
    = lambda_CH(q = k*ell; a = 1 - Pe*c0*df_dc) / (1 + (k*ell)^2), where lambda_CH(q) = -q^2*(q^2 + a)
    is Frohoff's decoupled passive Cahn-Hilliard dispersion (rho = alpha = 0, a_Delta = 0, kappa = 1,
    phi_bar = 0). Because the ratio is exactly the Brinkman screening kernel 1/(1 + (k*ell)^2), the two
    dispersion relations share the exact same neutral-stability cutoff q_+ = sqrt(Pe*c0*df_dc - 1) and
    converge identically as k -> 0 with uniform relative difference (k*ell)^2 / (1 + (k*ell)^2) across
    both stable (Pe*c0*df_dc < 1) and spinodally unstable (Pe*c0*df_dc > 1) regimes.
  assumptions:
    - "Long-wavelength hydrodynamic limit k*ell -> 0 at arbitrary Pe*c0*df_dc."
    - "Decoupled identical passive Cahn-Hilliard fields (rho = 0, a_Delta = 0, kappa = 1, phi_bar = 0) in Frohoff."

