# --- 1. Exact 2x2 Linear Stability Isomorphism: Classic Turing ASDM <-> Rescaled Conserved Nonreciprocal CH ---

- id: rel_bois2011_asdm_pe0_same_as_eq12_tilde
  kind: same_as
  a: bois2011/asdm_dispersion_pe0
  b: frohoff2021/linear_dispersion_general_eq12
  mapping:
    q: "k_l"
    f1_pp: "rho_s"
    f2_pp: "-rho_a"
    Q: "1"
    kappa: "Da_over_Ds"
    rho: "rho_s - rho_a / 2"
    alpha: "rho_s + rho_a / 2"
  output_map:
    re_lam_tilde_plus: re_lam_dimless
  regime:
    k_l: [0.05, 5.0]
    Da_over_Ds: [0.05, 2.0]
    rho_a: [0.5, 2.0]
    rho_s: [0.1, 2.5]
  provenance: proposed
  reason: >
    Realizes Frohoff Sec. III A (p. 4) and Sec. VII (p. 20) explicitly against Bois's classic Pe = 0
    activator-substrate depletion model (ASDM, Eq. 15 / Fig. 5a): after factoring out the q^2 conservation
    prefactor, Frohoff's rescaled 2x2 operator -B(q) in Eq. (11)-(12) is identical to Bois's ASDM
    stability matrix A_{(s,a)}(k*ell) under species identification (phi_1, phi_2) <-> (s, -a), q = k*ell,
    Q = 1, rigidity-mobility product Q*kappa = D_a/D_s, effective bulk curvatures f_1'' = rho_s (substrate
    decay) and f_2'' = -rho_a (activator autocatalysis), and linear coupling rho = rho_s - rho_a/2,
    alpha = rho_s + rho_a/2 (yielding intrinsic nonreciprocity Delta = alpha^2 - rho^2 = 2*rho_a*rho_s > 0).
    The leading growth rates Re(lambda_tilde_+) and Re(tau_D * lambda) agree identically across all five
    stability regions of Bois Fig. 5(a) (both real-eigenvalue Turing/CH-like and complex oscillatory regimes).
  assumptions:
    - "Zero active hydrodynamic flow (Pe = 0) in Bois ASDM; rescaled (unconserved) eigenvalue lambda_tilde = lambda / q^2 in Frohoff Eq. (12)."
    - "Species ordering (1, 2) <-> (substrate s, negated activator -a) with Q = 1 so Q*kappa = D_a/D_s."

- id: rel_bois2011_asdm_pe0_det_same_as_eq12
