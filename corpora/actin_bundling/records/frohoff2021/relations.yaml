  reason: >
    Symbolically derives Frohoff's decoupled single-field Cahn-Hilliard dispersion -q^2*(q^2 + a) from
    Bois Eq. (12) via fourth-order small-wavenumber expansion (O(k^4)):
    tau_D * lambda_Bois = (P_eff - 1)*(k*ell)^2 - P_eff*(k*ell)^4 + O((k*ell)^6) with P_eff = Pe*c0*df_dc.
    Rescaling q = P_eff^(1/4)*(k*ell) and effective temperature a = (1 - P_eff)/sqrt(P_eff) matches BOTH
    the O(k^2) spinodal diffusivity and the O(k^4) stabilizing curvature identically, demonstrating that
    at long wavelengths active stress combined with hydrodynamic viscosity (kappa_eff = D*P_eff*ell^2 =
    c0*(zeta*Delta_mu)_0*df_dc*eta/gamma^2) plays the exact role of Cahn-Hilliard interfacial stiffness.
  assumptions:
    - "Small-wavenumber expansion truncated at O(k^4) (valid for k*ell << 1; coalesces with exact-factorization dictionary q = k*ell, a = 1 - P_eff near onset P_eff -> 1)."

