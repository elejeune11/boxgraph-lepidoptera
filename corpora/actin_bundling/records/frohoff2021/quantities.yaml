# Dimensional quantities (Appendix A, Eqs. A1-A6)
- id: length_dim
  name: dimensional length
  dimension: "[length]"
  description: "Dimensional physical domain length L or characteristic length scale L_0 in Appendix A."

- id: time_dim
  name: dimensional time
  dimension: "[time]"
  description: "Dimensional time t or characteristic timescale tau = L_0^4 / (Q_1 * kappa_1) in Appendix A."

- id: mobility_dim
  name: dimensional mobility
  dimension: "[length]**5 / [energy] / [time]"
  description: "Dimensional constant mobility Q_i in Eq. (A1) for dimensionless volume-fraction fields phi_i and energy density f_i."

- id: interface_stiffness_dim
  name: dimensional interface stiffness
  dimension: "[energy] / [length]"
  description: "Dimensional square-gradient interface stiffness kappa_i in Eqs. (2) and (A1)."

- id: bulk_energy_prefactor
  name: bulk energy scaling factor
  dimension: "dimensionless"
  description: "Dimensionless prefactor zeta_i multiplying f_i'(phi_i) in Eq. (A1)."

- id: landau_coeff_dim
  name: dimensional bulk Landau coefficient
  dimension: "[energy] / [length]**3"
  description: "Dimensional quadratic (a_i) or quartic (b_i) bulk free-energy density coefficient in f_i(phi_i) = (a_i/2) phi_i^2 + (b_i/4) phi_i^4 (Eqs. 3, A5)."

- id: coupling_strength_dim
  name: dimensional coupling strength
  dimension: "[energy] / [length]**3"
  description: "Dimensional linear interspecies coupling parameter gamma_i in Eq. (A1)."

- id: field_scale
  name: order parameter field scale
  dimension: "dimensionless"
  description: "Characteristic concentration/order-parameter scale phi_hat_i = sqrt(kappa_1 / (zeta_i * b_i * L_0^2)) in Eq. (A6)."

- id: bulk_free_energy_density_dim
  name: dimensional bulk free energy density
  dimension: "[energy] / [length]**3"
  description: "Dimensional local bulk double-well free-energy density f_i(phi_i) = (a_i/2)*phi_i^2 + (b_i/4)*phi_i^4 in Eqs. (3), (A1), and (A5)."

- id: chemical_potential_dim
  name: dimensional bulk chemical potential
  dimension: "[energy] / [length]**3"
  description: "Dimensional local bulk chemical potential mu_i = f_i'(phi_i) = a_i*phi_i + b_i*phi_i^3 in Eqs. (3), (A1), and (A5)."

- id: bulk_energy_curvature_dim
  name: dimensional bulk free-energy curvature
  dimension: "[energy] / [length]**3"
  description: "Dimensional second derivative f_i''(phi_i) = a_i + 3*b_i*phi_i^2 of the bulk double-well potential in Eqs. (3) and (A5)."

# Nondimensional parameters and fields (Secs. II-VII, Appendices A-E)
- id: order_parameter
  name: nondimensional order parameter field
  dimension: "dimensionless"
  description: "Nondimensional concentration/order-parameter field phi_1 or phi_2 in Eq. (4) (or plateau/coexistence concentration in Appendix C)."

- id: mean_concentration
  name: conserved mean concentration
  dimension: "dimensionless"
  description: "Spatially conserved mean value phi_bar_i = int_{-1/2}^{1/2} phi_i dx in Eq. (5)."

- id: effective_temperature
  name: effective temperature
  dimension: "dimensionless"
  description: "Primary control parameter a in f_1'(phi_1) = a*phi_1 + phi_1^3 (Eq. 4), including instability thresholds a^CH, a^T, a^H, a_pm(q), a_o(q) and bifurcation loci."

- id: temperature_shift
  name: effective temperature shift
  dimension: "dimensionless"
  description: "Shift in critical temperature a_Delta = a_tilde_2 - a_tilde_1 between the two decoupled CH subsystems (Eq. 4, Appendix A)."

- id: mobility_ratio
  name: mobility ratio
  dimension: "dimensionless"
  description: "Ratio of mobilities Q = Q_2 / Q_1 in Eqs. (4) and (A3)."

- id: rigidity_ratio
  name: interface rigidity ratio
  dimension: "dimensionless"
  description: "Ratio of interface rigidities kappa = kappa_2 / kappa_1 in Eqs. (4) and (A3)."

- id: variational_coupling
  name: variational coupling strength
  dimension: "dimensionless"
  description: "Symmetric (reciprocal/variational) coupling strength rho = (gamma_tilde_1 + gamma_tilde_2) / 2 in Eqs. (4) and (A8)."

- id: nonvariational_coupling
  name: nonvariational coupling strength
  dimension: "dimensionless"
  description: "Antisymmetric (nonreciprocal/nonvariational) coupling strength alpha = (gamma_tilde_1 - gamma_tilde_2) / 2 in Eqs. (4) and (A8)."

- id: coupling_difference
  name: coupling strength difference invariant
  dimension: "dimensionless"
  description: "Coupling invariant Delta = alpha^2 - rho^2 (Eq. 12, p. 4); Delta > 0 iff nonvariational coupling dominates."

- id: coupling_sum_sq
  name: squared coupling sum invariant
  dimension: "dimensionless"
  description: "Coupling invariant Sigma = (rho + alpha)^2 used in weakly nonlinear subcriticality analysis (Eq. 23, Eq. D13)."

- id: domain_size_dimless
  name: nondimensional domain size
  dimension: "dimensionless"
  description: "Nondimensional spatial domain size ell = L / L_0 entering Eq. (4) and discrete wave numbers q_n = 2*pi*n / ell."

- id: wavenumber_dimless
  name: nondimensional wave number
  dimension: "dimensionless"
  description: "Wave number k on computational domain [-1/2, 1/2], with periodic modes k_n = 2*pi*n (Eq. 9, Fig. 2)."

- id: rescaled_wavenumber
  name: rescaled wave number
  dimension: "dimensionless"
  description: "Rescaled wave number q = k / ell (Eq. 11), including critical/root wave numbers q_c, q_pm, q_o, and complex-band edges q_pm^o."

- id: rescaled_wavenumber_sq
  name: squared rescaled wave number
  dimension: "dimensionless"
  description: "Squared rescaled critical wave number q_c^2 in Eq. (17)."

- id: mode_number
  name: spatial periodicity mode number
  dimension: "dimensionless"
  description: "Integer spatial periodicity n (number of periods in [-1/2, 1/2]) of a linear mode or nonlinear pattern."

- id: bulk_energy_curvature
  name: bulk free-energy second derivative
  dimension: "dimensionless"
  description: "Second derivative f_i'' of bulk free energy evaluated at homogeneous state (f_1'', f_2'', and stability thresholds in Eqs. 12-22)."

- id: growth_rate_dimless
  name: linear growth rate
  dimension: "dimensionless"
  description: "Eigenvalue or real part Re(lambda) of linear stability growth rate in Eqs. (10), (B1), and nonlinear Jacobian spectra."

- id: rescaled_growth_rate
  name: rescaled linear growth rate
  dimension: "dimensionless"
  description: "Rescaled eigenvalue lambda_tilde = lambda / q^2 of the Turing matrix -B in Eqs. (11)-(12)."

- id: matrix_trace
  name: trace of linear matrix B
  dimension: "dimensionless"
  description: "Trace tr(B) = q^2*(1 + Q*kappa) + f_1'' + Q*f_2'' in Eq. (12)."

- id: matrix_determinant
  name: determinant of linear matrix B
  dimension: "dimensionless"
  description: "Determinant det(B) = Q*(q^2 + f_1'')*(kappa*q^2 + f_2'') + Q*Delta in Eq. (12)."

- id: eigenvalue_discriminant
  name: dispersion discriminant
  dimension: "dimensionless"
  description: "Discriminant (tr B)^2 - 4*det B (Eq. 12) or [q^2*(1 - kappa) + 3*(phi_bar_1^2 - phi_bar_2^2) - a_Delta]^2 - 4*Delta (Eq. B1)."

- id: oscillation_frequency_dimless
  name: nondimensional oscillation frequency
  dimension: "dimensionless"
  description: "Imaginary part Im(lambda) or rescaled critical Hopf frequency omega_tilde_c in Eq. (15)."

- id: chemical_potential_dimless
  name: nondimensional chemical potential
  dimension: "dimensionless"
  description: "Equilibrium or nonequilibrium chemical potential mu_i in Eqs. (7) and (C1)."

- id: grand_potential_density
  name: nondimensional grand potential density
  dimension: "dimensionless"
  description: "Grand potential density omega = -p in Eq. (C2) for thermodynamic phase coexistence."

- id: solution_norm
  name: L2 deviation norm
  dimension: "dimensionless"
  description: "Solution measure ||delta phi|| = sqrt(int_{-1/2}^{1/2} sum_{i=1,2} (phi_i - phi_bar_i)^2 dx) in Eq. (8)."

- id: time_dimless
  name: nondimensional time
  dimension: "dimensionless"
  description: "Nondimensional simulation time t in Eq. (4)."

- id: noise_amplitude
  name: initial noise amplitude
  dimension: "dimensionless"
  description: "Amplitude of initial white-noise perturbation added to a homogeneous or steady state in direct PDE time simulations."

- id: drift_velocity_dimless
  name: nondimensional drift velocity
  dimension: "dimensionless"
  description: "Translation speed |v| (in computational domain units per unit nondimensional time) of drifting or traveling-wave states."

- id: drift_pitchfork_integral
  name: drift pitchfork bifurcation integral
  dimension: "dimensionless"
  description: "Fredholm solvability integral int_{-1/2}^{1/2} [(phi_1 - phi_bar_1)^2 + (1/Q)*((rho + alpha)/(rho - alpha))*(phi_2 - phi_bar_2)^2] dx (p. 17), zero at a drift-pitchfork bifurcation."

- id: eigenvalue_count
  name: count of unstable eigenvalues
  dimension: "dimensionless"
  description: "Number of nonzero eigenvalues with positive real part of a steady state."

- id: bifurcation_distance
  name: bifurcation smallness parameter
  dimension: "dimensionless"
  description: "Distance epsilon from a primary bifurcation point along the control-parameter cut in Eqs. (D3) and (D17)."

- id: weakly_nonlinear_amplitude
  name: leading-order pattern amplitude
  dimension: "dimensionless"
  description: "Stationary leading-order amplitude A_0 in Eqs. (D14) and (D17)."

- id: subcriticality_param_M
  name: composed asymmetry parameter M_n
  dimension: "dimensionless"
  description: "Composed parameter M_n = q_n^2*(1 - kappa) - a_Delta (Eq. D18, fn. 6 p. 14) governing subcriticality and Hopf onset at zero mean concentration."

- id: subcriticality_param_xi
  name: subcriticality parameter xi_n
  dimension: "dimensionless"
  description: "Parameter xi_{n,pm} = (q_n^2 + a_pm(q_n))^2 in Eqs. (D15) and (D18)."

- id: subcriticality_ratio
  name: subcriticality criterion ratio
  dimension: "dimensionless"
  description: "Ratio (Delta - xi_{n,pm}) / (-Delta*Sigma + xi_{n,pm}^2) in Eq. (D19); strictly positive iff the primary pitchfork bifurcation is subcritical."

- id: novick_cohen_B2
  name: Novick-Cohen scaled concentration squared
  dimension: "dimensionless"
  description: "Scaled mean-concentration parameter B^2 = 9 * phi_bar_2^2 from Ref. [63] (footnote 8, p. 25)."

- id: pseudovariational_energy_rate
  name: pseudovariational functional time derivative
  dimension: "dimensionless"
  description: "Time derivative d(F_tilde)/dt of the pseudovariational functional Eq. (E2) under Eqs. (E1)-(E3) for rho = 0."

- id: rhs_residual
  name: PDE operator equivalence residual
  dimension: "dimensionless"
  description: "Max-norm discrepancy between the RHS of Eq. (4) at rho = 0 and the pseudovariational formulation Eqs. (E1)-(E3)."

- id: position_dimless
  name: nondimensional spatial coordinate
  dimension: "dimensionless"
  description: "Nondimensional spatial position x in [-1/2, 1/2] on the computational domain in Eqs. (4), (5), (7), (8) and profile plots (Figs. 5c, 6c-e, 15b-d, 16b-d)."

# Dimensional linear-stability quantities (Appendix A scales applied to Eqs. 12 and 17)
- id: wavenumber_dim
  name: dimensional perturbation wave number
  dimension: "1/[length]"
  description: "Dimensional wave number q_dim = q / L_0 obtained by restoring the Appendix A length scale L_0 to Eqs. (12) and (17)."

- id: wavelength_dim
  name: dimensional critical pattern wavelength or inverse wave number
  dimension: "[length]"
  description: "Dimensional critical wavelength lambda_c = 2*pi*L_0 / q_c or inverse critical wave number 1/q_{c,dim} = L_0 / q_c from Eq. (17) and Appendix A."

- id: wavelength_dimless
  name: nondimensional critical pattern wavelength
  dimension: "dimensionless"
  description: "Nondimensional critical Turing wavelength lambda_c / L_0 = 2*pi / q_c from Eq. (17)."

- id: growth_rate_dim
  name: dimensional linear growth rate
  dimension: "1/[time]"
  description: "Dimensional linear stability growth rate or frequency lambda_dim = lambda / tau obtained by restoring the Appendix A timescale tau = L_0^4 / (Q_1 * kappa_1) to Eq. (12)."


