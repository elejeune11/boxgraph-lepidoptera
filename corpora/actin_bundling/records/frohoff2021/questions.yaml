  text: >
    Cross-paper ModelAtlas synthesis with bois2011 (Bois, Jülicher & Grill, PRL 106:028103, 2011;
    neither paper cites the other) establishes exact operator bridges alongside six irreducible
    structural contrasts between 1D hydrodynamic active-fluid reaction-diffusion-advection (RDA)
    patterning and doubly conserved nonvariational Cahn-Hilliard (CH) dynamics.
    Verified mathematical bridges in frohoff2021/relations.yaml: (1) Exact 2x2 Turing-operator
    isomorphism (Frohoff Sec. III A p. 4, Sec. VII p. 20): under species mapping (phi_1, phi_2) <->
    (s, -a), q = k*ell, Q = 1, Q*kappa = D_a/D_s, f_1'' = rho_s, f_2'' = -rho_a, rho = rho_s - rho_a/2,
    alpha = rho_s + rho_a/2 (intrinsic nonreciprocity Delta = alpha^2 - rho^2 = 2*rho_a*rho_s > 0),
    Frohoff's rescaled operator -B(q) in Eq. (12) is identically equal to Bois's classic Pe = 0 ASDM
    stability matrix across all five stability regions of Bois Fig. 5(a) (verified numerically on
    re_lam_tilde_plus and symbolically on det_B, with Bois's active Eq. 15 reducing to it as Pe -> 0).
    Under this same dictionary, Frohoff's Turing threshold Eqs. (17)-(19) yield Bois's exact Pe = 0
    Turing boundary (D_a/D_s)_c = (3 - 2*sqrt(2))*rho_a/rho_s and critical wavenumber
    q_c = sqrt((sqrt(2) + 1)*rho_s) (verified as Pe -> 0 from asdm_stability_boundary), Frohoff's
    codimension-2 Hopf-Turing point Eq. (21) maps directly to the 4-region junction
    (D_a/D_s, rho_s/rho_a) = (3 - 2*sqrt(2), 1) of Bois Fig. 5(a), Frohoff's complex-band k = 0 onset
    Eq. (B2)/(B11) maps to Bois's Region IV/V boundary rho_s/rho_a = 3 - 2*sqrt(2), and Frohoff's
    rescaled Hopf onset frequency Eq. (15) omega_tilde_c = rho_a derives symbolically from Bois Eq. (15)
    at k*ell = 0, rho_s = rho_a (independent of Pe). At short wavelengths k*ell >> 1, viscous saturation
    of Bois's Brinkman advection term (Pe/4)*(k*ell)^2/(1+(k*ell)^2) -> Pe/4 maps Bois Eq. (15) onto
    Frohoff Eq. (12) with actively shifted f_2'' = -(rho_a + Pe/4) and Delta_eff = rho_a*(2*rho_s - Pe/4)
    (1.66% max error over k*ell in [5, 15], Pe in [10, 30], vs ~30% without the Pe/4 shift).
    (2) Exact Brinkman-to-Cahn-Hilliard factorization for single-species conserved active fluids:
    Bois Eq. (12) factors identically at all wavenumbers as
    tau_D*lambda_Bois(q) = lambda_CH(q; a = 1 - P_eff) / (1 + q^2) with P_eff = Pe*c0*df_dc, proving
    identical neutral-stability cutoffs q_+ = sqrt(P_eff - 1), exact long-wavelength reduction as k -> 0
    (uniform error q^2/(1+q^2) <= 3.85% for k*ell <= 0.2), symbolic O(k^4) Taylor derivation of CH
    dispersion with effective gradient stiffness kappa_eff = D*P_eff*ell^2 (active stress x viscosity),
    and identical finite-size threshold scaling between Bois Eq. (13) and Frohoff Eq. (B5).
    (3) Shared periodic discrete wavenumber quantization q_n = 2*pi*n/ell (beta = 2 in Bois).
    Irreducible structural contrasts:
    (i) Conserved (type-IIo) vs. non-conserved k = 0 (type-IIIo) Hopf instability: multiplying Frohoff's
    rescaled operator -B(q) by q^2 enforces both mass conservation laws, forcing lambda(0) = 0 and
    vanishing onset frequency omega_c = q_c^2*omega_tilde_c = 0 (large-scale conserved Hopf with
    traveling/standing waves at finite q > 0), whereas Bois's non-conserved ASDM reactions yield finite
    homogeneous oscillation growth Re[lambda(0)] = (rho_a - rho_s)/2 > 0 and nonzero frequency
    omega_c = rho_a at k = 0 (Region IV, unaffected by Pe because hydrodynamic flow vanishes at k = 0).
    (ii) Hydrodynamic Brinkman q^2/(1 + q^2*ell^2) vs. biharmonic Cahn-Hilliard q^2/q^4 stabilization:
    for large k*ell >> 1, Bois's single-species dispersion stabilizes via 2nd-order Fickian diffusion
    (-q^2) rather than 4th-order CH surface tension (-q^4). While both share the same cutoff
    q_+ = sqrt(P_eff - 1) and long-wave type-IIs coarsening to a single peak (Bois Fig. 4; Frohoff
    Sec. IV), the Brinkman kernel shifts the fastest-growing mode from q_max,CH = sqrt((P_eff - 1)/2)
    ~ P_eff^(1/2) (lambda_max ~ P_eff^2) down to q_max,Bois = sqrt(sqrt(P_eff) - 1) ~ P_eff^(1/4)
    (lambda_max ~ P_eff), matching only near onset P_eff -> 1+. Correspondingly, characteristic
    timescales scale quadratically in Bois (tau_D = ell^2/D) versus quartically in Frohoff
    (tau = L_0^4/(Q_1*kappa_1)).
    (iii) Off-diagonal active cross-advection vs. diagonal mobilities: at finite Pe > 0 and small
    k*ell << 1, Bois Eq. (15) adds +(Pe/4)*(k*ell)^2 to both A_aa (negative self-diffusion) and A_sa
    (off-diagonal cross-diffusion of substrate by activator-driven flow), a dynamic off-diagonal
    mobility coupling explicitly excluded in Frohoff Sec. II (p. 4).
    (iv) Double-limit bridge for single-species turnover: Bois Eq. (15) with N = 1 and linear turnover
    dR/dc = -r < 0 yields tau_D*lambda = -r_tilde + (P_eff - 1)*q^2 - P_eff*q^4 + O(q^6) for q << 1,
    matching the adiabatic fast-neutral-field limit (Q -> oo, f_2'' -> 0) of Frohoff Eq. (12) under
    Delta/kappa <-> r_tilde = r*ell^2/D; both exhibit type-Is finite-wavelength onset q_c^2 = sqrt(r_tilde)
    and threshold P_eff - 1 = 2*sqrt(r_tilde) + O(r_tilde), diverging at O(r_tilde) between Brinkman
    (1 + sqrt(r_tilde))^2 and CH 1 + 2*r_tilde + 2*sqrt(r_tilde*(1 + r_tilde)).
    (v) Steady-state Hamiltonian potential convention: at c_0 = 1, sigma_hat_0 = 1/2, Bois Eq. (10)'s
    steady-state oscillator potential expands as -ell^2*V(u) = (1 - Pe/4)*u^2/2 + (Pe/48)*u^4/4 + O(u^6),
    matching Frohoff's symmetric Landau double-well f(phi) (with opposite sign convention V = -f and
    critical point Pe_c = 4 <-> a = 0), but its nonlinear saturating Hill profile ln((1+e^u)/2) differs
    from polynomial phi^4 at finite amplitude.
    (vi) Coarsening arrest mechanisms: Bois's conserved single-species active fluid always coarsens to
    one peak (Fig. 4) and requires non-conserved chemical reactions (ASDM, Fig. 5d) for finite-wavelength
    arrest, whereas Frohoff arrests coarsening purely through two-field nonreciprocal cross-coupling
    while keeping both species strictly conserved.
