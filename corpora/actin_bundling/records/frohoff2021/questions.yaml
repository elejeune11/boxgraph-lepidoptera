  text: >
    Cross-record ModelAtlas analysis with hannezo2015 (Hannezo et al., PNAS 112:8620-8625, 2015;
    neither paper cites the other, and neither data.yaml cites any datum from the other, so 0
    cited.yaml links apply) enters 20 tested proposed relations (19 verified + 1 diagnostic
    not_verified) in frohoff2021/relations.yaml, closing the final diagonal of the 4-paper
    active-turnover commutative square (bois2011 <-> hannezo2015 <-> frohoff2021 <-> zwicker2015).
    Key verified equivalences:
    (1) Exact 2x2 operator isospectrality and neutral-stability equivalence: Hannezo SI Eq. (9)'s
    elliptic stress-density linear operator L(q_hat) = [[q_hat^2 + 1, -chi], [1, q_hat^2 + phi - chi]]
    is entry-for-entry identical (matching both det and tr symbolically) to Frohoff Eq. (11)-(12)'s
    matrix B(q) at Q = kappa = 1, f_1'' = 1, f_2'' = phi - chi, rho = (chi - 1)/2, alpha = (chi + 1)/2
    (intrinsic nonreciprocity Delta = chi > 0, explaining directly why Hannezo's operator L is
    non-self-adjoint in SI Section 2.6.2). The same determinant det(L) = q_hat^4 + (1 + phi - chi)*q_hat^2 + phi
    = -(1 + q_hat^2)*lam_hat is also identically reproduced by the Zwicker-commuting neutral-second-field
    dictionary (f_1'' = 1 + phi - chi, f_2'' = 0, Delta = phi) and by a mechanism-separated dictionary
    (f_1'' = 1 - chi, f_2'' = phi, Delta = phi*chi, coupling Hannezo's two ATP-driven active controls
    directly and recovering passive CH smoothly as phi -> 0).
    (2) Dispersion bridges across conserved, vanishing-viscosity, and finite-turnover regimes:
    Hannezo's dispersion reduces to Frohoff's passive variational CH dispersion in the conserved
    long-wave limit (phi = 0, q_hat -> 0 numerically and O(q_hat^4) symbolically; and directly in 1/s
    from dispersion_relation_eq7 as tau -> oo, eta -> 0), reduces at finite turnover tau > 0 to
    Frohoff's dimensional adiabatic dispersion Eq. (12)/(A1) as eta -> 0 (with active viscous
    contraction timescale tau_0 = eta/sigma_a, f_1'' = 1/chi - 1, Delta/kappa = phi/chi, valid for
    all chi > 0), and agrees quantitatively within < 3.3% at finite (eta, tau, Q) inside the
    two-sided scale-separation window 1/Q << q^2 << 1.
    (3) 3-paper onset-wavelength family & diagnostic verification: Frohoff Eq. (17) + Appendix A
    (turing_wavelength_dim_eq17_A2) symbolically joins Hannezo Main Eq. (3) (critical_wavelength_eq3),
    critical_wavelength_dimensionless, critical_inverse_wavenumber_si_corrected, and Zwicker Appendix F
    (homogeneous_onset_wavelength_eqF1) in one verified finite-wavelength linear-onset family
    lambda_c = 2*pi*L_0*(kappa/Delta)^(1/4) = 2*pi*(D*tau*eta/xi)^(1/4), while independently
    corroborating hannezo2015/q_si_inv_qc_extra_pi (printed 1/q_c off by constant factor pi = 3.14159).
    (4) Exact onset threshold & finite-domain discrete mode equivalence: Hannezo SI Eq. (10)'s
    chi_c^(0) = (1 + sqrt(phi))^2 maps non-circularly to Frohoff Eq. (B7)'s a^T = -2*chi_c^(0) at
    kappa = 2, a_Delta = 0, phi_bar_2 = 0, 3*phi_bar_1^2 = 1 + phi, Delta/kappa = phi (matching
    log-slope sqrt(phi)/(1 + sqrt(phi)) to 6.7e-13); Hannezo's U-shaped finite-domain threshold
    chi_i^(0) matches Frohoff Eq. (B5)'s -a_+(q_i) both at phi = 0 (exact decoupled CH) and at finite
    phi > 0 in the stiff-slaved limit kappa -> oo outside Frohoff's small-q Hopf band q^2 < 2*sqrt(phi/kappa);
    Hannezo's zero-friction limit (xi = 0, chi_i^(0) = phi + q_i^2) collapses identically onto
    Frohoff's monotonic decoupled CH border; and under mirror-domain doubling ell = 2*alpha (Neumann
    to periodic), Hannezo's floor/ceiling critical mode selector i_c agrees identically (40/40 exact
    integer matches) with Frohoff's discrete first-bifurcating Turing mode n_first_bif.
    Irreducible structural contrasts:
    (i) Conserved Hopf waves (type-IIo) vs. purely real active-gel spectrum and turnover-induced chaos:
    Frohoff's two conservation laws force lambda(0) = 0 and allow complex-eigenvalue bands (Eqs. B2,
    B10-B12) driving conserved Hopf traveling/standing waves and drift-pitchfork parity breaking
    (even in the stiff-slaved mapping, Frohoff retains a small-q Hopf band q^2 < 2*sqrt(phi/kappa)).
    Hannezo's linear dispersion Eq. (7) is purely real for all q >= 0 with strictly damped lambda(0) =
    -1/tau < 0; time-dependent dynamics arises only from nonlinear quadratic turnover (epsilon > 0)
    inducing merging-and-emerging spatiotemporal chaos at low friction phi > (2*pi)^4 approx 1559
    (and traveling pulses only under periodic BCs, never Hannezo's no-flux Neumann BCs).
    (ii) Non-commuting limits (Q -> oo vs. q -> 0) and Brinkman vs. biharmonic high-q regularization:
    because Frohoff's second field is conserved (relaxation rate Q*kappa*q^2), taking q -> 0 at fixed
    Q gives lambda(0) = 0 whereas taking Q -> oo at fixed q > 0 gives the reactive sink -Delta/kappa < 0;
    conversely, Hannezo's Brinkman kernel 1/(1 + l_h^2*q^2) stabilizes high q via -D*q^2 rather than
    -q^4, shifting the supercritical peak mode from q_max^CH ~ chi^(1/2) (lam_max ~ chi^2) to
    q_max^H = sqrt(sqrt(chi) - 1) ~ chi^(1/4) (lam_max ~ chi). Direct finite-(Q, q) equivalence
    therefore holds only inside the two-sided window 1/Q << q^2 << 1.
    (iii) Quartic double-well spinodal arrest ceiling vs. unbounded linear contractility:
    Frohoff's double-well Turing spinodal (turing_spinodal_composition_eq4_19 at a = -1, f_2'' = 0,
    matching Zwicker's c_spin <= 1/2) shuts off homogeneous instability above (Delta/kappa)_max = 1/4
    (phi_max = 1/16 under w = 2*l_h), whereas Hannezo's unbounded linear active stress sigma_a*rho/rho_0
    permits patterning for arbitrarily large phi, including low-friction chaos starting at
    phi > (2*pi)^4 approx 1559 (~25,000x above the double-well spinodal ceiling).
    (iv) Weakly nonlinear subcriticality mechanisms: Hannezo's quadratic advective nonlinearity
    d_y(rho*d_y s) generates a 2nd-harmonic resonance (i_0 = floor(alpha*phi^(1/4)/(sqrt(2)*pi)))
    and a turnover-controlled tricritical point phi = 1/4 (subcritical for phi < 1/4, supercritical
    for phi > 1/4; weakly_nonlinear_curvature_infinite_corrected), whereas Frohoff's cubic Landau
    bulk nonlinearity (phi_i^3) has zero quadratic harmonics at zero mean (subcriticality from
    nonvariational eigenvector non-orthogonality xi_pm^2 < Delta*Sigma in Eq. D19) and mean-controlled
    subcriticality |phi_bar_2| > sqrt(kappa*q_n^2/2) at nonzero mean (Eq. D11).
    (v) Coarsening arrest mechanism: Frohoff arrests coarsening purely via doubly conserved
    nonreciprocal two-field coupling without mass sources/sinks, whereas Hannezo's single-species
    active gel requires non-conserved actin turnover (1/tau > 0) to arrest collapse into a single peak.
