  text: >
    Cross-paper ModelAtlas synthesis with zwicker2015 (Zwicker, Hyman & Jülicher, PRE 92:012317, 2015;
    cited qualitatively on pp. 1-2 as ref-15) establishes exact mathematical bridges alongside three
    irreducible physical contrasts between doubly conserved nonreciprocal phase separation and
    chemically driven active emulsions.
    Exact bridges verified in frohoff2021/relations.yaml: (1) Under the midpoint shift phi = phi^B - psi/2
    and Appendix A scales a_1 = -b/2, b_1 = 2*b/psi^2, L_0 = w/sqrt(2), tau = w^2/D_B = 1/k_0,
    phi_hat_1 = psi/2, a = -1, q_F = q*w/sqrt(2), phi_bar_1 = 2*phi_0^B - 1, Zwicker Eq. (1)'s
    chemical potential mu^B is symbolically identical to Frohoff Eqs. (3)/(A5), curved coexistence
    Eq. (A1) reduces to Frohoff's decoupled planar binodal as R -> oo, and Zwicker's exact binary
    dispersion Eq. (F1_corrected) reduces both numerically and symbolically to Frohoff's decoupled
    passive variational Cahn-Hilliard dispersion as (k_f + k_b)/k_0 -> 0. (2) Actively, adiabatically
    eliminating a fast (Q -> oo), neutrally stable (f_2'' -> 0) conserved second field in Frohoff
    Eq. (12) yields an effective non-conserved sink -(Delta/kappa)*phi_1 and reproduces Zwicker's
    exact active dispersion Eq. (F1_corrected) identically at all q > 0 under the dictionary
    Delta/kappa = (alpha^2 - rho^2)/kappa <-> (k_f + k_b)/k_0 = (w/l)^2; moreover, even at arbitrary
    finite Q, Frohoff's stationary determinant det(B) at f_2'' = 0 is proportional to -lam_Z(q)/k_0,
    so the conserved Turing spinodal boundary |phi_bar_1|^T = sqrt((1 - 2*sqrt(Delta/kappa))/3) and
    upper cutoff (Delta/kappa)_max = 1/4 map identically onto Zwicker Eq. (F2_corrected). (3) Cross-paper
    diagnostics independently corroborate two algebraic misprints in zwicker2015: printed Appendix F
    Eqs. (F1)-(F2) fail both passive and active-adiabatic reductions as well as the Turing spinodal
    cutoff (factor-of-2 error on q^2, factor-of-4 error on (k_f+k_b)_max/k_0), and Sec. III's printed
    f(phi^B) breaks the Landau chemical-potential family for psi != 1.
    Irreducible contrasts outside the adiabatic limit: (i) Conservation laws and q -> 0 non-commutativity:
    Frohoff conserves both fields individually so lambda(0) = 0 at every finite Q, whereas Zwicker's
    reactive coupling keeps only total phi^A + phi^B conserved and gives lambda(0) = -(k_f + k_b) < 0.
    (ii) Oscillatory and drifting dynamics: finite-Q nonreciprocity in Frohoff yields large-scale Hopf
    instabilities, traveling waves, and standing waves, whereas Zwicker's single-field Eq. (3b) and
    corrected Appendix D multi-droplet Jacobian have strictly real spectra and purely stationary arrested
    emulsions. (iii) Coarsening-arrest length-scale hierarchy: under Delta/kappa = (w/l)^2, the linear
    Turing/reactive-spinodal onset wavelength Lambda_c = pi*sqrt(2*w*l) scales as k_b^(-1/4) (at fixed
    k_f/k_b), strictly separated in the sharp-interface limit w << l from Zwicker's nonlinear Ostwald-
    arrest radius R_stab ~ (w*l^2)^(1/3) ~ k_b^(-1/3) (Eq. 19) and isolated steady droplet radius
    R_bar ~ l ~ k_b^(-1/2) (Eq. 16).
