- id: q_lsa_s24_s26_discrepancies
  kind: possible_error
  about:
    - linear_stability_s24_s28
    - linear_stability_s24_s28_corrected
  text: >
    SI Sec. 3.3 linear stability Eqs. (S24)-(S26) (p. 16 / SI-7) contain four algebraic discrepancies:
    (1) Linearizing -(1/2) Q_ij Q_ij = -(Q_xx^2 + Q_xy^2) in Eq. (S19) around Q_xx = 1/sqrt(beta)
    yields +(2*gamma/sqrt(beta))*k^2*Q_xx~, half of the printed +(4*gamma/sqrt(beta))*k^2*Q_xx~ in
    Eq. (S24); (2) Eqs. (S24)-(S25) write +c_12 Q_xx~ = -omega_12 Q_xx~ and +c_21 phi~ = -omega_21 phi~,
    making omega_12 < 0 and omega_21 < 0, yet the text immediately below asserts that omega_12 and
    omega_21 are "strictly positive" (and calls decay rates omega_i "growth rates"); (3) Eq. (S26)
    prints dQ_xy~/dt = -E_1 k^2 Q_xy~, omitting the non-vanishing cubic elastic contribution
    -(E_3/sqrt(beta))*(k_x^2 - k_y^2)*Q_xy~; (4) Requiring only diagonal positivity omega_phi >= 0
    and omega_xx >= 0 overlooks the coupled 2x2 Jacobian determinant det(M) = omega_phi*omega_xx -
    c_12*c_21, which becomes negative as k -> 0 when beta < 1/4 (exact) or beta < 1/2 (printed Eq. S24).
  citation: {page: 16, printed_page: "SI-7", quote: "Substituting the above expressions in Eqs. S19-S20 gives", where: "SI Eqs. (S24)-(S26)"}

