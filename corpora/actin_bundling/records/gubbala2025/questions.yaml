    classify its 5 experimental samples in Fig. S1 without writing an equation, inheriting
    arnold2024/q_actin_density_mean_vs_total_intensity (dividing mean intensity rather than
    integrated intensity by available Ld area).
    (4) Qualitative Laplace-Young bridge and disjoint dynamics: gubbala2025 p. 6 invokes classical
    Laplace-Young proportionality between curvature and excess elastic stress qualitatively
