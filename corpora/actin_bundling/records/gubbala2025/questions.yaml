- id: q_eqS8_cayley_hamilton_3d_in_2d
  kind: possible_error
  about:
    - ldg_bulk_free_energy_eq4
    - nematic_q_tensor_eq3
  text: >
    SI Sec. 3.1 Eq. (S8) (p. 13 / SI-4) invokes the 3D Cayley-Hamilton theorem
    Q^3 - Tr(Q) Q^2 + (1/2)(Tr(Q)^2 - Tr(Q^2)) Q - (det Q) I = 0, and p. 14 (SI-5) simplifies it for
    traceless Q to Q^3 = (1/2) Tr(Q^2) Q + (det Q) I before substituting the 2D identity
    det Q = -(1/2) Tr(Q^2). In 2D, the Cayley-Hamilton theorem is instead Q^2 - Tr(Q) Q + (det Q) I = 0,
    yielding Q^2 = (1/2) Tr(Q^2) I and Q^3 = (1/2) Tr(Q^2) Q (without the +(det Q) I term). Applying the
    3D formula to a 2D traceless matrix yields the false identity Q^3 = (1/2) Tr(Q^2) (Q - I), whose
    trace is -Tr(Q^2) != 0 even though Tr(Q^3) = 0 identically for any 2D traceless matrix.
  citation: {page: 14, printed_page: "SI-5", quote: "due to the traceless property of the Q tensor. In 2D", where: "SI Sec. 3.1 Eq. (S8)"}

- id: q_high_actin_pde_fast_regime_mismatch
  kind: unexplained_difference
  about:
    - run_pde_high_variational_stab
    - cmp_pde_high_alpha_var_stab
    - cmp_pde_high_Rratio_fig3
    - alpha_high_actin_sim_printed
    - R_ratio_high_sim_fig3_end
  text: >
    In run_pde_high_variational_stab (variational 2D PDE with stabilized E_3 = 1.8, E_1 = 2, phi_0 = 0.75,
    N = 64, L = 62.5, dt = 0.15, fitted over t = 200..1200), the computed coarsening exponent is
    alpha = 0.405 and growth ratio R(1200)/R(200) = 2.04, which is faster than both alpha = 1/4 and
    alpha = 1/3 rather than reproducing the paper's printed alpha < 0.25 (p. 5, Fig. 3) and eye-read
    Fig. 3 ratio ~1.32. As SI Fig. S2 (p. 18) shows, high-actin simulations pass through an intermediate
    "fast" coarsening regime (faster than low-actin) before crossing over to a late-time "slow" arrested
    regime (diagnostic evaluation of the same solver over t = 1000..3000 yields alpha = 0.156 < 0.25 and
    R(3000)/R(1000) = 1.19). Because the paper omits its dimensionless time-to-seconds mapping, the shared
    window t = 200..1200 samples the fast transient rather than the late slow regime, and
    run_pde_high_variational_stab uses 1 replicate without a dt refinement in refinements.yaml.
  citation: {page: 5, printed_page: "6247", quote: "In the high actin density samples, coarsening is slower than interface-driven growth", where: "Sec. 3 / Fig. 3 / Fig. S2"}

