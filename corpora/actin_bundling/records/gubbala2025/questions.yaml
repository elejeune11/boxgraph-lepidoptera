    - cmp_curv_circle_corrected
  text: >
    SI Eq. (S2) (p. 13 / SI-4) prints kappa = |x'y'' - y'x''| / (x' + y')^(3/2), omitting the squares
    on x' and y' in the standard planar curvature denominator ((x')^2 + (y')^2)^(3/2). As printed,
    Eq. (S2) is dimensionally wrong ([length]^(1/2) instead of 1/[length]), diverges where x' + y' = 0,
    and yields complex/NaN values on half of any closed circular loop, failing to reproduce the paper's
    stated constant normalized curvature kappa = 1 for circular domains (p. 5, Fig. 4).
  citation: {page: 13, printed_page: "SI-4", quote: "The unsigned curvature", where: "SI Eq. (S2)"}

