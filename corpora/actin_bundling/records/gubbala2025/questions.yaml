  text: >
    Cross-record ModelAtlas audit with arnold2024 (Arnold & Takatori, Langmuir 40:26570-26578,
    2024; cited as ref-9 and ref-S6). Although gubbala2025 explicitly positions itself as the
    theoretical phase-field interpretation of arnold2024 and compares against arnold2024's domain
    size and curvature metrics (Sec. 3, p. 5), four methodological shifts and unmodeled links
    emerge across the two records:
    (1) Boundary curvature refutation and recovery: comparing gubbala2025's printed SI Eq. (S2)
    (boundary_curvature_s2, missing squares in (x' + y')^(3/2)) directly against arnold2024's
    periodic smoothing-spline div(n) curvature (arnold2024/domain_curvature_spline at aspect_ratio
    = 1) refutes equivalence at all 40 sampled radii (median relative difference 9.45e-01;
    rel_arnold2024_curvature_s2_printed_vs_spline_circle), whereas the corrected planar curvature
    boundary_curvature_s2_corrected verifies reduces_to as aspect_ratio -> 1 to 8.5e-07
    (rel_arnold2024_curvature_spline_reduces_to_s2_corrected).
    (2) Static structure-factor definition shift: both papers compute domain length from the
    inverse first moment of S(k) (verified L^(+1) and k^(-1) scaling via
    rel_arnold2024_structure_factor_pipeline_scales_s1_R and
    rel_arnold2024_structure_factor_s1_scales_mean_wavelength), but arnold2024 prints wavelength
    a = 2*pi/<k> using unsquared S(n) = |FFT(n)| and a < 5 px wavelength cutoff (p. 4, Eq. 5;
    arnold2024/q_structure_factor_unsquared_fft), whereas gubbala2025 defines R = 1/k_m (smaller
    by 2*pi ~= 6.283 in absolute units, cancelling in Fig. 3's normalized R(t)/R_0) using standard
    squared S(k) = <|phi_k|^2> and k_cut = 50*k_max (SI Eqs. S1 & S33-S34).
    (3) Inherited actin density metric without printed formula: gubbala2025 p. 4 (citing ref-9)
