    stated relations, 0 proposed equation-level relations in gubbala2025/relations.yaml, 0 same_as
    families, and 0 cited.yaml data links:
    (1) Citations & data provenance: neither paper cites the other (gubbala2025 ref-13 cites only
    an earlier Bausch group study, Tharmann et al., PRL 98:088103, 2007, not nastkolb2022). Their
    75 x 66 bibliographies share exactly 2 entries: Honigmann et al., eLife 3:e01671 (2014)
    [gubbala2025/ref-5 = nastkolb2022/ref-honigmann2014] — the common experimental precursor on
    membrane-bound actin organizing lipid phase separation — and Spudich & Watt, JBC 246:4866-4871
    (1971) [gubbala2025/ref-S1 = nastkolb2022/ref-spudich1971] for actin purification. Neither
    record's data.yaml borrows any value from the other (gubbala2025's 2 from_source entries cite
    Bray & Emmott 1995 [ref-54]; nastkolb2022 has 0 from_source entries).
    (2) Disjoint mathematical models & rejected trivial coincidences: nastkolb2022's only two
    non-too_plain (>2 ops) runnable models are empirical single-exponential FRAP curve fits
    (frap_recovery_fit, y = a*(1 - exp(-t/tau)) + c, 6 ops; frap_recovery_by_half_time, 8 ops),
    which have no FRAP, diffusivity, or exponential time-course counterpart in gubbala2025's
    continuum Cahn-Hilliard + Landau-de Gennes Model C framework (gubbala2025 tracks unbounded
    power-law Lo-domain coarsening R(t)/R_0 = (t/t_0)^alpha with alpha <= 1/3, static structure
    factors S(k), planar boundary curvature kappa, and Fourier linear-stability rates omega(k)).
    All remaining 9 runnable nastkolb2022 models have <= 2 symbolic ops (too_plain=True:
    bundle_filament_count_2d_spacing 1000*W/d_spacing, bundle_effective_spacing 1000*W/n_f,
    bundle_width_vasp_scaling W ~ c_VASP [0 ops, prefactor: unknown], cp_to_actin_ratio,
    actin_concentration_fold_change, frap_half_time, frap_tau_from_half_time,
    frap_mobile_fraction_plateau, frap_mobility_ratio), and gubbala2025 treats actin as a continuum
    2D nematic field Q_ij(x, t) without discrete bundle-width, interfilament-spacing, filament-count,
    or capping-protein equations. Trivial low-op algebraic coincidences — such as mapping 1-op
    frap_mobility_ratio (t_half_ml/t_half_slb, ML-vs-SLB VASP mobility) to nondim_parameters_s32.gamma
    (t_Q/t_phi, nematic-vs-lipid timescale ratio), 0-op bundle_width_vasp_scaling to linear Frank
    stiffness k_33 ~ E_1, or t/tau -> 0 linear Taylor expansion of FRAP to coarsening_power_law at
    unphysical alpha = 1 — are excluded as physically spurious. All 6 non-runnable nastkolb2022
    image-analysis models (bilayer_actin_decoration, bundle_filament_intensity_extrapolation,
    bundle_intensity_ratio, bundle_width_lognormal_fit, frap_bleach_normalization,
    vasp_actin_spearman_colocalization) likewise lack runnable equation counterparts in gubbala2025.
    Symbol collisions: R (domain size vs. dimensionless ratios R_CP, R_mob, R_actin, R_I), alpha
    (coarsening exponent or anchoring parameter vs. none), t (dimensionless or physical coarsening
    time [s] vs. post-bleach FRAP time [min]), a (absent vs. FRAP recovery amplitude), and c
    (absent vs. FRAP baseline offset).
    (3) Quantitative biophysical comparison of the two 2D fluid-SLB actin-membrane systems:
    (a) Inverted lipid-actin causality & substrate friction (bridging shared citation Honigmann 2014):
    gubbala2025 starts from a thermodynamically phase-separating quaternary Lo/Ld bilayer (45.7%
    DOPC, 34.7-35% DPPC, 15% cholesterol, 4% DOTAP) ruptured onto a low-friction polymer-cushioned
    coverslip (200 nM HMM + 0.1 mg/mL PLL-g-PEG) so Lo domains spontaneously nucleate and coarsen
    after quenching from 37 degC; pre-polymerized uncrosslinked 3-5 um F-actin electrostatically
    adsorbs to DOTAP in the Ld phase and passively deforms/slows Lo coarsening via anisotropic
    nematic elasticity (E_1, E_3; k_33/k_11 = 2.5 printed / 3.0 2D) and parallel anchoring (chi = 1).
    Conversely, nastkolb2022 uses a single-phase fluid SLB on bare glass (87.45% egg-PC, 10%
    DOGS-Ni-NTA, 2.5% DOPE-PEG2000, 0.05% Texas Red-DHPE; no Lo/Ld miscibility gap) where washed
    His-tagged chimeric VASP (0.05-1 uM, 28-70 nm diameter) undergoes 2D LLPS before actin addition
    (>=0.25-0.5 uM; cluster area 0.007-0.596 in Fig. S4H) and active barbed-end polymerization
    (2 uM G-actin, 10 uM profilin, 50 nM CP -> R_CP = 2.5%) drives local VASP/Ni-NTA enrichment
    under bundles (R_I,VASP = 1.47 -> 1.95 peak -> 1.62 at 60 min, Fig. 5C) and steric exclusion
    of unbound Texas Red-DHPE lipids (R_I,lipid dipping 9.0% to 0.910 at 4.8 min and relaxing to
    0.951 at 60.6 min, contrasting with p. 8's overstated 'half of initial intensity' text). As
    nastkolb2022 p. 9 notes via Honigmann et al. (2014), active VASP-actin polymerization overcomes
    bare-glass lipid friction that normally suppresses lipid phase separation (Goodchild et al.
    2019), whereas gubbala2025 relies on a polymer cushion to reduce substrate friction (yet still
    observes sample-to-sample friction variability, p. 4).
    (b) Passive nematic defects vs. active polymerization-driven bundling: gubbala2025's passive
    uncrosslinked F-actin (A-buffer ~47 mM ionic strength, no cross-linkers/profilin/CP) rearranges
    viscoelastically in Ld around Lo domains, generating -1/2 triangular corner defects (experiments)
    or tactoids (2D simulations). In nastkolb2022 (KMEI ~72 mM), pre-polymerized F-actin added to a
    VASP bilayer is merely pulled down without bundling (Fig. S4D-E), and static crosslinking
    (alpha-actinin1b) or barbed-end elongation alone (mDia1) fails to bundle; notably, nastkolb2022's
    mDia1 + alpha-actinin1b control (Fig. 3D, p. 6) traps rapidly elongating membrane-tethered
    filaments in a 'high-density nematic field' with 'nematic defects' — directly echoing
    gubbala2025's high-actin nematic regime — whereas VASP (both tetrameric, median 0.942 um, and
    monomeric VASP_DeltaTetra, median 0.584 um, max 3.0-3.2 um) bypasses defect trapping through
    positive-feedback barbed-end capture and lateral bundle thickening (45 +/- 12 filaments/um).
    (c) Lateral mobility & timescales: nastkolb2022 quantifies 2D VASP diffusion via FRAP (bleach
    diameter 4.96 um, r_b = 2.48 um): pre-polymerization SLB t_1/2 = 0.102 min = 6.12 s (tau =
    8.83 s, 2D Soumpasis D_SLB = 0.225 um^2/s, mobile fraction falling 0.97 -> 0.65 after 30 min
    polymerization) vs. monolayer t_1/2 = 0.399 min = 23.94 s (tau = 34.54 s, D_ML = 0.0575 um^2/s,
    3.91x slower, mobile fraction 0.61 -> 0.57), where a 4x drop in mobility completely abolishes
    bundling via CP competition. gubbala2025 omits dimensional M and Gamma, but digitized Fig. S6 /
    Fig. 3 scaling (q_digitize_settles_deferred_and_timescale) implies t_Q = Gamma^-1 ~ 0.24 s and
    interfacial lipid diffusion timescale t_phi = t_Q/gamma ~ 2.4 s (at gamma = 0.1), while
    macroscopic Lo coarsening unfolds over ~2 h (720-7180 s, alpha <= 0.25 vs. 1/3 passive) versus
    nastkolb2022's rapid active bundle thickening (0-80 s diffraction-limited onset, saturating in
    ~5-20 min over 60 min runs).
    (d) Comparable 2D actin occupancy and pore scales, but distinct pore contents & quasi-2D
    stacking: nastkolb2022's segmented actin bilayer decoration (Fig. S2G) rises from 37.6% (0.05
    uM VASP) to 65.1% (0.25 uM) and 94.9% (1.0 uM) while open bare-bilayer median pore area shrinks
    from 1.393 um^2 (equiv. diameter 1.33 um) to 0.594 um^2 (0.87 um) and 0.199 um^2 (0.50 um;
    Fig. 2E). In gubbala2025's simulations, actin-occupied continuous Ld area fraction
    (phi_0 - phi_Lo)/(phi_Ld - phi_Lo) (coupled binodals -1.1929, +1.2233) spans a closely matching
    61.8% (low actin phi_0 = 0.3; nominal 65.0%) to 80.4% (high actin phi_0 = 0.75; nominal 87.5%),
    leaving 38.2% to 19.6% area filled by phase-separated Lo domains (~1-10 um without actin) whose
    boundaries shift from circular (kappa ~ 1) to flat-sided angular pores (kappa -> 0, Fig. 4).
    Finally, both experimental composites show signs of thin quasi-2D multilayering: gubbala2025
    p. 6 estimates O(10-50 nm) stacked bundle thickness permitting out-of-plane twist relaxation of
    +1/2 defects, while nastkolb2022's 45 +/- 12 filaments/um implies 22.2 nm effective 2D spacing
    below the 28-70 nm VASP diameter (consistent with compaction or ~1.26-layer stacking).
