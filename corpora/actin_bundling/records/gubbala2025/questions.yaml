- id: q_eq10_e3_sign
  kind: possible_error
  about:
    - model_c_pde_2d_eq9_10
    - model_c_pde_2d_variational
    - cubic_elastic_variational_sign_eq10
    - elastic_free_energy_eq5
  text: >
    The cubic elastic term in printed Eq. (10) (p. 3), SI Eq. (S18) (p. 15), and SI Eq. (S20) (p. 15)
    appears with the opposite sign of variational gradient descent dQ/dt = -delta F/delta Q (Eq. 8).
    Direct Euler-Lagrange differentiation of Eq. (5) / Eq. (S14) f_elastic = (1/2)E_1(d_i Q_jk)^2 +
    (1/2)E_3 Q_ij d_i Q_kl d_j Q_kl yields +(delta F_E3/delta Q_ij)^st = +(1/2)E_3(d_i Q_kl d_j Q_kl -
    2 d_k Q_ij d_l Q_kl - 2 Q_kl d_k d_l Q_ij - (1/2) delta_ij (d_k Q_ml)^2), so -delta F_E3/delta Q_ij
    requires -(1/2)E_3(...), not +(1/2)E_3(...). Numerically on a smooth periodic 2D test field
    (run_e3_variational_sign), printed Eq. (10) gives dF_E3/dt ratio = -1.000000 (increasing F_E3)
    whereas the negated variational form gives +1.000000. Moreover, the paper's own linear stability
    Eq. (S25) (p. 16) prints -(E_3/sqrt(beta))(k_x^2 - k_y^2) Q_xx~, which follows ONLY from the
    variational sign -(1/2)E_3(...), not the printed +(1/2)E_3(...).
  citation: {page: 3, printed_page: "6245", quote: "The expanded forms of these coupled equations can be expressed as", where: "Eq. (10)"}

- id: q_eq4_vs_eq10_trQ4_factor2
  kind: possible_error
  about:
    - ldg_bulk_free_energy_eq4
    - ldg_bulk_free_energy_eq10_consistent
    - nematic_saturation_eq4_s5
    - nematic_saturation_from_eq4_exact
  text: >
    Factor-of-2 discrepancy in 2D between the printed bulk free energy Eq. (4) / SI Eq. (S5) and the
    evolution equations Eq. (10) / Eq. (S18) / Eq. (S20). For a 2D symmetric traceless Q tensor,
    Tr(Q^2) = 2(Q_xx^2 + Q_xy^2) and Tr(Q^4) = 2(Q_xx^2 + Q_xy^2)^2 = (1/2)(Tr(Q^2))^2. Thus the
    printed Eq. (4) quartic term (beta/4) Q_ij Q_jk Q_kl Q_li = (beta/2)(Q_xx^2 + Q_xy^2)^2 yields
    -(delta f_bulk/delta Q_ij)^st = [1 + phi - (beta/2) Q_kl Q_kl] Q_ij with critical points
    Q_xx = +-sqrt((1+phi)/beta) (sqrt(2/beta) at phi = 1), whereas Eq. (10), Eq. (S18), Eq. (S20)
    print [1 + phi - beta Q_kl Q_kl] Q_ij and SI p. 13 states critical points +-sqrt(A/(2*beta))
    (giving 1/sqrt(beta) at phi = 1), which instead follow from f_bulk = (beta/4)(Q_ij Q_ij)^2 -
    ((1+phi)/2) Q_ij Q_ij.
  citation: {page: 3, printed_page: "6245", quote: "The bulk free energy, which controls the isotropic-to", where: "Eq. (4)"}

- id: q_eq3_vs_s33_S_convention
  kind: possible_error
  about:
    - nematic_q_tensor_eq3
    - nematic_saturation_eq4_s5
    - linear_stability_s24_s28
  text: >
    Factor-of-2 convention mismatch between Eq. (3) and SI Sec. 3.3 (p. 15). Under Eq. (3),
    Q_ij = S(n_i n_j - (1/2) delta_ij), a director parallel to the x-axis (n = (1, 0)) yields
    Q_xx = S/2 and Q_yy = -S/2 (Tr(Q^2) = S^2/2). However, SI Sec. 3.3 states "the director is
    parallel to the x-axis, giving Q_xx = S and Q_xy = 0. We choose S = 1/sqrt(beta) to satisfy the
    non-linear bulk free energy in Eq. S20." Taking Q_xx = S makes Q_xx/S = 1 in the anchoring term
    of Eq. (S19), producing chi*(k_x^2 - k_y^2) in Eq. (S24); under Eq. (3) strictly, Q_xx/S = 1/2
    would halve the anchoring coefficient unless Q_ij = 2*S*(n_i n_j - delta_ij/2).
  citation: {page: 15, printed_page: "SI-6", quote: "the director is parallel to the x-axis, giving", where: "SI Sec. 3.3"}

- id: q_eq6_3d_vs_2d_frank
  kind: possible_error
  about:
    - frank_elastic_constants_eq6
    - frank_elastic_constants_2d
    - k33_over_k11_printed
    - cmp_k33_k11_2d_variant
  text: >
    Eq. (6) (p. 3) cites Beris & Edwards (Ref. 45) for k_11 = 2 E_1 S^2 - (2/3) E_3 S^3 and
    k_33 = 2 E_1 S^2 + (4/3) E_3 S^3, which is the 3D mapping derived from Q_ij = S(n_i n_j - delta_ij/3).
    That 3D formula reproduces the paper's printed k_33/k_11 = 2.5 at E_3/E_1 = 1, S = 1. However,
    substituting the paper's own 2D tensor Q_ij = S(n_i n_j - delta_ij/2) (Eq. 3) into Eq. (5) yields
    k_11 = 2 E_1 S^2 - E_3 S^3 and k_33 = 2 E_1 S^2 + E_3 S^3, which gives k_33/k_11 = 3.0 at
    E_3/E_1 = 1, S = 1 and bounds -2/S <= E_3/E_1 <= 2/S.
  citation: {page: 3, printed_page: "6245", quote: "first set bounds on E1 and E3. We relate kii and Ei", where: "Eq. (6)"}

- id: q_p3_E3_lower_bound_typo
  kind: possible_error
  about:
    - elastic_ratio_bounds_p3
    - elastic_ratio_bounds_eq6_corrected
    - E3_over_E1_min_S1
  text: >
    Below Eq. (6) on p. 3 (6245), the paper prints "-1.5S <= E_3/E_1 <= 3/S". Solving k_33 =
    2 E_1 S^2 + (4/3) E_3 S^3 >= 0 (with E_1 >= 0, S > 0) gives E_3/E_1 >= -3/(2S) = -1.5/S, not
    -1.5*S. The misprint is masked at the paper's parameter choice beta = 1 (S = 1), where
    -1.5*S = -1.5/S = -1.5, but gives the wrong bound for any S != 1 (e.g., at S = 2: -3.0 vs. -0.75).
  citation: {page: 3, printed_page: "6245", quote: "Given the constraints kii", where: "Sec. 2.1"}

- id: q_coupled_binodal_illposedness
  kind: possible_error
  about:
    - coupled_binodal_coexistence
    - model_c_pde_2d_eq9_10
    - model_c_pde_2d_variational
    - run_pde_high_printed
    - cmp_binodal_phi_Ld_vs_nominal
  text: >
    The paper's linear stability analysis (SI Sec. 3.3, pp. 15-16) linearizes around a nominal
    nematic state phi = +1 with |Q| = 1/sqrt(beta), yielding the marginal bound beta >= (E_3/E_1)^2,
    and chooses beta = 1, E_3 = E_1 right on that boundary. However, because the bulk free energy
    couples phi and Q via -((1+phi)/2) Q_ij Q_ij, exact common-tangent thermodynamic coexistence at
    beta = 1 shifts the coexisting phases from +-1 to phi_Lo = -1.1929 and phi_Ld = +1.2233
    (mu_coex = -0.5045). In the true Ld phase, equilibrium nematic order is |Q|_eq =
    sqrt((1+phi_Ld)/(2*beta)) = 1.0543 > 1, making the effective perpendicular nematic diffusivity
    E_1 - E_3 |Q|_eq = -0.0543 E_1 < 0 (weakly ill-posed backward diffusion). At high stiffness
    (E_1 = E_3 = 2), our 2D pseudospectral simulations blow up around t ~ 900-1100 for both E_3 signs,
    whereas reducing E_3 slightly below E_1/|Q|_eq = 1.897 (e.g., E_3 = 1.8) restores long-time
    stability and reproduces slowed late-time coarsening.
  citation: {page: 16, printed_page: "SI-7", quote: "For the above expressions to be positive, we need to have", where: "SI Sec. 3.3"}

- id: q_eqS2_curvature_denominator
  kind: possible_error
