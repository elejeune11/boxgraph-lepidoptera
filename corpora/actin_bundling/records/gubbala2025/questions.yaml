    Cross-paper ModelAtlas synthesis with weirich2017 (cited as Ref. 43 on pp. 2, 6, 7) identifies
    three structural physical contrasts between Gubbala's 2D diffuse-interface Model C and Weirich's
    3D sharp-interface homogeneous-tactoid theory: (1) Homogeneous Wulff cusps vs. defect-driven
    cusps — in Weirich, sharp tactoid cusps under a uniform director require omega = gamma_A/gamma_I
    > 1 (measured omega in [1.1, 2.2]) and small director crossover parameter gamma_A*V^(1/3)/K << 1;
    in Gubbala, linear stability (SI Eq. S27) caps parallel anchoring at chi <= 2 (simulations use
    chi = 1), for which 1D Cahn-Hilliard kink integration yields omega = chi/2 <= 1 (omega = 0.5 at
    chi = 1) and exact variable-width kink tension sigma(psi) = sigma_0*sqrt(1 + chi*cos^2(psi))
    whose Wulff stiffness sigma + sigma'' = sigma_0*(1+chi)/(1+chi*cos^2(psi))^(3/2) > 0 is strictly
    positive for all chi > -1 (giving a smooth ellipse of aspect ratio sqrt(1+chi), never homogeneous
    cusps). Meanwhile, Gubbala's anchoring-to-Frank crossover ratio xi_splay_eq6 = (sqrt(2)/3)*chi*R/k_11
    is >> 1 at low actin (E_1 = E_3 = 0.1, xi ~ 35-180) and O(2-9) at high actin (E_1 = E_3 = 2),
    showing that Gubbala's simulated tactoids arise from spatial director distortion and topological
    defects (Weirich's bipolar/deformed regime), not Weirich's homogeneous Wulff mechanism; (2)
    Dispersion anchoring mismatch — matching Gubbala's high-k longitudinal damping omega_phi(k, 0)
    (stiffness 1 + 3*chi/2 from SI Sec. 3.3's Q_xx = S convention) to Weirich's exact corrected
    capillary dispersion (stiffness 1 + 2*omega) requires omega = (3/4)*chi rather than the exact
    kink-integrated omega = (1/2)*chi (a direct consequence of q_eq3_vs_s33_S_convention); and (3)
    Inverted coarsening kinetics — freely diffusing 3D actin tactoids in Weirich coalesce with
    alpha = 0.47 +/- 0.01 (~1/2), whereas isotropic lipid inclusions trapped inside Gubbala's
    continuous 2D nematic actin network are hindered below Ostwald ripening (1/3) to alpha <= 0.25.
  citation: {page: 7, printed_page: "6249", quote: "by reducing the role of anisotropic elasticity, one can", where: "Sec. 4 Conclusions (Ref. 43)"}

