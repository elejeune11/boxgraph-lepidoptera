  text: >
    Cross-record provenance audit between gubbala2025 and arnold2023 (Arnold, Gubbala & Takatori,
    Phys. Rev. Lett. 131:128402, 2023; cited as ref-8 on p. 1, same lab) resolves
    q_si_methods_active_copy_paste by establishing direct verbatim/structural copy-paste from
    arnold2023's Supplemental Material into gubbala2025's ESI as the exact source of three major
    shared SI errors (plus two additional SI notation/terminology carryovers):
    (1) Shared SI Error 1 — F-actin adsorbs to "liquid-ordered" (Lo) phase instead of Ld:
    arnold2023 SI Sec. II.E (PDF p. 8 / SI-2; arnold2023/q_si_actin_lo_phase_misprint) prints
    "F-actin spontaneously adsorbed to the liquid-ordered phase of lipid bilayer via electrostatic
    attraction to DOTAP [5]. Unbound actin was washed from the cover slip with A-buffer."
    gubbala2025 SI Sec. 1.5 (PDF p. 12 / SI-3; q_experimental_discrepancies_main_vs_si) reproduces
    this sentence word-for-word (even retaining the missing article "of lipid bilayer", renumbering
    only [5] -> [4], both Schroer et al. PNAS 2020), directly contradicting both papers' main texts
    where DOTAP and F-actin partition into the Ld phase (and contrasting with the intervening
    arnold2024 Methods p. 2, which fixed the sentence to "sequesters into the Ld phase").
    (2) Shared SI Error 2 — 86.0%-sum second GUV lipid recipe omitting cholesterol (and orphaned
    active-matter methods text): arnold2023 SI Sec. II.C (PDF p. 8 / SI-2;
    arnold2023/q_si_low_composition_missing_cholesterol) prints "An additional set of vesicles was
    formed using 52.7% DOPC, 24.7% DPPC, 8% DOTAP, 0.3% DSPE-PEG2k-FITC, and 0.3% ATTO 647-DOPE,
    to achieve the lowest area fraction sampled amongst the active samples." (summing to 86.0%,
    omitting 15% cholesterol printed in arnold2023 Fig. S1 for its active phi_A = 0.21 sample).
    gubbala2025 SI Sec. 1.3 (PDF p. 11 / SI-2; q_experimental_discrepancies_main_vs_si &
    q_si_methods_active_copy_paste) copies this entire sentence verbatim — including the 86.0%
    cholesterol-omitted recipe AND the phrase "amongst the active samples", even though gubbala2025
    contains zero active myosin experiments. Likewise, gubbala2025 SI Sec. 1.3 retains arnold2023's
    34.7% DPPC + 0.3% ATTO 647-DOPE in the primary recipe while updating only DOPC/DOTAP from
    44.7%/5% to 45.7%/4% (causing the mismatch with gubbala2025 main text p. 4's 35% DPPC and no
    ATTO 647-DOPE), and gubbala2025 SI Sec. 1.2 retains the orphaned heading "Actin and myosin
    preparation" after deleting arnold2023's myosin II paragraph and SI Ref. [3] (Margossian &
    Lowey 1982), which shifts arnold2023 SI Refs. [1]-[2], [4]-[6] verbatim into gubbala2025 SI
    Refs. [1]-[5] in identical order.
    (3) Shared SI Error 3 — Adaptive time-step formula dt_new = (tau / Delta)^(1/5) omitting dt_old
    and applying a 4th-order 1/5 exponent to a 1st-order forward-Euler IMEX stepper: arnold2023 SI
    Sec. IV (PDF p. 14 / SI-8; arnold2023/q_adaptive_dt_formula_error) prints
    dt_new = [tol / (phi(t; dt) - phi(t; dt/2))]^(1/5) with tol = 10^-4 for its 1st-order forward-
    difference IMEX Eq. (46). gubbala2025 SI Sec. 4 (PDF p. 16 / SI-7; q_eqS29_S31_phi2_kappa_typos
    & q_audit_si_sec4_imex_prose_and_dt_exponent) generalizes the denominator to the scalarized
    geometric mean Delta = (Delta_phi * Delta_Qxx * Delta_Qxy)^(1/3) with Delta_X = |X(t; dt_old) -
    X(t; dt_old/2)| and tightens printed tau to 10^-6 (while released gubbala_code still defaults
    to TOL = 1e-4, matching arnold2023's tol = 10^-4), yet preserves both the omitted multiplying
    factor dt_old (dimensional inconsistency) and the mismatched 1/5 exponent (4th-order O(dt^5)
    local error instead of 1st-order forward-Euler O(dt^2) exponent 1/2).
    (4) Two additional SI notation/terminology carryovers from arnold2023: (a) gubbala2025 SI
    Sec. 4 Eqs. (S29) and (S31) (p. 16 / SI-7) abruptly replace dimensionless line tension lambda
    with the undefined symbol kappa (+kappa*k^2*phi_k and 1 + (gamma*kappa*k^4 + k^6)*dt), tracing
    directly to arnold2023 SI Eq. (46)'s -M*kappa*k^4*phi_k; and (b) gubbala2025 SI Sec. 2.2
    (p. 12 / SI-3) copies arnold2023 SI Sec. IV.A (p. 14 / SI-8)'s misnomer calling the cutoff
    wavenumber k_cut the "cut-off wavelength" (k_cut = 50 x k_max vs. k_cut = 2*k_max).

