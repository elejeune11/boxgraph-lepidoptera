  citation:
    page: 1
    printed_page: "6243"
    quote: "motion of the actin filaments can accelerate the coarsening"
    where: "Intro p. 1 (ref-8), Sec. 2.1 Eqs. (2), (8)-(9) (pp. 2-3), & SI Sec. 2.2, 3.2-3.3, 4 vs arnold2023"
  text: >
    Cross-record ModelAtlas synthesis between gubbala2025 (26 runnable models) and arnold2023 (16
    scalar runnable models + 4 curve-port models + 1 non-runnable PIV model; same Takatori lab,
    gubbala2025 cites arnold2023 as ref-8 on p. 1 and shares 11 bibliographic references including
    Veatch & Keller 2003, Stanich et al. 2013, Bray & Emmott 1995 [ref-54 <-> ref-S8], and SI
    Refs. [1]-[5] <-> [1]-[2],[4]-[6]). Seven proposed relations in gubbala2025/relations.yaml
    connect the shared Cahn-Hilliard scaling, power-law, Ostwald-ripening, and linear-CH
    submodels (6 verified, 1 diagnostic not_verified active-vs-hindered contrast), while four
    structural/analytical links cannot be expressed as direct scalar ModelAtlas relations without
    altering existing models:
    (1) Exact passive Cahn-Hilliard PDE & free-energy reduction: gubbala2025 Eq. (2) / SI Eq. (S17)
    uses the identical double-well potential f_phi = phi^4/4 - phi^2/2 + (lambda_tilde/2)|grad phi|^2
    and conserved mobility equation d_t phi = M*grad^2(phi^3 - phi - lambda_tilde*grad^2 phi) as
    arnold2023 Eq. (1) / SI Eq. (46) in the actin-free decoupled limit (Q = 0, alpha = 0) and
    zero-flow limit (v = 0), with lambda_tilde <-> kappa (verified at the scale level via
    rel_arnold2023_nondim_lc_scales_ch_lc and rel_arnold2023_nondim_tphi_scales_ch_tc, while
    dimensionless ratios gamma = t_Q/t_phi = M/(lambda_tilde*Gamma) and Pe = t_c/t_flow =
    gamma_dot*kappa/M are exact reciprocals under Gamma <-> gamma_dot). Direct ModelAtlas execution
    between the two stochastic 2D PDE models (model_c_pde_2d_{eq9_10,variational} vs.
    arnold2023/cahn_hilliard_2d_pde) is excluded because both hardcode incompatible solver settings
    (N = 64, L_box = 62.5, dt = 0.4 with k^6 damping vs. N = 128, dt = 0.05, t_end = 50.0) and
    taking beta -> inf to suppress |Q| = 1/sqrt(beta) -> 0 causes explicit-Euler blowup in
    model_c_pde_2d_* at fixed dt = 0.4; arnold2023 also has no standalone scalar model for Eq. (2)'s
    free-energy density f_phi.
    (2) Exact passive linear-stability dispersion match: gubbala2025 SI Eq. (S27) diagonal decay
    rate omega_phi = gamma*k^2*[2 + (1 + 3*chi/2)*kx^2 + (1 - chi/2)*ky^2] reduces at chi = 0,
    gamma = 1 to omega_phi(k) = 2*k^2 + k^4, matching minus arnold2023 SI Eq. (42)'s linearized
    passive growth rate [(1 - 3*phi_0^2)*k^2 - k^4] evaluated at the equilibrium binodal phi_0 =
    +/- 1 (where 1 - 3*phi_0^2 = -2). Because arnold2023/cahn_hilliard_linear_shear_eq45 integrates
    over all k to output a_rad(t) rather than exporting single-k dispersion omega(k), no direct
    linear-dispersion relation exists between the two records.
    (3) Structure-factor first-moment metric (curve-port boundary): gubbala2025 SI Eq. (S1)
    R(t) = (int_0^{k_cut} S(k, t) dk)/(int_0^{k_cut} k S(k, t) dk) is mathematically identical in
    functional form to arnold2023 SI Eq. (47) a(t) = (int_{k_min}^{2*k_max} S(k, t) dk)/(int k S dk)
    (both using squared S(k) = <phi_k phi_{-k}> without arnold2024's 2*pi factor or unsquared
    |FFT|), differing only in raising the high-k cutoff from k_cut = 2*k_max (arnold2023) to
    k_cut = 50*k_max (gubbala2025) and normalizing S(k) by N^2*Var(phi) in Eq. (S33). Because
    arnold2023/structure_factor_first_moment_eq47 takes a curve input port (S_k), ModelAtlas skips
    direct testing against gubbala2025/structure_factor_domain_size_s1_s34 per record_guide.md.
    (4) Opposing actin coarsening regimes on the same bilayer: active myosin II flows in arnold2023
    accelerate coarsening above the shared t^(1/3) passive baseline to alpha = 2/3 (0.59-0.74 exp),
    whereas passive nematic F-actin elasticity in gubbala2025 suppresses coarsening below t^(1/3)
    to alpha <= 1/4 (quantified via rel_arnold2023_active_vs_gubbala_hindered_contrast).




