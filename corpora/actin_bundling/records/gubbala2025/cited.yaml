# Cross-record cited-value audit between gubbala2025 and released simulation code (gubbala_code).
#
# Notes on scope:
# 1. gubbala_code (ActinNematics: ModelC_Cubic.py + README.md) is pure simulation source code
#    containing 0 precomputed simulation output tables or figure-curve datasets; therefore none
#    of gubbala2025's 45 digitized figure curves (Figs. 3, 4, S1, S2, S6) can be linked as
#    table-to-table cited links to gubbala_code (live code execution against gubbala2025's
#    printed predictions lives in gubbala_code/runs.yaml and gubbala_code/comparisons.yaml).
# 2. All 28 shared simulation parameters, numerical tolerances, and printed predictions between
#    gubbala2025 and gubbala_code are already linked inline in gubbala_code/data.yaml via
#    `from_source: gubbala2025` + `from_datum` (including the 100x tolerance mismatch
#    tol_default_code/tol_readme = 1e-4 vs adaptive_dt_tol = 10^-6). Reverse links from
#    gubbala2025 back to gubbala_code are omitted to keep the provenance DAG strictly acyclic.
# 3. The 2 `from_source` entries in gubbala2025/data.yaml (`alpha_bulk_diffusion_ref`,
#    `alpha_interface_driven_ref`) cite external literature `ref-54` (Bray & Emmott, 1995),
#    not gubbala_code.
# 4. Cross-record cited-value check with weirich2017 (`ref-43`, cited qualitatively on pp. 2,
#    6, 7 for liquid-crystal tactoids): gubbala2025/data.yaml contains 0 entries with
#    `from_source: ref-43` or `from_source: weirich2017` (and weirich2017 does not cite
#    gubbala2025), so no cited.yaml data links apply for this pair.
# 5. Cross-record cited-value check with zwicker2015 (Phys. Rev. E 92, 012317): neither paper
#    directly cites the other (gubbala2025 `ref-24` cites Rosowski, Vidal-Henriquez, Zwicker,
#    Style & Dufresne, Soft Matter 16, 5892-5897, 2020, on elastic coarsening, not zwicker2015),
#    and neither record's data.yaml contains any `from_source` entry pointing to the other;
#    therefore no cited.yaml data links apply for this pair.
# 6. Cross-record cited-value check with frohoff2021 (Phys. Rev. E 103, 042602): neither paper
#    cites the other (gubbala2025/data.yaml only cites external `ref-54` [Bray & Emmott 1995];
#    frohoff2021/data.yaml only cites external `ref-63` [Novick-Cohen 1985]), and neither record
#    has any `from_source` datum pointing to the other; therefore no cited.yaml data links apply
#    for this pair.
# 7. Cross-record cited-value check with graham2023 (Nature Physics 19, 574-585, 2023): neither
#    paper cites the other (0 exact shared bibliographic entries across all 66 graham2023 x 75
#    gubbala2025 references; gubbala2025 `ref-7` cites only an earlier Rangamani & Stachowiak
#    membrane study, Yuan et al. PNAS 2021, not graham2023). All 2 `from_source` entries in
#    gubbala2025/data.yaml cite external `ref-54` (Bray & Emmott 1995) and all 6 `from_source`
#    entries in graham2023/data.yaml cite external `ref-15`, `ref-27`, `ref-si-8` x2, `ref-si-9`,
#    and `ref-si-10`; therefore 0 cited.yaml data links apply in either direction for this pair.
# 8. Cross-record cited-value check with nastkolb2022 (Mol. Biol. Cell 33:ar91, 2022): neither
#    paper cites the other (gubbala2025 `ref-13` cites only an earlier Bausch group study,
#    Tharmann, Claessens & Bausch, PRL 98, 088103, 2007, not nastkolb2022; the 75 gubbala2025 x
