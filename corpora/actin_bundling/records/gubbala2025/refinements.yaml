- id: ref_binodal_tol
  run: run_binodal_beta1_high
  setting: tol
  factors: [1, 10, 100]
  mode: divide
  output: phi_Ld_eq
  tolerance: "0.001%"
  tolerance_basis: "added: verifies root-finding convergence of the common-tangent binodal phi_Ld_eq far below 4-decimal precision"
  tolerance_added: true

- id: ref_sf_quad
  run: run_sf_s1_s34
  setting: n_quad
  factors: [1, 2]
  mode: multiply
  output: R
  tolerance: "0.1%"
  tolerance_basis: "added: verifies trapezoidal quadrature convergence of Eq. (S1) first-moment domain size R"
  tolerance_added: true

- id: ref_pde_low_printed_dt
  run: run_pde_low_printed
  setting: dt
  factors: [1, 2]
  mode: divide
  output: alpha_fit
  tolerance: "15%"
  tolerance_basis: "added: checks temporal step convergence (dt = 0.4 -> 0.2) of the fitted coarsening exponent alpha in the stochastic 2D pseudospectral IMEX PDE solver; 15% reflects finite-box (N=64) realization sensitivity"
  tolerance_added: true

- id: ref_pde_low_variational_dt
  run: run_pde_low_variational
  setting: dt
  factors: [1, 2]
  mode: divide
  output: alpha_fit
  tolerance: "15%"
  tolerance_basis: "added: checks temporal step convergence (dt = 0.4 -> 0.2) of the fitted coarsening exponent alpha for the variational -E3/2 2D PDE solver"
  tolerance_added: true
