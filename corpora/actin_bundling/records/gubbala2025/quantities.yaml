- id: lipid_concentration_field
  name: lipid phase-field order parameter
  dimension: dimensionless
  description: "Dimensionless scalar lipid concentration field phi(x, t) with phi < 0 for liquid-ordered (Lo) domains and phi > 0 for liquid-disordered (Ld) background phase."

- id: mean_lipid_concentration
  name: mean lipid concentration
  dimension: dimensionless
  description: "Spatially averaged concentration field phi_0 = (1/V) int phi(x, t) dx setting the overall Lo/Ld phase composition."

- id: nematic_order_magnitude
  name: nematic order magnitude
  dimension: dimensionless
  description: "Scalar saturation magnitude S of the 2D nematic order parameter tensor Q_ij = S(n_i n_j - delta_ij / 2)."

- id: nematic_tensor_component
  name: nematic tensor component
  dimension: dimensionless
  description: "Component Q_xx, Q_xy, or Q_yy of the 2D symmetric traceless nematic order parameter tensor Q(x, t)."

- id: director_angle
  name: nematic director angle
  dimension: dimensionless
  description: "Planar orientation angle theta of the 2D nematic director n = (cos theta, sin theta)."

- id: nematic_tensor_norm_sq
  name: nematic tensor trace-square invariant
  dimension: dimensionless
  description: "Rotational invariant Tr(Q^2) = Q_ij Q_ij = 2(Q_xx^2 + Q_xy^2) in 2D."

- id: ldg_quartic_coeff
  name: Landau-de Gennes quartic coefficient
  dimension: dimensionless
  description: "Dimensionless positive saturation parameter beta in the Landau-de Gennes bulk free energy (Eq. 4, Eq. S5)."

- id: ldg_quadratic_coeff
  name: Landau-de Gennes quadratic coefficient
  dimension: dimensionless
  description: "Coupling coefficient A = 1 + phi in the Landau-de Gennes bulk free energy (Eq. S5)."

- id: dimensionless_line_tension
  name: dimensionless isotropic line tension
  dimension: dimensionless
  description: "Dimensionless isotropic Lo-Ld interface line tension parameter lambda (Eq. 2, p. 3, SI p. 14)."

- id: anchoring_strength
  name: dimensionless nematic anchoring strength
  dimension: dimensionless
  description: "Dimensionless anchoring coupling coefficient chi in f_anch (Eq. 7, SI Eq. S11); chi > 0 enforces parallel anchoring."

- id: elastic_constant_dimless
  name: dimensionless nematic elastic constant
  dimension: dimensionless
  description: "Dimensionless quadratic (E_1) or cubic anisotropic (E_3) nematic gradient elastic constant (Eq. 5, SI Eq. S14)."

- id: elastic_constant_ratio
  name: cubic-to-quadratic elastic constant ratio
  dimension: dimensionless
  description: "Ratio E_3 / E_1 controlling bend vs. splay elastic anisotropy (Eq. 6, pp. 3-4, SI p. 16)."

- id: frank_elastic_constant
  name: Frank elastic constant
  dimension: dimensionless
  description: "Dimensionless director-field Frank elastic constant k_11 (splay) or k_33 (bend) mapped from E_1, E_3 (Eq. 6)."

- id: frank_constant_ratio
  name: bend-to-splay Frank elastic constant ratio
  dimension: dimensionless
  description: "Ratio k_33 / k_11 of bend to splay Frank elastic constants (p. 4)."

- id: timescale_ratio
  name: nematic-to-diffusion timescale ratio
  dimension: dimensionless
  description: "Dimensionless ratio gamma = t_Q / t_phi = M / (lambda_tilde * Gamma) appearing in Eq. (8)-(9) and SI Sec. 3.2."

- id: free_energy_density_dimless
  name: dimensionless free energy density
  dimension: dimensionless
  description: "Dimensionless local free energy density contribution (f_phi, f_bulk, f_elastic, f_anch, or total f)."

- id: chemical_potential_dimless
  name: dimensionless chemical potential
  dimension: dimensionless
  description: "Dimensionless chemical potential mu = delta F / delta phi or effective bulk derivative f'_eff."

- id: spatial_gradient_dimless
  name: dimensionless spatial gradient
  dimension: dimensionless
  description: "Dimensionless spatial gradient component d_i phi or d_i Q_jk."

- id: wavenumber_dimless
  name: dimensionless wavenumber
  dimension: dimensionless
  description: "Dimensionless spatial wavenumber k, k_x, k_y, peak wavenumber k_max, first-moment k_m, or cutoff k_cut."

- id: wavenumber_ratio
  name: wavenumber ratio
  dimension: dimensionless
  description: "Dimensionless ratio of wavenumbers such as k_cut / k_max (SI Eq. S1) or k / k_m (SI Eq. S34)."

- id: decay_rate_dimless
  name: dimensionless linear decay or growth rate
  dimension: dimensionless
  description: "Linear stability rate omega_phi, omega_xx, omega_xy, off-diagonal coupling, or Jacobian eigenvalue sigma (SI Eqs. S24-S28)."

- id: domain_size_dimless
  name: dimensionless domain size
  dimension: dimensionless
  description: "Characteristic lipid domain radius/size R(t) in dimensionless simulation units from structure factor Eq. (S1) / (S34)."

- id: domain_size_ratio
  name: normalized domain size
  dimension: dimensionless
  description: "Domain size normalized by reference size R(t) / R_0 (Fig. 3, Fig. S2)."

- id: domain_size
  name: physical lipid domain size
  dimension: "[length]"
  description: "Physical length scale of phase-separated Lo lipid domains (um)."

- id: time_dimless
  name: dimensionless time
  dimension: dimensionless
  description: "Dimensionless simulation time t = t_bar / t_c."

- id: time
  name: physical time
  dimension: "[time]"
  description: "Physical experimental time (s, min, h, days)."

- id: coarsening_exponent
  name: domain coarsening exponent
  dimension: dimensionless
  description: "Power-law domain growth exponent alpha in R(t) ~ t^alpha."

- id: structure_factor_dimless
  name: normalized static structure factor
  dimension: dimensionless
  description: "Radially averaged normalized static structure factor S(k, t) (SI Eq. S33)."

- id: scaled_structure_factor
  name: self-similar scaled structure factor
  dimension: dimensionless
  description: "Length- and time-independent scaled structure factor F(k/k_m) = k_m^2 S(k, t) in 2D (SI Eq. S34)."

- id: curvature
  name: unsigned boundary curvature
  dimension: "1/[length]"
  description: "Raw unsigned curvature kappa of a parametric 2D domain boundary g(u) = (x(u), y(u)) (SI Eq. S2)."

- id: normalized_curvature
  name: normalized domain curvature
  dimension: dimensionless
  description: "Local domain boundary curvature normalized by the domain's maximum curvature, kappa / kappa_max in [0, 1] (pp. 5-7, SI Sec. 2.3)."

- id: dimensionless_length
  name: dimensionless spatial length
  dimension: dimensionless
  description: "Dimensionless simulation box side length L or grid spacing dx = L/N (SI Sec. 4)."

- id: grid_points
  name: grid points per dimension
  dimension: dimensionless
  description: "Number of discrete grid points N along one side of a square N^2 mesh (512 for PDE, 2048 for image analysis)."

- id: noise_variance
  name: initial Gaussian noise variance
  dimension: dimensionless
  description: "Variance sigma^2 of zero-mean Gaussian noise added to initialize phi, Q_xx, and Q_xy (SI p. 17)."

- id: error_tolerance
  name: adaptive time-stepping tolerance
  dimension: dimensionless
  description: "Numerical error tolerance tau for adaptive time-stepping in SI Sec. 4 (p. 16)."

- id: relative_actin_density
  name: normalized relative actin density
  dimension: dimensionless
  description: "Mean actin fluorescence intensity per available Ld area, normalized by the maximum observed sample rho / rho_max (SI Sec. 2.1, Fig. S1)."

- id: sample_count
  name: sample or realization count
  dimension: dimensionless
  description: "Number of experimental samples or stochastic simulation realizations averaged."

- id: topological_defect_charge
  name: 2D topological defect charge
  dimension: dimensionless
  description: "Winding number z of a 2D nematic topological defect (p. 6, SI Fig. S5)."

- id: mole_fraction
  name: lipid mole percentage
  dimension: dimensionless
  description: "Molar percentage of a lipid species in the GUV membrane formulation (p. 4, SI Sec. 1.3)."

- id: temperature
  name: temperature
  dimension: "[temperature]"
  description: "Experimental temperature for electroformation, bilayer rupture/melting, or storage."

- id: filament_length
  name: F-actin filament length
  dimension: "[length]"
  description: "Length of reconstituted filamentous actin adsorbed to the bilayer (SI Sec. 1.5)."

- id: composite_thickness
  name: actin-membrane composite thickness
  dimension: "[length]"
  description: "Quasi-2D thickness of stacked actin bundles on the lipid membrane (p. 6)."

- id: dimensional_mobility
  name: dimensional lipid mobility
  dimension: "[length]**2/[time]"
  description: "Dimensional lipid mobility M in Eq. (S17) for dimensionless concentration field phi."

- id: dimensional_rotational_rate
  name: dimensional nematic relaxation rate
  dimension: "1/[time]"
  description: "Dimensional inverse nematic relaxation time Gamma = t_Q^-1 in Eq. (S18)."

- id: dimensional_surface_tension_param
  name: dimensional surface tension parameter
  dimension: "[length]**2"
  description: "Dimensional gradient-energy surface tension parameter lambda_tilde = l_c^2 in Eq. (S17)."

- id: dimensional_coupling_param
  name: dimensional anchoring coupling parameter
  dimension: "[length]**2"
  description: "Dimensional nematic-concentration anchoring parameter alpha = chi * l_c^2 in Eqs. (S17)-(S18)."

- id: dimensional_elastic_constant
  name: dimensional nematic elastic constant
  dimension: "[length]**2"
  description: "Dimensional quadratic (L_1) or cubic (L_3) nematic elastic constant in Eq. (S18)."

- id: characteristic_length
  name: characteristic interface length
  dimension: "[length]"
  description: "Lo-Ld interface width l_c = sqrt(lambda_tilde) used to nondimensionalize space (SI Sec. 3.2)."

- id: characteristic_time
  name: characteristic relaxation or diffusion time
  dimension: "[time]"
  description: "Nematic rotational timescale t_Q = Gamma^-1 or interfacial diffusion timescale t_phi = lambda_tilde / M (SI Sec. 3.2)."

- id: free_energy_rate_ratio
  name: free-energy dissipation alignment ratio
  dimension: dimensionless
  description: "Ratio (dF_E3/dt) / (-2 int |delta F_E3/delta Q|^2 dx): +1 for variational gradient descent, -1 for opposite-sign ascent."

- id: concentration_molar
  name: molar concentration
  dimension: "[substance]/[length]**3"
  description: "Molar concentration of buffer or protein reagent (mM, nM)."

- id: mass_concentration
  name: mass concentration
  dimension: "[mass]/[length]**3"
  description: "Mass per unit volume concentration (mg/mL)."

- id: electric_potential
  name: electroformation AC voltage
  dimension: "[mass]*[length]**2/[time]**3/[current]"
  description: "Peak-to-peak sinusoidal electric potential applied during GUV electroformation (SI Sec. 1.3)."

- id: frequency
  name: electroformation AC frequency
  dimension: "1/[time]"
  description: "Sinusoidal electric field frequency during GUV electroformation (SI Sec. 1.3)."

- id: numerical_aperture
  name: objective numerical aperture
  dimension: dimensionless
  description: "Numerical aperture (NA) of the microscope imaging objective (SI Sec. 1.6)."

- id: magnification
  name: objective magnification
  dimension: dimensionless
  description: "Optical magnification of the microscope objective (SI Sec. 1.6)."

- id: length
  name: apparatus or scale-bar length
  dimension: "[length]"
  description: "Physical apparatus dimension (gasket thickness, PDMS chamber diameter, micrograph scale bar)."

- id: curvature_probability_density
  name: normalized curvature probability density
  dimension: dimensionless
  description: "Probability density P(kappa) of normalized domain boundary curvature kappa = kappa_raw / kappa_max in [0, 1] (Fig. 4)."

- id: sample_index
  name: experimental sample index
  dimension: dimensionless
  description: "Index ordering individual experimental samples across low (1-3) and high (4-5) actin density groups (SI Fig. S1)."

# ==============================================================================
# Quantity added for ModelAtlas cross-paper relation (gubbala2025+weirich2017)
# ==============================================================================

- id: anchoring_elastic_crossover_ratio
  name: dimensionless anchoring-to-Frank-elasticity crossover ratio
  dimension: dimensionless
  description: "Ratio gamma_A * R / k_ii = (sqrt(2)/3) * chi * R / k_ii comparing Cahn-Hilliard kink anchoring energy to bulk Frank splay (k_11) or bend (k_33) elastic energy for a domain of dimensionless size R = R_phys / l_c."

