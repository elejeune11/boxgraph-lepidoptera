notes: >
  Read stage of Gubbala, Jena, Arnold & Takatori, Soft Matter 21, 6243-6251 (2025), covering
  both the main article (PDF pp. 1-9, journal pp. 6243-6251) and the complete Electronic
  Supplementary Information (PDF pp. 10-20, SI pp. 1-11). All 20 page images were visually
  inspected alongside extracted text because OCR rendered Greek chi as w, phi as f, lambda as l,
  kappa as k, gamma as g, beta as b, and um as mm, and because SI Figs. S1-S6 (pp. 18-20) are
  raster-only pages with no extracted text.
  In scope: (1) free energy components — 2D Q-tensor Eq. (3), Cahn-Hilliard energy Eq. (2)/Eq. (S4),
  Landau-de Gennes bulk energy Eq. (4)/Eq. (S5) and nematic saturation S = sqrt((1+phi)/(2*beta)),
  anchoring energy Eq. (7)/Eqs. (S11)-(S13) and effective isotropic line tension lambda, quadratic
  and cubic nematic elasticity Eq. (5)/Eq. (S14); (2) Frank elastic constant mapping Eq. (6)
  (k_11, k_33, k_33/k_11 = 2.5) and E_3/E_1 positivity bounds (p. 3); (3) SI Sec. 3.2
  non-dimensionalization (l_c, t_Q, t_phi, gamma, E_1, E_3, chi); (4) SI Sec. 3.3 linear stability
  analysis Eqs. (S24)-(S28) (diagonal rates omega_phi, omega_xx, omega_xy, coupled 2x2 Jacobian
  eigenvalues, and bounds -2/3 <= chi <= 2, beta >= (E_3/E_1)^2); (5) exact coupled common-tangent
  binodal coexistence of the bulk free energy; (6) coarsening power-law scaling R(t)/R_0 = (t/t_0)^alpha,
  structure-factor domain size Eq. (S1) and self-similar scaling Eqs. (S33)-(S34), and parametric
  boundary curvature Eq. (S2); (7) deterministic Euler-Lagrange sign test for the E_3 cubic elastic
  term; (8) full 2D Fourier pseudospectral IMEX Model C PDE solvers (Eqs. 9-10, SI Sec. 4 Eqs. S29-S32)
  for both the printed E_3 sign and the corrected variational sign, refined over dt; and (9) complete
  main-text and SI experimental parameters and all 59 main + 16 SI references (linking Ref. 43 to
  weirich2017).
  Deferred to the separate digitize:gubbala2025 stage: calibrated digitization of plotted curves in
  Figs. 3, 4(A)-(C), S1, S2, and S6 (Fig. 3 endpoints are entered only with '~' approximate markers).
  Left out as qualitative micrographs, snapshots, or schematics with no plotted numerical axes:
  Figs. 1(A)-(B), 2, S3, S4, S5, and Video S1-S2 captions (simulation parameter tuples from Fig. S4
  and Video S2 are recorded).
  Key algebraic, numerical, and experimental findings:
  (1) Printed Eq. (10), Eq. (S18), and Eq. (S20) have the opposite sign (+E_3/2 instead of -E_3/2)
  on the cubic elastic term relative to variational gradient descent dQ/dt = -delta F/delta Q (Eq. 8):
  direct Euler-Lagrange differentiation of Eq. (5) and numerical testing give dF_E3/dt ratio = -1.000
  (increasing F_E3) for printed Eq. (10) vs. +1.000 for -E_3/2, and the paper's own linear stability
  Eq. (S25) uses the variational sign.
  (2) Factor-of-2 discrepancy in 2D between printed Eq. (4)/Eq. (S5) (beta/4)Tr(Q^4) (which gives
  derivative -(beta/2)(Q_kl Q_kl)Q_ij and critical point sqrt((1+phi)/beta)) vs. Eq. (10)/Eq. (S20)
  -beta(Q_kl Q_kl)Q_ij and SI p. 13 critical points +-sqrt((1+phi)/(2*beta)) (which follow from
  (beta/4)(Tr(Q^2))^2), plus a factor-of-2 mismatch between Eq. (3) (Q_xx = S/2 for n || x) and
  SI Sec. 3.3 (Q_xx = S).
  (3) Printed Eq. (6) uses the 3D Beris-Edwards mapping (reproducing k_33/k_11 = 2.5 at E_3/E_1 = 1,
  S = 1), whereas substituting the paper's 2D Q-tensor Eq. (3) into Eq. (5) yields k_11 = 2E_1 S^2 -
  E_3 S^3 and k_33 = 2E_1 S^2 + E_3 S^3 (k_33/k_11 = 3.0). Furthermore, p. 3 prints lower bound
  -1.5*S <= E_3/E_1 instead of -1.5/S (coinciding only at S = 1).
  (4) Exact common-tangent coexistence of the coupled bulk free energy at beta = 1 shifts the binodals
  from +-1 to phi_Lo = -1.1929 and phi_Ld = +1.2233, raising equilibrium |Q|_eq to 1.0543 > 1 =
  1/sqrt(beta). Thus at E_3 = E_1 (marginal for phi = 1), effective perpendicular diffusivity is
  E_1 - E_3|Q|_eq = -0.0543 E_1 < 0, causing blowup around t ~ 900-1100 at high actin (E_1 = E_3 = 2);
  reducing E_3 to 1.8 (< 1.897) restores stability and captures the Fig. S2 fast-then-slow coarsening
  transition, while low-actin (E_1 = E_3 = 0.1, phi_0 = 0.3) runs cleanly yield alpha = 0.233-0.242
  (near printed alpha approx 0.25) with dt refinement settled (belongs_to = model).
  (5) SI Eq. (S2) prints curvature denominator (x' + y')^(3/2) instead of ((x')^2 + (y')^2)^(3/2)
  (failing to reproduce constant kappa_norm = 1 on a circle: 0.027 vs. 1.0 when corrected).
  (6) SI Sec. 4 Eqs. (S29)/(S31) misprint phi^2 for phi^3 (unbounded blowup), undefined kappa for
  lambda, and dt_new = (tau/Delta)^(1/5) without dt_old; SI Sec. 3.3 Eqs. (S24)-(S26) double the
  off-diagonal Q_xx~ coupling (4*gamma vs. 2*gamma), drop the E_3 term in dQ_xy~/dt, mis-sign
  omega_12/omega_21, and omit the coupled k -> 0 bound beta >= 1/4; three incompatible expressions for
  lambda appear (1+|chi|/2 on p. 3, 1+chi/2 on p. 14, and dimensionally mixed lambda_tilde+chi/2 on
  p. 15); SI Sec. 1.5 erroneously states F-actin adsorbs to the liquid-ordered phase (contradicting
  main text Ld), and SI Sec. 1.3's second GUV recipe sums to 86.0% (omitting cholesterol).
