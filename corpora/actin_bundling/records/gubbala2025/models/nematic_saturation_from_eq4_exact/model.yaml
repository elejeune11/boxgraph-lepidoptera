id: nematic_saturation_from_eq4_exact
name: Exact critical-point saturation of printed Eq. (4) / Eq. (S5) in 2D
role: model
stated:
  page: 13
  printed_page: "SI-4"
  quote: "The saturation value of Qij is given by the critical points of Eq. S5"
  where: "Eq. (4) / SI Eq. (S5)"
equation: "S = sqrt((1 + phi) / beta) for phi > -1 (from d/dQ_xx [(beta/2)*Q_xx^4 - (1+phi)*Q_xx^2] = 0)"
variant_of: nematic_saturation_eq4_s5
corrections:
  - equation: "SI Sec. 3.1 (p. 13) / Sec. 2.1 (p. 3)"
    change: "Exact 2D critical point of printed Eq. (4)/Eq. (S5) (beta/4)Tr(Q^4) - (A/2)Tr(Q^2) is sqrt(A/beta) = sqrt((1+phi)/beta), not sqrt(A/(2*beta))"
    evidence: "In 2D for traceless symmetric Q with Q_xy = 0, Tr(Q^2) = 2 Q_xx^2 and Tr(Q^4) = 2 Q_xx^4, so f_bulk = (beta/2) Q_xx^4 - A Q_xx^2, whose critical points satisfy 2*beta*Q_xx^3 - 2*A*Q_xx = 0 => Q_xx = +-sqrt(A/beta)."
inputs:
  beta: {quantity: ldg_quartic_coeff, unit: dimensionless}
  phi: {quantity: lipid_concentration_field, unit: dimensionless}
outputs:
  S: {quantity: nematic_order_magnitude, unit: dimensionless}
settings: {}
stochastic: false
