id: structure_factor_domain_size_s1_s34
name: Structure-factor first-moment domain size R(t) and self-similar scaling (SI Eqs. S1, S33-S34)
role: processing
stated:
  page: 12
  printed_page: "SI-3"
  quote: "The average size of domains R(t) is calculated by taking the inverse of the first moment"
  where: "SI Eq. (S1) & Eqs. (S33)-(S34)"
equation: "R = (int_0^{k_cut} S(k) dk) / (int_0^{k_cut} k S(k) dk) = 1 / k_m, k_cut = (k_cut/k_max) * k_max, F(k/k_m) = k_m^2 * S(k)"
inputs:
  k_max: {quantity: wavenumber_dimless, unit: dimensionless}
  k_cut_ratio: {quantity: wavenumber_ratio, unit: dimensionless}
  L: {quantity: dimensionless_length, unit: dimensionless}
  N: {quantity: grid_points, unit: dimensionless}
outputs:
  k_cut: {quantity: wavenumber_dimless, unit: dimensionless}
  k_m: {quantity: wavenumber_dimless, unit: dimensionless}
  R: {quantity: domain_size_dimless, unit: dimensionless}
  F_peak: {quantity: scaled_structure_factor, unit: dimensionless}
settings:
  n_quad: 2000
  rel_width: 0.25
stochastic: false
