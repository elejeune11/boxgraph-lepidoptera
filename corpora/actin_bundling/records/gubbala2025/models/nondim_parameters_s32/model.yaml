id: nondim_parameters_s32
name: Non-dimensionalization characteristic scales and ratios (SI Sec. 3.2)
role: model
stated:
  page: 15
  printed_page: "SI-6"
  quote: "as the characteristic length of our system, corresponding to the width"
  where: "SI Sec. 3.2 (p. 15)"
equation: "l_c = sqrt(lambda_tilde), t_Q = Gamma^-1, t_phi = lambda_tilde/M, gamma = M/(lambda_tilde*Gamma) = t_Q/t_phi, E_1 = L_1/l_c^2, E_3 = L_3/l_c^2, chi = alpha/l_c^2, lambda = 1 + chi/2"
inputs:
  M: {quantity: dimensional_mobility, unit: um^2/s}
  Gamma: {quantity: dimensional_rotational_rate, unit: 1/s}
  lambda_tilde: {quantity: dimensional_surface_tension_param, unit: um^2}
  alpha: {quantity: dimensional_coupling_param, unit: um^2}
  L1: {quantity: dimensional_elastic_constant, unit: um^2}
  L3: {quantity: dimensional_elastic_constant, unit: um^2}
outputs:
  l_c: {quantity: characteristic_length, unit: um}
  t_Q: {quantity: characteristic_time, unit: s}
  t_phi: {quantity: characteristic_time, unit: s}
  gamma: {quantity: timescale_ratio, unit: dimensionless}
  E1: {quantity: elastic_constant_dimless, unit: dimensionless}
  E3: {quantity: elastic_constant_dimless, unit: dimensionless}
  chi: {quantity: anchoring_strength, unit: dimensionless}
  lam: {quantity: dimensionless_line_tension, unit: dimensionless}
settings: {}
stochastic: false
