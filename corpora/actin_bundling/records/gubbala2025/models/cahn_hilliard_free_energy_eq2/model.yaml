  grad_phi: {quantity: spatial_gradient_dimless, unit: dimensionless}
outputs:
  f_phi: {quantity: free_energy_density_dimless, unit: dimensionless}
  df_dphi: {quantity: chemical_potential_dimless, unit: dimensionless}
settings: {}
stochastic: false
