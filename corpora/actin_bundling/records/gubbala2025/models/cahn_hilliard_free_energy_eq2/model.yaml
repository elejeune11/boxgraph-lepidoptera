id: cahn_hilliard_free_energy_eq2
name: Cahn-Hilliard lipid free energy density (Eq. 2, SI Eq. S4)
role: model
stated:
  page: 2
  printed_page: "6244"
  quote: "The phase separation of the Lo-Ld mixture is described by"
  where: "Eq. (2)"
