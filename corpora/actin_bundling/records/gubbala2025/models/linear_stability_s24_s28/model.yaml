id: linear_stability_s24_s28
name: Linear stability dispersion and stability bounds as printed (SI Eqs. S24-S28)
role: model
stated:
  page: 16
  printed_page: "SI-7"
  quote: "The expanded forms of"
  where: "SI Sec. 3.3 Eqs. (S24)-(S28)"
equation: "omega_phi = gamma*k^2*[2 + (1 + 3*chi/2)*kx^2 + (1 - chi/2)*ky^2], omega_xx = 4 + (E1 + E3/sqrt(beta))*kx^2 + (E1 - E3/sqrt(beta))*ky^2, omega_xy = E1*k^2; Jacobian M = [[-omega_phi, 4*gamma*k^2/sqrt(beta)], [1/sqrt(beta), -omega_xx]]; bounds -2/3 <= chi <= 2, beta >= (E3/E1)^2"
inputs:
  gamma: {quantity: timescale_ratio, unit: dimensionless}
  chi: {quantity: anchoring_strength, unit: dimensionless}
  beta: {quantity: ldg_quartic_coeff, unit: dimensionless}
  E1: {quantity: elastic_constant_dimless, unit: dimensionless}
  E3: {quantity: elastic_constant_dimless, unit: dimensionless}
  kx: {quantity: wavenumber_dimless, unit: dimensionless}
  ky: {quantity: wavenumber_dimless, unit: dimensionless}
outputs:
  omega_phi: {quantity: decay_rate_dimless, unit: dimensionless}
  omega_xx: {quantity: decay_rate_dimless, unit: dimensionless}
  omega_xy: {quantity: decay_rate_dimless, unit: dimensionless}
  sigma_max: {quantity: decay_rate_dimless, unit: dimensionless}
  sigma_min: {quantity: decay_rate_dimless, unit: dimensionless}
  chi_min: {quantity: anchoring_strength, unit: dimensionless}
  chi_max: {quantity: anchoring_strength, unit: dimensionless}
  beta_min: {quantity: ldg_quartic_coeff, unit: dimensionless}
settings: {}
stochastic: false
