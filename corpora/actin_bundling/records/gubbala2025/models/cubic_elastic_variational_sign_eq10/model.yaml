id: cubic_elastic_variational_sign_eq10
name: Variational gradient-descent sign test for the E_3 cubic elastic term (Eq. 5 vs. Eq. 10)
role: model
stated:
  page: 3
  printed_page: "6245"
  quote: "The expanded forms of these coupled equations can be expressed as"
  where: "Eq. (5), Eq. (8), Eq. (10), SI Eq. (S20)"
equation: "Test dF_E3/dt under dQ_ij/dt = +(1/2)*E_3*(d_i Q_kl d_j Q_kl - 2 d_k Q_ij d_l Q_kl - 2 Q_kl d_k d_l Q_ij - (1/2) delta_ij (d_k Q_ml)^2) vs. variational -delta F_E3/delta Q_ij"
inputs:
  E3: {quantity: elastic_constant_dimless, unit: dimensionless}
outputs:
  dissipation_ratio_printed: {quantity: free_energy_rate_ratio, unit: dimensionless}
  dissipation_ratio_variational: {quantity: free_energy_rate_ratio, unit: dimensionless}
settings:
  n_grid: 32
  L_box: 32.0
  eps_fd: 1.0e-6
stochastic: false
