id: ldg_bulk_free_energy_eq4
name: Landau-de Gennes bulk free energy density as printed (Eq. 4, SI Eq. S5)
role: model
stated:
  page: 3
  printed_page: "6245"
  quote: "The bulk free energy, which controls the isotropic-to"
  where: "Eq. (4) / SI Eq. (S5)"
equation: "f_bulk = (beta / 4) * Tr(Q^4) - ((1 + phi) / 2) * Tr(Q^2) = (beta / 2) * (Q_xx^2 + Q_xy^2)^2 - (1 + phi) * (Q_xx^2 + Q_xy^2)"
inputs:
  beta: {quantity: ldg_quartic_coeff, unit: dimensionless}
  phi: {quantity: lipid_concentration_field, unit: dimensionless}
  Q_xx: {quantity: nematic_tensor_component, unit: dimensionless}
  Q_xy: {quantity: nematic_tensor_component, unit: dimensionless}
outputs:
  f_bulk: {quantity: free_energy_density_dimless, unit: dimensionless}
  tr_Q2: {quantity: nematic_tensor_norm_sq, unit: dimensionless}
settings: {}
stochastic: false
