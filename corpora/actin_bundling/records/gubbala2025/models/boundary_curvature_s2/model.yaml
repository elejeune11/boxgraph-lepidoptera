id: boundary_curvature_s2
name: Parametric boundary curvature as printed (SI Eq. S2) evaluated on a circle
role: processing
stated:
  page: 13
  printed_page: "SI-4"
  quote: "The unsigned curvature"
  where: "SI Sec. 2.3 Eq. (S2)"
equation: "kappa = |x'*y'' - y'*x''| / (x' + y')^(3/2); normalized kappa_norm = kappa / max(kappa)"
inputs:
  R: {quantity: domain_size, unit: um}
outputs:
  kappa_mean: {quantity: curvature, unit: 1/um}
  kappa_norm_mean: {quantity: normalized_curvature, unit: dimensionless}
settings:
  n_pts: 360
stochastic: false
