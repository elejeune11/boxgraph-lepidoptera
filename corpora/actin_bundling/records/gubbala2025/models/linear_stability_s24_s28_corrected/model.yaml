id: linear_stability_s24_s28_corrected
name: Exact linearization of variational Model C around Eqs. (S21)-(S23)
role: model
stated:
  page: 16
  printed_page: "SI-7"
  quote: "Substituting the above expressions in Eqs. S19-S20 gives"
  where: "SI Sec. 3.3 Eqs. (S24)-(S28)"
equation: "d(phi~)/dt = -omega_phi*phi~ + (2*gamma/sqrt(beta))*k^2*Qxx~, d(Qxx~)/dt = -omega_xx*Qxx~ + (1/sqrt(beta))*phi~, d(Qxy~)/dt = -(E1*k^2 + (E3/sqrt(beta))*(kx^2 - ky^2))*Qxy~"
variant_of: linear_stability_s24_s28
corrections:
  - equation: "SI Eq. (S24)"
    change: "Off-diagonal coupling coefficient +(2*gamma/sqrt(beta))*k^2 instead of printed +(4*gamma/sqrt(beta))*k^2"
    evidence: "In Eq. (S19), -(1/2)*Q_ij*Q_ij = -(Q_xx^2 + Q_xy^2). Linearizing around Q_xx = 1/sqrt(beta), Q_xy = 0 yields -(2/sqrt(beta))*Qxx~; applying gamma*grad^2 (-> -gamma*k^2) gives +(2*gamma/sqrt(beta))*k^2*Qxx~, half the printed 4*gamma*k^2/sqrt(beta) (which also shifts the k->0 coupled spinodal threshold from beta = 1/2 to beta = 1/4)."
  - equation: "SI Eq. (S26)"
    change: "Include non-vanishing cubic elastic term +(E_3/sqrt(beta))*(k_x^2 - k_y^2) in omega_xy = E_1*k^2 + (E_3/sqrt(beta))*(k_x^2 - k_y^2)"
    evidence: "Linearizing the variational cubic elastic term +E_3*Q_kl*d_k d_l Q_xy around Q_xx = -Q_yy = 1/sqrt(beta) gives -(E_3/sqrt(beta))*(k_x^2 - k_y^2)*Qxy~, which does not vanish for general (k_x, k_y)."
inputs:
  gamma: {quantity: timescale_ratio, unit: dimensionless}
  chi: {quantity: anchoring_strength, unit: dimensionless}
  beta: {quantity: ldg_quartic_coeff, unit: dimensionless}
  E1: {quantity: elastic_constant_dimless, unit: dimensionless}
  E3: {quantity: elastic_constant_dimless, unit: dimensionless}
  kx: {quantity: wavenumber_dimless, unit: dimensionless}
  ky: {quantity: wavenumber_dimless, unit: dimensionless}
outputs:
  omega_phi: {quantity: decay_rate_dimless, unit: dimensionless}
  omega_xx: {quantity: decay_rate_dimless, unit: dimensionless}
  omega_xy: {quantity: decay_rate_dimless, unit: dimensionless}
  sigma_max: {quantity: decay_rate_dimless, unit: dimensionless}
  sigma_min: {quantity: decay_rate_dimless, unit: dimensionless}
  chi_min: {quantity: anchoring_strength, unit: dimensionless}
  chi_max: {quantity: anchoring_strength, unit: dimensionless}
  beta_min: {quantity: ldg_quartic_coeff, unit: dimensionless}
settings: {}
stochastic: false
