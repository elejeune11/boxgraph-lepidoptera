id: anchoring_elastic_crossover
name: dimensionless anchoring-to-Frank-elasticity crossover parameter (helper)
role: processing
stated:
  page: 7
  printed_page: "6249"
  quote: "by reducing the role of anisotropic elasticity, one can"
  where: "Sec. 2.1 Eqs. (2), (5)-(7), SI Eqs. (S11)-(S14) & Sec. 4 Conclusions (citing Ref. 43)"
equation: "xi_splay_eq6 = (sqrt(2)/3)*chi*R / (2*E1*S^2 - (2/3)*E3*S^3); xi_bend_eq6 = (sqrt(2)/3)*chi*R / (2*E1*S^2 + (4/3)*E3*S^3); xi_splay_2d = (sqrt(2)/3)*chi*R / (2*E1*S^2 - E3*S^3); xi_bend_2d = (sqrt(2)/3)*chi*R / (2*E1*S^2 + E3*S^3)"
built_from:
  - cahn_hilliard_free_energy_eq2
  - anchoring_free_energy_eq7_s13
  - frank_elastic_constants_eq6
  - frank_elastic_constants_2d
inputs:
  chi: {quantity: anchoring_strength, unit: dimensionless}
  R: {quantity: domain_size_dimless, unit: dimensionless}
  E1: {quantity: elastic_constant_dimless, unit: dimensionless}
  E3: {quantity: elastic_constant_dimless, unit: dimensionless}
  S: {quantity: nematic_order_magnitude, unit: dimensionless}
outputs:
  xi_splay_eq6: {quantity: anchoring_elastic_crossover_ratio, unit: dimensionless}
  xi_bend_eq6: {quantity: anchoring_elastic_crossover_ratio, unit: dimensionless}
  xi_splay_2d: {quantity: anchoring_elastic_crossover_ratio, unit: dimensionless}
  xi_bend_2d: {quantity: anchoring_elastic_crossover_ratio, unit: dimensionless}
settings: {}
stochastic: false
