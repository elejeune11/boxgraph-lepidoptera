id: anchoring_free_energy_eq7_s13
name: Nematic-interface anchoring free energy density (Eq. 7, SI Eqs. S11-S13)
role: model
stated:
  page: 3
  printed_page: "6245"
  quote: "In the tensor representation of the nematic, it is given by"
  where: "Eq. (7) / SI Eqs. (S11)-(S13)"
equation: "f_anch_dir = (chi/2)*(n . grad phi)^2 = (chi/(2*S))*Q_ij*d_i phi*d_j phi + (chi/4)*|grad phi|^2"
inputs:
  chi: {quantity: anchoring_strength, unit: dimensionless}
  S: {quantity: nematic_order_magnitude, unit: dimensionless}
  Q_xx: {quantity: nematic_tensor_component, unit: dimensionless}
  Q_xy: {quantity: nematic_tensor_component, unit: dimensionless}
  dphi_x: {quantity: spatial_gradient_dimless, unit: dimensionless}
  dphi_y: {quantity: spatial_gradient_dimless, unit: dimensionless}
outputs:
  f_anch: {quantity: free_energy_density_dimless, unit: dimensionless}
  f_anch_iso_residual: {quantity: free_energy_density_dimless, unit: dimensionless}
  f_anch_total: {quantity: free_energy_density_dimless, unit: dimensionless}
settings: {}
stochastic: false
