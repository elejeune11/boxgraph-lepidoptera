id: nematic_saturation_eq4_s5
name: Nematic bulk saturation value S as printed (p. 3, SI Sec. 3.1 p. 13)
role: model
stated:
  page: 13
  printed_page: "SI-4"
  quote: "The saturation value of Qij is given by the critical points of Eq. S5"
  where: "Sec. 2.1 (p. 3) & SI Sec. 3.1 (p. 13)"
equation: "S = sqrt((1 + phi) / (2 * beta)) for phi > -1, else 0; at phi = 1, S = 1 / sqrt(beta)"
inputs:
  beta: {quantity: ldg_quartic_coeff, unit: dimensionless}
  phi: {quantity: lipid_concentration_field, unit: dimensionless}
outputs:
  S: {quantity: nematic_order_magnitude, unit: dimensionless}
settings: {}
stochastic: false
