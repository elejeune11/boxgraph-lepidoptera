id: coupled_binodal_coexistence
name: Common-tangent thermodynamic coexistence of coupled Cahn-Hilliard / Landau-de Gennes bulk free energy
role: model
stated:
  page: 3
  printed_page: "6245"
  quote: "and the bulk free energy is"
  where: "Eqs. (2), (4), (9), (10)"
equation: "f_eff(phi) = phi^4/4 - phi^2/2 - ((1 + phi)^2 / (4*beta)) * H(1 + phi); common tangent mu(phi_Lo) = mu(phi_Ld) and f_eff(phi_Lo) - mu*phi_Lo = f_eff(phi_Ld) - mu*phi_Ld; |Q|_eq = sqrt((1 + phi_Ld)/(2*beta))"
inputs:
  beta: {quantity: ldg_quartic_coeff, unit: dimensionless}
  E1: {quantity: elastic_constant_dimless, unit: dimensionless}
  E3: {quantity: elastic_constant_dimless, unit: dimensionless}
outputs:
  phi_Lo_eq: {quantity: lipid_concentration_field, unit: dimensionless}
  phi_Ld_eq: {quantity: lipid_concentration_field, unit: dimensionless}
  mu_coex: {quantity: chemical_potential_dimless, unit: dimensionless}
  Q_eq_Ld: {quantity: nematic_order_magnitude, unit: dimensionless}
  eff_diff_perp: {quantity: elastic_constant_dimless, unit: dimensionless}
settings:
  tol: 1.0e-12
stochastic: false
