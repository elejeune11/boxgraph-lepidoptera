id: frank_elastic_constants_2d
name: 2D Frank splay and bend elastic constants from Eq. (3) and Eq. (5)
role: model
stated:
  page: 3
  printed_page: "6245"
  quote: "first set bounds on E1 and E3. We relate kii and Ei"
  where: "Eq. (3), Eq. (5), Eq. (6)"
equation: "k_11 = 2*E_1*S^2 - E_3*S^3, k_33 = 2*E_1*S^2 + E_3*S^3"
variant_of: frank_elastic_constants_eq6
corrections:
  - equation: "Eq. (6)"
    change: "Replace 3D Beris-Edwards coefficients (-2/3, +4/3) with 2D coefficients (-1, +1) obtained from substituting Eq. (3) Q_ij = S(n_i n_j - delta_ij/2) into Eq. (5)"
    evidence: "Substituting the paper's 2D Q_ij = S(n_i n_j - delta_ij/2) (Eq. 3) with constant S and n = (cos theta, sin theta) into f_elastic (Eq. 5) gives f_elastic = S^2*[E_1*|grad theta|^2 + (E_3*S/2)*((n . grad theta)^2 - (n_perp . grad theta)^2)], yielding k_11 = 2*E_1*S^2 - E_3*S^3 and k_33 = 2*E_1*S^2 + E_3*S^3 (and k_33/k_11 = 3 at E_3/E_1 = 1, S = 1). Printed Eq. (6) instead uses the 3D traceless tensor Q_ij = S(n_i n_j - delta_ij/3) from Beris & Edwards (Ref. 45), giving k_33/k_11 = 2.5."
inputs:
  E1: {quantity: elastic_constant_dimless, unit: dimensionless}
  E3: {quantity: elastic_constant_dimless, unit: dimensionless}
  S: {quantity: nematic_order_magnitude, unit: dimensionless}
outputs:
  k11: {quantity: frank_elastic_constant, unit: dimensionless}
  k33: {quantity: frank_elastic_constant, unit: dimensionless}
  k33_over_k11: {quantity: frank_constant_ratio, unit: dimensionless}
settings: {}
stochastic: false
