id: boundary_curvature_s2_corrected
name: Standard parametric planar boundary curvature (corrected SI Eq. S2) evaluated on a circle
role: processing
stated:
  page: 13
  printed_page: "SI-4"
  quote: "The unsigned curvature"
  where: "SI Sec. 2.3 Eq. (S2)"
equation: "kappa = |x'*y'' - y'*x''| / ((x')^2 + (y')^2)^(3/2); normalized kappa_norm = kappa / max(kappa)"
variant_of: boundary_curvature_s2
corrections:
  - equation: "SI Eq. (S2) (p. 13)"
    change: "Denominator ((x')^2 + (y')^2)^(3/2) instead of printed (x' + y')^(3/2)"
    evidence: "Standard planar differential geometry and dimensional analysis require ((x')^2 + (y')^2)^(3/2) so kappa has dimension 1/[length]; the printed denominator (x' + y')^(3/2) has dimension [length]^(3/2) (making kappa scale as [length]^(1/2)), becomes negative/complex on half of every closed loop, and diverges where x' + y' = 0, contradicting the paper's own statement (p. 5, Fig. 4) that circular domains have constant curvature yielding normalized kappa = 1."
inputs:
  R: {quantity: domain_size, unit: um}
outputs:
  kappa_mean: {quantity: curvature, unit: 1/um}
  kappa_norm_mean: {quantity: normalized_curvature, unit: dimensionless}
settings:
  n_pts: 360
stochastic: false
