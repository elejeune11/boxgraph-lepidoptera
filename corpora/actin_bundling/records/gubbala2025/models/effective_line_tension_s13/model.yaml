id: effective_line_tension_s13
name: Effective isotropic line tension parameter from SI Eq. (S13) derivation (p. 14)
role: model
stated:
  page: 14
  printed_page: "SI-5"
  quote: "to give an effective line tension parameter"
  where: "SI Sec. 3.1 Eq. (S13)"
equation: "lambda = 1 + chi / 2"
variant_of: effective_line_tension_p3
corrections:
  - equation: "Sec. 2.1 (p. 3)"
    change: "Use lambda = 1 + chi / 2 (without absolute value) as derived in SI Eq. (S13)"
    evidence: "SI Eq. (S13) (p. 14) adds (chi/4)|grad phi|^2 to (1/2)|grad phi|^2 giving lambda = 1 + chi/2; moreover, SI Eq. (S27) (p. 16) expands lambda + chi = 1 + (3/2)*chi and lambda - chi = 1 - chi/2 to obtain the printed stability range -2/3 <= chi <= 2, which requires lambda = 1 + chi/2 (using |chi| would instead yield -2 <= chi <= 2)."
inputs:
  chi: {quantity: anchoring_strength, unit: dimensionless}
outputs:
  lam: {quantity: dimensionless_line_tension, unit: dimensionless}
settings: {}
stochastic: false
