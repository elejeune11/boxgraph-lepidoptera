    f2_pp: "4"
    Q: "1 / sqrt(gamma * ((1 + 3*chi/2)*kx**2 + (1 - chi/2)*ky**2) * (kx**2 + ky**2))"
    kappa: "((E1 + E3/sqrt(beta))*kx**2 + (E1 - E3/sqrt(beta))*ky**2) / sqrt(gamma * ((1 + 3*chi/2)*kx**2 + (1 - chi/2)*ky**2) * (kx**2 + ky**2))"
    rho: "sqrt(2 / beta) * (gamma * (kx**2 + ky**2) / ((1 + 3*chi/2)*kx**2 + (1 - chi/2)*ky**2))**(1/4)"
    alpha: "0"
  output_map:
    re_lam_plus: sigma_max
  regime:
    gamma: [0.05, 2.0]
    chi: [-0.5, 1.8]
    beta: [0.5, 5.0]
    E1: [0.8, 3.0]
    E3: [0.05, 0.5]
    kx: [0.1, 3.0]
    ky: [0.1, 3.0]
  provenance: proposed
  reason: >
    Establishes an exact 2x2 spectral isomorphism between Gubbala's variational 2D anisotropic Model C
    linear stability matrix M_G (conserved phi + nonconserved Q_xx, SI Eqs. S24-S28 corrected) and
    Frohoff's doubly conserved variational two-field Cahn-Hilliard dispersion matrix -q^2*B(q) (Eq. 12,
    alpha = 0) across all seven parameters (gamma, chi, beta, E_1, E_3, k_x, k_y), spanning both
    perpendicular (chi < 0) and parallel (chi > 0) anchoring as well as low-k and high-k regimes.
    Defining directional stiffnesses Lambda_eff = [(1+3*chi/2)*kx^2 + (1-chi/2)*ky^2]/k^2 and
    E_eff = [(E_1+E_3/sqrt(beta))*kx^2 + (E_1-E_3/sqrt(beta))*ky^2]/k^2, setting
    q^2 = sqrt(gamma*Lambda_eff)*k^2 absorbs both anchoring anisotropy and timescale ratio into
    f_1'' = 2*sqrt(gamma/Lambda_eff), kappa = E_eff/sqrt(gamma*Lambda_eff), and variational coupling
    rho = sqrt(2/beta)*(gamma/Lambda_eff)^(1/4) (alpha = 0, f_2'' = 4), while converting Frohoff's
    conserved Model B second field (-q^2*Q) into Gubbala's nonconserved Model A nematic relaxation
    (-1) via the exact wavenumber-dependent effective mobility ratio Q_eff(k) = 1/q^2. Under this
    mapping tr(M_G) = -q^2*tr(B) and det(M_G) = q^4*det(B) identically, giving sigma_max = re_lam_plus
    to machine precision (~2e-14).
  assumptions:
    - "Anchoring chi in [-0.5, 1.8] strictly inside Gubbala's linear stability window (-2/3, 2) and E_1 > E_3/sqrt(beta) so Lambda_eff > 0 and E_eff > 0 at all wavevector angles."
    - "Purely variational coupling (alpha = 0) with exact conserved-to-nonconserved mobility conversion Q_eff(k) = 1/q^2."

