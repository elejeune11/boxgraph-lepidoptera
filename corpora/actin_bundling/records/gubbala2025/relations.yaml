# --- 1. Shared Symmetric Landau Double-Well Free Energies & Saturation Binodals ---

- id: rel_frohoff2021_cahn_hilliard_f_scales_eq3_A1
  kind: scales_as
  a: gubbala2025/cahn_hilliard_free_energy_eq2
  b: frohoff2021/bulk_free_energy_eq3_A1
  mapping:
    a1: "-1"
    b1: "1"
    phi: "phi"
  output_map:
    f: f_phi
  regime:
    phi: [0.1, 1.2]
    lam: [1.0, 1.0]
    grad_phi: [0.0, 0.0]
  provenance: proposed
  reason: >
    Both papers adopt the identical zero-midpoint symmetric Landau quartic double-well bulk free
    energy f(phi) = (a_1/2)*phi^2 + (b_1/4)*phi^4 with f(0) = 0 and minima at phi = +-1 for
    a_1 = -b_1 = -a_0 (unlike zwicker2015's shifted binary potential vanishing at the binodals).
    At grad_phi = 0, Gubbala Eq. (2)'s dimensionless f_phi = phi^4/4 - phi^2/2 equals Frohoff
    Eqs. (3)/(A5)'s dimensional f(phi) divided by the bulk energy scale a_0 = b_1 = -a_1 [J/m^3],
    sharing the exact nontrivial phi-dependent log-slope 2*(phi^2 - 1)/(phi^2 - 2) across both
    spinodal and binodal intervals (strictly below the zero crossing phi = sqrt(2)).
  assumptions:
    - "Uniform bulk state grad_phi = 0 with symmetric double-well scale a_1 = -1 J/m^3, b_1 = 1 J/m^3."

