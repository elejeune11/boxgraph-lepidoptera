    phi2_bar: "1"
    rho: "0"
  output_map:
    lam_plus: sigma_max
  limit:
    chi: "0"
    beta: "oo"
  regime:
    gamma: [1.0, 1.0]
    chi: [0.05, 0.5]
    beta: [5.0, 50.0]
    E1: [0.5, 3.0]
    E3: [0.05, 0.5]
