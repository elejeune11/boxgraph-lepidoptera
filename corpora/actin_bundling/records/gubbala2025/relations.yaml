    Landau potential (a_1/2)*Phi^2 + (b_1/4)*Phi^4 under Phi = Q_xx, a_1 = -2*(1 + phi) [J/m^3],
    and b_1 = 4*beta [J/m^3]. Both models share identical log-slopes across all three coupled
    variables (Q_xx, beta, phi).
  assumptions:
    - "Uniaxial x-aligned nematic state Q_xy = 0 with Q_xx in [0.05, 0.35] strictly inside the negative-energy well (below Q_xx = sqrt((1+phi)/beta))."

