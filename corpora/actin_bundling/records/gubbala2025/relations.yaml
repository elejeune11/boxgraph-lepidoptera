    phi1_bar: "1"
    phi2_bar: "1"
    rho: "0"
  output_map:
    lam_plus: sigma_max
  regime:
    gamma: [1.0, 1.0]
    chi: [-0.5, 1.8]
    beta: [0.5, 5.0]
    E1: [0.8, 3.0]
    E3: [0.05, 0.5]
    kx: [0.005, 0.04]
    ky: [0.005, 0.04]
  tolerance: 0.005
  provenance: proposed
  reason: >
    Diagnostic cross-paper check of Gubbala's printed SI Eq. (S24) against Frohoff's effective-
    temperature-shifted passive Cahn-Hilliard dispersion at a_eff(beta) = -1 - 1/(2*beta). Expected
    to be not_verified (max relative error 97.3% near beta = 0.5; 33% at default beta = 1) because
    printed Eq. (S24)'s doubled c_12 = 4*gamma*k^2/sqrt(beta) gives sigma_max = -(2 - 1/beta)*k^2
    with a spurious spinodal instability at beta = 1/2 instead of beta = 1/4, independently
    corroborating gubbala2025/q_lsa_s24_s26_discrepancies.
  assumptions:
    - "Same long-wavelength effective-temperature dictionary and regime as rel_frohoff2021_lsa_finite_beta_lowk_approx_variational_ch."

# --- 5. Coupled Binodal Shifts & Long-Wavelength Spinodal Threshold (Eq. 20 / Appendix C) ---

- id: rel_frohoff2021_coupled_binodal_reduces_decoupled_appC
  kind: reduces_to
  a: gubbala2025/coupled_binodal_coexistence
  b: frohoff2021/decoupled_binodals_appC
  mapping:
    a: "-1"
    a_Delta: "0"
  output_map:
    phi1_bin: phi_Ld_eq
  limit:
    beta: "oo"
  regime:
    beta: [5.0, 50.0]
    E1: [0.5, 2.0]
    E3: [0.05, 0.5]
  provenance: proposed
  reason: >
    In the vanishing-nematic-coupling limit beta -> oo (where nematic condensation energy
    -(1+phi)^2/(4*beta) -> 0), Gubbala's nonlinear common-tangent Ld binodal phi_Ld_eq reduces
    identically to Frohoff Appendix C's bare symmetric Cahn-Hilliard binodal phi_{1,bin} =
    sqrt(-a) = 1 at a = -1.
  assumptions:
    - "Uncoupled limit beta -> oo removing nematic bulk condensation energy in the Ld phase."

- id: rel_frohoff2021_coupled_binodal_approx_shifted_appC
  kind: approximated_by
  a: gubbala2025/coupled_binodal_coexistence
  b: frohoff2021/decoupled_binodals_appC
  mapping:
    a: "-1"
    a_Delta: "-1 / (2 * beta)"
  output_map:
    phi2_bin: phi_Ld_eq
  regime:
    beta: [0.5, 50.0]
    E1: [0.5, 2.0]
    E3: [0.05, 0.5]
  tolerance: 0.005
  provenance: proposed
  reason: >
    Minimizing out Gubbala's LdG nematic order parameter in the Ld phase yields the effective bulk
    potential f_eff(phi) = phi^4/4 + (1/2)*(-1 - 1/(2*beta))*phi^2 - (1/(2*beta))*phi - 1/(4*beta),
    which shifts the quadratic temperature by Frohoff's a_Delta = -1/(2*beta) relative to the bare
    a = -1 well while adding a linear tilt -(1/(2*beta))*phi that is cancelled through O(1/beta^2)
    by the common-tangent chemical potential mu_coex = -1/(2*beta) + O(1/beta^3). Consequently,
    Frohoff Appendix C's shifted-temperature binodal phi_{2,bin} = sqrt(-a - a_Delta) =
    sqrt(1 + 1/(2*beta)) matches Gubbala's exact nonlinear coupled binodal phi_Ld_eq(beta) through
    O(1/beta^2) (O(1/beta^3) residual): max relative error is 0.12% at Gubbala's default beta = 1
    (1.2247 vs. exact 1.2233 — nearly 20x tighter than linearized Gibbs-Thomson 1.2500) and <= 0.44%
    all the way down to beta = 0.5 (well within tolerance 0.005).
  assumptions:
    - "Temperature-shifted binodal correspondence a = -1, a_Delta = -1/(2*beta) across beta in [0.5, 50.0]."

- id: rel_frohoff2021_coex_mu_scales_ch_threshold_eq20
  kind: scales_as
  a: gubbala2025/coupled_binodal_coexistence
  b: frohoff2021/ch_threshold_general_eq20
  mapping:
    f2_pp: "4"
    rho: "sqrt(2 / beta)"
    alpha: "0"
  output_map:
    f1_pp_CH: mu_coex
  regime:
    beta: [2.0, 50.0]
    E1: [0.5, 2.0]
    E3: [0.05, 0.5]
  provenance: proposed
  reason: >
    Connects two consequences of the exact same quadratic nematic condensation term -(1+phi)^2/(4*beta)
    in Gubbala's bulk free energy via Frohoff Eq. (20)'s variational long-wavelength Cahn-Hilliard
    instability threshold f_1''^CH = (rho^2 - alpha^2)/f_2''. Under the exact variational dictionary
    f_2'' = 4, rho = sqrt(2/beta), alpha = 0, Frohoff Eq. (20) evaluates to f_1''^CH = 1/(2*beta) —
    which simultaneously gives the spinodal softening shifting Gubbala's binodal f_1''(+1) = 2 to
    marginal stability at beta_min = 1/4 (missing from Gubbala's printed SI Sec. 3.3) and equals
    -mu_coex = 1/(2*beta) + O(1/beta^3) through O(1/beta^2) (because the O(1/beta^2) grand-potential
    corrections of the Lo and Ld phases cancel identically). Both models share log-slope -1 in beta
    across beta in [2, 50] to within 2.4e-3.
  assumptions:
    - "Variational coupling dictionary f_2'' = 4, rho = sqrt(2/beta), alpha = 0 over beta in [2.0, 50.0]; opposite signs (mu_coex < 0 vs. f_1''^CH > 0) drop out in scales_as."

