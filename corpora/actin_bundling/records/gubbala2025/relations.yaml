# ==============================================================================
# Cross-record ModelAtlas relations with weirich2017 (Ref. 43: pp. 2, 6, 7)
# ==============================================================================
# gubbala2025 cites weirich2017 (ref-43) qualitatively on pp. 2 (6244), 6 (6248),
# and 7 (6249) for liquid-crystal tactoids in rod-like biopolymer solutions and
# notes on p. 7 that reducing anisotropic elasticity enables studying tactoid
# coarsening. Because gubbala2025 does not state explicit equation-to-equation
# mappings to weirich2017's equations, all cross-record mathematical relations
# below are entered with provenance: proposed.

- id: rel_weirich2017_coarsening_power_law_scales
  kind: scales_as
  a: gubbala2025/coarsening_power_law
  b: weirich2017/tactoid_coarsening_power_law
  mapping:
    t: "t / 60"
    alpha: "alpha"
  output_map:
    L: R_over_R0
  regime:
    t: [600.0, 7200.0]
    t0: [60.0, 60.0]
    alpha: [0.2, 0.5]
  provenance: proposed
  reason: >
    Both papers fit domain/tactoid growth to a power law: gubbala2025 models normalized lipid
    domain size R(t)/R_0 = (t/t_0)^alpha (Fig. 3, pp. 5-6; p. 7 cites weirich2017 [ref-43] when
    proposing to study tactoid coarsening by reducing anisotropic elasticity), while weirich2017
    models average tactoid major-axis length L(t) ~ t^alpha at constant aspect ratio L/r (Fig. 3A,
    pp. 3-4). With exact time unit conversion t [min] = t [s] / 60 and reference time t_0 = 60 s
    (matching Weirich's unprefactored L = (t / 1 min)^alpha), both models share identical log-slopes
    in elapsed time t (alpha) and exponent alpha across 10-120 min and alpha in [0.2, 0.5], while
    contrasting the two physical coarsening regimes (Weirich free 3D tactoid coalescence alpha =
    0.47 +/- 0.01 vs. Gubbala 2D elastic-hindered domains alpha <= 0.25).
  assumptions:
    - "Reference time fixed at t_0 = 60 s (1 min) to align with Weirich's unprefactored L = (t / 1 min)^alpha; changing t_0 only rescales R/R_0 by a constant factor without altering the time scaling exponent alpha."
    - "Constant tactoid aspect ratio L/r during growth (Weirich Fig. 3A) implies major axis L and characteristic domain radius R share the same growth exponent alpha."

- id: rel_weirich2017_anchoring_strength_scales_nondim_chi
  kind: scales_as
  a: gubbala2025/nondim_parameters_s32
  b: weirich2017/anchoring_strength_definition
  mapping:
    gamma_A: "150 * alpha / sqrt(lambda_tilde)"
    gamma_I: "300 * sqrt(lambda_tilde)"
  output_map:
    omega: chi
  regime:
    M: [0.1, 10.0]
    Gamma: [0.1, 10.0]
    lambda_tilde: [0.1, 10.0]
    alpha: [0.05, 5.0]
    L1: [0.1, 5.0]
    L3: [0.05, 2.0]
  provenance: proposed
  reason: >
    Bridges Gubbala's dimensionless nematic anchoring parameter chi = alpha / lambda_tilde (SI
    Sec. 3.2, p. 15, from dimensional gradient + anchoring density (1/2)|grad phi|^2 [lambda_tilde +
    alpha (n . N)^2]) with Weirich's sharp-interface dimensionless surface anchoring strength
    omega = gamma_A / gamma_I (Main Text p. 3, SI p. 8, from F = int dA [gamma_I + gamma_A (n . N)^2]).
    Integrating Gubbala's 1D Cahn-Hilliard kink phi_0(s) = tanh(s / sqrt(2*lambda_tilde)) across the
    double well (1/4)(1 - phi^2)^2 + (1/2)[lambda_tilde + alpha (n . N)^2]*(d_s phi)^2 yields
    equipartition isotropic tension gamma_I = (2*sqrt(2)/3)*a_0*sqrt(lambda_tilde) and anchoring
    tension gamma_A = (sqrt(2)/3)*a_0*alpha/sqrt(lambda_tilde), giving omega = gamma_A/gamma_I =
    alpha/(2*lambda_tilde) = chi/2 (factor-of-2 equipartition shift relative to the bare gradient
    ratio). Under this kink-integrated mapping (calibrated to Weirich's gamma_I = 300 nN/m at
    lambda_tilde = 1 um^2), chi and omega share identical log-slopes in alpha (+1) and
    lambda_tilde (-1).
  assumptions:
    - "1D bare Cahn-Hilliard kink integration maps dimensional (lambda_tilde, alpha) [um^2] to sharp-interface (gamma_I, gamma_A) [nN/m] with gamma_I proportional to sqrt(lambda_tilde) and gamma_A proportional to alpha / sqrt(lambda_tilde), yielding omega = chi / 2."
    - "Reference bulk energy density scale chosen so gamma_I = 300 nN/m (Weirich p. 4) at lambda_tilde = 1 um^2."

- id: rel_weirich2017_rapini_papoular_anchoring_scales
  kind: scales_as
  a: gubbala2025/anchoring_free_energy_eq7_s13
  b: weirich2017/tactoid_free_energy
  mapping:
    R: "1 / sqrt(sin(dphi_x) - dphi_x * cos(dphi_x))"
    alpha: "dphi_x"
    gamma_I: "0"
    gamma_A: "150 * chi"
  output_map:
    F: f_anch_total
  regime:
    chi: [0.1, 2.0]
    S: [1.0, 1.0]
    Q_xx: [0.5, 0.5]
    Q_xy: [0.0, 0.0]
    dphi_x: [0.005, 0.05]
    dphi_y: [1.0, 1.0]
  provenance: proposed
  reason: >
    Directly links the two papers' Rapini-Papoular anchoring free energies. In gubbala2025 Eqs. (7)
    and (S11)-(S13) (anchoring_free_energy_eq7_s13), for a horizontal uniaxial nematic director
    n = (1, 0) (Q_xx = S/2, Q_xy = 0) and unit-magnitude interface gradient (dphi_y = 1, small
    normal-to-director projection n . N ~ dphi_x << 1), f_anch_total = (1/2)*chi*(n . grad phi)^2 =
    (1/2)*chi*dphi_x^2. In weirich2017 SI p. 8 (tactoid_free_energy), isolating the pure anchoring
    contribution (gamma_I = 0) of a slender circular-arc tactoid of fixed surface area A_0 = 4*pi
    um^2 (R = 1/sqrt(sin(alpha) - alpha*cos(alpha))) and small cusp half-angle alpha = dphi_x
    (peak normal-to-director projection sin(alpha) ~ alpha) gives F_anch = gamma_A * A_omega =
    gamma_A * A_0 * (g(alpha)/(2*f(alpha))) = (1/5) * gamma_A * A_0 * alpha^2 * (1 + O(alpha^2)).
    Both models share identical Rapini-Papoular log-slopes in anchoring strength (chi <-> gamma_A:
    +1) and normal-to-director tilt (dphi_x <-> alpha: +2).
  assumptions:
    - "Horizontal uniaxial nematic state n = (1, 0) at Gubbala's default S = 1 (Q_xx = 1/2, Q_xy = 0) with dphi_y = 1 so n . N = dphi_x / sqrt(1 + dphi_x^2) ~ dphi_x."
    - "Pure anchoring limit gamma_I = 0 in Weirich tactoid_free_energy with fixed surface area A_0 = 4*pi um^2 and small tactoid half-angle alpha in [0.005, 0.05] rad."

- id: rel_weirich2017_nondim_lam_same_small_omega_ar
  kind: same_as
  a: gubbala2025/nondim_parameters_s32
  b: weirich2017/tactoid_aspect_ratio_scaling
  mapping:
    omega: "alpha / (2 * lambda_tilde)"
  output_map:
    aspect_ratio: lam
  regime:
    M: [0.1, 10.0]
    Gamma: [0.1, 10.0]
    lambda_tilde: [0.5, 2.0]
    alpha: [0.05, 0.9]
    L1: [0.1, 5.0]
    L3: [0.05, 2.0]
  provenance: proposed
  reason: >
    Connects Gubbala's effective dimensionless line tension lam = 1 + alpha/(2*lambda_tilde) =
    1 + chi/2 (SI Eqs. S13, S17, Sec. 3.2) to Weirich's smooth-Wulff tactoid aspect ratio scaling
    L/r = 1 + omega for 0 <= omega < 1 (SI p. 8, Fig. S2D). In Gubbala's fixed-profile 1D
    Cahn-Hilliard kink limit, the normal-to-tangential interfacial tension ratio gamma(0)/gamma(pi/2)
    equals 1 + alpha/(2*lambda_tilde) = lam, which equals Weirich's smooth-Wulff aspect ratio
    (gamma_I + gamma_A)/gamma_I = 1 + omega under the exact kink-integrated identification
    omega = alpha/(2*lambda_tilde) = chi/2. Crucially, Weirich's cusp-onset boundary omega = 1
    maps to chi = 2, coinciding with Gubbala's upper linear-stability limit chi <= 2 (SI Eq. S27),
    so Gubbala's linearly stable parallel-anchoring parameter space (including default chi = 1 ->
    omega = 0.5) lies entirely inside Weirich's smooth-droplet branch omega < 1.
  assumptions:
    - "Restricted to 0 < alpha / (2*lambda_tilde) = omega < 1 (i.e. 0 < chi < 2, Gubbala's parallel-anchoring linear stability window and Weirich's smooth-Wulff branch)."
    - "Rigid-kink diffuse-to-sharp mapping omega = alpha/(2*lambda_tilde) = chi/2; exact variable-width 1D kink relaxation lowers the normal-to-tangential tension ratio from 1 + chi/2 to sqrt(1 + chi)."

- id: rel_weirich2017_line_tension_s13_approx_tactoid_min
  kind: approximated_by
  a: gubbala2025/effective_line_tension_s13
  b: weirich2017/tactoid_equilibrium_minimizer
  mapping:
    omega: "chi / 2"
  output_map:
    aspect_ratio: lam
  regime:
    chi: [0.05, 1.95]
  tolerance: 0.05
  provenance: proposed
  reason: >
    Quantifies numerical agreement between Gubbala's fixed-kink normal-to-tangential tension ratio /
    effective line tension lam = 1 + chi/2 (SI Eq. S13) and Weirich's exact circular-arc tactoid
    equilibrium minimizer aspect ratio L/r(omega) (SI p. 8, Fig. S2C-D) under the kink-integrated
    anchoring mapping omega = chi/2 across Gubbala's stable parallel-anchoring range chi in
    [0.05, 1.95] (omega in [0.025, 0.975]). The maximum relative deviation is ~4.8% (peaking near
    Gubbala's default chi = 1 / omega = 0.5, where 1 + chi/2 = 1.50 vs. circular-arc minimizer
    1.5745), matching Weirich's own circular-arc-vs-Wulff discrepancy (rel_tactoid_min_approx_scaling_full).
  assumptions:
    - "Parallel anchoring in Gubbala's linearly stable window chi in [0.05, 1.95] mapped to Weirich's smooth-droplet regime omega = chi/2 in [0.025, 0.975]."
    - "5% tolerance reflects the maximum circular-arc ansatz vs. exact Wulff deviation (~4.8% near omega ~ 0.5-0.7)."

- id: rel_weirich2017_capillary_dispersion_highk_scales_lsa
  kind: scales_as
  a: gubbala2025/linear_stability_s24_s28
  b: weirich2017/capillary_dispersion_corrected
  mapping:
    gamma_I: "gamma * 300"
    eta: "3.0"
    R_0: "200.0"
    omega: "0.75 * chi"
    k: "kx"
  output_map:
    Omega: omega_phi
  regime:
    gamma: [0.05, 1.0]
    chi: [0.1, 2.0]
    beta: [0.5, 2.0]
    E1: [0.1, 2.0]
    E3: [0.05, 0.5]
    kx: [40.0, 120.0]
    ky: [0.0, 0.0]
  provenance: proposed
  reason: >
    Connects the short-wavelength longitudinal dispersion relations for perturbations along a
    homogeneously aligned nematic (wavevector k_x = k parallel to director n, k_y = 0). Both models
    couple conserved k^2 transport (Model B diffusive mobility gamma*k^2 in gubbala2025 SI Eq. S27;
    viscous Poiseuille axial flow Lambda(k) = (gamma_I/(eta*R_0))*k^2 in weirich2017 SI p. 9) to an
    anchoring-stiffened interfacial gradient penalty: gubbala2025 gives decay rate
    omega_phi(k, 0) = gamma*k^2*[2 + (1 + 3*chi/2)*k^2] ~ gamma*(1 + 3*chi/2)*k^4, while
    weirich2017's corrected capillary dispersion gives growth rate
    Omega(k) = (gamma_I/(eta*R_0))*k^2*[1 - (1 + 2*omega)*k^2] ~ -(gamma_I/(eta*R_0))*(1 + 2*omega)*k^4
    (stabilizing decay at high k). Matching the anchoring stiffening factor (1 + 2*omega = 1 + 3*chi/2
    -> omega = 3*chi/4, reflecting both Weirich's exact factor 2*omega and Gubbala SI Sec. 3.3's
    Q_xx = S vs. S/2 linearization convention) yields identical high-k log-slopes across all three
    shared parameters: mobility/capillary-rate (gamma: +1), anchoring strength (chi <-> omega), and
    axial wavenumber (kx <-> k: +4).
  assumptions:
    - "Longitudinal wavevector along the aligned nematic director (k_y = 0) in the short-wavelength interfacial-damping regime (k_x in [40, 120] >> 1), where both omega_phi and -Omega are positive stabilizing rates."
    - "Mapping omega = (3/4)*chi aligns Weirich's exact corrected axial stiffness (1 + 2*omega) with Gubbala SI Eq. (S27)'s printed longitudinal stiffness (1 + 3*chi/2), which exceeds the exact Eq. (3) Q_xx = S/2 value (1 + chi) due to SI Sec. 3.3 setting Q_xx = S."

- id: rel_weirich2017_capillary_dynamic_factor_scales_lsa_lowk
  kind: scales_as
  a: gubbala2025/linear_stability_s24_s28
  b: weirich2017/capillary_dynamic_factor_scaling
  mapping:
    gamma_I: "gamma * 300"
    eta: "3.0"
    R_0: "200.0"
    k: "kx"
  output_map:
    Lambda: omega_phi
  regime:
    gamma: [0.05, 1.0]
    chi: [0.1, 2.0]
    beta: [0.5, 2.0]
    E1: [0.1, 2.0]
    E3: [0.05, 0.5]
    kx: [0.005, 0.04]
    ky: [0.0, 0.0]
  provenance: proposed
  reason: >
    Connects the long-wavelength conserved transport prefactors of both continuum models: for
    long-wavelength longitudinal modes (k_y = 0, k_x << 1), Gubbala's Cahn-Hilliard concentration
    rate omega_phi(k_x, 0) = 2*gamma*k_x^2*(1 + O(k_x^2)) (SI Eq. S27) and Weirich's viscous
    Rayleigh-Plateau capillary dynamic factor Lambda(k) = (gamma_I/(eta*R_0))*k^2 (SI p. 9) share
    identical conserved hydrodynamic/diffusive scaling in the driving mobility/capillary-rate
    (gamma <-> gamma_I/(eta*R_0): +1) and axial wavenumber (kx <-> k: +2). Note that in the full
    dispersion relations, the O(k^2) terms carry opposite stability signs (stable bulk double-well
    relaxation -omega_phi < 0 in Gubbala vs. unstable cylindrical capillary growth +Omega > 0 in
    Weirich).
  assumptions:
    - "Long-wavelength regime k_x in [0.005, 0.04] << 1 with k_y = 0 so O(k^4) gradient terms contribute < 0.3%."
    - "Weirich viscosity eta = 3 Pa*s and bundle radius R_0 = 200 nm held at the paper's typical experimental values."

- id: rel_weirich2017_crossover_reduces_from_eq6_splay
  kind: reduces_to
  a: gubbala2025/anchoring_elastic_crossover
  b: weirich2017/director_crossover_parameter
  mapping:
    gamma_A: "(sqrt(2) / 3) * chi * 1000"
    V: "R**3"
    K: "2 * E1 * S**2"
  output_map:
    chi: xi_splay_eq6
  regime:
    chi: [0.1, 2.0]
    R: [1.0, 50.0]
    E1: [0.5, 2.0]
    E3: [0.05, 0.3]
    S: [0.5, 1.5]
  limit:
    E3: "0"
  provenance: proposed
  reason: >
    Tests the exact isotropic-elasticity limit noted in gubbala2025 Conclusions (p. 7 / 6249,
    citing weirich2017 [ref-43]: reducing anisotropic elasticity to study tactoids). Combining
    Gubbala's 1D Cahn-Hilliard kink anchoring tension gamma_A_tilde = (sqrt(2)/3)*chi with the
    printed Eq. (6) splay Frank elastic constant k_11 = 2*E_1*S^2 - (2/3)*E_3*S^3 defines the
    anchoring-to-splay crossover ratio xi_splay_eq6 = gamma_A_tilde*R / k_11
    (anchoring_elastic_crossover). As cubic elastic anisotropy E_3 -> 0, k_11 -> k_33 -> 2*E_1*S^2
    (one-constant Frank elasticity), and xi_splay_eq6 reduces identically to Weirich's
    homogeneous-to-bipolar director crossover parameter chi_W = gamma_A * V^(1/3) / K (SI p. 8)
    under V^(1/3) = R*l_c, gamma_A = a_0*l_c*(sqrt(2)/3)*chi, and K = a_0*l_c^2*(2*E_1*S^2).
  assumptions:
    - "Vanishing cubic elastic anisotropy E_3 -> 0 recovers the one-constant Frank elastic limit K = k_11 = k_33 = 2*E_1*S^2."
    - "Reference dimensional scales l_c = 1 um and a_0*l_c = 1000 nN/m = 1 pN/um cancel identically in the dimensionless crossover ratio."

- id: rel_weirich2017_crossover_derived_from_eq6_bend
  kind: derived_from
  a: gubbala2025/anchoring_elastic_crossover
  b: weirich2017/director_crossover_parameter
  mapping:
    gamma_A: "(sqrt(2) / 3) * chi * 1000"
    V: "R**3"
    K: "2 * E1 * S**2"
  output_map:
    chi: xi_bend_eq6
  regime:
    chi: [0.1, 2.0]
    R: [1.0, 50.0]
    E1: [0.5, 2.0]
    E3: [0.05, 0.3]
    S: [0.5, 1.5]
  steps:
    - "subs: E3 = 0"
  provenance: proposed
  reason: >
    Exact symbolic derivation confirming that setting cubic elastic anisotropy E_3 = 0 in Gubbala's
    Eq. (6) bend crossover ratio xi_bend_eq6 = (sqrt(2)/3)*chi*R / (2*E_1*S^2 + (4/3)*E_3*S^3)
    yields Weirich's one-constant homogeneous-to-bipolar crossover parameter gamma_A * V^(1/3) / K
    (SI p. 8). At Gubbala's finite actin anisotropy E_3/E_1 = 1, S = 1 (k_33/k_11 = 2.5), bend
    distortions are suppressed by 0.6x while splay distortions are enhanced by 1.5x relative to the
    one-constant Weirich crossover parameter at K = 2*E_1*S^2.
  assumptions:
    - "Symbolic substitution E_3 = 0 reduces both splay (k_11) and bend (k_33) Frank constants to K = 2*E_1*S^2."

- id: rel_weirich2017_crossover_reduces_from_2d_splay
  kind: reduces_to
  a: gubbala2025/anchoring_elastic_crossover
  b: weirich2017/director_crossover_parameter
  mapping:
    gamma_A: "(sqrt(2) / 3) * chi * 1000"
    V: "R**3"
    K: "2 * E1 * S**2"
  output_map:
    chi: xi_splay_2d
  regime:
    chi: [0.1, 2.0]
    R: [1.0, 50.0]
    E1: [0.5, 2.0]
    E3: [0.05, 0.3]
    S: [0.5, 1.5]
  limit:
    E3: "0"
  provenance: proposed
  reason: >
    Verifies that Gubbala's exact 2D Frank splay constant k_11 = 2*E_1*S^2 - E_3*S^3 (obtained from
    substituting 2D Eq. 3 into Eq. 5, frank_elastic_constants_2d) produces an anchoring-to-splay
    crossover ratio xi_splay_2d that reduces to the exact same Weirich one-constant crossover
    parameter gamma_A * V^(1/3) / K as E_3 -> 0, even though printed 3D Eq. (6) and exact 2D diverge
    at finite E_3 (splitting splay vs. bend by 3.0x in 2D vs. 2.5x in Eq. 6 at E_3 = E_1, S = 1).
  assumptions:
    - "Vanishing cubic elastic anisotropy E_3 -> 0 eliminates the 2D vs. 3D Beris-Edwards discrepancy in k_11 and k_33."

- id: rel_weirich2017_crossover_same_as_eq6_effective_K
  kind: same_as
  a: gubbala2025/anchoring_elastic_crossover
  b: weirich2017/director_crossover_parameter
  mapping:
    gamma_A: "(sqrt(2) / 3) * chi * 1000"
    V: "R**3"
    K: "2 * E1 * S**2 - 2 * E3 * S**3 / 3"
  output_map:
    chi: xi_splay_eq6
  regime:
    chi: [0.1, 2.0]
    R: [1.0, 50.0]
    E1: [0.5, 2.0]
    E3: [0.05, 0.3]
    S: [0.5, 1.5]
  provenance: proposed
  reason: >
    Exact symbolic equivalence across finite bend-splay anisotropy E_3 > 0 when Weirich's single
    effective Frank elastic constant K in director_crossover_parameter (SI p. 8) is identified with
    Gubbala's printed Eq. (6) splay elastic constant k_11 = 2*E_1*S^2 - (2/3)*E_3*S^3 (which is
    strictly positive across the regime since E_3*S < 3*E_1). Evaluating xi_splay_eq6 at Gubbala's
    simulation parameters (chi = 1, S = 1, R ~ 10-50 l_c, E_1 = E_3 = 0.1 or 2) gives xi ~ 35-180
    at low actin and xi ~ 1.8-9 at high actin, placing Gubbala's simulated domains squarely in
    Weirich's deformed/bipolar director regime (chi_W >> 1) rather than Weirich's homogeneous-director
    tactoid regime (chi_W << 1).
  assumptions:
    - "Regime satisfies k_11 = 2*E_1*S^2 - (2/3)*E_3*S^3 > 0 (E_3/E_1 < 3/S)."
    - "Identifies Weirich's effective bulk Frank elastic constant K with Gubbala's splay constant k_11 (the softer mode for E_3 > 0 governing splay-dominated defect onset)."

# ==============================================================================
# Cross-record ModelAtlas relations with zwicker2015 (Phys. Rev. E 92, 012317)
# ==============================================================================
# Neither paper directly cites the other (Gubbala Ref. 24 cites Rosowski,
# Vidal-Henriquez, Zwicker, Style & Dufresne, Soft Matter 16, 5892-5897, 2020,
# on elastic coarsening, rather than Zwicker, Hyman & Julicher 2015). Both
# studies share passive Cahn-Hilliard phase separation and Lifshitz-Slyozov
# t^(1/3) Ostwald ripening as their baseline before introducing distinct
# coarsening-arrest mechanisms (first-order/autocatalytic chemical turnover in
# zwicker2015 vs. anisotropic nematic actin elasticity in gubbala2025). All
# cross-record relations below carry provenance: proposed.

# --- 1. Shared Cahn-Hilliard Double-Well Bulk Chemical Potential ---

- id: rel_zwicker2015_cahn_hilliard_mu_scales_binary_sec3
  kind: scales_as
  a: gubbala2025/cahn_hilliard_free_energy_eq2
  b: zwicker2015/binary_free_energy_sec3
  mapping:
    b: "1"
    psi: "1"
    phi_B: "(1 + phi) / 2"
  output_map:
    mu_B: df_dphi
  regime:
    phi: [0.1, 0.9]
    lam: [1.0, 1.0]
    grad_phi: [0.0, 0.0]
  provenance: proposed
  reason: >
    Establishes the exact affine order-parameter equivalence between Gubbala's symmetric binary
    Cahn-Hilliard potential f_phi(phi) = phi^4/4 - phi^2/2 = (1/4)*(phi^2 - 1)^2 - 1/4 (Eq. 2,
    minima at phi = -1, +1) and Zwicker's Sec. III binary double-well potential
    f(phi^B) = (b/2)*(phi^B)^2*(1 - phi^B)^2 (p. 4, minima at phi^B = 0, 1 for psi = 1). Under
    phi^B = (1 + phi)/2, f(phi^B) = (b/8)*[(1/4)*(phi^2 - 1)^2] equals Gubbala's bulk potential
    up to energy scale a_0 = b/8 and constant reference shift +1/4 (zero at the binodals vs. zero
    at the spinodal peak phi = 0). Differentiating removes the constant shift identically, giving
    mu^B = df/dphi^B = (b/4)*(phi^3 - phi) = (b/4)*df_dphi, so both models share the identical
    nontrivial phi-dependent log-slope (3*phi^2 - 1)/(phi^2 - 1) across both the spinodal
    (phi < 1/sqrt(3)) and metastable (1/sqrt(3) < phi < 1) intervals.
  assumptions:
    - "Binary strong-segregation mapping phi^B = (1 + phi)/2 (psi = 1) with reference interaction modulus b = 1 J/m^3 and uniform bulk state grad_phi = 0."

- id: rel_zwicker2015_cahn_hilliard_mu_scales_ternary_eq1
  kind: scales_as
  a: gubbala2025/cahn_hilliard_free_energy_eq2
  b: zwicker2015/ternary_free_energy_eq1
  mapping:
    a: "1"
    b: "1"
    psi: "0.1"
    phi_A: "0"
    phi_B: "0.05 * (1 + phi)"
  output_map:
    mu_B: df_dphi
  regime:
    phi: [0.1, 0.9]
    lam: [1.0, 1.0]
    grad_phi: [0.0, 0.0]
  provenance: proposed
  reason: >
    Extends the affine double-well equivalence phi^B = (psi/2)*(1 + phi) to Zwicker's general-psi
    ternary free energy Eq. (1) at phi^A = 0 and Sec. IV droplet composition psi = 0.1, where
    f(0, phi^B) = (b*psi^2/8)*[(1/4)*(phi^2 - 1)^2] and mu^B = (b*psi/4)*(phi^3 - phi) =
    (b*psi/4)*df_dphi. Combining this bulk energy scale a_0 = b*psi^2/8 with the exact gradient
    correspondence l_c = sqrt(2*kappa/b) and Gubbala's 1D Cahn-Hilliard kink integral 2*sqrt(2)/3
    reproduces Zwicker's surface tension gamma = a_0*l_c*(2*sqrt(2)/3) = (1/6)*psi^2*sqrt(b*kappa)
    (zwicker2015/surface_tension_gamma) identically.
  assumptions:
    - "Zero soluble-component background phi^A = 0 and Zwicker Sec. IV dense-phase volume fraction psi = 0.1 under phi^B = (psi/2)*(1 + phi)."

# --- 2. Shared Microscopic Cahn-Hilliard Length, Timescale & Passive Coarsening Rate ---

- id: rel_zwicker2015_interface_width_scales_nondim_lc
  kind: scales_as
  a: zwicker2015/interface_width_w
  b: gubbala2025/nondim_parameters_s32
  mapping:
    M: "1.0"
    Gamma: "1.0"
    lambda_tilde: "2 * (kappa / b) * 10**12"
    alpha: "1.0"
    L1: "1.0"
    L3: "1.0"
  output_map:
    l_c: w
  regime:
    kappa: [1.0e-13, 1.0e-11]
    b: [0.5, 10.0]
  provenance: proposed
  reason: >
    Rewriting Zwicker's passive Cahn-Hilliard free energy Eq. (1)-(2) (f_Z + (kappa/2)*|grad phi^B|^2)
    in Gubbala's symmetric order parameter phi = 2*phi^B/psi - 1 yields
    a_0*[(1/4)*(phi^2 - 1)^2 + (1/2)*(2*kappa/b)*|grad phi|^2] with a_0 = b*psi^2/8 and exact
    gradient-coefficient identification lambda_tilde = 2*kappa/b (independent of psi). Consequently,
    Zwicker's flat-interface tanh(x/w) width w = 2*sqrt(kappa/b) (p. 2) and Gubbala's bare
    nondimensionalization length l_c = sqrt(lambda_tilde) (SI Sec. 3.2, p. 15; whose 1D kink is
    tanh(x/(sqrt(2)*l_c))) satisfy the exact convention ratio w = sqrt(2)*l_c and share identical
    (+1/2, -1/2) log-slopes in (kappa, b).
  assumptions:
    - "Exact passive Cahn-Hilliard gradient mapping lambda_tilde = 2*kappa/b (converted from m^2 to um^2 by 10^12), giving exact interface-width ratio w / l_c = sqrt(2)."

- id: rel_zwicker2015_nondim_gamma_scales_k0
  kind: scales_as
  a: gubbala2025/nondim_parameters_s32
  b: zwicker2015/interface_diffusion_rate_k0
  mapping:
    D_B: "2 * M * 10**(-12)"
    w: "sqrt(2 * lambda_tilde) * 10**(-6)"
  output_map:
    k_0: gamma
  regime:
    M: [0.1, 10.0]
    Gamma: [1.0, 1.0]
    lambda_tilde: [0.1, 10.0]
    alpha: [0.1, 5.0]
    L1: [0.1, 5.0]
    L3: [0.05, 2.0]
  provenance: proposed
  reason: >
    Transforming Zwicker's passive Cahn-Hilliard PDE Eq. (3b) (d_t phi^B = m_B*nabla^2[f'(phi^B) -
    kappa*nabla^2 phi^B] with D_B = m_B*b) into phi = 2*phi^B - 1 gives
    d_t phi = (D_B/2)*nabla^2[(phi^3 - phi) - (w^2/2)*nabla^2 phi], identifying Gubbala's
    dimensional mobility M = D_B/2 and lambda_tilde = w^2/2 (SI Eq. S17). The factors of 2 cancel
    identically in the interfacial diffusion timescale: t_phi = lambda_tilde/M = (w^2/2)/(D_B/2) =
    w^2/D_B = 1/k_0, so k_0 = 1/t_phi = Gamma*gamma. Thus Gubbala's timescale ratio
    gamma = t_Q/t_phi = k_0/Gamma and Zwicker's interface diffusion rate k_0 = D_B/w^2 share
    identical (+1, -1) log-slopes in (M, lambda_tilde), and setting gamma = 1 (Gubbala SI Fig. S4)
    makes Gubbala's dimensionless time t = t_bar*Gamma identically equal to Zwicker's t*k_0.
  assumptions:
    - "Exact Cahn-Hilliard PDE mapping D_B = 2*M (um^2/s -> m^2/s) and w = sqrt(2*lambda_tilde) (um -> m) at unit nematic relaxation rate Gamma = 1 s^-1."

- id: rel_zwicker2015_nondim_gamma_scales_passive_coarsening_eq18
  kind: scales_as
  a: gubbala2025/nondim_parameters_s32
  b: zwicker2015/passive_coarsening_rate_eq18
  mapping:
    D_B: "2 * M * 10**(-12)"
    gamma_beta: "sqrt(2 * lambda_tilde) * 10**(-6) / 6"
    R_bar: "10 * sqrt(lambda_tilde) * 10**(-6)"
  output_map:
    lam: gamma
  regime:
    M: [0.1, 10.0]
    Gamma: [1.0, 1.0]
    lambda_tilde: [0.1, 10.0]
    alpha: [0.1, 5.0]
    L1: [0.1, 5.0]
    L3: [0.05, 2.0]
  provenance: proposed
  reason: >
    Connects Gubbala's dimensionless lipid-diffusivity timescale ratio gamma = M/(lambda_tilde*Gamma)
    (SI Sec. 3.2) to Zwicker's passive 3D Ostwald ripening rate lam = D_B*gamma*beta/R_bar^3
    (Eq. 18, k_b = 0). Under the exact Cahn-Hilliard dictionary D_B = 2*M, w = sqrt(2*lambda_tilde),
    binary capillary length gamma*beta = w/6 (psi = 1), and a droplet of fixed dimensionless size
    R_bar/l_c = R_tilde (here R_tilde = 10), Zwicker's passive coarsening rate becomes
    lam = (sqrt(2)/(3*R_tilde^3))*(M/lambda_tilde) = (sqrt(2)/(3*R_tilde^3))*Gamma*gamma, sharing
    identical (+1, -1) log-slopes in (M, lambda_tilde).
  assumptions:
    - "Binary Cahn-Hilliard capillary length gamma*beta = w/6 = sqrt(2*lambda_tilde)/6 (psi = 1) evaluated at fixed dimensionless droplet size R_bar = 10*l_c and Gamma = 1 s^-1."

# --- 3. Passive Lifshitz-Slyozov t^(1/3) Coarsening vs. Actin-Hindered Growth & p. 7 Typo ---

- id: rel_zwicker2015_coarsening_LS_passive_scales
  kind: scales_as
  a: gubbala2025/coarsening_power_law
  b: zwicker2015/lifshitz_slyozov_scaling_corrected
  mapping:
    t: "t"
    D_B: "1.0e-12"
    w: "1.0e-7"
  output_map:
    R_mean: R_over_R0
  regime:
    t: [10.0, 10000.0]
    t0: [1.0, 1.0]
    alpha: [0.3333333333333333, 0.3333333333333333]
  provenance: proposed
  reason: >
    Both papers use classical Lifshitz-Slyozov / Ostwald ripening R(t) ~ t^(1/3) as their passive
    control baseline: gubbala2025 verifies R(t)/R_0 = (t/t_0)^(1/3) without actin (pp. 1, 2, 4-7,
    Fig. 3; alpha_bulk_diffusion_ref = 1/3), while zwicker2015 Sec. III.B.3 (p. 7) states passive
    Ostwald ripening <R> ~ (t*D_B*w)^(1/3) without chemical turnover (k_f = k_b = 0). At alpha =
    1/3, both models share the exact temporal log-slope +1/3 across three decades in time.
  assumptions:
    - "Passive control limit (no actin in gubbala2025, alpha = 1/3; no chemical turnover in zwicker2015, k_f = k_b = 0) at fixed diffusivity D_B = 10^-12 m^2/s and interface width w = 10^-7 m."

- id: rel_zwicker2015_coarsening_low_actin_vs_LS_diagnostic
  kind: scales_as
  a: gubbala2025/coarsening_power_law
  b: zwicker2015/lifshitz_slyozov_scaling_corrected
  mapping:
    t: "t"
    D_B: "1.0e-12"
    w: "1.0e-7"
  output_map:
    R_mean: R_over_R0
  regime:
    t: [10.0, 10000.0]
    t0: [1.0, 1.0]
    alpha: [0.25, 0.25]
  provenance: proposed
  reason: >
    Diagnostic scaling contrast comparing Gubbala's low-actin hindered coarsening regime
    (alpha = 0.25, Sec. 3 pp. 5-6, Fig. 3; high actin slows further to alpha < 0.25) against
    Zwicker's passive bulk-diffusion Lifshitz-Slyozov coarsening (<R> ~ t^(1/3), Sec. III.B.3).
    Expected to be not_verified with temporal log-slope difference 1/3 - 1/4 = 1/12 = 0.0833,
    quantifying elastic coarsening slowdown relative to passive Ostwald ripening.
  assumptions:
    - "Evaluates Gubbala's coarsening_power_law at the reported low-actin exponent alpha = 0.25 against passive t^(1/3) Lifshitz-Slyozov scaling."

- id: rel_zwicker2015_LS_printed_scales_as_normalized_power_law
  kind: scales_as
  a: zwicker2015/lifshitz_slyozov_scaling_printed
  b: gubbala2025/coarsening_power_law
  mapping:
    t: "t"
    t0: "w**2 / D_B"
    alpha: "1/3"
  output_map:
    R_over_R0: R_mean
  regime:
    t: [10.0, 10000.0]
    D_B: [1.0e-12, 1.0e-11]
    w: [1.0e-7, 1.0e-5]
  provenance: proposed
  reason: >
    Explains the exact mathematical origin of Zwicker Sec. III.B.3 (p. 7)'s dimensionally
    inconsistent printed Lifshitz-Slyozov expression <R> ~ (t*D_B/w^2)^(1/3) = (t*k_0)^(1/3).
    Substituting Zwicker's interface diffusion timescale t_0 = 1/k_0 = w^2/D_B (= Gubbala's t_phi)
    and alpha = 1/3 into Gubbala's dimensionless normalized power law R(t)/R_0 = (t/t_0)^alpha
    yields (t*D_B/w^2)^(1/3) identically across all three parameters (t, D_B, w) with log-slopes
    (+1/3, +1/3, -2/3). Thus Zwicker's printed RHS is actually the dimensionless normalized radius
    <R>/w (with R_0 = w), missing the multiplicative factor w required for dimensional <R>.
  assumptions:
    - "Identifies reference time t_0 = w^2/D_B = 1/k_0 (= t_phi) and implicit reference length R_0 = w in Gubbala's coarsening_power_law at alpha = 1/3."

# --- 4. Linear Stability Dispersion Relations & Cross-Paper Error Corroboration ---

- id: rel_zwicker2015_lsa_iso_reduces_eqF1_corrected
  kind: reduces_to
  a: gubbala2025/linear_stability_s24_s28_corrected
  b: zwicker2015/homogeneous_dispersion_eqF1_corrected
  mapping:
    D_B: "1"
    w: "sqrt(2)"
    k_f: "1 / beta"
    k_b: "0"
    q: "sqrt(kx**2 + ky**2)"
  output_map:
    lam_q_norm: sigma_max
  limit:
    chi: "0"
    beta: "oo"
  regime:
    gamma: [1.0, 1.0]
    chi: [0.05, 0.5]
    beta: [10.0, 100.0]
    E1: [1.0, 5.0]
    E3: [0.1, 1.0]
    kx: [0.1, 0.6]
    ky: [0.1, 0.6]
  provenance: proposed
  reason: >
    Verifies the exact all-wavenumber passive Cahn-Hilliard binodal dispersion limit shared by both
    papers. In gubbala2025 SI Sec. 3.3 (linearizing around the binodal phi = +1 where f''(+1) = +2),
    turning off anchoring (chi -> 0) and nematic order (beta -> oo, so S = 1/sqrt(beta) -> 0 and
    off-diagonal coupling c_12*c_21 -> 0) at matched timescale gamma = t_Q/t_phi = 1 reduces the
    slow concentration eigenvalue sigma_max to -k^2*(2 + k^2) (since omega_phi = k^2*(2 + k^2) <
    4 <= omega_xx for k^2 <= 0.72). In zwicker2015 Appendix F Eq. (F1_corrected), placing the
    homogeneous state at the dense binodal phi_0^B = 1 (k_b = 0, so c_spin = -1) and taking the
    passive limit k_f/k_0 = 2/beta -> 0 under the exact kink-width scaling w = sqrt(2)*l_c
    (q*w = sqrt(2)*k) yields lam_q_norm = -(q*w)^2*(1 + (q*w)^2/4) = -k^2*(2 + k^2) identically.
  assumptions:
    - "Matched diffusive and nematic timescales gamma = t_Q/t_phi = 1 (Gubbala SI Fig. S4) and exact interface-width ratio w = sqrt(2)*l_c (with l_c = 1 m, D_B = 1 m^2/s)."
    - "Wavenumber box kx, ky in [0.1, 0.6] ensures omega_phi < 4 <= omega_xx so sigma_max tracks the concentration branch -omega_phi."
    - "Simultaneous uncoupling limit: chi -> 0, beta -> oo (S -> 0) in Gubbala and k_f = 1/beta -> 0 at k_b = 0 (passive dense binodal phi_0^B = 1) in Zwicker."

- id: rel_zwicker2015_lsa_iso_vs_eqF1_printed
  kind: reduces_to
  a: gubbala2025/linear_stability_s24_s28_corrected
  b: zwicker2015/homogeneous_dispersion_eqF1
  mapping:
    D_B: "1"
    w: "sqrt(2)"
    k_f: "1 / beta"
    k_b: "0"
    q: "sqrt(kx**2 + ky**2)"
  output_map:
    lam_q_norm: sigma_max
  limit:
    chi: "0"
    beta: "oo"
  regime:
    gamma: [1.0, 1.0]
    chi: [0.05, 0.5]
    beta: [10.0, 100.0]
    E1: [1.0, 5.0]
    E3: [0.1, 1.0]
    kx: [0.1, 0.6]
    ky: [0.1, 0.6]
  provenance: proposed
  reason: >
    Diagnostic cross-paper check testing the exact passive binodal Cahn-Hilliard limit against
    Zwicker's printed Appendix F Eq. (F1) under the exact same dictionary as
    rel_zwicker2015_lsa_iso_reduces_eqF1_corrected. Fails to converge to zero because printed
    Eq. (F1) doubles the q^2 term (converging to -k^2*(4 + k^2) instead of Gubbala SI Eq. S27's
    exact -k^2*(2 + k^2)), plateauing at ~49% relative error (flagged ambiguous rather than
    not_verified only because the finite-beta O(1/beta) transient shrinks from 4.91e-1 to 4.90e-1
    while never approaching tolerance), providing an independent cross-paper corroboration of
    zwicker2015/q_appF_factor_of_2_error.
  assumptions:
    - "Same exact passive binodal dictionary and limit as rel_zwicker2015_lsa_iso_reduces_eqF1_corrected."

- id: rel_zwicker2015_lsa_anisotropic_omega_phi_scales_eqF1_corrected
  kind: scales_as
  a: gubbala2025/linear_stability_s24_s28
  b: zwicker2015/homogeneous_dispersion_eqF1_corrected
  mapping:
    D_B: "2 * gamma"
    w: "sqrt(2 * ((1 + 3 * chi / 2) * kx**2 + (1 - chi / 2) * ky**2) / (kx**2 + ky**2))"
    k_f: "1.0e-12"
    k_b: "0"
    q: "sqrt(kx**2 + ky**2)"
  output_map:
    lam_q: omega_phi
  regime:
    gamma: [0.05, 2.0]
    chi: [-0.5, 1.8]
    beta: [0.5, 2.0]
    E1: [0.1, 2.0]
    E3: [0.0, 0.5]
    kx: [0.2, 3.0]
    ky: [0.2, 3.0]
  provenance: proposed
  reason: >
    Demonstrates that across Gubbala's entire anchoring stability window -2/3 < chi < 2 and arbitrary
    2D wavevector (kx, ky), Gubbala's anisotropic Cahn-Hilliard concentration decay rate
    omega_phi(kx, ky) = gamma*k^2*[2 + (1 + 3*chi/2)*kx^2 + (1 - chi/2)*ky^2] (SI Eq. S27, identical
    in printed and corrected LSA) equals -lam_q of Zwicker's passive binodal dispersion Eq.
    (F1_corrected) identically for D_B = 2*gamma and an orientation-dependent effective interface
    width w_eff(kx, ky; chi) = sqrt(2*[(1 + 3*chi/2)*kx^2 + (1 - chi/2)*ky^2]/k^2). Under this
    identification, Gubbala's linear stability bounds -2/3 <= chi <= 2 correspond precisely to
    non-negativity of w_eff^2 along the director (w_parallel = sqrt(2 + 3*chi)) and transverse to it
    (w_perp = sqrt(2 - chi)). Verified across all four shared variables (gamma, chi, kx, ky) from
    diffusive k^2 to interfacial k^4 regimes.
  assumptions:
    - "Anchoring strength chi in [-0.5, 1.8] strictly inside Gubbala's linear stability window (-2/3, 2) so w_eff > 0 for all wavevector angles."
    - "Passive dense-binodal limit in Zwicker (k_b = 0 => c_spin = -1, k_f = 10^-12 s^-1 << D_B*q^2); opposite sign conventions (decay rate omega_phi vs. growth rate lam_q) drop out in scales_as."

- id: rel_zwicker2015_lsa_anisotropic_omega_phi_vs_eqF1_printed
  kind: scales_as
  a: gubbala2025/linear_stability_s24_s28
  b: zwicker2015/homogeneous_dispersion_eqF1
  mapping:
    D_B: "2 * gamma"
    w: "sqrt(2 * ((1 + 3 * chi / 2) * kx**2 + (1 - chi / 2) * ky**2) / (kx**2 + ky**2))"
    k_f: "1.0e-12"
    k_b: "0"
    q: "sqrt(kx**2 + ky**2)"
  output_map:
    lam_q: omega_phi
  regime:
