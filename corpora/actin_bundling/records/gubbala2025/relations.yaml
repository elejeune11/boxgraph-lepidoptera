    a_0 = b_1 = -a_1 [J/m^3], sharing the exact log-slope (3*phi^2 - 1)/(phi^2 - 1) across
    spinodal (phi < 1/sqrt(3)) and metastable (1/sqrt(3) < phi < 1) compositions.
  assumptions:
    - "Symmetric double-well scale a_1 = -1 J/m^3, b_1 = 1 J/m^3 on phi in [0.1, 0.9] away from the binodal zero phi = 1."

