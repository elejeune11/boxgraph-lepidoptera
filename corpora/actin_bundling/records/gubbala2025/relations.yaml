    Quantifies how accurately Zwicker's linearized Gibbs-Thomson common-tangent formula
    phi_-^B = psi + gamma*beta_Z/R (Eq. 6, Appendix A Eq. A2) reproduces Gubbala's exact nonlinear
    nematic-coupled Ld binodal phi_Ld_eq(beta) across Gubbala's entire physical stiffness range
    beta in [1, 50] under the leading-order common-tangent shift correspondence psi = 1,
    gamma*beta_Z/R = 1/(4*beta). Even down to Gubbala's default beta = 1 (where exact
    phi_Ld_eq = 1.2233 vs. linearized 1.2500 — the 22% binodal overshoot that drives |Q|_eq =
    1.0543 > 1 and high-actin E_3 = E_1 ill-posedness in gubbala2025/q_coupled_binodal_illposedness),
    the maximum relative difference is 2.19%, falling as O(1/beta^2) to 0.0012% at beta = 50.
  assumptions:
    - "Linearized common-tangent mapping gamma*beta_Z/R = 1/(4*beta) at psi = 1 across beta in [1, 50]; tolerance 0.025 covers the 2.19% nonlinear quartic correction at beta = 1."

