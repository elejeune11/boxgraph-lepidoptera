  reason: >
    Verifies Gubbala's single-field passive Cahn-Hilliard reduction in the low-to-moderate wavenumber
    regime (omega_phi < omega_xx): turning off anchoring (chi -> 0) and nematic order (beta -> oo,
    decoupling Q_xx via c_12*c_21 = 2*gamma*k^2/beta -> 0) at matched timescale gamma = 1 reduces
    Gubbala's leading eigenvalue sigma_max identically to Frohoff's decoupled passive variational
    Cahn-Hilliard dispersion lam_plus = -k^2*(2 + k^2) evaluated at the binodal a = -1, phi_bar_1 = 1.
  assumptions:
    - "Matched timescales gamma = 1 and wavevector box kx, ky in [0.1, 0.65] so k^2 <= 0.845 and omega_phi <= 2.40 < 4 <= omega_xx (sigma_max tracks the conserved lipid branch)."

