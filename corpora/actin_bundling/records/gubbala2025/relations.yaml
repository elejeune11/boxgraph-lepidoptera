# --- 5. Common-Tangent Binodal Shifts: Nematic Coupling vs. Gibbs-Thomson Laplace Pressure ---

- id: rel_zwicker2015_binodal_reduces_coexistence_eqA1
  kind: reduces_to
  a: gubbala2025/coupled_binodal_coexistence
  b: zwicker2015/coexistence_exact_eqA1
  mapping:
    b: "2"
    psi: "1"
    gamma: "1"
    R: "4 * beta"
  output_map:
    phi_minus_B: phi_Ld_eq
  limit:
    beta: "oo"
  regime:
    beta: [5.0, 50.0]
    E1: [0.1, 2.0]
    E3: [0.0, 0.5]
  provenance: proposed
  reason: >
    Connects both papers' exact nonlinear common-tangent coexistence solvers
    (gubbala2025/coupled_binodal_coexistence and zwicker2015/coexistence_exact_eqA1). In Gubbala,
    nematic ordering lowers the Ld bulk free energy by -1/beta relative to the isotropic Lo phase,
    shifting the dense-phase binodal to phi_Ld_eq = 1 + 1/(4*beta) + O(1/beta^2); in Zwicker
    Appendix A Eq. (A1), capillary Laplace pressure 2*gamma/R shifts the dense-phase binodal to
    phi_-^B = 1 + gamma*beta_Z/R + O((gamma*beta_Z/R)^2) (at psi = 1, beta_Z = 2/b). Matching
    gamma*beta_Z/R = 1/(4*beta) (via b = 2, psi = 1, gamma = 1, R = 4*beta), both solvers agree
    through O(1/beta) and converge quadratically (O(1/beta^2)) to the shared flat-interface passive
    Cahn-Hilliard dense binodal phi_Ld = phi_-^B = 1 as beta -> oo (R -> oo).
  assumptions:
    - "Uncoupled / flat-interface limit beta -> oo with matched O(1/beta) common-tangent shift gamma*beta_Z/R = 2*gamma/(b*psi*R) = 1/(4*beta) at psi = 1."

- id: rel_zwicker2015_binodal_approx_gibbs_thomson_eq6
  kind: approximated_by
  a: gubbala2025/coupled_binodal_coexistence
  b: zwicker2015/gibbs_thomson_eq6
  mapping:
    psi: "1"
    gamma_beta: "1"
    R: "4 * beta"
  output_map:
    phi_minus_B: phi_Ld_eq
  regime:
    beta: [1.0, 50.0]
    E1: [0.1, 2.0]
    E3: [0.0, 0.5]
  tolerance: 0.025
