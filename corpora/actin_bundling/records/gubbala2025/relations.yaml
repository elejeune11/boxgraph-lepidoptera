# --- 1. 2D Continuum Nematic Pure-Bend Elasticity <-> 2D Flat-Sheet Ring Bending ---

- id: rel_graham2023_ring_confinement_scales_elastic_eq5
  kind: scales_as
  a: graham2023/ring_confinement_bending_energy
  b: gubbala2025/elastic_free_energy_eq5
  mapping:
    E1: "k_b / 3e5"
    E3: "k_b / 3e5"
    Q_xx: "0.5"
    Q_xy: "0"
    dQxx_x: "0"
    dQxx_y: "0"
    dQxy_x: "1 / R"
    dQxy_y: "0"
  output_map:
    f_elastic: E_bend_0
  regime:
    k_b: [73000.0, 2200000.0]
    L: [1.0, 1.0]
    R: [0.5, 4.0]
  provenance: proposed
  reason: >
    Establishes the exact continuum-to-discrete 2D bending elasticity equivalence between Graham's
    2D flat-sheet circular confinement bending energy per unit contour length
    e_bend = E_bend_0 / L = (1/2)*(k_b / R^2) = T_ring * (1/2)*(k_{b,fil}/delta)/R^2 (SI Sec. 2.1,
    2.6, 2.8, Eq. 1) and Gubbala's 2D Landau-de Gennes nematic elastic free energy density Eq. (5)
    f_elastic = (1/2)*E_1*(d_i Q_jk)^2 + (1/2)*E_3*Q_ij*(d_i Q_kl)*(d_j Q_kl). For a tangential
    pure-bend director field wrapping a circular droplet of radius R (theta = 0 locally,
    d_x theta = 1/R, d_y theta = 0, zero splay), Gubbala Eq. (3) yields Q_xx = S/2, Q_xy = 0,
    d_x Q_xy = S/R (all other gradients zero), so Eq. (5) evaluates independently to
    f_elastic = (E_1 + E_3*Q_xx)*(d_x Q_xy)^2 = (1/2)*k_{33,2D}/R^2 with exact 2D Frank bend
    constant k_{33,2D} = 2*E_1*S^2 + E_3*S^3 = 3*E_1 at Gubbala's actin parameters (E_3 = E_1,
    S = 1). Identifying Graham's areal bend stiffness k_{b,fil}/delta = 4863 pN*nm (= 1182 k_B T)
    with Gubbala's 2D Frank bend constant k_{33,2D,phys} = a_0*l_c^2*(3*E_1) (mapping k_b linearly
    into E_1 = E_3 and 1/R linearly into dQxy_x with zero formula copying) yields exact (+1, -2)
    log-slope agreement in (k_b, R) to machine precision (~4.4e-13) across 1-30 F-actin filaments
    and R in [0.5, 4.0] um.
  assumptions:
    - "Pure-bend tangential director configuration around a circular droplet (theta = 0, d_x theta = 1/R, d_y theta = 0, zero splay) at Gubbala's default actin parameters E_3 = E_1, S = 1 (Q_xx = 1/2)."
    - "Unit ring contour length L = 1 um and fixed ribbon width T_ring so k_b = T_ring*k_{33,2D,phys} maps linearly into E_1 = E_3; reference scale factor 3e5 drops out in scales_as."

