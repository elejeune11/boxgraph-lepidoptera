# Unstated inputs required to run and check the paper's models quantitatively.

- id: S_probe_nonunit
  quantity: nematic_order_magnitude
  unit: dimensionless
  printed: "2"
  basis: "Test value S != 1 to distinguish the printed lower bound -1.5*S (p. 3) from the algebraically consistent lower bound -1.5/S derived from Eq. (6), since both coincide at S = 1."
  alternatives: ["0.5", "1.5"]
  stands_for: "S in the E_3/E_1 stability bounds on p. 3 (6245)"

- id: theta_director_x
  quantity: director_angle
  unit: dimensionless
  printed: "0"
  basis: "Director aligned parallel to the x-axis (n = (1, 0)), as assumed in SI Sec. 3.3 (p. 15) base state."
  alternatives: ["0.785398", "1.570796"]
  stands_for: "director angle theta in Eq. (3) and SI Sec. 3.3"

- id: kx_probe_lsa
  quantity: wavenumber_dimless
  unit: dimensionless
  printed: "1"
  basis: "Representative dimensionless longitudinal wavenumber k_x = 1 (interface-width scale k ~ 1/l_c) for evaluating linear stability rates in Eqs. (S24)-(S28)."
  alternatives: ["0.1", "2"]
  stands_for: "k_x in SI Eqs. (S24)-(S28)"

- id: ky_probe_lsa
  quantity: wavenumber_dimless
  unit: dimensionless
  printed: "0"
  basis: "Purely longitudinal perturbation (k_y = 0) along the director axis to probe the x-axis branch of Eqs. (S27)-(S28)."
  alternatives: ["1", "2"]
  stands_for: "k_y in SI Eqs. (S24)-(S28)"

- id: ky_probe_transverse
  quantity: wavenumber_dimless
  unit: dimensionless
  printed: "1"
  basis: "Purely transverse perturbation (k_x = 0, k_y = 1) perpendicular to the director axis to probe the destabilizing branch (1 - chi/2) and (E_1 - E_3/sqrt(beta)) of Eqs. (S27)-(S28)."
  alternatives: ["0.1", "2"]
  stands_for: "k_y in SI Eqs. (S24)-(S28)"

- id: kx_probe_zero
  quantity: wavenumber_dimless
  unit: dimensionless
  printed: "0"
  basis: "Zero longitudinal wavenumber paired with transverse k_y > 0 to isolate the transverse branch of Eqs. (S27)-(S28)."
  alternatives: ["0.5", "1"]
  stands_for: "k_x in SI Eqs. (S24)-(S28)"

- id: grad_phi_probe
  quantity: spatial_gradient_dimless
  unit: dimensionless
  printed: "1"
  basis: "Unit dimensionless interface concentration gradient |grad phi| = 1 across an interface of width l_c = 1 for evaluating local free-energy densities Eqs. (2), (7), (S11)-(S13)."
  alternatives: ["0.5", "2"]
  stands_for: "|grad phi| in Eqs. (2), (7), (S11)-(S13)"

- id: grad_phi_zero
  quantity: spatial_gradient_dimless
  unit: dimensionless
  printed: "0"
  basis: "Zero transverse concentration gradient d_y phi = 0 paired with d_x phi = 1 to evaluate Eq. (7) and Eq. (S13) for an interface normal along x."
  alternatives: ["0.5", "1"]
  stands_for: "d_y phi in Eq. (7) and SI Eq. (S13)"

- id: grad_Q_probe
  quantity: spatial_gradient_dimless
  unit: dimensionless
  printed: "0.5"
  basis: "Representative dimensionless nematic gradient |d_i Q_jk| = 0.5 for evaluating local elastic free energy density Eq. (5) / Eq. (S14)."
  alternatives: ["0.1", "1"]
  stands_for: "d_i Q_jk in Eq. (5) / Eq. (S14)"

- id: circle_radius_probe
  quantity: domain_size
  unit: um
  printed: "5"
  basis: "Representative Lo domain radius R = 5 um (midpoint of reported 1-10 um on p. 4) to evaluate parametric boundary curvature Eq. (S2) on a circle."
  alternatives: ["1", "10"]
  stands_for: "radius R of a circular domain boundary g(u) = (R cos u, R sin u) in SI Sec. 2.3 Eq. (S2)"

- id: dim_M_probe
  quantity: dimensional_mobility
  unit: um^2/s
  printed: "1"
  basis: "Illustrative lipid mobility M = 1 um^2/s (typical fluid membrane diffusivity order of magnitude; paper does not assign dimensional values in SI Sec. 3.2) to verify dimensionless group formulas."
  alternatives: ["0.1", "10"]
  stands_for: "M in SI Sec. 3.2 Eq. (S17)"

- id: dim_Gamma_probe
  quantity: dimensional_rotational_rate
  unit: 1/s
  printed: "100"
  basis: "Illustrative nematic relaxation rate Gamma = 100 s^-1 chosen with M = 1 um^2/s and lambda_tilde = 0.1 um^2 so that gamma = M / (lambda_tilde * Gamma) = 0.1 matches the paper's chosen gamma = 0.1."
  alternatives: ["10", "1000"]
  stands_for: "Gamma = t_Q^-1 in SI Sec. 3.2 Eq. (S18)"

- id: dim_lambda_tilde_probe
  quantity: dimensional_surface_tension_param
  unit: um^2
  printed: "0.1"
  basis: "Illustrative dimensional gradient coefficient lambda_tilde = 0.1 um^2 (interface width l_c ~ 0.32 um) so gamma = M/(lambda_tilde*Gamma) = 0.1."
  alternatives: ["0.01", "1"]
  stands_for: "lambda_tilde in SI Sec. 3.2 Eq. (S17)"

- id: dim_alpha_probe
  quantity: dimensional_coupling_param
  unit: um^2
  printed: "0.1"
  basis: "Illustrative dimensional anchoring coefficient alpha = 0.1 um^2 chosen so chi = alpha / l_c^2 = 1 matches the paper's chi = 1."
  alternatives: ["0.05", "0.2"]
  stands_for: "alpha in SI Sec. 3.2 Eqs. (S17)-(S18)"

- id: dim_L1_probe
  quantity: dimensional_elastic_constant
  unit: um^2
  printed: "0.01"
  basis: "Illustrative dimensional Frank constant L_1 = 0.01 um^2 chosen so E_1 = L_1 / l_c^2 = 0.1 matches the paper's low-actin E_1 = 0.1."
  alternatives: ["0.2", "0.05"]
  stands_for: "L_1 in SI Sec. 3.2 Eq. (S18)"

- id: dim_L3_probe
  quantity: dimensional_elastic_constant
  unit: um^2
  printed: "0.01"
  basis: "Illustrative dimensional cubic elastic constant L_3 = 0.01 um^2 chosen so E_3 = L_3 / l_c^2 = 0.1 matches E_3 = E_1 = 0.1."
  alternatives: ["0.2", "0.05"]
  stands_for: "L_3 in SI Sec. 3.2 Eq. (S18)"

- id: E3_high_actin_stabilized
  quantity: elastic_constant_dimless
  unit: dimensionless
  printed: "1.8"
  basis: "Slightly reduced cubic elastic constant E_3 = 0.9 * E_1 = 1.8 (below the true coupled-binodal stability limit E_1 / |Q|_eq = 2 / 1.0543 = 1.897) to keep the high-actin 2D PDE simulation stable past t = 1000 without high-k blowup."
  alternatives: ["1.5", "1.9"]
  stands_for: "E_3 in high-actin PDE run (paper prints E_3 = E_1 = 2, which exceeds E_1/|Q|_eq at the coupled binodal phi_Ld = 1.223)"

- id: pde_t_end_dimless
  quantity: time_dimless
  unit: dimensionless
  printed: "1200"
  basis: "Paper does not state the exact dimensionless time-to-seconds mapping factor used to rescale Fig. 3 (only shows t up to 30000 in Fig. S6); t_end = 1200 captures well-developed intermediate coarsening on a CPU-affordable budget."
  alternatives: ["600", "2000"]
  stands_for: "dimensionless final simulation time for coarsening exponent fit"

- id: pde_t_fit_start_dimless
  quantity: time_dimless
  unit: dimensionless
  printed: "200"
  basis: "Start of intermediate coarsening power-law fitting window after initial spinodal/nematic nucleation transient (analogous to t0 = 720 s in Fig. 3)."
  alternatives: ["100", "400"]
  stands_for: "dimensionless start time for power-law coarsening fit"

- id: sf_peak_k_probe
  quantity: wavenumber_dimless
  unit: dimensionless
  printed: "0.2"
  basis: "Representative peak wavenumber k_max = 0.2 (consistent with Fig. S6A left at t = 1000-10000) to evaluate structure-factor domain size Eq. (S1) and self-similar scaling Eq. (S34)."
  alternatives: ["0.1", "0.5"]
  stands_for: "peak wavenumber k_max of S(k, t) in SI Eqs. (S1), (S33)-(S34)"

- id: fig3_inset_t0_added
  quantity: time
  unit: s
  printed: "11"
  basis: "Unstated normalization time t_0 of the Fig. 3 bottom inset ('No actin' control experiment); the first plotted square sits at R/R_0 = 1.0 near t ~ 11 s (axis starts at 10 s)."
  alternatives: ["10", "12"]
  stands_for: "t_0 in R(t)/R_0 = (t/t_0)^(1/3) for Fig. 3 bottom inset (p. 6)"

- id: figS2_left_t0_added
  quantity: time
  unit: s
  printed: "60"
  basis: "Unstated early normalization time t_0 of SI Fig. S2 left panel, where the plotted curves and alpha = 1/3 dashed reference line cross R(t)/R_0 = 1.0 near t = 60 s (1 min)."
  alternatives: ["55", "65"]
  stands_for: "t_0 in R(t)/R_0 = (t/t_0)^alpha for SI Fig. S2 left panel (p. 18)"
