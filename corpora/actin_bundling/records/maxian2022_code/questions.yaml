    truncates second-end binding to `CLBounds = [rl - 2*sqrt(kT/Kc), rl + 2*sqrt(kT/Kc)]`
    ([10, 90] nm at k_B T = 4e-3 pN*um), while EndedCrossLinkers.cpp:532-539 leaves unbinding
