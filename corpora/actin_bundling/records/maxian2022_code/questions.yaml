    and KirchoffFiberRectangularKeav_Twist.m:48) calls `getGrandMloc(...)`, which does not exist
    anywhere in commit 38c2fc8 (the function was renamed to `AsymptoticLocalMobility.m`), so
    StraightMobility.m errors out immediately if executed unmodified in MATLAB.
  citation:
