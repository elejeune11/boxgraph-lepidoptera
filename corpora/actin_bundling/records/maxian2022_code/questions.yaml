  text: >
    In C++ SBT mode (SingleFiberMobilityEvaluator.cpp:134-135, VectorMethods.cpp:228-244), the
    matrix M_SBT * W_tilde^-1 is symmetrized and its eigenvalues are clamped from below at a
    hardcoded DIMENSIONAL floor `_EigValThres = 0.001` (FibCollocationDiscretization.py:370,
    commented `# Could cause convergence issues`) that is NOT rescaled by 1/(mu*L). At eps = 0.010,
    N_tau = 16 (N_x = 17), delta = 0.1, symmetrized M_par * W_tilde^-1 develops negative
    eigenvalues (-0.478 at mu = 1 Pa*s; -4.776 at cytoplasm viscosity mu = 0.1 Pa*s). Clamping
    these negative modes to +0.001 creates a spurious 1/0.001 = 1000 spike in MForce^-1,
    collapsing the Table S1 parallel mobility coefficient beta(0.010) from 0.2230 to 0.0020
    (-99.1%) at mu = 0.1 Pa*s (and to 0.1905, -14.6%, at mu = 1.0 Pa*s; directly fails scalar
    cmp_cpp_eps0010_beta, while table-wide cmp_cpp_table_s1_beta is masked by 1-sig-fig input
    rounding on delta = 0.1). For actin aspect ratios (eps <= 0.008), all raw eigenvalues stay
    >= 8.89 um/(pN*s) >> 0.001, so clamping never triggers and C++ SBT agrees with Table S1
    within 2.5e-3 (with small residual -0.0006 differences in gamma(0.004) from retained
    O(a_RPY^2/s_bar^2) RPY doublet terms on lines 268, 325).
  citation:
    file: Python/FibCollocationDiscretization.py
    lines: "370"
    quote: "self._EigValThres = 0.001 # Could cause convergence issues"

