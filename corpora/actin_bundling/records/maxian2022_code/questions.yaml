- id: q_lie_trotter_vs_strang_splitting
  kind: unexplained_difference
  about:
    - sm_c_two_fiber_lie_trotter_port
    - sm_c_two_fiber_strang_variant
    - run_smc_lt_large
    - run_smc_strang_large
    - cmp_lt_large_std_end_vs_gibbs
    - cmp_lt_large_std_bd_vs_gibbs
    - cmp_strang_large_std_end_vs_gibbs
    - cmp_strang_large_std_mid_vs_gibbs
    - ref_smc_lt_dt_end
    - ref_smc_strang_dt_end
  text: >
    Critical integrator divergence between the released code and companion paper maxian2022:
    maxian2022 Sec. 2.4 (p. 5) claims a 2nd-order 3-step Strang splitting (Brownian dt/2 ->
    CL + deterministic dt -> Brownian dt/2), and Fig. S1 caption (p. 21) explicitly states that
    spring lengths were measured at the midpoint after step 1. In contrast, the released code
    (TemporalIntegrator.py:441-499) explicitly comments `# Brownian update (always first order)`
    and executes a 1st-order Lie-Trotter splitting: a single full-step `BrownianUpdate(dt)`
    followed by deterministic `updateAllFibers(dt)`, with NO second Brownian half-step anywhere
    in the codebase. Consequences verified quantitatively on the SM Sec. C two-fiber benchmark
    (dt = 0.0025 s vs exact Eq. S13 mean = 0.06381 um, std = 0.01786 um):
    (1) At the end of each step (where FixedDynamicLinkNetwork.py:208 records LinkStrains),
    the released code's Lie-Trotter splitting contracts the spring severely, collapsing std_x
    to ~0.0069 um (-61.3% narrower than Eq. S13) and mean_x to 0.0543 um (-14.9%); even at
    dt = 0.0005 s, end-of-step std_x is still ~0.0160 um (-10.3%).
    (2) Measured immediately after BrownianUpdate(dt) (or at Strang's midpoint after step 1,
    which shares the identical stationary Markov chain), std_x inflates to ~0.0221 um (+24%
    broader than Eq. S13), directly reproducing both the lowered peak in maxian2022 Fig. S1
    right and the +24.7% variance inflation flagged in maxian2022/q_sm_c_dt_stability_and_strang_splitting.
    (3) When the paper's true 3-step Strang splitting is implemented and sampled at the full-step
    endpoint after step 3 (sm_c_two_fiber_strang_variant), std_x stays within -4.5% of Eq. S13
    even at dt = 0.0025 s (0.0171 um) and -2.3% at dt = 0.0005 s (0.0175 um).
  citation:
    file: Python/TemporalIntegrator.py
    lines: "441-445"
    quote: "# Brownian update (always first order)"

