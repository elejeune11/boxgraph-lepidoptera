    broken MATLAB function reference in commit 38c2fc8:
    (1) Exact Table S1 formula: RegularizeS.m:9-19 (= FibCollocationDiscretization.py:168-176)
    defines the unprinted Sec. 2.1 endpoint regularization s_bar(s) = w(s)*s + (1-w(s)^2)*delta*L/2
    with w(s) = tanh((eta+1)/delta) - tanh((eta-1)/delta) - 1, eta = 2s/L - 1, delta = 0.1 (reflected
    symmetrically on s > L/2). Coupled with AsymptoticLocalMobility.m:51 (algebraically identical to
    Keller-Rubinow c(s_bar)(I+tau*tau)+(I-3*tau*tau)) and StokesletFinitePartMatrix.m (N = 32,
    Chebyshev kind 1), StraightMobility.m reproduces ALL 21 Table S1 values (alpha, beta, gamma
    for eps = 0.01..0.001) to all 4 printed decimals (max error <= 5e-5), gives 3*alpha+beta = 1.6698
    (reproducing Eq. 22's 1.67), and confirms anisotropy (alpha+beta)/alpha = 1.650 (17.5% below
    maxian2022 p. 9's slender-asymptotic claim of 2).
