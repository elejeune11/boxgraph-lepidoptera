id: cpp_cl_kinetics_ssa_port
name: C++ EndedCrossLinkers.cpp 4-reaction Gillespie SSA & detailed-balance port
role: model
stated:
  file: Python/cppmodules/EndedCrossLinkers.cpp
  lines: "524-530"
  quote: "double Energy = 0.5*_KStiffness*(r-_restlen)*(r-_restlen);"
  where: "Port of Python/cppmodules/EndedCrossLinkers.cpp:96-271, 524-539 and Python/DoubleEndedCrossLinkedNetwork.py:96-121"
equation: "k_1 = k_on*ds, k_2 = k_off*n_free, k_3(r) = k_on,s*ds*exp(-K_c*(r-ell)^2/(2*k_B*T))*n_free (for |r-ell| <= deltaL), k_4 = 2*k_off,s*m; steric cap T_i = n_free_i + m <= ceil(ds/c_w)"
inputs:
  k_on: {quantity: cl_first_end_binding_rate, unit: 1/(um*s)}
  k_off: {quantity: cl_unbinding_rate, unit: 1/s}
  k_on_s: {quantity: cl_second_end_binding_rate, unit: 1/(um*s)}
  k_off_s: {quantity: cl_unbinding_rate, unit: 1/s}
  ds: {quantity: binding_site_spacing, unit: um}
  c_w: {quantity: binding_site_width, unit: um}
  K_c: {quantity: cl_spring_stiffness, unit: pN/um}
  ell: {quantity: cl_rest_length, unit: um}
  kBT: {quantity: thermal_energy, unit: pN*um}
  r_sep: {quantity: cl_stretch_length, unit: um}
outputs:
  site_binding_rate_at_r: {quantity: cl_site_binding_rate, unit: 1/s}
  mean_free_ends: {quantity: mean_bound_count, unit: dimensionless}
  mean_double_links: {quantity: mean_bound_count, unit: dimensionless}
  exact_gibbs_double_links: {quantity: mean_bound_count, unit: dimensionless}
  db_rel_error: {quantity: relative_error, unit: dimensionless}
settings:
  t_sim: 2000.0
  burn_t: 50.0
  seed: 0
stochastic: true
