id: sm_c_two_fiber_lie_trotter_port
name: TemporalIntegrator.py 1st-order Lie-Trotter two-fiber Brownian-spring port (SM Sec. C)
role: model
stated:
  file: Python/TemporalIntegrator.py
  lines: "441-499"
  quote: "# Brownian update (always first order)"
  where: "Port of TemporalIntegrator.py:441-499 (single BrownianUpdate(dt) then deterministic updateAllFibers(dt)), fiberCollection.py:549-577, FiberCollectionC.cpp:444-486, 837-962, and CrossLinkForceEvaluator.cpp:65-148 applied to maxian2022 SM Sec. C two-fiber rigid-rod benchmark"
equation: "Step 1: BrownianUpdate(dt) via Rodrigues(Omega_B*dt), mid += U_B*dt; Step 2: deterministic spring force F_1 = K_c*(1 - ell/x)*(X_2 - X_1), T_1 = (arm*tau_1) x F_1, Rodrigues(Omega_D*dt), mid += U_D*dt"
inputs:
  L: {quantity: fiber_length, unit: um}
  eps: {quantity: fiber_aspect_ratio, unit: dimensionless}
  mu: {quantity: dynamic_viscosity, unit: Pa*s}
  K_c: {quantity: cl_spring_stiffness, unit: pN/um}
  ell: {quantity: cl_rest_length, unit: um}
  kBT: {quantity: thermal_energy, unit: pN*um}
  delta: {quantity: relative_regularization_length, unit: dimensionless}
  sigma_rel: {quantity: relative_gaussian_width, unit: dimensionless}
outputs:
  mean_x_end: {quantity: mean_spring_extension, unit: um}
  std_x_end: {quantity: std_spring_extension, unit: um}
  mean_x_after_bd: {quantity: mean_spring_extension, unit: um}
  std_x_after_bd: {quantity: std_spring_extension, unit: um}
settings:
  dt: 0.0005
  N: 50
  smooth_force: true
  t_sim: 40.0
  burn_t: 1.0
  seed: 0
stochastic: true
