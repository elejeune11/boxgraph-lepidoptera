id: gibbs_boltzmann_spring_pdf_ref
name: exact Gibbs-Boltzmann 3D spring extension equilibrium moments (maxian2022 Eq. S13 reference)
role: processing
described_from: maxian2022
stated:
  none: "Analytical target P(x) = Z x^2 exp(-K_c (x - ell)^2 / (2 k_B T)) from companion paper maxian2022 Eq. S13 (p. 20 / SI-3), computed here to evaluate the released code's Lie-Trotter vs Strang time integrators."
equation: "P(x) = Z x^2 exp(-K_c (x - ell)^2 / (2 k_B T)), <x> = int_0^inf x P(x) dx, std_x = sqrt(<(x - <x>)^2>)"
inputs:
  K_c: {quantity: cl_spring_stiffness, unit: pN/um}
  ell: {quantity: cl_rest_length, unit: um}
  kBT: {quantity: thermal_energy, unit: pN*um}
outputs:
  mean_x: {quantity: mean_spring_extension, unit: um}
  std_x: {quantity: std_spring_extension, unit: um}
settings:
  n_quad: 20001
stochastic: false
