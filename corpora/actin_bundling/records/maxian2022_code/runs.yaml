# ==============================================================================
# 3. C++ EndedCrossLinkers.cpp 4-reaction Gillespie SSA detailed-balance checks
# ==============================================================================

- id: run_cl_ssa_inside
  model: cpp_cl_kinetics_ssa_port
  inputs:
    k_on: strain_konCL
    k_off: strain_koffCL
    k_on_s: strain_konSecond
    k_off_s: strain_koffSecond
    ds: clnet_nb_ds
    c_w: strain_bindingSiteWidth
    K_c: strain_Kspring
    ell: strain_rl
    kBT: paper_kBT_table1
    r_sep: r_sep_inside_cutoff
  settings: {t_sim: 10000.0, burn_t: 50.0}
  replicates: 5
  outputs:
    site_binding_rate_at_r: ssa_in_rate
    mean_free_ends: ssa_in_free
    mean_double_links: ssa_in_dbl
    exact_gibbs_double_links: ssa_in_gibbs
    db_rel_error: ssa_in_err
  note: "5-replicate SSA inside Brownian capture window (r = 0.07 um <= 0.09 um, t_sim = 10000 s), verifying exact truncated-Poisson Gibbs-Boltzmann detailed balance."

- id: run_cl_ssa_outside
  model: cpp_cl_kinetics_ssa_port
  inputs:
    k_on: strain_konCL
    k_off: strain_koffCL
    k_on_s: strain_konSecond
    k_off_s: strain_koffSecond
    ds: clnet_nb_ds
    c_w: strain_bindingSiteWidth
    K_c: strain_Kspring
    ell: strain_rl
    kBT: paper_kBT_table1
    r_sep: r_sep_outside_cutoff
  settings: {t_sim: 10000.0, burn_t: 50.0}
  replicates: 5
  outputs:
    site_binding_rate_at_r: ssa_out_rate
    mean_free_ends: ssa_out_free
    mean_double_links: ssa_out_dbl
    exact_gibbs_double_links: ssa_out_gibbs
    db_rel_error: ssa_out_err
  note: "5-replicate SSA outside Brownian capture cutoff (r = 0.095 um > 0.090 um, t_sim = 10000 s): binding is zeroed while unbinding stays active, truncating Gibbs-Boltzmann equilibrium to 0."

