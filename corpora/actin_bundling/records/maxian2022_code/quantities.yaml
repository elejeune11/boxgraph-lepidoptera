- id: fiber_radius
  name: actin fiber radius
  dimension: "[length]"
  description: Cross-sectional radius a (or equivalent RPY blob radius a_RPY) of a slender filament.

- id: fiber_length
  name: actin fiber length
  dimension: "[length]"
  description: Contour length L of a single actin filament.

- id: fiber_aspect_ratio
  name: fiber aspect ratio
  dimension: "dimensionless"
  description: Slenderness aspect ratio epsilon = a / L of an actin filament.

- id: rpy_radius_factor
  name: RPY-to-SBT radius conversion factor
  dimension: "dimensionless"
  description: Conversion factor aRPYFac = exp(3/2)/4 linking physical fiber radius a to equivalent RPY blob radius a_hat.

- id: fiber_count
  name: number of fibers
  dimension: "dimensionless"
  description: Total number F (nFib) of actin filaments in the periodic simulation box.

- id: domain_extent
  name: simulated domain extent
  dimension: "[length]"
  description: Periodic box side length L_d (or L_dx in rectangular domains).

- id: dynamic_viscosity
  name: fluid dynamic viscosity
  dimension: "[mass] / [length] / [time]"
  description: Dynamic viscosity mu of the suspending fluid.

- id: bending_stiffness
  name: fiber bending stiffness
  dimension: "[force] * [length] ** 2"
  description: Flexural rigidity E_b (kappa) of an actin filament.

- id: persistence_length
  name: fiber persistence length
  dimension: "[length]"
  description: Thermal persistence length l_p = E_b / (k_B T) of an actin filament.

- id: thermal_energy
  name: thermal energy
  dimension: "[energy]"
  description: Thermal energy scale k_B T.

- id: chebyshev_points
  name: number of Chebyshev collocation points
  dimension: "dimensionless"
  description: Number N of tangent-vector Chebyshev nodes (or N_x = N + 1 position nodes) discretizing each filament.

- id: upsample_points
  name: number of direct quadrature upsampling points
  dimension: "dimensionless"
  description: Number of oversampled Chebyshev nodes NupsampleForDirect used for RPY/nonlocal sums.

- id: relative_regularization_length
  name: dimensionless endpoint regularization length
  dimension: "dimensionless"
  description: Regularization parameter delta (deltaLocal) in RegularizeS / initLocalcvals smoothing c(s) near fiber endpoints.

- id: regularized_arclength
  name: regularized arclength coordinate
  dimension: "[length]"
  description: Endpoint-regularized arclength coordinate s_bar(s; delta) returned by initLocalcvals / RegularizeS.

- id: relative_gaussian_width
  name: dimensionless Gaussian force-spreading width
  dimension: "dimensionless"
  description: Ratio sigma / L of the Gaussian cross-linker force-smoothing standard deviation to fiber length.

- id: eigenvalue_threshold
  name: mobility eigenvalue clamping floor
  dimension: "[length] / [force] / [time]"
  description: Dimensional minimum eigenvalue threshold _EigValThres (or smallest raw eigenvalue of symmetrized M W_tilde^-1) in SingleFiberMobilityEvaluator.cpp.

- id: svd_tolerance
  name: pseudo-inverse SVD relative tolerance
  dimension: "dimensionless"
  description: Singular-value truncation tolerance svdTolerance used in SolveWithPseudoInverse.

- id: rigid_rotation_angle_cap
  name: rigid Brownian rotation angle threshold
  dimension: "dimensionless"
  description: Dimensionless threshold svdRigid controlling svdRigidTol = k_B T dt / svdRigid^2 for rigid-body Brownian pseudo-inversion.

- id: gmres_tolerance
  name: GMRES convergence tolerance
  dimension: "dimensionless"
  description: Relative residual tolerance GMREStolerance in TemporalIntegrator.py.

- id: gmres_iter_cap
  name: GMRES maximum iteration cap
  dimension: "dimensionless"
  description: Maximum GMRES iteration limit itercap in TemporalIntegrator.py.

- id: time_step
  name: integration time step
  dimension: "[time]"
  description: Numerical integration time step dt (or network subcycling interval Networkdt, or stability limit dt_max).

- id: time_step_ratio
  name: network-to-fiber time step ratio
  dimension: "dimensionless"
  description: Integer ratio NetworkStepEvery = int(Networkdt / dt) between cross-linker/turnover updates and fiber time steps.

- id: time_step_stability_fraction
  name: integration time step as percentage of stability limit
  dimension: "dimensionless"
  description: Ratio 100 * dt / dt_max expressing a simulation time step as a percentage of the explicit stability limit.

- id: time
  name: simulation time
  dimension: "[time]"
  description: Elapsed or final simulation time t_f.

- id: turnover_time
  name: mean filament turnover lifetime
  dimension: "[time]"
  description: Mean actin filament lifetime tau_f (turnovertime) in FiberBirthAndDeath.

- id: cl_spring_stiffness
  name: cross-linker spring stiffness
  dimension: "[force] / [length]"
  description: Hookean spring stiffness K_c (Kspring) of a doubly-bound cross-linker.

- id: cl_rest_length
  name: cross-linker rest length
  dimension: "[length]"
  description: Equilibrium rest length ell (rl) of a cross-linker spring.

- id: cl_length_fluctuation
  name: cross-linker length fluctuation or binding half-window
  dimension: "[length]"
  description: Binding search half-window delta_ell (sqrt(k_B T / K_c) non-Brownian or 2 sqrt(k_B T / K_c) Brownian).

- id: cl_stretch_length
  name: cross-linker end-to-end distance
  dimension: "[length]"
  description: Instantaneous distance r (or binding cutoff bound r_lo, r_hi) between two cross-linker binding sites.

- id: cl_first_end_binding_rate
  name: cross-linker first-end binding rate per unit length
  dimension: "1 / [length] / [time]"
  description: Rate k_on (konCL) per unit contour length at which a free cross-linker end binds a filament.

- id: cl_second_end_binding_rate
  name: cross-linker second-end binding rate per unit length
  dimension: "1 / [length] / [time]"
  description: Rest-length rate k_on,s (konSecond) per unit contour length at which the second end of a singly-bound cross-linker binds a partner filament.

- id: cl_unbinding_rate
  name: cross-linker unbinding rate
  dimension: "1 / [time]"
  description: Unbinding rate k_off (koffCL) or k_off,s (koffSecond) of one cross-linker end.

- id: cl_site_binding_rate
  name: site-level cross-linker binding rate
  dimension: "1 / [time]"
  description: Discrete per-site transition rate k_on * Delta s_u or k_on,s(r) * Delta s_u passed into EndedCrossLinkers.cpp.

- id: binding_site_width
  name: actin-binding site steric width
  dimension: "[length]"
  description: Cross-linker steric width c_w (bindingSiteWidth) capping bound ends per site.

- id: binding_site_count
  name: number of uniform binding sites per fiber
  dimension: "dimensionless"
  description: Number N_u (Nuniformsites) of uniformly spaced discrete binding sites along a filament.

- id: binding_site_spacing
  name: uniform binding site spacing
  dimension: "[length]"
  description: Uniform arclength spacing Delta s_u = L / (N_u - 1) between discrete binding sites.

- id: max_links_per_site
  name: maximum bound ends per binding site
  dimension: "dimensionless"
  description: Steric cap maxPerSite = ceil(Delta s_u / c_w) enforced per binding site in EndedCrossLinkers.cpp.

- id: max_links_per_fiber
  name: maximum cross-links per fiber
  dimension: "dimensionless"
  description: Maximum number of bound cross-link ends per fiber (maxPerSite * N_u).

- id: bundle_link_separation
  name: minimum arclength separation between bundle-forming links
  dimension: "[length]"
  description: Threshold distance d_bund (bunddist) required between two cross-links connecting two fibers to count as a bundle edge.

- id: min_bundle_size
  name: minimum filaments per bundle
  dimension: "dimensionless"
  description: Minimum number of connected filaments F_B (minPerBundle) defining a bundle.

- id: bundle_count
  name: number of detected bundles
  dimension: "dimensionless"
  description: Number of connected filament clusters of size >= minPerBundle detected by FindBundles / BundleOrderParameters.

- id: orientation_parameter
  name: bundle nematic orientation parameter
  dimension: "dimensionless"
  description: Maximum eigenvalue of the bundle tangent covariance matrix Q in BundleOrderParameters (Eq. 21), in [1/3, 1].

- id: link_density_per_fiber
  name: mean bound cross-link ends per fiber
  dimension: "dimensionless"
  description: Average number of bound cross-link ends per fiber (2 C / F), numerically equal to 2 C / (F L) when L = 1 um.

- id: initial_mesh_size
  name: initial actin network mesh size
  dimension: "[length]"
  description: Characteristic unbundled filament spacing ell_m = sqrt(V / (F L)).

- id: mobility_alpha
  name: perpendicular translational mobility coefficient
  dimension: "dimensionless"
  description: Dimensionless rigid-rod perpendicular translational mobility coefficient alpha(epsilon) in Eq. 12 / Table S1.

- id: mobility_beta
  name: anisotropic translational mobility coefficient
  dimension: "dimensionless"
  description: Dimensionless rigid-rod parallel-excess translational mobility coefficient beta(epsilon) in Eq. 12 / Table S1.

- id: mobility_gamma
  name: rotational mobility coefficient
  dimension: "dimensionless"
  description: Dimensionless rigid-rod rotational mobility coefficient gamma(epsilon) in Eq. 12 / Table S1.

- id: mobility_trace_coefficient
  name: translational mobility trace coefficient
  dimension: "dimensionless"
  description: Dimensionless trace coefficient mu L tr(N_tt) = 3 alpha + beta in Eq. 22.

- id: mobility_anisotropy_ratio
  name: parallel-to-perpendicular mobility eigenvalue ratio
  dimension: "dimensionless"
  description: Ratio (alpha + beta) / alpha of parallel to perpendicular translational eigenvalues of N_tt.

- id: msd_slope
  name: 3D mean-square-displacement rate
  dimension: "[length] ** 2 / [time]"
  description: Rate 6 D_t = 2 k_B T (3 alpha + beta) / (mu L) of 3D rigid-fiber center-of-mass diffusion.

- id: mesh_diffusion_time
  name: mesh-size diffusion time
  dimension: "[time]"
  description: Characteristic time tau_m = ell_m^2 / (6 D_t) for a free rigid fiber to diffuse one mesh size.

- id: torque_arm_length
  name: effective cross-linker torque lever arm
  dimension: "[length]"
  description: Effective distance from fiber center s = L/2 to the Gaussian-smoothed cross-linker force centroid in calcCLForces.

- id: mean_spring_extension
  name: mean steady-state spring extension
  dimension: "[length]"
  description: Time-averaged or equilibrium mean end-to-end distance <x> of the two-fiber endpoint spring (SM Sec. C).

- id: std_spring_extension
  name: standard deviation of steady-state spring extension
  dimension: "[length]"
  description: Time-averaged or equilibrium standard deviation sigma_x of the two-fiber endpoint spring (SM Sec. C).

- id: mean_bound_count
  name: mean bound cross-linker occupancy
  dimension: "dimensionless"
  description: Equilibrium or SSA time-averaged mean number of singly-bound ends per site or doubly-bound links per site pair.

- id: relative_error
  name: dimensionless relative error
  dimension: "dimensionless"
  description: Relative deviation |computed - exact| / exact checking SSA equilibrium against analytical Gibbs-Boltzmann occupancy.

- id: error_bar_sem_multiplier
  name: SEM error-bar multiplier
  dimension: "dimensionless"
  description: Factor multiplying std / sqrt(nTri) when plotting error bars in ProcessPythonNetwork.m.
