- id: q_twist_radian_unit_and_high_Rstar
  kind: reading
  about: [twist_energy_per_monomer, twist_energy_per_monomer_half, twist_energy_per_fascin, twist_energy_per_fascin_half, Delta_theta_max, E_twist_per_fascin_printed, Rstar_fig3b]
  citation: {page: 2, printed_page: "8820", quote: "increase in overtwist ⌬␪: Etwist ⫽ ␶(⌬␪)2d⫺1.", where: text}
  text: >
    Three additional conventions/reading caveats apply to the twist-energy calculation (pp. 2-3):
    (1) Unstated radian conversion: p. 2 reports Delta_theta ≈ 1 deg in degrees and immediately prints
    E_twist = tau*(Delta_theta)^2*d^(-1) without stating that Delta_theta must be converted to radians
    (pi/180; plugging degrees directly inflates E_twist by (180/pi)^2 ≈ 3283). (2) Unstated per-fascin
    conversion and high-R* non-constancy: the paper never prints the formula dividing per-monomer E_twist
    by R* and k_B*T nor specifies which R* yields '≈ 10 k_B T'; evaluating E_mon/(R* k_B T) at the paper's
    own printed R* = 0.5 (Fig. 3B-C, where -28/13 overtwist is saturated) gives only 4.06 k_B T without 1/2
    (2.03 k_B T with 1/2), so constancy near 10 k_B T above R* = 0.25 fails unless bound fascin is capped at
    1:4.5 saturation rather than the paper's 1:1 R*. (3) Mixed evidence on the 1/2 variant: because the
    printed formula without 1/2 reproduces '≈ 10 k_B T' at saturation (9.14-9.34 k_B T) whereas the 1/2
    variant gives 4.57-4.67 k_B T (matching ~8.5-10 k_B T only at intermediate R* = 0.05-0.10 in Fig. 3D),
    it is uncertain whether the missing 1/2 was a typographical misprint or literally omitted in the
    authors' saturation estimate.

- id: q_scaling_approx_provenance
  kind: reading
  about: [diameter_scaling_Rstar, diameter_filament_scaling, Rstar_filament_scaling, D_Rstar_exponent, D_nf_exponent]
  citation: {page: 1, printed_page: "8819", quote: "with the fascin concentration D ⬇ (R*)0.3", where: text}
  text: >
    Both D ≈ (R*)^0.3 (pp. 1-2) and D ≈ n_f^(1/2) (SI p. 5) are printed with the approximation symbol '≈'
    rather than a proportionality sign ('~' or '∝'), omitting dimensional prefactors with units of length
    (nm) even though D is measured in nm while R* and n_f are dimensionless. The record therefore assigns
    prefactor: unknown to these scaling laws and to their derived composition R* ~ n_f^(5/3). In addition,
    SI p. 5 states that D(R*) from Fig. 1C is translated into R*(n_f) in Fig. S1 using D ≈ n_f^(1/2) and
    maximum thickness ≈ 20 filaments, without stating the exact plateau diameter D_max (nm) used to anchor
    n_f = 20 * (D / D_max)^2.

- id: q_SI_hex_derivation_and_R_quantity_boundary
  kind: reading
  about: [bundle_geometry_saturation, bundle_geometry_bulk_limit, Rstar_plateau, u_figS1_assumed, sigma_surface_included, sigma_inside_only]
  citation: {page: 5, printed_page: "SI 1", quote: "ncl /nat ⫽ R ⫽ 1/u共3 ⫾ 3.5nf⫺1/2兲.", where: "SI Methods"}
  text: >
    Two issues in the SI bundle-geometry derivation and record schema: (1) Exact hexagonal-shell bond
    counting for k concentric shells (n_f = 1 + 3k(k+1), 6(2k+1) exposed surface binding sites, and
    3n_f - 3(2k+1) internal shared cross-linkers per hexagonal unit, with 2k+1 = sqrt((4n_f - 1)/3))
    gives R = (1/u)*(3 +/- 3*sqrt(4/3 - 1/(3*n_f))*n_f^(-1/2)). The printed coefficient 3.5 is the
    rounded large-n_f asymptote 2*sqrt(3) = 3.464, which causes small-n_f artifacts: the inside-only (-)
    branch turns unphysically negative for n_f < (3.5/3)^2 = 1.361 (producing the steep drop near n ~ 1.4
    in Fig. S1), and at n_f = 1 (u = 13) the surface-included (+) branch gives 6.5/13 = 0.500 instead of
    the exact 6/13 = 0.462. (2) Reading disagreement on output quantity: bundle_geometry_saturation declares
    output quantity molar_ratio_abp_actin (R, matching SI p. 5 text), whereas Fig. S1 (p. 6) plots the
    exact same blue/green curves on the R* (effective_bound_ratio) axis (with a caption wording slip
    calling R* 'Effective cross-linker over bound actin monomer ratio') and pp. 1-2 compare full occupation
    at n_f = 20 (0.291 surface-included, 0.171 inside-only, 0.231 bulk at u = 13) to Rstar_plateau (≈ 0.25).
    Keeping R and R* as distinct quantities prevents directly comparing bundle_geometry_saturation against
    Rstar_plateau or digitized Fig. S1 curves unless bridged.

- id: q_fig3a_inset_12_21_degeneracy
  kind: possible_error
  about: [hexagonal_bragg_peaks, q10_saxs]
  citation: {page: 2, printed_page: "8820", quote: "q10, q11 ⫽ 公3q10, q20 ⫽ 2q10, and q21 ⫽ 公7q10", where: "text / Fig. 3A Inset (p. 3)"}
  text: >
    For a 2D hexagonal lattice, Bragg wavevectors satisfy q_hk = q_10 * sqrt(h^2 + h*k + k^2), so the
    (2,1) and (1,2) reflections are symmetry-equivalent and strictly degenerate at q = sqrt(7)*q_10 =
    1.548 nm^-1 (for q_10 = 0.585 nm^-1), and no 2D hexagonal Bragg reflection exists between
    sqrt(7)*q_10 = 1.548 nm^-1 and q_30 = 3*q_10 = 1.755 nm^-1 (since h^2 + h*k + k^2 = 8 has no integer
    solution). Nevertheless, Fig. 3A Inset (p. 3) labels (2,1) and (1,2) as two separate peaks at distinct
    wavevectors between helical peak c (1.46 nm^-1) and (3,0), indicating a crystallographic mislabeling
    in Fig. 3A Inset.

