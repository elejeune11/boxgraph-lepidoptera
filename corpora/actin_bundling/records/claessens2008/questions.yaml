    predict a dimensional diameter in nm; qualitatively, Claessens's hydrated 2-shell fascin width
    50-57 nm falls within 40-100 nm while its TEM plateau ~28 nm lies below it).
    (2) grason2007/factin_twist_pitch_ikawa2007 (~100 nm, origin: reported, Ikawa et al. 2007 [ref-21
    in claessens2008, ref-22 in grason2007], braided bundles of 2-3 F-actin filaments in Mg2+):
