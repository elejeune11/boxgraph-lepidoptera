    fabricating unmeasured inputs, or conflating rigid crystalline fascin bundling with flexible
    filamin fluid nematic phases:
    (1) Bundle-thickness and discrete-packing models (5: diameter_filament_scaling,
    diameter_scaling_Rstar, hexagonal_shell_filaments, filament_number_from_diameter_ratio, and
    non-runnable gaussian_tem_profile_fit) vs. weirich2017/bundle_initial_radius_main ("~200" nm,
    bundle_radius): excluded on four independent grounds — (a) distinct physical quantities
    (bundle_diameter D = 2*R_0 vs. bundle_radius R_0, factor of 2); (b) both runnable diameter
    models (D ~ n_f^(1/2) and D ~ (R*)^0.3) have prefactor: unknown and cannot predict an absolute
    single-scalar size (moreover "~200" carries an approximate tilde with no precision interval,
    and weirich2017 reports no R_0(f_fil) or R_0(n_f) curve); (c) weirich2017 measures none of the
    required inputs (filaments_per_bundle n_f, bound cross-linker ratio R*, hexagonal shells k, or
    multi-ABP diameter ratios); and (d) orthogonal material physics with a 7x-14x size gap
    (Weirich's transient filamin fluid bundles have 2*R_0 ~ 400 nm, 14.2x above Claessens's TEM
    plateau 28.14 nm and 6.87x above hydrated n_f = 20 area-equivalent diameter 58.23 nm; at
    Weirich's 250 uM internal actin density, R_0 = 200 nm holds n_f = 51.1 filaments at 53.3 nm
    hexagonal spacing, where Claessens's TEM [6.310*sqrt(n_f)] and hydrated [13.02*sqrt(n_f)]
    anchors give 45.1 nm and 93.1 nm [8.87x and 4.30x thinner], whereas packing Claessens's
    a_H = 12.4 nm crystal into R_0 = 200 nm would require n_f = 944 filaments, 47.2x above
    Claessens's n_f = 20 twist-arrest cap).
    (2) Cross-linker stoichiometry and hexagonal-saturation models (7: molar_ratio_fascin_actin,
    effective_bound_ratio, dimensionless_kd_scale, bundle_geometry_saturation,
    bundle_geometry_bulk_limit, saturation_ratio_from_stoichiometry, Rstar_filament_scaling) vs.
