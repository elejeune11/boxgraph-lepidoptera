- id: q_SI_R_vs_Rstar_and_surface_coeff
  kind: reading
  about: [bundle_geometry_saturation, bundle_geometry_bulk_limit, u_figS1_assumed, u_hex_unit_range]
  citation: {page: 5, printed_page: "SI 1", quote: "ncl /nat ⫽ R ⫽ 1/u共3 ⫾ 3.5nf⫺1/2兲.", where: "SI Methods"}
  text: >
    SI Methods (p. 5) writes the saturation geometry equation for total cross-linker/actin ratio
    n_cl^t / n_a^t = R = (1/u)*(3 +/- 3.5*n_f^(-1/2)), while Fig. S1 (p. 6) plots the same blue (+)
    and green (-) curves against R* (bound ratio). Geometrically, for a k-shell hexagonal cluster
    (n_f = 1 + 3k(k+1)), the surface term coefficient approaches 2*sqrt(3) = 3.464 (rounded to 3.5).
    Also, holding u = 13 in Fig. S1 implies bulk saturation R_inf = 3/13 = 0.231 (1:4.33), slightly
    above the 1:4.5 stoichiometry (u = 13.5, R_inf = 0.222) stated on SI p. 5.

- id: q_droplet_ring_formula_and_fig2e_factor
  kind: unstated_model
  about: [droplet_ring_filament_number, droplet_critical_concentration, nf_fig2e_line, M_actin_added, d_monomer]
  citation: {page: 2, printed_page: "8820", quote: "mass of F-actin within a drop or, equivalently, its total length, L", where: text}
  text: >
    Page 2 describes in words how total F-actin length L and single-ring filament number n_f are
    computed from c_a and droplet diameter D_d, without printing the equation, G-actin molar mass
    (M_actin), monomer axial rise (2.75 vs 2.9 nm), or polymerized fraction. For an equatorial ring
    of circumference pi*D_d containing all actin in a sphere of volume (pi/6)*D_d^3, n_f = 20 predicts
    D_d = 17.0-17.5 um at c_a = 0.01 mg/ml, whereas the dotted n_f = 20 line in Fig. 2E visually
    crosses c_a = 0.01 mg/ml near D_d ~ 24-25 um (~sqrt(2) larger in D_d, i.e., a factor of ~2 in n_f).
    Digitizing Fig. 2E in the digitize stage will test this discrepancy quantitatively.

- id: q_tem_vs_saxs_bundle_diameter
  kind: unexplained_difference
  about: [gaussian_tem_profile_fit, hexagonal_lattice_spacing, hexagonal_shell_filaments, aH_hex_saxs, hex_shells_max, D_fil_fig2d_text]
  citation: {page: 1, printed_page: "8819", quote: "fitting a Gaussian to the intensity profiles (Fig. 1C Inset)", where: text}
  text: >
    SAXS yields a hexagonal center-to-center spacing a_H = 12.4 nm (p. 2), so a 2-shell hexagonal
    bundle (19 filaments, 5 filaments across) has a hydrated diameter of ~50-57 nm (4*a_H + d_actin
    ≈ 57 nm vertex-to-vertex; ~50 nm flat-to-flat). In contrast, the TEM plateau diameter D in Fig. 1C
    saturates near ~28 nm (about half the hydrated width). Because the paper does not state which
    Gaussian width metric (sigma, 2*sigma, or FWHM) defines D, nor quantify TEM dehydration shrinkage,
    gaussian_tem_profile_fit is non-runnable and this ~2x width discrepancy remains unresolved.

- id: q_four_sphere_model_unstated
  kind: unstated_model
  about: [four_sphere_diffraction_model, q_helical_a_bundled, q_helical_b_bundled, q_helical_c_bundled, Delta_theta_max]
  citation: {page: 2, printed_page: "8820", quote: "extracted by fitting the four-sphere model (33)", where: text}
  text: >
    The four-sphere diffraction model (Al-Khayat et al., 1995 [ref-33]) used to fit axial SAXS wedges
    (Fig. 3C) and extract overtwist Delta_theta(R*) (Fig. 3D) is not stated mathematically in this paper:
    sphere coordinates, radii, radial weighting, disorder factors, bundle-lattice convolution, and wedge
    integration angles are all omitted, making four_sphere_diffraction_model non-runnable here.

- id: q_tau_typesetting_and_d_monomer
  kind: reading
  about: [tau_actin, d_monomer]
  citation: {page: 2, printed_page: "8820", quote: "from the torsional stiffness ␶ ⫽ 810⫺26 Nm2", where: text}
  text: >
    On p. 2 (right column), torsional stiffness is typeset as 'tau = 810^-26 Nm^2' with the
    multiplication sign omitted (recorded as 8 x 10^-26 N*m^2, matching ref-35, Tsuda et al. 1996).
    In the same sentence, the actin monomer axial spacing is printed as d = 2.9 nm rather than the
    standard 2.75 nm F-actin axial rise (note that with 2.75 nm and q_10 = 0.585 nm^-1, the convoluted
