  citation: {page: 3, printed_page: "8821", quote: "explanation for the finite sizes observed for F-actin bundled in the", where: text}
  text: >
    No cross-record validations are entered in validations.yaml for claessens2008 models against
    grason2007 data, because grason2007 is a pure theory paper with only two reported experimental
    measurements (both from cited counterion-condensation studies) and none of claessens2008's models
    predicts either measurement on its own conditions:
    (1) grason2007/factin_diameter_lai2007 (40 to 100 nm, origin: reported, Lai et al. 2007 [ref-12 in
    both papers], nontoroidal multivalent-counterion F-actin bundles): although claessens2008 (p. 3)
    suggests that helical-packing frustration explains finite sizes for F-actin bundled by ABPs or
    condensing agents (citing ref-12), none of claessens2008's three models outputting bundle_diameter
    can validly test this scalar range: gaussian_tem_profile_fit is non-runnable and fits TEM image
    profiles rather than predicting bundle width; diameter_scaling_Rstar (D ≈ (R*)^0.3, role: fit,
    prefactor: unknown) is an empirical fascin fit requiring bound fascin ratio R*, which is undefined
    for Lai et al.'s counterion-condensed bundles (no fascin), and carries an unknown prefactor; and
    diameter_filament_scaling (D ≈ n_f^(1/2), prefactor: unknown) requires filament count n_f, which is
    unstated in grason2007 for Lai et al. (substituting Claessens's fascin saturation n_f = 20 would
    conflate fascin bundles with more tightly packed counterion bundles), and lacks a dimensional
    lattice-spacing prefactor (so any single scalar datum fixes the unknown prefactor and yields no
    verdict). hexagonal_shell_filaments outputs dimensionless D_fil = 2*k + 1 (filaments across) rather
    than bundle_diameter in nm (no model in claessens2008 multiplies D_fil or n_f^(1/2) by a_H to
    predict a dimensional diameter in nm; qualitatively, Claessens's hydrated 2-shell fascin width
    50-57 nm falls within 40-100 nm while its TEM plateau ~28 nm lies below it).
    (2) grason2007/factin_twist_pitch_ikawa2007 (~100 nm, origin: reported, Ikawa et al. 2007 [ref-21
    in claessens2008, ref-22 in grason2007], braided bundles of 2-3 F-actin filaments in Mg2+):
    claessens2008 has no model outputting whole-bundle helical braiding pitch (bundle_twist_pitch =
    2*pi/Omega); its helical models (helical_symmetry_ratio, helical_overtwist_from_symmetry) describe
    internal single-filament crystallographic overtwist (-13/6 -> -28/13, Delta_theta = 0.989 deg per
    monomer, internal overtwist wavelength 2*pi*d/Delta_theta = 1056 nm, an order of magnitude longer
    and physically distinct from whole-bundle braiding; see q_grason2007_pitch_and_twist_conventions),
    and "~100" carries no printed precision.
    (3) Non-measured entries in grason2007/data.yaml: factin_chain_spacing (~1 to 10 nm),
    factin_linker_binding_energy_kBT (~10), and factin_persistence_length (~1 to 10 um) have
    origin: estimated (order-of-magnitude literature input assumptions, not measurements; note that
    claessens2008's SAXS-derived aH_hex_saxs = 12.4 nm from hexagonal_lattice_spacing on Claessens's own
    q10_saxs and DeltaG_fascin_sign_corrected_pred = 15.02 k_B T from Kd_fascin = 0.3 uM lie just above
    those generic F-actin estimates), while factin_lambda_3perp_est (~100 nm),
    factin_cholesteric_pitch_est (~1 to 10 nm), and factin_stability_threshold (≳ 1) are grason2007
    model predictions (origin: predicted) with no matching output quantity in claessens2008.

