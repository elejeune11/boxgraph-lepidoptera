    - grason2007/q_audit_cholesteric_pitch_2pi_convention
  citation: {page: 2, printed_page: "8820", quote: "gradually changes from the original ⫺13/6 to an overtwisted", where: text}
  text: >
    Three incompatible pitch, twist-rate, and angle conventions prevent direct parameter substitution
    between claessens2008's helical-symmetry models and grason2007's chirality/torsion models:
    (1) 2*pi cholesteric pitch convention: grason2007 Eq. (3) writes (nabla_perp x t - z_hat/P)^2
    without 2*pi, so P = q_0^(-1) is an inverse twist wavenumber (inferred as P ~ 1-10 nm from
    Ikawa et al.'s 2*pi/Omega ~ 100 nm; see grason2007/q_audit_cholesteric_pitch_2pi_convention).
    The corresponding full 2*pi cholesteric pitch is 2*pi*P ~ 6-60 nm, overlapping F-actin's two-start
    long-pitch helical repeat in claessens2008 (13*d = 37.7 nm half-pitch / 75.4 nm full pitch for
    -13/6; 14*d = 40.6 nm / 81.2 nm for -28/13), whereas Claessens's helical_symmetry_ratio M = p/s
    counts monomers per left-handed genetic turn rather than a cholesteric pitch.
    (2) Internal overtwist rate vs. bundle braiding rate: claessens2008's -13/6 -> -28/13 transition
    gives Delta_theta = 0.989 deg = 0.01726 rad per monomer (d = 2.9 nm), an internal single-filament
    overtwist rate omega_fil = Delta_theta/d = 0.00595 nm^-1 (full overtwist wavelength
    2*pi/omega_fil = 1056 nm), an order of magnitude smaller than the whole-bundle braiding rate
    Omega = 2*pi/(100 nm) = 0.0628 nm^-1 from Ikawa et al. used in grason2007/cholesteric_pitch_from_torsion.
    (3) Angle symbol theta: claessens2008 uses theta_0, theta_1, Delta_theta (printed in degrees,
    converted to radians in E_twist) for monomer-to-monomer azimuthal rotation about the single-filament
    axis, whereas grason2007 uses theta = Omega*R (dimensionless radians) for the tilt angle of
    outermost braided filaments relative to the bundle centerline.

