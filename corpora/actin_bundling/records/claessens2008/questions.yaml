- id: q_grason2007_overtwist_vs_supertwist_mechanics
  kind: unexplained_difference
  about:
    - twist_energy_per_monomer
    - twist_energy_per_monomer_half
    - helical_overtwist_from_symmetry
    - bundle_geometry_saturation
    - rel_grason_eq5_scales_claessens_twist
    - rel_grason_eq9_scales_claessens_twist
    - ref-20
    - grason2007/columnar_elastic_energy_eq5
    - grason2007/solid_elastic_energy_eq9
    - grason2007/columnar_free_energy_eq6
    - grason2007/solid_harmonic_min_corrected
  citation: {page: 4, printed_page: "8822", quote: "can, in principle, result in a supertwist of the bundles", where: text}
  text: >
    Claessens et al. (2008) cite Grason & Bruinsma (2007) [ref-20] on pp. 1 and 4 as an alternative
    thermodynamic mechanism for finite chiral bundle size, explicitly contrasting single-filament
    helical overtwisting (claessens2008) with whole-bundle supertwisting/braiding (grason2007).
    Four structural differences prevent any same_as or reduces_to equivalence between their elastic
    models in their physical operating regimes:
    (1) Twist degree of freedom and bundle-radius scaling: in claessens2008, straight unbraided
    filaments overtwist internally around their own axes by Delta_theta ~= 1 deg/monomer, so
    E_twist = tau*(Delta_theta)^2/d (or (1/2)*tau*(Delta_theta)^2/d) is independent of bundle radius
    (energy density ~ R^0, total energy per length ~ n_f ~ R^2) and cannot by itself yield a
    preferred equilibrium radius R_0; in grason2007, rigid whole-bundle torsion Omega tilts outer
    filaments by theta = Omega*R, making solid-rod torsion scale as mu_par_bar*(Omega*R)^2 ~ R^2
    (total ~ R^4) and anharmonic in-plane shear scale as mu_perp_bar*(Omega*R)^4 ~ R^4 (total ~ R^6),
    which generates a finite R_0 only through anharmonicity.
    (2) Sign and stiffness scaling of elastic energy: in claessens2008, twisting is a positive energy
    cost (+tau*(Delta_theta)^2/d, scaling as +tau^1) paid by achiral fascin binding (Delta G ~= 15 k_B T);
    in grason2007, chiral torque -gamma*Omega drives spontaneous twist with negative minimized elastic
    energy density E_elast(Omega_0) < 0 (-(3/4)*gamma*Omega_0 ~ -mu_perp_bar^(-1/3) in columnar Eq. 5;
    -gamma^2/(4*mu_par_bar*R^2) ~ -mu_par_bar^(-1) in harmonic solid Eq. 9), so increasing elastic
    stiffness decreases |E_elast| rather than increasing it.
    (3) Overlap restricted to the achiral harmonic limit: the quadratic twist-energy scaling shared by
    grason2007 Eqs. (5) and (9) and claessens2008 twist_energy_per_monomer
    (rel_grason_eq5_scales_claessens_twist, rel_grason_eq9_scales_claessens_twist) holds only for
    gamma -> 0 and Omega*R << 1, a limit Grason & Bruinsma explicitly leave behind (K2 << K3, finite
    gamma, quartic shear/bend) to obtain finite-size chiral bundles.
    (4) Extensive vs. intensive surface-to-bulk energy: in the achiral limit (f_0 -> 0), Grason's Eq. (6)
    Delta F/L = -pi*R^2*epsilon + 2*pi*R*Sigma matches Claessens's inside-only hexagonal bond-counting
    model bundle_geometry_saturation (sigma = -1: R_inside = (3 - 3.5*n_f^(-1/2))/u) multiplied by
    -n_f*Delta E/d (yielding epsilon = 3*Delta E*rho_0/(u*d) and Sigma/epsilon = 3.5/(6*sqrt(pi*rho_0))
    = 0.306*a_H, matching Grason's microscopic Sigma/epsilon ~ d at Delta E* = Delta E), while
    Claessens's surface-occupied branch (sigma = +1) corresponds qualitatively to Grason's reduced
    surface-energy penalty Delta E* < Delta E required for finite-bundle stability Sigma_c/Sigma > 1.

