    conflate fascin bundles with more tightly packed counterion bundles), and lacks a dimensional
    lattice-spacing prefactor (so any single scalar datum fixes the unknown prefactor and yields no
    verdict). hexagonal_shell_filaments outputs dimensionless D_fil = 2*k + 1 (filaments across) rather
