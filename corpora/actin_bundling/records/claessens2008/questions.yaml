    Three minor reading-judgement tensions retained from the first reader without modifying scope:
    (1) droplet_ring_filament_number and droplet_critical_concentration are marked from_words: true rather
    than reconstructed, although p. 2 states no formula, G-actin molar mass, polymerized fraction, or
    equatorial ring circumference pi*D_d ('The bundle radius can be measured'); notably, the Fig. 2E
    n_f = 20 line satisfies c_a * D_d^2 ≈ 5.8 (mg/ml)*um^2, almost exactly 2.0x the equatorial-ring
    model's 2.89 (mg/ml)*um^2 (consistent with e.g. 2*pi*D_d instead of pi*D_d or a factor-of-2 strand
    convention). (2) helical_symmetry_ratio returns positive M = p/s (+2.167, +2.154) while the paper
    prints negative -13/6 and -28/13 for left-handedness; also, Fig. S2 (Right, -28/13) orange-boxes
    monomers {1, 6, 7, 10, 11, 15} spanning 15 monomers (n_unit = 15 vs n_unit_28_13_added = 14), and for
    n_unit = 15 with phi_0 = 0 deg (matching the -13/6 panel's orientation), monomer 15 aligns exactly at
    180 deg, reducing the max mismatch to 8.57 deg (total 25.71 deg) vs the paper's 10.7 deg (38.6 deg).
    (3) binding_energy_fascin (described_from: ref-36), DeltaG_fascin_printed (from_source: ref-36), and
    Kd_fascin (conditions: {temperature: 20 degC}): ref-36 (Ono et al., 1997) supplies K_d = 0.3 uM rather
    than the textbook relation Delta G = k_B T ln(K_D), and 20 C is this paper's polymerization temperature
    (p. 4) rather than a stated measurement temperature of K_d in ref-36.

- id: q_fig1c_figS1_slope_and_Dmax_anchor
  kind: unexplained_difference
  about: [diameter_scaling_Rstar, Rstar_filament_scaling, D_fig1c_measured, D_fig1c_powerlaw_fit, Rstar_figS1_experiment, Rstar_figS1_powerlaw]
  citation: {page: 2, printed_page: "8820", quote: "scaling of D ⬇ (R*)0.3 (Fig. 1C)", where: "Fig. 1C / Fig. S1"}
  text: >
    Calibrated digitization of Fig. 1C (1200 dpi) and Fig. S1 (900 dpi) yields three quantitative
    findings informing q_scaling_approx_provenance and q_tem_vs_saxs_bundle_diameter:
    (1) The dashed straight power-law line drawn in Fig. 1C has log-log slope 0.3269 (20 clean dashes,
    max residual 0.56 px, D(R*=1) = 38.00 nm), and the red dashed line in Fig. S1 has log-log slope
    1.563 (33 dashes, close to 1/(2*0.3269) = 1.529), whereas the text rounds the exponent to 1 sig fig
    (0.3, whose exact inverse is 5/3 = 1.667), causing cmp_D_scaling_fig1c_fit and
    cmp_Rstar_scaling_figS1_line to report not reproduced on shape against exact exponents 0.3 and 5/3.
    (2) Pairing all 8 experimental circles one-to-one between Fig. 1C (R*, D) and Fig. S1 (n, R*)
    settles the unstated conversion anchor in q_scaling_approx_provenance: all 8 points satisfy
    n = 20 * (D / D_max)^2 with D_max = 28.22 ± 0.02 nm (0.07% scatter across all 8 points, i.e.,
    D = 6.310 * n^(1/2) nm). (3) The TEM plateau diameters at R* = 0.70 and 0.90 measure
    28.14 [27.15, 29.22] nm and 28.04 [26.92, 29.22] nm (unstated vertical error bars), confirming the
    ~2x discrepancy relative to the ~50-57 nm hydrated width implied by SAXS a_H = 12.4 nm.

- id: q_fig2e_quantified_factor_2p22
  kind: unexplained_difference
  about: [droplet_critical_concentration, droplet_ring_filament_number, ca_fig2e_nf20_boundary, ca_fig2e_single_ring_max, ca_fig2e_two_bundle_min]
  citation: {page: 2, printed_page: "8820", quote: "dotted line represents nf ⫽ 20.", where: "Fig. 2E"}
  text: >
    1200 dpi calibrated digitization of Fig. 2E quantitatively settles q_droplet_ring_formula_and_fig2e_factor:
    the plotted dashed n_f = 20 boundary line has log-log slope -2.014 and satisfies
    c_a * D_d^2 = 6.43 ± 0.04 (mg/ml)*um^2 across D_d = 6.5-23 um (15 clean dashes). The equatorial-ring
    model droplet_critical_concentration (n_f = 20, M_actin = 42 kDa, d = 2.9 nm) predicts
    c_a * D_d^2 = 2.886 (mg/ml)*um^2 — uniformly 2.23x lower than the plotted boundary line (2.11x even
    with d = 2.75 nm), yielding not reproduced (0/8) in cmp_droplet_crit_ca_fig2e_line. The measured
    phase-transition brackets at c_a = 0.02-0.10 mg/ml give rightmost single-ring (red) droplets at
    c_a * D_d^2 = 4.73-10.25 (mg/ml)*um^2 and leftmost two-bundle (green) droplets at
    c_a * D_d^2 = 8.53-21.74 (mg/ml)*um^2 (cmp_droplet_crit_ca_fig2e_single_ring: 0/5 not reproduced),
