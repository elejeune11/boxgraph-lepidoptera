  kind: possible_error
  about: [Rstar_fig1ab_text, ca_fig1a, ca_fig1b]
  citation: {page: 1, printed_page: "8819", quote: "decrease in the number of actin bundles per unit volume", where: text}
  text: >
    Page 1 (right column) states that when actin concentration is increased at R* ≈ 1, a 'decrease'
    in the number of actin bundles per unit volume is observed (Fig. 1 A and B). This contradicts both
    mass conservation and the Fig. 1 caption on p. 2, which states that increasing c_a from 0.04 mg/ml
    to 0.1 mg/ml 'merely increases the number of actin bundles per unit volume'.

