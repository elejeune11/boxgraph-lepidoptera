- id: q_binding_energy_sign_and_standard_state
  kind: possible_error
  about: [binding_energy_fascin, binding_energy_fascin_sign_corrected, DeltaG_fascin_printed, Kd_fascin, c0_standard_state]
  citation: {page: 3, printed_page: "8821", quote: "kBTln(KD)⬇15 kBT per bound fascin molecule", where: text}
  text: >
    Page 3 prints Delta G = k_B T ln(K_D) ≈ 15 k_B T (also writing K_D here vs K_d on p. 4).
    Two issues arise: (1) ln(K_D) requires an unstated standard-state reference concentration
    c_0 (with c_0 = 1 M, ln(0.3e-6 / 1) = -15.02, whereas a mole-fraction standard state c_0 = 55.5 M
    gives -19.04); and (2) for K_d = 0.3 uM << 1 M, +k_B T ln(K_D / 1 M) = -15.02 k_B T is negative,
    opposite in sign to the positive binding energy gain '≈ 15 k_B T' printed in the same sentence.
    The positive value corresponds to -Delta G = -k_B T ln(K_D / 1 M) (variant binding_energy_fascin_sign_corrected).

- id: q_twist_energy_missing_half_and_constancy
  kind: possible_error
  about: [twist_energy_per_monomer, twist_energy_per_monomer_half, twist_energy_per_fascin, twist_energy_per_fascin_half, E_twist_per_fascin_printed, Delta_theta_max]
  citation: {page: 2, printed_page: "8820", quote: "increase in overtwist ⌬␪: Etwist ⫽ ␶(⌬␪)2d⫺1.", where: text}
  text: >
    Page 2 prints E_twist = tau*(Delta_theta)^2*d^(-1), omitting the factor of 1/2 from linear torsion
    elasticity U = (1/2)*tau*(Delta_theta)^2/d. With tau = 8e-26 N*m^2, d = 2.9 nm, T = 20 C, and
    Delta_theta = 1 deg (0.989 deg from -13/6 -> -28/13), the printed formula without 1/2 yields
    2.08 k_B T (2.03 k_B T) per monomer, or 9.34 k_B T (9.14 k_B T) per bound fascin at 1:4.5 saturation
    (8.30 k_B T at plateau R* = 0.25), matching the printed '≈ 10 k_B T' per bound fascin, whereas the
    1/2-corrected variant yields 4.67 k_B T (4.57 k_B T at 1:4.5; 4.15 k_B T at R* = 0.25). Moreover,
    the paper claims E_twist is constant per bound fascin and smaller than Delta G (~15 k_B T) for all
    concentrations, yet at intermediate R* = 0.05-0.10 in Fig. 3D (Delta_theta ~ 0.7-0.95 deg), the
    printed formula without 1/2 gives ~17-20 k_B T per bound fascin (exceeding 15 k_B T), whereas with
    the 1/2 factor it gives ~8.5-10 k_B T at R* = 0.05-0.10 and drops to ~4.7 k_B T at saturation.

- id: q_Rstar_stoichiometry_contradiction
  kind: possible_error
  about: [effective_bound_ratio, bundle_geometry_saturation, actins_per_fascin_sat, Rstar_fig1ab_caption, Kd_fascin]
  citation: {page: 4, printed_page: "8822", quote: "R ⫹ Kd/ca) ⫺ ((1 ⫹ R ⫹ Kd/ca)2 ⫺ 4R)1/2)", where: Methods}
  text: >
    The Methods equation R* = (1/2)*((1 + R + K_d/c_a) - ((1 + R + K_d/c_a)^2 - 4R)^(1/2)) is the
    quadratic mass-action solution for 1:1 ligand-to-actin-monomer stoichiometry, which satisfies
    R* < min(1, R) strictly for all finite R (making the literal 'R* = 1' in Figs. 1A-B and 2A-C
    unattainable at finite fascin concentration) and saturates at R* -> 1. In contrast, SI Methods
    (p. 5) states that fascin binding saturates at 1 fascin per ~4.5 actin monomers (R_sat ~ 0.222,
    or R = 0.291 at n_f = 20 with surface occupation in Fig. S1). Because 1:1 stoichiometry was used
    to compute R*, the highest experimental points in Figs. 1C, 3A, 3D, and S1 reach R* ~ 0.7-1.0,
    far exceeding the paper's own SI full-occupation upper bound.

