    profiles rather than predicting bundle width; diameter_scaling_Rstar (D ≈ (R*)^0.3, role: fit,
    prefactor: unknown) is an empirical fascin fit requiring bound fascin ratio R*, which is undefined
    for Lai et al.'s counterion-condensed bundles (no fascin), and carries an unknown prefactor; and
    diameter_filament_scaling (D ≈ n_f^(1/2), prefactor: unknown) requires filament count n_f, which is
