  citation: {page: 1, printed_page: "8819", quote: "of in-plane shear elastic stresses (20), which can result in braided", where: text}
  text: >
    Comparing Claessens et al.'s (2008) fascin bundle-diameter measurements and scaling against
    Grason & Bruinsma's (2007) equilibrium-radius models reveals an incompatible dependence on bound
    cross-linker density R* alongside a partial order-of-magnitude overlap at saturation:
    (1) Cross-linker density scaling: identifying axial linker spacing l ~ 1/R* in Grason & Bruinsma's
    microscopic scaling (p. 4: K3 ~ k_B T*l_p/d^2 ~ (R*)^0, while mu_perp, mu_par, gamma, Sigma ~ 1/l ~ R*)
    predicts columnar onset radius lambda_{3 perp} = (K3_bar/mu_perp_bar)^(1/2) ~ (R*)^(-1/2), exact
    columnar equilibrium radius R_0(R*) (grason2007/columnar_equilibrium_radius_muc) monotonically
    decreasing with R* (local log-slope d(log R_0)/d(log R*) in [-0.144, 0], falling from
    lambda_{3 perp}(R*_c) to (16/27)*lambda_{3 perp}(R*_c) as R*/R*_c -> oo), columnar low-Sigma and
    solid shear-regime radii independent of R* (slope 0), and solid bending-regime radius decreasing
    as (R*)^(-1/5) (slope -0.2). None reproduces Claessens's observed positive growth D ~ (R*)^(+0.3)
    (diameter_scaling_Rstar; Fig. 1C fit slope +0.327). Only under the non-standard assumption of
    R*-independent surface tension Sigma (with mu_perp, mu_par, gamma ~ R*) does
    grason2007/solid_radius_shear_regime yield R_0 ~ (R*)^(+1/3), outside its R_0 >> lambda_{3 perp}
    validity regime and inconsistent with Grason's Sigma ~ Delta E*/(d*l) scaling.
    (2) Saturation spacing and bundle diameter: Claessens's 1:4.5 saturation stoichiometry with d = 2.9 nm
    gives mean axial fascin spacing per filament l_fil = 4.5*2.9 = 13.05 nm, closely matching the SAXS
    inter-filament spacing a_H = 12.4 nm (supporting Grason's saturated-linker estimate l ~ d in
    grason2007/saturated_linker_spacing, though per-neighbor-pair spacing is u*d ~= 39.2 nm). Inserting
    Claessens's d = 12.4 nm and Delta G/(k_B T) = 15.02 (binding_energy_fascin_sign_corrected) into
    grason2007/lambda_3perp_microscopic gives columnar onset diameter 2*lambda_{3 perp} = 57.5 nm at
    l_p = 1 um (closely matching Claessens's hydrated 2-shell SAXS diameter 50-57 nm, area-equivalent
    56.8 nm for n_f = 19), but 182-237 nm at realistic F-actin persistence lengths l_p = 10-17 um
    (3-4x larger than the hydrated diameter and 6-8x larger than the TEM plateau 28.2 nm). Because
    rigid fascin linkers suppress axial sliding, fascin bundles would correspond to Grason's 3D
    hexagonal-solid phase (Eq. 9), where Ref. 21 (grason2007/solid_to_columnar_radius_ratio) predicts
    much smaller radii than columnar aggregates.

- id: q_grason2007_pitch_and_twist_conventions
  kind: reading
  about:
    - helical_symmetry_ratio
    - helical_overtwist_from_symmetry
    - Delta_theta_max
    - d_monomer
    - grason2007/chiral_torque_coupling
    - grason2007/cholesteric_pitch_from_torsion
    - grason2007/small_bundle_torsion_microscopic
    - grason2007/solid_harmonic_min_corrected
    - grason2007/q_audit_cholesteric_pitch_2pi_convention
  citation: {page: 2, printed_page: "8820", quote: "gradually changes from the original ⫺13/6 to an overtwisted", where: text}
  text: >
    Three incompatible pitch, twist-rate, and angle conventions prevent direct parameter substitution
    between claessens2008's helical-symmetry models and grason2007's chirality/torsion models:
    (1) 2*pi cholesteric pitch convention: grason2007 Eq. (3) writes (nabla_perp x t - z_hat/P)^2
    without 2*pi, so P = q_0^(-1) is an inverse twist wavenumber (inferred as P ~ 1-10 nm from
    Ikawa et al.'s 2*pi/Omega ~ 100 nm; see grason2007/q_audit_cholesteric_pitch_2pi_convention).
    The corresponding full 2*pi cholesteric pitch is 2*pi*P ~ 6-60 nm, overlapping F-actin's two-start
    long-pitch helical repeat in claessens2008 (13*d = 37.7 nm half-pitch / 75.4 nm full pitch for
    -13/6; 14*d = 40.6 nm / 81.2 nm for -28/13), whereas Claessens's helical_symmetry_ratio M = p/s
    counts monomers per left-handed genetic turn rather than a cholesteric pitch.
    (2) Internal overtwist rate vs. bundle braiding rate: claessens2008's -13/6 -> -28/13 transition
    gives Delta_theta = 0.989 deg = 0.01726 rad per monomer (d = 2.9 nm), an internal single-filament
    overtwist rate omega_fil = Delta_theta/d = 0.00595 nm^-1 (full overtwist wavelength
    2*pi/omega_fil = 1056 nm), an order of magnitude smaller than the whole-bundle braiding rate
    Omega = 2*pi/(100 nm) = 0.0628 nm^-1 from Ikawa et al. used in grason2007/cholesteric_pitch_from_torsion.
    (3) Angle symbol theta: claessens2008 uses theta_0, theta_1, Delta_theta (printed in degrees,
    converted to radians in E_twist) for monomer-to-monomer azimuthal rotation about the single-filament
    axis, whereas grason2007 uses theta = Omega*R (dimensionless radians) for the tilt angle of
    outermost braided filaments relative to the bundle centerline.

