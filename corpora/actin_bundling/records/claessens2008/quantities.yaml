- id: actin_mass_concentration
  name: actin mass concentration
  dimension: "[mass]/[length]**3"
  description: Mass concentration of actin (c_a), typically printed in mg/ml.

- id: actin_molar_concentration
  name: actin molar concentration
  dimension: "[substance]/[length]**3"
  description: Molar concentration of G-actin monomers (c_a), e.g. in uM or M.

- id: fascin_molar_concentration
  name: fascin molar concentration
  dimension: "[substance]/[length]**3"
  description: Molar concentration of fascin cross-linker (c_f).

- id: actin_molar_mass
  name: G-actin molar mass
  dimension: "[mass]/[substance]"
  description: Molecular weight (molar mass) of monomeric G-actin.

- id: dissociation_constant
  name: fascin-actin dissociation constant
  dimension: "[substance]/[length]**3"
  description: Equilibrium dissociation constant K_d (or K_D) for fascin binding to F-actin.

- id: standard_state_concentration
  name: thermodynamic standard-state concentration
  dimension: "[substance]/[length]**3"
  description: Reference concentration c_0 (standardly 1 M) rendering K_D/c_0 dimensionless inside ln(K_D/c_0).

- id: molar_ratio_abp_actin
  name: total ABP-to-actin molar ratio
  dimension: dimensionless
  description: Total molar ratio R = c_f/c_a between cross-linking protein (fascin or espin) and G-actin monomers.

- id: effective_bound_ratio
  name: effective bound fascin-to-actin molar ratio
  dimension: dimensionless
  description: Effective molar ratio R* of bound fascin per G-actin monomer accounting for finite K_d.

- id: dimensionless_kd_ratio
  name: dimensionless dissociation ratio
  dimension: dimensionless
  description: Dimensionless ratio kappa = K_d/c_a governing deviations between R* and R.

- id: actins_per_fascin_saturation
  name: actin monomers per bound fascin at saturation
  dimension: dimensionless
  description: Stoichiometric number of actin monomers per bound fascin molecule at binding saturation (~4.5).

- id: bundle_diameter
  name: bundle diameter
  dimension: "[length]"
  description: Thickness (diameter D) of an F-actin bundle measured from TEM intensity profiles.

- id: bundle_diameter_ratio
  name: bundle diameter ratio
  dimension: dimensionless
  description: Ratio of thick multi-ABP bundle diameter to single-ABP bundle diameter (D_thick/D_0).

- id: bundle_diameter_in_filaments
  name: bundle diameter in filaments
  dimension: dimensionless
  description: Cross-sectional width of an F-actin bundle expressed as number of filaments across.

- id: filaments_per_bundle
  name: number of filaments per bundle
  dimension: dimensionless
  description: Number of F-actin filaments (n_f or n) composing a single bundle.

- id: subbundles_per_bundle
  name: number of sub-bundles per composite bundle
  dimension: dimensionless
  description: Number of smaller fascin/actin bundles linked together into a thicker composite bundle.

- id: hexagonal_shells
  name: number of hexagonal filament shells
  dimension: dimensionless
  description: Number of concentric hexagonal shells k surrounding a central filament in a hexagonally packed bundle.

- id: droplet_diameter
  name: emulsion droplet diameter
  dimension: "[length]"
  description: Diameter D_d of a spherical water-in-oil emulsion droplet confining F-actin bundles.

- id: total_actin_length
  name: total F-actin contour length in droplet
  dimension: "[length]"
  description: Total contour length L of polymerized F-actin contained within a single emulsion droplet.

- id: interfilament_separation
  name: interfilament surface separation
  dimension: "[length]"
  description: Surface-to-surface spacing between neighboring F-actin filaments cross-linked by fascin.

- id: hexagonal_lattice_spacing
  name: hexagonal center-to-center filament spacing
  dimension: "[length]"
  description: Center-to-center lattice constant a_H = 4*pi/(sqrt(3)*q_10) of hexagonally packed F-actin filaments.

- id: scattering_wavevector
  name: SAXS scattering wavevector
  dimension: "1/[length]"
  description: Reciprocal-space scattering wavevector magnitude q (Bragg peaks q_10, q_11, q_20, q_21 or helical layer-line peaks).

- id: monomers_per_repeat
  name: monomers per helical repeat
  dimension: dimensionless
  description: Number of actin monomers p per crystallographic helical repeat.

- id: turns_per_repeat
  name: helical turns per repeat
  dimension: dimensionless
  description: Number of left-handed genetic helical turns s per crystallographic repeat.

- id: helical_symmetry_ratio
  name: helical symmetry ratio
  dimension: dimensionless
  description: Ratio M = p/s characterizing the helical symmetry of F-actin (with negative sign denoting left-handedness).

- id: monomer_twist_angle
  name: helical twist angle per monomer
  dimension: dimensionless
  description: Azimuthal rotation angle per actin monomer along the genetic helix (deg or rad).

- id: monomer_overtwist
  name: overtwist per actin monomer
  dimension: dimensionless
  description: Change in helical twist angle per actin monomer Delta_theta induced by fascin bundling (deg or rad).

- id: angular_mismatch
  name: helical-to-hexagonal angular mismatch
  dimension: dimensionless
  description: Angular deviation between an actual actin monomer position and the nearest ideal 60-deg hexagonal lattice direction.

- id: lattice_direction_angle
  name: ideal hexagonal lattice direction angle
  dimension: dimensionless
  description: Ideal azimuthal binding-site angle on a hexagonal lattice (multiples of 60 deg).

- id: reference_azimuth_offset
  name: helical projection reference azimuth offset
  dimension: dimensionless
  description: Azimuthal orientation offset phi_0 of monomer 1 relative to the 0 deg hexagonal axis in Fig. S2.

- id: monomer_spacing
  name: axial monomer spacing
  dimension: "[length]"
  description: Axial rise d per actin monomer along F-actin (printed as 2.9 nm).

- id: torsional_stiffness
  name: filament torsional stiffness
  dimension: "[force]*[length]**2"
  description: Torsional rigidity tau of a single F-actin filament (N*m^2).

- id: twist_energy_per_monomer
  name: torsional twist energy per actin monomer
  dimension: "[energy]"
  description: Elastic twist energy cost E_twist per actin monomer.

- id: twist_energy_per_fascin_kBT
  name: torsional twist energy per bound fascin in kBT
  dimension: dimensionless
  description: Elastic twist energy cost per bound fascin molecule expressed in units of thermal energy k_B*T.

- id: binding_energy_per_fascin_kBT
  name: binding free energy per bound fascin in kBT
  dimension: dimensionless
  description: Fascin binding free energy Delta_G per bound fascin molecule expressed in units of thermal energy k_B*T.

- id: thermal_energy
  name: thermal energy scale
  dimension: "[energy]"
  description: Thermal energy k_B*T at experimental temperature T.

- id: temperature
  name: temperature
  dimension: "[temperature]"
  description: Experimental solution temperature T.

- id: monomers_per_hexagonal_unit
  name: actin monomers per hexagonal unit
  dimension: dimensionless
  description: Number of actin monomers u necessary to build one hexagonal cross-linking unit (6 binding sites).

- id: binding_sites_per_unit
  name: fascin binding sites per hexagonal unit
  dimension: dimensionless
  description: Coordination number z = 6 of cross-linker binding sites around one filament in a hexagonal unit.

- id: surface_occupation_sign
  name: surface occupation branch sign
  dimension: dimensionless
  description: Sign selector sigma (+1 for surface occupation included, -1 for inside occupation only) in SI bundle geometry formula.

- id: scaling_exponent
  name: power-law scaling exponent
  dimension: dimensionless
  description: Exponent of a power-law scaling relationship.

- id: salt_concentration
  name: buffer salt concentration
  dimension: "[substance]/[length]**3"
  description: Molar concentration of ionic salt (e.g. MgCl2) in polymerization buffer.

- id: capillary_diameter
  name: SAXS capillary diameter
  dimension: "[length]"
  description: Diameter of quartz capillaries used for SAXS measurements.

- id: photon_energy
  name: X-ray photon energy
  dimension: "[energy]"
  description: Synchrotron X-ray beam energy for SAXS experiments.

- id: sample_detector_distance
  name: SAXS sample-to-detector distance
  dimension: "[length]"
  description: Distance between sample capillary and detector in SAXS setup.

- id: exposure_time
  name: SAXS scan exposure time
  dimension: "[time]"
  description: Duration of individual SAXS scans.

- id: saxs_intensity
  name: SAXS scattering intensity
  dimension: dimensionless
  description: Arbitrary-unit (a.u.) circularly or angularly averaged small-angle X-ray scattering intensity I(q) or I(q_z) (Fig. 3A, 3C).
