id: twist_energy_per_monomer_half
name: torsional twist energy per actin monomer (with linear-elastic 1/2 factor)
role: model
variant_of: twist_energy_per_monomer
corrections:
  - equation: "E_twist = tau*(Delta_theta)^2*d^(-1) (p. 2, right col.)"
    change: "include the linear torsion elasticity prefactor 1/2: E_twist = (1/2)*tau*(Delta_theta)^2*d^(-1)"
    evidence: >
      By linear torsion elasticity, the strain energy of a segment of length d and torsional stiffness
      tau twisted by angle Delta_theta is (1/2)*tau*(Delta_theta/d)^2 * d = (1/2)*tau*(Delta_theta)^2/d.
      Without the 1/2 factor, twist energy at intermediate R* = 0.05-0.10 in Fig. 3D (~17-20 k_B T per
      bound fascin) exceeds the stated fascin binding energy (~15 k_B T).
stated: {page: 2, printed_page: "8820", quote: "increase in overtwist ⌬␪: Etwist ⫽ ␶(⌬␪)2d⫺1.", where: text}
equation: "E_twist = (1/2) * tau * (Delta_theta)^2 * d^(-1)"
inputs:
  tau: {quantity: torsional_stiffness, unit: N*m^2}
  Delta_theta: {quantity: monomer_overtwist, unit: rad}
  d: {quantity: monomer_spacing, unit: nm}
outputs:
  E_twist: {quantity: twist_energy_per_monomer, unit: J}
settings: {}
stochastic: false
