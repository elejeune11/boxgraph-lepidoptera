id: Rstar_filament_scaling
name: translated bound fascin ratio scaling with filament number (SI Fig. S1)
role: model
prefactor: unknown
from_words: true
built_from: [diameter_scaling_Rstar, diameter_filament_scaling]
stated: {page: 5, printed_page: "SI 1", quote: "the D(R*) curve (Fig. 1C) has to be translated into a R*(nf)", where: "SI Methods / Fig. S1"}
equation: "R* ~ n_f^(5/3)"
inputs:
  n_f: {quantity: filaments_per_bundle, unit: dimensionless}
outputs:
  R_star: {quantity: effective_bound_ratio, unit: dimensionless}
settings: {}
stochastic: false
