id: effective_bound_ratio
name: effective bound fascin-to-actin molar ratio R* (Methods)
role: model
stated: {page: 4, printed_page: "8822", quote: "R ⫹ Kd/ca) ⫺ ((1 ⫹ R ⫹ Kd/ca)2 ⫺ 4R)1/2)", where: Methods}
equation: "R* = (1/2) * ((1 + R + K_d/c_a) - ((1 + R + K_d/c_a)^2 - 4*R)^(1/2))"
built_from: [dimensionless_kd_scale]
inputs:
  R: {quantity: molar_ratio_abp_actin, unit: dimensionless}
  K_d: {quantity: dissociation_constant, unit: uM}
  c_a: {quantity: actin_molar_concentration, unit: uM}
outputs:
  R_star: {quantity: effective_bound_ratio, unit: dimensionless}
settings: {}
stochastic: false
