id: gaussian_tem_profile_fit
name: Gaussian intensity-profile fit for TEM bundle diameter (Fig. 1C Inset)
role: fit
runnable: false
not_runnable_reason: >
  Raw TEM cross-sectional intensity profiles are not provided, and the paper does not state which
  Gaussian width convention (sigma, 2*sigma, or FWHM) defines the reported bundle diameter D.
stated: {page: 1, printed_page: "8819", quote: "fitting a Gaussian to the intensity profiles (Fig. 1C Inset)", where: "text / Fig. 1C"}
inputs:
  R_star: {quantity: effective_bound_ratio, unit: dimensionless}
outputs:
  D: {quantity: bundle_diameter, unit: nm}
settings: {}
stochastic: false
