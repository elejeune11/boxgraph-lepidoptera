id: helical_overtwist_from_symmetry
name: monomer twist angles and overtwist from helical symmetry transition
role: model
from_words: true
built_from: [helical_symmetry_ratio]
stated: {page: 2, printed_page: "8820", quote: "⫺28/13 symmetry. The maximum overtwist of ⬇1° per actin", where: text}
equation: "theta_0 = -360 * s_0 / p_0; theta_1 = -360 * s_1 / p_1; Delta_theta = 360 * (s_1 / p_1 - s_0 / p_0)"
inputs:
  p_0: {quantity: monomers_per_repeat, unit: dimensionless}
  s_0: {quantity: turns_per_repeat, unit: dimensionless}
  p_1: {quantity: monomers_per_repeat, unit: dimensionless}
  s_1: {quantity: turns_per_repeat, unit: dimensionless}
outputs:
  theta_0: {quantity: monomer_twist_angle, unit: deg}
  theta_1: {quantity: monomer_twist_angle, unit: deg}
  Delta_theta: {quantity: monomer_overtwist, unit: deg}
settings: {}
stochastic: false
