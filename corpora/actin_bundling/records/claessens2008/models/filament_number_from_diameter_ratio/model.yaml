id: filament_number_from_diameter_ratio
name: filament count from bundle diameter ratio (Fig. 4D / SI)
role: model
from_words: true
built_from: [diameter_filament_scaling]
stated: {page: 3, printed_page: "8821", quote: "diameter that is approximately three times that of a fascin or espin bundle", where: "Fig. 4D caption / SI Methods"}
equation: "n_f = n_f_0 * (D_ratio)^2"
inputs:
  n_f_0: {quantity: filaments_per_bundle, unit: dimensionless}
  D_ratio: {quantity: bundle_diameter_ratio, unit: dimensionless}
outputs:
  n_f: {quantity: filaments_per_bundle, unit: dimensionless}
settings: {}
stochastic: false
