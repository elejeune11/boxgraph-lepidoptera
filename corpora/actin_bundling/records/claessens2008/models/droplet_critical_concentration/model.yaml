id: droplet_critical_concentration
name: confined droplet actin concentration boundary at fixed n_f (Fig. 2E)
role: model
from_words: true
built_from: [droplet_ring_filament_number]
stated: {page: 2, printed_page: "8820", quote: "dotted line represents nf ⫽ 20.", where: "Fig. 2E caption / text"}
equation: "c_a = 6 * n_f * M_actin / (N_A * d * D_d^2)"
inputs:
  n_f: {quantity: filaments_per_bundle, unit: dimensionless}
  D_d: {quantity: droplet_diameter, unit: um}
  M_actin: {quantity: actin_molar_mass, unit: g/mol}
  d: {quantity: monomer_spacing, unit: nm}
outputs:
  c_a: {quantity: actin_mass_concentration, unit: mg/ml}
settings: {}
stochastic: false
