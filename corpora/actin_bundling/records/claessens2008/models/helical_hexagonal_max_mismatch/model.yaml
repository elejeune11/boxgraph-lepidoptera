id: helical_hexagonal_max_mismatch
name: maximum and total helical-to-hexagonal angular mismatch (SI Methods & Fig. S2)
role: model
from_words: true
built_from: [helical_hexagonal_site_mismatch]
stated: {page: 5, printed_page: "SI 1", quote: "position becomes as large as 13.8° (Fig. S2)", where: "SI Methods / Fig. S2"}
equation: "max_mismatch = max_{psi in 60*Z_6} delta_phi(psi); total_mismatch = sum_{psi in 60*Z_6} delta_phi(psi)"
inputs:
  p: {quantity: monomers_per_repeat, unit: dimensionless}
  s: {quantity: turns_per_repeat, unit: dimensionless}
  n_unit: {quantity: monomers_per_hexagonal_unit, unit: dimensionless}
  phi0: {quantity: reference_azimuth_offset, unit: deg}
outputs:
  max_mismatch: {quantity: angular_mismatch, unit: deg}
  total_mismatch: {quantity: angular_mismatch, unit: deg}
settings: {}
stochastic: false
