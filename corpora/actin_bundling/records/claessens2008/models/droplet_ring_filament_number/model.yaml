id: droplet_ring_filament_number
name: confined droplet single-ring F-actin length and filament count
role: model
from_words: true
stated: {page: 2, printed_page: "8820", quote: "mass of F-actin within a drop or, equivalently, its total length, L", where: text}
equation: "L = (pi/6) * D_d^3 * (c_a / M_actin) * N_A * d; n_f = L / (pi * D_d)"
inputs:
  c_a: {quantity: actin_mass_concentration, unit: mg/ml}
  D_d: {quantity: droplet_diameter, unit: um}
  M_actin: {quantity: actin_molar_mass, unit: g/mol}
  d: {quantity: monomer_spacing, unit: nm}
outputs:
  L: {quantity: total_actin_length, unit: um}
  n_f: {quantity: filaments_per_bundle, unit: dimensionless}
settings: {}
stochastic: false
