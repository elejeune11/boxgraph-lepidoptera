id: bundle_geometry_saturation
name: saturated hexagonal bundle cross-linker to actin ratio (SI Methods)
role: model
stated: {page: 5, printed_page: "SI 1", quote: "ncl /nat ⫽ R ⫽ 1/u共3 ⫾ 3.5nf⫺1/2兲.", where: "SI Methods"}
equation: "R = (1/u) * (3 + sigma * 3.5 * n_f^(-1/2))"
inputs:
  u: {quantity: monomers_per_hexagonal_unit, unit: dimensionless}
  n_f: {quantity: filaments_per_bundle, unit: dimensionless}
  sigma: {quantity: surface_occupation_sign, unit: dimensionless}
outputs:
  R: {quantity: molar_ratio_abp_actin, unit: dimensionless}
settings: {}
stochastic: false
