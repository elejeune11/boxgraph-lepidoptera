described_from: ref-30
stated: {page: 2, printed_page: "8820", quote: "two hexagonal shells of actin filaments, which is", where: text}
equation: "n_f = 1 + 3*k*(k + 1); D_fil = 2*k + 1"
inputs:
  k: {quantity: hexagonal_shells, unit: dimensionless}
outputs:
  n_f: {quantity: filaments_per_bundle, unit: dimensionless}
  D_fil: {quantity: bundle_diameter_in_filaments, unit: dimensionless}
settings: {}
stochastic: false
