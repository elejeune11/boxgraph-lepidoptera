id: binding_energy_fascin_sign_corrected
name: fascin binding energy gain in k_B T (sign-corrected -ln(K_D/c_0))
role: model
variant_of: binding_energy_fascin
described_from: ref-36
corrections:
  - equation: "Delta G = k_B T ln(K_D) ≈ 15 k_B T (p. 3, left col.)"
    change: "negate the logarithm to -ln(K_D / c_0) so binding energy gain is positive for K_D < c_0"
    evidence: >
      For K_D = 0.3 uM (p. 4) and standard state c_0 = 1 M, +ln(K_D / c_0) = -15.02 < 0,
      whereas the same sentence on p. 3 prints a positive binding energy gain '≈15 k_B T'.
stated: {page: 3, printed_page: "8821", quote: "kBTln(KD)⬇15 kBT per bound fascin molecule", where: text}
equation: "DeltaG_gain / (k_B * T) = -ln(K_D / c_0)"
inputs:
  K_D: {quantity: dissociation_constant, unit: M}
  c_0: {quantity: standard_state_concentration, unit: M}
outputs:
  DeltaG_kBT: {quantity: binding_energy_per_fascin_kBT, unit: dimensionless}
settings: {}
stochastic: false
