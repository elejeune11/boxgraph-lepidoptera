id: helical_hexagonal_site_mismatch
name: helical-to-hexagonal angular mismatch at a given lattice direction (SI Fig. S2)
role: model
from_words: true
built_from: [helical_symmetry_ratio]
stated: {page: 7, printed_page: "SI 3", quote: "The numbers between brackets indicate the difference in angle", where: "SI Methods / Fig. S2"}
equation: "delta_phi(psi) = min_{k=1..n_unit} |((k-1)*360*s/p + phi_0 - psi) mod_sym 360|"
inputs:
  p: {quantity: monomers_per_repeat, unit: dimensionless}
  s: {quantity: turns_per_repeat, unit: dimensionless}
  n_unit: {quantity: monomers_per_hexagonal_unit, unit: dimensionless}
  phi0: {quantity: reference_azimuth_offset, unit: deg}
  psi: {quantity: lattice_direction_angle, unit: deg}
outputs:
  delta_phi: {quantity: angular_mismatch, unit: deg}
settings: {}
stochastic: false
