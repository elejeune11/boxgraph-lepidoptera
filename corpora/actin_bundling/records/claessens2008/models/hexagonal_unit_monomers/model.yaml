id: hexagonal_unit_monomers
name: actin monomers per hexagonal cross-linking unit at saturation (SI)
role: model
from_words: true
stated: {page: 5, printed_page: "SI 1", quote: "At saturation an actin filament with 6 fascin binding sites", where: "SI Methods"}
equation: "u = (z / 2) * r_sat"
inputs:
  z: {quantity: binding_sites_per_unit, unit: dimensionless}
  r_sat: {quantity: actins_per_fascin_saturation, unit: dimensionless}
outputs:
  u: {quantity: monomers_per_hexagonal_unit, unit: dimensionless}
settings: {}
stochastic: false
