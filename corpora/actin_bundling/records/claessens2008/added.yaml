- id: M_actin_added
  quantity: actin_molar_mass
  unit: g/mol
  printed: "42000"
  basis: >
    Standard molecular weight of rabbit skeletal muscle G-actin (42 kDa), not printed in the paper;
    consistent with 0.04 mg/ml (Fig. 1A) converting to 0.95 uM (Fig. 4C-D: 0.04 / 42000 * 1e6 = 0.952 uM).
  alternatives: ["41800", "43000"]
  stands_for: "G-actin molar mass for mass-to-molar conversion and emulsion droplet total length calculation"

- id: c0_standard_state
  quantity: standard_state_concentration
  unit: M
  printed: "1"
  basis: >
    Standard 1 M biochemical reference concentration required to make the argument of ln(K_D / c_0)
    dimensionless in Delta G = k_B T ln(K_D) (p. 3); gives |ln(0.3e-6 / 1)| = 15.02 ≈ 15.
  alternatives: ["55.5"]
  stands_for: "unstated standard-state reference concentration c_0 in ln(K_D)"

- id: phi0_13_6_added
  quantity: reference_azimuth_offset
  unit: deg
  printed: "0"
  basis: >
    In Fig. S2 (Left, -13/6), monomer 1 is placed directly on the 0 deg ideal hexagonal axis
    (phi_0 = 0 deg). Rotating by -30 deg (or +2.31 deg) minimizes the maximum mismatch to 11.54 deg.
  alternatives: ["-30", "2.31"]
  stands_for: "azimuthal orientation offset phi_0 of monomer 1 in Fig. S2 (-13/6)"

- id: phi0_28_13_added
  quantity: reference_azimuth_offset
  unit: deg
  printed: "6.4286"
  basis: >
    In Fig. S2 (Right, -28/13), the 0 deg hexagonal axis bisects monomer 1 and monomer 16
    (half of 360/28 = 12.857 deg, i.e., phi_0 = +360/56 = +6.4286 deg clockwise), which is also
    the minimax orientation for a 14-monomer half-repeat. Setting phi_0 = 0 deg (as in -13/6)
    changes the maximum mismatch to 12.86 deg (14 monomers) or 8.57 deg (15 monomers).
  alternatives: ["0"]
  stands_for: "azimuthal orientation offset phi_0 of monomer 1 in Fig. S2 (-28/13)"

- id: n_unit_28_13_added
  quantity: monomers_per_hexagonal_unit
  unit: dimensionless
  printed: "14"
  basis: >
    One hexagonal cross-linking unit spans ~13-14 monomers (SI p. 1), corresponding to one
    14-monomer half-repeat (k = 1..14) of the 28-monomer crystallographic repeat of -28/13.
    Using the full 28-monomer repeat (k = 1..28) allows monomers 20 and 25 to align within 2.14 deg,
    reducing the max mismatch to 6.43 deg (at phi_0 = 6.4286 deg) or 4.29 deg (at phi_0 = 0 deg).
  alternatives: ["13", "15", "28"]
  stands_for: "number of monomers per hexagonal unit searched in Fig. S2 (-28/13)"

- id: cf_fig4d_added
  quantity: fascin_molar_concentration
  unit: uM
  printed: "0.95"
  basis: >
    Representative fascin concentration matching R_fascin = 1 at c_a = 0.95 uM (Fig. 4D) to exercise
    R = c_f / c_a; not printed explicitly as a concentration in uM.
  alternatives: ["0.25", "2.0"]
  stands_for: "fascin molar concentration c_f in R = c_f / c_a"

- id: Dd_droplet_rep_added
  quantity: droplet_diameter
  unit: um
  printed: "10"
  basis: >
    Representative emulsion droplet diameter inside the plotted range (3-100 um) of Fig. 2E
    for evaluating the droplet ring filament count model; no specific (D_d, c_a) pair is printed
    in text (only plotted in Fig. 2E).
  alternatives: ["5.4", "8.0", "17.0"]
  stands_for: "representative emulsion droplet diameter D_d in Fig. 2E"
