notes: >
  Full quantitative reading of Claessens et al. (2008), PNAS 105:8819-8822 (PDF pages 1-4)
  and its complete Supporting Information (SI Methods, Fig. S1, Fig. S2; PDF pages 5-7).

  In scope:
  - Molar-ratio and bound-fascin mass-action model R = c_f/c_a and R*(R, K_d, c_a) (p. 4),
    including dimensional scale definitions (c_a molar/mass conversion, kappa = K_d/c_a, k_B*T).
  - Empirical and geometric scaling laws D ~ (R*)^0.3 (p. 1-2), D ~ n_f^(1/2) (SI p. 5),
    translated scaling R* ~ n_f^(5/3) (SI p. 5-6), and diameter-ratio filament scaling
    n_f = n_f0 * (D_ratio)^2 (Fig. 4D, SI p. 5).
  - Confined emulsion droplet mass/length-to-ring filament count model from words (p. 2)
    and hexagonal shell packing count n_f = 1 + 3k(k+1), D_fil = 2k + 1 (p. 2).
  - SAXS hexagonal lattice center-to-center spacing a_H = 4*pi/(sqrt(3)*q_10) = 12.4 nm and
    higher-order Bragg peak ratios q_11, q_20, q_21 (p. 2), plus all printed SAXS peak wavevectors
    (0.585, 1.14, 1.25, 1.20, 1.35, 1.46 nm^-1).
  - Helical symmetry M = p/s (-13/6 to -28/13), overtwist Delta_theta = 360*(s1/p1 - s0/p0)
    = 0.989 deg (≈ 1 deg), twist energy E_twist = tau*(Delta_theta)^2/d (both as printed and
    with a 1/2 linear-elasticity variant), per-bound-fascin twist energy (~10 k_B T), and
    fascin binding free energy Delta_G = k_B*T*ln(K_D) (both as printed and sign-corrected variant).
  - SI bundle geometry saturation model R = (1/u)*(3 +/- 3.5*n_f^(-1/2)) and its bulk limit
    3/u, hexagonal unit monomer count u = (z/2)*r_sat (~13-14 monomers), and SI Fig. S2 helical
    projection angular mismatch model reproducing all 12 printed angular deviations for -13/6
    and -28/13 as well as the printed maxima (13.8 deg and 10.7 deg).
  - Non-runnable experimental fitting models: four-sphere SAXS diffraction fit (Al-Khayat et al.,
    ref-33) and TEM Gaussian profile fit (Fig. 1C Inset).
  - Buffer composition numbers (Tris, ATP, CaCl2, DTT, NaN3, KCl, uranyl acetate %, storage 4 C,
    7 days) were left out of data.yaml as qualitative preparation conditions except the minimum
    2 mM MgCl2 salt check and the 20 C polymerization temperature (which sets k_B*T).

  Figures (left for the independent digitize stage; no figures.yaml or figures.md created here):
  - Fig. 1A, 1B (p. 2): fluorescence micrographs of actin/fascin bundles at c_a = 0.04 and 0.1 mg/ml (micrographs, no plotted curves).
  - Fig. 1C (p. 2): data plot of TEM bundle diameter D (nm) vs R* with error bars and dashed power-law fit D ~ (R*)^0.3 (to be digitized); inset is a TEM micrograph.
  - Fig. 2A-D (p. 2): fluorescence and TEM micrographs of confined droplet rings (micrographs, no plotted curves).
  - Fig. 2E (p. 2): phase diagram of bundle organization in c_a (mg/ml) vs droplet diameter D_d (um) with dotted line n_f = 20 (to be digitized; allows testing the droplet ring model factor-of-2 tension).
  - Fig. 3A (p. 3): circularly averaged SAXS intensity I(q) for R* = 0.005, 0.05, 0.5 and magnified inset showing (1,0), (1,1), (2,0), (2,1), (1,2), (3,0) and helical peaks a, b, c (to be digitized).
  - Fig. 3B (p. 3): 2D SAXS diffraction image (micrograph/2D detector image).
  - Fig. 3C (p. 3): angularly averaged axial SAXS profiles I(q_z) with four-sphere model fits for R* = 0.05, 0.1, 0.5 (to be digitized).
  - Fig. 3D (p. 3): data plot of overtwist Delta_theta (deg) vs R* for c_a = 0.8, 2, 3 mg/ml (to be digitized; allows testing constancy of E_twist per bound fascin across R*).
  - Fig. 4A-D (p. 3): fluorescence and TEM micrographs of multi-ABP bundles; 4B inset shows a single fluorescence intensity profile along a frayed bundle axis (qualitative step illustration).
  - Fig. S1 (p. 6): log-log plot of R* vs filament count n showing theoretical full-saturation curve (blue, + sign), inside-only curve (green, - sign), experimental points (red circles), and dashed power-law line (to be digitized).
  - Fig. S2 (p. 7): helical projection diagrams for -13/6 and -28/13; all 12 explicitly printed angular deviations are recorded directly as TableData in data.yaml.
