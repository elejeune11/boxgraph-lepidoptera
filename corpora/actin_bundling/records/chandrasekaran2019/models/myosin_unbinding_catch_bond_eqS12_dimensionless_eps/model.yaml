id: myosin_unbinding_catch_bond_eqS12_dimensionless_eps
name: NMIIA minifilament catch-bond unbinding rate with dimensionless epsilon (Eq. S12 variant)
role: model
stated:
  page: 34
  printed_page: SI-15
  quote: We use a catch bond behavior similar to that of [15]
  where: Eq. (S12)
equation: k_fil,unbind = (epsilon * k^0_NMIIA,unbind / N_bound) * exp(-F_ext / (N_bound * F_NMIIA,unbind))  [dimensionless
  epsilon]
inputs:
  epsilon:
    quantity: dimensionless_parameter
    unit: dimensionless
  k0_NMIIA_unbind:
    quantity: reaction_rate
    unit: 1/s
  N_bound:
    quantity: count
    unit: dimensionless
  F_ext:
    quantity: force
    unit: pN
  F_NMIIA_unbind:
    quantity: force
    unit: pN
outputs:
  k_fil_unbind:
    quantity: reaction_rate
    unit: 1/s
settings: {}
stochastic: false
variant_of: myosin_unbinding_catch_bond_eqS12
corrections:
- equation: Eq. (S12) (p. 34 / SI-15)
  change: Treat epsilon = 0.2 as dimensionless instead of '0.2 /pN'.
  evidence: 'Dimensional analysis: k^0_NMIIA,unbind has dimension 1/[time], N_bound is dimensionless, and exp(-F_ext/(N_bound*F_NMIIA,unbind))
    is dimensionless, so k_fil,unbind has dimension 1/[time] only if epsilon is dimensionless. The printed ''0.2
    /pN'' yields 1/(pN*s) and appears transposed from gamma = 0.05 in Eq. (S11).'
