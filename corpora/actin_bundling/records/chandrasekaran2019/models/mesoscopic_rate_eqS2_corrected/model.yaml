id: mesoscopic_rate_eqS2_corrected
name: Mesoscopic rate constant with corrected 1/(V_r * N_A)^(n-1) scaling (Eq. S2 variant)
role: model
stated:
  page: 31
  printed_page: SI-12
  quote: Mesoscopic rate constant c μ can be obtained from deterministic rate constant
  where: Eq. (S2)
equation: c_mu = k_mu / (V_r * N_A)^(n - 1)
inputs:
  k_mu:
    quantity: bimolecular_rate_constant
    unit: L/(mol*s)
  V_r:
    quantity: volume
    unit: L
  N_A:
    quantity: avogadro_constant
    unit: 1/mol
outputs:
  c_mu:
    quantity: reaction_rate
    unit: 1/s
settings:
  n: 2
stochastic: false
variant_of: mesoscopic_rate_eqS2
corrections:
- equation: Eq. (S2) (p. 31 / SI-12)
  change: Divide by (V_r * N_A)^(n - 1) instead of multiplying by (V_r / N_A)^(n - 1).
  evidence: 'Dimensional analysis: for reaction order n=2, [k_mu] = L/(mol*s), [V_r] = L, and [N_A] = 1/mol. The
    printed formula k_mu * (V_r/N_A)^(n-1) yields dimension L^2/s rather than 1/s; standard Gillespie/Kurtz stochastic
    kinetics requires c_mu = k_mu / (V_r * N_A)^(n-1), which has dimension 1/s.'
