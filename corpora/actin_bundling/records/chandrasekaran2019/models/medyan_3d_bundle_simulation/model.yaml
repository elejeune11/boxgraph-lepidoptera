id: medyan_3d_bundle_simulation
name: 3D MEDYAN mechanochemical actomyosin bundle simulation
role: model
stated:
  page: 4
  printed_page: '4'
  quote: MEDYAN is a mechanochemical force field for simulating active matter
  where: Methods and S1 Text Section 2
inputs:
  L_bundle:
    quantity: filament_length
    unit: um
  N_fil:
    quantity: count
    unit: dimensionless
  l0_cyl:
    quantity: cylinder_length
    unit: nm
  l_p:
    quantity: persistence_length
    unit: um
  d_lat:
    quantity: lattice_spacing
    unit: nm
  l_vox:
    quantity: compartment_size
    unit: nm
  alpha_A:
    quantity: mole_ratio
    unit: dimensionless
  M_A:
    quantity: mole_ratio
    unit: dimensionless
  chi:
    quantity: treadmilling_scale_factor
    unit: dimensionless
  t_sim:
    quantity: time
    unit: s
outputs:
  S_nematic:
    quantity: order_parameter
    unit: dimensionless
  Sh_shape:
    quantity: shape_parameter
    unit: dimensionless
built_from:
- diffusion_coefficients_s211
- propensity_eqS1
- mesoscopic_rate_eqS2
- nrm_reaction_time_s222
- actin_stretching_eqS3
- actin_bending_eqS4
- excluded_volume_eqS6
- minifilament_stretching_eqS7
- crosslinker_stretching_eqS8
- boundary_repulsion_eqS9
- minifilament_binding_rate_eqS10
- myosin_zero_load_bound_heads
- myosin_bound_heads_eqS11
