- myosin_hill_walking_rate_eqS14
- crosslinker_slip_bond_unbinding_eqS15
described_from: ref-58
runnable: false
not_runnable_reason: Full 3D MEDYAN active-network stochastic reaction-diffusion (Next Reaction Method) coupled
  with conjugate-gradient mechanical equilibration over 2000 s for 30 filaments requires external C++ MEDYAN software
  not shipped with the paper; moreover, the paper omits numerical values for most mechanical, chemical, and transport
  parameters (K_str, eps_bend, K_vol, K_str^MF, K_str^linker, eps_boundary, lambda, D_actin, actin polymerization/depolymerization
  rates, NMIIA and alpha-actinin binding/unbinding rate constants and characteristic forces, equilibration step
  size, and non-treadmilling box volume and actin concentration).
