id: simulation_duration_unit_check
name: Simulation duration conversion from seconds to minutes
role: processing
stated:
  page: 9
  printed_page: '9'
  quote: at the time scale of about 30 minutes probed in this work
  where: Methods (p. 6) and Results (p. 9)
equation: t_min = t_sec / 60
inputs:
  t_sec:
    quantity: time
    unit: s
outputs:
  t_min:
    quantity: time
    unit: min
from_words: true
settings: {}
stochastic: false
