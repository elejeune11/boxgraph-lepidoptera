id: myosin_bound_heads_eqS11_inverse_force
name: Load-dependent bound NMIIA heads with 1/pN unit on gamma (Eq. S11 variant)
role: model
stated:
  page: 34
  printed_page: SI-15
  quote: assume linear scaling of N bound with parameter γ=0.05.
  where: Eq. (S11)
equation: N_bound = N_0 + gamma * F_ext  [gamma in 1/pN]
inputs:
  N_0:
    quantity: count
    unit: dimensionless
  gamma:
    quantity: inverse_force
    unit: 1/pN
  F_ext:
    quantity: force
    unit: pN
outputs:
  N_bound:
    quantity: count
    unit: dimensionless
settings: {}
stochastic: false
variant_of: myosin_bound_heads_eqS11
corrections:
- equation: Eq. (S11) (p. 34 / SI-15)
  change: Assign dimension 1/[force] (unit 1/pN) to gamma = 0.05 instead of dimensionless.
  evidence: 'Dimensional analysis: N_bound and N_0 are dimensionless head counts while F_ext is a force in pN; gamma
    must have dimension 1/[force] for gamma*F_ext to be dimensionless. Immediately below, Eq. (S12) prints a spurious
    ''/pN'' on epsilon = 0.2 /pN, indicating a unit transposition between gamma and epsilon.'
