id: myosin_unbinding_catch_bond_eqS12
name: NMIIA minifilament catch-bond unbinding rate as printed (Eq. S12, epsilon in 1/pN)
role: model
stated:
  page: 34
  printed_page: SI-15
  quote: We use a catch bond behavior similar to that of [15]
  where: Eq. (S12)
equation: k_fil,unbind = (epsilon * k^0_NMIIA,unbind / N_bound) * exp(-F_ext / (N_bound * F_NMIIA,unbind))
inputs:
  epsilon:
    quantity: inverse_force
    unit: 1/pN
  k0_NMIIA_unbind:
    quantity: reaction_rate
    unit: 1/s
  N_bound:
    quantity: count
    unit: dimensionless
  F_ext:
    quantity: force
    unit: pN
  F_NMIIA_unbind:
    quantity: force
    unit: pN
outputs:
  k_fil_unbind_printed:
    quantity: unbinding_rate_misprinted_dim
    unit: 1/(pN*s)
described_from: ref-S15
settings: {}
stochastic: false
