id: nematic_order_parameter_eqS18
name: Nematic orientational order parameter as printed (Eq. S18, off-by-one sum i=0..N)
role: processing
stated:
  page: 38
  printed_page: SI-19
  quote: The order parameter (S) is obtained from ordering tensor Q defined as,
  where: Eq. (S18)
equation: Q_{ab} = (3/2) * ((1/N) * sum_{i=0}^{N} u_{ia} u_{ib} - (1/3) delta_{ab}); S = max eig(Q)
