id: reaction_volume_geometry
name: Initial flexible-volume box x-length, total volume, and x-axis compartment count
role: processing
stated:
  page: 39
  printed_page: SI-20
  quote: An additional 1 micron skin distance is added to the extremities
  where: Results (p. 9) and SI Sections 2.1.1, 2.5 (pp. 29, 39-40)
equation: L_x = L_bundle + 2 * d_skin; N_x = L_x / l_vox; V_r = L_x * L_y * L_z
inputs:
  L_bundle:
    quantity: filament_length
    unit: um
  d_skin:
    quantity: skin_distance
    unit: um
  L_y:
    quantity: box_dimension
    unit: um
  L_z:
    quantity: box_dimension
    unit: um
  l_vox:
    quantity: compartment_size
    unit: nm
outputs:
  L_x:
    quantity: box_dimension
    unit: um
  N_x:
    quantity: count
    unit: dimensionless
  V_r:
    quantity: volume
    unit: L
from_words: true
settings: {}
stochastic: false
