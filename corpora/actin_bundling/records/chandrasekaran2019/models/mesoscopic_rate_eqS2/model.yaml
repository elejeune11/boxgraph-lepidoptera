id: mesoscopic_rate_eqS2
name: Mesoscopic rate constant as printed (Eq. S2, inverted V_r/N_A factor at n=2)
role: model
stated:
  page: 31
  printed_page: SI-12
  quote: Mesoscopic rate constant c μ can be obtained from deterministic rate constant
  where: Eq. (S2)
equation: c_mu = k_mu * (V_r / N_A)^(n - 1)
inputs:
  k_mu:
    quantity: bimolecular_rate_constant
    unit: L/(mol*s)
  V_r:
    quantity: volume
    unit: L
  N_A:
    quantity: avogadro_constant
    unit: 1/mol
outputs:
  c_mu_printed:
    quantity: mesoscopic_rate_misprinted_dim
    unit: L^2/s
settings:
  n: 2
stochastic: false
