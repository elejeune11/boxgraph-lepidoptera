id: excluded_volume_eqS6_with_jacobian
name: Parameterized excluded volume potential with Jacobian |l_i||l_j| restored (Eq. S6 variant)
role: model
stated:
  page: 32
  printed_page: SI-13
  quote: This can be rewritten by considering
  where: Eq. (S6)
equation: U_ij^vol = K_vol * |l_i| * |l_j| * integral_0^1 integral_0^1 (ds dt) / |r_i - r_j|^4
inputs:
  K_vol:
    quantity: excluded_volume_strength_s5
    unit: pN*nm^3
  L:
    quantity: cylinder_length
    unit: nm
  d:
    quantity: separation_distance
    unit: nm
outputs:
  U_vol:
    quantity: energy
    unit: pN*nm
settings: {}
stochastic: false
variant_of: excluded_volume_eqS6
corrections:
- equation: Eq. (S6) (p. 32 / SI-13)
  change: Include the change-of-variables Jacobian |l_i|*|l_j| (= L^2 for equal cylinders) when transforming Eq.
    (S5) via r_i = x_i^1 + t(x_i^2 - x_i^1).
  evidence: SI Section 2.2.1 states Eq. (S6) is rewritten directly from Eq. (S5) via r_i = x_i^1 + t(x_i^2 - x_i^1),
    where dl_i = |l_i| dt and dl_j = |l_j| ds. Omitting |l_i||l_j| changes the dimensions of K_vol from energy*length^2
    to energy*length^4 while reusing the same symbol K_vol.
