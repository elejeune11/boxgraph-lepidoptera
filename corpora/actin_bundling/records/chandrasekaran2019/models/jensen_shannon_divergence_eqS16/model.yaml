id: jensen_shannon_divergence_eqS16
name: Continuous Jensen-Shannon divergence for 1D Gaussian densities (Eqs. S16-S17)
role: processing
stated:
  page: 38
  printed_page: SI-19
  quote: Jensen Shannon divergence between two continuous distributions P and Q is given by,
  where: Eq. (S16)
equation: JSD(P || Q) = (1/2) D_KL(P || M) + (1/2) D_KL(Q || M), M = (P + Q) / 2
inputs:
  mu_1:
    quantity: distribution_mean
    unit: nm
  sigma_1:
    quantity: distribution_stddev
    unit: nm
  mu_2:
    quantity: distribution_mean
    unit: nm
  sigma_2:
    quantity: distribution_stddev
    unit: nm
outputs:
  JSD:
    quantity: divergence
    unit: dimensionless
built_from:
- kl_divergence_gaussian_eqS17
described_from: ref-S17
settings:
  n_grid: 1000
  n_sigma: 10.0
stochastic: false
