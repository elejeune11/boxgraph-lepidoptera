id: nematic_order_parameter_eqS18_sum1toN
name: Nematic orientational order parameter with corrected sum i=1..N (Eq. S18 variant)
role: processing
stated:
  page: 38
  printed_page: SI-19
  quote: The order parameter (S) is obtained from ordering tensor Q defined as,
  where: Eq. (S18)
equation: Q_{ab} = (3/2) * ((1/N) * sum_{i=1}^{N} u_{ia} u_{ib} - (1/3) delta_{ab}); S = max eig(Q)
inputs:
  N:
    quantity: count
    unit: dimensionless
  theta:
    quantity: angle
    unit: rad
outputs:
  S:
    quantity: order_parameter
    unit: dimensionless
settings: {}
stochastic: false
variant_of: nematic_order_parameter_eqS18
corrections:
- equation: Eq. (S18) (p. 38 / SI-19)
  change: Sum from i = 1 to N (N terms) instead of i = 0 to N (N + 1 terms).
  evidence: SI Section 2.4.2 immediately below Eq. (S18) states 'Order parameter 0 corresponds to random network
    while 1 represents absolute alignment' (and S2 Figure plots S in [0, 1]). Summing N+1 terms divided by N makes
    Tr(Q) = 3/(2N) != 0 and yields S = 1 + 3/(2N) > 1 for absolute alignment (e.g., S = 2.5 for N = 1).
