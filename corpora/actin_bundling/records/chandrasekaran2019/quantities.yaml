- id: persistence_length
  name: actin filament persistence length
  dimension: "[length]"
  description: Bending persistence length l_p of an F-actin filament.

- id: filament_length
  name: actin filament or bundle length
  dimension: "[length]"
  description: Initial or contour length of actin filaments/bundles.

- id: cylinder_length
  name: actin cylinder segment length
  dimension: "[length]"
  description: Length |l_i| or equilibrium length l_0^m of a MEDYAN actin cylinder segment.

- id: lattice_spacing
  name: hexagonal bundle lattice spacing
  dimension: "[length]"
  description: Initial center-to-center spacing of actin filaments on a hexagonal lattice.

- id: binding_distance
  name: actin-binding protein spring length
  dimension: "[length]"
  description: Equilibrium or instantaneous end-to-end distance (l_0, |l_ij|) of an alpha-actinin crosslinker or NMIIA myosin minifilament.

- id: compartment_size
  name: reaction-diffusion compartment size
  dimension: "[length]"
  description: Cubic voxel edge length used to discretize the reaction-diffusion volume below the Kuramoto length.

- id: box_dimension
  name: reaction volume side length
  dimension: "[length]"
  description: Linear dimension (L_x, L_y, or L_z) of the 3D simulation reaction volume.

- id: skin_distance
  name: flexible volume skin distance
  dimension: "[length]"
  description: Buffer distance added outside F-actin extremities along the x-axis in the flexible volume protocol.

- id: separation_distance
  name: inter-cylinder or boundary separation distance
  dimension: "[length]"
  description: Distance d between two actin cylinders or between a cylinder and a confining boundary.

- id: decay_length
  name: boundary repulsion decay length
  dimension: "[length]"
  description: Characteristic exponential decay length lambda of the boundary repulsion potential.

- id: volume
  name: reaction volume
  dimension: "[length]**3"
  description: Volume V_r of a reaction-diffusion compartment or simulation box.

- id: time
  name: time
  dimension: "[time]"
  description: Simulation duration, steady-state averaging window, or stochastic reaction waiting time tau_mu.

- id: molar_concentration
  name: molar concentration
  dimension: "[substance]/[length]**3"
  description: Molar concentration of total actin (e.g., uM).

- id: avogadro_constant
  name: Avogadro constant
  dimension: "1/[substance]"
  description: Avogadro number N_A converting molar amounts to molecule copy numbers.

- id: mole_ratio
  name: protein-to-actin mole ratio
  dimension: "dimensionless"
  description: Total mole ratio of alpha-actinin (alpha:A) or myosin heads (M:A) to total actin.

- id: treadmilling_scale_factor
  name: filament treadmilling rate scale factor
  dimension: "dimensionless"
  description: Multiplicative factor chi scaling polymerization and depolymerization rates at both filament ends relative to in vitro kinetics.

- id: diffusion_coefficient
  name: translational diffusion coefficient
  dimension: "[length]**2/[time]"
  description: Translational diffusion constant D of diffusing actin, alpha-actinin, or myosin species.

- id: diffusion_ratio
  name: relative diffusion coefficient ratio
  dimension: "dimensionless"
  description: Ratio of alpha-actinin or myosin diffusion coefficient to that of G-actin.

- id: reaction_rate
  name: chemical or mechanochemical reaction rate
  dimension: "1/[time]"
  description: Mesoscopic rate constant c_mu, reaction propensity a_mu, or binding/unbinding/walking rate constant.

- id: bimolecular_rate_constant
  name: deterministic second-order reaction rate constant
  dimension: "[length]**3/[substance]/[time]"
  description: Macroscopic deterministic rate constant k_mu for a bimolecular (n=2) reaction.

- id: mesoscopic_rate_misprinted_dim
  name: misprinted mesoscopic rate expression output
  dimension: "[length]**6/[time]"
  description: Dimensionally inconsistent output of printed Eq. (S2) k_mu * (V_r / N_A)^(n-1) at n=2.

- id: energy
  name: mechanical potential energy
  dimension: "[energy]"
  description: Mechanical stretching, bending, excluded-volume, or boundary repulsion potential energy or energy scale.

- id: spring_stiffness
  name: harmonic spring stiffness
  dimension: "[force]/[length]"
  description: Axial stretching stiffness constant (K_str, K_str^MF, K_str^linker) of actin cylinders, myosin minifilaments, or crosslinkers.

- id: excluded_volume_strength_s5
  name: excluded volume repulsion strength (Eq. S5 convention)
  dimension: "[energy]*[length]**2"
  description: Repulsion coefficient K_vol in Eq. (S5), U_ij^vol = K_vol * integral(dl_i dl_j / |r_i - r_j|^4).

- id: excluded_volume_strength_s6
  name: excluded volume repulsion strength (Eq. S6 / Fig. 1 convention)
  dimension: "[energy]*[length]**4"
  description: Repulsion coefficient K_vol in Eq. (S6) and Fig. 1, U_ij^vol = K_vol * integral_0^1 integral_0^1 ds dt / |r_i - r_j|^4.

- id: angle
  name: angle
  dimension: "dimensionless"
  description: Inter-cylinder bending angle theta_{i,i+1} or filament orientation angle theta (in radians).

- id: force
  name: mechanical force
  dimension: "[force]"
  description: External load F_ext, minifilament stall force F_stall, or characteristic unbinding force (F_NMIIA,unbind, F_alpha,unbind).

- id: inverse_force
  name: inverse force sensitivity or misprinted prefactor
  dimension: "1/[force]"
  description: Inverse-force parameter (printed 1/pN unit on epsilon in Eq. S12, or dimensionally required 1/pN unit on gamma in Eq. S11).

- id: unbinding_rate_misprinted_dim
  name: misprinted myosin unbinding rate output
  dimension: "1/[force]/[time]"
  description: Dimensionally inconsistent output of printed Eq. (S12) using printed epsilon = 0.2 /pN.

- id: duty_ratio
  name: myosin duty ratio
  dimension: "dimensionless"
  description: Fraction of time rho a myosin head stays in the strongly actin-bound state at zero load.

- id: hill_curvature_parameter
  name: Hill force-velocity curvature parameter
  dimension: "dimensionless"
  description: Dimensionless parameter zeta governing curvature of the Hill force-velocity relation (Eq. S14).

- id: dimensionless_parameter
  name: dimensionless model parameter
  dimension: "dimensionless"
  description: Dimensionless parameter such as printed unitless gamma in Eq. (S11), corrected dimensionless epsilon in Eq. (S12), uniform draw r_mu, or species sharing fraction.

- id: count
  name: discrete count
  dimension: "dimensionless"
  description: Integer or real count of filaments, heads, molecules, binding sites, trajectories, conditions, or compartments.

- id: degeneracy
  name: reaction combinatorial degeneracy
  dimension: "dimensionless"
  description: Combinatorial number of distinct molecular ways gamma_mu a reaction can occur.

- id: fold_change
  name: concentration fold change
  dimension: "dimensionless"
  description: Multiplicative fold increase in crosslinker mole ratio.

- id: morphology_fraction
  name: morphology class fraction or percentage
  dimension: "dimensionless"
  description: Fraction or percentage of sampled parameter conditions belonging to a given network morphology class.

- id: divergence
  name: information-theoretic divergence
  dimension: "dimensionless"
  description: Kullback-Leibler divergence D_KL or Jensen-Shannon divergence JSD between probability distributions.

- id: order_parameter
  name: nematic orientational order parameter
  dimension: "dimensionless"
  description: Largest eigenvalue S of the 3D nematic ordering tensor Q (Eq. S18).

- id: shape_parameter
  name: network shape parameter
  dimension: "dimensionless"
  description: Ratio Sh = lambda_1 / sum(lambda_i) of primary principal variance to total variance (Eq. S19).

- id: variance_eigenvalue
  name: principal scatter matrix eigenvalue
  dimension: "[length]**2"
  description: Eigenvalue lambda_i of R^T R corresponding to coordinate variance along principal axis i.

- id: distribution_mean
  name: distance distribution mean
  dimension: "[length]"
  description: Mean of a 1D filament-end Euclidean distance distribution.

- id: distribution_stddev
  name: distance distribution standard deviation
  dimension: "[length]"
  description: Standard deviation of a 1D filament-end Euclidean distance distribution.

- id: bound_crosslinker_mole_ratio
  name: bound alpha-actinin to actin mole ratio
  dimension: "dimensionless"
  description: Steady-state mole ratio alpha_bound:A of alpha-actinin crosslinkers bound to the actin network relative to total actin (S4 Figure).

- id: rg_ratio
  name: normalized network radius of gyration
  dimension: "dimensionless"
  description: Ratio Rg(t)/Rg(0) of instantaneous actin network radius of gyration to its initial value at t = 0 (S10 Figure).

- id: treadmilling_rate
  name: actin filament treadmilling rate
  dimension: "1/[time]"
  description: Average rate of monomer addition at filament plus ends (or removal at minus ends) per filament in monomers/(fil. s) (S11 Figure).

- id: filament_end_distance
  name: pairwise filament-end Euclidean distance
  dimension: "[length]"
  description: Euclidean distance d between pairs of actin filament ends (Dis--, Dis+-, or Dis++; S12 Figure panel b).

- id: distance_probability_density
  name: filament-end distance probability density
  dimension: "1/[length]"
  description: Normalized probability density P(d) of pairwise filament-end Euclidean distances (S12 Figure panel b).

- id: initial_polarity
  name: initial bundle polarity condition
  dimension: "dimensionless"
  description: Categorical initial filament polarity arrangement (unipolar or apolar).

- id: crosslinker_mole_ratio
  name: total crosslinker to actin mole ratio condition
  dimension: "dimensionless"
  description: Total alpha-actinin to total actin mole ratio alpha:A held fixed as a simulation condition.

- id: myosin_mole_ratio
  name: total myosin to actin mole ratio condition
  dimension: "dimensionless"
  description: Total NMIIA myosin head to total actin mole ratio M:A held fixed as a simulation condition.

- id: morphology_class
  name: clustered bundle morphology class
  dimension: "dimensionless"
  description: Categorical morphology class assigned by clustering (BL bundle-like, ABI aster-bundle intermediate, or AL aster-like).

- id: end_pair_type
  name: filament-end pair category
  dimension: "dimensionless"
  description: Categorical filament-end pair type for pairwise distance distributions (minus-minus Dis--, plus-minus Dis+-, or plus-plus Dis++).

