- id: cmp_grid_nontread_42
  purpose: reproduction
  computed: n_pairs_nontread_computed
  printed: n_pairs_nontread_printed
  note: "Checks 6 myosin x 7 alpha-actinin mole ratios = 42 pairs (Methods, p. 6)."

- id: cmp_grid_tread_84
