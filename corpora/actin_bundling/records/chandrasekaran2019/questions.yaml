- id: q_medyan_not_runnable
  kind: unstated_model
  about: [medyan_3d_bundle_simulation]
  text: >
    The full 3D MEDYAN mechanochemical actomyosin bundle simulation (30 actin filaments of 2 um
    length, Next Reaction Method reaction-diffusion in 500 nm voxels coupled to conjugate-gradient
    mechanical equilibration for 2000 s across 42 non-treadmilling pairs and 84 treadmilling
    triads) cannot be run from the paper alone because the MEDYAN software and input scripts are
    not bundled with the article and most mechanical/chemical numerical parameters are omitted.
  citation:
    page: 4
    printed_page: "4"
    quote: "MEDYAN is a mechanochemical force field for simulating active matter"
    where: Methods

