    - epsilon_myosin_unbind_printed
  text: >
    On p. 34 (SI p. 15), the unit '/pN' appears transposed between Eqs. (S11) and (S12). In
    Eq. (S11) (N_bound = N_0 + gamma * F_ext), gamma is printed as '0.05' with no unit even though
    dimensional consistency with N_0 (dimensionless) and F_ext (pN) requires gamma in 1/pN.
    Immediately below in Eq. (S12), epsilon is printed as '0.2 /pN', which makes k_fil,unbind have
    dimension 1/(pN*s) instead of 1/s (in MEDYAN / Popov et al. 2016, this tunability factor is
    dimensionless). Both printed models and their corrected variants are included in the record.
  citation:
