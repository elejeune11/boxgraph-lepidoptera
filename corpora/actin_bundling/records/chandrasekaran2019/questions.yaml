- id: q_audit_figS10_expansion_mass_loss
  kind: possible_error
  about:
    - reaction_volume_geometry
    - flexible_vol_sharing_fraction
    - flexible_vol_init_compartments_x
    - medyan_3d_bundle_simulation
  text: >
    In the flexible-volume expansion schematic (Figure S10 [second S10, actually S13] panel b,
    p. 40 / SI-21), the species-transfer rule at the right boundary expanding from old compartment
    N8 into newly added empty compartment N9 prints 'N8=N8/2' and 'N9=N9/2' instead of 'N9=N8/2'.
    Because N9 starts empty (0 copies), N9=N9/2 leaves N9 = 0 and destroys half of N8, violating
    particle conservation (unlike the left expansion N0=N1/2, N1=N1/2 and contraction N2=N2+N1,
    N7=N7+N8). In addition, SI Section 2.5 (p. 39) and Figure S10 (p. 40) divide discrete integer
    copy numbers N_i by 2 without stating how odd copy numbers are rounded to preserve conservation.
  citation:
    page: 40
    printed_page: "SI-21"
    quote: "Scenarios where reaction volume has contracted (a) and expanded (b)"
    where: "Figure S10 [S13] panel (b) and SI Section 2.5 (pp. 39-40)"

- id: q_audit_eqS14_superstall_negative_rate_and_hill_ref
  kind: possible_error
  about:
    - myosin_hill_walking_rate_eqS14
    - myosin_bound_heads_eqS11
    - ref-S16
    - ref-S10
  text: >
    Two issues affect Eq. (S14) (p. 34 / SI-15) and S1 Text references (p. 41 / SI-22):
    (1) Printed Eq. (S14), k_walk = k^0_walk * (F_stall - F_ext)/(F_stall + F_ext/zeta), states no
    lower clamp at zero for super-stall loads F_ext > F_stall = 12.6 pN, yielding negative walking
    rates k_walk < 0 incompatible with Next Reaction Method waiting times tau_mu = (1/a_mu) ln(1/r_mu)
    (p. 31); similarly Eq. (S11), N_bound = N_0 + gamma*F_ext, states no upper bound at N_total.
    (2) To support 'Hill [16] type force-velocity relation' on p. 34, S1 Text Reference 16 (ref-S16,
