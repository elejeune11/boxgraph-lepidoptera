    origin: measured datums in chandrasekaran2024 are experimental percentage abundances (shell, ring,
    disk %) of motor-free WT and GABmut VASP phase-separated droplets encapsulating polymerizing F-actin
    (Fig. 6D and text), which none of chandrasekaran2019's runnable equations predicts. Key framework
    contrasts across the author's two studies: MEDYAN (2019) uses quasi-static CG minimization + RDME
    NRM, l_0 = 108 nm, l_p = 17 um, cosine hinge bending eps*(1 - cos theta), exponential hard-wall
    boundary repulsion, single-step alpha-actinin Bell unbinding (F_u = 17.2 pN), and active NMIIA
    catch-bond motors; CytoSim/LAMMPS (2024) uses overdamped Langevin dynamics, l_seg = 100 nm,
    kappa = 0.075 pN*um^2 (l_p = 18.25 um at k_B T = 4.11 pN*nm), quadratic LAMMPS harmonic bonds
    (K_bond = 30000 k_B T/sigma^2) and angles (K_angle = 2500 k_B T/rad^2), linear harmonic droplet
    confinement, and two-step VASP tetramer Bell unbinding (f_u = 10 pN) without molecular motors.
