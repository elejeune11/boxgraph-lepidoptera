    and characteristic unbinding force F_NMIIA,unbind; alpha-actinin binding rate, zero-load
    unbinding rate k^0_alpha,unbind, and slip-bond force F_alpha,unbind; mechanical equilibration
    interval; and the reaction box dimensions and total actin concentration for the non-treadmilling
    simulations.
  citation:
