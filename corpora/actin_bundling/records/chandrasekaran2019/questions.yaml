- id: q_audit_eqS18_S19_undefined_symbols_and_scope_notes
  kind: reading
  about:
    - nematic_order_parameter_eqS18
    - shape_parameter_eqS19
    - boundary_repulsion_eqS9
    - myosin_unbinding_catch_bond_eqS12
    - rel_excluded_volume_s5_s6_printed_rescaled
    - cmp_nematic_aligned_printed_N1
  text: >
    Additional audit findings and reading notes across S1 Text and the record:
    (1) Several equation symbols are never defined in the paper's prose: distance d in Eq. (S9)
    (p. 33 / SI-14, where prose also states 'The repulsion energy epsilon_boundary scales
    exponentially with characteristic length lambda' rather than the potential U_i^boundary), the
    physical meaning of epsilon in Eq. (S12) (p. 34 / SI-15), and both unit-vector component u_{i,alpha}
    and count N (cylinders vs. filaments) in Eq. (S18) (p. 38 / SI-19).
    (2) In SI Section 2.4.3 (p. 39 / SI-20), Eq. (S19) defines 3 x N matrix R^T of centered bead
    coordinates and states that eigenvalues of R^T R correspond to variance along the three principal
    axes; strictly, R^T R is the unnormalized scatter matrix (N times the covariance matrix), though
    N cancels in Sh = lambda_1 / sum(lambda_i), whose 3D range is [1/3, 1].
    (3) Audit reading disagreements/notes on first-reader choices (left unmodified):
    rel_excluded_volume_s5_s6_printed_rescaled labels the K_vol -> K_vol * L^2 mapping as
    provenance: stated even though p. 32 equates Eqs. (S5) and (S6) with identical K_vol without
    mentioning an L^2 rescaling; nematic_order_parameter_eqS18 symbolic() returns only the prolate
    cos^2(theta) >= 1/3 branch (agreeing with all tested runs); and cmp_nematic_aligned_printed_N1
    has note text saying '(not reproduced)' whereas BoxGraph's integer-precision band on printed '1'
    classifies 2.5 vs '1' as 'close'.
    (4) SI Section 2.2.2 (p. 31 / SI-12) states NRM 'is used to simulate unipolar actomyosin bundles
    in this study' (omitting apolar bundles), and SI numbering duplicates Section 2.2 and Subsection
    2.2.2 three times (pp. 20, 30-33).
  citation:
    page: 39
    printed_page: "SI-20"
    quote: "Eigen decomposition of RTR gives eigenvalues"
    where: "SI Sections 2.2.2, 2.3.1, 2.4.2, 2.4.3 (pp. 31-39)"

- id: q_figs10b_fluctuation_and_nonstationarity
  kind: overstated_claim
  about:
    - figs10a_uni_ma0p675_fig
    - figs10b_apo_ma0p0225_fig
    - figs10b_apo_ma0p09_fig
    - figs10b_apo_ma0p675_fig
    - steady_state_window
    - sim_duration
  text: >
    Calibrated digitization of S10 Figure (p. 35 / SI-16) refutes the caption's claim that 'Both
    unipolar and apolar bundles at high myosin mole ratio (0.675) show higher fluctuation in
    Rg(t)/Rg(0) due to myosin activity' for the apolar case and quantifies strong non-stationarity
    during the 'steady state' 1500-2000 s analysis window. In S10(a) (unipolar), M:A = 0.675 indeed
    exhibits a much wider SD band (SD = 0.062 at 1500 s rising to 0.088 at 2000 s, vs ~0.01-0.02
    for lower M:A). In S10(b) (apolar), however, M:A = 0.675 has SD = 0.043-0.050 across 1500-2000 s
    (0.0430 at 1500 s, 0.0495 at 1600 s, 0.0494 at 1900 s, 0.0473 at 2000 s), which is smaller than
    M:A = 0.09 (SD = 0.053-0.056 at 1500-1600 s) and comparable to M:A = 0.0225 (SD = 0.033-0.041).
    Furthermore, Rg(t)/Rg(0) continues to climb steeply across 1500-2000 s in unipolar M:A = 0.675
    (1.125 -> 1.233, +9.6%) and in all six apolar traces (+1.5% to +11.1%), especially M:A = 0.0225
    (1.361 -> 1.511, +11.1%) and M:A = 0.675 (1.541 -> 1.673, +8.6%).
  citation:
    page: 35
    printed_page: "SI-16"
    quote: "Both unipolar and apolar bundles at high myosin mole ratio (0.675) show higher fluctuation"
    where: "S10 Figure caption (p. 35)"

