  text: >
    Neither the main article nor S1 Text states numerical values for most MEDYAN simulation
    parameters, instead referring generally to Popov et al. (2016) [ref-58/ref-S6], Fujiwara et al.
    (2007) [ref-70], and Erdmann et al. (2013) [ref-77/ref-S8]. Omitted parameters include:
