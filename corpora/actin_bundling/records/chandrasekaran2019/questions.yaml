    corrupted Cambridge University Press DOI (10.1017/CBO9781107415324.004) shared with corrupted
    ref-S10 (Gardiner's Handbook of Stochastic Methods merged with a mindfulness-intervention title).
    Main References also duplicate Meyer & Aebi (1990) as ref-15 (with mangled authors 'Resolution H,
    Microscopy E') and ref-78, and duplicate Craig et al. (2011) as ref-34 and ref-97.
  citation:
    page: 34
    printed_page: "SI-15"
    quote: "we employ a Hill [16] type force-velocity relation"
    where: "Eq. (S14) (p. 34) and SI References 10, 16 (p. 41)"

