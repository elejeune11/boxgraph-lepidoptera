- id: q_eqS2_mesoscopic_rate_inverted
  kind: possible_error
  about: [mesoscopic_rate_eqS2, mesoscopic_rate_eqS2_corrected]
  text: >
    Eq. (S2) on p. 31 (SI p. 12) prints c_mu = k_mu * (V_r / N_A)^(n - 1). For a bimolecular
    reaction (n = 2, deterministic k_mu in L/(mol*s), V_r in L, N_A in 1/mol), this gives dimension
    L^2/s rather than 1/s. The standard Gillespie/Kurtz mesoscopic conversion divides by
    (V_r * N_A)^(n - 1) (captured in variant mesoscopic_rate_eqS2_corrected). Note also that for
    the homodimerization example 2A -> B printed immediately above Eq. (S2), an additional factor
    of 2 applies (c_mu = 2 k_mu / (N_A V_r)).
  citation:
    page: 31
    printed_page: "SI-12"
    quote: "Mesoscopic rate constant c μ can be obtained from deterministic rate constant"
    where: "Eq. (S2)"

