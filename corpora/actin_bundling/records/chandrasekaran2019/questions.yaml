    - medyan_3d_bundle_simulation
  text: >
    Line-by-line comparison of chandrasekaran2019's MEDYAN equations (Eqs. S2-S18) and parameters
    against its parent framework paper popov2016 (ref-58 / ref-S6) reveals four categories of
    equation mutations, parameter drifts, and bug propagation (plus 0 cross-record validations, since
    both records are pure MEDYAN simulations with 0 origin: measured experimental datums):
    (1) NMIIA stall-force double error (Eq. S14 vs Popov S3 Eq. 4 & Table 2C): Popov S3 Eq. (4)
    (p. 45) uses F_ext / N_total with single-head stall force F_stall = K_head * d_step = 2.5 * 6 =
    15 pN (Table 2C, p. 61), giving ensemble stall force N_total * F_stall = 225-450 pN for
    N_total = 15-30. Chandrasekaran Eq. (S14) (p. 34) algebraically absorbs N_total into F_stall
    (verified via rel_popov2016_myosin_hill_walking_eqS14) and labels it 'the minifilament stall
    force', but prints F_stall = 12.6 pN—literally Popov Table 2C's single-head unbinding force
    F_NMIIA,unbind = 12.6 pN from the row immediately above F_stall = 15 pN—understating ensemble
    stall force by 17.9x-35.7x. Eq. (S13) also omits Popov's step-size ratio d_step / l_site = 6/27
    converting ensemble walking rate to cylinder-site hopping rate.
    (2) Exact origin of the /pN unit transposition between Eqs. (S11) and (S12): Popov S3 Text (p. 46)
    and Table 2C (p. 61) list alpha = 1.0, beta = 0.2 (dimensionless), gamma = 0.05 /pN, zeta = 0.1.
    Chandrasekaran p. 33-34 silently absorbs alpha = 1.0 into Eq. (S10), renames beta to epsilon,
    and swaps the /pN unit from gamma onto epsilon (gamma = 0.05 dimensionless, epsilon = 0.2 /pN).
    (3) Propagated upstream bugs vs new regressions: Two printed mathematical errors were copied
    verbatim from Popov et al. (2016)—the dropped Jacobian |l_i|*|l_j| between Popov Eqs. (3)-(4)
    and Chandrasekaran Eqs. (S5)-(S6) (where Popov Table 2B also misprints K_vol = 10^5 pN/nm^4
    instead of pN*nm^5, while Chandrasekaran omits K_vol's value and adds a prose typo '|r_i - r_j|^4'),
    and the off-by-one nematic sum i = 0..N divided by N in Popov Eq. (14) copied into Eq. (S18)
    (both refuted by S2 Figure's S <= 0.992 <= 1.0). Two additional regressions appear only in
    Chandrasekaran: Eq. (S2) inverts Popov Table 2A's correct k_sim = k_macro / (N_A * V) into
    k_mu * (V_r / N_A)^(n-1), and SI 2.1.1 (p. 29) corrupts Popov's Kuramoto length l_k = sqrt(6 D tau).
    (4) Undocumented simulation-protocol drifts: diffusion ratios jump 2.5x for alpha-actinin
    (1/10 -> 1/4) and 12.5x for NMIIA (1/100 -> 1/8) (p. 30 vs Popov p. 42 & Table 2A); binding sites
    change from dual occupancy (Popov p. 16) to mutually exclusive occupancy (pp. 30, 32; 4 sites /
    108 nm = 27 nm spacing); minifilament heads shift from 10-30 (Popov p. 16) to 15-30 (pp. 30, 32);
    and myosin-to-actin ratios shift from Popov's R_m:a = 0.005-0.02 (myosin molecules to actin,
    2-8 minifilaments in 1 um^3) to Chandrasekaran's M:A = 0.0225-0.675 (myosin heads to actin,
    multiples of 22.5e-3, up to 33.75x higher, explaining why bundles collapse to asters here at
    M:A >= 0.225-0.675 but never in Popov). Conversely, S11 Figure's chi = 1.0 treadmilling rates
    (0.46-0.58 monomers/(fil. s)) closely match Popov's baseline 0.5 s^-1, and S10 Figure avoids
    Popov's absolute R_g > sqrt(3)*L/2 scale paradox by plotting normalized R_g(t)/R_g(0).
  citation:
    page: 34
    printed_page: "SI-15"
    quote: "where F stall =12.6 pN is the minifilament stall force and"
    where: "SI Sections 2.1-2.4 (pp. 29-39) vs Popov et al. (2016) Eqs. 1-14, S2-S3 Text, Tables 2A-D"

