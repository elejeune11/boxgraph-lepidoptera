    where: "Eqs. (S11)-(S12)"

- id: q_fv_linear_vs_hill_contradiction
  kind: unexplained_difference
  about: [myosin_hill_walking_rate_eqS14, myosin_hill_zeta, myosin_stall_force]
  text: >
    Main text Methods (p. 5) states 'The motor walking rate is given by a linear force-velocity
    relationship for motor walking events', whereas S1 Text Section 2.3.1 Eq. (S14) (p. 34)
    implements a strongly nonlinear hyperbolic Hill-type force-velocity relation with zeta = 0.1
    (k_walk = k^0_walk * (F_stall - F_ext) / (F_stall + F_ext / zeta)), which reduces to a linear
    relation only in the limit zeta -> infinity.
  citation:
    page: 5
    printed_page: "5"
    quote: "The motor walking rate is given by a linear force-velocity relationship"
    where: "Methods (p. 5) vs Eq. (S14) (p. 34)"

- id: q_eqS18_sum_index_off_by_one
  kind: possible_error
  about:
    - nematic_order_parameter_eqS18
    - nematic_order_parameter_eqS18_sum1toN
    - nematic_order_aligned_limit
    - nematic_order_random_limit
  text: >
    Eq. (S18) on p. 38 (SI p. 19) prints Q_{ab} = (3/2) * ((1/N) * sum_{i=0}^{N} u_{ia} u_{ib} -
    (1/3) delta_{ab}), summing N + 1 terms (i = 0..N) while dividing by N. This makes Tr(Q) =
    3/(2N) != 0, gives S = 1 + 3/(2N) > 1 for absolute alignment (e.g., S = 2.5 at N = 1, failing
    to reproduce the stated limit 1), and gives S = 1/(2N) > 0 for an isotropic network. The
    corrected variant (sum i = 1..N) reproduces both stated limits S = 0 and S = 1 exactly.
  citation:
    page: 38
    printed_page: "SI-19"
    quote: "Order parameter 0 corresponds to random network while 1 represents absolute alignment."
    where: "Eq. (S18)"

