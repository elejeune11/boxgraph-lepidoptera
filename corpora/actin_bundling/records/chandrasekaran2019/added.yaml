# Unstated inputs required to exercise the paper's printed closed-form MEDYAN submodels
# (Eqs. S1-S19) and their corrected variants. Every omitted MEDYAN parameter is also
# documented as an unstated_input question in questions.yaml.

- id: avogadro_constant_added
  quantity: avogadro_constant
  unit: 1/mol
  printed: "6.02214076 x 10^23"
  basis: "Exact 2019 SI / CODATA Avogadro constant N_A, referenced by symbol in Eq. (S2) (p. 31)."
  alternatives: ["6.022 x 10^23"]
  stands_for: "N_A in Eq. (S2)"

- id: d_actin_added
  quantity: diffusion_coefficient
  unit: um^2/s
  printed: "20"
  basis: "Unstated in Chandrasekaran 2019; typical cytosolic/MEDYAN G-actin diffusion constant (~20 um^2/s in Popov et al. 2016 [ref-58/ref-S6])."
  alternatives: ["5", "50"]
  stands_for: "G-actin diffusion coefficient D_actin in SI Section 2.1.1 (p. 30)"

- id: species_copy_number_test
  quantity: count
  unit: dimensionless
  printed: "100"
  basis: "Representative reactant copy number per 500 nm compartment to exercise homodimer degeneracy gamma = X_A(X_A-1)/2 (p. 31)."
  alternatives: ["10", "1000"]
  stands_for: "X_A in SI Section 2.2 (p. 31)"

- id: k_mu_bimolecular_added
  quantity: bimolecular_rate_constant
  unit: L/(mol*s)
  printed: "1.16 x 10^7"
  basis: "Unstated in Chandrasekaran 2019; standard ATP-actin barbed-end association rate constant (~11.6 uM^-1 s^-1 from Fujiwara et al. [ref-70] / Popov et al. [ref-58])."
  alternatives: ["1.0 x 10^6", "1.0 x 10^8"]
  stands_for: "k_mu in Eq. (S2) for n=2 (p. 31)"

- id: compartment_volume_added
  quantity: volume
  unit: L
  printed: "1.25 x 10^-16"
  basis: "Volume of one cubic 500 nm compartment ((0.5 um)^3 = 0.125 um^3 = 1.25e-16 L), derived from compartment_size_medyan = 500 nm (p. 29)."
  alternatives: ["9.0 x 10^-15"]
  stands_for: "V_r in Eq. (S2) (p. 31)"

- id: random_draw_r_mu_test
  quantity: dimensionless_parameter
  unit: dimensionless
  printed: "0.5"
  basis: "Median uniform random draw r_mu in (0, 1) to exercise the Next Reaction Method waiting time tau_mu = (1/a_mu) ln(1/r_mu) (p. 31)."
  alternatives: ["0.1", "0.9"]
  stands_for: "r_mu in SI Section 2.2.2 (p. 31)"

- id: k_str_actin_added
  quantity: spring_stiffness
  unit: pN/nm
  printed: "100"
  basis: "Unstated in Chandrasekaran 2019; representative MEDYAN actin cylinder stretching stiffness (Popov et al. 2016 [ref-58])."
  alternatives: ["50", "400"]
  stands_for: "K_str in Eq. (S3) (p. 32)"

- id: l_cyl_stretched_test
  quantity: cylinder_length
  unit: nm
  printed: "109"
  basis: "1 nm axial extension above l_0^m = 108 nm to exercise Eq. (S3) (p. 32)."
  alternatives: ["108.1", "110"]
  stands_for: "|l_i| in Eq. (S3) (p. 32)"

- id: eps_bend_actin_added
  quantity: energy
  unit: pN*nm
  printed: "645"
  basis: "Unstated in Chandrasekaran 2019; estimated from l_p * k_B T / l_0^m = 17000 nm * 4.1 pN*nm / 108 nm ~ 645 pN*nm (at T = 298 K)."
  alternatives: ["600", "672"]
  stands_for: "epsilon_bend in Eq. (S4) (p. 32)"

- id: theta_hinge_test
  quantity: angle
  unit: rad
  printed: "0.1"
  basis: "Representative small inter-cylinder bending angle (~5.7 deg) to exercise Eq. (S4) (p. 32)."
  alternatives: ["0.05", "0.5"]
  stands_for: "theta_{i,i+1} in Eq. (S4) (p. 32)"

- id: k_vol_s5_added
  quantity: excluded_volume_strength_s5
  unit: pN*nm^3
  printed: "1000"
  basis: "Unstated in Chandrasekaran 2019; representative excluded-volume coefficient in Eq. (S5) units (energy * length^2)."
  alternatives: ["100", "10000"]
  stands_for: "K_vol in Eq. (S5) (p. 32)"

- id: k_vol_s6_added
  quantity: excluded_volume_strength_s6
  unit: pN*nm^5
  printed: "1.0 x 10^5"
  basis: "Unstated in Chandrasekaran 2019; representative MEDYAN excluded-volume repulsion strength in Eq. (S6) / Fig. 1 units (energy * length^4, Popov et al. 2016 [ref-58])."
  alternatives: ["1.0 x 10^4", "1.0 x 10^6"]
  stands_for: "K_vol in Eq. (S6) (p. 32) and Fig. 1 (p. 5)"

- id: d_cylinder_sep_test
  quantity: separation_distance
  unit: nm
  printed: "35"
  basis: "Initial hexagonal bundle spacing (35 nm, p. 6) used as test inter-cylinder separation d for Eqs. (S5)-(S6) and boundary distance for Eq. (S9)."
  alternatives: ["10", "50"]
  stands_for: "perpendicular separation d in Eqs. (S5)-(S6) and boundary distance d in Eq. (S9)"

- id: k_str_mf_added
  quantity: spring_stiffness
  unit: pN/nm
  printed: "2.5"
  basis: "Unstated in Chandrasekaran 2019; representative MEDYAN myosin minifilament stretching constant (Popov et al. 2016 [ref-58])."
  alternatives: ["1.0", "10.0"]
  stands_for: "K_str^MF in Eq. (S7) (p. 32)"

- id: l0_mf_added
  quantity: binding_distance
  unit: nm
  printed: "200"
  basis: "Midpoint of the stated 175-225 nm minifilament binding distance range (p. 5, p. 30)."
  alternatives: ["175", "225"]
  stands_for: "l_0^MF in Eq. (S7) (p. 32) and Fig. 1 (p. 5)"

- id: l_mf_stretched_test
  quantity: binding_distance
  unit: nm
  printed: "205"
  basis: "5 nm extension beyond l_0^MF = 200 nm to exercise Eq. (S7) (p. 32)."
  alternatives: ["201", "220"]
  stands_for: "|l_ij| in Eq. (S7) (p. 32)"

- id: k_str_linker_added
  quantity: spring_stiffness
  unit: pN/nm
  printed: "8.0"
  basis: "Unstated in Chandrasekaran 2019; representative MEDYAN alpha-actinin stretching stiffness (Popov et al. 2016 [ref-58])."
  alternatives: ["1.0", "20.0"]
  stands_for: "K_str^linker in Eq. (S8) (p. 32)"

- id: l0_linker_added
  quantity: binding_distance
  unit: nm
  printed: "35"
  basis: "Midpoint of the stated 30-40 nm alpha-actinin binding distance range (p. 5, p. 30), matching hexagonal lattice spacing 35 nm (p. 6)."
  alternatives: ["30", "40"]
  stands_for: "l_0^alpha in Eq. (S8) (p. 32) and Fig. 1 (p. 5)"

- id: l_linker_stretched_test
  quantity: binding_distance
  unit: nm
  printed: "38"
  basis: "3 nm extension beyond l_0^alpha = 35 nm to exercise Eq. (S8) (p. 32)."
  alternatives: ["36", "40"]
  stands_for: "|l_ij| in Eq. (S8) (p. 32)"

- id: eps_boundary_added
  quantity: energy
  unit: pN*nm
  printed: "41"
  basis: "Unstated in Chandrasekaran 2019; representative MEDYAN boundary repulsion energy (~10 k_B T, Popov et al. 2016 [ref-58])."
  alternatives: ["4.1", "410"]
  stands_for: "epsilon_boundary in Eq. (S9) (p. 33)"

- id: lambda_boundary_added
  quantity: decay_length
  unit: nm
  printed: "2.7"
  basis: "Unstated in Chandrasekaran 2019; representative MEDYAN boundary screening length (~1 actin monomer length, Popov et al. 2016 [ref-58])."
  alternatives: ["1.0", "10.0"]
  stands_for: "lambda in Eq. (S9) (p. 33)"

- id: n_total_heads_test
  quantity: count
  unit: dimensionless
  printed: "20"
  basis: "Representative total head count within the stated 15-30 range (pp. 30, 32) to exercise Eqs. (S10)-(S13)."
  alternatives: ["15", "30"]
  stands_for: "N_total in Eqs. (S10), (S11), (S13) (pp. 33-34)"

- id: k_nmiia_bind_added
  quantity: reaction_rate
  unit: 1/s
  printed: "0.2"
  basis: "Unstated in Chandrasekaran 2019; representative NMIIA single-head binding rate (Popov et al. 2016 [ref-58] / Erdmann et al. 2013 [ref-S8])."
  alternatives: ["0.05", "1.0"]
  stands_for: "k_NMIIA,bind / k_NMII,bind in Eqs. (S10) and (S13) (pp. 33-34)"

- id: f_ext_motor_test
  quantity: force
  unit: pN
  printed: "5.0"
  basis: "Representative sub-stall external force (< F_stall = 12.6 pN) to exercise Eqs. (S11), (S12), (S14), and (S15) (p. 34)."
  alternatives: ["0", "10.0"]
  stands_for: "F_ext in Eqs. (S11), (S12), (S14), and (S15) (p. 34)"

- id: gamma_myosin_bound_heads_corrected
  quantity: inverse_force
  unit: 1/pN
  printed: "0.05"
  basis: "Numeric value 0.05 printed on p. 34 without unit, given its dimensionally required unit 1/pN for corrected variant of Eq. (S11)."
  alternatives: ["0.02", "0.1"]
  stands_for: "gamma (with corrected 1/pN unit) in Eq. (S11) variant (p. 34)"

- id: epsilon_myosin_unbind_corrected
  quantity: dimensionless_parameter
  unit: dimensionless
  printed: "0.2"
  basis: "Numeric value 0.2 printed on p. 34 as '0.2 /pN', stripped of its dimensionally invalid '/pN' unit for corrected variant of Eq. (S12) (matching dimensionless tunability factor beta=0.2 in Popov et al. 2016 [ref-58])."
  alternatives: ["0.1", "0.5"]
  stands_for: "epsilon (with corrected dimensionless unit) in Eq. (S12) variant (p. 34)"

- id: k0_nmiia_unbind_added
  quantity: reaction_rate
  unit: 1/s
  printed: "1.7"
  basis: "Unstated in Chandrasekaran 2019; representative NMIIA zero-load unbinding rate (Popov et al. 2016 [ref-58])."
  alternatives: ["0.5", "5.0"]
  stands_for: "k^0_NMIIA,unbind in Eq. (S12) (p. 34)"

- id: f_nmiia_unbind_added
  quantity: force
  unit: pN
  printed: "12.6"
  basis: "Unstated in Chandrasekaran 2019; representative NMIIA single-head characteristic unbinding force (Popov et al. 2016 [ref-58])."
  alternatives: ["5.0", "20.0"]
  stands_for: "F_NMIIA,unbind in Eq. (S12) (p. 34)"

- id: k0_alpha_unbind_added
  quantity: reaction_rate
  unit: 1/s
  printed: "0.3"
  basis: "Unstated in Chandrasekaran 2019; representative alpha-actinin zero-load unbinding rate (Popov et al. 2016 [ref-58])."
  alternatives: ["0.1", "1.0"]
  stands_for: "k^0_alpha,unbind in Eq. (S15) (p. 34)"

- id: f_alpha_unbind_added
  quantity: force
  unit: pN
  printed: "17.2"
  basis: "Unstated in Chandrasekaran 2019; representative alpha-actinin characteristic slip-bond unbinding force (Popov et al. 2016 [ref-58])."
  alternatives: ["5.0", "30.0"]
  stands_for: "F_alpha,unbind in Eq. (S15) (p. 34)"

- id: dist_mu1_test
  quantity: distribution_mean
  unit: nm
  printed: "2000"
  basis: "Representative filament-end separation mean (~bundle length 2 um) to exercise KL/JS divergences (Eqs. S16-S17, p. 38)."
  alternatives: ["1000", "3000"]
  stands_for: "mean of distribution P in Eq. (S17)"

- id: dist_sigma1_test
  quantity: distribution_stddev
  unit: nm
  printed: "200"
  basis: "Representative narrow distance-distribution width for a bundle state to exercise Eq. (S17) (p. 38)."
  alternatives: ["100", "500"]
  stands_for: "standard deviation of distribution P in Eq. (S17)"

- id: dist_mu2_test
  quantity: distribution_mean
  unit: nm
  printed: "2500"
  basis: "Representative shifted mean for a second morphology state to exercise Eq. (S17) (p. 38)."
  alternatives: ["2000", "4000"]
  stands_for: "mean of distribution Q in Eq. (S17)"

- id: dist_sigma2_test
  quantity: distribution_stddev
  unit: nm
  printed: "400"
  basis: "Representative broader distance-distribution width for a disordered/aster state to exercise Eq. (S17) (p. 38)."
  alternatives: ["200", "800"]
  stands_for: "standard deviation of distribution Q in Eq. (S17)"

- id: theta_aligned_exact
  quantity: angle
  unit: rad
  printed: "0"
  basis: "Exact zero polar angle representing absolute nematic alignment (p. 38)."
  alternatives: ["0.01"]
  stands_for: "polar angle theta = 0 for absolute alignment in Eq. (S18)"

- id: theta_isotropic_3d
  quantity: angle
  unit: rad
  printed: "0.955316618"
  basis: "Magic angle arccos(1/sqrt(3)) where cos^2(theta) = 1/3, representing a 3D isotropic random network in Eq. (S18) (p. 38)."
  alternatives: ["0.955"]
  stands_for: "effective polar angle arccos(1/sqrt(3)) for isotropic 3D network in Eq. (S18)"

- id: lambda1_bundle_test
  quantity: variance_eigenvalue
  unit: um^2
  printed: "1.0"
  basis: "Representative primary principal axis variance for a bundle-like configuration to exercise Eq. (S19) (p. 39)."
  alternatives: ["0.5", "2.0"]
  stands_for: "lambda_1 in Eq. (S19) / Sh = lambda_1 / sum(lambda_i)"

- id: lambda2_bundle_test
  quantity: variance_eigenvalue
  unit: um^2
  printed: "0.02"
  basis: "Representative minor transverse variance for a bundle-like configuration to exercise Eq. (S19) (p. 39)."
  alternatives: ["0.01", "0.5"]
  stands_for: "lambda_2 in Eq. (S19) / Sh = lambda_1 / sum(lambda_i)"

- id: lambda3_bundle_test
  quantity: variance_eigenvalue
  unit: um^2
  printed: "0.02"
  basis: "Representative minor transverse variance for a bundle-like configuration to exercise Eq. (S19) (p. 39)."
  alternatives: ["0.01", "0.5"]
  stands_for: "lambda_3 in Eq. (S19) / Sh = lambda_1 / sum(lambda_i)"

- id: n_single_filament_test
  quantity: count
  unit: dimensionless
  printed: "1"
  basis: "Single aligned segment N=1 test case exposing the off-by-one summation i=0..N in printed Eq. (S18) (gives S=2.5 vs printed limit 1)."
  alternatives: ["2", "30"]
  stands_for: "N in Eq. (S18) (p. 38)"

