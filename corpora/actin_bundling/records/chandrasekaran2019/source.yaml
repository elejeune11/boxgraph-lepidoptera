notes: >
  Complete reading of Chandrasekaran, Upadhyaya & Papoian (PLoS Comput. Biol. 15(7): e1007156,
  2019), covering the main article (PDF pp. 1-19) and converted S1 Text Supporting Information
  (s001.docx, PDF pp. 20-41, SI pp. 1-22). All 41 extracted text pages were inspected and all
  pages containing figures, equations, or key numbers were verified directly against rendered
  page images (pages/page-NNN.png).

  In scope: (1) Three non-runnable models recorded explicitly with runnable: false (the full 3D
  MEDYAN active actomyosin bundle simulation, the corrupted Kuramoto-length equation rendering
  on p. 29, and the trajectory-level hierarchical clustering pipeline); (2) all closed-form
  mechanochemical, chemical-kinetic, mechanical-potential, order-parameter, and study-design
  equations stated across Fig. 1, Methods, Results, and S1 Text Eqs. S1-S19 (29 runnable
  printed/from-words models); (3) 5 variant_of corrected models beside their verbatim printed
  counterparts for evident dimensional/mathematical misprints (Eq. S2 inverted volume/Avogadro
  scaling, Eq. S6 omitted Jacobian |l_i||l_j| relative to Eq. S5, Eq. S11 omitted 1/pN unit on
  gamma = 0.05, Eq. S12 spurious /pN unit on epsilon = 0.2 /pN, and Eq. S18 off-by-one sum
  i=0..N divided by N); (4) all printed MEDYAN parameters, experimental grid specifications,
  derived condition counts/morphology fractions/rescue folds, and key cited literature values;
  and (5) within-paper stated relations and 16 open questions documenting omitted parameters,
  misprints, and internal contradictions.

  Left out of data.yaml: No numerical tables exist in the article or S1 Text. External trajectory
  data hosted at https://doi.org/10.13016/hpka-smll and five MP4 movies (S1-S5 Movies) are not
  part of the PDF.

  Figure catalog for downstream digitize stage (deferred from this read stage):
  Quantitative plots eligible for digitization:
    - S4 Figure (p. 24 / SI-5): Bound crosslinker mole ratio alpha_bound:A (0-0.045) vs total
      alpha:A (0-0.8) with mean +/- SD error bars across 6 M:A ratios (0.0225-0.675), unipolar
      (left) and apolar (right). High-priority target.
    - S10 Figure (p. 35 / SI-16): Time series of Rg(t)/Rg(0) vs time (0-2000 s) with mean +/- SD
      shaded bands at alpha:A = 0.1 across 6 M:A ratios, (a) unipolar (y: 0.7-1.4) and (b) apolar
      (y: 0.8-2.0). High-priority target.
    - S11 Figure (p. 36 / SI-17): Treadmilling rate (monomers/(fil. s), 0-7) vs chi (0-10) with
      mean +/- SD error bars across 4 M:A ratios (0.0225, 0.09, 0.225, 0.675) and 3 alpha:A
      ratios (0.01, 0.1, 0.4), unipolar (a-c) and apolar (d-f). High-priority target.
    - S2 Figure (p. 23 / SI-4, mislabeled 'S1 Figure'): Scatter plot with mean +/- SD error bars
      of Shape Parameter (0-1) vs Nematic Order Parameter (0-1, misspelled 'Nemetic') for 42
      non-treadmilling conditions, colored by BL/ABI/AL (unlabeled individual points; uncalibrated
      inset axes).
    - S3 Figure (p. 23 / SI-4): Radial distribution order parameter g(r_barb)/g(r) (0-25) vs
      r (0-1000 nm; inset 0-6000 nm) for 42 overlapping unlabeled curves per polarity.
    - Fig. 6D (p. 12): Probability density P(d) of NMIIA (dotted) and alpha-actinin (solid) vs
      distance d (0-4000 nm) at M:A = 0.0225, chi = 1.0, alpha:A = 0.01/0.1/0.4 (note: vertical
      axis P(d) has no numerical tick labels, so only peak x-positions or relative shapes can be
      read).
    - S12 Figure panel b (p. 37 / SI-18): Illustrative Dis--, Dis+-, Dis++ histograms (0-8000 nm)
      for two example conditions (alpha:A = 0.05, M:A = 0.0225 vs 0.675).
  Non-digitizable figures (schematics, cartoons, snapshots, dendrograms):
    - Fig. 1 (p. 5): Mechanical model schematic with potentials.
    - Fig. 2 (p. 7) and Fig. 3 (p. 8): 7x6 grids of non-treadmilling unipolar/apolar snapshots.
    - Fig. 4 (p. 8): Circular complete-linkage dendrograms with snapshots.
    - Fig. 5 (p. 11): Schematic cartoon phase diagrams (M:A vs chi).
    - Fig. 6A-C (p. 12): Cartoon + snapshots of apolar treadmilling bundles.
    - S1 Figure (p. 22 / SI-3): Bundle polarity organization schematic.
    - S5 Figure (p. 24 / SI-5): Circular treadmilling dendrograms + 6 anomalous-cluster snapshots.
    - S6-S9 Figures (pp. 25-28 / SI-6 to SI-9): Treadmilling snapshot grids + inset dendrograms.
    - S12 Figure panels a, c, d (p. 37 / SI-18): Clustering algorithm schematic.
    - Figure S10 [second S10, actually S13] (p. 40 / SI-21): Flexible volume schematic.
