# ---------------------------------------------------------------------------
# Cross-record relations with popov2016 (Popov, Komianos & Papoian, PLoS
# Comput. Biol. 12: e1004877, 2016; ref-58 / ref-S6).
# chandrasekaran2019 directly runs and documents the MEDYAN force field and
# mechanochemical cycle introduced in popov2016 (Eqs. S2-S15 vs Popov Eqs.
# 1-4, 9-11, Table 2A, S3 Eqs. 1-6).
#
# Notes on excluded pairs:
# - nematic_order_parameter_eqS18[_sum1toN] vs popov2016/nematic_order_parameter_eq14:
#   popov2016/nematic_order_parameter_eq14 is runnable: false (cannot be tested
#   in relations.yaml); exact verbatim propagation of the sum_{i=0}^{N} off-by-one
#   bug from Popov Eq. (14) to Eq. (S18) is documented in questions.yaml.
# - kuramoto_length_s211 vs popov2016/kuramoto_length_s2eq1: kuramoto_length_s211
#   is runnable: false (corrupted DOCX-to-PDF rendering on p. 29).
# - diffusion_coefficients_s211 (D_alpha = r_alpha * D_actin, 1 op) vs
#   popov2016/reduced_diffusion_constant_s2a (D_species = D_actin / factor, 1 op):
#   omitted as trivial 1-op reciprocal; the 2.5x (1/10 -> 1/4) and 12.5x
#   (1/100 -> 1/8) diffusion speedup drift is logged in questions.yaml.
# - Printed unit-corrupted models (mesoscopic_rate_eqS2, myosin_bound_heads_eqS11,
#   myosin_unbinding_catch_bond_eqS12) fail dimensional conversion against popov2016;
#   relations below link their dimensionally corrected variants and document the
#   exact misprints in questions.yaml.
# ---------------------------------------------------------------------------

- id: rel_popov2016_mesoscopic_rate_eqS2_corrected
