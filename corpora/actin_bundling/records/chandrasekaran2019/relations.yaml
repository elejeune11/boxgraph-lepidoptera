  regime:
    K_str: [10.0, 200.0]
    l_0: [25.0, 110.0]
    l_i: [115.0, 140.0]
  provenance: proposed
  reason: >
    Both coarse-grained actin models enforce filament inextensibility via a quadratic harmonic bond
    stretching potential: MEDYAN Eq. (S3) writes U_str = (1/2) K_str (l_i - l_0)^2 in physical units
    [pN*nm], while Chandrasekaran et al. (2024) Supplementary Table 1 uses LAMMPS bond_style harmonic
    U_bond = K_bond (r - r0)^2 in dimensionless LJ k_B T units (absorbing 1/2 into K_bond). Because
    outputs have distinct units (pN*nm vs dimensionless), scales_as verifies exact equality of all
    three log-slopes (+1 in K_str, 2*l_i/(l_i - l_0) in l_i, and -2*l_0/(l_i - l_0) in l_0) anchored
    at Chandrasekaran 2024's LJ scales sigma = 30 nm and k_B T = 4.11 pN*nm.
  assumptions:
    - "Strictly stretched regime l_i > l_0 so harmonic energy is strictly positive across the sampled domain."
    - "Fixed LJ reference scales sigma = 30 nm and k_B T = 4.11 pN*nm (constant scale factors preserve all log-slopes)."

- id: rel_chandrasekaran2024_actin_bending_scales_lammps_angle
  kind: scales_as
  a: chandrasekaran2019/actin_bending_eqS4
  b: chandrasekaran2024/lammps_harmonic_angle_potential
  mapping:
    K_angle: "eps_bend / (2 * 4.11)"
    theta: "3.141592653589793 - theta"
    theta0: "3.141592653589793"
  output_map:
    U_angle: U_bend
  regime:
    eps_bend: [100.0, 5000.0]
    theta: [0.005, 0.1]
  provenance: proposed
  reason: >
    Connects MEDYAN's finite-angle cosine hinge bending potential U_bend = eps_bend * (1 - cos theta)
    (chandrasekaran2019 Eq. S4, p. 32, in pN*nm) to the LAMMPS harmonic angle bending potential
    U_angle = K_angle * (theta_LAMMPS - pi)^2 (chandrasekaran2024 Supplementary Table 1, in
    dimensionless k_B T units) in the semiflexible small-angle bend regime (theta in [0.005, 0.1] rad,
    spanning the thermal RMS bend angle ~0.11 rad for 108 nm segments with l_p = 17 um). With
    theta_LAMMPS = pi - theta and K_angle = eps_bend / (2 * k_B T), log-slopes match identically in
    eps_bend (+1) and to within theta^2/6 <= 1.67e-3 << 1e-2 in theta (+2).
  assumptions:
    - "Small-angle semiflexible regime theta in [0.005, 0.1] rad (deviation from quadratic scaling is theta^2/6 <= 0.17%)."
    - "Straight-filament equilibrium angle theta0 = pi in LAMMPS (theta_LAMMPS = pi - theta) with k_B T = 4.11 pN*nm."

