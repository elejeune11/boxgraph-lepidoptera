# 16192-16197, 2019; bioRxiv preprint cited as ref-83 on p. 7; AFINES
# framework also compared on p. 4 via ref-68).
# All 3 relations below compare the shared microscopic actin-filament and
# crosslinker mechanical potentials between MEDYAN and AFINES.
