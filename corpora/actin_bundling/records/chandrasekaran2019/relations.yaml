- id: rel_freedman2019_actin_stretching_eqS3
  kind: same_as
  a: freedman2019/filament_potential_si_eq1
  b: chandrasekaran2019/actin_stretching_eqS3
  mapping:
    K_str: "k_a / 1000"
    l_i: "1000 * r"
    l_0: "1000 * l_a"
  output_map:
    U_str: U_stretch
  regime:
    k_a: [1.0, 100000.0]
    l_a: [0.05, 1.0]
    r: [1.05, 1.5]
    kappa_B: [0.01, 0.5]
    theta: [0.01, 0.5]
  provenance: proposed
  reason: >
    Both coarse-grained cytoskeletal simulators (MEDYAN in chandrasekaran2019 Eq. S3, p. 32;
    AFINES in freedman2019 SI Eq. 1) use the exact same harmonic filament-segment stretching
    potential U_stretch = (1/2) k * (l - l_0)^2, differing only in unit conventions (pN/nm & nm
    vs pN/um & um; BoxGraph converts output pN*nm <-> pN*um) and parameter stiffness (AFINES uses
    k_a = 5 pN/um = 0.005 pN/nm, 20,000x softer than MEDYAN's 100 pN/nm from Popov 2016).
  assumptions:
    - "Compares the stretching component U_stretch of freedman2019/filament_potential_si_eq1 (independent of kappa_B and theta)."

- id: rel_freedman2019_actin_bending_derived_harmonic
  kind: derived_from
  a: chandrasekaran2019/actin_bending_eqS4
  b: freedman2019/filament_potential_si_eq1
  steps:
    - "series: theta -> 0, 4"
    - "simplify"
  mapping:
    k_a: "5"
    r: "27 / 250"
    l_a: "27 / 250"
    kappa_B: "27 * eps_bend / 250000"
    theta: "theta"
  output_map:
    U_bend: U_bend
  regime:
    eps_bend: [100.0, 5000.0]
    theta: [0.01, 1.0]
  provenance: proposed
  reason: >
    Expanding MEDYAN's finite-angle cosine hinge bending potential U_bend = eps_bend * (1 - cos theta)
    (chandrasekaran2019 Eq. S4, p. 32, in pN*nm) to leading nonvanishing order around theta = 0
    yields AFINES's quadratic harmonic bending potential U_bend = (kappa_B / (2 l_a)) * theta^2
    (freedman2019 SI Eq. 1, in pN*um) identically under the discrete wormlike-chain identification
    eps_bend = kappa_B / l_a (= l_p k_B T / l_0). Symbolic series expansion avoids float64
    cancellation in 1 - cos(theta) at theta = 1e-8 rad.
  assumptions:
    - "Discrete bending energy identification eps_bend = kappa_B / l_a (at l_a = 27/250 = 0.108 um, kappa_B / l_a = eps_bend / 1000 pN*um independent of l_a; k_a and r do not enter U_bend)."

- id: rel_freedman2019_actin_bending_approx_harmonic
  kind: approximated_by
  a: chandrasekaran2019/actin_bending_eqS4
  b: freedman2019/filament_potential_si_eq1
  mapping:
    k_a: "5"
    r: "0.108"
    l_a: "0.108"
    kappa_B: "eps_bend * 0.108 / 1000"
    theta: "theta"
  output_map:
    U_bend: U_bend
  regime:
    eps_bend: [100.0, 5000.0]
    theta: [0.01, 0.35]
  tolerance: 0.02
  provenance: proposed
  reason: >
    Across physiological semiflexible F-actin inter-segment bend angles theta in [0.01, 0.35] rad
    (spanning up to ~3x the thermal RMS bend angle sqrt(2*l_0/l_p) = 0.11 rad for 108 nm segments
    at l_p = 17 um), AFINES's quadratic harmonic bending potential (kappa_B / (2 l_a)) * theta^2
    approximates MEDYAN's cosine potential eps_bend * (1 - cos theta) to within ~theta^2/12 <= 1.03%
    (stated tolerance 2%).
  assumptions:
    - "Discrete bending stiffness identification eps_bend = kappa_B / l_a across bend angles theta in [0.01, 0.35] rad."

- id: rel_freedman2019_crosslinker_stretching_eqS8
  kind: same_as
  a: freedman2019/crosslinker_potential_si_eq4
  b: chandrasekaran2019/crosslinker_stretching_eqS8
  mapping:
    K_str_linker: "k_xl / 1000"
    l_ij: "1000 * r"
    l_0: "1000 * l_xl"
  output_map:
    U_linker: U_stretch
  regime:
    k_xl: [5.0, 10000.0]
    r: [0.35, 0.6]
    l_xl: [0.03, 0.3]
    kappa_xl_B: [0.001, 0.05]
    alpha_L: [1.0, 2.0]
    alpha_R: [1.0, 2.0]
    I_L: [0.6, 1.0]
    I_R: [0.6, 1.0]
    k_on_1: [0.5, 5.0]
    k_off_1: [0.01, 0.5]
    k_on_2: [0.5, 5.0]
    k_off_2: [0.01, 0.5]
    T: [290.0, 310.0]
  provenance: proposed
  reason: >
    Both MEDYAN (chandrasekaran2019 Eq. S8, p. 32) and AFINES (freedman2019 SI Eq. 4, stretching
    term U_stretch) model bound passive crosslinker extension as a linear Hookean spring
    (1/2) k_xl (r - l_xl)^2 (whereas AFINES additionally adds angular crosslinker-hinge bending
    U_bend and chemical binding affinity U_bind, and softens k_xl = 10 pN/um = 0.01 pN/nm by 800x
    relative to MEDYAN's alpha-actinin K_str^linker = 8 pN/nm from Popov 2016).
  assumptions:
    - "Compares only the stretching energy output U_stretch of freedman2019/crosslinker_potential_si_eq4 against MEDYAN's purely extensional spring U_linker (r > l_xl across sampled regime)."

