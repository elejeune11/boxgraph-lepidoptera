- id: rel_chandrasekaran2024_actin_stretching_scales_lammps_bond
  kind: scales_as
  a: chandrasekaran2019/actin_stretching_eqS3
  b: chandrasekaran2024/lammps_harmonic_bond_potential
  mapping:
