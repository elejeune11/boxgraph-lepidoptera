  regime:
    k_macro: [0.1, 20.0]
    l_comp: [100.0, 1000.0]
  provenance: proposed
  reason: >
    Links Popov et al. (2016) Table 2A's compartment bimolecular rate conversion
    k_sim = k_macro / (N_A * l_comp^3) (p. 59) to Chandrasekaran et al. (2019)
    Eq. (S2)'s dimensionally corrected Gillespie/Kurtz variant c_mu = k_mu / (V_r * N_A)
    (p. 31 / SI-12, bimolecular order n = 2) for cubic RDME compartments V_r = l_comp^3
    with CODATA N_A = 6.02214076e23 mol^-1 and 1 uM^-1 s^-1 = 10^6 L/(mol*s).
    Printed Eq. (S2) in chandrasekaran2019 erroneously inverts V_r to k_mu * (V_r / N_A).
  assumptions:
