- id: T_room_added
  quantity: temperature
  unit: K
  printed: "297.15"
  basis: >
    SI Section I.e (p. 16) reports that microscopy was performed at room temperature (~24 degC = 297.15 K).
    Main Text p. 7 (Eq. 1 and Pi = k_B*T/xi^3) and SI I.h.1 p. 19 (van 't Hoff osmotic pressure) state
    'at room temperature' without specifying a numerical temperature.
  alternatives: ["295.15", "298.15", "300"]
  stands_for: "T in Eq. (1), van 't Hoff Pi = c*N_A*k_B*T, and Pi = k_B*T/xi^3"

- id: d_actin_added
  quantity: actin_filament_diameter
  unit: nm
  printed: "7"
  basis: >
    Standard diameter of a single F-actin filament (~7 nm); not stated anywhere in mccall2018 even though
    d appears explicitly in Main Text Eq. (1) (p. 7).
  alternatives: ["6", "8", "10"]
  stands_for: "d in Main Text Eq. (1)"

- id: delta_L_actin_added
  quantity: actin_subunit_axial_rise
  unit: nm
  printed: "2.7"
  basis: >
    Canonical axial rise per monomer subunit along an F-actin filament (~2.7-2.75 nm, ~370 subunits/um);
    not stated in mccall2018 for the p. 7 estimate 'a 250-nm filament (~90 actin subunits)'.
  alternatives: ["2.75", "2.8"]
  stands_for: "axial length per actin subunit in the 250-nm (~90 subunits) estimate on p. 7"

- id: eta_water_added
  quantity: water_viscosity
  unit: mPa*s
  printed: "0.91"
  basis: >
    Dynamic viscosity of liquid water at ~24 degC (0.91 mPa*s; 0.89 mPa*s at 25 degC, 1.0 mPa*s at 20 degC);
    not stated explicitly on p. 3 when reporting coacervate viscosity as '~1000-fold higher than water'.
  alternatives: ["1.0", "0.89"]
  stands_for: "viscosity of water in '~1000-fold higher than water' (p. 3)"

- id: Z_c_counterion_added
  quantity: counterion_valency
  unit: dimensionless
  printed: "1"
  basis: >
    Monovalent counterions (Cl- for pLK hydrochloride, Na+ for pRE sodium salt; Z_c = 1), implicitly set
    to 1 when passing from SI Eq. (9) to SI Eq. (10) on p. 21.
  alternatives: ["2"]
  stands_for: "Z_c in SI Eqs. (8)-(10)"

- id: S_salt_zero_added
  quantity: salt_ionic_sum
  unit: mol/L
  printed: "0"
  basis: >
    Salt-free limit explicitly assumed on SI p. 21 ('in absence of added salts... where the sum over gamma
    vanishes'); alternative 0.28 mol/L = 2 * 140 mM reflects the ~140 mM monovalent salt noted on p. 21.
  alternatives: ["0.28"]
  stands_for: "sum_gamma Z_gamma^2 * c_gamma in SI Eqs. (8)-(9) in the salt-free limit"

- id: l_B_water_added
  quantity: bjerrum_length
  unit: angstrom
  printed: "7.1"
  basis: >
    Standard Bjerrum length in water at room temperature (~7.1 A); cancels out when substituting SI Eq. (8)
    into SI Eq. (7) to form Eq. (9), needed only to evaluate Eqs. (7) and (8) separately.
  alternatives: ["7.0", "7.15"]
  stands_for: "l_B in SI Eqs. (7) and (8)"

- id: f_pp_lower_bound_added
  quantity: polypeptide_mass_fraction
  unit: dimensionless
  printed: "0.19"
  basis: >
    SI I.h.5 (p. 21) reports a mesh size of 5.8 nm at the lower-bound monomer concentration c_m = 1 mol/L
    without stating the corresponding mass fraction f_pp or volume fraction Phi_pp. Halving baseline
    f_pp = 0.38 (associated with c_m ~ 2 mol/L) to 0.19 gives Phi_pp = 0.1323 via Eq. (6) and xi = 5.815 nm.
    Alternatives are keeping baseline f_pp = 0.38 (giving 3.27 nm) or solving SI I.h.3 for c_m = 1 mol/L
    per species (f_pp = 2 * 0.01 * 12900 / 1538 = 0.1678, giving 6.43 nm).
  alternatives: ["0.38", "0.1678"]
  stands_for: "total polypeptide mass fraction f_pp at c_m = 1 mol/L in SI I.h.5 (p. 21)"

- id: S_salt_screened_added
  quantity: salt_ionic_sum
  unit: mol/L
  printed: "2.28"
  basis: >
    SI I.h.5 (p. 21) states that in the coacervate, charge is screened by oppositely charged chain residues
    (c_m ~ 2 mol/L) and ~140 mM monovalent salt (sum_gamma Z_gamma^2 c_gamma = 2 * 0.14 = 0.28 mol/L),
    giving 2.0 + 0.28 = 2.28 mol/L additional screening species beyond same-species counterions; alternative
    0.28 mol/L counts only the 140 mM monovalent salt ions and 0 mol/L is the unscreened salt-free limit.
  alternatives: ["0.28", "0"]
  stands_for: "screening ionic concentration sum_gamma Z_gamma^2 * c_gamma in SI Eq. (9) inside the coacervate"
