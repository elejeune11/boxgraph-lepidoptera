- id: q_feigeles2025_relate_validate_audit
  kind: unexplained_difference
  about:
    - inverse_capillary_velocity
    - viscosity_from_capillary_velocity
    - filament_buckling_length_eq1
    - coalescence_aspect_ratio_fit
    - gamma_coacervate
    - eta_coacervate_main
    - v_inv_main
    - feigeles2025/coalescence_surface_tension_figS6C
    - feigeles2025/coalescence_capillary_velocity_figS6C
    - feigeles2025/coalescence_deltaL_linear_scaling
    - feigeles2025/surface_tension_coalescence_si
    - feigeles2025/surface_tension_assumed_lit
    - feigeles2025/fus_viscosity_assumed_si
    - feigeles2025/bundle_thickness_avg
  text: >
    Cross-record ModelAtlas, citation, and validation audit for feigeles2025 + mccall2018
    (0 direct scalar-model relations, 0 cited.yaml links, 0 CrossValidation entries in
    mccall2018/validations.yaml): (1) Citations: Feigeles et al. (2025, p. 6, ref-36) cite
    McCall et al. (2018) qualitatively when contrasting external FUS condensate wetting of
    pre-formed actin bundles with internal actin assembly in polyelectrolyte coacervates;
    neither paper borrows a numerical datum from the other. (2) Why 0 direct ModelAtlas
    relations and 0 CrossValidation entries: both papers use the low-Reynolds viscocapillary
    coalescence law eta/gamma = tau/ell, but solve it for algebraically inverse outputs
    (mccall2018/inverse_capillary_velocity outputs v_inv = tau/d and
    viscosity_from_capillary_velocity outputs eta = v_inv * gamma, whereas feigeles2025 solves
    for gamma = eta * slope, v_cap = gamma/eta, and Delta_L = (gamma/eta)*tau); mccall2018's
    coalescence_aspect_ratio_fit uses curve ports and relaxes to spherical AR = 1 rather than
    Feigeles Fig. 2B's barrel spreading asymptote AR = 0.7. Moreover, feigeles2025 never
    independently measures viscosity (fus_viscosity_assumed_si = 1.2 Pa*s is assumed from
    Ijavi et al. 2021) or scalar v_inv, and does not measure a buckling length L*. (3) Quantitative
    viscocapillary and buckling-vs-wetting contrast: while pLK/pRE coacervates (eta = 1.6 Pa*s,
    gamma ~ 1 mN/m = 1000 uN/m) and FUS condensates (eta = 1.2 Pa*s, gamma ~ 40-90 uN/m) have
    similar viscosities, FUS interfacial tension is 11-25x lower. In addition, the two papers
    use different coalescence length conventions: for two equal spheres merging into diameter d,
    Feigeles's major-axis contraction Delta_L = L_i - L_f = (2^(2/3) - 1)*d = 0.5874*d gives a
    1.702x larger eta/gamma than McCall's tau/d convention. Evaluating mccall2018 Eq. (1)
    (alpha = k_B*T*l_p / (2*pi*d*gamma*R^2)) at FUS tensions (40-90 uN/m, R = 1.4-2.4 um) gives
    alpha = 0.0018-0.012 << 1 for a single actin filament (d = 7 nm, l_p = 10 um, R_crit =
    0.10-0.15 um), but for Feigeles's stiff actin bundles (d ~ 230 nm, straightness > 40 um;
    e.g., N = 50 tightly cross-linked filaments with l_p ~ 25,000 um), R_crit rises to ~1.33 um
    (alpha = 0.44 at R = 2 um, exceeding 1 for smaller droplets or higher N), consistent with
    rigid bundles passing straight through wetting FUS barrels rather than buckling inside.
  citation: {page: 7, printed_page: "1642", quote: "F-actin does not appear to protrude from micron-sized", where: "p. 7 / Eq. (1)"}

- id: q_graham2023_relate_validate_audit
  kind: unexplained_difference
