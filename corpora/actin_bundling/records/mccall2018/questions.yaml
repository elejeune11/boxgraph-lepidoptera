  text: >
    Cross-record ModelAtlas, citation, and validation audit for graham2023 + mccall2018
    (3 proposed verified relations, 0 cited.yaml links, 0 CrossValidation entries in
    mccall2018/validations.yaml): (1) Citations & shared bending physics: Graham et al. (2023,
    p. 3 / 576, ref-25) explicitly cite McCall et al. (2018) when attributing surface-localized
    actin polymerization on VASP-mutFAB droplets to non-specific surfactant-like effects,
    without quoting a numerical value. Both papers independently use the identical circular-arc
    confinement bending energy E_Bend = (k_B*T*l_p / 2) * (L / R^2) (McCall p. 7 deriving Eq. 1;
    Graham Eq. 1 / ring_confinement_bending_energy with k_b = L_p*k_B*T), while
    rel_graham2023_buckling_length_reduces_eff_diam, rel_graham2023_buckling_length_scales_ring_circumference,
    and rel_graham2023_ellipse_axes_reduces_droplet_radius formally link McCall's Eq. (1)
    buckling length and droplet radius to Graham's spherical diameter, ring circumference, and
    area-conserving ellipse axes in the rigid high-tension sphere limit. (2) Why 0 CrossValidation
    entries: Graham 2023 measures VASP droplet diameters, ring thicknesses, aspect ratios,
    morphology fractions, FRAP recoveries, partition coefficients, and linear bundle elongation
    rates (23 +/- 3 nm/s), but never measures coalescence viscosity/tension, polyelectrolyte mesh
    size/persistence length, global critical concentration, or single-filament buckling length L*.
    (3) Quantitative tension & partitioning contrast: evaluating McCall Eq. (1)'s dimensionless
    bending-to-capillary ratio alpha = k_B*T*l_p / (2*pi*d*gamma*R^2) explains why actin rings
    leave McCall's pLK/pRE coacervates strictly spherical (gamma = 1000 uN/m, l_p = 10 um ->
    alpha = 0.0037 at R = 0.5 um, R_crit = 0.031 um) yet deform Graham's VASP condensates into
    discs, ellipsoids, and rods: at Graham's effective 3D surface tensions (~1-15 uN/m for
    1-15 pN 2D line tension across D ~ 1 um) and l_p = 17.73 um, even a single filament reaches
    alpha = 0.44 (gamma = 15 uN/m) to alpha = 1.32 > 1 (gamma = 5 uN/m, R_crit = 0.58 um) in a
    1-um droplet, and multi-filament rings (T_ring = 5-480 nm, N_fil = 1-32) overwhelm droplet
    surface tension completely. Meanwhile, actin partitioning in pLK/pRE coacervates (whole-droplet
