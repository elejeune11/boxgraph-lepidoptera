    monovalent counterion condensation (f_eff = 1/zeta = 0.514), which lowers l_E by zeta^2 = 3.78x
    (salt-free at c_m = 2 M: l_E drops from 1.24 A to 0.33 A and l_T from 5.14 A to 4.23 A; at
    c_m = 1 M: l_E drops from 2.48 A to 0.66 A and l_T from 6.38 A to 4.56 A) -- strengthening
