    - cmp_xi_lower_bound_halved_fpp
  text: >
    SI Section I.h.5 (p. 21 / SI-10) states that "The mesh size is linear in the persistence
    length... using our lower bound monomer concentration c_m = 1 mol/L and still neglecting
    salt in order to maximize the persistence length only increases the mesh size to 5.8 nm."
    At c_m = 1 mol/L, Eq. (10) gives l_E = 2.48 A, l_T = 6.38 A, and Kuhn length a = 2*l_T =
    1.276 nm. Holding Phi_pp fixed at the paper's only stated value 0.28 gives xi = 3.315 nm
    (not 5.8 nm). Reproducing 5.8 nm requires also reducing Phi_pp, which the text does not
    state: halving total mass fraction f_pp from 0.38 (associated with c_m ~ 2 M) to 0.19 gives
    Phi_pp = 0.1323 via Eq. (6) and xi = 5.815 nm (reproducing 5.8 nm), whereas solving SI I.h.3
    analytically for c_m = 1 mol/L per species gives f_pp = 0.1678, Phi_pp = 0.1159, and xi =
    6.425 nm (failing 5.8 nm).
  citation: {page: 21, printed_page: "SI-10", quote: "maximize the persistence length only increases the mesh size to 5.8 nm", where: "SI I.h.5"}

- id: q_eq1_unstated_diameter_and_bundles
  kind: unstated_input
  about: [filament_buckling_length_eq1, d_actin_added, L_star_buckling_pred, cmp_buckling_length_eq1]
  text: >
    Main Text Eq. (1) (p. 7 / 1642) includes the filament diameter d explicitly in
    L* = 2*R / (1 - k_B*T*l_p / (2*pi*d*gamma*R^2)), but never states the numerical value of d
    (or temperature T) used to obtain L* ~ 1 um for a 1-um-diameter droplet. For canonical
    single F-actin diameters d = 6-10 nm (added as 7 nm) and R = 0.5 um, the dimensionless
    denominator correction is tiny (0.0026-0.0044), so L* = 1.003-1.004 um ~ 1 um is insensitive
    to d. However, p. 4 notes that the structures visible in Figs. 1-2 are presumed to be F-actin
    bundles rather than single filaments; for bundles of N crosslinked filaments, bending stiffness
    (l_p) scales much faster with N than diameter d, which would increase the buckling correction
    substantially beyond the single-filament estimate evaluated in Eq. (1).
  citation: {page: 7, printed_page: "1642", quote: "In a 1-mm-diameter coacervate droplet with the surface tension", where: "Eq. (1)"}

