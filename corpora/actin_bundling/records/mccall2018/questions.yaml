- id: q_fig3b_vs_fig3c_halftime_discrepancy
  kind: unexplained_difference
  about: [pyrene_actin_alone_fig3b, pyrene_plus_coacervate_fig3b, pyrene_plus_plk_fig3b, assembly_rate_coacervate_fig3c, assembly_rate_plk_alone_fig3c]
  text: >
    Applying SI Eq. (5) (I_1/2 = (I_max + I_0)/2, p. 18) directly to the digitized 3 uM polypeptide
    pyrene fluorescence traces in Fig. 3B (using I_0 = 3.35 a.u. from the 1.5 uM actin-only control)
    gives t_1/2 = 3.21 min (1/t_1/2 = 0.312 min^-1, I_max = 34.56) for +3 uM pLK + 3 uM pRE and
