- id: q_coacervate_chain_conc_10x_error
  kind: possible_error
  about:
    - coacervate_polypeptide_conc_printed
    - c_chain_coac_printed
    - c_res_coac_SI
    - c_res_coac_main
    - cmp_coacervate_chain_conc
    - cmp_coacervate_res_conc_main_from_printed_chain
  text: >
    In SI Section I.h.3 (p. 19 / SI-8), evaluating the paper's own printed formula
    c = rho_pp * f_pp / M_W with its stated inputs (rho_E = 1538 mg/mL = 1538 g/L,
    f_pp = 0.19 per species, M_W = 12.9 kDa = 12900 g/mol) yields a polypeptide chain
    concentration of 22.65 mM per species, which is 11.3-fold larger than the printed
    "~2 mM per species". Multiplying 22.65 mM by 100 residues/chain reproduces the next
    clause's "~ 2 M per species" (2.265 M) and Main Text p. 4 "1-3 M", whereas multiplying
    the printed "~2 mM" by 100 residues/chain gives only 0.2 M (failing "1-3 M" by a factor
    of 10). Thus "~2 mM" is almost certainly a 10x arithmetic/unit-prefix misprint (e.g.
    dividing 2 M by 1000 instead of 100, or misreading 0.0227 M as ~2 mM instead of ~20 mM).
    Separately, using solid polypeptide density rho_pp = 1538 mg/mL in c = rho_pp * f_pp / M_W
    rather than the ideal-volume coacervate mixture density rho_coac = rho_pp * Phi_pp / f_pp_tot
    = 1153.3 mg/mL implied by SI Eq. (6) overestimates concentration by 33% (giving 17.0 mM
    chains and 1.70 M residues, still ~8.5x above printed "~2 mM" and within 1-3 M).
  citation: {page: 19, printed_page: "SI-8", quote: "yields a polypeptide chain concentration of ~2 mM per species", where: "SI I.h.3"}

