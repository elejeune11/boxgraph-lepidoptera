    - total_persistence_length
    - S_salt_screened_added
    - l_T_screened_used
    - cmp_lT_screened_vs_04nm
  text: >
    SI Section I.h.5 (p. 21 / SI-10) argues that screening by oppositely charged polypeptide
    chains (c_m ~ 2 mol/L) and ~140 mM salt renders l_E negligible, justifying l_T = 0.4 nm.
    Evaluating SI Eq. (9) numerically with c_c = 2 mol/L plus S_salt = 2.28 mol/L (counting both
    2 mol/L opposite residues and 2*0.14 = 0.28 mol/L monovalent salt ions) still yields
    l_E = 0.58 A (15% of l_0 = 3.9 A), giving l_T = 4.48 A = 0.448 nm (barely inside 1-digit
    rounding of 0.4 nm); counting only the 140 mM salt ions (S_salt = 0.28 mol/L) yields
    l_E = 1.09 A and l_T = 4.99 A = 0.499 nm (~25% above 0.4 nm). Also on p. 20, the chosen
    l_0 = 3.9 A is within 20% of the polyglycine bounds relative to 3.9 A (18.5% and 14.6%),
    though 22.6% above the lower bound 3.18 A itself.
  citation: {page: 21, printed_page: "SI-10", quote: "expect the contribution from the electrostatic persistence length to be negligible", where: "SI I.h.5"}

