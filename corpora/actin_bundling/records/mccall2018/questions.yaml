- id: q_audit_reading_140mM_salt_origin
  kind: reading
  about:
    - c_salt_coac
    - S_salt_screened_added
    - S_salt_zero_added
    - electrostatic_persistence_length_eq9
    - cmp_lT_screened_vs_04nm
  text: >
    SI Section I.h.5 (p. 21 / SI-10) states that coacervate charges are screened by opposite-chain
    residues (c_m ~= 2 mol/L) "and ~= 140 mM salt", without deriving or citing 140 mM. Throughout
    the paper (Figs. 1-4, S1-S6, SI I.d), the experimental buffer is 50 mM KCl, 1 mM MgCl2, 1 mM
    EGTA, 10 mM imidazole (pH 7.0), and 72-150 uM ATP, plus 5 mM each of Na+ and Cl- counterions
    from 5 mM pLK*HCl + 5 mM pRE*Na (~55-65 mM monovalent salt equivalent; ionic strength I ~ 65-70
    mM; total charge-squared ion sum sum_gamma Z_gamma^2 * c_gamma = 2*I ~= 135-140 mM). In
    added.yaml, S_salt_screened_added = 2.28 mol/L (= 2.0 + 2*0.14) and S_salt_zero_added
    alternative 0.28 mol/L treat 140 mM as a monovalent salt molarity (doubling it to 0.28 mol/L)
    and treat covalently linked opposite-chain monomers (2 mol/L) as free mobile screening ions in
    Eq. (9). If 140 mM instead already represents sum_gamma Z_gamma^2 * c_gamma = 0.14 mol/L, then
    Eq. (9) gives l_E = 0.599 A and l_T = 4.499 A = 0.450 nm (with opposite-chain screening,
    S_salt = 2.14 mol/L, on the boundary of rounding to 0.4 nm) or l_E = 1.159 A and l_T = 5.059 A
    = 0.506 nm (salt-only screening, S_salt = 0.14 mol/L). Preserved first-reader added.yaml values
    and logged this reading disagreement here.
  citation: {page: 21, printed_page: "SI-10", quote: "and ≈ 140 mM salt. Therefore, we expect", where: "SI I.h.5"}

