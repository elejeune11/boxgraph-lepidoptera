    polylysine and dissolves F-actin bundles. McCall's p. 4 appeal to ref-26 ignores that pLK
    inside pLK/pRE coacervates is stoichiometrically complexed 1:1 with ~2 M polyanionic pRE,
    leaving free uncomplexed pLK availability unquantified. (3) Missing Manning counterion
    condensation in McCall SI I.h.5: McCall evaluates electrostatic persistence length
    (SI Eqs. 7, 9, 10) for fully charged pLK/pRE (f = 1, b = 3.65 A) without Manning condensation.
