- id: coalescence_relaxation_time
  name: droplet coalescence relaxation time constant
  dimension: "[time]"
  description: Exponential relaxation time constant tau of droplet aspect ratio during coalescence (Fig. S1B).

- id: merged_droplet_diameter
  name: merged coacervate droplet diameter
  dimension: "[length]"
  description: Final spherical diameter d of two coalesced pLK/pRE coacervate droplets (Fig. S1A).

- id: droplet_diameter
  name: coacervate droplet diameter
  dimension: "[length]"
  description: Diameter 2*R of a spherical coacervate droplet.

- id: droplet_radius
  name: coacervate droplet radius
  dimension: "[length]"
  description: Radius R of a spherical coacervate droplet.

- id: inverse_capillary_velocity
  name: inverse capillary velocity
  dimension: "[time] / [length]"
  description: Ratio of dynamic viscosity to surface tension v^-1 = eta / gamma = tau / d.

- id: coacervate_surface_tension
  name: coacervate surface tension
  dimension: "[mass] / [time] ** 2"
  description: Interfacial tension gamma between the pLK/pRE coacervate phase and exterior aqueous buffer.

- id: coacervate_viscosity
  name: coacervate dynamic viscosity
  dimension: "[mass] / [length] / [time]"
  description: Dynamic viscosity eta of the condensed pLK/pRE coacervate phase.

- id: water_viscosity
  name: water dynamic viscosity
  dimension: "[mass] / [length] / [time]"
  description: Dynamic viscosity eta_water of water at room temperature.

- id: viscosity_ratio_to_water
  name: coacervate-to-water viscosity ratio
  dimension: "dimensionless"
  description: Ratio eta / eta_water comparing coacervate viscosity to that of water.

- id: temperature
  name: temperature
  dimension: "[temperature]"
  description: Absolute or Celsius temperature T at which experiments or physical estimates are evaluated.

- id: polypeptide_degree_of_polymerization
  name: polypeptide degree of polymerization
  dimension: "dimensionless"
  description: Mean number of monomer residues (charge equivalents) N per polypeptide chain.

- id: polypeptide_molecular_weight
  name: polypeptide molecular weight
  dimension: "[mass]"
  description: Mean molecular weight M_W of a polypeptide chain (reported in kDa).

- id: polypeptide_polydispersity
  name: polypeptide polydispersity index
  dimension: "dimensionless"
  description: Polydispersity index (PDI) of a polypeptide preparation (Table S1).

- id: polypeptide_residue_concentration
  name: polypeptide residue (charge-equivalent) concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of charged amino-acid monomer residues (pLK or pRE) in solution or in the coacervate phase.

- id: polypeptide_chain_concentration
  name: polypeptide chain (molecular) concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of full polypeptide molecules (chains) per species.

- id: polypeptide_solid_density
  name: solid polypeptide mass density
  dimension: "[mass] / [length] ** 3"
  description: Mass density rho_pp of solid polypeptide material (approximated by solid L-glutamic acid rho_E).

- id: solvent_density
  name: aqueous solvent mass density
  dimension: "[mass] / [length] ** 3"
  description: Mass density rho_solvent of the aqueous solvent (water).

- id: polypeptide_mass_fraction
  name: polypeptide mass fraction in coacervate
  dimension: "dimensionless"
  description: Mass fraction f_pp of polypeptide (total or per species) in the condensed coacervate phase.

- id: water_mass_fraction
  name: water mass fraction in coacervate
  dimension: "dimensionless"
  description: Water mass fraction (content) f_water = 1 - f_pp in the coacervate phase.

- id: coacervate_volume_fraction
  name: coacervate polypeptide volume fraction
  dimension: "dimensionless"
  description: Volume fraction Phi_pp occupied by polypeptide in the condensed coacervate phase (SI Eq. 6).

- id: coacervate_mesh_size
  name: coacervate polymer mesh size
  dimension: "[length]"
  description: Polymer correlation length (mesh size) xi of the semidilute polypeptide coacervate phase.

- id: polypeptide_kuhn_length
  name: polypeptide Kuhn length
  dimension: "[length]"
  description: Effective monomer / Kuhn segment length a (also denoted b = 2*l_T in SI I.h.5) of a polypeptide chain.

- id: polypeptide_bond_length
  name: polypeptide monomer bond length
  dimension: "[length]"
  description: Backbone spacing b between adjacent charged monomers along a polypeptide chain (SI I.h.5).

- id: polypeptide_bare_persistence_length
  name: polypeptide bare persistence length
  dimension: "[length]"
  description: Intrinsic backbone persistence length l_0 of a polypeptide chain without electrostatic stiffening.

- id: electrostatic_persistence_length
  name: electrostatic persistence length
  dimension: "[length]"
  description: Electrostatic contribution l_E to the polyelectrolyte persistence length (SI Eqs. 7, 9, 10).

- id: polypeptide_total_persistence_length
  name: polypeptide total persistence length
  dimension: "[length]"
  description: Total persistence length l_T = l_0 + l_E of a polypeptide polyelectrolyte chain.

- id: electrostatic_persistence_prefactor
  name: salt-free electrostatic persistence prefactor
  dimension: "[substance] / [length] ** 2"
  description: Concentration-weighted prefactor l_E * c_m = 1 / (16 * pi * N_A * b^2) in SI Eq. (10).

- id: bjerrum_length
  name: electrostatic Bjerrum length
  dimension: "[length]"
  description: Bjerrum length l_B in aqueous medium appearing in SI Eqs. (7) and (8).

- id: debye_inverse_length_sq
  name: squared inverse Debye screening length
  dimension: "1 / [length] ** 2"
  description: Squared inverse Debye screening length kappa^2 defined in SI Eq. (8).

- id: monomer_charge_fraction
  name: polyelectrolyte monomer charge fraction
  dimension: "dimensionless"
  description: Fraction f of polyelectrolyte monomers carrying an elementary charge (SI Eqs. 7 and 9).

- id: counterion_valency
  name: counterion valency
  dimension: "dimensionless"
  description: Charge valency Z_c of the counterions associated with the polyelectrolyte (SI Eqs. 8 and 9).

- id: salt_ionic_sum
  name: added-salt charge-squared molar sum
  dimension: "[substance] / [length] ** 3"
  description: Sum sum_gamma Z_gamma^2 * c_gamma over all salt ion species (equal to twice the added-salt ionic strength, SI Eqs. 8-9).

- id: salt_concentration
  name: monovalent salt concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of added monovalent salt in the coacervate phase or buffer.

- id: methylcellulose_mass_volume_conc
  name: methylcellulose weight-per-volume concentration
  dimension: "[mass] / [length] ** 3"
  description: Mass-per-volume concentration of methylcellulose crowding agent (printed as % w/v = g/dL).

- id: methylcellulose_molecular_weight
  name: methylcellulose molecular weight
  dimension: "[mass]"
  description: Molecular weight M_W of methylcellulose crowding agent (14 kDa, SI I.h.1).

- id: methylcellulose_molar_concentration
  name: methylcellulose molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration c of dilute methylcellulose crowding agent (SI I.h.1).

- id: osmotic_pressure
  name: osmotic pressure
  dimension: "[mass] / [length] / [time] ** 2"
  description: Osmotic pressure Pi of a dilute crowding agent solution or semidilute polymer coacervate.

- id: osmotic_pressure_ratio
  name: coacervate-to-threshold osmotic pressure ratio
  dimension: "dimensionless"
  description: Ratio Pi_coac / Pi* comparing coacervate osmotic pressure to the methylcellulose crowding threshold.

- id: actin_persistence_length
  name: F-actin bending persistence length
  dimension: "[length]"
  description: Bending persistence length l_p of an actin filament (Eq. 1).

- id: actin_filament_diameter
  name: F-actin filament diameter
  dimension: "[length]"
  description: Cross-sectional diameter d of an actin filament (Eq. 1).

- id: buckling_threshold_length
  name: filament buckling threshold contour length
  dimension: "[length]"
  description: Shortest filament contour length L* > 2R for which bending inside a droplet is energetically favorable over protruding (Eq. 1).

- id: actin_filament_length
  name: F-actin filament contour length
  dimension: "[length]"
  description: Contour length L of an F-actin filament.

- id: actin_subunit_axial_rise
  name: F-actin axial rise per subunit
  dimension: "[length]"
  description: Contour length increment per actin monomer subunit along an F-actin filament.

- id: actin_subunit_count
  name: F-actin subunit count
  dimension: "dimensionless"
  description: Number of actin monomer subunits comprising a filament of contour length L.

- id: actin_critical_concentration
  name: Mg-ATP-actin critical concentration
  dimension: "[substance] / [length] ** 3"
  description: Threshold monomer concentration c* required for Mg-ATP-actin filament polymerization.

- id: actin_global_concentration
  name: global actin concentration
  dimension: "[substance] / [length] ** 3"
  description: Bulk / total solution concentration c_global of actin added to a sample.

- id: actin_global_critical_concentration
  name: threshold global actin concentration for coacervate assembly
  dimension: "[substance] / [length] ** 3"
  description: Minimum global actin concentration c_global_crit = c* / RAM expected to reach c* inside coacervates.

- id: actin_relative_accumulated_mass
  name: actin relative accumulated mass (RAM)
  dimension: "dimensionless"
  description: Ratio of actin fluorescence intensity in a coacervate (whole droplet, periphery, or interior) to exterior fluorescence intensity.

- id: bsa_partition_coefficient
  name: BSA equilibrium partition coefficient
  dimension: "dimensionless"
  description: Ratio of BSA fluorescence intensity inside pLK/pRE coacervates to exterior intensity (RAM = PC_avg at equilibrium).

- id: ram_ratio_actin_to_bsa
  name: actin-to-BSA RAM ratio
  dimension: "dimensionless"
  description: Ratio of actin RAM to BSA RAM measured 20 min after assembly initiation.

- id: actin_assembly_rate
  name: actin filament assembly rate
  dimension: "1 / [time]"
  description: Reciprocal half-time 1/t_1/2 of spontaneous pyrene-actin polymerization.

- id: assembly_rate_enhancement
  name: actin assembly rate enhancement factor
  dimension: "dimensionless"
  description: Fold increase in actin filament assembly rate inside coacervates relative to solution.

- id: assembly_time
  name: actin assembly characteristic time
  dimension: "[time]"
  description: Characteristic lag time or time to reach steady state during spontaneous pyrene-actin polymerization.

- id: protein_molecular_weight
  name: client protein molecular weight
  dimension: "[mass]"
  description: Molecular weight of globular client protein monomers (G-actin, BSA).

- id: protein_isoelectric_point
  name: client protein isoelectric point
  dimension: "dimensionless"
  description: Isoelectric point (pI) of client proteins (G-actin, BSA).

- id: pearson_correlation_coefficient
  name: Pearson correlation coefficient
  dimension: "dimensionless"
  description: Linear Pearson correlation coefficient r for fluorescence colocalization or RAM vs droplet radius.

- id: line_scan_position
  name: droplet line-scan position
  dimension: "[length]"
  description: Spatial coordinate along a confocal fluorescence or DIC intensity line scan across a coacervate droplet.

- id: normalized_intensity
  name: normalized line-scan intensity
  dimension: "dimensionless"
  description: Min-max normalized fluorescence or DIC intensity I_norm (-) along a line scan, defined by SI Eq. (1).

- id: condition_index
  name: experimental condition index
  dimension: "dimensionless"
  description: Categorical bar index along Fig. 1E (1 = TMR-actin with BSA, 2 = TMR-actin alone, 3 = 647-BSA with actin, 4 = 647-BSA alone).

- id: time
  name: elapsed experimental time
  dimension: "[time]"
  description: Elapsed time t during pyrene-actin polymerization, droplet coalescence, flow-in, FRAP, or filament winding.

- id: pyrene_fluorescence
  name: pyrene-actin fluorescence intensity
  dimension: "dimensionless"
  description: Pyrene-actin fluorescence emission intensity at 407 nm (arbitrary units, Fig. 3B).

- id: pyrene_excimer_fluorescence
  name: pyrene excimer fluorescence intensity
  dimension: "dimensionless"
  description: Pyrene excimer fluorescence emission intensity at 478 nm monitoring antiparallel actin dimers (arbitrary units, Fig. 3D).

- id: fluorescence_intensity
  name: confocal fluorescence intensity
  dimension: "dimensionless"
  description: Background-subtracted confocal fluorescence intensity (or regional droplet mean) in detector counts (Figs. 4D, 4E, S3D).

- id: droplet_aspect_ratio
  name: coalescing droplet aspect ratio
  dimension: "dimensionless"
  description: Aspect ratio of two merging pLK/pRE coacervate droplets during liquid-like relaxation (Fig. S1B).

- id: normalized_frap_intensity
  name: photobleach-corrected normalized FRAP intensity
  dimension: "dimensionless"
  description: Normalized average fluorescence intensity I_spot,PBC(t) during fluorescence recovery after photobleaching (SI Eqs. 2-4, Fig. S5E).

- id: phalloidin_fluorescence_scaled
  name: scaled phalloidin fluorescence intensity
  dimension: "dimensionless"
  description: Alexa488-phalloidin fluorescence intensity along the circular droplet kymograph in units of 10^2 counts (Fig. S6C).

