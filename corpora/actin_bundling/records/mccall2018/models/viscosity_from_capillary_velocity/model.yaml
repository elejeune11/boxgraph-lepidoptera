id: viscosity_from_capillary_velocity
name: coacervate dynamic viscosity from inverse capillary velocity and surface tension
role: model
stated: {page: 3, printed_page: "1638", quote: "estimate the inverse capillary velocity v 1 ¼ h=g ¼ 1.6 ms/mm", where: text}
equation: "eta = v^-1 * gamma"
inputs:
  v_inv: {quantity: inverse_capillary_velocity, unit: ms/um}
  gamma: {quantity: coacervate_surface_tension, unit: mN/m}
outputs:
  eta: {quantity: coacervate_viscosity, unit: Pa*s}
settings: {}
stochastic: false
