id: coacervate_mesh_size
name: semidilute coacervate mesh size in good solvent (SI I.h.4)
role: model
stated: {page: 20, printed_page: "SI-9", quote: "Combining these expressions gives (16)   a pp", where: "SI I.h.4"}
described_from: ref-44
built_from: [coacervate_mesh_size_overlap]
equation: "xi = a * Phi_pp^(-3/4)"
inputs:
  a: {quantity: polypeptide_kuhn_length, unit: nm}
  Phi_pp: {quantity: coacervate_volume_fraction, unit: dimensionless}
outputs:
  xi: {quantity: coacervate_mesh_size, unit: nm}
settings: {}
stochastic: false
