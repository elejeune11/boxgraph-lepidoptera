id: coacervate_volume_fraction_eq6
name: polypeptide volume fraction in the coacervate phase (SI Eq. 6)
role: model
stated: {page: 20, printed_page: "SI-9", quote: "We estimate the volume fraction as", where: "SI Eq. (6)"}
equation: "Phi_pp = f_pp / (f_pp + (1 - f_pp) * (rho_pp / rho_solvent))"
inputs:
  f_pp: {quantity: polypeptide_mass_fraction, unit: dimensionless}
  rho_pp: {quantity: polypeptide_solid_density, unit: mg/mL}
  rho_solvent: {quantity: solvent_density, unit: mg/mL}
outputs:
  Phi_pp: {quantity: coacervate_volume_fraction, unit: dimensionless}
settings: {}
stochastic: false
