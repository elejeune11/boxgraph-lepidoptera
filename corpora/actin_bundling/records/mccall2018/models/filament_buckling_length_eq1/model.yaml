id: filament_buckling_length_eq1
name: minimum F-actin contour length for surface-tension-driven bending (Eq. 1)
role: model
stated: {page: 7, printed_page: "1642", quote: "yields the shortest length greater than 2R", where: "Eq. (1)"}
equation: "L* = 2*R / (1 - k_B*T*l_p / (2*pi*d*gamma*R^2))"
inputs:
  R: {quantity: droplet_radius, unit: um}
  l_p: {quantity: actin_persistence_length, unit: um}
  d: {quantity: actin_filament_diameter, unit: nm}
  gamma: {quantity: coacervate_surface_tension, unit: mN/m}
  T: {quantity: temperature, unit: K}
outputs:
  L_star: {quantity: buckling_threshold_length, unit: um}
settings: {}
stochastic: false
