id: coacervate_polypeptide_conc_printed
name: polypeptide chain concentration in coacervate phase from mass fraction (SI I.h.3)
role: model
stated: {page: 19, printed_page: "SI-8", quote: "mass fraction according to c   pp f pp / M W", where: "SI I.h.3"}
equation: "c = rho_pp * f_pp / M_W"
inputs:
  rho_pp: {quantity: polypeptide_solid_density, unit: mg/mL}
  f_pp: {quantity: polypeptide_mass_fraction, unit: dimensionless}
  M_W: {quantity: polypeptide_molecular_weight, unit: kDa}
outputs:
  c: {quantity: polypeptide_chain_concentration, unit: mM}
settings: {}
stochastic: false
