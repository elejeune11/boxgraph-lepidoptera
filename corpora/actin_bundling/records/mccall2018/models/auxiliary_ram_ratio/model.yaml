id: auxiliary_ram_ratio
name: auxiliary RAM ratio of regional droplet intensity to exterior intensity (Fig. 4E-F)
role: processing
from_words: true
stated: {page: 17, printed_page: "SI-6", quote: "These auxiliary RAM values are calculated as the ratio of either Periphery or Interior fluorescence to Exterior fluorescence.", where: "SI I.f.2"}
equation: "RAM_aux(c) = I_region(c) / I_exterior(c)"
inputs:
  I_region: {quantity: fluorescence_intensity, unit: dimensionless, curve: {quantity: actin_global_concentration, unit: uM}}
  I_exterior: {quantity: fluorescence_intensity, unit: dimensionless, curve: {quantity: actin_global_concentration, unit: uM}}
outputs:
  RAM_aux: {quantity: actin_relative_accumulated_mass, unit: dimensionless, curve: {quantity: actin_global_concentration, unit: uM}}
settings: {}
stochastic: false
