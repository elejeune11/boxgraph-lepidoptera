id: filament_boundary_ram
name: auxiliary RAM threshold for F-actin assembly (Fig. 4F boundary)
role: model
from_words: true
stated: {page: 5, printed_page: "1640", quote: "product of the auxiliary RAM value and the total actin concentration equals", where: "Fig. 4F"}
equation: "RAM_crit = c_star / c_global"
inputs:
  c_star: {quantity: actin_critical_concentration, unit: uM}
  c_global: {quantity: actin_global_concentration, unit: uM}
outputs:
  RAM_crit: {quantity: actin_relative_accumulated_mass, unit: dimensionless}
settings: {}
stochastic: false
