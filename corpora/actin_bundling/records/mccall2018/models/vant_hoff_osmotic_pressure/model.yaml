id: vant_hoff_osmotic_pressure
name: van 't Hoff osmotic pressure of dilute methylcellulose (SI I.h.1)
role: model
stated: {page: 19, printed_page: "SI-8", quote: "Using the van 't Hoff formula                for the osmotic pressure", where: "SI I.h.1"}
equation: "Pi = c * N_A * k_B * T"
inputs:
  c: {quantity: methylcellulose_molar_concentration, unit: uM}
  T: {quantity: temperature, unit: K}
outputs:
  Pi: {quantity: osmotic_pressure, unit: Pa}
settings: {}
stochastic: false
