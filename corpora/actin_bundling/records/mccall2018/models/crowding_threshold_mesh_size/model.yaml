id: crowding_threshold_mesh_size
name: threshold polymer mesh size generating crowding osmotic pressure Pi*
role: model
stated: {page: 7, printed_page: "1642", quote: "size x % 20 nm would generate sufficient osmotic pressure", where: text}
built_from: [coacervate_osmotic_pressure_mesh]
equation: "xi_star = (k_B * T / Pi_star)^(1/3)"
inputs:
  Pi_star: {quantity: osmotic_pressure, unit: Pa}
  T: {quantity: temperature, unit: K}
outputs:
  xi_star: {quantity: coacervate_mesh_size, unit: nm}
settings: {}
stochastic: false
