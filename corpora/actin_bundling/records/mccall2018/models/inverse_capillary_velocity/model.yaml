id: inverse_capillary_velocity
name: inverse capillary velocity from droplet coalescence (Fig. S1)
role: model
stated: {page: 25, printed_page: "SI-14", quote: "We estimate the inverse capillary velocity as             = 1.6 ms/µm", where: "Fig. S1B"}
equation: "v^-1 = tau / d"
inputs:
  tau: {quantity: coalescence_relaxation_time, unit: ms}
  d: {quantity: merged_droplet_diameter, unit: um}
outputs:
  v_inv: {quantity: inverse_capillary_velocity, unit: ms/um}
settings: {}
stochastic: false
