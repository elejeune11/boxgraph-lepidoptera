id: electrostatic_persistence_length_eq7
name: electrostatic persistence length via Debye parameter (SI Eq. 7)
role: model
stated: {page: 20, printed_page: "SI-9", quote: "The electrostatic persistence length can be defined as (18)", where: "SI Eq. (7)"}
described_from: ref-62
equation: "l_E = l_B * f^2 / (4 * kappa^2 * b^2)"
inputs:
  l_B: {quantity: bjerrum_length, unit: angstrom}
  f: {quantity: monomer_charge_fraction, unit: dimensionless}
  kappa_sq: {quantity: debye_inverse_length_sq, unit: 1/angstrom^2}
  b: {quantity: polypeptide_bond_length, unit: angstrom}
outputs:
  l_E: {quantity: electrostatic_persistence_length, unit: angstrom}
settings: {}
stochastic: false
