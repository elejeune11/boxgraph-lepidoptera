id: coalescence_aspect_ratio_fit
name: exponential relaxation of coalescing droplet aspect ratio (Fig. S1B)
role: fit
from_words: true
stated: {page: 25, printed_page: "SI-14", quote: "Red line is an exponential fit, with a time constant of τ = 6.33 ms.", where: "Fig. S1B"}
equation: "AR(t) = 1 + (AR_0 - 1) * exp(-t / tau)"
inputs:
  tau: {quantity: coalescence_relaxation_time, unit: ms}
  ref_curve: {quantity: droplet_aspect_ratio, unit: dimensionless, curve: {quantity: time, unit: s}}
  x_grid: {quantity: droplet_aspect_ratio, unit: dimensionless, curve: {quantity: time, unit: s}}
outputs:
  AR: {quantity: droplet_aspect_ratio, unit: dimensionless, curve: {quantity: time, unit: s}}
settings: {}
stochastic: false
