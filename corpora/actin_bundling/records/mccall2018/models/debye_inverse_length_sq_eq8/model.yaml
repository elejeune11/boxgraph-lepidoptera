id: debye_inverse_length_sq_eq8
name: squared inverse Debye screening length (SI Eq. 8)
role: model
stated: {page: 20, printed_page: "SI-9", quote: "is the inverse of the Debye length, given by", where: "SI Eq. (8)"}
described_from: ref-62
equation: "kappa^2 = 4*pi*l_B * [Z_c^2 * c_c + sum_gamma Z_gamma^2 * c_gamma]"
inputs:
  l_B: {quantity: bjerrum_length, unit: angstrom}
  Z_c: {quantity: counterion_valency, unit: dimensionless}
  c_c: {quantity: polypeptide_residue_concentration, unit: mol/L}
  S_salt: {quantity: salt_ionic_sum, unit: mol/L}
outputs:
  kappa_sq: {quantity: debye_inverse_length_sq, unit: 1/angstrom^2}
settings: {}
stochastic: false
