id: electrostatic_persistence_length_eq9
name: electrostatic persistence length combining SI Eqs. 7 and 8 (SI Eq. 9)
role: model
stated: {page: 20, printed_page: "SI-9", quote: "Combining Equations (7-8) gives", where: "SI Eq. (9)"}
described_from: ref-62
built_from: [electrostatic_persistence_length_eq7, debye_inverse_length_sq_eq8]
equation: "l_E = f^2 / (16*pi * [Z_c^2 * c_c + sum_gamma Z_gamma^2 * c_gamma] * b^2)"
inputs:
  f: {quantity: monomer_charge_fraction, unit: dimensionless}
  Z_c: {quantity: counterion_valency, unit: dimensionless}
  c_c: {quantity: polypeptide_residue_concentration, unit: mol/L}
  S_salt: {quantity: salt_ionic_sum, unit: mol/L}
  b: {quantity: polypeptide_bond_length, unit: angstrom}
outputs:
  l_E: {quantity: electrostatic_persistence_length, unit: angstrom}
settings: {}
stochastic: false
