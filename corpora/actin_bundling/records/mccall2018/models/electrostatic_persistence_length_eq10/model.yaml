id: electrostatic_persistence_length_eq10
name: salt-free electrostatic persistence length for fully charged polypeptide (SI Eq. 10)
role: model
stated: {page: 21, printed_page: "SI-10", quote: "where cc=cm is the polyelectrolyte monomer concentration in units of mol", where: "SI Eq. (10)"}
built_from: [electrostatic_persistence_length_eq9]
equation: "l_E = (1 / (16*pi)) * (10^27 A^3 / (c_c * N_A * mol)) * (1 / (3.65 A)^2) ~= (2.48 / c_m) A  (with b = 3.65 A, c_c = c_m)"
inputs:
  c_m: {quantity: polypeptide_residue_concentration, unit: mol/L}
  b: {quantity: polypeptide_bond_length, unit: angstrom}
outputs:
  l_E: {quantity: electrostatic_persistence_length, unit: angstrom}
  A_E: {quantity: electrostatic_persistence_prefactor, unit: angstrom*mol/L}
settings: {}
stochastic: false
