id: coacervate_mesh_size_overlap
name: coacervate mesh size from Flory radius and overlap volume fraction (SI I.h.4)
role: model
stated: {page: 19, printed_page: "SI-8", quote: "where RF is the root-mean-square end-to-end distance of the polypeptide", where: "SI I.h.4"}
described_from: ref-44
equation: "xi = R_F * (Phi_pp* / Phi_pp)^(3/4), with R_F = a * N^(3/5) and Phi_pp* = (N / R_F^3) * a^3 = N^(-4/5)"
inputs:
  a: {quantity: polypeptide_kuhn_length, unit: nm}
  N: {quantity: polypeptide_degree_of_polymerization, unit: dimensionless}
  Phi_pp: {quantity: coacervate_volume_fraction, unit: dimensionless}
outputs:
  xi: {quantity: coacervate_mesh_size, unit: nm}
settings: {}
stochastic: false
