notes: >
  Full quantitative reading of McCall et al. (2018), Biophysical Journal 114, 1636-1645
  (PDF pages 1-10) together with its merged Supporting Material (PDF pages 11-33, labeled
  SI-cover and SI-1 through SI-22).

  In scope (models, inputs, derived/predicted results, and comparisons):
  - Droplet coalescence inverse capillary velocity v^-1 = tau / d (Fig. S1, p. 25: tau = 6.33 ms,
    d = 4 um -> 1.5825 vs printed 1.6 ms/um), coacervate dynamic viscosity eta = v^-1 * gamma
    (p. 3: gamma ~ 1 mN/m -> 1.6 Pa*s; consistent with p. 8 "2 Pa-s" at 1-digit precision), and
    viscosity ratio to water (~1600-1760x vs printed "~1000-fold", p. 3).
  - Polypeptide charge-equivalent to chain-concentration conversions c_chain = c_res / N_res
    (SI I.a p. 14: 5 mM / 100 = 50 uM; SI I.h.2 p. 19: 3000 nM / 100 = 30 nM dilute-phase bound)
    and c_res = N_res * c_chain.
  - Partitioning-shifted global critical actin concentration c_global_crit = c* / RAM
    (pp. 5-6: 0.1 uM / ~30 -> 0.00333 uM vs printed ~0.003 uM) and Fig. 4F filament-assembly
    boundary RAM_crit = c* / c_global (p. 5, p. 8).
  - Filament confinement / buckling length threshold Main Text Eq. (1):
    L* = 2*R / (1 - k_B*T*l_p / (2*pi*d*gamma*R^2)) balancing protrusion surface-area energy
    E_Area = pi*d*(L - 2R)*gamma against circular-arc bending energy E_Bend = k_B*T*l_p*L/(2*R^2)
    (p. 7: 1-um-diameter droplet, l_p = 10 um, gamma = 1 mN/m, unstated d = 7 nm added ->
    L* = 1.0037 um vs printed ~1 um), plus F-actin subunit count for a 250-nm filament (~90
    subunits with added axial rise 2.7 nm, p. 7).
  - Osmotic crowding estimate (SI I.h.1 p. 19, Main Text p. 7, SI I.h.5 p. 21): 0.25% (w/v)
    14-kDa methylcellulose molar concentration (178.6 uM vs printed ~= 180 uM), van 't Hoff
    osmotic pressure Pi = c*N_A*k_B*T (441.2 Pa from exact c or 444.7 Pa from 180 uM at 24 degC
    vs printed ~= 450 Pa), polymer-solution osmotic pressure Pi = k_B*T / xi^3 and inverted
    crowding threshold mesh size xi* = (k_B*T / Pi*)^(1/3) (20.89 nm vs printed <= 20 nm on p. 7
    and 20 nm on p. 21), and osmotic-pressure ratio Pi_coac / Pi* at xi = 2.1 nm (984 vs printed
    3 orders of magnitude = 10^3, p. 21).
  - Coacervate polypeptide concentration (SI I.h.3 p. 19): c = rho_pp * f_pp / M_W with
    rho_E = 1538 mg/mL, f_pp = 0.19 per species (half of total 0.38; water fraction 1 - 0.38 =
    62% vs ~60%), M_W = 12.9 kDa -> 22.65 mM per species, contradicting printed "~2 mM" by a
    factor of ~11x, while 100 * 22.65 mM = 2.27 M reproduces printed "~2 M" and main-text
    "1-3 M" (whereas 100 * 2 mM = 0.2 M fails "1-3 M"); physical mixture-density correction
    using SI Eq. (6) gives 17.0 mM chains / 1.70 M residues.
  - Coacervate volume fraction SI Eq. (6) (p. 20): Phi_pp = f_pp / (f_pp + (1 - f_pp)*rho_pp/rho_solvent)
    with f_pp = 0.38, rho_pp = 1538 mg/mL, rho_solvent = 1000 mg/mL -> 0.2850, reproducing SI p. 20
    Phi_pp = 0.28 but contradicting Main Text p. 8 "volume fraction (40%)" (which conflates the
    0.38 mass fraction with volume fraction).
  - Coacervate mesh size (SI I.h.4 pp. 19-20): xi = R_F * (Phi_pp* / Phi_pp)^(3/4) = a * Phi_pp^(-3/4)
    with Kuhn length a = 0.8 +/- 0.1 nm and Phi_pp = 0.28 (or 0.2850) -> 2.08 nm (2.05 nm),
    reproducing SI 2.1 nm (pp. 20-21) and Main Text 2-3 nm (p. 7).
  - Polyelectrolyte persistence length (SI I.h.5 pp. 20-21): Debye screening SI Eq. (8),
    Dobrynin electrostatic persistence length SI Eqs. (7), (9), and salt-free SI Eq. (10)
    (b = 3.65 A -> prefactor 2.4797 vs printed 2.48 A*mol/L), total persistence length
    l_T = l_0 + l_E (l_0 = 3.9 A, c_m = 2 mol/L -> 5.1398 vs printed 5.14 A), Kuhn length
    b_Kuhn = 2*l_T (0.8 nm from l_T = 0.4 nm), and the lower-bound mesh size at c_m = 1 mol/L
    (p. 21: printed 5.8 nm is NOT reproduced with fixed Phi_pp = 0.28, which yields 3.31 nm, nor
    with exact I.h.3 inversion f_pp = 0.1678, which yields 6.43 nm, but IS reproduced at 5.815 nm
    if total mass fraction f_pp is halved from 0.38 to 0.19 -> Phi_pp = 0.1323 via Eq. 6).
  - Key measured experimental values stated in text/captions/Table S1: polypeptide DP/MW/PDI
    (Table S1), actin/BSA MWs and pIs (p. 3), BSA PC_avg ~= 8, actin RAM ~30 (4x BSA), Fig. 2E
    colocalization r = 0.864, pyrene assembly rates 0.03 to >1 min^-1 and >50-fold enhancement,
    Fig. 4F auxiliary RAM plateaus (~45 periphery, ~10 interior), and Fig. S4D post-phase-separation
    RAM = 70.3 +/- 15.9 (r = -0.427, N = 117).

  Left out of data.yaml and models/ (experimental protocols / raw-data processing formulas with
  no printed inputs or outputs):
  - Spectrophotometric Beer-Lambert concentration formulas in SI I.c (p. 15: path lengths b = 1 cm,
    0.1 cm; extinction factors 38.5 uM*cm, 45.0 uM*cm, 0.0778/0.1009/0.0408/0.265 uM^-1*cm^-1;
    dye crosstalk ratios 0.17, 0.1185, 0.127, 0.03; BSA E_280 = 40,800 M^-1*cm^-1, Alexa 647
    E_650 = 265,000 M^-1*cm^-1) — no raw absorbances are printed.
  - Image/FRAP/spectroscopy normalization definitions SI Eqs. (1)-(5) (pp. 17-18: min-max I_norm,
    FRAP I_spot_tilde, f_Photobleaching decaying to 0.6-0.7 over 4 min, I_spot_PBC, and
    I_1/2 = (I_max + I_0)/2) — raw fluorescence traces and detector counts are not tabulated.
  - Buffer recipes, storage/centrifugation parameters, fluorophore labeling fractions, microscopy
    optics, and plate-reader wavelengths (SI I.a-I.g, pp. 14-18: 18.2 MOhm-cm water, 10/20 mM
    stocks, pH 7.0/7.5/8.0, 4/-80 degC, 177,000 x g / 21,000 x g, CaBG/MgBG/ME/KMEI/PBS buffers,
    47%/10% TMR, 91% Alexa-647, 12%/10-20% pyrene, 60x NA 1.2 objective, 6.5 um sCMOS pixel,
    100-count dark noise, 405/488/560/635 nm lasers, 365/407 nm and 343/478 nm pyrene channels,
    150 uL reaction volume, 20 min imaging time, ~15-35 s flow-in timings, 5 s bleach pulse).

