# ==========================================================================
# Polyelectrolyte electrostatic persistence length & lower-bound mesh size
# ==========================================================================

- id: run_debye_eq8_saltfree_2M
  model: debye_inverse_length_sq_eq8
  inputs:
    l_B: l_B_water_added
    Z_c: Z_c_counterion_added
    c_c: c_m_coac_2M
    S_salt: S_salt_zero_added
  settings: {}
  outputs: {kappa_sq: kappa_sq_saltfree_2M_calc}

- id: run_lE_eq7_saltfree_2M
  model: electrostatic_persistence_length_eq7
  inputs:
    l_B: l_B_water_added
    f: f_charge_full
    kappa_sq: kappa_sq_saltfree_2M_calc
    b: b_bond_polypeptide
  settings: {}
  outputs: {l_E: l_E_eq7_2M_calc}

- id: run_lE_eq9_saltfree_2M
  model: electrostatic_persistence_length_eq9
  inputs:
    f: f_charge_full
    Z_c: Z_c_counterion_added
    c_c: c_m_coac_2M
    S_salt: S_salt_zero_added
    b: b_bond_polypeptide
  settings: {}
  outputs: {l_E: l_E_eq9_2M_calc}

- id: run_lE_eq10_saltfree_2M
  model: electrostatic_persistence_length_eq10
  inputs: {c_m: c_m_coac_2M, b: b_bond_polypeptide}
  settings: {}
  outputs: {A_E: A_E_eq10_calc, l_E: l_E_eq10_2M_calc}

- id: run_lT_saltfree_2M_eq10
  model: total_persistence_length
  inputs: {l_0: l0_chosen, l_E: l_E_eq10_2M_calc}
  settings: {}
  outputs: {l_T: l_T_saltfree_2M_calc}

- id: run_lT_saltfree_2M_eq7_eq8
  model: total_persistence_length
  inputs: {l_0: l0_chosen, l_E: l_E_eq7_2M_calc}
  settings: {}
  outputs: {l_T: l_T_eq7_eq8_2M_calc}

- id: run_lT_saltfree_2M_eq9
  model: total_persistence_length
  inputs: {l_0: l0_chosen, l_E: l_E_eq9_2M_calc}
  settings: {}
  outputs: {l_T: l_T_eq9_2M_calc}

- id: run_lE_eq9_screened_coac
  model: electrostatic_persistence_length_eq9
  inputs:
    f: f_charge_full
    Z_c: Z_c_counterion_added
    c_c: c_m_coac_2M
    S_salt: S_salt_screened_added
    b: b_bond_polypeptide
  settings: {}
  outputs: {l_E: l_E_screened_coac_calc}

- id: run_lT_screened_coac
  model: total_persistence_length
  inputs: {l_0: l0_chosen, l_E: l_E_screened_coac_calc}
  settings: {}
  outputs: {l_T: l_T_screened_coac_calc}

- id: run_kuhn_from_04nm
  model: kuhn_length_from_persistence_length
  inputs: {l_T: l_T_screened_used}
  settings: {}
  outputs: {b_Kuhn: b_kuhn_from_04nm_calc}

- id: run_lE_eq10_lower_bound_1M
  model: electrostatic_persistence_length_eq10
  inputs: {c_m: c_m_lower_bound, b: b_bond_polypeptide}
  settings: {}
  outputs: {A_E: A_E_eq10_1M_calc, l_E: l_E_eq10_1M_calc}

- id: run_lT_lower_bound_1M
  model: total_persistence_length
  inputs: {l_0: l0_chosen, l_E: l_E_eq10_1M_calc}
  settings: {}
  outputs: {l_T: l_T_lower_bound_1M_calc}

- id: run_kuhn_lower_bound_1M
  model: kuhn_length_from_persistence_length
  inputs: {l_T: l_T_lower_bound_1M_calc}
  settings: {}
  outputs: {b_Kuhn: b_kuhn_lower_bound_1M_calc}

- id: run_mesh_lower_bound_fixed_Phi
  model: coacervate_mesh_size
  inputs: {a: b_kuhn_lower_bound_1M_calc, Phi_pp: Phi_pp_SI}
  settings: {}
  outputs: {xi: xi_lower_bound_fixed_phi_calc}
  note: "Evaluates xi at c_m = 1 mol/L (a = 1.276 nm) holding Phi_pp fixed at the paper's only stated value 0.28."

- id: run_volume_fraction_lower_bound
  model: coacervate_volume_fraction_eq6
  inputs: {f_pp: f_pp_lower_bound_added, rho_pp: rho_pp_glutamic, rho_solvent: rho_solvent_water}
  settings: {}
  outputs: {Phi_pp: Phi_pp_lower_bound_calc}
  note: "Recomputes Phi_pp via SI Eq. (6) when f_pp is halved from 0.38 to 0.19 (proportional to halving c_m from ~2 to 1 mol/L)."

- id: run_mesh_lower_bound_halved_fpp
  model: coacervate_mesh_size
  inputs: {a: b_kuhn_lower_bound_1M_calc, Phi_pp: Phi_pp_lower_bound_calc}
  settings: {}
  outputs: {xi: xi_lower_bound_halved_fpp_calc}
  note: "Evaluates xi at c_m = 1 mol/L with Phi_pp recomputed from halved mass fraction f_pp = 0.19 (alternatives: 0.38, 0.1678)."

