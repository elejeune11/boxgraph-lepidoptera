# ==========================================================================
# Droplet coalescence, inverse capillary velocity, and viscosity
# ==========================================================================

- id: run_inverse_capillary_velocity
  model: inverse_capillary_velocity
  inputs: {tau: tau_coalescence_figS1, d: d_coalesced_figS1}
  settings: {}
  outputs: {v_inv: v_inv_pred}

- id: run_viscosity_from_printed_vinv
  model: viscosity_from_capillary_velocity
  inputs: {v_inv: v_inv_main, gamma: gamma_coacervate_eq1}
  settings: {}
  outputs: {eta: eta_pred_from_printed_vinv}

- id: run_viscosity_e2e
  model: viscosity_from_capillary_velocity
  inputs: {v_inv: v_inv_pred, gamma: gamma_coacervate_eq1}
  settings: {}
  outputs: {eta: eta_pred_e2e}

- id: run_viscosity_ratio_water
  model: viscosity_ratio_to_water
  inputs: {eta: eta_coacervate_main, eta_water: eta_water_added}
  settings: {}
  outputs: {eta_ratio: eta_ratio_pred}

# ==========================================================================
# Polypeptide charge-equivalent <-> chain concentration conversions
# ==========================================================================

- id: run_chain_conc_example
  model: polypeptide_chain_concentration
  inputs: {c_res: c_res_pLK_example, N_res: N_res_pLK100}
