# ==========================================================================
# Filament buckling Eq. (1) and 250-nm subunit count (p. 7)
# ==========================================================================

- id: run_droplet_radius_eq1
  model: droplet_radius_from_diameter
  inputs: {D: D_droplet_eq1}
  settings: {}
  outputs: {R: R_droplet_eq1_calc}

- id: run_buckling_length_eq1
  model: filament_buckling_length_eq1
  inputs:
    R: R_droplet_eq1_calc
    l_p: lp_actin
    d: d_actin_added
    gamma: gamma_coacervate_eq1
    T: T_room_added
  settings: {}
  outputs: {L_star: L_star_eq1_calc}

- id: run_subunit_count_250nm
  model: filament_subunit_count
  inputs: {L: L_short_filament, delta_L: delta_L_actin_added}
  settings: {}
  outputs: {N_subunits: N_subunits_250nm_calc}

# ==========================================================================
# Osmotic crowding: methylcellulose van 't Hoff & de Gennes mesh scaling
# ==========================================================================

- id: run_mc_molar_conc
  model: methylcellulose_molar_concentration
  inputs: {c_wv: c_wv_methylcellulose, M_W: MW_methylcellulose}
  settings: {}
  outputs: {c: c_mc_molar_calc}

- id: run_vant_hoff_exact_c
  model: vant_hoff_osmotic_pressure
  inputs: {c: c_mc_molar_calc, T: T_room_added}
  settings: {}
  outputs: {Pi: Pi_star_exact_c_calc}

- id: run_vant_hoff_printed_c
  model: vant_hoff_osmotic_pressure
  inputs: {c: c_molar_methylcellulose, T: T_room_added}
  settings: {}
  outputs: {Pi: Pi_star_from_180uM_calc}

- id: run_crowding_threshold_mesh_printed_Pi
  model: crowding_threshold_mesh_size
  inputs: {Pi_star: Pi_star_crowding_SI, T: T_room_added}
  settings: {}
  outputs: {xi_star: xi_star_from_450_calc}

- id: run_crowding_threshold_mesh_e2e
  model: crowding_threshold_mesh_size
  inputs: {Pi_star: Pi_star_exact_c_calc, T: T_room_added}
  settings: {}
  outputs: {xi_star: xi_star_e2e_calc}

- id: run_coacervate_osmotic_pressure
  model: coacervate_osmotic_pressure_mesh
  inputs: {xi: xi_coac_SI_p21, T: T_room_added}
  settings: {}
  outputs: {Pi: Pi_coac_2p1nm_calc}

- id: run_osmotic_pressure_ratio
  model: osmotic_pressure_ratio
  inputs: {Pi_coac: Pi_coac_2p1nm_calc, Pi_star: Pi_star_crowding_SI}
  settings: {}
  outputs: {ratio: Pi_ratio_calc}

