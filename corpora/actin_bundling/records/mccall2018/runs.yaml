- id: run_chain_conc_dilute_bound
  model: polypeptide_chain_concentration
  inputs: {c_res: c_res_phase_sep_BSA, N_res: N_res_pLK100}
  settings: {}
  outputs: {c_chain: c_chain_dilute_pred}

# ==========================================================================
