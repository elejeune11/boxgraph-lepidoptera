  text: >
    Calibrated 3D orthographic front-plane digitization of Fig. 5f (80 nM CP, t = 40 s; all 5
    r-axis ticks calibrated with 0.20 px residual, z-axis with 1.29 px residual) measures the
    double-peaked ring wave crest at |r| = 2.0 um (B = 131.2 /um^2, center B(0) = 96.2 /um^2,
    rim/center ratio 1.36), dropping steeply to 96.0 /um^2 at |r| = 2.5 um and 28.4 /um^2 at
    |r| = 3.0 um. In contrast, both mass-conserving cone PDE variants with the printed
    D_B = 0.0077 um^2/s spread ~0.9-1.0 um (+45-50%) farther radially by t = 40 s, placing
    the ring crest at r_peak = 3.02 um (axisymmetric, B(3.0) = 164.9 /um^2) and 2.91 um
    (1D Cartesian membrane, B(3.0) = 108.4 /um^2) — 3.8-5.8x above Fig. 5f at r = -3.0 um
    (causing both cmp_fig5f_80nM_prof_cons and cmp_fig5f_80nM_prof_cart to fail at r = -3.0 um).
    Reducing D_B alone by ~0.35x shifts r_peak inward to ~2.0 um but drives B_peak (360-667
    /um^2) and V_tot_max (2642-3548 /um^2) far above both calibrated colorbars, revealing an
    unexplained radial-spreading discrepancy between the published equations and Fig. 5f.
  citation: {page: 7, printed_page: "7", quote: "The spatio-temporal network growth was modelled along the membrane", where: "Fig. 5f"}

