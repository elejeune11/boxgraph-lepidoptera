- id: q_audit_reading_cone_radius_tangent_geometry
  kind: reading
  about: [cone_disk_radius, r_cone_40nM, r_cone_80nM, N_domains_40nM_sim, N_domains_80nM_sim]
  text: >
    Independent audit reading note on cone_disk_radius: the first reader formalized the
    conical base radius via equal-area / equal-volume spherical partitioning r_cone =
    2*R/sqrt(N) (giving 9.00 um at N = 16 and 6.09 um at N = 35). An alternative geometric
    reading — a right circular cone of height R = 18 um tangent to the vesicle sphere and
    subtending solid angle 4*pi/N (half-angle theta = arccos(1 - 2/N)) — gives base radius
    r_cone = R * tan(theta) = 9.96 um at N = 16 (10.14 um at protrusion median 15.5) and
    6.36 um at N = 35, matching the printed 10 um and 6 um to 1 significant figure (at the
    cost of a slightly larger cone volume than V_sphere/N). First-reader model preserved.
  citation: {page: 22, printed_page: "SI 11", quote: "We use 10 µm at 40 nM CP (16 domains)", where: "Supplementary Note 2"}

