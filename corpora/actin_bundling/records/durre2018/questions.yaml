  text: >
    Cross-record audit with liu2008 (cited qualitatively as ref-21 on p. 2; 0 cited links, 0
    ModelAtlas relations, 0 cross-validations across liu2008's 18 measured datums because the two
    papers solve strictly complementary halves — pure reaction-diffusion kinetics neglecting
    membrane mechanics vs Helfrich/WLC filament-membrane mechanics and a fixed-N Brownian-ratchet
    tube ODE): (1) On nearly identical Egg-PC/Ni-NTA GUVs, liu2008 assembles externally in an
    infinite bath without CP or profilin (8.5 uM G-actin, 160 nM Arp2/3, 400 nM His-N-WASP) and
    gets thin parallel-filament inward tubes (1-25 um, N ~ 10) in ~95% of GUVs — explicitly
    inhibiting protrusions if CP is added — whereas durre2018 encapsulates internally in a finite
    pool (3 uM G-actin, 300 nM Arp2/3, 300 nM His-VCA, 13.5 uM profilin) where 0 nM CP gives 96%
    bulk networks (4% cortex, 0% protrusions), 40 nM CP peaks broad convex dendritic protrusions
    (24.3% of GUVs, <= 4 um), and 60-180 nM CP switches to concave domains (38.0% at 60 nM) and
    re-entrant closed cortices (59.9% at 120 nM, 67.7% flat at 180 nM). Evaluating durre2018's
    mass-conserving 1D steady state at liu2008's CP = 0 concentrations gives B_ss = 10,576 /um^2
    (97.0% boundary-layer monomer depletion, G_mem = 0.256 uM), jumping 2.32x to 24,528 /um^2
    under liu2008's 3x Arp2/3 increase (which reduced filopodia ~60%) and staying active at 1,366
    /um^2 down to 10 nM Arp2/3. (2) Discussion p. 8 claims that because B <= 450 /um^2,
    "protrusion velocities are not dominated by monomer depletion, but rather by membrane tension"
    and "the protrusion velocity increases exponentially with an increasing number of barbed ends."
    Both statements conflict quantitatively with the models: in the Brownian ratchet (liu2008
    Eq. 12), velocity scales as exp(-f_mem*delta/(N*k_B*T)), which increases sub-exponentially
    and saturates as N grows (for f_mem = 20 pN, delta = 2.7 nm, k_B*T = 4.114 pN*nm, the factor
    rises from 0.269 at N = 10 to 0.769 at N = 50, 0.877 at N = 100, and 0.971 at N = 450 — only
    +11% across 100 -> 450 filaments); meanwhile durre2018's own conserved 1D steady state already
    suffers 85.1%, 70.5%, 48.8%, and 35.3% local G-actin depletion at the membrane at 20, 40, 80,
    and 120 nM CP (G_mem_ss = 0.448, 0.884, 1.535, 1.942 uM vs 3.0 uM bulk).
  citation: {page: 8, printed_page: "8", quote: "exponentially with an increasing number of barbed ends", where: "Discussion"}

- id: q_gov2018_curvature_sorting_vs_kinetic_enrichment_and_concave_mode
  kind: overstated_claim
  about:
