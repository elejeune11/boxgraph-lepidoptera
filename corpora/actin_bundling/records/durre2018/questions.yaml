  text: >
    Cross-record audit with graham2023 (uncited 2023 study, 0 shared references, 0 cited links, 0
    ModelAtlas relations, 0 cross-validations across graham2023's 38 measured datums because
    graham2023 models membraneless, Arp2/3-free, VCA-free, CP-free VASP condensates with WLC
    ring bending and droplet wetting minimization): (1) Peripheral shell/cortex assembly follows
    opposite physical routes in the two confined spherical systems. In graham2023, tiny VASP
    droplets (D = 1-4 um, R = 0.5-2 um << L_p = 17.7 um; ~12.6x actin partitioning, 0 nM CP)
    force actin mechanically to the periphery and into equatorial rings (T_ring ~ D^1.72-1.97)
    that stretch droplets outward into rods (AR > 9-15). In durre2018's 10x larger GUVs (D =
    20-50 um, R = 10-25 um >= L_p), CP-free assembly (0 nM CP) produces 96% bulk volume-spanning
    networks (only 4.0% cortex) rather than peripheral rings; peripheral cortex formation is
    instead biochemically gated by membrane-tethered VCA + CP in a re-entrant window (41.5% closed
    cortex at 20 nM, collapsing to 10.2% at 40 nM and 1.0% at 60 nM as discrete patches dominate,
    then rebounding to 59.9% at 120 nM and 67.7% flat cortex at 180 nM). (2) Encapsulated mass
    conservation onto a 2D spherical shell (durre2018/vca_surface_density, V_sphere/A_sphere =
    R/3 ~ R^1) contrasts with condensation into a 1D equatorial ring (V_sphere/(2*pi*R) ~ R^2,
    matching graham2023 Fig. 3e's empirical spherical-ring exponent 1.97 vs Eq. S25's 1.5). (3)
    durre2018's Pollard-2000 free barbed-end kinetics (k_on = 11.6 uM^-1 s^-1, k_off = 1.4 s^-1)
    predict 33.4 mon/s (90.2 nm/s) at 3 uM and 21.8 mon/s (58.9 nm/s) at 2 uM G-actin — 2.56x
    faster than graham2023's measured VASP-droplet bundle elongation rate (23 +/- 3 nm/s, 8-9 mon/s
    at 2 uM bulk actin).
