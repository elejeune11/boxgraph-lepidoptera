  text: >
    Calibrated full-curve digitization of all 21 PDE plots (Fig. 5c-f, Supp Figs. 11 and 14)
    quantitatively separates the printed Eqs. (6)-(16) (1/21 reproduced), mass-conserving
    axisymmetric membrane (2/21 reproduced: steady-state lines only; all 15 cylinder transient
