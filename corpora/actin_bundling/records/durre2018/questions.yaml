- id: q_eq14_15_missing_dissociation
  kind: possible_error
  about:
    - kinetic_ss_infinite_pool_eq6_16
    - kinetic_ss_infinite_pool_conserved
    - kinetic_pde_cylinder_eq6_16
    - kinetic_pde_cylinder_conserved
    - kinetic_pde_cone_eq6_16
    - kinetic_pde_cone_conserved
  text: >
    Printed boundary conditions Eqs. (14) and (15) (SI p. 12, PDF p. 23) omit the reverse
    dissociation release terms +k_2*V* (for G-actin) and +k_4*A* (for Arp2/3), despite
    reaction Eq. (3) and surface PDEs Eqs. (6)-(8) explicitly treating V + G <-> V* and
    V* + Arp2/3 <-> A* as reversible. Omitting +k_2*V* and +k_4*A* breaks mass conservation
    and turns the membrane into a massive one-way monomer sink even at B = 0 (collapsing
    G|_0 from 3 to 0.15 uM in the infinite-pool cylinder and draining G to 0 in the closed
    cone), yielding total extinction (B = 0) in the finite-pool cone and 7-14x suppressed
    steady states (64.5, 12.6, 0 /um^2 vs ~470, ~175, ~98 /um^2) in the cylinder. Restoring
    +k_2*V* and +k_4*A* in the conserved variants immediately reproduces Fig. 5c-f, Supp
    Fig. 11, and Supp Fig. 14.
  citation: {page: 23, printed_page: "SI 12", quote: "But appear as boundary conditions", where: "Eqs. 14-16"}

- id: q_membrane_laplacian_comsol
  kind: choice
  about:
    - kinetic_pde_cylinder_conserved
    - kinetic_pde_cylinder_conserved_cartesian_mem
    - kinetic_pde_cone_conserved
    - kinetic_pde_cone_conserved_cartesian_mem
  text: >
    With mass-conserving BCs restored, the mathematically faithful 2D axisymmetric membrane
    Laplacian (1/r) d_r(r d_r u) reproduces all steady states (B_100 = 471, 177, 99 /um^2)
    and qualitative cone patterns (flat at 40 and 120 nM, double-peaked ring at 80 nM), but
    produces transient center peaks ~25-50% above Fig. 5c, 5e, 5f and Supp Fig. 14 (e.g.
    cylinder B_peak = 524, 360, 262 /um^2; branching peak = 227, 202, 177 /um^2/s). In
    contrast, replacing the membrane Laplacian with 1D Cartesian d^2u/dr^2 while keeping 3D
    axisymmetric bulk diffusion (as occurs in COMSOL Multiphysics 5.3 if a Coefficient Form
    Boundary PDE on a 2D axisymmetric boundary line omits the cylindrical Jacobian r)
    reproduces every transient peak height and colorbar maximum across Fig. 5c-f and Supp
    Fig. 14 (cylinder B_peak = 415, 258, 187; branching peak = 148, 134, 119; cone B_peak =
    371, 233, 145; cone V_tot max = 2072, 1924, 1513). Both variants are retained because
    the COMSOL source file is not published.
  citation: {page: 23, printed_page: "SI 12", quote: "denotes the diffusion operator at the membrane", where: "Eqs. 6-9"}

- id: q_b0_seed_normalization
  kind: reading
  about:
    - B0_seed_norm
    - sigma_seed
    - kinetic_pde_cylinder_eq6_16
    - kinetic_pde_cone_eq6_16
  text: >
    SI p. 13 states that the initial barbed-end distribution B_0(r, 0) is a Gaussian around
    r = 0 with sigma = 10 nm "normalized to 1/um^2". Literally, a 2D area-normalized
    Gaussian (integral = 1 barbed end) has peak 1/(2*pi*sigma^2) ~ 1592 /um^2 at r = 0,
    producing an initial spike not visible in Fig. 5c, whereas a Gaussian with peak
    amplitude 1 /um^2 (exp(-r^2/(2*sigma^2))) starts visually at 0 and reproduces the
    delay and peak timing of Fig. 5c-e (~4.5 s for A*_max, ~10-14 s for B_max). The models
    adopt peak amplitude 1 /um^2.
  citation: {page: 24, printed_page: "SI 13", quote: "normalized to 1/µm2 to describe the seeding event", where: "Supplementary Note 2"}

- id: q_dv_missing_asterisk
  kind: possible_error
