  text: >
    Cross-record audit with same-lab follow-up nastkolb2022 (Bausch lab; cites durre2018 on pp. 2
    and 9 for profilin+CP bulk suppression and membrane nucleator clustering, using the identical
    87.45% Egg-PC / 10% DOGS-Ni-NTA / 2.5% PEG2000-PE lipid recipe; 0 cited links, 0 ModelAtlas
    relations, 0 cross-validations across nastkolb2022's 66 measured datums because nastkolb2022
    replaces His-VCA+Arp2/3 with Arp2/3-free His-VASP on planar SLBs/MLs and models only FRAP
    exponentials and 2D ribbon filament packing): (1) nastkolb2022's standard bulk-suppression
    stoichiometry (50 nM CP, 2 uM actin, 10 uM profilin -> R_CP = 0.025, profilin:actin = 5.0:1)
    sits directly inside durre2018's concave-domain switching window (60-80 nM CP, 3 uM actin,
    13.5 uM profilin -> R_CP = 0.020-0.0267, profilin:actin = 4.5:1), yet membrane-tethered VASP
    resists CP and assembles up to 3 um-wide apolar bundles (45 +/- 12 filaments/um) rather than
    dendritic concave patches. Note also that durre2018 Supp Fig. 7 uses a lipid monolayer for
    TIRF domain-growth controls (0-120 nM CP), whereas nastkolb2022 demonstrates 4-fold lower
    nucleator mobility on lipid monolayers vs fluid SLBs (t_1/2 = 0.399 vs 0.102 min, mobile
    fraction 0.61 vs 0.97). (2) Converting nastkolb2022's circular-spot FRAP (w = 2.48 um, D ~
    0.224*w^2/t_1/2) gives D_VASP,SLB ~ 0.225 um^2/s (7.1x slower than durre2018's His-VCA D_V =
    1.59 um^2/s) and D_VASP,ML ~ 0.058 um^2/s (27.6x slower); durre2018/stokes_einstein_scaling
    from 12 kDa His-VCA to ~160 kDa tetrameric His6-VASP predicts D = 0.671 um^2/s (2.98x too
    fast), confirming that multivalent Ni-NTA lipid anchoring (4 anchors) and SLB friction
    dominate over 3D M^(-1/3) globular scaling. (3) Both papers observe polymerization-coupled
    up-concentration of the Ni-NTA-tethered nucleator: nastkolb2022 directly measures the
    filament-binding immobilization postulated for durre2018's paused state V+ (SI p. 13), with
    VASP SLB mobile fraction dropping from 0.97 to 0.65 after 30 min polymerization and VASP
    enriching to 1.95x on bundles at 5.1 min (fig5c_vasp, vs ~4x VCA enrichment in durre2018)
    while depleting unbound tracer lipids by ~9% (fig5c_lipids).
  citation: {page: 23, printed_page: "SI 12", quote: "scaled from these values according to the Einstein-Stokes equation, approximating them as globular proteins", where: "Supplementary Note 2"}

