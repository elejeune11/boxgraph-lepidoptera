    from D_G = 30 um^2/s and D_V = 1.59 um^2/s without reporting any protein molecular
    weights or the membrane drag formula. Using standard molecular weights (actin 42 kDa,
    CP 64 kDa, Arp2/3 224 kDa, His-VCA 12 kDa, VCAG 54 kDa, Arp* 278 kDa), 3D M^(-1/3)
