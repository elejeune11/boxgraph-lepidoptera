    prints "DV=0.96 um^2/s" without a superscript asterisk, colliding with D_V and omitting
    the symbol D_V* required by Eq. (7). From physical ordering (V* = VCAG is larger than V)
    and Einstein-Stokes scaling, 0.96 um^2/s clearly denotes D_V*.
  citation: {page: 23, printed_page: "SI 12", quote: "DArp=17 µm²/s, DV=0.96 µm²/s, DA=0.84 µm²/s)", where: "Supplementary Note 2"}

