  text: >
    Cross-record audit with gov2018 (contemporaneous 2018 review of ref-1 Gov & Gopinathan 2006 =
    gov2018/ref-34; 0 cited links, 0 ModelAtlas relations, 0 cross-validations as gov2018 has 0
    measured datums): (1) Discussion p. 8 cites ref-1 to claim that the observed ~4-fold VCA
    up-concentration inside actin domains "is in agreement with experimental and theoretical work."
    However, evaluating gov2018's passive curvature-sorting Boltzmann law Eq. (2.9)
    (n/n_0 = exp[(kappa/k_B*T)*(a/R)]) across durre2018's measured domain curvatures |H| =
    0.07-0.50 /um (R = 2-14.3 um) with Egg-PC kappa/k_B*T = 20 and molecular scale a = 5-10 nm
    gives only 1.007x-1.051x (a = 5 nm) or 1.014x-1.105x (a = 10 nm) enrichment — and even at
    gov2018's extreme upper bound kappa/k_B*T = 100 with a = 10 nm, only 1.139x at the 120 nM
    median (|H| = 0.13 /um) and 1.649x at |H| = 0.50 /um, 1-2 orders of magnitude too weak in
    chi = ln(n/n_0) to produce ~4x enrichment (chi = 1.386). Indeed VCA without actin remains
    homogeneous (Fig. 2e-f), and durre2018's own cone PDE achieves ~4x enrichment at zero
    curvature via kinetic paused-state immobilization (V+, k_re = 0.001 /s). (2) In gov2018's
    single-CMC linear stability framework, protrusive actin coupled to concave proteins (H_0 > 0,
    A > 0) is linearly stable (negative feedback), requiring contractile myosin (A < 0) for static
    inward invaginations; durre2018's myosin-free concave domains (-0.07 to -0.50 /um, 38.0% at
    60 nM CP) therefore represent a distinct reaction-diffusion rim-over-center growth mechanism
    outside gov2018's uniform-A CMC theory, while adding 5 uM NMM II at 120 nM CP doubles
    curvature (-0.13 -> -0.22 /um) and yields 27.5% fission, entering gov2018's contractile
    constriction regime. (3) stokes_einstein_scaling (D = D_ref*(M_ref/M)^(1/3)) is intentionally
    not linked to gov2018/cmc_diffusion_einstein (D = Lambda*k_B*T, a 1-op `too_plain` relation
    lacking mass M; converting durre2018's FRAP D_V = 1.59 um^2/s gives Einstein mobility
    Lambda_V = 386.5 um/(pN*s), whereas 2D membrane inclusions obey logarithmic Saffman-Delbruck
    drag rather than 3D M^(-1/3) scaling, matching durre2018's 50% D_A discrepancy).
  citation: {page: 8, printed_page: "8", quote: "concentration of the Arp2/3 activator during polymerization,", where: "Discussion, ref. 1"}

