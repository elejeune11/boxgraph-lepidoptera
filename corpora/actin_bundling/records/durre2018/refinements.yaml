- id: ref_cyl_conserved_mesh_Bpeak
  run: run_cyl_conserved_80nM
  setting: mesh_n
  factors: [1, 1.5, 2, 3]
  mode: multiply
  output: B_peak
  tolerance: "2%"
  tolerance_basis: "added: 2% is well below visual reading precision of Fig. 5c (~5-10%)"
  tolerance_added: true

- id: ref_cyl_conserved_mesh_B100
  run: run_cyl_conserved_80nM
  setting: mesh_n
  factors: [1, 1.5, 2, 3]
  mode: multiply
  output: B_100
  tolerance: "1%"
  tolerance_basis: "added: 1% checks convergence of long-time steady-state barbed-end density in Supp Fig. 11"
  tolerance_added: true

- id: ref_cyl_cart_mesh_Bpeak
  run: run_cyl_cart_80nM
  setting: mesh_n
  factors: [1, 1.5, 2, 3]
  mode: multiply
  output: B_peak
  tolerance: "2%"
  tolerance_basis: "added: 2% checks spatial convergence of Cartesian-membrane cylinder transient peak"
  tolerance_added: true

- id: ref_cyl_conserved_rtol
  run: run_cyl_conserved_80nM
  setting: rtol
  factors: [1, 10, 100]
  mode: divide
  output: B_peak
  tolerance: "1%"
  tolerance_basis: "added: 1% checks BDF ODE solver temporal tolerance convergence"
  tolerance_added: true

- id: ref_cone_conserved_mesh_Bpeak
  run: run_cone_conserved_80nM
  setting: mesh_n
  factors: [1, 1.5, 2]
  mode: multiply
  output: B_peak
  tolerance: "2%"
  tolerance_basis: "added: 2% checks spatial convergence of finite-pool cone peak barbed-end density (Fig. 5f)"
  tolerance_added: true

- id: ref_cone_conserved_mesh_ratio
  run: run_cone_conserved_80nM
  setting: mesh_n
  factors: [1, 1.5, 2]
  mode: multiply
  output: rim_to_center_ratio
  tolerance: "5%"
  tolerance_basis: "added: 5% checks that the double-peaked ring contrast at 80 nM CP (qualitative feature in Fig. 5f) is mesh-independent"
  tolerance_added: true

- id: ref_cone_cart_mesh_Bpeak
  run: run_cone_cart_80nM
  setting: mesh_n
  factors: [1, 1.5, 2]
  mode: multiply
  output: B_peak
  tolerance: "2%"
  tolerance_basis: "added: 2% checks spatial convergence of Cartesian-membrane cone peak barbed-end density"
  tolerance_added: true
