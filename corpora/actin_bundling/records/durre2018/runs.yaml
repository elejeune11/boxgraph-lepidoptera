# ---- Analytical / derived parameter checks ----
- id: run_vca_density
  model: vca_surface_density
  inputs: {c_VCA: VCA_conc, R: R_vesicle_avg}
  outputs: {V0: V0_pred}

- id: run_cone_r_40nM
  model: cone_disk_radius
  inputs: {R: R_vesicle_avg, N_domains: N_domains_40nM_sim}
  outputs: {r_cone: r_cone_40nM_pred}

- id: run_cone_r_80nM
  model: cone_disk_radius
  inputs: {R: R_vesicle_avg, N_domains: N_domains_80nM_sim}
  outputs: {r_cone: r_cone_80nM_pred}

- id: run_se_cp
  model: stokes_einstein_scaling
  inputs: {D_ref: D_G, M_ref: mw_actin_added, M: mw_cp_added}
  outputs: {D: D_CP_pred}

- id: run_se_arp
  model: stokes_einstein_scaling
  inputs: {D_ref: D_G, M_ref: mw_actin_added, M: mw_arp23_added}
  outputs: {D: D_Arp_pred}

- id: run_se_vstar
  model: stokes_einstein_scaling
  inputs: {D_ref: D_V, M_ref: mw_vca_added, M: mw_vcag_added}
  outputs: {D: D_Vstar_pred}

- id: run_se_a
  model: stokes_einstein_scaling
  inputs: {D_ref: D_V, M_ref: mw_vca_added, M: mw_arpstar_added}
  outputs: {D: D_A_pred}

- id: run_kdeg_cp
  model: degradation_equivalent_cp
  inputs: {k_Deg: k_Deg, k_Cap: k_Cap}
  outputs: {CP_eq: cp_equiv_kdeg_pred}

- id: run_frac_sum_20nM
  model: vesicle_fraction_sum
  inputs: {f_domains: frac_domains_20nM, f_cortex: frac_cortex_20nM}
  outputs: {f_total: frac_membrane_20nM_sum}

