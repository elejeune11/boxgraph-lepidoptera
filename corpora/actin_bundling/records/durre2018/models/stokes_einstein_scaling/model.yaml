id: stokes_einstein_scaling
name: Einstein-Stokes globular protein diffusion coefficient scaling
role: model
from_words: true
stated:
  page: 23
  printed_page: "SI 12"
  quote: "The other diffusion constants are scaled from these values according to the Einstein-Stokes equation, approximating them as globular proteins"
  where: "Supplementary Note 2"
equation: "D = D_ref * (M_ref / M)^(1/3)"
inputs:
  D_ref: {quantity: diffusion_coefficient, unit: um^2/s}
  M_ref: {quantity: molecular_mass, unit: kDa}
  M: {quantity: molecular_mass, unit: kDa}
outputs:
  D: {quantity: diffusion_coefficient, unit: um^2/s}
settings: {}
stochastic: false
