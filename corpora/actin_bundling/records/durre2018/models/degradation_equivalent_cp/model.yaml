id: degradation_equivalent_cp
name: capping protein concentration equivalent to barbed-end degradation rate
role: model
from_words: true
stated:
  page: 24
  printed_page: "SI 13"
  quote: "We choose a small rate kDeg=0.001 /s, that is comparable to 1 nM CP and thus comes only into play if the local CP concentration is depleted."
  where: "Supplementary Note 2"
equation: "CP_eq = k_Deg / k_Cap"
inputs:
  k_Deg: {quantity: barbed_end_degradation_rate, unit: 1/s}
  k_Cap: {quantity: cp_binding_rate, unit: uM^-1*s^-1}
outputs:
  CP_eq: {quantity: cp_concentration, unit: nM}
settings: {}
stochastic: false
