id: cone_disk_radius
name: single-domain cone disk radius from vesicle radius and domain count
role: model
from_words: true
stated:
  page: 22
  printed_page: "SI 11"
  quote: "The size of the cone is chosen according to the experimental data, where the height is the average vesicle radius (18 µm). As the cone describes the volume element for one domain, its circular disk has to be half the centre-to-centre distance between two domains."
  where: "Supplementary Note 2"
equation: "r_cone = 2 * R / sqrt(N_domains)"
inputs:
  R: {quantity: ves_radius, unit: um}
  N_domains: {quantity: domain_count, unit: dimensionless}
outputs:
  r_cone: {quantity: cone_disk_radius, unit: um}
settings: {}
stochastic: false
