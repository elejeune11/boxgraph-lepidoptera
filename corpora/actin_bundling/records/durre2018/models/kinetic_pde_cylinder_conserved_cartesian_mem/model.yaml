id: kinetic_pde_cylinder_conserved_cartesian_mem
name: time-dependent infinite-pool cylinder PDEs with mass-conserving BCs and 1D Cartesian membrane diffusion
role: model
variant_of: kinetic_pde_cylinder_eq6_16
built_from: [kinetic_pde_cylinder_eq6_16]
corrections:
  - equation: "Eq. 14"
    change: "Add reverse dissociation term +k_2*V* to the G-actin membrane flux boundary condition"
    evidence: "Required by mass conservation from Eq. (3) and Eqs. (6)-(7); without it B collapses by 7-14x or to zero."
  - equation: "Eq. 15"
    change: "Add reverse dissociation term +k_4*A* to the Arp2/3 membrane flux boundary condition"
    evidence: "Required by Arp2/3 conservation from Eq. (3) and Eqs. (7)-(8)."
  - equation: "Eqs. 6-9"
    change: "Replace axisymmetric 2D membrane Laplacian (1/r) d_r(r d_r u) with 1D Cartesian d^2 u / dr^2 on the membrane boundary while keeping 3D axisymmetric diffusion in the bulk cylinder"
    evidence: "In COMSOL Multiphysics 5.3, a Coefficient Form Boundary PDE placed on a boundary line of a 2D axisymmetric geometry omits the cylindrical metric factor r unless entered manually. True axisymmetric membrane diffusion yields transient center peaks ~25-50% above Fig. 5c,e (B_peak = 525.9, 361.8, 262.6 /um^2; branching peak = 227.6, 202.7, 178.1 /um^2/s), whereas 1D Cartesian membrane diffusion stays much closer to Fig. 5c-e and Supp Fig. 11 (B_peak = 417.1, 257.8, 181.9 /um^2 [early t<=20 s peak 406.2 at 40 nM]; A*_peak = 87.1-90.1 /um^2; branching peak = 144.8, 130.8, 116.4 /um^2/s; B_100 = 471.5, 176.8, 98.7 /um^2)."
stated:
  page: 23
  printed_page: "SI 12"
  quote: "Membrane bound 2d species:"
  where: "Eqs. 6-16 (Supplementary Note 2, cylinder geometry SI p. 11)"
equation: "1D Cartesian membrane PDEs (d_rr u) coupled to 3D axisymmetric cylinder bulk with mass-conserving flux BCs (+k_2*V*, +k_4*A*)"
inputs:
  G_0: {quantity: actin_concentration, unit: uM}
  Arp_0: {quantity: arp_concentration, unit: uM}
  CP_0: {quantity: cp_concentration, unit: nM}
  V_0: {quantity: vca_surface_density, unit: 1/um^2}
  B_0_norm: {quantity: barbed_end_density, unit: 1/um^2}
  sigma: {quantity: seed_width, unit: nm}
  r_cyl: {quantity: cylinder_radius, unit: um}
  h_cyl: {quantity: cylinder_height, unit: um}
  k_on: {quantity: elongation_on_rate, unit: uM^-1*s^-1}
  k_off: {quantity: elongation_off_rate, unit: 1/s}
  k_1: {quantity: vca_actin_on_rate, unit: uM^-1*s^-1}
  k_2: {quantity: vca_actin_off_rate, unit: 1/s}
  k_3: {quantity: arp_activation_on_rate, unit: uM^-1*s^-1}
  k_3_reduction: {quantity: rate_scaling_factor, unit: dimensionless}
  k_4: {quantity: arp_activation_off_rate, unit: 1/s}
  k_Cap: {quantity: cp_binding_rate, unit: uM^-1*s^-1}
  k_Arp: {quantity: branching_rate_constant, unit: um^2/s}
  k_re: {quantity: vca_recovery_rate, unit: 1/s}
  k_Deg: {quantity: barbed_end_degradation_rate, unit: 1/s}
  D_G: {quantity: diffusion_coefficient, unit: um^2/s}
  D_Arp: {quantity: diffusion_coefficient, unit: um^2/s}
  D_CP: {quantity: diffusion_coefficient, unit: um^2/s}
  D_V: {quantity: diffusion_coefficient, unit: um^2/s}
  D_Vstar: {quantity: diffusion_coefficient, unit: um^2/s}
  D_A: {quantity: diffusion_coefficient, unit: um^2/s}
  D_B: {quantity: network_spreading_diffusivity, unit: um^2/s}
outputs:
  B_peak: {quantity: barbed_end_density, unit: 1/um^2}
  B_40: {quantity: barbed_end_density, unit: 1/um^2}
  B_100: {quantity: barbed_end_density, unit: 1/um^2}
  A_star_peak: {quantity: activated_arp_density, unit: 1/um^2}
  A_star_40: {quantity: activated_arp_density, unit: 1/um^2}
  branching_rate_peak: {quantity: branching_rate, unit: 1/(um^2*s)}
  branching_rate_40: {quantity: branching_rate, unit: 1/(um^2*s)}
settings:
  mesh_n: 24
  r_stretch: 5.5
  z_stretch: 2.5
  t_end: 100.0
  rtol: 1.0e-5
  atol: 1.0e-7
stochastic: false
