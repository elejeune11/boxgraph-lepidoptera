id: vca_surface_density
name: initial membrane-bound VCA surface density
role: model
from_words: true
stated:
  page: 24
  printed_page: "SI 13"
  quote: "The density of VCA is set to V0=1084 /µm2, assuming all VCA bound homogeneously to the membrane and a vesicle radius of 18 µm"
  where: "Supplementary Note 2"
equation: "V_0 = (1/3) * c_VCA * N_A * R"
inputs:
  c_VCA: {quantity: vca_concentration, unit: uM}
  R: {quantity: ves_radius, unit: um}
outputs:
  V0: {quantity: vca_surface_density, unit: 1/um^2}
settings: {}
stochastic: false
