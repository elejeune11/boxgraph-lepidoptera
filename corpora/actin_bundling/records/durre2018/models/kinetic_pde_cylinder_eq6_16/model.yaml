id: kinetic_pde_cylinder_eq6_16
name: time-dependent infinite-pool cylinder kinetic PDEs as printed (Eqs. 6-16)
role: model
stated:
  page: 23
  printed_page: "SI 12"
  quote: "Membrane bound 2d species:"
  where: "Eqs. 6-16 (Supplementary Note 2, cylinder geometry SI p. 11)"
equation: "dV/dt = D_V nabla_m^2 V - k_1 G|_0 V + k_2 V* + k_re V+; dV*/dt = D_V* nabla_m^2 V* + k_1 G|_0 V - k_2 V* - k_3_eff Arp|_0 V* + k_4 A*; dA*/dt = D_A nabla_m^2 A* + k_3_eff Arp|_0 V* - k_4 A* - k_Arp A* B; dB/dt = D_B (G|_0/G_init) nabla_m^2 B + k_Arp A* B - k_Cap CP|_0 B - k_Deg B; dV+/dt = k_Arp A* B - k_re V+; bulk 3D diffusion in cylinder (r, h) with Dirichlet top BC and printed membrane flux BCs Eqs. (14)-(16)"
inputs:
  G_0: {quantity: actin_concentration, unit: uM}
  Arp_0: {quantity: arp_concentration, unit: uM}
  CP_0: {quantity: cp_concentration, unit: nM}
  V_0: {quantity: vca_surface_density, unit: 1/um^2}
  B_0_norm: {quantity: barbed_end_density, unit: 1/um^2}
  sigma: {quantity: seed_width, unit: nm}
  r_cyl: {quantity: cylinder_radius, unit: um}
  h_cyl: {quantity: cylinder_height, unit: um}
  k_on: {quantity: elongation_on_rate, unit: uM^-1*s^-1}
  k_off: {quantity: elongation_off_rate, unit: 1/s}
  k_1: {quantity: vca_actin_on_rate, unit: uM^-1*s^-1}
  k_2: {quantity: vca_actin_off_rate, unit: 1/s}
  k_3: {quantity: arp_activation_on_rate, unit: uM^-1*s^-1}
  k_3_reduction: {quantity: rate_scaling_factor, unit: dimensionless}
  k_4: {quantity: arp_activation_off_rate, unit: 1/s}
  k_Cap: {quantity: cp_binding_rate, unit: uM^-1*s^-1}
  k_Arp: {quantity: branching_rate_constant, unit: um^2/s}
  k_re: {quantity: vca_recovery_rate, unit: 1/s}
  k_Deg: {quantity: barbed_end_degradation_rate, unit: 1/s}
  D_G: {quantity: diffusion_coefficient, unit: um^2/s}
  D_Arp: {quantity: diffusion_coefficient, unit: um^2/s}
  D_CP: {quantity: diffusion_coefficient, unit: um^2/s}
  D_V: {quantity: diffusion_coefficient, unit: um^2/s}
  D_Vstar: {quantity: diffusion_coefficient, unit: um^2/s}
  D_A: {quantity: diffusion_coefficient, unit: um^2/s}
  D_B: {quantity: network_spreading_diffusivity, unit: um^2/s}
outputs:
  B_peak: {quantity: barbed_end_density, unit: 1/um^2}
  B_40: {quantity: barbed_end_density, unit: 1/um^2}
  B_100: {quantity: barbed_end_density, unit: 1/um^2}
  A_star_peak: {quantity: activated_arp_density, unit: 1/um^2}
  A_star_40: {quantity: activated_arp_density, unit: 1/um^2}
  branching_rate_peak: {quantity: branching_rate, unit: 1/(um^2*s)}
  branching_rate_40: {quantity: branching_rate, unit: 1/(um^2*s)}
settings:
  mesh_n: 24
  r_stretch: 5.5
  z_stretch: 2.5
  t_end: 100.0
  rtol: 1.0e-5
  atol: 1.0e-7
stochastic: false
