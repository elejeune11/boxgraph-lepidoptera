# Cross-record ModelAtlas audit for durre2018 (Dürre et al., Nat. Commun. 9, 1630, 2018)
# across all 4 ready corpus pairs:
#   1. durre2018 <-> liu2008       (durre2018 cites liu2008 as ref-21)
#   2. durre2018 <-> gov2018       (contemporaneous 2018; shared ref Gov & Gopinathan 2006)
#   3. durre2018 <-> graham2023    (uncited; confined droplet shells/rings vs GUV patches/cortices)
#   4. durre2018 <-> nastkolb2022  (same Bausch lab; nastkolb2022 cites durre2018 on pp. 2, 9)
#
# Result: 0 cross-record ModelAtlas relations added.
#
# Exhaustive audit summary (all 19 durre2018 models vs 24 liu2008 + 37 gov2018 + 31 graham2023
# + 17 nastkolb2022 = 109 partner models):
# - durre2018's 14 core models solve pure 2D/3D reaction-diffusion PDEs and 1D steady states for
#   Arp2/3 + His-VCA + CP + G-actin kinetics (V, V*, A*, V+, B, G, Arp, CP) explicitly neglecting
#   membrane mechanics (SI p. 10), paired with 5 auxiliary models: stokes_einstein_scaling
#   (D = D_ref*(M_ref/M)^(1/3)), vca_surface_density (V_0 = (1/3)*c_VCA*N_A*R), cone_disk_radius
#   (r_cone = 2*R/sqrt(N)), degradation_equivalent_cp (k_Deg/k_Cap), and vesicle_fraction_sum.
# - liu2008 models Helfrich membrane + WLC filament mechanics, Euler buckling, membrane-mediated
#   bundling, and a single-tube Brownian-ratchet length ODE (Eq. 12) with fixed filament count N
#   and empirical free-actin decay (zero Arp2/3, VCA, or CP kinetics): strictly complementary
#   halves of GUV actin deformation with disjoint state spaces.
# - gov2018 models Helfrich curvature-coupled single-CMC membrane dynamics (h, n, m) with
#   phenomenological active force A*(n - <n>) and no actin/Arp2/3/CP kinetics. Specifically,
#   durre2018/stokes_einstein_scaling (D = D_ref*(M_ref/M)^(1/3)) is intentionally NOT equated to
#   gov2018/cmc_diffusion_einstein (D = Lambda*k_B*T): Lambda*k_B*T is a 1-op (`too_plain`)
#   general Einstein identity lacking molecular weight M (requiring durre2018's M^(-1/3) law to be
#   injected tautologically into Lambda), and 2D membrane inclusions physically follow logarithmic
#   Saffman-Delbruck drag rather than 3D globular Stokes-Einstein scaling.
# - graham2023 models membraneless VASP droplet WLC ring bending/fluctuations, Bathe bundle
#   rigidity, discrete bead-spring ellipse minimization, wetting tension, and linear elongation
#   (zero Arp2/3, VCA, CP, lipid bilayer, or reaction-diffusion kinetics); algebraic similarities
#   such as 2*R/sqrt(N) vs (D/2)/sqrt(AR) or (M_ref/M)^(1/3) vs (a*b^2)^(1/3) are physically
#   unrelated and intentionally unlinked.
# - nastkolb2022 models FRAP exponential recovery, 2D ribbon filament packing (N_f = W/d),
#   empirical W ~ c_VASP scaling, and scalar concentration/intensity ratios (zero reaction-
#   diffusion or Stokes-Einstein diffusivity models).
