- id: mw_actin_added
  quantity: molecular_mass
  unit: kDa
  printed: "42"
  basis: Standard molecular weight of rabbit skeletal muscle monomeric G-actin (~42.0 kDa); SI p. 12 invokes Einstein-Stokes globular scaling from D_G = 30 um^2/s without printing molecular weights.
  alternatives: ["43"]
  stands_for: molecular mass of G-actin (M_G) in Einstein-Stokes scaling on SI p. 12

- id: mw_cp_added
  quantity: molecular_mass
  unit: kDa
  printed: "64"
  basis: Standard molecular weight of mouse heterodimeric capping protein alpha1/beta2 (~33 + 31 kDa = 64 kDa; Supp Fig. 12 blot shows both subunits near 35 kDa marker).
  alternatives: ["60", "68"]
  stands_for: molecular mass of CP heterodimer (M_CP) in Einstein-Stokes scaling on SI p. 12

- id: mw_arp23_added
  quantity: molecular_mass
  unit: kDa
  printed: "224"
  basis: Standard molecular weight of the 7-subunit mammalian (pig brain) Arp2/3 complex (~224 kDa).
  alternatives: ["220", "240"]
  stands_for: molecular mass of Arp2/3 complex (M_Arp) in Einstein-Stokes scaling on SI p. 12

- id: mw_vca_added
  quantity: molecular_mass
  unit: kDa
  printed: "12"
  basis: Approximate molecular weight of His-tagged C-terminal VCA domain of murine N-WASP (~10-12 kDa; 12 kDa gives D_V* = 0.963 um^2/s from D_V = 1.59 um^2/s).
  alternatives: ["10", "15"]
  stands_for: molecular mass of His-VCA (M_V) in Einstein-Stokes scaling on SI p. 12

- id: mw_vcag_added
  quantity: molecular_mass
  unit: kDa
  printed: "54"
  basis: Sum of His-VCA (~12 kDa) and G-actin (~42 kDa) in the 1:1 VCAG complex (V*).
  alternatives: ["52", "57"]
  stands_for: molecular mass of VCAG complex (M_V*) in Einstein-Stokes scaling on SI p. 12

- id: mw_arpstar_added
  quantity: molecular_mass
  unit: kDa
  printed: "278"
  basis: Sum of VCAG (~54 kDa) and Arp2/3 complex (~224 kDa) in the activated Arp* complex (A*).
  alternatives: ["272", "294"]
  stands_for: molecular mass of activated Arp* complex (M_A*) in Einstein-Stokes scaling on SI p. 12
