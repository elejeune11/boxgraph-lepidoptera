notes: >
  Read stage of Dürre et al., Nature Communications 9, 1630 (2018; merged 11-page main
  article + 14-page Supplementary Information, PDF pp. 1-25). All 25 text pages
  (text/page-001.txt through text/page-025.txt) and page images of all equations, plots,
  and figures (including pages/page-003.png through page-008.png and page-012.png through
  page-025.png) were inspected because the PDF text extractor omitted every displayed
  equation in Supplementary Notes 1-2 (Eqs. 1-5 on PDF p. 21 and Eqs. 6-16 on PDF p. 23)
  as well as superscript/subscript formatting and axis labels.

  Scope included:
  (1) Complete kinetic reaction-diffusion model (Supplementary Notes 1-2, Eqs. 1-16, PDF
  pp. 21-24): all kinetic rate constants, diffusion constants, initial conditions, geometry
  dimensions (infinite-pool cylinder r = 7 um, h = 9 um; finite-pool cones h = 18 um with
  disk radii 10, 6, 1.7 um), paused VCA state (k_re), and barbed-end degradation (k_Deg).
  Both the verbatim printed boundary conditions Eqs. (14)-(15) (which omit the reverse
  dissociation terms +k_2*V* and +k_4*A*) and corrected mass-conserving variants
  (axisymmetric 2D membrane and 1D-Cartesian COMSOL Boundary-PDE membrane variants) are
  implemented and compared in steady-state (1D infinite pool), time-dependent cylinder
  (Fig. 5c-e, Supp Fig 11), and time-dependent finite-pool cone (Fig. 5f, Supp Fig 14)
  geometries, with mesh refinement checks.
  (2) Derived parameter calculations stated in the SI: initial membrane VCA surface density
  V_0 = 1084 /um^2 from 0.3 uM VCA and R = 18 um; conical domain disk radius
  r_cone = 2*R/sqrt(N) for 16 and 35 domains; Einstein-Stokes globular protein scaling of
  diffusion coefficients (D_CP, D_Arp, D_V*, D_A); and barbed-end degradation rate
  equivalent CP concentration k_Deg / k_Cap.
  (3) Primary quantitative experimental observables stated in text/captions: encapsulation
  protein concentrations, vesicle radius range, pyrene lag phase at 20 nM CP, vesicle
  morphology percentages and counts at 0-180 nM CP (with/without 5 uM NMM II), domain
  diameters and curvatures, domain counts per vesicle, B16-F1 CP overexpression fold change
  (2.1-fold), lamellipodium thickness drop (1.7 to 0.7 um), and vesicle increase (~50%).

  Left out: routine biochemical/protocol and imaging numbers that feed no quantitative
  model — buffer ionic compositions and pH (G-buffer, SoniBuffer, storage/dialysis/
  polymerization/VCA buffers, pp. 9, 25), lipid solvent ratios and oil composition
  (0.5 mM lipids, 87.4% Egg-PC / 10% Ni-NTA / 2.5% PEG2000 PE / 0.06% Texas Red, 14%/80%/6%
  mineral/silicone/decane, 70%/30% decane/mineral oil, 1 M glucose, 10-20 mosmol osmotic
  offset, 40 um capillary, 1200 r.p.m., 5 min at 5 degC, 30 min pre-imaging wait, p. 9),
  fluorescent dye labelling fractions (10% Atto 488 actin, 20% pyrenyl actin, 25% Atto 647N
  VCA, 35% Atto 647N Arp2/3, 3-fold maleimide excess, pp. 4, 9), purification centrifugation
  and culture/transfection/immunostaining dilutions (pp. 9-10), TIRF oxygen-scavenger mix
  (0.4% glucose, 0.18 mg/ml glucose-oxidase, 0.06 mg/ml catalase, p. 25), microscope
  objective magnifications/NAs/laser wavelengths (p. 9), and scale-bar lengths.

