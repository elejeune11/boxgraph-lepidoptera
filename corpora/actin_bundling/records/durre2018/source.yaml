  Key quantitative findings and discrepancies:
  (1) Critical misprint in boundary conditions Eqs. (14)-(15) (SI p. 12, PDF p. 23): the
  printed cytosolic flux boundary conditions omit the reverse dissociation release terms
  +k_2*V* in Eq. (14) and +k_4*A* in Eq. (15) despite Eqs. (3) and (6)-(8) treating V+G <-> V*
  and V*+Arp <-> A* as reversible. As printed, Eqs. (14)-(15) violate mass conservation and
  act as a catastrophic one-way sink for G-actin (collapsing G|_0 from 3 to 0.15 uM even at
  B = 0), yielding complete extinction (B -> 0) in the finite-pool cone and 7-14x suppressed
  steady-state barbed-end densities (64.5, 12.6, 0 /um^2 vs ~470, ~175, ~98 /um^2) in the
  infinite-pool cylinder. Restoring +k_2*V* and +k_4*A* immediately reproduces all cylinder
  steady states (B_ss = 475.3, 176.8, 98.7 /um^2; A*_ss = 3.87, 11.43, 19.61 /um^2;
  branching/capping rate = 36.8, 40.4, 38.7 /um^2/s), the 40 nM non-monotonic dip-and-rise
  in Supp Fig 11, the double-peaked ring wave at 80 nM CP vs flat profiles at 40 and 120 nM
  CP in Fig. 5f (including persistence without VCA pausing), and ~4-fold center-to-edge VCA
  enrichment at t = 100-200 s.
  (2) Membrane Laplacian geometry finding: the true 2D axisymmetric membrane Laplacian
  (1/r d_r(r d_r u)) yields transient center peaks ~25-40% higher than Fig. 5c, 5e, 5f and
  Supp Fig 14 (e.g. cylinder B_peak = 525.9, 361.8, 262.6 /um^2; branching peak = 227.6,
  202.7, 178.1 /um^2/s), whereas coupling a 1D Cartesian membrane Laplacian (d_rr u, as
  produced by COMSOL's Coefficient Form Boundary PDE on a 2D axisymmetric boundary when
  the cylindrical metric factor r is omitted) to the 3D axisymmetric bulk tracks the
  transient peaks and colorbar maxima across Fig. 5c-f and Supp Fig 14 much more closely
  (cylinder B_peak = 417.1, 257.8, 181.9; branching peak = 144.8, 130.8, 116.4; cone
  B_peak = 351.3, 225.5, 145.2; cone V_tot_final_center = 1978, 1877, 1513). Both variants
  are provided beside the printed model.
  (3) Exact and near-exact derived parameter checks: V_0 = (1/3)*c_VCA*N_A*R = 1083.99 /um^2
  reproduces 1084 /um^2; equal-area/equal-volume cone radius 2*R/sqrt(N) reproduces 6 um
  (6.09 um for N = 35) and is close to 10 um (9.00 um for N = 16); Einstein-Stokes M^(-1/3)
  scaling reproduces D_CP = 26 and D_Arp = 17 um^2/s (and D_V* = 0.96 for 12 kDa VCA), but
  gives D_A ~ 0.56 rather than 0.84 um^2/s; k_Deg / k_Cap = 0.25 nM (4x smaller than
  "comparable to 1 nM CP").
  (4) Additional printed misprints/inconsistencies documented in questions.yaml: missing
  asterisk on D_V = 0.96 um^2/s (SI p. 12, colliding with D_V = 1.59 and omitting D_V*);
  y-axis unit typo "1/um^2 s" on Fig. 5d for A* (actually 1/um^2); reversed direction
  "from concave to convex in vivo" on p. 7; Fig. 6d ~2.3-fold median vesicle increase vs
  text's "about 50%" (p. 7); doxycycline dose "1 ug/ml" (pp. 8, 10) vs "1 uM" (Supp Fig 12);
  curvature sign flip between main text/axes (negative) and Fig. 4 caption/Supp Fig 9
  (positive); wrong reference/figure numbers (Ref. 33 on p. 5, Ref. 17 on p. 8, Fig. 5c for
  Fig. 5f on SI p. 13); and negative time axis labels in Supp Fig 14.
