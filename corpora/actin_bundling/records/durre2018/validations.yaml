# Cross-record validation audit for durre2018 (Dürre et al., Nat. Commun. 9, 1630, 2018)
# across all 4 ready corpus pairs:
#   1. liu2008       (18 measured datums: protrusion prevalence, tube lengths/speeds, linescans,
#                     bulk free-actin decay figs5, protrusion FRAP figs7)
#   2. gov2018       (0 measured datums: theoretical review article)
#   3. graham2023    (38 measured datums: VASP liquid-droplet FRAP, diameters, aspect ratios,
#                     bundle elongation speed, shell/ring/rod abundances, partition coefficients)
#   4. nastkolb2022  (66 measured datums: SLB/ML VASP bundle widths, pore sizes, filament counts,
#                     FRAP half-times & mobile fractions, VASP LLPS threshold & enrichment kinetics)
#
# Result: 0 genuine cross-record validations in durre2018/validations.yaml (122 partner measured
# datums audited).
#
# Audit basis (detailed in questions.yaml and notes.md):
# - durre2018's runnable models output membrane surface densities (B, A*, V_tot, V_0 in 1/um^2),
#   branching/capping rates (1/(um^2*s)), steady-state membrane boundary concentrations (G_mem_ss,
#   Arp_mem_ss, CP_mem_ss), finite-pool cone ring radius (r_peak_final) and center/edge ratios
#   (rim_to_center_ratio, vca_fold_enrichment), 3D globular Stokes-Einstein diffusivity (D in
#   um^2/s), spherical cone disk radius (r_cone = 2*R/sqrt(N)), equivalent CP concentration
#   (k_Deg/k_Cap), and vesicle fraction sum (f_domains + f_cortex).
# - None of these models predicts any partner's `origin: measured` observable under that
#   measurement's experimental conditions:
#   * liu2008 never measures membrane barbed-end surface density B, activated Arp2/3* density A*,
#     branching/capping rates, or VCA surface density (its N ~ 10 filaments/tube is a derived
#     force-balance estimate, and figs5_free_actin_data is time-dependent bulk monomer depletion
#     rather than steady-state boundary-layer concentration).
#   * gov2018 contains 0 measured datums.
#   * graham2023 is a membraneless, Arp2/3-free, VCA-free, CP-free VASP condensate system.
#   * nastkolb2022 is a planar SLB/ML, Arp2/3-free, VCA-free VASP bundling assay: it reports
#     FRAP half-times (min) rather than diffusivities (um^2/s), and its bundle-localized VASP
#     enrichment (fig5c_vasp, peaking at 1.95x via multi-site F-actin binding/LLPS) is a
#     biochemically distinct mechanism from durre2018's Arp2/3-branching VCA paused state (V+).
