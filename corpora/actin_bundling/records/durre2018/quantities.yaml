- id: actin_concentration
  name: G-actin monomer concentration
  dimension: "[substance]/[length]**3"
  description: Bulk or near-membrane molar concentration of monomeric G-actin (G).

- id: vca_concentration
  name: VCA bulk concentration
  dimension: "[substance]/[length]**3"
  description: Initial bulk molar concentration of His-tagged N-WASP VCA domain encapsulated in GUVs or used in bulk/TIRF assays.

- id: arp_concentration
  name: Arp2/3 complex concentration
  dimension: "[substance]/[length]**3"
  description: Bulk or near-membrane molar concentration of Arp2/3 complex.

- id: cp_concentration
  name: capping protein concentration
  dimension: "[substance]/[length]**3"
  description: Bulk or near-membrane molar concentration of heterodimeric capping protein (CP).

- id: profilin_concentration
  name: profilin concentration
  dimension: "[substance]/[length]**3"
  description: Bulk molar concentration of profilin (mPfn2a).

- id: myosin_concentration
  name: non-muscle myosin II concentration
  dimension: "[substance]/[length]**3"
  description: Bulk molar concentration of non-muscle myosin II (NMM II).

- id: ves_radius
  name: vesicle radius
  dimension: "[length]"
  description: Radius of giant unilamellar vesicles (GUVs), also used as cone height in finite-pool simulations.

- id: cone_disk_radius
  name: cone base disk radius
  dimension: "[length]"
  description: Radius of the circular membrane disk of the single-domain conical volume element in finite-pool simulations.

- id: cylinder_radius
  name: infinite-pool cylinder radius
  dimension: "[length]"
  description: Radius of the cylindrical simulation domain used for infinite-protein-pool kinetics.

- id: cylinder_height
  name: infinite-pool cylinder height
  dimension: "[length]"
  description: Height of the cylindrical simulation domain between the membrane (z = 0) and Dirichlet bulk boundary (z = h).

- id: seed_width
  name: initial barbed-end Gaussian seed width
  dimension: "[length]"
  description: Standard deviation sigma of the initial radial Gaussian barbed-end seed B_0(r, 0).

- id: protrusion_length
  name: membrane protrusion length
  dimension: "[length]"
  description: Length of convex actin-driven protrusions deforming GUV membranes.

- id: domain_diameter
  name: actin domain diameter
  dimension: "[length]"
  description: Lateral diameter (length) of membrane-bound concave actin domains on GUVs.

- id: domain_curvature
  name: actin domain curvature
  dimension: "1/[length]"
  description: Curvature of membrane-bound concave actin domains (negative in main text and Fig. 4b-c axes; printed unsigned/positive in Fig. 4 caption and Supp Fig. 9).

- id: lamellipodium_thickness
  name: lamellipodium thickness
  dimension: "[length]"
  description: Full-width-at-half-maximum phalloidin fluorescence thickness of B16-F1 cell lamellipodia.

- id: radial_position
  name: radial position on membrane
  dimension: "[length]"
  description: Radial coordinate r measured from the domain center along the membrane disk.

- id: vca_surface_density
  name: membrane VCA surface density
  dimension: "1/[length]**2"
  description: 2D number density of membrane-bound VCA molecules (initial V_0, individual states V, V*, V+, or total V + V* + A* + V+).

- id: activated_arp_density
  name: membrane activated Arp2/3* surface density
  dimension: "1/[length]**2"
  description: 2D number density of membrane-bound activated Arp2/3 complex A* (VCAG-Arp2/3).

- id: barbed_end_density
  name: actin barbed-end surface density
  dimension: "1/[length]**2"
  description: 2D number density of active actin filament barbed ends B at the membrane.

- id: branching_rate
  name: filament branching event rate per area
  dimension: "1/[length]**2/[time]"
  description: Local areal rate of Arp2/3-mediated filament branching events (k_Arp * A* * B).

- id: capping_rate
  name: filament capping event rate per area
  dimension: "1/[length]**2/[time]"
  description: Local areal rate of CP barbed-end capping events (k_Cap * CP|_0 * B).

- id: time
  name: elapsed time
  dimension: "[time]"
  description: Elapsed experimental or simulation time.

- id: polymerization_lag_time
  name: bulk polymerization lag phase
  dimension: "[time]"
  description: Lag phase duration prior to bulk actin polymerization initiation in pyrene fluorescence assays.

- id: elongation_on_rate
  name: barbed-end elongation association rate constant
  dimension: "[length]**3/[substance]/[time]"
  description: Second-order rate constant k_on for G-actin monomer addition to filament barbed ends.

- id: elongation_off_rate
  name: barbed-end depolymerization dissociation rate constant
  dimension: "1/[time]"
  description: First-order rate constant k_off for G-actin monomer dissociation from filament barbed ends.

- id: vca_actin_on_rate
  name: VCA-actin binding association rate constant
  dimension: "[length]**3/[substance]/[time]"
  description: Second-order rate constant k_1 for VCA + G -> VCAG.

- id: vca_actin_off_rate
  name: VCA-actin dissociation rate constant
  dimension: "1/[time]"
  description: First-order rate constant k_2 for VCAG -> VCA + G.

- id: arp_activation_on_rate
  name: VCAG-Arp2/3 association rate constant
  dimension: "[length]**3/[substance]/[time]"
  description: Second-order rate constant k_3 for VCAG + Arp2/3 -> Arp*.

- id: arp_activation_off_rate
  name: Arp*-VCAG dissociation rate constant
  dimension: "1/[time]"
  description: First-order rate constant k_4 for Arp* -> VCAG + Arp2/3.

- id: cp_binding_rate
  name: capping protein association rate constant
  dimension: "[length]**3/[substance]/[time]"
  description: Second-order rate constant k_Cap for CP binding to actin filament barbed ends.

- id: branching_rate_constant
  name: membrane branching interaction rate constant
  dimension: "[length]**2/[time]"
  description: Effective 2D surface second-order rate constant k_Arp for Arp* + B -> 2B + V+.

- id: vca_recovery_rate
  name: VCA paused-state recovery rate constant
  dimension: "1/[time]"
  description: First-order rate constant k_re for VCA returning from immobile paused state V+ to mobile ground state V.

- id: barbed_end_degradation_rate
  name: barbed-end degradation rate constant
  dimension: "1/[time]"
  description: First-order barbed-end loss/fall-behind rate constant k_Deg.

- id: diffusion_coefficient
  name: molecular translational diffusion coefficient
  dimension: "[length]**2/[time]"
  description: Translational diffusion coefficient of cytosolic (D_G, D_CP, D_Arp) or membrane-bound (D_V, D_V*, D_A) protein species.

- id: network_spreading_diffusivity
  name: barbed-end lateral spreading diffusivity
  dimension: "[length]**2/[time]"
  description: Effective 2D random-walk spreading diffusion constant D_B of actin filament barbed ends along the membrane.

- id: molecular_mass
  name: protein molecular mass
  dimension: "[mass]"
  description: Molecular weight of a protein or protein complex (for Einstein-Stokes globular scaling check).

- id: rate_scaling_factor
  name: kinetic rate reduction factor
  dimension: "dimensionless"
  description: Empirical dimensionless divisor applied to the literature value of k_3 (3.3).

- id: domain_count
  name: actin domains per vesicle
  dimension: "dimensionless"
  description: Number of spatially separated actin domains per GUV.

- id: vesicle_fraction
  name: vesicle population percentage
  dimension: "dimensionless"
  description: Fraction/percentage of GUVs displaying a specified actin organization or membrane remodelling event.

- id: vesicle_sample_count
  name: number of evaluated vesicles
  dimension: "dimensionless"
  description: Sample size N of GUVs evaluated in a histogram or classification experiment.

- id: cell_sample_count
  name: number of evaluated cells
  dimension: "dimensionless"
  description: Sample size N of B16-F1 melanoma cells evaluated per condition.

- id: density_ratio
  name: dimensionless surface-density ratio
  dimension: "dimensionless"
  description: Dimensionless spatial contrast ratio on the membrane (rim-to-center barbed-end density ratio or center-to-edge total VCA enrichment fold).

- id: expression_fold_change
  name: relative expression or vesicle count change
  dimension: "dimensionless"
  description: Fold change or relative percentage increase measured in B16-F1 CP overexpression experiments.

- id: doxycycline_mass_concentration
  name: doxycycline mass concentration
  dimension: "[mass]/[length]**3"
  description: Inducer doxycycline mass-per-volume concentration in B16-F1 cell experiments.

- id: doxycycline_molar_concentration
  name: doxycycline molar concentration
  dimension: "[substance]/[length]**3"
  description: Inducer doxycycline molar concentration as stated in Supp Fig. 12 caption.

- id: fluorescence_intensity
  name: fluorescence intensity (a.u.)
  dimension: "dimensionless"
  description: Normalized or raw arbitrary-unit fluorescence intensity in bulk pyrene polymerization assays (Fig. 1d, Supp Figs. 1, 8) or TIRF monolayer line scans (Supp Fig. 7).

- id: line_scan_position
  name: spatial position along TIRF domain line scan
  dimension: "[length]"
  description: Spatial coordinate (labelled 'domain size (um)') along a 1D TIRF intensity profile crossing an actin domain on a lipid monolayer (Supp Fig. 7).

- id: microspike_count
  name: microspikes per cell
  dimension: "dimensionless"
  description: Number of F-actin microspikes counted per B16-F1 melanoma cell (Fig. 6b).

- id: vesicles_per_cell_normalized
  name: area-normalized actin-containing vesicles per cell
  dimension: "dimensionless"
  description: Number of actin-containing vesicles per B16-F1 cell normalized to cell area (labelled 'N_Vesicles/cell' without explicit area units in Fig. 6d).

- id: experimental_condition_index
  name: experimental condition or morphology category index
  dimension: "dimensionless"
  description: "Ordinal category index for categorical boxplot x-axes (Fig. 6b-d: 1=CP Dox, 2=no CP Dox, 3=CP no Dox; Supp Fig. 6: 1=protrusion, 2=concave domain, 3=flat domain)."
