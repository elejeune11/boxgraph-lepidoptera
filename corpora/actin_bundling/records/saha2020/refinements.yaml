- id: ref_spinodal_topology_grid
  run: run_fig2_topology_alpha_033
  setting: n_grid
  factors: [1, 2, 4]
  mode: multiply
  output: n_components
  tolerance: "1%"
  tolerance_basis: "added: integer component count must remain invariant under grid refinement"
  tolerance_added: true

- id: ref_min_osc_shifted_dt
  run: run_min_osc_shifted_alpha_04
  setting: dt
  factors: [1, 2, 4, 8]
  mode: divide
  output: omega
  tolerance: "0.1%"
  tolerance_basis: "added: tight ODE time-step tolerance for limit-cycle angular frequency"
  tolerance_added: true

- id: ref_nrch_1d_pde_dt
  run: run_nrch_1d_alpha_040
  setting: dt
  factors: [1, 2, 4]
  mode: divide
  output: wave_speed
  tolerance: "5%"
  tolerance_basis: "added: convergence check for 1D pseudospectral traveling-band speed under step-size halving"
  tolerance_added: true

- id: ref_nrch_2d_pde_bulk_dt
  run: run_nrch_2d_bulk_alpha_015
  setting: dt
  factors: [1, 2, 4]
  mode: divide
  output: R_final
  tolerance: "5%"
  tolerance_basis: "added: convergence check for 2D ETD1 domain length scale R(t) under step-size halving (stochastic model refinement)"
  tolerance_added: true

- id: ref_fig6_topology_grid
  run: run_fig6_topology_alpha_040
  setting: n_grid
  factors: [1, 2, 4]
  mode: multiply
  output: n_components
  tolerance: "1%"
  tolerance_basis: "added: five-region spinodal component count in Fig. 6(c) must remain invariant under grid refinement"
  tolerance_added: true

- id: ref_nrch_2d_flux_bulk_dt
  run: run_nrch_2d_flux_curve_015
  setting: dt
  factors: [1, 2]
  mode: divide
  output: J_final
  tolerance: "0.005"
  tolerance_basis: "added: absolute flux tolerance well below the 0.01 scale of Fig. 3(c) confirming J_final -> 0 at alpha = 0.15"
  tolerance_added: true
