- id: species_count
  name: Number of scalar active species
  dimension: dimensionless
  description: Total number of distinct conserved scalar species N in the multicomponent mixture.

- id: independent_coupling_count
  name: Number of independent interspecies interaction coefficients
  dimension: dimensionless
  description: Count of independent parameters in the antisymmetric activity matrix alpha_ij, symmetric equilibrium matrix chi_ij, or combined interaction matrix chi_ij + alpha_ij.

- id: concentration
  name: Species concentration
  dimension: dimensionless
  description: Local or spatially averaged concentration order-parameter field phi_i or phi_bar_i of species i.

- id: preferred_phase_concentration
  name: Equilibrium preferred bulk concentration
  dimension: dimensionless
  description: Equilibrium double-well minimum c_{i,1}, c_{i,2}, or symmetric half-width c_1, c_2, c in the single-species Ginzburg-Landau potential (phi_i - c_{i,1})^2 (phi_i - c_{i,2})^2.

- id: oscillator_coordinate
  name: Minimal oscillator state variable
  dimension: dimensionless
  description: Zero-dimensional nonconserved dynamical variable x_i in the minimal two-degree-of-freedom oscillator xdot_i = -mu_i^neq(x_1, x_2).

- id: reciprocal_coupling
  name: Reciprocal bilinear coupling parameter
  dimension: dimensionless
  description: Symmetric equilibrium interspecies coupling coefficient chi (or chi_ij) multiplying phi_i phi_j in the free energy.

- id: quartic_coupling
  name: Reciprocal quartic coupling parameter
  dimension: dimensionless
  description: Symmetric equilibrium quartic interspecies coupling coefficient chi' (or chi'_ij) multiplying phi_i^2 phi_j^2 in the free energy.

- id: nonreciprocal_activity
  name: Nonreciprocal activity coefficient
  dimension: dimensionless
  description: Antisymmetric nonreciprocal coupling parameter alpha (alpha_12 = -alpha_21 = alpha), or a critical/threshold value thereof (exceptional point alpha_*, spinodal splitting threshold, or traveling-band onset).

- id: effective_coupling
  name: Combined interspecies coupling matrix element
  dimension: dimensionless
  description: Off-diagonal element C_ij = chi_ij + alpha_ij of the general N-component nonreciprocal interaction matrix.

- id: gradient_stiffness
  name: Interfacial gradient stiffness
  dimension: dimensionless
  description: Surface-tension / gradient-energy stiffness parameter kappa (or kappa_i) multiplying (1/2) |grad phi_i|^2 in the free energy.

- id: chemical_potential
  name: Chemical potential
  dimension: dimensionless
  description: Bulk equilibrium chemical potential mu_i^eq or effective nonequilibrium chemical potential mu_i^neq.

- id: wavenumber
  name: Spatial Fourier wavenumber
  dimension: dimensionless
  description: Magnitude q of the Fourier wavevector q in linear stability analysis or structure factor S(q, t).

- id: growth_rate
  name: Linear stability growth rate
  dimension: dimensionless
  description: Dynamical matrix entry D_ij, eigenvalue real part Re(lambda), or trace D_11 + D_22 governing linear perturbation growth.

- id: oscillation_frequency
  name: Oscillation angular frequency
  dimension: dimensionless
  description: Imaginary part |Im(lambda)| of a linear stability eigenvalue or fundamental angular frequency omega of a nonlinear limit cycle.

- id: stability_discriminant
  name: Linear stability discriminant
  dimension: dimensionless
  description: Discriminant [(D_11 - D_22)^2 + 4 D_12 D_21] / q^4 whose negativity defines the complex-eigenvalue region C_i.

- id: eigenvector_collinearity
  name: Eigenvector collinearity metric
  dimension: dimensionless
  description: Sine of the angle between the two eigenvectors eta_1 and eta_2 of the linearized dynamical matrix D, vanishing at an exceptional point.

- id: composition_radius
  name: Oscillatory Hopf circle radius
  dimension: dimensionless
  description: Radius R_c = sqrt((c_1^2 + c_2^2)/3) of the circular Hopf stability boundary C_r in the shifted composition plane (phi_bar_1, phi_bar_2).

- id: composition_hyperbola_offset
  name: Composition hyperbola offset
  dimension: dimensionless
  description: Value of the hyperbolic invariant phi_bar_1^2 - phi_bar_2^2 defining the complex-eigenvalue boundary C_i in the shifted composition plane (Eq. 19).

- id: spinodal_component_count
  name: Disconnected spinodal component count
  dimension: dimensionless
  description: Number of disconnected unstable regions enclosed by the spinodal C_r in the composition plane (phi_bar_1, phi_bar_2).

- id: oscillatory_overlap_indicator
  name: Spinodal-oscillatory overlap fraction
  dimension: dimensionless
  description: Fraction of the unstable spinodal region C_r that lies inside the complex-eigenvalue region C_i (0 when C_r and C_i do not overlap).

- id: domain_length
  name: Domain length scale or pattern wavelength
  dimension: dimensionless
  description: Characteristic coarsening length scale R(t) defined from the orientation-averaged structure factor (Eq. 13), or steady-state lamellar wavelength.

- id: coarsening_exponent
  name: Domain coarsening scaling exponent
  dimension: dimensionless
  description: Power-law exponent beta in the domain growth law R(t) ~ t^beta.

- id: polar_order_flux
  name: Global polar-order parameter flux
  dimension: dimensionless
  description: Spatial average polar-order flux J = <phi_1 grad phi_2 - phi_2 grad phi_1> (Eq. 14), its component |J_x|, |J_y|, or magnitude |J|.

- id: wave_speed
  name: Traveling-band propagation speed
  dimension: dimensionless
  description: Steady-state propagation speed |v| of self-propelled density bands.

- id: complex_field_rate
  name: Complex field time-derivative component
  dimension: dimensionless
  description: Real or imaginary part of partial_t A in the complex-field NRCH equation (Eq. 9) or complex Ginzburg-Landau equation (Eqs. 10-11).

- id: cgl_parameter
  name: Complex Ginzburg-Landau coefficient
  dimension: dimensionless
  description: Dimensionless coefficient (a_1, a_2, a_3, or b) in the complex Ginzburg-Landau equation (Eqs. 10-11).

- id: grid_spacing
  name: Spatial discretization bin size
  dimension: dimensionless
  description: Uniform spatial grid spacing h used in pseudospectral simulations (Appendix A).

- id: system_grid_points
  name: Spatial grid points per side
  dimension: dimensionless
  description: Number of lattice points along each spatial axis of the square simulation domain (201, 401, or 801).

- id: domain_size
  name: Simulation domain length
  dimension: dimensionless
  description: Side length L of the periodic simulation domain (e.g., L = 2 for coordinates in [-1, 1] with 201 points at h = 0.01).

- id: time_step
  name: Numerical integration time step
  dimension: dimensionless
  description: Forward time step Delta t used in the pseudospectral time-stepping scheme.

- id: time
  name: Dimensionless time
  dimension: dimensionless
  description: Evolution time t in ODE or PDE dynamics.

- id: ensemble_size
  name: Random-initial-condition ensemble size
  dimension: dimensionless
  description: Number of randomly generated initial conditions averaged to compute the polar-order flux J(t).

- id: spatial_coordinate
  name: Spatial cross-section coordinate
  dimension: dimensionless
  description: One-dimensional spatial coordinate r along a cross-section line scan of the periodic simulation domain (Fig. 1d, g, l).

