    alpha = delta, q = 1), enabling direct Synthesis cross-checks of you2020's traveling-wave speed
    predictions (run_traveling_fp_dk2, dk3) via saha2020 Eq. (16).
  assumptions:
    - "Subcritical-B traveling-wave regime (delta > delta_c, alpha_A + alpha_B < 0) on L = 2*pi (q = 1)"

