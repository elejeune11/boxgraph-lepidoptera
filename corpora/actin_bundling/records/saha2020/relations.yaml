# their symbols. All exact algebraic, asymptotic, and PDE mappings below are
# therefore entered in the later-published paper (saha2020/relations.yaml) with
# provenance: proposed, while explicitly referencing both mutual citations.
#
# Canonical exact PDE dictionary (at chi' = 0, equal rigidities gamma_A = gamma_B = kappa_S,
# species relabeling 1 <-> B, 2 <-> A so kappa_Y = chi and delta = +alpha):
#   (1) Unrescaled time/space (t_Y = t_S, x_Y = x_S, v_Y = v_S):
#       phi_A = 2*sqrt(3)*(phi_2 - phi_{2,mid}), phi_B = 2*sqrt(3)*(phi_1 - phi_{1,mid}),
#       chi_A = -4*c_2^2, chi_B = -4*c_1^2, gamma_A = gamma_B = kappa_S, kappa_Y = chi, delta = alpha.
#   (2) Concentration-preserving time rescaling (t_Y = 12*t_S, phi_A = phi_2 - phi_{2,mid}):
#       chi_A = -c_2^2 / 3, chi_B = -c_1^2 / 3, phi_g = sqrt(-3*chi_mu) = c_i identically.
#   (3) Unit-speed space-time rescaling (x_Y = tau*x_S, t_Y = tau*t_S, v_Y = v_S):
#       L_Y = tau*L_S, phi_A = sqrt(12*tau)*phi_tilde_2, chi_A = -4*tau*c_2^2,
