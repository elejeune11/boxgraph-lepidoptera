    setting alpha_A = -4*q^2*c_1^2, alpha_B = -4*q^2*c_2^2, kappa = q^2*chi, and delta = q^2*alpha
    identically reproduces Re(lambda_max) across both real (alpha < alpha_*) and oscillatory
    (alpha > alpha_*) regimes, enabling direct Synthesis cross-checks on saha2020's Fig. 1 center
    runs (run_sym_stab_fig1_center and run_sym_stab_at_exceptional_point).
  assumptions:
