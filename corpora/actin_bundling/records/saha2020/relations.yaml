    psi: "c12 - c11"
    phi_B: "phi1 - c11"
  regime:
    phi1: [0.55, 0.9]
    phi2: [0.1, 0.5]
    c11: [0.05, 0.2]
    c12: [0.3, 0.5]
    c21: [0.05, 0.2]
    c22: [0.3, 0.5]
    chi: [0.0, 0.0]
    chip: [0.0, 0.0]
    alpha: [0.0, 0.0]
  provenance: proposed
  reason: >
    In the decoupled passive limit (chi = chi' = alpha = 0), shifting phi_B = phi_1 - c_{1,1}
    with coexistence jump psi = c_{1,2} - c_{1,1} transforms saha2020's bulk free energy
    (phi_1 - c_{1,1})^2*(phi_1 - c_{1,2})^2 identically into zwicker2015's binary double-well
    free energy (b/2)*(phi^B)^2*(psi - phi^B)^2 (Sec. III, p. 4) at b = 2, so their bulk
    chemical potentials mu_1^eq (dimensionless) and mu^B (J/m^3) agree identically up to the
    constant energy-density scale.
  assumptions:
    - "Decoupled passive limit chi = chi' = alpha = 0"
    - "Shifted concentration phi_B = phi_1 - c_{1,1} with psi = c_{1,2} - c_{1,1} > 0"

