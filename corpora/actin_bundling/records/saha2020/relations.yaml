    c12: "sqrt(-(a1 * rho_A0 + ((v_0 * (1 - a0_AA * rho_A0 - a0_AP * rho_P0)) / (2 * D_R)) * ((v_0 * (1 - a0_AA * rho_A0 - a0_AP * rho_P0)) - a0_AA * v_0 * rho_A0))) / 2"
