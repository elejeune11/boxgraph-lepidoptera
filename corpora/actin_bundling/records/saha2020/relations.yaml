  reason: >
    Unnormalized exceptional-point equivalence between you2020/one_mode_traveling_fp
    (delta_c = sqrt(kappa^2 + alpha_B^2), Eq. 6) and saha2020 Eq. (16)
    (alpha_* = sqrt(chi^2 + 4*(c_1^2 - c_2^2)^2)) at 2*c_1^2 = alpha_B, c_2 = 0, chi = kappa:
    directly cross-checks you2020's traveling-wave threshold runs (run_traveling_fp_dk1p5, dk2, dk3)
    using saha2020/symmetric_stability_eq15_eq18.
  assumptions:
    - "Subcritical-B supercritical-A traveling-wave regime (alpha_A < -alpha_B < 0, kappa > 0)"
    - "Effective well-width encoding 2*c_1^2 = alpha_B, c_2 = 0 matching the Hopf-line gap |alpha_A - alpha_B|/2 = alpha_B"

- id: rel_you2020_traveling_v_same_as_eq16_im
  kind: same_as
  a: you2020/one_mode_traveling_fp
  b: saha2020/symmetric_stability_eq15_eq18
