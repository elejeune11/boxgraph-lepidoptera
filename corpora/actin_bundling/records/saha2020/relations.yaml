  reason: >
    In the q -> 0 real-eigenvalue (Cahn-Hilliard) regime, frohoff2021's Eq. (B1) growth rate
    satisfies lambda_+(q)/q^2 = a_CH - a independently of kappa. Setting species 1 at its
    critical point a = 0 (c_{1,1} = c_{1,2} = 0) and species 2 to well half-width
    c_2 = sqrt(-a_Delta)/2 (for a_Delta < 0) with chi' = 0, chi = rho, phi_bar_i^S = phi_bar_i^F/2,
    and q = 1 makes saha2020 Eq. (8)'s re_lambda_max identical to frohoff2021's Cahn-Hilliard
    onset temperature a_CH (Eq. B6), enabling direct cross-checks of frohoff2021's printed a_CH
    benchmarks (Fig. 4d, Fig. 5a) via saha2020/linear_stability_eq8.
  assumptions:
    - "Species 1 at critical temperature a = 0 and species 2 double-well a_Delta < 0"
    - "Real-eigenvalue stationary regime (discriminant >= 0) and linear coupling (chi' = 0)"

