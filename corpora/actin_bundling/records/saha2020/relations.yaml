    phi1_bar: [0.1, 0.5]
    phi2_bar: [0.1, 0.5]
    c11: [0.05, 0.2]
    c12: [0.3, 0.5]
    c21: [0.05, 0.2]
    c22: [0.3, 0.5]
    chi: [0.1, 0.5]
    chip: [0.05, 0.3]
    alpha: [0.1, 1.0]
    q: [0.5, 2.0]
  provenance: proposed
  reason: >
    Setting saha2020's quartic reciprocal coupling chi' = 0 symbolically derives
    frohoff2021's specific double-well dispersion discriminant Eq. (B1) at kappa = 1 (Q = 1)
    under the shifted and rescaled field dictionary psi_bar_i = 2*(phi_bar_i - phi_{i,mid}),
    a = -(c_{1,2} - c_{1,1})^2, a_Delta = (c_{1,2} - c_{1,1})^2 - (c_{2,2} - c_{2,1})^2,
    rho = chi, and alpha_F = alpha.
  assumptions:
    - "Linear reciprocal coupling only (chi' = 0)"
    - "Equal mobilities Q = 1 and equal rigidities kappa = 1 (frohoff2021 p. 20)"

- id: rel_frohoff2021_hopf_freq_reduces_to_eq8_im
  kind: reduces_to
  a: frohoff2021/hopf_threshold_general_eq14_15
  b: saha2020/linear_stability_eq8
  output_map: {im_lambda_abs: omega_tilde_c}
  limit: {Q: "1"}
  mapping:
    phi1_bar: "0"
    phi2_bar: "sqrt(f2_pp / 12)"
    c11: "-sqrt(f2_pp) / 2"
    c12: "sqrt(f2_pp) / 2"
    c21: "0"
    c22: "0"
    chi: "rho"
    chip: "0"
    alpha: "alpha"
    q: "1"
  regime:
    f2_pp: [0.1, 0.6]
    Q: [1.01, 2.0]
    rho: [0.1, 0.4]
    alpha: [1.0, 2.0]
  provenance: proposed
  reason: >
    In the equal-mobility limit Q -> 1, frohoff2021's rescaled critical Hopf frequency
    omega_tilde_c = sqrt(Q)*sqrt(-Q*(f_2'')^2 + alpha^2 - rho^2) (Eq. 15) reduces identically
    to the imaginary eigenvalue magnitude Im(lambda)/q^2 of saha2020 Eq. (8) evaluated on the
    Hopf boundary C_r (f_1'' + f_2'' = 0, Eq. 20) with f_1'' = -f_2'' < 0, chi' = 0, and q = 1.
  assumptions:
    - "Equal mobility limit Q -> 1 (frohoff2021 p. 20)"
    - "Evaluation on the Hopf threshold f_1'' = -f_2'' with Delta = alpha^2 - rho^2 > (f_2'')^2"

- id: rel_frohoff2021_onsets_aCH_same_as_eq8_re
  kind: same_as
  a: frohoff2021/instability_onsets_eqB4_B6_B7
  b: saha2020/linear_stability_eq8
  output_map: {re_lambda_max: a_CH}
