# ==============================================================================
# Cross-Record ModelAtlas Relations: saha2020 <-> frohoff2021
# ==============================================================================
# Note on provenance: frohoff2021 (2021) cites saha2020 (2020, ref-43) on pp. 2, 3,
# 20, and 21, explicitly stating that saha2020 is the equal-rigidity, equal-mobility
# specialization (Q = 1, kappa = 1) of frohoff2021's coupled nonvariational Cahn-Hilliard
# model (with nonlinear quartic reciprocal coupling chi' in saha2020). Because saha2020
# predates frohoff2021 and cannot cite it, relations stored in saha2020/relations.yaml
# use provenance: proposed while documenting frohoff2021's explicit pp. 3, 20-21 basis.

- id: rel_frohoff2021_bulk_mu1_scales_eq6_corrected
  kind: scales_as
  a: saha2020/binary_chemical_potential_eq6_eq7_corrected
  b: frohoff2021/bulk_free_energy_eq3_A1
  output_map: {mu: mu1_eq}
  mapping:
    a1: "-(c12 - c11)**2"
    b1: "4"
    phi: "phi1 - (c11 + c12) / 2"
  regime:
    phi1: [0.55, 0.9]
    phi2: [0.1, 0.5]
    c11: [0.1, 0.2]
    c12: [0.4, 0.5]
    c21: [0.1, 0.2]
    c22: [0.4, 0.5]
    chi: [0.0, 0.0]
    chip: [0.0, 0.0]
    alpha: [0.0, 0.0]
  provenance: proposed
  reason: >
    In the decoupled passive limit (chi = chi' = alpha = 0), shifting species 1 to its
    midpoint phi = phi_1 - (c_{1,1} + c_{1,2})/2 maps saha2020's double-well chemical
    potential mu_1^eq = 2*(phi_1 - c_{1,1})*(phi_1 - c_{1,2})*(2*phi_1 - c_{1,1} - c_{1,2})
    identically to frohoff2021's bulk chemical potential mu = a_1*phi + b_1*phi^3 (Eq. 3/A1)
    with a_1 = -(c_{1,2} - c_{1,1})^2 and b_1 = 4 (up to frohoff2021's dimensional energy
    density unit J/m^3 vs saha2020's dimensionless chemical potential, tested via scales_as).
  assumptions:
    - "Decoupled passive limit chi = chi' = alpha = 0"
    - "Centered order parameter phi = phi_1 - (c_{1,1} + c_{1,2})/2 with unit energy scale conversion"

- id: rel_frohoff2021_bulk_mu2_scales_eq6_corrected
  kind: scales_as
  a: saha2020/binary_chemical_potential_eq6_eq7_corrected
  b: frohoff2021/bulk_free_energy_eq3_A1
  output_map: {mu: mu2_eq}
  mapping:
    a1: "-(c22 - c21)**2"
    b1: "4"
    phi: "phi2 - (c21 + c22) / 2"
  regime:
    phi1: [0.1, 0.5]
    phi2: [0.55, 0.9]
    c11: [0.1, 0.2]
    c12: [0.4, 0.5]
    c21: [0.1, 0.2]
    c22: [0.4, 0.5]
    chi: [0.0, 0.0]
    chip: [0.0, 0.0]
    alpha: [0.0, 0.0]
  provenance: proposed
  reason: >
    In the decoupled passive limit (chi = chi' = alpha = 0), shifting species 2 to its
    midpoint phi = phi_2 - (c_{2,1} + c_{2,2})/2 maps saha2020's corrected Eq. (6)
    mu_2^eq identically to frohoff2021's Eq. (3)/(A1) cubic chemical potential with
    a_1 = -(c_{2,2} - c_{2,1})^2 and b_1 = 4 (up to energy-density units).
  assumptions:
    - "Decoupled passive limit chi = chi' = alpha = 0"
    - "Corrected Eq. (6) using phi_2 in mu_2^eq rather than the printed phi_1 misprint"

- id: rel_frohoff2021_bulk_mu2_vs_eq6_printed
  kind: scales_as
  a: saha2020/binary_chemical_potential_eq6_eq7
  b: frohoff2021/bulk_free_energy_eq3_A1
  output_map: {mu: mu2_eq}
  mapping:
    a1: "-(c22 - c21)**2"
    b1: "4"
    phi: "phi2 - (c21 + c22) / 2"
  regime:
    phi1: [0.1, 0.5]
    phi2: [0.55, 0.9]
    c11: [0.1, 0.2]
    c12: [0.4, 0.5]
    c21: [0.1, 0.2]
    c22: [0.4, 0.5]
    chi: [0.0, 0.0]
    chip: [0.0, 0.0]
    alpha: [0.0, 0.0]
  provenance: proposed
  reason: >
    Diagnostic test of saha2020's printed verbatim Eq. (6) (p. 5) against frohoff2021's
    double-well bulk chemical potential Eq. (3)/(A1) under the identical decoupled passive
    mapping: printed mu_2^eq erroneously evaluates its cubic polynomial at phi_1 instead of
    phi_2 (saha2020/q_eq6_phi1_misprint), giving zero log-slope in phi_2 and failing scales_as.
  assumptions:
    - "Diagnostic comparison testing printed Eq. (6) verbatim (saha2020/q_eq6_phi1_misprint)"

- id: rel_frohoff2021_eq8_D11_scales_as_bulk_curv
  kind: scales_as
  a: saha2020/linear_stability_eq8
  b: frohoff2021/bulk_energy_curvature_eq3_4
  output_map: {f1_pp: D11}
  mapping:
    a: "-(c12 - c11)**2"
    a_Delta: "(c12 - c11)**2 - (c22 - c21)**2"
    phi1_bar: "2 * phi1_bar - c11 - c12"
    phi2_bar: "2 * phi2_bar - c21 - c22"
  regime:
    phi1_bar: [0.6, 0.9]
    phi2_bar: [0.1, 0.5]
    c11: [0.05, 0.2]
    c12: [0.3, 0.5]
    c21: [0.05, 0.2]
    c22: [0.3, 0.5]
    chi: [0.1, 0.5]
    chip: [0.0, 0.0]
    alpha: [0.1, 1.0]
    q: [0.5, 2.0]
  provenance: proposed
  reason: >
    At chi' = 0, the diagonal entry D_11 = -q^2 * f_1''(phi_bar_1) of saha2020 Eq. (8)
    equals -q^2 times frohoff2021's bulk free-energy curvature f_1'' = a + 3*psi_bar_1^2
    (Eqs. 3-4) under the exact unrescaled-time field map psi_bar_i = 2*(phi_bar_i - phi_{i,mid}),
    a = -(c_{1,2} - c_{1,1})^2, and a_Delta = (c_{1,2} - c_{1,1})^2 - (c_{2,2} - c_{2,1})^2.
  assumptions:
    - "Linear reciprocal coupling only (chi' = 0)"
    - "Outer spinodal branch f_1'' > 0 so log-slopes remain finite"

- id: rel_frohoff2021_shift_c2_same_as_decoupled_binodal
  kind: same_as
  a: saha2020/symmetric_shift_reduction
  b: frohoff2021/decoupled_binodals_appC
  output_map: {phi2_bin: c2}
  mapping:
    a: "-(c12 - c11)**2 / 4"
    a_Delta: "((c12 - c11)**2 - (c22 - c21)**2) / 4"
  regime:
    c11: [0.05, 0.2]
    c12: [0.3, 0.6]
    c21: [0.05, 0.2]
    c22: [0.3, 0.6]
  provenance: proposed
  reason: >
    Under the canonical time-rescaled (t_tilde = 4*t, unrescaled fields) mapping
    a = -c_1^2 = -(c_{1,2} - c_{1,1})^2/4 and a + a_Delta = -c_2^2 = -(c_{2,2} - c_{2,1})^2/4,
    saha2020's symmetric well half-width c_2 = |c_{2,2} - c_{2,1}|/2 is algebraically
    identical to frohoff2021's decoupled binodal plateau phi_{2,bin} = sqrt(-a - a_Delta)
    (Appendix C).
  assumptions:
    - "Time-rescaled dictionary t_tilde = 4*t preserving concentration scale (phi_tilde_i = phi_i - phi_{i,mid})"
    - "Decoupled double-well regime (a < 0, a + a_Delta < 0)"

- id: rel_frohoff2021_eq8_disc_same_as_eq12
  kind: same_as
  a: saha2020/linear_stability_eq8
  b: frohoff2021/linear_dispersion_general_eq12
  output_map: {discriminant: disc_over_q4}
  mapping:
    q: "q"
    f1_pp: "2*(phi1_bar - c11)**2 + 8*(phi1_bar - c11)*(phi1_bar - c12) + 2*(phi1_bar - c12)**2 + 2*phi2_bar**2*chip"
    f2_pp: "2*(phi2_bar - c21)**2 + 8*(phi2_bar - c21)*(phi2_bar - c22) + 2*(phi2_bar - c22)**2 + 2*phi1_bar**2*chip"
    Q: "1"
    kappa: "1"
    rho: "chi + 4*phi1_bar*phi2_bar*chip"
    alpha: "alpha"
  regime:
    phi1_bar: [0.1, 0.5]
    phi2_bar: [0.1, 0.5]
    c11: [0.05, 0.2]
    c12: [0.3, 0.5]
    c21: [0.05, 0.2]
    c22: [0.3, 0.5]
    chi: [0.1, 0.5]
    chip: [0.05, 0.4]
    alpha: [0.1, 1.0]
    q: [0.5, 2.0]
  provenance: proposed
  reason: >
    Exact symbolic identity establishing frohoff2021's p. 20-21 statements about saha2020
    (ref-43): at equal mobilities (Q = 1) and equal interfacial rigidities (kappa = 1),
    the q^2 gradient contributions cancel identically from the discriminant of frohoff2021
    Eq. (12), and saha2020's nonlinear quartic reciprocal coupling chi'*phi_1^2*phi_2^2
    enters linearization solely through the renormalized local curvatures
    f_{i,eff}'' = f_i'' + 2*chi'*phi_bar_j^2 and effective reciprocal coupling
    rho_eff = chi + 4*chi'*phi_bar_1*phi_bar_2, yielding an identical stability discriminant
    (disc_over_q4 = discriminant) for arbitrary chi' and finite q.
  assumptions:
    - "Equal mobilities Q = 1 and equal rigidities kappa = 1 (frohoff2021 p. 20)"
    - "Local curvature and coupling renormalization by chi'*phi_1^2*phi_2^2 (frohoff2021 p. 21)"

- id: rel_frohoff2021_eq8_im_same_as_eq12
  kind: same_as
  a: saha2020/linear_stability_eq8
  b: frohoff2021/linear_dispersion_general_eq12
  output_map: {im_lam_plus: im_lambda_abs}
  mapping:
    q: "q"
    f1_pp: "2*(phi1_bar - c11)**2 + 8*(phi1_bar - c11)*(phi1_bar - c12) + 2*(phi1_bar - c12)**2 + 2*phi2_bar**2*chip"
    f2_pp: "2*(phi2_bar - c21)**2 + 8*(phi2_bar - c21)*(phi2_bar - c22) + 2*(phi2_bar - c22)**2 + 2*phi1_bar**2*chip"
    Q: "1"
    kappa: "1"
    rho: "chi + 4*phi1_bar*phi2_bar*chip"
    alpha: "alpha"
  regime:
    phi1_bar: [0.2, 0.4]
    phi2_bar: [0.2, 0.4]
    c11: [0.05, 0.2]
    c12: [0.3, 0.5]
    c21: [0.05, 0.2]
    c22: [0.3, 0.5]
    chi: [0.1, 0.4]
    chip: [0.05, 0.3]
    alpha: [0.6, 1.5]
    q: [0.5, 2.0]
  provenance: proposed
  reason: >
    Because Q = 1 and kappa = 1 make the interfacial gradient stabilization -kappa*q^4
    purely diagonal and equal for both species, it drops out of the discriminant and
    imaginary eigenvalue component completely: saha2020 Eq. (8) im_lambda_abs agrees
    identically with frohoff2021 Eq. (12) im_lam_plus at all finite q and arbitrary chi'
    under the renormalized curvature and reciprocal-coupling dictionary.
  assumptions:
    - "Equal mobilities Q = 1 and equal rigidities kappa = 1 (frohoff2021 p. 20)"
    - "Oscillatory regime (discriminant < 0) where Im(lambda) > 0"

- id: rel_frohoff2021_eq8_re_reduces_to_eq12_longwave
  kind: reduces_to
  a: saha2020/linear_stability_eq8
  b: frohoff2021/linear_dispersion_general_eq12
  output_map: {re_lam_plus: re_lambda_max}
  limit: {q: "0"}
  mapping:
    q: "q"
    f1_pp: "2*(phi1_bar - c11)**2 + 8*(phi1_bar - c11)*(phi1_bar - c12) + 2*(phi1_bar - c12)**2 + 2*phi2_bar**2*chip"
    f2_pp: "2*(phi2_bar - c21)**2 + 8*(phi2_bar - c21)*(phi2_bar - c22) + 2*(phi2_bar - c22)**2 + 2*phi1_bar**2*chip"
    Q: "1"
    kappa: "1"
    rho: "chi + 4*phi1_bar*phi2_bar*chip"
    alpha: "alpha"
  regime:
    phi1_bar: [0.1, 0.4]
    phi2_bar: [0.1, 0.4]
    c11: [0.05, 0.2]
    c12: [0.3, 0.5]
    c21: [0.05, 0.2]
    c22: [0.3, 0.5]
    chi: [0.1, 0.4]
    chip: [0.05, 0.3]
    alpha: [0.1, 1.0]
    q: [0.1, 1.0]
  provenance: proposed
  reason: >
    Saha et al.'s printed Eq. (8) omits the diagonal surface-tension stabilization -kappa*q^4
    (saha2020/q_eq8_eq15_kappa_omission_and_appA_laplacian_sign), whereas frohoff2021 Eq. (12)
    retains -q^4*(1 + Q*kappa)/2 in tr(B). Consequently, Re(lambda_max) of saha2020 Eq. (8)
    and frohoff2021 Eq. (12) (at Q = 1, kappa = 1) agree asymptotically in the long-wavelength
    limit q -> 0 with relative discrepancy O(q^2).
  assumptions:
    - "Equal mobilities Q = 1 and equal rigidities kappa = 1"
    - "Long-wavelength limit q -> 0 where -q^4 interfacial stabilization is negligible relative to O(q^2) bulk terms"

- id: rel_frohoff2021_eq8_derived_to_eqB1_disc
