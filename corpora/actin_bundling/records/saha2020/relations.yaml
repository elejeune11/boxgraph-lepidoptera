# --- C. Exact Exceptional-Point Equivalence (saha2020 alpha_* <-> you2020 delta_complex & delta_c) ---

- id: rel_you2020_eq16_alpha_star_derived_delta_complex
  kind: derived_from
  a: saha2020/symmetric_stability_eq15_eq18
  b: you2020/one_mode_homogeneous_eigenvalues
  output_map: {delta_complex_over_kappa: alpha_star}
  steps:
    - "subs: chi = 1"
    - "simplify"
  mapping:
    alpha_A: "-4 * c1**2"
    alpha_B: "-4 * c2**2"
    kappa: "1"
    delta: "alpha"
  regime:
    c1: [0.1, 0.5]
    c2: [0.1, 0.5]
    chi: [0.1, 0.5]
    alpha: [0.1, 1.0]
    q: [0.5, 2.0]
  provenance: proposed
  reason: >
    Exact symbolic exceptional-point identity between saha2020 Eq. (16) (p. 9,
    alpha_* = sqrt(chi^2 + 4*(c_1^2 - c_2^2)^2)) and you2020/one_mode_homogeneous_eigenvalues
    (delta_complex/kappa = sqrt(1 + (alpha_A - alpha_B)^2/(4*kappa^2))): normalizing reciprocal
    coupling to chi = kappa = 1 with alpha_A = -4*c_1^2 and alpha_B = -4*c_2^2 renders both
    homogeneous exceptional-point thresholds algebraically identical.
  assumptions:
    - "Unit reciprocal coupling normalization chi = kappa = 1"
    - "Bi-supercritical zero-mean curvatures alpha_A = -4*c_1^2, alpha_B = -4*c_2^2"

- id: rel_you2020_delta_complex_same_as_eq16_alpha_star
  kind: same_as
  a: you2020/one_mode_homogeneous_eigenvalues
  b: saha2020/symmetric_stability_eq15_eq18
  output_map: {alpha_star: delta_complex_over_kappa}
  mapping:
    c1: "((alpha_A - alpha_B)**2 + 1e-300)**(1/4) / (2 * sqrt(kappa))"
    c2: "0"
    chi: "1"
    alpha: "delta / kappa"
    q: "sqrt(kappa)"
  regime:
    alpha_A: [-0.2, 0.1]
    alpha_B: [-0.1, 0.1]
    kappa: [0.005, 0.1]
    delta: [0.01, 0.2]
  provenance: proposed
  reason: >
    General converse exceptional-point identity valid for arbitrary signs of (alpha_A, alpha_B)
    — spanning both you2020's main-text subcritical-B regime (alpha_A < 0, alpha_B > 0) and
    SI bi-supercritical regime (alpha_A < 0, alpha_B < 0): rescaling time by kappa (so chi = 1,
    alpha = delta/kappa, q = sqrt(kappa)) and encoding the curvature mismatch
    4*c_1^2 = |alpha_A - alpha_B|/kappa with c_2 = 0 makes saha2020 Eq. (16)'s alpha_* identically
    equal to you2020's normalized homogeneous exceptional point delta_complex/kappa.
  assumptions:
    - "Homogeneous exceptional point depends only on |alpha_A - alpha_B| / kappa"
    - "Kappa-normalized time scaling (chi = 1, 4*c_1^2 = |alpha_A - alpha_B|/kappa, c_2 = 0)"

- id: rel_you2020_phase_bdy_dc_same_as_eq16_alpha_star
  kind: same_as
  a: you2020/one_mode_phase_boundaries
  b: saha2020/symmetric_stability_eq15_eq18
  output_map: {alpha_star: delta_c_over_kappa}
  mapping:
    c1: "sqrt(alpha_B / (2 * kappa))"
    c2: "0"
    chi: "1"
    alpha: "delta / kappa"
    q: "1"
  regime:
    gamma_A: [0.01, 0.1]
    phi0_A: [0.01, 0.2]
    alpha_B: [0.005, 0.1]
    kappa: [0.005, 0.05]
    delta: [0.01, 0.2]
  provenance: proposed
  reason: >
    Exact symbolic identity connecting you2020's static-to-traveling exceptional point
    delta_c/kappa = sqrt(1 + alpha_B^2/kappa^2) (Eq. 6, Fig. 1A, p. 2-3) to saha2020 Eq. (16)'s
    alpha_* = sqrt(chi^2 + 4*(c_1^2 - c_2^2)^2): in you2020's subcritical-B one-mode model,
    nonlinear saturation locks the effective A-curvature at the static fixed point to -alpha_B
    (matching the Hopf line alpha_A = -alpha_B where |alpha_A - alpha_B|/2 = alpha_B), so
    setting 2*c_1^2 = alpha_B/kappa, c_2 = 0, chi = 1 yields alpha_* = delta_c/kappa symbolically.
  assumptions:
    - "Subcritical-B one-mode static-to-traveling EP (alpha_B > 0, kappa > 0)"
    - "Coincidence of static-to-traveling EP delta_c with homogeneous EP on the Hopf line alpha_A = -alpha_B"

- id: rel_you2020_traveling_dc_same_as_eq16_alpha_star
