    phi1_bar: "phi1_bar / 2"
    phi2_bar: "phi2_bar / 2"
    c11: "0"
    c12: "0"
    c21: "-(a_Delta**2 + 1e-300)**(1/4) / 2"
    c22: "(a_Delta**2 + 1e-300)**(1/4) / 2"
    chi: "rho"
    chip: "0"
    alpha: "alpha"
    q: "1"
  regime:
    a_Delta: [-2.0, -0.4]
    kappa: [0.5, 3.0]
    phi1_bar: [0.0, 0.4]
    phi2_bar: [0.0, 0.4]
    rho: [0.8, 1.5]
    alpha: [0.0, 0.7]
