notes: >
  Read stage of Saha, Agudo-Canalejo & Golestanian, Phys. Rev. X 10, 041009 (2020), a 14-page
  theoretical and numerical study introducing the multicomponent Nonreciprocal Cahn-Hilliard (NRCH)
  model (Secs. I-V and Appendices A-B). All 14 pages of extracted text and equation/figure page
  images (pages 3-12) were inspected directly.
  Scope included: (1) multicomponent interaction parameter counting (Sec. II A) and Appendix A
  domain-length mapping; (2) binary equilibrium and nonequilibrium chemical potentials Eqs. (6)-(7)
  (printed verbatim plus corrected variant for the Eq. 6 phi_1 -> phi_2 typo); (3) general binary
  linear stability matrix Eq. (8) and composition-plane spinodal topology/splitting analysis (Secs. III,
  IV E, Figs. 2 and 6); (4) symmetric linear stability, exceptional-point eigenvalues/eigenvectors
  Eqs. (15)-(18), and chi -> 0 / c_1 = c_2 limits (Sec. IV D, Fig. 5) with symbolic ModelAtlas
  relations; (5) complex-field NRCH Eq. (9) (printed verbatim plus corrected variant fixing the
  UV-unstable +kappa nabla^4 A sign, unstated chi = 0, and non-uniform prefactors); (6) composition-plane
  C_i hyperbola Eq. (19) (printed verbatim plus corrected two-branch variant matching Fig. 6c) and
  C_r Hopf circle Eq. (20) (matching Fig. 6d); (7) zero-dimensional minimal oscillator ODE (Sec. IV B,
  Fig. 4e-i, printed unshifted vs shifted-to-origin variant) and its exact SNIC limit-cycle onset;
  (8) 1D and 2D pseudospectral NRCH PDE solvers (Eyre-stabilized exact 2x2 ETD1) checking Fig. 1(d,g)
  profiles, the 1D traveling-band onset, Fig. 3(a) coarsening exponents (alpha = 0 and 0.95), and
  Fig. 3(c) polar-order flux J (alpha = 0.15 and 0.95); and (9) four-component linear stability of
  Appendix B parameters (Fig. 1a).
  Key quantitative findings and discrepancies:
  (a) Printed Eq. (6) (p. 5) writes phi_1 three times instead of phi_2 in mu_2^eq and omits
  -kappa nabla^2 phi_i;
  (b) Printed Eq. (9) (p. 7) has +kappa nabla^4 A (UV-unstable +kappa q^4 instead of -kappa q^4),
  implicitly assumes chi = 0, and has non-uniformly wrong coefficients (4x on c^2, 2x on alpha,
  8x on cubic terms) relative to Eqs. (3), (5)-(7), confirmed by ModelAtlas relation testing;
  (c) Printed Eq. (19) (p. 10) gives a single dimensionally mismatched hyperbola branch
  (c_1^2 + c_2^2 - chi^2 + alpha^2)/3 instead of the exact two-branch C_i boundary
  (c_1^2 - c_2^2)/3 +/- sqrt(alpha^2 - chi^2)/6 that matches all four orange curves in Fig. 6(c);
  (d) Fig. 2 caption parameters (chi = -0.2, chi' = 0.2) do NOT reproduce Fig. 2 or Sec. III:
  Eq. (8) gives a large C_r/C_i oscillatory overlap around (0.35, 0.30), bulk splitting at alpha = 0.1598
  (not > 0.35), and 3 spinodal components at alpha = 0.33 and 0.49 (not 1 and 2); contour overlays show
  Fig. 2(a)-(c) are reproduced to sub-pixel accuracy at chi ≈ -0.50, chi' ≈ 0.80-0.85;
  (e) The minimal oscillator (Sec. IV B) does not oscillate at alpha = 0.4 or 0.95 when Eq. (7) is
  evaluated with Fig. 1's unshifted c_{i,1}, c_{i,2}, requiring the unstated shift to symmetric origin (0, 0);
  (f) The traveling-band threshold for Fig. 1 at (0.35, 0.3) is printed as 0.23, whereas the linear
  exceptional point is 0.2030, the shifted minimal-oscillator SNIC threshold is 0.2193, and 1D PDE
  bisection gives 0.2189;
  (g) Fig. 3(c) caption quotes saturation at 'approximately 0.1' while the plotted red curves saturate
  near 0.18; our 2D ETD1 simulations reproduce the equilibrium coarsening exponent (0.335 +/- 0.007 vs 0.33),
  the active smectic coarsening exponent (0.204 +/- 0.009 vs 0.22), zero bulk flux at alpha = 0.15
  (5.8e-5 vs 0), and positive active component flux (~0.158 +/- 0.035 vs ~0.1 / plotted 0.18);
  (h) Appendix A omits the conserved white-noise amplitude prefactor, Fig. 5 omits c_1 and c_2 values,
  and Fig. 1 caption cites 'Appendix A' instead of Appendix B (which also prints stray '=' before C_21,
  C_31, C_41 and has one complex-conjugate unstable pair plus one real unstable mode).
  Left out: (1) figure digitization of plotted curves (Figs. 1-6), deferred to the separate digitize
  stage; (2) literature context coarsening exponents cited for comparison on p. 8 (block-copolymer
  1/4 [44,45] and Swift-Hohenberg 1/5, 1/4 [46,47]) and generic complex Ginzburg-Landau Eqs. (10)-(11)
  [43], which feed no quantitative prediction of the NRCH model.
