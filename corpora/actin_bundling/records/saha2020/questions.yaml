  text: >
    ModelAtlas synthesis between the twin 2020 nonreciprocal Cahn-Hilliard papers saha2020
    (Phys. Rev. X 10, 041009, Oct 2020; citing you2020 as ref-41 on p. 2) and you2020
    (Proc. Natl. Acad. Sci. U.S.A. 117, 19767, Aug 2020; citing saha2020 as ref-45 on p. 2):
    40 cross-record relations in saha2020/relations.yaml (35 verified + 5 intentional documented-misprint
    diagnostics: 1 refuted, 4 not_verified; all provenance: proposed because the mutual p. 2 citations
    are qualitative parallel-discovery acknowledgments without an explicit symbol dictionary) establish
    their exact mathematical equivalence and sharpen five key structural contrasts.
    (1) Exact continuum equivalence and canonical dictionaries: at chi' = 0 and equal interfacial
    rigidities (gamma_A = gamma_B = kappa_S), under species relabeling (1 <-> B, 2 <-> A so
    kappa_Y = chi and delta = +alpha) and unrescaled-time field rescaling phi_A = 2*sqrt(3)*phi_tilde_2,
    phi_B = 2*sqrt(3)*phi_tilde_1, chi_A = -4*c_2^2, chi_B = -4*c_1^2, saha2020 Eqs. (3), (5)-(7)
    are identically you2020's SI Sec. V bi-supercritical continuum PDE Eq. (S31); under the alternative
    concentration-preserving time rescaling t_Y = 12*t_S (chi_mu = -c_i^2/3), decoupled ground states
    coincide identically (phi_g = sqrt(-3*chi_mu) = c_i, rel_you2020_ground_state_same_as_shift_c1)
    and bulk curvature maps as D_11 = -q^2*alpha_A|_{gamma_A = 0} (opposite operator sign convention).
    (2) Exact two-field linear stability & exceptional-point equivalence: rel_you2020_eq8_re_same_as_homog_eig,
    rel_you2020_eq8_im_same_as_homog_eig, rel_you2020_homog_eig_re_same_as_eq8_subcritB, and
    rel_you2020_eq15_re_same_as_homog_eig prove exact eigenvalue identity across both subcritical-B and
    bi-supercritical regimes (including exact chi'-renormalization in Eq. 8), closing the 3-paper
    linear-stability family (saha2020 <-> you2020 <-> frohoff2021). Saha's homogeneous exceptional
    point alpha_* = sqrt(chi^2 + 4*(c_1^2 - c_2^2)^2) (Eq. 16) maps identically onto you2020's
    delta_complex/kappa (for arbitrary signs of alpha_A, alpha_B) and onto you2020's static-to-traveling
    exceptional point delta_c = sqrt(kappa^2 + alpha_B^2) (and traveling speed v = Im(lambda_abs)) on
    the Hopf line alpha_A = -alpha_B, while reducing cleanly to purely_nonreciprocal_threshold_sec4d
    (kappa -> 0) and equal_species_threshold_sec4d (alpha_B -> 0). Crucially,
    rel_you2020_bisup_dc_reduces_equal_species_near_crit demonstrates that in bi-supercritical NRCH
    with equal species (alpha_A = alpha_B < 0), the nonlinear static-to-traveling threshold
    delta_c/kappa > 1 strictly exceeds the linear homogeneous exceptional point alpha_*/|chi| = 1 at
    finite supercriticality (converging to 1 only as alpha_A, alpha_B -> 0), unifying the linear-vs-nonlinear
    onset gap observed independently in saha2020 Fig. 1 (alpha_onset = 0.219 vs alpha_* = 0.203,
    q_fig1_band_threshold_023) and you2020 Fig. S5c (delta_c/kappa = 1.60 vs linear EP 1.0).
    (3) Direct bi-supercritical 1D PDE verification vs subcritical-B structural contrast:
    rel_you2020_nrch_1d_pde_approx_bisup_1d_pde verifies directly across 40 random asymmetric-well,
    off-center-composition parameter points (unit-speed rescaling x_Y = tau*x_S, t_Y = tau*t_S, tau = 500)
    that the two independent 1D PDE solvers (saha2020/nrch_1d_pde Eyre-ETD1 vs
    you2020/bi_supercritical_1d_pde IMEX-SBDF2) agree on nonlinear traveling-wave speeds to max relative
    error 1.81e-3 (0.18%). By contrast, you2020's main-text continuum_1d_pde omits both phi_B^3 bulk
    saturation and gamma_B interfacial stiffness (making species B purely relaxational so the one-mode
    fixed points close analytically with alpha_A-independent speed v = sqrt(delta^2 - delta_c^2) and
    with rho_A^s, rho_A^t matching saha2020/eq8_boundary_curve's diffusive and Hopf spinodals identically):
    at you2020 Fig. 1D parameters (chi_A = -0.05, chi_B = +0.005, gamma_A = 0.04, kappa = 0.005,
    delta = 0.01), continuum_1d_pde yields a traveling wave v = 0.00707, whereas restoring phi_B^3 and
    equal stiffness gamma_B = 0.04 in both bi_supercritical_1d_pde and nrch_1d_pde raises alpha_B from
    0.005 to 0.045 and suppresses motion completely into a static demixed state (v = 0).
    (4) Three-way independent corroboration of saha2020's documented equation misprints against you2020:
    printed Eq. (6)'s phi_1-for-phi_2 typo (q_eq6_phi1_misprint via rel_you2020_eq6_printed_mu2_vs_cross_diff_kAB),
    printed Eq. (9)'s 4x c^2 prefactor, UV-unstable +kappa*q^4 sign, and 1/2 activity factor
    (q_eq9_sign_and_prefactor_errors via rel_you2020_eq9_printed_re_vs_homog_eig [refuted],
    rel_you2020_homog_eig_im_vs_eq9_printed [not_verified], and rel_you2020_eq9_printed_im_vs_bisup_v
    [factor 0.5]), and printed Eq. (19)'s C_i hyperbola errors (q_eq19_ci_hyperbola_misprint via
    rel_you2020_ci_eq19_printed_vs_homog_im) are all independently confirmed against you2020.
    (5) Complementary physics scopes: saha2020 focuses on top-down 2D/4-component active-smectic band
    coarsening (R ~ t^0.22), composition-plane global bifurcations (Figs. 2 and 6), and 0D minimal-oscillator
    SNIC heuristics, whereas you2020 develops analytical 1D one-mode PT-symmetry breaking / run-and-catch
    mechanisms (exceptional_point_matrix_L, velocity_ratio_run_and_catch) and microscopic derivations
    (pairwise attractive-repulsive particles SI Sec. VI A and active-passive Brownian mixtures SI Sec. VI B,
    whose linear stability matrix maps directly onto saha2020 Eq. 8 and Appendix B via
    rel_you2020_active_passive_reduces_eq8_re and rel_you2020_active_passive_Lmin_scales_appB_wavelength).
