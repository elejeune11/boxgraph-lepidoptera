- id: q_eq9_sign_and_prefactor_errors
  kind: possible_error
  about:
    - complex_nrch_eq9
    - complex_nrch_eq9_corrected
    - rel_eq9_printed_reduces_to_eq15_re
  text: >
    Eq. (9) (p. 7) rewrites the binary NRCH dynamics for A = phi_1 + i*phi_2 with chi' = 0 and
    c_{1,1} = -c_{1,2} = c_{2,1} = -c_{2,2} = c as partial_t A = nabla^2[-(c^2 + i*alpha/2) A
    + (3/8)|A|^2 A + (1/8) A*^3] + kappa nabla^4 A. Direct substitution into Eqs. (3) and (5)-(7)
    reveals three discrepancies: (1) the fourth-order term has the wrong sign (+kappa nabla^4 A
    yields +kappa q^4, which is UV-unstable/ill-posed at high wavenumbers, instead of stabilizing
    -kappa nabla^4 A -> -kappa q^4); (2) the reciprocal coupling term i*chi*A* is omitted, implicitly
    requiring chi = 0 without stating so; (3) the polynomial and activity coefficients differ by
    non-uniform factors from the exact derivation -(4*c^2 + i*alpha) A + 3|A|^2 A + A*^3 (factors
    of 4 on c^2, 2 on alpha, and 8 on the cubic terms). Corrected in variant complex_nrch_eq9_corrected.
  citation:
    page: 7
    printed_page: "041009-7"
    quote: "the two-component NRCH can be written in terms of this field as"
    where: Eq. 9

- id: q_eq19_ci_hyperbola_misprint
  kind: possible_error
  about:
    - ci_hyperbola_eq19
    - ci_hyperbola_eq19_corrected
  text: >
    Eq. (19) (p. 10) states that the complex-eigenvalue boundary C_i in the shifted symmetric
    composition plane (chi' = 0) is phi_bar_1^2 - phi_bar_2^2 = (1/3)(c_1^2 + c_2^2 - chi^2 + alpha^2).
    Solving (D_11 - D_22)^2 + 4*D_12*D_21 = 0 directly from Eq. (8) gives two conjugate hyperbolas
    phi_bar_1^2 - phi_bar_2^2 = (1/3)(c_1^2 - c_2^2) +/- (1/6)*sqrt(alpha^2 - chi^2). Printed Eq. (19)
    reverses the sign of c_2^2, adds c_i^2 (order phi^2) to alpha^2 - chi^2 (order phi^4) instead of
    sqrt(alpha^2 - chi^2), and gives only a single hyperbola branch. Fig. 6(c) (p. 10) plots all four
    orange branches matching the exact corrected formula (vertices at phi_bar_1 = 0.35 +/- 0.228 and
    phi_bar_2 = 0.30 +/- 0.252 for Fig. 1 parameters at alpha = 0.4). Corrected in variant
    ci_hyperbola_eq19_corrected.
  citation:
    page: 10
    printed_page: "041009-10"
    quote: "In this case, the equation for Ci can be written as"
    where: Eq. 19

