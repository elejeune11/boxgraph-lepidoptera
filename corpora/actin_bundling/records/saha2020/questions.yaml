  text: >
    Appendix A (p. 12) states that the white noise fields zeta_{1,2} are drawn from a Gaussian distribution
    with 'zero mean and unit width' and stepped using sqrt(Delta t), without stating the noise strength /
    temperature prefactor multiplying zeta_i in Eq. (3). Unscaled unit-variance conserved noise nabla . zeta
    on a grid with h = 0.01 would inject O(sqrt(dt)/h) ~ 1 fluctuations per step, overwhelming the coexistence
    densities phi_i in [0.1, 0.5]. Deterministic evolution from small random initial perturbations (as in
    Fig. 1d, g, l) is therefore used in our PDE models.
  citation:
