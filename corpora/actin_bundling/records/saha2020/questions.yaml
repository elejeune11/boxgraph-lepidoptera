- id: q_eq6_phi1_misprint
  kind: possible_error
  about:
    - binary_chemical_potential_eq6_eq7
    - binary_chemical_potential_eq6_eq7_corrected
  text: >
    In Eq. (6) (p. 5), the equilibrium chemical potential mu_2^eq prints phi_1 three times
    in its double-well derivative term: 2(phi_1 - c_{2,1})(phi_1 - c_{2,2})(2*phi_1 - c_{2,1} - c_{2,2})
    instead of phi_2. Direct functional differentiation delta F / delta phi_2 of Eq. (5) gives phi_2,
    which also produces the printed diagonal entry D_22(phi_bar_2) in Eq. (8). In addition, Eq. (6)
    omits the interfacial gradient term -kappa nabla^2 phi_i arising from (kappa/2)|nabla phi_i|^2 in Eq. (5).
    Corrected in variant binary_chemical_potential_eq6_eq7_corrected.
  citation:
