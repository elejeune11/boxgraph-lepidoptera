id: nrch_1d_band_onset
name: One-dimensional NRCH PDE static-to-traveling band onset threshold (Sec. IV A)
role: model
built_from:
  - nrch_1d_pde
stated:
  page: 7
  printed_page: "041009-7"
  quote: "when α is increased above a certain threshold, which is 0.23"
  where: Sec. IV A (p. 7)
equation: "Bracketed bisection on 1D NRCH PDE (Eqs. 3, 5-7) starting from a single-domain bulk phase-separated state to locate the onset of nonzero propagation speed |v| > v_thresh"
inputs:
  c11: {quantity: preferred_phase_concentration, unit: dimensionless}
  c12: {quantity: preferred_phase_concentration, unit: dimensionless}
  c21: {quantity: preferred_phase_concentration, unit: dimensionless}
  c22: {quantity: preferred_phase_concentration, unit: dimensionless}
  chi: {quantity: reciprocal_coupling, unit: dimensionless}
  chip: {quantity: quartic_coupling, unit: dimensionless}
  kappa: {quantity: gradient_stiffness, unit: dimensionless}
  phi1_bar: {quantity: concentration, unit: dimensionless}
  phi2_bar: {quantity: concentration, unit: dimensionless}
outputs:
  alpha_onset: {quantity: nonreciprocal_activity, unit: dimensionless}
settings:
  N: 128
  L: 2.0
  dt: 0.001
  T: 12.0
  S: 0.8
  v_thresh: 0.05
  n_bisect: 8
stochastic: false
