id: ci_hyperbola_curve_eq19_corrected
name: Complex-eigenvalue conjugate hyperbola curves phi_2(phi_1) from corrected Eq. (19)
role: model
variant_of: ci_hyperbola_curve_eq19
built_from:
  - ci_hyperbola_eq19_corrected
corrections:
  - equation: Eq. 19
    change: "Replace printed (1/3)*(c1^2 + c2^2 - chi^2 + alpha^2) with the two conjugate hyperbolas (phi1_bar - phi1_mid)^2 - (phi2_bar - phi2_mid)^2 = (1/3)*(c1^2 - c2^2) +/- (1/6)*sqrt(alpha^2 - chi^2)."
    evidence: "Direct discriminant zero (D11 - D22)^2 + 4*D12*D21 = 0 of Eq. (8) yields both conjugate hyperbolas (4 orange branches in Fig. 6c); printed Eq. (19) has no real top/bottom branches at phi1_bar = 0.35 and is dimensionally inconsistent."
stated:
  page: 10
  printed_page: "041009-10"
  quote: "In this case, the equation for Ci can be written as"
  where: Eq. 19 (derived from Eq. 8) & Fig. 6(c)
equation: "(phi1_bar - phi1_mid)^2 - (phi2_bar - phi2_mid)^2 = (1/3)*(c1^2 - c2^2) +/- (1/6)*sqrt(alpha^2 - chi^2)"
inputs:
  phi1_bar: {quantity: concentration, unit: dimensionless}
  phi1_mid: {quantity: concentration, unit: dimensionless}
  phi2_mid: {quantity: concentration, unit: dimensionless}
  c1: {quantity: preferred_phase_concentration, unit: dimensionless}
  c2: {quantity: preferred_phase_concentration, unit: dimensionless}
  chi: {quantity: reciprocal_coupling, unit: dimensionless}
  alpha: {quantity: nonreciprocal_activity, unit: dimensionless}
outputs:
  phi2_bar: {quantity: concentration, unit: dimensionless}
settings:
  branch: right_upper
stochastic: false
