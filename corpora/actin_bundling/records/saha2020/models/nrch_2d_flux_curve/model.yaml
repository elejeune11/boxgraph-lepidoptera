id: nrch_2d_flux_curve
name: Two-dimensional NRCH time-dependent polar-order flux curve J(t) (Eq. 14, Fig. 3c)
role: model
built_from:
  - nrch_2d_pde
stated:
  page: 7
  printed_page: "041009-7"
  quote: "polar-order parameter as measured by the components of the"
  where: Eq. 14 & Fig. 3(c)
equation: "J_comp(t) = <( |J_x(t)| + |J_y(t)| )/2 >_ensemble with J = <phi_1 grad phi_2 - phi_2 grad phi_1> sampled at Fig. 3(c) times"
inputs:
  c11: {quantity: preferred_phase_concentration, unit: dimensionless}
  c12: {quantity: preferred_phase_concentration, unit: dimensionless}
  c21: {quantity: preferred_phase_concentration, unit: dimensionless}
  c22: {quantity: preferred_phase_concentration, unit: dimensionless}
  chi: {quantity: reciprocal_coupling, unit: dimensionless}
  chip: {quantity: quartic_coupling, unit: dimensionless}
  alpha: {quantity: nonreciprocal_activity, unit: dimensionless}
  kappa: {quantity: gradient_stiffness, unit: dimensionless}
  phi1_bar: {quantity: concentration, unit: dimensionless}
  phi2_bar: {quantity: concentration, unit: dimensionless}
  target_J: {quantity: polar_order_flux, unit: dimensionless, curve: {quantity: time, unit: dimensionless}}
outputs:
  J_curve: {quantity: polar_order_flux, unit: dimensionless, curve: {quantity: time, unit: dimensionless}}
  J_final: {quantity: polar_order_flux, unit: dimensionless}
settings:
  N: 48
  L: 2.0
  dt: 0.004
  S: 1.5
  init_amp: 0.01
  n_seeds: 3
  seed: 42
stochastic: false
