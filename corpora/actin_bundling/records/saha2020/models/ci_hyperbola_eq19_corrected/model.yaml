id: ci_hyperbola_eq19_corrected
name: Complex-eigenvalue boundary C_i in shifted composition plane corrected from Eq. (8)
role: model
variant_of: ci_hyperbola_eq19
corrections:
  - equation: Eq. 19
    change: "Replace (1/3)*(c_1^2 + c_2^2 - chi^2 + alpha^2) with the two conjugate hyperbola branches phi1_bar^2 - phi2_bar^2 = (1/3)*(c_1^2 - c_2^2) +/- (1/6)*sqrt(alpha^2 - chi^2)."
    evidence: "Setting the discriminant (D_11 - D_22)^2 + 4*D_12*D_21 = 0 of Eq. (8) (p. 5) with chi' = 0 and c_{1,1} = -c_{1,2} = c_1, c_{2,1} = -c_{2,2} = c_2 yields [4(c_1^2 - c_2^2) - 12(phi1_bar^2 - phi2_bar^2)]^2 = 4(alpha^2 - chi^2), which gives two conjugate hyperbolas (four branches) matching all four orange C_i curves plotted in Fig. 6(c) (p. 10) at alpha = 0.4 (vertices at phi_bar_1 = 0.35 +/- 0.228 and phi_bar_2 = 0.30 +/- 0.252). Printed Eq. (19) also has a scaling/dimensional mismatch (adding c_i^2 to alpha^2 - chi^2 instead of sqrt(alpha^2 - chi^2)) and gives only a single branch."
stated:
  page: 10
  printed_page: "041009-10"
  quote: "In this case, the equation for Ci can be written as"
  where: Eq. 19 (derived from Eq. 8)
equation: "phi1_bar^2 - phi2_bar^2 = (1/3)*(c1^2 - c2^2) +/- (1/6)*sqrt(alpha^2 - chi^2)"
inputs:
  c1: {quantity: preferred_phase_concentration, unit: dimensionless}
  c2: {quantity: preferred_phase_concentration, unit: dimensionless}
  chi: {quantity: reciprocal_coupling, unit: dimensionless}
  alpha: {quantity: nonreciprocal_activity, unit: dimensionless}
outputs:
  hyperbola_offset: {quantity: composition_hyperbola_offset, unit: dimensionless}
  hyperbola_offset_minus: {quantity: composition_hyperbola_offset, unit: dimensionless}
settings: {}
stochastic: false
