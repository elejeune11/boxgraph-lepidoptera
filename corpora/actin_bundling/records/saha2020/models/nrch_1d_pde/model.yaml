id: nrch_1d_pde
name: One-dimensional binary NRCH pseudospectral PDE solver (Eqs. 3, 5-7, 14, Appendix A)
role: model
stated:
  page: 11
  printed_page: "041009-11"
  quote: "spectral method in two dimensions where the linear terms"
  where: Eqs. 3, 5-7, 14 & Appendix A (Fig. 1d, g)
equation: "partial_t phi_i = nabla^2 [mu_i^neq(phi_1, phi_2) - kappa nabla^2 phi_i]; J = <phi_1 d_x phi_2 - phi_2 d_x phi_1>"
inputs:
  c11: {quantity: preferred_phase_concentration, unit: dimensionless}
  c12: {quantity: preferred_phase_concentration, unit: dimensionless}
  c21: {quantity: preferred_phase_concentration, unit: dimensionless}
  c22: {quantity: preferred_phase_concentration, unit: dimensionless}
  chi: {quantity: reciprocal_coupling, unit: dimensionless}
  chip: {quantity: quartic_coupling, unit: dimensionless}
  alpha: {quantity: nonreciprocal_activity, unit: dimensionless}
  kappa: {quantity: gradient_stiffness, unit: dimensionless}
  phi1_bar: {quantity: concentration, unit: dimensionless}
  phi2_bar: {quantity: concentration, unit: dimensionless}
outputs:
  J_mag: {quantity: polar_order_flux, unit: dimensionless}
  wave_speed: {quantity: wave_speed, unit: dimensionless}
  wavelength: {quantity: domain_length, unit: dimensionless}
  phi1_min: {quantity: concentration, unit: dimensionless}
  phi1_max: {quantity: concentration, unit: dimensionless}
  phi2_min: {quantity: concentration, unit: dimensionless}
  phi2_max: {quantity: concentration, unit: dimensionless}
settings:
  N: 128
  L: 2.0
  dt: 0.0005
  T: 8.0
  S: 0.8
  init_amp: 0.01
  seed: 42
stochastic: false
