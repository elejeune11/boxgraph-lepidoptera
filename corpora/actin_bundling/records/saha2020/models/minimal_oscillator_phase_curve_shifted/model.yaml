id: minimal_oscillator_phase_curve_shifted
name: Shifted symmetric minimal oscillator phase-portrait curve x_2(x_1) (Sec. IV B, Fig. 4g-i)
role: model
variant_of: minimal_oscillator_phase_curve
built_from:
  - minimal_oscillator_sec4b_shifted
corrections:
  - equation: Sec. IV B (p. 7)
    change: "Shift the double-well potentials to symmetric centers c_i = |c_{i,2} - c_{i,1}|/2 around (0, 0)."
    evidence: "Fig. 4(g)-(i) (p. 8) plot symmetric phase portraits centered at (0, 0) with nodes at +/-(0.236, 0.311) for alpha = 0.1 and centered limit cycles at alpha = 0.4 and 0.95; unshifted Eq. (7) has no fixed point at (0, 0) and no oscillations."
stated:
  page: 7
  printed_page: "041009-7"
  quote: "equations that are linearized around the point (0,0) develop an unstable pair of eigenvalues"
  where: Sec. IV B & Fig. 4(g)-(i)
equation: "xdot_1 = -4*x1*(x1^2 - c1^2) - (chi+alpha)*x2; xdot_2 = -4*x2*(x2^2 - c2^2) - (chi-alpha)*x1"
inputs:
  c11: {quantity: preferred_phase_concentration, unit: dimensionless}
  c12: {quantity: preferred_phase_concentration, unit: dimensionless}
  c21: {quantity: preferred_phase_concentration, unit: dimensionless}
  c22: {quantity: preferred_phase_concentration, unit: dimensionless}
  chi: {quantity: reciprocal_coupling, unit: dimensionless}
  chip: {quantity: quartic_coupling, unit: dimensionless}
  alpha: {quantity: nonreciprocal_activity, unit: dimensionless}
  target: {quantity: oscillator_coordinate, unit: dimensionless, curve: {quantity: oscillator_coordinate, unit: dimensionless}}
outputs:
  x2_curve: {quantity: oscillator_coordinate, unit: dimensionless, curve: {quantity: oscillator_coordinate, unit: dimensionless}}
settings:
  mode: lc_upper
  dt: 0.02
  T: 200.0
  x1_init: -0.001
  x2_init: -0.001
stochastic: false
