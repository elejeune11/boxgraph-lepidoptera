id: minimal_oscillator_phase_curve
name: Minimal oscillator phase-portrait curve x_2(x_1) from unshifted Eq. (7) (Sec. IV B, Fig. 4g-i)
role: model
built_from:
  - minimal_oscillator_sec4b
stated:
  page: 7
  printed_page: "041009-7"
  quote: "where the rhs has the same functional form as Eq. (7), with the substitution"
  where: Sec. IV B & Fig. 4(g)-(i)
equation: "xdot_i = -mu_i^neq(x_1, x_2) evaluated along phase-space trajectory or limit cycle x_2(x_1)"
inputs:
  c11: {quantity: preferred_phase_concentration, unit: dimensionless}
  c12: {quantity: preferred_phase_concentration, unit: dimensionless}
  c21: {quantity: preferred_phase_concentration, unit: dimensionless}
  c22: {quantity: preferred_phase_concentration, unit: dimensionless}
  chi: {quantity: reciprocal_coupling, unit: dimensionless}
  chip: {quantity: quartic_coupling, unit: dimensionless}
  alpha: {quantity: nonreciprocal_activity, unit: dimensionless}
  target: {quantity: oscillator_coordinate, unit: dimensionless, curve: {quantity: oscillator_coordinate, unit: dimensionless}}
outputs:
  x2_curve: {quantity: oscillator_coordinate, unit: dimensionless, curve: {quantity: oscillator_coordinate, unit: dimensionless}}
settings:
  mode: lc_upper
  dt: 0.02
  T: 200.0
  x1_init: -0.001
  x2_init: -0.001
stochastic: false
