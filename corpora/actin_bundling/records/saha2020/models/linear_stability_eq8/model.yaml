id: linear_stability_eq8
name: General binary NRCH linear stability dynamical matrix (Eq. 8)
role: model
stated:
  page: 5
  printed_page: "041009-5"
  quote: "of the instabilities in the system, we linearize the dynamics"
  where: Eq. 8
equation: "D11 = -q^2[2(phi1_bar-c11)^2 + 8(phi1_bar-c11)(phi1_bar-c12) + 2(phi1_bar-c12)^2 + 2*phi2_bar^2*chi']; D12 = -q^2[(chi+alpha) + 4*phi1_bar*phi2_bar*chi']; D21 = -q^2[(chi-alpha) + 4*phi1_bar*phi2_bar*chi']; D22 = -q^2[2(phi2_bar-c21)^2 + 8(phi2_bar-c21)(phi2_bar-c22) + 2(phi2_bar-c22)^2 + 2*phi1_bar^2*chi']"
inputs:
  phi1_bar: {quantity: concentration, unit: dimensionless}
  phi2_bar: {quantity: concentration, unit: dimensionless}
  c11: {quantity: preferred_phase_concentration, unit: dimensionless}
  c12: {quantity: preferred_phase_concentration, unit: dimensionless}
  c21: {quantity: preferred_phase_concentration, unit: dimensionless}
  c22: {quantity: preferred_phase_concentration, unit: dimensionless}
  chi: {quantity: reciprocal_coupling, unit: dimensionless}
  chip: {quantity: quartic_coupling, unit: dimensionless}
  alpha: {quantity: nonreciprocal_activity, unit: dimensionless}
  q: {quantity: wavenumber, unit: dimensionless}
outputs:
  D11: {quantity: growth_rate, unit: dimensionless}
  D12: {quantity: growth_rate, unit: dimensionless}
  D21: {quantity: growth_rate, unit: dimensionless}
  D22: {quantity: growth_rate, unit: dimensionless}
  trace_D: {quantity: growth_rate, unit: dimensionless}
  disc_over_q4: {quantity: stability_discriminant, unit: dimensionless}
  re_lambda_max: {quantity: growth_rate, unit: dimensionless}
  im_lambda_abs: {quantity: oscillation_frequency, unit: dimensionless}
settings: {}
stochastic: false
