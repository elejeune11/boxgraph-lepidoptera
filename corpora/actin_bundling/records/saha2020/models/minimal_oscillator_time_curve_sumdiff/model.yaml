id: minimal_oscillator_time_curve_sumdiff
name: Shifted symmetric minimal oscillator sum/difference trajectories (x_1 + x_2, x_1 - x_2) (Fig. 4e-f)
role: model
variant_of: minimal_oscillator_time_curve
built_from:
  - minimal_oscillator_sec4b_shifted
corrections:
  - equation: Sec. IV B & Fig. 4(e)-(f) (pp. 7-8)
    change: "Shift the double-well potentials to symmetric centers c_i = |c_{i,2} - c_{i,1}|/2 around (0, 0) AND map plotted curves to sum/difference coordinates (x_1 + x_2, x_1 - x_2) instead of raw (x_1, x_2)."
    evidence: "In Fig. 4(e) (alpha = 0.1), the green and blue curves relax to -0.547 and +0.0757 (with a blue overshoot to ~0.097), matching x_1* + x_2* = -0.5467 and x_1* - x_2* = +0.0755 of the Fig. 4(g) stable node (-0.2356, -0.3111). In Fig. 4(f) (alpha = 0.4), the green and blue limit-cycle amplitudes (~0.307 and ~0.267), period (18.46 vs 18.48), and phase lag (0.663 T vs 0.665 T) match x_1 + x_2 and x_1 - x_2 rather than raw x_1, x_2 (amplitudes 0.148, 0.248)."
stated:
  page: 8
  printed_page: "041009-8"
  quote: "Temporal trajectories of the underlying nonconserved dynamical system are shown in panels (e,f)"
  where: Sec. IV B & Fig. 4(e)-(f)
equation: "y_green(t) = x_1(t) + x_2(t), y_blue(t) = x_1(t) - x_2(t) from shifted symmetric minimal oscillator"
inputs:
  c11: {quantity: preferred_phase_concentration, unit: dimensionless}
  c12: {quantity: preferred_phase_concentration, unit: dimensionless}
  c21: {quantity: preferred_phase_concentration, unit: dimensionless}
  c22: {quantity: preferred_phase_concentration, unit: dimensionless}
  chi: {quantity: reciprocal_coupling, unit: dimensionless}
  chip: {quantity: quartic_coupling, unit: dimensionless}
  alpha: {quantity: nonreciprocal_activity, unit: dimensionless}
  target_green: {quantity: oscillator_coordinate, unit: dimensionless, curve: {quantity: time, unit: dimensionless}}
  target_blue: {quantity: oscillator_coordinate, unit: dimensionless, curve: {quantity: time, unit: dimensionless}}
outputs:
  green_curve: {quantity: oscillator_coordinate, unit: dimensionless, curve: {quantity: time, unit: dimensionless}}
  blue_curve: {quantity: oscillator_coordinate, unit: dimensionless, curve: {quantity: time, unit: dimensionless}}
settings:
  dt: 0.02
  x1_init: -0.0001
  x2_init: -0.0001
stochastic: false
