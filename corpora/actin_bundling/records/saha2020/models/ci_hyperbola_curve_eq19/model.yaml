id: ci_hyperbola_curve_eq19
name: Complex-eigenvalue hyperbola curve phi_2(phi_1) from printed Eq. (19)
role: model
built_from:
  - ci_hyperbola_eq19
stated:
  page: 10
  printed_page: "041009-10"
  quote: "In this case, the equation for Ci can be written as"
  where: Eq. 19 & Fig. 6(c)
equation: "(phi1_bar - phi1_mid)^2 - (phi2_bar - phi2_mid)^2 = (1/3)*(c1^2 + c2^2 - chi^2 + alpha^2)"
inputs:
  phi1_bar: {quantity: concentration, unit: dimensionless}
  phi1_mid: {quantity: concentration, unit: dimensionless}
  phi2_mid: {quantity: concentration, unit: dimensionless}
  c1: {quantity: preferred_phase_concentration, unit: dimensionless}
  c2: {quantity: preferred_phase_concentration, unit: dimensionless}
  chi: {quantity: reciprocal_coupling, unit: dimensionless}
  alpha: {quantity: nonreciprocal_activity, unit: dimensionless}
outputs:
  phi2_bar: {quantity: concentration, unit: dimensionless}
settings:
  branch: right_upper
stochastic: false
