id: binary_chemical_potential_eq6_eq7_corrected
name: Binary bulk chemical potentials with Eq. (6) phi2 typo corrected
role: model
variant_of: binary_chemical_potential_eq6_eq7
corrections:
  - equation: Eq. 6
    change: "Replace phi_1 with phi_2 in the double-well derivative term 2(phi_2 - c_{2,1})(phi_2 - c_{2,2})(2*phi_2 - c_{2,1} - c_{2,2}) of mu_2^eq."
    evidence: "Directly differentiating the binary free energy Eq. (5) (p. 5) with respect to phi_2 gives 2(phi_2 - c_{2,1})(phi_2 - c_{2,2})(2*phi_2 - c_{2,1} - c_{2,2}), which also yields the printed diagonal Jacobian D_22(phi_bar_2) in Eq. (8) (p. 5)."
stated:
  page: 5
  printed_page: "041009-5"
  quote: "which results in the equilibrium chemical potentials"
  where: Eqs. 5-7
equation: "mu1_eq = 2(phi1-c11)(phi1-c12)(2*phi1-c11-c12) + chi*phi2 + 2*chi'*phi1*phi2^2; mu2_eq = 2(phi2-c21)(phi2-c22)(2*phi2-c21-c22) + chi*phi1 + 2*chi'*phi2*phi1^2; mu1_neq = mu1_eq + alpha*phi2; mu2_neq = mu2_eq - alpha*phi1"
inputs:
  phi1: {quantity: concentration, unit: dimensionless}
  phi2: {quantity: concentration, unit: dimensionless}
  c11: {quantity: preferred_phase_concentration, unit: dimensionless}
  c12: {quantity: preferred_phase_concentration, unit: dimensionless}
  c21: {quantity: preferred_phase_concentration, unit: dimensionless}
  c22: {quantity: preferred_phase_concentration, unit: dimensionless}
  chi: {quantity: reciprocal_coupling, unit: dimensionless}
  chip: {quantity: quartic_coupling, unit: dimensionless}
  alpha: {quantity: nonreciprocal_activity, unit: dimensionless}
outputs:
  mu1_eq: {quantity: chemical_potential, unit: dimensionless}
  mu2_eq: {quantity: chemical_potential, unit: dimensionless}
  mu1_neq: {quantity: chemical_potential, unit: dimensionless}
  mu2_neq: {quantity: chemical_potential, unit: dimensionless}
settings: {}
stochastic: false
