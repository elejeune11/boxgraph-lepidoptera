id: complex_nrch_eq9_corrected
name: Complex-field NRCH linear dispersion corrected from Eqs. (3)-(7)
role: model
variant_of: complex_nrch_eq9
corrections:
  - equation: Eq. 9
    change: "Replace -(c^2 + i*alpha/2) A + (3/8)|A|^2 A + (1/8) A*^3 + kappa*nabla^4 A with -(4*c^2 + i*alpha) A + 3|A|^2 A + A*^3 - kappa*nabla^4 A (assuming chi = 0)."
    evidence: "Substituting A = phi_1 + i*phi_2 into Eqs. (3), (5)-(7) with chi' = 0, chi = 0, and c_{1,1} = -c_{1,2} = c_{2,1} = -c_{2,2} = c gives mu_1^neq + i*mu_2^neq = -(4*c^2 + i*alpha) A + 3|A|^2 A + A*^3 - kappa*nabla^2 A; taking nabla^2 yields -kappa*nabla^4 A (stabilizing -kappa*q^4 in Fourier space, unlike the ill-posed +kappa*q^4 in printed Eq. 9) and linear eigenvalue (4*c^2 + i*alpha)*q^2 - kappa*q^4 matching Eq. (15)-(16) at c_1 = c_2 = c, chi = 0."
stated:
  page: 7
  printed_page: "041009-7"
  quote: "the two-component NRCH can be written in terms of this field as"
  where: Eq. 9 (derived from Eqs. 3, 5-7)
equation: "partial_t A = nabla^2 [-(4*c^2 + i*alpha) A + 3|A|^2 A + A*^3] - kappa * nabla^4 A; linearized: Re(lambda) = 4*c^2*q^2 - kappa*q^4, Im(lambda) = alpha*q^2"
inputs:
  c: {quantity: preferred_phase_concentration, unit: dimensionless}
  alpha: {quantity: nonreciprocal_activity, unit: dimensionless}
  kappa: {quantity: gradient_stiffness, unit: dimensionless}
  q: {quantity: wavenumber, unit: dimensionless}
outputs:
  re_lambda: {quantity: growth_rate, unit: dimensionless}
  im_lambda: {quantity: oscillation_frequency, unit: dimensionless}
settings: {}
stochastic: false
