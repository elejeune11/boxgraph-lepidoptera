id: nrch_1d_profile_curve
name: One-dimensional binary NRCH steady-state concentration profiles phi_1(r), phi_2(r) (Fig. 1d, g)
role: model
built_from:
  - nrch_1d_pde
stated:
  page: 3
  printed_page: "041009-3"
  quote: "Line scans of the concentration along a cross section of the corresponding steady"
  where: Fig. 1(d, g) & Eqs. 3, 5-7
equation: "partial_t phi_i = partial_x^2 [mu_i^neq(phi_1, phi_2) - kappa partial_x^2 phi_i] evaluated at digitized r coordinates"
inputs:
  c11: {quantity: preferred_phase_concentration, unit: dimensionless}
  c12: {quantity: preferred_phase_concentration, unit: dimensionless}
  c21: {quantity: preferred_phase_concentration, unit: dimensionless}
  c22: {quantity: preferred_phase_concentration, unit: dimensionless}
  chi: {quantity: reciprocal_coupling, unit: dimensionless}
  chip: {quantity: quartic_coupling, unit: dimensionless}
  alpha: {quantity: nonreciprocal_activity, unit: dimensionless}
  kappa: {quantity: gradient_stiffness, unit: dimensionless}
  phi1_bar: {quantity: concentration, unit: dimensionless}
  phi2_bar: {quantity: concentration, unit: dimensionless}
  target_phi1: {quantity: concentration, unit: dimensionless, curve: {quantity: spatial_coordinate, unit: dimensionless}}
  target_phi2: {quantity: concentration, unit: dimensionless, curve: {quantity: spatial_coordinate, unit: dimensionless}}
outputs:
  phi1_curve: {quantity: concentration, unit: dimensionless, curve: {quantity: spatial_coordinate, unit: dimensionless}}
  phi2_curve: {quantity: concentration, unit: dimensionless, curve: {quantity: spatial_coordinate, unit: dimensionless}}
settings:
  N: 128
  L: 2.0
  dt: 0.0005
  T: 10.0
  S: 0.8
  init_amp: 0.01
  seed: 42
stochastic: false
