id: minimal_oscillator_time_curve
name: Minimal oscillator temporal trajectory x_1(t), x_2(t) from unshifted Eq. (7) (Sec. IV B, Fig. 4e-f)
role: model
built_from:
  - minimal_oscillator_sec4b
stated:
  page: 8
  printed_page: "041009-8"
  quote: "Temporal trajectories of the underlying nonconserved dynamical system are shown in panels (e,f)"
  where: Sec. IV B & Fig. 4(e)-(f)
equation: "xdot_i = -mu_i^neq(x_1, x_2) evaluated at digitized time points t of Fig. 4(e)-(f)"
inputs:
  c11: {quantity: preferred_phase_concentration, unit: dimensionless}
  c12: {quantity: preferred_phase_concentration, unit: dimensionless}
  c21: {quantity: preferred_phase_concentration, unit: dimensionless}
  c22: {quantity: preferred_phase_concentration, unit: dimensionless}
  chi: {quantity: reciprocal_coupling, unit: dimensionless}
  chip: {quantity: quartic_coupling, unit: dimensionless}
  alpha: {quantity: nonreciprocal_activity, unit: dimensionless}
  target_green: {quantity: oscillator_coordinate, unit: dimensionless, curve: {quantity: time, unit: dimensionless}}
  target_blue: {quantity: oscillator_coordinate, unit: dimensionless, curve: {quantity: time, unit: dimensionless}}
outputs:
  green_curve: {quantity: oscillator_coordinate, unit: dimensionless, curve: {quantity: time, unit: dimensionless}}
  blue_curve: {quantity: oscillator_coordinate, unit: dimensionless, curve: {quantity: time, unit: dimensionless}}
settings:
  dt: 0.02
  x1_init: -0.001
  x2_init: -0.001
stochastic: false
