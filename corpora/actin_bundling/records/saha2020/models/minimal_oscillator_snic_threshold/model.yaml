id: minimal_oscillator_snic_threshold
name: Minimal oscillator global limit-cycle onset (SNIC bifurcation threshold, Sec. IV B)
role: model
built_from:
  - minimal_oscillator_sec4b_shifted
stated:
  page: 7
  printed_page: "041009-7"
  quote: "frequency proportional to α. The phase-space trajectories of"
  where: Sec. IV B (global limit-cycle onset)
equation: "SNIC bifurcation where nontrivial fixed points of 4*x_1*(x_1^2 - c_1^2) + (chi + alpha)*x_2 = 0, 4*x_2*(x_2^2 - c_2^2) + (chi - alpha)*x_1 = 0 annihilate"
inputs:
  c1: {quantity: preferred_phase_concentration, unit: dimensionless}
  c2: {quantity: preferred_phase_concentration, unit: dimensionless}
  chi: {quantity: reciprocal_coupling, unit: dimensionless}
outputs:
  alpha_sn: {quantity: nonreciprocal_activity, unit: dimensionless}
settings:
  tol: 1.0e-10
stochastic: false
