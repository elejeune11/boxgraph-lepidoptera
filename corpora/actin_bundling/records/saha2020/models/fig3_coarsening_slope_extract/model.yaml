id: fig3_coarsening_slope_extract
name: Power-law coarsening exponent extraction from digitized R(t) curve (Fig. 3a)
role: processing
stated:
  page: 8
  printed_page: "041009-8"
  quote: "The variation of this coarsening length scale over time is shown in Fig. 3. We find a coarsening exponent of 0.22"
  where: Sec. IV C & Fig. 3(a)
equation: "beta = d(ln R)/d(ln t) by ordinary least squares over t in [t_lo, t_hi]"
inputs:
  R_curve: {quantity: domain_length, unit: dimensionless, curve: {quantity: time, unit: dimensionless}}
outputs:
  coarsening_exponent: {quantity: coarsening_exponent, unit: dimensionless}
settings:
  t_lo: 0.1
  t_hi: 12.0
stochastic: false
