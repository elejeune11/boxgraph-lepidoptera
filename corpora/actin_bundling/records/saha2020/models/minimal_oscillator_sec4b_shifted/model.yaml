id: minimal_oscillator_sec4b_shifted
name: Minimal zero-dimensional oscillator shifted to symmetric origin (0,0) (Sec. IV B)
role: model
variant_of: minimal_oscillator_sec4b
corrections:
  - equation: Sec. IV B (p. 7)
    change: "Shift the double-well potentials to symmetric centers c_i = |c_{i,2} - c_{i,1}|/2 around (x_1, x_2) = (0, 0), yielding xdot_1 = -4*x_1*(x_1^2 - c_1^2) - (chi + alpha)*x_2 and xdot_2 = -4*x_2*(x_2^2 - c_2^2) - (chi - alpha)*x_1."
    evidence: "Sec. IV B (p. 7) states that the minimal oscillator is linearized around (0, 0) with trajectories originating from (0, 0), and Fig. 4(g)-(i) (p. 8) show symmetric phase portraits centered at (0, 0) with stable nodes at (+/-0.24, +/-0.31) for alpha = 0.1 and centered limit cycles for alpha = 0.4 and 0.95. Using Fig. 1's unshifted c_{1,1}=0.2, c_{1,2}=0.5, c_{2,1}=0.1, c_{2,2}=0.5 directly in Eq. (7) has no fixed point at (0, 0) and converges to a static node with zero oscillation at both alpha = 0.4 and 0.95."
stated:
  page: 7
  printed_page: "041009-7"
  quote: "equations that are linearized around the point (0,0) develop an unstable pair of eigenvalues"
  where: Sec. IV B (Fig. 4e-i)
equation: "xdot_1 = -4*x_1*(x_1^2 - c_1^2) - (chi + alpha)*x_2; xdot_2 = -4*x_2*(x_2^2 - c_2^2) - (chi - alpha)*x_1"
inputs:
  c11: {quantity: preferred_phase_concentration, unit: dimensionless}
  c12: {quantity: preferred_phase_concentration, unit: dimensionless}
  c21: {quantity: preferred_phase_concentration, unit: dimensionless}
  c22: {quantity: preferred_phase_concentration, unit: dimensionless}
  chi: {quantity: reciprocal_coupling, unit: dimensionless}
  chip: {quantity: quartic_coupling, unit: dimensionless}
  alpha: {quantity: nonreciprocal_activity, unit: dimensionless}
outputs:
  omega: {quantity: oscillation_frequency, unit: dimensionless}
  x1_amp: {quantity: oscillator_coordinate, unit: dimensionless}
  x2_amp: {quantity: oscillator_coordinate, unit: dimensionless}
settings:
  dt: 0.05
  T: 160.0
  x1_init: 0.001
  x2_init: 0.001
stochastic: false
