# Quantities declared for graham2024_code (CytoSim_VASP_Arp_VCA)

# Concentrations
- id: vasp_tetramer_concentration
  name: VASP tetramer molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of native VASP tetramers [VASP-tet] in the 1 um radius simulated droplet.

- id: actin_concentration
  name: actin molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of actin ([F-actin], total pool [T-actin], or VCA-induced change delta_[F-actin]).

- id: arp23_concentration
  name: Arp2/3 complex molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of Arp2/3 complex in the concentration sweeps (0 to 150 nM).

- id: vca_concentration
  name: N-WASP VCA domain molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of VCA in the VCA-Arp2/3 sweep (0, 1, 2, 5, 10 uM).

# Lengths and geometries
- id: droplet_radius
  name: spherical droplet radius
  dimension: "[length]"
  description: Radius R_drop of the spherical CytoSim confinement space (cell).

- id: filament_length
  name: single actin filament contour length
  dimension: "[length]"
  description: Contour length of an individual actin filament (initial length, daughter nucleus, max_length = 2*pi*R, mean or median filament length).

- id: total_polymer_length
  name: total polymer contour length in droplet
  dimension: "[length]"
  description: Sum of contour lengths across filaments, CytoSim total_polymer monomer pool, or VCA competitor fiber length / max_length (L_Gmax).

- id: filament_segment_length
  name: discretized filament segment length
  dimension: "[length]"
  description: CytoSim fiber segmentation length L_seg (0.1 um).

- id: actin_monomer_rise
  name: actin monomer axial length increment
  dimension: "[length]"
  description: Filament contour length per polymerized actin monomer (2.7 nm = 0.0027 um; also VCA fiber min_length).

- id: molecular_radius
  name: particle or steric interaction radius
  dimension: "[length]"
  description: Radius of a spherical VASP tetramer solid (blob, 0.03 um) or actin filament steric core (0.0035 um).

- id: binding_distance
  name: crosslinker or nucleator binding capture distance
  dimension: "[length]"
  description: Capture distance r_bind for VASP binder (0.03 um) or Arp2/3 arpbinder (0.012 um).

- id: site_separation
  name: binding-site separation on VASP solid sphere
  dimension: "[length]"
  description: CytoSim solid separation parameter between grafted crosslinker anchor points on the VASP sphere (0.054 um = 0.9 * 2 * R).

- id: site_deviation
  name: binding-site placement deviation on VASP solid sphere
  dimension: "[length]"
  description: CytoSim solid deviation parameter controlling anchor point radial placement jitter (0.001 um).

- id: radial_coordinate
  name: radial distance from droplet center
  dimension: "[length]"
  description: Radial shell coordinate r or core/periphery cutoff radius r_cutoff (0.2, 0.4, 0.6 um).

- id: shell_thickness
  name: spherical radial histogram bin thickness
  dimension: "[length]"
  description: Radial bin width dR of spherical subvolume shells (0.025 um for 40 bins, 0.01 um for 100 bins).

# Times, rates, and speeds
- id: time
  name: elapsed simulation time or duration
  dimension: "[time]"
  description: Total simulation duration (600 s), ODE evaluation horizon, or actual final trajectory time in CSVs.

- id: time_step
  name: numerical integration time step
  dimension: "[time]"
  description: CytoSim implicit evolution time step dt (0.001 s).

- id: filament_growth_rate
  name: single-filament actin elongation speed
  dimension: "[length] / [time]"
  description: Barbed-end (plus) or pointed-end (minus) linear elongation/shrinking speed of a single actin filament (0.0103 um/s), or per-filament treadmilling rate.

- id: total_polymer_growth_rate
  name: total F-actin polymer elongation rate
  dimension: "[length] / [time]"
  description: Collective plus-end polymerization speed dP/dt summed across all N_fil filaments (um/s).

- id: vca_binding_speed_per_molecule
  name: per-molecule VCA effective fiber growth or unbinding speed
  dimension: "[length] / [time]"
  description: Empirical per-molecule VCA fiber growth speed k_bind (3.44 um/s; 2.96 in Cell 23) or unbinding speed k_unbind (2.7, 2.0, or 0 um/s).

- id: vca_fiber_growth_speed
  name: total VCA competitor fiber growth or off speed
  dimension: "[length] / [time]"
  description: Product k_bind * N_VCA (growing_speed) or -k_unbind * N_VCA (growing_off_speed) assigned to CytoSim fiber vca.

- id: binding_rate
  name: stochastic filament binding rate
  dimension: "1 / [time]"
  description: First-order attachment rate k_bind for VASP binder (1.0 1/s) or Arp2/3 arpbinder (0.5 1/s).

- id: unbinding_rate
  name: zero-force stochastic unbinding rate
  dimension: "1 / [time]"
  description: First-order detachment rate k_unbind for VASP binder (1.0 1/s) or Arp2/3 arpbinder/nucleator (0.005 1/s).

- id: nucleation_rate
  name: Arp2/3 daughter branch nucleation rate
  dimension: "1 / [time]"
  description: First-order rate k_nucleate at which trans-activated Arp2/3 nucleates a daughter filament (0.2 1/s).

# Mechanics, thermodynamics, transport
- id: force
  name: mechanical characteristic force
  dimension: "[force]"
  description: Brownian ratchet stall force (growing_force = 10.0 pN) or force-sensitive unbinding force (10.0 pN for VASP, 6 pN for Arp2/3).

- id: spring_stiffness
  name: linear spring stiffness
  dimension: "[force] / [length]"
  description: Confinement boundary stiffness (200 pN/um actin/VCA, 100 pN/um VASP), steric repulsion stiffness (1 pN/um), or crosslinker/fork link stiffness (10 pN/um VASP, 100 pN/um Arp2/3).

- id: flexural_rigidity
  name: filament bending flexural rigidity
  dimension: "[force] * [length] ** 2"
  description: Bending rigidity of F-actin (0.075 pN*um^2) or inert VCA fiber (0.00001 pN*um^2).

- id: angular_stiffness
  name: branch junction angular stiffness
  dimension: "[force] * [length]"
  description: Torsional stiffness of the CytoSim Arp2/3 fork couple (0.076 pN*um/rad).

- id: thermal_energy
  name: thermal energy scale k_B T
  dimension: "[energy]"
  description: Thermal energy k_B T (unstated in .cym configs; CytoSim built-in default 0.0042 pN*um).

- id: dynamic_viscosity
  name: medium dynamic viscosity
  dimension: "[force] * [time] / [length] ** 2"
  description: Dynamic viscosity eta of the CytoSim medium (0.5 pN*s/um^2 = 0.5 Pa*s).

- id: diffusion_coefficient
  name: translational diffusion coefficient
  dimension: "[length] ** 2 / [time]"
  description: Prescribed CytoSim diffusion parameter on graftedcrosslinker (10.0 um^2/s, ignored by Wrist) or couple arp23 (10 um^2/s), or Stokes-Einstein diffusivity of solid blob.

# Angles, counts, dimensionless ratios, analysis metrics
- id: branching_angle
  name: Arp2/3 filament branching angle
  dimension: dimensionless
  description: Equilibrium angle between mother and daughter actin filaments in CytoSim fork couple (1.344 rad = 77.0 deg in config0.cym vs 70 deg in paper).

- id: spatial_dimension
  name: simulation spatial dimension
  dimension: dimensionless
  description: Spatial dimensionality dim = 3 of CytoSim simul system.

- id: filament_count
  name: actin filament count
  dimension: dimensionless
  description: Number of actin filaments N_fil (initial 30, or mean count at t = 600 s).

- id: filament_nucleation_fold_change
  name: Arp2/3-induced filament count fold increase
  dimension: dimensionless
  description: Ratio N_fil(600) / N_fil(0) quantifying Arp2/3-driven filament amplification.

- id: molecule_count
  name: discrete molecule or monomer count
  dimension: dimensionless
  description: Number of VASP blobs (1000), Arp2/3 couples, VCA molecules (2522 per uM), or interpolated actin monomers.

- id: binding_valency
  name: VASP tetramer actin-binding valency
  dimension: dimensionless
  description: Number of graftedcrosslinker hands attached to each VASP sphere (4).

- id: vca_sequestration_factor
  name: VCA-to-G_max empirical sequestration multiplier
  dimension: dimensionless
  description: Dimensionless multiplier 5 in L_Gmax = 0.0027 * 5 * N_VCA.

- id: polymer_pool_multiplier
  name: total polymer pool multiplier over L_max
  dimension: dimensionless
  description: Multiplier 5 in total_polymer = 5 * 2 * pi * N_fil * R_drop.

- id: site_separation_factor
  name: binding-site separation fraction of blob diameter
  dimension: dimensionless
  description: Factor 0.9 in separation = 0.9 * 2 * r_blob (Cell 19 line 1265).

- id: binding_key
  name: CytoSim hand-fiber binding bitmask key
  dimension: dimensionless
  description: Integer bitmask binding_key isolating actin/VASP/Arp2/3 (key 1) from inert VCA fiber (key 2).

- id: simulation_steps
  name: total CytoSim time steps
  dimension: dimensionless
  description: Number of integration steps passed to CytoSim run command (600000).

- id: frame_count
  name: trajectory frame or snapshot count
  dimension: dimensionless
  description: Number of saved trajectory frames (nb_frames = 600; 601 snapshots including t = 0, or actual frame count in CSVs) or tail frames averaged (10).

- id: replicate_count
  name: simulation replicate count
  dimension: dimensionless
  description: Number of simulation trajectories configured (5) or analyzed in notebook/CSVs (5 for Arp2/3, 3 for Density_VCA, 2 for Fillength_VCA).

- id: bin_count
  name: histogram bin count
  dimension: dimensionless
  description: Number of radial histogram bins (40 or 100) or filament-length PDF bins (99).

- id: moving_average_half_window
  name: moving average half-window in snapshots
  dimension: dimensionless
  description: MOVAVG_NSNAPS = 5 snapshot half-window used for filament-length PDF averaging in Cell 31.

- id: fractional_f_actin_reduction
  name: fractional reduction in F-actin polymer length
  dimension: dimensionless
  description: Fractional F-actin decrease 1 - L(600) / L_no_vca(600) printed in Cell 25 (or target 1 / 27.67).

- id: fractional_f_actin_remaining
  name: fractional remaining F-actin polymer length
  dimension: dimensionless
  description: Ratio L(600) / L_no_vca(600) printed in Cell 23.

- id: radial_density_ratio
  name: normalized radial F-actin shell density ratio
  dimension: dimensionless
  description: Ratio rho(r, delta_r) / rho(R_drop) = (N(r) / (r^2 * dR)) / (3 * N_total / R^3).

- id: relative_actin_enrichment
  name: core-to-periphery relative actin enrichment
  dimension: dimensionless
  description: Ratio R.A.E. of core actin density to periphery actin density (code argmax(N) vs paper max(rho) definitions).

- id: monomer_count_ratio
  name: interpolated-to-continuum monomer count ratio
  dimension: dimensionless
  description: Ratio of points emitted by interpolateallmonomers(fc) to exact L_fil / l_mono.
