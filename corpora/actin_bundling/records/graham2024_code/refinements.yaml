- id: ref_ode_cell25_rtol
  run: run_ode_cell25
  setting: rtol
  factors: [1, 10, 100]
  mode: divide
  output: L_total
  tolerance: "0.01%"
  tolerance_basis: "added: well below 0.05% printed precision of [F-actin](600) = 27.68 uM"
  tolerance_added: true

- id: ref_vca_ode_1uM_ku2p7_rtol
  run: run_vca_ode_1uM_kunbind2p7
  setting: rtol
  factors: [1, 10, 100]
  mode: divide
  output: delta_F_actin
  tolerance: "0.1%"
  tolerance_basis: "added: well below the printed 1-sig-fig target 1 uM and 0.8913 uM ODE output"
  tolerance_added: true

- id: ref_vca_ode_1uM_ku0_rtol
  run: run_vca_ode_1uM_kunbind0
  setting: rtol
  factors: [1, 10, 100]
  mode: divide
  output: delta_F_actin
  tolerance: "0.1%"
  tolerance_basis: "added: verifies stiff saturation at L_Gmax under kunbind = 0 is converged in odeint"
  tolerance_added: true
