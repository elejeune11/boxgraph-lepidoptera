id: csv_vca_filament_stats
name: live PLOTCSVFILES VCA-Arp2/3 filament-count, F-actin sequestration, and replicate auditor (Cell 37)
role: processing
software: true
stated:
  file: CytoSimanalyze_VASP_Arp_VCA.ipynb
  lines: "2289-2355"
  quote: "fvar = filereadpath+'Fillength_VCA_Arp23_concsweep_steric_kunbind_0R_'+str(Rval)+'.csv'"
  where: "CytoSimanalyze_VASP_Arp_VCA.ipynb Cell 37 reading PLOTCSVFILES/Fillength_VCA_Arp23_concsweep_steric_kunbind_0R_*.csv"
equation: "delta_[F-actin](600) = ([L_sum(VCA=0)] - [L_sum(VCA)]) / (l_mono * N_A * (4/3)*pi*R^3)"
inputs:
  C_Arp: {quantity: arp23_concentration, unit: nM}
  C_VCA: {quantity: vca_concentration, unit: uM}
  R_drop: {quantity: droplet_radius, unit: um}
  l_mono: {quantity: actin_monomer_rise, unit: um}
outputs:
  N_fil_600: {quantity: filament_count, unit: dimensionless}
  N_fil_fold: {quantity: filament_nucleation_fold_change, unit: dimensionless}
  L_fil_mean_600: {quantity: filament_length, unit: um}
  L_sum_600: {quantity: total_polymer_length, unit: um}
  F_actin_conc_600: {quantity: actin_concentration, unit: uM}
  delta_F_actin_600: {quantity: actin_concentration, unit: uM}
  inferred_csv_replicates: {quantity: replicate_count, unit: dimensionless}
settings: {}
stochastic: false
