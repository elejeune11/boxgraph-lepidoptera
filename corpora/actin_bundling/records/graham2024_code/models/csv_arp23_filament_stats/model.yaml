id: csv_arp23_filament_stats
name: live PLOTCSVFILES Arp2/3 filament-count, polymer-length, and CDF reader (Cell 35)
role: processing
software: true
stated:
  file: CytoSimanalyze_VASP_Arp_VCA.ipynb
  lines: "1955-2010"
  quote: "def converttocdf(X,PX):"
  where: "CytoSimanalyze_VASP_Arp_VCA.ipynb Cell 35 reading PLOTCSVFILES/Fillength_Arp23_concsweep_stericR_*.csv"
equation: "N_fil_fold = N_fil(600) / N_fil(0); [F-actin](600) = (L_sum(600) / l_mono) / (N_A * (4/3)*pi*R^3); CDF via live converttocdf(X, df[595])"
inputs:
  C_Arp: {quantity: arp23_concentration, unit: nM}
  R_drop: {quantity: droplet_radius, unit: um}
  l_mono: {quantity: actin_monomer_rise, unit: um}
outputs:
  N_fil_600: {quantity: filament_count, unit: dimensionless}
  N_fil_fold: {quantity: filament_nucleation_fold_change, unit: dimensionless}
  L_fil_mean_600: {quantity: filament_length, unit: um}
  L_sum_600: {quantity: total_polymer_length, unit: um}
  F_actin_conc_600: {quantity: actin_concentration, unit: uM}
  L_fil_median_cdf: {quantity: filament_length, unit: um}
settings: {}
stochastic: false
