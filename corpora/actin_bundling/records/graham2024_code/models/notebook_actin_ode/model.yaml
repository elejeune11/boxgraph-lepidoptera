  F_actin_conc: {quantity: actin_concentration, unit: uM}
  dP_dt: {quantity: total_polymer_growth_rate, unit: um/s}
  treadmilling_rate: {quantity: filament_growth_rate, unit: um/s}
settings:
  k_grow_minus: 0.0
  k_shrink_plus: 0.0
  k_shrink_minus: 0.0
  t_grid_max: 600.0
  n_grid: 601
  eval_index: 600
  rtol: 1.0e-8
  atol: 1.0e-8
stochastic: false
