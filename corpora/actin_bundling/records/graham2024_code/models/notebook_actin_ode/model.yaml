id: notebook_actin_ode
name: live notebook actin polymerization ODE model() (Cell 21)
role: model
software: true
stated:
  file: CytoSimanalyze_VASP_Arp_VCA.ipynb
  lines: "1439-1451"
  quote: "def model(L,t, Nfil, TFactin, growkinetics, shrinkkinetics):"
  where: "CytoSimanalyze_VASP_Arp_VCA.ipynb Cell 21"
equation: "dP/dt = N_fil * (k_grow_plus * (1 - L/TFactin) + k_shrink_plus); dM/dt = N_fil * (k_grow_minus * (1 - L/TFactin) + k_shrink_minus); dL/dt = dP/dt + dM/dt"
inputs:
