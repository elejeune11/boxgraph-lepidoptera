id: config_parameter_audit
name: live CytoSim .cym config file auditor (branch angle, [VASP-tet], replicates, Stokes D)
role: processing
software: true
stated:
  file: Arp23_concsweep_steric/R_0_r_0/config0.cym
  lines: "101-118"
  quote: "angle = 1.344 % 77 degrees (bovine arp2/3, blanchoin 2000)"
  where: "All 40 Arp23_concsweep_steric and 200 VCA_Arp23_concsweep_steric_kunbind_0 .cym files"
equation: "theta_deg = angle_rad * 180/pi; [VASP-tet] = N_blob / (N_A * (4/3)*pi*R^3); D_Stokes = k_B T / (6*pi*eta*r_blob)"
inputs:
  kT: {quantity: thermal_energy, unit: pN*um}
outputs:
  branching_angle_deg: {quantity: branching_angle, unit: deg}
  vasp_tet_conc: {quantity: vasp_tetramer_concentration, unit: uM}
  vasp_stokes_D: {quantity: diffusion_coefficient, unit: um^2/s}
  arp23_config_replicates: {quantity: replicate_count, unit: dimensionless}
  vca_config_replicates: {quantity: replicate_count, unit: dimensionless}
settings: {}
stochastic: false
