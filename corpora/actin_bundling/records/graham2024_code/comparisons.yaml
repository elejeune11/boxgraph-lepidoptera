# ==============================================================================
# 4. Live radial-bin normalization check (settling factor-of-3 + right-edge bias)
# ==============================================================================

- id: cmp_uniform_sphere_outer_bin
  purpose: consistency
  computed: interp_uniform_rho_outer
  printed: uniform_sphere_expected_ratio
  note: "Cell 39's bulkfactor = 3*Nmax/Rmax^3 yields 0.9752 (close to 1.0, settling graham2024 q_radial_density_missing_one_third); residual -2.5% is due to right-bin-edge Radialbincenter = r_hi."

- id: cmp_uniform_sphere_r01_bin
  purpose: consistency
  computed: interp_uniform_rho_r01
  printed: uniform_sphere_expected_ratio
  note: "At r = 0.1 um (bin [0.075, 0.100]), evaluating 1/(r_hi^2*dR) at the right bin edge instead of shell volume underestimates a homogeneous sphere by 22.9% (0.7708 vs 1.0)."
