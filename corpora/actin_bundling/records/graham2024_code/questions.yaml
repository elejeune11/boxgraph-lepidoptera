    - run_csv_rae_arp23_sweep_paper_def
    - run_csv_rae_arp150_code
    - run_csv_rae_arp150_paper_def
  text: >
    MAJOR ANALYSIS-VS-PAPER DISCREPANCY: graham2024 SI Methods pp. 23-24 defines Relative Actin
    Enrichment (R.A.E.) as rho(c, delta_r) / rho(p, delta_r) where c and p are the shell radii at
    which the core and periphery actin DENSITIES rho(r) are maximal. However, CytoSimanalyze_VASP_Arp_VCA.ipynb
    Cells 39 (lines 2464-2469), 41 (lines 2647-2652), and 43 (lines 2852-2857) instead locate
    maxrcore = radvec_core[Ncore.idxmax()] and maxrperiphery = radvec_periphery[Nperiphery.idxmax()],
    maximizing raw monomer COUNT N(r) ~ r^2 * rho(r) BEFORE dividing by r^2! Because r^2 grows 9-fold
    across [0.2, 0.6) um, argmax(N) systematically pins maxrcore to the outer core edge (mean r = 0.571 um,
    only {0.525, 0.550, 0.575} um at 150 nM Arp2/3) instead of the true core density peak (mean r = 0.253 um).
    Running on PLOTCSVFILES/Density_Arp23_concsweep_steric reveals a 49.5% discrepancy at 150 nM Arp2/3:
    the code's argmax(N) formula yields R.A.E. = 0.5674 +/- 0.0470 (matching the published Fig. 5C bar height
    ~0.57 across all 8 concentrations: 0.000, 0.0715, 0.1153, 0.2334, 0.3715, 0.4560, 0.4849, 0.5674),
    whereas the paper's stated max(rho) formula yields 0.8482 +/- 0.0927 (0.000, 0.1019, 0.1576, 0.3468,
    0.5514, 0.7245, 0.7345, 0.8482). Additionally, np.std(relative_enrichment) pools all 50 (or 30)
    replicate-frames together rather than taking SD across independent replicates.
  citation:
    file: CytoSimanalyze_VASP_Arp_VCA.ipynb
    lines: "2464-2472"
    quote: "maxrcore = radvec_core[Ncore.idxmax()]"

