  text: >
    Four subtle numerical/indexing artifacts in CytoSimanalyze_VASP_Arp_VCA.ipynb analysis functions:
    (1) Radial density factor of 3 SETTLED: Cell 39 line 2455 computes bulkfactor = 3*Nmax/(Rmax^3),
    confirming graham2024 q_radial_density_missing_one_third (SI p. 23 omitted the factor of 1/3 in print).
    (2) Right-bin-edge shift: Cell 27 line 1728 defines Radialbincenter = Radialbinvec[:-1] + dR (adding
    a FULL bin width 0.025 um instead of 0.5*dR), assigning each shell [r_lo, r_hi] to its right edge r_hi.
    Because Cell 39 divides by r_hi^2*dR instead of exact shell volume (r_hi^3 - r_lo^3)/3, even a strictly
    homogeneous sphere is biased downward to 0.9752 at r = 1.0 um, 0.9508 at r = 0.5 um, and 0.7708 (-22.9%)
    at r = 0.1 um (0.333 at r = 0.025 um).
    (3) Monomer double-counting: Cell 27 interpolateallmonomers() appends both cyl1 and cyl2 for every
    segment while iterating mid in range(1, nmonomers-1), double-counting every interior vertex and
    omitting the final interior point (alpha = (nmonomers-1)/nmonomers); on a 5.5 um filament (0.1 um
    segments) this emits 2090 points vs 2037.0 exact (+2.6%), matching the excess monomer count in
    Density_Arp23_concsweep_stericR_0_r_0.csv (62,404 vs 61,394 from Lsum/0.0027).
    (4) Filament-length CDF shift & moving average: Cell 35/37 shifts X to right bin edges (+0.0328 um),
    integrates PX[0:iter] in converttocdf() (exclusive upper bound -> cdf[1]=0 and last bin dropped), and
    reads df[595] which averages 10 snapshots [590..599] via hidden MOVAVG_NSNAPS = 5 (not t = 591..600 s).
  citation:
