- id: kT_cytosim_default_added
  quantity: thermal_energy
  unit: pN*um
  printed: "0.0042"
  basis: "Neither config0.cym sweep sets kT; CytoSim defaults to kT = 0.0042 pN*um (T ~ 304.2 K, simul_prop.cc:28 as audited in chandrasekaran_cytosim)."
  alternatives: ["0.004116", "0.00428"]
  stands_for: "Thermal energy k_B T for computing Stokes-Einstein diffusivity of VASP solid blobs"

- id: probe_n_seg_straight_fil
  quantity: filament_length
  unit: um
  printed: "5.5"
  basis: "Representative t = 600 s filament length at 0 nM Arp2/3 (Fillength_Arp23 R_0 gives 5.5255 um) used to audit interpolateallmonomers() monomer-counting excess."
  alternatives: ["1.0", "6.283"]
  stands_for: "Test filament contour length for live interpolateallmonomers() audit"

- id: uniform_sphere_expected_ratio
  quantity: radial_density_ratio
  unit: dimensionless
  printed: "1.0"
  basis: "Exact analytical normalized radial density rho(r)/rho(R_drop) = 1.0 everywhere inside a homogeneous sphere, used to verify Cell 39's bulkfactor = 3*Nmax/Rmax^3 factor of 3 and quantify right-bin-edge bias."
  alternatives: ["3.0"]
  stands_for: "Expected normalized density ratio for a uniform spherical distribution"
