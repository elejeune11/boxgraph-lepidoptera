# ==============================================================================
# 2. Live notebook ODE models (Cell 21 model() & Cell 23/25 model_VCA())
# ==============================================================================

- id: run_ode_cell21
  model: notebook_actin_ode
  inputs:
    N_fil: init_n_fil_code
    TFactin: total_polymer_code
    k_grow_plus: actin_growing_speed_plus_code
    L0_per_fil: init_fil_length_code
    R_drop: droplet_radius_code
    l_mono: vca_min_length_code
  settings: {k_grow_minus: 0.0, k_shrink_plus: 0.0, k_shrink_minus: 0.0, t_grid_max: 1200.0, n_grid: 1200, eval_index: 600, rtol: 1.0e-8, atol: 1.0e-8}
  outputs:
    L_total: ode_cell21_L600
    F_actin_conc: ode_cell21_F600
    dP_dt: ode_cell21_dPdt600
    treadmilling_rate: ode_cell21_treadmilling
  note: "Reproduces Cell 21's exact linspace(0, 1200, 1200) grid where index 600 evaluates at t = 600.5004 s."

- id: run_ode_cell25
  model: notebook_actin_ode
  inputs:
    N_fil: init_n_fil_code
