# ==============================================================================
# 1. Config-generator formulas & live .cym config audit
# ==============================================================================

- id: run_arp23_count_sweep
  model: notebook_arp23_molecule_count
  inputs: {}
  sweep: {C_Arp: paper_arp23_count_vs_conc}
  settings: {}
  outputs: {N_arp: nb_arp23_count_curve}

- id: run_vca_config_params_1uM
  model: notebook_vca_config_params
  inputs:
    N_fil: init_n_fil_code
    R_drop: droplet_radius_code
    L0_per_fil: init_fil_length_code
    k_bind_vca: vca_k_bind_nb_code
    N_vca: vca_count_1uM_nb_code
    l_mono: vca_min_length_code
    gmax_factor: vca_gmax_factor_nb_code
    r_blob: vasp_blob_radius_code
  settings: {}
  outputs:
    total_polymer: nb_total_polymer_pred
    L_max_fil: nb_L_max_fil_pred
    L_max_total: nb_L_max_total_pred
    T_actin_conc: nb_T_actin_conc_pred
    F_actin_init_conc: nb_F_actin_init_pred
    k_bind_fiber: nb_vca_k_bind_fiber_1uM_pred
    L_Gmax: nb_vca_L_Gmax_1uM_pred
    site_separation: nb_site_separation_pred

- id: run_config_parameter_audit
  model: config_parameter_audit
  inputs:
    kT: kT_cytosim_default_added
  settings: {}
