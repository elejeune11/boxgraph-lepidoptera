    R_drop: droplet_radius_code
    l_mono: vca_min_length_code
  settings: {k_grow_minus: 0.0, k_shrink_plus: 0.0, k_shrink_minus: 0.0, t_grid_max: 600.0, n_grid: 601, eval_index: 600, rtol: 1.0e-8, atol: 1.0e-8}
  outputs:
    L_total: ode_cell25_L600
    F_actin_conc: ode_cell25_F600
    dP_dt: ode_cell25_dPdt600
    treadmilling_rate: ode_cell25_treadmilling
  note: "Evaluates Cell 21 model() on Cell 25's exact linspace(0, 600, 601) grid at true t = 600.0 s."

