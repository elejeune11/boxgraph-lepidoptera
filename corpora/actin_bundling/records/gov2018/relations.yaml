    follows the exact same square-root stiffness-over-restoring-force scaling (kappa^(1/2)*sigma^(-1/2))
    as Bois (2011)'s active-fluid hydrodynamic screening length ell = sqrt(eta/gamma) (eta^(1/2)*gamma^(-1/2)).
    The underlying bending-tension crossover length ell_mem = sqrt(kappa/sigma) = sqrt(2)*R_tube is the
    exact screening length that maps to ell in the flat-membrane dispersion isomorphism
    (rel_bois2011_flat_qs_reduces_eq12). Recorded as scales_as rather than same_as because R_tube and ell
