    critical onset wavenumber q_c = 1/[L*(D*tau*xi/eta)^(1/4)] when L = ell_mem = sqrt(kappa/sigma)
    and tau = 1/omega_max^qs = (kappa/sigma)/[Lambda*k_B*T*(sqrt(Pe_eff) - 1)^2]. Note that it is
    Gov's flat-membrane fastest mode — NOT gov2018/cylindrical_ring_critical_mode — that connects
    algebraically to hannezo2015/critical_inverse_wavenumber_si_corrected (see
    q_hannezo2015_structural_contrasts for the irreducible radius-dependent cylindrical contrast).
  assumptions:
    - "Supercritical convex-protrusive regime (A > A_c, Pe_eff > 1) and joint fast-membrane (xi -> 0), non-interacting (J -> 0) limit."
    - "Marginal-turnover matching tau = 1/omega_max^qs and screening length L = ell_mem = sqrt(kappa/sigma)."
    - "Tolerance 1e-4 accounts for float64 cancellation in flat_membrane_fastest_mode's Brent optimizer near xi ~ 10^-5 pN*s/um^3."

- id: rel_hannezo2015_tube_radius_scales_lh
  kind: scales_as
  a: gov2018/tube_equilibrium_radius
  b: hannezo2015/hydrodynamic_length
  mapping:
    eta: "kappa"
    xi: "sigma * 10**12"
  regime:
    kappa: [0.04, 0.2]
    sigma: [1.0, 10.0]
  provenance: proposed
  reason: >
    Gov (2018)'s Helfrich equilibrium cylindrical tube radius R_tube = sqrt(kappa/(2*sigma)) = ell_mem/sqrt(2)
    follows the exact same square-root stiffness-over-restoring-force scaling (kappa^(1/2)*sigma^(-1/2))
    as Hannezo et al. (2015)'s 2D cortical hydrodynamic screening length l_h = sqrt(eta/xi)
    (eta^(1/2)*xi^(-1/2)). Under the exact 2D viscous-elastic dictionary (eta = kappa/D, xi = sigma/D),
    ell_mem = sqrt(kappa/sigma) = sqrt(2)*R_tube equals l_h identically and serves as the screening
    length across all flat-membrane and myosin-wave dispersion relations between the two records.
    Recorded as scales_as rather than same_as because R_tube and l_h are distinct physical quantities
    (elastic tube radius vs. viscous-frictional screening length) differing by the cylinder geometric
    factor 1/sqrt(2).
  assumptions:
    - "Structural scaling correspondence only: bending rigidity kappa [pN*um] <-> 2D viscosity eta [Pa*s*m] and membrane tension sigma [pN/um] <-> 2D friction xi [Pa*s/m] up to dimensional scale D and the 1/sqrt(2) cylinder prefactor."


