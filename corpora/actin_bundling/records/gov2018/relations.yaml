    Pe_eff = Pe*c_0*df/dc > 1 gives the exact analytical fastest-growing mode
    k_max = sqrt(sqrt(Pe_eff) - 1)/ell and peak growth rate lambda(k_max) = (D/ell^2)*(sqrt(Pe_eff) - 1)^2.
    In the fast-membrane (xi -> 0), non-interacting (J -> 0) limit, Gov (2018)'s numerically
    maximized flat-membrane peak growth rate omega_max = max_{q > 0} omega(q) reduces identically
