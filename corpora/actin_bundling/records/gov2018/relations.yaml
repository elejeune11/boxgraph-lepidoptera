    Quantifies the accuracy of Bois Eq. (12) as a finite-friction approximation to Gov (2018)'s
    full 2x2 flat-membrane dispersion relation at J = 0. Expanding the 2x2 quadratic at small xi
    yields fractional error |omega - omega_qs|/|omega_qs| ~= (xi*D/sigma)*Pe_eff/(1 + q^2*ell_mem^2)^2.
    For low membrane friction xi in [0.5, 10] pN*s/um^3 (reaching Gov added.yaml's lower alternative
    xi = 10 pN*s/um^3), Bois Eq. (12) approximates Gov's growth rate within 15% (measured max error
