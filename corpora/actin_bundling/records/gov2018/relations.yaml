  limit:
    xi: "0"
    J: "0"
  regime:
    q: [1.0, 5.0]
    kappa: [0.08, 0.15]
    sigma: [1.5, 3.0]
    kBT: [0.0038, 0.0044]
    Lambda: [1.5, 4.0]
    H0: [-120.0, -80.0]
    ns: [8000.0, 12000.0]
