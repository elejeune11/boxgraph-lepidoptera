  assumptions:
    - "Supercritical convex-protrusive regime (A > A_c, equivalently Pe_eff > 1) throughout the sampled box."
    - "Fast-membrane (xi -> 0) and non-interacting CMC (J -> 0) limit."
    - "sqrt(H0**2 + 1e-300) evaluates |H_0| = -H_0 for negative convex H_0 < 0 under SymPy positive-symbol parsing."

