    omega_1 = omega_qs(q) and omega_2 = -k_off. Inside the unstable protrusion band where
    omega_qs(q) > 0 > -k_off, the dominant eigenvalue omega_real(q) reduces identically to
    Bois Eq. (12) under the flat-membrane active-fluid dictionary.
  assumptions:
    - "Vanishing myosin-II contractile coupling (A* -> 0)."
    - "Unstable convex-protrusive wavenumber band (omega_qs(q) > 0) so the protrusion branch dominates over the passive myosin detachment mode -k_off < 0."

