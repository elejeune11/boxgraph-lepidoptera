# Cross-record relations with bois2011 (Bois, Julicher & Grill, PRL 106:028103, 2011; uncited in gov2018)

- id: rel_bois2011_flat_qs_reduces_eq12
  kind: reduces_to
  a: gov2018/flat_membrane_dispersion_quasisteady
  b: bois2011/single_species_dispersion_eq12
  mapping:
    k: "q * 10**6"
    D: "Lambda * kBT / 10**12"
    Pe: "-kappa * H0 * (A + sigma * H0) / (kBT * ns * sigma)"
    c0: "n0"
    df_dc: "1"
    l: "sqrt(kappa / sigma) / 10**6"
  output_map:
    lam: omega_real
  limit:
    J: "0"
  regime:
    q: [1.0, 5.0]
    kappa: [0.08, 0.15]
    sigma: [1.5, 3.0]
    kBT: [0.0038, 0.0044]
    Lambda: [1.5, 4.0]
    H0: [-120.0, -80.0]
    ns: [8000.0, 12000.0]
    n0: [0.05, 0.10]
    J: [0.001, 0.05]
    A: [2000.0, 5000.0]
  provenance: proposed
  reason: >
    In the non-interacting CMC limit J -> 0, Gov (2018)'s quasi-steady flat-membrane dispersion
    relation omega_qs(q) = -q^2*(Lambda*k_B*T)*(1 - [-kappa*H_0*n_0*(A + sigma*H_0)/(k_B*T*n_s*sigma)]/(1 + q^2*kappa/sigma))
    is algebraically identical (exact symbolic identity at J = 0) to Bois et al. (2011) Eq. (12)
    lambda(k) = -k^2*D*(1 - Pe*c_0*f'(c_0)/(1 + k^2*ell^2)) with dimension-preserving port
    correspondences: wavenumber k = q, lateral diffusivity D = Lambda*k_B*T (Gov Eq. 2.5),
    membrane bending-tension screening length ell = sqrt(kappa/sigma) (with tension sigma playing
    the role of friction gamma and bending modulus kappa playing the role of viscosity eta),
    mean density c_0 = n_0, linear active force slope df/dc = 1, and effective active-curvature
    Peclet number Pe = -kappa*H_0*(A + sigma*H_0)/(k_B*T*n_s*sigma). Physically, eliminating the
    fast membrane height (xi -> 0) converts Gov's curvature-mediated lateral current J_disp + J_curv
    into an effective lateral drift velocity v_eff obeying the exact same screened Brinkman/Helmholtz
    operator (sigma - kappa*nabla^2)*v_eff = -(kappa*Lambda*H_0*(A + sigma*H_0)/n_s)*nabla n as
    Bois Eqs. (2)-(3). The identity holds across all signs of (H_0, A) (convex-protrusive H_0 < 0,
    A > 0; concave-contractile H_0 > 0, A < 0; and passive A = 0 where Pe_eff = -kappa*H_0^2*n_0/(k_B*T*n_s) < 0).
  assumptions:
    - "No direct CMC-CMC attractive interaction (J -> 0, dropping the Cahn-Hilliard term +(2*J*Lambda*n_0*q^2/n_s)*(1 - q^2/n_s))."
    - "Linear active force A*(n - n_0) maps to linear active stress slope df/dc = 1 around c_0 = n_0."
    - "Unit conversions: k [1/m] = 10^6 * q [1/um], D [m^2/s] = 10^-12 * Lambda*k_B*T [um^2/s], ell [m] = 10^-6 * sqrt(kappa/sigma) [um]."

- id: rel_bois2011_flat_disp_reduces_eq12
  kind: reduces_to
