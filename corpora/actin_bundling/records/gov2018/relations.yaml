  provenance: proposed
  reason: >
    In the conserved no-turnover limit tau -> oo (where Hannezo Main p. 2 cites Bois et al. 2011),
    Hannezo et al. (2015) SI Eq. (7) lambda(q) = -1/tau - D*q^2 + (sigma_a/xi)*q^2/(1 + (eta/xi)*q^2)
    reduces identically to Gov (2018)'s quasi-steady flat-membrane dispersion relation
    omega_qs(q) at J = 0 under the 2D viscous-elastic dictionary kappa = eta*D [pN*um],
    sigma = xi*D [pN/um] (so ell_mem = sqrt(kappa/sigma) = sqrt(eta/xi) = l_h, and at Hannezo's
    Main p. 3 parameters eta = 10^-5 Pa*s*m, xi = 10^9 Pa*s/m, D = 0.04 um^2/s this gives
    biophysical membrane moduli kappa = 0.4 pN*um = 100 k_B*T and sigma = 40 pN/um),
    Lambda = D/k_B*T, and active force A = sigma*|H_0| + sigma_a*k_B*T*n_s/(eta*D*|H_0|*n_0)
    (which sets Gov's Pe_eff = chi = sigma_a/(xi*D) identically for any reference (k_B*T, H_0, n_s, n_0);
    here evaluated at Gov's baseline k_B*T = 0.004 pN*um, H_0 = -100 um^-1, n_s = 10^4 um^-2, n_0 = 0.05
    giving k_B*T*n_s/(|H_0|*n_0) = 8 pN). By Gov's exact sign-reversal symmetry (H_0, A) -> (-H_0, -A),
    the concave-contractile gauge H_0 = +100 um^-1, A < 0 gives the identical dispersion.
  assumptions:
    - "Conserved no-turnover limit tau -> oo on the Hannezo Eq. (7) side and non-interacting CMC (J = 0) on the Gov quasi-steady flat-membrane side."
    - "Redundant membrane-gauge constants fixed to Gov's biophysical baseline (k_B*T = 0.004 pN*um, H_0 = -100 um^-1, n_s = 10^4 um^-2, n_0 = 0.05); Pe_eff = chi and ell_mem = l_h are gauge-invariant."
