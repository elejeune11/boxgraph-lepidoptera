  assumptions:
    - "Supercritical Hill regime Pe*c_0/(1 + c_0)^2 > 1 (Pe in [12, 40], c_0 in [0.5, 2.0])."
    - "Large-domain continuum limit (L/ell in [2000, 5000]) so Bois's discrete-wavenumber rounding error O((L/ell)^-2) is negligible."
    - "Quasi-steady non-interacting reference membrane (J = 0, xi = 1e-6 pN*s/um^3) at baseline Gov parameters giving tau_D = kappa/(sigma*Lambda*k_B*T) = 2.0 s."

