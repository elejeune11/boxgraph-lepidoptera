  provenance: proposed
  reason: >
    Directly links the primary flat-geometry 2x2 linear dispersion relation of Gov (2018)
    (Eqs. 2.1, 2.3, 2.4) to the primary single-species active-fluid dispersion relation Eq. (12)
    of Bois et al. (2011): in the joint fast-membrane (xi -> 0) and non-interacting (J -> 0)
    limit, Gov's dominant growth rate omega_real(q) converges to Bois's lambda(k) under
    ell = sqrt(kappa/sigma), D = Lambda*k_B*T, c_0 = n_0, df/dc = 1, and
    Pe = -kappa*H_0*(A + sigma*H_0)/(k_B*T*n_s*sigma).
  assumptions:
    - "Fast-membrane quasi-steady relaxation limit (xi -> 0) and vanishing direct CMC attraction (J -> 0)."
    - "Supercritical convex-protrusive unstable band (H_0 < 0, A > A_c, 0 < q < q_c, bounded away from the omega = 0 marginal crossing); the same mapping holds under simultaneous sign reversal (H_0, A) -> (-H_0, -A)."

