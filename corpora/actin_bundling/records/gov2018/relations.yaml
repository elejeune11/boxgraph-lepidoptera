    arbitrary constants (tolerance 1e-4 reflects float64 cancellation in flat_membrane_fastest_mode's
    Brent maximizer when xi reaches ~10^-5 pN*s/um^3).
  assumptions:
    - "Supercritical convex-protrusive regime (A > A_c, Pe_eff > 1) throughout the sampled box."
    - "Fast-membrane (xi -> 0, sampled across Gov's added.yaml span [10, 1000] pN*s/um^3) and non-interacting (J -> 0) limit."
