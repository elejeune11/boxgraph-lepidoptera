    geometric factor 1/sqrt(2).
  assumptions:
    - "Structural scaling correspondence only: bending rigidity kappa [pN*um] <-> viscosity eta [Pa*s] and membrane tension sigma [pN/um] <-> friction gamma [Pa*s/m^2] up to dimensional scale and the 1/sqrt(2) cylinder prefactor."

