- id: rel_hannezo2015_myosin_qs_same_eq7
  kind: same_as
  a: gov2018/myosin_wave_dispersion_quasisteady
  b: hannezo2015/dispersion_relation_eq7
  mapping:
    tau: "2 / k_off"
    D: "Lambda * kBT / 2"
    sigma_a: "-kappa * H0 * n0 * (A + sigma * H0) / (2 * kBT * ns) / 10**6"
    xi: "sigma / (Lambda * kBT) * 10**6"
    eta: "kappa / (Lambda * kBT) / 10**6"
    q: "q"
  output_map:
    lam: omega_real
  regime:
    q: [1.0, 5.0]
    kappa: [0.06, 0.14]
    sigma: [2.0, 5.0]
    kBT: [0.0038, 0.0044]
    Lambda: [1.5, 4.0]
    H0: [-120.0, -80.0]
    ns: [8000.0, 12000.0]
    n0: [0.04, 0.08]
    A: [1000.0, 3000.0]
    A_star: [20000.0, 80000.0]
    k_on: [0.08, 0.20]
    k_off: [0.05, 0.25]
  provenance: proposed
  reason: >
    Inside the propagating myosin-wave regime (discriminant b^2 - 4*c_0 < 0, where omega_imag > 0
    for q > q_omega), Gov (2018) Section 5(a)'s quasi-steady 2x2 (n, m) dispersion splits the
    trace equally across the complex-conjugate pair, giving real growth rate
    omega_real(q) = -b(q)/2 = -k_off/2 - (Lambda*k_B*T/2)*q^2 + [-kappa*Lambda*H_0*n_0*(A + sigma*H_0)/(2*n_s*sigma)]*q^2/(1 + (kappa/sigma)*q^2).
    This is algebraically identical (exact to machine precision, zero arbitrary constants) to
    Hannezo et al. (2015) SI Eq. (7) lambda(q) = -1/tau - D*q^2 + (sigma_a/xi)*q^2/(1 + (eta/xi)*q^2)
    with effective turnover time tau = 2/k_off, effective diffusivity D = Lambda*k_B*T/2,
    effective 2D viscosity eta = kappa/(Lambda*k_B*T) [Pa*s*m], effective 2D friction
    xi = sigma/(Lambda*k_B*T) [Pa*s/m] (preserving screening length sqrt(eta/xi) = sqrt(kappa/sigma) = ell_mem),
    and effective 2D active stress sigma_a = -kappa*H_0*n_0*(A + sigma*H_0)/(2*k_B*T*n_s) [pN/um -> 10^-6 Pa*m].
    The factor of 2 cancels identically in both dimensionless groups: chi = Pe_eff = -kappa*H_0*n_0*(A + sigma*H_0)/(k_B*T*n_s*sigma)
    and phi = kappa*k_off/(sigma*Lambda*k_B*T) = ell_mem^2*k_off/D_CMC. Consequently, Gov's
    oscillatory wave instability has Hannezo's exact finite-wavenumber Type-I onset threshold
    Pe_eff,c = (1 + sqrt(phi))^2 (Eq. 10) and onset wavelength lambda_c = 2*pi*(kappa*Lambda*k_B*T/(sigma*k_off))^(1/4)
    (Eq. 3), explaining the small-q negative dip of omega'(q) in Gov Fig. 4(c) top panel.
    Whereas Hannezo Eq. (7) is strictly real (stationary rings), Gov's wave branch also carries
    nonzero acoustic frequency omega_imag(q) > 0 driven by A* and k_on.
  assumptions:
    - "Oscillatory propagating-wave branch (b^2 < 4*c_0, i.e., omega_imag > 0 throughout the sampled regime; min omega_imag = 0.173 rad/s across 1000 samples). Outside this branch (b^2 >= 4*c_0, e.g., A* -> 0 or q < q_omega), omega_real switches to the real quadratic root and instead approaches conserved omega_qs(q)."
    - "Quasi-steady fast-membrane limit (xi_mem -> 0) and vanishing direct CMC attraction (J = 0), already built into gov2018/myosin_wave_dispersion_quasisteady."
    - "Unit conversions: eta [Pa*s*m] = 10^-6 * kappa/(Lambda*k_B*T), xi [Pa*s/m] = 10^6 * sigma/(Lambda*k_B*T), sigma_a [Pa*m] = 10^-6 * [-kappa*H_0*n_0*(A + sigma*H_0)/(2*k_B*T*n_s)]."

