notes: >
  Read stage of N. S. Gov, Phil. Trans. R. Soc. B 373: 20170115 (2018), a 13-page
  review article presenting the continuum membrane-CMC-cytoskeleton framework
  (Eqs. 2.1-2.9, 5.1-5.2) and reviewing cellular protrusions, cylindrical tube
  constriction/ring instabilities, and active membrane waves/oscillations. All 13
  pages of extracted text (text/page-001.txt to page-013.txt) and all 10 content
  page images (pages/page-001.png to page-010.png) were inspected directly to verify
  every Greek symbol (kappa, kappa', sigma, xi, Lambda, omega, omega', omega'',
  lambda), sign, subscript, and numerical range (notably page 3 where OCR garbles
  "kappa/k_B T ~ 1-100" and "a/R ~ 0.1-10^-3", and page 9 where OCR reads
  "V = 0.67 um/min" as "mm/min").

  In scope: (1) Section 2 continuum Helfrich + CMC free energy density (Eq. 2.1),
  finite-CMC-rigidity bending energy (Eq. 2.2), overdamped membrane height equation
  (Eq. 2.3), CMC conservation law and all four currents J_diff, J_disp, J_agg, J_curv
  (Eqs. 2.4-2.8), Einstein relation D = Lambda*k_B*T, molecular scale definitions
  (a = 1/H_0 = 1/sqrt(n_s), R = 1/H), and curvature-sorting steady-state enrichment
  (Eq. 2.9) plus its non-dilute Lambert-W extension retaining J_disp (Eq. 2.6);
  (2) Section 2-3 flat-membrane linear stability dispersion relation omega(q) (full
  2x2 and quasi-steady xi->0 limit) for passive, convex-protrusive (H_0<0, A>0),
  concave-contractile (H_0>0, A<0), and concave-protrusive negative-feedback
  (H_0>0, A>0) regimes, exact instability thresholds (A_c, sigma_c, q_c, lambda_c,
  passive J_c), fastest-growing mode (q_max, lambda_max = 2*pi/q_max), and a
  reconstructed 1D nonlinear PDE solver of Eqs. (2.1, 2.3, 2.4);
  (3) Section 4 reconstructed cylindrical tube equilibrium radius and axisymmetric
  ring/constriction dispersion relation (passive J=0 and active contractile) plus
  the stated-in-words critical tube length condition lambda_c = 2*L_c;
  (4) Section 5(a) myosin-contractility active height dynamics (Eq. 5.1), myosin
  adsorption/desorption kinetics (Eq. 5.2), full 3x3 complex dispersion relation
  omega(q) = omega'(q) + i*omega''(q), quasi-steady analytical dispersion & wave
  speed c_ana, stated scaling laws omega''(q) proportional to q*c and c proportional
  to sqrt(A*), and a reconstructed 1D linearized wave PDE solver verifying leading
  actin/CMC and trailing myosin;
  (5) non-runnable records for cited models whose equations are omitted from Gov
  (2018): 2D closed-contour simulations [35], non-local myosin force kernel [116],
  two-curvature convex+concave wave model [41] (which prints V = 0.67 um/min in
  Fig. 5d), and calcium mechanochemical feedback model [123].

  Left out: (1) figure digitization of plotted numerical curves in Figs. 3(c), 4(c-d),
  and 5(d), which belongs to the separate digitize stage (Figs. 1, 2a-b, 3a-b,d, 4a-b,
  5a-c, and 6 are uncalibrated schematics, and Figs. 2e-f are fluorescence/AFM
  micrographs with scale bars 10 um and 4.0 um only); (2) bibliographic metadata and
  historical prose that feed no quantitative model.

  Key analytical findings recorded in questions.yaml: (1) cross-reference typo on
  p. 6 col. 2 citing "(figure 2f)" (HIV viral budding) instead of figure 2(b) for
  the linear stability dispersion curve; (2) unit/meaning shift of n between
  Section 2 / Eq. (2.1)-(2.2) / Fig. 5(d) (dimensionless coverage fraction) and
  Fig. 4(d) (plotted in um^-3 and captioned as actin density); (3) Eq. (2.9) drops
  the dispersive current J_disp (Eq. 2.6), valid only in the dilute limit
  n << k_B*T*n_s/(kappa*H_0^2); (4) Eq. (2.1) uses ideal-gas entropy n(log(n)-1)
  rather than lattice-gas entropy, providing no steric upper bound n <= 1 in nonlinear
  dynamics; (5) in Eq. (2.1) at A = 0, allowing membrane bending restores T_c from
  the rigid-membrane value (2*J*n_0 - kappa*H_0^2*n_0)/(k_B*n_s) back up to
  2*J*n_0/(k_B*n_s) at sigma = 0 rather than raising T_c above the H_0 = 0 baseline;
  (6) none of the simulation parameter values for reprinted Figs. 2(b-d), 3(c),
  4(c-d), and 5(d) are printed in this review.
