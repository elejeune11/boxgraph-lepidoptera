- id: q_passive_Tc_claim
  kind: overstated_claim
  about:
    - free_energy_density_eq2_1
    - flat_membrane_dispersion
    - flat_membrane_passive_spinodal
  text: >
    On p. 4 col. 1, Gov writes that 'The curvature effects can aid the aggregation by
    raising the critical temperature for the initiation of phase separation [23]'.
    However, linear stability of the printed free energy Eq. (2.1) at A = 0 gives
    J_c(sigma > 0, q -> 0) = (k_B*T*n_s + kappa*H_0^2*n_0)/(2*n_0) and
    J_c(sigma = 0, q -> 0) = k_B*T*n_s/(2*n_0). Thus, within Eq. (2.1), membrane
    flexibility raises T_c only relative to a rigid flat membrane (h = 0, where the
    +kappa*H_0^2*n^2/2 self-energy lowers T_c); it cancels H_0 at sigma = 0 and never
    raises T_c above the flat uncurved (H_0 = 0) spinodal temperature 2*J*n_0/(k_B*n_s).
  citation:
