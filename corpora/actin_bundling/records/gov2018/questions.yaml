    33 runnable, 4 non-runnable) against totz2024 measurements (37 origin: measured and 24 origin:
    reported entries), nor in the reverse direction (0 entries total). Neither paper cites the
    other; although three verified ModelAtlas relations link the linearized 4th-order flat
    bending-compression operator (totz2024/rel_gov2018_rr_width_approx_flat_lambda_c,
    totz2024/rel_gov2018_flat_lambda_c_scales_rr_width, totz2024/rel_gov2018_rr_width_scales_tube_radius),
    no model in gov2018 genuinely predicts any measurement of totz2024 on butterfly wing-scale
    conditions, and gov2018 itself contains 0 origin: measured data.
    (1) Measured inter-bundle actin spacings and protoridge widths (3 origin: measured curves:
    totz2024/d_fig3G_L_mean spanning 1.277-1.598 um across 39.6%-41.0% development in V. cardui,
    overall mean 1.482 um; totz2024/d_fig3G_L_median_iqr with medians 1.282-1.642 um; and
    totz2024/d_fig4C_species_spacings spanning 0.341 um [C. eurytheme flat L_2,A], 0.360 um
    [A. vanillae flat L_2,B], 0.801 um [C. eurytheme ridged L_1,A], 0.910 um [A. vanillae ridged
    L_1,B], and 1.601 um [V. cardui L]; plus reported L_ref_Vcardui_p6, L_Vcardui_p8, L_tableS1
    = 1.6 um):
    (a) Zero stated or measured physical inputs in either paper: flat_membrane_instability_thresholds
    (lambda_c) and flat_membrane_fastest_mode (lambda_max) require 7 and 10 inputs respectively
    (kappa, sigma, k_B*T, H_0, n_s, n_0, A, plus Lambda, J, xi). Gov (2018) is a theoretical review
    printing 0/7 and 0/10 numerical parameter values — every value in gov2018/added.yaml is a
    reader-chosen generic lipid-bilayer illustration (giving baseline lambda_c = 0.901 um and
    lambda_max = 1.346 um, while across gov2018/added.yaml's own alternatives lambda_c ranges from
    0.341 um to 1.801 um or vanishes entirely into linear stability for kappa = 0.0411 pN*um,
    sigma = 10 pN/um, n_s = 40000 um^-2, or n_0 = 0.02). Likewise, totz2024 measures 0/7 and 0/10
    of Gov's inputs on developing butterfly wing scales (no curved membrane proteins H_0, n_s, n_0,
    no active protrusive force density A, no positive bare membrane tension sigma, and no kinetic
    parameters Lambda, xi, J). Totz's nascent-cuticle plate bending modulus D = Y*h^3/(12*(1 - nu^2))
    = 0.889-3.29 pN*um (216-799 k_B*T at Y = 1-3.7 MPa, up to 21,606 k_B*T at 10^8 Pa) is a derived
    solid-plate quantity from literature h = 20 nm and assumed/lower-bound Y, not a measured fluid
    lipid-bilayer kappa.
    (b) Why the verified linear operator correspondence does not yield a cross-validation: under
    rel_gov2018_rr_width_approx_flat_lambda_c (sigma = 0, kappa = D, A = (h*Y*g)*(k_B*T*n_s)/(D*|H_0|*n_0)),
    lambda_c equals L_Euler = pi*h / sqrt(3*(1 - nu^2)*g). First, growth strain g is never
    independently measured in totz2024 (Table S1's 0.0-0.7% and Fig. 3H's contours are inferred a
    posteriori from L and w_0 via Eq. 3). Second, L in totz2024 is an externally imposed,
    time-invariant clamped actin-bundle scaffold spacing (constant across Fig. 3G while g and w_0
    grow; Totz p. 8 explicitly contrasts clamped first-order buckling against free-surface wrinkling
    wavelength selection, and p. 10 leaves upstream actin-bundle spacing unmodeled), not L_Euler(g).
    At Table S1 / Fig. 4C's g = 0.5%, L_Euler = 0.592 um (0.501 um at 0.7%, 0.419 um at 1.0%, and
    infinity at g = 0 for Y_min = 3.5 MPa), which is 2.7-3.8x shorter than V. cardui's L = 1.60 um
    (whose critical strain is g_c = 0.0685%, placing mature protoridges with peak a/h = 1.14-3.07
    deep in the nonlinear FvK stretching regime sqrt(1 + 3*a^2/(4*h^2)) = 1.41-2.84, absent from
    Gov's linear fluid-membrane model). Third, unimodal fluid-membrane instability and conserved-CMC
    coarsening cannot reproduce A. vanillae's bimodal alternating upper-surface spacings (0.910 and
    0.360 um at identical g, Y, h, p) or C. eurytheme's bundle-thickness-narrowed lower lamina
    (0.341 um), and all three spacing data are multi-timepoint or multi-species curves indexed by
    pupal_development_fraction or species_spacing_index (neither an input to any gov2018 model).
