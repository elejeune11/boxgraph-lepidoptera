    axisymmetric circumferential-coupling stability analysis of Eq. (2.1) at J = 0, A = 0,
    R_0 > 1/H_0 is necessary (since n_0 <= 1) but not sufficient by itself: overcoming
    entropic dispersion requires H_0*R_0*n_0 > 1 + 2*sqrt(k_B*T*n_s/(k_B*T*n_s + H_0^2*kappa*n_0)).
    At dilute coverage n_0 = 0.05 with R_0 = 0.15 um and H_0 = 100 um^-1 (R_0*H_0 = 15 > 1),
    the passive cylinder remains stable while active contractility (A < 0) destabilizes it;
    passive J = 0 instability requires higher coverage (e.g. n_0 = 0.25) or larger R_0.
