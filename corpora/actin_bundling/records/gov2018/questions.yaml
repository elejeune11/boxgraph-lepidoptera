    [2.5, 6.5] um while 450 (10.3%) exceed 6.5 um (up to 15.86 um) and 344 (7.9%) fall below 2.5 um
    (down to 2.305 um) (at RMS 1.660 um: 3,799/4,374 = 86.9% in band; at WT 2.388 um: 3,282/4,374 =
    75.0% in band, 1,092 > 6.5 um; at low-actin 2.571 um: 3,092/4,374 = 70.7% in band); (c) under
    exact c_theta geometry (q_audit_cylinder_ctheta_geometry), taking xi -> 0 sends lambda_max to
    2*pi*R_0 = 9.67-16.15 um (not reproduced); and (d) kkv1 rings are non-periodic, non-stationary,
