    it computes lambda_max = 3.908 um (-0.592 um, -13.2%, 0.30 SD; lambda_c = 2.353 um, L_c =
    1.176 um, omega_max = 0.01896 s^-1): verdict reproduced. Open methodological caveats and
    sensitivity: (a) Choice of unperturbed R_0 for an already-pearled tube is open, yet all 6
    definitions reproduce [2.5, 6.5] um at baseline (min constricted 0.878 um -> 2.939 um; mean
    1.539 um -> 3.908 um; volume-preserving RMS 1.660 um -> 4.066 um; WT Fig. 4F pre-constriction
    2.388 um -> 4.939 um; Fig. 3C low-actin unconstricted mean 2.571 um -> 5.141 um; max dilated
