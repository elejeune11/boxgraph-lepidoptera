    dS = 2*pi*R*sqrt(1 + h'^2)*dz, thereby omitting the 1/sqrt(1 + h'^2) slope factor in the
    exact principal curvature c_theta = 1/(R*sqrt(1 + h'^2)). Under exact surface-of-revolution
    geometry: (1) a bare Helfrich cylinder (n_0 = 0, H_0 = 0) at equilibrium tension
    sigma_eq = kappa/(2*R_0^2) has H_hh = (kappa/R_0^4)*(1 + (q*R_0)^4) with no (q*R_0)^2 term;
    (2) the anisotropic circumferential-only Eq. (2.1) model (1/2)*kappa*[(c_theta - n*H_0)^2 + c_z^2]
    at A = 0, J = 0 has strictly positive det(H) = (kappa/R_0^4)*[k_B*T*n_s/n_0 + (q*R_0)^4*(kappa*H_0^2 + k_B*T*n_s/n_0)] > 0
    for all q, R_0, H_0, n_0, so the passive J = 0 instability in run_cyl_ring_disp_passive
    and the passive threshold in q_cylinder_passive_condition_coverage are artifacts of dropping
    1/sqrt(1 + h'^2) from c_theta. Under exact geometry, passive J = 0 cylindrical instability
    requires either isotropic curvature coupling (c_theta + c_z - n*H_0)^2 or differential/finite
    CMC rigidity (kappa' != kappa in Eq. 2.2 or linear-in-n bending (1/2)*kappa_p*n*(c_theta - H_0)^2,
