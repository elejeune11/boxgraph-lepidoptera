    0.1 um, stage 16 WT confocal Lifeact-mEGFP, n > 150 rings): directly tests Hannezo Main p. 5's
    explicit citation of Gov's group (ref-12, Srivastava et al. 2013) against Hannezo's own measured
    WT embryonic dorsal-trunk radius R_0 = 2.388 um (R0_trachea_hannezo_wt_added, half of Fig. 4F's
