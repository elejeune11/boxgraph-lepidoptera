    quote: "raising the critical temperature for the initiation of"
    where: "Section 2, p. 4 col. 1"

- id: q_ideal_gas_entropy_no_steric_cap
  kind: reading
  about:
    - free_energy_density_eq2_1
    - flat_membrane_protrusion_pde_1d
  text: >
    Equation (2.1) uses the dilute ideal-gas entropy k_B*T*n_s*n*(log(n) - 1) rather than
    the lattice-gas entropy k_B*T*n_s*[n*log(n) + (1 - n)*log(1 - n)], even though n is
    described as a coverage fraction (0 <= n <= 1) and Eq. (2.2) uses (1 - n). Without
    the steric (1 - n)*log(1 - n) barrier (and with Monge-gauge small-slope linearization),
    long-time nonlinear growth in Eqs. (2.1, 2.3, 2.4) above threshold A > A_c has no
    upper bound enforcing n <= 1; our reconstructed 1D PDE run therefore restricts the
    integration horizon t_end to the bounded regime before saturation breakdown.
  citation:
