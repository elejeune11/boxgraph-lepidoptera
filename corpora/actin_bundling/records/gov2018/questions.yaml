    printed_page: "2"
    quote: "The third term gives the"
    where: "Eq. 2.1"

- id: q_mean_curvature_factor_two_convention
  kind: reading
  about:
    - free_energy_density_eq2_1
    - flat_membrane_dispersion
    - cmc_molecular_scales
  text: >
    Equation (2.1) writes the bending energy as (1/2)*kappa*(H - n*H_0)^2 and calls H
    'the local mean curvature' while p. 3 defines R = 1/H. In standard Helfrich notation,
    the prefactor 1/2 corresponds to total curvature H = c_1 + c_2 (approx nabla^2 h in
    the Monge gauge, and 1/R for a cylinder where c_2 = 0), whereas using the geometric
    mean curvature (c_1 + c_2)/2 would require a prefactor of 2*kappa to preserve the
    standard bending stiffness (1/2)*kappa*(nabla^2 h)^2. All flat-membrane and cylindrical
    models in this record adopt H = c_1 + c_2 = nabla^2 h (1/R on a cylinder), consistent
    with Fig. 1(b) (H < 0 at an outward convex bump) and R = 1/H.
  citation:
