  text: >
    Cross-paper ModelAtlas comparison with bois2011 (Bois, Julicher & Grill, PRL 106:028103, 2011;
    uncited in gov2018) reveals an exact algebraic isomorphism at J = 0, xi -> 0 between Gov's
    flat-membrane CMC-cytoskeleton dispersion and Bois Eq. (12) (rel_bois2011_flat_qs_reduces_eq12,
    rel_bois2011_flat_disp_reduces_eq12, rel_bois2011_myosin_qs_reduces_eq12,
    rel_bois2011_flat_fastest_reduces_eq12_peak), alongside four irreducible structural differences
    that prevent exact equivalence outside that limit:
    (1) Tangential hydrodynamic advection vs. normal-force curvature drift & finite membrane drag xi:
    Gov (p. 3 col. 1) explicitly excludes direct tangential propulsion of CMCs; effective
    Brinkman-like lateral drift (sigma - kappa*nabla^2)*v_eff = -(kappa*Lambda*H_0*(A + sigma*H_0)/n_s)*nabla n
    emerges only after eliminating fast membrane height (xi -> 0). Finite membrane friction xi > 0
    slows growth rates by ~(xi*D/sigma)*Pe_eff/(1 + q^2*ell_mem^2)^2 (~29% at q_max and up to 43%
    across the unstable band at Gov's baseline xi = 100 pN*s/um^3, though <= 12.1% for xi <= 10 pN*s/um^3)
    while preserving the exact marginal cutoff q_c = sqrt(Pe_eff - 1)/ell_mem, and enables damped
    oscillatory waves (omega_imag != 0) for concave-protrusive negative feedback (H_0 > 0, A > 0),
    whereas Bois Eq. (12) is strictly real for all Pe.
    (2) Dispersive bending-resistance floor (J_disp) vs. Hill active-stress saturation:
    Under the dispersion dictionary, Gov's effective Peclet number is
    Pe_eff = Pe_act - alpha*n_0 = kappa*|H_0|*n_0*(|A| - sigma*|H_0|)/(k_B*T*n_s*sigma), where
    alpha*n_0 = kappa*H_0^2*n_0/(k_B*T*n_s) measures J_disp/J_diff (Eqs. 2.5-2.6). While both
    thresholds diverge as density^-1 in the dilute limit (rel_bois2011_Ac_scales_Pecrit_dilute),
    at biophysical coverage (alpha*n_0 ~= 1 for n_0 = 0.05, kappa/k_B*T = 20, H_0^2 = n_s), J_disp
    creates an n_0-independent threshold floor A_c = sigma*|H_0| + sigma*k_B*T*n_s/(kappa*|H_0|*n_0)
    (flattening d(ln A_c)/d(ln n_0) from -1 to -1/(1 + alpha*n_0) ~= -0.5) and never re-stabilizes
    at high density (linear active force and ideal-gas entropy, cf. q_ideal_gas_entropy_no_steric_cap),
    whereas Bois's Hill stress f(c) = c/(1 + c) gives a U-shaped stability boundary
    Pe_c proportional to (1 + c_0)^2/c_0 that re-stabilizes at high c_0 and supports bounded
    Hamiltonian steady states (Eqs. 9-10).
    (3) Oscillatory waves & wave-speed scaling (myosin_wave_dispersion_quasisteady vs.
    asdm_dispersion_eq15 and characteristic_velocity): Although Gov's quasi-steady 2x2 (n, m)
    Jacobian is an exact realization of Bois's general multi-species Eq. (15) (D_1 = D, D_2 = 0,
    R_1 = 0, R_2 = k_on*n - k_off*m, non-advected m, antagonistic active driving d_n f > 0,
    d_m f < 0), it differs fundamentally from Bois's ASDM realization (asdm_dispersion_eq15):
    conservation of n forces det(M(0)) = 0 and produces acoustic traveling waves omega''(q) ~= c_ana*q
    with c_ana = sqrt(U_m * ell_mem * k_on) proportional to (A*)^(1/2)*kappa^(+1/2)*sigma^(-1/2)
    (square root of active force and opposite +1/2 stiffness exponent relative to Bois's
    U = (zeta*Delta_mu)_0/sqrt(eta*gamma) proportional to (zeta*Delta_mu)_0^1*eta^(-1/2)*gamma^(-1/2)
    because kappa also drives the curvature-sorting current J_curv), whereas Bois's ASDM has
    non-conserved reactions (det(A(0)) = rho_a*rho_s > 0) and unidirectional stress (d_s f = 0),
    yielding k = 0 Hopf oscillations (omega''(0) > 0) rather than acoustic waves.
    (4) Cylindrical ring geometry vs. 1D flat screening and finite-domain quantization:
    On a cylinder (cylindrical_ring_dispersion), the finite q = 0 radial stiffness H_hh(0) = kappa/R_0^4
    produces a quartic denominator 1 + (1 - H_0*R_0*n_0)*(q*R_0)^2 + (q*R_0)^4 incompatible with
    Bois's quadratic 1 + k^2*ell^2, and absorbs the spontaneous curvature self-energy kappa*H_0^2
    at q -> 0 (giving long-wavelength effective Peclet number Pe_cyl = -A*H_0*R_0^2*n_0/(k_B*T*n_s)
    with no sigma*|H_0| floor even at finite xi > 0). Conversely, Gov's critical cylindrical tube
    length L_c = pi/q_c = lambda_c/2 (p. 7) uses the exact same fundamental no-flux Neumann mode
    q_1 = pi/L (beta = 1, n = 1) as Bois Eq. (13) (k = beta*n*pi/L).
  citation:
    page: 3
    printed_page: "3"
    quote: "assume here that the CMC are not directly propelled"
    where: "Section 2, p. 3 col. 1"

