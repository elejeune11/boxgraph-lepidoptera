    Cross-validation of all 37 gov2018 models (33 runnable, 4 non-runnable) against all 214
    origin: measured data in sekine2024 (wild-type embryonic Drosophila tracheal dorsal trunk)
    yields 1 validation entry in gov2018/validations.yaml
    (val_cyl_ring_lambda_max_vs_sekine_cable_interval, verdict: not reproduced) and 0 entries in
    the reverse direction (sekine2024 models vs gov2018 data):
    (1) Included validation — cylindrical_ring_critical_mode.lambda_max vs
    sekine2024/cable_interval_in_vivo (450 +/- 13.2 nm, early stage 16 fixed btl>lifeact::GFP
    Airyscan, N = 8 embryos, n = 294 cables): evaluated at R_0 = 1.971 um
    (R0_trachea_sekine_0min_added, half of Sekine Fig. 1j's measured t = 0* min mean dorsal-trunk
    diameter D = 3.942 um), k_B*T = 0.004114 pN*um (298 K = 25 degC matching
    sekine2024/temp_experiment), and Gov's baseline active-contractile plasma-membrane parameters
    (kappa = 0.0823 pN*um, Lambda = 2.43 um/(pN*s), H_0 = 100 um^-1, n_s = 10^4 um^-2, n_0 = 0.05,
    xi = 100 pN*s/um^3, A = -1200 pN/um^2), the model computes lambda_max = 4.454 um (4454.1 nm,
    +4004.1 nm, 9.90x larger than 450 nm; lambda_c = 2.651 um, L_c = 1.326 um, omega_max =
    0.01225 s^-1), giving verdict not reproduced. Open methodological caveats and strict
    parameter-invariance audit: (a) cylindrical_ring_critical_mode is a reconstructed model
    (reader_model) and inherits the c_theta ~ 1/R approximation documented in
    q_audit_cylinder_ctheta_geometry, which makes this test strictly conservative — under exact
    surface-of-revolution geometry H_hh = (kappa/R_0^4)*(1 + (q*R_0)^4), lambda_max increases to
    5.399 um (12.00x) at xi = 100 and approaches the Rayleigh-Plateau circumference 2*pi*R_0 =
    12.387 um (27.53x) as xi -> 0; (b) although all 9 inputs reside in added.yaml (R_0 halved from
    Fig. 1j and k_B*T at 298 K = 25 degC matching temp_experiment, plus 7 unmeasured membrane/CMC
    parameters), the not-reproduced verdict holds
    across 100% of all 4,374 combinations of gov2018/added.yaml alternatives at R_0 = 1.971 um
    (4,374/4,374 unstable, lambda_max in [2.591, 16.520] um = 5.76x-36.71x larger), across all
    Fig. 1j developmental timepoints and 0* min embryo range (R_0 in [1.299, 2.327] um ->
    lambda_max in [3.578, 4.870] um = 7.95x-10.82x at baseline, and >= 2.127 um = 4.73x over all
    4,374 combos even at -60 min R_0 = 1.299 um), across Gov p. 3's entire printed kappa/(k_B*T)
    range 1-100 (4.325-5.139 um), across 14 decades of normal friction xi in [10^-6, 10^8]
    pN*s/um^3 (4.258-5.886 um), and with sekine2024/kBT_sim = 0.004142 pN*um at 300 K (4.458 um,
    +0.08%); forcing even the short-wavelength cutoff lambda_c down to 450 nm at R_0 = 1.971 um
    requires an unphysical contractile stress |A| = 2.41-2.44 MPa (~2,000x baseline). This
    provides a parameter-invariant quantitative falsification of tube-radius-selected curvature
    rings in Drosophila trachea, consistent with Hannezo et al. (2015) Main p. 5 citing Gov's
    group (ref-12) to rule out tube-radius wavelength selection.
    (2) Excluded gov2018 candidate models against sekine2024/cable_interval_in_vivo and
    d_figs1d_intervals:
    (a) Passive (A = 0, J = 0) cylindrical_ring_critical_mode is excluded because
    q_audit_cylinder_ctheta_geometry shows its A = 0 instability is an artifact of dropping
    1/sqrt(1 + h'^2) from c_theta (exact circumferential-only geometry is linearly stable at
    A = 0, J = 0, and even the artifactual passive mode gives 2.52-5.88 um).
    (b) flat_membrane_fastest_mode (lambda_max) and flat_membrane_instability_thresholds
    (lambda_c) are excluded because they take 0/10 and 0/7 measured inputs from sekine2024 (not
    even R_0), lack any cylindrical curvature or symmetry-breaking cue to orient circumferential
    rings, and depend arbitrarily on generic reader-chosen gov2018/added.yaml inputs: across the
    13,122 added-alternative combinations, 5,697 (43.4%) are linearly stable while the remaining
    7,425 span lambda_max in [0.172, 81.754] um (843 combinations < 450 nm, with an ordinary
    alternative combo hitting 0.4499 um = 449.9 nm).
    (c) d_figs1d_intervals (median 446.8 nm, range 435.2-474.6 nm) is the companion 1-point
    boxplot (indexed by condition_index) of the identical N = 8 embryo dataset already validated
    via scalar cable_interval_in_vivo, and cannot be compared against a scalar output without
    inventing a sweep port.
    (3) Excluded remaining 212/214 sekine2024 origin: measured data:
    (a) Tube geometry (2 curves: d_fig1j_diameter, d_fig1k_length): tube_equilibrium_radius outputs
    tube_radius R_tube (distinct by a factor of 2 from tube_diameter D, and d_fig1j_diameter is a
    6-point developmental time-course curve; evaluating R_tube = sqrt(kappa/(2*sigma)) at
    gov2018/added.yaml plasma-membrane scales gives R_tube = 0.045-0.359 um, requiring unphysical
    sigma_eq = 0.0106 pN/um to reach R_0 = 1.971 um, confirming multicellular tracheal diameter is
    set by luminal chitin/pressure rather than bare lipid tension balance).
    cylindrical_critical_tube_length outputs critical single-ring onset length L_c = pi/q_c
    (1.326 um at baseline, 17.1x shorter than d_fig1k_length = 22.65 um at 0* min across which ~50
    cables coexist) and requires unmeasured input q_c rather than developmental_time.
    (b) Cortical actin PIV velocities (4 curves: d_fig5c_vx, d_fig5c_vy, d_fig5f_vx, d_fig5f_vy):
    gov2018 wave_speed models (myosin_wave_dispersion, myosin_wave_dispersion_quasisteady,
    myosin_wave_pde_1d_linear, myosin_wave_speed_scaling) predict lateral propagation speed c of
    oscillatory out-of-plane membrane-actin-myosin waves (c propto sqrt(A*)), a distinct physical
    quantity from in-plane PIV mean displacement rates of stationary nanoclusters (which moreover
