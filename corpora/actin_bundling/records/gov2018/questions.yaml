  text: >
    Cross-paper ModelAtlas comparison with hannezo2015 (Hannezo, Dong, Recho, Joanny & Hayashi,
    PNAS 112:8620-8625, 2015; uncited in gov2018, while hannezo2015 cites Gov's earlier cylinder-ring
    papers ref-12 [Srivastava et al. 2013] and ref-44 [Shlomovitz & Gov 2009 = gov2018/ref-88])
    reveals an exact algebraic same_as isomorphism between Gov's quasi-steady myosin-wave growth
    rate (oscillatory branch) and Hannezo SI Eq. (7) (rel_hannezo2015_myosin_qs_same_eq7), exact
    reductions linking Hannezo Eq. (7) to Gov's flat-membrane dispersion and linking Gov's
    flat-membrane fastest mode to Hannezo Eq. (3) and critical_inverse_wavenumber_si_corrected
    (rel_hannezo2015_eq7_reduces_flat_qs, rel_hannezo2015_flat_fastest_reduces_lambda_c,
    rel_hannezo2015_flat_fastest_reduces_inv_qc), alongside five irreducible physical and
    mathematical contrasts:
    (1) Cylindrical ring critical mode vs. flat cortical turnover critical wavenumber
    (cylindrical_ring_critical_mode vs. hannezo2015/critical_inverse_wavenumber_si_corrected &
    critical_wavelength_eq3): despite sharing port dimensions (1/[length], [length]) and
    circumferential-ring phenomenology, no valid algebraic or scaling relation maps Gov's
    cylindrical ring model to Hannezo's critical wavenumber. First, hannezo2015's q_c = (xi/(D*tau*eta))^(1/4)
    is a Type-I finite-turnover marginal onset wavenumber (lambda(q_c) = lambda'(q_c) = 0, lambda(0) = -1/tau < 0),
    whereas gov2018's cylindrical_ring_critical_mode is a conserved Type-II instability (omega(0) = 0)
    with distinct fastest-growing mode q_max < q_c and upper cutoff q_c. Second, Gov's cylindrical
    dispersion has a quartic radial-bending screening denominator 1 + (1 - H_0*R_0*n_0)*(q*R_0)^2 + (q*R_0)^4
    incompatible with Hannezo's quadratic Brinkman denominator 1 + (q*l_h)^2. Third, Gov's ring
    wavelength scales with tube radius R_0 (approaching the Rayleigh-Plateau circumference
    lambda_max -> 2*pi*R_0 at strong contractility when H_0*R_0*n_0 < 1, with cutoff
    q_c ~ [|A|*H_0*n_0/(R_0^2*(k_B*T*n_s + kappa*H_0^2*n_0))]^(1/4) independent of Lambda and xi_mem),
    whereas Hannezo's lambda_c = 2*pi*(D*tau*eta/xi)^(1/4) is strictly independent of R_0 and
    active stress sigma_a. Hannezo Main p. 5 (Fig. 4G/G') explicitly tests this contrast on wild-type
    tracheal side branches (~3x narrower than the 4.8 um main trunk) and observes the same 0.5 um
    ring period, citing Gov's group (ref-12) to rule out direct tube-radius selection (a 2*pi*R_0
    mechanism would predict ~15 um on the main trunk, ~30x too large, and 3x shorter on side branches),
    while noting on Main p. 6 (citing Shlomovitz & Gov 2009, ref-44 = gov2018/ref-88) that curvature
    coupling may still act as an orientational cue or contribute to ring coalescence in constricted
    kkv1 mutants.
    (2) Opposite actin-myosin adiabatic limits (traveling acoustic waves vs. stationary rings & chaos):
    both frameworks invoke linear myosin-actin binding equilibrium m = K*n (myosin_steady_state_eq5_2
    with K = k_on/k_off vs. hannezo2015/two_component_reduction_corrected), but take opposite
    timescale separations. Hannezo assumes fast myosin equilibrium (k_off -> oo at fixed K) with
    finite actin turnover (tau = 15 s), giving a strictly real dispersion (stationary Turing-like
    rings; moving/coalescing rings arise only from nonlinear turnover -eps*(rho - rho_0)^2 below
    critical friction zeta_c propto eta/(D*tau) in cortical_pde_1d_chaos). Gov Section 5(a) keeps
    CMC/actin strictly conserved (tau_actin = oo) while retaining finite myosin kinetics (k_off ~ 0.1 s^-1),
    yielding complex dispersion omega = omega' + i*omega'' with propagating acoustic waves
    (omega'' ~= c_ana*q, c_ana propto sqrt(A*)). Remarkably, inside the oscillatory wave band
    (b^2 < 4*c_0), Gov's real growth rate omega' = (omega_qs - k_off)/2 is still algebraically
    identical to Hannezo Eq. (7) with effective turnover tau = 2/k_off (rel_hannezo2015_myosin_qs_same_eq7).
    (3) Unbounded coarsening vs. turnover-arrested multi-ring steady states & Neumann quantization:
    because CMC are conserved in gov2018, nonlinear dynamics coarsen rings indefinitely into fewer,
    thicker structures (Fig. 3c(iii)-(iv)), and a growing tube first destabilizes at L_c = pi/q_c = lambda_c/2
    (cylindrical_critical_tube_length), matching Hannezo's no-turnover (phi -> 0) fundamental
    Neumann mode i_c = 1, n_rings = 1/2 (hannezo2015/finite_domain_critical_mode). Finite actin
    turnover phi > 0 in hannezo2015 breaks flux conservation, arrests coarsening to stabilize ~15
    periodic rings/cell (cortical_pde_1d_ramp), and introduces a tricritical transition at phi = 1/4
    with no counterpart in gov2018.
    (4) Instability threshold duality and opposite stiffness/viscosity signs: under the flat-membrane
    dictionary (kappa = eta*D, sigma = xi*D, sigma_a = kappa*|H_0|*n_0*(|A| - sigma*|H_0|)/(k_B*T*n_s)),
    Gov's conserved condition sigma < sigma_c (flat_membrane_instability_thresholds) and Hannezo's
    tau -> oo condition sigma_a > chi_c = D*xi (critical_contractility_2d) are exact dual sides of
    sigma_eff < sigma_a,eff. In physical variables, however, Gov's normal-force threshold
    A_c = sigma*|H_0| + sigma*k_B*T*n_s/(kappa*|H_0|*n_0) decreases with bending modulus kappa
    (A_c propto kappa^-1 in the dilute limit, because kappa drives curvature sorting J_curv) and
    carries the J_disp floor sigma*|H_0|, whereas Hannezo's threshold chi_c = (sqrt(eta/tau) + sqrt(D*xi))^2
    increases with cortical viscosity eta at finite tau (and is independent of eta as tau -> oo).
    (5) Direct CMC attraction J & finite normal membrane drag xi_mem vs. purely in-plane active gel:
    gov2018 includes Cahn-Hilliard direct attraction J (flat_membrane_passive_spinodal) and finite
    normal membrane drag xi_mem (retarding flat growth rates up to 45.2% at xi_mem = 100 pN*s/um^3
    vs. 4.53% at xi_mem = 5 pN*s/um^3 in rel_hannezo2015_eq7_approx_flat_disp, and supporting damped
    waves for concave-protrusive H_0 > 0, A > 0), neither of which exists in hannezo2015's purely
    in-plane rigid-substrate active-gel model.
