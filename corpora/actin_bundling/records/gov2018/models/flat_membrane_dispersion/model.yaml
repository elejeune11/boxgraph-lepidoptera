id: flat_membrane_dispersion
name: flat-membrane coupled CMC-cytoskeleton linear dispersion relation (Eqs. 2.1, 2.3, 2.4)
role: model
described_from: ref-34
stated:
  page: 3
  printed_page: "3"
  quote: "performing linear stability analysis"
  where: "Section 2-3, Fig. 2(b)"
equation: "det(omega*I - M_2(q)) = 0 from Eqs. (2.1), (2.3), (2.4) in Monge gauge H = nabla^2 h"
built_from:
  - free_energy_density_eq2_1
  - membrane_height_dynamics_eq2_3
  - cmc_total_current_eq2_4
inputs:
  q:
    quantity: wavenumber
    unit: 1 / um
  kappa:
    quantity: bending_modulus
    unit: pN * um
  sigma:
    quantity: membrane_tension
    unit: pN / um
  kBT:
    quantity: thermal_energy
    unit: pN * um
  Lambda:
    quantity: cmc_mobility
    unit: um / (pN * s)
  H0:
    quantity: spontaneous_curvature
    unit: 1 / um
  ns:
    quantity: cmc_saturation_density
    unit: 1 / um^2
  n0:
    quantity: cmc_coverage_fraction
    unit: dimensionless
  J:
    quantity: cmc_interaction_energy_density
    unit: pN / um
  xi:
    quantity: membrane_friction_coefficient
    unit: pN * s / um^3
  A:
    quantity: active_force_density
    unit: pN / um^2
outputs:
  omega_real:
    quantity: growth_rate
    unit: 1 / s
  omega_imag:
    quantity: oscillation_frequency
    unit: 1 / s
settings: {}
stochastic: false
