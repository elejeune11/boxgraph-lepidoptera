id: cmc_aggregation_current_eq2_7
name: direct-attraction CMC aggregation current (Eq. 2.7)
role: model
described_from: ref-35
stated:
  page: 3
  printed_page: "3"
  quote: "The currents that act to aggregate the CMC arise from"
  where: "Eq. 2.7"
equation: "J_agg = (2 * J * Lambda / n_s) * n * (nabla n + (1 / n_s) * nabla(nabla^2 n))"
inputs:
  J:
    quantity: cmc_interaction_energy_density
    unit: pN / um
  Lambda:
    quantity: cmc_mobility
    unit: um / (pN * s)
  ns:
    quantity: cmc_saturation_density
    unit: 1 / um^2
  n:
    quantity: cmc_coverage_fraction
    unit: dimensionless
  grad_n:
    quantity: cmc_density_gradient
    unit: 1 / um
  grad3_n:
    quantity: cmc_density_third_derivative
    unit: 1 / um^3
outputs:
  J_agg:
    quantity: cmc_current
    unit: um / s
settings: {}
stochastic: false
