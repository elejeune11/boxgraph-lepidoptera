id: flat_membrane_instability_thresholds
name: analytical critical force, critical tension, and critical wavelength for flat-membrane protrusion instability (J = 0)
role: model
described_from: ref-34
stated:
  page: 4
  printed_page: "4"
  quote: "The condition for instability is satisfied above"
  where: "Section 3, pp. 4-5"
equation: "A_c = sigma*|H0| + sigma*k_B*T*n_s/(kappa*|H0|*n0); sigma_c = kappa*|H0|*n0*|A|/(k_B*T*n_s + kappa*H0^2*n0); q_c = sqrt((kappa*|H0|*n0*(|A| - sigma*|H0|) - sigma*k_B*T*n_s)/(kappa*k_B*T*n_s)); lambda_c = 2*pi/q_c"
built_from:
  - flat_membrane_dispersion
inputs:
  kappa:
    quantity: bending_modulus
    unit: pN * um
  sigma:
    quantity: membrane_tension
    unit: pN / um
  kBT:
    quantity: thermal_energy
    unit: pN * um
  H0:
    quantity: spontaneous_curvature
    unit: 1 / um
  ns:
    quantity: cmc_saturation_density
    unit: 1 / um^2
  n0:
    quantity: cmc_coverage_fraction
    unit: dimensionless
  A:
    quantity: active_force_density
    unit: pN / um^2
outputs:
  A_c:
    quantity: active_force_density
    unit: pN / um^2
  sigma_c:
    quantity: membrane_tension
    unit: pN / um
  q_c:
    quantity: wavenumber
    unit: 1 / um
  lambda_c:
    quantity: wavelength
    unit: um
settings: {}
stochastic: false
