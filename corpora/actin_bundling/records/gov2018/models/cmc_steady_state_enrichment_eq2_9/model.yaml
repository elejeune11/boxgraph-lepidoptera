id: cmc_steady_state_enrichment_eq2_9
name: steady-state curvature-sorting Boltzmann distribution (Eq. 2.9)
role: model
stated:
  page: 3
  printed_page: "3"
  quote: "find a steady-state solution of the form"
  where: "Eq. 2.9"
equation: "n(r) ~ exp[(kappa / (k_B * T)) * (H(r) * H0 / n_s)]"
prefactor: unknown
built_from:
  - cmc_diffusive_current_eq2_5
  - cmc_curvature_current_eq2_8
inputs:
  kappa:
    quantity: bending_modulus
    unit: pN * um
  kBT:
    quantity: thermal_energy
    unit: pN * um
  H:
    quantity: mean_curvature
    unit: 1 / um
  H0:
    quantity: spontaneous_curvature
    unit: 1 / um
  ns:
    quantity: cmc_saturation_density
    unit: 1 / um^2
outputs:
  enrichment:
    quantity: cmc_enrichment_ratio
    unit: dimensionless
  chi:
    quantity: curvature_sorting_exponent
    unit: dimensionless
settings: {}
stochastic: false
