id: tube_equilibrium_radius
name: equilibrium cylindrical membrane tube radius from curvature-tension balance (Section 4)
role: model
described_from: ref-88
stated:
  page: 6
  printed_page: "6"
  quote: "curvature and tension forces"
  where: "Section 4, p. 6 col. 1"
equation: "R_tube = sqrt(kappa / (2 * sigma))"
reconstructed: "Gov (2018) notes on p. 6 that the membrane tube radius is 'determined by the balance of curvature and tension forces [88]' without printing the formula; minimizing the bare Helfrich cylinder free energy per length 2*pi*R*(kappa/(2*R^2) + sigma) from Eq. (2.1) gives R_tube = sqrt(kappa/(2*sigma))."
built_from:
  - free_energy_density_eq2_1
inputs:
  kappa:
    quantity: bending_modulus
    unit: pN * um
  sigma:
    quantity: membrane_tension
    unit: pN / um
outputs:
  R_tube:
    quantity: tube_radius
    unit: um
settings: {}
stochastic: false
