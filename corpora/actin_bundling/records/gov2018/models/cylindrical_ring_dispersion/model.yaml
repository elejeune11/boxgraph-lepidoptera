id: cylindrical_ring_dispersion
name: axisymmetric cylindrical tube ring/constriction linear dispersion relation (Section 4)
role: model
described_from: ref-88
stated:
  page: 6
  printed_page: "6"
  quote: "The instability involves formation of condensed rings at"
  where: "Section 4, Fig. 3(a),(c)"
equation: "det(omega*I - M_cyl(q)) = 0 for R(z) = R0 + h(z) with anisotropic circumferential CMC coupling c_theta = 1/R and active radial force A (J = 0)"
reconstructed: "Gov (2018) describes the cylindrical ring/constriction instability in words (Section 4, pp. 6-7) and reprints Fig. 3(c) from Shlomovitz & Gov [87, 88] without printing the cylindrical free energy expansion or dispersion relation; this axisymmetric linear stability model applies Eqs. (2.1), (2.3), and (2.4) at J = 0 to a cylinder of radius R0 with circumferential-only CMC coupling (1/R - n*H0)^2."
built_from:
  - free_energy_density_eq2_1
  - membrane_height_dynamics_eq2_3
  - cmc_total_current_eq2_4
inputs:
  q:
    quantity: wavenumber
    unit: 1 / um
  R0:
    quantity: tube_radius
    unit: um
  kappa:
    quantity: bending_modulus
    unit: pN * um
  kBT:
    quantity: thermal_energy
    unit: pN * um
  Lambda:
    quantity: cmc_mobility
    unit: um / (pN * s)
  H0:
    quantity: spontaneous_curvature
    unit: 1 / um
  ns:
    quantity: cmc_saturation_density
    unit: 1 / um^2
  n0:
    quantity: cmc_coverage_fraction
    unit: dimensionless
  xi:
    quantity: membrane_friction_coefficient
    unit: pN * s / um^3
  A:
    quantity: active_force_density
    unit: pN / um^2
outputs:
  omega_real:
    quantity: growth_rate
    unit: 1 / s
  R0_H0_ratio:
    quantity: stability_parameter_ratio
    unit: dimensionless
settings: {}
stochastic: false
