id: membrane_height_myosin_eq5_1
name: overdamped membrane height equation with actin protrusion and myosin-II contractility (Eq. 5.1)
role: model
described_from: ref-116
stated:
  page: 7
  printed_page: "7"
  quote: "where A* is the strength of myosin-II contractility"
  where: "Eq. 5.1"
equation: "xi * dh/dt = -delta F / delta h + A*(n - <n>) - A* *(m - <m>)"
built_from:
  - membrane_height_dynamics_eq2_3
inputs:
  xi:
    quantity: membrane_friction_coefficient
    unit: pN * s / um^3
  F_passive:
    quantity: membrane_restoring_force_density
    unit: pN / um^2
  A:
    quantity: active_force_density
    unit: pN / um^2
  n:
    quantity: cmc_coverage_fraction
    unit: dimensionless
  n0:
    quantity: cmc_coverage_fraction
    unit: dimensionless
  A_star:
    quantity: myosin_contractile_force_density
    unit: pN / um^2
  m:
    quantity: myosin_concentration
    unit: dimensionless
  m0:
    quantity: myosin_concentration
    unit: dimensionless
outputs:
  dh_dt:
    quantity: membrane_normal_velocity
    unit: um / s
settings: {}
stochastic: false
