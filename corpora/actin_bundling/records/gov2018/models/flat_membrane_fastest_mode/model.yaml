id: flat_membrane_fastest_mode
name: fastest-growing wavevector q_max and wavelength lambda_max of flat-membrane instability (Fig. 2a-b)
role: model
described_from: ref-34
stated:
  page: 5
  printed_page: "5"
  quote: "will grow fastest at the wavelength for which"
  where: "Section 3, Fig. 2(a),(b)"
equation: "q_max = argmax_{q > 0} omega(q), lambda_max = 2*pi/q_max, omega_max = omega(q_max)"
built_from:
  - flat_membrane_dispersion
  - wavelength_from_wavenumber
inputs:
  kappa:
    quantity: bending_modulus
    unit: pN * um
  sigma:
    quantity: membrane_tension
    unit: pN / um
  kBT:
    quantity: thermal_energy
    unit: pN * um
  Lambda:
    quantity: cmc_mobility
    unit: um / (pN * s)
  H0:
    quantity: spontaneous_curvature
    unit: 1 / um
  ns:
    quantity: cmc_saturation_density
    unit: 1 / um^2
  n0:
    quantity: cmc_coverage_fraction
    unit: dimensionless
  J:
    quantity: cmc_interaction_energy_density
    unit: pN / um
  xi:
    quantity: membrane_friction_coefficient
    unit: pN * s / um^3
  A:
    quantity: active_force_density
    unit: pN / um^2
outputs:
  q_max:
    quantity: wavenumber
    unit: 1 / um
  lambda_max:
    quantity: wavelength
    unit: um
  omega_max:
    quantity: growth_rate
    unit: 1 / s
settings: {}
stochastic: false
