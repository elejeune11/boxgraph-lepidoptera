id: cylindrical_ring_critical_mode
name: critical and fastest-growing axial modes of cylindrical tube ring instability (Section 4)
role: model
described_from: ref-87
stated:
  page: 7
  printed_page: "7"
  quote: "rings at the most unstable wavelength"
  where: "Section 4, p. 7 col. 1"
equation: "q_c = max{q > 0 : omega_cyl(q) = 0}, q_max = argmax_{q > 0} omega_cyl(q), lambda_max = 2*pi/q_max"
reconstructed: "Computes the upper stability cutoff q_c and fastest-growing axial ring mode q_max of the reconstructed axisymmetric cylindrical dispersion relation (Section 4, [87, 88])."
built_from:
  - cylindrical_ring_dispersion
  - wavelength_from_wavenumber
inputs:
  R0:
    quantity: tube_radius
    unit: um
  kappa:
    quantity: bending_modulus
    unit: pN * um
  kBT:
    quantity: thermal_energy
    unit: pN * um
  Lambda:
    quantity: cmc_mobility
    unit: um / (pN * s)
  H0:
    quantity: spontaneous_curvature
    unit: 1 / um
  ns:
    quantity: cmc_saturation_density
    unit: 1 / um^2
  n0:
    quantity: cmc_coverage_fraction
    unit: dimensionless
  xi:
    quantity: membrane_friction_coefficient
    unit: pN * s / um^3
  A:
    quantity: active_force_density
    unit: pN / um^2
outputs:
  q_c:
    quantity: wavenumber
    unit: 1 / um
  q_max:
    quantity: wavenumber
    unit: 1 / um
  lambda_max:
    quantity: wavelength
    unit: um
  omega_max:
    quantity: growth_rate
    unit: 1 / s
settings: {}
stochastic: false
