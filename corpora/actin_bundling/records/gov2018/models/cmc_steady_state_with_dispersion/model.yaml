id: cmc_steady_state_with_dispersion
name: non-dilute steady-state curvature enrichment retaining J_disp (Eqs. 2.5, 2.6, 2.8)
role: model
stated:
  page: 3
  printed_page: "3"
  quote: "Equating these currents, we"
  where: "text above Eq. 2.9"
equation: "n / n_0 = W_0(alpha * n_0 * exp(alpha * n_0 + chi)) / (alpha * n_0), alpha = kappa*H0^2/(k_B*T*n_s)"
reconstructed: "Gov (2018) equates only J_diff (Eq. 2.5) and J_curv (Eq. 2.8) to obtain Eq. (2.9), neglecting the curvature-resistance dispersive current J_disp (Eq. 2.6); retaining J_disp yields this exact Lambert-W steady-state enrichment that reduces to Eq. (2.9) in the dilute limit n_0 -> 0."
built_from:
  - cmc_diffusive_current_eq2_5
  - cmc_dispersive_current_eq2_6
  - cmc_curvature_current_eq2_8
inputs:
  kappa:
    quantity: bending_modulus
    unit: pN * um
  kBT:
    quantity: thermal_energy
    unit: pN * um
  H:
    quantity: mean_curvature
    unit: 1 / um
  H0:
    quantity: spontaneous_curvature
    unit: 1 / um
  ns:
    quantity: cmc_saturation_density
    unit: 1 / um^2
  n0:
    quantity: cmc_coverage_fraction
    unit: dimensionless
outputs:
  enrichment:
    quantity: cmc_enrichment_ratio
    unit: dimensionless
settings: {}
stochastic: false
