id: bending_energy_density_eq2_2
name: finite-rigidity CMC bending energy density (Eq. 2.2)
role: model
described_from: ref-33
stated:
  page: 2
  printed_page: "2"
  quote: "CMC that is not infinitely rigid and has a finite bending"
  where: "Eq. 2.2"
equation: "f_bend = (1/2)*(kappa*(1 - n) + kappa_p*n)*(H - n*H0)^2"
inputs:
  kappa:
    quantity: bending_modulus
    unit: pN * um
  kappa_p:
    quantity: cmc_bending_modulus
    unit: pN * um
  H:
    quantity: mean_curvature
    unit: 1 / um
  n:
    quantity: cmc_coverage_fraction
    unit: dimensionless
  H0:
    quantity: spontaneous_curvature
    unit: 1 / um
outputs:
  f_bend:
    quantity: bending_energy_density
    unit: pN / um
  kappa_eff:
    quantity: effective_bending_modulus
    unit: pN * um
settings: {}
stochastic: false
