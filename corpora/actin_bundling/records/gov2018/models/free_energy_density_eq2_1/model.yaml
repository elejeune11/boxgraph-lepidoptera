id: free_energy_density_eq2_1
name: continuum membrane and CMC free energy density (Eq. 2.1)
role: model
described_from: ref-23
stated:
  page: 2
  printed_page: "2"
  quote: "spontaneous curvature this can generally be written as"
  where: "Eq. 2.1"
equation: "f = (1/2)*kappa*(H - n*H0)^2 + sigma + k_B*T*n_s*n*(log(n) - 1) - J*n^2 + (J/n_s)*(nabla n)^2"
inputs:
  kappa:
    quantity: bending_modulus
    unit: pN * um
  H:
    quantity: mean_curvature
    unit: 1 / um
  n:
    quantity: cmc_coverage_fraction
    unit: dimensionless
  H0:
    quantity: spontaneous_curvature
    unit: 1 / um
  sigma:
    quantity: membrane_tension
    unit: pN / um
  kBT:
    quantity: thermal_energy
    unit: pN * um
  ns:
    quantity: cmc_saturation_density
    unit: 1 / um^2
  J:
    quantity: cmc_interaction_energy_density
    unit: pN / um
  grad_n:
    quantity: cmc_density_gradient
    unit: 1 / um
outputs:
  f:
    quantity: free_energy_density
    unit: pN / um
settings: {}
stochastic: false
