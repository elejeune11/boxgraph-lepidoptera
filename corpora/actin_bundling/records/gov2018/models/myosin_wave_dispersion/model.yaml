id: myosin_wave_dispersion
name: full 3x3 linear complex dispersion relation for actin-myosin membrane waves (Eqs. 2.1, 2.4, 5.1, 5.2)
role: model
described_from: ref-116
stated:
  page: 8
  printed_page: "8"
  quote: "dispersion relation v(q) as function of the myosin"
  where: "Section 5(a), Fig. 4(c)"
equation: "det(omega*I - M_3(q)) = 0; omega(q) = omega'(q) + i*omega''(q)"
built_from:
  - free_energy_density_eq2_1
  - cmc_total_current_eq2_4
  - membrane_height_myosin_eq5_1
  - myosin_kinetics_eq5_2
inputs:
  q:
    quantity: wavenumber
    unit: 1 / um
  kappa:
    quantity: bending_modulus
    unit: pN * um
  sigma:
    quantity: membrane_tension
    unit: pN / um
  kBT:
    quantity: thermal_energy
    unit: pN * um
  Lambda:
    quantity: cmc_mobility
    unit: um / (pN * s)
  H0:
    quantity: spontaneous_curvature
    unit: 1 / um
  ns:
    quantity: cmc_saturation_density
    unit: 1 / um^2
  n0:
    quantity: cmc_coverage_fraction
    unit: dimensionless
  J:
    quantity: cmc_interaction_energy_density
    unit: pN / um
  xi:
    quantity: membrane_friction_coefficient
    unit: pN * s / um^3
  A:
    quantity: active_force_density
    unit: pN / um^2
  A_star:
    quantity: myosin_contractile_force_density
    unit: pN / um^2
  k_on:
    quantity: myosin_adsorption_rate
    unit: 1 / s
  k_off:
    quantity: myosin_detachment_rate
    unit: 1 / s
outputs:
  omega_real:
    quantity: growth_rate
    unit: 1 / s
  omega_imag:
    quantity: oscillation_frequency
    unit: 1 / s
  phase_speed:
    quantity: wave_speed
    unit: um / s
settings: {}
stochastic: false
