id: cmc_total_current_eq2_4
name: total in-plane CMC current from free energy variation (Eq. 2.4 with Eq. 2.1)
role: model
described_from: ref-7
stated:
  page: 3
  printed_page: "3"
  quote: "density of CMC is given by the following conservation"
  where: "Eq. 2.4"
equation: "J_tot = -(Lambda/n_s)*n*nabla(delta F / delta n) = J_diff + J_disp + J_agg + J_curv"
built_from:
  - free_energy_density_eq2_1
  - cmc_diffusion_einstein
  - cmc_diffusive_current_eq2_5
  - cmc_dispersive_current_eq2_6
  - cmc_aggregation_current_eq2_7
  - cmc_curvature_current_eq2_8
inputs:
  kappa:
    quantity: bending_modulus
    unit: pN * um
  kBT:
    quantity: thermal_energy
    unit: pN * um
  Lambda:
    quantity: cmc_mobility
    unit: um / (pN * s)
  H0:
    quantity: spontaneous_curvature
    unit: 1 / um
  ns:
    quantity: cmc_saturation_density
    unit: 1 / um^2
  J:
    quantity: cmc_interaction_energy_density
    unit: pN / um
  n:
    quantity: cmc_coverage_fraction
    unit: dimensionless
  grad_n:
    quantity: cmc_density_gradient
    unit: 1 / um
  grad3_n:
    quantity: cmc_density_third_derivative
    unit: 1 / um^3
  grad_H:
    quantity: curvature_gradient
    unit: 1 / um^2
outputs:
  J_tot:
    quantity: cmc_current
    unit: um / s
settings: {}
stochastic: false
