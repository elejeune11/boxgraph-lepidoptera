id: flat_membrane_passive_spinodal
name: passive flat-membrane direct-attraction spinodal threshold J_c (Eq. 2.1, A = 0)
role: model
described_from: ref-23
stated:
  page: 3
  printed_page: "3"
  quote: "unless direct attraction"
  where: "Section 2, pp. 3-4"
equation: "J_c(sigma > 0, q -> 0) = (k_B*T*n_s + kappa*H0^2*n0) / (2*n0); J_c(sigma = 0, q -> 0) = k_B*T*n_s / (2*n0)"
built_from:
  - flat_membrane_dispersion
inputs:
  kappa:
    quantity: bending_modulus
    unit: pN * um
  kBT:
    quantity: thermal_energy
    unit: pN * um
  H0:
    quantity: spontaneous_curvature
    unit: 1 / um
  ns:
    quantity: cmc_saturation_density
    unit: 1 / um^2
  n0:
    quantity: cmc_coverage_fraction
    unit: dimensionless
outputs:
  J_c_tensioned:
    quantity: cmc_interaction_energy_density
    unit: pN / um
  J_c_tensionless:
    quantity: cmc_interaction_energy_density
    unit: pN / um
settings: {}
stochastic: false
