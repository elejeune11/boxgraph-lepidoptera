id: membrane_height_dynamics_eq2_3
name: overdamped membrane height equation with active cytoskeletal force (Eq. 2.3)
role: model
described_from: ref-34
stated:
  page: 2
  printed_page: "2"
  quote: "The equation of motion for h(r) can be"
  where: "Eq. 2.3"
equation: "xi * dh/dt = -delta F / delta h + A*(n - <n>)"
inputs:
  xi:
    quantity: membrane_friction_coefficient
    unit: pN * s / um^3
  F_passive:
    quantity: membrane_restoring_force_density
    unit: pN / um^2
  A:
    quantity: active_force_density
    unit: pN / um^2
  n:
    quantity: cmc_coverage_fraction
    unit: dimensionless
  n0:
    quantity: cmc_coverage_fraction
    unit: dimensionless
outputs:
  dh_dt:
    quantity: membrane_normal_velocity
    unit: um / s
settings: {}
stochastic: false
