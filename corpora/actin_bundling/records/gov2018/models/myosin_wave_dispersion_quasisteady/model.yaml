id: myosin_wave_dispersion_quasisteady
name: quasi-steady membrane analytical dispersion and acoustic wave speed for actin-myosin waves (Eqs. 5.1-5.2, xi -> 0, J = 0)
role: model
described_from: ref-116
stated:
  page: 8
  printed_page: "8"
  quote: "calculated analytical linear dispersion approximation is plotted"
  where: "Section 5(a), Fig. 4(c)"
equation: "omega^2 + b(q)*omega + c0(q) = 0; c_ana = sqrt(kappa*Lambda*|H0|*n0*k_on*A* / (sigma*n_s))"
built_from:
  - myosin_wave_dispersion
inputs:
  q:
    quantity: wavenumber
    unit: 1 / um
  kappa:
    quantity: bending_modulus
    unit: pN * um
  sigma:
    quantity: membrane_tension
    unit: pN / um
  kBT:
    quantity: thermal_energy
    unit: pN * um
  Lambda:
    quantity: cmc_mobility
    unit: um / (pN * s)
  H0:
    quantity: spontaneous_curvature
    unit: 1 / um
  ns:
    quantity: cmc_saturation_density
    unit: 1 / um^2
  n0:
    quantity: cmc_coverage_fraction
    unit: dimensionless
  A:
    quantity: active_force_density
    unit: pN / um^2
  A_star:
    quantity: myosin_contractile_force_density
    unit: pN / um^2
  k_on:
    quantity: myosin_adsorption_rate
    unit: 1 / s
  k_off:
    quantity: myosin_detachment_rate
    unit: 1 / s
outputs:
  omega_real:
    quantity: growth_rate
    unit: 1 / s
  omega_imag:
    quantity: oscillation_frequency
    unit: 1 / s
  c_ana:
    quantity: wave_speed
    unit: um / s
  q_omega_approx:
    quantity: wavenumber
    unit: 1 / um
settings: {}
stochastic: false
