id: cmc_sorting_exponent_molecular
name: molecular-ratio form of curvature-sorting exponent and enrichment (p. 3)
role: model
stated:
  page: 3
  printed_page: "3"
  quote: "the distribution of CMC on"
  where: "text below Eq. 2.9"
equation: "chi = (kappa / k_B T) * (a / R), n/n_0 = exp(chi)"
built_from:
  - cmc_steady_state_enrichment_eq2_9
  - cmc_molecular_scales
inputs:
  kappa_over_kBT:
    quantity: dimensionless_bending_modulus
    unit: dimensionless
  a_over_R:
    quantity: curvature_radius_ratio
    unit: dimensionless
outputs:
  chi:
    quantity: curvature_sorting_exponent
    unit: dimensionless
  enrichment:
    quantity: cmc_enrichment_ratio
    unit: dimensionless
settings: {}
stochastic: false
