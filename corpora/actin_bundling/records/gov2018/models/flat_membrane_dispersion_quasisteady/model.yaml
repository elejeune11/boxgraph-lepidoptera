id: flat_membrane_dispersion_quasisteady
name: quasi-steady membrane limit (xi -> 0) of flat-membrane dispersion relation
role: model
described_from: ref-34
stated:
  page: 3
  printed_page: "3"
  quote: "of the coupled system (equations (2.1)"
  where: "Section 2-3"
equation: "omega_qs(q) = -(Lambda*q^2 / (n_s*(kappa*q^2 + sigma))) * [A*H0*kappa*n0 + sigma*(k_B*T*n_s + kappa*H0^2*n0) + kappa*k_B*T*n_s*q^2] + (2*J*Lambda*n0*q^2/n_s)*(1 - q^2/n_s)"
built_from:
  - flat_membrane_dispersion
inputs:
  q:
    quantity: wavenumber
    unit: 1 / um
  kappa:
    quantity: bending_modulus
    unit: pN * um
  sigma:
    quantity: membrane_tension
    unit: pN / um
  kBT:
    quantity: thermal_energy
    unit: pN * um
  Lambda:
    quantity: cmc_mobility
    unit: um / (pN * s)
  H0:
    quantity: spontaneous_curvature
    unit: 1 / um
  ns:
    quantity: cmc_saturation_density
    unit: 1 / um^2
  n0:
    quantity: cmc_coverage_fraction
    unit: dimensionless
  J:
    quantity: cmc_interaction_energy_density
    unit: pN / um
  A:
    quantity: active_force_density
    unit: pN / um^2
outputs:
  omega_real:
    quantity: growth_rate
    unit: 1 / s
settings: {}
stochastic: false
