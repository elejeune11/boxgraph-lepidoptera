id: cmc_molecular_scales
name: molecular CMC curvature radius and saturation density scales (p. 3)
role: model
stated:
  page: 3
  printed_page: "3"
  quote: "radius of curvature of the CMC is of molecular size"
  where: "text below Eq. 2.9"
equation: "a = 1/|H0| = 1/sqrt(n_s), R = 1/|H|, a/R = |H|/|H0|"
inputs:
  H0:
    quantity: spontaneous_curvature
    unit: 1 / um
  H:
    quantity: mean_curvature
    unit: 1 / um
outputs:
  a:
    quantity: cmc_spontaneous_radius
    unit: nm
  ns:
    quantity: cmc_saturation_density
    unit: 1 / um^2
  R:
    quantity: membrane_curvature_radius
    unit: um
  a_over_R:
    quantity: curvature_radius_ratio
    unit: dimensionless
settings: {}
stochastic: false
