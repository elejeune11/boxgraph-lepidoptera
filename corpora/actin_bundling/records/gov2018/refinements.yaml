- id: ref_protrusion_pde_dt_nmax
  run: run_flat_protrusion_pde_1d
  setting: dt
  factors: [1, 2, 4, 8]
  mode: divide
  output: n_max
  tolerance: "0.5%"
  tolerance_basis: "added: time-step convergence of peak CMC density n_max below 0.5% relative error for the reconstructed IMEX-RK2 1D protrusion PDE"
  tolerance_added: true

- id: ref_protrusion_pde_dt_nmin
  run: run_flat_protrusion_pde_1d
  setting: dt
  factors: [1, 2, 4, 8]
  mode: divide
  output: n_min
  tolerance: "0.5%"
  tolerance_basis: "added: time-step convergence and positivity check of trough CMC density n_min > 0 below 0.5% relative error"
  tolerance_added: true

- id: ref_protrusion_pde_nx_nmax
  run: run_flat_protrusion_pde_1d
  setting: nx
  factors: [1, 2, 4]
  mode: multiply
  output: n_max
  tolerance: "0.1%"
  tolerance_basis: "added: spatial spectral convergence of peak CMC density n_max below 0.1% relative error"
  tolerance_added: true

- id: ref_protrusion_pde_nx_nmin
  run: run_flat_protrusion_pde_1d
  setting: nx
  factors: [1, 2, 4]
  mode: multiply
  output: n_min
  tolerance: "0.1%"
  tolerance_basis: "added: spatial spectral convergence of trough CMC density n_min > 0 verifying absence of Gibbs undershoot"
  tolerance_added: true

- id: ref_wave_pde_dt_lead
  run: run_myosin_wave_pde_1d
  setting: dt
  factors: [1, 2, 4, 8]
  mode: divide
  output: actin_myosin_lead
  tolerance: "0.5%"
  tolerance_basis: "added: Crank-Nicolson time-step convergence of actin-myosin spatial lead distance below 0.5% relative error"
  tolerance_added: true

- id: ref_wave_pde_nx_lead
  run: run_myosin_wave_pde_1d
  setting: nx
  factors: [1, 2, 4]
  mode: multiply
  output: actin_myosin_lead
  tolerance: "0.5%"
  tolerance_basis: "added: spatial grid convergence of sub-grid actin-myosin spatial lead distance below 0.5% relative error"
  tolerance_added: true

- id: ref_wave_pde_nx_dnmin
  run: run_myosin_wave_pde_1d
  setting: nx
  factors: [1, 2, 4]
  mode: multiply
  output: dn_min
  tolerance: "0.5%"
  tolerance_basis: "added: spatial grid convergence of wave trough fluctuation dn_min verifying spectral resolution of extrema"
  tolerance_added: true
