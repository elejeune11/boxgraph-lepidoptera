- id: bending_modulus
  name: membrane bending modulus
  dimension: "[energy]"
  description: Elastic bending rigidity kappa of the bare lipid membrane in Eq. (2.1).

- id: cmc_bending_modulus
  name: CMC bending modulus
  dimension: "[energy]"
  description: Finite bending rigidity kappa' of a curved membrane component (CMC) in Eq. (2.2).

- id: effective_bending_modulus
  name: effective membrane bending modulus
  dimension: "[energy]"
  description: Coverage-weighted effective bending modulus kappa*(1 - n) + kappa'*n in Eq. (2.2).

- id: mean_curvature
  name: local membrane curvature
  dimension: "1 / [length]"
  description: Local membrane curvature H (sum of principal curvatures c_1 + c_2, Monge gauge H = nabla^2 h, cylinder H = 1/R).

- id: spontaneous_curvature
  name: CMC spontaneous curvature
  dimension: "1 / [length]"
  description: Intrinsic spontaneous curvature H_0 of a curved membrane component (H_0 < 0 convex outward, H_0 > 0 concave inward).

- id: cmc_coverage_fraction
  name: CMC membrane coverage fraction
  dimension: "dimensionless"
  description: Local area coverage fraction n of the membrane occupied by CMC (0 <= n <= 1 in Section 2 and Fig. 5d).

- id: cmc_saturation_density
  name: CMC saturation areal density
  dimension: "1 / [length]**2"
  description: Saturation density n_s of CMC on the membrane, of order the inverse molecular area 1/a^2.

- id: membrane_tension
  name: effective membrane tension
  dimension: "[energy] / [length]**2"
  description: Effective surface tension sigma of the membrane (dimensionally equivalent to force per length).

- id: thermal_energy
  name: thermal energy
  dimension: "[energy]"
  description: Thermal energy scale k_B * T.

- id: dimensionless_bending_modulus
  name: reduced membrane bending modulus
  dimension: "dimensionless"
  description: Dimensionless ratio kappa / (k_B * T) of membrane bending rigidity to thermal energy.

- id: cmc_interaction_energy_density
  name: CMC direct interaction energy density
  dimension: "[energy] / [length]**2"
  description: Direct attractive CMC-CMC interaction parameter J > 0 per unit membrane area in Eq. (2.1) and Eq. (2.7).

- id: free_energy_density
  name: continuum membrane free energy density
  dimension: "[energy] / [length]**2"
  description: Local free energy per unit membrane area (integrand of Eq. 2.1).

- id: bending_energy_density
  name: membrane bending energy density
  dimension: "[energy] / [length]**2"
  description: Local elastic curvature bending energy per unit membrane area (first term of Eq. 2.1 or Eq. 2.2).

- id: membrane_height
  name: membrane height deformation
  dimension: "[length]"
  description: Out-of-plane membrane height field h(x, t) in the Monge gauge (or radial perturbation h(z) on a cylinder).

- id: membrane_friction_coefficient
  name: membrane-cytoplasm friction coefficient
  dimension: "[force] * [time] / [length]**3"
  description: Local dissipative friction coefficient xi per unit area in Eq. (2.3) and Eq. (5.1).

- id: active_force_density
  name: cytoskeletal active force density
  dimension: "[force] / [length]**2"
  description: Active normal cytoskeletal force per unit area per unit CMC coverage A in Eq. (2.3) (A > 0 protrusive, A < 0 contractile).

- id: myosin_contractile_force_density
  name: myosin-II contractile force density
  dimension: "[force] / [length]**2"
  description: Inward myosin-II contractile force strength parameter A* per unit area per unit cortical myosin m in Eq. (5.1).

- id: myosin_concentration
  name: cortical myosin concentration
  dimension: "dimensionless"
  description: Local cortical myosin-II concentration m (in the same dimensionless coverage basis as n in Eqs. 5.1-5.2).

- id: cmc_mobility
  name: CMC in-plane mobility
  dimension: "[length]**2 / ([energy] * [time])"
  description: Lateral mobility Lambda of CMC in the fluid membrane in Eq. (2.4), related to D by D = Lambda * k_B * T.

- id: cmc_diffusion_coefficient
  name: CMC lateral diffusion coefficient
  dimension: "[length]**2 / [time]"
  description: Thermal in-plane diffusion coefficient D = Lambda * k_B * T of CMC in Eq. (2.5).

- id: cmc_current
  name: in-plane CMC coverage current
  dimension: "[length] / [time]"
  description: Lateral flux J (J_diff, J_disp, J_agg, J_curv, J_tot) of dimensionless CMC coverage fraction in Eqs. (2.4)-(2.8).

- id: cmc_density_gradient
  name: CMC coverage gradient
  dimension: "1 / [length]"
  description: Spatial gradient nabla(n) of local CMC coverage fraction.

- id: cmc_density_third_derivative
  name: CMC coverage third spatial derivative
  dimension: "1 / [length]**3"
  description: Third spatial derivative nabla(nabla^2 n) entering the Cahn-Hilliard aggregation current Eq. (2.7).

- id: curvature_gradient
  name: membrane curvature gradient
  dimension: "1 / [length]**2"
  description: Spatial gradient nabla(H) of local membrane mean curvature entering J_curv Eq. (2.8).

- id: cmc_spontaneous_radius
  name: CMC spontaneous radius of curvature
  dimension: "[length]"
  description: Intrinsic molecular radius of curvature a = 1 / |H_0| = 1 / sqrt(n_s) of a CMC (p. 3).

- id: membrane_curvature_radius
  name: membrane radius of curvature
  dimension: "[length]"
  description: Local radius of curvature R = 1 / |H| of the membrane (p. 3).

- id: curvature_radius_ratio
  name: CMC-to-membrane curvature radius ratio
  dimension: "dimensionless"
  description: Dimensionless ratio a / R = H / H_0 comparing molecular CMC size to membrane radius of curvature (p. 3).

- id: cmc_enrichment_ratio
  name: curvature-induced CMC enrichment ratio
  dimension: "dimensionless"
  description: Relative steady-state CMC coverage n(r) / n_0 induced by imposed membrane curvature in Eq. (2.9).

- id: curvature_sorting_exponent
  name: curvature-sorting Boltzmann exponent
  dimension: "dimensionless"
  description: Dimensionless exponent (kappa / (k_B * T)) * (H * H_0 / n_s) = (kappa / (k_B * T)) * (a / R) in Eq. (2.9).

- id: continuum_validity_length
  name: continuum theory minimum validity length-scale
  dimension: "[length]"
  description: Smallest membrane length-scale down to which continuum curvature-sorting theory agrees with in vitro experiments (p. 3).

- id: wavenumber
  name: perturbation wavevector
  dimension: "1 / [length]"
  description: Spatial wavenumber q = 2*pi/lambda of membrane and CMC perturbations (including q_c, q_max, q_omega).

- id: wavelength
  name: perturbation wavelength
  dimension: "[length]"
  description: Spatial wavelength lambda = 2*pi/q of protrusions, rings, or membrane waves (including lambda_c, lambda_max).

- id: tube_length
  name: cylindrical membrane tube length
  dimension: "[length]"
  description: Axial length L of a cylindrical membrane tube (and critical division length L_c for first instability, p. 7).

- id: tube_radius
  name: cylindrical membrane tube radius
  dimension: "[length]"
  description: Equilibrium radius R_tube of a cylindrical membrane tube (p. 6).

- id: wavelength_to_tube_length_ratio
  name: critical wavelength to tube length ratio
  dimension: "dimensionless"
  description: Ratio lambda_c / L_c at onset of the first constriction instability on a growing cylindrical tube (p. 7).

- id: growth_rate
  name: linear perturbation growth rate
  dimension: "1 / [time]"
  description: Real part omega'(q) (or real omega(q)) of the linear stability growth/decay rate of perturbations.

- id: oscillation_frequency
  name: linear wave oscillation frequency
  dimension: "1 / [time]"
  description: Imaginary part omega''(q) of the complex dispersion relation omega(q) = omega'(q) + i*omega''(q).

- id: myosin_adsorption_rate
  name: myosin adsorption rate constant
  dimension: "1 / [time]"
  description: First-order recruitment rate constant k_on of cytoplasmic myosin onto cortical actin/CMC in Eq. (5.2).

- id: myosin_detachment_rate
  name: myosin detachment rate constant
  dimension: "1 / [time]"
  description: First-order detachment rate constant k_off of cortical myosin in Eq. (5.2).

- id: wave_speed
  name: lateral membrane wave speed
  dimension: "[length] / [time]"
  description: Lateral propagation speed c (or V in Fig. 5d) of active membrane waves.

- id: simulation_time
  name: physical simulation time
  dimension: "[time]"
  description: Elapsed physical time t in dynamical membrane-CMC-myosin simulations (e.g. Fig. 4d).

- id: dimensionless_time
  name: dimensionless simulation time
  dimension: "dimensionless"
  description: Dimensionless time t reported in cylindrical ring coarsening simulation snapshots (Fig. 3c).

- id: domain_length
  name: 1D periodic simulation domain length
  dimension: "[length]"
  description: Spatial length L of the 1D periodic membrane domain in PDE simulations.

- id: perturbation_width
  name: initial Gaussian perturbation width
  dimension: "[length]"
  description: Spatial standard deviation w_0 of a localized initial height perturbation h(x, 0) in 1D myosin-wave PDE simulations.

- id: membrane_restoring_force_density
  name: passive variational membrane force density
  dimension: "[force] / [length]**2"
  description: Passive normal restoring/bending force per unit area -delta F / delta h in Eqs. (2.3) and (5.1).

- id: membrane_normal_velocity
  name: membrane normal velocity
  dimension: "[length] / [time]"
  description: Time derivative dh/dt of membrane height deformation in Eqs. (2.3) and (5.1).

- id: myosin_rate_of_change
  name: cortical myosin concentration rate of change
  dimension: "1 / [time]"
  description: Time derivative dm/dt of cortical myosin concentration in Eq. (5.2).

- id: spatial_lead_distance
  name: actin-myosin spatial lead distance
  dimension: "[length]"
  description: Distance by which the leading actin/CMC density peak precedes the trailing myosin peak in a propagating membrane wave (Fig. 4d).

- id: stability_parameter_ratio
  name: dimensionless instability ratio
  dimension: "dimensionless"
  description: Dimensionless ratio comparing driving force or tube radius to its instability threshold (e.g. H_0 * R_tube).

- id: passive_dispersion_determinant_coeff
  name: passive flat-membrane stability factor
  dimension: "[energy]**2 / [length]**4"
  description: Positive-definite factor entering det(M_2) for passive flat membranes (A = 0, J = 0).

- id: system_context
  name: experimental or theoretical system condition
  dimension: "dimensionless"
  description: Condition label distinguishing flat membrane, cylindrical tube, passive, active, or cited model setups.

- id: spatial_position
  name: lateral spatial position along membrane
  dimension: "[length]"
  description: One-dimensional spatial coordinate x along the membrane in propagating-wave profiles (Figs. 4d, 5d).

- id: myosin_volume_density_fluctuation
  name: cortical myosin volume density fluctuation
  dimension: "1 / [length]**3"
  description: Perturbed 3D cortical myosin-II density fluctuation m(x) plotted in um^-3 in Fig. 4(d) [116].

- id: actin_volume_density_fluctuation
  name: cortical actin/CMC volume density fluctuation
  dimension: "1 / [length]**3"
  description: Perturbed 3D cortical actin/CMC density fluctuation n(x) plotted in um^-3 in Fig. 4(d) [116].

- id: convex_cmc_coverage_fraction
  name: convex CMC membrane coverage fraction
  dimension: "dimensionless"
  description: Local membrane coverage fraction n_- of diffusing convex curved membrane components in the two-curvature wave model (Fig. 5d [41]).

- id: concave_cmc_coverage_fraction
  name: concave CMC membrane coverage fraction
  dimension: "dimensionless"
  description: Local membrane coverage fraction n_+ of adsorbing concave curved membrane components in the two-curvature wave model (Fig. 5d [41]).
