  output_map:
    dissipation_ratio_variational: dissipation_ratio_code
  regime:
    E3: [0.1, 3.0]
    beta: [0.5, 2.0]
  provenance: stated
  citation:
    file: README.md
    lines: "3-5"
    quote: "This repository contains the main simulation code for the following article:"
    where: "README.md (lines 3-5) & ModelC_Cubic.py::ModelC_2D.euler_step (lines 126-135); cf. gubbala2025 Eq. (5), Eq. (8) dQ/dt = -delta F/delta Q, Data availability (p. 7 / 6249), and SI Sec. 4 (pp. 16-17)"
  assumptions:
    - "Tests unmodified ModelC_2D.cubic() with euler_step's +0.5*E3 prefactor against variational gradient descent -delta F_E3/delta Q (dissipation_ratio = +1.0000). Fails on both sign (non-variational +0.5*E3 increases F_E3) and magnitude (line 91 real-space FFT bug degrades alignment to -0.3119)."

- id: rel_code_cubic_fixed_same_variational
  kind: same_as
  a: gubbala_code/modelc_cubic_operator_fixed
  b: gubbala2025/cubic_elastic_variational_sign_eq10
  mapping:
    E3: "E3"
  output_map:
    dissipation_ratio_variational: dissipation_ratio_code
  regime:
    E3: [0.1, 3.0]
    beta: [0.5, 2.0]
  provenance: proposed
  reason: "Fixing ModelC_Cubic.py line 91 to pass Fourier-space Q_fft[i][j] and negating euler_step's cubic prefactor from +0.5*E3 to variational -0.5*E3 (modelc_cubic_operator_fixed) makes live ModelC_2D's cubic operator identically match gubbala2025/cubic_elastic_variational_sign_eq10's variational gradient descent (dissipation_ratio = +1.000000, relative difference < 1e-8 across all E3, beta)."

- id: rel_code_cubic_fixed_vs_eq10_printed
  kind: same_as
  a: gubbala_code/modelc_cubic_operator_fixed
  b: gubbala2025/cubic_elastic_variational_sign_eq10
  mapping:
    E3: "E3"
  output_map:
    dissipation_ratio_printed: dissipation_ratio_code
  regime:
    E3: [0.1, 3.0]
    beta: [0.5, 2.0]
  provenance: proposed
  reason: "Once the line 91 real-space FFT bug is removed, variational modelc_cubic_operator_fixed (+1.0000) differs from printed Eq. (10)'s +0.5*E3 term (-1.0000) by an exact constant factor of -1, isolating the non-variational sign error of printed Eq. (10) / SI Eq. (S20)."

