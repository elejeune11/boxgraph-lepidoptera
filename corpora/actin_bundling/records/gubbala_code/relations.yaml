# Cross-record ModelAtlas relations between gubbala_code (ActinNematics: ModelC_Cubic.py)
# and gubbala2025 (Gubbala, Jena, Arnold & Takatori, Soft Matter 21, 6243-6251, 2025).
#
# Structure:
# - Section 1: Cubic elastic operator (modelc_cubic_operator_audit, modelc_cubic_operator_fixed)
#   vs gubbala2025/cubic_elastic_variational_sign_eq10.
# - Section 2: Unmodified live ModelC_2D.euler_step() Frechet linear stability
#   (modelc_linear_stability_probe) vs gubbala2025/linear_stability_s24_s28,
#   linear_stability_s24_s28_corrected, and nematic_saturation_eq4_s5.
# - Section 3: Fixed diagnostic variant (modelc_linear_stability_fixed) restoring line 91 (Q_fft)
#   and variational -0.5*E3 sign vs gubbala2025/linear_stability_s24_s28 and _corrected.
# - Section 4: 2D PDE coarsening, adaptive timestepper, equilibrium binodal nematic order, and
#   power-law coarsening (modelc_coarsening_euler_step, modelc_adaptive_stepper_audit) vs
#   gubbala2025/model_c_pde_2d_eq9_10, model_c_pde_2d_variational, coupled_binodal_coexistence,
#   and coarsening_power_law.
#   (The paper's Data Availability stated equivalence between gubbala2025/model_c_pde_2d_eq9_10
#   and gubbala_code/modelc_coarsening_native_run lives in gubbala2025/relations.yaml.)
#
# Notes on unlinked models (full 8 x 25 audit):
# - gubbala_code/modelc_grids_and_init audits code-only discretization details (DX = L/(N-1),
#   K[0,0] = 1/N^2 zero-mode floor, square 2/3 de-aliasing fraction, and t=0 shared-noise
#   correlation) that have no counterpart analytical model among gubbala2025's 25 models
#   (checked directly against gubbala2025 datums in gubbala_code/comparisons.yaml).
# - gubbala2025's pointwise free-energy densities (cahn_hilliard_free_energy_eq2,
#   ldg_bulk_free_energy_eq4/_eq10_consistent, elastic_free_energy_eq5,
#   anchoring_free_energy_eq7_s13), Frank constant / Q-tensor definitions
#   (nematic_q_tensor_eq3, frank_elastic_constants_eq6/_2d, elastic_ratio_bounds_p3/_eq6_corrected,
#   nematic_saturation_from_eq4_exact), dimensional scale mapping (nondim_parameters_s32),
#   synthetic-spectrum structure-factor quadrature (structure_factor_domain_size_s1_s34), and
#   image-analysis boundary curvature (boundary_curvature_s2/_corrected) have no standalone
#   counterpart entry point in ModelC_Cubic.py; effective_line_tension_p3/_s13 (1+|chi|/2 vs
#   1+chi/2) are tested directly inside live euler_step() via omega_phi and chi_min below.

# ==============================================================================
# 1. Cubic elastic operator (ModelC_2D.cubic + euler_step +0.5*E3 sign)
# ==============================================================================

- id: rel_code_cubic_vs_eq10_printed
  kind: same_as
  a: gubbala_code/modelc_cubic_operator_audit
  b: gubbala2025/cubic_elastic_variational_sign_eq10
  mapping:
    E3: "E3"
  output_map:
    dissipation_ratio_printed: dissipation_ratio_code
  regime:
    E3: [0.1, 3.0]
    beta: [0.5, 2.0]
  provenance: stated
  citation:
    file: README.md
    lines: "35-40"
    quote: "# Constants that appear in Eqs. 9 & 10 of main text"
    where: "README.md (lines 3-5, 35-40) & ModelC_Cubic.py::ModelC_2D.cubic (lines 71-102, 126-134)"
  assumptions:
    - "Both models evaluate the cubic elastic dissipation ratio dF_E3/dt / (-2 int |RHS|^2 dA) on the identical smooth periodic 2D test field (N=32, L=32, eps_fd=1e-6). Because ModelC_Cubic.py line 91 multiplies wavevectors -K[k]*K[l] into real-space Q[i][j] instead of Q_fft[i][j], unmodified ModelC_2D.cubic() has 116.3% L2 error against Eq. (10) and yields dissipation_ratio = -0.3119 rather than printed Eq. (10)'s -1.0000."

- id: rel_code_cubic_vs_eq8_variational
