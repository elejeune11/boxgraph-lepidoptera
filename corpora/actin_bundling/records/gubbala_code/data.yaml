# ==============================================================================
# 2. Hardcoded numerical & algorithmic constants in ModelC_Cubic.py
# ==============================================================================

- id: dealias_cutoff_code
  quantity: dealias_cutoff_ratio
  unit: dimensionless
  origin: reported
  printed: "0.666667"
  citation:
    file: ModelC_Cubic.py
    lines: "56"
    quote: "anti_alias_trunc = self.xp.max(self.xp.array([kx, ky])) * 2 / 3"
  note: "Exact fraction 2/3 applied to max([kx, ky]) = (N/2 - 1)*2*pi/L with strict inequality <, forming a square de-aliasing mask (removing slightly more than 1/3 of modes along each axis)."

- id: cubic_prefactor_code
  quantity: cubic_prefactor
  unit: dimensionless
  origin: reported
  printed: "0.5"
  citation:
    file: ModelC_Cubic.py
    lines: "126-127"
    quote: "0.5 * self.E3 * fxx_fft)"
  note: "Signed prefactor +0.5 on E3 * F_ij in both Qxx (line 127) and Qxy (line 134). Matches printed Eq. (10) / Eq. (S20)'s non-variational +1/2 sign (opposite to variational -delta F_E3/delta Q = -1/2) and restores the 1/2 omitted in SI Eqs. (S30) and (S32)."

- id: k6_stab_coeff_code
  quantity: stabilization_coeff
  unit: dimensionless
  origin: reported
  printed: "1"
  citation:
    file: ModelC_Cubic.py
    lines: "139-142"
    quote: "numerator_phi = (phi_fft * (1 + self.K ** 6 * dt) -"
  note: "Unit prefactor 1 multiplying k^6 * dt in both numerator (1 + K^6*dt) and denominator (1 + (kappa_anch*GAMMA*K^4 + K^6)*dt), matching SI Eqs. (S29) and (S31) verbatim."

- id: noise_mean_code
  quantity: noise_mean
  unit: dimensionless
  origin: reported
  printed: "0"
  citation:
    file: ModelC_Cubic.py
    lines: "148"
    quote: "noise = self.prng.normal(loc=0, scale=1e-2, size=(self.N, self.N))"
  note: "Zero-mean Gaussian noise drawn ONCE on line 148 and reused identically for phi - PHI_AVG, Qxx, and Qxy (lines 151-153)."

- id: noise_std_code
  quantity: noise_std
  unit: dimensionless
  origin: reported
  printed: "1 x 10^-2"
  citation:
    file: ModelC_Cubic.py
    lines: "148"
    quote: "noise = self.prng.normal(loc=0, scale=1e-2, size=(self.N, self.N))"
  note: "Standard deviation 1e-2 corresponds to variance (1e-2)^2 = 10^-4, matching gubbala2025 SI p. 17 (init_noise_variance)."

