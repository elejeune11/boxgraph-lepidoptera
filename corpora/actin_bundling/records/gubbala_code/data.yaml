- id: geom_mean_exp_code
  quantity: adaptive_exponent
  unit: dimensionless
  origin: reported
  printed: "0.333333"
  citation:
    file: ModelC_Cubic.py
    lines: "221"
    quote: "delta = self.xp.power(delta_phi * delta_qxx * delta_qxy, 1 / 3)"
  note: "Exact exponent 1/3 for the geometric mean of spatial-mean L1 errors over (phi, Qxx, Qxy), matching SI p. 16."

- id: dt_adapt_exp_code
  quantity: adaptive_exponent
  unit: dimensionless
  origin: reported
  printed: "0.2"
  citation:
    file: ModelC_Cubic.py
    lines: "223"
    quote: "self.DT = self.DT * self.xp.power(self.TOL / delta, 1 / 5)"
  note: "Exact exponent 1/5 = 0.2 WITH multiplicative self.DT, settling gubbala2025 SI p. 16's typo which omitted dt_old."

