id: modelc_coarsening_euler_step
name: live ModelC_2D.euler_step() fixed-dt 2D coarsening driver comparing shared vs independent noise (ModelC_Cubic.py)
role: model
software: true
stated:
  file: ModelC_Cubic.py
  lines: "104-154"
  quote: "def euler_step(self, phi_, qxx_, qxy_, dt):"
  where: "ModelC_Cubic.py::ModelC_2D.euler_step (lines 104-144) and noise initialization (lines 148-153)"
equation: "Repeated live calls to ModelC_2D.euler_step(phi, Qxx, Qxy, dt) on periodic box N=64, L=62.5 (exact paper dx=500/512) with either shared noise (ModelC_2D.run lines 148-153) or independent noise (SI p. 17)"
inputs:
  beta: {quantity: ldg_quartic_coeff, unit: dimensionless}
  gamma: {quantity: timescale_ratio, unit: dimensionless}
  chi: {quantity: anchoring_strength, unit: dimensionless}
  E1: {quantity: elastic_constant_dimless, unit: dimensionless}
  E3: {quantity: elastic_constant_dimless, unit: dimensionless}
  phi0: {quantity: mean_lipid_concentration, unit: dimensionless}
  noise_std: {quantity: noise_std, unit: dimensionless}
  t_fit_start: {quantity: time_dimless, unit: dimensionless}
  t_end: {quantity: time_dimless, unit: dimensionless}
  k_cut_ratio: {quantity: wavenumber_ratio, unit: dimensionless}
outputs:
  alpha_fit: {quantity: coarsening_exponent, unit: dimensionless}
  R_final: {quantity: domain_size_dimless, unit: dimensionless}
  R_growth_ratio: {quantity: domain_size_ratio, unit: dimensionless}
  Q_max_final: {quantity: nematic_order_magnitude, unit: dimensionless}
  phi_mean_drift: {quantity: mass_drift, unit: dimensionless}
  blowup_flag: {quantity: blowup_indicator, unit: dimensionless}
settings:
  n_grid: 64
  L_box: 62.5
  dt: 0.4
  init_mode: shared
  n_samples: 6
  seed: 0
stochastic: true
