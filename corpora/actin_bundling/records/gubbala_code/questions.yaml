- id: q_cubic_line91_realspace_fft_bug
  kind: possible_error
  about:
    - modelc_cubic_operator_audit
    - modelc_cubic_operator_fixed
    - modelc_linear_stability_probe
    - modelc_linear_stability_fixed
    - cmp_lsa_E3_eff_code_vs_paper
    - cmp_lsa_E3_eff_fixed_vs_paper
    - run_euler_high_shared
  text: >
    Critical Fourier-space bug in ModelC_Cubic.py line 91 (ModelC_2D.cubic): the second-derivative term
    -2 Q_kl d_k d_l Q_ij of Eq. (10) is coded as `2 * Q[k][l] * self.ifft2(-K[k] * K[l] * Q[i][j]).real`,
    multiplying wavevectors -K[k]*K[l] pointwise into the REAL-SPACE array Q[i][j] instead of its Fourier
    transform Q_fft[i][j] (even though qxx_fft and qxy_fft were passed as arguments to cubic() and used
    only in grad() on lines 72-73). Consequences verified directly on live ModelC_2D:
    (1) On the smooth periodic 2D test field (run_cubic_audit_high), ModelC_2D.cubic() has 116.3% L2 error
    vs exact Eq. (10) (118.1% error on the second-derivative term).
    (2) On a spatially uniform constant nematic field (Qxx = 1, Qxy = 0, where every derivative is 0),
    ModelC_2D.cubic() produces a spurious cross-shaped artifact along x = 0 and y = 0 with amplitude
    max|0.5*E3*fxx| = 4.013 at E3 = 2, N = 32 (4.198 at E3 = 1, N = 64), breaking translational invariance.
    (3) In the linearized dispersion around (phi = 1, Qxx = 1, Qxy = 0) at E1 = E3 = 2 (run_lsa_high),
    the bend-splay anisotropy E3_eff_linear collapses from +2.0 (SI Eq. S28) to -0.0106 (a >99% loss,
    failing cmp_lsa_E3_eff_code_vs_paper), leaving omega_xx nearly isotropic (~4 + E1*k^2).
    (4) Crucially, this bug explains why ModelC_Cubic.py does NOT blow up at high actin (E1 = E3 = 2,
    beta = 1, run_euler_high_shared blowup_flag = 0) despite BOTH the non-variational +E3/2 sign AND
    the coupled-binodal backward-diffusion instability (|Q|_eq = 1.0543 > E1/E3 = 1 identified in
    gubbala2025/q_coupled_binodal_illposedness): because line 91 wipes out the -2 Q_kl d_k d_l Q_ij
    operator, effective nematic diffusivity remains strictly positive (~E1). Fixing line 91 to Q_fft[i][j]
    with variational sign (modelc_cubic_operator_fixed, modelc_linear_stability_fixed) restores zero
    uniform residual, +1.000 dissipation ratio, and exact E3_eff_linear = +2.0000.
  citation:
    file: ModelC_Cubic.py
    lines: "89-91"
    quote: "2 * Q[k][l] * self.ifft2(-K[k] * K[l] * Q[i][j]).real)"

- id: q_cubic_nonvariational_plus_sign
  kind: possible_error
  about:
    - cubic_prefactor_code
    - modelc_cubic_operator_audit
    - modelc_cubic_operator_fixed
    - run_cubic_audit_high
  text: >
    ModelC_2D.euler_step() lines 126-127 and 133-134 add `+ 0.5 * self.E3 * fxx_fft` and `+ 0.5 * self.E3 *
    fxy_fft`, matching printed Eq. (10) / Eq. (S20)'s non-variational +E3/2 sign (opposite to variational
    gradient descent dQ/dt = -delta F/delta Q, which requires -0.5 * E3 * F_ij) while restoring the factor
    1/2 omitted in SI Eqs. (S30) and (S32). Combined with the line 91 real-space Q bug, live
    ModelC_2D.cubic() yields free-energy dissipation ratio -0.312 (increasing F_E3 on the test field rather
    than decreasing it; fixing line 91 alone yields -1.000, and fixing both line 91 and the sign yields
    +1.000000 in run_cubic_fixed_high).
  citation:
    file: ModelC_Cubic.py
    lines: "126-127"
    quote: "0.5 * self.E3 * fxx_fft)"

- id: q_missing_inv_S_in_anchoring
  kind: possible_error
  about:
    - modelc_linear_stability_probe
    - run_lsa_beta2
    - cmp_lsa_chi_eff_beta2_vs_code
    - beta_nonunit_probe
  text: >
    In ModelC_2D.euler_step() lines 126, 133, and 140, the anchoring couplings are coded as `- 0.5 * self.CHI
    * anch_qxx_fft`, `- 0.5 * self.CHI * anch_qxy_fft`, and `- self.CHI * anch_phi_fft`, completely omitting
    the 1/S = sqrt(BETA) prefactor from Eqs. (9)-(10) and SI Eqs. (S19)-(S20) (matching the same omission in
    SI Eqs. S29-S32). This omission is masked at BETA = 1 (S = 1), where cmp_lsa_chi_eff_beta1_vs_code
    reproduces chi_eff = 1.0000, but at BETA = 2 (run_lsa_beta2) live ModelC_2D.euler_step() gives
    chi_eff_linear = 0.7071 = 1/sqrt(2) (failing cmp_lsa_chi_eff_beta2_vs_code) and shifts high-k stability
    bounds from +-2 to +-4.828.
  citation:
    file: ModelC_Cubic.py
    lines: "126-140"
    quote: "self.GAMMA * self.K ** 2 * dt * (f_eff_fft - self.CHI * anch_phi_fft))"

