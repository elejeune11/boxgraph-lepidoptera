    anchoring stability bounds -2.000 <= chi <= +2.000 at beta = 1, failing to reproduce SI Eq. (S27)'s
    printed lower bound -2/3 = -0.666667 (cmp_lsa_chi_min_code_vs_paper) and remaining high-k stable at
    perpendicular anchoring chi = -1 (run_lsa_perp_chi).
  citation:
    file: ModelC_Cubic.py
