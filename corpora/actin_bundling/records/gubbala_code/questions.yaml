  text: >
    ModelC_2D.grids() line 54 sets `self.K[self.K == 0] = 1 / self.N ** 2` (yielding k_zero_mode = 3.81e-6
    at N = 512, 9.77e-4 at N = 32) instead of keeping K = 0 at the zero mode (likely a leftover from a
    hydrodynamics solver that divided by K, alongside dead method curl_fft on lines 68-69). Because
    K[0,0] != 0, the conserved Cahn-Hilliard equation leaks mean concentration <phi> at rate
