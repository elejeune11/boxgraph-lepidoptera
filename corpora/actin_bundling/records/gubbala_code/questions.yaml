  text: >
    ModelC_2D.grids() line 49 computes `self.DX = self.L / (self.N - 1)` (exported by export_params() to
    params.txt as 0.97847 for L = 500, N = 512), inconsistent with the periodic FFT spacing L / N = 0.97656
    used in fftfreq on lines 50-51 (DX itself is unused inside the solver). For de-aliasing (lines 56-62),
