  text: >
    Line 114 computes `kappa_anch = 1 + np.abs(self.CHI) / 2`. This settles two open questions in gubbala2025:
    (1) it explains why SI Eqs. (S29) and (S31) printed an undefined `kappa` instead of `lambda`, and (2) it
    confirms the code follows main-text p. 3's `1 + |chi|/2` rather than SI Eq. (S13)'s `1 + chi/2` or SI
