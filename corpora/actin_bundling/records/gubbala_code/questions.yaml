  text: >
    Across all three live ModelC_Cubic.py high-actin validations at the exact Fig. 3 9.9722x time
    ratio (`t_fit_start = 100.28`, `t_end = 1000`, implied `t_c = 7.18 s`), high actin
    `(E1, E3, phi0) = (2, 2, 0.75)` coarsens FASTER than low actin `(0.1, 0.1, 0.3)` and strongly
    overshoots gubbala2025's measured high-actin Fig. 3 ratio (~1.55 eye-read; 1.522 [1.504, 1.540]
    digitized at 7000 s): unmodified `ModelC_2D.run()` gives 2.040 +/- 0.359 (vs low 1.744 +/- 0.098),
    fixed-dt `euler_step` shared noise gives 2.031 +/- 0.064 (vs low 1.824 +/- 0.020), and
