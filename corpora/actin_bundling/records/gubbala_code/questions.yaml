    trajectory diagnostics on `N = 64, L = 62.5` up to `t = 5000` (seed 0, shared noise) resolve the
    mechanism: because `phi0 = 0.75 > phi_sp = 0.7071` is metastable (and line 91 masks blowup by
    destroying `-2 Q_kl d_k d_l Q_ij`), live `ModelC_2D` exhibits a slow nucleation plateau
    (`t = 50..200`, `R = 1.87 -> 2.10`), followed by SI Fig. S2's rapid Regime II transient
    (`t = 200..2000`, `R = 2.10 -> 5.48`, `alpha ~ 0.42`; keeping `R(3000)/R(300) = 2.53` and
    `R(5000)/R(500) = 2.10` above 2.0), before entering late Regime III arrest only for `t > 2000-3000`
    (`R = 5.48 -> 6.40` over `t = 2000..5000`, `alpha(3000..5000) = 0.092`, where `R = 6.40` also
    reaches ~10% of the `L = 62.5` CPU box). This quantitatively corroborates
    `gubbala2025/q_digitize_settles_deferred_and_timescale`: Fig. 3's `720..7180 s` window maps to
    GPU horizon `t_tilde = 3008..30000` (`t_c ~ 0.239 s`), which cannot be reproduced on a CPU
    `N = 64` box without severe finite-box saturation.
  citation:
    file: ModelC_Cubic.py
    lines: "89-91"
    quote: "2 * Q[k][l] * self.ifft2(-K[k] * K[l] * Q[i][j]).real)"

