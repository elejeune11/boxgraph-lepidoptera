- id: q_adaptive_timestep_bugs_and_choices
  kind: possible_error
  about:
    - dt_adapt_exp_code
    - dt_min_abort_code
    - modelc_adaptive_stepper_audit
    - run_stepper_audit_low
    - cmp_stepper_reported_t1_vs_dt0
  text: >
    ModelC_2D.run() lines 208-224 settle gubbala2025 SI p. 16's typo by multiplying by self.DT
    (`self.DT = self.DT * self.xp.power(self.TOL / delta, 1 / 5)`), but reveal four bugs/undisclosed choices:
    (1) Timestamp shift bug (line 224): fields are integrated for DT_old, then self.DT is overwritten by
    DT_new on line 223, and THEN `T += self.DT` adds DT_new instead of DT_old. On step 0 (DT_init = 1e-8),
    reported_time_step1 = 2.799e-6 overshoots true_time_step1 = 1e-8 by ~280x (failing
    cmp_stepper_reported_t1_vs_dt0), accumulating max_time_shift = 0.302 by t = 20.
    (2) Discards the more accurate half-step solution (phi_half_2, Qxx_half_2, Qxy_half_2) and advances
    with the coarse 1-step Euler update (lines 214-216), with no step rejection when delta > TOL, no safety
    factor, and no dt_max cap.
    (3) Uses spatial L1 mean `average(abs(...))` (unstated in SI p. 16) and exponent 1/5 (appropriate for
    RK45, sluggish for 1st-order IMEX Euler).
    (4) Hidden abort cutoff `self.DT < 1e-12` (line 180, misleadingly labelled "picoseconds" for
    dimensionless time) and NaN/Inf check applied only to phi (line 175).
  citation:
    file: ModelC_Cubic.py
    lines: "214-224"
    quote: "self.DT = self.DT * self.xp.power(self.TOL / delta, 1 / 5)"

