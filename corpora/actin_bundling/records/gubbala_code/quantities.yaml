- id: grid_points
  name: grid points per dimension
  dimension: dimensionless
  description: "Number of discrete grid points N along one side of a square N x N periodic Fourier lattice."

- id: dimensionless_length
  name: dimensionless spatial length
  dimension: dimensionless
  description: "Dimensionless simulation box side length L or spatial grid spacing dx."

- id: time_dimless
  name: dimensionless time
  dimension: dimensionless
  description: "Dimensionless simulation time t, time step dt, time-accounting shift, or abort threshold."

- id: error_tolerance
  name: adaptive time-stepping tolerance
  dimension: dimensionless
  description: "Adaptive step-size error tolerance TOL (also reused as traceless assertion tolerance in ModelC_2D.cubic)."

- id: save_stride
  name: snapshot save interval in steps
  dimension: dimensionless
  description: "Number of time steps SKIPS between saved snapshots in ModelC_2D.run."

- id: mean_lipid_concentration
  name: mean lipid concentration
  dimension: dimensionless
  description: "Initial spatially averaged scalar lipid concentration field PHI_AVG (phi_0)."

- id: lipid_concentration_field
  name: lipid phase-field order parameter
  dimension: dimensionless
  description: "Dimensionless scalar lipid concentration field phi(x, t) (< 0 for Lo, > 0 for Ld)."

- id: ldg_quartic_coeff
  name: Landau-de Gennes quartic coefficient
  dimension: dimensionless
  description: "Dimensionless positive saturation parameter BETA in the Landau-de Gennes bulk free energy."

- id: timescale_ratio
  name: nematic-to-diffusion timescale ratio
  dimension: dimensionless
  description: "Dimensionless ratio GAMMA = t_Q / t_phi controlling Cahn-Hilliard mobility relative to nematic relaxation."

- id: elastic_constant_dimless
  name: dimensionless nematic elastic constant
  dimension: dimensionless
  description: "Dimensionless quadratic (E1) or cubic anisotropic (E3) nematic gradient elastic constant, or effective linearized E3."

- id: anchoring_strength
  name: dimensionless nematic anchoring strength
  dimension: dimensionless
  description: "Dimensionless anchoring coupling coefficient CHI, effective linearized anchoring coupling, or stability bound on CHI."

- id: dimensionless_line_tension
  name: dimensionless isotropic line tension
  dimension: dimensionless
  description: "Effective isotropic interface line tension kappa_anch = 1 + |CHI|/2 (lambda in paper)."

- id: wavenumber_dimless
  name: dimensionless wavenumber
  dimension: dimensionless
  description: "Dimensionless Fourier wavenumber magnitude k (including zero-mode floor K[0,0])."

- id: wavenumber_ratio
  name: wavenumber ratio
  dimension: dimensionless
  description: "Dimensionless ratio k_cut / k_max used to integrate the first-moment domain size R(t) in SI Eq. (S1)."

- id: dealias_cutoff_ratio
  name: de-aliasing wavenumber cutoff fraction
  dimension: dimensionless
  description: "Fraction of maximum Fourier wavenumber retained by the square de-aliasing mask (2/3)."

- id: dealias_kept_fraction
  name: fraction of 2D Fourier modes retained by de-aliasing
  dimension: dimensionless
  description: "Area fraction of the N x N Fourier grid retained by ModelC_2D.ALIASING."

- id: noise_mean
  name: initial Gaussian noise mean
  dimension: dimensionless
  description: "Mean parameter loc of initial Gaussian noise drawn in ModelC_2D.run."

- id: noise_std
  name: initial Gaussian noise standard deviation
  dimension: dimensionless
  description: "Standard deviation parameter scale of initial Gaussian noise drawn in ModelC_2D.run."

- id: noise_variance
  name: initial Gaussian noise variance
  dimension: dimensionless
  description: "Variance sigma^2 of initial Gaussian noise perturbations."

- id: field_correlation
  name: Pearson correlation between initial fields
  dimension: dimensionless
  description: "Pointwise Pearson correlation coefficient between two initialized 2D fields at t = 0."

- id: adaptive_exponent
  name: adaptive step-size control exponent
  dimension: dimensionless
  description: "Power-law exponent used in the geometric error mean (1/3) or adaptive step-size update (1/5)."

- id: stabilization_coeff
  name: hyper-diffusion stabilization coefficient
  dimension: dimensionless
  description: "Prefactor multiplying the added-and-subtracted k^6 phi_k stabilization term in ModelC_2D.euler_step."

- id: cubic_prefactor
  name: cubic elastic RHS prefactor
  dimension: dimensionless
  description: "Signed prefactor multiplying E3 * F_ij in the Q_ij evolution equation (+0.5 in code and printed Eq. 10 vs -0.5 variational)."

- id: free_energy_rate_ratio
  name: free-energy dissipation alignment ratio
  dimension: dimensionless
  description: "Ratio (dF_E3/dt) / (-2 int |RHS_E3|^2 dx): +1 for variational gradient descent, -1 for opposite-sign Eq. (10)."

- id: relative_operator_error
  name: relative L2 operator error
  dimension: dimensionless
  description: "Relative L2 norm discrepancy between the live code operator and the exact mathematical expression."

- id: nematic_rhs_residual
  name: spurious nematic RHS residual on a uniform state
  dimension: dimensionless
  description: "Maximum absolute value of (0.5 * E3 * cubic(Q)) evaluated on a spatially uniform constant nematic field (identically 0 mathematically)."

- id: decay_rate_dimless
  name: dimensionless linear decay or coupling rate
  dimension: dimensionless
  description: "Linearized decay rate (omega_phi, omega_xx, omega_xy), off-diagonal coupling (c12, c21), or zero-mode mass leak rate."

- id: coarsening_exponent
  name: domain coarsening exponent
  dimension: dimensionless
  description: "Power-law domain growth exponent alpha in R(t) ~ t^alpha."

- id: domain_size_dimless
  name: dimensionless domain size
  dimension: dimensionless
  description: "Characteristic lipid domain size R(t) in dimensionless simulation units from structure factor SI Eq. (S1)."

- id: domain_size_ratio
  name: normalized domain size
  dimension: dimensionless
  description: "Domain size ratio R(t_end) / R(t_fit_start) over the coarsening window."

- id: nematic_order_magnitude
  name: nematic order magnitude
  dimension: dimensionless
  description: "Maximum magnitude |Q| = sqrt(Q_xx^2 + Q_xy^2) of the 2D nematic tensor field."

- id: mass_drift
  name: scalar concentration mean drift
  dimension: dimensionless
  description: "Absolute change |<phi(t_end)> - <phi(0)>| quantifying non-conservation of phi from K[0,0] = 1/N^2."

- id: blowup_indicator
  name: numerical blowup flag
  dimension: dimensionless
  description: "Binary indicator (0 = completed finitely, 1 = NaN/Inf blowup or DT < 1e-12 abort)."

- id: unused_param
  name: unused local variable value
  dimension: dimensionless
  description: "Value of dead unused local variable r = 1e-3 in ModelC_2D.run."
