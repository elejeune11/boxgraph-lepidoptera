notes: >
  Quantitative reading of Pelletier et al. (2003), Phys. Rev. Lett. 91, 148102 (PDF pages 1-4).

  In scope:
  - SAXS diffraction peak analysis at gamma = 1:5 (100 mM KCl, 2.5 mg/ml actin, 300 nm gelsolin-capped
    filaments): measured first- and second-order peaks q_1 = 0.19 nm^-1 and q_2 = 0.29 nm^-1 and
    measured peak widths Delta_q_1 = 0.056 nm^-1 and Delta_q_2 = 0.136 nm^-1 (p. 3).
  - Lattice symmetry predictions: perfect square lattice second-order Bragg peak q_2 = q_1 * sqrt(2)
    = 0.27 nm^-1 (reproduced) and perfect hexagonal lattice second-order Bragg peak q_2 = q_1 * sqrt(3)
    = 0.33 nm^-1 (reproduced), both also validated against observed q_2 = 0.29 nm^-1 to show the
    observed distorted square symmetry lies closer to square than hexagonal.
  - Real-space lattice spacing d = 2*pi / q_1 = 33 nm (reproduced), compared qualitatively with the
    literature EM length of alpha-actinin (~30 nm, ref-2).
  - Disorder peak-width scaling law Delta_q ~ q^2 (prefactor: unknown) tested against the two
    measured peak widths (0.056 and 0.136 nm^-1 at 0.19 and 0.29 nm^-1).
  - Reconstructed Scherrer domain-size model L = K * 2*pi / Delta_q (with added shape factor K = 1
    and alternatives 0.9, 0.5, 0.375) exploring the paper's unstated derivation of the ~50 nm ordered
    domain size from peak widths 0.056 and 0.136 nm^-1 (revealing a ~2x tension under standard
    Scherrer K = 0.9-1 applied to the first-order peak FWHM).
  - Non-runnable experimental fitting model for the 1/q rod-scattering background subtraction and
    two-Gaussian peak fit (Fig. 3(b)-(c); raw data, fit amplitudes, and width definition not printed
    in text).
  - Key experimental parameters, phase/correlation thresholds (gamma > 1:100 phase separation,
    gamma = 1:50 loose network SAXS onset, gamma >= 1:10 bundle correlation peaks, including the
    verbatim printed misprint gamma <= 1:10 on p. 3 and the verbatim printed misprint 100 nM KCl on
    p. 1), LSCM mesh size (~5 um), observed bundle diameter (~400 nm), and actin concentration ranges.

  Left out of data.yaml (qualitative or routine preparation/instrument details that feed no model):
  - Buffer recipes in endnotes [5]-[9] (purity > 95%, Tris-HCl, CaCl2, ATP, DTT, NaCl, Na2HPO4,
    EGTA, pH, BME, glycerol), gelsolin stock concentration (1 mg/ml), polymerization and
    ultracentrifugation durations (2 h, 15 min) and rotor speeds (50 000 rpm, 100.3 rotor, 5000 rpm),
    equal-part mixing volume (20 ul), capillary diameter (1 mm), 1:1 phalloidin:G-actin dye ratio,
    LSCM excitation/emission wavelengths (488 nm / 517 nm), Z-step count (20), 360 deg azimuthal
    integration angle, and Fig. 2 inset line-profile bar lengths (1.75, 1.35, 1.58, 1.22 um).

  Figures (left for the independent digitize stage; no figures.yaml or figures.md created here):
  - Fig. 1(a)-(b) (p. 2): LSCM micrographs of alpha-actinin network of bundles (gamma = 1:25,
    0.01 mg/ml actin) and 80 mM MgCl2 counterion bundles (micrographs; no plotted curves).
  - Fig. 2 (p. 3): 3D LSCM micrograph at gamma = 1:5 with four inset fluorescence intensity vs
    distance line profiles (a, c branching sites with approximately constant intensity; b, d crossing
    points with approximately doubled intensity; inset profiles can be digitized to test the ~2x
    crossing vs constant bifurcation intensity criterion).
  - Fig. 3(a)-(c) (p. 3): Circularly averaged SAXS intensity I(q) plots: (a) log-log I(q) vs q for
    gamma = 1:90, 1:50, 1:25, 1:10, 1:5, 1:2 (arbitrary vertical offsets); (b) linear I(q) vs q for
    gamma = 1:5 with 1/q background fit; (c) background-subtracted I(q) for gamma = 1:5 with two
    Gaussian component fits at q = 0.19 and 0.29 nm^-1 (to be digitized in the digitize stage to
    independently verify peak positions, FWHM widths, and the 1/q background fit).
  - Fig. 4 (p. 4): Schematic cartoon of a branching F-actin/alpha-actinin bundle and cross-sectional
