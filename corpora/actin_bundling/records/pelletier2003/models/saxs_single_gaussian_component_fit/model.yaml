id: saxs_single_gaussian_component_fit
name: single-Gaussian fit to an individual plotted Gaussian component curve in Fig. 3(c)
role: fit
from_words: true
stated:
  page: 3
  printed_page: "148102-3"
  quote: "ground subtraction and Gaussian fits to the peaks at"
  where: "Fig. 3 caption"
equation: "G(q) = A * exp(-(q - q_0)^2 / (2*sigma^2))"
inputs:
  G_curve:
    quantity: saxs_intensity
    unit: dimensionless
    curve:
      quantity: scattering_wavevector
      unit: 1/nm
    description: Digitized individual plotted Gaussian component curve G_1(q) or G_2(q) from Fig. 3(c)
outputs:
  G_fit:
    quantity: saxs_intensity
    unit: dimensionless
    curve:
      quantity: scattering_wavevector
      unit: 1/nm
    description: Best-fit Gaussian curve evaluated at the input q positions
  q_0:
    quantity: scattering_wavevector
    unit: 1/nm
    description: Fitted center wavevector of the plotted Gaussian component
  w_2sigma:
    quantity: diffraction_peak_width
    unit: 1/nm
    description: Origin-convention Gaussian width w = 2*sigma = FWHM / sqrt(2*ln(2))
  fwhm:
    quantity: diffraction_peak_width
    unit: 1/nm
    description: Full width at half maximum 2*sqrt(2*ln(2))*sigma of the plotted Gaussian component
settings: {}
stochastic: false
