id: saxs_rod_background_two_gaussian_fit
name: 1/q rod-scattering background subtraction and two-Gaussian SAXS peak fit (Fig. 3(b)-(c))
role: fit
runnable: false
not_runnable_reason: >
  Raw circularly-averaged SAXS scattering intensity I(q) for the gamma = 1:5 sample is not tabulated
  in the paper (only plotted in Fig. 3(b)-(c)), and the text does not report the fitted 1/q background
  prefactor (or any constant offset), the fitting q-range, the two Gaussian amplitudes, or whether
  the printed peak widths (0.056 and 0.136 nm^-1) are FWHM or standard deviation sigma (visual
  measurement of Fig. 3(c) indicates FWHM).
stated: {page: 3, printed_page: "148102-3", quote: "precise peak positions were determined by fitting a 1=q", where: "text / Fig. 3(b)-(c)"}
inputs:
  q: {quantity: scattering_wavevector, unit: 1/nm}
outputs:
  I: {quantity: saxs_intensity, unit: dimensionless}
settings: {}
stochastic: false
