id: square_lattice_spacing
name: real-space inter-filament lattice spacing from first-order Bragg peak
role: model
from_words: true
stated: {page: 3, printed_page: "148102-3", quote: "spacing corresponding to the q1   0:19 nm 1 peak", where: text}
equation: "d = 2*pi / q_1"
inputs:
  q_1: {quantity: scattering_wavevector, unit: 1/nm}
outputs:
  d: {quantity: lattice_spacing, unit: nm}
settings: {}
stochastic: false
