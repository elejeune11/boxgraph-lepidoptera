id: domain_size_scherrer
name: reciprocal-space Scherrer ordered domain size from SAXS peak width
role: model
reconstructed: >
  The paper states that the broad diffraction peak widths (0.056 and 0.136 nm^-1) suggest an ordered
  domain size of ~50 nm, without giving the domain-size formula, Scherrer shape factor K, or which
  peak width (q_1 or q_2) was used.
stated: {page: 3, printed_page: "148102-3", quote: "a domain size of  50 nm compared with the", where: text}
equation: "L = K * 2*pi / Delta_q"
inputs:
  Delta_q: {quantity: diffraction_peak_width, unit: 1/nm}
  K: {quantity: scherrer_shape_factor, unit: dimensionless}
outputs:
  L: {quantity: ordered_domain_size, unit: nm}
settings: {}
stochastic: false
