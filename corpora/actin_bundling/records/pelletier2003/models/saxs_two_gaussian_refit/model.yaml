id: saxs_two_gaussian_refit
name: two-Gaussian fit to digitized background-subtracted gamma = 1:5 SAXS profile (Fig. 3(c))
role: fit
from_words: true
stated:
  page: 3
  printed_page: "148102-3"
  quote: "1:5 sample, then using a fit of two Gaussians"
  where: "text / Fig. 3(c)"
equation: "I_sub(q) = A_1 * exp(-(q - q_1)^2 / (2*sigma_1^2)) + A_2 * exp(-(q - q_2)^2 / (2*sigma_2^2))"
inputs:
  I_sub:
    quantity: saxs_intensity
    unit: dimensionless
    curve:
      quantity: scattering_wavevector
      unit: 1/nm
    description: Digitized background-subtracted SAXS profile I_sub(q) vs q (Fig. 3(c))
outputs:
  I_fit:
    quantity: saxs_intensity
    unit: dimensionless
    curve:
      quantity: scattering_wavevector
      unit: 1/nm
    description: Total two-Gaussian fit evaluated at the input q values
  q_1:
    quantity: scattering_wavevector
    unit: 1/nm
    description: Fitted center wavevector of the first-order Gaussian peak
  q_2:
    quantity: scattering_wavevector
    unit: 1/nm
    description: Fitted center wavevector of the second-order Gaussian peak
  w_1:
    quantity: diffraction_peak_width
    unit: 1/nm
    description: Origin-convention Gaussian width w_1 = 2*sigma_1 of the first-order peak
  w_2:
    quantity: diffraction_peak_width
    unit: 1/nm
    description: Origin-convention Gaussian width w_2 = 2*sigma_2 of the second-order peak
  fwhm_1:
    quantity: diffraction_peak_width
    unit: 1/nm
    description: Full width at half maximum 2*sqrt(2*ln(2))*sigma_1 of the first-order peak
  fwhm_2:
    quantity: diffraction_peak_width
    unit: 1/nm
    description: Full width at half maximum 2*sqrt(2*ln(2))*sigma_2 of the second-order peak
settings: {}
stochastic: false
