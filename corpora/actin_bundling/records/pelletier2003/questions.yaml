    determine an exact power law Delta_q ~ q^alpha, here yielding alpha = ln(0.136/0.056) /
    ln(0.29/0.19) = 2.10 (with 2-decimal peak-position and 3-decimal width rounding spanning 1.87 to
    2.37), so two peaks alone cannot discriminate q^2 paracrystalline broadening from alternative
    broadening laws.

