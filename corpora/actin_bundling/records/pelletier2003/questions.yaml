- id: q_digitize_fig3c_width_convention_2sigma_vs_fwhm
  kind: reading
  about: [dq1_saxs, dq2_saxs, I_q_fig3c_gauss1, I_q_fig3c_gauss2, fwhm_peaks_fig3c, saxs_rod_background_two_gaussian_fit, domain_size_scherrer, cmp_fig3c_gauss1_w_vs_dq1, cmp_fig3c_gauss2_w_vs_dq2, cmp_fig3c_gauss1_fwhm_vs_dq1, cmp_fig3c_gauss2_fwhm_vs_dq2]
  citation: {page: 3, printed_page: "148102-3", quote: "the two diffraction peaks were measured as 0.056 and", where: "text / Fig. 3(c)"}
  text: >
    Calibrated 1200-dpi digitization of the two plotted Gaussian component curves G_1(q) and G_2(q)
    in Fig. 3(c) resolves the unstated Gaussian width convention raised in q_saxs_fit_non_runnable
    and overturns the prior eyeball assumption (in data.yaml/audit.md) that 0.056 and 0.136 nm^-1
    are FWHMs. Fitting single Gaussians to the digitized plotted components yields q_1 = 0.1904 nm^-1,
    q_2 = 0.2914 nm^-1 (matching printed 0.19 and 0.29 nm^-1), but actual plotted FWHMs of
    0.0654 nm^-1 (+16.8% above 0.056) and 0.1558 nm^-1 (+14.6% above 0.136). Instead, the printed
    widths match Origin's default Gaussian width parameter w = 2*sigma = FWHM / sqrt(2*ln 2):
    w_1 = 0.0556 nm^-1 (-0.7% vs 0.056) and w_2 = 0.1323 nm^-1 (-2.7% vs 0.136), corroborated by
    independent two-Gaussian refitting of digitized I_sub(q) (w_1 = 0.0586, w_2 = 0.1344 vs
    FWHM_1 = 0.0690, FWHM_2 = 0.1582 nm^-1). With the true FWHM_1 = 0.0654 nm^-1, standard
    Scherrer 2*pi / FWHM_1 = 96 nm (K = 0.9 gives 86 nm) remains ~1.7-1.9x above the stated ~50 nm
    (q_domain_size_formula_and_factor_of_two), whereas the Gaussian real-space 1/e decay length
    xi = sqrt(2) / sigma_1 = 2*sqrt(2) / w_1 = 50.9 nm (and 2*pi / w_2 = 47.5 nm) lies right at
    ~50 nm. Furthermore, the digitized plotted width ratio 2.38 matches (q_2 / q_1)^2 = 2.34 to 1.5%,
    tighter than the 2-decimal rounded text values (q_peak_width_q2_rounding).

- id: q_digitize_fig2_branching_saturation
  kind: overstated_claim
  about: [I_fl_fig2a, I_fl_fig2b, I_fl_fig2c, I_fl_fig2d, gamma_fig2]
  citation: {page: 2, printed_page: "148102-2", quote: "Conclusive evidence for branching can be", where: "text / Fig. 2(a)-(d)"}
  text: >
    Page 2 states that Fig. 2(a)-(d) provides "conclusive evidence for branching" because crossing
    bundles should show roughly doubled fluorescence intensity (panels b, d) whereas true
    bifurcations remain constant across the junction (panels a, c). Calibrated digitization of the
    four 8-bit (0-255) line profiles reveals that both branching profiles sit near or at the 8-bit
    digital detector ceiling: Fig. 2(a) spans 204-255 (median 239, touching 255 across 0.95-1.15 um)
    and Fig. 2(c) is flat-clipped at 255 (median 251) across 0.10-1.20 um. In contrast, both
    crossing profiles start from 2-3x lower unsaturated baselines: Fig. 2(b) rises from ~73-112 to
    227 (~2.0-3.1x) and Fig. 2(d) rises from ~86-130 to a flat-topped peak at 236 (~1.8-2.7x).
    Because an 8-bit confocal detector already clipped at 255 cannot register a 2x intensity jump
    above 255, the constant profiles in Fig. 2(a) and especially Fig. 2(c) cannot by themselves
    rule out crossing bundles without demonstrating unsaturated detector gain.

