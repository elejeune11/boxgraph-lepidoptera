- id: q_audit_saxs_resolution_and_two_point_q2_scaling
  kind: unstated_input
  about: [disorder_peak_width_scaling, dq1_saxs, dq2_saxs, saxs_peak_widths_vs_q, xray_energy_ssrl]
  citation: {page: 3, printed_page: "148102-3", quote: "q increases and scale as q2 consistent with our", where: text}
  text: >
    SAXS data were collected at SSRL beamlines 4-2 and 10-2 at 8 keV (p. 1), but the instrumental
    q-resolution Delta_q_inst is unstated and it is not specified whether the reported peak widths
    (0.056 and 0.136 nm^-1) are raw or resolution-deconvolved; subtracting any finite instrumental
