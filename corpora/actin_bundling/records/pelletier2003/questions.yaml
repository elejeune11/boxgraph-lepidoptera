    threshold preparation concentration (qualitatively above tang1996's 27-30 mM Mg2+ onset
    at 150 mM KCl) rather than a measured bundling threshold, omits whether 200 mM KCl was
    retained, and tang1996 has no quantitative Manning model predicting ion-specific divalent
    thresholds (5.5-27 mM, p. 2). Nor can tang1996/filament_length_from_monomers validate
    pelletier2003's reported 300 nm gelsolin-capped filament length because pelletier2003 does
    not state its gelsolin:actin molar ratio.


