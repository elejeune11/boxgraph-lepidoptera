- id: q_misprint_100nM_kcl
  kind: possible_error
  about: [kcl_polymerization_saxs, kcl_resuspended_saxs, kcl_final_saxs]
  citation: {page: 1, printed_page: "148102-1", quote: "was initiated by 100 nM KCl and actin", where: text}
  text: >
    Page 1 (right column, verified on page-001.png) prints "Polymerization was initiated by 100 nM KCl".
    This is almost certainly a typographic misprint for "100 mM KCl" (six orders of magnitude higher):
    in-vitro F-actin polymerization requires millimolar monovalent salt (typically 50-100 mM KCl), and
    later in the same paragraph the pelleted F-actin is resuspended at 200 mM KCl "to achieve twice
    the final KCl concentration", yielding the 100 mM KCl reported on p. 3.

