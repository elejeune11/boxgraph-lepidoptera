- id: q_peak_width_q2_rounding
  kind: unexplained_difference
  about: [disorder_peak_width_scaling, cmp_width_q2_scaling, saxs_peak_widths_vs_q, q1_saxs, q2_saxs]
  citation: {page: 3, printed_page: "148102-3", quote: "q increases and scale as q2 consistent with our", where: text}
  text: >
    Evaluating Delta_q = C * q^2 against the two printed peaks (0.19 nm^-1, 0.056 nm^-1) and
    (0.29 nm^-1, 0.136 nm^-1) yields a geometric-mean prefactor C = 1.584 nm and scaled widths 0.0572
    and 0.1332 nm^-1, differing from the 3-decimal printed widths by ~2.1% (measured width ratio
    0.136 / 0.056 = 2.429 vs (0.29 / 0.19)^2 = 2.330, a 4.2% ratio discrepancy). Because q_1 = 0.19
    and q_2 = 0.29 nm^-1 are printed to only two decimal places (±0.005 nm^-1), the rounding-allowed
    range of (q_2 / q_1)^2 is [2.136, 2.543], which easily encompasses 2.429; fitting uncertainties
    for the overlapping Gaussians are also unstated. Note that adding a q-independent finite-domain
    broadening term Delta_q_0 > 0 to paracrystalline q^2 broadening would decrease Delta_q_2 / Delta_q_1
    below (q_2 / q_1)^2 rather than increase it.

- id: q_domain_size_formula_and_factor_of_two
  kind: unstated_model
  about: [domain_size_scherrer, domain_size_printed, scherrer_shape_factor, dq1_saxs, dq2_saxs, cmp_domain_size_from_dq1, cmp_domain_size_from_dq2]
  citation: {page: 3, printed_page: "148102-3", quote: "a domain size of  50 nm compared with the", where: text}
  text: >
    The paper infers a domain size of ~50 nm from the peak widths (0.056 and 0.136 nm^-1) without
    stating the formula, shape factor K, or which peak was used. Visual inspection of Fig. 3(c) confirms
    that 0.056 and 0.136 nm^-1 are full widths at half maximum (FWHM). Applying the standard reciprocal-space
    Scherrer formula L = K * 2*pi / Delta_q_FWHM to the first-order peak (0.056 nm^-1) gives 112 nm
    (K = 1) or 101 nm (K = 0.9) — roughly twice the stated ~50 nm. Reaching ~50 nm requires either
    (i) applying 2*pi / Delta_q_2 = 46 nm to the second-order peak (already strongly broadened by q^2
    disorder), (ii) using K = 0.5 (pi / Delta_q_1 = 56 nm, as if 0.056 nm^-1 were treated as HWHM), or
    (iii) quoting a Gaussian real-space correlation length xi = 2*sqrt(2*ln 2)/Delta_q_1 = 42 nm
    (K = sqrt(2*ln 2)/pi ≈ 0.375). Moreover, the paper simultaneously attributes the q^2 width scaling
    to cumulative disorder of the second kind rather than purely finite crystallite size.

