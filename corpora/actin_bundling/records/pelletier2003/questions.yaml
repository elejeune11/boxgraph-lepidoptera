    distortion model (e.g., rhombic shear angle or rectangular aspect ratio) is provided, nor is the
    expected splitting of degenerate Bragg reflections under distortion discussed (which would likely
    be obscured by the broad peak widths 0.056 and 0.136 nm^-1).

