  citation: {page: 3, printed_page: "148102-3", quote: "served second order diffraction peak at q2   0:29 is", where: text}
  text: >
    The observed ratio q_2 / q_1 = 0.29 / 0.19 = 1.526 falls between perfect square (sqrt(2) = 1.414,
