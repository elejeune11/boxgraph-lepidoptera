# Cross-record ModelAtlas relations for pelletier2003 across the three remaining
# Wave 6 ready partner pairs authored here:
# - claessens2008 + pelletier2003: 2 proposed relations below (hexagonal q_11 same_as,
#   and hexagonal vs. square real-space lattice spacing scales_as).
# - grason2007 + pelletier2003: 0 relations (see q_grason2007_no_relation_and_no_validation;
#   grason2007 models continuum chiral bundle elasticity and twist-limited radius whereas
#   pelletier2003 models SAXS Bragg peak ratios, lattice spacing, Scherrer domain size,
#   and q^2 paracrystalline broadening).
# - pelletier2003 + tang1996: 0 relations (see q_tang1996_no_relation_and_no_validation;
#   tang1996 models Manning counterion condensation, polycation binding mass balance,
#   ionic-strength scaling, and gelsolin filament length, completely disjoint from
#   pelletier2003's SAXS crystallography models).
# (Note: borukhov2005+pelletier2003, kierfeld2005+pelletier2003, and pelletier2003+shin2009
# were previously authored inside those partner records.)

# ==========================================================================
# Cross-record ModelAtlas relations with claessens2008
# ==========================================================================

- id: rel_claessens2008_hexagonal_q11_same_as
  kind: same_as
  a: claessens2008/hexagonal_bragg_peaks
  b: pelletier2003/hexagonal_lattice_bragg_q2
  mapping:
    q_1: "q_10"
  output_map:
    q_2: q_11
  regime:
    q_10: [0.1, 1.0]
  provenance: proposed
  reason: >
    Both papers apply the identical 2D hexagonal reciprocal-lattice second-order Bragg peak ratio
    q_11 = q_2 = sqrt(3) * q_10 to diagnose F-actin bundle cross-sectional packing from SAXS
    (claessens2008 p. 2 col. 2 indexing q_10 = 0.585 nm^-1 and q_11 = sqrt(3)*q_10 for tightly
    packed hexagonal F-actin/fascin bundles; pelletier2003 p. 3 col. 1 evaluating the hexagonal
    reference prediction q_2 = sqrt(3)*q_1 = 0.33 nm^-1 at q_1 = 0.19 nm^-1 to contrast against
    the observed distorted-square peak q_2 = 0.29 nm^-1 in alpha-actinin bundles). Both models
    take and return scattering wavevectors in 1/nm.
  assumptions:
    - "2D hexagonal reciprocal-lattice second-order Bragg peak ratio sqrt(3); both ports in 1/nm."

- id: rel_claessens2008_square_spacing_scales_hexagonal
  kind: scales_as
  a: claessens2008/hexagonal_lattice_spacing
  b: pelletier2003/square_lattice_spacing
  mapping:
    q_1: "q_10"
  output_map:
    d: a_H
  regime:
    q_10: [0.1, 1.0]
  provenance: proposed
  reason: >
    Both SAXS spacing formulas convert the first-order inter-filament structure-factor peak
    q_10 (q_1) into real-space center-to-center filament spacing with identical 1/q scaling,
    differing solely by the 2D hexagonal vs. square geometric packing factor 2/sqrt(3) ~= 1.1547
    (a_H = 4*pi / (sqrt(3)*q_10) = 12.4 nm at q_10 = 0.585 nm^-1 for hexagonal fascin-actin
    bundles in claessens2008 p. 2 col. 2 vs. d = 2*pi / q_1 = 33 nm at q_1 = 0.19 nm^-1 for
    distorted-square alpha-actinin-actin bundles in pelletier2003 p. 3 col. 1).
  assumptions:
    - "2D reciprocal-to-real-space Bragg conversion differing by constant geometric factor 2/sqrt(3) (hexagonal vs. square lattice)."
