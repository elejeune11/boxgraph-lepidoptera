# Cross-record provenance audit of values cited between pelletier2003 and the three
# remaining Wave 6 ready partner records (claessens2008, grason2007, tang1996).
#
# 1. pelletier2003 -> tang1996 (ref-13):
#    pelletier2003 cites tang1996 (Ref. [13]) ONLY qualitatively on p. 2 col. 1
#    ("Other bundled states of F-actin were compared to the alpha-actinin system, i.e.,
#    bundling by relatively simple counterion condensation [13]. Bundling agents such as
#    MgCl2, CaCl2, and oligolysines were examined and well-defined bundles were formed as
#    expected [14].") as qualitative background for its 80 mM MgCl2 counterion-bundling
#    control in Fig. 1(b). Zero datums in pelletier2003/data.yaml take a numerical value
#    from tang1996 (`mgcl2_conc_fig1b = 80 mM` is Pelletier's own experimental preparation,
#    not a threshold reported in tang1996; all three `from_source` entries in
#    pelletier2003/data.yaml—`alpha_actinin_width`, `alpha_actinin_length`, and
#    `alpha_actinin_orientation_em`—come from ref-2 or ref-15, neither of which is in
#    the corpus).
# 2. grason2007 -> pelletier2003 (ref-5):
#    grason2007 (published 2007, after pelletier2003) cites pelletier2003 (Ref. [5])
#    solely qualitatively in the Abstract (p. 1) and introductory bracket [3-6] (p. 1 col. 1).
#    Zero datums in grason2007/data.yaml take a numerical value from pelletier2003 (its
#    only two `from_source` datums come from ref-12 Lai et al. 2007 and ref-22 Ikawa et al. 2007).
# 3. claessens2008 + pelletier2003:
#    Neither paper cites the other (claessens2008/references.yaml contains 46 references,
#    none citing pelletier2003; all three `from_source` datums in claessens2008/data.yaml
#    come from ref-35 Tsuda et al. 1996 and ref-36 Ono et al. 1997).
#
# Accordingly, zero CitedLink entries apply to pelletier2003 for these three pairs.
[]
