- id: cmp_domain_size_from_dq2
  purpose: reproduction
  computed: domain_size_dq2_pred
  printed: domain_size_printed
  note: "Compares the reconstructed Scherrer domain size from the second-order peak width (0.136 nm^-1) against the paper's approximate '~50 nm' estimate (no verdict due to '~')."

