  purpose: validation
  computed: q2_square_pred
  printed: q2_saxs
  note: "Compares the ideal square-lattice second-order prediction (0.269 nm^-1) against the observed peak q_2 = 0.29 nm^-1; the +0.021 nm^-1 deviation reflects the paper's assignment to a distorted square lattice."

- id: cmp_q2_hex_vs_obs
  purpose: validation
  computed: q2_hex_pred
  printed: q2_saxs
  note: "Compares the ideal hexagonal-lattice second-order prediction (0.329 nm^-1) against the observed peak q_2 = 0.29 nm^-1; the -0.039 nm^-1 deviation is nearly twice as large as for a square lattice."

