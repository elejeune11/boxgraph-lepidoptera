- id: cmp_q2_square_repro
  purpose: reproduction
  computed: q2_square_pred
  printed: q2_square_printed
  note: "Checks the paper's stated perfect-square prediction q_2 = q_1 * sqrt(2) = 0.27 nm^-1 at q_1 = 0.19 nm^-1."

- id: cmp_q2_hex_repro
  purpose: reproduction
  computed: q2_hex_pred
  printed: q2_hex_printed
  note: "Checks the paper's stated perfect-hexagonal prediction q_2 = q_1 * sqrt(3) = 0.33 nm^-1 at q_1 = 0.19 nm^-1."

- id: cmp_lattice_spacing_repro
  purpose: reproduction
  computed: lattice_spacing_pred
  printed: lattice_spacing_printed
  note: "Checks the paper's stated 33 nm lattice spacing from q_1 = 0.19 nm^-1 via d = 2*pi / q_1."

