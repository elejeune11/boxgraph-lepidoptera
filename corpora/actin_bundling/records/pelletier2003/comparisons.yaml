  purpose: validation
  computed: peak_widths_q2_pred
  printed: saxs_peak_widths_vs_q
  note: "Tests the shape of the prefactor-free Delta_q ~ q^2 disorder broadening law against the two measured peak widths (0.056 and 0.136 nm^-1 at 0.19 and 0.29 nm^-1)."

