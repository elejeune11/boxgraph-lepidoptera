# Calibrated 1200-dpi figure readings for Pelletier et al. (2003), Phys. Rev. Lett. 91, 148102.
# Fig. 2 (embedded 150-ppi JPEG, 8x integer upsampling at 1200 dpi): 4 quantitative fluorescence
# intensity line profiles (a, b, c, d).
# Fig. 3 (embedded 300-ppi lossless grayscale raster, 4x integer upsampling at 1200 dpi):
# (a) 6 log-log SAXS curves + gamma=1:2 raw peak; (b) linear gamma=1:5 data + 1/q background fit;
# (c) background-subtracted gamma=1:5 data + two Gaussian components + peak centers and FWHMs.
# Non-quantitative panels (Fig. 1(a)-(b) micrographs, Fig. 2 center/inset micrographs, Fig. 4 cartoon)
# are documented in figures.md.

