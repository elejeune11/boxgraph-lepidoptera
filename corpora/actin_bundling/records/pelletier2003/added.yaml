- id: scherrer_shape_factor
  quantity: scherrer_shape_factor
  unit: dimensionless
  printed: "1"
  basis: >
    The paper infers a domain size of ~50 nm from the SAXS peak widths (0.056 and 0.136 nm^-1)
    without stating a domain-size formula or shape factor K in L = K * 2*pi / Delta_q. K = 1
    corresponds to the textbook reciprocal-space Scherrer estimate L = 2*pi / Delta_q_FWHM.
  alternatives: ["0.9", "0.5", "0.375"]
  stands_for: "shape factor K in reconstructed Scherrer / correlation-length formula L = K * 2*pi / Delta_q (0.9 = standard Scherrer constant; 0.5 = pi / Delta_q or HWHM factor; 0.375 = sqrt(2*ln 2)/pi Gaussian correlation length)"
