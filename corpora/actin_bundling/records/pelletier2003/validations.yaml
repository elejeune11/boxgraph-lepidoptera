# Cross-record validation audit of pelletier2003 models against independent measurements
# (and partner models against pelletier2003 measurements) across the three remaining ready
# Wave 6 partner records (claessens2008, grason2007, tang1996).
# (Note: borukhov2005+pelletier2003, kierfeld2005+pelletier2003, and pelletier2003+shin2009
# were audited inside those partner records.)
#
# Result: 0 physically valid cross-record validations across these three pairs.
# Every pair was audited individually and recorded in pelletier2003/questions.yaml:
#
# - claessens2008 + pelletier2003 (see q_claessens2008_no_cross_validation):
#   * pelletier2003's runnable non-curve models predict ideal square/hexagonal second-order
#     SAXS peak q_2 from q_1, square-lattice spacing d = 2*pi/q_1, paracrystalline width
#     scaling Delta_q ~ q^2 (prefactor unknown), and reconstructed Scherrer domain size
#     L = K*2*pi/Delta_q.
#   * claessens2008 measures tightly packed hexagonal F-actin/fascin bundles (q_10 = 0.585 nm^-1,
#     a_H = 12.4 nm [origin: derived], axial helical layer lines 1.14-1.46 nm^-1, overtwist
#     Delta_theta(R*), TEM diameters D(R*), droplet ring boundaries, and n_f ~ 20). It has
#     NO measured q_11 scalar datum, NO SAXS peak widths or ordered domain sizes, and does
#     not form a square lattice, so none of pelletier2003's models predicts a measured
#     claessens2008 datum.
#   * Conversely, claessens2008's short-linker fascin models (hexagonal packing, overtwist,
#     saturated 2-shell limit n_f ~ 20, K_d = 0.3 uM) are physically incompatible with
#     pelletier2003's 30 nm antiparallel alpha-actinin distorted-square bundle networks
#     (d = 33 nm, D ~ 400 nm, q_2/q_1 = 1.53 rejecting hexagonal symmetry).
#
# - grason2007 + pelletier2003 (see q_grason2007_no_relation_and_no_validation):
#   * grason2007 is a pure continuum-elasticity theory paper with 0 `origin: measured` datums
#     in grason2007/data.yaml, so no pelletier2003 model can be validated against grason2007.
#   * Conversely, grason2007 models long (L -> oo) chiral filaments in twisted hexagonal-columnar
#     or hexagonal-solid dispersed bundles (d ~ 1-10 nm, l ~ d) with unknown prefactor on
#     lambda_{3 perp} ~ (d*l_p*k_B T / Delta_E)^(1/2) (outputting onset radius, not diameter),
#     whereas pelletier2003 observes a percolating 3D branched network of disordered distorted-
#     square alpha-actinin bundles (d = 33 nm, short gelsolin-capped 300 nm rods in SAXS),
#     without stating alpha-actinin's Delta_E, surface tension Sigma, cholesteric pitch P,
#     persistence length l_p, bundle twist Omega, or even the measurement method/conditions
#     for bundle_diameter_observed (~400 nm, near the 200 nm/pixel LSCM diffraction limit).
#
# - pelletier2003 + tang1996 (see q_tang1996_no_relation_and_no_validation):
#   * tang1996's 58 `origin: measured` datums are 90-deg light-scattering curves and
#     polycation/calponin bundling onset thresholds (mM/uM); it measures zero SAXS peaks,
#     widths, lattice spacings, or domain sizes, so no pelletier2003 model applies to tang1996.
#   * Conversely, tang1996 models nonspecific electrostatic Manning counterion condensation
#     of multivalent cations/polycations on F-actin, whereas pelletier2003 measures specific
#     binding of acidic dimeric alpha-actinin. pelletier2003's sole divalent-ion control
#     (`mgcl2_conc_fig1b = 80 mM`, Fig. 1(b)) is an `origin: reported` supra-threshold
#     preparation condition (not a measured onset threshold), with unstated KCl background,
#     and tang1996 explicitly has no quantitative Manning model predicting ion-specific
#     divalent thresholds (5.5-27 mM).
