- id: scattering_wavevector
  name: scattering wavevector
  dimension: "1/[length]"
  description: Magnitude of the SAXS scattering wavevector q (e.g. Bragg peak positions q_1, q_2) in nm^-1.

- id: diffraction_peak_width
  name: SAXS diffraction peak width
  dimension: "1/[length]"
  description: Width (Delta_q, FWHM in Fig. 3(c)) of a fitted Gaussian SAXS diffraction peak in reciprocal space.

- id: lattice_spacing
  name: real-space inter-filament lattice spacing
  dimension: "[length]"
  description: Characteristic F-actin lattice spacing d = 2*pi/q_1 within alpha-actinin-induced bundles.

- id: ordered_domain_size
  name: ordered lattice domain size
  dimension: "[length]"
  description: Coherent ordered lattice domain size L within an actin/alpha-actinin bundle inferred from SAXS peak broadening.

- id: scherrer_shape_factor
  name: Scherrer shape factor
  dimension: dimensionless
  description: Dimensionless constant K in the reciprocal-space Scherrer / correlation-length relation L = K * 2*pi / Delta_q.

- id: bundle_diameter
  name: actin bundle diameter
  dimension: "[length]"
  description: Transverse diameter of an F-actin/alpha-actinin bundle.

- id: network_mesh_size
  name: bundle network mesh size
  dimension: "[length]"
  description: Characteristic micron-scale mesh size of the 3D branched network of F-actin/alpha-actinin bundles observed by LSCM.

- id: alpha_actinin_width
  name: alpha-actinin dimer width
  dimension: "[length]"
  description: Transverse width of the rod-shaped antiparallel alpha-actinin dimer characterized by electron microscopy.

- id: alpha_actinin_length
  name: alpha-actinin dimer length
  dimension: "[length]"
  description: Longitudinal length of the rod-shaped antiparallel alpha-actinin dimer characterized by electron microscopy.

- id: alpha_actinin_orientation_angle
  name: alpha-actinin orientation angle to actin filament
  dimension: dimensionless
  description: Angle between cross-linking alpha-actinin molecules and F-actin filaments observed by electron microscopy (in deg).

- id: actin_filament_length
  name: F-actin filament length
  dimension: "[length]"
  description: Gelsolin-controlled contour length of F-actin filaments prepared for SAXS experiments.

- id: molar_ratio_alpha_actinin_actin
  name: alpha-actinin to G-actin molar ratio
  dimension: dimensionless
  description: Molar ratio gamma of alpha-actinin to G-actin monomers (printed as 1:N ratios in the paper).

- id: actin_mass_concentration
  name: actin mass concentration
  dimension: "[mass]/[length]**3"
  description: Mass concentration of G-actin or F-actin in solution (in mg/ml).

- id: alpha_actinin_mass_concentration
  name: alpha-actinin mass concentration
  dimension: "[mass]/[length]**3"
  description: Mass concentration of alpha-actinin stock solution used for LSCM sample preparation (in mg/ml).

- id: kcl_concentration
  name: KCl salt concentration
  dimension: "[substance]/[length]**3"
  description: Monovalent KCl concentration controlling polymerization and ionic strength.

- id: mgcl2_concentration
  name: MgCl2 counterion concentration
  dimension: "[substance]/[length]**3"
  description: Divalent MgCl2 concentration used for counterion-induced actin bundle comparison (Fig. 1(b)).

- id: sample_volume
  name: sample volume
  dimension: "[length]**3"
  description: Liquid volume of a prepared LSCM sample on the microscope slide.

- id: temperature
  name: temperature
  dimension: "[temperature]"
  description: Sample preparation temperature (ultracentrifugation temperature in degC).

- id: xray_photon_energy
  name: synchrotron x-ray photon energy
  dimension: "[energy]"
  description: Incident x-ray beam energy at the Stanford Synchrotron Radiation Laboratory.

- id: lscm_xy_resolution
  name: LSCM lateral pixel resolution
  dimension: "[length]"
  description: Lateral (XY) pixel resolution of the laser scanning confocal microscope at highest magnification.

- id: lscm_z_resolution
  name: LSCM axial step resolution
  dimension: "[length]"
  description: Vertical (Z) step spacing in the 3D laser scanning confocal microscopy stack.

- id: saxs_intensity
  name: SAXS scattering intensity
  dimension: dimensionless
  description: Powder-averaged small-angle x-ray scattering intensity I(q) in arbitrary units.

- id: diffraction_peak_index
  name: SAXS diffraction peak ordinal index
  dimension: dimensionless
  description: Integer ordinal index of a resolved SAXS diffraction peak (1 = first-order q_1, 2 = second-order q_2).

- id: line_profile_distance
  name: confocal line-profile distance
  dimension: "[length]"
  description: Linear coordinate distance along an LSCM fluorescence intensity line profile across a bundle junction (Fig. 2(a)-(d)).

- id: fluorescence_intensity
  name: LSCM fluorescence intensity
  dimension: dimensionless
  description: Relative 8-bit confocal fluorescence intensity (0-255 scale, arbitrary units) measured along a bundle junction line profile (Fig. 2(a)-(d)).
