notes: >
  Full quantitative reading of Totz et al. (2024), covering the main report (PDF pp. 1-10),
  Experimental Procedures / STAR Methods (PDF pp. 10-12), References (PDF pp. 13-14), and
  Supplemental Information (PDF pp. 15-23: Fig. S1, Table S1, Note S1, Note S2 Eqs. E1-E49,
  and Supplemental References S1-S6).

  Scope included:
  - Every elasticity, constitutive, nondimensionalization, and buckling model across the main
    text and SI Note S2: bending modulus D, growth strain definition g = dl/l0, 3D/2D Hooke
    plane-stress constitutive relations (Eqs. E13, E15-E17), growth pre-stress sigma_A = Y*g,
    2D Föppl-von-Kármán (FvK) PDEs (Eqs. 1-2 / E7-E8, non-runnable due to unstated 2D FEM
    geometry/mesh/BCs along y), FvK dimensional scales (Eqs. E30-E37), 1D ODE coefficients
    (Eq. E42), exact zero-pressure 1D buckled profile and amplitude (Eq. E44), uniform
    post-buckling in-plane stress tensor (Eqs. E45-E47), critical buckling growth strain
    (Eq. 4 / E48) and its L^-2 scaling law, Rayleigh-Ritz pressurized buckling relation
    (Eq. 3 / E49) solved for strain g, amplitude a, and minimum Young's modulus Y_min at g = 0,
    buckled cosine profile shape, reconstructed exact 1D coupled ODE+integral-constraint
    finite-difference solver (Eqs. E42 + E29) with grid refinement on both w_max and w_min,
    and profile-filtering accounting checks (4074 -> 3883 -> 3722 = 607+639+744+821+911).
  - Every printed parameter, measurement, microscopy specification, developmental timing,
    profile count, Table S1 parameter, and printed prediction (notably Y_min = 3.5 x 10^6 Pa
    on p. 8).

  Key mathematical and reading findings:
  1. Major dimensional misprint in printed Eq. 3 (p. 6) and Eq. E49 (p. 22): prints
     g/g_c = 1 + 3*h^2*a^2/4 - p*L^2/(a*pi^2*Y*g_c*h^3), whose terms have dimensions
     [L]^4 and [L]^-2 instead of dimensionless. This arises from applying the inverse
     nondimensionalization a_tilde -> h*a instead of a/h when restoring units from Eq. E33.
     Evaluated literally in SI meters, Eq. 3 fails to reproduce Y_min = 3.5 x 10^6 Pa by
     ~16 orders of magnitude (~1.9 x 10^22 Pa). A corrected variant (replacing 3*h^2*a^2/4
     with 3*a^2/(4*h^2) and h^3 with h) matches Eq. E44 in the p -> 0 limit, reproduces
     Y_min = 3.5 x 10^6 Pa (for w_0(39.6%) = 25 nm from Fig. 3A, entered in added.yaml),
     and matches the contours of Figs. 3H and 4C.
  2. Additional SI Note S2 misprints documented with questions (and corrected variants where
     applicable): Eq. E22 prints (du/dx + dv/dy) instead of (du/dy + dv/dx) for shear strain
     eps_xy; Eqs. E36-E37 print u,v -> YL/2h^2 (dimensionally invalid, containing Y; physical
     scale is h^2/(L/2)); Eq. E42 prints a = 12(1-nu^2)((L/(2h))^2*g - c*Y*h^2) mixing
     dimensional and dimensionless conventions (-c*Y*h^2 should be -(L/(2h))^2*(c/Y) for
     dimensional stress c, or -c for dimensionless c); pre-stress sigma_A = Y*g omits the
     isotropic plane-stress factor 1/(1-nu).
  3. Figure/caption discrepancies noted for audit/digitize: Fig. 3F caption prints "40.6%"
     whereas Fig. 3A-G axes, Fig. 3H caption, and p. 7 text all state "40.7%"; Fig. 2E
     curves appear to plot w(x) = a*(1 + cos(2*pi*x/L)) (peak 2*a) rather than w(0) = a,
     and its Y, p, and L subpanels appear to use g = 0.5% (and L0 = 1.0 um for the L panel)
     rather than the caption's g = 0.01 and L = 1.8 um.

