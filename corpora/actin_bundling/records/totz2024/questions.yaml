    cuticular folds: taenidial folds in Drosophila trachea vs. inter-bundle protoridges in
    butterfly wing scales). Rather than alternative formulations of the same equations, the two
    papers represent a sequential upstream-to-downstream physical coupling: upstream 1D/2D
    viscous active-gel cortical instability with turnover predicting periodic actin spacing
    lambda_c (hannezo2015) feeding into downstream static Föppl-von-Kármán (FvK) elastic plate
    buckling of a growing membrane/nascent cuticle clamped at fixed inter-bundle spacing L
    (totz2024, which notes on p. 10 that the upstream actin-scaffold patterning mechanism is left
    unmodeled). Quantitative evaluation of the sequential interface yields five findings:
    (1) Direct algebraic coupling of g_c to active-gel parameters: setting totz2024's clamped
    bundle spacing L equal to hannezo2015's linear onset wavelength lambda_c =
    2*pi*(D*tau*eta/xi)^(1/4) = 2*pi*sqrt(l_t*l_h) = 2*pi*l_h*phi^(-1/4) (critical_wavelength_eq3,
    critical_wavelength_from_lengths, critical_wavelength_dimensionless) substitutes directly into
    totz2024's critical Euler buckling strain g_c = (pi^2 / (3*(1 - nu^2)))*(h/L)^2
    (critical_growth_strain_eq4, scaling g_c ~ L^-2) to give the exact composed threshold
    g_c = h^2 / (12*(1 - nu^2)*l_t*l_h) = (h^2 / (12*(1 - nu^2)))*(xi / (D*tau*eta))^(1/2) =
    h^2*phi^(1/2) / (12*(1 - nu^2)*l_h^2), where pi^2 cancels (2*pi)^2 cleanly and cortex
    thickness h_c cancels inside eta/xi = eta_3D/gamma_3D while elastic plate thickness h enters
    as h^2. Hence totz2024's g_c ~ L^-2 couples directly to hannezo2015's (D*tau*eta/xi)^(-1/2):
    higher cortical-ECM friction xi shrinks lambda_c ~ xi^(-1/4) and raises g_c ~ xi^(+1/2),
    suppressing buckling, whereas lower friction widens lambda_c and lowers g_c.
    (2) Exact wavelength-to-spacing overlap across Drosophila trachea and butterfly wing scales:
    in stark contrast to bois2011's C. elegans cortical scale (ell ~ 10 um giving lambda ~ 51-67 um,
