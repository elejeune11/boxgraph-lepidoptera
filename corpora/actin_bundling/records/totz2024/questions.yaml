  text: >
    No cross-record validations are entered in validations.yaml for either totz2024 or hannezo2015
    (0 entries in both directions): neither paper cites the other, and no model in either record
    genuinely predicts any measurement of the other on that measurement's own experimental
    conditions.
    (1) totz2024 models (34 models: 29 elastic-plate FvK/constitutive models and 5 data-processing
    helpers) vs hannezo2015 measurements (35 origin: measured entries):
    (a) All 10 measured actin-ring and taenidial-fold wavelengths (ring_wavelength_embryo_wt =
    0.5 +/- 0.1 um, ring_wavelength_si_input = 5e-7 m, ring_wavelength_larva_wt_early = 1.2 +/-
    0.1 um, ring_wavelength_larva_wt_fig1c = 1.2 um, ring_wavelength_src42 = 0.8 +/- 0.2 um,
    taenidial_wavelength_larva_wt_late = 1.45 +/- 0.3 um, taenidial_wavelength_moesin_rnai =
    1.8 +/- 0.5 um, ring_wavelength_kkv1 = 4.5 +/- 2 um, fig3b_bar_ring_spacing_data,
    figs2d_moesin_rnai_spacing_data): totz2024 treats inter-bundle spacing L as a fixed external
    upstream input rather than predicting actin scaffold spacing (p. 10 explicitly leaves the
    upstream actin-patterning mechanism unmodeled). The only elastic models in totz2024 that output
    actin_bundle_spacing (rayleigh_ritz_width_eq3 and rayleigh_ritz_width_eq3_corrected) are
    algebraic inversions of Eq. 3 used to trace constant-amplitude isocontours in Fig. 4C and
    require 6 buckling inputs (growth_strain g, protoridge_amplitude a = w_0, transverse_pressure
    p, youngs_modulus Y, poisson_ratio nu, and plate_thickness h), 0/6 of which are measured or
    reported in hannezo2015 (hannezo2015's reported cortical_thickness_lit = 100 nm is apical
    actomyosin cortex thickness, not nascent cuticle membrane thickness h, and hannezo2015 measures
    no taenidial fold amplitude w_0, cuticle modulus Y, pressure p, or growth strain g). Meanwhile,
    totz2024's remaining [length] outputs are buckling height/amplitude profiles or scaling/processing
    helpers (buckled_profile_cosine*, rayleigh_ritz_amplitude_eq3*, zero_pressure_*_e44,
    fvk_1d_ode_solver_e42_e29, fvk_dimensional_scales_e30_e35, in_plane_displacement_scale_*,
    extract_species_spacings, scale_bundle_spacing, fit_cosine_amplitude) that do not predict
    tracheal actin-ring period.
    (b) Both measured ring counts per cell (rings_per_cell_embryo_wt = 15 to 20,
    rings_per_cell_kkv1 = ~1): totz2024 models a single clamped inter-bundle membrane strip of
    prescribed width L and contains no model predicting the number of actin rings per cell.
    (c) All 6 FRAP transport and kinetics measurements (turnover_time_frap = 15 +/- 7 s,
    diffusion_coeff_frap = 0.04 +/- 0.03 um^2/s, immobile_fraction_frap < 20%, frap_sample_size =
    10, fig2a_frap_recovery_data, fig2a_frap_variance_data): totz2024 is a static thin-plate
    elasticity theory with zero [time]-, [length]^2-, or [length]^2/[time]-valued model outputs
    and no actin turnover, diffusion, or photobleaching model.
    (d) All 7 developmental actin-recruitment measurements (actin_increase_onset_text = 60%,
    actin_increase_onset_fig1a = 70%, fluorescence_onset_si = 114, fluorescence_plateau_si = 156,
    fig1a_actin_intensity_data, ring_onset_time_range = 10.2 to 21.2 min, ramp_duration_si =
    1875 s): totz2024 models neither cortical actin fluorescence concentration nor temporal
    upregulation ramps.
    (e) All 7 tracheal tube-diameter, gamma-COP secretion, and constriction measurements
    (cop_het_diameter_change, cop_het_actin_change, cop_hom_diameter_change, cop_hom_actin_change,
    fig4f_cop_actin_vs_diameter_data, side_branch_diameter_ratio, fig3c_kkv_diameter_vs_actin_data):
    totz2024 models planar buckling of a flat membrane strip between parallel bundles rather than
    cylindrical epithelial tube diameter, apical secretion, or contractile pearling constrictions.
    (f) All 3 spectral and spacing-distribution measurements (fig1c_fourier_spectrum_data,
    fig3b_dist_wt_data, fig3b_dist_src42_data): all totz2024 models are deterministic single-ridge
    buckling equations and output no actin fluorescence Fourier spectra or ring-spacing probability
    histograms.
    (2) hannezo2015 models (52 models) vs totz2024 measurements (37 origin: measured and 24 origin:
    reported entries): zero valid on-conditions cross-validations exist as well. While
    hannezo2015/critical_wavelength_eq3 (lambda_c = 2*pi*(D*tau*eta/xi)^(1/4)) and
    critical_wavelength_from_lengths output periodic actin spacing, totz2024 measures 0/4 active-gel
