    No cross-record validations are entered in validations.yaml for either bois2011 or totz2024
    (0 entries in both directions): neither paper cites the other, and no model in either record
    genuinely predicts any measurement of the other on its own experimental conditions.
    (1) bois2011 models (26 models) vs totz2024 measurements (37 origin: measured and 24 origin:
    reported entries):
    (a) Inter-bundle actin spacings and protoridge widths (d_fig3G_L_mean, d_fig3G_L_median_iqr
    across 39.6%-41.0% development in V. cardui; d_fig4C_species_spacings for C. eurytheme
    0.341/0.801 um, A. vanillae 0.360/0.910 um, V. cardui 1.601 um; and reported L_Vcardui_p8 =
    1.6 um, L_ref_Vcardui_p6, L_tableS1): none of bois2011's 26 models outputs a dimensional
    pattern wavelength or inter-peak spacing ([length]). The only [length]-valued model output
    in bois2011 is bois2011/hydrodynamic_length (ell = sqrt(eta/gamma)), which is the active-fluid
    velocity decay length rather than the emergent pattern period lambda = 2*pi/k (lambda ~
    5.1-6.7*ell in bois2011's examples; mapping actin_bundle_spacing to hydrodynamic_length would
    conflate distinct physical quantities sharing only dimension [length]), whereas
    single_species_fastest_mode and asdm_stability_boundary output dimensionless wavenumbers k*ell.
    Moreover, bois2011 prints no dimensional cortical parameter values at all
    (bois2011/q_no_dimensional_params; its added values are generic C. elegans estimates giving
    ell = 10 um, ~32-195x too large for butterfly scales), and totz2024 measures none of the
    active-fluid parameters (eta, gamma, (zeta*Delta_mu)_0, D, Pe, D_a/D_s, rho_a, rho_s, L_sys/ell)
    for developing butterfly scales. In addition, bois2011's single-species PDE coarsens to a
    single peak (n_peaks = 1), and its uniform-period 1D ASDM steady states cannot produce the
    bimodal alternating spacings (0.910 and 0.360 um) on the same upper surface of A. vanillae
    (see q_bois2011_upstream_spacing_interface).
    (b) Protoridge surface height profiles and peak buckling amplitudes (protoridge_height_approx,
    d_fig1E_profile_35_8pct through d_fig1G_profile_41_0pct, d_fig3A_invivo_39_6pct through
