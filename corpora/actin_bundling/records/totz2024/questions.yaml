    approximated_by) or cited.yaml link connects bois2011 and totz2024: totz2024 does not cite
    bois2011 (none of Refs. 1-63 or S1-S6), and the two papers model physically distinct,
    sequentially decoupled stages of morphogenesis — upstream 1D overdamped active-fluid
    advection-diffusion-reaction patterning of a viscous cortex (bois2011) versus downstream
    static Föppl-von-Kármán (FvK) elastic plate buckling of a growing membrane/nascent cuticle
    clamped between pre-existing actin bundles (totz2024, which explicitly notes on p. 10 that
