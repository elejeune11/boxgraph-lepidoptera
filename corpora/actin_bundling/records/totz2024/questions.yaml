- id: q_rayleigh_ritz_vs_exact_1d_ode
  kind: numerics
  about:
    - fvk_1d_ode_solver_e42_e29
    - rayleigh_ritz_amplitude_eq3_corrected
    - rel_ode_approximated_by_rr_corrected
  text: >
    The paper approximates the pressurized 1D FvK ODE (SI Eq. E42 + integral constraint Eq. E29)
    with a single-mode cosine Rayleigh-Ritz ansatz (Eq. 3 / E49). Solving the exact coupled 1D
    BVP numerically with a 2nd-order finite-difference grid shows that the single-mode
    Rayleigh-Ritz amplitude underestimates the exact 1D peak height by ~0.3%-1.8% across the
    biological parameter range (e.g., 24.95 nm vs 25.34 nm at g = 0, Y = 3.5 x 10^6 Pa,
    L = 1.6 um, p = 10 Pa), while maintaining strict non-negativity (w_min = 0) across all grids.
  citation:
    page: 22
    quote: "solved approximately with the Rayleigh-Ritz method [S6]."
    where: "SI Note S2, Eqs. E42 and E49"

- id: q_1d_monge_ampere_not_zero
  kind: possible_error
  about:
    - fvk_2d_plate_eq1_eq2
    - ode_coefficients_e42
    - ode_coefficients_e42_corrected
    - fvk_1d_ode_solver_e42_e29
  text: >
    On p. 6, the main text claims that assuming a y-invariant profile w(x) "removes the nonlinear
    terms from the FvK equations, because the Monge-Ampere bracket simplifies to [chi, w] = 0
    (see Note S2)", and SI Note S2 (p. 21) similarly asserts that y-invariance of w "eliminates
    the non-linearity of the problem" and reduces Eq. E8 to d^4(chi)/dx^4 = 0 (Eq. E38). Both
    statements contradict the paper's own derivation: setting w = w(x) sets K_G = 0 so Eq. E8
    becomes the 2D biharmonic equation Delta^2(chi) = 0 (not d^4(chi)/dx^4 = 0 alone, since
    Eq. E41 chi(x, y) = (c/2)*(nu*x^2 + y^2) depends quadratically on y), and the Monge-Ampere
    bracket evaluates to [chi, w] = chi_yy * w_xx = c * w''(x) != 0. Indeed, Eq. E42 retains the
    -h*[chi, w] = -h*c*w'' stretching term inside coefficient a, and c is nonlinearly coupled to w
    through the lateral integral constraint, producing the cubic saturation term 3*a^2/(4*h^2) in
    Eq. 3 / E49 and finite amplitude in Eq. E44 (if [chi, w] truly vanished, no post-buckling
    equilibrium amplitude would exist).
  citation:
    page: 6
    printed_page: "5"
    quote: "equations, because the Monge-Ampère bracket simplifies to"
    where: "text (and SI Note S2, Eq. E38, p. 21)"

- id: q_si_bc_shift_e27_e29_inconsistency
  kind: possible_error
  about:
    - fvk_1d_ode_solver_e42_e29
    - zero_pressure_profile_e44
    - postbuckling_stress_e45_e47
  text: >
    SI Note S2 mixes pre-shift and post-shift conventions across its boundary conditions (pp. 19-22):
    (1) After shifting chi -> chi - sigma_A*(x^2 + y^2)/2 (p. 18) and u -> u + g*x so that
    u(x = +-L/2, y) = +-g*L/2 -> 0 (p. 19), Eq. E27 (p. 20) writes dv/dy = (1/Y)*chi_xx -
    (nu/Y)*chi_yy = g, directly contradicting Eq. E40 (p. 21, chi_xx - nu*chi_yy = 0) and Eq. E41
    (chi = (c/2)*(nu*x^2 + y^2), which satisfies E40, not E27).
    (2) Eqs. E28-E29 (p. 21) write u(+L/2, y) - u(-L/2, y) = L*g and
    int_{-L/2}^{L/2} (-(nu/Y)*chi_xx + (1/Y)*chi_yy - (1/2)*(dw/dx)^2) dx' = L*g, contradicting
    both p. 19 (u(+-L/2, y) -> 0) and the paper's own solutions Eqs. E44-E46 (p. 22), which
    require RHS = 0 in Eq. E29 so that (1 - nu^2)*c/Y = (1/(2*L))*int (w')^2 dx (with RHS = L*g,
    even the flat state w = 0 would yield c = Y*g/(1 - nu^2) != 0). The reconstructed solver
    fvk_1d_ode_solver_e42_e29 implements the consistent RHS = 0 form of Eq. E29.
    (3) On p. 19, the text mislabels the in-plane y-displacement v as "the vertical displacement v"
    and states dv/dx|_{x=+-L/2} = 0 alongside v(+-L/2) = 0 (overconstraining 2D in-plane
    elasticity; Eq. E27 differentiates v along y, not x), and Eq. E43 (p. 22) omits the odd
    homogeneous solution terms c_3*x + c_4*sin(sqrt(a)*x) without explicitly invoking even
    symmetry or noting the higher antisymmetric buckling threshold.
  citation:
    page: 21
    quote: "Utilizing the fundamental theorem of calculus and (E23), constraint (E28) can be recast as an"
    where: "SI Note S2, Eqs. E28-E29 (and p. 19 BCs, Eq. E27, Eq. E40, Eq. E43)"

