  text: >
    Cross-paper ModelAtlas comparison between gov2018 (N. S. Gov, Phil. Trans. R. Soc. B 373:20170115,
    2018) and totz2024 (Totz et al., Cell Rep. Phys. Sci. 5:102063, 2024; neither paper cites the other,
    so there are zero stated relations and zero cited.yaml links) reveals an exact linearized 4th-order
    flat bending-compression operator isomorphism connecting gov2018/flat_membrane_instability_thresholds
    (lambda_c) and gov2018/tube_equilibrium_radius (R_tube) to totz2024/rayleigh_ritz_width_eq3_corrected
    (L) at zero pressure and small onset amplitude (rel_gov2018_rr_width_scales_tube_radius,
    rel_gov2018_rr_width_approx_flat_lambda_c, rel_gov2018_flat_lambda_c_scales_rr_width), alongside six
    irreducible structural, geometric, and constitutive contrasts that prohibit merging the two models
    into a same_as family or linking gov2018/cylindrical_ring_critical_mode to totz2024/fvk_1d_ode_solver_e42_e29:
    (1) No relation between gov2018/cylindrical_ring_critical_mode and totz2024/fvk_1d_ode_solver_e42_e29
    (geometry, observable, and flat-limit contrast): despite sharing a superficial dimensional signature
    ([length] output from [length] and [pressure] inputs), the two models describe incompatible geometries
    and physical observables. totz2024 models planar buckling of a flat elastic membrane/cuticle strip
    clamped between parallel longitudinal actin bundles on butterfly wing scales (not a cylindrical shell),
    and fvk_1d_ode_solver_e42_e29 outputs the out-of-plane peak ridge deflection w_max (and relaxed
    stretching stress c) at externally fixed spacing L. Conversely, gov2018/cylindrical_ring_critical_mode
    models axisymmetric radial constriction on a fluid cylindrical tube of radius R_0 and outputs the
    internally selected axial ring wavelength lambda_max (and wavenumbers q_c, q_max) from a quartic
    radial-bending dispersion denominator 1 + (1 - H_0*R_0*n_0)*(q*R_0)^2 + (q*R_0)^4; because Section 4
    couples CMCs solely to circumferential curvature c_theta ~ 1/R (H_hn = H_0*kappa/R_0^2 -> 0 as
    R_0 -> oo), cylindrical_ring_critical_mode does not even reduce to gov2018's own flat-membrane
    instability in the R_0 -> oo limit, nor to totz2024's planar FvK plate.
    (2) Solid elastic FvK stretching saturation vs. fluid Helfrich membrane with protein phase coupling:
    in totz2024, the cell membrane plus nascent cuticle (h = 20 nm, Y = 1-3.7 MPa) is a thin solid elastic
    plate with bending rigidity D = Y*h^3/(12*(1 - nu^2)) = 0.889-3.29 pN*um (216-799 k_B*T, ~2.2-8x above
    gov2018's bare fluid lipid bilayer range kappa/k_B*T ~ 1-100 on p. 3) and nonzero in-plane shear
    modulus. Nonlinear in-plane stretching via the Airy stress potential -h*[chi, w] = -h*c*w'' and
    clamped integral constraint (1 - nu^2)*c/Y = (1/(2*L))*int (w')^2 dx generates the cubic stiffening
    term 3*a^2/(4*h^2) in Eq. (3) and stabilizes supercritical post-buckling amplitude a = (2*h/sqrt(3))
    *sqrt(g/g_c - 1). In gov2018, the lipid bilayer is a 2D fluid with zero in-plane shear/stretching
    modulus; buckling-like destabilization arises solely by active CMC feedback turning the positive
    bare tension sigma > 0 effectively compressive (Sigma_comp = sigma_c - sigma > 0 while softening
    kappa -> kappa_eff_soft = kappa/(1 + alpha*n_0)), and Eq. (2.1)'s ideal-gas entropy provides no
    elastic stretching or steric saturation cap (gov2018/q_ideal_gas_entropy_no_steric_cap). Consequently,
    the shared linear bending-compression operator matches totz2024 within 10% across Fig. 4C's early-onset
    regime (a = 5-10 nm, p = 1-10 Pa, Y >= 3.5 MPa; rel_gov2018_rr_width_approx_flat_lambda_c), but
    diverges by 11-64% at mature protoridge amplitudes (a = 24.3-64.3 nm > h = 20 nm in Figs. 3A-E).
    (3) Uniform outward turgor pressure p vs. zero-mean spatially modulated active force A*(n - <n>):
    totz2024 drives out-of-plane symmetry breaking with a spatially uniform outward pressure differential
    p = 10 Pa (turning the Euler pitchfork into an imperfect bifurcation with w > 0 for all g >= 0,
    enabling Y_min = 3.5 MPa at g = 0). By contrast, gov2018 (p. 3 col. 1) explicitly subtracts the
    uniform average cytoskeletal load A*<n> from Eq. (2.3) and couples only spatially varying deviations
    A*(n - <n>) to mobile CMC density.
    (4) Static variational equilibrium vs. overdamped conserved/myosin dynamics and fastest-mode divergence:
    totz2024 is strictly static (zero [time]-valued models), with buckling onset locked to the static
    marginal Euler wavenumber q_Euler = sqrt(h*Y*g/D). gov2018 is an overdamped 2-field (or 3-field with
    myosin-II, Eqs. 5.1-5.2) dynamical PDE system with membrane drag xi and lateral mobility Lambda,
    supporting growth rates omega(q), nonlinear coarsening, and propagating acoustic waves (none present
    in totz2024). Even at xi -> 0, J = 0, gov2018's dynamically selected fastest-growing flat-membrane
    wavelength lambda_max = 2*pi*ell_mem / sqrt(sqrt(Pe_eff) - 1) differs from the static marginal cutoff
    lambda_c = 2*pi*ell_mem / sqrt(Pe_eff - 1) by sqrt(sqrt(Pe_eff) + 1) (-> sqrt(2) near onset,
    scaling as Pe_eff^-1/4 vs. Pe_eff^-1/2 far above onset, and diverging to infinity as bare tension
    sigma -> 0 where L_Euler stays finite).
    (5) Clamped vs. Neumann boundary quantization (factor of 2 in wavelength, 4 in critical strain):
    in gov2018/cylindrical_critical_tube_length (p. 7), a growing tube with no-flux Neumann ends first
    destabilizes at q_1 = pi/L_c, giving lambda_c = 2*L_c. In totz2024 (p. 6, Eq. 4 / Eq. E44), tight
    actin-bundle attachment imposes clamped BCs w(+-L/2) = w'(+-L/2) = 0 with fundamental mode
    w(x) = (a/2)*(1 + cos(2*pi*x/L)) at q_1 = 2*pi/L (lambda = L), doubling the wavenumber and raising
    the critical Euler buckling strain g_c propto q_1^2 by 4x relative to pinned/Neumann ends.
    (6) Upstream-to-downstream biophysical scale comparison and coarsening gap: despite totz2024's
    plate being ~11-40x stiffer in bending (D = 0.89-3.29 vs. gov2018 baseline kappa = 0.0823 pN*um) and
    carrying ~25-93x higher 2D in-plane stress resultant (N_comp = 100-370 vs. sigma = 4 pN/um at g = 0.5%),
    both ratios yield nearly identical sub-micron crossover lengths (totz2024 ell_plate = sqrt(D/(h*Y*g))
    = 0.0943 um -> L_Euler = 0.592 um, independent of Y, vs. gov2018 baseline ell_mem = 0.143 um ->
    R_tube = 0.101 um, lambda_c = 0.901 um, lambda_max = 1.35 um). Feeding gov2018's baseline flat
    fastest-growing wavelength (1.35 um) or cylindrical ring spacing (1.44 um at R_0 = 0.15 um) into
    totz2024's clamped-plate buckling model (h = 20 nm, nu = 0.5, Y = 1 MPa, p = 10 Pa, g = 0.5%) yields
    g_c = 0.097% and 0.085% and protoridge amplitudes a = 55.9 and 60.6 nm, falling squarely inside
    totz2024's ridged butterfly wing scale regime (0.801-1.601 um; a = 26.2-69.4 nm). However, because
    CMC density is strictly conserved in gov2018 Eqs. (2.4)-(2.8), nonlinear dynamics coarsen periodic
    protrusions/rings indefinitely into fewer, thicker structures (Fig. 3c) rather than stabilizing a
    uniform periodic array (or A. vanillae's bimodal alternating spacing L_1,B = 0.910 um, L_2,B = 0.360 um)
    unless arrested by turnover or cross-linking outside gov2018's equations.
