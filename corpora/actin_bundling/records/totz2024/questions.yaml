    quantitative constraints required to couple them:
    (1) Interface variable and symbol overloading: in bois2011, L (in L/ell) is the macroscopic
    1D cortical domain extent [0, L], whereas the inter-peak pattern spacing is an emergent
    wavelength lambda = 2*pi/k (or L_sys/n_peaks); in totz2024, L (actin_bundle_spacing) is a
    single inter-bundle period (1.60 um in V. cardui, 0.801/0.341 um in C. eurytheme,
    0.910/0.360 um in A. vanillae) treated as a fixed, externally imposed clamped boundary
    condition (w = dw/dx = 0; constant during buckling, Fig. 3G). Other symbols are also
    overloaded across the two records: D is regulator diffusivity [m^2/s] in bois2011 vs plate
    bending modulus Y*h^3/(12*(1 - nu^2)) [N*m] in totz2024; h is unmodeled fluid film thickness
    in bois2011 vs elastic plate thickness 20 nm in totz2024; u and v are ln(c) and bulk flow
    velocity in bois2011 vs in-plane elastic displacements in totz2024.
    (2) Quadratic buckling sensitivity to upstream wavelength: identifying totz2024's fixed
    bundle spacing L with an upstream pattern wavelength lambda = 2*pi/k_pattern turns Eq. 4
    (critical_growth_strain_eq4) into g_c = (pi^2 / (3*(1 - nu^2)))*(h/lambda)^2 =
    h^2*k_pattern^2 / (12*(1 - nu^2)). A ~2.3-2.5x reduction in upstream spacing (C. eurytheme
    L_1,A/L_2,A = 0.801/0.341 = 2.35; A. vanillae L_1,B/L_2,B = 0.910/0.360 = 2.53) raises g_c
    by 5.52-6.39x (0.274% -> 1.51% and 0.212% -> 1.35%), crossing above Table S1's growth-strain
    range g in [0, 0.7%] and suppressing ridge buckling.
    (3) Single-species coarsening vs multi-species turnover: in bois2011's conserved single-species
    model (single_species_dispersion_eq12, single_species_fastest_mode, single_species_pde_eq1_3),
    the fastest-growing continuum linear mode has finite wavelength lambda_lin = 2*pi*ell /
