- id: q_prestress_poisson_factor
  kind: reading
  about:
    - prestress_growth
    - hooke_plane_stress_e15_e17
    - critical_growth_strain_eq4
  text: >
    In SI Note S2 (pp. 18-19), the paper adds isotropic growth pre-stress sigma_A = Y*g under
    additive strain decomposition (eps_total = eps_e + g). However, under the paper's own 2D
    plane-stress Hooke law (SI Eqs. E15-E16), clamped isotropic growth strain eps_e,xx = eps_e,yy = -g
    produces sigma_xx = sigma_yy = -Y*g/(1 - nu) (a factor of 1/(1 - nu) = 2 larger for nu = 0.5).
    The paper's subsequent formulas (Eqs. 4, E44-E48) are algebraically self-consistent with
    defining pre-stress as sigma_A = Y*g (effectively rescaling g by 1 - nu relative to a 2D
    biaxial isotropic growth strain).
  citation:
    page: 18
    quote: "with σA = Yg (assuming additive decomposition of elastic and growth"
    where: "SI Note S2"

