- id: q_eq3_e49_dimensional_misprint
  kind: possible_error
  about:
    - rayleigh_ritz_strain_eq3
    - rayleigh_ritz_amplitude_eq3
    - youngs_modulus_lower_bound_eq3
    - cmp_Ymin_printed_eq3
    - Y_min_printed
  text: >
    Eq. 3 (p. 6) and SI Eq. E49 (p. 22) both print g/g_c = 1 + 3*h^2*a^2/4 - p*L^2/(a*pi^2*Y*g_c*h^3),
    which is dimensionally inconsistent: 3*h^2*a^2/4 has dimension [length]^4 and
    p*L^2/(a*pi^2*Y*g_c*h^3) has dimension [length]^-2, while g/g_c and 1 are dimensionless.
    This arises from substituting dimensionless amplitude a_tilde -> h*a instead of a/h when
    restoring units from SI Eq. E33 (w -> h*w). Evaluated literally in SI units, printed Eq. 3
    fails to reproduce Y_min = 3.5 x 10^6 Pa by ~16 orders of magnitude (~1.9 x 10^22 Pa) and
    fails to reduce to SI Eq. E44 as p -> 0. The dimensionally corrected variants
    (replacing 3*h^2*a^2/4 with 3*a^2/(4*h^2) and h^3 with h) match SI Eq. E44 exactly at p -> 0,
    reproduce Y_min = 3.5 x 10^6 Pa (for w_0(39.6%) = 25 nm), and match Figs. 3H and 4C.
  citation:
    page: 6
    printed_page: "5"
    quote: "Using the Rayleigh-Ritz approximation method to compute the maximum"
    where: "Eq. 3 (and SI Eq. E49, p. 22)"

