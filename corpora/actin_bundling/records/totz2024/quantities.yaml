- id: plate_thickness
  name: scale membrane / cuticle plate thickness
  dimension: "[length]"
  description: Thickness h of the developing scale cell membrane and nascent cuticle layer modeled as a thin elastic plate.

- id: actin_bundle_spacing
  name: inter-bundle actin spacing / protoridge width
  dimension: "[length]"
  description: Distance L between adjacent parallel sub-membrane actin bundles confining the growing cell membrane (equal to protoridge width).

- id: protoridge_height
  name: protoridge surface height profile
  dimension: "[length]"
  description: Out-of-plane surface deflection w(x) of the buckling scale cell membrane relative to the clamped actin-bundle attachment lines.

- id: protoridge_amplitude
  name: maximum protoridge buckling amplitude
  dimension: "[length]"
  description: Peak out-of-plane deflection a = w(x = 0) (also denoted w_0) centered midway between two adjacent actin bundles.

- id: lateral_position
  name: lateral position across protoridge
  dimension: "[length]"
  description: Spatial coordinate x perpendicular to the actin bundles, spanning [-L/2, +L/2] with x = 0 at the protoridge center.

- id: youngs_modulus
  name: plate Young's modulus
  dimension: "[mass] / [length] / [time]**2"
  description: Elastic Young's modulus Y of the developing scale cell membrane / soft cuticle layer.

- id: bending_modulus
  name: plate bending modulus
  dimension: "[mass] * [length]**2 / [time]**2"
  description: Flexural rigidity D = Y*h^3 / (12*(1 - nu^2)) of the thin elastic plate.

- id: poisson_ratio
  name: plate Poisson's ratio
  dimension: "dimensionless"
  description: Poisson's ratio nu of the elastic membrane / cuticle plate.

- id: transverse_pressure
  name: outward cytoplasmic pressure differential
  dimension: "[mass] / [length] / [time]**2"
  description: Spatially uniform transverse pressure differential p between cell-internal (cytoplasmic) and cell-external spaces.

- id: growth_strain
  name: isotropic membrane growth strain
  dimension: "dimensionless"
  description: Growth-induced pre-strain g = delta_l / l_o measuring relative linear expansion of the confined membrane plate.

- id: critical_growth_strain
  name: critical Euler buckling growth strain
  dimension: "dimensionless"
  description: Critical growth strain g_c at which a clamped plate buckles at zero transverse pressure (p = 0).

- id: length_change
  name: growth-induced length change
  dimension: "[length]"
  description: Change in material length delta_l = l_g - l_o due to membrane growth.

- id: reference_length
  name: unstrained reference length
  dimension: "[length]"
  description: Original unstrained distance l_o in the membrane plate prior to growth.

- id: in_plane_stress
  name: in-plane plate stress component
  dimension: "[mass] / [length] / [time]**2"
  description: Component of the 2D in-plane Cauchy stress tensor (sigma_xx, sigma_yy, sigma_xy) or isotropic growth pre-stress sigma_A.

- id: in_plane_strain
  name: in-plane plate strain component
  dimension: "dimensionless"
  description: Component of the 2D center-surface strain tensor (eps_xx, eps_yy, eps_xy).

- id: out_of_plane_strain
  name: out-of-plane normal strain
  dimension: "dimensionless"
  description: Through-thickness normal strain component eps_zz determined by plane-stress condition sigma_zz = 0.

- id: airy_stress_potential_scale
  name: Airy stress potential characteristic scale
  dimension: "[mass] * [length] / [time]**2"
  description: Characteristic scale chi_0 = Y*h^2 used to nondimensionalize the Airy stress potential chi in SI Eq. E34.

- id: characteristic_length_scale
  name: half-spacing characteristic length scale
  dimension: "[length]"
  description: Characteristic lateral length scale x_0 = L/2 used to nondimensionalize (x, y) onto [-1, 1] in SI Eq. E30.

- id: biharmonic_operator_scale
  name: biharmonic operator characteristic scale
  dimension: "1 / [length]**4"
  description: Characteristic scale (L/2)^-4 of the biharmonic operator Delta^2 in SI Eq. E31.

- id: characteristic_strain_scale
  name: FvK characteristic strain scale
  dimension: "dimensionless"
  description: Characteristic strain scale g_0 = (h / (L/2))^2 used to nondimensionalize growth strain g in SI Eq. E32.

- id: characteristic_pressure_scale
  name: FvK characteristic pressure scale
  dimension: "[mass] / [length] / [time]**2"
  description: Characteristic pressure scale p_0 = (h / (L/2))^4 * Y used to nondimensionalize transverse pressure p in SI Eq. E35.

- id: in_plane_displacement_scale
  name: in-plane displacement characteristic scale
  dimension: "[length]"
  description: Characteristic scale u_0 = h^2 / (L/2) for in-plane plate displacements u and v in FvK scaling (physically consistent form of SI Eqs. E36-E37).

- id: stress_potential_amplitude
  name: uniform stress-relaxation amplitude
  dimension: "[mass] / [length] / [time]**2"
  description: Constant c in the y-invariant Airy stress potential chi(x,y) = (c/2)*(nu*x^2 + y^2) (SI Eq. E41), equal to relaxed x-stress sigma_xx^pert.

- id: dimensionless_ode_coeff_a
  name: dimensionless 1D buckling ODE coefficient a
  dimension: "dimensionless"
  description: Dimensionless compressive coefficient a in d^4w/dx^4 + a*d^2w/dx^2 = b (SI Eq. E42).

- id: dimensionless_ode_coeff_b
  name: dimensionless 1D pressure ODE coefficient b
  dimension: "dimensionless"
  description: Dimensionless transverse load coefficient b = 12*(1 - nu^2)*(p/Y)*(L/(2*h))^4 in d^4w/dx^4 + a*d^2w/dx^2 = b (SI Eq. E42).

- id: pupal_development_fraction
  name: pupal development progress fraction
  dimension: "dimensionless"
  description: Percentage of total pupal development elapsed at the time of in vivo imaging.

- id: pupal_development_time
  name: pupal development elapsed time
  dimension: "[time]"
  description: Elapsed developmental time since the onset of pupation.

- id: protoridge_formation_duration
  name: protoridge formation time span
  dimension: "[time]"
  description: Duration over which the flat membrane wrinkles into parallel protoridge undulations.

- id: surgery_onset_time
  name: post-pupation surgery time
  dimension: "[time]"
  description: Time after onset of pupation when the pupal case is opened to expose the hindwing tissue.

- id: actin_filaments_per_bundle
  name: actin filament count per bundle
  dimension: "dimensionless"
  description: Number of individual F-actin filaments assembled in a single sub-membrane actin bundle.

- id: profile_count
  name: protoridge cross-section profile count
  dimension: "dimensionless"
  description: Number of segmented 1D protoridge cross-sectional height profiles measured or retained after filtering.

- id: scale_count
  name: sampled wing scales per time point
  dimension: "dimensionless"
  description: Number of butterfly wing scales from which surface regions were manually selected per developmental time point.

- id: measurement_count
  name: replicate spacing measurements
  dimension: "dimensionless"
  description: Number of independent measurements averaged to determine actin-bundle spacing in Fig. 4B.

- id: optical_lateral_resolution
  name: phase microscopy lateral resolution
  dimension: "[length]"
  description: Lateral spatial resolution of speckle-correlation reflection phase microscopy.

- id: optical_axial_resolution
  name: phase microscopy axial resolution
  dimension: "[length]"
  description: Axial optical resolution of speckle-correlation reflection phase microscopy.

- id: height_measurement_sensitivity
  name: phase height measurement sensitivity
  dimension: "[length]"
  description: Minimum surface height variation detectable via quantitative phase imaging.

- id: edge_height_filter_threshold
  name: segmented profile edge-drop filter threshold
  dimension: "[length]"
  description: Maximum allowable drop below the segmented region edge before a height profile is excluded.

- id: sem_accelerating_voltage
  name: SEM accelerating voltage
  dimension: "[mass] * [length]**2 / [time]**3 / [current]"
  description: Electron beam accelerating voltage used for scanning electron microscopy of butterfly scales.

- id: gold_coating_thickness
  name: SEM sputtered gold coating thickness
  dimension: "[length]"
  description: Thickness of sputter-coated gold film applied to scales before SEM imaging.

- id: normalized_lateral_position
  name: normalized lateral position across protoridge
  dimension: "dimensionless"
  description: Dimensionless lateral coordinate x / L_0 perpendicular to the actin bundles, expressed in units of the baseline inter-bundle spacing L_0 (Fig. 2E Bundle distance L subpanel).

- id: species_spacing_index
  name: species inter-bundle spacing ordinal index
  dimension: "dimensionless"
  description: Ordinal index (1 to 5, left to right) identifying the five butterfly species inter-bundle spacings plotted as vertical dashed lines in Fig. 4C (1 = L_2,A C. eurytheme flat; 2 = L_2,B A. vanillae flat; 3 = L_1,A C. eurytheme ridged; 4 = L_1,B A. vanillae ridged; 5 = L V. cardui).

- id: length_scale_factor
  name: dimensionless bundle-spacing multiplier
  dimension: "dimensionless"
  description: Dimensionless multiplier m applied to baseline inter-bundle spacing L_0 (e.g., 0.5, 1.0, 1.5 in the Fig. 2E Bundle distance L subpanel).

