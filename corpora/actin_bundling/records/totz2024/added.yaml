- id: w0_39_6_added
  quantity: protoridge_amplitude
  unit: nm
  printed: "25"
  basis: >
    The mean in vivo protoridge peak amplitude w_0 at 39.6% pupal development is plotted
    in Fig. 3A (p. 7, peak ~24.4-25 nm) and not printed numerically in the text. Needed to
    evaluate the printed lower-bound Young's modulus Y_min = 3.5 x 10^6 Pa (p. 8) at g = 0.
    Will be replaced by calibrated figure digitization in the independent digitize stage.
  alternatives: ["24", "26"]
  stands_for: "mean protoridge amplitude a = w_0 at 39.6% pupal development (Fig. 3A)"
  conditions:
    pupal_development_fraction: "39.6 %"

- id: dl_illustrative_added
  quantity: length_change
  unit: nm
  printed: "16"
  basis: >
    The paper defines growth strain g = delta_l / l_o (p. 5) without tabulating delta_l
    and l_o separately; 16 nm corresponds to g = 0.01 (Fig. 2E) over l_o = 1.6 um.
  alternatives: ["8", "24"]
  stands_for: "delta_l in g = delta_l / l_o (p. 5)"

- id: l0_illustrative_added
  quantity: reference_length
  unit: um
  printed: "1.6"
  basis: >
    Set equal to the V. cardui inter-bundle reference distance L = 1.6 um (p. 6, 8) to
    evaluate the growth strain definition g = delta_l / l_o (p. 5).
  alternatives: ["1.0", "1.8"]
  stands_for: "l_o in g = delta_l / l_o (p. 5)"

- id: eps_xx_added
  quantity: in_plane_strain
  unit: dimensionless
  printed: "-0.005"
  basis: >
    Illustrative compressive in-plane strain (magnitude 0.5%, within Table S1 growth strain
    range 0.0-0.7%) to evaluate the 2D plane-stress Hooke constitutive model (SI Eqs. E13, E15-E17).
  alternatives: ["-0.001", "-0.01"]
  stands_for: "epsilon_xx in SI Eqs. E13, E15-E16"

- id: eps_yy_added
  quantity: in_plane_strain
  unit: dimensionless
  printed: "-0.005"
  basis: >
    Illustrative isotropic compressive in-plane strain (magnitude 0.5%, within Table S1
    range 0.0-0.7%) to evaluate the 2D plane-stress Hooke constitutive model (SI Eqs. E13, E15-E17).
  alternatives: ["-0.001", "-0.01"]
  stands_for: "epsilon_yy in SI Eqs. E13, E15-E16"

- id: eps_xy_added
  quantity: in_plane_strain
  unit: dimensionless
  printed: "0.001"
  basis: >
    Small illustrative in-plane shear strain (0.1%) to exercise Eq. E17 in the general 2D
    plane-stress constitutive model prior to the 1D y-invariant reduction.
  alternatives: ["0.0", "0.005"]
  stands_for: "epsilon_xy in SI Eq. E17"

- id: L0_fig2E_Lpanel_added
  quantity: actin_bundle_spacing
  unit: um
  printed: "1.0"
  basis: >
    The Fig. 2E caption (p. 5) states baseline L = 1.8 um, but calibrated 1200 dpi
    digitization of the Fig. 2E Bundle distance L subpanel (peaks 127.9, 74.4, 11.3 nm for
    1.5 L, 1.0 L, 0.5 L) shows the curves were actually plotted with base spacing L_0 = 1.0 um
    and g = 0.5% (using the 2*a peak convention). Entered here to test the Fig. 2E L subpanel
    against both L_0 = 1.0 um and the paper's printed spacings (1.6 um in Table S1 and 1.8 um
    in the Fig. 2E caption).
  alternatives: ["1.6", "1.8"]
  stands_for: "implicit baseline L_0 in Fig. 2E Bundle distance L subpanel (p. 5)"
