id: youngs_modulus_lower_bound_eq3_corrected
name: Lower-bound Young's modulus Y_min at zero growth strain (corrected Eq. 3)
role: model
stated:
  page: 8
  printed_page: "7"
  quote: "we find a lower bound of Ymin = 3:53106 Pa."
  where: "text (g = 0 intercept of dimensionally corrected Eq. 3; Fig. 3H)"
equation: "Y_min = p * L^2 / (a * pi^2 * g_c * h * (1 + 3 * a^2 / (4 * h^2)))"
built_from: [critical_growth_strain_eq4, rayleigh_ritz_strain_eq3_corrected]
variant_of: youngs_modulus_lower_bound_eq3
corrections:
  - equation: "Eq. 3 (p. 6) and SI Eq. E49 (p. 22)"
    change: "Replace 3*h^2*a^2/4 with 3*a^2/(4*h^2) and h^3 with h in the pressure term denominator"
    evidence: "Restores dimensional consistency (giving [Y_min] = Pa instead of Pa/m^2), matches the exact p -> 0 limit of SI Eq. E44, and reproduces the paper's printed Y_min = 3.5 x 10^6 Pa (p. 8) for w_0(39.6%) = 25 nm (Fig. 3A) as well as the g = 0 isocontour intercepts in Fig. 3H."
inputs:
  a: {quantity: protoridge_amplitude, unit: m}
  p: {quantity: transverse_pressure, unit: Pa}
  nu: {quantity: poisson_ratio, unit: dimensionless}
  h: {quantity: plate_thickness, unit: m}
  L: {quantity: actin_bundle_spacing, unit: m}
outputs:
  Y_min: {quantity: youngs_modulus, unit: Pa}
settings: {}
stochastic: false
