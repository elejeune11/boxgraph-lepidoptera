id: fit_cosine_amplitude
name: Least-squares fundamental cosine amplitude fit to a protoridge height profile
role: processing
stated:
  page: 11
  printed_page: "10"
  quote: "fit the model curves to the experimental data of Figure 3."
  where: "Experimental Procedures (and Fig. 3A-E caption, p. 7)"
equation: "a = sum_i w(x_i) * c(x_i) / sum_i c(x_i)^2, where c(x) = (1/2) * (1 + cos(2 * pi * x / L))"
from_words: true
inputs:
  profile:
    quantity: protoridge_height
    unit: m
    curve:
      quantity: lateral_position
      unit: m
  L: {quantity: actin_bundle_spacing, unit: m}
outputs:
  a: {quantity: protoridge_amplitude, unit: m}
settings: {}
stochastic: false
