id: prestress_growth
name: Growth-induced pre-stress sigma_A (SI Note S2)
role: model
stated:
  page: 18
  quote: "with σA = Yg (assuming additive decomposition of elastic and growth"
  where: "SI Note S2"
equation: "sigma_A = Y * g"
inputs:
  Y: {quantity: youngs_modulus, unit: Pa}
  g: {quantity: growth_strain, unit: dimensionless}
outputs:
  sigma_A: {quantity: in_plane_stress, unit: Pa}
settings: {}
stochastic: false
