id: fvk_2d_plate_eq1_eq2
name: 2D Föppl-von-Kármán plate equations with growth pre-stress (Eqs. 1-2 / E7-E8)
role: model
stated:
  page: 5
  printed_page: "4"
  quote: "using classical Föppl-von-Kármán (FvK) plate equations expressed as follows"
  where: "Eqs. 1-2 (also Eq. 5, p. 11; SI Eqs. E1-E8, pp. 18-19)"
equation: "D*Delta^2(w) + h*Y*g*Delta(w) - h*[chi, w] = p; Delta^2(chi) + Y*K_G = 0"
described_from: ref-10
built_from: [bending_modulus, prestress_growth]
inputs:
  Y: {quantity: youngs_modulus, unit: Pa}
  nu: {quantity: poisson_ratio, unit: dimensionless}
  h: {quantity: plate_thickness, unit: m}
  L: {quantity: actin_bundle_spacing, unit: m}
  g: {quantity: growth_strain, unit: dimensionless}
  p: {quantity: transverse_pressure, unit: Pa}
outputs:
  w_max: {quantity: protoridge_amplitude, unit: m}
settings: {}
stochastic: false
runnable: false
not_runnable_reason: >
  The paper does not specify the 2D plate length along the actin-bundle axis y, the boundary
  conditions at the longitudinal y-edges, or the finite-element software, mesh, and element
  formulation referenced in Table S1 and Fig. 2D; all quantitative predictions in Figs. 2E, 3,
  and 4C are produced via the 1D y-invariant reduction (Eq. 3 / E49).
