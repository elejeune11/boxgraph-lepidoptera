id: growth_strain_def
name: Isotropic plate growth strain definition
role: model
stated:
  page: 5
  printed_page: "4"
  quote: "distances after growth lg in the plate: g = dl=lo ."
  where: text
equation: "g = dl / l0"
inputs:
  dl: {quantity: length_change, unit: m}
  l0: {quantity: reference_length, unit: m}
outputs:
  g: {quantity: growth_strain, unit: dimensionless}
settings: {}
stochastic: false
