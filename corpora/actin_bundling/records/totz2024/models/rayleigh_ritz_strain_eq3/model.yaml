id: rayleigh_ritz_strain_eq3
name: Rayleigh-Ritz growth strain vs buckling amplitude as printed (Eq. 3 / SI Eq. E49)
role: model
stated:
  page: 6
  printed_page: "5"
  quote: "Using the Rayleigh-Ritz approximation method to compute the maximum"
  where: "Eq. 3 (also SI Note S2, Eq. E49, p. 22)"
equation: "g / g_c = 1 + 3 * h^2 * a^2 / 4 - p * L^2 / (a * pi^2 * Y * g_c * h^3)"
described_from: ref-42
built_from: [critical_growth_strain_eq4]
inputs:
