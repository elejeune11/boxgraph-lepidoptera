id: ode_coefficients_e42
name: 1D buckling ODE coefficients a and b as printed (SI Eq. E42)
role: model
stated:
  page: 22
  quote: "we obtain a linear, inhomogeneous differential equation for the displacement"
  where: "SI Note S2, Eq. E42"
equation: "a = 12*(1 - nu^2)*((L/(2*h))^2*g - c*Y*h^2); b = 12*(1 - nu^2)*(p/Y)*(L/(2*h))^4"
inputs:
  nu: {quantity: poisson_ratio, unit: dimensionless}
  L: {quantity: actin_bundle_spacing, unit: m}
  h: {quantity: plate_thickness, unit: m}
  g: {quantity: growth_strain, unit: dimensionless}
  c: {quantity: stress_potential_amplitude, unit: Pa}
  Y: {quantity: youngs_modulus, unit: Pa}
  p: {quantity: transverse_pressure, unit: Pa}
outputs:
  a_ode: {quantity: dimensionless_ode_coeff_a, unit: dimensionless}
  b_ode: {quantity: dimensionless_ode_coeff_b, unit: dimensionless}
settings: {}
stochastic: false
