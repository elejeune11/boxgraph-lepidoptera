id: zero_pressure_profile_e44
name: Vanishing-pressure 1D buckled height profile (SI Eq. E44)
role: model
stated:
  page: 22
  quote: "the full solution for vanishing pressure is:"
  where: "SI Note S2, Eq. E44"
equation: "w(x) = ±(h / sqrt(3)) * sqrt(g / g_c - 1) * (1 + cos(2 * pi * x / L)) for g >= g_c; 0 for g < g_c"
built_from: [critical_growth_strain_eq4]
inputs:
  x: {quantity: lateral_position, unit: m}
  g: {quantity: growth_strain, unit: dimensionless}
  nu: {quantity: poisson_ratio, unit: dimensionless}
  h: {quantity: plate_thickness, unit: m}
  L: {quantity: actin_bundle_spacing, unit: m}
outputs:
  w: {quantity: protoridge_height, unit: m}
settings: {}
stochastic: false
