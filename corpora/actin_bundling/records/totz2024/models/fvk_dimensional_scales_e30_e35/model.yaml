id: fvk_dimensional_scales_e30_e35
name: Föppl-von-Kármán nondimensionalization scales (SI Eqs. E30-E35)
role: model
stated:
  page: 21
  quote: "Dimensionless equations can be achieved via:"
  where: "SI Note S2, Eqs. E30-E35"
equation: "x_scale = L/2; biharm_scale = (L/2)^-4; g_scale = (h/(L/2))^2; w_scale = h; chi_scale = Y*h^2; p_scale = (h/(L/2))^4 * Y"
inputs:
  L: {quantity: actin_bundle_spacing, unit: m}
  h: {quantity: plate_thickness, unit: m}
  Y: {quantity: youngs_modulus, unit: Pa}
outputs:
  x_scale: {quantity: characteristic_length_scale, unit: m}
  biharm_scale: {quantity: biharmonic_operator_scale, unit: "1/m^4"}
  g_scale: {quantity: characteristic_strain_scale, unit: dimensionless}
  w_scale: {quantity: protoridge_height, unit: m}
  chi_scale: {quantity: airy_stress_potential_scale, unit: "Pa*m^2"}
  p_scale: {quantity: characteristic_pressure_scale, unit: Pa}
settings: {}
stochastic: false
