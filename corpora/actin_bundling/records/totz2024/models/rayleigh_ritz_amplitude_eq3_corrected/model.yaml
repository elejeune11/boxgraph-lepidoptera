id: rayleigh_ritz_amplitude_eq3_corrected
name: Numerical Rayleigh-Ritz buckling amplitude solver (corrected Eq. 3 / SI Eq. E49)
role: model
stated:
  page: 11
  printed_page: "10"
  quote: "numerically solve Equation 3, given the parameters in Table S1,"
  where: "Experimental Procedures (solving dimensionally corrected Eq. 3 / SI Eq. E49)"
equation: "solve 1 + 3*a^2/(4*h^2) - p*L^2/(a*pi^2*Y*g_c*h) - g/g_c = 0 for a > 0"
described_from: ref-42
built_from: [critical_growth_strain_eq4, rayleigh_ritz_strain_eq3_corrected]
variant_of: rayleigh_ritz_amplitude_eq3
corrections:
  - equation: "Eq. 3 (p. 6) and SI Eq. E49 (p. 22)"
    change: "Replace 3*h^2*a^2/4 with 3*a^2/(4*h^2) and p*L^2/(a*pi^2*Y*g_c*h^3) with p*L^2/(a*pi^2*Y*g_c*h)"
    evidence: "Dimensional consistency ([L]^4 and [L]^-2 errors in printed Eq. 3 / E49), exact agreement with SI Eq. E44 in the p -> 0 limit, and numerical reproduction of Y_min = 3.5 x 10^6 Pa (p. 8) and Figs. 3H and 4C."
inputs:
  g: {quantity: growth_strain, unit: dimensionless}
  p: {quantity: transverse_pressure, unit: Pa}
  Y: {quantity: youngs_modulus, unit: Pa}
  nu: {quantity: poisson_ratio, unit: dimensionless}
  h: {quantity: plate_thickness, unit: m}
  L: {quantity: actin_bundle_spacing, unit: m}
outputs:
  a: {quantity: protoridge_amplitude, unit: m}
settings:
  tol: 1.0e-6
stochastic: false
