id: buckled_profile_cosine
name: Clamped fundamental-mode cosine buckling profile ansatz
role: model
stated:
  page: 22
  quote: "the full solution for vanishing pressure is:"
  where: "SI Note S2, Eq. E44 (also Rayleigh-Ritz ansatz for Eq. 3, p. 6)"
equation: "w(x) = (a / 2) * (1 + cos(2 * pi * x / L))"
inputs:
  x: {quantity: lateral_position, unit: m}
  a: {quantity: protoridge_amplitude, unit: m}
  L: {quantity: actin_bundle_spacing, unit: m}
outputs:
  w: {quantity: protoridge_height, unit: m}
settings: {}
stochastic: false
