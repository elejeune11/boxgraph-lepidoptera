id: buckled_profile_cosine_trough_origin
name: Clamped fundamental-mode cosine buckling profile with trough origin (x in [0, L])
role: model
stated:
  page: 17
  quote: "All profiles for that time point are collected and scaled"
  where: "Fig. S1J (p. 16; caption p. 17, x shifted by L/2 relative to SI Eq. E44)"
equation: "w(x) = (a / 2) * (1 - cos(2 * pi * x / L))"
built_from: [buckled_profile_cosine]
inputs:
  x: {quantity: lateral_position, unit: m}
  a: {quantity: protoridge_amplitude, unit: m}
  L: {quantity: actin_bundle_spacing, unit: m}
outputs:
  w: {quantity: protoridge_height, unit: m}
settings: {}
stochastic: false
