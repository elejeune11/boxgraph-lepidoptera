id: zero_pressure_amplitude_e44
name: Vanishing-pressure maximum buckling amplitude at x = 0 (SI Eq. E44)
role: model
stated:
  page: 22
  quote: "the full solution for vanishing pressure is:"
  where: "SI Note S2, Eq. E44 evaluated at x = 0"
equation: "a = (2 * h / sqrt(3)) * sqrt(g / g_c - 1) for g >= g_c; 0 for g < g_c"
built_from: [critical_growth_strain_eq4, zero_pressure_profile_e44]
inputs:
  g: {quantity: growth_strain, unit: dimensionless}
  nu: {quantity: poisson_ratio, unit: dimensionless}
  h: {quantity: plate_thickness, unit: m}
  L: {quantity: actin_bundle_spacing, unit: m}
outputs:
  a: {quantity: protoridge_amplitude, unit: m}
settings: {}
stochastic: false
