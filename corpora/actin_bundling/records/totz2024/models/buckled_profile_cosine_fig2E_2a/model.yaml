id: buckled_profile_cosine_fig2E_2a
name: Fig. 2E plotted cosine buckling profile with 2*a peak convention
role: model
stated:
  page: 5
  printed_page: "4"
  quote: "Buckling profiles obtained as solutions of the weakly nonlinear"
  where: "Fig. 2E (p. 5; missing factor of 1/2 relative to w(0) = a on p. 6 / SI Eq. E44)"
equation: "w(x) = a * (1 + cos(2 * pi * x / L))"
variant_of: buckled_profile_cosine
corrections:
  - equation: "Fig. 2E plotted profiles (p. 5) vs cosine ansatz w(x) = (a/2)*(1 + cos(2*pi*x/L)) (SI Eq. E44 / Eq. 3, p. 6)"
    change: "Drop the factor of 1/2 so w(0) = 2*a instead of w(0) = a"
    evidence: "Calibrated 1200 dpi digitization of all 9 curves in the g, Y, and p subpanels of Fig. 2E reproduces w(x) = a*(1 + cos(2*pi*x/L)) to within <=0.7 nm (e.g. peaks 208.9, 160.3, 102.9 nm vs 2*a = 208.48, 160.12, 102.43 nm in the g subpanel), whereas w(0) = a underpredicts every Fig. 2E curve by exactly a factor of 2."
inputs:
  x: {quantity: lateral_position, unit: m}
  a: {quantity: protoridge_amplitude, unit: m}
  L: {quantity: actin_bundle_spacing, unit: m}
outputs:
  w: {quantity: protoridge_height, unit: m}
settings: {}
stochastic: false
