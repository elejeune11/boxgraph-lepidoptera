id: youngs_modulus_lower_bound_eq3
name: Lower-bound Young's modulus Y_min at zero growth strain from printed Eq. 3
role: model
stated:
  page: 8
  printed_page: "7"
  quote: "we find a lower bound of Ymin = 3:53106 Pa."
  where: "text (g = 0 intercept of Eq. 3, p. 6; Fig. 3H)"
equation: "Y_min = p * L^2 / (a * pi^2 * g_c * h^3 * (1 + 3 * h^2 * a^2 / 4))"
built_from: [critical_growth_strain_eq4, rayleigh_ritz_strain_eq3]
inputs:
  a: {quantity: protoridge_amplitude, unit: m}
  p: {quantity: transverse_pressure, unit: Pa}
  nu: {quantity: poisson_ratio, unit: dimensionless}
  h: {quantity: plate_thickness, unit: m}
  L: {quantity: actin_bundle_spacing, unit: m}
outputs:
  Y_min: {quantity: youngs_modulus, unit: Pa}
settings: {}
stochastic: false
