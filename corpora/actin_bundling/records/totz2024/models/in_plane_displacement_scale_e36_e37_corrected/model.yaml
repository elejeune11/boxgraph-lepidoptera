id: in_plane_displacement_scale_e36_e37_corrected
name: In-plane displacement nondimensionalization scale (corrected SI Eqs. E36-E37)
role: model
stated:
  page: 21
  quote: "Dimensionless equations can be achieved via:"
  where: "SI Note S2, Eqs. E36-E37 (corrected)"
equation: "u_scale = h^2 / (L / 2)"
variant_of: in_plane_displacement_scale_e36_e37
corrections:
  - equation: "SI Eqs. E36-E37"
    change: "Replace printed 'YL/2h^2' with h^2 / (L / 2) = 2 * h^2 / L"
    evidence: "In SI Eqs. E20-E21, strain eps_xx = du/dx + (1/2)*(dw/dx)^2. With x ~ L/2 (Eq. E30) and w ~ h (Eq. E33), balancing du/dx ~ (dw/dx)^2 requires u_scale = (L/2)*(h/(L/2))^2 = h^2/(L/2), which has dimension [length] and is independent of Young's modulus Y."
inputs:
  L: {quantity: actin_bundle_spacing, unit: m}
  h: {quantity: plate_thickness, unit: m}
outputs:
  u_scale: {quantity: in_plane_displacement_scale, unit: m}
settings: {}
stochastic: false
