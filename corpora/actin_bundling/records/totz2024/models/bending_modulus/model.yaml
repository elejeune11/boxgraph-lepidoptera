id: bending_modulus
name: Thin-plate bending modulus D
role: model
stated:
  page: 5
  printed_page: "4"
  quote: "is the bending modulus with n being the Poisson ratio"
  where: "text (also SI Note S2, p. 18)"
equation: "D = Y * h^3 / (12 * (1 - nu^2))"
inputs:
  Y: {quantity: youngs_modulus, unit: Pa}
  h: {quantity: plate_thickness, unit: m}
  nu: {quantity: poisson_ratio, unit: dimensionless}
outputs:
  D: {quantity: bending_modulus, unit: "N*m"}
settings: {}
stochastic: false
