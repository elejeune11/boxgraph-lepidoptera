id: extract_species_spacings
name: Extract individual species actin-bundle spacings from Fig. 4C dashed lines
role: processing
stated:
  page: 9
  printed_page: "8"
  quote: "Black dashed lines indicate actin bundle spacings L from"
  where: "Fig. 4C caption"
equation: "L_k = spacings(index = k) for k in {1: L_2,A, 2: L_2,B, 3: L_1,A, 4: L_1,B, 5: L_Vcardui}"
from_words: true
inputs:
  spacings:
    quantity: actin_bundle_spacing
    unit: m
    curve:
      quantity: species_spacing_index
      unit: dimensionless
outputs:
  L_2A: {quantity: actin_bundle_spacing, unit: m}
  L_2B: {quantity: actin_bundle_spacing, unit: m}
  L_1A: {quantity: actin_bundle_spacing, unit: m}
  L_1B: {quantity: actin_bundle_spacing, unit: m}
  L_Vcardui: {quantity: actin_bundle_spacing, unit: m}
settings: {}
stochastic: false
