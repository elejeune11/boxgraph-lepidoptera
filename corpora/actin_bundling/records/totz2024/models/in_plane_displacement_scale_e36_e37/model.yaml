id: in_plane_displacement_scale_e36_e37
name: In-plane displacement nondimensionalization scale as printed (SI Eqs. E36-E37)
role: model
stated:
  page: 21
  quote: "Dimensionless equations can be achieved via:"
  where: "SI Note S2, Eqs. E36-E37"
equation: "u -> YL/2h^2 u; v -> YL/2h^2 v"
inputs:
  Y: {quantity: youngs_modulus, unit: Pa}
  L: {quantity: actin_bundle_spacing, unit: m}
  h: {quantity: plate_thickness, unit: m}
outputs:
  u_scale: {quantity: in_plane_displacement_scale, unit: m}
settings: {}
stochastic: false
runnable: false
not_runnable_reason: >
  SI Eqs. E36-E37 print 'u -> YL/2h^2 u' and 'v -> YL/2h^2 v', which are both syntactically
  ambiguous and dimensionally invalid for a displacement scale [length] because they contain
  Young's modulus Y ([mass]/[length]/[time]^2). See corrected variant
  in_plane_displacement_scale_e36_e37_corrected.
