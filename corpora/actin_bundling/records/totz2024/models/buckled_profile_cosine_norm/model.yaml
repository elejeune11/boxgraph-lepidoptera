id: buckled_profile_cosine_norm
name: Clamped cosine buckling profile in normalized lateral coordinate x / L_0
role: model
stated:
  page: 5
  printed_page: "4"
  quote: "Buckling profiles obtained as solutions of the weakly nonlinear"
  where: "Fig. 2E (Bundle distance L subpanel, normalized x/L_0 coordinate) and SI Eq. E44 (p. 22)"
equation: "w(x_norm) = (a / 2) * (1 + cos(2 * pi * x_norm * L_0 / L))"
built_from: [buckled_profile_cosine]
inputs:
  x_norm: {quantity: normalized_lateral_position, unit: dimensionless}
  a: {quantity: protoridge_amplitude, unit: m}
  L: {quantity: actin_bundle_spacing, unit: m}
  L_0: {quantity: actin_bundle_spacing, unit: m}
outputs:
  w: {quantity: protoridge_height, unit: m}
settings: {}
stochastic: false
