id: rayleigh_ritz_amplitude_eq3
name: Numerical Rayleigh-Ritz buckling amplitude solver as printed (Eq. 3 / SI Eq. E49)
role: model
stated:
  page: 11
  printed_page: "10"
  quote: "numerically solve Equation 3, given the parameters in Table S1,"
  where: "Experimental Procedures (solving Eq. 3, p. 6; SI Eq. E49, p. 22)"
equation: "solve 1 + 3*h^2*a^2/4 - p*L^2/(a*pi^2*Y*g_c*h^3) - g/g_c = 0 for a > 0"
described_from: ref-42
built_from: [critical_growth_strain_eq4, rayleigh_ritz_strain_eq3]
inputs:
  g: {quantity: growth_strain, unit: dimensionless}
  p: {quantity: transverse_pressure, unit: Pa}
  Y: {quantity: youngs_modulus, unit: Pa}
  nu: {quantity: poisson_ratio, unit: dimensionless}
  h: {quantity: plate_thickness, unit: m}
  L: {quantity: actin_bundle_spacing, unit: m}
outputs:
  a: {quantity: protoridge_amplitude, unit: m}
settings:
  tol: 1.0e-6
stochastic: false
