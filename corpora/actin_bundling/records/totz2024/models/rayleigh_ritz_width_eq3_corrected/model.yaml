id: rayleigh_ritz_width_eq3_corrected
name: Rayleigh-Ritz bundle spacing vs growth strain (corrected Eq. 3 / SI Eq. E49)
role: model
stated:
  page: 6
  printed_page: "5"
  quote: "Using the Rayleigh-Ritz approximation method to compute the maximum"
  where: "Eq. 3 (also Fig. 4C, p. 9; dimensionally corrected and inverted for L)"
equation: "L = sqrt(2*C / (g + sqrt(g^2 + 4*A*C))), A = p / (a*pi^2*Y*h), C = (1 + 3*a^2/(4*h^2))*pi^2*h^2/(3*(1 - nu^2))"
described_from: ref-42
built_from: [critical_growth_strain_eq4, rayleigh_ritz_strain_eq3_corrected]
variant_of: rayleigh_ritz_width_eq3
corrections:
  - equation: "Eq. 3 (p. 6) and SI Eq. E49 (p. 22)"
    change: "Replace 3*h^2*a^2/4 with 3*a^2/(4*h^2) and p/(a*pi^2*Y*h^3) with p/(a*pi^2*Y*h)"
    evidence: "Restores dimensional consistency (giving [L] = m) and reproduces the digitized 0.1 nm and 1 nm amplitude isocontours in Fig. 4C (p. 9) to within pixel uncertainty."
inputs:
  g: {quantity: growth_strain, unit: dimensionless}
  a: {quantity: protoridge_amplitude, unit: m}
  p: {quantity: transverse_pressure, unit: Pa}
  Y: {quantity: youngs_modulus, unit: Pa}
  nu: {quantity: poisson_ratio, unit: dimensionless}
  h: {quantity: plate_thickness, unit: m}
outputs:
  L: {quantity: actin_bundle_spacing, unit: m}
settings: {}
stochastic: false
