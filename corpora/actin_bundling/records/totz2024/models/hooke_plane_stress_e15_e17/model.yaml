id: hooke_plane_stress_e15_e17
name: Thin-plate 2D plane-stress Hooke constitutive law (SI Eqs. E13, E15-E17)
role: model
stated:
  page: 20
  quote: "2D center surface of a 3D thin plate becomes:"
  where: "SI Note S2, Eqs. E13, E15-E17"
equation: "sigma_xx = Y/(1-nu^2)*(eps_xx + nu*eps_yy); sigma_yy = Y/(1-nu^2)*(eps_yy + nu*eps_xx); sigma_xy = Y/(1+nu)*eps_xy; eps_zz = -nu/(1-nu)*(eps_xx + eps_yy)"
described_from: ref-10
inputs:
  Y: {quantity: youngs_modulus, unit: Pa}
  nu: {quantity: poisson_ratio, unit: dimensionless}
  eps_xx: {quantity: in_plane_strain, unit: dimensionless}
  eps_yy: {quantity: in_plane_strain, unit: dimensionless}
  eps_xy: {quantity: in_plane_strain, unit: dimensionless}
outputs:
  sigma_xx: {quantity: in_plane_stress, unit: Pa}
  sigma_yy: {quantity: in_plane_stress, unit: Pa}
  sigma_xy: {quantity: in_plane_stress, unit: Pa}
  eps_zz: {quantity: out_of_plane_strain, unit: dimensionless}
settings: {}
stochastic: false
