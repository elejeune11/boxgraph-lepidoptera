- id: ref_rr_printed_tol
  run: run_rr_amp_printed_fig2E
  setting: tol
  factors: [1, 2, 4, 8]
  mode: divide
  output: a
  tolerance: "0.01%"
  tolerance_basis: "added: far below typical experimental height precision (~10 nm) and plotting precision to confirm Brent root-finder convergence"
  tolerance_added: true

- id: ref_rr_corrected_fig2E_tol
  run: run_rr_amp_corrected_fig2E
  setting: tol
  factors: [1, 2, 4, 8]
  mode: divide
  output: a
  tolerance: "0.01%"
  tolerance_basis: "added: far below experimental height sensitivity (~10 nm) to verify root-finder convergence on corrected Eq. 3"
  tolerance_added: true

- id: ref_rr_corrected_Ymin_tol
  run: run_rr_amp_corrected_Ymin
  setting: tol
  factors: [1, 2, 4, 8]
  mode: divide
  output: a
  tolerance: "0.01%"
  tolerance_basis: "added: well below the 2-significant-figure precision of Y_min = 3.5 x 10^6 Pa"
  tolerance_added: true

- id: ref_fvk_ode_Vcardui_g0_wmax
  run: run_fvk_1d_ode_Vcardui_g0
  setting: n_grid
  factors: [1, 2, 4, 8]
  mode: multiply
  output: w_max
  tolerance: "0.5%"
  tolerance_basis: "added: below the ~1.6% difference between Rayleigh-Ritz and exact 1D ODE solutions and far below ~10 nm phase sensitivity"
  tolerance_added: true

- id: ref_fvk_ode_Vcardui_g0_wmin
  run: run_fvk_1d_ode_Vcardui_g0
  setting: n_grid
  factors: [1, 2, 4, 8]
  mode: multiply
  output: w_min
  tolerance: "1e-12"
  tolerance_basis: "added: verifies strict non-negativity (absence of numerical undershoot) of outward-pressurized membrane height profile across grid refinement"
  tolerance_added: true

- id: ref_fvk_ode_Vcardui_g0_c
  run: run_fvk_1d_ode_Vcardui_g0
  setting: n_grid
  factors: [1, 2, 4, 8]
  mode: multiply
  output: c
  tolerance: "0.5%"
  tolerance_basis: "added: checks 2nd-order spatial grid convergence of the relaxed in-plane membrane stress amplitude c from integral constraint Eq. E29"
  tolerance_added: true

- id: ref_fvk_ode_fig2E_wmax
  run: run_fvk_1d_ode_fig2E
  setting: n_grid
  factors: [1, 2, 4, 8]
  mode: multiply
  output: w_max
  tolerance: "0.5%"
  tolerance_basis: "added: checks spatial grid convergence of the exact 1D BVP solver in the supercritical buckled regime (g = 0.01 > g_c)"
  tolerance_added: true

- id: ref_fvk_ode_fig2E_wmin
  run: run_fvk_1d_ode_fig2E
  setting: n_grid
  factors: [1, 2, 4, 8]
  mode: multiply
  output: w_min
  tolerance: "1e-12"
  tolerance_basis: "added: verifies absence of numerical trough undershoot (non-negativity of w(x)) in the supercritical buckled regime"
  tolerance_added: true
