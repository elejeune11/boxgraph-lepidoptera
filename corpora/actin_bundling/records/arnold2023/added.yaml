- id: T_room_added
  quantity: temperature
  unit: K
  printed: "298"
  basis: "Active and passive domain coarsening experiments are conducted at room temperature (pp. 2, 9) without stating an exact numeric temperature; 298 K (25 degC) is standard room temperature."
  alternatives: ["293", "300"]
  stands_for: "T in D_c = k_B T / (16 eta a) and Pe_c = 16 gamma_dot eta a^3 / (k_B T)"

- id: eta_water_added
  quantity: solvent_viscosity
  unit: Pa*s
  printed: "1 x 10^-3"
  basis: "Bilayers are immersed in aqueous assay buffer (A-buffer) without printing the 3D solvent viscosity eta; water dynamic viscosity near room temperature is ~0.89-1.0 mPa*s."
  alternatives: ["0.89 x 10^-3", "1.1 x 10^-3"]
  stands_for: "eta in Eq. (4) and SI Eqs. (24)-(28), (34)-(37)"

- id: domain_radius_exp_added
  quantity: domain_size
  unit: um
  printed: "1.5"
  basis: "The paper states Pe_c = gamma_dot * a^2 / D_c ≈ 10 (p. 5) without specifying the domain radius a used; domains in Fig. 1(d) (5 um scale bar) exceeding the ~1 um actin mesh size (p. 3) have radii ~1-2 um."
  alternatives: ["1", "2"]
  stands_for: "a in experimental Pe_c ≈ 10 estimate (p. 5)"

- id: shear_rate_exp_added
  quantity: shear_rate
  unit: 1/s
  printed: "0.8"
  basis: "The paper estimates surface flow velocity v ≈ 1 um/s (p. 3) across ~1-5 um features (Fig. 1d) without stating a numeric shear rate gamma_dot; gamma_dot ~ 0.2-1.0 s^-1 yields Pe_c ~ 10 for micron-scale domains."
  alternatives: ["0.2", "1.0"]
  stands_for: "gamma_dot in experimental Pe_c ≈ 10 estimate (p. 5)"

- id: sigma_ls_added
  quantity: line_tension_dimless
  unit: dimensionless
  printed: "1"
  basis: "SI Sec. III.A (Eqs. 4-11) leaves dimensionless line tension sigma symbolic; asymptotic scaling exponent alpha = 1/3 is independent of sigma > 0."
  alternatives: ["0.5", "2"]
  stands_for: "sigma in SI Eqs. (4)-(11)"

- id: L_ls_added
  quantity: system_size_sim
  unit: dimensionless
  printed: "100"
  basis: "SI Sec. III.A leaves box size L symbolic; L = 100 matches the order of the 32*pi (~100.5) simulation box in SI Sec. IV."
  alternatives: ["50", "500"]
  stands_for: "L in SI Eqs. (4)-(10)"

- id: a0_ls_added
  quantity: domain_size_sim
  unit: dimensionless
  printed: "1"
  basis: "SI Sec. III.A does not fix an initial domain radius a_0 for integrating Eq. (6) / Eq. (7)."
  alternatives: ["0.5", "2"]
  stands_for: "a(0) in SI Eqs. (6)-(7)"

- id: t_ls_eval_added
  quantity: time_sim
  unit: dimensionless
  printed: "1000"
  basis: "Evaluation time in SI Eqs. (6)-(11) chosen so a(t) grows well past a_0 while remaining inside the box L = 100."
  alternatives: ["100", "5000"]
  stands_for: "t in SI Eqs. (7) and (11)"

- id: L_smol_added
  quantity: system_size
  unit: um
  printed: "50"
  basis: "Main Eq. (4) and SI Eqs. (21)-(28), (32)-(35) leave outer system size L symbolic; fluorescence fields of view (Figs. 1d, S2-S4, 5 um scale bar) are ~20-100 um wide."
  alternatives: ["20", "100"]
  stands_for: "L in Eq. (4) and SI Eqs. (22)-(28), (34)-(35)"

- id: a0_smol_added
  quantity: domain_size
  unit: um
  printed: "0.5"
  basis: "Initial domain radius a_0 in SI Eqs. (26)-(28) and (37) is not printed as a scalar; sub-micron domains smaller than the ~1 um actin mesh size (p. 3) are representative."
  alternatives: ["0.2", "1.0"]
  stands_for: "a_0 in SI Eqs. (26)-(28) and (37)"

- id: n_domain_added
  quantity: domain_number_density
  unit: 1/um^2
  printed: "0.03"
  basis: "Singlet domain density n = phi_A / (pi a^2) at phi_A = 0.21 and a = 1.5 um is ~0.03 um^-2; not explicitly reported as a number."
  alternatives: ["0.01", "0.1"]
  stands_for: "n in Eqs. (2)-(3) and SI Eqs. (23)-(24), (34)"

- id: epsilon_smol_added
  quantity: size_ratio_deviation
  unit: dimensionless
  printed: "0.05"
  basis: "SI Eqs. (27)-(28) and (36) expand in a small positive parameter epsilon << 1 without choosing a numerical value."
  alternatives: ["0.01", "0.1"]
  stands_for: "epsilon in SI Eqs. (27)-(28) and (36)"

- id: C_matching_added
  quantity: smoluchowski_matching_constant
  unit: dimensionless
  printed: "1"
  basis: "Main Eq. (4) and SI Eq. (34) leave the O(1) singular perturbation matching constant C uncomputed; asymptotic exponents 1/3 and 2/3 are independent of C > 0."
  alternatives: ["0.5", "2"]
  stands_for: "C in Eq. (4) and SI Eqs. (34)-(37)"

- id: t_smol_passive_added
  quantity: time
  unit: s
  printed: "100"
  basis: "Passive coarsening timescale (~100 s in Fig. 2) for evaluating the Smoluchowski passive coalescence solution SI Eqs. (25)-(28)."
  alternatives: ["50", "500"]
  stands_for: "t in SI Eqs. (25)-(28)"

- id: gamma_dot_smol_low_added
  quantity: shear_rate
  unit: 1/s
  printed: "1 x 10^-18"
  basis: "Very small shear rate ensuring C_1 a^(3/2) << 1 at late times to test the passive t^(1/3) asymptotic limit of SI Eq. (38)."
  alternatives: ["1 x 10^-19", "1 x 10^-17"]
  stands_for: "gamma_dot in small-C_1 a^(3/2) limit of SI Eqs. (36)-(38)"

- id: gamma_dot_smol_high_added
  quantity: shear_rate
  unit: 1/s
  printed: "1 x 10^4"
  basis: "Large shear rate ensuring C_1 a^(3/2) >> 1 to test the shear-dominated t^(2/3) asymptotic limit of SI Eq. (39)."
  alternatives: ["1 x 10^3", "1 x 10^5"]
  stands_for: "gamma_dot in large-C_1 a^(3/2) limit of SI Eqs. (36)-(39)"

- id: t_smol_shear_added
  quantity: time
  unit: s
  printed: "10"
  basis: "Experimental active coarsening duration (~5-10 s) for evaluating SI Eq. (37) at experimental shear rate."
  alternatives: ["5", "50"]
  stands_for: "t in SI Eq. (37) under experimental conditions"

- id: t_smol_asymp_added
  quantity: time
  unit: s
  printed: "1 x 10^5"
  basis: "Long asymptotic time ensuring C_0 << m*t when verifying the a_0 -> 0 scaling limits t^(1/3) (SI Eq. 38) and t^(2/3) (SI Eq. 39)."
  alternatives: ["5 x 10^4", "2 x 10^5"]
  stands_for: "late-time limit t -> infinity in SI Eqs. (38)-(39)"

- id: a0_smol_tiny_added
  quantity: domain_size
  unit: um
  printed: "1 x 10^-4"
  basis: "Near-zero initial domain radius representing the a_0 -> 0 limit of SI Eq. (29) while keeping b = 3*ln(L/(2*a_0)) + 1 finite."
  alternatives: ["1 x 10^-5", "1 x 10^-3"]
  stands_for: "a_0 -> 0 limit in SI Eqs. (28)-(29)"

- id: gamma_dot_sim_zero_added
  quantity: shear_rate_sim
  unit: dimensionless
  printed: "0"
  basis: "Zero shear rate representing passive (no-flow) Cahn-Hilliard simulations in Fig. 2, Movie S3, and Fig. S5."
  alternatives: ["1 x 10^-4"]
  stands_for: "gamma_dot = 0 in passive Cahn-Hilliard simulation"

- id: phi0_spinodal_edge_added
  quantity: order_parameter
  unit: dimensionless
  printed: "0.57735"
  basis: "In SI Eqs. (43)-(45), passive t^(1/4) scaling requires 1 - 3*phi_0^2 = 0 (phi_0 = 1/sqrt(3) ~ 0.57735) so that omega(k) = -k^4; the paper does not state what phi_0 value yields t^(1/4) (at simulation phi_avg = 0.3, 1 - 3*phi_0^2 = 0.73 > 0 produces exponential growth at fixed k_*)."
  alternatives: ["0.3", "0.5"]
  stands_for: "phi_0 in SI Eqs. (42)-(45)"

- id: t_lin_ch_added
  quantity: time_sim
  unit: dimensionless
  printed: "10"
  basis: "Early-time evaluation point for testing linearized Cahn-Hilliard scaling a(t) ~ t^(1/4) + Pe t^(5/4) (p. 5, SI p. 8) in the small-Pe*t regime."
  alternatives: ["5", "20"]
  stands_for: "t in SI Eq. (45)"

- id: Pe_lin_ch_added
  quantity: molecular_peclet_number
  unit: dimensionless
  printed: "1 x 10^-4"
  basis: "Small Peclet number satisfying Pe << 1 and Pe*t << 1 in the perturbation expansion of SI Sec. III.B.3."
  alternatives: ["1 x 10^-5", "1 x 10^-3"]
  stands_for: "Pe in SI Eqs. (42)-(45)"

- id: fit_A_added
  quantity: growth_fit_prefactor
  unit: dimensionless
  printed: "1"
  basis: "The paper does not print fitted prefactors A in a = (A*t + B)^alpha (p. 2, SI Eq. 1); unit prefactor verifies the time-shift identity t_plot = t + B/A."
  alternatives: ["0.5", "2"]
  stands_for: "A in SI Eq. (1)"

- id: fit_B_added
  quantity: growth_fit_offset
  unit: dimensionless
  printed: "10"
  basis: "The paper does not print fitted initial-size offsets B = a_0^(1/alpha) in SI Eq. (1); positive B tests the shift t_plot = t + B/A."
  alternatives: ["5", "20"]
  stands_for: "B in SI Eq. (1)"

- id: t_fit_eval_added
  quantity: time_sim
  unit: dimensionless
  printed: "20"
  basis: "Representative positive time for checking the SI Eq. (1) time-shift rescaling a(t)/a_0 = (t_plot / (B/A))^alpha."
  alternatives: ["10", "50"]
  stands_for: "t in SI Eq. (1)"
