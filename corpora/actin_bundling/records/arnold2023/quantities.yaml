- id: domain_size
  name: lipid domain characteristic size
  dimension: "[length]"
  description: "Characteristic radius or area/perimeter size a(t) of liquid-ordered (Lo) lipid membrane domains in physical length units."

- id: domain_size_sim
  name: simulated domain characteristic size
  dimension: dimensionless
  description: "Characteristic domain size a(t) in dimensionless Cahn-Hilliard or Lifshitz-Slyozov simulation units (from area/perimeter or Eq. 47 structure factor first moment)."

- id: normalized_domain_size
  name: normalized lipid domain size
  dimension: dimensionless
  description: "Characteristic lipid domain size normalized by initial size or dataset-specific rescaling factor, a(t)/a_0 (Figs. 2, S3B, S4, S5)."

- id: coarsening_exponent
  name: domain coarsening power-law exponent
  dimension: dimensionless
  description: "Growth scaling exponent alpha in a(t) ~ t^alpha for passive or flow-driven lipid domain coarsening."

- id: early_time_shear_exponent
  name: linearized shear perturbation time exponent
  dimension: dimensionless
  description: "Power-law time exponent (5/4) of the leading O(Pe) flow correction to a(t) in the linearized Cahn-Hilliard perturbation analysis (p. 5, SI p. 8)."

- id: time
  name: physical time
  dimension: "[time]"
  description: "Elapsed experimental or physical time t."

- id: time_sim
  name: simulation time
  dimension: dimensionless
  description: "Time variable t (or nondimensionalized t / t_c) in Cahn-Hilliard and Lifshitz-Slyozov equations."

- id: domain_area_fraction
  name: liquid-ordered domain area fraction
  dimension: dimensionless
  description: "Area fraction phi_A = n * pi * a^2 occupied by liquid-ordered (Lo) lipid domains."

- id: domain_number_density
  name: singlet domain number density
  dimension: "1/[length]**2"
  description: "2D areal number density n(t) of singlet lipid domains in the Smoluchowski coagulation model (Eqs. 2-4, SI Eqs. 16-24)."

- id: domain_growth_rate
  name: physical domain growth rate
  dimension: "[length]/[time]"
  description: "Rate of change da/dt of physical lipid domain radius in the Smoluchowski coalescence model (SI Eqs. 25, 35, 36)."

- id: domain_growth_rate_sim
  name: dimensionless domain growth rate
  dimension: dimensionless
  description: "Rate of change da/dt of dimensionless domain radius in the 2D Lifshitz-Slyozov derivation (SI Eq. 6)."

- id: smoluchowski_cubic_rate
  name: Smoluchowski cubic coarsening prefactor
  dimension: "[length]**3/[time]"
  description: "Prefactor k (SI Eq. 28) or m (SI Eq. 36) governing a^3 growth rate in the Smoluchowski coalescence derivation."

- id: initial_size_weight
  name: initial cubic size weight
  dimension: dimensionless
  description: "Dimensionless coefficient b multiplying a_0^3 in SI Eq. (28)."

- id: coalescence_rate_constant
  name: effective 2D domain coalescence rate constant
  dimension: "[length]**2/[time]"
  description: "Transport-limited second-order coalescence rate constant k^eff = J / n^2 in Eq. (4) and SI Eqs. (24), (34)."

- id: coalescence_flux
  name: 2D domain coalescence sink rate
  dimension: "1/[length]**2/[time]"
  description: "Rate of decrease J = k^eff n^2 of singlet domain number density due to dimerization (Eqs. 2-3, SI Eqs. 18-19, 23, 34)."

- id: smoluchowski_matching_constant
  name: asymptotic matching constant
  dimension: dimensionless
  description: "Order-unity numerical prefactor C obtained from singular perturbation asymptotic matching in Eq. (4) and SI Eq. (34)."

- id: dimensionless_shear_domain_param
  name: dimensionless shear-coarsening parameter
  dimension: dimensionless
  description: "Dimensionless combination C_1 * a^(3/2) = C * Pe_c^(1/2) governing crossover from t^(1/3) to t^(2/3) scaling in SI Eqs. (37)-(39)."

- id: pair_distribution_normalized
  name: normalized pair distribution function
  dimension: dimensionless
  description: "Normalized 2D pair distribution function g(r)/n^2 = ln(r/(2a)) / ln(L/(2a)) for hard-circle domains (main text p. 3-4, SI Eqs. 22, 32)."

- id: surface_flow_velocity
  name: active surface flow velocity
  dimension: "[length]/[time]"
  description: "Characteristic in-plane velocity v of actomyosin-driven lipid membrane surface flows (p. 3)."

- id: lipid_molecular_size
  name: lipid molecule lateral size
  dimension: "[length]"
  description: "Characteristic molecular length scale l (~1 nm) of an individual lipid used to estimate the molecular Peclet number (p. 3)."

- id: lipid_diffusivity
  name: molecular lipid diffusivity
  dimension: "[length]**2/[time]"
  description: "2D translational diffusion coefficient D_lip of individual lipid molecules in a bilayer (1-10 um^2/s, p. 3)."

- id: molecular_peclet_number
  name: molecular or Cahn-Hilliard Peclet number
  dimension: dimensionless
  description: "Dimensionless Peclet number Pe = gamma_dot * kappa / M in the Cahn-Hilliard equation (Eq. 1, p. 3) or molecular estimate v * l / D_lip (p. 3)."

- id: colloidal_peclet_number
  name: colloidal domain Peclet number
  dimension: dimensionless
  description: "Domain-scale Peclet number Pe_c = gamma_dot * a^2 / D_c = 16 * gamma_dot * eta * a^3 / (k_B * T) in the Smoluchowski model (pp. 4-5, SI pp. 6-7)."

- id: domain_diffusivity
  name: lipid domain diffusivity
  dimension: "[length]**2/[time]"
  description: "Large-domain Saffman-Delbruck translational diffusivity D_c = k_B * T / (16 * eta * a) for a >> L_SD (p. 4, SI p. 6)."

- id: solvent_viscosity
  name: bulk 3D solvent viscosity
  dimension: "[mass]/[length]/[time]"
  description: "Dynamic viscosity eta of the 3D aqueous solvent embedding the lipid bilayer (p. 4, SI p. 6)."

- id: shear_rate
  name: physical rate of strain
  dimension: "1/[time]"
  description: "Physical in-plane rate of strain / shear rate gamma_dot experienced by membrane domains."

- id: shear_rate_sim
  name: simulation rate of strain
  dimension: dimensionless
  description: "Rate of strain gamma_dot in Cahn-Hilliard simulation units (e.g., 0.04 in Fig. 3 and Movies S5-S6)."

- id: system_size
  name: physical system size
  dimension: "[length]"
  description: "Outer cutoff or system size L in the 2D Smoluchowski boundary condition g(r = L) = n^2 (p. 4, SI pp. 5-7)."

- id: system_size_sim
  name: simulation box length
  dimension: dimensionless
  description: "Linear dimension L of the 2D simulation domain (32*pi in SI Sec. IV) or outer radius L in dimensionless Lifshitz-Slyozov SI Eqs. (4)-(10)."

- id: size_ratio_deviation
  name: late-time box-to-domain ratio deviation
  dimension: dimensionless
  description: "Small parameter epsilon in L/a = 1 + epsilon (SI Eqs. 8-10, 27-28, 36) or corrected L/(2a) = 1 + epsilon."

- id: order_parameter
  name: concentration order parameter
  dimension: dimensionless
  description: "Cahn-Hilliard scalar concentration field phi(x, t), bulk phase equilibria (+/-1), initial/average composition phi_0 or phi_avg, or domain mass <phi>."

- id: noise_amplitude
  name: initial white-noise amplitude
  dimension: dimensionless
  description: "Amplitude (0.1) of initial white-noise concentration fluctuations added to phi_avg (SI Sec. IV, p. 8)."

- id: lipid_mobility_sim
  name: Cahn-Hilliard mobility parameter
  dimension: dimensionless
  description: "Lipid mobility parameter M in the Cahn-Hilliard simulation equation (SI Eq. 46, Fig. 3, Movies S3-S6, Fig. S5)."

- id: gradient_coeff_sim
  name: Cahn-Hilliard gradient surface tension parameter
  dimension: dimensionless
  description: "Gradient energy / surface tension parameter kappa in the Cahn-Hilliard simulation equation (Eq. 1, SI Eq. 46)."

- id: characteristic_length_sim
  name: Cahn-Hilliard characteristic length scale
  dimension: dimensionless
  description: "Characteristic interfacial length scale l_c = sqrt(kappa) (SI Sec. III.B.3, p. 8)."

- id: characteristic_time_sim
  name: Cahn-Hilliard characteristic time scale
  dimension: dimensionless
  description: "Characteristic diffusive time scale t_c = kappa / M used to non-dimensionalize simulation time (SI Sec. I p. 1, Sec. III.B.3 p. 8)."

- id: line_tension_dimless
  name: dimensionless interface line tension
  dimension: dimensionless
  description: "Dimensionless line tension sigma appearing in the Gibbs-Thomson boundary condition epsilon(a) = sigma/(2a) (SI Sec. III.A Eqs. 4-11)."

- id: concentration_fluctuation
  name: bulk order parameter fluctuation
  dimension: dimensionless
  description: "Small perturbation epsilon(r) = phi(r) + 1 in the bulk phase around a domain (SI Sec. III.A Eqs. 2-5)."

- id: wave_number_sim
  name: simulation wave number
  dimension: dimensionless
  description: "Wave vector magnitude k, peak wave number k_max, minimum wave number k_min, or cutoff k_cut = 2*k_max in Fourier space (Eq. 1, SI Eq. 47, Fig. 3c)."

- id: structure_factor_sim
  name: static structure factor
  dimension: dimensionless
  description: "Radially averaged static structure factor S(k, t) = <phi_k(t) phi_{-k}(t)> (Eq. 47, Fig. 3c)."

- id: fourier_mode_ratio
  name: normalized Fourier mode amplitude ratio
  dimension: dimensionless
  description: "Ratio phi_k(t) / phi_k(0) of a Fourier concentration mode in linearized Cahn-Hilliard shear perturbation theory (SI Eq. 45)."

- id: grid_points_per_side
  name: simulation grid points per side
  dimension: dimensionless
  description: "Number of grid points N along each side of the N x N 2D periodic simulation grid (512 in SI Sec. IV)."

- id: solver_tolerance
  name: adaptive time-step tolerance
  dimension: dimensionless
  description: "Error tolerance tol (10^-4) in the adaptive time-stepping scheme of SI Sec. IV (p. 8)."

- id: timestamp_scale_factor
  name: movie timestamp scale factor
  dimension: dimensionless
  description: "Multiplicative factor (10) scaling nondimensional simulation timestamps in Movies S3 and S4 to match experimental timescales (SI Sec. I, p. 1)."

- id: growth_fit_prefactor
  name: power-law shift fit prefactor
  dimension: dimensionless
  description: "Prefactor A in the empirical time-shifted power-law fit a(t) = (A*t + B)^alpha (p. 2, SI Eq. 1) expressed in dimensionless units."

- id: growth_fit_offset
  name: power-law shift fit offset
  dimension: dimensionless
  description: "Initial-size offset B = a_0^(1/alpha) in a(t) = (A*t + B)^alpha (p. 2, SI Eq. 1) expressed in dimensionless units."

- id: temperature
  name: temperature
  dimension: "[temperature]"
  description: "Experimental temperature T (electroformation, GUV rupture, actin/myosin incubation, storage, or room temperature)."

- id: mole_percentage
  name: lipid mole percentage
  dimension: dimensionless
  description: "Molar percentage (%) of each lipid or fluorescent lipid dye in GUV membrane formulations."

- id: mass_percentage
  name: sucrose percentage
  dimension: dimensionless
  description: "Percentage of sucrose (6%) used as cryoprotectant for frozen protein stocks (SI Sec. II.B, p. 2)."

- id: molar_concentration
  name: molar concentration
  dimension: "[substance]/[length]**3"
  description: "Molar concentration of buffer components, sucrose, F-actin, myosin II, HMM, or DMNPE-caged ATP."

- id: mass_concentration
  name: mass concentration
  dimension: "[mass]/[length]**3"
  description: "Mass concentration of PLL-g-PEG solution (0.1 mg/mL) used for coverslip passivation (SI Sec. II.D, p. 2)."

- id: ph
  name: buffer pH
  dimension: dimensionless
  description: "Acidity/alkalinity pH of aqueous buffers (SI Sec. II.A-B, pp. 1-2)."

- id: electric_potential
  name: electroformation peak-to-peak voltage
  dimension: "[mass]*[length]**2/[current]/[time]**3"
  description: "Sinusoidal peak-to-peak electric potential amplitude (3 V) used during GUV electroformation (SI Sec. II.C, p. 2)."

- id: frequency
  name: electroformation AC frequency
  dimension: "1/[time]"
  description: "Sinusoidal AC frequency (10 Hz, 2 Hz) applied during GUV electroformation (SI Sec. II.C, p. 2)."

- id: electrical_resistance
  name: ITO slide sheet resistance
  dimension: "[mass]*[length]**2/[current]**2/[time]**3"
  description: "Electrical resistance (8-12 ohm) of ITO-coated microscope slides used for electroformation (SI Sec. II.C, p. 2)."

- id: gasket_thickness
  name: electroformation gasket thickness
  dimension: "[length]"
  description: "Thickness (2 mm) of the rubber gasket between ITO slides (SI Sec. II.C, p. 2)."

- id: chamber_diameter
  name: PDMS sample chamber diameter
  dimension: "[length]"
  description: "Diameter (6 mm) of the cylindrical PDMS liquid chamber attached to the coverslip (SI Sec. II.D, p. 2)."

- id: mesh_size
  name: actin cortex mesh size
  dimension: "[length]"
  description: "Characteristic pore/mesh size (~1 um) of the surface-adsorbed F-actin network (p. 3)."

- id: wavelength
  name: optical wavelength
  dimension: "[length]"
  description: "Optical wavelength of UV uncaging illumination (404 nm) or fluorescence emission filters (SI Sec. II.F, II.H, p. 3)."

- id: numerical_aperture
  name: microscope objective numerical aperture
  dimension: dimensionless
  description: "Numerical aperture (NA = 1.45) of the 100x oil-immersion objective (SI Sec. II.F, p. 3)."

- id: magnification
  name: microscope objective magnification
  dimension: dimensionless
  description: "Magnification (100x) of the oil-immersion objective (SI Sec. II.F, p. 3)."

- id: relative_centrifugal_force
  name: relative centrifugal force
  dimension: dimensionless
  description: "Centrifugation acceleration in multiples of Earth gravity (142000 x g) during labeled F-actin purification (SI Sec. II.B, p. 2)."

- id: scale_bar_length
  name: micrograph scale bar length
  dimension: "[length]"
  description: "Physical length (5 um) of scale bars in fluorescence micrographs (Fig. 1d, Figs. S2-S4)."

- id: normalized_fluorescence_intensity
  name: normalized actin fluorescence intensity
  dimension: dimensionless
  description: "Mean actin fluorescence intensity I normalized by the brightest sample I_max (Fig. S2, p. 10)."
