id: saffman_delbruck_diffusivity_peclet
name: large-domain Saffman-Delbruck diffusivity and colloidal Peclet number
role: model
stated:
  page: 12
  printed_page: "SI-6"
  quote: "applying the diffusivity Dc = 16ηa for 2D domains much larger than"
  where: "SI Sec. III.B.1-2 (also main text pp. 4-5)"
equation: "D_c = k_B * T / (16 * eta * a); Pe_c = gamma_dot * a^2 / D_c = 16 * gamma_dot * eta * a^3 / (k_B * T)"
inputs:
  T:
    quantity: temperature
    unit: K
  eta:
    quantity: solvent_viscosity
    unit: Pa*s
  a:
    quantity: domain_size
    unit: um
  gamma_dot:
    quantity: shear_rate
    unit: 1/s
outputs:
  D_c:
    quantity: domain_diffusivity
    unit: um^2/s
  Pe_c:
    quantity: colloidal_peclet_number
    unit: dimensionless
settings: {}
stochastic: false
