id: domain_growth_power_law_shift
name: time-shifted power-law coarsening fit (SI Eq. 1, main p. 2)
role: fit
stated:
  page: 9
  printed_page: "SI-3"
  quote: "Domain size versus time was fitted to an equation of the form:"
  where: "SI Sec. II.I Eq. (1) (also main p. 2, Figs. S3-S4)"
equation: "a = (A * t + B)^alpha; a_0 = B^alpha; t_plot = t + B / A"
inputs:
  A:
    quantity: growth_fit_prefactor
    unit: dimensionless
  B:
    quantity: growth_fit_offset
    unit: dimensionless
  alpha:
    quantity: coarsening_exponent
    unit: dimensionless
  t:
    quantity: time_sim
    unit: dimensionless
outputs:
  a:
    quantity: domain_size_sim
    unit: dimensionless
  a_0:
    quantity: domain_size_sim
    unit: dimensionless
  t_plot:
    quantity: time_sim
    unit: dimensionless
  alpha_recovered:
    quantity: coarsening_exponent
    unit: dimensionless
settings: {}
stochastic: false
