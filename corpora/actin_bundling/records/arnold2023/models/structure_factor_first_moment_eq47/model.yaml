id: structure_factor_first_moment_eq47
name: domain size from static structure factor first moment (SI Eq. 47)
role: processing
stated:
  page: 14
  printed_page: "SI-8"
  quote: "the inverse of the first moment of the structure factor:"
  where: "SI Sec. IV.A Eq. (47)"
equation: "a(t) = (int_{k_min}^{2*k_max} S(k, t) dk) / (int_{k_min}^{2*k_max} k * S(k, t) dk)"
inputs:
  S_k:
    quantity: structure_factor_sim
    unit: dimensionless
    curve:
      quantity: wave_number_sim
      unit: dimensionless
outputs:
  a_sf:
    quantity: domain_size_sim
    unit: dimensionless
  k_max:
    quantity: wave_number_sim
    unit: dimensionless
settings: {}
stochastic: false
