id: lifshitz_slyozov_2d_asymptotic_eq11
name: 2D Lifshitz-Slyozov leading-order coarsening law (SI Eq. 11)
role: model
stated:
  page: 10
  printed_page: "SI-4"
  quote: "The leading order solution is"
  where: "SI Sec. III.A Eq. (11)"
equation: "a^3 = (9/2) * sigma * t => a = ((9/2) * sigma * t)^(1/3); alpha = d(ln a)/d(ln t) = 1/3"
inputs:
  sigma:
    quantity: line_tension_dimless
    unit: dimensionless
  t:
    quantity: time_sim
    unit: dimensionless
outputs:
  a:
    quantity: domain_size_sim
    unit: dimensionless
  alpha:
    quantity: coarsening_exponent
    unit: dimensionless
settings: {}
stochastic: false
