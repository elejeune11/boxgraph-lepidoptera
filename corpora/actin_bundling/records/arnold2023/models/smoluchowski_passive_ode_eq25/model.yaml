id: smoluchowski_passive_ode_eq25
name: passive Smoluchowski coalescence exact ODE and implicit solution (SI Eqs. 25-26)
role: model
stated:
  page: 12
  printed_page: "SI-6"
  quote: "we rewrite Eq. 24 to describe the evolution of domain size a:"
  where: "SI Sec. III.B.1 Eqs. (25)-(26)"
equation: "da/dt = k_B*T*phi_A / (16*eta*a^2*ln(L/(2a))); (1/9)*a^3*[3*ln(L/(2a)) + 1] - (1/9)*a_0^3*[3*ln(L/(2a_0)) + 1] = (k_B*T*phi_A/(16*eta))*t"
inputs:
  T:
    quantity: temperature
    unit: K
  eta:
    quantity: solvent_viscosity
    unit: Pa*s
  phi_A:
    quantity: domain_area_fraction
    unit: dimensionless
  L:
    quantity: system_size
    unit: um
  a_0:
    quantity: domain_size
    unit: um
  t:
    quantity: time
    unit: s
outputs:
  a:
    quantity: domain_size
    unit: um
  da_dt:
    quantity: domain_growth_rate
    unit: um/s
  alpha_eff:
    quantity: coarsening_exponent
    unit: dimensionless
settings:
  root_tol: 1.0e-10
stochastic: false
