id: cahn_hilliard_2d_pde_at_curve
name: 2D Cahn-Hilliard domain size curve a(t) vs. t via SI Eq. (47) (Fig. 3d)
role: model
built_from:
  - cahn_hilliard_2d_pde
stated:
  page: 4
  printed_page: "128402-4"
  quote: "Fig. 3(d), we compare the rate of domain growth for the"
  where: "Fig. 3(d) and SI Sec. IV Eqs. (46)-(47)"
equation: "d(phi_k)/dt + F[v . grad phi] = -M*k^2*F[phi^3 - phi] - M*kappa*k^4*phi_k; a(t) = int S(k,t) dk / int k S(k,t) dk"
inputs:
  M:
    quantity: lipid_mobility_sim
    unit: dimensionless
  kappa:
    quantity: gradient_coeff_sim
    unit: dimensionless
  gamma_dot:
    quantity: shear_rate_sim
    unit: dimensionless
  L:
    quantity: system_size_sim
    unit: dimensionless
  phi_avg:
    quantity: order_parameter
    unit: dimensionless
  noise_amp:
    quantity: noise_amplitude
    unit: dimensionless
  ref_a:
    quantity: domain_size_sim
    unit: dimensionless
    curve:
      quantity: time_sim
      unit: dimensionless
outputs:
  a_sf:
    quantity: domain_size_sim
    unit: dimensionless
    curve:
      quantity: time_sim
      unit: dimensionless
  a_sf_final:
    quantity: domain_size_sim
    unit: dimensionless
settings:
  flow_type: "shear"
  N: 128
  dt: 0.05
  n_ensemble: 3
  seed: 0
stochastic: true
