id: domain_growth_power_law_scaling_sim
name: power-law domain growth scaling (a ~ t^alpha, dimensionless simulation time)
role: model
stated:
  page: 4
  printed_page: "128402-4"
  quote: "maintains the same scaling as passive Ostwald ripening,"
  where: "Fig. 3(d), Fig. S5"
equation: "a(t) ~ t^alpha; a(t)/a_0 ~ t^alpha"
prefactor: unknown
inputs:
  t:
    quantity: time_sim
    unit: dimensionless
  alpha:
    quantity: coarsening_exponent
    unit: dimensionless
outputs:
  a_norm:
    quantity: normalized_domain_size
    unit: dimensionless
  a_sim:
    quantity: domain_size_sim
    unit: dimensionless
settings: {}
stochastic: false
