id: lifshitz_slyozov_2d_ode_eq6
name: 2D Lifshitz-Slyozov exact implicit ODE and bulk profile (SI Eqs. 4, 6, 7)
role: model
stated:
  page: 10
  printed_page: "SI-4"
  quote: "Solving this first order differential equation yields"
  where: "SI Sec. III.A Eqs. (4), (6)-(7)"
equation: "epsilon(r) = (sigma/(2a)) * ln(r/L)/ln(a/L); da/dt = -sigma / (2 * a^2 * ln(a/L)); (a^3/9)*[1 + 3*ln(L/a)] = (sigma/2)*t + C"
inputs:
  sigma:
    quantity: line_tension_dimless
    unit: dimensionless
  L:
    quantity: system_size_sim
    unit: dimensionless
  a_0:
    quantity: domain_size_sim
    unit: dimensionless
  t:
    quantity: time_sim
    unit: dimensionless
outputs:
  a:
    quantity: domain_size_sim
    unit: dimensionless
  da_dt:
    quantity: domain_growth_rate_sim
    unit: dimensionless
  alpha_eff:
    quantity: coarsening_exponent
    unit: dimensionless
  epsilon_mid:
    quantity: concentration_fluctuation
    unit: dimensionless
settings:
  root_tol: 1.0e-10
stochastic: false
