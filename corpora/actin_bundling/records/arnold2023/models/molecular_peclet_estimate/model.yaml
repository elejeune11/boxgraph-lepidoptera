id: molecular_peclet_estimate
name: molecular Peclet number estimate from lipid size, diffusivity, and flow speed
role: model
from_words: true
stated:
  page: 3
  printed_page: "128402-3"
  quote: "estimate of the molecular Péclet number based on lite-"
  where: "text"
equation: "Pe_mol = v * l / D_lip"
inputs:
  v:
    quantity: surface_flow_velocity
    unit: um/s
  l:
    quantity: lipid_molecular_size
    unit: nm
  D_lip:
    quantity: lipid_diffusivity
    unit: um^2/s
outputs:
  Pe_mol:
    quantity: molecular_peclet_number
    unit: dimensionless
settings: {}
stochastic: false
