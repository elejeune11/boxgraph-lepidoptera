id: cahn_hilliard_scales_peclet
name: Cahn-Hilliard characteristic scales and Peclet number (Eq. 1, SI Sec. I & III.B.3)
role: processing
stated:
  page: 3
  printed_page: "128402-3"
  quote: "Pe ≡ γ̇κ=M, γ̇ is the rate of strain, M is lipid mobility,"
  where: "text (Eq. 1, Fig. 3 caption, SI pp. 1, 8)"
equation: "l_c = sqrt(kappa); t_c = kappa / M; Pe = gamma_dot * kappa / M"
inputs:
  M:
    quantity: lipid_mobility_sim
    unit: dimensionless
  kappa:
    quantity: gradient_coeff_sim
    unit: dimensionless
  gamma_dot:
    quantity: shear_rate_sim
    unit: dimensionless
outputs:
  l_c:
    quantity: characteristic_length_sim
    unit: dimensionless
  t_c:
    quantity: characteristic_time_sim
    unit: dimensionless
  Pe:
    quantity: molecular_peclet_number
    unit: dimensionless
settings: {}
stochastic: false
