id: cahn_hilliard_2d_pde_mass_curve
name: 2D Cahn-Hilliard phase-field mass conservation curve <phi>(t) vs. t (Fig. S6B-C)
role: model
built_from:
  - cahn_hilliard_2d_pde
stated:
  page: 19
  printed_page: "SI-13"
  quote: "of the simulated phase field is plotted as a function of time t"
  where: "Fig. S6(B)-(C) and SI Sec. IV Eq. (46)"
equation: "<phi>(t) = (1 / L^2) int phi(x, t) dx"
inputs:
  M:
    quantity: lipid_mobility_sim
    unit: dimensionless
  kappa:
    quantity: gradient_coeff_sim
    unit: dimensionless
  gamma_dot:
    quantity: shear_rate_sim
    unit: dimensionless
  L:
    quantity: system_size_sim
    unit: dimensionless
  phi_avg:
    quantity: order_parameter
    unit: dimensionless
  noise_amp:
    quantity: noise_amplitude
    unit: dimensionless
  ref_mass:
    quantity: order_parameter
    unit: dimensionless
    curve:
      quantity: time
      unit: s
outputs:
  mass:
    quantity: order_parameter
    unit: dimensionless
    curve:
      quantity: time
      unit: s
  mean_phi_final:
    quantity: order_parameter
    unit: dimensionless
settings:
  flow_type: "rotational"
  N: 128
  dt: 0.05
  seed: 0
stochastic: true
