id: cahn_hilliard_piv_flow
name: 2D Cahn-Hilliard simulation driven by experimental actomyosin PIV velocity field (Fig. 2, Movie S4)
role: model
runnable: false
not_runnable_reason: "The experimentally measured 2D time-dependent actomyosin PIV velocity field v(x, t) used as input to Eq. (1) / Eq. (46) for the Pe = 10^-4, 5 x 10^-3, and 10^-2 simulations (Fig. 2, Movie S4) is not released in the paper or Supplemental Material."
stated:
  page: 3
  printed_page: "128402-3"
  quote: "results, we impose the surface flow field obtained by PIV"
  where: "Eq. (1), Fig. 2, Movie S4 (SI p. 1)"
equation: "d(phi_k)/dt + Pe * F{v_PIV(x, t) . grad phi} = -k^2 * F{phi^3 - phi} - k^4 * phi_k"
built_from:
  - cahn_hilliard_2d_pde
inputs:
  M:
    quantity: lipid_mobility_sim
    unit: dimensionless
  kappa:
    quantity: gradient_coeff_sim
    unit: dimensionless
  Pe:
    quantity: molecular_peclet_number
    unit: dimensionless
outputs:
  alpha_sf:
    quantity: coarsening_exponent
    unit: dimensionless
settings:
  N: 512
  tol: 1.0e-4
  seed: 0
stochastic: false

