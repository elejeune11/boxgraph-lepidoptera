id: cahn_hilliard_2d_pde
name: 2D pseudospectral convective Cahn-Hilliard solver (Eq. 1, SI Eqs. 46-47, Figs. 2-3, S5-S6)
role: model
stated:
  page: 14
  printed_page: "SI-8"
  quote: "The Cahn-Hilliard model is solved numerically using pseudo-spectral methods."
  where: "SI Sec. IV Eqs. (46)-(47) (also main text Eq. 1, Figs. 2-3, S5-S6)"
equation: "d(phi_k)/dt + F[v . grad phi] = -M*k^2*F[phi^3 - phi] - M*kappa*k^4*phi_k; a(t) = int_{k_min}^{2*k_max} S(k,t) dk / int_{k_min}^{2*k_max} k S(k,t) dk"
inputs:
  M:
    quantity: lipid_mobility_sim
    unit: dimensionless
  kappa:
    quantity: gradient_coeff_sim
    unit: dimensionless
  gamma_dot:
    quantity: shear_rate_sim
    unit: dimensionless
  L:
    quantity: system_size_sim
    unit: dimensionless
  phi_avg:
    quantity: order_parameter
    unit: dimensionless
  noise_amp:
    quantity: noise_amplitude
    unit: dimensionless
outputs:
  alpha_sf:
    quantity: coarsening_exponent
    unit: dimensionless
  alpha_ap:
    quantity: coarsening_exponent
    unit: dimensionless
  mean_phi_final:
    quantity: order_parameter
    unit: dimensionless
  k_max_final:
    quantity: wave_number_sim
    unit: dimensionless
settings:
  flow_type: "passive"
  N: 128
  dt: 0.05
  t_start_fit: 20.0
  t_end: 50.0
  sample_dt: 2.5
  seed: 0
stochastic: true
