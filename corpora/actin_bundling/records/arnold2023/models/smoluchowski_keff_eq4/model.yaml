id: smoluchowski_keff_eq4
name: Smoluchowski effective coalescence rate constant and flux in shear flow (Eq. 4, SI Eqs. 22-24, 34)
role: model
stated:
  page: 4
  printed_page: "128402-4"
  quote: "perturbation analysis at small Pec gives"
  where: "Eq. (4) (also SI Eqs. 22-24, 34)"
equation: "k_eff = (pi * k_B * T / (8 * eta * a * ln(L/(2a)))) * (1 + C * Pe_c^(1/2)); J = k_eff * n^2; g_norm(r) = ln(r/(2a))/ln(L/(2a))"
built_from:
  - saffman_delbruck_diffusivity_peclet
inputs:
  T:
    quantity: temperature
    unit: K
  eta:
    quantity: solvent_viscosity
    unit: Pa*s
  a:
    quantity: domain_size
    unit: um
  L:
    quantity: system_size
    unit: um
  gamma_dot:
    quantity: shear_rate
    unit: 1/s
  C:
    quantity: smoluchowski_matching_constant
    unit: dimensionless
  n:
    quantity: domain_number_density
    unit: 1/um^2
outputs:
  k_eff:
    quantity: coalescence_rate_constant
    unit: um^2/s
  J:
    quantity: coalescence_flux
    unit: 1/(um^2*s)
  Pe_c:
    quantity: colloidal_peclet_number
    unit: dimensionless
  g_norm_mid:
    quantity: pair_distribution_normalized
    unit: dimensionless
settings: {}
stochastic: false
