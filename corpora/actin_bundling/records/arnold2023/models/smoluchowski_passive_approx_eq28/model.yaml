id: smoluchowski_passive_approx_eq28
name: passive Smoluchowski late-time approximation as printed (SI Eqs. 27-28)
role: model
stated:
  page: 12
  printed_page: "SI-6"
  quote: "Thus domains grow approximately as"
  where: "SI Sec. III.B.1 Eqs. (27)-(28)"
equation: "a = (k * t + b * a_0^3)^(1/3); k = 9*k_B*T*phi_A / (16*eta*(3*ln(1/2) + 3*epsilon + 1)); b = 3*ln(L/(2*a_0)) + 1"
inputs:
  T:
    quantity: temperature
    unit: K
  eta:
    quantity: solvent_viscosity
    unit: Pa*s
  phi_A:
    quantity: domain_area_fraction
    unit: dimensionless
  L:
    quantity: system_size
    unit: um
  a_0:
    quantity: domain_size
    unit: um
  epsilon:
    quantity: size_ratio_deviation
    unit: dimensionless
  t:
    quantity: time
    unit: s
outputs:
  k:
    quantity: smoluchowski_cubic_rate
    unit: um^3/s
  b:
    quantity: initial_size_weight
    unit: dimensionless
  a:
    quantity: domain_size
    unit: um
  da_dt:
    quantity: domain_growth_rate
    unit: um/s
  alpha_eff:
    quantity: coarsening_exponent
    unit: dimensionless
settings: {}
stochastic: false
