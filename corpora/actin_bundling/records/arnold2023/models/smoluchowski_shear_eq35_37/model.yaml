id: smoluchowski_shear_eq35_37
name: Smoluchowski domain growth in simple shear flow as printed (SI Eqs. 35-37)
role: model
stated:
  page: 13
  printed_page: "SI-7"
  quote: "The solution to Eq. 36 is"
  where: "SI Sec. III.B.2 Eqs. (35)-(37)"
equation: "da/dt = (m / a^2) * (1 + C * Pe_c^(1/2)); m = pi*k_B*T / (8*eta*(ln(1/2) + epsilon)); (2/(3*C_1^2))*[C_1*a^(3/2) - ln(1 + C_1*a^(3/2))] = C_0 + m*t"
inputs:
  T:
    quantity: temperature
    unit: K
  eta:
    quantity: solvent_viscosity
    unit: Pa*s
  gamma_dot:
    quantity: shear_rate
    unit: 1/s
  C:
    quantity: smoluchowski_matching_constant
    unit: dimensionless
  epsilon:
    quantity: size_ratio_deviation
    unit: dimensionless
  a_0:
    quantity: domain_size
    unit: um
  t:
    quantity: time
    unit: s
outputs:
  m:
    quantity: smoluchowski_cubic_rate
    unit: um^3/s
  a:
    quantity: domain_size
    unit: um
  da_dt:
    quantity: domain_growth_rate
    unit: um/s
  C1_a_three_halves:
    quantity: dimensionless_shear_domain_param
    unit: dimensionless
  alpha_eff:
    quantity: coarsening_exponent
    unit: dimensionless
settings:
  root_tol: 1.0e-11
stochastic: false
