id: cahn_hilliard_2d_pde_sk_curve
name: 2D Cahn-Hilliard static structure factor curve <S(k)> vs. k (Fig. 3c)
role: model
built_from:
  - cahn_hilliard_2d_pde
stated:
  page: 4
  printed_page: "128402-4"
  quote: "structure factor for domains under shear flow. (d) Shear flow"
  where: "Fig. 3(c) and SI Sec. IV Eqs. (46)-(47)"
equation: "d(phi_k)/dt + F[v . grad phi] = -M*k^2*F[phi^3 - phi] - M*kappa*k^4*phi_k; <S(k, t)> = (L^2 / N^4) <|phi_k(t)|^2>"
inputs:
  M:
    quantity: lipid_mobility_sim
    unit: dimensionless
  kappa:
    quantity: gradient_coeff_sim
    unit: dimensionless
  gamma_dot:
    quantity: shear_rate_sim
    unit: dimensionless
  L:
    quantity: system_size_sim
    unit: dimensionless
  phi_avg:
    quantity: order_parameter
    unit: dimensionless
  noise_amp:
    quantity: noise_amplitude
    unit: dimensionless
  ref_Sk:
    quantity: structure_factor_sim
    unit: dimensionless
    curve:
      quantity: wave_number_sim
      unit: dimensionless
outputs:
  Sk:
    quantity: structure_factor_sim
    unit: dimensionless
    curve:
      quantity: wave_number_sim
      unit: dimensionless
  k_max:
    quantity: wave_number_sim
    unit: dimensionless
settings:
  flow_type: "shear"
  N: 128
  dt: 0.05
  t_eval: 50.0
  n_ensemble: 3
  seed: 0
stochastic: true
