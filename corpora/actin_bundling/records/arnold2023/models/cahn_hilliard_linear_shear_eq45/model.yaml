id: cahn_hilliard_linear_shear_eq45
name: linearized Cahn-Hilliard perturbation analysis under simple shear (SI Eqs. 42-45, main p. 5)
role: model
stated:
  page: 14
  printed_page: "SI-8"
  quote: "The final expression for ϕk is"
  where: "SI Sec. III.B.3 Eqs. (42)-(45) (also main p. 5)"
equation: "phi_k(t)/phi_k(0) = exp[((1 - 3*phi_0^2)*k^2 - k^4)*t] * [1 + Pe*k_x*k_y*((1 - 3*phi_0^2) - 2*k^2)*t^2]; a(t) = int S(k,t) dk / int k S(k,t) dk"
inputs:
  phi_0:
    quantity: order_parameter
    unit: dimensionless
  Pe:
    quantity: molecular_peclet_number
    unit: dimensionless
  t:
    quantity: time_sim
    unit: dimensionless
outputs:
  a_rad:
    quantity: domain_size_sim
    unit: dimensionless
  alpha_passive:
    quantity: coarsening_exponent
    unit: dimensionless
  alpha_shear_ray_correction:
    quantity: early_time_shear_exponent
    unit: dimensionless
  delta_a_rad_O_Pe:
    quantity: domain_size_sim
    unit: dimensionless
settings:
  n_k: 2000
  d_ln_t: 0.01
stochastic: false
