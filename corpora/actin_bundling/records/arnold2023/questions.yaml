  text: >
    Several derivation sign, factor, and typography issues occur in the Smoluchowski sections
    beyond those already logged: (1) Main text Eq. (3) (p. 3 / 128402-3) prints
    J = -(D_c/a)*n^2 * oint n . (Pe_c*v - grad_r ln g + grad_r V) g dl, giving opposite signs to
    -grad_r ln g and +grad_r V (implying equilibrium g ~ exp(+V/k_B*T) instead of exp(-V/k_B*T)),
    contradicting SI Eqs. (14), (15), (20), (30), and (31) (pp. 11-12) where grad_r g and
    +g*grad_r V/(k_B*T) carry the same sign (harmless for hard circles V = 0); (2) SI Eqs. (14)-(15)
    (p. 11 / SI-5) use single-domain diffusivity D_c rather than relative pair diffusivity 2*D_c for
    two identical diffusing domains in j_rel = j_1 - j_2, reducing J, k^eff, and da/dt by a factor
    of 2 relative to standard Smoluchowski pair coagulation (Russel et al., ref-32 / ref-S9);
    (3) SI Eq. (16) writes n(t) = int g(r, t) dr despite the far-field BC g(r = L) = n^2 in Eq. (21)
    giving g dimensions of [length]^-4, and SI Eqs. (17)-(18) omit the inward-normal sign flip on
    r = 2a which is silently reversed in Eq. (23); (4) SI Eq. (33) (p. 13 / SI-7) annotates
    div_r(grad_r g_0) as 1/r ~ 0 (it is identically 0 for g_0 = ln(r/2a)/ln(L/2a) in 2D) and
    div_r(r*g_0) as r*ln(r/2a)/ln(L/2a) ~ inf (it is (2*ln(r/2a) + 1)/ln(L/2a), growing only
    logarithmically; the two errors cancel to yield the same Pe_c*r^2 ~ 1 boundary-layer balance);
    and (5) cross-reference typos appear on p. 12 ("solution to Eq. 24" before Eq. 26, meaning Eq. 25)
    and p. 13 ("approximate Eq. 36" before Eq. 36, meaning Eq. 35).
  citation:
    page: 3
    printed_page: "128402-3"
    quote: "where J is a sink that captures the merging of singlet"
    where: "Main Eq. (3) and SI Eqs. (14)-(18), (23), (26), (33), (36)"

