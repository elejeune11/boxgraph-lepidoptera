  text: >
    In SI Sec. III.A Eqs. (4)-(6) (p. 10 / SI-4), the Gibbs-Thomson condition epsilon(a) = sigma/(2a) > 0
    with epsilon(L) = 0 produces an outward diffusive flux j = -2*grad(epsilon)|_{r=a} > 0, which by
    solute conservation shrinks an isolated phi = +1 droplet (Delta_phi * da/dt = -j < 0); Eq. (5)
    instead equates j = +Delta_phi * da/dt so da/dt > 0, and Eqs. (8)-(11) then take the single-droplet
    box-filling limit a -> L (L/a = 1 + epsilon) to eliminate the 2D ln(L/a) factor and obtain
    a^3 = (9/2)*sigma*t.
  citation:
