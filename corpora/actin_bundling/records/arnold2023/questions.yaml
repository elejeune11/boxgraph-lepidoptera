  text: >
    Cross-record ModelAtlas and physics synthesis with zwicker2015 (Zwicker, Hyman & Julicher,
    Phys. Rev. E 92:012317, 2015). Neither paper cites the other (0 stated relations, 0 cited.yaml
    data links; 1 shared bibliographic reference across 55 x 46 entries: E. D. Siggia, Phys. Rev.
    A 20:595, 1979 [ref-11/ref-S10 <-> ref-12]). Ten proposed scales_as relations in
    arnold2023/relations.yaml (6 verified, 4 diagnostic not_verified) establish four core
    cross-paper findings:
    (1) Opposite non-equilibrium departures from a shared passive Cahn-Hilliard / Lifshitz-Slyozov
    baseline: both papers begin from passive t^(1/3) Ostwald ripening driven by Gibbs-Thomson
    curvature shifts (verified via rel_zwicker2015_ls2d_asymptotic_scales_ls3d_corrected,
    rel_zwicker2015_gibbs_thomson_scales_ls2d_epsilon, and
    rel_zwicker2015_ch_interface_width_scales_lc; note also arnold2023's Cahn-Hilliard timescale
    t_c = kappa/M is the exact reciprocal of zwicker2015's interface diffusion rate k_0 = D_B/w^2
    under D_B = m_B*b and w = 2*sqrt(kappa/b)). Both papers also share passive t^(1/3) growth
    between 2D Brownian Smoluchowski coalescence and 3D Ostwald ripening
    (rel_zwicker2015_smol_passive_corr_scales_ls_corrected and
    rel_zwicker2015_smol_shear_low_scales_ls_corrected). Out of equilibrium, however, they act in
    diametrically opposite directions: zwicker2015's nonequilibrium chemical reactions suppress
    and arrest Ostwald ripening at stable finite droplet radii (binary/ternary/autocatalytic
    emulsions), whereas arnold2023's active actomyosin shear flows accelerate coarsening above
    t^(1/3) to t^(2/3) (rel_zwicker2015_smol_shear_high_vs_ls_corrected, not_verified with +1/3
    log-slope excess).
    (2) Mutual cross-paper corroboration of printed misprints in BOTH records: testing
    arnold2023/lifshitz_slyozov_2d_asymptotic_eq11 against printed
    zwicker2015/lifshitz_slyozov_scaling_printed yields an exact 1.0 log-slope discrepancy in
    sigma <-> w (+1/3 vs. -2/3; rel_zwicker2015_ls2d_asymptotic_vs_ls3d_printed), corroborating
    zwicker2015's missing-w dimensional misprint; conversely, testing printed
    arnold2023/smoluchowski_passive_approx_eq28 against zwicker2015/lifshitz_slyozov_scaling_corrected
    in the pre-collapse regime yields negative log-slopes from k < 0
