- id: q_smol_eq28_negative_k
  kind: possible_error
  about:
    - smoluchowski_passive_approx_eq28
    - smoluchowski_passive_approx_eq28_corrected
    - cmp_smol_eq28_printed_alpha
  text: >
    In SI Sec. III.B.1 Eqs. (27)-(28) (p. 12 / SI-6), the authors substitute L/a = 1 + epsilon
    (epsilon << 1) into ln(L/(2a)) = ln(1/2) + epsilon + O(epsilon^2). Because contact occurs at
    r = 2a, setting L/a = 1 + epsilon implies 2a > L (contact diameter larger than the box),
    making the denominator 3*ln(1/2) + 3*epsilon + 1 ≈ -1.079 + 3*epsilon strictly negative for
    small epsilon. Consequently, printed k = 9*k_B*T*phi_A / [16*eta*(3*ln(1/2) + 3*epsilon + 1)]
    is negative, predicting unphysical domain shrinkage instead of t^(1/3) growth. In addition,
    passing from Eq. (27) to Eq. (28) divides the t term by that bracket to form k but omits the
    same factor in b = 3*ln(L/(2*a_0)) + 1. Expanding around the physical contact limit
    L/(2a) = 1 + epsilon and dividing b consistently (smoluchowski_passive_approx_eq28_corrected)
    restores k > 0 and reproduces alpha = 1/3.
  citation:
    page: 12
    printed_page: "SI-6"
    quote: "Thus domains grow approximately as"
    where: "SI Eqs. (27)-(28)"

- id: q_smol_eq35_36_dropped_phiA_and_sign
  kind: possible_error
  about:
    - smoluchowski_shear_eq35_37
    - smoluchowski_shear_eq35_37_corrected
    - cmp_smol_shear_printed_low_alpha
    - cmp_smol_shear_printed_high_alpha
  text: >
    In SI Sec. III.B.2 Eq. (35) (p. 13 / SI-7), substituting constant area fraction
    phi_A = n*pi*a^2 into Eq. (34) and dn/dt = -J yields da/dt = [k_B*T*phi_A / (16*eta*a^2*ln(L/(2a)))]
    *(1 + C*Pe_c^(1/2)), consistent with passive SI Eq. (25) at Pe_c = 0. Instead, printed Eq. (35)
    retains the pi*k_B*T/(8*eta) prefactor of k^eff and omits phi_A/(2*pi) (a factor of 2*pi/phi_A
    discrepancy). Furthermore, Eq. (36) again uses ln(L/(2a)) ≈ ln(1/2) + epsilon ≈ -0.693 < 0,
    rendering m < 0 and causing Eq. (37) to collapse a(t) to 0 in finite time. Restoring
    phi_A/(2*pi) and expanding around the physical contact bound L/(2a) = 1 + epsilon
    (smoluchowski_shear_eq35_37_corrected) yields m > 0 and reproduces both alpha = 1/3 (low shear)
    and alpha = 2/3 (high shear).
  citation:
    page: 13
    printed_page: "SI-7"
    quote: "assuming constant area fraction ϕA = nπa2 , as in the previous section gives"
    where: "SI Eqs. (35)-(36)"

- id: q_smol_eq39_dimensional_and_regime
  kind: possible_error
  about:
    - smoluchowski_shear_eq35_37
    - alpha_active_smoluchowski_theory
  text: >
    In SI Eq. (39) (p. 13 / SI-7), expanding (2/(3*C_1^2))*[C_1*a^(3/2) - ln(1 + C_1*a^(3/2))]
    for large C_1*a^(3/2) yields (2/3)*[a^(3/2)/C_1 - ln(C_1*a^(3/2))/C_1^2 + O((C_1*a^(3/2))^-1 / C_1^2)];
    printed Eq. (39) writes ln(C_1*a^(3/2))/C_1 (missing the square on C_1, which is dimensionally
    inconsistent with a^(3/2)/C_1 and m*t), and SI Eq. (38) similarly omits 1/C_1^2 from the
    O((C_1*a^(3/2))^3) remainder. Conceptually, Eq. (39) also takes the C_1*a^(3/2) = C*Pe_c^(1/2) >> 1
    limit of Eq. (37) even though Eq. (34) (1 + C*Pe_c^(1/2)) was derived strictly for Pe_c << 1;
    validating both inequalities simultaneously would require C >> 1, whereas C is never evaluated
    (and at experimental Pe_c ≈ 10, large-Pe_c shear collision theory scales linearly in Pe_c rather
    than Pe_c^(1/2)).
  citation:
    page: 13
    printed_page: "SI-7"
    quote: "The a3/2 term dominates the log terms in the expansion"
    where: "SI Eqs. (38)-(39)"

