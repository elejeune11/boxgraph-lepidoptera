    arnold2023/q_smol_eq28_negative_k.
    (3) 2D logarithmic screening & Eq. (5) flux-sign corroboration: comparing zwicker2015 Eq. (13)
    in the passive unsaturated limit (k_b = 0, phi_0^B = 0 -> dR/dt = -D_B*gamma*beta/R^2 < 0)
    against arnold2023 SI Eq. (6) (da/dt = +sigma/(2*a^2*ln(L/a)) > 0) verifies identical
    (+1, -2) magnitude scaling at fixed box ratio L/a = 10
    (rel_zwicker2015_eq13_fixed_ratio_scales_ls2d_ode_rate) while highlighting both the opposite
