- id: q_lin_ch_eq41_44_45_symmetry_and_phi0
  kind: possible_error
  about:
    - cahn_hilliard_linear_shear_eq45
    - cmp_ch_linear_passive
    - cmp_ch_linear_shear_ray
  text: >
    Four subtle issues appear in the linearized Cahn-Hilliard shear perturbation derivation in
    SI Sec. III.B.3 (p. 14 / SI-8): (1) Eq. (41) swaps indices in the Fourier convective term,
    printing -G_ij*(delta_ij*phi_k + k_j*d(phi_k)/dk_i) instead of the exact -G_ij*(delta_ij*phi_k
    + k_i*d(phi_k)/dk_j) (which leaves Eq. (45) unchanged only because omega(k) is isotropic);
    (2) Eq. (44) includes a redundant factor of Pe inside phi_k1 despite defining phi_k = phi_k0
    + phi_k1*Pe; (3) the O(Pe) perturbation in S(k, t) = <phi_k phi_{-k}> is proportional to
    k_x*k_y = (k^2/2)*sin(2*theta), whose 2D angular average vanishes identically (reflecting
    symmetry under shear reversal Pe -> -Pe), so the claimed O(Pe * t^(5/4)) term in a(t) only
    arises along an anisotropic single ray k_x*k_y != 0 rather than the isotropic structure factor;
    and (4) passive t^(1/4) scaling requires 1 - 3*phi_0^2 = 0 (phi_0 = 1/sqrt(3) ≈ 0.57735),
    whereas at the simulation composition phi_avg = 0.3 (1 - 3*phi_0^2 = 0.73 > 0) linearized
    evolution amplifies a fixed fastest-growing wavenumber k_* = sqrt(0.73/2).
  citation:
    page: 14
    printed_page: "SI-8"
    quote: "The final expression for ϕk is"
    where: "SI Eqs. (41)-(45)"

- id: q_adaptive_dt_formula_error
  kind: possible_error
  about:
    - cahn_hilliard_2d_pde
    - tol_sim
  text: >
    The adaptive time-stepping formula printed in SI Sec. IV (p. 14 / SI-8),
    dt_new = [tol / (phi(t; dt) - phi(t; dt/2))]^(1/5), omits the multiplying factor dt (making it
    dimensionally inconsistent with dt_new) and omits a scalar norm/absolute value around the 2D
    field difference phi(t; dt) - phi(t; dt/2). Furthermore, the exponent 1/5 corresponds to a
    4th-order stepper (local error O(dt^5)), whereas the immediately preceding text states that
    Eq. (46) is integrated with 1st-order forward difference (implicit nabla^4), whose local error
    is O(dt^2) (exponent 1/2).
  citation:
    page: 14
    printed_page: "SI-8"
    quote: "The time step is controlled with adaptive time stepping"
    where: "SI Sec. IV"

