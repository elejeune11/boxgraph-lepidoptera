- id: ref_ls_eq6_root_tol
  run: run_ls_exact_ode_eq6
  setting: root_tol
  factors: [1, 10, 100]
  mode: divide
  output: alpha_eff
  tolerance: "0.001%"
  tolerance_basis: "added: verifies Brent root-finding convergence of SI Eq. (7) far below printed exponent precision"
  tolerance_added: true

- id: ref_smol_passive_root_tol
  run: run_smoluchowski_passive_ode
  setting: root_tol
  factors: [1, 10, 100]
  mode: divide
  output: alpha_eff
  tolerance: "0.001%"
  tolerance_basis: "added: verifies Brent root-finding convergence of SI Eq. (26) far below printed exponent precision"
  tolerance_added: true

- id: ref_smol_shear_root_tol
  run: run_smoluchowski_shear_corr_high
  setting: root_tol
  factors: [1, 10, 100]
  mode: divide
  output: alpha_eff
  tolerance: "0.001%"
  tolerance_basis: "added: verifies Brent root-finding convergence of SI Eq. (37) far below printed 6-digit 2/3 precision"
  tolerance_added: true

- id: ref_ch_linear_nk
  run: run_ch_linear_shear_spinodal_edge
  setting: n_k
  factors: [1, 2, 4]
  mode: multiply
  output: alpha_shear_ray_correction
  tolerance: "0.1%"
  tolerance_basis: "added: verifies trapezoidal k-quadrature convergence for SI Eq. (45) first-moment domain size below 0.1%"
  tolerance_added: true

- id: ref_ch_pde_passive_dt
  run: run_ch_pde_passive
  setting: dt
  factors: [1, 2]
  mode: divide
  output: alpha_ap
  tolerance: "5%"
  tolerance_basis: "added: checks temporal IMEX step convergence (dt = 0.1 -> 0.05) of passive coarsening exponent alpha_ap below the ~3-6% realization spread"
  tolerance_added: true

