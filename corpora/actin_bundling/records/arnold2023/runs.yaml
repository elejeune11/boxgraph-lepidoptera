# ==============================================================================
# Linearized Cahn-Hilliard perturbation analysis (SI Sec. III.B.3 Eqs. 42-45)
# ==============================================================================
- id: run_ch_linear_shear_spinodal_edge
  model: cahn_hilliard_linear_shear_eq45
  inputs:
    phi_0: phi0_spinodal_edge_added
    Pe: Pe_lin_ch_added
    t: t_lin_ch_added
  settings:
    n_k: 2000
    d_ln_t: 0.01
  outputs:
    a_rad: a_lin_ch_pred
    alpha_passive: alpha_lin_ch_passive_pred
    alpha_shear_ray_correction: alpha_lin_ch_shear_pred
    delta_a_rad_O_Pe: da_lin_ch_rad_pred

# ==============================================================================
# 2D Pseudospectral Convective Cahn-Hilliard PDE (Main Eq. 1, SI Sec. IV)
# ==============================================================================
- id: run_ch_pde_passive
  model: cahn_hilliard_2d_pde
  inputs:
    M: M_sim_fig3
    kappa: kappa_sim_fig3
    gamma_dot: gamma_dot_sim_zero_added
    L: box_L_sim
    phi_avg: phi_avg_sim
    noise_amp: noise_amp_sim
  settings:
    flow_type: "passive"
    N: 128
    dt: 0.1
    t_start_fit: 50.0
    t_end: 250.0
    sample_dt: 12.5
    seed: 0
  replicates: 3
  outputs:
    alpha_sf: alpha_ch_pde_passive_sf_pred
    alpha_ap: alpha_ch_pde_passive_ap_pred
    mean_phi_final: mean_phi_passive_pred
    k_max_final: kmax_passive_pred
  note: "Added numerical choice: N=128 grid with dt=0.1 (vs paper's N=512 adaptive dt) to stay <25s on CPU; refined over dt in refinements.yaml. Fit window t in [50, 250] matches t/t_c in [200, 1000] of Fig. S5."

- id: run_ch_pde_shear
  model: cahn_hilliard_2d_pde
  inputs:
    M: M_sim_fig3
    kappa: kappa_sim_fig3
    gamma_dot: gamma_dot_sim_fig3
    L: box_L_sim
    phi_avg: phi_avg_sim
    noise_amp: noise_amp_sim
  settings:
    flow_type: "shear"
    N: 128
    dt: 0.05
    t_start_fit: 20.0
    t_end: 50.0
    sample_dt: 2.5
    seed: 0
  replicates: 3
  outputs:
    alpha_sf: alpha_ch_pde_shear_sf_pred
    alpha_ap: alpha_ch_pde_shear_ap_pred
    mean_phi_final: mean_phi_shear_pred
    k_max_final: kmax_shear_pred
  note: "Added numerical choice: N=128 grid with dt=0.05 (vs paper's N=512 adaptive dt) for fast CPU execution; refined over dt in refinements.yaml. Fit window t in [20, 50] matches Fig. 3(d)."

- id: run_ch_pde_rotational
  model: cahn_hilliard_2d_pde
  inputs:
    M: M_sim_fig3
    kappa: kappa_sim_fig3
    gamma_dot: gamma_dot_sim_fig3
    L: box_L_sim
    phi_avg: phi_avg_sim
    noise_amp: noise_amp_sim
  settings:
    flow_type: "rotational"
    N: 128
    dt: 0.05
    t_start_fit: 20.0
    t_end: 50.0
    sample_dt: 2.5
    seed: 0
  replicates: 3
  outputs:
    alpha_sf: alpha_ch_pde_rot_sf_pred
    alpha_ap: alpha_ch_pde_rot_ap_pred
    mean_phi_final: mean_phi_rot_pred
    k_max_final: kmax_rot_pred
  note: "Added numerical choice: N=128 grid with dt=0.05 (vs paper's N=512 adaptive dt). Fit window t in [20, 50] matches Fig. 3(d)."

- id: run_ch_pde_extensional
  model: cahn_hilliard_2d_pde
  inputs:
    M: M_sim_fig3
    kappa: kappa_sim_fig3
    gamma_dot: gamma_dot_sim_fig3
    L: box_L_sim
    phi_avg: phi_avg_sim
    noise_amp: noise_amp_sim
  settings:
    flow_type: "extensional"
    N: 128
    dt: 0.05
    t_start_fit: 20.0
    t_end: 50.0
    sample_dt: 2.5
    seed: 0
  replicates: 3
  outputs:
    alpha_sf: alpha_ch_pde_ext_sf_pred
    alpha_ap: alpha_ch_pde_ext_ap_pred
    mean_phi_final: mean_phi_ext_pred
    k_max_final: kmax_ext_pred
  note: "Added numerical choice: N=128 grid with dt=0.05 (vs paper's N=512 adaptive dt). Pure extensional velocity v_x = gamma_dot * y, v_y = gamma_dot * x over t in [20, 50]."

