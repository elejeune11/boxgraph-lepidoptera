# ==============================================================================
# Analytical estimates, scales, and fit-identity checks
# ==============================================================================
- id: run_molecular_peclet
  model: molecular_peclet_estimate
  inputs:
    v: surface_flow_velocity_est
    l: lipid_size_est
    D_lip: lipid_diffusivity_lit
  settings: {}
  outputs:
    Pe_mol: Pe_mol_pred

- id: run_ch_scales_fig3
  model: cahn_hilliard_scales_peclet
  inputs:
    M: M_sim_fig3
    kappa: kappa_sim_fig3
    gamma_dot: gamma_dot_sim_fig3
  settings: {}
  outputs:
    l_c: l_c_fig3_pred
    t_c: t_c_fig3_pred
    Pe: Pe_fig3_pred

- id: run_ch_scales_piv
  model: cahn_hilliard_scales_peclet
  inputs:
    M: M_sim_piv
    kappa: kappa_sim_piv
    gamma_dot: gamma_dot_sim_fig3
  settings: {}
  outputs:
    l_c: l_c_piv_pred
    t_c: t_c_piv_pred
    Pe: Pe_piv_ref_pred

- id: run_saffman_delbruck_exp
  model: saffman_delbruck_diffusivity_peclet
  inputs:
    T: T_room_added
    eta: eta_water_added
    a: domain_radius_exp_added
    gamma_dot: shear_rate_exp_added
  settings: {}
  outputs:
    D_c: D_c_exp_pred
    Pe_c: Pe_c_exp_pred

- id: run_power_law_shift_check
  model: domain_growth_power_law_shift
  inputs:
    A: fit_A_added
    B: fit_B_added
    alpha: alpha_passive_theory
    t: t_fit_eval_added
  settings: {}
  outputs:
    a: a_shift_pred
    a_0: a0_shift_pred
    t_plot: t_plot_shift_pred
    alpha_recovered: alpha_shift_recovered

# ==============================================================================
# 2D Lifshitz-Slyozov Ostwald ripening (SI Sec. III.A Eqs. 4-11)
# ==============================================================================
- id: run_ls_asymptotic_eq11
  model: lifshitz_slyozov_2d_asymptotic_eq11
  inputs:
    sigma: sigma_ls_added
    t: t_ls_eval_added
  settings: {}
  outputs:
    a: a_ls_eq11_pred
    alpha: alpha_ls_eq11_pred

- id: run_ls_exact_ode_eq6
  model: lifshitz_slyozov_2d_ode_eq6
  inputs:
    sigma: sigma_ls_added
    L: L_ls_added
    a_0: a0_ls_added
    t: t_ls_eval_added
  settings:
    root_tol: 1.0e-10
  outputs:
    a: a_ls_eq6_pred
    da_dt: dadt_ls_eq6_pred
    alpha_eff: alpha_ls_eq6_pred
    epsilon_mid: eps_mid_ls_pred

