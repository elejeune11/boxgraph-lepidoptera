notes: >
  Complete read-stage record for Arnold, Gubbala & Takatori, Phys. Rev. Lett. 131, 128402 (2023),
  covering 100% of the main article (PDF pp. 1-6, journal pp. 128402-1 to 128402-6) and 100% of
  the Supplemental Material (PDF pp. 7-20, SI pp. 1-14). Every page image (pages/page-001.png to
  page-020.png) was visually inspected alongside extracted text to catch OCR errors (e.g., Eq. 4
  ln(L/(2a)) inverted by OCR as ln(2a/L)) and verify printed numeric labels inside Figs. 2, 3,
  S3, S4, and S5. Calibrated figure digitization of plotted curves/points is intentionally
  deferred to digitize:arnold2023.

  In scope: (1) experimental lipid bilayer, buffer, electroformation, coverslip passivation,
  actomyosin cortex assembly, and imaging parameters (main pp. 2-3, SI Sec. II pp. 7-9, Figs.
  S1-S4 pp. 15-18) plus measured passive/active coarsening exponents alpha; (2) molecular and
  colloidal Peclet number estimates (Pe_mol = v*l/D_lip ~ 10^-4-10^-3, Pe = gamma_dot*kappa/M = 10^-2,
  Saffman-Delbruck large-domain diffusivity D_c = k_B*T/(16*eta*a) and Pe_c = gamma_dot*a^2/D_c ~ 10);
  (3) empirical time-shifted power-law fit a = (A*t + B)^alpha (SI Eq. 1); (4) 2D Lifshitz-Slyozov
  Ostwald ripening exact ODE/implicit solution (SI Eqs. 4, 6-7) and leading-order law a^3 = (9/2)*sigma*t
  (SI Eq. 11); (5) 2D Smoluchowski coalescence rate k^eff (main Eq. 4, SI Eqs. 22-24, 34), exact passive
  ODE/implicit solution (SI Eqs. 25-26), printed vs. evidenced corrected variants for passive SI Eqs.
  (27)-(28) (fixing negative 3*ln(1/2)+1 and missing denominator in b) and shear-flow SI Eqs. (35)-(37)
  (restoring dropped phi_A/(2*pi) and fixing negative ln(1/2)+eps); (6) linearized Cahn-Hilliard shear
  perturbation analysis (SI Sec. III.B.3 Eqs. 41-45, main p. 5) showing passive t^(1/4) at the spinodal
  edge phi_0 = 1/sqrt(3) and O(Pe*t^(5/4)) along a single ray while the 2D angular average vanishes at
  O(Pe); (7) 2D pseudospectral IMEX convective Cahn-Hilliard PDE solver (main Eq. 1, SI Sec. IV Eqs.
  46-47) run for passive, shear, rotational, and extensional flows on an affordable N=128 grid with
  dt-refinement; (8) non-runnable record of the PIV-driven Cahn-Hilliard model (Fig. 2, Movie S4)
  whose experimental PIV velocity field is unreleased; and (9) all 40 main-text + 15 SI references
  (no cited works are currently records in the actin_bundling corpus).
