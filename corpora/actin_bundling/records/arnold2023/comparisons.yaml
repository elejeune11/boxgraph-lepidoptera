# ==============================================================================
# Derived Peclet number & scale reproductions
# ==============================================================================
- id: cmp_molecular_peclet
  purpose: reproduction
  computed: Pe_mol_pred
  printed: Pe_molecular_est
  note: "Checks v*l/D_lip against the literature molecular Peclet range 10^-4 to 10^-3 (p. 3)."

- id: cmp_fig3_peclet
  purpose: reproduction
  computed: Pe_fig3_pred
  printed: Pe_fig3_derived
  note: "Checks Pe = gamma_dot * kappa / M = 0.04 * 0.25 / 1 = 0.01 against Fig. 3 caption Pe = 10^-2."

- id: cmp_colloidal_peclet
  purpose: reproduction
  computed: Pe_c_exp_pred
  printed: Pe_colloidal_est
  note: "Checks Pe_c = 16*gamma_dot*eta*a^3/(k_B*T) with added room-temperature experimental inputs against printed Pe_c ≈ 10 (p. 5)."

- id: cmp_power_law_shift_identity
  purpose: consistency
  computed: alpha_shift_recovered
  printed: alpha_passive_theory
  note: "Verifies exact recovery of alpha under SI Eq. (1) time-shift rescaling t_plot = t + B/A."

# ==============================================================================
# Lifshitz-Slyozov Ostwald ripening (SI Eqs. 6-11)
# ==============================================================================
- id: cmp_ls_eq11_alpha
  purpose: reproduction
  computed: alpha_ls_eq11_pred
  printed: alpha_passive_theory
  note: "Exact reproduction of alpha = 1/3 from SI Eq. (11) a^3 = (9/2)*sigma*t."

- id: cmp_ls_eq6_exact_alpha
  purpose: approximation
  computed: alpha_ls_eq6_pred
  printed: alpha_passive_theory
  note: "Compares exact implicit 2D Lifshitz-Slyozov ODE SI Eq. (6)/(7) (retaining ln(L/a)) against leading-order alpha = 1/3."

# ==============================================================================
# Smoluchowski coalescence: passive & shear (printed vs corrected variants)
# ==============================================================================
- id: cmp_smol_passive_ode_alpha
  purpose: approximation
  computed: alpha_smol_eq25_pred
  printed: alpha_passive_theory
  note: "Compares exact implicit passive Smoluchowski solution SI Eq. (25)-(26) (with finite a_0 and ln(L/(2a))) against asymptotic alpha = 1/3."

- id: cmp_smol_eq28_printed_alpha
  purpose: reproduction
  computed: alpha_eq28_printed_pred
  printed: alpha_passive_theory
  note: "Tests printed SI Eq. (28) as written: negative denominator 3*ln(1/2) + 3*eps + 1 < 0 yields k < 0 and unphysical shrinking domains (negative alpha)."

- id: cmp_smol_eq28_corrected_alpha
  purpose: reproduction
  computed: alpha_eq28_corr_pred
  printed: alpha_passive_theory
  note: "Corrected variant of SI Eq. (28) (physical contact limit L/(2a) = 1 + eps and consistent division of b) reproduces alpha = 1/3."

- id: cmp_smol_shear_printed_low_alpha
  purpose: reproduction
  computed: alpha_shear_printed_low_pred
  printed: alpha_passive_theory
  note: "Tests printed SI Eqs. (35)-(37) in the low-shear limit: negative m < 0 causes finite-time domain collapse rather than t^(1/3) growth."

- id: cmp_smol_shear_printed_high_alpha
  purpose: reproduction
  computed: alpha_shear_printed_high_pred
  printed: alpha_active_smoluchowski_theory
  note: "Tests printed SI Eqs. (35)-(37) in the high-shear limit: negative m < 0 causes finite-time collapse rather than t^(2/3) growth."

- id: cmp_smol_shear_corr_low_alpha
  purpose: reproduction
  computed: alpha_shear_corr_low_pred
  printed: alpha_passive_theory
  note: "Corrected variant of SI Eqs. (35)-(37) in the C_1*a^(3/2) << 1 limit reproduces passive alpha = 1/3 (SI Eq. 38)."

- id: cmp_smol_shear_corr_high_alpha
  purpose: reproduction
  computed: alpha_shear_corr_high_pred
  printed: alpha_active_smoluchowski_theory
  note: "Corrected variant of SI Eqs. (35)-(37) in the C_1*a^(3/2) >> 1 limit reproduces shear-enhanced alpha = 2/3 (SI Eq. 39)."

- id: cmp_smol_shear_corr_exp_validation
  purpose: validation
  computed: alpha_shear_corr_exp_pred
  printed: alpha_exp_active_range
  note: "Validates corrected Smoluchowski shear model at experimental room-temperature inputs (gamma_dot = 0.8 s^-1, t = 10 s) against measured active range alpha = 0.59 to 0.74."

# ==============================================================================
# Linearized Cahn-Hilliard shear perturbation (SI Sec. III.B.3 Eqs. 42-45)
# ==============================================================================
- id: cmp_ch_linear_passive
  purpose: reproduction
  computed: alpha_lin_ch_passive_pred
  printed: alpha_ch_linear_passive
  note: "Reproduces passive linearized Cahn-Hilliard scaling alpha = 1/4 = 0.25 at the spinodal edge phi_0 = 1/sqrt(3) (p. 5, SI p. 8)."

- id: cmp_ch_linear_shear_ray
  purpose: reproduction
  computed: alpha_lin_ch_shear_pred
  printed: alpha_ch_linear_shear_correction
  note: "Reproduces the O(Pe * t^(5/4)) time exponent 5/4 = 1.25 along a single diagonal wavevector ray (while the 2D angular average vanishes identically at O(Pe))."

