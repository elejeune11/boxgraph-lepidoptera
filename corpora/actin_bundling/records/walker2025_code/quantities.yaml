- id: spatial_dimension
  name: simulation spatial dimension
  dimension: "dimensionless"
  description: Euclidean spatial dimension (3D) configured in CytoSim simul block.

- id: droplet_radius
  name: condensate droplet radius
  dimension: "[length]"
  description: Radius R of the spherical protein condensate space (`cell`) in CytoSim configs and icosphere analysis.

- id: filament_length
  name: actin filament length
  dimension: "[length]"
  description: Contour length of an F-actin filament (initial length, instantaneous length, or maximum length cap `max_length`).

- id: filament_segment_length
  name: actin filament segment length
  dimension: "[length]"
  description: Discretization segment length `segmentation` of F-actin fibers in CytoSim.

- id: persistence_length
  name: actin filament persistence length
  dimension: "[length]"
  description: Thermal bending persistence length L_p = rigidity / kT of F-actin.

- id: particle_radius
  name: molecular steric or hydrodynamic radius
  dimension: "[length]"
  description: Steric or solid-sphere radius of a simulated crosslinker blob, F-actin fiber, or CytoSim default fiber hydrodynamic `drag_radius`.

- id: binding_distance
  name: kinetic binding distance
  dimension: "[length]"
  description: Capture radius (`binding[1]`) for actin-crosslinker (`0.03 um`) or monomer-monomer dimerizer (`0.09 um`) binding in CytoSim.

- id: site_separation
  name: solid binding-site separation
  dimension: "[length]"
  description: Minimum pairwise separation parameter (`separation`) for placing grafted crosslinker anchor sites on a spherical CytoSim Solid.

- id: site_deviation
  name: solid binding-site radial deviation
  dimension: "[length]"
  description: Radial placement deviation parameter (`deviation`) for anchor points on a spherical CytoSim Solid.

- id: surface_threshold_distance
  name: condensate surface threshold distance
  dimension: "[length]"
  description: Distance threshold inward from spherical boundary (radial shell thickness R - r_in = 100 nm, or triangle-plane cutoff `dthreshold = 0.2 um` in `icosphere.py`).

- id: radial_position
  name: particle radial position
  dimension: "[length]"
  description: Radial distance r of an interpolated actin monomer or test filament from the center of the spherical droplet.

- id: triangle_edge_length
  name: spherical mesh triangle edge length
  dimension: "[length]"
  description: Chordal or area-equivalent equilateral edge length of icosphere mesh triangles.

- id: monomer_axial_rise
  name: actin monomer axial rise
  dimension: "[length]"
  description: Linear spacing per F-actin monomer (`2.7e-3 um = 2.7 nm`) used in `icosphere.py:interpolateallmonomers()`.

- id: displacement
  name: particle displacement or bond extension
  dimension: "[length]"
  description: Single-step 1D Brownian jump standard deviation sigma_B or harmonic dimerizer bond extension.

- id: time
  name: time
  dimension: "[time]"
  description: Simulation time step `time_step`, total simulation duration, or frame output interval.

- id: rate
  name: first-order kinetic rate
  dimension: "1 / [time]"
  description: Mesoscopic binding (`binding[0]`) or zero-force/loaded unbinding (`unbinding[0]`) rate in CytoSim.

- id: elongation_rate
  name: actin filament elongation or shrinking rate
  dimension: "[length] / [time]"
  description: Plus-end linear polymerization speed (`growing_speed`) or depolymerization speed (`shrinking_speed`) in CytoSim.

- id: diffusion_coefficient
  name: translational diffusion coefficient
  dimension: "[length] ** 2 / [time]"
  description: Translational diffusion constant D (either dead `SingleProp::diffusion` written in `.cym` or actual Stokes-Einstein `Solid` diffusivity).

- id: force
  name: mechanical force
  dimension: "[force]"
  description: Brownian ratchet stall force (`growing_force`), Bell slip-bond characteristic unbinding force (`unbinding[1]`), or spring tether force.

- id: spring_stiffness
  name: harmonic spring stiffness
  dimension: "[force] / [length]"
  description: Harmonic spring stiffness governing boundary confinement (`confine`), global steric repulsion (`simul:steric`), or grafted `SingleProp::stiffness` bond links.

- id: flexural_rigidity
  name: actin flexural rigidity
  dimension: "[force] * [length] ** 2"
  description: Bending rigidity (`rigidity`) of an F-actin fiber in CytoSim.

- id: energy
  name: thermal energy
  dimension: "[energy]"
  description: Thermal energy `kT` used in CytoSim (`simul_prop.cc:24` default `0.0042 pN*um`).

- id: dynamic_viscosity
  name: dynamic viscosity
  dimension: "[mass] / [length] / [time]"
  description: Dynamic shear viscosity (`viscosity`, units `pN*s/um^2 = Pa*s`) in CytoSim.

- id: concentration
  name: molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration corresponding to a copy number of crosslinker blobs inside a spherical droplet.

- id: count
  name: discrete count
  dimension: "dimensionless"
  description: Generic integer count (simulation steps, output frames, snapshots averaged, replicates, mesh triangles/vertices, interpolated monomers, multimer chains/rings/doubles).

- id: filament_count
  name: actin filament count
  dimension: "dimensionless"
  description: Number of F-actin filaments initialized in CytoSim (`new 30 actin` / `new 30 filament`).

- id: crosslinker_count
  name: crosslinker copy number
  dimension: "dimensionless"
  description: Number of spherical crosslinker solids (`blob`, `VASPblob`) initialized inside the droplet.

- id: valency
  name: binding valency
  dimension: "dimensionless"
  description: Number of actin-binding or monomer-monomer dimerizer wrists grafted onto each spherical Solid.

- id: volume_fraction
  name: crosslinker volume fraction
  dimension: "dimensionless"
  description: Fraction of spherical droplet volume occupied by crosslinker spheres, N * (r_solid / R)^3.

- id: surface_area_fraction
  name: actin-covered surface area fraction
  dimension: "dimensionless"
  description: Fraction of triangulated icosphere triangles occupied by near-surface actin monomers (`Frac_occupied`).

- id: fraction
  name: dimensionless fraction
  dimension: "dimensionless"
  description: Population fraction of crosslinkers/monomers in a binding state or fraction of trajectory snapshots.

- id: probability
  name: discrete per-step reaction probability
  dimension: "dimensionless"
  description: Per-time-step attachment probability `binding_prob = -expm1(-k_bind * dt)` or pairwise double-attempt probability.

- id: icosphere_subdivision
  name: icosphere subdivision depth
  dimension: "dimensionless"
  description: Number of recursive midpoint triangle subdivisions (`subdiv` / `f`) passed to `icosphere.icosphere()`.

- id: monomer_equivalents
  name: actin monomer length equivalents
  dimension: "dimensionless"
  description: Effective linear triangle size expressed in actin monomer axial-rise equivalents (`eq_side / d_mon`).

- id: dimensionless_constant
  name: dimensionless numerical constant
  dimension: "dimensionless"
  description: Hardcoded numerical constant in C++ or Python code (e.g., cylinder drag offset `0.32` or stiffness double-counting multiplier `2`).

- id: condition_index
  name: simulation sweep condition index
  dimension: "dimensionless"
  description: Integer parameter-sweep folder index `Rval` (`R_0`..`R_24`) in the released simulation output directories.
