id: icosphere_mesh_adapter
name: live adapter for icosphere.icosphere(subdiv, radius) mesh geometry (Analysis_Scripts/icosphere.py)
role: processing
software: true
stated:
  file: Analysis_Scripts/icosphere.py
  lines: "26-59"
  quote: "def icosphere(subdiv,radius):"
  where: "Analysis_Scripts/icosphere.py (icosphere) & Main_Analyze_Trajectory.py:711-713 (f=4, R=1.0)"
equation: "N_faces = 20 * 4^subdiv; N_vertices = 10 * 4^subdiv + 2; A_tri = 4*pi*R^2 / N_faces; s_eq = sqrt(4*A_tri / sqrt(3)); n_monomers = s_eq / d_mon"
inputs:
  R_drop: {quantity: droplet_radius, unit: um}
  n_subdiv: {quantity: icosphere_subdivision, unit: dimensionless}
  d_mon: {quantity: monomer_axial_rise, unit: nm}
outputs:
  n_faces: {quantity: count, unit: dimensionless}
  n_vertices: {quantity: count, unit: dimensionless}
  median_edge: {quantity: triangle_edge_length, unit: nm}
  eq_side: {quantity: triangle_edge_length, unit: nm}
  n_monomers: {quantity: monomer_equivalents, unit: dimensionless}
settings: {}
stochastic: false
