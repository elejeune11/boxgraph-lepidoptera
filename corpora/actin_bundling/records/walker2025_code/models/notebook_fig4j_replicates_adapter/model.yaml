id: notebook_fig4j_replicates_adapter
name: live notebook adapter for Figures.ipynb Cells 4 & 8 (Figure 4J 5-vs-10 replicate pooling bug)
role: processing
software: true
stated:
  file: Figures.ipynb
  lines: "529-555"
  quote: "for diriter in range(0, 2):"
  where: "Figures.ipynb Cell 4 (Figure 4J Data) & Cell 8 (Plot Figure 4J)"
equation: "Cell 4 appends diriter=0 (5 reps) as Meanlist[0..8] and diriter=1 (5 reps) as Meanlist[9..17]; Cell 8 plots only Meanlist[0..8] (5 replicates instead of 10)"
inputs:
  r_index: {quantity: condition_index, unit: dimensionless}
outputs:
  replicates_plotted: {quantity: count, unit: dimensionless}
  fo_t600_plotted: {quantity: surface_area_fraction, unit: dimensionless}
  fo_t600_second5: {quantity: surface_area_fraction, unit: dimensionless}
  fo_t600_all10: {quantity: surface_area_fraction, unit: dimensionless}
settings: {}
stochastic: false
