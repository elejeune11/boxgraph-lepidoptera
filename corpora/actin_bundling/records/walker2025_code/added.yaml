- id: probe_filament_length_added
  quantity: filament_length
  unit: um
  printed: "0.5"
  basis: "Synthetic 5-segment (L = 0.5 um, L_seg = 0.1 um) equatorial arc used to exercise live icosphere.py interpolateallmonomers() and generatedensityfield() deterministically."
  alternatives: ["0.1", "1.0", "6.2832"]
  stands_for: "Synthetic test filament contour length"

- id: probe_radius_surface_added
  quantity: radial_position
  unit: um
  printed: "0.95"
  basis: "Midpoint of the 100 nm surface shell (0.90 to 1.00 um) for testing live icosphere.py surface detection."
  alternatives: ["0.91", "0.99"]
  stands_for: "Test filament radial position inside surface shell"

- id: probe_radius_interior_added
  quantity: radial_position
  unit: um
  printed: "0.85"
  basis: "Interior radial position 150 nm from the R = 1.0 um boundary (outside the 100 nm surface shell, r < 0.9 um) for verifying live icosphere.py zero-occupancy cutoff."
  alternatives: ["0.5", "0.89"]
  stands_for: "Test filament radial position outside surface shell"

- id: probe_zero_occupied_target_added
  quantity: surface_area_fraction
  unit: dimensionless
  printed: "0"
  basis: "Exact expected surface occupancy (0) for a filament at r = 0.85 um outside the 100 nm radial shell threshold."
  alternatives: ["0.001"]
  stands_for: "Expected zero occupancy for interior filament"

- id: probe_chain_len_added
  quantity: count
  unit: dimensionless
  printed: "4"
  basis: "Synthetic 4-mer linear chain for live verification of Main_Analyze_Trajectory.find_chains_rings_and_doubles()."
  alternatives: ["2", "6"]
  stands_for: "Test linear multimer chain length"

- id: probe_ring_len_added
  quantity: count
  unit: dimensionless
  printed: "3"
  basis: "Synthetic 3-mer closed ring for live verification of Main_Analyze_Trajectory.find_chains_rings_and_doubles()."
  alternatives: ["4", "6"]
  stands_for: "Test closed multimer ring length"

- id: probe_n_doubles_added
  quantity: count
  unit: dimensionless
  printed: "2"
  basis: "Two synthetic double-bonded dimers (4 monomers total) for live verification of Main_Analyze_Trajectory.find_chains_rings_and_doubles()."
  alternatives: ["1", "3"]
  stands_for: "Test count of double-bonded dimers"

- id: probe_topology_monomer_sum_added
  quantity: count
  unit: dimensionless
  printed: "11"
  basis: "Exact monomer sum of the synthetic multimer graph: 4 (chain) + 3 (ring) + 2*2 (doubles) = 11 monomers."
  alternatives: ["10", "12"]
  stands_for: "Expected total monomers across test multimer graph"

- id: probe_vaspprops_ncross_added
  quantity: crosslinker_count
  unit: dimensionless
  printed: "100"
  basis: "Synthetic cohort of 100 bivalent crosslinkers each bridging 2 distinct filaments to audit live Main_Analyze_Trajectory.getvaspprops()."
  alternatives: ["10", "1000"]
  stands_for: "Synthetic 2-filament-bound crosslinker count"

- id: probe_dimer_extension_added
  quantity: displacement
  unit: um
  printed: "0.09"
  basis: "Dimerizer capture-range extension (90 nm = 0.09 um) used to evaluate harmonic tether tension and Bell detachment in cytosim_dimerizer_bond_mechanics."
  alternatives: ["0.03", "0.5", "1.0"]
  stands_for: "Test dimerizer spring extension"

- id: probe_dimer_ksplit_ring_added
  quantity: rate
  unit: 1/s
  printed: "0.1"
  basis: "Ring-forming dynamic dimer splitting rate k_dimer_split = 0.1 s^-1 (Figure_5 R_22, config22.cym line 50)."
  alternatives: ["0.001", "0.01", "1.0", "10.0"]
  stands_for: "Ring-condition dimer splitting rate"
