# =============================================================================
# 1. Reproduction checks: live code models vs walker2025 printed claims/results
# =============================================================================
- id: cmp_icosphere_f4_monomers_vs_paper
  purpose: reproduction
  computed: ico_f4_n_monomers
  printed: paper_icosphere_target_monomers
  note: "Live icosphere.icosphere(4, 1.0) (5,120 faces, s_eq = 75.24 nm) spans 27.9 actin monomers at icosphere.py's 2.7 nm rise, disagreeing with Methods S1 p. 43's stated ~10 actin monomers."

- id: cmp_icosphere_n3_monomers_vs_paper
  purpose: reproduction
  computed: ico_n3_n_monomers
  printed: paper_icosphere_target_monomers
  note: "Live icosphere.icosphere(3, 1.0) at Methods S1's stated subdivision depth 3 (1,280 faces, s_eq = 150.21 nm) spans 55.6 monomers, even further from ~10."

- id: cmp_icosphere_shell_thickness_vs_paper
  purpose: reproduction
  computed: ico_shell_thickness_computed
  printed: paper_surface_threshold_dist
  note: "Verifies icosphere.py:224 radial shell cutoff (R_drop - 0.9 = 100 nm) matches Methods S1 p. 43's 100 nm surface threshold distance."

- id: cmp_icosphere_interior_zero_occupancy
  purpose: consistency
  computed: ico_int_frac_occupied
  printed: probe_zero_occupied_target_added
  note: "Verifies live icosphere.generatedensityfield() assigns zero occupied triangles to a filament at r = 0.85 um (outside the 100 nm surface shell)."

- id: cmp_multimer_topology_monomer_conservation
  purpose: consistency
  computed: topo_total_monomers
  printed: probe_topology_monomer_sum_added
  note: "Verifies live Main_Analyze_Trajectory.find_chains_rings_and_doubles() classifies 1 chain (4-mer) + 1 ring (3-mer) + 2 double-bonded dimers conserving all 11 monomers."

- id: cmp_vaspprops_bug_2fil_count
  purpose: consistency
  computed: vaspprops_bug_nfpc_2
  printed: probe_vaspprops_ncross_added
  note: "Proves shipped Main_Analyze_Trajectory.getvaspprops() fails to count 100 2-filament crosslinkers (returns 0 in 2-fil and 100 in 4-fil due to enumerate(unique) tuple comparison bug)."

- id: cmp_nb_fig5d_nsnaps_as_written_vs_paper
  purpose: reproduction
  computed: fig5d_r22_nsnaps_written
  printed: paper_last_snapshots_count
  note: "Live Figures.ipynb Cell 13 as written averages ALL 601 snapshots per replicate due to int(0.95*len(Row1)), directly contradicting Fig. 5D caption's claim of 'last 30 snapshots (5%)'."

- id: cmp_nb_fig5d_nsnaps_last30_vs_paper
  purpose: reproduction
  computed: fig5d_r22_nsnaps_last30
  printed: paper_last_snapshots_count
  note: "Corrected last-30-snapshots variant of Figures.ipynb Cell 13 matches Fig. 5D caption's 30 snapshots per replicate and raises Dimer_2 at R_22 from 0.3461 to 0.6145."

- id: cmp_nb_fig4j_replicates_vs_paper
  purpose: reproduction
  computed: fig4j_r22_reps_plotted
  printed: paper_replicates_bivalent
  note: "Live Figures.ipynb Cell 4 + Cell 8 only plot 5 replicates from outputfiles/ (ignoring outputfiles_2/), contradicting Fig. 4J caption's claim of 10 replicates per condition."

- id: cmp_solid_stokes_D_vs_paper
  purpose: reproduction
  computed: solid_D_actual
  printed: paper_crosslinker_diffusion_rate
  note: "CytoSim Solid Stokes-Einstein diffusivity (0.01485 um^2/s at eta=0.5, r=30 nm, kT=0.0042) is 673x smaller than Table S1's claimed 10 um^2/s because Wrist ignores SingleProp::diffusion (wrist.cc:17-83)."

- id: cmp_dimer_keff_vs_nominal_stiffness
  purpose: consistency
  computed: dimer_k_eff_computed
  printed: cym_monomer_dimer_bond_stiffness
  note: "Shows Wrist::setInteractions() (wrist.cc:134) double-counts dimerizer spring stiffness to 10.0 pN/um vs the configured SingleProp::stiffness = 5.0 pN/um (while Wrist::force() still uses 5.0 pN/um)."

