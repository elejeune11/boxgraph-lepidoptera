# Cross-record ModelAtlas relations for walker2025_code (Walker et al., 2025 software/code record)
# against the three 2024 Chandrasekaran et al. records:
#   1. chandrasekaran2024 (Nat. Commun. 15, 3139, 2024)
#   2. chandrasekaran_cytosim (upstream CytoSim C++ engine snapshot)
#   3. chandrasekaran_source_data (41467_2024_46726_MOESM9_ESM.xlsx Source Data workbook)
#
# Non-runnable full 3D CytoSim simulation models (`cytosim_3d_static_crosslinker_sim`,
# `cytosim_3d_dynamic_multimer_sim`) and walker2025-specific CSV/trajectory analysis adapters
# (`icosphere_surface_density_adapter`, `notebook_fig4j_replicates_adapter`,
# `notebook_fig5d_averaging_adapter`, `notebook_fig5d_averaging_last30`,
# `trajectory_multimer_topology_adapter`, `trajectory_vaspprops_bug_adapter`) have no testable
# analytical model relations with the 2024 records.
# Likewise, Hookean confinement (`chandrasekaran_cytosim/cytosim_confinement_sphere_ellipse`) vs
# dimerizer bond tension (`walker2025_code/cytosim_dimerizer_bond_mechanics`) is omitted as a
# physically unrelated single-product Hooke's law form.

# =============================================================================
# 1. Relations with chandrasekaran2024 (12 proposed: 11 verified, 1 honest refutation)
# =============================================================================
- id: rel_chandra2024_stokes_einstein_solid_diffusion
  kind: same_as
  a: walker2025_code/cytosim_solid_stokes_diffusion
  b: chandrasekaran2024/stokes_einstein_diffusion
  mapping:
    kBT: "1000 * kT"
    eta: "eta"
    r: "1000 * r_solid"
  output_map:
    D_SE: D_solid
  regime:
    eta: [0.001, 10.0]
    r_solid: [0.005, 0.1]
    kT: [0.0035, 0.005]
    dt: [0.0005, 0.01]
  provenance: proposed
  reason: >
    CytoSim Solid::setDragCoefficient() in walker2025_code (Source_Code/Cytosim/src/sim/solid.cc:854-943,
    with Wrist::stepF() silently ignoring diffusion = 10.0) yields Stokes-Einstein diffusivity
    D_solid = kT / (6*pi*eta*r_solid), symbolically identical to chandrasekaran2024/stokes_einstein_diffusion
    and confirming the identical 673x discrepancy (0.01485 vs 10 um^2/s at R = 30 nm, eta = 0.5 Pa*s,
    kT = 0.0042 pN*um) across both papers.

- id: rel_chandra2024_brownian_noise_stddev_solid
  kind: same_as
  a: walker2025_code/cytosim_solid_stokes_diffusion
  b: chandrasekaran2024/brownian_noise_stddev
  mapping:
    D: "kT / (6 * pi * eta * r_solid)"
    dt: "dt"
  output_map:
    sigma_B: sigma_B
  regime:
    eta: [0.001, 10.0]
    r_solid: [0.005, 0.1]
    kT: [0.0035, 0.005]
    dt: [0.0005, 0.01]
  provenance: proposed
  reason: >
    The 1D Gaussian Brownian displacement standard deviation sigma_B = sqrt(2 * D_solid * dt) in
    walker2025_code/cytosim_solid_stokes_diffusion is symbolically identical (after um <-> nm conversion)
    to chandrasekaran2024/brownian_noise_stddev evaluated at the Stokes-Einstein diffusivity
    D = kT / (6*pi*eta*r_solid).

- id: rel_chandra2024_brownian_noise_mobility_solid
  kind: same_as
  a: walker2025_code/cytosim_solid_stokes_diffusion
  b: chandrasekaran2024/brownian_noise_from_mobility
  mapping:
