  limit:
    L: "0"
  regime:
    L: [0.05, 5.0]
    segmentation: [0.05, 0.2]
    viscosity: [0.001, 2.0]
    viscosity_water: [0.001, 0.001]
    drag_radius: [0.003, 0.015]
