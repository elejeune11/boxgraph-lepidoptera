    6.02214076e23; evaluating chandrasekaran2024/final_actin_concentration at 1 monomer per particle
    (L_fil / dl = 0.0027 um / 2.7 nm = 1) matches walker2025_code/cytosim_config_derived_quantities/C_crosslinker identically.

