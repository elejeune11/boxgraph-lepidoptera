    Solid::setDragCoefficient() (walker2025_code solid.cc:854-943; chandrasekaran_cytosim
    solid.cc:1289, sphere.cc:280-284) while silently ignoring diffusion on grafted Wrist singles
    (wrist.cc '#if (0)'), yielding symbolically identical D_solid = D_stokes = kT / (6*pi*eta*R).

