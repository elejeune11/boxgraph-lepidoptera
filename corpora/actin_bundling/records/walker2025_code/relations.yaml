  b: chandrasekaran2024/final_actin_concentration
  mapping:
    N_fil: "N_blob"
    L_fil: "0.0027"
    dl: "2.7"
    R_drop: "R_drop"
  output_map:
    C_actin: C_crosslinker
  regime:
    n_steps: [10000.0, 300000.0]
    nb_frames: [100.0, 600.0]
    dt: [0.001, 0.005]
    L0: [0.05, 0.2]
    k_grow: [0.005, 0.02]
    L_max: [5.0, 10.0]
