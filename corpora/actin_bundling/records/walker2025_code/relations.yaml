    walker2025_code/cytosim_solid_stokes_diffusion/sigma_B identically.

- id: rel_chandra2024_bell_unbinding_dimerizer_code
  kind: same_as
  a: walker2025_code/cytosim_dimerizer_bond_mechanics
  b: chandrasekaran2024/bell_slip_bond_unbinding
  mapping:
    k_unbind0: "k_unbind_0"
    f: "2 * k_single * dx"
    f_u: "2 * F_unbind"
  output_map:
    k_unbind: k_unbind_code
  regime:
    k_single: [1.0, 50.0]
    dx: [0.001, 0.1]
    k_bind: [0.001, 10.0]
    k_unbind_0: [0.001, 10.0]
    F_unbind: [2.0, 20.0]
    dt: [0.0005, 0.005]
  provenance: proposed
  reason: >
    Custom C++ Dimerizer::testKramersDetachment() (dimerizer.h:121) implements Bell slip-bond
    unbinding identically to chandrasekaran2024/bell_slip_bond_unbinding, but because
    Wrist::setInteractions() (wrist.cc:131-135) adds two parallel springs (F_mech = 2*k_single*dx)
    while Wrist::force() (wrist.cc:64) supplies only k_single*dx = F_mech/2, expressing the actual
    code rate k_unbind_code in terms of true mechanical bond tension f = F_mech = 2*k_single*dx
    requires a doubled effective unbinding force f_u = 2*F_unbind (20 pN vs nominal 10 pN).

- id: rel_chandra2024_bell_unbinding_dimerizer_Fmech
  kind: same_as
  a: walker2025_code/cytosim_dimerizer_bond_mechanics
  b: chandrasekaran2024/bell_slip_bond_unbinding
  mapping:
    k_unbind0: "k_unbind_0"
    f: "2 * k_single * dx"
    f_u: "F_unbind"
  output_map:
    k_unbind: k_unbind_at_Fmech
  regime:
    k_single: [1.0, 50.0]
    dx: [0.001, 0.1]
    k_bind: [0.001, 10.0]
    k_unbind_0: [0.001, 10.0]
    F_unbind: [2.0, 20.0]
    dt: [0.0005, 0.005]
  provenance: proposed
  reason: >
    The reference rate k_unbind_at_Fmech = k_unbind_0 * exp(F_mech / F_unbind) evaluated at the true
    doubled mechanical tension F_mech = 2*k_single*dx and nominal F_unbind is symbolically identical
    to chandrasekaran2024/bell_slip_bond_unbinding/k_unbind.

- id: rel_chandra2024_bell_unbinding_dimerizer_double_spring_discrepancy
  kind: same_as
  a: walker2025_code/cytosim_dimerizer_bond_mechanics
  b: chandrasekaran2024/bell_slip_bond_unbinding
  mapping:
    k_unbind0: "k_unbind_0"
    f: "2 * k_single * dx"
    f_u: "F_unbind"
  output_map:
    k_unbind: k_unbind_code
  regime:
    k_single: [2.0, 20.0]
    dx: [0.01, 0.1]
    k_bind: [0.001, 10.0]
    k_unbind_0: [0.001, 10.0]
    F_unbind: [5.0, 20.0]
    dt: [0.0005, 0.005]
  provenance: proposed
  reason: >
    Honest refutation testing whether walker2025_code's actual Dimerizer detachment rate k_unbind_code
    equals Bell's slip-bond law evaluated at the true doubled mechanical spring tension F_mech =
    2*k_single*dx and nominal unbinding force F_unbind; refuted everywhere at dx > 0 because
    Wrist::force() omits the second parallel Wrist link added by Wrist::setInteractions() (wrist.cc:64,134),
    making k_unbind_code smaller by exp(-k_single * dx / F_unbind).

- id: rel_chandra2024_icosphere_n_faces
  kind: same_as
