  regime:
    R_drop: [0.5, 5.0]
    n_subdiv: [0.0, 5.0]
    d_mon: [2.0, 5.0]
  provenance: proposed
  reason: >
    Live Analysis_Scripts/icosphere.py::icosphere(n_subdiv, R_drop) in walker2025_code starts from a
    20-face regular icosahedron and recursively bisects each triangle into 4, yielding identical face
    counts N_faces = 20 * 4^n to chandrasekaran2024/icosphere_subdivision_geometry across n = 0..5
    (confirming walker2025_code inherits chandrasekaran2024's icosphere pipeline despite walker2025
    Methods S1 misprinting '8 triangles').

