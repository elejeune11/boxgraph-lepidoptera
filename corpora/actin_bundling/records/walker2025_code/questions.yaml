- id: q_dimerizer_double_counted_stiffness_and_binding
  kind: possible_error
  about: [cytosim_dimerizer_bond_mechanics, cmp_dimer_keff_vs_nominal_stiffness, cym_monomer_dimer_bond_stiffness, cym_dimerizer_binding_distance]
  text: >
    Three undocumented quirks in the custom C++ Dimerizer implementation:
    (1) Double-counted bond stiffness & halved Bell detachment force: in `Simul::setAllInteractions()`
    (simul_solve.cc:238-239), `singles.firstA()` visits BOTH attached dimerizer Wrists, and
    `Wrist::setInteractions()` (wrist.cc:131-135) calls `anchor.addLink(meca, wrist2->mecapoint(), prop->stiffness)`
    for BOTH, creating two parallel 5.0 pN/um springs = effective mechanical stiffness 10.0 pN/um;
    meanwhile `Wrist::force()` (wrist.cc:64) returns `5.0 * d = F_mech / 2` to `Dimerizer::testKramersDetachment()`,
    effectively doubling `F_unbind` from 10 pN to 20 pN relative to true spring tension.
    (2) Pairwise double-attempt binding rate: `SingleSet::step()` calls `PointGrid::tryToAttach()` on every
    free dimerizer Wrist per step using deferred `tmphaHand`, so each unordered pair of in-range monomers
    tests attachment twice per step (`p_pair = 1 - (1 - p_1)^2`, ~2x nominal `k_dimer_form` in DynamicDimer
    and up to 4x in DynamicMultimer), while `testKramersDetachment()` uses `hasbeentossed`/`marktodetach`
    to test unbinding only once per pair.
    (3) Anchor-to-center distance test: `PointGrid::tryToAttach()` (point_grid.cc:127-132) tests
    `|anchor_1 - center_2| < 0.09 um` (distance from surface site at r=30 nm on Solid 1 to center of
    Solid 2), not center-to-center distance `2*R_solid < d < 3*R_solid` as stated in Methods S1 p. 43.
  citation:
    file: Source_Code/Cytosim/src/sim/singles/wrist.cc
    lines: "131-135"
    quote: "anchor.addLink(meca, wrist2->mecapoint(), prop->stiffness);"
    where: "wrist.cc:56-65,127-138; point_grid.cc:81-159; dimerizer.h:86-143"

