    quaternion on line 36 (with misleading comment `# rescale the size to radius of 0.5` on line 33).
    (3) `interpolateallmonomers()` (lines 160-170) loops `range(1, nmonomers-1)` (skipping `mid = nmonomers-1`
    on each segment) and appends both endpoints of every segment, duplicating every interior bead vertex.
    (4) `Main_Analyze_Trajectory.py:192` calls `ic.generatedensityfield(meshvar, unitnormal, filcoord, False, ic.SearchAlgoType.LISTEDSEARCH, Nlists)`
