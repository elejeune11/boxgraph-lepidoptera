- id: q_cytosim_full_3d_not_compiled
  kind: unstated_model
  about: [cytosim_3d_static_crosslinker_sim, cytosim_3d_dynamic_multimer_sim]
  text: >
    The full 3D CytoSim multi-agent simulations (874 `.cym` input files spanning Figs. 4I-K, 5B-D, S5,
    S6, and S7) are marked `runnable: false` because the bundled C++ CytoSim engine in
    `Source_Code/Cytosim/` is not compiled or executed inside BoxGraph (each trajectory runs 300,000 to
    1,200,000 Brownian dynamics steps). Instead, all C++ mechanics (Solid Stokes drag, Wrist no-op
    diffusion, global steric stiffness, and custom Dimerizer double-link/binding kinetics) are audited
    directly from the C++ source and modeled in fast closed-form ports, while all Python analysis and
    plotting pipelines (`icosphere.py`, `Main_Analyze_Trajectory.py`, `Figures.ipynb`) are executed live
    as `software: true` adapters on the bundled code and output CSVs.
