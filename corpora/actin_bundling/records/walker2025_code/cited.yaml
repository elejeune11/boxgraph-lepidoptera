# Cross-record cited-value links for walker2025_code.
# All 52 data.yaml entries with `from_source: walker2025` already declare `from_datum` directly;
# none of walker2025_code/data.yaml declares `from_source` naming chandrasekaran2024 or
# chandrasekaran_source_data.
# The three entries below link walker2025_code's verbatim inherited upstream CytoSim C++ defaults
# (Source_Code/Cytosim/, ref-cytosim -> chandrasekaran_cytosim) to the corresponding defaults in
# chandrasekaran_cytosim so cross-fork agreement is checked automatically.

- datum: cpp_default_kT
  from_source: chandrasekaran_cytosim
  from_datum: cyto_default_kT
  evidence: "Verbatim inherited upstream CytoSim default thermal energy kT = 0.0042 pN*um in Source_Code/Cytosim/src/sim/simul_prop.cc:24 (matching chandrasekaran_cytosim src/sim/simul_prop.cc:28)."

- datum: cpp_default_fiber_drag_radius
  from_source: chandrasekaran_cytosim
  from_datum: cyto_default_drag_radius
  evidence: "Verbatim inherited upstream CytoSim default microtubule fiber hydrodynamic radius drag_radius = 0.0125 um in Source_Code/Cytosim/src/sim/fiber_prop.cc:264 (matching chandrasekaran_cytosim src/sim/fiber_prop.cc:307)."

- datum: cpp_cylinder_drag_const
  from_source: chandrasekaran_cytosim
  from_datum: cyto_tirado_ct_code
  evidence: "Verbatim inherited upstream CytoSim cylinder-drag constant 0.32 in Fiber::dragCoefficientCylinder() at Source_Code/Cytosim/src/sim/fiber.cc:604 (matching chandrasekaran_cytosim src/sim/fiber.cc:988)."
