    lines: "24"
    quote: "kT                = 0.0042;"
  note: "HIDDEN PARAMETER (settles walker2025 q_unstated_temperature): none of the 874 .cym files specify kT, so CytoSim uses its built-in default kT = 0.0042 pN*um = 4.2 pN*nm (~304.2 K)."

- id: cpp_default_fiber_drag_radius
  quantity: particle_radius
  unit: um
  origin: reported
  printed: "0.0125"
  citation:
    file: Source_Code/Cytosim/src/sim/fiber_prop.cc
    lines: "264"
    quote: "drag_radius         = 0.0125;  // radius of a Microtubule"
  note: "HIDDEN PARAMETER: none of the 874 .cym files set fiber:drag_radius, so actin filaments inherit CytoSim's microtubule hydrodynamic radius 12.5 nm (3.57x larger than actin's 3.5 nm steric radius)."

- id: cpp_cylinder_drag_const
  quantity: dimensionless_constant
  unit: dimensionless
  origin: reported
  printed: "0.32"
  citation:
    file: Source_Code/Cytosim/src/sim/fiber.cc
    lines: "604"
