# =============================================================================
# 4. CytoSim C++ physics & .cym config derived quantity runs
# =============================================================================
- id: run_cytosim_solid_stokes_baseline
  model: cytosim_solid_stokes_diffusion
  inputs:
    eta: cym_viscosity_baseline
    r_solid: cym_blob_radius
    kT: cpp_default_kT
    dt: cym_time_step
  outputs:
    D_solid: solid_D_actual
    sigma_B: solid_sigma_B_actual
  note: "Actual CytoSim Solid diffusivity (0.01485 um^2/s) and Brownian step (7.71 nm) at eta=0.5, r=30 nm, kT=0.0042 pN*um (proving Wrist diffusion=10.0 is a no-op)."

- id: run_cytosim_dimerizer_mechanics
  model: cytosim_dimerizer_bond_mechanics
  inputs:
    k_single: cym_monomer_dimer_bond_stiffness
    dx: probe_dimer_extension_added
    k_bind: cym_actin_kbind_ring
    k_unbind_0: probe_dimer_ksplit_ring_added
    F_unbind: cym_dimerizer_unbinding_force
    dt: cym_time_step
  outputs:
    k_eff: dimer_k_eff_computed
    F_mech: dimer_F_mech_computed
    F_bell: dimer_F_bell_computed
    k_unbind_code: dimer_kunbind_code_computed
    k_unbind_at_Fmech: dimer_kunbind_trueF_computed
    p_bind_single: dimer_pbind_single_computed
    p_bind_pair: dimer_pbind_pair_computed
  note: "Evaluates double-counted stiffness k_eff = 10 pN/um vs nominal 5 pN/um, halved Bell force F_bell = F_mech/2, and pairwise double-attempt binding probability."

- id: run_config_derived_bivalent
  model: cytosim_config_derived_quantities
  inputs:
    n_steps: cym_nsteps_baseline
    nb_frames: cym_nb_frames_baseline
    dt: cym_time_step
    L0: cym_filament_init_length
    k_grow: cym_actin_growing_speed
    L_max: cym_actin_max_length
    N_blob: cym_dimer_count_baseline
    r_solid: cym_blob_radius
    R_drop: cym_droplet_radius
    rigidity: cym_actin_rigidity
    kT: cpp_default_kT
  outputs:
    T_sim: cfg_T_sim_baseline
    dt_frame: cfg_dt_frame_baseline
    n_snaps_out: cfg_nsnaps_baseline
    L_final: cfg_L_final_baseline
    C_crosslinker: cfg_C_dimer_baseline
    phi_crosslinker: cfg_phi_dimer_baseline
    L_p: cfg_Lp_actin_cytosim
  note: "Checks 600 s horizon, 6.280 um final length, 0.3964 uM dimer concentration, 2.7% packing fraction, and 17.86 um persistence length from baseline mini-Lpd .cym."

- id: run_config_derived_monomer
  model: cytosim_config_derived_quantities
  inputs:
    n_steps: cym_nsteps_baseline
    nb_frames: cym_nb_frames_baseline
    dt: cym_time_step
    L0: cym_filament_init_length
    k_grow: cym_actin_growing_speed
    L_max: cym_actin_max_length
    N_blob: cym_monomer_count_baseline
    r_solid: cym_blob_radius
    R_drop: cym_droplet_radius
    rigidity: cym_actin_rigidity
    kT: cpp_default_kT
  outputs:
    T_sim: cfg_T_sim_monomer
    dt_frame: cfg_dt_frame_monomer
    n_snaps_out: cfg_nsnaps_monomer
    L_final: cfg_L_final_monomer
    C_crosslinker: cfg_C_monomer_baseline
    phi_crosslinker: cfg_phi_monomer_baseline
    L_p: cfg_Lp_monomer_cytosim
  note: "Checks 0.7929 uM monomer concentration from DynamicDimer/DynamicMultimer new 2000 blob."

- id: run_config_derived_high_visc
  model: cytosim_config_derived_quantities
  inputs:
    n_steps: cym_nsteps_high_visc
    nb_frames: cym_nb_frames_high_visc
    dt: cym_time_step
    L0: cym_filament_init_length
    k_grow: cym_actin_growing_speed
    L_max: cym_actin_max_length
    N_blob: cym_dimer_count_baseline
    r_solid: cym_blob_radius
    R_drop: cym_droplet_radius
    rigidity: cym_actin_rigidity
    kT: cpp_default_kT
  outputs:
    T_sim: cfg_T_sim_high_visc
    dt_frame: cfg_dt_frame_high_visc
    n_snaps_out: cfg_nsnaps_high_visc
    L_final: cfg_L_final_high_visc
    C_crosslinker: cfg_C_high_visc
    phi_crosslinker: cfg_phi_high_visc
    L_p: cfg_Lp_high_visc
  note: "Checks Figure_S5B extended run: 1,200,000 * 0.002 = 2,400 s and filament length capped at max_length = 6.2832 um."

- id: run_config_vol_frac_sweep
  model: cytosim_config_derived_quantities
  inputs:
    n_steps: cym_nsteps_baseline
    nb_frames: cym_nb_frames_baseline
    dt: cym_time_step
    L0: cym_filament_init_length
    k_grow: cym_actin_growing_speed
    L_max: cym_actin_max_length
    r_solid: cym_blob_radius
    R_drop: cym_droplet_radius
    rigidity: cym_actin_rigidity
    kT: cpp_default_kT
  sweep:
    N_blob: paper_vol_frac_table
  outputs:
    T_sim: cfg_vf_T_sim
    dt_frame: cfg_vf_dt_frame
    n_snaps_out: cfg_vf_nsnaps
    L_final: cfg_vf_L_final
    C_crosslinker: cfg_vf_C_curve
    phi_crosslinker: cfg_vf_phi_curve
    L_p: cfg_vf_Lp
  note: "Sweeps N_blob in {1000, 20000} against walker2025 Fig. S5C-E volume fraction endpoints (2.7% and 54%)."
