# =============================================================================
# 1. Live Python adapter runs: Analysis_Scripts/icosphere.py
# =============================================================================
- id: run_icosphere_code_f4
  model: icosphere_mesh_adapter
  inputs:
    R_drop: ico_radius_code
    n_subdiv: ico_subdiv_code
    d_mon: ico_monomer_rise_code
  outputs:
    n_faces: ico_f4_n_faces
    n_vertices: ico_f4_n_vertices
    median_edge: ico_f4_median_edge
    eq_side: ico_f4_eq_side
    n_monomers: ico_f4_n_monomers
  note: "Live icosphere.icosphere(4, 1.0) matching Main_Analyze_Trajectory.py:711-713 (5,120 faces, 27.9 monomers at 2.7 nm spacing)."

- id: run_icosphere_paper_n3
  model: icosphere_mesh_adapter
  inputs:
    R_drop: ico_radius_code
    n_subdiv: paper_icosphere_subdiv
    d_mon: ico_monomer_rise_code
  outputs:
    n_faces: ico_n3_n_faces
    n_vertices: ico_n3_n_vertices
    median_edge: ico_n3_median_edge
    eq_side: ico_n3_eq_side
    n_monomers: ico_n3_n_monomers
  note: "Live icosphere.icosphere(3, 1.0) at Methods S1 p. 43's printed subdivision depth 3 (1,280 faces, 55.6 monomers)."

- id: run_icosphere_surface_shell
  model: icosphere_surface_density_adapter
  inputs:
    R_drop: ico_radius_code
    n_subdiv: ico_subdiv_code
    r_fil: probe_radius_surface_added
    L_fil: probe_filament_length_added
    L_seg: cym_actin_segmentation
  outputs:
    shell_thickness: ico_shell_thickness_computed
    interpolated_monomers: ico_surf_interp_monomers
    occupied_triangles: ico_surf_occupied_tris
    frac_occupied: ico_surf_frac_occupied
  note: "Live icosphere.py surface occupancy on a 5-segment (0.5 um) test arc at r = 0.95 um (inside 100 nm shell)."

- id: run_icosphere_interior_cutoff
  model: icosphere_surface_density_adapter
  inputs:
    R_drop: ico_radius_code
    n_subdiv: ico_subdiv_code
    r_fil: probe_radius_interior_added
    L_fil: probe_filament_length_added
    L_seg: cym_actin_segmentation
  outputs:
    shell_thickness: ico_int_shell_thickness
    interpolated_monomers: ico_int_interp_monomers
    occupied_triangles: ico_int_occupied_tris
    frac_occupied: ico_int_frac_occupied
  note: "Live icosphere.py radial shell cutoff verification at r = 0.85 um (outside r >= 0.9 um shell -> 0 occupied triangles)."

# =============================================================================
# 2. Live Python adapter runs: Analysis_Scripts/Main_Analyze_Trajectory.py
# =============================================================================
- id: run_multimer_topology_check
  model: trajectory_multimer_topology_adapter
  inputs:
    chain_len: probe_chain_len_added
    ring_len: probe_ring_len_added
    n_doubles: probe_n_doubles_added
  outputs:
    chains_found: topo_chains_found
    rings_found: topo_rings_found
    doubles_found: topo_doubles_found
    total_multimer_monomers: topo_total_monomers
  note: "Live verification of Main_Analyze_Trajectory.find_chains_rings_and_doubles() on synthetic 4-mer chain + 3-mer ring + 2 double-bonded dimers."

- id: run_vaspprops_bug_audit
  model: trajectory_vaspprops_bug_adapter
  inputs:
    n_crosslinkers: probe_vaspprops_ncross_added
  settings:
    n_snaps: 20
  outputs:
    mean_nfpc_2_fil: vaspprops_bug_nfpc_2
    mean_nfpc_4_fil: vaspprops_bug_nfpc_4
    frac_misclassified_to_4fil: vaspprops_bug_frac_4fil
  note: "Live execution of shipped Main_Analyze_Trajectory.getvaspprops() on 100 2-filament crosslinkers, proving 0 are counted in 2-fil and all 100 are misclassified into 4-fil via enumerate(unique)."

