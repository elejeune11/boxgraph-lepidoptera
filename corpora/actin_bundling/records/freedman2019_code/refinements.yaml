- id: ref_kmc_trials
  run: run_kmc_figs3a_refine_base
  setting: num_trials
  factors: [1, 2, 4]
  mode: multiply
  output: effective_barrier
  tolerance: "3%"
  tolerance_basis: "added: Monte Carlo standard error across 100-400 KMC trials at epsilon ~= 4.1 is ~0.04-0.08 (~1-2%), well within Fig. S3A's 1-decimal printed precision (~1.2% half-ULP)."
  tolerance_added: true

- id: ref_bundle_dt
  run: run_bundle_port_short_relax
  setting: dt_scale
  factors: [1, 2, 4]
  mode: divide
  output: final_alignment
  tolerance: "1%"
  tolerance_basis: "added: verifies overdamped Leimkuhler-Matthews step convergence of filament alignment cos(theta) well below the 0.8 bundle-classification threshold."
  tolerance_added: true
