# ==============================================================================
# 4. AFINES C++ excluded volume, filament mechanics, spacer mechanics/MC, & Mathematica processing runs
# ==============================================================================
- id: run_exv_fig2d
  model: afines_excluded_volume_cpp
  inputs:
    kexv: plots_kexv_fig2d
    rmax: cfg_rmax
    sep_parallel: probe_exv_sep_half_rmax
    link_length: cfg_link_length
  settings: {}
  outputs:
    U_parallel: exv_U_par
    F_parallel_code: exv_F_par_code
    F_parallel_analytic_neg_grad: exv_F_par_analytic
    F_crossing_midpoint_code: exv_F_cross_mid
    F_crossing_near_end_total_code: exv_F_cross_end
  note: "Verifies exact -grad U consistency for kexv=0.08 pN*um and exposes the midpoint crossing zero-force bug and near-end 45-degree doubled-force bug."

- id: run_filament_mech_default
  model: afines_filament_mechanics_cpp
  inputs:
    kl: cfg_link_stretching_stiffness
    l0: cfg_link_length
    llen: probe_filament_stretch_len
    polymer_bending_modulus: cfg_polymer_bending_modulus
    bend_angle: probe_filament_bend_angle
    max_small_angle: cpp_max_small_angle
    temperature: cfg_temperature_kBT
    viscosity: cfg_viscosity
    actin_length: cfg_actin_length_radius
    dt: cfg_dt
  settings: {}
  outputs:
    U_stretch: fil_U_stretch
    F_stretch: fil_F_stretch
    U_bend: fil_U_bend
    F_bend_end_bead: fil_F_bend_end
    F_bend_net_residual: fil_F_bend_net_res
    D_bead_lm: fil_D_bead_lm
  note: "Verifies Hookean stretching, LAMMPS bending force conservation, and Leimkuhler-Matthews diffusion equivalence D = kT / (6*pi*vis*rad)."

- id: run_spacer_mc_short_bug
  model: afines_spacer_mechanics_and_mc_cpp
  inputs:
    mld: cfg_spacer1_length
    mk: cfg_spacer1_stiffness
    s_bend: cfg_s1_bend
    th0: cpp_s1_ang_default
    link_length: cfg_link_length
    head_sep_y: probe_spacer_head_sep_y
    tilt_dx: probe_spacer_tilt_dx
    pre_bind_dy: probe_spacer_pre_bind_dy
    pos_a_end: probe_spacer_pos_a_end
    stale_b_eng: probe_spacer_stale_b_eng
    kon: cfg_s1_kon
    dt: cfg_dt
    temperature: cfg_temperature_kBT
  settings: {}
  outputs:
    kb_eff: spacer_short_kb_eff
    U_bend_both_heads: spacer_short_U_bend_both
    F_total_residual: spacer_short_F_res
    delE_code_buggy: spacer_short_delE_buggy
    delE_true_physical: spacer_short_delE_true
    delE_discrepancy: spacer_short_delE_diff
    prob_attach_code_buggy: spacer_short_prob_buggy
    prob_attach_true_physical: spacer_short_prob_true
  note: "Verifies doubly-bound spacer force balance and quantifies the stale-position/single-head/unreset-b_eng bugs in src/spacer.cpp:220-224,355-378."

- id: run_lattice_domain_proc
  model: afines_lattice_and_domain_processing
  inputs:
    l0: proc_lattice_l0
    lmax: kmc_max_filament_length
    nc: proc_domain_nc
    rc: proc_domain_rc
  settings: {}
  outputs:
    min_domain_length: proc_min_dom_len
    merged_short_domain_length: proc_merged_len
    unmerged_long_domain_length: proc_unmerged_len
    tied_bin_label: proc_tied_label
