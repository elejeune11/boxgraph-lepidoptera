  note: "Verifies Mathematica afines2lattice.m (37 nm bins -> 405 sites, ties -> 0) and LatticeDomainMerge (nc=4, rc=1 um, span = x_last - x_first)."

# ==============================================================================
# 5. Integrated mini-trajectory AFINES bundle port run
# ==============================================================================
- id: run_bundle_port_short_relax
  model: afines_two_filament_bundle_port
  inputs:
    link_length: cfg_link_length
    link_stretching_stiffness: cfg_link_stretching_stiffness
    polymer_bending_modulus: cfg_polymer_bending_modulus
    actin_length: cfg_actin_length_radius
    spacer_length: cfg_spacer1_length
    spacer_stiffness: cfg_spacer1_stiffness
    spacer_bend: cfg_s1_bend
    kexv: plots_kexv_fig2d
    rmax: cfg_rmax
    temperature: cfg_temperature_kBT
    viscosity: cfg_viscosity
    dt: cfg_dt
    nfixed: readme_nfixed
  settings:
    seed: 1
    t_sim_s: 0.01
    n_links: 3
    dt_scale: 1.0
  replicates: 1
  outputs:
    final_alignment: bundle_port_alignment
    final_mean_separation: bundle_port_mean_sep
    final_total_pe: bundle_port_total_pe
  note: "Short-horizon (0.01 s = 500 steps at dt=2e-5 s) integrated 2-filament bundle relaxation with 9 seed spacers, LAMMPS bending, and excluded volume."
