# ==============================================================================
# 1. Live kmc.ipynb runs (software: true)
# ==============================================================================
- id: run_kmc_code_params_fig3b
  model: kmc_notebook_bending_and_switching
  inputs:
    site_width: kmc_site_width
    l_long: kmc_alpha_actinin_len
    l_short: kmc_fascin_len
    Lp: kmc_Lp
    x_sites: kmc_n_binding_sites_fig3b
    max_filament_length: kmc_max_filament_length
  settings: {}
  outputs:
    dxl: kmc_code_dxl_out
    max_n_sites: kmc_code_max_n_sites_out
    gap_distance: kmc_code_gap20_out
    U_kBT: kmc_code_U20_out
    p_switch: kmc_code_pswitch20_out
  note: "Live kmc.ipynb Cell 2-4 evaluation at the code's actual transposed parameters (site_width=35 nm, dxl=37-8=29 nm)."

- id: run_kmc_figs3a_code_exact
  model: kmc_notebook_growing_bundle
  inputs:
    site_width: kmc_site_width
    dxl: kmc_dxl_code
    max_filament_length: kmc_max_filament_length
    extension_rate: kmc_figs3a_extension_rate
    kon2: kmc_figs3a_kon
    kratio: probe_kratio_one
    Lp: kmc_Lp
  settings:
    seed: 1
    num_trials: 1000
    max_extensions: 200
    warmup_trial: true
  replicates: 1
  outputs:
    switching_ratio: kmc_figs3a_code_ratio
    effective_barrier: kmc_figs3a_code_eps
    mean_domain_length_A: kmc_figs3a_code_dl_A
    mean_domain_length_B: kmc_figs3a_code_dl_B
    max_n_sites: kmc_figs3a_code_nsites
  note: "Exact seeded reproduction of kmc.ipynb Cell 5 (1 warmup trial) + Cell 6 (1000 trials, seed=1) with code parameters site_width=35 nm, dxl=29 nm."

- id: run_kmc_figs3a_paper_params
  model: kmc_notebook_growing_bundle
  inputs:
    site_width: paper_binding_site_spacing_lb
    dxl: paper_delta_l_xl_physiological
    max_filament_length: kmc_max_filament_length
    extension_rate: kmc_figs3a_extension_rate
    kon2: kmc_figs3a_kon
    kratio: probe_kratio_one
    Lp: kmc_Lp
  settings:
    seed: 1
    num_trials: 1000
    max_extensions: 200
    warmup_trial: true
  replicates: 1
  outputs:
    switching_ratio: kmc_figs3a_paper_ratio
    effective_barrier: kmc_figs3a_paper_eps
    mean_domain_length_A: kmc_figs3a_paper_dl_A
    mean_domain_length_B: kmc_figs3a_paper_dl_B
    max_n_sites: kmc_figs3a_paper_nsites
  note: "Live kmc.ipynb run at the companion paper's stated parameters (l_b=37 nm, Delta l_xl=27 nm), quantifying the 39% switching-ratio discrepancy caused by the Cell 2 35/37 transposition."

- id: run_kmc_cell9_kratio_sweep
  model: kmc_notebook_growing_bundle
  inputs:
    site_width: kmc_site_width
    dxl: kmc_dxl_code
    max_filament_length: kmc_max_filament_length
    extension_rate: kmc_figs3a_extension_rate
    kon2: kmc_figs3a_kon
    Lp: kmc_Lp
  sweep:
    kratio: kmc_cell9_eps_table
  settings:
    seed: 10
    num_trials: 150
    max_extensions: 200
    warmup_trial: false
  replicates: 3
  outputs:
    switching_ratio: kmc_cell9_ratio_pred
    effective_barrier: kmc_cell9_eps_pred
    mean_domain_length_A: kmc_cell9_dl_A_pred
    mean_domain_length_B: kmc_cell9_dl_B_pred
    max_n_sites: kmc_cell9_nsites_pred
  note: "Reduced-trial sweep (150 trials x 3 replicates vs 1000 trials in Cell 9) across kratio in {0.3, 0.5, 1.0, 1.5, 2.0, 2.5} to validate Cell 9 stdout table within runtime budget."

- id: run_kmc_figs3a_refine_base
  model: kmc_notebook_growing_bundle
  inputs:
    site_width: kmc_site_width
    dxl: kmc_dxl_code
    max_filament_length: kmc_max_filament_length
    extension_rate: kmc_figs3a_extension_rate
    kon2: kmc_figs3a_kon
    kratio: probe_kratio_one
    Lp: kmc_Lp
  settings:
    seed: 101
    num_trials: 100
    max_extensions: 200
    warmup_trial: false
  replicates: 1
  outputs:
    switching_ratio: kmc_refine_ratio
    effective_barrier: kmc_refine_eps
    mean_domain_length_A: kmc_refine_dl_A
    mean_domain_length_B: kmc_refine_dl_B
    max_n_sites: kmc_refine_nsites
  note: "Base run for num_trials refinement (100 -> 200 -> 400 trials) verifying statistical convergence of kmc_notebook_growing_bundle."

