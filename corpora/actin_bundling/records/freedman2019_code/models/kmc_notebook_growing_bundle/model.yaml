id: kmc_notebook_growing_bundle
name: live kmc.ipynb adapter for extension_population_ratio() growing-bundle 1D KMC (Fig. 3C, Fig. S3)
role: model
software: true
stated:
  file: xlink_sorting_paper/kmc.ipynb
  lines: "318-436"
  quote: "def extension_population_ratio(num_trials=1,max_filament_length=15000,extension_rate=10, kon1=0.1,kon2=0.1,"
  where: "Cell 5 (rates, extension_population_ratio) and Cell 6 (Fig. S3A)"
equation: "swap_ratio = mean_i(n_swap_i / n_keep_i); epsilon = -ln(swap_ratio); Gillespie KMC over barbed-end site addition (extension_rate / site_width) and binding at sites 1..n_sites_away"
inputs:
  site_width: {quantity: binding_site_spacing, unit: nm}
  dxl: {quantity: crosslinker_length_difference, unit: nm}
  max_filament_length: {quantity: filament_length, unit: nm}
  extension_rate: {quantity: polymerization_rate, unit: nm/s}
  kon2: {quantity: binding_rate_per_site, unit: 1/s}
  kratio: {quantity: concentration_ratio, unit: dimensionless}
  Lp: {quantity: filament_persistence_length, unit: um}
outputs:
  switching_ratio: {quantity: switching_rate_ratio, unit: dimensionless}
  effective_barrier: {quantity: switching_barrier_thermal, unit: dimensionless}
  mean_domain_length_A: {quantity: domain_length, unit: um}
  mean_domain_length_B: {quantity: domain_length, unit: um}
  max_n_sites: {quantity: lattice_site_count, unit: dimensionless}
settings:
  seed: 1
  num_trials: 1000
  max_extensions: 200
  warmup_trial: false
stochastic: true
