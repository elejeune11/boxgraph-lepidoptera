id: afines_lattice_and_domain_processing
name: Mathematica post-processing port (afines2lattice.m binning, LatticeDomainMerge, and plots.nb domain-length span)
role: processing
stated:
  file: xlink_sorting_paper/process/cytomod_functions.m
  lines: "867-914"
  quote: "LatticeDomainMerge[dompos_,nc_,rc_]:=Module[{},"
  where: "afines2lattice.m:48-51,60-64; domain_length.m:26-30; cytomod_functions.m:858-914; plots.nb:820-847"
equation: "lattice[i] = Sign[bcs1[i] - bcs2[i]] /. {-1 -> 2} (ties -> 0); iteratively merge empty gaps < rc flanked by identical species and erase contiguous runs < nc; domain length = x_last - x_first"
inputs:
  l0: {quantity: binding_site_spacing, unit: um}
  lmax: {quantity: filament_length, unit: um}
  nc: {quantity: domain_min_crosslinkers, unit: dimensionless}
  rc: {quantity: domain_max_gap, unit: um}
outputs:
  min_domain_length: {quantity: domain_length, unit: um}
  merged_short_domain_length: {quantity: domain_length, unit: um}
  unmerged_long_domain_length: {quantity: domain_length, unit: um}
  tied_bin_label: {quantity: lattice_site_count, unit: dimensionless}
  n_bins_total: {quantity: lattice_site_count, unit: dimensionless}
settings: {}
stochastic: false
