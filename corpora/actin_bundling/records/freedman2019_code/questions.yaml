  text: >
    Several active numerical and physical parameters in the released code are omitted from or disagree
    with freedman2019: (1) Stokes radius R in mu = 1/(6*pi*R*nu) (omitted in Table S1) is actin_length
    = 0.5 um for filament beads (src/bead.cpp:23-25) and mld (0.2 um short vs 0.3 um long, giving
    1.5x faster short cross-linker diffusion!) for spacer heads (src/spacer.cpp:55,151); (2) cross-linker
    binding capture cutoff is hardcoded as s1_cut = s2_cut = 0.063 um (prog/bundles.cpp:120,133);
    (3) grow.cfg:3 and nogrow.cfg:3 set grid_factor = 3 um^-1 whereas Table S1 prints g = 2.5 um^-1;
    (4) quad_update_period = 10 timesteps (grow.cfg:4); (5) maxSmallAngle = 0.001 rad sine clamp
    (include/globals.h:58); (6) kmc.ipynb sets np.random.seed(1) and max_extensions = 200; (7) plots.nb
    reveals equilibrium lattice MC sampled t = 9000..10000 (lines 4716-4729), plotted Delta l_xl = 0
    at x = 10 nm on the Fig. 2C log axis (lines 4324, 4700), and omitted Delta l_xl = 0.3 um from the
    lattice sweep ("forgot to do 0.3 for lattice -- FIX", lines 4688-4690).
  citation:
    file: prog/bundles.cpp
    lines: "120-133"
    quote: "(\"s1_cut\", po::value<double>(&s1_cut)->default_value(0.063),\"cutoff distance for binding (um)\")"

