  text: >
    src/filament.cpp:676 implements `if ( lb + dL < l0_max )` (splitting at >= 2*l_a rather than the
    strict > 2*l_a printed in freedman2019 SI Section A below Eq. 2), resetting both split links to
    spring_l0 = 1.0 um. For exact divisors lgrow in {0.01, 0.02, 0.04, 0.05, 0.10} um, zero overshoot
    is discarded and realized contour velocity equals kgrow * lgrow exactly. However, for non-divisors
    lgrow = 0.03 and 0.07 um in the Fig. 5C-E sweep, filament::grow() still discards 0.02 and 0.05 um
    per split (34 steps -> 29.41 nm/s, -2.0%; 15 steps -> 66.67 nm/s, -4.8%), and binary IEEE-754 double
    accumulation causes 1.0 + 400*0.0025 = 1.9999999999999998 < 2.0 to take 401 steps at 0.0025 um
    (2.4938 nm/s) and 201 steps at 0.005 um (4.9751 nm/s). Separately, commit 0c6c349 ("updated default
    l0max") updated prog/network.cpp:189 to default_value(2) but left prog/bundles.cpp:178 at
    default_value(0) (harmless when using grow.cfg/nogrow.cfg, which set l0max=2 explicitly).
  citation:
    file: src/filament.cpp
    lines: "673-707"
    quote: "if ( lb + dL < l0_max ){"

