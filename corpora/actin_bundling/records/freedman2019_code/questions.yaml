- id: q_spacer_metropolis_and_s2koff_bugs
  kind: possible_error
  about:
    - cfg_s2_koff
    - afines_spacer_mechanics_and_mc_cpp
    - run_spacer_mc_short_bug
    - cmp_spacer_delE_bug_vs_true
  text: >
    Four C++ implementation bugs affect cross-linker kinetics in prog/bundles.cpp and src/spacer.cpp:
    (1) prog/bundles.cpp:372,376 passes `s2_kend, s2_kend` instead of `s2_koff, s2_kend` to the long
    cross-linker spacer_ensemble constructor, silently ignoring s2_koff whenever s2_koff != s2_kend
    (benign only in grow.cfg/nogrow.cfg because both equal 0.05/s); (2) when attaching the second head,
    spacer::metropolis_prob() (src/spacer.cpp:355-374) evaluates delr1 and delr2 using pre-attachment
    (hx[hd], hy[hd]), old disp, and stale pos_a_end[hd]=0 rather than candidate position newpos;
    (3) metropolis_prob() adds bend_eng for only ONE head upon entering state (1,1), ignoring the new
    bending energy simultaneously activated at the partner head pr(hd) in spacer::update_force():216-219;
    (4) spacer::update_force() lines 220-224 reset b_force to zero when not doubly bound but NEVER
    reset b_eng to zero, so stale b_eng[hd] from a prior doubly-bound state is subtracted from delE on
    line 377 (breaking detailed balance).
  citation:
    file: src/spacer.cpp
    lines: "355-378"
    quote: "double delE = 0.5*mk*stretch*stretch + bend_eng - this->get_stretching_energy() - b_eng[hd];"

- id: q_hidden_afines_parameters_and_grid_mismatch
