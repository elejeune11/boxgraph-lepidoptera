    - run_bundle_port_short_relax
    - ref_kmc_trials
    - ref_bundle_dt
  text: >
    To keep full BoxGraph validation fast (under ~2 minutes), two reduced-budget choices were made:
    (1) run_kmc_cell9_kratio_sweep executes live kmc.ipynb with num_trials = 150 x 3 replicates
    (vs 1000 trials in Cell 9) and ref_kmc_trials refines 100 -> 200 -> 400 trials; (2) the integrated
    C++ port run_bundle_port_short_relax simulates a 3-link 2-filament bundle with static seed spacers
    for t_sim_s = 0.01 s (500 steps at dt = 2e-5 s) rather than 2000 s (10^8 steps). Exact 1000-trial
    reproduction IS run at full budget for Fig. S3A (run_kmc_figs3a_code_exact and
    run_kmc_figs3a_paper_params).
  citation:
