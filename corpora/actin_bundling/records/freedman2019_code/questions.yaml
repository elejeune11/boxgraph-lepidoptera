- id: q_kmc_35_37_transposition_explains_figs3a
  kind: possible_error
  about:
    - kmc_site_width
    - kmc_alpha_actinin_len
    - kmc_dxl_code
    - kmc_max_n_sites_printed
    - kmc_notebook_bending_and_switching
    - kmc_notebook_growing_bundle
    - cmp_kmc_figs3a_ratio_code
    - cmp_kmc_figs3a_eps_code
    - cmp_kmc_figs3a_ratio_paper_params
    - cmp_kmc_figs3a_eps_paper_params
    - cmp_kmc_dxl_code_vs_paper
    - cmp_kmc_nsites_code_vs_paper
  text: >
    In xlink_sorting_paper/kmc.ipynb Cell 2 (lines 98-100), the notebook transposes the 35 nm
    alpha-actinin size and the 37 nm F-actin helical half-pitch: it sets site_width = 35. (instead
    of l_b = 37 nm, giving 428 sites instead of 405 for a 15 um bundle) and dxl = 37.-8. = 29 nm
    (instead of Delta l_xl = 35 - 8 = 27 nm). Because U(x) scales as L_p * dxl^2 / site_width^3,
    this swap inflates the bending barrier by ~36% at every site. Running the released kmc.ipynb
    function with its own (35 nm, 29 nm) and seed=1 reproduces Fig. S3A's printed inset values to
    the exact digit (N_diff/N_same = 0.01647 -> 0.016, epsilon = 4.106 -> 4.1), whereas running
    the exact same code with the paper's stated (37 nm, 27 nm) gives 0.0226 and 3.79 (+41% higher),
    completely resolving freedman2019's Fig. S3A KMC discrepancy. Three additional notebook defects
    were found: (1) Cells 9-12 (lines 797, 869, 910, 942, 950) pass std_domain_lengths[0] /
    std_domain_lengths_mu[0] (fascin error bars) for BOTH fascin and alpha-actinin errorbar calls;
    (2) Cell 5 measures domain lengths from instantaneous filament tip length (filament_length) at
    swap times rather than bound cross-linker site position (current_site * site_width); (3) Cell 10
    line 876 packages Cell 9's avg_domain_lengths instead of avg_domain_lengths_mu.
  citation:
    file: xlink_sorting_paper/kmc.ipynb
    lines: "98-100"
    quote: "site_width = 35."

- id: q_kexv_units_and_crossing_bugs
  kind: possible_error
  about:
    - plots_kexv_fig2d
    - cfg_kexv_zero
    - afines_excluded_volume_cpp
    - run_exv_fig2d
    - cmp_exv_force_exact_grad
  text: >
    src/filament_ensemble.cpp:571-715 resolves the dimensional error in freedman2019 SI Eq. (3) and
    Table S1 (which print k_exv = 0.08 pN*um^2): line 673 evaluates pe_exv += kexv * (1 - r/rmax)^2
    and lines 668-671 evaluate Fx1 = 2*kexv*dist[0]*(1/rmax)*(1/r - 1/rmax) (exact -grad U), proving
    kexv in C++ has energy units pN*um (0.08 pN*um = 20 k_B T at temperature = 0.004 pN*um). Three
    further discrepancies/bugs exist in the excluded-volume implementation and configs: (1) both
    grow.cfg:37 and nogrow.cfg:37 set kexv=0 and xlink_sorting_paper/README.md omits --kexv 0.08 in
    its Fig. 2D commands, even though plots.nb:8457,8460 proves Fig. 2D ran with kexv=0.08; (2) the
    outer guard `if (r < rmax)` (line 618) checks only the minimum endpoint-to-segment distance r_c,
    so two 1-um links crossing near their midpoints (r = 0.5 um > rmax = 0.05 um) skip the entire
    block and experience ZERO excluded-volume force; (3) when crossing links satisfy r < rmax, lines
    700-713 apply a hardcoded +45-degree force Fx1 = Fy1 = 2*kexv/(rmax*sqrt(2)) to BOTH endpoints
    of link 1 and (-Fx1, -Fy1) to BOTH endpoints of link 2, ignoring segment orientation and doubling
    the total force magnitude to 4*kexv/rmax (6.4 pN at kexv=0.08, rmax=0.05).
  citation:
    file: src/filament_ensemble.cpp
    lines: "668-714"
    quote: "pe_exv += kexv*pow((1-r*b),2);"

- id: q_spacer_bending_division_and_calibration_mismatch
  kind: possible_error
  about:
    - cfg_s1_bend
    - cfg_s2_bend
    - readme_kb0
    - plots_s2kb_fig5
    - afines_parameter_mapping
    - cmp_kb_short_eff_vs_table_s1
    - cmp_kb_ratio_grow_cfg_eff_vs_si
    - cmp_sbend_ratio_grow_cfg_raw_vs_si
  text: >
    src/motor_ensemble.cpp:313-317 (spacer_ensemble::set_bending) divides the input parameter by the
    spacer rest length: `double kb = modulus/mld;`. Consequently, grow.cfg/nogrow.cfg's s1_bend = 0.005
    (with spacer1_length = 0.2 um) produces an actual angular stiffness kb_short = 0.025 pN*um in
    U_xl^bend = 0.5*kb*(alpha - pi/2)^2 — 5x larger than freedman2019 Table S1's printed 0.005 pN*um.
    Furthermore, four mutually inconsistent long cross-linker bending prescriptions appear across the
    paper and released files, leaving freedman2019 SI Section A's undefined (200, 300) nm gap (including
    227 nm) unresolved: (1) SI Section A prints kappa_long^B/kappa_short^B = 22*l_long/l_short - 21 for
    l_long <= 200 nm and 4 for l_long >= 300 nm; (2) grow.cfg/nogrow.cfg set s2_bend = 0.06 at l_long =
    0.3 um, giving raw s2_bend/s1_bend = 12 (matching 22*(300/200) - 21 = 12!) and effective kb_long /
    kb_short = (0.06/0.3)/(0.005/0.2) = 8; (3) xlink_sorting_paper/README.md:40,102 (Fig. 2C) sets
    kb2 = 0.04 * l2 (yielding constant effective kb_long = 0.04 pN*um, ratio 1.6, via invalid flag
    --s2bend); (4) plots.nb:14229 (Fig. 5C, 5E, S5, Movies S6-S7) loads job directories labeled
    _s2kb0.0675_ (0.0675/0.3 = 0.225 pN*um, effective ratio 9.0, raw ratio 13.5).
  citation:
    file: src/motor_ensemble.cpp
    lines: "313-317"
    quote: "double kb  = modulus/mld;"

- id: q_barbed_end_split_condition_and_overshoot
