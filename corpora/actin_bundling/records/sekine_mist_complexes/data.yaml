# Quantitative numeric counts reported in Supplementary Data 2 (MOESM5_ESM.xlsx).
# All 659 rows of A4:D662 are categorical gene-complex memberships (column C holds
# NCBI Entrez Gene IDs, which are database identifiers rather than numeric measurements).
# Cells H4 and H5 in the side summary table (G3:H5) are the only quantitative counts
# present in the workbook.

- id: myofibril_assembly_gene_count
  quantity: complex_gene_count
  unit: dimensionless
  origin: reported
  printed: "27"
  citation:
    sheet: "SupplemetaryData1"
    cells: "H4"
    where: "Prominent Complex Name summary table (G4='myofibril assembly', H4='Number of included genes')"
  note: >
    Static integer in H4 matching the 27 unique genes listed under Complex ID
    FC1047 ('myofibril assembly') in rows A6:D32, including alpha-actinin
    (Actn, row 26) and RNAi screen-positive wupA (row 23).

- id: protein_folding_gene_count
  quantity: complex_gene_count
  unit: dimensionless
  origin: reported
  printed: "30"
  citation:
    sheet: "SupplemetaryData1"
    cells: "H5"
    where: "Prominent Complex Name summary table (G5='protein folding', H5='Number of included genes')"
  note: >
    Static integer in H5 matching the 30 unique genes listed under Complex ID
    FC1280 ('protein folding') in rows A78:D107 (including cytoskeletal genes
    Fim, chic, flr, Moe, Eb1). A second distinct complex also named 'protein
    folding' (FC2520, rows A398:D399: Stip1, Hsp83) shares Stip1 and adds
    Hsp83 (31 unique genes across both IDs).
