notes: >
  Supplementary Data 2 (MOESM5_ESM.xlsx) released with Sekine et al., Nature
  Communications 15, 464 (2024) (sekine2024; CC-BY-4.0 license verified on
  sekine2024 PDF p. 13). Workbook metadata (docProps/core.xml, app.xml):
  created by Sayaka Sekine in Microsoft Macintosh Excel (created 2023-02-03,
  last modified 2023-12-13).

  Sheets and layout:
  The workbook contains a single worksheet named `SupplemetaryData1` (dimension
  A2:H662; no hidden sheets, rows, or columns; no formulas). The tab name has
  both a spelling typo ("Supplemetary") and an index mismatch ("Data1"), whereas
  cell A2 states "SupplementaryData2. List of protein complexes identified in
  the protein network constructed by MIST " and sekine2024 (PDF pp. 3, 37)
  identifies this file as Supplementary Data 2. Row 1 is blank; row 3 holds
  headers for two side-by-side tables separated by blank columns E and F:
  (1) Main membership table (A3:D662; 659 gene-complex rows in A4:D662, zero
      duplicate rows, arranged in contiguous blocks sorted lexicographically
      by Complex ID):
      - Column A ("Complex ID"): 213 unique COMPLEAT complex IDs (FC1036 through
        FC959), each stored with a trailing space (all 659 cells) and an external
        hyperlink to http://www.flyrnai.org/compleat/Details?requestType=browse&id=<ID>
        (all 659 hyperlinks verified exact).
      - Column B ("Complex Name"): 200 unique complex/pathway names across the
        213 IDs. Six names occur under multiple Complex IDs: "putative complex
        without known function" (9 IDs: FC1251, FC1342, FC2218, FC239, FC2873,
        FC538, FC653, FC711, FC739), "protein folding" (FC1280, FC2520), "NuA4"
        (FC170, FC844), "TLE1 corepressor complex (MASH1 promoter-corepressor
        complex)" (FC1079, FC1752), "heat shock-mediated polytene chromosome
        puffing" (FC2174, FC2504), and "Polycomb repressive complex 1 (PRC1,
        hPRC-H)" (FC2731, FC374).
      - Column C ("Entrez GeneID ID", sic): 659 integer NCBI Entrez Gene IDs
        (169 unique IDs, range 31075-3772232), in exact 1-to-1 correspondence
        with column D. Because Entrez Gene IDs are categorical database
        identifiers rather than quantitative measurements, they are documented
        here and omitted from data.yaml.
      - Column D ("Gene In Search Results"): 169 unique Drosophila gene symbols
        from the MIST ver. 5.0 interaction network built from the 10 RNAi
        screen-positive actin-binding genes.
  (2) Prominent-complex summary table (G3:H5):
      - Column G ("Prominent Complex Name"): G4 = "myofibril assembly",
        G5 = "protein folding" (Complex IDs omitted).
      - Column H ("Number of included genes"): H4 = 27 (matches FC1047, A6:D32),
        H5 = 30 (matches FC1280, A78:D107). These two static integers are the
        only quantitative numeric counts in the workbook and are recorded in
        data.yaml. No P-values, enrichment scores, or reference complex sizes
        appear anywhere in the file.

  Complex size distribution (213 complexes, 659 total memberships):
  size 2: 103 complexes; size 3: 74; size 4: 19; size 5: 6; size 6: 4; size 7: 1;
  size 8: 1; size 9: 1; size 10: 2; size 27: 1; size 30: 1.

  Largest complexes (n >= 5) and key actin/myosin/crosslinker/cytoskeletal hits:
  - Prominent complexes (G4:H5):
    * FC1280 "protein folding" (n=30, R78-R107; largest complex in the file,
      not mentioned in sekine2024): flr (AIP1), AnxB10, scf, eEF5, CG6084,
      Hsc70Cb, Stip1, PCNA, Pgd, Eb1, Moe (Moesin), CG10638, Jupiter, scu,
      Tctp, Akap200, Calr, CG8036, chic (profilin), Eno, PHGPx, CG11267,
      CG2852, CG2862, Fim (fimbrin actin crosslinker), CG14715, fabp, CG4598,
      GstO3, HmgD. A second complex named "protein folding" (FC2520, n=2,
      R398-R399: Stip1, Hsp83) yields 31 unique genes across both IDs.
    * FC1047 "myofibril assembly" (n=27, R6-R32; the sole complex cited in
      sekine2024 p. 3): 15 sarcomeric/cytoskeletal genes -- alpha-actinin
      crosslinker Actn (R26), screen-positive troponin I wupA (R23), muscle
      actins Act79B and Act88F, muscle myosins Mhc, Mlc1, Mlc2, paramyosin Prm,
      tropomyosin Tm2, troponins up, TpnC4, TpnC41C, myofilin Mf, flightin fln,
      and Scp1 -- plus 12 metabolic/mitochondrial genes (Mpcp1, CG5177, Gpdh1,
      Gdh, Cyt-c1, Adh, Nc73EF, GstS1, Argk, mAcon1, ND-PDSW, kdn).
  - Planar cell polarity, Rho/ROCK, formins, and cortical polarity:
    * FC959 "Planar Cell Polarity pathway" (n=10, R653-R662): Vang, RhoGDI,
      Rho1, Rac1, dsh, ft, flw, Rok, DAAM (screen-positive), mwh.
    * FC1321 "EB1-APC-mDia2 complex" (n=4, R124-R127): Apc, Apc2, Eb1, dia
      (screen-positive formin).
    * FC191 "subapical complex" (n=3: baz, Moe, N); FC413 "PAR-6-aPKC-PAR-3-
      Cdc42-Rac1 complex" (n=2: Rac1, baz); FC1442 and FC1605 PALS1-Par3
      complexes (n=2: 14-3-3epsilon, baz); FC17/FC328/FC2276 Scrib-APC/Vangl2
      complexes (n=2-3: scrib, Apc, Apc2, Vang); FC1532/FC2653/FC2702 Dlg1
      complexes (n=2-3); FC2711/FC1157/FC2347 APC-IQGAP1-Rac1/Cdc42/CLIP-170
      (n=2-3); FC653 putative complex (n=2: Rho1, RhoGDI); FC446 "wing disc
      development" (n=2: 14-3-3epsilon, Rok); FC2365 "Hippo/Warts pathway"
      (n=3: 14-3-3epsilon, yki, ft); FC2011/FC2891 Wingless/WNT (n=4).
  - Myosin, troponin, actin-binding, crosslinker, and adhesion complexes:
    * FC1572 "myosin complex" (n=5, R179-R183): Mhc, Mlc1, Mlc2, Myo95E, Prm.
    * FC1786 "muscle myosin complex" (n=3, R238-R240): Mhc, Mlc1, Mlc2.
    * FC1576 "WIP-WASp-actin-myosin-IIa complex" (n=3, R184-R186): Act87E,
      Mhc, Mlc1.
    * FC2172 "mitochondrion transport along microtubule" (n=2: Mhc, Mlc1);
      FC2522 "protein dephosphorylation" (n=2: Myo95E, Cam).
    * FC148 "Cofilin-actin-CAP1 complex" (n=5, R156-R160): screen-positive tsr
      (cofilin), capt (CAP), Act79B, Act87E, Act88F.
    * FC1716 "Profilin 2 complex" (n=6, R210-R215: Act79B, Act87E, Act88F,
      Hsc70-1, Hsc70-4, Rok) and FC892 "Profilin 1 complex" (n=6, R624-R629:
      Act79B, Act87E, Act88F, Hsc70-1, Hsc70-4, TER94).
    * FC1437 "endocytosis" (n=7, R145-R151): Fim (fimbrin crosslinker), Lasp,
      Act79B, Act87E, Act88F, Mlc1, Cam.
    * FC523 "troponin complex" (n=2, R560-R561): up, wupA.
    * FC2835 "P2X7 receptor signalling complex" (n=9, R471-R479): Actn, mys
      (betaPS-integrin), Act79B, Act87E, Act88F, Hsc70-1, Hsc70-4, Hsp83, Hsp68.
    * FC2791 "Polycystin-1 multiprotein complex" (n=2, R462-R463): Actn, Src42A.
    * Integrin complexes: FC2667, FC569, FC575 (n=2: mys, Src42A); FC3067
      (n=2: mys, Egfr).
    * Emerin/dystrobrevin/spectrin/CTGF actin complexes: FC2907 (n=5), FC1984/
      FC2226/FC58 (n=4), FC1545 "Alpha-dystrobrevin-ZO-1-actin complex" (n=3),
      FC1559/FC2902 (n=3), FC2152 "Emerin-actin-NMI-(alphaII)spectrin complex"
      (n=3), FC2803 "CTGF/Hcs24-actin complex" (n=3).
  - Other frequent non-cytoskeletal categories:
    * 44 complexes include actin paralogs (Act79B in 43, Act87E in 43, Act88F
      in 42), ~25 of which are nuclear chromatin-remodeling/transcription
      complexes (NuA4, BAF/PBAF, INO80, Swr1, NUMAC, TRRAP/TIP60, HDAC1, PYR,
      LARC, PIC, c-Myc, etc.) matched solely via actin paralogs.
    * 45 complexes include heat-shock chaperones (Hsc70-1 and Hsc70-4 in 30
      each, Hsp68 and Hsp83 in 16 each, Hsc70Cb in 9).
    * Immune/NF-kappa B signaling: FC2099 "Imd pathway" (n=10) plus multiple
      TNF-alpha/NF-kappa B/IKK complexes (key and IKKbeta in 16 complexes each,
      Rel in 8).
    * Energy metabolism & core machinery: ATP synthase (FC1281, FC915, n=5;
      FC1358, n=4; FC1789, FC2762, n=3), TCA/glycolysis/pentose-phosphate,
      spliceosome, ribosome, cell-cycle CDK/CycB, and 9 putative complexes
      without known function (including FC538 [CG3630, Cam] and FC739 [tsr,
      tobi]).

  Coverage vs sekine2024:
  Of the 10 RNAi screen-positive MIST input genes (sekine2024 Methods p. 11 and
  Supp. Fig. 4), 5 appear in Supplementary Data 2 (CG3630 in FC538; tsr in
  FC148, FC2472, FC739; dia in FC1321; DAAM in FC959; wupA in FC1047, FC523)
  and 5 do not (Zasp52, Chd64, ssh, cora, form3). Of the 9 Supp. Fig. 4 hub
  genes (>3 connections), 6 appear (smt3, Tak1, key, Diap2, Eb1, Rho1) and 3 do
  not (Sema1a, LIMK1, Tango2). Actn appears in 3 complexes (FC1047, FC2791,
  FC2835); non-muscle myosin II heavy chain (zip) and RhoGEF2 are absent.
