- id: q_sheet_name_and_crossref_mismatch
  kind: possible_error
  about:
    - myofibril_assembly_gene_count
    - protein_folding_gene_count
    - ref-sekine2024
  text: >
    The sole worksheet tab is named 'SupplemetaryData1' (misspelling
    'Supplementary' and numbering it '1'), whereas cell A2 titles the sheet
    'SupplementaryData2. List of protein complexes identified in the protein
    network constructed by MIST ', the journal supplement file is MOESM5_ESM.xlsx,
    and sekine2024 (PDF pp. 3 and 37) identifies it as Supplementary Data 2.
    Separately, sekine2024 Methods ('Molecular interaction network', PDF p. 11)
    erroneously states that the MIST molecular complexes are listed in
    'Supplementary Table 4' (which actually tabulates CGMD structure-factor
    Gaussian fit parameters; see also sekine2024/q_indexing_and_table_crossref_typos).
    Minor spreadsheet formatting artifacts also occur: column C header reads
    'Entrez GeneID ID' (duplicated 'ID') and every Complex ID in A4:A662 has a
    trailing space.
  citation:
    sheet: "SupplemetaryData1"
    cells: "A2"
    where: "Title cell A2 vs worksheet tab name 'SupplemetaryData1'"

- id: q_fig3c_myofibril_group_vs_fc1047
  kind: unexplained_difference
  about:
    - myofibril_assembly_gene_count
    - ref-sekine2024
  text: >
    In sekine2024 Fig. 3c (PDF p. 5), the 'Myofibril assembly' functional group
    contains four genes: Zasp52, Actn, WupA, and Chd64, and main text p. 3
    highlights the 'myofibril assembly complex (FC1047)' in Supplementary Data 2
    for including alpha-actinin (Actn). In Supplementary Data 2, FC1047
    ('myofibril assembly', 27 genes, rows A6:D32) includes Actn (row 26) and
    wupA (row 23) together with 13 other sarcomeric/contractile genes and 12
    metabolic/mitochondrial genes, but neither Zasp52 nor Chd64 appears in
    FC1047 or anywhere else in the workbook. More broadly, only 5 of the 10
    RNAi screen-positive MIST input genes (CG3630, tsr, dia, DAAM, wupA) appear
    in Supplementary Data 2, while Zasp52, Chd64, ssh, cora, and form3 are
    absent; similarly, 3 of the 9 hub genes in Supplementary Fig. 4 (Sema1a,
    LIMK1, Tango2) and experimentally tested non-muscle myosin II heavy chain
    (zip) and RhoGEF2 are absent from Supplementary Data 2.
  citation:
    sheet: "SupplemetaryData1"
    cells: "A6:A32"
    where: "FC1047 ('myofibril assembly') block vs sekine2024 Fig. 3c and Supp. Fig. 4"

- id: q_protein_folding_unreported_and_ambiguous
  kind: reading
  about:
    - protein_folding_gene_count
    - ref-sekine2024
  text: >
    The Prominent Complex Name summary table (G3:H5) highlights 'protein
    folding' (H5 = 30) alongside 'myofibril assembly' (H4 = 27), making
    'protein folding' (FC1280, rows A78:D107, which includes cytoskeletal genes
    Fim, chic, flr, Moe, and Eb1) the largest complex in Supplementary Data 2;
    however, sekine2024 never mentions 'protein folding' (FC1280) or the counts
    27 and 30 in the article or Supplementary Information. In addition, G4:G5
    omit Complex IDs, creating an ambiguity because two distinct COMPLEAT
    complexes in the main table share the name 'protein folding': FC1280
    (rows A78:D107, 30 genes) and FC2520 (rows A398:D399, 2 genes: Stip1,
    Hsp83). Their union contains 31 unique genes (Stip1 overlaps; Hsp83 is
    only in FC2520), so H5 = 30 counts FC1280 alone.
  citation:
    sheet: "SupplemetaryData1"
    cells: "H5"
    where: "Prominent Complex Name summary cell H5 ('protein folding', 30) vs FC1280 and FC2520"

- id: q_unstated_enrichment_statistics_and_cutoffs
  kind: unstated_input
  about:
    - myofibril_assembly_gene_count
    - protein_folding_gene_count
    - ref-mist
    - ref-compleat
  text: >
    Neither Supplementary Data 2 nor sekine2024 reports MIST/COMPLEAT enrichment
    P-values, enrichment scores, full COMPLEAT complex sizes, total expanded
    network gene count, the minimum-overlap cutoff used to list the 213
    complexes (minimum observed size is 2 genes: 103 complexes of size 2 and
    74 of size 3), or the criterion used to single out 'myofibril assembly'
    (27 genes) and 'protein folding' (30 genes) as 'Prominent Complex Name'
    ahead of the next-largest complexes (FC959 Planar Cell Polarity pathway
    and FC2099 Imd pathway, 10 genes each).
  citation:
    sheet: "SupplemetaryData1"
    cells: "H4:H5"
    where: "Prominent Complex Name gene counts (H4:H5) without accompanying statistical scores"

- id: q_rnai_screen_to_mist_network_bridge
  kind: reading
  about:
    - myofibril_assembly_gene_count
    - protein_folding_gene_count
    - ref-sekine2024
    - sekine_rnai_screen/pupae_Actn_bdsc34874
    - sekine_rnai_screen/pupae_wupA_bdsc31893
    - sekine_rnai_screen/pupae_tsr_bdsc65055
    - sekine_rnai_screen/pupae_CG3630_bdsc65945
    - sekine_rnai_screen/pupae_DAAM_bdsc39058
    - sekine_rnai_screen/pupae_dia_bdsc33424
    - sekine_rnai_screen/pupae_Zasp52_bdsc58198
    - sekine_rnai_screen/pupae_Chd64_bdsc62377
    - sekine_rnai_screen/pupae_ssh_bdsc38948
    - sekine_rnai_screen/pupae_cora_bdsc28933
    - sekine_rnai_screen/pupae_form3_bdsc32398
    - sekine2024/t2_actn14_orient
  text: >
    Both sekine_mist_complexes (Supplementary Data 2) and sekine_rnai_screen
    (Supplementary Data 1) are pure dataset records (zero mathematical models
    and zero from_source links between them), so no ModelAtlas relations.yaml
    entry applies and no cited.yaml numeric value is copied between
    sekine_rnai_screen's pupa counts and sekine_mist_complexes's two prominent
    complex gene counts (27 and 30). Instead, the two datasets are bridged by
    gene-level workflow in sekine2024: 10 larval-lethal RNAi screen positives
    from sekine_rnai_screen (confirmed in sekine2024 Supp. Table 2) served as
    MIST ver. 5.0 query inputs to build the 169-gene, 213-complex table in
    sekine_mist_complexes. Exactly 5 of the 10 screen positives appear in
    sekine_mist_complexes -- wupA (pupae_wupA_bdsc31893, 0/0/0/0) in FC1047
    ('myofibril assembly', row 23) and FC523 ('troponin complex', row 561);
    tsr (pupae_tsr_bdsc65055, 0/0/0/0) in FC148 ('Cofilin-actin-CAP1 complex',
    row 156), FC2472 ('glycolysis', row 390), and FC739 (row 609); CG3630
    (pupae_CG3630_bdsc65945, 0/0/0/0) in FC538 (row 565); DAAM
    (pupae_DAAM_bdsc39058, 0/0/0/n.d.) in FC959 ('Planar Cell Polarity
    pathway', row 661); and dia (pupae_dia_bdsc33424, 0/0/0/n.d.) in FC1321
    ('EB1-APC-mDia2 complex', row 127) -- whereas the other 5 screen positives
    (Zasp52, Chd64, ssh, cora, form3) are absent from Supplementary Data 2.
    Crucially, alpha-Actinin (Actn), missed as a viable false negative in
    sekine_rnai_screen (pupae_Actn_bdsc34874, BDSC#34874, 0/22/95/124 pupae on
    days 5-8), is rescued via prominent complex FC1047 ('myofibril assembly',
    27 genes, row 26; also in FC2791 row 462 and FC2835 row 471), where it
    co-occurs with screen-positive wupA (row 23) plus viable 1st-screen genes
    Tm2 (row 25) and Mhc (row 27), motivating its validation in the actn[14]
    null mutant (sekine2024/t2_actn14_orient, 42.5 deg median orientation).
    Across all 119 unique genes tested in sekine_rnai_screen and 169 unique
    genes in sekine_mist_complexes, 16 genes overlap in total: the 5 screen
    positives above, 1 other larval-lethal gene (chic in FC1280), 2 pupal-lethal
    genes (capt in FC148; Moe in FC1280/FC191, also with a viable stock), and
    8 viable genes (Actn, AnxB10, Fim, Lasp, Mhc, Tm2, flr, mwh), including 5
    overlapping genes (flr, AnxB10, Moe, chic, Fim) in the unreported largest
    complex FC1280 ('protein folding', 30 genes).
  citation:
    sheet: "SupplemetaryData1"
    cells: "D6:D32"
    where: "FC1047 ('myofibril assembly') gene list (wupA at D23, Tm2 at D25, Actn at D26, Mhc at D27) bridging sekine_rnai_screen to sekine_mist_complexes"

