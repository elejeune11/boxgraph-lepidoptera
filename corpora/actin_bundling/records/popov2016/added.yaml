# ---------------------------------------------------------------------------
# Unstated physical/model parameters needed to check printed derivations
# ---------------------------------------------------------------------------
- id: actin_persistence_length_added
  quantity: persistence_length
  unit: um
  printed: "17.7"
  basis: "Table 2B footnote b (p. 60) computes eps_actin,bending = l_p * k_B T / l_cyl citing Ott et al. (1993) [Ref 99 / S2Tab Ref 4] without printing l_p; Ott et al. (1993) measured l_p = 17.7 +- 0.5 um."
  alternatives: ["17.0", "17.71", "18.0"]
  stands_for: "l_p in Table 2B footnote b (p. 60), p. 8 aspect ratio, and S4 Text Section B (p. 52)"

- id: nmiia_heads_eval_added
  quantity: motor_total_head_count
  unit: dimensionless
  printed: "20"
  basis: "S3 Text Section A (p. 44) states NMIIA mini-filaments have 10-30 implicit subunits (heads per side) chosen randomly at binding, but p. 46 does not state which N_total was used for the reported 5 s / 50 s attachment times and 3 nm/s loaded walking velocity. Midpoint 20 is chosen."
  alternatives: ["10", "15", "17", "25", "30"]
  stands_for: "N_total in S3 Text Eqs. 1-5 (pp. 45-46)"

- id: zero_external_force_added
  quantity: external_force
  unit: pN
  printed: "0"
  basis: "Unloaded (zero external force) evaluation condition for S3 Text Eqs. 2, 3, 4, 6, and 7."
  alternatives: ["1.5", "15"]
  stands_for: "F_ext = 0 under unloaded conditions in S3 Text"

- id: myosin_molecules_per_minifil_added
  quantity: myosin_molecules_per_minifilament
  unit: dimensionless
  printed: "30"
  basis: "S2 Text Section C (p. 43) states that the simulated R_m:a values (0.005 to 0.02 at 20 uM actin in 1 um^3) correspond to 2-8 NMIIA mini-filaments without stating the myosin-II-per-mini-filament stoichiometry; 30 molecules per mini-filament yields 2.01 to 8.03 mini-filaments."
  alternatives: ["20", "28", "32"]
  stands_for: "NMIIA molecule stoichiometry per mini-filament in S2 Text Section C (p. 43)"

- id: K_actin_vol_dim_corrected_added
  quantity: excluded_volume_constant_eq4
  unit: pN*nm^5
  printed: "10^5"
  basis: "Table 2B (p. 60) prints K_actin,vol = 10^5 pN/nm^4, which is dimensionally inconsistent with Main Text Eq. 4 (p. 10, requiring pN*nm^5 so U_ij^vol has dimensions of energy). Numerical value 10^5 is retained in the consistent unit pN*nm^5 for evaluating Eq. 4."
  alternatives: ["10^4", "10^6"]
  stands_for: "K_vol in Main Text Eq. 4 (p. 10)"

# ---------------------------------------------------------------------------
# Representative probe inputs for exercising force-field & rate-law models
# ---------------------------------------------------------------------------
- id: probe_bend_angle_added
  quantity: inter_cylinder_angle
  unit: deg
  printed: "10"
  basis: "Representative small inter-cylinder bending angle (10 deg) for evaluating Main Text Eq. 1 (p. 8)."
  alternatives: ["5", "20"]
  stands_for: "theta_{i,i+1} in Main Text Eq. 1 (p. 8)"

- id: probe_cyl_length_stretched_added
  quantity: cylinder_instantaneous_length
  unit: nm
  printed: "28"
  basis: "Representative 1 nm axial stretch above l_0 = 27 nm (3.7%, within the <10% deformation bound noted in Table 2B footnote c) for evaluating Main Text Eq. 2 (p. 8)."
  alternatives: ["27.5", "29.7"]
  stands_for: "|l_i| in Main Text Eq. 2 (p. 8)"

- id: probe_cyl_separation_added
  quantity: cylinder_separation_distance
  unit: nm
  printed: "6"
  basis: "Parallel cylinder center-to-center contact distance equal to the ~6 nm F-actin diameter (Table 2B footnote d) for evaluating Main Text Eq. 4 (p. 10)."
  alternatives: ["5", "8"]
  stands_for: "inter-cylinder separation d in Main Text Eq. 4 (p. 10)"

- id: probe_branch_K_str_added
  quantity: stretching_stiffness
  unit: pN/nm
  printed: "100"
  basis: "Representative branch stretching stiffness (matching K_actin,str = 100 pN/nm; branching parameters are not printed in S2 Table because Arp2/3 is absent from the actomyosin Results runs) for evaluating Main Text Eq. 6 (p. 10)."
  alternatives: ["50", "200"]
  stands_for: "K_branch,str in Main Text Eq. 6 (p. 10)"

- id: probe_branch_d0_added
  quantity: branch_equilibrium_distance
  unit: nm
  printed: "6"
  basis: "Representative equilibrium mother-daughter branching junction distance (~1 actin filament diameter, unstated in S2 Table) for evaluating Main Text Eq. 6 (p. 10)."
  alternatives: ["5", "10"]
  stands_for: "d_0 in Main Text Eq. 6 (p. 10)"

- id: probe_branch_d_added
  quantity: branch_junction_distance
  unit: nm
  printed: "7"
  basis: "Representative 1 nm stretched mother-daughter junction distance for evaluating Main Text Eq. 6 (p. 10)."
  alternatives: ["6.5", "8"]
  stands_for: "|d_ij| in Main Text Eq. 6 (p. 10)"

- id: probe_branch_eps_ang_added
  quantity: bending_energy_parameter
  unit: pN*nm
  printed: "100"
  basis: "Representative Arp2/3 branch angular bending energy (unstated in S2 Table) for evaluating Main Text Eq. 7 (p. 11)."
  alternatives: ["50", "500"]
  stands_for: "epsilon_branch,ang in Main Text Eq. 7 (p. 11)"

- id: probe_branch_angle_added
  quantity: inter_cylinder_angle
  unit: deg
  printed: "75"
  basis: "Representative 5 deg angular deflection from the ~70 deg equilibrium Arp2/3 branch angle for evaluating Main Text Eq. 7 (p. 11)."
  alternatives: ["65", "80"]
  stands_for: "theta_{i,j} in Main Text Eq. 7 (p. 11)"

- id: probe_branch_eps_dihed_added
  quantity: bending_energy_parameter
  unit: pN*nm
  printed: "100"
  basis: "Representative Arp2/3 branch dihedral bending energy (unstated in S2 Table) for evaluating Main Text Eq. 8 (p. 11)."
  alternatives: ["50", "500"]
  stands_for: "epsilon_branch,dihed in Main Text Eq. 8 (p. 11)"

- id: probe_branch_phi0_added
  quantity: branch_dihedral_angle
  unit: deg
  printed: "0"
  basis: "Planar equilibrium dihedral angle phi_0 = 0 deg (unstated in S2 Table) for evaluating Main Text Eq. 8 (p. 11)."
  alternatives: ["90", "180"]
  stands_for: "phi_0 in Main Text Eq. 8 (p. 11)"

- id: probe_branch_phi_added
  quantity: branch_dihedral_angle
  unit: deg
  printed: "10"
  basis: "Representative 10 deg dihedral twist away from phi_0 = 0 deg for evaluating Main Text Eq. 8 (p. 11)."
  alternatives: ["5", "20"]
  stands_for: "phi_{i,j} in Main Text Eq. 8 (p. 11)"

- id: probe_alpha_stretched_len_added
  quantity: linker_instantaneous_length
  unit: nm
  printed: "37"
  basis: "Representative 2 nm extension of an alpha-actinin cross-linker from its 35 nm equilibrium length for evaluating Main Text Eq. 9 (p. 12)."
  alternatives: ["36", "40"]
  stands_for: "|l_ij^m| in Main Text Eq. 9 (p. 12)"

- id: probe_boundary_dist_added
  quantity: boundary_distance
  unit: nm
  printed: "2.7"
  basis: "Representative endpoint-to-boundary distance equal to one screening length lambda_boundary = 2.7 nm for evaluating Main Text Eq. 11 (p. 12)."
  alternatives: ["1.0", "5.4"]
  stands_for: "d_i in Main Text Eq. 11 (p. 12)"

- id: probe_pulling_force_added
  quantity: external_force
  unit: pN
  printed: "10"
  basis: "Representative 10 pN mechanical force for evaluating alpha-actinin slip-bond unbinding (S3 Text Eq. 6) and Brownian ratchet polymerization (S3 Text Eq. 7)."
  alternatives: ["5", "17.2"]
  stands_for: "F_ext in S3 Text Eqs. 6 and 7 (pp. 46-47)"

- id: probe_k_poly_0_unimol_added
  quantity: actin_polymerization_rate_unimolecular
  unit: 1/s
  printed: "2.32"
  basis: "Representative unloaded plus-end tip polymerization rate k_actin,poly,+ * [G] = 11.6 uM^-1 s^-1 * 0.2 uM = 2.32 s^-1 at steady-state G-actin ~0.2 uM (S2 Text p. 42) for evaluating S3 Text Eq. 7 (p. 47)."
  alternatives: ["1.4", "23.2"]
  stands_for: "k_poly^0 in S3 Text Eq. 7 (p. 47)"

- id: probe_msd_time_added
  quantity: simulation_time
  unit: s
  printed: "1000"
  basis: "Upper cutoff time (1000 s, p. 23) of the anomalous diffusion log-log fit window for evaluating Main Text Eq. 15 (p. 24)."
  alternatives: ["100", "500"]
  stands_for: "t in Main Text Eq. 15 (p. 24)"

- id: probe_msd_nu_added
  quantity: anomalous_diffusion_exponent
  unit: dimensionless
  printed: "1.38"
  basis: "Representative super-diffusive exponent nu > 1 (near the chi = 1 peak in Fig. 12B, p. 24) for evaluating Main Text Eq. 15 (p. 24)."
  alternatives: ["1.1", "1.4"]
  stands_for: "nu in Main Text Eq. 15 (p. 24)"

- id: probe_x_bs_added
  quantity: filament_midpoint_position
  unit: nm
  printed: "50"
  basis: "Representative bead-spring midpoint deflection for exercising S4 Text Eq. 2 (p. 52)."
  alternatives: ["20", "100"]
  stands_for: "x_bs in S4 Text Eq. 2 (p. 52)"

- id: probe_x_cg_added
  quantity: filament_midpoint_position
  unit: nm
  printed: "40"
  basis: "Representative coarse-grained cylinder midpoint deflection (10 nm below x_bs, giving 1% error over L = 1 um) for exercising S4 Text Eq. 2 (p. 52)."
  alternatives: ["15", "80"]
  stands_for: "x_cg in S4 Text Eq. 2 (p. 52)"
