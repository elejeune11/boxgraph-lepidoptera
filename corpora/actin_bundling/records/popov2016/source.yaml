notes: >
  Complete reading of Popov, Komianos & Papoian (PLoS Computational Biology 12(4), e1004877, 2016),
  covering the main article and references (PDF pp. 1-35, printed 1/35-35/35) and six merged
  Supporting Information PDFs: S1 Text Model details (PDF pp. 36-41), S2 Text Determining key
  simulation parameters (PDF pp. 42-43), S3 Text Mechanochemical models (PDF pp. 44-48), S4 Text
  Validation and benchmarking (PDF pp. 49-55), S1 Table Comparison of agent-based cytoskeletal
  models (PDF pp. 56-58), and S2 Table Simulation parameters Tables 2A-2D (PDF pp. 59-62). All
  equations, tables, and numerical values were verified directly against rendered page images
  (pages/page-NNN.png).

  In scope: (1) Full many-body/benchmark simulation frameworks recorded as runnable: false
  (medyan_3d_actomyosin_simulator and single_filament_cg_benchmark, plus the full-network tensor
  evaluation of nematic_order_parameter_eq14); (2) all closed-form mechanical force-field potentials
  (Main Text Eqs. 1, 2, 4, 6, 7, 8, 9, 11), mechanochemical rate laws (S3 Text Eqs. 1-7),
  parameter-selection and rate-conversion formulas (S2 Text Eqs. 1-2, compartment diffusion and
  bimolecular rate conversions, Table 2A-2C derived constants, S2 Text Section C walking-event count),
  steady-state critical concentration and treadmilling flux (S4 Text Eq. 1 and turnover scaling),
  anomalous diffusion scaling (Eq. 15, prefactor: unknown), and displacement error (S4 Text Eq. 2);
  (3) one evident-misprint variant (nmiia_stall_load_minifil_variant restoring N_total from Table 2B
  footnote e into S3 Text p. 46 stall load); (4) reconstructed geometric and mass-balance
  consistency checks (cubic-box Popoviciu upper bound on Eq. 13 R_g, steady-state F-actin mass
  balance for mean filament length, and NMIIA mini-filament copy number from R_m:a). relations.yaml
  is empty because no non-trivial within-paper algebraic or limit relations between distinct models
  are stated in the text (cross-paper relations are deferred to the relate stage).

  Figure catalog (digitized at 900 dpi in mode: code; 39 readings / 345 points saved in readings.json and documented in figures.md):
  - Quantitative plots digitized: Main Fig 6 (p. 19, heat map of R_g vs R_m:a and R_alpha:a
    at 2000 s, 3 rows x 6 cols), Fig 8 (p. 21, R_g,f/R_g,i vs time for 6 R_alpha:a at R_m:a=0.01),
    Fig 9 (p. 22, heat map of nematic order S vs R_m:a and R_alpha:a at 2000 s, 3 rows x 6 cols),
    Fig 10A-B (p. 23, 6 R_g,f/R_g,i(t) curves and S(2000 s) vs chi with SD bars), Fig 12A-B (p. 24,
    7 MSD <Delta x^2>(t) curves and diffusion exponent nu vs chi with SE bars), S4 Text Fig 1 (p. 50,
    mean filament length vs time for NRM vs Gillespie DM), S4 Text Fig 2 (p. 51, diffusing actin
    concentration vs time with error bars), S4 Text Fig 3 (p. 52, wall-clock runtime vs simulation
    time for NRM vs Gillespie DM), S4 Text Fig 4 (p. 53, polymer midpoint displacement error e_d vs
    segment monomer count), and S4 Text Fig 5 (p. 54, polymer equilibration wall-clock time vs
    segment monomer count).
  - Schematics and 3D snapshots (no quantitative curves): Main Fig 1 (p. 7), Fig 2 (p. 9), Fig 3
    (p. 11), Fig 4 (p. 15), Fig 5 (p. 18), Fig 7A-I (p. 20), Fig 11A-C (p. 23), Fig 13 (p. 26), and
    S1 Text Fig 1 (p. 39).
  - External PLOS SI assets not bundled into this 62-page PDF (captions on p. 29): S1 Fig (PNG,
    R_g = 1.77, 1.51, 1.22 um recorded from caption), S2 Fig (PNG, binding-site exclusivity heat map
    and time series), and S1-S4 Videos (MOV).

  Left out (numbers feeding no model): literature review summary scales in S1 Table (p. 57), CPU/RAM
  hardware specs (2.20 GHz, 25.6 GB, 1333 MHz on p. 49), wall-clock runtimes in S4 Text Section C
  (12 h, 2 days, 6 days, 6 h on p. 53) and Gillespie >12 h note (p. 50), qualitative range of
  myosin thick-filament head counts (100-800 on p. 12), cited in-vivo lamellipodial fragment lengths
  (0.5-2 um on p. 17), cited microrheology relaxation upper limit (~10 ms on p. 14), and order-of-
  magnitude cubic-micron actin monomer count (~10^6 on p. 7).
