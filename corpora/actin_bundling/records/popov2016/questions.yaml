- id: q_s2_kuramoto_tau_and_lk_mismatch
  kind: possible_error
  about:
    - fastest_reaction_timescale_s2eq2
    - kuramoto_length_s2eq1
    - tau_fastest_reaction_printed
    - kuramoto_length_printed
    - cmp_tau_fastest_s2eq2
    - cmp_kuramoto_from_printed_tau
    - cmp_kuramoto_from_computed_tau
  text: >
    S2 Text Eq. 2 (p. 42) states tau = 1 / (k_actin,poly,+ * [A]) = 0.003 s at [A] = 20 uM and gives
    Kuramoto length l_k = sqrt(6 D tau) = 0.64 um for D = 20 um^2/s. With Table 2A's printed
    k_actin,poly,+ = 11.6 uM^-1 s^-1 and [A] = 20 uM, Eq. 2 yields tau = 1 / 232 = 0.00431 s
    (+43.7% above printed 0.003 s), and Eq. 1 yields l_k = 0.719 um (+12.4% above 0.64 um). Even
    plugging the printed tau = 0.003 s into Eq. 1 yields l_k = sqrt(0.36) = 0.600 um, not 0.64 um.
    Notably, [A] = 25 uM would yield tau = 0.00345 s (rounding to 0.003 s) and l_k = 0.643 um
    (rounding to 0.64 um), suggesting tau and l_k may have been evaluated before changing [A] to 20 uM.
  citation:
    page: 42
    printed_page: "S2-1"
    quote: "giving a Kuramoto length of 0.64 µm"
    where: "S2 Text Section A, Eqs. 1-2"

- id: q_s3_nmiia_stall_load_and_loaded_predictions
  kind: possible_error
  about:
    - nmiia_stall_load_printed_s3a
    - nmiia_stall_load_minifil_variant
    - nmiia_unbinding_and_attachment_time_s3eq2
    - nmiia_loaded_walking_rate_s3eq4
    - nmiia_loaded_att_time
    - nmiia_loaded_walk_vel
    - cmp_nmiia_loaded_att_time_printed
    - cmp_nmiia_loaded_walk_vel_printed
    - cmp_nmiia_loaded_att_time_variant
    - cmp_nmiia_loaded_walk_vel_variant
  text: >
    S3 Text Section A (p. 46) states that under "stall conditions (i.e. F_ext = rho K_NMIIA,stretching d_step)",
    Eqs. 2-5 with alpha=1.0, beta=0.2, gamma=0.05/pN, zeta=0.1 give a loaded attachment time of 50 s
    and a loaded walking velocity of 3 nm/s. Literally evaluating F_ext = 0.1 * 2.5 * 6 = 1.5 pN yields
    tau_att = 6.46 s and v_walk = 10.23 nm/s (at N_total = 20), disagreeing strongly with 50 s and 3 nm/s.
    Restoring the mini-filament head count N_total per Table 2B footnote e (variant F_ext = rho * N_total
    * K_head * d_step = 30 pN at N_total = 20) still gives tau_att = 20.32 s (10.2-30.5 s across
    N_total = 10-30) and v_walk = 4.86 nm/s (independent of N_total), failing to reproduce both 50 s and
    3 nm/s. Achieving v_walk = 3.0 nm/s in Eq. 4 requires F_ext / N_total = 2.87 pN (nearly 2x rho*F_stall),
    which at N_total = 27-30 simultaneously yields tau_att = 49-55 s.
  citation:
    page: 46
    printed_page: "S3-3"
    quote: "gives a loaded attachment time of 50 s and a loaded walking velocity of 3 nm/s"
    where: "S3 Text Section A"

