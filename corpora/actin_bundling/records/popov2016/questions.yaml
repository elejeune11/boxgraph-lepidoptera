  text: >
    Cross-framework mechanochemical kinetics comparison between MEDYAN (popov2016) and CytoSim
    (chandrasekaran2024): (1) Brownian ratchet stall force discrepancy: both frameworks use the
    exact same exponential load-dependent barbed-end polymerization law (verified via
    rel_chandrasekaran2024_brownian_ratchet_scales up to monomer increment l_mon = 2.7 nm),
    yet popov2016 derives F_actin,poly = k_B T / l_mon = 4.1 / 2.7 = 1.5 pN (citing Peskin
    et al. 1993 and Footer et al. 2007), whereas chandrasekaran2024 prescribes f_grow = 10 pN
    (6.67x larger). Under a 5 pN compressive load (typical of droplet-rim confinement or
    bundle buckling), MEDYAN suppresses elongation to exp(-5/1.5) = 3.6% of the unloaded rate,
    whereas CytoSim retains exp(-5/10) = 60.7% — a 17x kinetic divergence from the same formula.
    (2) Crosslinker force-response: MEDYAN alpha-actinin (S3 Eq. 6, F_unbind = 17.2 pN,
    k_0 = 0.3 s^-1) and CytoSim VASP (bell_slip_bond_unbinding, f_u = 10 pN, k_0 = 0.1-1.75 s^-1)
    implement the identical Bell slip bond (rel_chandrasekaran2024_bell_slip_bond), directly
    opposite in force sign to MEDYAN's NMIIA catch bond (S3 Eq. 2, exp(-F_ext / (N_bound * F_unbind)))
    and distinct from AFINES's detailed-balance Metropolis crosslinker dynamics (freedman2019 SI
    Eq. 4). (3) Inverse-variable mass conservation: popov2016/mean_filament_length_mass_balance
    solves F-actin conservation for L_mean = ((A_tot - A_ss) * N_A * V / N_fil) * l_mon,
    which is the exact algebraic inverse (for A_ss = 0 and V = (4/3)*pi*R_drop^3) of
    chandrasekaran2024/final_actin_concentration solving for C_actin.
  citation:
    page: 47
    printed_page: "S3-4"
    quote: "The polymerization rate of a filament tip under external load can be modeled by the Brownian"
    where: "S3 Text Eqs. 6-7 (pp. 46-47) and Table 2C (p. 61)"

