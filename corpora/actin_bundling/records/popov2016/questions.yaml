- id: q_cross_framework_stretching_and_wlb_coupling
  kind: unexplained_difference
  about:
    - K_actin_str
    - K_alpha_stretching
    - l_cyl_large
    - l_cyl_small
    - filament_stretching_energy_eq2
    - motor_crosslinker_stretching_energy_eq9
    - actin_cylinder_bending_energy_table2b
