- id: q_chain_rule_and_dihedral_normal_typos
  kind: possible_error
  about:
    - branch_dihedral_energy_eq8
    - branch_stretching_energy_eq6
    - boundary_repulsion_energy_eq11
  text: >
    Several mathematical/notational typos appear in the printed mechanical equations: (1) p. 13 prints
    the unnumbered chain rule inverted as dU^i/dx_i^m = (1 - alpha) dU^i/dx_i^1 + alpha dU^i/dx_i^2,
    whereas x_i^m = (1 - alpha) x_i^1 + alpha x_i^2 gives dU^i/dx_i^1 = (1 - alpha) dU^i/dx_i^m and
    dU^i/dx_i^2 = alpha dU^i/dx_i^m (whose sum equals dU^i/dx_i^m, while the printed RHS equals
    ((1 - alpha)^2 + alpha^2) dU^i/dx_i^m); (2) beneath Eq. 8 (p. 11), the plane normals n_i and n_j
    normalize a x b by |a||b| instead of |a x b|, so |n_i| != 1 whenever the vectors are non-orthogonal;
    (3) Eq. 6 (p. 10) omits the 1/2 prefactor used in harmonic Eqs. 2 and 9, and Eq. 11 (p. 12) writes
    vector d_i inside the scalar exponential exp(-d_i / lambda).
  citation:
    page: 13
    printed_page: "13"
    quote: "Mathematically speaking, this is equivalent to a simple chain rule"
    where: "Models / Mechanical model (pp. 10-13)"

