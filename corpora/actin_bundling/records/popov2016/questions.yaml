- id: q_filament_bending_float64_cancellation_note
  kind: numerics
  about:
    - filament_bending_energy_eq1
    - rel_freedman2019_filament_bending_derived_small_angle
    - rel_freedman2019_gap_bending_approx_two_medyan_hinges
    - rel_graham2023_ring_confinement_derived_medyan_bend
    - rel_graham2023_ring_confinement_approx_medyan_bend
  text: >
    ModelAtlas numerical precision note: popov2016/filament_bending_energy_eq1 implements
    Eq. 1 verbatim as `eps_bend * (1.0 - math.cos(theta))` in IEEE-754 float64 (rather than the
    numerically stable half-angle identity `2 * eps_bend * math.sin(theta / 2)**2`). For very
    small angles theta <= 1e-7 rad, `1.0 - math.cos(theta)` suffers catastrophic cancellation
    and underflows identically to 0.0 around theta ~ 1e-9 rad. Consequently, ModelAtlas numeric
    `reduces_to` tests (which probe down to ~10^-8 of the regime upper bound) spuriously report
    relative error 1.0 at k = 8 despite exact mathematical convergence. The small-angle
    equivalences between popov2016/filament_bending_energy_eq1, freedman2019/filament_potential_si_eq1,
    freedman2019/gap_bending_energy_eq1, and graham2023/ring_confinement_bending_energy are
    therefore verified symbolically via `derived_from` (`series: theta -> 0, 3`) and
    quantitatively over physiological angles via `approximated_by`.
  citation:
    page: 8
    printed_page: "8"
    quote: "we use an angular potential between consecutive cylinders in the polymer chain"
    where: "Main Text Eq. 1 (p. 8)"
