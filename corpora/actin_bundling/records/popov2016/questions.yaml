- id: q_rg_impossible_bound_1um_cube
  kind: possible_error
  about:
    - rg_cubic_domain_bounds_eq13
    - s1fig_rg_a
    - s1fig_rg_b
    - s1fig_rg_c
    - cmp_s1fig_rg_a_vs_1um_bound
  text: >
    For any point set confined within a 1 x 1 x 1 um^3 cubic hard-wall boundary (L = 1 um), Eq. 13
    (R_g = sqrt((1/n) sum |r_i - r_GC|^2)) satisfies R_g = L/2 = 0.500 um for a uniform spatial
    distribution and the strict Popoviciu upper bound R_g <= sqrt(3)*L/2 = 0.866 um for any
    configuration inside the cube. Yet Fig. 6 (p. 19, for the 1 x 1 x 1 um^3 system) shows a colorbar
    spanning R_g = 1.0 to 1.8 um, and S1 Fig caption (p. 29) prints R_g = 1.77, 1.51, and 1.22 um
    (1.77 um exceeds even the entire 1 um cube diagonal sqrt(3) = 1.732 um). This indicates an
    apparent scaling/unit discrepancy in the reported R_g values or confusion with the 3 x 3 x 3 um^3
    box (where R_g,uniform = 1.50 um). In addition, Eq. 13 prints an off-by-one sum i = 0 to n (n + 1
    terms) with prefactor 1/n.
  citation:
    page: 17
    printed_page: "17"
    quote: "define an actomyosin network radius of gyration using all coarse-grained actin filament"
    where: "Eq. 13, Fig. 6 (p. 19), S1 Fig caption (p. 29)"

- id: q_table2b_Kvol_dimensional_mismatch
  kind: possible_error
  about:
    - K_actin_vol_printed
    - K_actin_vol_dim_corrected_added
    - cylinder_excluded_volume_eq4
  text: >
    Table 2B (p. 60) prints K_actin,vol = 10^5 pN/nm^4, which is dimensionally inconsistent with Main
    Text Eq. 4 (p. 10): because s and t are dimensionless parameters in [0, 1] and |r_i - r_j|^4 has
    dimension nm^4, K_vol must have units pN*nm^5 (energy * length^4) for U_ij^vol to have dimensions
    of energy (pN*nm). In addition, passing from Eq. 3 (integrating over dl_i dl_j) to Eq. 4
    (integrating over ds dt) omits the Jacobian factor |l_i| |l_j|, which is non-constant for growing
    or shrinking end cylinders.
  citation:
    page: 60
    printed_page: "S2Tab-2"
    quote: "Actin filament excluded volume repulsion constant"
    where: "Table 2B and Main Text Eq. 4 (p. 10)"

