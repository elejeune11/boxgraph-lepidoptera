    - bathe2008/coupling_parameter_ea
    - freedman2019/filament_potential_si_eq1
    - freedman2019/crosslinker_potential_si_eq4
    - graham2023/single_filament_k_stretch
    - graham2023/discrete_bending_constant
  text: >
    Cross-framework mechanical stiffness and provenance audit across MEDYAN (popov2016), WLB
    (bathe2008), AFINES (freedman2019), Graham discrete-ring (graham2023), and CytoSim/LAMMPS
    (chandrasekaran2024): (1) Filament extensional rigidity E_f*A_f = K_str*l_seg spans nearly
    four orders of magnitude despite shared single-filament persistence length l_p = 17-18.3 um.
    Physical actin measured by Kojima et al. (1994, cited in both bathe2008 as EfAf_actin = 44 nN
    and popov2016 Table 2B footnote c as ref-98) gives k_f = 407 pN/nm for l_cyl = 108 nm and
    1630 pN/nm for l_cyl = 27 nm. MEDYAN softens K_actin,str to 100 pN/nm (effective E_f*A_f =
    10.8 nN at 108 nm and 2.7 nN at 27 nm, 4.1x-16.3x softer than physical actin); inside Bathe
    et al.'s WLB coupling parameter alpha = k_x * L^2 / (E_f * A_f * delta), this softening
    artificially shifts alpha upward by 4.1x-16.3x toward the fully-coupled bundle regime.
    AFINES (freedman2019 Table S1) softens filament springs far further to k_a = 5 pN/um at
    l_a = 1 um (E_f*A_f = 5 pN: 2,160x softer than MEDYAN at 108 nm and 8,800x softer than
    Kojima 1994) and crosslinkers to k_xl = 10 pN/um (800x softer than MEDYAN's K_alpha =
    8 pN/nm = 8000 pN/um) because AFINES integrates explicit Brownian dynamics at dt = 20 us,
    whereas MEDYAN decouples chemistry from quasi-static conjugate-gradient minimization
    (g_tol = 1 pN every t_min = 0.05 s) and CytoSim enforces inextensible filament constraints.
    (2) Unlinked partner citation & factor-of-2 stiffness drift in graham2023: Graham et al.
    (2023) SI Table 1 (p. 39) cites Popov et al. (2016) [SI ref 10, graham2023/ref-si-10,
    which currently lacks `source: popov2016` and a `cited.yaml` link from
    `graham2023/single_filament_k_stretch` to `popov2016/K_actin_str`] directly for
    k_stretch = N_fil * 100 pN/nm at L_cyl = 100 nm, adopting MEDYAN's exact cylinder bending
    discretization k_bend = N_fil * L_p * k_B T / L_cyl and cosine hinge potential
    k_bend*(1 - u_i . u_{i+1}) in SI Eq. (S2). However, Graham Eq. (S2) omits the 1/2
    prefactor on stretching (sum k_stretch*(||r_i - r_{i+1}|| - L_cyl)^2 vs MEDYAN Eq. 2's
    (1/2)*K_str*(l - l_0)^2), effectively doubling per-filament stretching stiffness to
    200 pN/nm (E_f*A_f = 20 nN, 2x stiffer than MEDYAN's actual spring constant). (3) Crosslinker
    mechanics diverge qualitatively: WLB assumes permanent linear-shear crosslinkers
    (k_perp ~ 1000 pN/nm, k_x ~ 10^-5 to 10^-6 N/m for fascin); MEDYAN models alpha-actinin
    as central-force Hookean springs (8 pN/nm, zero angular bending stiffness) with
    non-equilibrium Bell slip-bond unbinding; AFINES adds perpendicular crosslinker bending
    kappa_xl^B (0.005-0.02 pN*um) and equilibrium detailed-balance chemical binding energy.
  citation:
    page: 60
    printed_page: "S2Tab-2"
    quote: "This value was chosen to be smaller than the known stretching rigidity of actin filaments"
    where: "Table 2B (p. 60, footnotes b-c)"

