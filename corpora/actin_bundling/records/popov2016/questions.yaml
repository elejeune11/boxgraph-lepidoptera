  about: [medyan_3d_actomyosin_simulator]
  text: >
    The full 3D MEDYAN simulator couples spatially resolved Next Reaction Method RDME chemistry with
    conjugate-gradient mechanical equilibration of coarse-grained cylindrical polymer networks
    (implemented in external C++ software at www.medyan.org; 12 h to 6 days serial runtime per
    trajectory per S4 Text Section C, p. 53). Random number seeds, initial nucleated filament
