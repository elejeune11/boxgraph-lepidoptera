id: msd_loglog_fit_eq15
name: Log-log linear regression of Fig. 12A MSD over t <= 1000 s for exponent nu (Eq. 15)
role: fit
stated:
  page: 23
  printed_page: "23"
  quote: "we linearly fit the first 1000 s of the MSD"
  where: "Main Text (pp. 23-24), Eq. 15, Fig. 12B"
equation: "ln(<Delta x^2>) = a + nu * ln(t), t <= 1000 s"
inputs:
  msd_0p125: {quantity: mean_squared_displacement, unit: um^2, curve: {quantity: simulation_time, unit: s}}
  msd_0p25: {quantity: mean_squared_displacement, unit: um^2, curve: {quantity: simulation_time, unit: s}}
  msd_0p5: {quantity: mean_squared_displacement, unit: um^2, curve: {quantity: simulation_time, unit: s}}
  msd_1: {quantity: mean_squared_displacement, unit: um^2, curve: {quantity: simulation_time, unit: s}}
  msd_2: {quantity: mean_squared_displacement, unit: um^2, curve: {quantity: simulation_time, unit: s}}
  msd_4: {quantity: mean_squared_displacement, unit: um^2, curve: {quantity: simulation_time, unit: s}}
  msd_8: {quantity: mean_squared_displacement, unit: um^2, curve: {quantity: simulation_time, unit: s}}
  t_cut: {quantity: simulation_time, unit: s}
outputs:
  nu_vs_chi: {quantity: anomalous_diffusion_exponent, unit: dimensionless, curve: {quantity: turnover_scaling_factor, unit: dimensionless}}
