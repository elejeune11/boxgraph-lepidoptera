id: actin_cylinder_bending_energy_table2b
name: Coarse-grained cylinder bending energy from persistence length (Table 2B footnote b)
role: model
stated:
  page: 60
  printed_page: "S2Tab-2"
  quote: "The bending energy for a cylinder with lcyl (= 27 or 108 nm) in our system was calculated as"
  where: "Table 2B footnote b"
equation: "eps_actin,bending = l_p * k_b * T / l_cyl"
inputs:
  l_p: {quantity: persistence_length, unit: nm}
  k_B_T: {quantity: thermal_energy, unit: pN*nm}
  l_cyl: {quantity: cylinder_segment_length, unit: nm}
outputs:
  eps_bend: {quantity: bending_energy_parameter, unit: pN*nm}
