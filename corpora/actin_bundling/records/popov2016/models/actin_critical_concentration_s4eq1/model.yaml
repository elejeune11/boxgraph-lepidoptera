id: actin_critical_concentration_s4eq1
name: Analytical steady-state critical actin monomer concentration (S4 Text Eq. 1)
role: model
stated:
  page: 50
  printed_page: "S4-2"
  quote: "solved analytically by using the polymerization and depolymerization rates of actin filaments in the simulation"
  where: "S4 Text Eq. 1"
equation: "[A_c] = (k_actin,depoly,+ + k_actin,depoly,-) / (k_actin,poly,+ + k_actin,poly,-)"
inputs:
  k_depoly_plus: {quantity: actin_depolymerization_rate, unit: 1/s}
  k_depoly_minus: {quantity: actin_depolymerization_rate, unit: 1/s}
  k_poly_plus: {quantity: bimolecular_rate_constant, unit: uM^-1*s^-1}
  k_poly_minus: {quantity: bimolecular_rate_constant, unit: uM^-1*s^-1}
outputs:
  A_c: {quantity: actin_concentration, unit: uM}
