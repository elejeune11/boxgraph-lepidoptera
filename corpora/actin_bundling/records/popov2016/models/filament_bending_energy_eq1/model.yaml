id: filament_bending_energy_eq1
name: Polymer angular bending potential between consecutive cylinders (Eq. 1)
role: model
stated:
  page: 8
  printed_page: "8"
  quote: "use an angular potential between consecutive cylinders in the polymer chain, written as"
  where: "Eq. 1"
equation: "U_i^bend = eps_bend * [1 - cos(theta_{i,i+1})]"
inputs:
  eps_bend: {quantity: bending_energy_parameter, unit: pN*nm}
  theta: {quantity: inter_cylinder_angle, unit: rad}
outputs:
  U_bend: {quantity: mechanical_potential_energy, unit: pN*nm}
