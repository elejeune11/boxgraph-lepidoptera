id: single_filament_cg_benchmark
name: Single-filament 50 pN central point-load coarse-graining benchmark (S4 Text Section B)
role: model
stated:
  page: 51
  printed_page: "S4-3"
  quote: "equilibrated a single filament with length L = 1 µm with fixed endpoints undergoing a point force of 50 pN at its center"
  where: "S4 Text Section B"
inputs:
  L: {quantity: filament_length, unit: um}
  F_center: {quantity: external_force, unit: pN}
  l_p: {quantity: persistence_length, unit: um}
  l_mon: {quantity: monomer_length, unit: nm}
  l_cyl: {quantity: cylinder_segment_length, unit: nm}
  K_str: {quantity: stretching_stiffness, unit: pN/nm}
  g_tol: {quantity: gradient_minimization_tolerance, unit: pN}
outputs:
  e_d: {quantity: relative_displacement_error, unit: dimensionless}
runnable: false
stochastic: false
not_runnable_reason: >
  S4 Text Section B does not specify key algorithmic details required to reproduce the CG
  equilibration curves in S4 Fig. 4: whether the stopping tolerance g_tol is applied to L2 or
  L-infinity gradient norm, whether fixed endpoints are pinned or clamped, what initial deflection
  profile starts the conjugate gradient solver, and whether K_actin,str = 100 pN/nm is held constant
  or rescaled inversely with segment length l_cyl.
