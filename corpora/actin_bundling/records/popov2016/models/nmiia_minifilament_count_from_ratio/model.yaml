id: nmiia_minifilament_count_from_ratio
name: NMIIA mini-filament copy number from R_m:a and actin concentration (S2 Text Section C)
role: model
reconstructed: >
  S2 Text Section C (p. 43) reports 2-8 NMIIA mini-filaments in the 1 um^3 simulation box for
  R_m:a = 0.005 to 0.02 at [A] = 20 uM without stating the formula or myosin-II-per-mini-filament
  stoichiometry; this stoichiometric conversion evaluates N_minifil = R_m:a * [A] * N_A * V / N_mol.
stated:
  page: 43
  printed_page: "S2-2"
  quote: "With the given concentrations simulated, which correspond to between 2-8 NMIIA mini-filaments"
  where: "S2 Text Section C"
equation: "N_minifil = R_ma * [A] * N_A * V / N_mol"
inputs:
  R_ma: {quantity: molar_concentration_ratio, unit: dimensionless}
  A_tot: {quantity: actin_concentration, unit: uM}
  V: {quantity: simulation_box_volume, unit: um^3}
  N_mol: {quantity: myosin_molecules_per_minifilament, unit: dimensionless}
outputs:
  N_minifil: {quantity: motor_minifilament_count, unit: dimensionless}
