id: filament_stretching_energy_eq2
name: Cylindrical polymer segment axial stretching potential (Eq. 2)
role: model
stated:
  page: 8
  printed_page: "8"
  quote: "The stretching energy corresponding to deformations of the ith cylinder can be represented as"
  where: "Eq. 2"
equation: "U_i^str = (1/2) * K_str * (|l_i| - l_0)^2"
inputs:
  K_str: {quantity: stretching_stiffness, unit: pN/nm}
  l: {quantity: cylinder_instantaneous_length, unit: nm}
  l_0: {quantity: cylinder_segment_length, unit: nm}
outputs:
  U_str: {quantity: mechanical_potential_energy, unit: pN*nm}
