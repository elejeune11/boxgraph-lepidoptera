id: filament_displacement_error_s4eq2
name: Normalized single-filament midpoint displacement error (S4 Text Eq. 2)
role: processing
stated:
  page: 52
  printed_page: "S4-4"
  quote: "displacement error of the filament after mechanical equilibration ed is shown for various coarse-grained cylindrical"
  where: "S4 Text Eq. 2"
equation: "e_d = |x_bs - x_cg| / L"
inputs:
  x_bs: {quantity: filament_midpoint_position, unit: nm}
  x_cg: {quantity: filament_midpoint_position, unit: nm}
  L: {quantity: filament_length, unit: nm}
outputs:
  e_d: {quantity: relative_displacement_error, unit: dimensionless}
