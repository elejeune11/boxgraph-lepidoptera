id: curve_terminal_value_conc
name: Extract terminal (t = 10 s) diffusing G-actin concentration from digitized S4 Fig. 2
role: processing
stated:
  none: "Reader processing helper extracting the final t = 10 s diffusing G-actin concentration from a digitized S4 Fig. 2 time series for comparison with S4 Text Eq. 1 and the printed ~0.4 uM claim."
equation: "A_final = [A](t_max)"
inputs:
  conc_curve: {quantity: actin_concentration, unit: uM, curve: {quantity: simulation_time, unit: s}}
outputs:
  A_final: {quantity: actin_concentration, unit: uM}
