id: medyan_3d_actomyosin_simulator
name: 3D MEDYAN coupled stochastic reaction-diffusion and mechanical equilibration simulator
role: model
stated:
  page: 13
  printed_page: "13"
  quote: "In a MEDYAN simulation, the chemical and mechanical models work in tandem to evolve an active network in time"
  where: "Models / Mechanochemical coupling, Fig. 4"
inputs:
  V: {quantity: simulation_box_volume, unit: um^3}
  A_tot: {quantity: actin_concentration, unit: uM}
  N_fil: {quantity: filament_count, unit: dimensionless}
  R_ma: {quantity: molar_concentration_ratio, unit: dimensionless}
  R_aa: {quantity: molar_concentration_ratio, unit: dimensionless}
  t_sim: {quantity: simulation_time, unit: s}
  l_comp: {quantity: compartment_length, unit: nm}
  t_min: {quantity: minimization_timestep, unit: s}
  g_tol: {quantity: gradient_minimization_tolerance, unit: pN}
outputs:
  L_mean: {quantity: filament_length, unit: um}
  Rg: {quantity: network_radius_of_gyration, unit: um}
  S: {quantity: nematic_order_parameter, unit: dimensionless}
  A_ss: {quantity: actin_concentration, unit: uM}
settings:
  n_trajectories: 16
  seed: unstated
runnable: false
stochastic: true
not_runnable_reason: >
  Full 3D many-body coupled Next Reaction Method RDME and conjugate-gradient mechanical equilibration
  simulation implemented in the external C++ MEDYAN software package (www.medyan.org; 12 h to 6 days
  serial wall-clock runtime per trajectory per S4 Text Section C, p. 53). Random seeds, initial
  nucleated filament positions/orientations, and CG line-search tolerances are not printed in the paper.
