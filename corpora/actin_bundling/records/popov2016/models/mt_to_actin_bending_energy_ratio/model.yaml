id: mt_to_actin_bending_energy_ratio
name: Microtubule-to-actin cylindrical segment bending energy ratio (S4 Text Section B)
role: model
from_words: true
stated:
  page: 52
  printed_page: "S4-4"
  quote: "increased in comparison to the bending energy of an actin filament cylindrical segment by a factor of over 1000"
  where: "S4 Text Section B"
equation: "ratio_same_monomers = (l_p_MT / l_mon_MT) / (l_p_actin / l_mon_actin); ratio_same_length = l_p_MT / l_p_actin"
inputs:
  l_p_MT: {quantity: persistence_length, unit: um}
  l_mon_MT: {quantity: monomer_length, unit: nm}
  l_p_actin: {quantity: persistence_length, unit: um}
  l_mon_actin: {quantity: monomer_length, unit: nm}
outputs:
  ratio_same_monomers: {quantity: bending_energy_ratio, unit: dimensionless}
  ratio_same_length: {quantity: bending_energy_ratio, unit: dimensionless}
