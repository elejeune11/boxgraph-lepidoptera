id: actin_treadmilling_turnover_rate
name: Steady-state actin filament treadmilling turnover rate scaled by chi (p. 22 & S4 Eq. 1)
role: model
from_words: true
stated:
  page: 22
  printed_page: "22"
  quote: "vary the reaction constants used for polymerization and depolymerization of actin filaments kactin,poly and kactin, depoly at both the plus and minus ends of the filament by a constant factor χ"
  where: "Results / Actin filament polarity alignment"
equation: "J_tm = chi * (k_actin,poly,+ * [A_c] - k_actin,depoly,+)"
inputs:
  chi: {quantity: turnover_scaling_factor, unit: dimensionless}
  k_poly_plus: {quantity: bimolecular_rate_constant, unit: uM^-1*s^-1}
  k_depoly_plus: {quantity: actin_depolymerization_rate, unit: 1/s}
  A_c: {quantity: actin_concentration, unit: uM}
outputs:
  J_tm: {quantity: actin_turnover_rate, unit: 1/s}
