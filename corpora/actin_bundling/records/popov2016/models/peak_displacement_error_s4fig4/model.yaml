id: peak_displacement_error_s4fig4
name: Extract peak normalized displacement error across coarse-graining levels in S4 Fig. 4
role: processing
stated:
  none: "Reader processing helper extracting the maximum normalized midpoint displacement error e_d (in percent) from a digitized S4 Fig. 4 series to test the caption claim of < 5%."
equation: "e_d,max = 100 * max(e_d)"
inputs:
  err_curve: {quantity: relative_displacement_error, unit: percent, curve: {quantity: segment_monomer_count, unit: dimensionless}}
outputs:
  max_e_d: {quantity: relative_displacement_error, unit: percent}
