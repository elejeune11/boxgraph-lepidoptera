id: extract_nu_at_chi
name: Extract anomalous diffusion exponent nu at a specified chi from digitized Fig. 12B
role: processing
stated:
  none: "Reader curve-lookup helper selecting the Fig. 12B exponent nu(chi) at a given turnover factor chi to evaluate Main Text Eq. 15."
equation: "nu = nu_Fig12B(chi)"
inputs:
  nu_curve: {quantity: anomalous_diffusion_exponent, unit: dimensionless, curve: {quantity: turnover_scaling_factor, unit: dimensionless}}
  chi: {quantity: turnover_scaling_factor, unit: dimensionless}
outputs:
  nu: {quantity: anomalous_diffusion_exponent, unit: dimensionless}
