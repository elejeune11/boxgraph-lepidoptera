id: actin_aspect_ratio_p8
name: Polymer persistence-length-to-diameter aspect ratio (p. 8)
role: model
from_words: true
stated:
  page: 8
  printed_page: "8"
  quote: "in the case of actin filaments, lp/σ0   103"
  where: text
equation: "aspect_ratio = l_p / sigma_0"
inputs:
  l_p: {quantity: persistence_length, unit: nm}
  sigma_0: {quantity: polymer_diameter, unit: nm}
outputs:
  aspect_ratio: {quantity: aspect_ratio, unit: dimensionless}
