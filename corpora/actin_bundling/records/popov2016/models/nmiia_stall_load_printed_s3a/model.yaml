id: nmiia_stall_load_printed_s3a
name: NMIIA stall-condition external force as printed in S3 Text Section A (p. 46)
role: model
stated:
  page: 46
  printed_page: "S3-3"
  quote: "Under stall conditions (i.e. Fext = ρKNMIIA,stretching dstep ), the model gives a loaded attachment time"
  where: "S3 Text Section A"
equation: "F_ext = rho * K_NMIIA,stretching * d_step"
inputs:
  rho: {quantity: motor_duty_ratio, unit: dimensionless}
  K_head: {quantity: stretching_stiffness, unit: pN/nm}
  d_step: {quantity: motor_head_step_size, unit: nm}
outputs:
  F_ext: {quantity: external_force, unit: pN}
