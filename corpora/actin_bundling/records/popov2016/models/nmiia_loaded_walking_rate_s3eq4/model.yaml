id: nmiia_loaded_walking_rate_s3eq4
name: Force-dependent NMIIA mini-filament Hill walking rate and velocity (S3 Text Eq. 4)
role: model
stated:
  page: 45
  printed_page: "S3-2"
  quote: "the walking rate of a NMIIA mini-filament under a constant external load can be written as"
  where: "S3 Text Eq. 4"
equation: "k_ens,walk = k_ens,walk^0 * (F_stall - F_ext / N_total) / (F_stall + F_ext / (N_total * zeta)); v_walk = k_ens,walk * d_step"
inputs:
  k_ens_walk_0: {quantity: motor_walking_rate, unit: 1/s}
  F_stall: {quantity: motor_head_stall_force, unit: pN}
  F_ext: {quantity: external_force, unit: pN}
  N_total: {quantity: motor_total_head_count, unit: dimensionless}
  zeta: {quantity: nmiia_stall_fit_parameter, unit: dimensionless}
  d_step: {quantity: motor_head_step_size, unit: nm}
outputs:
  k_ens_walk: {quantity: motor_walking_rate, unit: 1/s}
  v_walk: {quantity: motor_walking_velocity, unit: nm/s}
described_from: ref-103
