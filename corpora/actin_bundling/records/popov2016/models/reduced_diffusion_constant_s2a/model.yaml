id: reduced_diffusion_constant_s2a
name: Scaled diffusion constant of cross-linkers and motors relative to G-actin (S2 Text Section A)
role: model
from_words: true
stated:
  page: 42
  printed_page: "S2-1"
  quote: "assume both of these molecules have a diffusion constant D that is a factor of 10 and 100 less than the diffusion constant of actin"
  where: "S2 Text Section A"
equation: "D_species = D_actin / factor"
inputs:
  D_actin: {quantity: diffusion_constant, unit: um^2/s}
  factor: {quantity: diffusion_reduction_factor, unit: dimensionless}
outputs:
  D_species: {quantity: diffusion_constant, unit: um^2/s}
