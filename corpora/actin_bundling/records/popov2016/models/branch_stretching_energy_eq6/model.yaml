id: branch_stretching_energy_eq6
name: Polymer branching junction stretching potential (Eq. 6)
role: model
stated:
  page: 10
  printed_page: "10"
  quote: "The first term in Eq 5, which is a potential securing cylinder j to a branching point on cylinder i, can be written as"
  where: "Eq. 6"
equation: "U_ij^{branch,str} = K_{branch,str} * (|d_ij| - d_0)^2"
inputs:
  K_branch_str: {quantity: stretching_stiffness, unit: pN/nm}
  d_ij: {quantity: branch_junction_distance, unit: nm}
  d_0: {quantity: branch_equilibrium_distance, unit: nm}
outputs:
  U_branch_str: {quantity: mechanical_potential_energy, unit: pN*nm}
