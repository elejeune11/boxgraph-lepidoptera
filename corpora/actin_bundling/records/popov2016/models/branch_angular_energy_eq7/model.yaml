id: branch_angular_energy_eq7
name: Polymer branching junction angular bending potential (Eq. 7)
role: model
stated:
  page: 11
  printed_page: "11"
  quote: "The second term in Eq 5 describes an angular potential at the chosen branching point between cylinders i and j"
  where: "Eq. 7"
equation: "U_ij^{branch,ang} = eps_{branch,ang} * [1 - cos(theta_{i,j} - theta_0)]"
inputs:
  eps_branch_ang: {quantity: bending_energy_parameter, unit: pN*nm}
  theta: {quantity: inter_cylinder_angle, unit: rad}
  theta_0: {quantity: equilibrium_branch_angle, unit: rad}
outputs:
  U_branch_ang: {quantity: mechanical_potential_energy, unit: pN*nm}
