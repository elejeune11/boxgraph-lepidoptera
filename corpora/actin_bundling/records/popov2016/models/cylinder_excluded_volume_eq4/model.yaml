id: cylinder_excluded_volume_eq4
name: Analytical cylindrical excluded volume repulsion potential for parallel segments (Eq. 4)
role: model
stated:
  page: 10
  printed_page: "10"
  quote: "Taking this into account, and writing a similar parametric equation for cylinder j, Eq 3 can be written as"
  where: "Eq. 4"
equation: "U_ij^vol = K_vol * int_0^1 int_0^1 ds dt / |r_i(t) - r_j(s)|^4 = K_vol * atan(l_0 / d) / (d^3 * l_0) [parallel equal-length cylinders]"
inputs:
  K_vol: {quantity: excluded_volume_constant_eq4, unit: pN*nm^5}
  l_0: {quantity: cylinder_segment_length, unit: nm}
  d: {quantity: cylinder_separation_distance, unit: nm}
outputs:
  U_vol: {quantity: mechanical_potential_energy, unit: pN*nm}
