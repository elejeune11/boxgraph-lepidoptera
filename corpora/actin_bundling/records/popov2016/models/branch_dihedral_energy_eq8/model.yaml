id: branch_dihedral_energy_eq8
name: Polymer branching junction dihedral potential (Eq. 8)
role: model
stated:
  page: 11
  printed_page: "11"
  quote: "Finally, the last term in Eq 5 describes a dihedral potential between cylinders i and j"
  where: "Eq. 8"
equation: "U_ij^{branch,dihed} = eps_{branch,dihed} * [1 - cos(phi_{i,j} - phi_0)]"
inputs:
  eps_branch_dihed: {quantity: bending_energy_parameter, unit: pN*nm}
  phi: {quantity: branch_dihedral_angle, unit: rad}
  phi_0: {quantity: branch_dihedral_angle, unit: rad}
outputs:
  U_branch_dihed: {quantity: mechanical_potential_energy, unit: pN*nm}
