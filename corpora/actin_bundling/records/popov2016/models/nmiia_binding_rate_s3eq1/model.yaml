id: nmiia_binding_rate_s3eq1
name: NMIIA mini-filament binding rate (S3 Text Eq. 1)
role: model
stated:
  page: 45
  printed_page: "S3-2"
  quote: "The binding rate of a NMIIA mini-filament to a pair of actin filaments can be defined as"
  where: "S3 Text Eq. 1"
equation: "k_fil,bind = alpha * k_NMIIA,bind * N_total"
inputs:
