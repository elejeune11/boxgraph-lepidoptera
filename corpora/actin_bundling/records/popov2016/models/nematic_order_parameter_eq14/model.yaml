id: nematic_order_parameter_eq14
name: Actin filament nematic ordering tensor and order parameter S (Eq. 14)
role: processing
stated:
  page: 21
  printed_page: "21"
  quote: "define an orientational order parameter S of the system of actin filaments, which is the largest eigenvalue of the ordering tensor Q"
  where: "Eq. 14"
equation: "Q_ab = (3/2) * ( (1/N) * sum_{i=0}^{N} u_{i,a} u_{i,b} - (1/3) delta_ab ); S = max_eig(Q)"
inputs:
  N_fil: {quantity: filament_count, unit: dimensionless}
outputs:
  S: {quantity: nematic_order_parameter, unit: dimensionless}
described_from: ref-114
runnable: false
stochastic: false
not_runnable_reason: >
  Evaluates the largest eigenvalue of the 3x3 nematic tensor Q constructed from individual filament
  minus-to-plus unit direction vectors u_i across all N filaments; the 3D filament coordinate
  trajectories are hosted externally (DRUM doi:10.13016/M2W16B) and are not printed in the paper.
  Note also that printed Eq. 14 sums from i=0 to N (N+1 terms) with prefactor 1/N.
