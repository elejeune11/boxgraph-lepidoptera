id: motor_crosslinker_stretching_energy_eq9
name: Implicit molecular motor and passive cross-linker harmonic stretching potential (Eq. 9)
role: model
stated:
  page: 12
  printed_page: "12"
  quote: "To describe the stretching energy of a bond created by an implicit motor, we introduce the following harmonic potential"
  where: "Eq. 9"
equation: "U_ij^motor = (1/2) * K_motor * (|l_ij^m| - l_0^m)^2"
inputs:
  K_motor: {quantity: stretching_stiffness, unit: pN/nm}
  l_m: {quantity: linker_instantaneous_length, unit: nm}
  l_0m: {quantity: linker_equilibrium_length, unit: nm}
outputs:
  U_motor: {quantity: mechanical_potential_energy, unit: pN*nm}
