id: alpha_actinin_slip_bond_s3eq6
name: Alpha-actinin cross-linker slip-bond unbinding rate (S3 Text Eq. 6)
role: model
stated:
  page: 46
  printed_page: "S3-3"
  quote: "The rate of unbinding will be affected by the pulling force on the cross-linker, and can be expressed as"
  where: "S3 Text Eq. 6"
equation: "k_alpha,unbind = k_alpha,unbind^0 * exp(F_ext / F_alpha,unbind)"
inputs:
  k_unbind_0: {quantity: crosslinker_unbinding_rate, unit: 1/s}
  F_ext: {quantity: external_force, unit: pN}
  F_unbind: {quantity: characteristic_unbinding_force, unit: pN}
outputs:
  k_unbind: {quantity: crosslinker_unbinding_rate, unit: 1/s}
