id: nmiia_head_stall_force_table2c
name: Single NMIIA head stall force from stiffness and step size (Table 2C footnote a)
role: model
stated:
  page: 61
  printed_page: "S2Tab-3"
  quote: "Calculated as KNMIIA,stretching · dNMIIA,step"
  where: "Table 2C footnote a"
equation: "F_stall = K_NMIIA,stretching * d_NMIIA,step"
inputs:
  K_head: {quantity: stretching_stiffness, unit: pN/nm}
  d_step: {quantity: motor_head_step_size, unit: nm}
outputs:
  F_stall: {quantity: motor_head_stall_force, unit: pN}
