id: actin_minus_end_turnover_rate
name: Minus-end actin depolymerization turnover rate at steady-state [G-actin] (p. 22 & S2 Text p. 42)
role: model
reconstructed: >
  Under boundary Brownian-ratchet loading, plus-end polymerization is locally slowed and steady-state
  G-actin rises slightly above analytical [A_c] = 0.17 uM (to ~0.2 uM per S2 Text p. 42), so net
  filament treadmilling flux equals the unhindered minus-end shrinkage rate chi * (k_depoly,- - k_poly,- * [A_ss]).
stated:
  page: 22
  printed_page: "22"
  quote: "resulting in actin filament turnover rates of 0.07 to 4.4 monomers per s"
  where: "Results / Actin filament polarity alignment"
equation: "J_minus = chi * (k_actin,depoly,- - k_actin,poly,- * [A_ss])"
inputs:
  chi: {quantity: turnover_scaling_factor, unit: dimensionless}
  k_depoly_minus: {quantity: actin_depolymerization_rate, unit: 1/s}
  k_poly_minus: {quantity: bimolecular_rate_constant, unit: uM^-1*s^-1}
  A_ss: {quantity: actin_concentration, unit: uM}
outputs:
  J_minus: {quantity: actin_turnover_rate, unit: 1/s}
