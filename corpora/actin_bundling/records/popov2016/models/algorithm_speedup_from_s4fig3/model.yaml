id: algorithm_speedup_from_s4fig3
name: Compute Gillespie-to-NRM wall-clock speedup ratio from digitized S4 Fig. 3
role: processing
stated:
  none: "Reader processing helper computing wall-clock speedup ratio t_Gillespie / t_NRM at t = 10 s and peak across t = 1..10 s from digitized S4 Fig. 3 to check the >100-fold speedup claim."
equation: "speedup = t_Gillespie(t) / t_NRM(t)"
inputs:
  t_gillespie: {quantity: computation_time, unit: s, curve: {quantity: simulation_time, unit: s}}
  t_nrm: {quantity: computation_time, unit: s, curve: {quantity: simulation_time, unit: s}}
outputs:
  speedup_t10: {quantity: algorithm_speedup_ratio, unit: dimensionless}
  speedup_max: {quantity: algorithm_speedup_ratio, unit: dimensionless}
