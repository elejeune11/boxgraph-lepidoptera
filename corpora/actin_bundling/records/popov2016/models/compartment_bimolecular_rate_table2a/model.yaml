id: compartment_bimolecular_rate_table2a
name: Macroscopic-to-compartment bimolecular rate conversion (Table 2A footnote *)
role: model
from_words: true
stated:
  page: 59
  printed_page: "S2Tab-1"
  quote: "The value in brackets is the constant used in simulation, calculated based on a compartment volume of (500 nm)3"
  where: "Table 2A footnote *"
equation: "k_sim = k_macro / (N_A * l_comp^3)"
inputs:
  k_macro: {quantity: bimolecular_rate_constant, unit: uM^-1*s^-1}
  l_comp: {quantity: compartment_length, unit: nm}
outputs:
  k_sim: {quantity: compartment_bimolecular_rate, unit: 1/s}
