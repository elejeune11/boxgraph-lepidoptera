id: nmiia_unloaded_walking_rate_s3eq5
name: Unloaded NMIIA mini-filament walking step rate, velocity, and cylinder-step rate (S3 Text Eq. 5)
role: model
stated:
  page: 46
  printed_page: "S3-3"
  quote: "which is the walking rate under no load, can be approximated, as by Erdmann et al."
  where: "S3 Text Eq. 5"
equation: "k_ens,walk^0 = ((N_total - N_bound^0) / N_bound^0) * k_NMIIA,bind; v_walk^0 = k_ens,walk^0 * d_step; k_walk,cyl^0 = k_ens,walk^0 * (d_step / l_site)"
inputs:
  N_total: {quantity: motor_total_head_count, unit: dimensionless}
  rho: {quantity: motor_duty_ratio, unit: dimensionless}
  k_bind: {quantity: motor_head_binding_rate, unit: 1/s}
  d_step: {quantity: motor_head_step_size, unit: nm}
  l_site: {quantity: binding_site_spacing, unit: nm}
outputs:
  k_ens_walk_0: {quantity: motor_walking_rate, unit: 1/s}
  v_walk_0: {quantity: motor_walking_velocity, unit: nm/s}
  k_walk_cyl_0: {quantity: motor_walking_rate, unit: 1/s}
described_from: ref-103
