id: actin_brownian_ratchet_s3eq7
name: Actin filament Brownian ratchet polymerization rate under external load (S3 Text Eq. 7)
role: model
stated:
  page: 47
  printed_page: "S3-4"
  quote: "The polymerization rate of a filament tip under external load can be modeled by the Brownian Ratchet [17] with the following form"
  where: "S3 Text Eq. 7"
equation: "k_poly = k_poly^0 * exp(-F_ext / F_actin,poly)"
inputs:
  k_poly_0: {quantity: actin_polymerization_rate_unimolecular, unit: 1/s}
  F_ext: {quantity: external_force, unit: pN}
  F_actin_poly: {quantity: characteristic_polymerization_force, unit: pN}
outputs:
  k_poly: {quantity: actin_polymerization_rate_unimolecular, unit: 1/s}
described_from: ref-101
