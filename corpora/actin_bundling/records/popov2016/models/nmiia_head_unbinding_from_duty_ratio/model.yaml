id: nmiia_head_unbinding_from_duty_ratio
name: Single NMIIA head unloaded unbinding rate from duty ratio (Table 2A footnote c)
role: model
from_words: true
stated:
  page: 59
  printed_page: "S2Tab-1"
  quote: "This rate was calculated based on kNMIIA,bind , determined by Kovacs et al. [2], as well as the known duty ratio of NMIIA"
  where: "Table 2A footnote c"
equation: "k_NMIIA,unbind^0 = k_NMIIA,bind * (1 - rho) / rho"
inputs:
  k_bind: {quantity: motor_head_binding_rate, unit: 1/s}
  rho: {quantity: motor_duty_ratio, unit: dimensionless}
outputs:
  k_unbind_0: {quantity: motor_head_unbinding_rate, unit: 1/s}
described_from: ref-81
