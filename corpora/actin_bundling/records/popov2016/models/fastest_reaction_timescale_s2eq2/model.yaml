id: fastest_reaction_timescale_s2eq2
name: Fastest chemical reaction timescale for Kuramoto length (S2 Text Eq. 2)
role: model
stated:
  page: 42
  printed_page: "S2-1"
  quote: "with an initial concentration of [A] = 20 µM , the timescale of this reaction is"
  where: "S2 Text Eq. 2"
equation: "tau = 1 / (k_actin,poly,+ * [A])"
inputs:
  k_poly_plus: {quantity: bimolecular_rate_constant, unit: uM^-1*s^-1}
  A: {quantity: actin_concentration, unit: uM}
outputs:
  tau: {quantity: reaction_timescale, unit: s}
