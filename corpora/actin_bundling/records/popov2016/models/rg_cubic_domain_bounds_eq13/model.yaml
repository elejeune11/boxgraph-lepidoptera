id: rg_cubic_domain_bounds_eq13
name: Geometric bounds on Eq. 13 network radius of gyration inside a cubic domain
role: model
reconstructed: >
  Full 3D cylinder coordinates from the MEDYAN trajectories are not printed in the paper.
  For any set of points r_i confined inside a cube [0, L]^3, Eq. 13 (R_g = sqrt((1/n) sum |r_i - r_GC|^2))
  satisfies R_g = L / 2 for a uniform spatial distribution and the exact Popoviciu upper bound
  R_g <= sqrt(3) * L / 2 = 0.8660 * L for any point configuration inside the cube.
stated:
  page: 17
  printed_page: "17"
  quote: "define an actomyosin network radius of gyration using all coarse-grained actin filament cylinder segments in the network"
  where: "Eq. 13"
equation: "R_g,uniform = L / 2; R_g,max = (sqrt(3) / 2) * L"
inputs:
  L: {quantity: simulation_box_length, unit: um}
outputs:
  Rg_uniform: {quantity: network_radius_of_gyration, unit: um}
  Rg_max: {quantity: network_radius_of_gyration, unit: um}
