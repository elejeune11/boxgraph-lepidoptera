id: mean_filament_length_mass_balance
name: Steady-state mean actin filament length from total actin mass conservation (pp. 17, 25)
role: model
reconstructed: >
  The paper states the resulting average actin filament lengths (0.8 um in the 1 um^3, 20 uM,
  50-filament system on p. 17; 1.4 um in the 27 um^3, 12 uM, 400-filament system on p. 25) from
  MEDYAN simulations without writing an analytical mass-balance formula. This model checks exact
  F-actin monomer conservation: L_mean = (([A]_tot - [A]_ss) * N_A * V / N_fil) * l_mon.
stated:
  page: 17
  printed_page: "17"
  quote: "average actin filament length in these simulations is 0.8 μm"
  where: text
equation: "L_mean = (([A]_tot - [A]_ss) * N_A * V / N_fil) * l_mon"
inputs:
  A_tot: {quantity: actin_concentration, unit: uM}
  A_ss: {quantity: actin_concentration, unit: uM}
  V: {quantity: simulation_box_volume, unit: um^3}
  N_fil: {quantity: filament_count, unit: dimensionless}
  l_mon: {quantity: monomer_length, unit: um}
outputs:
  L_mean: {quantity: filament_length, unit: um}
