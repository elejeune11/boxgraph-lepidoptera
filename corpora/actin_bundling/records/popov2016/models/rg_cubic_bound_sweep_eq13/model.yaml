id: rg_cubic_bound_sweep_eq13
name: Cubic-domain Popoviciu upper bound on Eq. 13 R_g swept over R_alpha:a
role: model
built_from: [rg_cubic_domain_bounds_eq13]
reconstructed: >
  Evaluates the exact Popoviciu upper bound R_g,max = (sqrt(3)/2)*L (and uniform-cube value L/2)
  on Eq. 13 R_g across every R_alpha:a column of Main Fig. 6 to compare the 1x1x1 um^3 hard-wall
  geometric ceiling directly against all 18 digitized Fig. 6 heatmap cells.
stated:
  page: 17
  printed_page: "17"
  quote: "define an actomyosin network radius of gyration using all coarse-grained actin filament cylinder segments in the network"
  where: "Eq. 13"
equation: "R_g,max(R_alpha:a) = (sqrt(3) / 2) * L; R_g,uniform(R_alpha:a) = L / 2"
inputs:
  L: {quantity: simulation_box_length, unit: um}
  R_alpha_a: {quantity: molar_concentration_ratio, unit: dimensionless}
outputs:
  Rg_max: {quantity: network_radius_of_gyration, unit: um}
  Rg_uniform: {quantity: network_radius_of_gyration, unit: um}
