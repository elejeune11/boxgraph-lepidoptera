id: nmiia_unbinding_and_attachment_time_s3eq2
name: NMIIA mini-filament catch-bond unbinding rate and attachment time (S3 Text Eqs. 2-3)
role: model
stated:
  page: 45
  printed_page: "S3-2"
  quote: "Due to the molecule’s catch bond behavior, the unbinding rate of a NMIIA mini-filament from a pair of actin filaments can be written as"
  where: "S3 Text Eqs. 2-3"
equation: "k_fil,unbind = (beta * k_NMIIA,unbind^0 / N_bound) * exp(-F_ext / (N_bound * F_NMIIA,unbind)); tau_att = 1 / k_fil,unbind"
inputs:
  beta: {quantity: nmiia_unbinding_fit_parameter, unit: dimensionless}
  k_unbind_0: {quantity: motor_head_unbinding_rate, unit: 1/s}
  N_bound: {quantity: motor_bound_head_count, unit: dimensionless}
  F_ext: {quantity: external_force, unit: pN}
  F_unbind: {quantity: characteristic_unbinding_force, unit: pN}
outputs:
  k_fil_unbind: {quantity: motor_filament_unbinding_rate, unit: 1/s}
  tau_att: {quantity: motor_attachment_time, unit: s}
described_from: ref-103
