id: compartment_diffusion_rate_s2a
name: Inter-compartment diffusion jump rate (S2 Text Section A)
role: model
from_words: true
stated:
  page: 42
  printed_page: "S2-1"
  quote: "The rate of the diffusion reactions between compartments using this 0.5 µm length"
  where: "S2 Text Section A"
equation: "k_diff = D / l_comp^2"
inputs:
  D: {quantity: diffusion_constant, unit: um^2/s}
  l_comp: {quantity: compartment_length, unit: um}
outputs:
  k_diff: {quantity: compartment_diffusion_rate, unit: 1/s}
