id: nmiia_minifilament_stiffness
name: NMIIA mini-filament stretching constant from head count (Table 2B footnote e)
role: model
from_words: true
stated:
  page: 60
  printed_page: "S2Tab-2"
  quote: "multiplied by the number of heads in the NMIIA ensemble to obtain a mini-filament stretching constant"
  where: "Table 2B footnote e"
equation: "K_minifil = N_total * K_NMIIA,stretching"
inputs:
  N_total: {quantity: motor_total_head_count, unit: dimensionless}
  K_head: {quantity: stretching_stiffness, unit: pN/nm}
outputs:
  K_minifil: {quantity: stretching_stiffness, unit: pN/nm}
