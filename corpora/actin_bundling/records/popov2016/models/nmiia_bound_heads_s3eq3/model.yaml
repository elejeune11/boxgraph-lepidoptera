id: nmiia_bound_heads_s3eq3
name: Implicit bound NMIIA heads under external pulling force (S3 Text Eq. 3)
role: model
stated:
  page: 45
  printed_page: "S3-2"
  quote: "The number of bound heads can be approximated to increase linearly with force in the regime we are considering"
  where: "S3 Text Eq. 3"
equation: "N_bound = rho * N_total + gamma * F_ext"
inputs:
  rho: {quantity: motor_duty_ratio, unit: dimensionless}
  N_total: {quantity: motor_total_head_count, unit: dimensionless}
  gamma: {quantity: bound_heads_force_sensitivity, unit: 1/pN}
  F_ext: {quantity: external_force, unit: pN}
outputs:
  N_bound: {quantity: motor_bound_head_count, unit: dimensionless}
described_from: ref-103
