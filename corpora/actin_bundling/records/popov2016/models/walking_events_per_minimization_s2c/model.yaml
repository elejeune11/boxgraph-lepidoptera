id: walking_events_per_minimization_s2c
name: Expected NMIIA walking events per mechanical equilibration step (S2 Text Section C)
role: model
from_words: true
stated:
  page: 43
  printed_page: "S2-2"
  quote: "choose a tminimization of 0.1 s, which will correspond to 0.1-0.3 walking events per minimization"
  where: "S2 Text Section C"
equation: "N_walk = N_minifil * k_walk_cyl * t_minimization"
inputs:
  N_minifil: {quantity: motor_minifilament_count, unit: dimensionless}
  k_walk_cyl: {quantity: motor_walking_rate, unit: 1/s}
  t_min: {quantity: minimization_timestep, unit: s}
outputs:
  N_walk: {quantity: walking_events_per_minimization, unit: dimensionless}
