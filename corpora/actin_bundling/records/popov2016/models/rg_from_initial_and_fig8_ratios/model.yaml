id: rg_from_initial_and_fig8_ratios
name: Reconstruct final R_g(R_alpha:a) at 2000 s from an initial R_g,i and Fig. 8 R_g,f/R_g,i ratios
role: processing
reconstructed: >
  Multiplies a reference initial network radius of gyration R_g,i (either uniform 1 um^3 cube 0.500 um
  or uniform 3 um^3 cube 1.500 um) by the terminal t = 2000 s values of the six digitized Fig. 8
  R_g,f/R_g,i curves (R_m:a = 0.01) to test consistency between Fig. 6 (absolute R_g) and Fig. 8
  (normalized R_g,f/R_g,i).
stated:
  page: 21
  printed_page: "21"
  quote: "Actomyosin network Rg,f/Rg,i over time for various Rα:a with fixed Rm:a = 0.01"
  where: "Fig. 8 (p. 21) vs Fig. 6 (p. 19)"
equation: "R_g,f(R_alpha:a) = R_g,i * (R_g,f / R_g,i)(t = 2000 s; R_alpha:a)"
inputs:
  Rg_i: {quantity: network_radius_of_gyration, unit: um}
  c_0p01: {quantity: relative_rg_ratio, unit: dimensionless, curve: {quantity: simulation_time, unit: s}}
  c_0p02: {quantity: relative_rg_ratio, unit: dimensionless, curve: {quantity: simulation_time, unit: s}}
  c_0p05: {quantity: relative_rg_ratio, unit: dimensionless, curve: {quantity: simulation_time, unit: s}}
  c_0p1: {quantity: relative_rg_ratio, unit: dimensionless, curve: {quantity: simulation_time, unit: s}}
  c_0p2: {quantity: relative_rg_ratio, unit: dimensionless, curve: {quantity: simulation_time, unit: s}}
  c_0p5: {quantity: relative_rg_ratio, unit: dimensionless, curve: {quantity: simulation_time, unit: s}}
outputs:
  Rg_final: {quantity: network_radius_of_gyration, unit: um, curve: {quantity: molar_concentration_ratio, unit: dimensionless}}
