id: boundary_repulsion_energy_eq11
name: Exponential steric boundary repulsion potential (Eq. 11)
role: model
stated:
  page: 12
  printed_page: "12"
  quote: "describe the interaction between the ith cylinder and the boundary can be written as"
  where: "Eq. 11"
equation: "U_i^boundary = eps_boundary * exp(-d_i / lambda)"
inputs:
  eps_boundary: {quantity: boundary_repulsion_energy, unit: pN*nm}
  d_i: {quantity: boundary_distance, unit: nm}
  lambda_boundary: {quantity: boundary_screening_length, unit: nm}
outputs:
  U_boundary: {quantity: mechanical_potential_energy, unit: pN*nm}
