# ---------------------------------------------------------------------------
# Lengths, volumes, and areas
# ---------------------------------------------------------------------------
- id: persistence_length
  name: polymer persistence length
  dimension: "[length]"
  description: Persistence length l_p of a semi-flexible polymer (F-actin or microtubule).

- id: polymer_diameter
  name: polymer filament diameter
  dimension: "[length]"
  description: Cross-sectional diameter sigma_0 of a cylindrical polymer segment (approx. 6 nm for F-actin).

- id: monomer_length
  name: polymer monomer axial length
  dimension: "[length]"
  description: Contour-length increment l_mon added or removed per monomer (2.7 nm for actin, 2 nm for microtubule).

- id: cylinder_segment_length
  name: cylindrical segment equilibrium length
  dimension: "[length]"
  description: Equilibrium length l_0 or maximum coarse-grained segment length l_cyl of a polymer cylinder (27 nm or 108 nm).

- id: cylinder_instantaneous_length
  name: cylindrical segment instantaneous length
  dimension: "[length]"
  description: Instantaneous end-to-end distance |l_i| of a deformed polymer cylinder in Eq. 2.

- id: cylinder_separation_distance
  name: inter-cylinder separation distance
  dimension: "[length]"
  description: Center-to-center distance d between two neighboring parallel polymer cylinders in Eq. 4.

- id: branch_junction_distance
  name: branching junction instantaneous distance
  dimension: "[length]"
  description: Instantaneous distance |d_ij| between the branching point on a mother cylinder and the endpoint of the daughter cylinder (Eq. 6).

- id: branch_equilibrium_distance
  name: branching junction equilibrium distance
  dimension: "[length]"
  description: Equilibrium distance d_0 of a polymer branching junction potential (Eq. 6).

- id: linker_instantaneous_length
  name: bound motor or cross-linker instantaneous length
  dimension: "[length]"
  description: Instantaneous end-to-end distance |l_ij^m| of a bound molecular motor or passive cross-linker (Eq. 9).

- id: linker_equilibrium_length
  name: bound motor or cross-linker equilibrium length
  dimension: "[length]"
  description: Equilibrium length l_0^m (or binding range) of an NMIIA mini-filament (200 +- 25 nm) or alpha-actinin cross-linker (35 +- 5 nm).

- id: binding_site_spacing
  name: actin filament binding-site spacing
  dimension: "[length]"
  description: Spacing along an actin filament between adjacent binding sites for alpha-actinin and NMIIA (27 nm).

- id: motor_head_step_size
  name: single NMIIA head step size
  dimension: "[length]"
  description: Individual mechanical step size d_step (or d_NMIIA,step) of a single NMIIA motor head (6 nm).

- id: boundary_distance
  name: cylinder endpoint distance to boundary
  dimension: "[length]"
  description: Distance d_i between the system boundary and the closest endpoint of cylinder i (Eq. 11).

- id: boundary_screening_length
  name: boundary repulsion screening length
  dimension: "[length]"
  description: Exponential decay length lambda (lambda_boundary) of the boundary steric repulsion potential (2.7 nm).

- id: kuramoto_length
  name: reaction-diffusion Kuramoto length
  dimension: "[length]"
  description: Kuramoto length l_k = sqrt(6 D tau) defining the well-mixed reaction-diffusion length scale (S2 Text Eq. 1).

- id: compartment_length
  name: reaction-diffusion compartment edge length
  dimension: "[length]"
  description: Side length l_comp of each cubic compartment in the spatially resolved Gillespie grid (500 nm).

- id: simulation_box_length
  name: simulation domain edge length
  dimension: "[length]"
  description: Side length L of the cubic simulation domain (1 um or 3 um).

- id: simulation_box_volume
  name: simulation domain volume
  dimension: "[length] ** 3"
  description: Volume V of the cubic simulation domain (1 um^3 or 27 um^3).

- id: filament_length
  name: polymer filament contour length
  dimension: "[length]"
  description: Contour length L of a single filament (benchmark 1 um) or steady-state mean actin filament length (0.8 um or 1.4 um).

- id: network_radius_of_gyration
  name: actomyosin network radius of gyration
  dimension: "[length]"
  description: Radius of gyration R_g of all actin filament cylinder segments in the network (Eq. 13).

- id: filament_midpoint_position
  name: equilibrated single-filament midpoint position
  dimension: "[length]"
  description: Equilibrated position x_bs or x_cg of the filament center point (L/2) under a 50 pN central load (S4 Text Eq. 2).

- id: mean_squared_displacement
  name: actin filament mean squared displacement
  dimension: "[length] ** 2"
  description: Mean squared displacement <Delta x^2> of actin filament geometric centers over time (Eq. 15).

# ---------------------------------------------------------------------------
# Angles
# ---------------------------------------------------------------------------
- id: inter_cylinder_angle
  name: angle between polymer cylinders
  dimension: dimensionless
  description: Angle theta_{i,i+1} between consecutive cylinders along a filament (Eq. 1) or theta_{i,j} at a branch (Eq. 7).

- id: equilibrium_branch_angle
  name: equilibrium branching angle
  dimension: dimensionless
  description: Equilibrium Arp2/3 branching angle theta_0 between mother and daughter actin filaments (~70 deg, Eq. 7).

- id: branch_dihedral_angle
  name: branching dihedral angle
  dimension: dimensionless
  description: Dihedral angle phi_{i,j} (or equilibrium phi_0) between mother-branch and daughter-branch planes (Eq. 8).

# ---------------------------------------------------------------------------
# Energies, stiffnesses, and forces
# ---------------------------------------------------------------------------
- id: thermal_energy
  name: thermal energy k_B T
  dimension: "[energy]"
  description: Thermal energy scale k_B T = 4.1 pN*nm reported in Table 2B.

- id: bending_energy_parameter
  name: polymer bending energy parameter
  dimension: "[energy]"
  description: Angular or dihedral bending energy constant epsilon_bend, epsilon_actin,bend, epsilon_branch,ang, or epsilon_branch,dihed.

- id: boundary_repulsion_energy
  name: boundary steric repulsion energy amplitude
  dimension: "[energy]"
  description: Repulsive energy prefactor epsilon_boundary of the exponential boundary wall potential (Eq. 11).

- id: mechanical_potential_energy
  name: mechanical interaction potential energy
  dimension: "[energy]"
  description: Evaluated potential energy U of a mechanical element (bending, stretching, excluded volume, branch, motor/cross-linker, or boundary).

- id: stretching_stiffness
  name: harmonic stretching spring constant
  dimension: "[force] / [length]"
  description: Spring constant K_str, K_branch,str, K_motor, K_NMIIA,stretching (per head or mini-filament), or K_alpha,stretching.

- id: excluded_volume_constant_printed
  name: printed excluded-volume repulsion constant
  dimension: "[force] / [length] ** 4"
  description: Table 2B printed value of K_actin,vol with printed units pN/nm^4 (dimensionally inconsistent with Eq. 4).

- id: excluded_volume_constant_eq4
  name: Eq. 4 excluded-volume repulsion constant
  dimension: "[energy] * [length] ** 4"
  description: Dimensionally consistent excluded-volume repulsion constant K_vol required so Eq. 4 yields energy (pN*nm^5).

- id: external_force
  name: external mechanical load force
  dimension: "[force]"
  description: Pulling, stretching, boundary-load, or benchmark point force F_ext acting on a motor, cross-linker, or filament.

- id: characteristic_unbinding_force
  name: characteristic unbinding force
  dimension: "[force]"
  description: Mechanochemical force scale F_NMIIA,unbind (12.6 pN) or F_alpha,unbind (17.2 pN) for catch- or slip-bond kinetics.

- id: motor_head_stall_force
  name: single NMIIA head stall force
  dimension: "[force]"
  description: Stall force F_stall = K_NMIIA,stretching * d_NMIIA,step of a single NMIIA motor head (15 pN).

- id: characteristic_polymerization_force
  name: characteristic actin polymerization force
  dimension: "[force]"
  description: Brownian ratchet force scale F_actin,poly = k_B T / l_mon (~1.5 pN) for polymerization under load (S3 Text Eq. 7).

- id: gradient_minimization_tolerance
  name: conjugate-gradient force minimization tolerance
  dimension: "[force]"
  description: Force gradient convergence tolerance g_tol (g_tolerance) used in mechanical equilibration (1 pN or 5 pN).

- id: bound_heads_force_sensitivity
  name: bound NMIIA heads force-dependence slope
  dimension: "1 / [force]"
  description: Linear slope parameter gamma (0.05/pN) giving force-induced increase in bound NMIIA heads (S3 Text Eq. 3).

# ---------------------------------------------------------------------------
# Concentrations, diffusion, reaction rates, velocities, and times
# ---------------------------------------------------------------------------
- id: actin_concentration
  name: actin molar concentration
  dimension: "[substance] / [length] ** 3"
  description: Molar concentration of total actin [A], steady-state diffusing G-actin, or analytical critical concentration [A_c].

- id: diffusion_constant
  name: molecular diffusion constant
  dimension: "[length] ** 2 / [time]"
  description: Translational diffusion coefficient D of diffusing G-actin (20 um^2/s), alpha-actinin, or NMIIA mini-filaments.

- id: compartment_diffusion_rate
  name: inter-compartment diffusion jump rate
  dimension: "1 / [time]"
  description: First-order jump rate k_diff = D / l_comp^2 between adjacent 500 nm compartments (80, 8, 0.8 s^-1).

- id: bimolecular_rate_constant
  name: macroscopic bimolecular reaction rate constant
  dimension: "[length] ** 3 / [substance] / [time]"
  description: Second-order macroscopic association rate constant k_actin,poly,+/- or k_alpha,bind in uM^-1 s^-1.

- id: compartment_bimolecular_rate
  name: compartment-level stochastic bimolecular rate
  dimension: "1 / [time]"
  description: Stochastic bimolecular rate constant k_sim = k_macro / (N_A V_comp) used inside a (500 nm)^3 compartment.

- id: actin_depolymerization_rate
  name: actin filament depolymerization rate
  dimension: "1 / [time]"
  description: Unimolecular actin monomer dissociation rate k_actin,depoly,+ (1.4 s^-1) or k_actin,depoly,- (0.8 s^-1).

- id: actin_polymerization_rate_unimolecular
  name: force-dependent actin tip polymerization rate
  dimension: "1 / [time]"
  description: First-order filament tip polymerization rate k_poly (or zero-load k_poly^0) in the Brownian ratchet law (S3 Text Eq. 7).

- id: actin_turnover_rate
  name: actin filament treadmilling turnover rate
  dimension: "1 / [time]"
  description: Steady-state actin filament monomer turnover / treadmilling flux (monomers per second) scaled by chi.

- id: motor_head_binding_rate
  name: single NMIIA head binding rate
  dimension: "1 / [time]"
  description: Unloaded binding rate k_NMIIA,bind (0.2 s^-1) of a single NMIIA head to F-actin.

- id: motor_head_unbinding_rate
  name: single NMIIA head unbinding rate
  dimension: "1 / [time]"
  description: Unloaded unbinding rate k_NMIIA,unbind^0 (1.7 s^-1) of a single NMIIA head from F-actin.

- id: motor_filament_binding_rate
  name: NMIIA mini-filament binding rate
  dimension: "1 / [time]"
  description: Coarse-grained binding rate k_fil,bind of an NMIIA mini-filament to a pair of actin filaments (S3 Text Eq. 1).

- id: motor_filament_unbinding_rate
  name: NMIIA mini-filament unbinding rate
  dimension: "1 / [time]"
  description: Catch-bond unbinding rate k_fil,unbind of an NMIIA mini-filament from a pair of actin filaments (S3 Text Eq. 2).

- id: motor_walking_rate
  name: NMIIA mini-filament walking step rate
  dimension: "1 / [time]"
  description: Head-step walking rate k_ens,walk (or unloaded k_ens,walk^0) or rescaled cylinder-to-cylinder walking rate (~0.4 s^-1).

- id: motor_walking_velocity
  name: NMIIA mini-filament walking velocity
  dimension: "[length] / [time]"
  description: Linear walking velocity v_walk = k_ens,walk * d_step of an NMIIA mini-filament (11 nm/s unloaded, 3 nm/s loaded).

- id: crosslinker_unbinding_rate
  name: alpha-actinin unbinding rate
  dimension: "1 / [time]"
  description: Force-dependent slip-bond unbinding rate k_alpha,unbind (or unloaded k_alpha,unbind^0 = 0.3 s^-1) of alpha-actinin (S3 Text Eq. 6).

- id: reaction_timescale
  name: fastest chemical reaction timescale
  dimension: "[time]"
  description: Characteristic timescale tau = 1 / (k_actin,poly,+ [A]) of the fastest reaction used for Kuramoto length (S2 Text Eq. 2).

- id: motor_attachment_time
  name: NMIIA mini-filament attachment lifetime
  dimension: "[time]"
  description: Mean attachment lifetime tau_att = 1 / k_fil,unbind of a bound NMIIA mini-filament (5 s unloaded, 50 s loaded).

- id: minimization_timestep
  name: chemical time between mechanical equilibrations
  dimension: "[time]"
  description: Chemical evolution interval t_minimization (0.1 s) between consecutive mechanical energy minimizations.

- id: simulation_time
  name: simulation time duration
  dimension: "[time]"
  description: Total or elapsed simulation time (2000 s, 500 s, 10 s, or 1000 s MSD fit window).

# ---------------------------------------------------------------------------
# Dimensionless counts, ratios, fit parameters, and order parameters
# ---------------------------------------------------------------------------
- id: aspect_ratio
  name: polymer persistence-length-to-diameter aspect ratio
  dimension: dimensionless
  description: Ratio l_p / sigma_0 characterizing semi-flexible polymer slenderness (~10^3 for F-actin).

- id: bending_energy_ratio
  name: microtubule-to-actin bending energy ratio
  dimension: dimensionless
  description: Ratio of cylindrical segment bending energy of a microtubule to that of an actin filament (S4 Text Section B).

- id: molar_concentration_ratio
  name: protein-to-actin molar concentration ratio
  dimension: dimensionless
  description: Molar concentration ratio R_m:a (NMIIA:actin) or R_alpha:a (alpha-actinin:actin).

- id: diffusion_reduction_factor
  name: diffusion constant reduction factor
  dimension: dimensionless
  description: Assumed factor (10 for alpha-actinin, 100 for NMIIA) by which D is reduced relative to G-actin (S2 Text Section A).

- id: filament_count
  name: number of nucleated actin filaments
  dimension: dimensionless
  description: Number N of actin filaments nucleated in the simulation domain (50 in 1 um^3, 400 in 27 um^3).

- id: compartment_count_per_axis
  name: RDME compartments per spatial dimension
  dimension: dimensionless
  description: Number N of cubic reaction-diffusion compartments along each Cartesian axis (2 for the 1 um cube, Table 2D).

- id: trajectory_count
  name: number of replicate stochastic trajectories
  dimension: dimensionless
  description: Number of independent stochastic trajectories averaged per parameter set (16 in Results, 4 in S4 benchmarks).

- id: motor_total_head_count
  name: total NMIIA heads per mini-filament side
  dimension: dimensionless
  description: Number N_total (10-30) of implicit NMIIA heads/subunits per side of a bipolar mini-filament.

- id: motor_bound_head_count
  name: bound NMIIA heads per mini-filament
  dimension: dimensionless
  description: Implicit number N_bound (or unloaded N_bound^0 = rho N_total) of currently bound NMIIA heads (S3 Text Eq. 3).

- id: myosin_molecules_per_minifilament
  name: myosin II molecules per mini-filament
  dimension: dimensionless
  description: Stoichiometric number of myosin II molecules assembled into one NMIIA mini-filament (~30).

- id: motor_minifilament_count
  name: number of NMIIA mini-filaments in simulation box
  dimension: dimensionless
  description: Copy number of NMIIA mini-filaments in the 1 um^3 simulation box (2 to 8 across R_m:a = 0.005 to 0.02).

- id: motor_duty_ratio
  name: NMIIA head duty ratio
  dimension: dimensionless
  description: Unloaded duty ratio rho = 0.1 of a single NMIIA motor head (Table 2C).

- id: nmiia_binding_fit_parameter
  name: NMIIA binding kinetics tunable parameter
  dimension: dimensionless
  description: Dimensionless parameter alpha = 1.0 in S3 Text Eq. 1.

- id: nmiia_unbinding_fit_parameter
  name: NMIIA unbinding kinetics tunable parameter
  dimension: dimensionless
  description: Dimensionless parameter beta = 0.2 in S3 Text Eq. 2.

- id: nmiia_stall_fit_parameter
  name: NMIIA stall-force walking parameter
  dimension: dimensionless
  description: Dimensionless Hill-relation curvature parameter zeta = 0.1 in S3 Text Eq. 4.

- id: walking_events_per_minimization
  name: expected NMIIA walking events per minimization
  dimension: dimensionless
  description: Expected number of NMIIA mini-filament cylinder-walking events occurring during one t_minimization interval (0.1-0.3).

- id: turnover_scaling_factor
  name: actin filament turnover scaling factor
  dimension: dimensionless
  description: Constant multiplier chi (0.125 to 8) uniformly scaling actin polymerization and depolymerization rate constants.

- id: nematic_order_parameter
  name: actin filament orientational order parameter
  dimension: dimensionless
  description: Largest eigenvalue S of the nematic ordering tensor Q (Eq. 14), ranging from 0 (isotropic) to 1 (aligned).

- id: anomalous_diffusion_exponent
  name: actin filament anomalous diffusion exponent
  dimension: dimensionless
  description: Power-law exponent nu of filament geometric-center MSD <Delta x^2> ~ t^nu (Eq. 15).

- id: relative_displacement_error
  name: normalized polymer midpoint displacement error
  dimension: dimensionless
  description: Dimensionless equilibration error e_d = |x_bs - x_cg| / L comparing coarse-grained cylinder and bead-spring models (S4 Text Eq. 2).

- id: relative_rg_ratio
  name: normalized network radius of gyration ratio
  dimension: dimensionless
  description: Ratio R_g,f / R_g,i of final (or instantaneous) network radius of gyration to initial network radius of gyration.

- id: computation_time
  name: wall-clock computation or equilibration time
  dimension: "[time]"
  description: Elapsed CPU wall-clock time for stochastic reaction-diffusion (S4 Fig. 3) or single-filament conjugate-gradient equilibration (S4 Fig. 5).

- id: segment_monomer_count
  name: monomers per coarse-grained cylindrical segment
  dimension: dimensionless
  description: Coarse-graining level expressed as number of polymer monomers per cylindrical segment (1 for bead-spring, 10, 20, or 40 monomers in S4 Figs. 4-5).

- id: algorithm_speedup_ratio
  name: reaction-diffusion algorithm computation speedup ratio
  dimension: dimensionless
  description: Wall-clock computation-time ratio t_Gillespie / t_NRM comparing Gillespie DM to NRM (S4 Text Section A and S4 Fig. 3).
