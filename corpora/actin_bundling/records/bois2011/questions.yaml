- id: q_audit_fig5a_L_over_l_irrelevant
  kind: possible_error
  about:
    - asdm_dispersion_pe0
    - Pe_fig5a
  text: >
    Fig. 5(a)'s caption (p. 4) states that the Pe = 0 (absence of flow) ASDM linear stability
    diagram is drawn "assuming L/ell >> 1". However, when Pe = 0, active stress vanishes and
    the hydrodynamic length ell = sqrt(eta/gamma) drops out of Eq. (15) completely
    (A_ij = -k^2 D_i delta_ij + d_{c_j} R_i(c_0)). The continuum-wavenumber assumption
    required for Fig. 5(a) is instead that the domain size L is much larger than the
    reaction-diffusion length scale sqrt(D_s / rho_s), whereas L/ell >> 1 becomes relevant
    only when Pe > 0 (Fig. 5b).
  citation:
