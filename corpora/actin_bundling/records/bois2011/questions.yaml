- id: q_asdm_species1_convention
  kind: unstated_input
  about:
    - asdm_dispersion_eq15
    - asdm_stability_boundary
    - asdm_pde_eq14
  text: >
    Eq. (15) defines Pe = (zeta*Delta_mu)_0 / (D_1 * gamma) in terms of the diffusion
    coefficient of "species 1", without explicitly stating whether species 1 in the
    ASDM (Fig. 5) is the substrate s (D_1 = D_s) or the activator a (D_1 = D_a).
    Numerical checks of Eq. (15) against Fig. 5(b)-(d) (together with tau_D = ell^2 / D_s
    in Fig. 5(c)'s caption) show that the paper uses D_1 = D_s; taking D_1 = D_a shifts
    the Pe = 7 Region I/II boundary at rho_s = 2 from D_a/D_s = 0.84 down to ~0.15 and
    leaves the 'x' point in Fig. 5(b) linearly stable at Pe = 7.
  citation:
    page: 3
    printed_page: "028103-3"
    quote: "where Pe is defined in terms of the diffusion coefficient of"
    where: "Eq. 15"

