    - hannezo2015/fig3b_dist_src42_data
  text: >
    No cross-record validations are entered in validations.yaml for bois2011 models against
    hannezo2015 measurements (0 entries in both directions): bois2011 is a pure theory paper with
    0 origin: measured entries out of 53 total data (32 predicted, 18 reported dimensionless inputs
    or BCs, 3 derived identities), so hannezo2015 has no bois2011 measurements to test against; and
    although hannezo2015 cites bois2011 (ref-10) and shares verified same_as ModelAtlas families
    (hydrodynamic_length, diffusive_timescale, peclet_number_physical, and
    single_species_rda_dispersion_eq15 <-> hannezo2015/dispersion_relation_eq7), none of bois2011's
    26 models genuinely predicts any of hannezo2015's 35 origin: measured data on their own
    experimental conditions:
    (1) Wild-type embryonic ring count hannezo2015/rings_per_cell_embryo_wt ("15 to 20", stage 16):
    (a) single_species_fastest_mode (output n_max, quantity fastest_growing_mode) does not match
    either the quantity or the constitutive/input conditions: n_max is the transient linear
    fastest-growing Fourier mode index rather than Bois's steady-state peak count (p. 3 explicitly
    shows multipeaked transients are unstable and coarsen to 1 peak), and under a single cell's
    physical no-flux BCs (beta = 1, cos(n*pi*x/L)) mode n corresponds to n/2 rings rather than n
    (cf. hannezo2015/finite_domain_critical_mode, n_rings = i_c/2). Furthermore,
    single_species_fastest_mode hardcodes Hill saturating stress f(c) = c/(1+c) with unmeasured
    saturation ratio c_0 (max c_0*f'(c_0) = 1/4 at c_0 = 1, Pe_crit = 4.0002 at L/ell = 480),
    whereas hannezo2015 uses linear active stress (c_0*f'(c_0) = 1) and never directly measures
    active stress, friction, Pe, or L/ell (its SI alpha_sim_si = 480 and chi_c_sim_si = ~1.07 /
    chi_plateau_si = 1.47 are inverted from ring_wavelength_embryo_wt via Hannezo's finite-turnover
    Eqs. 10-11, differing 5x-10x from Main text literature alpha = 100 and Pe = 2.5). Passing
    either Pe = 1.47 (chi_plateau_si) or Pe = 2.5 (Main+SI literature stress/friction) gives
    Pe_eff <= 0.368 or 0.625 < 1 and n_max = 0 for all c_0 > 0; artificially rescaling Pe = 4*chi
    at c_0 = 1 gives n_max = 70 (35 rings, beta = 1) or 35 (beta = 2) at chi = 1.47, 28 (14 rings)
    at onset chi_c = 1.07 (purely circular from Hannezo's turnover-fitted phi = 0.0014), 24 (12
    rings) at Main-text alpha = 100, Pe = 10, and 187 (93.5 rings) at Bois's Pe = 25.
    (b) single_species_pde_eq1_3 (output n_peaks_final, quantity peak_count) assumes zero turnover
    (tau -> oo, contradicted by measured turnover_time_frap = 15 +- 7 s), periodic BCs, hardcoded
    Hill stress f(c) = c/(1+c), and a Fig. 4-specific mode-2 + mode-1 initial condition; with
    hannezo2015's chi_plateau_si = 1.47 it is linearly stable (n_peaks_final = 0), while at
    rescaled Pe = 5.88 on L/ell = 480 the diffusive timescale tau_D = ell^2/D = 2.5 ms places the
    3000 s experiment at T_end = 1.2e6 (giving n_peaks_final = 0 at T_end = 20, and exponentially
    arrested multi-peak states such as n_peaks_final = 6 at alpha = 100, Pe = 10, T_end = 500-2000).
    (c) asdm_pde_eq14 (output n_peaks) models a 2-species autocatalytic Turing reaction (a^2*s - a,
    1 - a^2*s) whose parameters (Da/Ds, rho_a, rho_s) do not exist in hannezo2015's single-species
    first-order actin turnover system.
    (2) ECM-depleted kkv1 mutant ring count hannezo2015/rings_per_cell_kkv1 ("~1", stage 16):
    hannezo2015 measures zero mechanical or transport inputs for kkv1 (no friction xi, viscosity
    eta, hydrodynamic length l_h, cell length l, L/ell, D, active stress, Pe, or c_0), so running
    single_species_fastest_mode or single_species_pde_eq1_3 against rings_per_cell_kkv1 would use
    0/4 or 0/5 inputs from kkv1. Moreover, kkv1's ~1 ring/cell arises physically from drastically
    lowered friction (xi -> 0 pushing finite-turnover lambda_c > l) while retaining active turnover
    and displaying non-stationary chaotic ring motility (Fig. 4A'-B, Movie S3), NOT from Bois's
    zero-turnover (tau -> oo) coarsening at finite friction to a stationary single peak.
    (3) All 10 measured ring/taenidial wavelengths (ring_wavelength_embryo_wt,
    ring_wavelength_si_input, ring_wavelength_larva_wt_early, ring_wavelength_larva_wt_fig1c,
    ring_wavelength_src42, taenidial_wavelength_moesin_rnai, taenidial_wavelength_larva_wt_late,
    ring_wavelength_kkv1, fig3b_bar_ring_spacing_data, figs2d_moesin_rnai_spacing_data): bois2011
    has no model outputting a dimensional pattern wavelength ([length]); its only [length]-valued
    output is hydrodynamic_length (ell = sqrt(eta/gamma), velocity screening length, not ring
    period lambda), while discrete_wavenumber, single_species_fastest_mode, and
    asdm_stability_boundary output dimensionless k*ell. Moreover, bois2011's zero-turnover
    single-species model has no finite onset wavelength (k_c = 0), and hannezo2015 measures no
    cortical mechanical inputs for larval, Src42A, moesin RNAi, or kkv1 conditions.
    (4) All 6 FRAP measurements (turnover_time_frap = 15 +- 7 s, diffusion_coeff_frap = 0.04 +-
    0.03 um^2/s, immobile_fraction_frap < 20%, frap_sample_size = 10, fig2a_frap_recovery_data,
    fig2a_frap_variance_data): D and dR/dc = -1/tau are strictly model inputs in bois2011 (never
    predicted outputs), and bois2011 has no FRAP photobleaching recovery, variance-moment, or
    immobile-fraction model (its only [time] output is diffusive_timescale tau_D = ell^2/D).
    (5) All 7 developmental actin-recruitment measurements (actin_increase_onset_text,
    actin_increase_onset_fig1a, fluorescence_onset_si, fluorescence_plateau_si,
    fig1a_actin_intensity_data, ring_onset_time_range, ramp_duration_si): bulk temporal actin
    upregulation is an external developmental control ramp rather than an active-fluid output
    (bois2011 Eqs. 1-13 conserve mean concentration c_0 = const and do not model developmental
    timing or fluorescence intensity).
    (6) All 7 tube-geometry, gamma-COP, and constriction measurements (cop_het_diameter_change,
    cop_het_actin_change, cop_hom_diameter_change, cop_hom_actin_change,
    fig4f_cop_actin_vs_diameter_data, side_branch_diameter_ratio,
    fig3c_kkv_diameter_vs_actin_data): bois2011 is a flat 1D constant-thickness thin-film theory
    with no cylindrical tube diameter, radial Laplace constriction, apical secretion, or branching.
    (7) Remaining 3 spectral/distributional measurements (fig1c_fourier_spectrum_data,
    fig3b_dist_wt_data, fig3b_dist_src42_data): all bois2011 models are deterministic and output no
    dimensional line-scan Fourier amplitude spectrum or ring-spacing probability histogram.
    (8) Finally, none of the shared same_as family outputs (hydrodynamic_length, growth_rate in
    Eq. 15, diffusive_timescale, peclet_number) has an origin: measured datum in hannezo2015
    (lh_derived_main, lh_inverted_si, and chi_plateau_si are derived; chi_c_order_si and
    chi_c_sim_si are predicted).
