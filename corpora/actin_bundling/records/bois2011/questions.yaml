  text: >
    Calibrated digitization of Fig. 5(d) reveals a major quantitative mismatch between
    the printed steady-state profiles and Eq. (14) evaluated at the 'x' parameters from
    Fig. 5(b) (D_a/D_s = 0.5, rho_a = 1, rho_s = 1.5, Pe = 7, L/ell = 20): Eq. (14)
    predicts a substrate plateau s_max = 2.038 (min s_min = 0.100) and activator peak
    a_max = 5.167, whereas Fig. 5(d) plots s_max = 1.400 +/- 0.052 (min s_min = 0.126)
    and a_max ~ 5.44 (peak width at a = 5 is 0.201 vs. 0.131 for rho_s = 1.5). Varying L/ell
    or D_a/D_s at rho_s = 1.5 cannot reconcile s_max and a_max simultaneously; however,
    setting rho_s = 1.0 (keeping rho_a = 1, D_a/D_s = 0.5, Pe = 7, L/ell = 20) reproduces
    all three plotted profiles simultaneously to < 0.5% (s_max = 1.402, s_min = 0.125,
    a_max = 5.424, half-width at a = 5 is 0.197, v/U_max = 0.253). Because Fig. 5(b)'s
    'x' centroid is unambiguously (0.5002, 1.5002) and Fig. 5(c)'s curves start at
    tau_D*lambda(0) = (rho_a - rho_s)/2 = -0.25 (confirming rho_s = 1.5 in Figs. 5b-c),
    Fig. 5(d) appears to have been generated with rho_s = 1.0 (e.g. omitting the rho_s
    prefactor in R_s = rho_s*(1 - a^2*s) or using an earlier parameter point).
