- id: q_audit_asdm_pde_grid_negativity
  kind: reading
  about:
    - asdm_pde_eq14
    - run_asdm_pde_fig5d
    - ref_asdm_pde_fig5d_ngrid
  text: >
    Disagreement with the first reader's default grid choice n_grid = 64 in asdm_pde_eq14
    and refining only a_max in ref_asdm_pde_fig5d_ngrid. On L/ell = 20 with three sharp
    activator peaks (Fig. 5d), n_grid = 64 produces an unphysically negative activator
    minimum a_min_fig5d_pred = -0.00575 due to spectral Gibbs undershoot (and an 8.2%
    underprediction of s_min: 0.09142 vs. 0.09959 at n_grid = 128 and 0.09956 at n_grid = 256),
    whereas a_min becomes positive (+0.00273 at n_grid = 128, +0.00268 at n_grid = 256)
    once n_grid >= 128. Also, the 2/3 dealiasing cutoff fully dealiases quadratic advection
    terms (V*a, V*s) but not the cubic reaction term a^2 * s. A default grid of n_grid >= 128
    and a refinement check on a_min or s_min would avoid negative concentrations.
  citation:
    page: 4
    printed_page: "028103-4"
    quote: "(d) Nonhomogeneous steady state for Pe ¼ 7 and parameters"
    where: "Fig. 5(d)"

