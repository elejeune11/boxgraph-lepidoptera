    |k_max| > 0". Directly evaluating Eq. (15) shows that for (3 - 2*sqrt(2))*rho_a <
    rho_s < rho_a (i.e. 0.1716 < rho_s < 1 at rho_a = 1), the leading eigenvalue at
    k = 0 is a complex conjugate pair (Im[lambda(0)] != 0, Re[lambda(0)] = (rho_a -
    rho_s)/2 > 0). In Region III, Re[lambda(k)] has maxima at k = 0 (complex) and at
