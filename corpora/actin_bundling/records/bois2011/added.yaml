# Representative cortical physical scales (the paper prints no dimensional values)
- id: eta_cortex_added
  quantity: viscosity
  unit: Pa*s
  printed: "1.0 x 10^4"
  basis: "Order-of-magnitude active-gel viscosity of the actomyosin cell cortex (motivated by Mayer et al. 2010 [7] and Salbreux et al. 2009 [6]); Bois et al. (2011) print no dimensional parameter values."
  alternatives: ["1.0 x 10^3", "1.0 x 10^5"]
  stands_for: "eta in Eqs. (2), (9), (11) and ell = sqrt(eta / gamma)"

- id: gamma_cortex_added
  quantity: friction_coefficient
  unit: Pa*s/m^2
  printed: "1.0 x 10^14"
  basis: "Chosen so that ell = sqrt(eta / gamma) = 10 um, the typical cortical hydrodynamic length reported in C. elegans cortex [7]; Bois et al. (2011) print no dimensional friction coefficient."
  alternatives: ["2.5 x 10^13", "4.0 x 10^14"]
  stands_for: "gamma in Eqs. (3), (6), (7), (11) and Pe = (zeta*Delta_mu)_0 / (D * gamma)"

- id: zdm0_cortex_added
  quantity: characteristic_active_stress
  unit: Pa
  printed: "2.5 x 10^2"
  basis: "Chosen so that with D = 1e-13 m^2/s and gamma = 1e14 Pa*s/m^2, the Peclet number Pe = (zeta*Delta_mu)_0 / (D * gamma) = 25 matches Fig. 1; Bois et al. (2011) print no dimensional active stress."
  alternatives: ["1.0 x 10^2", "5.0 x 10^2"]
  stands_for: "(zeta*Delta_mu)_0 in Eqs. (2), (11), and Pe"

- id: D_cortex_added
  quantity: diffusion_coefficient
  unit: m^2/s
  printed: "1.0 x 10^-13"
  basis: "Representative membrane-bound cortical regulator diffusivity (0.1 um^2/s, per footnote [8]); Bois et al. (2011) print no dimensional diffusivity."
  alternatives: ["1.0 x 10^-14", "1.0 x 10^-12"]
  stands_for: "D in Eqs. (1), (5)-(10), (12), and tau_D = ell^2 / D"

# Boundary/test inputs for steady-state flux Eq. (7) and velocity Eq. (8)
- id: delta_sigma_periodic_added
  quantity: stress_difference
  unit: Pa
  printed: "0"
  basis: "Periodic boundary conditions require sigma(L) = sigma(0) so sigma(L) - sigma(0) = 0 in Eq. (7)."
  alternatives: ["1.0 x 10^-6", "-1.0 x 10^-6"]
  stands_for: "sigma(L) - sigma(0) in Eq. (7)"

- id: c_ratio_periodic_added
  quantity: concentration_ratio
  unit: dimensionless
  printed: "1"
  basis: "Periodic boundary conditions require c(L) = c(0) so c(L)/c(0) = 1 in Eq. (7)."
  alternatives: ["1.001", "0.999"]
  stands_for: "c(L) / c(0) in Eq. (7)"

- id: inv_c_integral_added
  quantity: inverse_concentration_integral
  unit: m
  printed: "6.283185307179586 x 10^-5"
  basis: "Domain integral int_0^L dx / c(x) for homogeneous c = 1 on L = 2*pi*ell with ell = 10 um; any positive finite value gives j0 = 0 under periodic boundary conditions."
  alternatives: ["1.0 x 10^-4", "1.0 x 10^-3"]
  stands_for: "int_0^L dx / c(x) in Eq. (7)"

- id: du_dx_homog_added
  quantity: log_concentration_gradient
  unit: 1/m
  printed: "0"
  basis: "Homogeneous state c(x) = c0 has zero spatial gradient d_x(ln c) = 0 in Eq. (8)."
  alternatives: ["1.0 x 10^2", "-1.0 x 10^2"]
  stands_for: "d_x u = d_x(ln c) in Eq. (8)"

- id: c_boundary_noflux_added
  quantity: regulator_concentration
  unit: dimensionless
  printed: "1"
  basis: "No-flux boundary condition at x = 0 does not specify the positive boundary concentration c(0); any c(0) > 0 gives j0 = 0 when v(0) = d_x c(0) = 0 in Eq. (5)."
  alternatives: ["0.5", "2"]
  stands_for: "c(0) in Eq. (5) for no-flux boundary conditions"

# Evaluation points and unstated simulation parameters for single-species models
- id: k_test_added
  quantity: wavenumber
  unit: 1/m
  printed: "1.0 x 10^5"
  basis: "Fundamental periodic mode k = 1 / ell for ell = 10 um (matching k*ell = 1 in Fig. 3a)."
  alternatives: ["2.0 x 10^5", "5.0 x 10^4"]
  stands_for: "k in Eqs. (12) and (15)"

- id: k_l_test_added
  quantity: dimensionless_wavenumber
  unit: dimensionless
  printed: "1"
  basis: "First periodic mode k*ell = 1 for L/ell = 2*pi (Fig. 3a); also used to evaluate Eq. (12) and ASDM dispersion Eq. (15)."
  alternatives: ["0.5", "2"]
  stands_for: "k*ell in Figs. 3(a) and 5(c)"

- id: df_dc_c1_added
  quantity: active_stress_slope
  unit: dimensionless
  printed: "0.25"
  basis: "Exact derivative df/dc = 1/(1+c)^2 evaluated at c0 = 1 for f(c) = c/(1+c) (p. 2)."
  alternatives: ["0.2", "0.3"]
  stands_for: "d_c f(c0) in Eqs. (11)-(13) and (15)"

- id: dR_dc_zero_added
  quantity: reaction_linear_rate
  unit: 1/s
  printed: "0"
  basis: "Zero chemical reaction rate dR/dc = 0 recovers the conserved single-species case (Eq. 12) from Eq. (15)."
  alternatives: ["-0.001", "0.001"]
  stands_for: "d_c R(c0) in Eq. (15)"

- id: u_zero_added
  quantity: log_concentration
  unit: dimensionless
  printed: "0"
  basis: "Homogeneous concentration c0 = 1 corresponds to u = ln(c0) = 0 in Fig. 2(a)."
  alternatives: ["-1", "1"]
  stands_for: "u = ln c in Eq. (10) and Fig. 2"

- id: sigma0_hat_homog_added
  quantity: dimensionless_stress_constant
  unit: dimensionless
  printed: "0.5"
  basis: "Exact homogeneous steady-state integration constant sigma_0 / (zeta*Delta_mu)_0 = f(c0) = 1/2 at c0 = 1 from Eq. (9) with u = 0, d_x^2 u = 0."
  alternatives: ["0.4438", "0.3417"]
  stands_for: "sigma_0 / (zeta*Delta_mu)_0 in Eq. (10) for homogeneous Pe = 3, 7"

- id: T_end_fig4_added
  quantity: dimensionless_time
  unit: dimensionless
  printed: "20"
  basis: "Final time axis value t/tau_D = 20 shown in Fig. 4 (p. 3), not stated in prose or caption."
  alternatives: ["15", "30"]
  stands_for: "final simulation time t/tau_D for Fig. 4"

- id: eps_init_fig4_added
  quantity: initial_perturbation_amplitude
  unit: dimensionless
  printed: "0.01"
  basis: "Small symmetry-breaking initial perturbation to homogeneous c0 = 1; paper does not state the initial perturbation used to integrate Eqs. (1)-(3) in Fig. 4."
  alternatives: ["0.002", "0.05"]
  stands_for: "initial perturbation amplitude delta c / c0 in Fig. 4 PDE integration"

# Unstated ASDM parameters for Fig. 5 (x marker coordinates, domain length, simulation time)
- id: Da_over_Ds_fig5_cross_added
  quantity: diffusivity_ratio
  unit: dimensionless
  printed: "0.5"
  basis: "Approximate position of the 'x' marker in Fig. 5(b) (p. 4), whose exact coordinates are not printed in the text or caption; verified to match Fig. 5(c) and 5(d)."
  alternatives: ["0.45", "0.55"]
  stands_for: "D_a / D_s at the 'x' marker in Fig. 5(b)-(d)"

- id: rho_s_fig5_cross_added
  quantity: substrate_rate_constant
  unit: dimensionless
  printed: "1.5"
  basis: "Approximate position of the 'x' marker in Fig. 5(b) (p. 4), whose exact coordinates are not printed in the text or caption; verified to match Fig. 5(c) and 5(d)."
  alternatives: ["1.4", "1.6"]
  stands_for: "rho_s (nondimensionalized by tau_D = ell^2 / D_s) at the 'x' marker in Fig. 5(b)-(d)"

- id: L_over_l_fig5d_added
  quantity: dimensionless_domain_length
  unit: dimensionless
  printed: "20"
  basis: "Domain extent x/ell in [0, 20] shown on the horizontal axis of Fig. 5(d) (p. 4), not stated in the caption."
  alternatives: ["18", "22"]
  stands_for: "L / ell in Fig. 5(d)"

- id: T_end_fig5d_added
  quantity: dimensionless_time
  unit: dimensionless
  printed: "40"
  basis: "Sufficient dimensionless relaxation time t/tau_D to reach the periodic 3-peak ASDM steady state in Fig. 5(d); integration time is not stated in the paper."
  alternatives: ["25", "60"]
  stands_for: "relaxation time t/tau_D for Fig. 5(d) steady state"

- id: eps_init_fig5d_added
  quantity: initial_perturbation_amplitude
  unit: dimensionless
  printed: "0.05"
  basis: "Small 3-mode perturbation to homogeneous (a0, s0) = (1, 1) selecting the 3-peak steady state plotted in Fig. 5(d); paper does not state the initial condition."
  alternatives: ["0.01", "0.1"]
  stands_for: "initial perturbation amplitude for Fig. 5(d) PDE integration"

# Periodic translational phase positions and calibrated '+' marker coordinates for figure profile checks
- id: x_peak_fig1a_added
  quantity: dimensionless_position
  unit: dimensionless
  printed: "3.141592653589793"
  basis: "Periodic boundary conditions in Eq. (9) are translationally invariant; Fig. 1(a) centers its single concentration maximum at x/ell = pi (midpoint of [0, 2*pi])."
  alternatives: ["3.10", "3.18"]
  stands_for: "Peak phase x_peak/ell of the 1-peak periodic steady state in Fig. 1(a)"

- id: x_peak_fig1b_added
  quantity: dimensionless_position
  unit: dimensionless
  printed: "1.5707963267948966"
  basis: "Periodic boundary conditions in Eq. (9) are translationally invariant; Fig. 1(b) centers its two concentration maxima at x/ell = pi/2 and 3*pi/2 on [0, 2*pi]."
  alternatives: ["1.52", "1.62"]
  stands_for: "Peak phase x_peak/ell of the 2-peak periodic steady state in Fig. 1(b)"

- id: x_peak_fig5d_added
  quantity: dimensionless_position
  unit: dimensionless
  printed: "10"
  basis: "Periodic boundary conditions in Eq. (14) are translationally invariant; Fig. 5(d) centers its middle activator peak at x/ell = 10 = L/(2*ell) on [0, 20]."
  alternatives: ["9.9", "10.1"]
  stands_for: "Central peak phase x_peak/ell of the 3-peak periodic ASDM steady state in Fig. 5(d)"

- id: Da_over_Ds_fig5_plus_added
  quantity: diffusivity_ratio
  unit: dimensionless
  printed: "0.075"
  basis: "Coordinates of the '+' marker in Fig. 5(a) are not printed in prose or caption; calibrated 1200-dpi measurement of the '+' centroid in Fig. 5(a) gives D_a/D_s = 0.0752 (and matches the Fig. 5(c) dashed dispersion curve)."
  alternatives: ["0.07", "0.08"]
  stands_for: "D_a / D_s at the '+' marker in Fig. 5(a) and dashed curve in Fig. 5(c)"

- id: rho_s_fig5_plus_added
  quantity: substrate_rate_constant
  unit: dimensionless
  printed: "1.5"
  basis: "Coordinates of the '+' marker in Fig. 5(a) are not printed in prose or caption; calibrated 1200-dpi measurement of the '+' horizontal bar in Fig. 5(a) gives rho_s = 1.5000 (consistent with tau_D*lambda(0) = -0.25 in Fig. 5(c))."
  alternatives: ["1.45", "1.55"]
  stands_for: "rho_s at the '+' marker in Fig. 5(a) and dashed curve in Fig. 5(c)"
