- id: ref_ss_fig1a_ngrid
  run: run_ss_fig1a_1peak
  setting: n_grid
  factors: [1, 2, 4, 8]
  mode: multiply
  output: c_max
  tolerance: "0.1%"
  tolerance_basis: "added: well below 1% visual/plotting precision of Fig. 1(a) peak concentration"
  tolerance_added: true

- id: ref_ss_fig1b_ngrid
