# Group A: Dimensional characteristic scales and Peclet definitions (representative cortical scales)
- id: run_hydro_length
  model: hydrodynamic_length
  inputs:
    eta: eta_cortex_added
    gamma: gamma_cortex_added
  outputs:
    l: l_cortex_pred

- id: run_char_velocity
  model: characteristic_velocity
  inputs:
    zdm0: zdm0_cortex_added
    eta: eta_cortex_added
    gamma: gamma_cortex_added
  outputs:
    U: U_cortex_pred

- id: run_pe_physical
  model: peclet_number_physical
  inputs:
    zdm0: zdm0_cortex_added
    D: D_cortex_added
    gamma: gamma_cortex_added
  outputs:
    Pe: Pe_phys_pred

- id: run_pe_timescale
  model: peclet_number_timescale
  inputs:
    U: U_cortex_pred
    l: l_cortex_pred
    D: D_cortex_added
  outputs:
    Pe: Pe_timescale_pred

- id: run_tau_D
  model: diffusive_timescale
  inputs:
    l: l_cortex_pred
    D: D_cortex_added
  outputs:
    tau_D: tau_D_cortex_pred

# Group B: Single-species steady-state flux, velocity, potential, and BVP profiles (Eqs. 4-10, Figs. 1-2)
- id: run_steady_flux_noflux
  model: steady_flux_eq5
  inputs:
    v: v_noflux_boundary
    c: c_boundary_noflux_added
    D: D_cortex_added
    dc_dx: dc_dx_noflux_boundary
  outputs:
    j0: j0_noflux_pred

- id: run_steady_flux_periodic
  model: steady_flux_eq7
  inputs:
    delta_sigma: delta_sigma_periodic_added
    gamma: gamma_cortex_added
    D: D_cortex_added
    c_ratio: c_ratio_periodic_added
    inv_c_int: inv_c_integral_added
  outputs:
    j0: j0_periodic_pred

- id: run_steady_vel_homog
  model: steady_velocity_eq8
  inputs:
    D: D_cortex_added
    du_dx: du_dx_homog_added
  outputs:
    v: v_homog_pred

- id: run_ss_fig1a_1peak
  model: single_species_steady_state_eq9
