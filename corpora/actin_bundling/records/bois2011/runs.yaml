    c_max: c_max_fig1a_pred
    c_min: c_min_fig1a_pred
    c_mean: c_mean_fig1a_pred
    v_over_U_max: v_max_fig1a_pred
    sigma0_hat: sigma0_hat_fig1a_pred
    sigma_hat_max: sigma_max_fig1a_pred
    sigma_hat_min: sigma_min_fig1a_pred
    active_stress_hat_max: active_max_fig1a_pred

- id: run_ss_fig1b_2peak
