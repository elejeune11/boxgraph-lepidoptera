    L_over_l: L_over_l_fig1
    c0: c0_fig1
    n_peaks: n_peaks_fig1b
  outputs:
    c_max: c_max_fig1b_pred
    c_min: c_min_fig1b_pred
    c_mean: c_mean_fig1b_pred
    v_over_U_max: v_max_fig1b_pred
    sigma0_hat: sigma0_hat_fig1b_pred
    sigma_hat_max: sigma_max_fig1b_pred
    sigma_hat_min: sigma_min_fig1b_pred
    active_stress_hat_max: active_max_fig1b_pred

