id: single_species_dispersion_raw
name: single-species linear dispersion relation in physical parameters (Eqs. 1 and 11)
role: model
stated:
  page: 3
  printed_page: "028103-3"
  quote: "Inserting (11) into (1) and considering terms up to linear"
  where: "Eqs. 1 and 11"
equation: "lambda(k) = -k^2 * D + k^2 * c0 * (zeta*Delta_mu)_0 * df_dc / (gamma + eta * k^2)"
inputs:
  k:
    quantity: wavenumber
    unit: 1/m
  D:
    quantity: diffusion_coefficient
    unit: m^2/s
  c0:
    quantity: average_concentration
    unit: dimensionless
  zdm0:
    quantity: characteristic_active_stress
    unit: Pa
  df_dc:
    quantity: active_stress_slope
    unit: dimensionless
  gamma:
    quantity: friction_coefficient
    unit: Pa*s/m^2
  eta:
    quantity: viscosity
    unit: Pa*s
outputs:
  lam:
    quantity: growth_rate
    unit: 1/s
settings: {}
stochastic: false
