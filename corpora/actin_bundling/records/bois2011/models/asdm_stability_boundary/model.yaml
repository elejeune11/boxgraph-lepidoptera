  printed_page: "028103-4"
  quote: "stability diagram for Pe ¼ 7, a ¼ 1, and    =ð   Þ0 ¼"
  where: "Eq. 15 / Fig. 5(a)-(b)"
equation: "max_{k>0} Re[tau_D * lambda(k; D_a/D_s, rho_a, rho_s, Pe)] = 0 for rho_s > rho_a"
