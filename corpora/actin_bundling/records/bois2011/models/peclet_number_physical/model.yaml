id: peclet_number_physical
name: active Peclet number from material parameters
role: model
stated:
  page: 2
  printed_page: "028103-2"
  quote: "tration profile. Here, we have defined the Péclet number,"
  where: text
equation: "Pe = (zeta*Delta_mu)_0 / (D * gamma)"
inputs:
  zdm0:
    quantity: characteristic_active_stress
    unit: Pa
  D:
    quantity: diffusion_coefficient
    unit: m^2/s
  gamma:
    quantity: friction_coefficient
    unit: Pa*s/m^2
outputs:
  Pe:
    quantity: peclet_number
    unit: dimensionless
settings: {}
stochastic: false
