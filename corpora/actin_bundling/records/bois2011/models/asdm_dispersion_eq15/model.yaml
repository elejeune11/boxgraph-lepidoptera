id: asdm_dispersion_eq15
name: ASDM linear stability dispersion relation in active fluid (Eq. 15, Fig. 5b-c)
role: model
stated:
  page: 3
  printed_page: "028103-3"
  quote: "The stability matrix A has entries"
  where: "Eq. 15 / Fig. 5(b)-(c)"
equation: "tau_D A_aa = -(D_a/D_s)*(k*ell)^2 + rho_a + (Pe/4)*(k*ell)^2/(1+(k*ell)^2); tau_D A_as = rho_a; tau_D A_sa = -2*rho_s + (Pe/4)*(k*ell)^2/(1+(k*ell)^2); tau_D A_ss = -(k*ell)^2 - rho_s"
inputs:
  k_l:
    quantity: dimensionless_wavenumber
    unit: dimensionless
  Da_over_Ds:
    quantity: diffusivity_ratio
    unit: dimensionless
  rho_a:
    quantity: activator_rate_constant
    unit: dimensionless
  rho_s:
    quantity: substrate_rate_constant
    unit: dimensionless
  Pe:
    quantity: peclet_number
    unit: dimensionless
outputs:
  re_lam_dimless:
    quantity: dimensionless_growth_rate
    unit: dimensionless
  im_lam_dimless:
    quantity: dimensionless_oscillation_frequency
    unit: dimensionless
  tr_dimless:
    quantity: dimensionless_matrix_trace
    unit: dimensionless
  det_dimless:
    quantity: dimensionless_matrix_determinant
    unit: dimensionless
settings: {}
stochastic: false
