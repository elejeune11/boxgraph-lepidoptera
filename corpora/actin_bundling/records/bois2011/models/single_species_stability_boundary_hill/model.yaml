id: single_species_stability_boundary_hill
name: single-species linear stability boundary for Hill active stress (Fig. 3b)
role: model
stated:
  page: 3
  printed_page: "028103-3"
  quote: "for the same active stress function."
  where: "Eq. 13 / Fig. 3(b)"
equation: "Pe_c = (1 + (beta * pi * ell / L)^2) * (1 + c0)^2 / c0; Pe_c / (1 + (beta * pi * ell / L)^2) = (1 + c0)^2 / c0"
inputs:
  c0:
    quantity: average_concentration
    unit: dimensionless
  beta:
    quantity: boundary_condition_factor
    unit: dimensionless
  L_over_l:
    quantity: dimensionless_domain_length
    unit: dimensionless
outputs:
  Pe_crit:
    quantity: peclet_number
    unit: dimensionless
  Pe_crit_rescaled:
    quantity: rescaled_peclet_number
    unit: dimensionless
settings: {}
stochastic: false
