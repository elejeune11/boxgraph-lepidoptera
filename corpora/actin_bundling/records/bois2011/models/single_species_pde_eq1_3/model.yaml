id: single_species_pde_eq1_3
name: 1D single-species active-fluid advection-diffusion PDE solver (Eqs. 1-3, Fig. 4)
role: model
stated:
  page: 1
  printed_page: "028103-1"
  quote: "The concentration of the regulator is governed by a one-"
  where: "Eqs. 1-3 / Fig. 4"
equation: "d_T c = d_X^2 c - d_X (V c); (1 - d_X^2) V = Pe * d_X [c / (1 + c)] on periodic [0, L/ell]"
inputs:
  Pe:
    quantity: peclet_number
    unit: dimensionless
  L_over_l:
    quantity: dimensionless_domain_length
    unit: dimensionless
  c0:
    quantity: average_concentration
    unit: dimensionless
  T_end:
    quantity: dimensionless_time
    unit: dimensionless
  eps_init:
    quantity: initial_perturbation_amplitude
    unit: dimensionless
outputs:
  n_peaks_final:
    quantity: peak_count
    unit: dimensionless
  c_max_final:
    quantity: peak_concentration
    unit: dimensionless
  c_mean_final:
    quantity: average_concentration
    unit: dimensionless
settings:
  n_grid: 64
  dt: 0.002
stochastic: false
