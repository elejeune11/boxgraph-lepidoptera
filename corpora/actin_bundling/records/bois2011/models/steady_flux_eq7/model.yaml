id: steady_flux_eq7
name: constant steady-state regulator flux from boundary jumps (Eq. 7)
role: model
stated:
  page: 2
  printed_page: "028103-2"
  quote: "periodic boundary conditions require j0 ¼ 0. Thus, the"
  where: "Eq. 7"
equation: "j0 * int_0^L (dx / c(x)) = (sigma(L) - sigma(0)) / gamma - D * ln(c(L) / c(0))"
inputs:
  delta_sigma:
    quantity: stress_difference
    unit: Pa
  gamma:
    quantity: friction_coefficient
    unit: Pa*s/m^2
  D:
    quantity: diffusion_coefficient
    unit: m^2/s
  c_ratio:
    quantity: concentration_ratio
    unit: dimensionless
  inv_c_int:
    quantity: inverse_concentration_integral
    unit: m
outputs:
  j0:
    quantity: steady_regulator_flux
    unit: m/s
settings: {}
stochastic: false
