id: single_species_steady_state_eq9
name: single-species nonhomogeneous periodic steady-state BVP solver (Eqs. 4, 6, 8, 9)
role: model
stated:
  page: 2
  printed_page: "028103-2"
  quote: "tial equation describing steady concentration profiles:"
  where: "Eq. 9 / Fig. 1"
equation: "d_X^2 u = u + Pe * (sigma0_hat - exp(u)/(1 + exp(u))), (1/L_over_l) int_0^{L_over_l} exp(u) dX = c0, v/U = (1/Pe) d_X u, sigma/(zeta*Delta_mu)_0 = sigma0_hat + u/Pe"
inputs:
  Pe:
    quantity: peclet_number
    unit: dimensionless
  L_over_l:
    quantity: dimensionless_domain_length
    unit: dimensionless
  c0:
    quantity: average_concentration
    unit: dimensionless
  n_peaks:
    quantity: peak_count
    unit: dimensionless
outputs:
  c_max:
    quantity: peak_concentration
    unit: dimensionless
  c_min:
    quantity: valley_concentration
    unit: dimensionless
  c_mean:
    quantity: average_concentration
    unit: dimensionless
  v_over_U_max:
    quantity: dimensionless_velocity
    unit: dimensionless
  sigma0_hat:
    quantity: dimensionless_stress_constant
    unit: dimensionless
  sigma_hat_max:
    quantity: dimensionless_total_stress
    unit: dimensionless
  sigma_hat_min:
    quantity: dimensionless_total_stress
    unit: dimensionless
  active_stress_hat_max:
    quantity: dimensionless_active_stress
    unit: dimensionless
settings:
  n_grid: 100
stochastic: false
