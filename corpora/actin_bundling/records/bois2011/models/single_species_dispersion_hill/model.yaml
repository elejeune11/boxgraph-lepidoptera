id: single_species_dispersion_hill
name: dimensionless single-species dispersion relation for Hill active stress (Fig. 3a)
role: model
stated:
  page: 3
  printed_page: "028103-3"
  quote: "and c0 ¼ 1 for Pe ¼ 3, 7, 10, and 25"
  where: "Eq. 12 / Fig. 3(a)"
equation: "tau_D * lambda(k) = -(k*ell)^2 * (1 - Pe * c0 / ((1 + c0)^2 * (1 + (k*ell)^2)))"
