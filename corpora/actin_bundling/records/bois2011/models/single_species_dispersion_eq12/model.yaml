id: single_species_dispersion_eq12
name: single-species active fluid linear dispersion relation (Eq. 12)
role: model
stated:
  page: 3
  printed_page: "028103-3"
  quote: "linearized system is given by the dispersion relation"
  where: "Eq. 12"
equation: "lambda(k) = -k^2 * D * (1 - Pe * c0 * d_c f(c0) / (1 + k^2 * ell^2))"
inputs:
  k:
    quantity: wavenumber
    unit: 1/m
  D:
    quantity: diffusion_coefficient
    unit: m^2/s
  Pe:
    quantity: peclet_number
    unit: dimensionless
  c0:
    quantity: average_concentration
    unit: dimensionless
  df_dc:
    quantity: active_stress_slope
    unit: dimensionless
  l:
    quantity: hydrodynamic_length
    unit: m
outputs:
  lam:
    quantity: growth_rate
    unit: 1/s
  lam_dimless:
    quantity: dimensionless_growth_rate
    unit: dimensionless
settings: {}
stochastic: false
