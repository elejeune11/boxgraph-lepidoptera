id: asdm_pde_eq14
name: 1D two-species ASDM active-fluid PDE solver (Eqs. 2, 3, 14, Fig. 5d)
role: model
stated:
  page: 3
  printed_page: "028103-3"
  quote: "reactions, holds for each species i:"
  where: "Eq. 14 / Fig. 5(d)"
equation: "d_T a = (D_a/D_s) d_X^2 a - d_X(V a) + rho_a*(a^2 s - a); d_T s = d_X^2 s - d_X(V s) + rho_s*(1 - a^2 s); (1 - d_X^2) V = Pe * d_X[a/(1 + a)]"
inputs:
  Pe:
    quantity: peclet_number
    unit: dimensionless
  Da_over_Ds:
    quantity: diffusivity_ratio
    unit: dimensionless
  rho_a:
    quantity: activator_rate_constant
    unit: dimensionless
  rho_s:
    quantity: substrate_rate_constant
    unit: dimensionless
  L_over_l:
    quantity: dimensionless_domain_length
    unit: dimensionless
  T_end:
    quantity: dimensionless_time
    unit: dimensionless
  eps_init:
    quantity: initial_perturbation_amplitude
    unit: dimensionless
outputs:
  a_max:
    quantity: activator_concentration
    unit: dimensionless
  a_min:
    quantity: activator_concentration
    unit: dimensionless
  s_max:
    quantity: substrate_concentration
    unit: dimensionless
  s_min:
    quantity: substrate_concentration
    unit: dimensionless
  v_over_U_max:
    quantity: dimensionless_velocity
    unit: dimensionless
  n_peaks:
    quantity: peak_count
    unit: dimensionless
settings:
  n_grid: 64
  dt: 0.005
stochastic: false
