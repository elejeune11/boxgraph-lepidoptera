id: single_species_fastest_mode
name: fastest-growing discrete spatial mode for single-species Hill active stress
role: model
stated:
  page: 3
  printed_page: "028103-3"
  quote: "such that the second mode grows"
  where: "Eq. 12 / Fig. 4"
equation: "n_max = argmax_{n in Z>0} [ -q_n^2 * (1 - Pe * c0 / ((1 + c0)^2 * (1 + q_n^2))) ], q_n = beta * n * pi / (L / ell)"
inputs:
  Pe:
    quantity: peclet_number
    unit: dimensionless
  c0:
    quantity: average_concentration
    unit: dimensionless
  beta:
    quantity: boundary_condition_factor
    unit: dimensionless
  L_over_l:
    quantity: dimensionless_domain_length
    unit: dimensionless
outputs:
  n_max:
    quantity: fastest_growing_mode
    unit: dimensionless
  k_max_discrete_l:
    quantity: dimensionless_wavenumber
    unit: dimensionless
  lam_max_dimless:
    quantity: dimensionless_growth_rate
    unit: dimensionless
  n_unstable_modes:
    quantity: unstable_mode_count
    unit: dimensionless
settings: {}
stochastic: false
