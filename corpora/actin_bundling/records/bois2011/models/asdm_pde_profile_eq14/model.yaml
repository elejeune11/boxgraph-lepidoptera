id: asdm_pde_profile_eq14
name: 1D two-species ASDM steady-state spatial profile evaluator (Eqs. 2, 3, 14, Fig. 5d)
role: model
stated:
  page: 3
  printed_page: "028103-3"
  quote: "reactions, holds for each species i:"
  where: "Eq. 14 / Fig. 5(d)"
equation: "d_T a = (D_a/D_s) d_X^2 a - d_X(V a) + rho_a*(a^2 s - a); d_T s = d_X^2 s - d_X(V s) + rho_s*(1 - a^2 s); (1 - d_X^2) V = Pe * d_X[a/(1 + a)]"
built_from:
  - asdm_pde_eq14
inputs:
  Pe:
    quantity: peclet_number
    unit: dimensionless
  Da_over_Ds:
    quantity: diffusivity_ratio
    unit: dimensionless
  rho_a:
    quantity: activator_rate_constant
    unit: dimensionless
  rho_s:
    quantity: substrate_rate_constant
    unit: dimensionless
  L_over_l:
    quantity: dimensionless_domain_length
    unit: dimensionless
  T_end:
    quantity: dimensionless_time
    unit: dimensionless
  eps_init:
    quantity: initial_perturbation_amplitude
    unit: dimensionless
  x_peak_over_l:
    quantity: dimensionless_position
    unit: dimensionless
    description: Spatial position x_peak/ell of the central activator peak (fixing periodic phase in Fig. 5d).
  a_ref:
    quantity: activator_concentration
    unit: dimensionless
    curve:
      quantity: dimensionless_position
      unit: dimensionless
    description: Reference curve supplying the x/ell sample positions for the activator profile output.
  s_ref:
    quantity: substrate_concentration
    unit: dimensionless
    curve:
      quantity: dimensionless_position
      unit: dimensionless
    description: Reference curve supplying the x/ell sample positions for the substrate profile output.
  v_ref:
    quantity: dimensionless_velocity
    unit: dimensionless
    curve:
      quantity: dimensionless_position
      unit: dimensionless
    description: Reference curve supplying the x/ell sample positions for the velocity profile output.
outputs:
  a_profile:
    quantity: activator_concentration
    unit: dimensionless
    curve:
      quantity: dimensionless_position
      unit: dimensionless
  s_profile:
    quantity: substrate_concentration
    unit: dimensionless
    curve:
      quantity: dimensionless_position
      unit: dimensionless
  v_profile:
    quantity: dimensionless_velocity
    unit: dimensionless
    curve:
      quantity: dimensionless_position
      unit: dimensionless
settings:
  n_grid: 128
  dt: 0.004
stochastic: false
