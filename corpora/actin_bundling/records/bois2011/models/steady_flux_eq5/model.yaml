id: steady_flux_eq5
name: constant steady-state regulator flux from integrated conservation law (Eq. 5)
role: model
stated:
  page: 1
  printed_page: "028103-1"
  quote: "stant diffusion coefficient, we may integrate (1) to solve for"
  where: "Eq. 5"
equation: "v = D * d_x(ln c) + j0 / c (equivalently j0 = c * v - D * d_x c)"
inputs:
  v:
    quantity: flow_velocity
    unit: m/s
  c:
