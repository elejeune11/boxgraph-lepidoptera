id: single_species_steady_state_profile_eq9
name: single-species steady-state spatial profile evaluator (Eqs. 6, 8, 9, Fig. 1)
role: model
stated:
  page: 2
  printed_page: "028103-2"
  quote: "tial equation describing steady concentration profiles:"
  where: "Eqs. 6, 8, 9 / Fig. 1"
equation: "d_X^2 u = u + Pe * (sigma0_hat - e^u/(1+e^u)); c = e^u; v/U = (1/Pe) d_X u; sigma_hat = sigma0_hat + u/Pe; active_stress_hat = c/(1+c)"
built_from:
  - single_species_steady_state_eq9
inputs:
  x_over_l:
    quantity: dimensionless_position
    unit: dimensionless
    description: Dimensionless spatial coordinate x/ell in [0, L/ell] at which to evaluate the steady profile.
  Pe:
    quantity: peclet_number
    unit: dimensionless
  L_over_l:
    quantity: dimensionless_domain_length
    unit: dimensionless
  c0:
    quantity: average_concentration
    unit: dimensionless
  n_peaks:
    quantity: peak_count
    unit: dimensionless
  x_peak_over_l:
    quantity: dimensionless_position
    unit: dimensionless
    description: Spatial position x_peak/ell of a concentration maximum (fixing periodic translational phase).
outputs:
  c:
    quantity: regulator_concentration
    unit: dimensionless
  v_over_U:
    quantity: dimensionless_velocity
    unit: dimensionless
  sigma_hat:
    quantity: dimensionless_total_stress
    unit: dimensionless
  active_stress_hat:
    quantity: dimensionless_active_stress
    unit: dimensionless
settings:
  n_grid: 200
stochastic: false
