- id: viscosity
  name: active fluid viscosity
  dimension: "[mass] / [length] / [time]"
  description: Shear/extensional viscosity eta in the 1D active-fluid constitutive relation Eq. (2).

- id: friction_coefficient
  name: substrate friction coefficient
  dimension: "[mass] / [length]**3 / [time]"
  description: Effective friction coefficient gamma per unit volume against the membrane or substrate in Eq. (3).

- id: characteristic_active_stress
  name: characteristic active stress
  dimension: "[mass] / [length] / [time]**2"
  description: Positive characteristic active stress scale (zeta*Delta_mu)_0 for contractile regulation.

- id: total_stress
  name: total fluid stress
  dimension: "[mass] / [length] / [time]**2"
  description: Total 1D stress sigma = eta * d_x v + zeta*Delta_mu in Eq. (2).

- id: stress_difference
  name: boundary total stress difference
  dimension: "[mass] / [length] / [time]**2"
  description: Difference sigma(L) - sigma(0) across the domain in Eq. (7).

- id: diffusion_coefficient
  name: regulator diffusion coefficient
  dimension: "[length]**2 / [time]"
  description: Diffusion coefficient D of the active-stress regulator in Eq. (1).

- id: hydrodynamic_length
  name: hydrodynamic length scale
  dimension: "[length]"
  description: Characteristic length ell = sqrt(eta / gamma) over which fluid velocity decays from a local active stress gradient.

- id: characteristic_velocity
  name: characteristic active flow velocity
  dimension: "[length] / [time]"
  description: Characteristic active velocity U = (zeta*Delta_mu)_0 / sqrt(eta * gamma).

- id: flow_velocity
  name: bulk active fluid velocity
  dimension: "[length] / [time]"
  description: 1D bulk flow velocity v(x) in Eqs. (1)-(3), (5), (8), and (11).

- id: steady_regulator_flux
  name: constant steady-state regulator flux
  dimension: "[length] / [time]"
  description: Constant flux integration parameter j0 in Eqs. (5)-(7) for dimensionless concentration c.

- id: inverse_concentration_integral
  name: domain integral of inverse concentration
  dimension: "[length]"
  description: Positive domain integral int_0^L dx / c(x) appearing in Eq. (7) for dimensionless c(x).

- id: diffusive_timescale
  name: diffusive time scale
  dimension: "[time]"
  description: Characteristic diffusive time scale tau_D = ell^2 / D (or ell^2 / D_s for ASDM).

- id: wavenumber
  name: spatial perturbation wavenumber
  dimension: "1 / [length]"
  description: Spatial wave number k of a linear perturbation exp(lambda(k)*t + i*k*x).

- id: log_concentration_gradient
  name: spatial gradient of log concentration
  dimension: "1 / [length]"
  description: Spatial derivative d_x(ln c) = d_x u appearing in Eq. (8).

- id: growth_rate
  name: linear perturbation growth rate
  dimension: "1 / [time]"
  description: Eigenvalue lambda(k) of the linearized active-fluid equations (Eqs. 12, 15).

- id: reaction_linear_rate
  name: linearized chemical reaction rate
  dimension: "1 / [time]"
  description: Diagonal chemical Jacobian entry dR/dc evaluated at the homogeneous steady state in Eq. (15).

- id: peclet_number
  name: active Peclet number
  dimension: dimensionless
  description: Dimensionless ratio Pe = (zeta*Delta_mu)_0 / (D * gamma) = U * ell / D (or with D_1 in Eq. 15).

- id: average_concentration
  name: average regulator concentration
  dimension: dimensionless
  description: Conserved spatial mean concentration c0 (dimensionless, scaled by saturation concentration in f(c) = c/(1+c)).

- id: concentration_ratio
  name: boundary concentration ratio
  dimension: dimensionless
  description: Ratio c(L) / c(0) appearing in Eq. (7).

- id: peak_concentration
  name: peak regulator concentration
  dimension: dimensionless
  description: Maximum regulator concentration c_max = exp(u2) in a patterned profile.

- id: valley_concentration
  name: valley regulator concentration
  dimension: dimensionless
  description: Minimum regulator concentration c_min = exp(u1) in a patterned profile.

- id: log_concentration
  name: log regulator concentration
  dimension: dimensionless
  description: Convenience variable u = ln c used in Eqs. (8)-(10) and Fig. 2.

- id: dimensionless_domain_length
  name: dimensionless domain length
  dimension: dimensionless
  description: Ratio L / ell of system size to hydrodynamic length scale.

- id: boundary_condition_factor
  name: boundary condition wavenumber factor
  dimension: dimensionless
  description: Factor beta = 1 for no-flux and beta = 2 for periodic boundary conditions.

- id: mode_number
  name: spatial Fourier mode index
  dimension: dimensionless
  description: Positive integer mode index n in k = +/- beta * n * pi / L.

- id: fastest_growing_mode
  name: fastest-growing discrete mode index
  dimension: dimensionless
  description: Discrete positive integer mode n_max maximizing the linear growth rate lambda(k_n).

- id: unstable_mode_count
  name: number of linearly unstable discrete modes
  dimension: dimensionless
  description: Count of positive integer modes n >= 1 with lambda(k_n) > 0.

- id: peak_count
  name: number of concentration peaks
  dimension: dimensionless
  description: Number of spatial concentration maxima in a periodic steady state or PDE profile.

- id: dimensionless_wavenumber
  name: dimensionless wavenumber
  dimension: dimensionless
  description: Product k * ell of wavenumber and hydrodynamic length.

- id: dimensionless_growth_rate
  name: dimensionless linear growth rate
  dimension: dimensionless
  description: Real part of tau_D * lambda(k), nondimensionalized by tau_D = ell^2 / D (or ell^2 / D_s).

- id: dimensionless_oscillation_frequency
  name: dimensionless linear oscillation frequency
  dimension: dimensionless
  description: Imaginary part magnitude |Im[tau_D * lambda(k)]| of the leading eigenvalue in Eq. (15).

- id: dimensionless_matrix_trace
  name: dimensionless stability matrix trace
  dimension: dimensionless
  description: Trace of the nondimensionalized 2x2 ASDM stability matrix tau_D * A(k).

- id: dimensionless_matrix_determinant
  name: dimensionless stability matrix determinant
  dimension: dimensionless
  description: Determinant of the nondimensionalized 2x2 ASDM stability matrix tau_D * A(k).

- id: active_stress_slope
  name: active stress concentration derivative
  dimension: dimensionless
  description: Derivative df/dc evaluated at homogeneous steady state c0 (dimensionless for dimensionless c).

- id: dimensionless_active_stress
  name: dimensionless active stress
  dimension: dimensionless
  description: Scaled active stress zeta*Delta_mu / (zeta*Delta_mu)_0 = f(c).

- id: dimensionless_total_stress
  name: dimensionless total stress
  dimension: dimensionless
  description: Scaled total stress sigma / (zeta*Delta_mu)_0 plotted in Fig. 1.

- id: dimensionless_stress_constant
  name: dimensionless steady-state integration stress constant
  dimension: dimensionless
  description: Scaled integration constant sigma_0 / (zeta*Delta_mu)_0 in Eqs. (6), (9), and (10).

- id: dimensionless_velocity
  name: dimensionless flow velocity
  dimension: dimensionless
  description: Scaled velocity v / U plotted in Figs. 1 and 5(d).

- id: dimensionless_potential
  name: dimensionless Hamiltonian potential
  dimension: dimensionless
  description: Scaled anharmonic oscillator potential ell^2 * V(u) from Eq. (10), plotted in Fig. 2.

- id: dimensionless_potential_curvature
  name: dimensionless potential curvature
  dimension: dimensionless
  description: Scaled second derivative ell^2 * d^2V/du^2 = Pe * df/du - 1 on p. 2.

- id: stability_ratio
  name: linear instability ratio
  dimension: dimensionless
  description: Left-hand side Pe * c0 * df/dc / (1 + (beta * pi * ell / L)^2) of Eq. (13); > 1 signifies instability.

- id: rescaled_peclet_number
  name: finite-size rescaled Peclet number
  dimension: dimensionless
  description: Rescaled Peclet parameter Pe / (1 + (beta * pi * ell / L)^2) on the horizontal axis of Fig. 3(b).

- id: dimensionless_time
  name: dimensionless evolution time
  dimension: dimensionless
  description: Time t / tau_D nondimensionalized by tau_D = ell^2 / D (or ell^2 / D_s).

- id: initial_perturbation_amplitude
  name: initial perturbation amplitude
  dimension: dimensionless
  description: Small concentration perturbation amplitude applied to the homogeneous steady state in PDE simulations.

- id: activator_concentration
  name: ASDM activator concentration
  dimension: dimensionless
  description: Dimensionless activator concentration a in the activator-substrate depletion model (p. 3-4).

- id: substrate_concentration
  name: ASDM substrate concentration
  dimension: dimensionless
  description: Dimensionless substrate concentration s in the activator-substrate depletion model (p. 3-4).

- id: activator_rate_constant
  name: dimensionless ASDM activator reaction rate
  dimension: dimensionless
  description: Activator reaction rate constant rho_a (nondimensionalized by tau_D = ell^2 / D_s in Fig. 5).

- id: substrate_rate_constant
  name: dimensionless ASDM substrate reaction rate
  dimension: dimensionless
  description: Substrate reaction rate constant rho_s (nondimensionalized by tau_D = ell^2 / D_s in Fig. 5).

- id: diffusivity_ratio
  name: activator-to-substrate diffusivity ratio
  dimension: dimensionless
  description: Ratio D_a / D_s of activator to substrate diffusion coefficients in Fig. 5.

- id: regulator_concentration
  name: local regulator concentration
  dimension: dimensionless
  description: Dimensionless local active-stress regulator concentration c(x) in Eqs. (1) and (5).

- id: concentration_gradient
  name: spatial gradient of regulator concentration
  dimension: "1 / [length]"
  description: Spatial derivative d_x c of dimensionless regulator concentration in Eqs. (1) and (5).


- id: dimensionless_position
  name: dimensionless spatial coordinate
  dimension: dimensionless
  description: 1D spatial coordinate x / ell nondimensionalized by hydrodynamic length ell = sqrt(eta / gamma), plotted on the horizontal axis of Figs. 1 and 5(d).
