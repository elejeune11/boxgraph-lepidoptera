- id: rel_raw_to_eq12
  kind: same_as
  a: bois2011/single_species_dispersion_raw
  b: bois2011/single_species_dispersion_eq12
  mapping:
    k: k
    D: D
    Pe: zdm0 / (D * gamma)
    c0: c0
    df_dc: df_dc
    l: sqrt(eta / gamma)
  output_map:
    lam: lam
  regime:
    k: [1.0e4, 5.0e5]
    D: [1.0e-14, 1.0e-12]
    c0: [0.1, 10.0]
    zdm0: [10.0, 1000.0]
    df_dc: [0.05, 1.0]
    gamma: [1.0e13, 1.0e15]
    eta: [1.0e3, 1.0e5]
  provenance: stated
  citation:
    page: 3
    printed_page: "028103-3"
    quote: "Inserting (11) into (1) and considering terms up to linear"
    where: "Eq. 12"

- id: rel_eq12_to_hill
  kind: derived_from
  a: bois2011/single_species_dispersion_eq12
  b: bois2011/single_species_dispersion_hill
  mapping:
    k_l: k * l
    Pe: Pe
    c0: c0
  output_map:
    lam_dimless: lam_dimless
  steps:
    - "subs: df_dc = 1 / (1 + c0)**2"
    - simplify
  provenance: stated
  citation:
    page: 3
    printed_page: "028103-3"
    quote: "and c0 ¼ 1 for Pe ¼ 3, 7, 10, and 25"
    where: "Fig. 3(a)"
  assumptions:
    - "Hill active stress f(c) = c / (1 + c) so d_c f(c0) = 1 / (1 + c0)^2"
    - "Growth rate nondimensionalized by tau_D = ell^2 / D"

