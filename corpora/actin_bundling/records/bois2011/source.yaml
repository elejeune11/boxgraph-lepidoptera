notes: >
  Read stage of Bois, Jülicher & Grill, Phys. Rev. Lett. 106, 028103 (2011),
  a 4-page theoretical paper formulating a 1D active-fluid advection-diffusion-reaction
  framework for cortical patterning. All 4 page images (pages/page-001.png through
  pages/page-004.png) were inspected alongside text/page-001.txt through page-004.txt
  because OCR omits Greek symbols (sigma, eta, zeta*Delta_mu, gamma, ell, beta,
  lambda, tau_D, rho_a, rho_s) and pi.
  Scope included: all 15 numbered equations and inline scaling definitions (hydrodynamic
  length ell, characteristic velocity U, Peclet number Pe, diffusive timescale tau_D,
  steady-state flux Eq. 7, steady velocity Eq. 8, steady-state anharmonic-oscillator ODE
  Eq. 9 and Hamiltonian potential Eq. 10, discrete wavenumber quantization, linearized
  dispersion relations Eqs. 11-12 and Hill specialization, instability threshold Eq. 13,
  fastest-growing discrete mode, 1D single-species PDE dynamics Eqs. 1-3, multi-species
  stability matrix Eq. 15 and its 1-species and Pe=0 limits, ASDM kinetics and homogeneous
  steady state a0 = s0 = 1, ASDM linear stability boundary, and 2-species ASDM PDE Eqs. 14).
  All printed parameters and quantitative claims in the text and captions are recorded and
  checked; exact symbolic ratios L/ell = 2*pi (Figs. 1, 3a) and L/ell = 3*pi (Fig. 4) are
  entered as their full-precision decimal values because the printed-value parser requires
  decimal syntax.
  Left out: (1) historical year "1952" (Turing's paper, p. 1), bibliographic numbers and
  PACS codes, which feed no model; (2) figure digitization of plotted curves in Figs. 1-5
  (including plot-internal curve labels Pe = 25, 50 in Fig. 5(c) and legend labels Pe = 3,
  7, 10 in Fig. 2(a), though Pe = 3, 7, 10, 25 are already printed in Fig. 3(a)'s caption),
  which belongs to the separate digitize stage; all models needed to predict and sweep
  Figs. 1-5 in that stage are already implemented and tested here.
