notes: >
  Supplementary Data 1 (MOESM4_ESM.xlsx) released with Sekine et al., Nature
  Communications 15, 464 (2024) (record sekine2024; open access CC-BY-4.0 as
  stated on PDF p. 13). Workbook metadata (docProps/core.xml): creator Sayaka
  Sekine, created 2023-02-03, modified 2023-12-13.

  Workbook structure: 1 sheet named "Supplementary Data1" (sheetId=3, Excel
  dimension A1:M155; all non-empty cells strictly within A2:H154; zero formulas;
  zero merged cells). Layout: row 1 blank; A2 title "Supplementary Data1. List
  of RNAi strains for the 1st screen (crossed with btl-Gal4)"; B3 legend "(n.d.:
  not determined, colored in red: smaller than 70 at day 8)"; row 4 headers
  A4="BDSC#", B4="gene", C4="Lethal stage", D4="Number of pupae" (spanning cols
  D-G), H4="Notes"; row 5 subheaders D5="day 5", E5="day6" (missing space),
  F5="day 7", G5="day 8". Rows 6-147 hold 142 transgenic RNAi lines (142 unique
  BDSC stock IDs targeting 119 unique genes case-insensitively, or 121 exact
  strings due to case variants Strn-Mlck/strn-Mlck on rows 118-119 and Svil/svil
  on rows 120-121; 23 genes tested with 2 RNAi lines each and 96 genes with 1
  line; row 116 BDSC#65164 is stored with Shift-JIS mojibake "Sry-ﾎｱ" for
  Sry-alpha). Rows 148-154 hold 7 control replicates (H="control"): 4 attP2
  replicates (rows 148, 150, 152, 154; BDSC#36303 entered on row 148 only) and
  3 attP40 replicates (rows 149, 151, 153; BDSC#36304 entered on row 149 only).

  Phenotype categories in Column C ("Lethal stage") across the 142 RNAi lines:
  viable / blank = 96 lines (plus all 7 controls); Larva = 21 lines; Larva
  (semi) = 4 lines (cpb BDSC#50954, nullo BDSC#41905, pod1 BDSC#41705, zip
  BDSC#36727); Early pupa = 3 lines (Arpc4, coro, rhea); Pupa = 12 lines
  (Arpc3A, Arpc3B, capt, cib, Ehbp1 x2, Moe, pnut, sals, scra, WASp BDSC#25955,
  alpha-Cat BDSC#38987); Pupa (semi) = 6 lines (Arpc1, dia BDSC#28541, fliI,
  jar, Msp300 x2). Total lethal or semi-lethal RNAi lines = 46 (25 larval/semi-
  larval + 21 pupal/early-pupal/semi-pupal).

  Quantitative pupa counts (Cols D-G): 586 numeric cells total (142x3 + 132 =
  558 RNAi cells plus 7x4 = 28 control cells; 10 RNAi cells in col G are "n.d.":
  rows 49 DAAM, 51-52 dia, 90-91 Moe, 96 Myo10A, 135-136 zip, 138-139
  alpha-Cat). All 586 numeric cells are recorded and cell-validated in data.yaml
  as per-strain pupation time-courses (rows 6-154, D:G or D:F) alongside screen-
  wide day 5-7 column series (D6:D147, E6:E147, F6:F147) and control day 5-8
  column series (D148:D154 through G148:G154). Control pupa counts (n=7): day 5
  all 0; day 6 mean 26.14 (SD 14.50, range 1-49); day 7 mean 93.14 (SD 14.94,
  range 71-112); day 8 mean 121.14 (SD 11.38, median 121, range 100-134; attP2
  n=4 mean 119.75, attP40 n=3 mean 123.00). Across the 142 RNAi lines: day 5
  median 0 (range 0-51); day 6 median 19.5 (range 0-118); day 7 median 92.5
  (range 0-168); day 8 (n=132 numeric) median 121.5 (range 0-171). Eleven RNAi
  lines yielded 0 pupae through the last scored day (9 with day 8 = 0: CG3630,
  jub, ssh, tsr, twf, wupA, Zasp52, alpha-Spec, Septin2; plus 2 with day 7 = 0
  and day 8 = "n.d.": DAAM, dia). Seventeen RNAi lines had numeric day 8 < 70.

  Overlap with sekine2024 Supplementary Table 2 and key genetic hits affecting
  periodic circumferential actin cables: The 22 RNAi lines advanced to embryonic
  stage-16 actin pattern quantification (sekine2024 p. 3 and Supplementary Table
  2) correspond exactly to all 21 "Larva" lines plus 1 "Larva (semi)" line (cpb,
  BDSC#50954). Ten of these 22 lines (all "Larva" lethal here) were screen
  positives causing strong orientation and/or elongation defects in periodic
  actin cables: (1) Formins mediating mechanosensitive straight filament growth
  and anisotropy sensing: DAAM (BDSC#39058, 0/0/0/n.d.; Supp Table 2 median
  orientation 44.5 deg, major length 314 nm), dia (BDSC#33424, 0/0/0/n.d.; 51.5
  deg, 295.37 nm), form3 (BDSC#32398, 0/26/79/81, "Genotyped after hatch"; 60.5
  deg, 297.19 nm); (2) Crosslinking stabilizer: Zasp52 (BDSC#58198, 0/0/0/0;
  48.5 deg, 289.91 nm); (3) Actin turnover / depolymerization: tsr (cofilin,
  BDSC#65055, 0/0/0/0; 57.5 deg, 309.54 nm) and ssh (slingshot, BDSC#38948,
  0/0/0/0; 52.5 deg, 289.87 nm); (4) Membrane-cytoskeleton / septate-junction
  and troponin/calponin-family regulators: cora (BDSC#28933, 0/22/60/69; 50.5
  deg, 279.42 nm), wupA (troponin I, BDSC#31893, 0/0/0/0; 54.5 deg, 310.36 nm),
  CG3630 (BDSC#65945, 0/0/0/0; 54.5 deg, 296.45 nm), and Chd64 (BDSC#62377,
  0/21/95/99, "Gentotyped after hatch"; 57.5 deg, 299.28 nm). The remaining 12
  larval-lethal lines in Supp Table 2 showed mild or control-like actin cable
  patterns (cpb, chic, jub, WASp, Keap1, alpha-Spec, twf, zip, shi, alpha-Cat,
  Septin2, shot). Notably, alpha-Actinin (Actn, BDSC#34874, row 7) was viable in
  this 1st RNAi screen (0/22/95/124 pupae, no lethality) and was therefore
  missed by the screen; it was subsequently discovered via the MIST interaction
  network (Supplementary Data 2, FC1047 complex) and validated with the actn[14]
  null mutant (42.5 deg orientation in sekine2024 Supp Table 2).

  Key discrepancies and data-quality findings documented in questions.yaml: (1)
  Selection-rule mismatch: sekine2024 Methods (p. 11) states that lines with
  < 70 pupae on day 8 were used in the 2nd screen, yet 3 lines with day 8 < 70
  colored red in Supplementary Data 1 (nullo=34 Larva(semi), pod1=31
  Larva(semi), sn=66 viable) were excluded from Supp Table 2, while 6 lines with
  day 7-8 pupae >= 81 were included (Chd64=99, form3=81, Keap1=86, WASp=101,
  zip BDSC#38259 day7=118/day8=n.d., alpha-Cat BDSC#33430 day7=112/day8=n.d.;
  five annotated "Genotyped after hatch", indicating likely balanced stocks).
  (2) Red-coloring inconsistency: shot (BDSC#64041, day 8 = 39 < 70) is not
  colored red despite the B3 legend, while DAAM and dia (day 8 = n.d.) are
  shaded light red on day 7 = 0. (3) Non-monotonic cumulative pupa counts in 3
  rows: bif (day 7 = 98 -> day 8 = 96), GMF (day 7 = 93 -> day 8 = 88), and zip
  BDSC#38259 (day 5 = 31 -> day 6 = 11 -> day 7 = 118). (4) Ambiguous stock ID
  for zip in Supp Table 2 (two larval-lethal zip lines exist in Supp Data 1:
  BDSC#36727 Larva(semi) and BDSC#38259 Larva) and missing BDSC IDs on 5 of 7
  control rows. (5) Encoding/naming issues (Sry-ﾎｱ mojibake, Strn-Mlck/Svil case
  variants, "Gentotyped" typo on Chd64, unexplained "R189" note on zip).
