- id: pupae_count
  name: cumulative pupa count per vial
  dimension: dimensionless
  description: >
    Number of pupae counted in a single cross vial (btl-Gal4 virgin females
    crossed to UAS-RNAi or attP control males) at a given day after crossing.

- id: time_post_cross
  name: time after genetic cross
  dimension: "[time]"
  description: >
    Elapsed time after setting up the btl-Gal4 x UAS-RNAi (or control) cross,
    scored on days 5, 6, 7, and 8.

- id: rnai_line_index
  name: RNAi line row index
  dimension: dimensionless
  description: >
    1-based ordinal index (1 to 142) of the 142 transgenic RNAi lines in
    Supplementary Data 1 (spreadsheet rows 6 to 147, ordered as printed).

- id: control_replicate_index
  name: control cross replicate index
  dimension: dimensionless
  description: >
    1-based replicate index (1 to 7) of the 7 attP2/attP40 control crosses in
    Supplementary Data 1 (spreadsheet rows 148 to 154: attP2 on indices 1, 3,
    5, 7 and attP40 on indices 2, 4, 6).
