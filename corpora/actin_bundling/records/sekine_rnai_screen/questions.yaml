- id: q_selection_threshold_mismatch
  kind: unexplained_difference
  about:
    - pupae_nullo_bdsc41905
    - pupae_pod1_bdsc41705
    - pupae_sn_bdsc42615
    - pupae_Chd64_bdsc62377
    - pupae_form3_bdsc32398
    - pupae_Keap1_bdsc40932
    - pupae_WASp_bdsc51802
    - pupae_zip_bdsc38259
    - pupae_alpha_Cat_bdsc33430
    - pupae_DAAM_bdsc39058
    - pupae_dia_bdsc33424
    - sekine2024/rnai_screen_lethal_lines
  text: >
    sekine2024 Methods (p. 11) states that "If the number of pupae was less than
    70 on day 8, the RNAi line was judged as 'pupation defective', and used in
    the second screen (Supplementary Table 2)", and cell B3 of Supplementary
    Data 1 similarly flags "< 70 at day 8" in red. However, the actual 22 RNAi
    lines carried into sekine2024 Supplementary Table 2 do not match the day 8
    < 70 criterion: (a) 3 lines with numeric day 8 < 70 colored red in
    Supplementary Data 1 were excluded from Supplementary Table 2 without
    explanation: nullo (BDSC#41905, Larva (semi), day 8 = 34), pod1 (BDSC#41705,
    Larva (semi), day 8 = 31), and sn (BDSC#42615, viable/blank, day 8 = 66);
    (b) 6 lines with day 7-8 pupa counts >= 81 were included in Supplementary
    Table 2, including 2 of the 10 screen positives: Chd64 (BDSC#62377, day 8 =
    99, "Gentotyped after hatch", screen positive), form3 (BDSC#32398, day 8 =
    81, "Genotyped after hatch", screen positive), Keap1 (BDSC#40932, day 8 =
    86, "Genotyped after hatch"), WASp (BDSC#51802, day 8 = 101, "Genotyped
    after hatch"), zip (BDSC#38259, day 7 = 118, day 8 = n.d., "Genotyped after
    hatch, R189"), and alpha-Cat (BDSC#33430, day 7 = 112, day 8 = n.d., no
    note) — the "Genotyped after hatch" notes suggest balanced stocks whose
    non-RNAi siblings pupated; and (c) DAAM (BDSC#39058) and dia (BDSC#33424)
    have day 8 = "n.d." (with day 7 = 0). Instead of day 8 < 70, the 22 lines in
    Supplementary Table 2 correspond exactly to all 21 "Larva" lines plus 1 of
    the 4 "Larva (semi)" lines (cpb, BDSC#50954).
  citation: {sheet: "Supplementary Data1", cells: "B3", where: "legend row 3 stating day 8 < 70 red-coloring rule"}

- id: q_red_highlighting_inconsistency
  kind: possible_error
  about:
    - pupae_shot_bdsc64041
    - pupae_DAAM_bdsc39058
    - pupae_dia_bdsc33424
    - pupae_cora_bdsc28933
  text: >
    Cell B3 defines red coloring as "smaller than 70 at day 8", yet shot
    (row 109, BDSC#64041, Larva) has day 8 = 39 (< 70) with normal black font
    and no cell fill (style 2). Conversely, DAAM (row 49) and dia (row 51) have
    day 8 = "n.d." and instead have pink fill on day 7 = 0 (cells F49 and F51,
    style 6). Among the 16 red-colored day-8 cells, two undocumented styles are
    used: 12 lines with day 8 <= 21 have red font plus pink fill (style 4),
    whereas 4 lines with day 8 in 31-69 (cora=69, nullo=34, pod1=31, sn=66) have
    red font without fill (style 5).
  citation: {sheet: "Supplementary Data1", cells: "G109", where: "Row 109: shot day 8 = 39 unhighlighted despite < 70"}

- id: q_nonmonotonic_pupae_counts
  kind: possible_error
  about:
    - pupae_zip_bdsc38259
    - pupae_bif_bdsc28372
    - pupae_GMF_bdsc51452
  text: >
    Cumulative pupa counts scored on days 5-8 after crossing at 25 degC should
    be non-decreasing (prior to adult eclosion at days 9-10), but three RNAi
    rows decrease between consecutive days: zip (row 136, BDSC#38259, Larva)
    drops from 31 on day 5 to 11 on day 6 before rising to 118 on day 7 (likely
    a transcription or counting error); bif (row 19, BDSC#28372, viable) drops
    from 98 on day 7 to 96 on day 8; and GMF (row 69, BDSC#51452, viable) drops
    from 93 on day 7 to 88 on day 8.
  citation: {sheet: "Supplementary Data1", cells: "D136:F136", where: "Row 136: zip (BDSC#38259) days 5-7 = 31, 11, 118"}

- id: q_ambiguous_stock_ids_and_controls
  kind: unstated_input
  about:
    - pupae_zip_bdsc36727
    - pupae_zip_bdsc38259
    - pupae_ctrl_attP2_r2
    - pupae_ctrl_attP40_r2
    - pupae_ctrl_attP2_r3
    - pupae_ctrl_attP40_r3
    - pupae_ctrl_attP2_r4
  text: >
    sekine2024 Supplementary Table 2 and Supplementary Table 6 do not list BDSC
    stock IDs for the 22 RNAi lines imaged in the 2nd screen. For 6 genes tested
    with 2 RNAi lines in Supplementary Data 1 (cpb, jub, WASp, Keap1, dia,
    alpha-Cat), only one stock is Larva/Larva (semi) lethal, identifying the
    stock tested; however, zip has two larval-lethal lines in Supplementary Data
    1: BDSC#36727 (row 135, Larva (semi), days 5-7 = 0/6/27, day 8 = n.d.) and
    BDSC#38259 (row 136, Larva, days 5-7 = 31/11/118, day 8 = n.d., "Genotyped
    after hatch, R189"), while Supplementary Table 2 reports only a single zip
    row ("LL") without specifying the BDSC stock (presumably BDSC#38259) or why
    BDSC#36727 was omitted. In addition, the note "R189" in cell H136 is
    unexplained, and BDSC stock IDs are omitted on 5 of the 7 control rows
    (A150:A154 are blank; only A148=36303 for attP2 and A149=36304 for attP40
    are populated).
  citation: {sheet: "Supplementary Data1", cells: "A135:A136", where: "Rows 135-136: two larval-lethal zip RNAi stocks"}

- id: q_actn_false_negative_and_pupal_lethals
  kind: reading
  about:
    - pupae_Actn_bdsc34874
    - pupae_Arpc1_bdsc31246
    - pupae_Arpc3A_bdsc27044
    - pupae_Arpc3B_bdsc27528
    - pupae_Arpc4_bdsc41888
    - sekine2024/t2_actn14_orient
    - sekine_mist_complexes/myofibril_assembly_gene_count
  text: >
    Using larval lethality in the 1st RNAi screen as a primary filter missed
    alpha-Actinin (Actn, row 7, BDSC#34874), which was completely viable with
    normal pupation (0, 22, 95, 124 pupae on days 5-8) yet proved to be a core
    actin-cable crosslinker when subsequently discovered via the MIST protein
    network (Supplementary Data 2, sekine_mist_complexes, FC1047 'myofibril
    assembly', 27 genes, row 26) and tested as the actn[14] null mutant
    (42.5 deg median orientation, the strongest orientation defect in sekine2024
    Supplementary Table 2). Similarly, 21 RNAi lines caused pupal lethality
    (3 Early pupa, 12 Pupa, 6 Pupa (semi), including four Arp2/3 subunits Arpc1,
    Arpc3A, Arpc3B, Arpc4 and second lines of dia, WASp, and alpha-Cat) with
    day 7-8 pupae >= 72 and were not evaluated for embryonic stage-16 actin
    cables. Maternal deposition or variable RNAi knockdown efficiency in
    embryonic trachea thus creates known false negatives in this 1st-screen
    table.
  citation: {sheet: "Supplementary Data1", cells: "D7:G7", where: "Row 7: Actn (BDSC#34874) viable with 124 pupae on day 8"}

- id: q_encoding_and_naming_inconsistencies
  kind: reading
  about:
    - pupae_Sry_alpha_bdsc65164
    - pupae_Strn_Mlck_bdsc37523
    - pupae_strn_Mlck_bdsc55873
    - pupae_Svil_bdsc34016
    - pupae_svil_bdsc41696
    - pupae_Chd64_bdsc62377
    - sekine2024/rnai_screen_genes_total
  text: >
    Several text-encoding and naming inconsistencies occur in Supplementary Data
    1: (1) cell B116 (BDSC#65164) stores "Sry-alpha" as Shift-JIS half-width
    katakana mojibake ("Sry-\uff8e\uff71"); (2) two duplicate-line gene names
    vary in capitalization ("Strn-Mlck" row 118 vs "strn-Mlck" row 119; "Svil"
    row 120 vs "svil" row 121), so case-sensitive deduplication gives 121 names
    whereas case-insensitive deduplication matches sekine2024's reported 119
    genes (p. 3); (3) three gene symbols differ from sekine2024 Supplementary
    Table 2 ("Chd64" vs "Chd-64", "alpha-Spec" vs "aSpec", "alpha-Cat" vs
    "aCat"); and (4) minor typos appear in cell H38 ("Gentotyped after hatch"
    for Chd64) and header E5 ("day6" without a space).
  citation: {sheet: "Supplementary Data1", cells: "B116", where: "Row 116: Sry-alpha stored with Shift-JIS mojibake"}
