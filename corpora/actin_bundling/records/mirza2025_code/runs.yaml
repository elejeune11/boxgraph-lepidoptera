# ==============================================================================
# 1. Parameter mapping & equilibrium order (CortexNematic2D.cpp, AuxCortexNematic2D.cpp)
# ==============================================================================
- id: run_param_map_config
  model: code_parameter_mapping
  inputs:
    visc: cfg_visc
    cvisc: cfg_cvisc
    rvisc: cfg_rvisc
    frank: cfg_frank
    sus20: cfg_sus20
    sus40: cfg_sus40
    lambda_rot: cfg_lambda_rot
    lambda_iso: cfg_lambda_iso
    lambda_aniso: cfg_lambda_aniso
    crossLinker: cfg_crossLinker
    heqb: cfg_heqb
    k_lim: cpp_k_lim
    S2_max: cpp_S2_max
    r_out: cfg_r_out
    nx: cfg_nx
  outputs:
    k_bar_d: k_bar_d_config
    L_bar_eff: L_bar_eff_config
    lambda_o_bar: lambda_o_bar_config
    c0_bar_bare: c0_bar_bare_config
    c0_bar_with_barrier: c0_bar_barrier_config
    kappa_eff: kappa_eff_config
    iso_S_excess: iso_S_excess_config
    q_int: q_int_config
    S_0: S_0_config
    dx_elem: dx_elem_config
    entropy_margin_2d: entropy_margin_2d_config
    beta_bar_min_2d: beta_bar_min_2d_config

