# ==============================================================================
# 5. Exact 1D periodic Q1 FEM Newton-Raphson solver runs
# ==============================================================================
- id: run_fem_1d_config_exact
  model: code_q1_fem_1d_solver
  inputs:
    visc: cfg_visc
    cvisc: cfg_cvisc
    rvisc: cfg_rvisc
    frank: cfg_frank
    sus20: cfg_sus20
    sus40: cfg_sus40
    lambda_rot: cfg_lambda_rot
    lambda_iso: cfg_lambda_iso
    lambda_aniso: cfg_lambda_aniso
    crossLinker: cfg_crossLinker
    heqb: cfg_heqb
    k_lim: cpp_k_lim
    S2_max: cpp_S2_max
    r_out: cfg_r_out
    deltat_init: cfg_deltat
    maxDelt: cfg_maxDelt
    adaptiveStepTime: cfg_adaptiveStepTime
    noiseStrength: cfg_noiseStrength
  settings:
    N_elem: 160
    dt_max_scale: 1.0
    t_max: 140.0
    init_amp: 0.05
    extra_h_bug: true
    compute_threshold: false
    seed: 1
  outputs:
    rho_max: fem1d_rho_max
    rho_min: fem1d_rho_min
    S_max: fem1d_S_max
    omega: fem1d_omega
    wavelength_ratio: fem1d_w_ratio
  note: "Full 1D Q1 FEM port of LS_CortexNematic_2D with exact hidden log barrier (k_lim = 1e-4) + line-1140 extra-h factor on r_out = 127."

- id: run_fem_1d_threshold_check
  model: code_q1_fem_1d_solver
  inputs:
    visc: cfg_visc
    cvisc: cfg_cvisc
    rvisc: cfg_rvisc
    frank: cfg_frank
    sus20: cfg_sus20
    sus40: cfg_sus40
    lambda_rot: cfg_lambda_rot
    lambda_iso: cfg_lambda_iso
    lambda_aniso: cfg_lambda_aniso
    crossLinker: cfg_crossLinker
    heqb: cfg_heqb
    k_lim: cpp_k_lim
    S2_max: cpp_S2_max
    r_out: cfg_r_out
    deltat_init: cfg_deltat
    maxDelt: cfg_maxDelt
    adaptiveStepTime: cfg_adaptiveStepTime
    noiseStrength: cfg_noiseStrength
  settings:
    N_elem: 160
    dt_max_scale: 1.0
    t_max: 0.4
    init_amp: 0.05
    extra_h_bug: true
    compute_threshold: true
    seed: 1
  outputs:
    lambda_crit_fem_1d: fem1d_lam_crit
    threshold_rel_err_pct: fem1d_thresh_err_pct
  note: "Nonlinear 1D Q1 FEM instability threshold bisection on a 1-wavelength periodic cell at dx = 127/160, verifying mirza2025's < 2% linear stability accuracy claim."

- id: run_fem_1d_config_nobarrier
  model: code_q1_fem_1d_solver
  inputs:
    visc: cfg_visc
    cvisc: cfg_cvisc
    rvisc: cfg_rvisc
    frank: cfg_frank
    sus20: cfg_sus20
    sus40: cfg_sus40
    lambda_rot: cfg_lambda_rot
    lambda_iso: cfg_lambda_iso
    lambda_aniso: cfg_lambda_aniso
    crossLinker: cfg_crossLinker
    heqb: cfg_heqb
    k_lim: k_lim_zero_probe
    S2_max: cpp_S2_max
    r_out: cfg_r_out
    deltat_init: cfg_deltat
    maxDelt: cfg_maxDelt
    adaptiveStepTime: cfg_adaptiveStepTime
    noiseStrength: cfg_noiseStrength
  settings:
    N_elem: 160
    dt_max_scale: 1.0
    t_max: 140.0
    init_amp: 0.05
    extra_h_bug: false
    compute_threshold: false
    seed: 1
  outputs:
    rho_max: fem1d_nobar_rho_max
    S_max: fem1d_nobar_S_max
    omega: fem1d_nobar_omega
    wavelength_ratio: fem1d_nobar_w_ratio
  note: "Zero-barrier baseline (k_lim = 0, matching mirza2025 Eq. 3) to isolate the quantitative effect of the hidden log barrier and line-1140 extra-h bug; also used as base run for dt and mesh refinements."

# ==============================================================================
# 6. 2D periodic continuum PDE port (fibrillar kappa = -0.2 vs banded kappa = +0.2)
# ==============================================================================
- id: run_pde_2d_config_fibrillar
  model: code_2d_pde_continuum_port
  inputs:
    visc: cfg_visc
    cvisc: cfg_cvisc
    rvisc: cfg_rvisc
    frank: cfg_frank
    sus20: cfg_sus20
    sus40: cfg_sus40
    lambda_rot: cfg_lambda_rot
    lambda_iso: cfg_lambda_iso
    lambda_aniso: cfg_lambda_aniso
    crossLinker: cfg_crossLinker
    heqb: cfg_heqb
    k_lim: cpp_k_lim
    S2_max: cpp_S2_max
  settings:
    N_grid: 24
    dt: 0.06
    t_max: 60.0
    L_mult: 2.0
    pcg_maxiter: 3
    extra_h_bug: true
    seed: 1
  outputs:
    omega: pde2d_fib_omega
    rho_max: pde2d_fib_rho_max
    rho_min: pde2d_fib_rho_min
    S_max: pde2d_fib_S_max
  note: "2D periodic PDE port at exact src/config Fig. 2b(I) parameters (kappa = -0.2, fibrillar state omega < 0) on L = 2*ell_pattern (smaller than config's 8*ell_pattern to keep CPU runs fast)."

- id: run_pde_2d_swapped_banded
  model: code_2d_pde_continuum_port
  inputs:
    visc: cfg_visc
    cvisc: cfg_cvisc
    rvisc: cfg_rvisc
    frank: cfg_frank
    sus20: cfg_sus20
    sus40: cfg_sus40
    lambda_rot: cfg_lambda_rot
    lambda_iso: cfg_lambda_iso
    lambda_aniso: lambda_aniso_banded_probe
    crossLinker: crossLinker_banded_probe
    heqb: cfg_heqb
    k_lim: cpp_k_lim
    S2_max: cpp_S2_max
  settings:
    N_grid: 32
    dt: 0.04
    t_max: 75.0
    L_mult: 2.0
    pcg_maxiter: 4
    extra_h_bug: true
    seed: 1
  outputs:
    omega: pde2d_band_omega
    rho_max: pde2d_band_rho_max
    rho_min: pde2d_band_rho_min
    S_max: pde2d_band_S_max
  note: "Swapping lambda_aniso and crossLinker flips kappa from -0.2 to +0.2, confirming the fibrillar (omega < 0) to banded (omega > 0) architectural transition in the code's 2D PDE."
