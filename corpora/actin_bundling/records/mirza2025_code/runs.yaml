# ==============================================================================
# 2. Constitutive free energy, active stress & post-processing Ten_sym audit
# ==============================================================================
- id: run_constitutive_probe
  model: code_constitutive_and_stress
  inputs:
    h: probe_h_state
    q1: probe_q1_state
    q2: probe_q2_state
    grad_q1x: probe_grad_q_state
    d11: probe_d11_state
    d22: probe_d22_state
    d12: probe_d12_state
    c_visc: cpp_c_visc
    frank: cfg_frank
    sus20: cfg_sus20
    sus40: cfg_sus40
    lambda_iso: cfg_lambda_iso
    lambda_aniso: cfg_lambda_aniso
    crossLinker: cfg_crossLinker
    k_lim: cpp_k_lim
    S2_max: cpp_S2_max
    deltat: cfg_maxDelt
  outputs:
    S: S_probe_val
    f_paper: f_paper_val
    f_code_with_barrier: f_code_barrier_val
    sigma_act_xx_code: sigma_act_xx_code_val
    sigma_act_xx_paper: sigma_act_xx_paper_val
    sigma_act_xy_code: sigma_act_xy_code_val
    sigma_act_mean_slope: sigma_act_mean_slope_val
    sigma_xx_paper_exact: sigma_xx_paper_exact_val
    sigma_xx_Ten_sym_bug: sigma_xx_Ten_sym_bug_val
    sigma_xx_border_bug: sigma_xx_border_bug_val
    sigma_xy_paper_exact: sigma_xy_paper_exact_val
    sigma_xy_Ten_sym_bug: sigma_xy_Ten_sym_bug_val
    sigma_xy_border_bug: sigma_xy_border_bug_val
    Ten_sym_frank_ratio: Ten_sym_frank_ratio_val

