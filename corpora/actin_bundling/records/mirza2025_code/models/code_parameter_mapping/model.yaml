id: code_parameter_mapping
name: "Exact mapping from mirza2025_code config/dparam variables to mirza2025 dimensionless groups (CortexNematic2D.cpp:226-258; AuxCortexNematic2D.cpp:160,420,524,1070-1140)"
role: model
stated:
  file: src/CortexNematic2D.cpp
  lines: "226-227"
  quote: "userStr->dparam[1] = sus20/2;"
  where: "CortexNematic2D.cpp:226-258 & AuxCortexNematic2D.cpp:160,420,524,1070-1140"
equation: "k_bar_d = visc; L_bar = frank/2; lambda_bar_o = -lambda_rot; c_bar_0 = 2*sus20 + lambda_rot*heqb; c_bar_0_barrier = c_bar_0 + 4*k_lim/S2_max; kappa = (lambda_aniso - crossLinker)/lambda_iso; iso_S_excess = (lambda_aniso + crossLinker)/(2*lambda_iso) - 1; q_int = -sqrt(-c_bar_0/(4*sus40)) if c_bar_0 < 0 else 0; S_0 = 2*|q_int|; dx_elem = r_out/nx; entropy_margin_2d = 2*rvisc - cvisc^2; beta_bar_min_2d = -sqrt(2*rvisc)"
inputs:
  visc: {quantity: turnover_rate_dimless, unit: dimensionless}
  cvisc: {quantity: flow_alignment_dimless, unit: dimensionless}
  rvisc: {quantity: rotational_viscosity_dimless, unit: dimensionless}
  frank: {quantity: code_frank_parameter, unit: dimensionless}
  sus20: {quantity: susceptibility_a_dimless, unit: dimensionless}
  sus40: {quantity: susceptibility_b_dimless, unit: dimensionless}
  lambda_rot: {quantity: code_lambda_rot_parameter, unit: dimensionless}
  lambda_iso: {quantity: active_tension_dimless, unit: dimensionless}
  lambda_aniso: {quantity: parallel_active_tension_dimless, unit: dimensionless}
  crossLinker: {quantity: transverse_active_tension_dimless, unit: dimensionless}
  heqb: {quantity: relative_density, unit: dimensionless}
  k_lim: {quantity: barrier_stiffness_dimless, unit: dimensionless}
  S2_max: {quantity: barrier_S2_cutoff, unit: dimensionless}
  r_out: {quantity: position_dimless, unit: dimensionless}
  nx: {quantity: mesh_element_count, unit: dimensionless}
outputs:
  k_bar_d: {quantity: turnover_rate_dimless, unit: dimensionless}
  L_bar_eff: {quantity: frank_constant_dimless, unit: dimensionless}
  lambda_o_bar: {quantity: nematic_activity_dimless, unit: dimensionless}
  c0_bar_bare: {quantity: effective_susceptibility_c0_dimless, unit: dimensionless}
  c0_bar_with_barrier: {quantity: effective_susceptibility_c0_dimless, unit: dimensionless}
  kappa_eff: {quantity: active_tension_anisotropy, unit: dimensionless}
  iso_S_excess: {quantity: isotropic_tension_S_excess, unit: dimensionless}
  q_int: {quantity: nematic_tensor_1d, unit: dimensionless}
  S_0: {quantity: nematic_order_parameter, unit: dimensionless}
  dx_elem: {quantity: position_dimless, unit: dimensionless}
  entropy_margin_2d: {quantity: entropy_production_margin_dimless, unit: dimensionless}
  beta_bar_min_2d: {quantity: flow_alignment_dimless, unit: dimensionless}
settings: {}
stochastic: false
