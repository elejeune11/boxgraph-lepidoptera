- id: actin_molar_concentration
  name: actin monomer molar concentration
  dimension: "[substance] / [length]**3"
  description: "Molar concentration of monomeric actin (in bulk dilute solution, inside tactoids, or at the entropic isotropic-nematic transition)."

- id: actin_mass_concentration
  name: actin mass concentration
  dimension: "[mass] / [length]**3"
  description: "Mass concentration c of actin in mg/mL used in the uncross-linked mesh-size formula xi = 0.3 c^(-1/2)."

- id: actin_molecular_weight
  name: monomeric actin molecular weight
  dimension: "[mass] / [substance]"
  description: "Molar mass of G-actin used to convert molar concentration to mass concentration."

- id: actin_concentration_ratio
  name: dense-to-dilute actin concentration ratio
  dimension: "dimensionless"
  description: "Ratio of dense nematic/tactoid actin concentration to dilute bulk actin concentration."

- id: filamin_molar_concentration
  name: filamin molar concentration
  dimension: "[substance] / [length]**3"
  description: "Molar concentration of the F-actin cross-linker filamin."

- id: filamin_mole_fraction
  name: filamin-to-actin mole fraction
  dimension: "dimensionless"
  description: "Molar ratio (often stated in mol %) of filamin cross-linker to actin monomers."

- id: capping_protein_mole_fraction
  name: capping-protein-to-actin mole fraction
  dimension: "dimensionless"
  description: "Molar ratio (often stated in mol %) of capping protein to actin monomers."

- id: actin_monomer_spacing
  name: linear monomer spacing along F-actin
  dimension: "[length]"
  description: "Contour length per actin monomer along an F-actin filament (~2.7 nm per monomer)."

- id: monomers_per_filament
  name: average actin monomers per filament
  dimension: "dimensionless"
  description: "Mean number of actin monomers per F-actin filament set by the actin-to-capping-protein ratio."

- id: filament_length
  name: F-actin filament contour length
  dimension: "[length]"
  description: "Full contour length of an F-actin filament (denoted 2L in the SI Stokes-Einstein ellipsoid model)."

- id: filament_half_length
  name: F-actin ellipsoid semimajor axis length
  dimension: "[length]"
  description: "Semimajor axis length L (half of full filament length 2L) of the prolate ellipsoid model in the SI Stokes-Einstein equation."

- id: filament_diameter
  name: F-actin filament diameter
  dimension: "[length]"
  description: "Full cross-sectional diameter 2r of an F-actin filament (~7 nm)."

- id: filament_radius
  name: F-actin filament radius
  dimension: "[length]"
  description: "Cross-sectional radius r (semiminor axis) of an F-actin filament."

- id: filament_persistence_length
  name: F-actin persistence length
  dimension: "[length]"
  description: "Bending persistence length of F-actin (~10 um)."

- id: filamin_length
  name: filamin cross-linker length
  dimension: "[length]"
  description: "Contour/end-to-end length of a filamin cross-linker molecule (~150 nm)."

- id: mesh_size
  name: actin network mesh size
  dimension: "[length]"
  description: "Mean spacing xi between uncross-linked actin filaments before filamin addition."

- id: confocal_depth_of_field
  name: confocal optical section depth of field
  dimension: "[length]"
  description: "Axial thickness of a confocal optical section (~1 um) used in tactoid cross-sectional area estimation."

- id: temperature
  name: temperature
  dimension: "[temperature]"
  description: "Ambient experimental temperature."

- id: frap_recovery_time
  name: FRAP fluorescence recovery time
  dimension: "[time]"
  description: "Characteristic single-exponential recovery time tau_R of fluorescence intensity after photobleaching within a tactoid."

- id: bleached_region_size
  name: FRAP bleached region linear size
  dimension: "[length]"
  description: "Approximate linear spatial extent of the photobleached spot inside a tactoid."

- id: diffusion_coefficient
  name: F-actin filament diffusion coefficient
  dimension: "[length]**2 / [time]"
  description: "Translational diffusion coefficient D of F-actin filaments within a cross-linked tactoid."

- id: dynamic_viscosity
  name: effective droplet dynamic viscosity
  dimension: "[mass] / [length] / [time]"
  description: "Effective Newtonian viscosity eta (or radial/angular viscosities eta_R, eta_alpha) of a cross-linked F-actin liquid droplet."

- id: interfacial_tension_isotropic
  name: isotropic interfacial tension
  dimension: "[force] / [length]"
  description: "Isotropic liquid-like interfacial tension component gamma_I of a cross-linked F-actin droplet."

- id: interfacial_tension_anisotropic
  name: anisotropic surface anchoring energy density
  dimension: "[force] / [length]"
  description: "Anisotropic surface anchoring interfacial tension component gamma_A penalizing normal nematic director alignment."

- id: interfacial_tension_effective
  name: effective interfacial tension
  dimension: "[force] / [length]"
  description: "Effective interfacial tension gamma_eff combining isotropic and anisotropic contributions in coalescence relaxation."

- id: interfacial_tension_ratio_to_protein_droplets
  name: interfacial tension ratio relative to other protein droplets
  dimension: "dimensionless"
  description: "Factor by which F-actin droplet interfacial tension is smaller than reported protein droplets (P granules, LAF-1)."

- id: anchoring_strength
  name: dimensionless surface anchoring strength
  dimension: "dimensionless"
  description: "Dimensionless ratio omega = gamma_A / gamma_I of anisotropic anchoring energy to isotropic interfacial tension."

- id: capillary_velocity
  name: interfacial-tension-to-viscosity ratio (capillary velocity)
  dimension: "[length] / [time]"
  description: "Ratio gamma_I / eta governing the speed of surface-tension-driven viscous droplet relaxation."

- id: inverse_capillary_velocity
  name: viscosity-to-interfacial-tension ratio
  dimension: "[time] / [length]"
  description: "Inverse capillary velocity eta / gamma_I or eta / gamma_eff giving the slope of relaxation time versus deformation length."

- id: frank_elastic_constant
  name: nematic Frank elastic constant
  dimension: "[force]"
  description: "Bulk nematic Frank elastic constant K penalizing spatial distortion of the director field."

- id: director_crossover_parameter
  name: homogeneous-to-bipolar director crossover parameter
  dimension: "dimensionless"
  description: "Dimensionless ratio gamma_A V^(1/3) / K controlling the transition from homogeneous (<< 1) to bipolar (>> 1) tactoid alignment."

- id: tactoid_major_axis
  name: tactoid or bundle major axis length
  dimension: "[length]"
  description: "End-to-end major axis length L (or initial L_i, final L_f, equilibrium L_equilibrium) of a tactoid droplet or contracting bundle."

- id: tactoid_minor_axis
  name: tactoid minor axis length
  dimension: "[length]"
  description: "Equatorial width (diameter) r along the minor axis of a tactoid droplet."

- id: tactoid_aspect_ratio
  name: tactoid aspect ratio
  dimension: "dimensionless"
  description: "Ratio L / r of major axis length to minor axis width of a tactoid droplet."

- id: tactoid_arc_radius
  name: tactoid generating circular arc radius
  dimension: "[length]"
  description: "Radius R of the circular arc rotated about its chord to form the tactoid surface of revolution (Fig. S2B)."

- id: tactoid_central_angle
  name: tactoid half central angle
  dimension: "dimensionless"
  description: "Half central angle alpha (in radians, 0 < alpha < pi) subtended by the generating circular arc of a tactoid (Fig. S2B)."

- id: tactoid_arc_radius_rate
  name: rate of change of tactoid arc radius
  dimension: "[length] / [time]"
  description: "Time derivative dR/dt of the tactoid circular arc radius."

- id: tactoid_central_angle_rate
  name: rate of change of tactoid half central angle
  dimension: "1 / [time]"
  description: "Time derivative d(alpha)/dt of the tactoid half central angle."

- id: tactoid_surface_area
  name: droplet or capillary surface area
  dimension: "[length]**2"
  description: "Total interfacial surface area A of a tactoid droplet or one wavelength of a cylindrical liquid capillary."

- id: tactoid_anchoring_area
  name: effective surface anchoring area
  dimension: "[length]**2"
  description: "Effective anchoring surface integral A_omega = int dA (n_hat . N_hat)^2."

- id: tactoid_volume
  name: tactoid droplet volume
  dimension: "[length]**3"
  description: "Conserved volume V of a tactoid droplet."

- id: interfacial_free_energy
  name: interfacial free energy
  dimension: "[energy]"
  description: "Total surface free energy F = gamma_I A + gamma_A A_omega."

- id: rescaled_free_energy
  name: rescaled dimensionless free energy
  dimension: "dimensionless"
  description: "Dimensionless rescaled tactoid free energy F / (gamma_I V^(2/3))."

- id: elapsed_time
  name: elapsed experimental or relaxation time
  dimension: "[time]"
  description: "Time t during tactoid coarsening, coalescence, or bundle contraction."

- id: coarsening_exponent
  name: tactoid growth power-law exponent
  dimension: "dimensionless"
  description: "Scaling exponent alpha in average tactoid length growth L ~ t^alpha."

- id: deformation_length
  name: coalescence or contraction deformation length
  dimension: "[length]"
  description: "Total length shortening L_i - L_f during droplet coalescence or bundle contraction."

- id: relaxation_time
  name: shape relaxation time constant
  dimension: "[time]"
  description: "Characteristic exponential length-relaxation timescale tau during coalescence or bundle contraction."

- id: length_shortening_rate
  name: droplet length rate of change
  dimension: "[length] / [time]"
  description: "Instantaneous time derivative dL/dt of a relaxing droplet's length."

- id: dissipated_power
  name: viscous energy dissipation rate
  dimension: "[power]"
  description: "Rate of viscous energy dissipation (dissipated power) D during droplet or capillary deformation."

- id: contractile_strain
  name: bundle contractile strain
  dimension: "dimensionless"
  description: "Fractional shortening (L_i - L_f) / L_i of a contracting fluid F-actin bundle."

- id: integration_time_horizon
  name: ODE integration and fitting time horizon
  dimension: "[time]"
  description: "End time t_max over which the tactoid shape-relaxation ODE is integrated and fit to an exponential."

- id: bundle_length
  name: initial fluid actin bundle length
  dimension: "[length]"
  description: "Initial contour length of long thin cross-linked actin bundles formed near the liquid-solid boundary."

- id: bundle_radius
  name: unperturbed cylindrical bundle radius
  dimension: "[length]"
  description: "Initial radius R_0 of an unperturbed cylindrical fluid actin bundle / nematic capillary."

- id: perturbation_amplitude
  name: capillary radial perturbation amplitude
  dimension: "[length]"
  description: "Amplitude u of the sinusoidal radial perturbation of a cylindrical capillary."

- id: perturbation_wavelength
  name: capillary perturbation wavelength
  dimension: "[length]"
  description: "Spatial wavelength lambda (critical lambda_c, fastest-growing lambda_max, or observed pearling wavelength) along a fluid bundle."

- id: perturbation_wavenumber_dimensionless
  name: nondimensional capillary wavenumber
  dimension: "dimensionless"
  description: "Dimensionless axial wavenumber k = 2*pi*R_0 / lambda of a capillary perturbation."

- id: wavelength_to_radius_ratio
  name: instability wavelength to bundle radius ratio
  dimension: "dimensionless"
  description: "Ratio lambda / R_0 of pearling instability wavelength to initial bundle radius."

- id: wavelength_enhancement_factor
  name: nematic capillary wavelength enhancement factor
  dimension: "dimensionless"
  description: "Factor lambda_c / (2*pi*R_0) by which anisotropic surface anchoring increases the critical Rayleigh-Plateau wavelength."

- id: capillary_energy_change
  name: capillary perturbation interfacial energy cost
  dimension: "[energy]"
  description: "Interfacial free energy change delta F per wavelength lambda due to a sinusoidal radial perturbation."

- id: capillary_volume_per_wavelength
  name: perturbed capillary volume per wavelength
  dimension: "[length]**3"
  description: "Fluid volume contained within one perturbation wavelength lambda of a cylindrical capillary."

- id: capillary_growth_rate
  name: capillary instability growth rate or dynamic factor
  dimension: "1 / [time]"
  description: "Exponential growth rate Omega(k) (or dynamical hydrodynamic prefactor Lambda(k)) of a sinusoidal capillary mode."

- id: capillary_rate_scale
  name: characteristic capillary-viscous rate scale
  dimension: "1 / [time]"
  description: "Characteristic viscous capillary rate scale gamma_I / (eta * R_0) appearing in Lambda(k)."

- id: capillary_axial_velocity
  name: capillary center axial fluid velocity
  dimension: "[length] / [time]"
  description: "Characteristic axial fluid velocity v at the capillary center driven by a growing perturbation."

- id: perturbation_growth_speed
  name: radial perturbation growth velocity
  dimension: "[length] / [time]"
  description: "Time derivative du/dt of the radial perturbation amplitude."

# ==========================================================================
# Quantities added during figure digitization (Figs. 1C, 3C, 4C, 4D, S1)
# ==========================================================================

- id: normalized_fluorescence_intensity
  name: normalized FRAP fluorescence intensity ratio
  dimension: "dimensionless"
  description: "Ratio of average fluorescence intensity in the photobleached region to the unbleached region of a tactoid (Fig. 1C)."

- id: fluorescence_intensity
  name: mean fluorescence intensity
  dimension: "dimensionless"
  description: "Background-subtracted, angle-corrected mean TMR-actin fluorescence intensity in arbitrary camera counts (Fig. S1)."

- id: rescaled_length
  name: rescaled relaxation length
  dimension: "dimensionless"
  description: "Normalized remaining deformation length (L(t) - L_f) / (L_i - L_f) on droplet coalescence and bundle contraction master collapse plots (Figs. 3C, 4D)."

- id: rescaled_time
  name: rescaled dimensionless relaxation time
  dimension: "dimensionless"
  description: "Elapsed time normalized by characteristic shape relaxation time, t / tau (Figs. 3C, 4D)."

- id: normalized_bundle_length
  name: normalized contracting bundle length
  dimension: "dimensionless"
  description: "Instantaneous bundle length normalized by initial bundle length, L(t) / L_i (Fig. 4C)."

# ==========================================================================
# Quantity added for ModelAtlas cross-paper relation (grason2007+weirich2017)
# ==========================================================================

- id: capillary_free_energy_per_length
  name: capillary interfacial free energy per unit axial length
  dimension: "[energy] / [length]"
  description: "Interfacial free energy per unit axial length F / lambda (or perturbation excess delta_F / lambda) of a cylindrical nematic liquid capillary (SI p. 9)."

