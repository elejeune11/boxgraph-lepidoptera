  text: >
    No cross-record validations are entered in validations.yaml between weirich2017 (52 runnable
    models [81 output ports], 0 non-runnable; 35 origin: measured datums across 3 dimensions) and
    graham2023 (31 runnable models [40 output ports], 0 non-runnable; 38 origin: measured datums
    across 4 dimensions): 0 valid CrossValidation entries exist in either direction across all
    3,078 + 1,400 = 4,478 port-datum pairs (neither paper cites the other — graham2023 Discussion
    p. 10 cites only Scheff et al. 2020 as ref-40; 0 same_as relations; 0 cited.yaml links;
    preexisting graham2023/validations.yaml entry val_ring_filament_count_vs_nastkolb_1um is
    preserved intact, and no weirich2017/validations.yaml is created).
    (1) Forward direction — all 52 runnable weirich2017 models (81 output ports) vs all 38 origin:
    measured datums in graham2023 (3,078 total pairs; 928 dimension-matched = 16 [time] + 864
    dimensionless + 45 [length] + 3 [length]/[time]; 2,150 dimension-mismatched):
    - [time] (8 ports x 2 datums = 16 pairs):
      (a) graham2023/vasp_droplet_fusion_time ('about 1' s, Fig. 1d bare VASP droplet fusion) is
      printed with an approximate marker ('about' -> no verdict), AND graham2023 measures zero
      dynamic viscosity eta, zero 3D interfacial tension gamma_I (only assumed 2D simulation line
      tension 1-15 pN), zero capillary velocity v_cap = gamma_I/eta, and zero pre-/post-fusion
      dimensions (L_i, L_f, delta_L, r, V) for the Fig. 1d fusing droplets. Applying Weirich's
      actin-tactoid material parameters (eta ~ 3 Pa*s, gamma_I ~ 300 nN/m) to bare VASP droplets
      conflates two different materials (Weirich p. 4 explicitly notes actin tactoid gamma_I is
      ~10x lower than protein-based condensates) and diagnostically predicts tau_lin = 7.40-21.17 s
      (coalescence_tau_linear_scaling) and tau_iso = 10.00-28.60 s (isotropic_relaxation_rate_corrected)
      across D = 1.0-2.86 um (delta_L = 0.74-2.12 um), ~10-30x slower than 'about 1' s (while
      isotropic_relaxation_rate_printed is dimensionally inverted).
      (b) graham2023/frap_t_half ('18 +/- 3' s, 1.8 um bleach ROI) is a diffusive FRAP half-time,
      not a hydrodynamic coalescence relaxation time (all 8 weirich2017 [time] ports output droplet
      relaxation_time). Weirich's FRAP models (frap_diffusion_scaling,
      stokes_einstein_ellipsoid_{diffusion,viscosity}) output D or eta, neither of which is measured
      in graham2023 (diagnostically, frap_diffusion_scaling at L_b = 1.8 um, tau_R = 18/ln(2) =
      25.97 s gives D ~ 0.125 um^2/s vs 2D Soumpasis 0.0101 um^2/s, 12.4x higher due to the
      unstated circular-ROI prefactor).
    - dimensionless (27 ports x 32 datums = 864 pairs):
      (a) graham2023's 4 droplet_aspect_ratio measurements (linear_droplet_ar_high '> 15' [no
      verdict], fig3g_aspect_ratio_fig [Shell/Ring/Disc medians 1.020, 1.020, 1.050],
      fig5a_aspect_ratio_fig [actin:VASP 1:20, 1:10, 1:7.5 medians 1.044, 1.368, 2.394], and
      edfig9e_aspect_ratio_fig [3-15% PEG means 11.52, 1.27, 1.15, 1.06]) all measure isotropic
      (omega = 0) VASP droplets mechanically deformed by internal confined stiff F-actin rings and
      bundles (L_p = 17.73 um >> D). Weirich's equilibrium tactoid models
      (tactoid_equilibrium_minimizer, tactoid_aspect_ratio_scaling, tactoid_aspect_ratio_large_omega)
      depend solely on nematic anchoring omega = gamma_A/gamma_I, predict strictly spherical AR = 1.0
      at omega = 0, lack actin:VASP, ring-thickness, PEG %, or morphology-index inputs to sweep any
      of the three plotted curves, and would spuriously attribute Graham's bending-driven elongation
      to unphysical anchoring omega = (L/r)^2/4 = 1.43 (Fig. 5a 1:7.5), 33.2 (EDFig. 9e 3% PEG), or
      >56.25 (AR > 15).
      (b) graham2023's 2 partition-coefficient bar charts (edfig2d_partition_fig,
      edfig3e_actin_partition_fig) report direct fluorescence ratios I_in/I_out without separate
      c_dense and c_dilute measurements needed by concentration_enrichment_ratio.
      (c) graham2023's 5 frap_recovery_fraction datums (frap_recovery_{fig1f,text},
      fig1f_frap_avg_fig, fig6b_frap_{3,10}peg_fig) have no rising FRAP recovery model in
      weirich2017 (tactoid_exponential_master_curve models decaying length shortening exp(-t/tau)).
      (d) graham2023's remaining 21 dimensionless datums (morphology_abundance x11,
      normalized_total_intensity x5, droplet_size_frequency x4, droplet_size_count x1) have zero
      matching models in weirich2017.
    - [length] (15 ports x 3 datums = 45 pairs; targets: droplet_diam_{range_obs,median_20uM,max_20uM},
      actin-free VASP droplet diameters 1-7 um, median 2.86 um, max 7.22 um): disjoint from
      actin_filament_length_cp / filament_* (no CP, no measured filament length in graham2023),
      actin_mesh_size (actin network mesh size, unmeasured in graham2023; diagnostically xi =
      1.464 / 1.035 um at bulk 1 / 2 uM actin and 0.292 um at 12.6x enriched 25.2 uM),
      capillary_{fastest_mode,instability_threshold,wavelength}* (axial Rayleigh-Plateau pearling
      wavelength; Graham's rods are stabilized against pearling by stiff long F-actin;
      diagnostically lambda_max = 8.89*R_0 = 1.78-4.44 um at omega = 0, R_0 = 200-500 nm),
      tactoid_coarsening_power_law (no <D(t)> coarsening curve in graham2023), and
      tactoid_{exponential_relaxation,shape_dynamics_ode*,geometry_circular_arc} (unmeasured
      coalescence traces or circular equilibrium-length inputs).
    - [length]/[time] (3 ports x 1 datum = 3 pairs; target: graham2023/elongation_rate_mean_text =
      '23 +/- 3' nm/s): ATP-driven positive barbed-end polymerization growth has opposite sign and
      mechanism to isotropic_relaxation_rate_{printed,corrected}.dL_dt (negative capillary
      retraction) and is disjoint from capillary_axial_velocity.v.
    (2) Reverse direction — all 31 runnable graham2023 models (40 output ports) vs all 35 origin:
    measured datums in weirich2017 (1,400 total pairs; 310 dimension-matched = 150 [length] + 160
    dimensionless; 1,090 dimension-mismatched): 0 valid CrossValidation entries. Weirich forms
    homogeneous 3D nematic tactoids of short ~180 nm capped rods with zero peripheral actin ring
    (T_ring = 0) and zero measured 2D line tension gamma_I, wetting tensions gamma_AVR/gamma_AVD,
    tactoid_minor_axis, droplet_diameter, ring_thickness, filament_count, or monomer polymerization
    rate. At T_ring -> 0, graham2023/droplet_ring_minimization_{printed,corrected} predict a circle
    AR = 1.0 (zero anisotropic anchoring gamma_A, failing to predict d_fig2a_aspect_ratio L/r =
    2.94 -> 2.04 and d_fig3a_aspect_ratio_data ~ 2.1, with opposite crosslinker-concentration
    dependence); ring_rod_{critical,max}_aspect_ratio fail outside the L >= 2*pi*R closed-ring
    regime (L_f = 0.18 um at R = 1-2 um gives ar_max = 0.0020-0.0081 << 1);
    linear_bundle_elongation (barbed-end growth) is disjoint from capped-rod coalescence coarsening
    (d_fig3a_length_data) and coalescence shortening (d_fig3b_coalesced_data, dL/dt < 0);
    circular_ring_contour_length (1.257 um at R_0 = 200 nm) conflates lateral circumference with
    axial pearling wavelength capillary_lambda_observed ('~10' um); and graham2023 has zero [time]
    outputs or models for Weirich's FRAP traces, phase diagram, coalescence timescales, or bundle
    contraction curves. See graham2023/q_weirich2017_no_cross_validation for full details.

