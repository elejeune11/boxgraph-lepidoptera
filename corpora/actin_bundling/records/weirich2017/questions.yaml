    No stated or proposed mathematical relation (same_as, reduces_to, derived_from, scales_as, or
    approximated_by) connects any model of dutta2016 and weirich2017, and no cited.yaml link
    applies (neither paper cites the other, their reference lists share zero papers, and neither
    borrows any numerical datum from the other). Although both treat cross-linked F-actin
    bundling/phase separation, their mathematical formulations are structurally disjoint across
    four axes:
    (1) Orthogonal physical regimes and degrees of freedom: dutta2016 models a dense, pre-aligned
    melt of long strongly stretched directed polymers (explicitly excluding the isotropic-nematic
    transition on p. 3 and dropping WLC bending rigidity kappa in Eq. 3 in favor of aligning
    tension epsilon = 3*kappa_0) interacting via pairwise transverse SALR potentials (short-range
    Gaussian attraction -Gamma_A*exp(-r^2/lambda_A^2) vs. long-range 2D Yukawa/Bessel repulsion
    Gamma_R*K_0(r/lambda_R)), stopping at a static quadratic spinodal analysis around the uniform
    nematic melt (stability_function_eq8) with no interfacial tension, droplet geometry, viscosity,
    or dynamics. Conversely, weirich2017 starts from a dilute isotropic gas (c_A = 2.6 uM, mesh
    size xi ~ 1 um >> L_f) of short rigid rods (L_f ~ 0.18-1 um << l_p ~ 10 um) condensed ~100-fold
    into ~250 uM nematic liquid tactoids by the long (~150 nm), flexible, transient cross-linker
    filamin, and builds exclusively post-condensation macroscopic continuum models: sharp-interface
    Rapini-Papoular/Wulff surface free energy F = gamma_I*A + gamma_A*A_omega, equilibrium aspect
    ratio L/r(omega), coarsening L ~ t^alpha, overdamped viscous relaxation dF/dt + D = 0, FRAP
    ellipsoid diffusion/viscosity, and axial Rayleigh-Plateau capillary instability of cylindrical
    threads. weirich2017 has no model predicting bundle radius R_0 (treated as a measured input
    ~200 nm) or the empirical phase boundaries of Fig. 1D, while dutta2016 has no surface energy,
    aspect ratio, viscosity, or relaxation dynamics.
    (2) Orthogonal instability geometries, classes, and cross-linker responses: dutta2016's spinodal
    instability (stability_function_eq8, bundle_size_eq8) is a static transverse (x-y plane
    perpendicular to the aligned polymers) Type-Is (finite-wavelength microphase) instability in
    which k = 0 is thermodynamically stabilized by long-range electrostatic repulsion (F(0) < 1)
    and an intermediate band 0 < k_min < k < k_max is unstable; increasing attraction strength
    Gamma_A drives superlinear growth of transverse spacing D* = 2*pi/k_min until it diverges at
    the k = 0 macrophase spinodal. By contrast, weirich2017's capillary instability
    (capillary_energy_cost_*, capillary_dispersion_*, capillary_instability_threshold_*,
    capillary_fastest_mode_*) is a dynamic axial (z-axis parallel to the nematic director along an
    already-formed cylinder of radius R_0) Type-IIs (long-wavelength conserved) Rayleigh-Plateau
    instability in which all long wavelengths 0 < k < k_c = 1/sqrt(1 + c*omega) (c = 1 printed,
    c = 2 corrected) are thermodynamically unstable (delta F < 0, largest driving force at k -> 0)
    and k = 0 is suppressed only dynamically by volume-conserving viscous axial flow
    (Lambda(k) ~ (gamma_I/(eta*R_0))*k^2), selecting k_max = k_c/sqrt(2). Furthermore, increasing
    filamin concentration (2.5-15 mol %) decreases anchoring strength omega = gamma_A/gamma_I
    (~2.2 -> 1.1), making tactoids rounder (L/r ~ 3 -> 2), shortening the capillary pearling
    wavelength lambda_max ~ sqrt(1 + c*omega), and increasing contractile strain (Fig. 4E).
    (3) Rejected spurious algebraic coincidences: dutta2016/screening_length_salt_scaling
    (lambda_R_phys ~ n^(-1/2)) and weirich2017/actin_mesh_size (xi = 0.3*c^(-1/2)) share an
    inverse-square-root concentration exponent but describe unrelated physics (3D Debye-Huckel
    electrostatic screening vs. bulk electrolyte concentration n [M] vs. 3D semidilute geometric
    rod-network spacing vs. actin mass concentration c [mg/mL]); dutta2016/dimensionless_wavenumber_def
    (k* = k*sqrt(L*kT/epsilon)) and weirich2017/capillary_wavenumber_definition (k = 2*pi*R_0/lam)
    are generic wavenumber nondimensionalizations of orthogonal wavevectors by unrelated length
    scales (single-chain transverse wandering R_g vs. macroscopic liquid cylinder radius R_0); and
    trivial 1-2 op ratios/scalings (dimensionless_screening_length_def, effective_tension_def,
    dimensionless_areal_density_def vs. anchoring_strength_definition,
    concentration_enrichment_ratio, actin_filament_length_cp, filament_half_length_from_length,
    filament_radius_from_diameter, filamin_concentration_from_fraction) are too_plain.
    (4) Symbol collisions across the two records: L (polymer contour length [nm] in dutta2016 vs.
    tactoid/bundle major axis [um] or filament half-length [nm] in weirich2017), k (transverse
    spinodal wavenumber vs. axial capillary wavenumber), r (dimensionless inter-polymer separation
    vs. tactoid minor axis or filament radius), F (dimensionless spinodal stability function vs.
    interfacial free energy [J]), Omega (Hubbard-Stratonovich density-mode field vs. capillary
    growth rate [1/s]), rho (transverse polymer areal density [1/nm^2] vs. perturbed cylinder
    radius profile rho(z) [um]), lambda (interaction ranges lambda_R, lambda_A vs. axial capillary
    wavelengths lambda, lambda_c, lambda_max), A (transverse area vs. droplet surface area), and
    D (dimensionless bundle size D* vs. diffusion coefficient or viscous dissipation power).

