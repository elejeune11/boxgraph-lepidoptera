  text: >
    Cross-record ModelAtlas synthesis between grason2007 (chiral hexagonal-columnar/solid twisted
    F-actin bundles) and weirich2017 (achiral fluid nematic F-actin tactoids and capillaries).
    Neither paper cites the other and no datum is shared (no cited.yaml links apply); their
    reference lists share only de Gennes & Prost (1993) [grason2007/ref-15 = weirich2017/ref-21]
    and Alberts et al. [4th vs. 6th ed.].
    (1) Exact limiting intersection on the uniform achiral cylinder (5 verified proposed relations):
    both continuum theories reduce to the exact same lateral interfacial free energy per unit
    axial length, 2*pi*R*Sigma = 2*pi*R_0*gamma_I (with 1 pN/nm = 10^6 nN/m and R_0 = R/1000 um),
    in their respective reference limits: turning off chirality (f_0 -> 0 or gamma -> 0) and bulk
    cohesive offset (epsilon -> 0, equivalent to excess free energy Delta F - mu_c*rho_0*pi*R^2 at
    bulk coexistence mu = mu_c) in grason2007/columnar_free_energy_eq6 and
    columnar_free_energy_from_eq5, and taking the unperturbed straight-cylinder limit (u -> 0) in
    weirich2017/capillary_free_energy_per_length (helper F/lambda built from
    capillary_free_energy_integral), where Rapini-Papoular anchoring A_omega = int dA (n_hat.N_hat)^2
    vanishes identically as O(u^2) for arbitrary omega because the homogeneous axial director
    n_hat = z_hat is tangent to the lateral wall. For an elongated out-of-equilibrium circular-arc
    bundle of fixed major axis L_0 >> R (weirich2017/tactoid_free_energy, used for contracting
    >50 um bundles in Fig. 4B-C), parabolic cusp tapering gives A/L_0 -> (4*pi/3)*R_eq = (2/3)*(2*pi*R_eq)
    (volume V -> (8/15)*pi*R_eq^2*L_0; anchoring A_omega/A ~ (1/5)*alpha^2 -> 0), preserving exact
    linear scaling in (R, Sigma <-> gamma_I) up to the geometric factor 2/3.
    (2) Structural bifurcation away from the common cylindrical baseline (no same_as family and no
    equilibrium-radius, critical-tension, or dynamical relation):
    (a) Twist-arrested solid/columnar bundles vs. coarsening fluid nematic droplets: grason2007
    adds bulk chiral twist torque (-gamma*Omega), nonlinear in-plane hexagonal shear
    (mu_perp_bar*(Omega*R)^4; plus harmonic out-of-plane solid shear mu_par_bar*(Omega*R)^2 in
    Eq. 9), and Frank bending (K3_bar*Omega^4*R^2) at fixed filament/bundle length L and uniform
    radius R, yielding an interior negative free-energy minimum at finite radius R_0 >= lambda_{3 perp}
    for Sigma < Sigma_c (thermodynamic arrest of coarsening). Conversely, weirich2017 treats short,
    transiently cross-linked F-actin as an achiral (gamma = 0), zero-shear (mu_perp = mu_par = 0)
    viscous nematic liquid (eta ~ 3 Pa*s) with anisotropic Rapini-Papoular anchoring gamma_A =
    omega*gamma_I. At fixed droplet volume V, the equilibrium tactoid free energy scales strictly
    as F_eq(V) = F_hat_min(omega)*gamma_I*V^(2/3) (proportional to gamma_I^(5/6)*gamma_A^(1/6)*V^(2/3)
    for omega >= 1, where gamma_A*A_omega / (gamma_I*A) -> 1/5 at equilibrium alpha_eq ~ omega^(-1/2)),
    so F_eq/V proportional to V^(-1/3) decreases monotonically with size and drives unbounded
    coalescence (L ~ t^(0.47 +/- 0.01) vs. 0.5) rather than finite-radius arrest. Meanwhile,
    unperturbed fluid cylinders of radius R_0 (treated as an experimental input ~200 nm rather than
    a predicted output) are linearly unstable to volume-conserving axial Rayleigh-Plateau pearling
    (lambda >= 2*pi*R_0*sqrt(1 + 2*omega) corrected; 1 + omega printed) and axial contraction.
    (b) Opposite limits of Frank elasticity (shared reference de Gennes & Prost 1993): grason2007
    Eq. (3) assumes K_3 >> K_1, K_2 and retains bulk bend K_3 and chiral twist coupling gamma =
    2*K_2/P coupled to hexagonal lattice shear (lambda_{3 perp} = sqrt(K3_bar/mu_perp_bar)) while
    using isotropic lateral tension Sigma; weirich2017 SI p. 8 invokes one-constant Frank elasticity
    K solely in chi = gamma_A*V^(1/3)/K << 1 (director_crossover_parameter) to drop all bulk
    director distortion (homogeneous n_hat = z_hat) and retain purely interfacial tension + anchoring.
    (c) Static thermodynamics vs. overdamped hydrodynamics: grason2007 has no viscosity, diffusion,
    time evolution, or hydrodynamic dispersion; weirich2017 has no chirality, lattice shear, or
    equilibrium bundle-diameter prediction.
    (3) Rejected trivial or spurious pairings and symbol collisions: bundle_diameter_from_radius
    (D = 2*R) vs. filament_radius_from_diameter (r = d/2) is a 1-op too_plain identity on distinct
    objects (multi-filament bundle vs. single filament); chiral_torque_coupling (gamma = 2*K_2/P)
    vs. director_crossover_parameter (chi = gamma_A*V^(1/3)/K) involve unrelated physical quantities
    with opposite K exponents despite sharing the symbol gamma; capillary_wavenumber_definition
    (k = 2*pi*R_0/lambda) vs. helical tilt theta = Omega*R = 2*pi*R/Lambda_twist describe orthogonal
    deformations (axisymmetric varicose pearling vs. helical braiding); and cluster_size_distribution_eq7
    vs. tactoid_exponential_relaxation are unrelated Boltzmann vs. temporal exponentials.
