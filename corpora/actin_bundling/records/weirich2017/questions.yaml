  text: >
    No cross-record validations are entered in validations.yaml for weirich2017's 52 runnable
    models (81 output ports) against claessens2008's 26 origin: measured data (12 scalars, 14
    digitized curves across 9 quantities; plus 57 non-measured entries), because neither paper
    cites the other (sharing only Spudich & Watt 1971) and no weirich2017 model predicts any
    claessens2008 measurement on Claessens et al.'s conditions without circularity, fabricating
    unmeasured inputs, or conflating distinct physical quantities:
    (1) Semidilute mesh-size and actin-concentration models (3: actin_concentration_from_mesh_size,
    actin_mesh_size, actin_mass_concentration) vs. claessens2008 Fig. 2E confinement phase
    boundaries (ca_fig2e_single_ring_max and ca_fig2e_two_bundle_min, origin: measured,
    actin_mass_concentration [mg/ml] indexed by droplet_diameter [um]):
    (a) actin_concentration_from_mesh_size (c = (0.3/xi)^2, role: processing helper inverse of
    Schmidt et al. 1989) is the sole weirich2017 model connected to claessens2008 by verified
    ModelAtlas relations (rel_claessens2008_droplet_conc_scales_mesh_size and
    rel_claessens2008_droplet_conc_approx_mesh_size via xi = D_d/sqrt(2*n_f)), and shares the
    output quantity actin_mass_concentration with Fig. 2E. However, it cannot be honestly validated
    against ca_fig2e_single_ring_max or ca_fig2e_two_bundle_min because claessens2008 never
    independently measures the uncross-linked cubic-network mesh size xi: sweeping xi directly over
    ca_fig2e_* would illegally map droplet_diameter to mesh_size (two physically distinct
    quantities sharing only [length], yielding c = (0.3/D_d)^2 that underpredicts
    ca_fig2e_single_ring_max [D_d = 6.88-22.71 um, c_a = 0.10-0.02 mg/ml] by 52.5x-113.9x and
    ca_fig2e_two_bundle_min [D_d = 9.60-26.96 um] by 94.8x-241.6x); computing xi = 0.3*c_a^(-1/2)
    from c_a itself is an algebraic tautology (c = c); and substituting the cross-paper geometric
    identity xi = D_d/sqrt(2*n_f) at n_f = 20 requires pre-transforming D_d outside the model using
    Claessens's own droplet-ring assumption (fabricating unmeasured xi values in added.yaml and
    still incompatible with sweeping droplet_diameter). Diagnostically, even that hybrid formula
    gives c*D_d^2 = 3.600 (mg/ml)*um^2 (+24.7% above claessens2008/droplet_critical_concentration's
    2.886 at d = 2.9 nm from Schmidt's 1-sig-fig rounding of 0.2686 to 0.30), still underpredicting
    ca_fig2e_single_ring_max by 1.31x-2.85x (c_a*D_d^2 = 4.73-10.25, implied D_d/xi = 7.25-10.67,
    n_f_mesh = 26.3-57.0), ca_fig2e_two_bundle_min by 2.37x-6.04x (c_a*D_d^2 = 8.53-21.74,
    D_d/xi = 9.74-15.54, n_f_mesh = 47.4-120.8), and the non-measured plotted boundary
    ca_fig2e_nf20_boundary by 1.77x-1.81x (c_a*D_d^2 = 6.43; see
    claessens2008/q_fig2e_quantified_factor_2p22).
    (b) actin_mass_concentration (c = c_A*M_w, role: processing) cannot be validated against
    ca_fig2e_* because Fig. 2E reports only mass concentration c_a [mg/ml] vs. D_d with no molar
    c_A input (the sole molar concentration in claessens2008, ca_fig4cd = 0.95 uM, and ca_fig1a =
    0.04 mg/ml are both origin: reported preparation recipes from separate assays anchored to the
    same added M_w = 42000 g/mol).
    (c) actin_mesh_size (xi = 0.3*c^(-1/2)) has no measured mesh_size target in claessens2008
    (diagnostically yielding xi = 2.12, 1.73, 1.50, 1.34, 0.95 um across Fig. 2E's 0.02-0.10 mg/ml
    and 0.34, 0.21, 0.17, 0.13 um across SAXS 0.8-5.0 mg/ml).
    (2) Tactoid shape, anchoring, and Rayleigh-Plateau capillary instability models (29:
    tactoid_equilibrium_minimizer, tactoid_aspect_ratio_scaling, tactoid_aspect_ratio_large_omega,
    tactoid_geometry_circular_arc, tactoid_free_energy, tactoid_rescaled_free_energy,
