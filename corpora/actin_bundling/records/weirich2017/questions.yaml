  text: >
    No cross-record validations are entered in validations.yaml for weirich2017's 52 runnable
    models against nastkolb2022's 66 origin: measured data (16 scalars, 50 digitized curves
    across 22 quantities), because neither paper cites the other and no weirich2017 model
    predicts any nastkolb2022 measurement on Nast-Kolb et al.'s conditions without conflating
    distinct physical quantities or fabricating unmeasured parameters:
    (1) FRAP and Stokes-Einstein hydrodynamic models (3: frap_diffusion_scaling,
    stokes_einstein_ellipsoid_diffusion, stokes_einstein_ellipsoid_viscosity) vs. nastkolb2022
    VASP FRAP data (10 measured data: frap_t_half_vasp_slb = 0.102 min, frap_t_half_vasp_ml =
    0.399 min, 4 frap_mobile_fraction_*, 4 frap_curve_*_fig4c): nastkolb2022 contains zero
    measured diffusion_coefficient ([length]^2/[time]) and zero measured dynamic_viscosity
    ([mass]/[length]/[time]) data, and weirich2017 has no inverted model outputting FRAP
    recovery half-time, mobile fraction, or FRAP intensity curves I(t). Physically, nastkolb2022
    tracks 2D lipid-anchored Alexa532-VASP tetramers (bleach circle diameter d_b = 4.96 um,
    r_b = 2.48 um) rather than 3D prolate F-actin rods in a bulk Newtonian fluid, measuring
    neither membrane viscosity eta nor filament length 2L. Diagnostically, frap_diffusion_scaling
    (D ~ L_b^2/tau_R) gives 0.697 um^2/s (L_b = r_b) or 2.786 um^2/s (L_b = d_b) on SLB
    (tau = 8.83 s) and 0.178 or 0.712 um^2/s on ML (tau = 34.54 s), vs. 2D uniform-disk
    Soumpasis D = 0.2251 um^2/s (SLB, 75x Weirich's ~0.003 um^2/s) and 0.0575 um^2/s (ML, 19x).
    (2) Capping-protein length, concentration, and semidilute mesh-size models (8:
    actin_filament_length_cp, filament_half_length_from_length, filament_radius_from_diameter,
    actin_mesh_size, actin_concentration_from_mesh_size, actin_mass_concentration,
    concentration_enrichment_ratio, filamin_concentration_from_fraction) vs. nastkolb2022
    capping-protein, actin-titration, pore-size, enrichment, and VASP-LLPS measurements:
    nastkolb2022 measures zero filament_length, monomers_per_filament, filament_half_length,
    filament_radius, 3D uncrosslinked mesh_size [um], actin_mass_concentration [mg/mL],
    actin_concentration_ratio, or filamin_molar_concentration (all actin_conc_* and
    cp_conc_standard are origin: reported recipe values, Nast-Kolb uses zero filamin, and
    vasp_llps_threshold_main / vasp_llps_range_si are VASP incubation thresholds rather than
    filamin concentrations). Diagnostically: (a) actin_filament_length_cp (L_f = 2.7 nm/r_CP) at
    Nast-Kolb's 50 nM CP over 0.5, 1, 2, 4 uM actin (r_CP = 10%, 5%, 2.5%, 1.25%) predicts
    27.0, 54.0, 108.0, and 216.0 nm, breaking down >100x against Nast-Kolb's actively elongating
    >10-50 um filaments in 10 uM profilin + anti-capping VASP; (b) actin_mesh_size (xi =
    0.3*c^(-1/2) [um], 3D uncrosslinked bulk spacing) is both dimensionally ([length] vs
    [length]^2) and physically distinct from Nast-Kolb's 2D inter-bundle bundle_pore_size (4
    curves: pore_size_vs_actin_figs3f, pore_size_vs_vasp_fig2e, pore_size_by_elongator_fig3f,
    pore_size_cp_substrate_figs4f), though diagnostically xi = 2.070, 1.464, 1.035, 0.732 um
    (xi^2 = 4.286, 2.143, 1.071, 0.536 um^2) tracks 1.4x-2.0x above Fig. S3F median 2D pore
    areas 2.109, 1.229, 0.599, 0.382 um^2 (pore/xi^2 = 0.49-0.71); and (c)
    concentration_enrichment_ratio (3D dense/dilute actin molar ratio) is distinct from
    vasp_enrichment_kinetics_fig5c and lipid_depletion_kinetics_fig5c (2D under-bundle vs
    next-to-bundle VASP and lipid fluorescence intensity ratios I_under/I_next).
    (3) Tactoid equilibrium shape, free-energy, and anchoring models (11:
    tactoid_equilibrium_minimizer, tactoid_aspect_ratio_scaling, tactoid_aspect_ratio_large_omega,
    tactoid_geometry_circular_arc, tactoid_free_energy, tactoid_rescaled_free_energy,
    tactoid_rescaled_free_energy_figS2c_norm, anchoring_strength_definition,
    anchoring_strength_from_aspect_ratio, anchoring_strength_from_aspect_ratio_curve,
    director_crossover_parameter): nastkolb2022 forms continuous spanning 2D membrane-bound
    bundle networks rather than isolated finite-volume 3D tactoids and measures zero aspect
    ratios, droplet volumes, circular-arc radii R, cusp angles alpha, droplet surface areas,
    anchoring strengths omega, or interfacial tensions (gamma_I, gamma_A). In particular,
    tactoid_geometry_circular_arc.r (equatorial width 2*R*(1 - cos(alpha))) cannot predict
    nastkolb2022's bundle_width (7 data) or bundle_width_max (2 data) without circular-arc
    inputs (R, alpha) that do not exist for continuous 2D ribbons.
    (4) Tactoid coarsening, coalescence, and contraction dynamics models (12:
    tactoid_coarsening_power_law, tactoid_exponential_relaxation,
    tactoid_exponential_master_curve, tactoid_shape_dynamics_ode,
    tactoid_shape_dynamics_ode_rayleigh2, tactoid_dissipation_power,
    coalescence_tau_linear_scaling, isotropic_coalescence_tau_energy_balance,
    isotropic_relaxation_rate_printed, isotropic_relaxation_rate_corrected,
    bundle_contractile_strain, interfacial_tension_from_capillary_velocity): nastkolb2022
    observes neither tactoid coalescence nor motor-free bundle contraction, reporting zero
    length-vs-time curves L(t), zero mechanical shape-relaxation times tau, zero contractile
    strain measurements (lipid_relaxation_fraction_60min = "~0.5" is lipid fluorescence
    relaxation, not mechanical shortening), and zero dissipated power or interfacial-tension
    data. Mapping shape relaxation_time to frap_recovery_half_time (0.102, 0.399 min) or
    assay_elapsed_time (bundle_diffraction_limited_window = 0 to 80 s,
    mdia1_tirf_decline_onset_time = 6 min), or decaying rescaled_length to rising TIRF/FRAP
    fluorescence curves, would conflate distinct physical quantities that only share a dimension.
    (5) Rayleigh-Plateau capillary instability models (18:
    capillary_instability_threshold_printed/corrected, capillary_fastest_mode_printed/corrected,
    capillary_dispersion_printed/corrected, capillary_dynamic_factor_scaling,
    capillary_rate_scale, capillary_energy_cost_printed/corrected, capillary_free_energy_integral,
    capillary_free_energy_per_length, capillary_volume_conservation_printed/corrected,
    capillary_wavelength_from_wavenumber, capillary_wavenumber_definition,
    capillary_axial_velocity, capillary_dissipation_power): nastkolb2022's 2D membrane-anchored
    VASP ribbons exhibit no Rayleigh-Plateau pearling and report zero perturbation_wavelength,
    wavenumber, wavelength_to_radius_ratio, or growth-rate data. Diagnostically, evaluating
    capillary_fastest_mode_corrected (2*pi*R_0*sqrt(2*(1 + 2*omega))) on Nast-Kolb's Fig. 2E
    median bundle half-widths R_0 = W/2 = 0.274-2.179 um yields lambda_max = 5.44-43.29 um at
    omega = 2 (9.38 um at 0.25 uM VASP, W = 0.945 um; 4.20 um isotropic omega = 0), with no
    pearling observable in nastkolb2022.
    (6) Remaining 39 of 66 origin: measured data in nastkolb2022 (completing all 22 measured
    quantities): intensity-extrapolated filament count (1: filament_count_1um_intensity_measured
    = 45 +/- 12), transverse fluorescence cross-sections (4: actin_profile_0s_fig2c,
    actin_profile_405s_fig2c, lipid_profile_fig5b, actin_profile_fig5b), bundle-width histograms
    (8: width_hist_vasp_005/0125/025/050_fig2d, width_hist_vasp_100_figs2i,
    width_hist_vasp_slb/nocp_slb/nocp_ml_figs4c), TIRF actin polymerization kinetics (16: 6
    kinetics_*_fig3e, bundle_actin_kinetics_fig5c, 5 raw_actin_kinetics_vasp_*_figs2f, 4
    raw_actin_kinetics_actin_*_figs3e), VASP-actin Spearman colocalization (4: coloc_*_fig4b),
    bilayer decoration / VASP fluorescence / pre-actin cluster area (3:
    bilayer_decoration_vs_vasp_figs2g, bilayer_vasp_fluor_vs_vasp_figs2h,
    vasp_cluster_area_vs_vasp_figs4h), VASP LLPS concentration thresholds (2), and lipid
