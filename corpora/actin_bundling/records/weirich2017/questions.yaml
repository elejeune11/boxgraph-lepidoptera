- id: q_capillary_missing_factor_of_2_omega
  kind: possible_error
  about:
    - capillary_free_energy_integral
    - capillary_energy_cost_printed
    - capillary_energy_cost_corrected
    - capillary_instability_threshold_printed
    - capillary_instability_threshold_corrected
    - capillary_dispersion_printed
    - capillary_dispersion_corrected
    - capillary_fastest_mode_printed
    - capillary_fastest_mode_corrected
    - capillary_lambda_max_predicted
    - rel_cap_integral_reduces_to_energy_printed
    - rel_cap_integral_reduces_to_energy_corrected
  text: >
    On SI p. 9 col 2, the paper writes the exact nematic capillary surface integrals
    A = 2*pi*int_0^lambda rho*sqrt(1 + rho'^2) dz, A_omega = 2*pi*int_0^lambda rho*rho'^2/sqrt(1 + rho'^2) dz,
    and F = gamma_I*(A + omega*A_omega) with rho(z) = R_0 + u*sin(2*pi*z/lambda) - u^2/(4*R_0),
    consistent with gamma_ij = gamma_I*delta_ij + gamma_A*n_i*n_j (SI p. 8, no factor of 1/2).
    Expanding both integrals to O(u^2) gives A - 2*pi*R_0*lambda = (pi*lambda*u^2/(2*R_0))*(k^2 - 1)
    (factor 1/2 from sqrt(1 + rho'^2) = 1 + rho'^2/2 + ...) and omega*A_omega = (pi*lambda*u^2/R_0)*omega*k^2
    = (pi*lambda*u^2/(2*R_0))*(2*omega*k^2) (no factor 1/2 in rho'^2/sqrt(1 + rho'^2) = rho'^2 + ...).
    Hence the exact O(u^2) expansion is delta F = (pi*lambda*u^2*gamma_I/(2*R_0))*[(1 + 2*omega)*k^2 - 1],
    giving lambda_c = 2*pi*R_0*sqrt(1 + 2*omega) and k_max = 1/sqrt(2*(1 + 2*omega)), whereas SI p. 9
    and Fig. S3 caption print (1 + omega) throughout. Notably, at the paper's typical parameters
    R_0 ~ 200 nm and omega ~ 2, the printed (1 + omega) formula gives lambda_max = 3.08 um, whereas
    the corrected (1 + 2*omega) formula gives lambda_max = 3.97 um, closely matching the paper's own
    printed prediction lambda_max ~ 4 um.
  citation:
    page: 9
    printed_page: "SI-3"
    quote: "To leading order in u, the interfacial energy cost for the sinu-"
    where: "SI Text, Capillary Instabilities in Long Droplets"

