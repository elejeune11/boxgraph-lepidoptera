  citation:
    page: 3
    printed_page: "2133"
    quote: "less orientationally constrained, long-range attractive interaction"
    where: "text, p. 2133 col 1 & SI p. SI-1 col 1"
  text: >
    Regime-level physical contrast linking dutta2016's exact SALR stability criterion to
    weirich2017's experimental filamin/F-actin phase separation:
    (1) Exact global no-finite-bundle theorem in dutta2016 Eq. (8): using the exact integral
    representation b(k) = 2 * int_0^1 (1 - t) * exp(-k^2 * t / 2) dt (strictly decreasing for all
    k > 0) and writing x = (q * lambda_R)^2 (with q = k in consistent stability_function_eq8 and
    q = 2*pi*k in stability_function_eq8_mixed2pi) and alpha = (lambda_A / (2 * lambda_R))^2,
    whenever lambda_A >= 2 * lambda_R (alpha >= 1) we have exp(alpha * x) / (1 + x) > 1 and
    1 - exp(-alpha * x) >= x / (1 + x) for all x > 0. Consequently, if beta V(0) >= 0 then
    beta V(k) > 0 for all k > 0 (no instability), whereas if beta V(0) < 0 then
    -beta V(k) < -beta V(0) and b(k) < 1 for all k > 0, giving F(k) < F(0) strictly for all k > 0
    (likewise on the F(0) = 1 macrophase boundary the O(k^2) curvature is
    c_2 = 2*pi*rho* * Gamma_R * lambda_R^4 * (1 - lambda_A^2/(4*lambda_R^2)) - lambda_A^2/4 - 1/6 < 0).
    Thus for lambda_A >= 2 * lambda_R, dutta2016's Eq. (8) mathematically forbids finite-bundle
    microphase separation for all (rho*, Gamma_R, Gamma_A), independent of 2*pi Fourier convention
    and length normalization R_g, permitting only uniform liquid or k = 0 macroscopic phase
    separation.
    (2) Inverted SALR hierarchy in weirich2017: in weirich2017's actin polymerization buffer
    (SI p. 7: 50 mM KCl, 1 mM MgCl2, 10 mM imidazole pH 7.5, 0.2 mM EGTA, 300 uM ATP at ~20 degC),
    the ionic strength is I ~= 53-58 mM, yielding a Debye screening length lambda_D ~= 1.27-1.32 nm.
    By contrast, filamin is a long, flexible cross-linker of length lambda_{A,phys} ~ 150 nm
    (filamin_length_main, p. 3), producing an attraction-to-repulsion range ratio
    lambda_A / lambda_R = lambda_{A,phys} / lambda_D ~= 113-119 >> 2 that inverts dutta2016's SALR
    ordering by two orders of magnitude. Moreover, inside weirich2017's ~250 uM tactoids
    (c_actin_tactoid_est, 1 monomer per 2.7 nm), the mean aligned filament areal density is
    rho = c_A * a_m ~= 4.07 x 10^-4 nm^-2 (center-to-center inter-filament spacing ~50 nm ~=
    38 * lambda_D, where 2D Debye-Huckel repulsion K_0(38.2) ~= 5.5 x 10^-18 is negligible).
    Qualitatively, weirich2017's experimental observation of unbounded macroscopic liquid-liquid
    phase separation into coarsening nematic tactoids (L ~ t^(0.47 +/- 0.01), with no equilibrium
    finite-bundle thickness arrest) accords with dutta2016's lambda_A >= 2*lambda_R macrophase
    regime, but because dutta2016 assumes a dense pre-aligned melt and stops at quadratic spinodal
    onset without interfacial tension, droplet shape, or viscosity, no quantitative ModelAtlas
    mapping connects their models.

