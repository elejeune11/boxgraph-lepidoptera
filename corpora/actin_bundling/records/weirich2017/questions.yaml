    nf_max_confinement, D_fil_fig2d_caption, D_fil_fig2d_text, D_ratio_fig4d, Rstar_plateau,
    Rstar_figS1_experiment): weirich2017 has no model predicting equilibrium bundle diameter
    (bundle_radius R_0 is strictly an experimental input; tactoid_geometry_circular_arc.r =
    2*R*(1 - cos(alpha)) is the equatorial width of a finite-volume circular-arc spindle tactoid
