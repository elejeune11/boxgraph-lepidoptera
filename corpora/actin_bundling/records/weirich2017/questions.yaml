  citation:
    page: 8
    printed_page: "SI-2"
    quote: "The equilibrium shape of a liquid droplet is determined by mini-"
    where: "SI Text (pp. SI-1 to SI-3) & Main Text (pp. 2131-2135) vs chandrasekaran2024"
  text: >
    No cross-record validations are entered in validations.yaml for weirich2017's 52 runnable
    models (81 output ports) against chandrasekaran2024's 10 origin: measured datums (4 scalars
    and 6 digitized curves across 3 quantities; 810 total pairs, 270 dimension-matched), nor in
    the reverse direction (42 runnable chandrasekaran2024 models [56 output ports] + 4 non-runnable
    vs weirich2017's 35 origin: measured datums [12 scalars + 23 digitized curves across 15
    quantities]; 1,960 total pairs, 625 dimension-matched). Neither paper cites the other
    (chandrasekaran2024 cites only Weirich et al. 2019 as Ref. 12; 0 shared references; 0
    cited.yaml links). Synthesis ALREADY executes 2 automatic same_as cross-checks via
    chandrasekaran2024/rel_weirich2017_stokes_einstein_diffusion (mapping R_H = L/ln(2*L/r)):
    (a) weirich2017/stokes_einstein_ellipsoid_diffusion on
    chandrasekaran2024/run_stokes_einstein_vasp computes 0.014536 um^2/s vs
    chandrasekaran2024/vasp_diffusion_rate ('10', origin: reported -> not reproduced, matching
    cmp_stokes_einstein_vs_vasp_D); and (b) chandrasekaran2024/stokes_einstein_diffusion on
    weirich2017/run_se_diffusion_check computes 0.003133 um^2/s vs weirich2017/D_frap_est
    ('~0.3 x 10^-2', origin: estimated -> no verdict, matching cmp_se_diffusion_consistency and
    circular with eta_frap_est).
    (1) Forward direction — weirich2017 models (52 runnable, 81 ports) vs chandrasekaran2024
    origin: measured data (10 datums):
    - Every single origin: measured datum in chandrasekaran2024 quantifies 3D VASP-droplet
      Shell/Ring/Disk population percentage abundances from Fig. 6D (exp_wt_disk_pct_1_7p5 =
      '70 ± 13'%, exp_gabmut_disk_pct_1_7p5 = '< 10'% [inequality -> no verdict],
      exp_gabmut_ring_pct_1_7p5 = '53 ± 6'%, exp_gabmut_shell_pct_1_7p5 = '37 ± 4'%, and the 6
      digitized stacked-bar series fig6d_{wt,gabmut}_{shell,ring,disk}_fig across Actin:VASP =
      1:20, 1:10, 1:7.5). Although 27 weirich2017 output ports are dimensionless (270 pairs), ZERO
      models predict 3D protein-droplet actin-morphology population percentages (shell_abundance,
      ring_abundance, disk_abundance); weirich2017's dimensionless ports instead output nematic
      tactoid geometry/energy (aspect_ratio, alpha_eq, F_hat, omega, chi), capping-protein monomer
      counts (N_m), actin enrichment ratio, capillary instability wavenumbers/enhancements
      (k, k_max, lambda_to_R0, enhancement), contractile strain, and exponential collapse curves.
    - All 214 remaining datums in chandrasekaran2024 are non-measured (107 run, 88 reported, 15
      derived, 3 predicted, 1 assumed) and also lack valid non-circular validation targets for
      weirich2017: chandrasekaran2024 measures no FRAP recovery or diffusivity (vasp_diffusion_rate
      = 10 um^2/s is a reported CytoSim input already tested by the automatic same_as cross-check),
      uses no capping protein or filamin, observes no Rayleigh-Plateau pearling or bundle
      contraction, measures no 3D mesh size (diagnostically, actin_mesh_size gives xi = 0.896 um
      at Fig. 6D 1:7.5 bulk 2.67 uM actin — matching Weirich's 0.908 um at 2.6 uM — and 0.278 /
      0.124 um at intradroplet CytoSim 27.67 uM / nucleator 138.38 uM), and its deformed aspect
      ratios (Fig. 7B, 7A.ii, S1F) are simulation outputs (origin: run/derived) of isotropic
      omega = 0 VASP condensates deformed by confined ring bending where weirich2017's equilibrium
      anchoring models predict spherical AR = 1.
    (2) Reverse direction — chandrasekaran2024 models (42 runnable [56 ports] + 4 non-runnable) vs
    weirich2017's 35 origin: measured datums (plus non-measured D_frap_est,
    filament_persistence_length_si, c_actin_tactoid_est): 0 valid cross-validations.
    - weirich2017 measures zero tactoid_minor_axis, zero tactoid_volume, and zero droplet_radius
      (R_drop), so prolate_spheroid_volume_conserving cannot predict weirich2017's measured aspect
      ratios (aspect_ratio_{2p5,15}_filamin, d_fig2a_aspect_ratio, d_fig3a_aspect_ratio_data)
      without circularly deriving R_drop from L/r or fabricating a fixed volume (whereas Fig. 3A
      coarsening grows tactoid volume 24.4x at constant L/r ~ 2.1); filament_length_limited_aspect_ratio
      and ellipse_2d_constant_area fail because weirich2017's capped filaments (~0.18 um) are
