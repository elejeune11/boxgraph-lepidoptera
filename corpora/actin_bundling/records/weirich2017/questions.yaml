  text: >
    No cross-record validations are entered in validations.yaml between weirich2017 (52 runnable
    models [33 role: model, 3 role: fit, 16 role: processing; 8 variant_of corrections; 81 output
    ports] and 35 origin: measured datums) and gubbala2025 (26 runnable models [22 role: model, 4
    role: processing; 8 variant_of corrections; 82 output ports] and 16 origin: measured datums):
    0 valid CrossValidation entries exist in either direction across all 1,296 + 2,870 = 4,166
    port-datum pairs (1,911 dimension-matched, 2,255 dimension-mismatched; no validations.yaml
    created in either record and 0 added.yaml entries required).
    (1) Forward direction — all 52 runnable weirich2017 models (81 output ports) vs all 16 origin:
    measured datums in gubbala2025 (1,296 total pairs; 351 dimension-matched = 30 [length] + 24
    [time] + 297 dimensionless; 945 dimension-mismatched):
    - [length] (15 ports x 2 datums = 30 pairs):
      (a) gubbala2025/domain_size_no_actin ('approx 1 to 10' um, p. 4: 'small domains nucleate
      within seconds and grow to approx 1-10 um over a few minutes' in actin-free Lo/Ld bilayers):
      tactoid_coarsening_power_law (L ~ t^alpha, prefactor: unknown, output tactoid_major_axis [um])
      is strictly inapplicable on four independent grounds: different physical system and quantity
      (2D circular actin-free lipid Lo domains undergoing Ostwald ripening alpha = 1/3 vs 3D nematic
      cross-linked actin tactoids coalescing at alpha = 0.47 +/- 0.01), unstated measurement time t
      ('over a few minutes'), prefactor: unknown yielding mandatory no_verdict on any single scalar
      datum, and approximate 'approx' range marker (no_verdict). Likewise, tactoid_geometry_circular_arc,
      tactoid_exponential_relaxation, and tactoid_shape_dynamics_ode* predict 3D nematic tactoid
      lengths/relaxation trajectories (never measured in gubbala2025), actin_mesh_size predicts 3D
      solution filament spacing xi (no bulk actin mass concentration in gubbala2025 and no actin
      present in domain_size_no_actin), and capillary_{fastest_mode,instability_threshold,wavelength}*
      predict axial Rayleigh-Plateau pearling wavelengths of 3D cylindrical actin bundles.
      (b) gubbala2025/actin_filament_length_exp ('3 to 5' um, SI Sec. 1.5): actin_filament_length_cp
      (L_f = a_m / r_CP) requires capping protein mole fraction r_CP > 0, whereas gubbala2025 SI
      Sec. 1.2 & 1.5 polymerizes uncapped F-actin with zero capping protein (r_CP = 0, where a_m/r_CP
      diverges; inverting 3-5 um would spuriously fabricate r_CP = 0.054-0.090 mol %). Physically,
      Gubbala's 3-5 um uncapped filaments sit squarely in Weirich's Fig. 1D space-spanning
      viscoelastic network regime (L > 1 um) rather than Weirich's 0.1-1 um liquid-tactoid regime.
      All other 14 [length] ports output distinct quantities (mesh size, pearling wavelength,
      tactoid axes, filament half-length/radius).
    - [time] (8 ports x 3 datums = 24 pairs):
      All 8 weirich2017 [time] ports output single-droplet or bundle hydrodynamic shape-relaxation
      time constants tau (coalescence_tau_linear_scaling, isotropic_coalescence_tau_energy_balance,
      isotropic_relaxation_rate_{printed,corrected}, tactoid_shape_dynamics_ode{,_rayleigh2}.{tau,
      tau_linearized}, yielding ~10-60 s for 3D actin tactoid coalescence). None of Gubbala's 3
      [time] datums — coarsening_time_actin ('approx 2' hr, overall slow coarsening duration),
      intermediate_time_start ('approx 10' min, lower bound of intermediate regime), and
      actin_unbinding_time ('>=~ 2' hr, onset of electrostatic actin unbinding) — is a capillary
      shape-relaxation time constant tau (and all three carry approximate/one-sided markers yielding
      no_verdict, with zero viscosity eta, interfacial tension gamma_I, or deformation length
      L_i - L_f measured in gubbala2025).
    - dimensionless (27 ports x 11 datums = 297 pairs):
      (a) All 7 normalized domain-coarsening measurements R(t)/R_0 (R_ratio_fig3_exp_low,
      R_ratio_fig3_exp_high, R_ratio_fig3_inset_no_actin_exp, R_ratio_figS2_exp_low,
      R_ratio_figS2_exp_high, R_ratio_{low,high}_exp_fig3_end): weirich2017/tactoid_coarsening_power_law
      outputs dimensional tactoid_major_axis [um] rather than dimensionless R(t)/R_0 (dimension
