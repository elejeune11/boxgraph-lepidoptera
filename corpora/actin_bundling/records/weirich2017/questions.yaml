    2.417 vs st16 = 2.424 purely by coincidence, while 5% filamin omega = 2.0 gives 2.862), so no
    non-fabricated prediction exists.
    (3) Single-filament Stokes-Einstein models (stokes_einstein_ellipsoid_diffusion,
    stokes_einstein_ellipsoid_viscosity, frap_diffusion_scaling) vs tracked nanocluster
    displacements (dx_*, dy_*, dist_*; 27 measured data) and reported viscosities: sekine2024
    contains zero measured diffusion_coefficient, zero frap_recovery_time, and zero measured
    cytosolic_viscosity entries (eta_cyto_table_s1 = 1, eta_cyto_si_text = 0.1, and
    eta_cyto_bulk_lit = 1e-3 to 1e-1 Pa*s are origin: reported simulation/literature parameters).
    Tracked displacements (dist = 94.7-141.3 nm per dt = 0.32 s) have dimension [length] rather
    than [length]^2/[time] and reflect active motility of 10-40-filament crosslinked nanoclusters
    rather than passive single-filament diffusion (diagnostically, apparent 2D cluster diffusivity
    D_app >= d^2/(4*dt) = 0.0070-0.0156 um^2/s is 2.3x-5.2x faster than Weirich's intra-tactoid
    FRAP ~0.003 um^2/s, while stokes_einstein_ellipsoid_diffusion on Sekine's 100 nm x 10 nm single
    filament yields 0.0132 um^2/s at eta = 1 Pa*s and 0.132 um^2/s at eta = 0.1 Pa*s, 4.194x above
    Sekine's cylindrical drag).
    (4) PIV cortical displacement speeds (d_fig5c_vx, d_fig5c_vy, d_fig5f_vx, d_fig5f_vy; 4
    measured data, 17-35 nm/s) vs droplet/capillary velocity models
    (isotropic_relaxation_rate_corrected/printed.dL_dt, capillary_axial_velocity.v): unsigned 2D
    cortical actin PIV flow speeds are distinct physical quantities from negative droplet
    shortening rate dL/dt or Poiseuille axial center velocity v = 2*pi*(du/dt)/k, and sekine2024
