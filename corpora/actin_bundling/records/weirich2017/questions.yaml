  text: >
    Quantitative regime comparison evaluating grason2007's microscopic F-actin scaling parameters on
    weirich2017's experimental filamin/F-actin droplets:
    (1) Absence of chiral/shear arrest in weirich2017: inside weirich2017's ~250 uM tactoids
    (c_actin_tactoid_est, 1 monomer per 2.7 nm), the mean aligned filament areal density is
    rho = c_A * a_m ~= 4.07 x 10^-4 nm^-2, corresponding to an inter-filament center-to-center
    spacing d ~= 50 nm (53 nm hexagonal) — 5-50x wider than grason2007's tight-bundle regime
    (d ~ 1-10 nm) — cross-linked by long (~150 nm), flexible, transiently binding filamin with
    measured diffusive filament mobility (FRAP D ~ 3 x 10^-3 um^2/s). In grason2007's continuum
    framework, liquid-like filament rearrangement sets hexagonal lattice shear elasticity mu_perp -> 0
    (driving lambda_{3 perp} = sqrt(K3_bar/mu_perp_bar) -> oo and columnar R_0 ~ gamma^4/(mu_perp_bar*Sigma^3)
    -> oo), while wide filament spacing and flexible linkers suppress chiral torque coupling gamma -> 0
    (driving f_0 -> 0 and Sigma_c -> 0), placing weirich2017's droplets strictly in grason2007's
    achiral unbounded-coarsening limit.
    (2) Three-order-of-magnitude surface-tension contrast: weirich2017's measured isotropic
    interfacial tension gamma_I ~ 300 nN/m = 3.0 x 10^-4 pN/nm (~7.4 x 10^-5 k_B T/nm^2 at 20 degC)
    is ~1350-4500x smaller than grason2007's tight-bundle cohesive surface-tension scale Delta E/d^2
    ~ 0.40-1.34 pN/nm (4.0 x 10^5 to 1.34 x 10^6 nN/m for Delta E ~ 10 k_B T and d = 5.5-10 nm),
    reflecting dilute liquid-crystalline interfacial cohesion (~50 nm filament spacing) versus
    close-packed bundle surface-bond rupture.
    (3) Cross-check of weirich2017's homogeneous-director assumption via grason2007's Frank bend
    scaling: applying grason2007's microscopic Frank bend modulus scaling K_3 ~ k_B T * l_p / d^2
    (grason2007 p. 4) to weirich2017's tactoids (d ~= 50-53 nm, l_p ~ 10 um, k_B T = 4.05 pN*nm at
    20 degC) estimates K_3 ~= 14.2-16.5 pN. Evaluating weirich2017/director_crossover_parameter
    (chi = gamma_A * V^(1/3) / K) for L ~ 5 um tactoids across omega in [1.1, 2.2] (gamma_A =
    omega*gamma_I = 330-660 nN/m, circular-arc V^(1/3) ~= 1.81-2.28 um) gives chi ~= 0.046-0.073 << 1,
    quantitatively corroborating weirich2017's homogeneous-director regime (while 10x longer L ~ 50 um
    entropic actin tactoids from Oakes et al. [Ref. 23] reach chi ~ 0.5-0.7, crossing toward the
    bipolar regime as noted on SI p. 8).

