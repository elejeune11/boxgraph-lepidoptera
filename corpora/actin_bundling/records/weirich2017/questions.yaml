- id: q_isotropic_relaxation_inverted_ratio
  kind: possible_error
  about:
    - isotropic_relaxation_rate_printed
    - isotropic_relaxation_rate_corrected
  text: >
    On SI p. 8 col 2 (Liquid Droplets with Isotropic Interfacial Tension), the paper balances
    dE/dt ~ -gamma_I*r*(dL/dt) with D ~ eta*(r^2*L)*(dL/dt)^2/L^2 and then prints
    dL/dt proportional to -L*(r*eta/gamma_I) with a timescale tau proportional to gamma_I/eta.
    Both expressions invert the viscosity-to-surface-tension ratio and are dimensionally invalid:
    [r*eta/gamma_I] = [time] (making [L*(r*eta/gamma_I)] = [length*time] != [length/time]) and
    [gamma_I/eta] = [length/time] != [time]. Solving the paper's own energy balance yields
    dL/dt ~ -L*(gamma_I/(r*eta)) and tau ~ r*eta/gamma_I (proportional to eta/gamma_I), which
    agrees with the very next sentence on SI p. 8 col 2 ('slope proportional to eta/gamma_I').
  citation:
    page: 8
    printed_page: "SI-2"
    quote: "nentially as dL=dt ∝ − Lðrη=γ I Þ, with a timescale τ that is pro-"
    where: "SI Text, Liquid Droplets with Isotropic Interfacial Tension"

- id: q_dissipation_tensor_missing_strain_rate
  kind: possible_error
  about:
    - tactoid_dissipation_power
  text: >
    At the bottom of SI p. 8 col 2, the rate of energy dissipation (dissipated power) is printed as
    D = int dV eta_ij v_ij, where eta_ij is the viscosity tensor (Pa*s) and v_ij = (1/2)*(d_i v_j + d_j v_i)
    is the symmetric strain rate tensor (1/s). That integrand has dimensions of energy density (J/m^3),
    giving total energy (J) rather than power (J/s); it is missing a second strain-rate factor
    (e.g., int dV eta_ijkl v_ij v_kl or int dV sigma_ij v_ij). The scaling form immediately following
    on SI p. 9 col 1 correctly uses quadratic strain rates and has dimensions of power (W).
  citation:
    page: 8
    printed_page: "SI-2"
    quote: "D = dV ηij vij ,"
    where: "SI Text, Liquid Droplets with Isotropic and Anisotropic Interfacial Tension"

- id: q_figS2C_missing_2pi_one_third_factor
  kind: possible_error
  about:
    - tactoid_rescaled_free_energy
    - tactoid_equilibrium_minimizer
  text: >
    SI p. 8 states that Fig. S2C (p. 10) plots the rescaled free energy F/(gamma_I * V^(2/3)) as a
    function of alpha for omega = 0, 0.5, and 2. From the printed expressions A = 4*pi*R^2*f(alpha),
    A_omega = 2*pi*R^2*g(alpha), and circular-arc volume V = 2*pi*R^3*g(alpha), the exact value for
    a sphere (omega = 0, alpha = pi/2) is F/(gamma_I * V^(2/3)) = (36*pi)^(1/3) = 4.8360 (and minima
    at omega = 0.5 and 2 are 5.4849 and 6.4989). However, Fig. S2C plots minima at ~2.62, ~2.97, and
    ~3.52 (and values at alpha = 3.0 of ~2.92, ~3.65, and ~5.84), which match (2*f(alpha) + omega*g(alpha))/g(alpha)^(2/3)
    — exactly F/(gamma_I * V^(2/3)) divided by the constant factor (2*pi)^(1/3) = 1.8453. Because
    this is a constant overall factor independent of alpha, equilibrium angles alpha_eq and aspect
    ratios L/r in Fig. S2D are unaffected.
  citation:
    page: 8
    printed_page: "SI-2"
    quote: "F=γ I V 2=3, is simply a function of α, and their dependence is"
    where: "SI Text & Fig. S2C"

