  text: >
    Cross-record ModelAtlas audit and biophysical synthesis with graham2023 (Graham et al., Nature
    Physics 19:574-585, 2023; isotropic liquid-like VASP protein condensates that polymerize and
    bundle long semiflexible F-actin; 31 runnable graham2023 x 52 runnable weirich2017 = 1,612
    model pairs). Neither paper cites the other (graham2023 Discussion p. 10 cites only the
    Gardel-lab follow-up Scheff et al. 2020 [ref-40]; the two reference lists share exactly 1
    review: Blanchoin et al., Physiol. Rev. 94:235-263, 2014 [weirich2017/ref-4 <->
    graham2023/ref-43, misprinted 2022]; 0 stated relations; 0 cited.yaml links). Nine proposed
    non-too_plain (>2 ops / numeric) relations entered in the later record graham2023/relations.yaml
    (7 verified, 2 honest diagnostic not_verified; 0 same_as families) connect the two records
    across three physical cores while rejecting spurious matches:
    (1) 3D nematic tactoid vs. 2D isotropic droplet interfacial free energy (5 relations):
    In the isotropic spherical limit (gamma_A -> 0, alpha -> pi/2 <-> AR -> 1),
    tactoid_free_energy.F and graham2023/ring_rod_transition_energy.E_surf reduce identically to
    one another under diameter-projected tension gamma_I_3D = gamma_I_2D / (2*R)
    (graham2023/rel_weirich2017_ring_rod_reduces_tactoid_sphere [6.3e-15] and converse
    graham2023/rel_weirich2017_tactoid_reduces_ring_rod_sphere [7.5e-8]), and Graham's discrete 2D
    SLSQP energy minimizer (graham2023/droplet_ring_minimization_corrected.total_energy) converges
    to the same bare spherical energy as ring thickness T_ring -> 0
    (graham2023/rel_weirich2017_slsqp_reduces_tactoid_sphere [3.3e-7]). Across Weirich's
    experimental tactoid aspect ratios AR in [1.01, 3.0], Graham's constant-area 2D ellipse
    approximates Weirich's constant-volume isotropic (gamma_A = 0) tactoid energy within 5.17%
    sampled (5.20% exact at AR = 3.0; graham2023/rel_weirich2017_2d_ellipse_approx_3d_iso_tactoid,
    verified <= 0.06), before diverging cleanly at high elongations AR in [2, 15] because 2D
    constant-area perimeter scales as AR^(1/2) versus 3D constant-volume tactoid surface area
    AR^(1/3) (diagnostic not_verified
    graham2023/rel_weirich2017_2d_ellipse_vs_3d_rescaled_ar_scaling, max log-slope diff 0.16;
    relative error 18.2% at AR = 10 and 23.1% at AR = 15 — complementing
    q_chandrasekaran2024_vasp_droplets_vs_tactoids_synthesis where Chandrasekaran 2024's 3D
    volume-conserving prolate spheroid recovers Weirich's AR^(1/3) scaling to <= 1.60% across all
    AR in [1, oo)). Turning on Weirich's nematic anchoring (omega = 2, 5 mol % filamin) reverses
    dF_hat/d(AR) < 0 below AR_eq = 2.83 (log-slope diff 0.42 over AR in [1.1, 3.0]).
    (2) 3D nematic capillary cylinder vs. 2D circular droplet surface energy (2 relations):
    In the straight-cylinder limit u -> 0, Weirich's axial director n_hat = z_hat lies tangent to
    the lateral wall so Rapini-Papoular anchoring A_omega = O(u^2) vanishes for all omega, reducing
    capillary_free_energy_integral.F identically to graham2023/ring_rod_transition_energy.E_surf
    (AR = 1) under slab projection gamma_I_2D = gamma_I_3D * lam
    (graham2023/rel_weirich2017_capillary_reduces_ring_rod_circle [8.4e-14]), with matching (+1, +1)
    bilinear scaling in (R_0, gamma_I) for capillary_free_energy_per_length.F_over_lam
    (graham2023/rel_weirich2017_capillary_per_len_scales_ring_rod [9.7e-7]).
    (3) 3D volume-equivalent droplet size & 2D vs. 3D axis elongation (2 relations):
    Under 3D prolate spheroid volume V = (pi/6)*a*b^2, graham2023/effective_spherical_diameter
    (D = (a*b^2)^(1/3)) scales identically with director_crossover_parameter
    (chi = gamma_A*V^(1/3)/K) in (a, b) to 2.2e-13
    (graham2023/rel_weirich2017_eff_diam_scales_director_crossover), while applying Graham's
    spheroid formula to Weirich's sharp-cusped circular-arc tactoids overestimates true
    volume-equivalent diameter D_vol = (6*V_tac/pi)^(1/3) by 5.36-6.62% at L/r = 2-3 (<= 7.72%
    ceiling from V_tac/V_spheroid >= 4/5). By contrast, Graham's 2D constant-area parameterization
    (graham2023/ellipse_axes_constant_area: a ~ AR^(1/2)) diverges from 3D volume-conserving
    tactoid major-axis growth (tactoid_geometry_circular_arc.L ~ AR^(2/3); diagnostic not_verified
    graham2023/rel_weirich2017_ellipse_axes_vs_tactoid_major_axis_scaling, max log-slope diff 0.18).
    Explicitly excluded: all 14 too_plain + 1 curve weirich2017 models and 11 too_plain graham2023
    models (including droplet_surface_energy_eqS12, 2 ops), the scheduler-flagged
    droplet_ring_minimization_corrected vs. capillary_energy_cost_corrected pair (positive 2D
    droplet-ring energy vs. sign-changing O(u^2) Rayleigh-Plateau perturbation energy delta_F),
    and the spurious 2*pi*R coincidence between capillary_instability_threshold_*.lambda_c and
    graham2023/ellipse_perimeter_*.
    (4) Deep biophysical contrast — actin-as-the-droplet nematic tactoids vs. isotropic VASP
    protein condensates deformed by stiff actin rings:
    (a) Material architecture & interfacial tension: weirich2017 forms nematic droplets directly
    from ~250 uM short capped F-actin rods (~180 nm << L_p ~ 10 um, rigid-rod limit with zero
    filament bending) condensed 100-fold from 2.6 uM bulk by 1-15 mol % long (~150 nm) flexible
    filamin, yielding ultra-soft interfacial tension gamma_I ~ 300 nN/m (0.3 uN/m). In graham2023,
    tetrameric VASP + 3% PEG8k forms passive isotropic droplets (D = 1-7 um, median 2.86 um,
    gamma_I_2D = 1-15 pN -> gamma_3D = gamma_I_2D/D ~ 1-15 uN/m at D = 1 um or 1.75 uN/m at
    benchmark 5 pN, D = 2.86 um — ~6-17x stiffer than actin tactoids, matching Weirich's '~10x
    less than protein droplets' benchmark) that encapsulate and polymerize long semiflexible actin
    filaments (L_p = 17.73 um >> D).
    (b) Opposite elongation mechanisms & crosslinker/fluidity dependence: Weirich tactoids adopt
    elongated spindle equilibrium shapes (L/r = 2-3, size-independent) driven by anisotropic
    anchoring omega = 1.1-2.2, and increasing filamin (2.5 -> 15 mol %) REDUCES L/r from ~3 to ~2
    by raising isotropic cohesion; Graham's bare VASP droplets are spherical (omega = 0) and deform
    out of sphericity up to AR > 15 only when confined actin-ring bending energy (k_b/2)*L/R^2
    overcomes isotropic surface tension (while solidifying VASP droplets at 10% PEG suppresses rods
    from 89.4% to 12.6%).
    (c) Transport kinetics & opposite fate of long bundles: Weirich tactoids exhibit slow filament
    diffusion (FRAP tau_R = 880-900 s, D_actin ~ 0.003 um^2/s, eta ~ 3 Pa*s, coalescence
    v_cap = 0.11-0.14 um/s, coarsening L ~ t^0.47) versus faster VASP condensate turnover (FRAP
    t_1/2 = 18 +/- 3 s, tau_exp = 26 s [~34x faster], Soumpasis D_VASP = 0.0101 um^2/s [~3.4x
    faster], fusion ~1 s). Above all, transient long filamin-actin bundles (>50 um, R_0 ~ 200 nm)
    behave as unstable fluid threads that undergo Rayleigh-Plateau pearling (lambda_max ~ 4 um
    predicted / ~10 um observed) or capillary-driven contraction (20-60% over ~10 min), whereas
    Graham's VASP-coated parallel actin rods resist capillary breakup via single/bundle filament
    bending rigidity and grow linearly via ATP-driven tip polymerization (23 +/- 3 nm/s = 8-9
    monomers/s). See graham2023/q_weirich2017_modelatlas_and_vasp_droplet_vs_tactoid_contrast.

