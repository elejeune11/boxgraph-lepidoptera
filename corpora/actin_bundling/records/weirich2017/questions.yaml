    No cross-record validations are entered in validations.yaml for weirich2017's 52 runnable
    models against sekine2024's 214 origin: measured Drosophila embryonic tracheal actin
    nanocluster and circumferential-cable data (across 27 quantities), because neither paper cites
    the other (0 shared references across 49 and 82 entries) and no weirich2017 model validly
    predicts any sekine2024 measurement on Sekine et al.'s conditions without conflating distinct
    physical quantities or fabricating unmeasured continuum parameters:
    (1) Periodic circumferential cable spacing (cable_interval_in_vivo = 450 +/- 13.2 nm,
    d_figs1d_intervals; 2 measured data) vs capillary instability and mesh-size models
    (capillary_instability_threshold_corrected/printed, capillary_fastest_mode_corrected/printed,
    actin_mesh_size): unlike gov2018/cylindrical_ring_critical_mode (which explicitly models
    circumferential actomyosin rings on a hollow cylindrical cell membrane), weirich2017's
    Rayleigh-Plateau models govern axial pearling breakup (perturbation_wavelength) along a solid
    3D cylindrical liquid column of axially aligned F-actin (bundle_radius R_0, anchoring omega =
    gamma_A/gamma_I). By contrast, sekine2024's cables are transversely spaced parallel
    circumferential rings (pattern_interval) in a 2D apical cortical sheet lining a hollow
    chitin-filled epithelial lumen (d_fig1j_diameter = 3.942 um, R_tube = 1.971 um at 0* min),
    assembled by nanocluster fusion (opposite in direction to pearling) with neither R_0 nor omega
    measured. Mapping hollow tube radius to solid bundle_radius or transverse cable spacing to
    axial perturbation_wavelength would conflate distinct physical quantities. Diagnostically,
    evaluating capillary_instability_threshold_corrected and capillary_fastest_mode_corrected at
    tracheal radius R_0 = 1.971 um gives lambda_c = 12.38-27.69 um (27.5x-61.5x 450 nm) and
    lambda_max = 17.51-39.16 um (38.9x-87.0x; printed 17.51-30.34 um) across omega in [0, 2.0]
    (and still >= 11.54 um = 25.7x at -80 min, R_0 = 1.299 um); even substituting a single Stage-16
    cable half-minor-axis (R_0 = 84.1 nm) compares orthogonal axes and yields lambda_c =
    0.528-1.182 um (1.17x-2.63x) and lambda_max = 0.747-1.671 um (1.66x-3.71x). Likewise,
    actin_mesh_size (xi = 0.3*c^(-1/2)) predicts uncrosslinked 3D semidilute mesh spacing rather
    than crosslinked cable spacing, and sekine2024 measures no 3D actin mass concentration c
    (diagnostically, Sekine's 2D CGMD density at 100 nm cortex thickness corresponds to ~307.5 uM
    = 12.92 mg/mL -> xi = 83.5 nm, 5.4x below 450 nm).
    (2) Nanocluster aspect ratios (st15_aspect_ratio_mean = 1.9458, st16_aspect_ratio_mean =
    2.4241, 28 RNAi/mutant conditions in Table 2 spanning 1.981-2.534, 2 SDs, and 2 KDE curves
    d_fig1f_st15/st16; 34 measured data) vs tactoid equilibrium shape models
    (tactoid_equilibrium_minimizer, tactoid_aspect_ratio_scaling, tactoid_aspect_ratio_large_omega):
    sekine2024 neither defines nor measures nematic surface anchoring omega = gamma_A/gamma_I (even
    in weirich2017, omega is inverted from measured L/r rather than predicted from molecular inputs).
    Moreover, the two systems have opposite crosslinker-density trends and mechanisms: 3D passive
    equilibrium long-filamin (150 nm) tactoids round up with higher crosslinker concentration
    (L/r drops from ~3 to ~2, omega = 2.2 to 1.1), whereas 2D nonequilibrium active-turnover
    (omega^f = 0.1 s^-1) short-alpha-actinin (35 nm)/Zasp52/myosin-II/DAAM cortical nanoclusters
    elongate with higher crosslinker density (2-M: 1.49 -> 2-H: 2.12) and maturation (1.9458 ->
