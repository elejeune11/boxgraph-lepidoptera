  citation:
    page: 3
    printed_page: "2133"
    quote: "However, filamin is a long (∼150 nm) and flexible actin cross-"
    where: "Main Text pp. 2131-2135 & SI pp. SI-1 to SI-3 vs claessens2008 pp. 8819-8822"
  text: >
    Quantitative biophysical regime contrast between rigid-fascin solid bundles (claessens2008) and
    flexible-filamin fluid tactoids/bundles (weirich2017):
    (1) Overlapping bulk starting conditions, divergent material phases: both papers perform their
    primary fluorescence microscopy assays at virtually identical dilute bulk actin concentrations
    (claessens2008 Figs. 1-2: 0.04-0.10 mg/mL = 0.95-2.38 uM; weirich2017 Figs. 1-4: 2.6-2.64 uM
    = 0.11 mg/mL; uncross-linked mesh size xi = 0.90-0.95 um at 0.10-0.11 mg/mL), identical ambient
    temperature (20 degC), and overlapping cross-linker stoichiometries (claessens2008: R* = 0.01
    to plateau 0.25; weirich2017: added f_fil = 1-15 mol%, R = 0.01-0.15). Yet fascin produces
    rigid, straight, twist-arrested hexagonal solid bundles, whereas filamin condenses short F-actin
    into fluid nematic tactoids and unstable fluid threads.
    (2) Cross-linker architecture and 17-18x internal packing contrast: compact rigid fascin enforces
    ~5 nm inter-filament separation and a 2D hexagonal crystal lattice with SAXS spacing a_H = 12.4 nm
    (areal filament density rho_0 = 2/(sqrt(3)*a_H^2) = 7.51 x 10^-3 nm^-2), corresponding to an
    internal actin monomer concentration of 4300 uM (181 mg/mL at d = 2.9 nm; 4535 uM at 2.75 nm;
    4619 uM at 2.7 nm). In contrast, long (~150 nm), flexible, transiently binding filamin condenses
    actin 100-fold into ~250 uM (10.5 mg/mL) nematic droplets — 17.2-18.5x more dilute — with areal
    filament density rho = c_A*N_A*a_m = 4.06 x 10^-4 nm^-2 and mean center-to-center filament
    spacing ~50 nm (53.3 nm hexagonal, 4.30x wider than Claessens's a_H = 12.4 nm). Wide spacing
    and flexible linkers eliminate steric azimuthal registration and helical-twist frustration
    (-13/6 -> -28/13, Delta_theta ~ 1 deg/monomer in claessens2008) while maintaining liquid
    diffusive mobility (FRAP D ~ 3 x 10^-3 um^2/s, eta ~ 3 Pa*s).
    (3) Opposite cross-linker stoichiometry response and arrest vs unbounded coarsening: in
    claessens2008, increasing bound fascin R* (modeled via 1:1 mass action at K_d = 0.3 uM, where
    R*/R = 88-89% at c_a = 2.38 uM) thickens bundles as D ~ (R*)^(+0.3) (0.327 digitized) until
    equilibrium arrest at R* ~ 0.25, n_f ~ 20 filaments (2 hexagonal shells; hydrated width
    50-57 nm, TEM plateau 28.2 nm; in droplets of D_d > 5.4-8.0 um at 0.1 mg/mL, rings split into
    multiple bundles rather than thickening). In weirich2017, added f_fil is used directly without
    a K_d binding model (though inside 250 uM tactoids, Claessens's mass-action law gives
    R*/R > 99% even for K_d = 1 uM), and increasing filamin from 2.5 to 15 mol% DECREASES tactoid
    aspect ratio L/r from ~3 to ~2 (anchoring strength omega = gamma_A/gamma_I drops from 2.2 to
    1.1 as isotropic cohesion gamma_I grows relative to alignment gamma_A), increases bundle
    contractile strain (20-60%, Fig. 4E), and never arrests droplet size: tactoids coarsen
    unboundedly via capillary coalescence as L ~ t^(0.47 +/- 0.01) (a typical L = 5 um, omega = 2
    tactoid holds V = 6.61 um^3, L_tot ~ 2687 um = ~15,000 filaments of 180 nm, and ~974 filaments
    across its r = 1.75 um equatorial midplane; pre-pearling R_0 ~ 200 nm fluid bundles hold
    ~51 filaments at 250 uM vs fascin's n_f ~ 20 cap at R ~ 25-28 nm).
    (4) Filament-length sensitivity and ~443x interfacial-tension separation: claessens2008 uses
    long uncapped F-actin (L_f >> xi) and finds bundle thickness D independent of filament length
    ('Whether long or shortened', p. 1) and c_a, whereas weirich2017 requires short capped rods
    (L_f = 0.18-1 um <= xi ~ 1 um, L_f << l_p ~ 10 um) to stay in the liquid droplet/fluid-bundle
    window of Fig. 1D before crossing into kinetically arrested viscoelastic networks at L_f > 1-2 um
    (interestingly, claessens2008 p. 4 cites Limozin & Sackmann 2002 [ref-41] on supercoiled
    filamin/actin bundle rings in giant vesicles — long-filament solid/elastic behavior outside
    Weirich's short-filament fluid regime). Energetically, converting Claessens's SI hexagonal
    surface-bond deficit (bundle_geometry_saturation sigma = -1: 3.5*n_f^(-1/2)/u lost linkers per
    monomer, u = 13.5, d = 2.9 nm, Delta G = 15.02 k_B T) to an effective cylindrical interfacial
    tension yields Sigma_fascin = (3.5/(2*u*d))*sqrt(rho_0/pi)*Delta G ~ 1.33 x 10^5 nN/m
    (0.133 mN/m) — ~443x larger than Weirich's measured fluid-tactoid isotropic tension
    gamma_I ~ 300 nN/m (where a 180 nm x 50 nm filament surface footprint costs only ~0.67 k_B T,
    ~22x less than a single ~15 k_B T fascin bond).

