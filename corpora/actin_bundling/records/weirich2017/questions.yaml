    velocities 110-140 nm/s for coalescence and 2.5-4.5 nm/s for contraction bracket Sekine's
    17-35 nm/s PIV speeds).
    (5) Remaining 147 of 214 origin: measured data in sekine2024: (a) cluster major/minor lengths,
