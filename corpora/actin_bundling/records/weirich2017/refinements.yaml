- id: ref_tactoid_minimizer_xtol
  run: run_tactoid_min_w2
  setting: xtol
  factors: [1, 10, 100]
  mode: divide
  output: aspect_ratio
  tolerance: "0.01%"
  tolerance_basis: "added: tight tolerance verifying numerical minimization convergence of equilibrium aspect ratio L/r well below experimental precision"
  tolerance_added: true

- id: ref_tactoid_minimizer_bracket
  run: run_tactoid_min_w2
  setting: n_bracket
  factors: [1, 2, 4]
  mode: multiply
  output: alpha_eq
  tolerance: "0.01%"
  tolerance_basis: "added: verifies global bracket grid captures the true minimum alpha_eq independent of grid resolution"
  tolerance_added: true

- id: ref_ode_coal_10_tau
  run: run_ode_coal_10
  setting: n_steps
  factors: [1, 2, 4, 8]
  mode: multiply
  output: tau
  tolerance: "0.1%"
  tolerance_basis: "added: time-step convergence of RK4 integration and fitted coalescence relaxation time tau well below 1% experimental uncertainty"
  tolerance_added: true

- id: ref_ode_coal_10_alpha_min
  run: run_ode_coal_10
  setting: n_steps
  factors: [1, 2, 4, 8]
  mode: multiply
  output: alpha_min
  tolerance: "0.1%"
  tolerance_basis: "added: verifies positivity and step-size convergence of minimum tactoid angle alpha_min along the relaxation trajectory"
  tolerance_added: true

- id: ref_ode_contr_10_tau
  run: run_ode_contr_10
  setting: n_steps
  factors: [1, 2, 4, 8]
  mode: multiply
  output: tau
  tolerance: "0.1%"
  tolerance_basis: "added: time-step convergence of RK4 integration for stiffer large-omega bundle contraction relaxation time tau"
  tolerance_added: true

- id: ref_capillary_integral_grid
  run: run_cap_integral_probe
  setting: n_grid
  factors: [1, 2, 4]
  mode: multiply
  output: delta_F
  tolerance: "0.01%"
  tolerance_basis: "added: verifies periodic trapezoidal quadrature convergence for capillary surface energy perturbation delta F"
  tolerance_added: true

- id: ref_ode_rayleigh2_coal_10_tau
  run: run_ode_rayleigh2_coal_10_scalar
  setting: n_steps
  factors: [1, 2, 4, 8]
  mode: multiply
  output: tau
  tolerance: "0.1%"
  tolerance_basis: "added: time-step convergence of RK4 integration for the Rayleigh 2*Phi corrected ODE variant"
  tolerance_added: true
