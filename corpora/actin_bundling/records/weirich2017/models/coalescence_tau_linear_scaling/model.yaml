id: coalescence_tau_linear_scaling
name: linear scaling of coalescence relaxation time with deformation length (Fig. 3C Inset)
role: model
stated:
  page: 4
  printed_page: "2134"
  quote: "exponential fits (Fig. 3C, Inset). The slope of the line is η/γ eff,"
  where: "text, p. 2134 col 2 & Fig. 3C Inset"
equation: "tau = (eta / gamma_eff) * (L_i - L_f)"
inputs:
  eta:
    quantity: dynamic_viscosity
    unit: "Pa*s"
  gamma_eff:
    quantity: interfacial_tension_effective
    unit: "nN/m"
  delta_L:
    quantity: deformation_length
    unit: um
outputs:
  slope:
    quantity: inverse_capillary_velocity
    unit: "s/um"
  tau:
    quantity: relaxation_time
    unit: s
settings: {}
stochastic: false
