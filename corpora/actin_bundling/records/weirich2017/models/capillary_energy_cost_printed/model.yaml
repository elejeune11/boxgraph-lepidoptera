id: capillary_energy_cost_printed
name: leading-order capillary perturbation energy cost delta F (SI p. 9 col 2, as printed)
role: model
built_from:
  - capillary_free_energy_integral
  - capillary_wavenumber_definition
stated:
  page: 9
  printed_page: "SI-3"
  quote: "To leading order in u, the interfacial energy cost for the sinu-"
  where: "SI Text, Capillary Instabilities in Long Droplets"
equation: "delta_F = (pi * lambda * u^2 * gamma_I / (2 * R_0)) * [(1 + omega) * k^2 - 1], k = 2*pi*R_0/lambda"
inputs:
  R_0:
    quantity: bundle_radius
    unit: um
  u:
    quantity: perturbation_amplitude
    unit: um
  lam:
    quantity: perturbation_wavelength
    unit: um
  gamma_I:
    quantity: interfacial_tension_isotropic
    unit: "nN/m"
  omega:
    quantity: anchoring_strength
    unit: dimensionless
outputs:
  delta_F:
    quantity: capillary_energy_change
    unit: J
settings: {}
stochastic: false
