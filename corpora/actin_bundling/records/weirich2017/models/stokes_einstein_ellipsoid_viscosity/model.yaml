id: stokes_einstein_ellipsoid_viscosity
name: effective droplet viscosity inverted from Stokes-Einstein ellipsoid diffusion
role: model
described_from: ref-43
built_from:
  - stokes_einstein_ellipsoid_diffusion
stated:
  page: 8
  printed_page: "SI-2"
  quote: "using the Stokes–Einstein relationship for an ellip-"
  where: "SI Text, Eq. on SI p. 2 col 1"
equation: "eta = k_B * T * ln(2*L / r) / (6 * pi * D * L)"
inputs:
  T:
    quantity: temperature
    unit: K
  L:
    quantity: filament_half_length
    unit: nm
  r:
    quantity: filament_radius
    unit: nm
  D:
    quantity: diffusion_coefficient
    unit: "um**2/s"
outputs:
  eta:
    quantity: dynamic_viscosity
    unit: "Pa*s"
settings: {}
stochastic: false
