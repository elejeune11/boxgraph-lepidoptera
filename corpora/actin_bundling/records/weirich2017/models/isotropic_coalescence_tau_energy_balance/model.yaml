id: isotropic_coalescence_tau_energy_balance
name: isotropic coalescence relaxation timescale from finite-deformation energy balance
role: model
prefactor: unknown
stated:
  page: 8
  printed_page: "SI-2"
  quote: "ηV ½ðLi − Lf Þ= Li τ 2 ∼ γ I rðLi − Lf Þ=τ. Therefore, τ is expected to"
  where: "SI Text, Liquid Droplets with Isotropic Interfacial Tension"
equation: "tau ~ (eta / gamma_I) * (V / (r * L_i^2)) * (L_i - L_f)"
inputs:
  eta:
    quantity: dynamic_viscosity
    unit: "Pa*s"
  gamma_I:
    quantity: interfacial_tension_isotropic
    unit: "nN/m"
  V:
    quantity: tactoid_volume
    unit: "um**3"
  r:
    quantity: tactoid_minor_axis
    unit: um
  L_i:
    quantity: tactoid_major_axis
    unit: um
  delta_L:
    quantity: deformation_length
    unit: um
outputs:
  tau:
    quantity: relaxation_time
    unit: s
settings: {}
stochastic: false
