id: interfacial_tension_from_capillary_velocity
name: isotropic interfacial tension from fitted gamma_I/eta and FRAP viscosity
role: processing
stated:
  page: 4
  printed_page: "2134"
  quote: "From the η/γ I obtained in the fit (Table S1),"
  where: "text, p. 2134 col 1"
equation: "gamma_I = eta * (gamma_I / eta)"
inputs:
  eta:
    quantity: dynamic_viscosity
    unit: "Pa*s"
  v_cap:
    quantity: capillary_velocity
    unit: "um/s"
outputs:
  gamma_I:
    quantity: interfacial_tension_isotropic
    unit: "nN/m"
settings: {}
stochastic: false
