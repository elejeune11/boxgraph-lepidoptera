id: capillary_fastest_mode_corrected
name: fastest-growing capillary instability wavenumber and wavelength (corrected 1 + 2*omega)
role: model
variant_of: capillary_fastest_mode_printed
corrections:
  - equation: "fastest-growing mode k_max and lambda_max (SI p. 9 col 2)"
    change: "replace (1 + omega) with (1 + 2*omega) in k_max = 1/sqrt(2*(1 + 2*omega)) and lambda_max = 2*pi*R_0*sqrt(2*(1 + 2*omega))"
    evidence: "Maximizing Omega(k) ~ k^2 * [1 - (1 + 2*omega)*k^2] derived from the exact O(u^2) expansion of the paper's own printed surface integrals A, A_omega, and F on SI p. 9 gives k_max = 1/sqrt(2*(1 + 2*omega)). At R_0 = 200 nm and omega = 2, this gives lambda_max = 3.97 um, closely matching the paper's printed estimate lambda_max ~ 4 um (whereas the printed 1 + omega formula gives 3.08 um)."
built_from:
  - capillary_dispersion_corrected
  - capillary_wavelength_from_wavenumber
stated:
  page: 9
  printed_page: "SI-3"
  quote: "kmax = 1= 2ð1 + ωÞ. Using typical parameter values from the ex-"
  where: "SI Text, Capillary Instabilities in Long Droplets"
equation: "k_max = 1 / sqrt(2*(1 + 2*omega)); lambda_max = 2 * pi * R_0 * sqrt(2*(1 + 2*omega))"
inputs:
  R_0:
    quantity: bundle_radius
    unit: nm
  omega:
    quantity: anchoring_strength
    unit: dimensionless
outputs:
  k_max:
    quantity: perturbation_wavenumber_dimensionless
    unit: dimensionless
  lambda_max:
    quantity: perturbation_wavelength
    unit: um
  lambda_to_R0:
    quantity: wavelength_to_radius_ratio
    unit: dimensionless
settings: {}
stochastic: false
