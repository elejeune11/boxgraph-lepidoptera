id: tactoid_dissipation_power
name: Newtonian viscous dissipation rate D for radial and angular tactoid deformations
role: model
stated:
  page: 9
  printed_page: "SI-3"
  quote: "which lead to the expression, D = 2 V ηR R dt +"
  where: "SI Text, Eq. on SI p. 3 col 1"
equation: "D = (1/2) * V * [eta_R * ((1/R) * dR/dt)^2 + eta_alpha * ((1/alpha) * d(alpha)/dt)^2]"
inputs:
  V:
    quantity: tactoid_volume
    unit: "um**3"
  eta_R:
    quantity: dynamic_viscosity
    unit: "Pa*s"
  eta_alpha:
    quantity: dynamic_viscosity
    unit: "Pa*s"
  R:
    quantity: tactoid_arc_radius
    unit: um
  dR_dt:
    quantity: tactoid_arc_radius_rate
    unit: "um/s"
  alpha:
    quantity: tactoid_central_angle
    unit: dimensionless
  dalpha_dt:
    quantity: tactoid_central_angle_rate
    unit: "1/s"
outputs:
  D:
    quantity: dissipated_power
    unit: W
settings: {}
stochastic: false
