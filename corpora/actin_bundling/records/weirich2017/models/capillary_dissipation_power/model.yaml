id: capillary_dissipation_power
name: viscous dissipated power scaling D ~ eta * (pi * R_0^2 * lambda) * (v / R_0)^2 in a perturbed capillary
role: model
prefactor: unknown
built_from:
  - capillary_axial_velocity
stated:
  page: 9
  printed_page: "SI-3"
  quote: "D ∼ ηðπR20 λÞðv=R0 Þ2, where the average velocity"
  where: "SI Text, Capillary Instabilities in Long Droplets"
equation: "D ~ eta * (pi * R_0^2 * lambda) * (v / R_0)^2"
inputs:
  eta:
    quantity: dynamic_viscosity
    unit: "Pa*s"
  R_0:
    quantity: bundle_radius
    unit: um
  lam:
    quantity: perturbation_wavelength
    unit: um
  v:
    quantity: capillary_axial_velocity
    unit: "um/s"
outputs:
  D:
    quantity: dissipated_power
    unit: W
settings: {}
stochastic: false
