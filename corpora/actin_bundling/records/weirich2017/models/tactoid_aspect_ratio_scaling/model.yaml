id: tactoid_aspect_ratio_scaling
name: equilibrium tactoid aspect ratio piecewise scaling relation (Prinsen & van der Schoot 2003)
role: model
described_from: ref-20
stated:
  page: 8
  printed_page: "SI-2"
  quote: "the dependence of the aspect ratio on ω (20):"
  where: "SI Text, Eq. on SI p. 2 col 2"
equation: "L/r = 2*omega^(1/2) for omega >= 1; 1 + omega for 0 <= omega < 1"
inputs:
  omega:
    quantity: anchoring_strength
    unit: dimensionless
outputs:
  aspect_ratio:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
settings: {}
stochastic: false
