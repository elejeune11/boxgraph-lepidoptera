id: actin_concentration_from_mesh_size
name: actin mass concentration from uncross-linked mesh size (helper inverse of Schmidt et al. 1989)
role: processing
described_from: ref-18
built_from:
  - actin_mesh_size
stated:
  page: 7
  printed_page: "SI-1"
  quote: "mg/mL, c, using the relation ξ = 0.3c−1/2 (18)"
  where: "SI Text, Filament Length, Mesh Size, and Filament Spacing (algebraic inverse of xi = 0.3*c^(-1/2))"
equation: "c = (0.3 / xi)^2  [c in mg/mL, xi in um]"
inputs:
  xi:
    quantity: mesh_size
    unit: um
outputs:
  c:
    quantity: actin_mass_concentration
    unit: "mg/mL"
settings: {}
stochastic: false
