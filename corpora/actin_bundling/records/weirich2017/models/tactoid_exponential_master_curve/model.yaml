id: tactoid_exponential_master_curve
name: rescaled single-exponential master relaxation curve (L(t)-L_f)/(L_i-L_f) = exp(-t/tau)
role: fit
built_from:
  - tactoid_exponential_relaxation
stated:
  page: 4
  printed_page: "2134"
  quote: "collapses into a master curve. The solid line represents an exponential"
  where: "Fig. 3C caption (p. 2134) & Fig. 4D (p. 2135)"
equation: "(L(t) - L_f) / (L_i - L_f) = exp(-t / tau)"
inputs:
  t_scaled:
    quantity: rescaled_time
    unit: dimensionless
outputs:
  L_scaled:
    quantity: rescaled_length
    unit: dimensionless
settings: {}
stochastic: false
