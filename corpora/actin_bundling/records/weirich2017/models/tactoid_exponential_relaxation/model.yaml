id: tactoid_exponential_relaxation
name: single-exponential length relaxation fit during coalescence or contraction
role: fit
stated:
  page: 3
  printed_page: "2133"
  quote: "relaxation time, τ, using L(t) = Lf + (Li − Lf)exp(−t/τ), where τ is"
  where: "text, p. 2133 col 2 & Figs. 3B-C, 4C-D"
equation: "L(t) = L_f + (L_i - L_f) * exp(-t / tau)"
inputs:
  t:
    quantity: elapsed_time
    unit: s
  L_i:
    quantity: tactoid_major_axis
    unit: um
  L_f:
    quantity: tactoid_major_axis
    unit: um
  tau:
    quantity: relaxation_time
    unit: s
outputs:
  L:
    quantity: tactoid_major_axis
    unit: um
settings: {}
stochastic: false
