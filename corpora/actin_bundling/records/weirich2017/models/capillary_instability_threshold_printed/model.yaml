id: capillary_instability_threshold_printed
name: critical Rayleigh-Plateau instability wavelength for nematic capillary (SI p. 9 col 2, as printed)
role: model
built_from:
  - capillary_energy_cost_printed
stated:
  page: 9
  printed_page: "SI-3"
  quote: "when δF < 0, which occurs for wavelengths λ ≥ 1 + ω ð2πR0 Þ."
  where: "SI Text, Capillary Instabilities in Long Droplets & Fig. S3 caption"
equation: "lambda_c = 2 * pi * R_0 * sqrt(1 + omega)"
inputs:
  R_0:
    quantity: bundle_radius
    unit: nm
  omega:
    quantity: anchoring_strength
    unit: dimensionless
outputs:
  lambda_c:
    quantity: perturbation_wavelength
    unit: um
  enhancement:
    quantity: wavelength_enhancement_factor
    unit: dimensionless
settings: {}
stochastic: false
