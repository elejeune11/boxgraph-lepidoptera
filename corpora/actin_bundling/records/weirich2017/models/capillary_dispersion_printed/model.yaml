id: capillary_dispersion_printed
name: viscous nematic capillary instability dispersion relation Omega(k) (SI p. 9 col 2, as printed)
role: model
prefactor: unknown
described_from: ref-49
built_from:
  - capillary_energy_cost_printed
  - capillary_dynamic_factor_scaling
stated:
  page: 9
  printed_page: "SI-3"
  quote: "form (49) ΩðkÞ = ΛðkÞ½1 − ð1 + ωÞk2  , where ΛðkÞ is a dynamical"
  where: "SI Text, Capillary Instabilities in Long Droplets"
equation: "Omega(k) ~ (gamma_I / (eta * R_0)) * k^2 * [1 - (1 + omega) * k^2]"
inputs:
  gamma_I:
    quantity: interfacial_tension_isotropic
    unit: "nN/m"
  eta:
    quantity: dynamic_viscosity
    unit: "Pa*s"
  R_0:
    quantity: bundle_radius
    unit: nm
  omega:
    quantity: anchoring_strength
    unit: dimensionless
  k:
    quantity: perturbation_wavenumber_dimensionless
    unit: dimensionless
outputs:
  Omega:
    quantity: capillary_growth_rate
    unit: "1/s"
settings: {}
stochastic: false
