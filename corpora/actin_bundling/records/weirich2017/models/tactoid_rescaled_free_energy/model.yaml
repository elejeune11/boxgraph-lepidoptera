id: tactoid_rescaled_free_energy
name: dimensionless rescaled tactoid free energy F / (gamma_I V^(2/3)) at fixed volume
role: model
built_from:
  - tactoid_free_energy
  - tactoid_geometry_circular_arc
  - anchoring_strength_definition
stated:
  page: 8
  printed_page: "SI-2"
  quote: "F=γ I V 2=3, is simply a function of α, and their dependence is"
  where: "SI Text, Equilibrium Droplet Shapes"
equation: "F_hat(alpha, omega) = (4*pi*(sin(alpha) - alpha*cos(alpha)) + 2*pi*omega*(sin(alpha) - alpha*cos(alpha) - (1/3)*sin^3(alpha))) / (2*pi*(sin(alpha) - alpha*cos(alpha) - (1/3)*sin^3(alpha)))^(2/3)"
inputs:
  alpha:
    quantity: tactoid_central_angle
    unit: dimensionless
  omega:
    quantity: anchoring_strength
    unit: dimensionless
outputs:
  F_hat:
    quantity: rescaled_free_energy
    unit: dimensionless
settings: {}
stochastic: false
