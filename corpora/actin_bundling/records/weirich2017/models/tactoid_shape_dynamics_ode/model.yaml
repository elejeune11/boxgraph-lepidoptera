id: tactoid_shape_dynamics_ode
name: coupled nonlinear ODE for anisotropic tactoid shape relaxation (dF/dt + D = 0, dV/dt = 0)
role: model
built_from:
  - tactoid_geometry_circular_arc
  - tactoid_free_energy
  - tactoid_dissipation_power
  - tactoid_equilibrium_minimizer
stated:
  page: 9
  printed_page: "SI-3"
  quote: "NDSolve), subject to the initial conditions for the shape pa-"
  where: "SI Text, Liquid Droplets with Isotropic and Anisotropic Interfacial Tension"
equation: "dF/dt + D = 0, dV/dt = 0 with eta_R = eta_alpha = eta; exponential fit L(t) = L_eq + (L_i - L_eq)*exp(-t/tau)"
inputs:
  omega:
    quantity: anchoring_strength
    unit: dimensionless
  v_cap:
    quantity: capillary_velocity
    unit: "um/s"
  L_eq:
    quantity: tactoid_major_axis
    unit: um
  L_i:
    quantity: tactoid_major_axis
    unit: um
  t_max:
    quantity: integration_time_horizon
    unit: s
outputs:
  tau:
    quantity: relaxation_time
    unit: s
  tau_linearized:
    quantity: relaxation_time
    unit: s
  alpha_eq:
    quantity: tactoid_central_angle
    unit: dimensionless
  alpha_min:
    quantity: tactoid_central_angle
    unit: dimensionless
  L_final:
    quantity: tactoid_major_axis
    unit: um
settings:
  n_steps: 400
stochastic: false
