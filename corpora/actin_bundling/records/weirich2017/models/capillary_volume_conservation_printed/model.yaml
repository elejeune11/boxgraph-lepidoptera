id: capillary_volume_conservation_printed
name: perturbed capillary volume integral (SI p. 9 col 2, as printed with 2*pi)
role: model
stated:
  page: 9
  printed_page: "SI-3"
  quote: "of volume, 2π dzρ2 ðzÞ = πR20 λ."
  where: "SI Text, Capillary Instabilities in Long Droplets"
equation: "V_printed = 2 * pi * int_0^lambda dz [R_0 + u*sin(2*pi*z/lambda) - u^2/(4*R_0)]^2 = 2 * pi * lambda * (R_0^2 + u^4 / (16 * R_0^2))"
inputs:
  R_0:
    quantity: bundle_radius
    unit: um
  u:
    quantity: perturbation_amplitude
    unit: um
  lam:
    quantity: perturbation_wavelength
    unit: um
outputs:
  V:
    quantity: capillary_volume_per_wavelength
    unit: "um**3"
settings: {}
stochastic: false
