id: tactoid_geometry_circular_arc
name: circular-arc tactoid surface area, anchoring area, axes, and volume
role: model
from_words: true
stated:
  page: 8
  printed_page: "SI-2"
  quote: "and α (Fig. S2B), A = 4πR2 ðsin α − α cos αÞ. The effective"
  where: "SI Text, Equilibrium Droplet Shapes & Fig. S2B"
equation: "L = 2*R*sin(alpha); r = 2*R*(1 - cos(alpha)); A = 4*pi*R^2*(sin(alpha) - alpha*cos(alpha)); A_omega = 2*pi*R^2*(sin(alpha) - alpha*cos(alpha) - (1/3)*sin^3(alpha)); V = 2*pi*R^3*(sin(alpha) - alpha*cos(alpha) - (1/3)*sin^3(alpha))"
inputs:
  R:
    quantity: tactoid_arc_radius
    unit: um
  alpha:
    quantity: tactoid_central_angle
    unit: dimensionless
outputs:
  L:
    quantity: tactoid_major_axis
    unit: um
  r:
    quantity: tactoid_minor_axis
    unit: um
  aspect_ratio:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
  A:
    quantity: tactoid_surface_area
    unit: "um**2"
  A_omega:
    quantity: tactoid_anchoring_area
    unit: "um**2"
  V:
    quantity: tactoid_volume
    unit: "um**3"
settings: {}
stochastic: false
