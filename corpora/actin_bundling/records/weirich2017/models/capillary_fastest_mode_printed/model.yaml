id: capillary_fastest_mode_printed
name: fastest-growing capillary instability wavenumber and wavelength (SI p. 9 col 2, as printed)
role: model
built_from:
  - capillary_dispersion_printed
  - capillary_wavelength_from_wavenumber
stated:
  page: 9
  printed_page: "SI-3"
  quote: "kmax = 1= 2ð1 + ωÞ. Using typical parameter values from the ex-"
  where: "SI Text, Capillary Instabilities in Long Droplets"
equation: "k_max = 1 / sqrt(2*(1 + omega)); lambda_max = 2 * pi * R_0 * sqrt(2*(1 + omega))"
inputs:
  R_0:
    quantity: bundle_radius
    unit: nm
  omega:
    quantity: anchoring_strength
    unit: dimensionless
outputs:
  k_max:
    quantity: perturbation_wavenumber_dimensionless
    unit: dimensionless
  lambda_max:
    quantity: perturbation_wavelength
    unit: um
  lambda_to_R0:
    quantity: wavelength_to_radius_ratio
    unit: dimensionless
settings: {}
stochastic: false
