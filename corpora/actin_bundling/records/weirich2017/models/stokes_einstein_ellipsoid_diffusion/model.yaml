id: stokes_einstein_ellipsoid_diffusion
name: Stokes-Einstein translational diffusion coefficient for a prolate ellipsoid
role: model
described_from: ref-43
stated:
  page: 8
  printed_page: "SI-2"
  quote: "using the Stokes–Einstein relationship for an ellip-"
  where: "SI Text, Eq. on SI p. 2 col 1"
equation: "D = k_B * T * ln(2*L / r) / (6 * pi * eta * L)"
inputs:
  T:
    quantity: temperature
    unit: K
  L:
    quantity: filament_half_length
    unit: nm
  r:
    quantity: filament_radius
    unit: nm
  eta:
    quantity: dynamic_viscosity
    unit: "Pa*s"
outputs:
  D:
    quantity: diffusion_coefficient
    unit: "um**2/s"
settings: {}
stochastic: false
