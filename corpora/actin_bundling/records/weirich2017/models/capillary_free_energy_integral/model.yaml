id: capillary_free_energy_integral
name: exact numerical surface and anchoring free-energy integrals for a perturbed nematic capillary
role: model
stated:
  page: 9
  printed_page: "SI-3"
  quote: "nematic liquid capillary, the total interfacial free energy is given"
  where: "SI Text, Capillary Instabilities in Long Droplets (A, A_omega, F integrals)"
equation: "A = 2*pi*int_0^lambda rho*sqrt(1+rho'^2) dz; A_omega = 2*pi*int_0^lambda rho*rho'^2/sqrt(1+rho'^2) dz; F = gamma_I*(A + omega*A_omega); delta_F = F - 2*pi*R_0*lambda*gamma_I"
inputs:
  R_0:
    quantity: bundle_radius
    unit: um
  u:
    quantity: perturbation_amplitude
    unit: um
  lam:
    quantity: perturbation_wavelength
    unit: um
  gamma_I:
    quantity: interfacial_tension_isotropic
    unit: "nN/m"
  omega:
    quantity: anchoring_strength
    unit: dimensionless
outputs:
  A:
    quantity: tactoid_surface_area
    unit: "um**2"
  A_omega:
    quantity: tactoid_anchoring_area
    unit: "um**2"
  F:
    quantity: interfacial_free_energy
    unit: J
  delta_F:
    quantity: capillary_energy_change
    unit: J
settings:
  n_grid: 256
stochastic: false
