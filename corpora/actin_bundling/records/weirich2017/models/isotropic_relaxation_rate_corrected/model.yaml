id: isotropic_relaxation_rate_corrected
name: isotropic droplet exponential relaxation rate and timescale (corrected from SI p. 8 energy balance)
role: model
prefactor: unknown
variant_of: isotropic_relaxation_rate_printed
corrections:
  - equation: "isotropic droplet relaxation rate and timescale (SI p. 8 col 2)"
    change: "invert (r*eta/gamma_I) to (gamma_I/(r*eta)) in dL/dt, and invert gamma_I/eta to r*eta/gamma_I (proportional to eta/gamma_I) in tau"
    evidence: "Balancing the paper's own printed mechanical energy rate dE/dt ~ -gamma_I * r * (dL/dt) with its printed dissipation rate D ~ eta * (r^2 * L) * (dL/dt)^2 / L^2 gives dL/dt ~ -L * (gamma_I / (r * eta)) and tau ~ r * eta / gamma_I. Dimensionally, [r*eta/gamma_I] = [time], so printed L*(r*eta/gamma_I) has units [length*time] instead of [length/time], and printed tau ~ gamma_I/eta has units [length/time] instead of [time]. The very next sentence on SI p. 8 col 2 correctly gives tau proportional to eta/gamma_I."
stated:
  page: 8
  printed_page: "SI-2"
  quote: "nentially as dL=dt ∝ − Lðrη=γ I Þ, with a timescale τ that is pro-"
  where: "SI Text, Liquid Droplets with Isotropic Interfacial Tension"
equation: "dL/dt ~ -L * (gamma_I / (r * eta)); tau ~ r * eta / gamma_I"
inputs:
  L:
    quantity: tactoid_major_axis
    unit: um
  r:
    quantity: tactoid_minor_axis
    unit: um
  eta:
    quantity: dynamic_viscosity
    unit: "Pa*s"
  gamma_I:
    quantity: interfacial_tension_isotropic
    unit: "nN/m"
outputs:
  dL_dt:
    quantity: length_shortening_rate
    unit: "um/s"
  tau:
    quantity: relaxation_time
    unit: s
settings: {}
stochastic: false
