id: tactoid_free_energy
name: total interfacial free energy F(R, alpha) of a homogeneous tactoid
role: model
built_from:
  - tactoid_geometry_circular_arc
stated:
  page: 8
  printed_page: "SI-2"
  quote: "free energy, FðR, αÞ = γ I A + γ A Aω, with respect to α, subject to"
  where: "SI Text, Equilibrium Droplet Shapes"
equation: "F(R, alpha) = gamma_I * A(R, alpha) + gamma_A * A_omega(R, alpha)"
inputs:
  R:
    quantity: tactoid_arc_radius
    unit: um
  alpha:
    quantity: tactoid_central_angle
    unit: dimensionless
  gamma_I:
    quantity: interfacial_tension_isotropic
    unit: "nN/m"
  gamma_A:
    quantity: interfacial_tension_anisotropic
    unit: "nN/m"
outputs:
  F:
    quantity: interfacial_free_energy
    unit: J
settings: {}
stochastic: false
