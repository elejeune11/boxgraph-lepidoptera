id: capillary_free_energy_per_length
name: interfacial free energy per unit axial length of a perturbed nematic capillary (helper)
role: processing
stated:
  page: 9
  printed_page: "SI-3"
  quote: "nematic liquid capillary, the total interfacial free energy is given"
  where: "SI Text, Capillary Instabilities in Long Droplets (F / lambda from exact A, A_omega, F integrals)"
equation: "F_over_lam = F / lambda = (gamma_I / lambda) * (A + omega * A_omega); delta_F_over_lam = (F - 2*pi*R_0*lambda*gamma_I) / lambda"
built_from:
  - capillary_free_energy_integral
inputs:
  R_0:
    quantity: bundle_radius
    unit: um
  u:
    quantity: perturbation_amplitude
    unit: um
  lam:
    quantity: perturbation_wavelength
    unit: um
  gamma_I:
    quantity: interfacial_tension_isotropic
    unit: "nN/m"
  omega:
    quantity: anchoring_strength
    unit: dimensionless
outputs:
  F_over_lam:
    quantity: capillary_free_energy_per_length
    unit: pN
  delta_F_over_lam:
    quantity: capillary_free_energy_per_length
    unit: pN
settings:
  n_grid: 256
stochastic: false
