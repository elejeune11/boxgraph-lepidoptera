id: tactoid_rescaled_free_energy_figS2c_norm
name: rescaled tactoid free energy F / ((2*pi)^(1/3) gamma_I V^(2/3)) matching Fig. S2C ordinate
role: model
variant_of: tactoid_rescaled_free_energy
built_from:
  - tactoid_free_energy
  - tactoid_geometry_circular_arc
  - anchoring_strength_definition
corrections:
  - equation: "SI p. 8 col 2 & Fig. S2C y-axis label (F / gamma_I V^(2/3))"
    change: "Divide the exact dimensionless ratio F / (gamma_I V^(2/3)) by (2*pi)^(1/3) = 1.84527015, giving (2*f(alpha) + omega*g(alpha)) / g(alpha)^(2/3)"
    evidence: "Across all 26 digitized points of SI Fig. S2C (omega = 0, 0.5, 2), the exact F/(gamma_I V^(2/3)) exceeds the plotted curves by a constant factor of 1.8453 +/- 0.001 = (2*pi)^(1/3) (e.g., spherical minimum at alpha = pi/2, omega = 0 is (36*pi)^(1/3) = 4.8360 vs plotted 2.621 = (36*pi)^(1/3)/(2*pi)^(1/3) = 18^(1/3)). This confirms q_figS2C_missing_2pi_one_third_factor."
stated:
  page: 8
  printed_page: "SI-2"
  quote: "F=γ I V 2=3, is simply a function of α, and their dependence is"
  where: "SI Text, Equilibrium Droplet Shapes & Fig. S2C (p. 10)"
equation: "F_hat_S2c(alpha, omega) = (2*(sin(alpha) - alpha*cos(alpha)) + omega*(sin(alpha) - alpha*cos(alpha) - (1/3)*sin^3(alpha))) / (sin(alpha) - alpha*cos(alpha) - (1/3)*sin^3(alpha))^(2/3)"
inputs:
  alpha:
    quantity: tactoid_central_angle
    unit: dimensionless
  omega:
    quantity: anchoring_strength
    unit: dimensionless
outputs:
  F_hat:
    quantity: rescaled_free_energy
    unit: dimensionless
settings: {}
stochastic: false
