id: tactoid_equilibrium_minimizer
name: numerical minimization of tactoid free energy for equilibrium shape
role: model
built_from:
  - tactoid_rescaled_free_energy
stated:
  page: 8
  printed_page: "SI-2"
  quote: "minimization of the free energy. Using the above equation, ω can"
  where: "SI Text, Equilibrium Droplet Shapes & Fig. S2C-D"
equation: "alpha_eq = argmin_{alpha in (0, pi)} F_hat(alpha, omega); L/r = sin(alpha_eq) / (1 - cos(alpha_eq))"
inputs:
  omega:
    quantity: anchoring_strength
    unit: dimensionless
outputs:
  alpha_eq:
    quantity: tactoid_central_angle
    unit: dimensionless
  aspect_ratio:
    quantity: tactoid_aspect_ratio
    unit: dimensionless
  F_hat_min:
    quantity: rescaled_free_energy
    unit: dimensionless
settings:
  n_bracket: 200
  xtol: 1.0e-8
stochastic: false
