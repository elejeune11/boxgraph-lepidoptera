id: capillary_dynamic_factor_scaling
name: viscous capillary hydrodynamic dynamic factor scaling Lambda(k) ~ (gamma_I / (eta * R_0)) * k^2
role: model
prefactor: unknown
built_from:
  - capillary_rate_scale
  - capillary_axial_velocity
stated:
  page: 9
  printed_page: "SI-3"
  quote: "ΛðkÞ ∼ ðγ=ηR0 Þk2. Thus, the wavelength of the fastest growing"
  where: "SI Text, Capillary Instabilities in Long Droplets"
equation: "Lambda(k) ~ (gamma_I / (eta * R_0)) * k^2"
inputs:
  gamma_I:
    quantity: interfacial_tension_isotropic
    unit: "nN/m"
  eta:
    quantity: dynamic_viscosity
    unit: "Pa*s"
  R_0:
    quantity: bundle_radius
    unit: nm
  k:
    quantity: perturbation_wavenumber_dimensionless
    unit: dimensionless
outputs:
  Lambda:
    quantity: capillary_growth_rate
    unit: "1/s"
settings: {}
stochastic: false
