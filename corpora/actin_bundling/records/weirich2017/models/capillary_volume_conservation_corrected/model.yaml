id: capillary_volume_conservation_corrected
name: perturbed capillary volume integral (corrected pi*int_0^lambda rho^2 dz)
role: model
variant_of: capillary_volume_conservation_printed
corrections:
  - equation: "volume conservation constraint (SI p. 9 col 2)"
    change: "replace 2*pi with pi in the volume integral of revolution: pi * int_0^lambda dz rho^2(z) = pi * R_0^2 * lambda"
    evidence: "For an unperturbed cylinder (u = 0, rho(z) = R_0), the printed LHS gives 2*pi*R_0^2*lambda, twice the printed RHS pi*R_0^2*lambda. With the standard surface-of-revolution volume pi * int_0^lambda rho^2(z) dz, the paper's printed profile rho(z) = R_0 + u*sin(2*pi*z/lambda) - u^2/(4*R_0) satisfies pi*int_0^lambda rho^2 dz = pi*R_0^2*lambda + O(u^4)."
stated:
  page: 9
  printed_page: "SI-3"
  quote: "of volume, 2π dzρ2 ðzÞ = πR20 λ."
  where: "SI Text, Capillary Instabilities in Long Droplets"
equation: "V = pi * int_0^lambda dz [R_0 + u*sin(2*pi*z/lambda) - u^2/(4*R_0)]^2 = pi * lambda * (R_0^2 + u^4 / (16 * R_0^2))"
inputs:
  R_0:
    quantity: bundle_radius
    unit: um
  u:
    quantity: perturbation_amplitude
    unit: um
  lam:
    quantity: perturbation_wavelength
    unit: um
outputs:
  V:
    quantity: capillary_volume_per_wavelength
    unit: "um**3"
settings: {}
stochastic: false
