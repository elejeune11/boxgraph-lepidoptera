id: capillary_instability_threshold_corrected
name: critical Rayleigh-Plateau instability wavelength for nematic capillary (corrected sqrt(1 + 2*omega))
role: model
variant_of: capillary_instability_threshold_printed
corrections:
  - equation: "critical instability wavelength lambda_c (SI p. 9 col 2 & Fig. S3 caption)"
    change: "replace sqrt(1 + omega) with sqrt(1 + 2*omega)"
    evidence: "Setting the exact O(u^2) expansion delta F = (pi*lambda*u^2*gamma_I/(2*R_0))*[(1 + 2*omega)*k^2 - 1] < 0 derived from the paper's own printed surface integrals A, A_omega, and F on SI p. 9 yields k < (1 + 2*omega)^(-1/2), i.e. lambda > 2*pi*R_0*sqrt(1 + 2*omega)."
built_from:
  - capillary_energy_cost_corrected
stated:
  page: 9
  printed_page: "SI-3"
  quote: "when δF < 0, which occurs for wavelengths λ ≥ 1 + ω ð2πR0 Þ."
  where: "SI Text, Capillary Instabilities in Long Droplets & Fig. S3 caption"
equation: "lambda_c = 2 * pi * R_0 * sqrt(1 + 2*omega)"
inputs:
  R_0:
    quantity: bundle_radius
    unit: nm
  omega:
    quantity: anchoring_strength
    unit: dimensionless
outputs:
  lambda_c:
    quantity: perturbation_wavelength
    unit: um
  enhancement:
    quantity: wavelength_enhancement_factor
    unit: dimensionless
settings: {}
stochastic: false
