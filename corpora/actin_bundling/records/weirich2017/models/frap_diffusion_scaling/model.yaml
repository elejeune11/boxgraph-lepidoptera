id: frap_diffusion_scaling
name: FRAP diffusion coefficient scaling from recovery time
role: model
from_words: true
prefactor: unknown
stated:
  page: 7
  printed_page: "SI-1"
  quote: "proximate size of the bleached region, this translates to"
  where: "SI Text, Fluorescence Recovery After Photobleaching and Viscosity Estimate"
equation: "D ~ L_b^2 / tau_R"
inputs:
  L_b:
    quantity: bleached_region_size
    unit: um
  tau_R:
    quantity: frap_recovery_time
    unit: s
outputs:
  D:
    quantity: diffusion_coefficient
    unit: "um**2/s"
settings: {}
stochastic: false
