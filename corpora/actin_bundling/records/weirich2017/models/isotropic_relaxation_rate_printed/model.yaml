id: isotropic_relaxation_rate_printed
name: isotropic droplet exponential relaxation rate and timescale (SI p. 8, as printed)
role: model
prefactor: unknown
stated:
  page: 8
  printed_page: "SI-2"
  quote: "nentially as dL=dt ∝ − Lðrη=γ I Þ, with a timescale τ that is pro-"
  where: "SI Text, Liquid Droplets with Isotropic Interfacial Tension"
equation: "dL/dt ~ -L * (r * eta / gamma_I); tau ~ gamma_I / eta"
inputs:
  L:
    quantity: tactoid_major_axis
    unit: um
  r:
    quantity: tactoid_minor_axis
    unit: um
  eta:
    quantity: dynamic_viscosity
    unit: "Pa*s"
  gamma_I:
    quantity: interfacial_tension_isotropic
    unit: "nN/m"
outputs:
  dL_dt:
    quantity: length_shortening_rate
    unit: "um/s"
  tau:
    quantity: relaxation_time
    unit: s
settings: {}
stochastic: false
