id: actin_filament_length_cp
name: average F-actin filament length from capping protein ratio
role: model
from_words: true
stated:
  page: 7
  printed_page: "SI-1"
  quote: "approximate the average number of actin monomers in a filament"
  where: "SI Text, Filament Length, Mesh Size, and Filament Spacing"
equation: "N_m = 1 / r_CP; L_f = a_m * N_m = a_m / r_CP"
inputs:
  a_m:
    quantity: actin_monomer_spacing
    unit: nm
  r_CP:
    quantity: capping_protein_mole_fraction
    unit: dimensionless
outputs:
  N_m:
    quantity: monomers_per_filament
    unit: dimensionless
  L_f:
    quantity: filament_length
    unit: nm
settings: {}
stochastic: false
