- id: actin_mw_added
  quantity: actin_molecular_weight
  unit: "g/mol"
  printed: "42000"
  basis: "Standard molecular weight of monomeric rabbit skeletal muscle G-actin (~42 kDa), needed to convert the paper's molar concentration (2.6 or 2.64 uM) to mass concentration c in mg/mL for xi = 0.3 c^(-1/2) (SI p. 7)."
  alternatives: ["41800", "43000"]
  stands_for: "G-actin molar mass converting c_A (uM) to c (mg/mL)"

- id: frap_bleached_size_added
  quantity: bleached_region_size
  unit: um
  printed: "1.65"
  basis: "SI p. 7 states D ~ 0.3 x 10^-2 um^2/s is obtained from tau_R ~ 900 s by 'Scaling by the approximate size of the bleached region', without printing the bleached region length; Fig. 1C (2 um scale bar) shows a bleached half-tactoid of roughly 1.5-2.0 um (sqrt(D * tau_R) = 1.64 um)."
  alternatives: ["1.0", "2.0", "2.5"]
  stands_for: "approximate size of the bleached region (SI p. 7)"

- id: tactoid_arc_radius_probe_added
  quantity: tactoid_arc_radius
  unit: um
  printed: "2.0"
  basis: "Representative circular-arc radius R chosen to exercise the dimensional tactoid geometry and free-energy models (SI p. 8), corresponding to a ~2.5 um tactoid at alpha ~ 0.7 rad."
  alternatives: ["1.0", "5.0"]
  stands_for: "R in A(R, alpha), A_omega(R, alpha), and F(R, alpha)"

- id: tactoid_angle_probe_added
  quantity: tactoid_central_angle
  unit: dimensionless
  printed: "0.7"
  basis: "Representative central angle alpha (rad) near the omega ~ 2 equilibrium minimum (alpha* = 0.672 rad) used to evaluate the tactoid geometry and free-energy models."
  alternatives: ["0.5", "1.0", "1.5708"]
  stands_for: "alpha in F(R, alpha) and F/(gamma_I V^(2/3))"

- id: gamma_A_probe_added
  quantity: interfacial_tension_anisotropic
  unit: "nN/m"
  printed: "600"
  basis: "Representative anisotropic surface anchoring energy gamma_A = omega * gamma_I = 2 * 300 nN/m = 600 nN/m consistent with gamma_I ~ 300 nN/m (p. 4) and omega ~ 2 (5 mol % filamin)."
  alternatives: ["300", "420", "900"]
  stands_for: "gamma_A in F = gamma_I A + gamma_A A_omega and chi = gamma_A V^(1/3) / K"

- id: frank_elastic_K_added
  quantity: frank_elastic_constant
  unit: pN
  printed: "10"
  basis: "Representative nematic Frank elastic constant K for F-actin (~1-10 pN, order k_B T / d_filament to k_B T l_p / d^2), used to evaluate the dimensionless crossover parameter gamma_A V^(1/3)/K (SI p. 8) where the paper gives no numerical value for K."
  alternatives: ["1", "50"]
  stands_for: "K in gamma_A V^(1/3) / K (SI p. 8)"

- id: coal_5_Li_added
  quantity: tactoid_major_axis
  unit: um
  printed: "4.5"
  basis: "Initial coalesced length L_i for 5 mol % filamin tactoids (Table S1 L_eq = 2.74 um), consistent with Fig. 3C inset showing L_i - L_f ~ 1.0-2.2 um for 5% filamin."
  alternatives: ["3.74", "5.0"]
  stands_for: "initial coalesced tactoid length L_i (5 mol % filamin)"

- id: coal_10_Li_added
  quantity: tactoid_major_axis
  unit: um
  printed: "9.2"
  basis: "Initial coalesced length L_i for 10 mol % filamin tactoids (Table S1 L_eq = 6.04 um), consistent with Fig. 3B (L_i ~ 9.2 um) and Fig. 3C inset (L_i - L_f ~ 1.8-4.4 um)."
  alternatives: ["8.0", "10.5"]
  stands_for: "initial coalesced tactoid length L_i (10 mol % filamin)"

- id: contr_2p5_Li_added
  quantity: tactoid_major_axis
  unit: um
  printed: "8.2"
  basis: "Initial bundle length L_i for 2.5 mol % filamin contraction (Table S1 L_eq = 5.77 um), corresponding to ~30% contractile strain (Fig. 4C, E)."
  alternatives: ["7.2", "10.0"]
  stands_for: "initial contracting bundle length L_i (2.5 mol % filamin)"

- id: contr_5_Li_added
  quantity: tactoid_major_axis
  unit: um
  printed: "9.0"
  basis: "Initial bundle length L_i for 5 mol % filamin contraction (Table S1 L_eq = 5.87 um), corresponding to ~35% contractile strain (Fig. 4E)."
  alternatives: ["7.8", "11.0"]
  stands_for: "initial contracting bundle length L_i (5 mol % filamin)"

- id: contr_10_Li_added
  quantity: tactoid_major_axis
  unit: um
  printed: "10.5"
  basis: "Initial bundle length L_i for 10 mol % filamin contraction (Table S1 L_eq = 5.68 um), corresponding to ~46% contractile strain (Fig. 4C, E)."
  alternatives: ["8.5", "14.0"]
  stands_for: "initial contracting bundle length L_i (10 mol % filamin)"

- id: ode_t_max_coal_added
  quantity: integration_time_horizon
  unit: s
  printed: "250"
  basis: "ODE integration and exponential-fit time horizon for coalescence events, matching the 250 s time window shown in Fig. 3B (SI p. 9 does not state the exact fitting window)."
  alternatives: ["100", "500"]
  stands_for: "t_max for Mathematica NDSolve and exponential fit in coalescence (SI p. 9)"

- id: ode_t_max_contr_added
  quantity: integration_time_horizon
  unit: s
  printed: "1500"
  basis: "ODE integration and exponential-fit time horizon for bundle contraction events, matching the 1500 s time window shown in Fig. 4C (SI p. 9 does not state the exact fitting window)."
  alternatives: ["1000", "2500"]
  stands_for: "t_max for Mathematica NDSolve and exponential fit in contraction (SI p. 9)"

- id: exp_relax_time_probe_added
  quantity: elapsed_time
  unit: s
  printed: "30"
  basis: "Representative elapsed time t after coalescence (matching the 30 s snapshot in Fig. 3B) to exercise the exponential relaxation fit model L(t) = L_f + (L_i - L_f) exp(-t/tau)."
  alternatives: ["10", "100"]
  stands_for: "t in L(t) = L_f + (L_i - L_f) exp(-t/tau)"

- id: exp_relax_tau_probe_added
  quantity: relaxation_time
  unit: s
  printed: "35"
  basis: "Representative coalescence relaxation time tau (mid-range of Fig. 3D 10% filamin values, 24-57 s) used to exercise L(t) = L_f + (L_i - L_f) exp(-t/tau)."
  alternatives: ["15", "50"]
  stands_for: "tau in L(t) = L_f + (L_i - L_f) exp(-t/tau)"

- id: coarsening_time_probe_added
  quantity: elapsed_time
  unit: min
  printed: "60"
  basis: "Representative coarsening time (60 min, matching the 60 min growth window on p. 1) used to exercise the power-law growth fit L ~ t^alpha."
  alternatives: ["10", "100"]
  stands_for: "t in L ~ t^alpha (p. 3)"

- id: isotropic_r_probe_added
  quantity: tactoid_minor_axis
  unit: um
  printed: "2.0"
  basis: "Representative tactoid minor-axis width r (for L ~ 5-6 um and L/r ~ 2.5-3) used to exercise the isotropic energy-balance relaxation scaling models (SI p. 8)."
  alternatives: ["1.0", "3.0"]
  stands_for: "r in isotropic relaxation scaling (SI p. 8)"

- id: deformation_length_probe_added
  quantity: deformation_length
  unit: um
  printed: "3.0"
  basis: "Representative coalescence deformation length L_i - L_f (mid-range of Fig. 3C inset, 0.5-4.5 um) used to exercise linear scaling tau = (eta / gamma_eff)*(L_i - L_f)."
  alternatives: ["1.5", "4.0"]
  stands_for: "L_i - L_f in Fig. 3C inset linear scaling"

- id: gamma_eff_probe_added
  quantity: interfacial_tension_effective
  unit: "nN/m"
  printed: "300"
  basis: "Representative effective interfacial tension gamma_eff ~ gamma_I ~ 300 nN/m (p. 4) used to exercise linear relaxation-time scaling."
  alternatives: ["200", "500"]
  stands_for: "gamma_eff in slope eta / gamma_eff (p. 4)"

- id: dissipation_dR_dt_probe_added
  quantity: tactoid_arc_radius_rate
  unit: "um/s"
  printed: "-0.05"
  basis: "Representative arc-radius rate dR/dt during coalescence relaxation used to exercise the viscous dissipation power formula D (SI p. 9)."
  alternatives: ["-0.01", "-0.1"]
  stands_for: "dR/dt in D = (1/2) V [eta_R (dR/dt / R)^2 + eta_alpha (dalpha/dt / alpha)^2]"

- id: dissipation_dalpha_dt_probe_added
  quantity: tactoid_central_angle_rate
  unit: "1/s"
  printed: "0.01"
  basis: "Representative central-angle relaxation rate d(alpha)/dt during coalescence used to exercise the viscous dissipation power formula D (SI p. 9)."
  alternatives: ["0.005", "0.02"]
  stands_for: "d(alpha)/dt in D (SI p. 9)"

- id: capillary_u_probe_added
  quantity: perturbation_amplitude
  unit: nm
  printed: "5"
  basis: "Small sinusoidal perturbation amplitude u << R_0 = 200 nm (u/R_0 = 0.025) chosen to verify the O(u^2) expansion of the capillary surface integrals on SI p. 9."
  alternatives: ["1", "20"]
  stands_for: "u in rho(z) = R_0 + u sin(2*pi*z/lambda) - u^2/(4*R_0) (SI p. 9)"

- id: capillary_du_dt_probe_added
  quantity: perturbation_growth_speed
  unit: "um/s"
  printed: "0.001"
  basis: "Representative radial perturbation growth speed du/dt (~1 nm/s, consistent with ~200 nm bulge growth over ~10 min in Fig. 4A) used to exercise capillary center axial velocity v = 2*pi*(du/dt)/k."
  alternatives: ["0.0005", "0.005"]
  stands_for: "du/dt in v = 2*pi*(du/dt)/k (SI p. 9)"

# ==========================================================================
# Added inputs for digitized figure verification (Fig. 3D fixed-volume test)
# ==========================================================================

- id: coal_10_Leq_fixedV_added
  quantity: tactoid_major_axis
  unit: um
  printed: "2.455"
  basis: "Equilibrium tactoid length L_eq at omega = 1.4 that preserves the exact droplet volume V = 1.088 um^3 of Table S1's 5 mol % filamin droplet (L_eq = 2.74 um at omega = 2.0), used to test SI p. 9's claim that Fig. 3D's omega = 2.0 and omega = 1.4 curves were generated at fixed volume."
  alternatives: ["2.74", "6.04"]
  stands_for: "fixed-volume L_eq for omega = 1.4 curve in Fig. 3D (SI p. 9)"

- id: coal_10_Li_fixedV_added
  quantity: tactoid_major_axis
  unit: um
  printed: "4.03"
  basis: "Initial coalesced length L_i at omega = 1.4 with the same relative initial stretch (L_i / L_eq = 4.5 / 2.74 = 1.642) as the 5 mol % filamin fixed-volume baseline."
  alternatives: ["3.68", "4.50"]
  stands_for: "fixed-volume initial length L_i for omega = 1.4 curve in Fig. 3D (SI p. 9)"
