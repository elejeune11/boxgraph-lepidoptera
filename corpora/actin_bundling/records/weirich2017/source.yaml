notes: >
  In scope: the entire quantitative core of the main article (PNAS 114, 2131-2136,
  PDF pp. 1-6) and Supporting Information Appendix (PDF pp. 7-16): actin filament length
  from capping protein ratio, pre-cross-linking mesh size (xi = 0.3 c^(-1/2)), FRAP
  recovery / diffusion coefficient / Stokes-Einstein ellipsoid viscosity estimate
  (eta ~ 3 Pa*s) and isotropic interfacial tension estimate (gamma_I ~ 300 nN/m),
  continuum theory of homogeneous nematic tactoids (circular-arc surface area A,
  anchoring area A_omega, fixed-volume rescaled free energy F/(gamma_I V^(2/3)),
  numerical minimization, asymptotic aspect-ratio relations L/r = 2*omega^(1/2) and
  1 + omega, and director crossover parameter gamma_A V^(1/3)/K), coarsening power law
  (L ~ t^alpha, alpha = 0.47 +/- 0.01 vs 0.5), isotropic and anisotropic continuum
  droplet shape-relaxation ODEs (dF/dt + D = 0, dV/dt = 0) with Table S1 best-fit
  parameters for coalescence and bundle contraction, and Rayleigh-Plateau capillary
  instability of nematic liquid cylinders (volume constraint, exact surface integrals,
  leading-order energy cost delta F, critical wavelength, viscous dispersion relation,
  and fastest-growing wavelength lambda_max).
  Deferred to the separate digitize stage (not digitized here): quantitative plots
  Figs. 1C, 1D, 2A, 3A, 3B, 3C (+ inset), 3D, 4C, 4D, 4E, S1, S2C, and S2D.
  Left out as qualitative micrographs, schematics, or movie stills with no plotted
  quantitative axes: Figs. 1A, 1B, 2B, 2C, 4A, 4B, S2A, S2B, S3, and Movie S1-S7 stills
  (pp. 11-16), plus experimental buffer/reagent recipes on SI p. 7 that feed no model
  (UV/ozone duration, vesicle buffer, lipid extrusion pores, oxygen scavenging enzymes,
  laser wavelengths, and confocal imaging intervals).
  Key algebraic and internal-consistency findings captured via printed models, evidenced
  variant_of models, within-paper ModelAtlas relations, and open questions:
  (1) Capillary instability missing factor of 2 on omega (SI p. 9 col 2): expanding the
  paper's own exact printed integrals A, A_omega, and F = gamma_I(A + omega A_omega) to
  O(u^2) yields delta F = (pi*lambda*u^2*gamma_I/(2*R_0))*[(1 + 2*omega)*k^2 - 1]
  (since sqrt(1 + rho'^2) gives 1/2 rho'^2 whereas rho'^2/sqrt(1 + rho'^2) gives 1*rho'^2),
  so lambda_c = 2*pi*R_0*sqrt(1 + 2*omega) and lambda_max = 2*pi*R_0*sqrt(2*(1 + 2*omega)).
  At R_0 ~ 200 nm and omega ~ 2, the printed (1 + omega) formula gives 3.08 um whereas the
  exact (1 + 2*omega) expansion gives 3.97 um, matching the paper's printed lambda_max ~ 4 um.
  (2) Capillary volume constraint (SI p. 9 col 2) prints 2*pi*int_0^lambda rho^2 dz = pi*R_0^2*lambda
  (extra factor of 2 on LHS), and Fig. S3 labels the mean radius R_0 - u^2/2 instead of
  R_0 - u^2/(4*R_0).
  (3) Isotropic droplet relaxation scaling (SI p. 8 col 2) prints dimensionally inverted
  dL/dt proportional to -L*(r*eta/gamma_I) and tau proportional to gamma_I/eta before
  correctly writing slope proportional to eta/gamma_I in the next sentence; immediately
  below, D = int dV eta_ij v_ij has units of energy rather than power (missing second
  strain-rate factor v_ij).
  (4) Fig. S2C plots (2*f(alpha) + omega*g(alpha))/g(alpha)^(2/3), smaller than the true
  rescaled free energy F/(gamma_I*V^(2/3)) by (2*pi)^(1/3) ~ 1.8453 (without affecting
  equilibrium alpha* or L/r).
  (5) Table S1 reports omega = 1.87 +/- 0.07 for 10 mol % filamin coalescence, inconsistent
  with omega = 1.4 cited for 10 mol % filamin in Main Text p. 4 and Fig. 3D.
  (6) Main Text p. 1 cites average filament length ~180 nm alongside Fig. 1A / Movie S1
  (1 mol % capping protein), whereas 2.7 nm / 0.01 = 270 nm (180 nm corresponds to 1.5 mol %
  capping protein used in Figs. 1C, 2A, 3A).
  (7) Fig. 4E y-axis misprints the 0.3 tick label as 0.6 (reading 0.2, 0.6, 0.4, 0.5, 0.6).
