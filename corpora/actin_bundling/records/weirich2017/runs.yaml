    gamma_I: gamma_I_pred_coal_5_printed_eta

- id: run_gamma_I_coal_5_chained_eta
  model: interfacial_tension_from_capillary_velocity
  inputs:
    eta: eta_frap_pred
    v_cap: tableS1_coal_5_gamma_eta
  outputs:
    gamma_I: gamma_I_pred_coal_5_chained_eta

