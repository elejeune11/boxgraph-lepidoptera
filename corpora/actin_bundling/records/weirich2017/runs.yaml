# ==========================================================================
# Group B: FRAP diffusion, Stokes-Einstein viscosity, interfacial tension
# ==========================================================================

- id: run_frap_diff_scaling
  model: frap_diffusion_scaling
  inputs:
    L_b: frap_bleached_size_added
    tau_R: tau_R_frap_text
  outputs:
    D: D_frap_scaling_pred

- id: run_filament_radius_frap
  model: filament_radius_from_diameter
  inputs:
    d: filament_diameter_frap_si
  outputs:
    r: r_filament_frap_derived

- id: run_filament_half_len_frap
  model: filament_half_length_from_length
  inputs:
    L_f: L_f_1p5_cp
  outputs:
    L: L_half_1p5_cp_derived

- id: run_se_viscosity_frap
  model: stokes_einstein_ellipsoid_viscosity
  inputs:
    T: ambient_temperature_si
    L: filament_half_length_frap_si
    r: r_filament_frap_derived
    D: D_frap_est
  outputs:
    eta: eta_frap_pred

- id: run_se_diffusion_check
  model: stokes_einstein_ellipsoid_diffusion
  inputs:
    T: ambient_temperature_si
    L: filament_half_length_frap_si
    r: r_filament_frap_derived
    eta: eta_frap_est
  outputs:
    D: D_se_from_printed_eta

- id: run_gamma_I_coal_5_printed_eta
  model: interfacial_tension_from_capillary_velocity
  inputs:
