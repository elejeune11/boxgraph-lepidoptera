  inputs:
    eta: eta_frap_est
    v_cap: tableS1_coal_10_gamma_eta
  outputs:
    gamma_I: gamma_I_pred_coal_10_printed_eta
  note: "Intentionally pairs the paper's sole FRAP viscosity estimate (5 mol % filamin, ~3 Pa*s) with Table S1's 10 mol % coalescence capillary velocity (0.11 +/- 0.03 um/s), reproducing 330 nN/m vs p. 4 '~300 nN/m' (see q_gamma_I_filamin_condition_choice)."

- id: run_gamma_I_coal_10_chained_eta
  model: interfacial_tension_from_capillary_velocity
  inputs:
    eta: eta_frap_pred
    v_cap: tableS1_coal_10_gamma_eta
  outputs:
    gamma_I: gamma_I_pred_coal_10_chained_eta
  note: "Intentionally pairs the chained Stokes-Einstein FRAP viscosity (5 mol % filamin, 3.13 Pa*s) with Table S1's 10 mol % coalescence capillary velocity (0.11 +/- 0.03 um/s), reproducing 345 nN/m vs p. 4 '~300 nN/m' (see q_gamma_I_filamin_condition_choice)."

