- id: rel_grason2007_eq6_reduces_to_weirich_cylinder_surface
  kind: reduces_to
  a: grason2007/columnar_free_energy_eq6
  b: weirich2017/capillary_free_energy_per_length
  mapping:
    R_0: "R / 1000"
    u: "0"
    lam: "4.0"
    gamma_I: "Sigma * 1e6"
    omega: "2.0"
  output_map:
    F_over_lam: dF_over_L
  regime:
    R: [20.0, 200.0]
    f_0: [0.01, 1.0]
    lambda_3perp: [20.0, 100.0]
    epsilon: [0.01, 1.0]
    Sigma: [2.0, 10.0]
  limit:
    f_0: "0"
    epsilon: "0"
  provenance: proposed
  reason: "In the achiral zero-twist limit (f_0 -> 0) and bulk phase coexistence limit (epsilon -> 0, equivalent to grand-canonical excess free energy Delta F(R) - mu_c*rho_0*pi*R^2 at mu = mu_c = -epsilon*L/rho_0), Grason & Bruinsma Eq. (6) reduces identically to the lateral surface free energy per unit length 2*pi*R*Sigma = 2*pi*R_0*gamma_I (with 1 pN/nm = 10^6 nN/m and R_0 = R/1000 um) of Weirich et al.'s unperturbed (u = 0) straight nematic cylinder (SI p. 9), where anisotropic anchoring A_omega vanishes identically because the axial director n_hat = z_hat is tangent to the lateral cylinder wall."
  assumptions:
    - "Achiral limit f_0 -> 0 (vanishing chiral torque gamma -> 0) removes Grason's finite-radius stabilization."
    - "Bulk coexistence offset epsilon -> 0 aligns Grason's Delta F(R)/L with Weirich's fixed-volume interfacial free energy per length F/lambda."
    - "Unperturbed uniform cylinder u = 0 in Weirich SI p. 9 gives F/lambda = 2*pi*R_0*gamma_I independent of axial period lam and anchoring strength omega."

- id: rel_grason2007_eq5_reduces_to_weirich_cylinder_surface
  kind: reduces_to
