    applies. dutta2016 cites Claessens et al. (2008) [ref-19] in two places: on p. 2 (28001-p1),
    citing the F-actin experiments [19] alongside Grason et al. [20, 21] as "a different approach"
    in which inherent chirality limits bundle size; and on p. 5 (28001-p4), claiming qualitatively
    that Fig. 3 gives "a bundle consisting of a few filaments in agreement with the findings of
    [19]" when evaluated on Borukhov et al.'s [ref-11] F-actin screening length (~1 nm) and
    filament thickness (~8 nm). Neither record takes any numerical datum from the other
    (screening_length_actin and filament_thickness_actin come from ref-11, not ref-19;
    claessens2008 predates dutta2016 by eight years and explicitly rejects electrostatic
    charge-accumulation models of finite bundle size on p. 1, citing Henle & Pincus
