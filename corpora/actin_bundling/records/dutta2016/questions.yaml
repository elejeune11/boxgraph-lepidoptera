  text: >
    Two mathematical conventions are implicit in the paper: (1) the transverse length scale sqrt(L/(beta*epsilon))
    is referred to as 'the in-plane radius of gyration', whereas for a 2D Gaussian directed polymer with
    Hamiltonian (beta*epsilon/2) int_0^L (dr_perp/dz)^2 dz the exact mean-square 2D radius of gyration is
    L/(3*beta*epsilon) (differing by a factor of sqrt(3)); (2) b(k*) = (-8 + 8 exp(-k*^2/2) + 4 k*^2)/k*^4
    has a removable 0/0 singularity at k* = 0 whose limit b(0) = 1 is used to evaluate F(k=0) = 1 in Fig. 4
    and requires a small-k Taylor series in floating-point arithmetic to avoid catastrophic cancellation.

