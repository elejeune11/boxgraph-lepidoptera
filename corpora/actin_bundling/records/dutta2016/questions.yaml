    where: text
  text: >
    On p. 5 (28001-p4), dutta2016 substitutes Borukhov et al.'s [ref-11] F-actin electrostatic
    screening length (~1 nm) and filament thickness (~8 nm) into its qualitative discussion of
    Fig. 3 and claims "For these values, fig. 3 would give a bundle consisting of a few filaments
    in agreement with the findings of [19]" (claessens2008). Cross-checking both papers exposes
    four independent contradictions of this claimed agreement:
    (1) Direct experimental refutation of salt/electrostatic control in claessens2008: in
    claessens2008's standard F-buffer (p. 4 Methods: 100 mM KCl, 2 mM MgCl2, 0.2 mM CaCl2, 2 mM
    Tris, 0.5 mM ATP at 20 degC; ionic strength I ~= 107 mM), the Debye screening length is
    lambda_D ~= 0.93 nm (lambda_R = lambda_D/8 nm ~= 0.117, matching dutta2016's cited ~1 nm /
    0.125). Claessens et al. (p. 1) explicitly lowered salt to the polymerization minimum
    (claessens2008/mgcl2_min_conc = 2 mM MgCl2, no KCl or CaCl2; I ~= 6.0-8.5 mM), increasing
    lambda_D by 3.5-4.2x (to 3.3-3.9 nm, lambda_R ~= 0.413-0.492), and observed "no influence on
    the maximum F-actin/fascin bundle thickness." In dutta2016 (screening_length_salt_scaling,
    bundle_size_eq8, Figs. 3(b) and 4), increasing lambda_R strictly increases repulsive
    2*pi*Gamma_R/(k^2 + 1/lambda_R^2) at every k >= 0 and monotonically shrinks D*(lambda_R) until
    bundles dissolve into the disordered nematic liquid (e.g., at Fig. 3(b) parameters, passing
    from infinite bundles at lambda_R = 0.117 through the narrow consistent finite-bundle window
    lambda_R in (0.3849, 0.4391) to unbundled liquid at lambda_R = 0.492).
    (2) Negligible electrostatic repulsion at fascin spacing: claessens2008 reports a fascin
    interfilament surface-to-surface separation of ~5 nm (interfilament_sep_fascin, p. 1) and
    SAXS center-to-center lattice constant a_H = 12.4 nm (aH_hex_saxs, p. 2). At F-buffer
    lambda_D ~= 0.93 nm, electrostatic interactions across neighboring filaments are exponentially
    suppressed (exp(-5/0.933) = 4.7e-3; K_0(12.4/0.933) = 5.8e-7), directly supporting
    claessens2008's conclusion (p. 1) that "electrostatic repulsion between actin filaments is too
    short-ranged to affect bundle assembly."
    (3) Failure of dutta2016's Eq. (8) / Fig. 3(b) at the F-actin ratio: both at dutta2016's cited
    lambda_R = 1/8 = 0.125 (extending q_actin_ratio_in_infinite_phase) and at claessens2008's
    F-buffer lambda_R = 0.117, Fig. 3(b) (Gamma_R = 5, Gamma_A = 20, lambda_A = 0.3, rho* = 1)
    lies deep inside the infinite-bundle macrophase-separation phase (lambda_R_inf = 0.3849,
    independent of 2*pi conventions) and inverts the SALR ordering (lambda_R < lambda_A = 0.3).
    Under consistent Eq. (8), any finite-bundle window at lambda_R = 0.117 (or 0.125) requires the
    exact Lifshitz bound rho* * Gamma_R > 1/(12*pi*lambda_R^4) ~= 143.2 (or 108.7), ruling out
    finite bundles at all Gamma_R values studied in dutta2016 (Gamma_R = 5, 10 at rho* = 1).
    (4) Concentration-dependence and observable mismatch: claessens2008 observes finite bundles up
    to n_f ~= 20 filaments (5-6 filaments across in Fig. 2D; hydrated 2-shell width 50-58 nm ~=
    6.3-7.3 filament diameters, TEM plateau ~28.2 nm) whose thickness is independent of actin
    concentration c_a (Fig. 1A-B), whereas dutta2016's spinodal criterion F = rho* |beta V| b > 1
    depends directly on areal polymer density rho* and identifies bundle size only with the crude
    periodic density-modulation wavelength 2*pi/k_min (dense bundle plus dilute gap, p. 6).

