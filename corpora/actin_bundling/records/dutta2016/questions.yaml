    dutta2016/ref-30]). Four structural incompatibilities make the two model sets mathematically
    disjoint:
    (1) Orthogonal bundling mechanisms and degrees of freedom: dutta2016 models an achiral,
    pre-aligned nematic melt of directed polymers with competing isotropic pairwise SALR
    interactions (Debye-Huckel repulsion Gamma_R*K_0(r/lambda_R) plus short-range Gaussian
    attraction -Gamma_A*exp(-r^2/lambda_A^2), dropping single-chain bending rigidity kappa in
    Eq. 3 in favor of aligning tension epsilon = 3*kappa_0); setting Gamma_R -> 0 eliminates finite
    bundles completely. Conversely, claessens2008 models discrete, rigid, stoichiometrically
    saturating fascin cross-linkers bridging helical F-actin filaments on a 2D hexagonal lattice
    (a_H = 12.4 nm, 1 fascin per ~4.5 actin monomers, u ~= 13-14 monomers per hexagonal unit,
    bundle_geometry_saturation R = (3 +/- 3.5*n_f^(-1/2))/u), where finite thickness (n_f ~= 20,
    two hexagonal shells) is governed by helical-to-hexagonal angular mismatch (-13/6 -> -28/13,
    Delta_theta ~= 1 deg/monomer) and internal single-filament torsional twist energy
    (E_twist = tau*(Delta_theta)^2/d) balanced against fascin binding free energy
    (Delta G = k_B T ln(K_D) ~= 15 k_B T). claessens2008 contains no pair potential, no
    electrostatic repulsion, no Debye-length model, and no spinodal field theory.
    (2) Disjoint control parameters and observables: dutta2016 depends on dimensionless
    (rho*, Gamma_R, lambda_R, Gamma_A, lambda_A) and single-chain transverse wandering
    R_g = sqrt(L*k_B T/epsilon), predicting the quadratic spinodal function F(k*) and a continuum
    periodic density-modulation wavelength D* = 2*pi/k_min (spanning both polymer-dense bundle and
    dilute gap, p. 6), with no filament count n_f, hexagonal lattice spacing a_H, dissociation
    constant K_d, bound cross-linker ratio R*, or helical twist angle Delta_theta. claessens2008
    depends on (c_a, c_f, K_d, R*, n_f, k, u, p, s, tau, d, D_d, q_10) and outputs TEM diameter
    fits D(R*), discrete hexagonal shell counts (n_f = 1 + 3*k*(k + 1), D_fil = 2*k + 1), Bragg
    spacing a_H = 4*pi/(sqrt(3)*q_10), droplet-confinement mass-conservation curves
    c_a ~ n_f/D_d^2, and single-filament twist/binding energies.
    (3) Incompatible cross-linker / attraction scaling and saturation: in
    claessens2008/diameter_scaling_Rstar, bundle diameter grows sublinearly with bound fascin ratio
    as D ~= (R*)^0.3 (Fig. 1C log-slope 0.327) and plateaus at finite size n_f ~= 20 for R* >= 0.25
    due to stoichiometric binding-site saturation. In dutta2016/bundle_size_eq8, increasing
    attraction strength Gamma_A drives superlinear growth (local log-slope d(ln D*)/d(ln Gamma_A)
    >= 3.07 across Fig. 3(a) under consistent Eq. 8, and >= 1.66 even under bundle_size_eq8_mixed2pi)
    that diverges continuously as (Gamma_A_inf - Gamma_A)^(-1/2) into macroscopic phase separation
    (D* -> oo) rather than saturating at a finite bundle thickness.
    (4) Rejected spurious algebraic coincidences (too_plain) and symbol collisions: pure ratio or
    monomial definitions share trivial algebraic forms across unrelated physics --
    dimensionless_screening_length_def (lambda_R_phys/R_g) vs. molar_ratio_fascin_actin (c_f/c_a),
    dimensionless_kd_scale (K_d/c_a), and helical_symmetry_ratio (p/s); effective_tension_def
    (3*kappa_0) vs. hexagonal_bragg_peaks and thermal_energy_scale; in_plane_rg_def
    (sqrt(L*k_B T/epsilon)) vs. diameter_filament_scaling (n_f^(1/2)); and
    screening_length_salt_scaling (lambda_R ~ n^(-1/2)) vs. the n_f^(-1/2) perimeter term of
    bundle_geometry_saturation. Likewise, dutta2016/bundle_size_eq8 (inter-bundle modulation
    wavelength 2*pi/k_0 from an implicit spinodal root) is mathematically and physically distinct
    from claessens2008/hexagonal_lattice_spacing (intra-bundle filament spacing
    a_H = 4*pi/(sqrt(3)*q_10)). Six symbols collide with incompatible meanings: n (bulk salt
    concentration in dutta2016 vs. filaments per bundle n or n_f in claessens2008 Fig. S1), k
    (transverse wave number in dutta2016 vs. concentric hexagonal shells in claessens2008), kappa
    (WLC bending rigidity in dutta2016 Eq. 1 vs. dimensionless dissociation ratio K_d/c_a in
    claessens2008), L (single-polymer contour length in dutta2016 vs. total actin contour length
    in an emulsion droplet in claessens2008), u (transverse tangent vector in dutta2016 vs.
    monomers per hexagonal unit u ~= 13-14 in claessens2008), and q (total polymer electric charge
