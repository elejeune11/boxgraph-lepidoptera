  citation:
    page: 2
    printed_page: "28001-p1"
    quote: "the experimental observations in F-actin [19], Grason and"
    where: text
  text: >
    No stated or proposed mathematical relation (same_as, reduces_to, derived_from, scales_as, or
    approximated_by) connects the models of dutta2016 and grason2007, and no cited.yaml link applies
    (dutta2016 borrows no numerical datum from ref-20; its F-actin screening length and filament
    thickness come from Borukhov et al. [ref-11] = grason2007/ref-8). Both papers explicitly contrast
    their bundle-size control mechanisms: dutta2016 (p. 2) cites Grason & Bruinsma (2007) [ref-20] as
    "a different approach" in which inherent chirality limits bundle size, while grason2007 (p. 1)
    argues that finite F-actin bundle diameters (40-100 nm) are "not determined by a mysterious
    long-range molecular interaction" (citing Henle & Pincus [9]). Four structural incompatibilities
    prevent any valid equivalence:
    (1) Orthogonal mechanisms and vanishing limits: dutta2016 models achiral, pre-aligned directed
    polymers in a dense melt interacting via competing short-range Gaussian attraction (Gamma_A,
    lambda_A) and long-range Debye-Huckel repulsion (Gamma_R, lambda_R), silently dropping the
    single-chain bending rigidity kappa of Eq. (1) in Eq. (3) in favor of aligning tension
    epsilon = 3*kappa_0; setting Gamma_R -> 0 forces F(k) to peak strictly at k = 0 and eliminates
    finite bundles completely. Conversely, grason2007 models an isolated chiral hexagonal bundle
    with no long-range electrostatic repulsion, balancing chiral torque -gamma*Omega (gamma = 2*K_2/P)
    against anharmonic rotational-invariance gauge elasticity (mu_perp_bar*(Omega*R)^4 in-plane
    shear, K3_bar*Omega^4*R^2 Frank bending with K_3 ~ k_B T*l_p/d^2, and harmonic
    mu_par_bar*(Omega*R)^2 out-of-plane shear in 3D solids) plus surface tension 2*pi*R*Sigma;
    setting chirality gamma -> 0 gives f_0 -> 0 and Sigma_c -> 0 and eliminates finite bundles
    completely. Even the shared WLC bending energy (dutta2016 Eq. 1 -> grason2007 Frank bend K_3)
    is dropped before Eq. (3) and absent from all runnable dutta2016 models.
    (2) Disjoint control parameters: dutta2016 depends on (rho*, Gamma_R, Gamma_A, lambda_R, lambda_A)
    and R_g = sqrt(L*k_B T/epsilon) with no chirality, bundle twist, shear/bend moduli, or surface
    tension; grason2007 depends on (gamma, mu_perp_bar, mu_par_bar, K3_bar, Sigma, mu_c - mu, rho_0, L)
    with no pair interaction potential, electrostatic screening length, or salt concentration.
    (3) Distinct thermodynamic criteria and observables: dutta2016 evaluates a quadratic spinodal
    instability F(k*) = rho* |beta V(k*)| b(k*) = 1 in transverse wavenumber k*, crudely identifying
    the periodic density-modulation wavelength D* = 2*pi/k_min (spanning both dense bundle and
    dilute gap, p. 6) as bundle size; grason2007 evaluates single-bundle thermodynamic coexistence
    Delta F(R_0) - mu*rho_0*pi*R_0^2 <= 0 in cylinder radius R against a dilute filament reservoir.
    (4) Distinct divergence and transition behavior: in dutta2016/bundle_size_eq8, D* = 2*pi/k_min
    diverges continuously with exponent -1/2 as (Gamma_A_inf - Gamma_A)^(-1/2) or
    (lambda_R - lambda_R_inf)^(-1/2) at the finite k = 0 macrophase spinodal F(0) = 1 (while
    2*pi/k_peak remains finite there). In grason2007, equilibrium radius R_0 starts at finite
    minimum lambda_{3 perp} at Sigma = Sigma_c(mu_c), diverges algebraically as Sigma^(-3)
    (columnar) or Sigma^(-1/5), Sigma^(-1/3) (solid) as Sigma -> 0+, and jumps first-order to an
    infinite bulk aggregate at mu = mu_c = -epsilon*L/rho_0 while R_0(mu_c) remains finite.

