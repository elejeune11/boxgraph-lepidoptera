- id: q_2pi_fourier_mismatch
  kind: possible_error
  about:
    - potential_fourier
    - stability_function_eq8
    - bundle_size_eq8
    - finite_bundle_boundary_eq8
    - potential_fourier_cyclic
    - stability_function_eq8_mixed2pi
    - bundle_size_eq8_mixed2pi
    - finite_bundle_boundary_eq8_mixed2pi
    - betaV_fig2a_GA4
    - F_fig2b_GA4
    - bundle_size_fig3a
    - bundle_size_fig3b
    - lambda_R_finite_fig4
  citation:
    page: 4
    printed_page: "28001-p3"
    quote: "F (k∗ ) = ρ∗ |βV (k∗ )|b(k ∗ ) > 1 and βV (k) < 0 (unstable),"
    where: "Eq. 8 & Figs. 2-4"
  text: >
    Major 2*pi Fourier-transform convention mismatch between the paper's equations and its plots.
    Eq. (6) uses angular wave vector k in exp(i k.r), yielding the Debye factor b(k*) = (-8 + 8 exp(-k*^2/2) + 4 k*^2)/k*^4
    and wavelength 2*pi/k_0 (p. 4), for which the consistent 2D Fourier transform is
    beta V(k) = 2*pi*Gamma_R/(k^2 + 1/lambda_R^2) - pi*Gamma_A*lambda_A^2 exp(-k^2 lambda_A^2/4).
    However, Figs. 2-4 all evaluate beta V(k) with the cyclic-wavenumber kernel exp(-i 2*pi k.r)
    (replacing k by 2*pi*k inside beta V) and plot Fig. 3 bundle sizes as 1/k_0, while inconsistently
    evaluating b(k) at k instead of b(2*pi*k). Because b(q) decays as 4/q^2, omitting 2*pi inside b
    overestimates F(k) at finite k by up to (2*pi)^2 ~ 39.5. Under the consistent angular-wavenumber
    equations, only the k=0 macrophase boundary in Fig. 4 reproduces; the entire finite-bundle phase
    of Fig. 4 disappears from the plotted range Gamma_A in [54, 105] (its Lifshitz point shifts from
    Gamma_A = 55.17 to 138.14 and vertical asymptote from 83.56 to 281.33), Fig. 2's Gamma_A = 13
    curve has max F = 0.234 << 1 (stable), Fig. 3(a) bundling does not begin until Gamma_A = 21.58
    (instead of 13.27), and Fig. 3(b) has no finite bundles for lambda_R > 0.439.

