  text: >
    Three cross-record bookkeeping findings accompany the absence of ModelAtlas relations between
    dutta2016 and grason2007:
    (1) Rejected spurious dimensional/algebraic shapes: dutta2016/in_plane_rg_def
    (R_g = sqrt(L*k_B T/epsilon)) has the same square-root-of-ratio algebraic shape as
    grason2007/lambda_3perp_microscopic (lambda_{3 perp} ~ sqrt(d*l_p*k_B T/Delta E)) and
    grason2007/characteristic_length_lambda3 (lambda_{3 perp} = sqrt(K3_bar/mu_perp_bar)), but the
    physical scales are unrelated: R_g is single-chain transverse thermal wandering under aligning
    tension (scaling as L^(1/2), independent of l_p), whereas lambda_{3 perp} is the multi-chain
    continuum bend-shear crossover radius (scaling as l_p^(1/2), independent of L). Likewise,
    screening_length_salt_scaling (lambda_R ~ n^(-1/2)) vs.
    grason2007/critical_surface_tension_far_corrected (Sigma_c ~ (mu_c - mu)^(-1/2)) and trivial
    ratio/linear definitions (effective_tension_def, dimensionless_screening_length_def vs.
    bundle_diameter_from_radius, chiral_torque_coupling) are physically unrelated coincidences
    (too_plain). Moreover, dutta2016 has no model mapping filament count or cylinder radius to
    physical diameter in nm (bundle_size_eq8 outputs only dimensionless modulation wavelength D*
    from an implicit transcendental root), so no genuine geometric diameter conversion connects it
    to grason2007/bundle_diameter_from_radius (D = 2*R).
    (2) Symbol and quantity collisions: both records reuse symbols with incompatible meanings and
    dimensions: epsilon is aligning tension [pN] in dutta2016 vs. achiral bulk cohesive energy
    density [pN/nm^2] in grason2007; Omega is the Hubbard-Stratonovich density-mode order-parameter
    field in dutta2016 vs. macroscopic whole-bundle torsional twist rate [1/nm] in grason2007;
    rho = N/A is the system-averaged nematic melt density in dutta2016 vs. the fixed in-bundle
    hexagonal chain packing density rho_0 in grason2007; lambda_R is the Debye electrostatic
    screening length vs. lambda_{3 perp} the elastic bend-shear length; and contour length L sets
    R_g ~ L^(1/2) and rho* ~ L in dutta2016 while cancelling out of equilibrium radius R_0(mu_c) in
    grason2007.
    (3) Quantitative F-actin scale tension: both papers share literature roots (Borukhov et al. 2005
    [dutta2016/ref-11 = grason2007/ref-8], Bloomfield 1997, Ha & Liu 1999, Henle & Pincus 2005).
    Grason & Bruinsma (p. 1) reject long-range electrostatic control because observed F-actin
    bundles (grason2007/factin_diameter_lai2007, 40-100 nm) are 40-100x larger than the ~1 nm
    Debye length, obtaining lambda_{3 perp} ~ 100 nm independent of electrostatic screening.
    Quantitatively, at dutta2016's own F-actin ratio lambda_R = 1 nm / 8 nm = 0.125, consistent
    Eq. (8) requires rho* * Gamma_R > 1 / (12*pi*lambda_R^4) ~= 108.65 as an exact necessary
