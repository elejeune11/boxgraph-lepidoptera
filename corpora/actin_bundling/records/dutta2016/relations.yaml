- id: rel_zwicker2015_rpa_modelB_derived_eqF1_corrected
  kind: derived_from
  a: dutta2016/rpa_spinodal_dispersion
  b: zwicker2015/homogeneous_dispersion_eqF1_corrected
  mapping:
    D_B: "1"
    w: "1"
    q: "(pi * Gamma_A * lambda_A**4 + 2 / (3 * rho_star))**(1/4) * k"
    k_f: "pi * Gamma_R * (1 + sqrt((1 - (pi * Gamma_A * lambda_A**2 - 1 / rho_star) / sqrt(pi * Gamma_A * lambda_A**4 / 4 + 1 / (6 * rho_star))) / 3))"
    k_b: "pi * Gamma_R * (1 - sqrt((1 - (pi * Gamma_A * lambda_A**2 - 1 / rho_star) / sqrt(pi * Gamma_A * lambda_A**4 / 4 + 1 / (6 * rho_star))) / 3))"
  output_map:
    lam_q_norm: lam_B
  regime:
    k: [0.22, 0.34]
    rho_star: [1.0, 1.0]
    Gamma_R: [2.0e-5, 1.0e-4]
    lambda_R: [200.0, 1000.0]
    Gamma_A: [5.28, 5.42]
    lambda_A: [0.25, 0.25]
  steps:
    - "limit: lambda_R -> oo"
    - "series: k -> 0, 6"
    - "simplify"
  provenance: proposed
  reason: >
    Formalizes the Ohta-Kawasaki / Christensen-Elder-Fogedby equivalence noted qualitatively in
    zwicker2015 (Sec. I, p. 1, ref-22): under conserved Model-B relaxational dynamics applied to
    dutta2016's quadratic Landau-Wilson / RPA free-energy curvature (Eqs. 5 and 8), taking the
    unscreened 2D Coulomb limit (lambda_R -> oo, zero salt) and long-wavelength gradient expansion
    (to O(k^4)) yields lambda_B(k) = -2*pi*Gamma_R + (pi*Gamma_A*lambda_A^2 - 1/rho*)*k^2 -
    (pi*Gamma_A*lambda_A^4/4 + 1/(6*rho*))*k^4. This matches zwicker2015's exact active Cahn-Hilliard
    dispersion Eq. (F1_corrected) identically under the physical dictionary: unscreened Coulomb
    repulsion 2*pi*Gamma_R <-> chemical turnover rate (k_f + k_b)/k_0 = (w/l)^2; net short-range
    attraction minus polymer entropy pi*Gamma_A*lambda_A^2 - 1/rho* <-> spinodal curvature
    c_spin*(q*w/k)^2; and Gaussian range plus Debye chain stiffness pi*Gamma_A*lambda_A^4/4 +
    1/(6*rho*) <-> interfacial gradient penalty (1/4)*(q*w/k)^4.
  assumptions:
    - "Conserved Model-B dynamics applied to dutta2016's equilibrium quadratic RPA free-energy curvature chi^-1(k) = 1/(rho* b(k)) + beta V(k) in unit-mobility dimensionless form."
    - "Unscreened 2D Coulomb limit (lambda_R -> oo), removing dutta2016's finite-lambda_R macrophase separation at k = 0."
    - "Long-wavelength weak-supercriticality regime (0 < c_spin < 1/2, k << min(1, 1/lambda_A))."

