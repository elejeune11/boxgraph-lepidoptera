- id: rel_lw_from_wlc
  kind: derived_from
  a: dutta2016/wlc_aligned_hamiltonian_eq1_eq3
  b: dutta2016/landau_wilson_free_energy_eq4_eq7
  provenance: stated
  citation:
    page: 3
    printed_page: "28001-p2"
    quote: "performing the Hubbard-Stratonovich transformation of the areal"
    where: "Eqs. 3-6"
  steps:
    - "Apply strong-stretching approximation with epsilon = 3 kappa_0 to obtain Eq. (3)"
    - "Perform Hubbard-Stratonovich transformation of the local areal density field rho(k,z) into auxiliary field Omega(k,z) to obtain Eqs. (4)-(6)"
  assumptions:
    - "Dense melt regime amenable to coarse-grained mean-field theory"
    - "Strongly stretched weakly bending chains with interactions local in z"

- id: rel_eq8_from_lw
  kind: derived_from
  a: dutta2016/landau_wilson_free_energy_eq4_eq7
  b: dutta2016/stability_function_eq8
  provenance: stated
  citation:
    page: 4
    printed_page: "28001-p3"
    quote: "second-order coeﬃcient of the expansion of the free energy"
    where: "Eq. 8"
  steps:
    - "Expand the Landau-Wilson free energy f[Omega] in Eq. (5) to second order in Omega(k,z) around the uniform nematic liquid state"
    - "Evaluate the Gaussian chain 2-point correlation integral to obtain Debye factor b(k*) = (-8 + 8 exp(-k*^2/2) + 4 k*^2)/k*^4"
    - "Identify spinodal instability where the quadratic coefficient becomes negative: F(k*) = rho* |beta V(k*)| b(k*) > 1 with beta V(k*) < 0"
  assumptions:
    - "Quadratic (spinodal) expansion around uniform translational-invariant nematic liquid"

- id: rel_fourier_from_real
  kind: derived_from
  a: dutta2016/real_space_potential
  b: dutta2016/potential_fourier
  provenance: stated
  citation:
    page: 4
    printed_page: "28001-p3"
    quote: "and (b) show the Fourier transform of the total poten-"
    where: text
  steps:
    - "Take the 2D transverse Fourier transform of beta V_R(r) = Gamma_R K_0(r/lambda_R) to obtain 2*pi*Gamma_R/(k^2 + 1/lambda_R^2)"
    - "Take the 2D transverse Fourier transform of beta V_A(r) = -Gamma_A exp(-r^2/lambda_A^2) to obtain -pi*Gamma_A*lambda_A^2 exp(-k^2 lambda_A^2/4)"

