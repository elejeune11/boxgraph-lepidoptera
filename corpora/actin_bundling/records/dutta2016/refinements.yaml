- id: ref_bundle_size_consistent_nk
  run: run_fig3a
  setting: n_k
  factors: [1, 2, 4]
  mode: multiply
  output: bundle_size
  tolerance: "0.01%"
  tolerance_basis: "added: well below the ~1% digitization precision of Fig. 3(a)"
  tolerance_added: true

- id: ref_bundle_size_consistent_xtol
  run: run_fig3a
  setting: xtol
  factors: [1, 10, 100]
  mode: divide
  output: bundle_size
  tolerance: "0.01%"
  tolerance_basis: "added: well below the ~1% digitization precision of Fig. 3(a)"
  tolerance_added: true

