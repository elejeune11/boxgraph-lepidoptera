- id: polymer_length
  name: polymer contour length
  dimension: "[length]"
  description: "Contour length L of each parallel aligned polymer along the z-axis"

- id: polymer_count
  name: number of polymers
  dimension: "dimensionless"
  description: "Total number N of parallel aligned polymers in the system"

- id: polymer_charge
  name: total polymer charge
  dimension: "[current] * [time]"
  description: "Total uniform electrostatic charge q carried by one polymer of length L"

- id: line_charge_density
  name: polymer line charge density
  dimension: "[current] * [time] / [length]"
  description: "Uniform linear charge density q/L along a polymer"

- id: transverse_area
  name: transverse cross-sectional area
  dimension: "[length] ** 2"
  description: "Area A of the transverse (x-y) plane containing the N aligned polymers"

- id: areal_density
  name: average areal polymer density
  dimension: "1 / [length] ** 2"
  description: "Average number of polymers per unit transverse area, rho = N/A"

- id: bending_rigidity
  name: worm-like chain bending rigidity
  dimension: "[energy] * [length]"
  description: "Bending rigidity kappa of a single worm-like chain polymer in Eq. (1)"

- id: alignment_strength
  name: parallel alignment potential strength
  dimension: "[force]"
  description: "Strength kappa_0 (energy per unit contour length) of the Maier-Saupe / aligning potential along z in Eq. (1)"

- id: effective_tension
  name: effective stretching tension
  dimension: "[force]"
  description: "Effective tension epsilon = 3 kappa_0 in the strong-stretching directed-polymer approximation, Eq. (3)"

- id: thermal_energy
  name: thermal energy
  dimension: "[energy]"
  description: "Thermal energy k_B T = 1/beta"

- id: inverse_thermal_energy
  name: inverse thermal energy
  dimension: "1 / [energy]"
  description: "Inverse thermal energy beta = 1/(k_B T)"

- id: in_plane_radius_of_gyration
  name: in-plane radius of gyration
  dimension: "[length]"
  description: "Characteristic transverse length scale sqrt(L/(beta*epsilon)) called the in-plane radius of gyration, playing the role of an effective polymer diameter"

- id: wavenumber_physical
  name: physical transverse wave number
  dimension: "1 / [length]"
  description: "Magnitude of the in-plane wave vector k before nondimensionalization"

- id: screening_length_physical
  name: physical electrostatic screening length
  dimension: "[length]"
  description: "Debye-Huckel electrostatic screening length lambda_R in physical length units"

- id: attraction_range_physical
  name: physical attraction range
  dimension: "[length]"
  description: "Range lambda_A of the short-range attractive interaction in physical length units"

- id: bundle_size_physical
  name: physical bundle size
  dimension: "[length]"
  description: "Lateral bundle thickness / characteristic modulation wavelength in physical length units"

- id: salt_concentration
  name: salt concentration
  dimension: "[substance] / [length] ** 3"
  description: "Bulk electrolyte salt concentration n governing electrostatic screening"

- id: dimensionless_distance
  name: dimensionless transverse distance
  dimension: "dimensionless"
  description: "In-plane inter-polymer distance r scaled by the in-plane radius of gyration sqrt(L/(beta*epsilon))"

- id: dimensionless_wavenumber
  name: dimensionless wave number
  dimension: "dimensionless"
  description: "In-plane wave number k* = k sqrt(L/(beta*epsilon)) scaled by the in-plane radius of gyration"

- id: dimensionless_areal_density
  name: dimensionless areal polymer density
  dimension: "dimensionless"
  description: "Areal polymer density rho* = rho (L/(beta*epsilon))"

- id: dimensionless_repulsion_strength
  name: dimensionless repulsive interaction strength
  dimension: "dimensionless"
  description: "Strength Gamma_R of the repulsive Bessel/Yukawa interaction scaled by k_B T"

- id: dimensionless_attraction_strength
  name: dimensionless attractive interaction strength
  dimension: "dimensionless"
  description: "Strength Gamma_A of the short-range Gaussian attraction scaled by k_B T"

- id: dimensionless_screening_length
  name: dimensionless repulsive screening length
  dimension: "dimensionless"
  description: "Electrostatic screening length lambda_R scaled by the in-plane radius of gyration sqrt(L/(beta*epsilon))"

- id: dimensionless_attraction_range
  name: dimensionless attractive interaction range
  dimension: "dimensionless"
  description: "Short-range Gaussian attraction range lambda_A scaled by the in-plane radius of gyration sqrt(L/(beta*epsilon))"

- id: dimensionless_potential_real
  name: dimensionless real-space interaction potential
  dimension: "dimensionless"
  description: "Local real-space pairwise interaction potential beta V(r) scaled by k_B T"

- id: dimensionless_potential_fourier
  name: dimensionless Fourier-space interaction potential
  dimension: "dimensionless"
  description: "2D Fourier transform beta V(k) of the dimensionless local interaction potential"

- id: debye_form_factor
  name: single-polymer Debye form factor
  dimension: "dimensionless"
  description: "Single-chain in-plane structure factor b(k*) = (-8 + 8 exp(-k*^2/2) + 4 k*^2)/k*^4 in Eq. (8)"

- id: stability_function
  name: spinodal stability function
  dimension: "dimensionless"
  description: "Spinodal instability function F(k*) = rho* |beta V(k*)| b(k*) in Eq. (8); unstable when F > 1 and beta V < 0"

- id: dimensionless_bundle_size
  name: dimensionless bundle size
  dimension: "dimensionless"
  description: "Lateral bundle size scaled by the in-plane radius of gyration sqrt(L/(beta*epsilon)) (effective polymer diameter)"

- id: bundle_size_over_screening_length
  name: bundle size over screening length
  dimension: "dimensionless"
  description: "Ratio of dimensionless bundle size to dimensionless electrostatic screening length lambda_R, plotted in Fig. 3(b) inset"

- id: dimensionless_hamiltonian
  name: dimensionless system Hamiltonian
  dimension: "dimensionless"
  description: "Total dimensionless N-polymer Hamiltonian H (scaled by beta = 1/(k_B T)) in Eq. (3)"

- id: dimensionless_free_energy
  name: dimensionless Landau-Wilson free energy per polymer
  dimension: "dimensionless"
  description: "Landau-Wilson free energy functional f[Omega] per polymer in Eq. (5)"

- id: static_spinodal_margin
  name: static RPA spinodal instability margin
  dimension: "dimensionless"
  description: "Smooth quadratic Landau-Wilson / RPA instability margin g_static(k*) = -rho* * beta V(k*) * b(k*) - 1 (equals F(k*) - 1 where beta V(k*) < 0; positive iff linearly unstable in Eq. 8)"

- id: conserved_rpa_growth_rate
  name: dimensionless conserved Model-B RPA linear growth rate
  dimension: "dimensionless"
  description: "Dimensionless conserved Model-B (Cahn-Hilliard) perturbation growth rate lambda_B(k*) = -k*^2 * [1/(rho* * b(k*)) + beta V(k*)] induced by the quadratic Landau-Wilson / RPA free-energy curvature of Eqs. (5)-(8) in unit-mobility form"

