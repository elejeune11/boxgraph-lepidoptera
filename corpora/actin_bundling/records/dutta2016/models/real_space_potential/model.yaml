id: real_space_potential
name: local real-space competing Bessel-repulsion and Gaussian-attraction potential
role: model
stated:
  page: 4
  printed_page: "28001-p3"
  quote: "βVR (ΓR , λR , r) = ΓR K0 (r/λR ) and βVA (ΓA , λA , r) ="
  where: text
equation: "beta V(r) = Gamma_R * K_0(r / lambda_R) - Gamma_A * exp(-r^2 / lambda_A^2)"
inputs:
  r: {quantity: dimensionless_distance, unit: dimensionless}
  Gamma_R: {quantity: dimensionless_repulsion_strength, unit: dimensionless}
  lambda_R: {quantity: dimensionless_screening_length, unit: dimensionless}
  Gamma_A: {quantity: dimensionless_attraction_strength, unit: dimensionless}
  lambda_A: {quantity: dimensionless_attraction_range, unit: dimensionless}
outputs:
  betaV: {quantity: dimensionless_potential_real, unit: dimensionless}
settings: {}
stochastic: false
