id: potential_fourier_cyclic
name: 2D Fourier transform of competing Bessel-Gaussian potential (cyclic wave number variant)
role: model
stated:
  page: 4
  printed_page: "28001-p3"
  quote: "and (b) show the Fourier transform of the total poten-"
  where: "text, Fig. 2(a)"
variant_of: potential_fourier
corrections:
  - equation: "2D Fourier transform beta V(k) (p. 4, Fig. 2(a))"
    change: "Use cyclic-wavenumber 2D Fourier convention exp(-i 2*pi k.r), replacing k by 2*pi*k in beta V(k)."
    evidence: "Fig. 2(a) for Gamma_A=4 matches 2*pi*Gamma_R / ((2*pi*k)^2 + 1/lambda_R^2) - pi*Gamma_A*lambda_A^2*exp(-(2*pi*k)^2*lambda_A^2/4) to 0.002 across k in [0.1, 1.4], whereas angular k gives 5.18 instead of 0.26 at k=1.0."
equation: "beta V_cyc(k) = 2*pi*Gamma_R / ((2*pi*k)^2 + 1/lambda_R^2) - pi*Gamma_A*lambda_A^2 * exp(-(2*pi*k)^2 * lambda_A^2 / 4)"
inputs:
  k: {quantity: dimensionless_wavenumber, unit: dimensionless}
  Gamma_R: {quantity: dimensionless_repulsion_strength, unit: dimensionless}
  lambda_R: {quantity: dimensionless_screening_length, unit: dimensionless}
  Gamma_A: {quantity: dimensionless_attraction_strength, unit: dimensionless}
  lambda_A: {quantity: dimensionless_attraction_range, unit: dimensionless}
outputs:
  betaV: {quantity: dimensionless_potential_fourier, unit: dimensionless}
built_from: [real_space_potential]
settings: {}
stochastic: false
