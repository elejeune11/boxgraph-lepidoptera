  kT: {quantity: thermal_energy, unit: pN*nm}
outputs:
  H: {quantity: dimensionless_hamiltonian, unit: dimensionless}
runnable: false
not_runnable_reason: "Functional integral over continuous N-polymer conformations r_i(z) and tangent vectors u_i(z); the paper evaluates no explicit conformation energies and proceeds directly to the Hubbard-Stratonovich field theory."
