id: wlc_aligned_hamiltonian_eq1_eq3
name: worm-like chain aligned-polymer Hamiltonian and strong-stretching approximation (Eqs. 1-3)
role: model
stated:
  page: 3
  printed_page: "28001-p2"
  quote: "of the system in the strong stretching approximation"
  where: "Eqs. 1-3"
equation: "H = (beta*epsilon/2) * sum_i int_0^L dz u_j^2(z) + (1/L) * int_0^L dz sum_{i!=j} beta*V(|r_i(z)-r_j(z)|)"
inputs:
