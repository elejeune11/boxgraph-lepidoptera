id: potential_fourier
name: 2D Fourier transform of competing Bessel-Gaussian potential (angular wave number)
role: model
stated:
  page: 4
  printed_page: "28001-p3"
  quote: "and (b) show the Fourier transform of the total poten-"
  where: text
from_words: true
equation: "beta V(k) = 2*pi*Gamma_R / (k^2 + 1/lambda_R^2) - pi*Gamma_A*lambda_A^2 * exp(-k^2 * lambda_A^2 / 4)"
inputs:
  k: {quantity: dimensionless_wavenumber, unit: dimensionless}
  Gamma_R: {quantity: dimensionless_repulsion_strength, unit: dimensionless}
  lambda_R: {quantity: dimensionless_screening_length, unit: dimensionless}
  Gamma_A: {quantity: dimensionless_attraction_strength, unit: dimensionless}
  lambda_A: {quantity: dimensionless_attraction_range, unit: dimensionless}
outputs:
  betaV: {quantity: dimensionless_potential_fourier, unit: dimensionless}
built_from: [real_space_potential]
settings: {}
stochastic: false
