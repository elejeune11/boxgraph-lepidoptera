id: rpa_spinodal_dispersion
name: quadratic Landau-Wilson / RPA spinodal margin and conserved Model-B dispersion (Eqs. 5 and 8)
role: model
stated:
  page: 4
  printed_page: "28001-p3"
  quote: "second-order coeﬃcient of the expansion of the free energy"
  where: "Eqs. 5 and 8"
reconstructed: >
  ModelAtlas helper expressing Eq. (8)'s quadratic Landau-Wilson / RPA free-energy curvature
  chi^-1(k*) = 1/(rho* b(k*)) + beta V(k*) (whose sign change chi^-1(k*) < 0 is algebraically
  identical to F(k*) = rho* |beta V(k*)| b(k*) > 1 with beta V(k*) < 0) both as the smooth static
  instability margin g_static(k*) = -rho* beta V(k*) b(k*) - 1 and as the unit-mobility conserved
  Model-B (Cahn-Hilliard) linear dispersion lambda_B(k*) = -k*^2 [1/(rho* b(k*)) + beta V(k*)].
  Dutta et al. evaluate only the static criterion F(k*) > 1 without specifying dynamics; this helper
  enables exact symbolic and numerical comparison with active Cahn-Hilliard dispersion relations
  such as zwicker2015 Appendix F Eq. (F1).
equation: "g_static(k*) = -rho* * beta V(k*) * b(k*) - 1; lambda_B(k*) = -k*^2 * [1/(rho* * b(k*)) + beta V(k*)]"
inputs:
  k: {quantity: dimensionless_wavenumber, unit: dimensionless}
  rho_star: {quantity: dimensionless_areal_density, unit: dimensionless}
  Gamma_R: {quantity: dimensionless_repulsion_strength, unit: dimensionless}
  lambda_R: {quantity: dimensionless_screening_length, unit: dimensionless}
  Gamma_A: {quantity: dimensionless_attraction_strength, unit: dimensionless}
  lambda_A: {quantity: dimensionless_attraction_range, unit: dimensionless}
outputs:
  g_static: {quantity: static_spinodal_margin, unit: dimensionless}
  lam_B: {quantity: conserved_rpa_growth_rate, unit: dimensionless}
built_from: [potential_fourier, debye_factor_b, stability_function_eq8]
settings: {}
stochastic: false
