id: in_plane_rg_def
name: in-plane radius of gyration (transverse length scale)
role: processing
stated:
  page: 5
  printed_page: "28001-p4"
  quote: "by the in-plane radius of gyration of the polymers"
  where: "Fig. 2 caption, p. 4-5"
equation: "R_g = sqrt(L / (beta * epsilon)) = sqrt(L * k_B T / epsilon)"
inputs:
  L: {quantity: polymer_length, unit: nm}
  kT: {quantity: thermal_energy, unit: pN*nm}
  epsilon: {quantity: effective_tension, unit: pN}
outputs:
  R_g: {quantity: in_plane_radius_of_gyration, unit: nm}
settings: {}
stochastic: false
