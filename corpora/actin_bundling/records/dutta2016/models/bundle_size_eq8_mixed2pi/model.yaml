id: bundle_size_eq8_mixed2pi
name: finite bundle characteristic size 1/k_min from Eq. (8) (mixed-2*pi figure convention variant)
role: model
stated:
  page: 4
  printed_page: "28001-p3"
  quote: "characteristic wavelength 2π/k0 which correspondsto the"
  where: "text, Eq. 8, Fig. 3"
variant_of: bundle_size_eq8
corrections:
  - equation: "Eq. 8 & bundle size 2*pi/k_0 (p. 4, Fig. 3)"
    change: "Use mixed-2*pi stability function F_mixed(k) = rho* |beta V_cyc(k)| b(k) and cyclic-wavenumber wavelength D* = 1 / k_min (with k_min the smallest k > 0 where F_mixed(k) = 1 and beta V_cyc(k) < 0)."
    evidence: "Fig. 3(a) (Gamma_A in [14, 31]) and Fig. 3(b) + inset (lambda_R in [0.40, 0.95]) match 1/k_min under F_mixed(k) to 3-4 significant figures across the entire plotted range, whereas the consistent angular model predicts no finite bundles for Gamma_A < 21.58 in Fig. 3(a) or lambda_R > 0.439 in Fig. 3(b)."
equation: "D* = 1 / k_min, where k_min = min{k > 0 : rho* |beta V_cyc(k)| b(k) = 1 and beta V_cyc(k) < 0}; ratio = D* / lambda_R"
inputs:
  rho_star: {quantity: dimensionless_areal_density, unit: dimensionless}
  Gamma_R: {quantity: dimensionless_repulsion_strength, unit: dimensionless}
  lambda_R: {quantity: dimensionless_screening_length, unit: dimensionless}
  Gamma_A: {quantity: dimensionless_attraction_strength, unit: dimensionless}
  lambda_A: {quantity: dimensionless_attraction_range, unit: dimensionless}
outputs:
  bundle_size: {quantity: dimensionless_bundle_size, unit: dimensionless}
  bundle_size_over_lambda_R: {quantity: bundle_size_over_screening_length, unit: dimensionless}
built_from: [stability_function_eq8_mixed2pi]
settings:
  n_k: 2000
  k_max: 5.0
  xtol: 1.0e-10
stochastic: false
