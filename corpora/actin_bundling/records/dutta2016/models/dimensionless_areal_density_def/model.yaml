id: dimensionless_areal_density_def
name: dimensionless areal polymer density definition
role: processing
stated:
  page: 4
  printed_page: "28001-p3"
  quote: "and the dimensionless areal density ρ∗ = ρ (L/β )."
  where: "below Eq. 8"
equation: "rho* = rho * (L / (beta * epsilon)) = rho * (L * k_B T / epsilon)"
inputs:
  rho: {quantity: areal_density, unit: 1/nm^2}
  L: {quantity: polymer_length, unit: nm}
  kT: {quantity: thermal_energy, unit: pN*nm}
  epsilon: {quantity: effective_tension, unit: pN}
outputs:
  rho_star: {quantity: dimensionless_areal_density, unit: dimensionless}
built_from: [in_plane_rg_def]
settings: {}
stochastic: false
