- id: kappa_0_added
  quantity: alignment_strength
  unit: pN
  printed: "1.0"
  basis: "Paper does not assign a numerical value to the parallel alignment strength kappa_0; chosen as a representative pN-scale force per filament to exercise the dimensional scale definitions epsilon = 3 kappa_0 and R_g = sqrt(L/(beta*epsilon))."
  alternatives: ["0.1", "10.0"]
  stands_for: "kappa_0 in Eq. (1) and epsilon = 3 kappa_0"

- id: L_polymer_added
  quantity: polymer_length
  unit: nm
  printed: "1000"
  basis: "Paper does not state a numerical polymer contour length L; 1000 nm (1 um) is a representative F-actin filament length used to evaluate dimensional scale definitions."
  alternatives: ["500", "5000"]
  stands_for: "L in sqrt(L/(beta*epsilon))"

- id: kT_room_added
  quantity: thermal_energy
  unit: pN*nm
  printed: "4.11"
  basis: "Standard room-temperature thermal energy k_B T at 298 K (4.11 pN*nm); the paper works in dimensionless units beta = 1/(k_B T) and does not state T numerically."
  alternatives: ["4.28"]
  stands_for: "k_B T = 1/beta"

- id: k_phys_added
  quantity: wavenumber_physical
  unit: 1/nm
  printed: "0.1"
  basis: "Illustrative transverse wave number (wavelength ~63 nm, comparable to small F-actin bundles) to exercise the dimensionless wave number definition k* = k sqrt(L/(beta*epsilon))."
  alternatives: ["0.05", "0.2"]
  stands_for: "k in k* = k sqrt(L/(beta*epsilon))"

- id: rho_phys_added
  quantity: areal_density
  unit: 1/nm^2
  printed: "0.01"
  basis: "Illustrative melt-regime areal filament density (inter-filament spacing ~10 nm) to exercise the dimensionless areal density definition rho* = rho (L/(beta*epsilon))."
  alternatives: ["0.002", "0.05"]
  stands_for: "rho in rho* = rho (L/(beta*epsilon))"

- id: salt_conc_added
  quantity: salt_concentration
  unit: M
  printed: "0.1"
  basis: "Typical physiological monovalent salt concentration (100 mM) used to evaluate the salt-screening scaling law lambda_R ~ 1/sqrt(n); paper does not state a numerical salt concentration."
  alternatives: ["0.01", "0.5"]
  stands_for: "n in lambda_R ~ 1/sqrt(n)"

- id: r_eval_added
  quantity: dimensionless_distance
  unit: dimensionless
  printed: "0.5"
  basis: "Representative dimensionless separation r = lambda_R = 0.5 used to evaluate the real-space competing interaction potential beta V(r); paper plots only the Fourier transform beta V(k)."
  alternatives: ["0.2", "1.0"]
  stands_for: "r in beta V_R(r) + beta V_A(r)"

- id: k_eval_added
  quantity: dimensionless_wavenumber
  unit: dimensionless
  printed: "0.5"
  basis: "Representative interior dimensionless wave number k* = 0.5 used to evaluate the standalone Debye form factor b(k*)."
  alternatives: ["0.2", "1.0"]
  stands_for: "k* in b(k*)"

- id: Gamma_A_consistent_ref_added
  quantity: dimensionless_attraction_strength
  unit: dimensionless
  printed: "200"
  basis: "Under the consistent angular-wavenumber convention at Fig. 4 parameters (Gamma_R=10, lambda_A=0.1, rho*=1), the finite-bundle spinodal exists only above the Lifshitz point Gamma_A = 138.14 (outside Fig. 4's plotted range [54, 105]); Gamma_A = 200 is chosen inside the consistent finite-bundle window to verify numerical solver convergence in refinements.yaml."
  alternatives: ["160", "250"]
  stands_for: "Gamma_A for refinement of finite_bundle_boundary_eq8"
