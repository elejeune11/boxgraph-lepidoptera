notes: >
  Full quantitative core of Dutta, Benetatos & Jho (EPL 114, 28001, 2016), PDF pages 2-7
  (page 1 is the IOP publisher cover sheet). Includes dimensional scale definitions
  (effective tension epsilon = 3 kappa_0, in-plane radius of gyration sqrt(L/(beta*epsilon)),
  dimensionless wave number k*, dimensionless areal density rho*, dimensionless screening length,
  and Debye screening scaling lambda_R ~ 1/sqrt(n)), non-runnable field-theory functionals
  (Eqs. 1-7), the real-space competing Yukawa-Bessel + Gaussian potential, its 2D Fourier
  transform beta V(k), the Debye form factor b(k*), the Eq. (8) spinodal stability function F(k*),
  the analytical k=0 macrophase-separation boundary, and numerical solvers for finite-bundle
  wavelength and finite-bundle spinodal boundary. Because all quantitative model predictions are
  presented solely in Figs. 2-4, all 11 curves across Figs. 2(a), 2(b), 3(a), 3(b), 3(b) inset,
  and 4 are digitized at 1200-1800 dpi via mode: code scripts in figures/ and verified against
  both the paper's stated angular-wavenumber equations and variant_of models capturing the
  mixed-2*pi Fourier convention revealed by the plots. Fig. 1 (PDF p. 4, 28001-p3) is a schematic
  drawing of aligned polymers with no quantitative axes and is left un-digitized. Key findings:
  (1) Figs. 2-4 evaluate beta V(k) with cyclic-wavenumber argument 2*pi*k and plot bundle size as
  1/k_min while inconsistently keeping b(k) without 2*pi; under consistent angular-wavenumber
  conventions (Eqs. 6 & 8), only the k=0 macrophase boundary in Fig. 4 reproduces, while the
  entire finite-bundle region of Fig. 4 (Lifshitz point shifts from Gamma_A=55.17 to 138.14) and
  most of Fig. 3 vanish. (2) In Fig. 2, even under the mixed-2*pi convention, the Gamma_A=13 and
  Gamma_A=31 curves do not reach F=1 at the captioned lambda_A=0.3 and match slightly increased
  lambda_A values (0.3055 and 0.3015) tuned to F=1, whereas Fig. 3 uses exact lambda_A=0.3.
  (3) Fig. 3 plots D* = 1/k_min (smallest unstable wavenumber, where F=1) rather than the fastest-
  growing spinodal mode argmax F(k), an unstated choice. (4) The cited actin ratio
  lambda_R/diameter ~ 1 nm / 8 nm = 0.125 lies inside the infinite-bundle phase of Fig. 3(b)
  (macrophase threshold lambda_R_inf = 0.385), not its finite-bundle window.
