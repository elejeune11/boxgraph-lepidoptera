# Cross-record citation provenance links from dutta2016 values to paired records
# in corpora/actin_bundling/records/.
#
# Both `from_source` datums in dutta2016/data.yaml cite ref-11 (Borukhov et al.
# 2005, PNAS 102:3673 -> borukhov2005) on p. 5 (28001-p4):
# - screening_length_actin ("~1" nm) -> borukhov2005/kappa_inv_printed ("1" nm, p. 4 col. 2)
# - filament_thickness_actin ("~8" nm) -> borukhov2005/D_printed ("8" nm, p. 4 col. 2)

- datum: screening_length_actin
  from_datum: kappa_inv_printed
  evidence: "p. 5 (28001-p4, citing ref-11 Borukhov et al. 2005) states 'the electrostatic screening length is about 1 nm', matching borukhov2005/kappa_inv_printed ('1' nm, p. 4 col. 2, 'and the screening length is kappa^-1 = 1 nm'; also kappa_inv_physiol '≈ 1' nm on p. 3)."

- datum: filament_thickness_actin
  from_datum: D_printed
  evidence: "p. 5 (28001-p4, citing ref-11 Borukhov et al. 2005) states 'whereas the filament thickness is about 8 nm', matching borukhov2005/D_printed ('8' nm, p. 4 col. 2, 'The rod diameter is D = 8 nm')."
