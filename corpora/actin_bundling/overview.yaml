# The overview's text: what the page says that the build cannot. Every number on the page
# comes from the build; this file holds the words around them. Used by
#   make build site CORPUS=actin_bundling
title: "Actin bundling, phase separation, cortical patterning, and scale mechanics: an executable literature review"
notice:
  title: "Work in progress:"
  text: results are produced by multi-agent BoxGraph audits and verified by the validator, but not yet reviewed by people;
  link: check a record before citing it
  href: https://github.com/elejeune11/boxgraph-lepidoptera
intro:
  - All models are wrong, but some are useful (George E. P. Box). This page is an executable literature review of physical and mechanochemical models of F-actin bundling, electrostatic and helical-twist bundle mechanics, liquid-liquid phase separation and nonreciprocal active matter, active cortical patterning, curved-membrane rings, microscopic actomyosin network simulations, and butterfly wing-scale morphogenesis — spanning 52 papers (1996–2025), 100% of their Supplemental Information, and 17 released code and Source Data attachments (69 sources total, 685/685 pipeline jobs gated).
  - Every value is traced to the page, code line, or spreadsheet cell it came from. Every runnable model is rebuilt as stated, evaluated on its own inputs, refined numerically where applicable, and compared with printed text and calibrated figure readings at the precision printed. Relations between papers are tested symbolically or numerically rather than assumed, released code and Source Data are checked against their parent paper, and models of one paper are tested out-of-sample against another paper's measurements.
  - Nothing is silently corrected or overwritten. Where an equation is evidently misprinted, the printed model is kept and counted in the paper's tally while a corrected variant is added beside it with the evidence. Every disagreement is preserved as a structured finding and open question.
links:
  - {text: "All reviews", href: "../"}
  - {text: "BoxGraph Lepidoptera repository (GitHub)", href: "https://github.com/elejeune11/boxgraph-lepidoptera"}
case_studies:
  - id: lepidoptera_spacing_mechanisms
    teaches: Evaluating four physical mechanisms against Lepidoptera data
    title: What sets actin bundle spacing in Lepidoptera wing scales? Testing four candidate mechanisms
    summary: >-
      Three direct butterfly wing-scale papers (McDougal et al. 2021; Lloyd et al. 2024; Totz et al.
      2024) establish when periodic actin bundle spacing locks in (~35–40% pupal development,
      unaffected by 50%-stage Cytochalasin D) and how spacing L templates adult ridges 1:1 via
      membrane buckling, yet none of them models what sets L itself. Here we run 20 executable
      cross-record validations across eight theory and simulation papers to test all four candidate
      mechanisms — (1) active-gel / active-nematic self-organization, (2) arrested phase separation,
      (3) bundle-size limitation + mass conservation, and (4) membrane-curvature / membrane-mediated
      bundling — directly against measured Heliconius sara (1.07 vs 1.22 um, width 0.438 vs 0.456 um,
      40 vs 32 bundles) and Vanessa cardui (1.6–1.85 um, 0.34–1.60 um across 5 species) data.
    sources: [lloyd2024, mcdougal2021, totz2024, hannezo2015, mirza2025, sekine2024, zwicker2015, grason2007, haviv2008, gov2018, liu2008]
    steps:
      - text: >-
          Empirical baseline: Totz et al. (2024) treat bundle spacing L (1.6 um in V. cardui;
          0.34–1.60 um across 5 butterfly species, ~20–200 filaments/bundle) as a prescribed clamped
          boundary driving membrane buckling (Y_min = 3.5 MPa once Eq. 3's ha misprint is fixed),
          while McDougal et al. (2021) and Lloyd et al. (2024) establish lock-in by ~39% pupal
          development and a within-wing contrast in H. sara (iridescent blue: 1.07 ± 0.02 um spacing,
          0.438 ± 0.004 um width, 40 ± 1.8 bundles; black: 1.22 ± 0.03 um, 0.456 ± 0.003 um, 32 ± 1.1).
        show: "comparison: totz2024/cmp_Ymin_corrected_eq3"
      - text: >-
          Mechanism 1a (Active-gel self-organization — V. cardui): evaluated with zero parameter
          tuning on Drosophila epithelial cortical FRAP inputs (D = 0.04 um^2/s, tau = 15 s,
          eta_2D = 1e-5 Pa*s*m, xi = 1e9 Pa*s/m), Hannezo et al. (2015) Eq. [3] predicts
          lambda_c = 1.749 um — close (+9.3%) to V. cardui's 1.6 um reference spacing (and -2.8%
          from McDougal's ~1.8 um plateau).
        show: "validation: hannezo2015/val_lambda_c_eq3_main_vs_totz2024_vcardui"
      - text: >-
          Mechanism 1b (Active-gel transfer to H. sara): against tighter Heliconius sara scales,
          uncalibrated Hannezo Eq. [3] (1.749 um) overshoots black (1.22 ± 0.03 um, +43%) and blue
          (1.07 ± 0.02 um, +63%) scales. Because lambda_c ~ (D*tau*eta/xi)^(1/4), however, the
          within-wing black-to-blue spacing shift (-12.3%) requires only a 1.69x change in cortical
          turnover, viscosity, or friction — which remain unmeasured in scale cells.
        show: "validation: hannezo2015/val_lambda_c_eq3_main_vs_lloyd2024_blue"
      - text: >-
          Mechanism 1c (Active-nematic & CGMD envelopes): Mirza et al. (2025)'s 2D active-nematic
          bundle theory predicts 3.160 um at its Appendix D cortical baseline (2.59x above H. sara
          black), whereas Sekine et al. (2024)'s microscopic CGMD anisotropic nanocluster fusion
          predicts 0.529 um (2.0x below H. sara blue, right near Totz Fig. 4C's narrowest 0.34–0.36 um
          butterfly species) — bracketing the entire 0.34–1.85 um Lepidoptera spectrum.
        show: "validation: mirza2025/val_iso_appD_vs_lloyd2024_black"
      - text: >-
          Mechanism 2a (Arrested phase separation — ModelAtlas unification): Zwicker et al. (2015)
          corrected Eq. F1 sits in the exact same symbolic onset family as Hannezo Eq. [3] and
          Frohoff-Hülsmann Eq. 17 (lambda_c = pi*sqrt(2)*sqrt(w*l_t)). At insect cortical D_B and
          turnover with a 0.10 um screening interface width, Zwicker reproduces H. sara black scale
          spacing (1.237 vs 1.22 ± 0.03 um, +1.4%), while half-bundle width w = 0.219 um hits 1.830 um.
        show: "validation: zwicker2015/val_onset_eqF1_lh_vs_lloyd2024_black"
      - text: >-
          Mechanism 2b (Dynamic discrimination vs. free Ostwald arrest): Zwicker's onset wavelength
          depends strongly on unmeasured w, D_B, and turnover (w = 0.219 um overshoots H. sara blue
          by +71%), and crucially free arrested Ostwald ripening predicts constant spacing during
          domain growth — whereas McDougal Fig. 5D/5G shows actin bundle spacing stretching +35–43%
          (0.98–1.06 -> 1.32–1.41 um) during +85% lateral scale expansion, implying mechanical pinning
          once bundles lock in.
        show: "validation: zwicker2015/val_onset_eqF1_halfwidth_vs_lloyd2024_blue"
      - text: >-
          Mechanism 3a (Bundle-size control — chiral-twist equilibrium fails by 2.2x–4.0x): tested with
          zero added parameters against Lloyd et al. (2024)'s measured H. sara blue bundle width
          (438 ± 4 nm), Grason & Bruinsma (2007)'s F-actin chiral-twist onset diameter predicts only
          200 nm (printed lambda_{3,perp}, 2.19x too narrow; microscopic scaling 110 nm, 3.98x too
          narrow) — still 1.8x–3.3x narrower than even a 250 nm confocal PSF-deconvolved 360 nm bound.
        show: "validation: grason2007/val_chiral_onset_printed_diameter_vs_lloyd2024_blue"
      - text: >-
          Mechanism 3b (Cylindrical packing & mass-conservation test): Haviv et al. (2008)'s dense
          cylindrical packing (D_f = 9 nm) applied to Lloyd's 438 / 456 nm widths implies 2,368 /
          2,567 filaments (1,600 even after subtracting a 250 nm confocal PSF) — 8x–13x above Totz's
          cited ~20–200 filaments/bundle. Furthermore, blue scales shrink only -3.9% in width yet
          -12.3% in spacing with +25% more bundles (+20% higher total actin footprint), ruling out
          pure fixed-actin width-to-spacing conservation.
        show: "validation: haviv2008/val_filaments_lloyd_blue_psf_corr_vs_totz2024"
      - text: >-
          Mechanism 4a (Flat-membrane curvature instability — tension, not stiffness, is the cutoff):
          unlike cylindrical trachea (where Gov 2018 failed 9.9x), Gov's flat-sheet mode gives
          1.346 um on a bare bilayer (+10.3% vs H. sara black) and reproduces 1.235 vs 1.22 ± 0.03 um
          (+1.2%) when bending rigidity is stiffened 38x to Totz's early cuticle (kappa = 3.11 pN*um).
          Executable surprise: raising kappa does not kill the flat mode, whereas raising membrane
          tension above sigma_c = 11.7 pN/um shuts off all unstable modes (omega_max = 0).
        show: "validation: gov2018/val_flat_totz_cuticle_vs_lloyd2024_black"
      - text: >-
          Mechanism 4b (Bare membrane-mediated bundling fails at micron scales): without curved-protein
          recruitment, Liu et al. (2008)'s geometric capture distance for 200 nm protruding filaments
          caps at D_max = 0.255 um — 4.2x smaller than H. sara blue spacing (1.07 ± 0.02 um), confining
          bare membrane attraction to sub-micron bundle nucleation. Decisive next experiments: early
          (<35% dev) myosin vs. turnover perturbations plus direct scale-cell FRAP (D, tau) and tension
          measurements to separate active-gel/arrested-coarsening (1–2) from flat-membrane curvature (4a).
        show: "validation: liu2008/val_geometric_merge_200nm_vs_lloyd2024_blue"

  - id: misprints
    teaches: A paper against itself
    title: Misprinted equations settled by calibrated figures
    summary: >-
      A reader who rebuilds a model from the printed text needs the printed equations to be the
      ones that produced the paper's figures. Across three papers here — Grason & Bruinsma (2007),
      Dutta et al. (2016), and Totz et al. (2024) — printed equations disagree with the paper's own
      numbers or curves; keeping the printed model beside a corrected variant and checking against
      1200 dpi figure readings settles what the authors actually computed.
    sources: [totz2024, grason2007, dutta2016]
    steps:
      - text: >-
          Totz et al. (2024) print Eq. 3 and SI Eq. E49 with an inverted nondimensionalization
          (ha instead of a/h). Run as printed on the paper's own parameters, the minimum cuticle
          Young's modulus fails by sixteen orders of magnitude.
        show: "comparison: totz2024/cmp_Ymin_printed_eq3"
      - text: >-
          Replacing ha with the dimensionally consistent a/h reproduces the printed Y_min = 3.5 MPa
          exactly, while keeping the misprinted equation separate in the paper's tally.
        show: "comparison: totz2024/cmp_Ymin_corrected_eq3"
      - text: >-
          The same corrected variant reproduces all eight digitized isocontours across Fig. 3H and
          Fig. 4C, whereas the printed equation fails all eight.
        show: "comparison: totz2024/cmp_fig3H_iso_39_6pct_corrected"
      - text: >-
          Calibrated 1200 dpi digitization of all twelve curves in Fig. 2E further settles three
          caption and Table S1 discrepancies: the curves plot peak-to-peak ridge height 2a rather
          than half-amplitude a, using g = 0.5% and L_0 = 1.0 um.
        show: "comparison: totz2024/cmp_fig2E_g_0_5pct_2a"
      - text: >-
          Grason & Bruinsma (2007) print a far-from-critical surface-tension threshold scaling as
          (mu_c - mu)^(-3/2). ModelAtlas refutes the reduction from their exact Eq. (6) to that
          printed asymptote.
        show: "relation: grason2007/rel_exact_sigma_c_to_far_printed"
      - text: >-
          Correcting the algebra gives (mu_c - mu)^(-1/2), which ModelAtlas verifies against the
          exact Eq. (6) solution — and 1200 dpi measurement of the Fig. 2 inset slope (-0.516 vs
          -0.50) corroborates the corrected exponent.
        show: "relation: grason2007/rel_exact_sigma_c_to_far_corrected"
      - text: >-
          Dutta, Benetatos & Jho (2016) mix 2*pi Fourier conventions between their interaction
          potential and polymer structure factor. Evaluated with a consistent angular wavenumber k,
          the entire finite-bundle phase of Fig. 4 disappears from the plotted window.
        show: "comparison: dutta2016/cmp_fig4_finite"
      - text: >-
          A variant preserving the mixed 2*pi convention reproduces all ten nonzero-k curves across
          Figs. 2–4, pinpointing the exact algebraic origin of the discrepancy.
        show: "comparison: dutta2016/cmp_fig4_finite_var"

  - id: active_gel
    teaches: Papers against each other
    title: From active fluids to epithelial rings
    summary: >-
      Bois, Jülicher & Grill (2011) formulate a 1D active-fluid patterning theory; Hannezo et al.
      (2015) adapt it to circumferential actin rings in Drosophila tracheal tubes. ModelAtlas
      verifies ten cross-paper relations forming two symbolic families, while auditing each paper's
      figures and 19-page SI Appendix catches subtle plotting and projection slips.
    sources: [bois2011, hannezo2015]
    steps:
      - text: >-
          Both papers define the same hydrodynamic screening length l = sqrt(eta / gamma) (or
          sqrt(eta / xi)), forming a verified three-model family across the two sources.
        show: "family: bois2011/hydrodynamic_length"
      - text: >-
          Their turnover-modified linear dispersion relations — Bois Eq. (15) and Hannezo SI Eq.
          (7) — are symbolically identical under a mapping of parameters, forming a second
          cross-paper family.
        show: "family: bois2011/single_species_rda_dispersion_eq15"
      - text: >-
          In the zero-turnover limit (tau -> infinity), Hannezo's dispersion relation reduces
          exactly to Bois's conserved-species Eq. (12), as stated in prose and verified
          numerically here.
        show: "relation: hannezo2015/rel_bois2011_dispersion_eq12_limit"
      - text: >-
          Even across different stress constitutive laws (Bois's Hill saturation vs. Hannezo's
          linear contractility), ModelAtlas verifies that their finite-domain instability
          thresholds share identical scaling exponents.
        show: "relation: hannezo2015/rel_bois2011_hill_boundary_scales_linear"
      - text: >-
          Rebuilding Bois et al. (2011) reproduces 34 of 35 checks, isolating a single discrepancy
          in Fig. 5(d): the plotted substrate profile matches rho_s = 1.0 rather than the marked
          rho_s = 1.5.
        show: "comparison: bois2011/cmp_fig5d_s"
      - text: >-
          Auditing Hannezo et al.'s SI Appendix catches a dual error in Fig. S9: the bifurcation
          onsets do not reproduce at the captioned alpha^2*phi = 10 (they correspond to 100).
        show: "comparison: hannezo2015/cmp_figs9_onsets_captioned_10"
      - text: >-
          Even at alpha^2*phi = 100, the plotted y-axis does not match the labeled L2 norm
          ||rho||_2 — instead, it reproduces the peak density max(rho) across both branches.
        show: "comparison: hannezo2015/cmp_figs9_branch1_maxrho"
      - text: >-
          In SI Section 2.6.2, projecting the weakly nonlinear amplitude equation onto the right
          instead of the left adjoint eigenvector introduces a 6–12x curvature error relative to
          direct PDE continuation.
        show: "question: hannezo2015/q_si_section262_wrong_fredholm_eigenvector"

  - id: continuum_vs_cgmd
    teaches: Papers against each other, and against measurement
    title: Continuum active gel vs. microscopic CGMD in the same tube
    summary: >-
      Hannezo et al. (2015) and Sekine et al. (2024) come from the same lab and study the exact
      same biological structure: circumferential actin rings in embryonic Drosophila trachea.
      Bridging continuum theory to coarse-grained molecular dynamics reveals where scale separation
      breaks down, how measurement precision flips validation verdicts, and why an internal
      viscosity choice is numerically unstable.
    sources: [hannezo2015, sekine2024]
    steps:
      - text: >-
          ModelAtlas links Sekine's single-filament anisotropic Langevin dynamics directly to
          Hannezo's continuum turnover-diffusion length l_t = sqrt(D * tau) via the two-bead
          Einstein-Stokes diffusivity.
        show: "relation: sekine2024/rel_hannezo2015_langevin_dx_approx_turnover_length"
      - text: >-
          Both models share the exact inverse-square-root scaling with directional friction
          anisotropy, (gamma_y / gamma_x)^(-1/2), verified to machine precision across the regime.
        show: "relation: sekine2024/rel_hannezo2015_aniso_diff_scales_turnover_length"
      - text: >-
          Tested out-of-sample against Sekine's Airyscan super-resolution cable interval
          (450 ± 13.2 nm), Hannezo's uncalibrated Main Eq. [3] overshoots nearly fourfold
          (1749 nm).
        show: "validation: hannezo2015/val_lambda_c_eq3_main_vs_sekine_cable_interval"
      - text: >-
          Even using Hannezo's SI-calibrated hydrodynamic length (l_h = 8.18 nm — 12 to 30x smaller
          than Sekine's filaments and myosin motors), the continuum wavelength still sits 11.1%
          (3.8 embryo-mean SDs) above Sekine's Airyscan measurement.
        show: "validation: hannezo2015/val_lambda_c_si_exact_lh_vs_sekine_cable_interval"
      - text: >-
          In the reverse direction, Sekine's 4-M CGMD structure-factor peak interval (528.7 nm)
          fails against Sekine's own 450 ± 13.2 nm measurement — yet is reproduced against
          Hannezo's wider confocal measurement (0.5 ± 0.1 um).
        show: "validation: sekine2024/val_sf_interval_4m_vs_hannezo_wt_spacing"
      - text: >-
          Numerical time-step refinement settles a 10x viscosity contradiction in Sekine's SI Notes:
          at dt = 5e-5 s and eta_cyto = 0.1 Pa*s, RK4 is numerically unstable (result belongs to the
          numerics), whereas at eta_cyto = 1 Pa*s it converges cleanly.
        show: "refinement: sekine2024/ref_dimer_rk4_corrected_eta01_dt"
      - text: >-
          Sekine's Methods print the Gaussian structure-factor fit in angular wavenumber q while
          Supplementary Table 4 reports spatial frequency q/(2*pi), causing all four literal
          curve reproductions to fail until converted by 2*pi.
        show: "comparison: sekine2024/cmp_sf_literal_c1_fit"
      - text: >-
          Beyond parameter tuning, the two studies diverge sharply on mechanism: Hannezo's rings
          vanish under ROCK inhibition, whereas Sekine's Myosin II[DN] still exhibits anisotropic
          circumferential nanocluster motion and fusion bias.
        show: "question: sekine2024/q_hannezo2015_same_system_biological_and_mechanistic_contrast"

  - id: code_and_data
    teaches: A paper against its own code and data
    title: Auditing released MATLAB code, genetic screens, and 27 Source Data files
    summary: >-
      Sekine et al. (2024) released a MATLAB nanocluster tracker, two supplementary Excel screens
      (RNAi pupa counts and MIST protein complexes), and 27 Source Data spreadsheets. Reading all
      four attachments as BoxGraph sources confirms 82 cited values and 26 of 30 cross-validations
      while exposing silent statistical, plotting, and code-vs-Methods discrepancies.
    sources: [sekine2024, sekine_code, sekine_rnai_screen, sekine_mist_complexes, sekine_source_data]
    steps:
      - text: >-
          Running live Python readers over all 27 Source Data spreadsheets reproduces 82 cited
          numbers — including the in vivo cable interval mean and SD (450 ± 13.2 nm).
        show: "validation: sekine_source_data/val_cable_interval_in_vivo"
      - text: >-
          Four cross-validations fail and pinpoint real reporting slips. First, the 4-M simulation
          timecourse in Fig. 4f peaks at coherency 0.223 and never reaches the 0.30 reported in
          Fig. 4c and Supplementary Table 3.
        show: "validation: sekine_source_data/val_fig4f_max_vs_sim_4m_coherency"
      - text: >-
          Second, Fig. 2b reports a pairwise P-value as Bonferroni-corrected, but recomputation
          from the raw sheet fails with Bonferroni and reproduces the printed value only without
          multiple-testing adjustment.
        show: "validation: sekine_source_data/val_fig2b_0min_pair_bonf_pval"
      - text: >-
          Third, Supplementary Fig. 5d prints p = 0.0641 for Stage 16 RhoGEF2 colocalization,
          which fails against the actual Stage 16 Control vs. RhoGEF2 columns (p = 0.0160).
        show: "validation: sekine_source_data/val_figs5d_rhogef2_true_st16_pval"
      - text: >-
          Remarkably, testing Stage 15 Control against Stage 16 RhoGEF2 reproduces p = 0.0641 to
          four significant digits, diagnosing an exact cross-stage column mix-up.
        show: "validation: sekine_source_data/val_figs5d_rhogef2_cross_stage_pval"
      - text: >-
          Auditing the archive also uncovers that Source-data_Fig1k.xlsx ("Tube length") is a
          cell-for-cell duplicate of Source-data_Fig1j.xlsx ("Tube diameter"), while 900 dpi
          digitization independently catches a +2.5 deg misplot of St. 15 orientation in Fig. 4c.
        show: "question: sekine_source_data/q_fig1k_duplicated_from_fig1j"
      - text: >-
          Reading the released MATLAB tracker (Nanocluster_motion.m) confirms its hardcoded [6, 53]
          pixel area filter against the Methods' 0.01–0.1 um^2 range — but shows that both the
          circularity (> 0.5) and area-ratio (0.5–2x) filters stated in Methods are absent from the
          code.
        show: "question: sekine_code/q_missing_circularity_filter"
      - text: >-
          Auditing the two supplementary genetic-screen workbooks flags a day-8 pupae selection
          threshold mismatch in the RNAi screen and an undocumented functional grouping in the
          MIST complex table.
        show: "question: sekine_rnai_screen/q_selection_threshold_mismatch"

  - id: bundle_diameter
    teaches: Competing physical mechanisms
    title: Why do F-actin bundles stop growing?
    summary: >-
      Grason & Bruinsma (2007), Claessens et al. (2008), and Dutta et al. (2016) propose three
      different equilibrium theories for finite F-actin bundle diameter: chiral supertwist,
      cross-linker-driven helical overtwist, and competing electrostatic interactions. Testing
      them side by side separates shared geometry from contradictory physical predictions.
    sources: [grason2007, claessens2008, dutta2016]
    steps:
      - text: >-
          ModelAtlas verifies four scaling relations between Claessens et al. (2008) and Grason &
          Bruinsma (2007): both share the geometric D ~ N^(1/2) cross-section scaling and quadratic
          elastic-twist energy scaling.
        show: "relation: claessens2008/rel_grason_eq5_scales_claessens_twist"
      - text: >-
          Despite that shared geometry, their bundling mechanisms predict opposite responses to
          increasing cross-linker ratio R*: Claessens measures D ~ (R*)^(+0.3), whereas chiral
          supertwist predicts a decreasing or flat equilibrium radius.
        show: "question: claessens2008/q_grason2007_diameter_Rstar_scaling_and_onset_size"
      - text: >-
          Digitizing Claessens et al.'s Fig. 2E droplet-confinement phase diagram shows that the
          printed single-ring stability boundary misses the drawn line by a factor of 2.23x, while
          the paper also prints a sign slip in Delta G = k_B T ln(K_D) and a Bragg degeneracy slip
          in Fig. 3A.
        show: "comparison: claessens2008/cmp_droplet_crit_ca_fig2e_line"
      - text: >-
          Dutta et al. (2016) claim their competing-interaction model agrees quantitatively with
          Claessens et al.'s fascin-bundle widths, but cross-record auditing refutes the claim on
          four fronts — including the 2*pi Fourier error and Claessens's own low-salt control.
        show: "question: dutta2016/q_claessens2008_electrostatic_agreement_contradicted"

  - id: wing_scales
    teaches: Bridging across biological scales
    title: From cortical actin patterning to butterfly wing-scale buckling
    summary: >-
      Totz et al. (2024) model early ridge formation in butterfly wing scales as membrane buckling
      clamped between pre-patterned cortical F-actin bundles of spacing L, whereas Bois et al.
      (2011) and Hannezo et al. (2015) derive periodic cortical bundle spacing from active-gel
      mechanics. Putting both halves together defines an exact sequential interface — and exposes
      the measurements still missing to close it.
    sources: [bois2011, hannezo2015, totz2024]
    steps:
      - text: >-
          Hannezo's critical active-gel wavelength lambda_c = 2*pi*sqrt(l_h * l_t) and Totz's
          critical buckling growth strain g_c = (h^2 / (12*(1 - nu^2))) * (2*pi / L)^2 meet
          sequentially at L = lambda_c, yielding g_c = (h^2 / (12*(1 - nu^2))) * sqrt(xi / (D * tau * eta)).
        show: "question: totz2024/q_hannezo2015_upstream_spacing_interface"
      - text: >-
          Across five butterfly species, Totz's measured bundle spacings (0.34–1.60 um) fall inside
          the exact physiological range spanned by Drosophila tracheal spacings in Hannezo (0.50–1.80 um),
          placing cortical active-gel wavelengths squarely at the membrane buckling scale.
        show: "question: totz2024/q_bois2011_upstream_spacing_interface"
      - text: >-
          Direct cross-validation between the active-gel and buckling models remains an open
          experimental target: butterfly scale-cell cortical viscosity, friction, turnover, and
          diffusivity have not yet been measured, and bimodal alternating ridges in A. vanillae
          go beyond single-mode linear instability.
        show: "question: totz2024/q_hannezo2015_no_cross_validation"

  - id: active_turnover_square
    teaches: Unifying continuum theories across fields
    title: The four-paper active-turnover commutative square & Ohta–Kawasaki bridge
    summary: >-
      Bois et al. (2011), Hannezo et al. (2015), Zwicker et al. (2015), Frohoff-Hülsmann et al.
      (2021), and Dutta et al. (2016) address seemingly distinct phenomena — active gels, tracheal
      rings, chemically driven emulsions, nonreciprocal Cahn–Hilliard fields, and electrostatic
      bundles. ModelAtlas testing connects all five through exact symbolic reductions and exposes
      an algebraic factor-of-2 error in Zwicker's Appendix F.
    sources: [bois2011, hannezo2015, zwicker2015, frohoff2021, dutta2016]
    steps:
      - text: >-
          Zwicker et al. (2015) print Appendix F Eqs. (F1)–(F2) with a factor-of-2 error in the
          diffusion term, inflating the homogeneous spinodal arrest cutoff fourfold to 1.0 instead
          of 1/4.
        show: "comparison: zwicker2015/cmp_appF_cutoff_printed"
      - text: >-
          Correcting the factor of 2 restores the exact cutoff (k_f + k_b) / k_0 = 1/4, matching
          our independent 1D active-emulsion PDE simulations.
        show: "comparison: zwicker2015/cmp_appF_cutoff_corrected"
      - text: >-
          Adiabatically eliminating Frohoff-Hülsmann et al.'s fast second conserved field
          (Q -> infinity, f_2'' -> 0) symbolically derives Zwicker's corrected Eq. (F1), mapping
          Frohoff's conserved Turing arrest threshold (Delta/kappa)_max = 1/4 identically to
          Zwicker's corrected 1/4 while independently refuting printed Eq. (F1).
        show: "relation: frohoff2021/rel_zwicker2015_eq12_adiabatic_derived_eqF1_corrected"
      - text: >-
          Hannezo's tracheal-ring dispersion SI Eq. (7) factors identically as
          lambda_H(q) = lambda_Z_corr(q) / (1 + l_h^2 q^2), uniting Hannezo Eq. (3), Zwicker's
          corrected onset wavelength, and Frohoff Eq. (17) into one verified three-paper
          ModelAtlas family.
        show: "relation: zwicker2015/rel_hannezo2015_lambda_c_eq3_same_as_eqF1_onset"
      - text: >-
          Closing the fourth edge of the square, Bois et al.'s two-species ASDM at Pe = 0 is
          algebraically isomorphic to Frohoff Eq. (12) to machine precision (1.5e-15).
        show: "relation: frohoff2021/rel_bois2011_asdm_pe0_same_as_eq12_tilde"
      - text: >-
          Taking the long-range Ohta–Kawasaki limit (lambda_R -> infinity, k -> 0) of Dutta et al.'s
          competing-interaction RPA dispersion symbolically derives Zwicker's corrected Eq. (F1),
          while cleanly separating the three finite-size arrest exponents (-1/2, -1/4, -1/3).
        show: "relation: dutta2016/rel_zwicker2015_rpa_modelB_derived_eqF1_corrected"

  - id: membrane_curvature_tubes
    teaches: Testing competing mechanisms out-of-sample
    title: Curved-membrane rings vs. chitin-stiffened tracheal tubes
    summary: >-
      Gov (2018) reviews continuum theories coupling curved membrane proteins to active actin
      forces on flat membranes and cylindrical tubes. ModelAtlas links Gov's flat-membrane
      equations directly to Bois (2011) and Hannezo (2015), while out-of-sample cross-validations
      against Drosophila tracheal tubes reveal exactly when cylindrical curvature sets ring
      spacing — and when chitin ECM overrides it.
    sources: [gov2018, bois2011, hannezo2015, sekine2024, totz2024]
    steps:
      - text: >-
          In the fast-membrane limit (xi -> 0, J -> 0), Gov's flat-membrane dispersion reduces
          algebraically to Bois Eq. (12), mapping the membrane length l_mem = sqrt(kappa / sigma)
          directly to the hydrodynamic screening length l = sqrt(eta / gamma).
        show: "relation: gov2018/rel_bois2011_flat_qs_reduces_eq12"
      - text: >-
          Gov's quasi-steady propagating myosin-wave dispersion is algebraically identical to
          Hannezo SI Eq. (7), expanding the Bois Eq. (15) / Hannezo Eq. (7) ModelAtlas family
          across three papers.
        show: "relation: gov2018/rel_hannezo2015_myosin_qs_same_eq7"
      - text: >-
          Tested out-of-sample on Sekine et al.'s wild-type embryonic tracheal tubes (R_0 = 1.97 um),
          Gov's cylindrical curvature-ring fastest mode predicts 4454 nm — 9.90x wider than the
          measured 450 ± 13.2 nm cable interval, failing across all 4,374 parameter combinations.
        show: "validation: gov2018/val_cyl_ring_lambda_max_vs_sekine_cable_interval"
      - text: >-
          The exact same parameter-invariant falsification holds against Hannezo et al.'s wild-type
          chitin-filled dorsal trunk (4.94 um predicted vs. 0.5 ± 0.1 um measured, 9.88x larger),
          confirming Hannezo's rejection of tube-radius selection in intact trachea.
        show: "validation: gov2018/val_cyl_ring_lambda_max_vs_hannezo_wt"
      - text: >-
          Remarkably, once chitin ECM is removed in kkv1 mutant tubes (R_0 = 1.54 um), Gov's
          cylindrical curvature-ring mode predicts 3.91 um — reproducing Hannezo's measured
          4.5 ± 2 um pearling constriction spacing across all six measured radius definitions.
        show: "validation: gov2018/val_cyl_ring_lambda_max_vs_hannezo_kkv1"
      - text: >-
          Auditing the cylindrical geometry further proves that Gov's passive (A = 0) instability
          is an artifact of dropping 1 / sqrt(1 + h'^2) from the azimuthal curvature c_theta;
          with exact surface-of-revolution geometry, passive cylinders remain linearly stable.
        show: "question: gov2018/q_audit_cylinder_ctheta_geometry"

  - id: nematic_tactoids
    teaches: Fluid condensates vs. crystalline bundles
    title: Liquid-crystalline F-actin tactoids vs. solid bundles
    summary: >-
      Weirich et al. (2017) show that flexible filamin crosslinkers condense short capped F-actin
      rods into fluid nematic tactoids rather than solid finite-diameter bundles. Calibrated
      digitization settles three SI algebra discrepancies, while ModelAtlas bridges tactoids to
      Grason (2007), Claessens (2008), Dutta (2016), and Graham (2023).
    sources: [weirich2017, grason2007, claessens2008, dutta2016, graham2023]
    steps:
      - text: >-
          Weirich et al.'s Rayleigh–Plateau pearling equation omits a factor of 2 on the anchoring
          ratio omega, shifting the predicted fastest wavelength from 3.08 to 3.97 um and breaking
          the exact limit from their capillary energy integral.
        show: "comparison: weirich2017/cmp_cap_lambda_max_printed"
      - text: >-
          Calibrated digitization of Fig. 3D settles two unstated SI assumptions at once: the
          coalescence ODE omits a factor of 2 in the Rayleigh dissipation function, and the two
          plotted curves use unequal tactoid volumes.
        show: "comparison: weirich2017/cmp_fig3d_w2p0_rayleigh2"
      - text: >-
          Digitizing Fig. S2C catches a missing (2*pi)^(1/3) normalization prefactor in the
          rescaled tactoid free energy across all three anchoring curves.
        show: "comparison: weirich2017/cmp_figS2c_Fhat_norm_w2"
      - text: >-
          In the achiral zero-twist limit (f_0 -> 0, epsilon -> 0), Grason & Bruinsma's Eq. (6)
          columnar bundle free energy reduces identically to Weirich's cylindrical capillary surface
          energy per unit length.
        show: "relation: weirich2017/rel_grason2007_eq6_reduces_to_weirich_cylinder_surface"
      - text: >-
          Claessens's confined droplet critical concentration maps directly to Weirich's semi-dilute
          actin mesh-size law via the parameter-free geometric identity xi = D_d / sqrt(2*n_f).
        show: "relation: weirich2017/rel_claessens2008_droplet_conc_approx_mesh_size"
      - text: >-
          Comparing Weirich's 3D volume-conserving tactoids to Graham's 2D area-conserving rings
          quantifies their exact high-aspect-ratio divergence: 2D ellipse surface energy scales as
          AR^(1/2), whereas 3D isotropic tactoid energy scales as AR^(1/3).
        show: "relation: graham2023/rel_weirich2017_2d_ellipse_vs_3d_rescaled_ar_scaling"
      - text: >-
          In Weirich's polymerization buffer (Debye length 1.3 nm, filamin range 150 nm), the range
          ratio lambda_A / lambda_R ~ 115 sits nearly 60x above Dutta Eq. (8)'s global
          no-finite-bundle bound (lambda_A >= 2*lambda_R), explaining macroscopic tactoid LLPS.
        show: "question: dutta2016/q_weirich2017_no_cross_validation"

  - id: vasp_droplets_code_data
    teaches: Paper vs. notebook code, 11 Excel files, and 2D SLB bundles
    title: Inside a Nature Physics notebook & 11 Source Data workbooks
    summary: >-
      Graham et al. (2023) combine VASP protein droplets with a 2D continuum ring-buckling model,
      releasing VASPDroplet_simulate.ipynb and 11 Source Data workbooks (MOESM12–22). Running live
      code adapters and Excel readers alongside Nast-Kolb et al. (2022)'s 2D SLB VASP bundles
      exposes silent floating-point artifacts, indexing offsets, and plotting slips.
    sources: [graham2023, graham_code, graham_source_data, nastkolb2022, claessens2008]
    steps:
      - text: >-
          Running the released VASPDroplet_simulate.ipynb wetting profile directly against Graham's
          printed SI Eqs. (S4)–(S5) refutes the printed equation (median error 100%), diagnosing an
          inverted sign between inside and outside wetting tensions.
        show: "relation: graham2023/rel_printed_wetting_eqS5_vs_notebook_code"
      - text: >-
          Inspecting generatering() resolves two blind-digitization mysteries: a double off-by-one
          bug builds a 2.9*D ring (29 segments) instead of the printed 3.1*D, and IEEE-754 float
          truncation int(D*1e3/(D*0.1*1e3)) = 9 at D = 3.0 and 3.5 um literally creates the
          published Fig. 4h sawtooth dips (absent from raw Excel droplets, p = 0.70).
        show: "question: graham_code/q_generatering_double_off_by_one_and_ieee754_sawtooth"
      - text: >-
          A universal +2 filament (+30 nm) indexing offset in the notebook sweeps reproduces 61/61
          points across all nine Fig. 4g and Extended Data Fig. 7 heatmaps (MAE 0.0012–0.0043) and
          20/22 points of Fig. 4f.
        show: "comparison: graham_code/cmp_plus2_fig4f"
      - text: >-
          Running 47 live cross-validations over all 11 Excel workbooks (MOESM12–22) confirms 34/35
          digitized curves while exposing swapped D1/D2 labels in Fig. 6f, a -1.0 offset in Fig. 6g,
          mean plotted as "median" in Fig. 5a, and a +47% bar overshoot at 3% PEG in ED Fig. 9e.
        show: "validation: graham_source_data/val_fig6f_d1_actin_literal"
      - text: >-
          Tested out-of-sample against Nast-Kolb et al. (2022)'s 2D SLB VASP bundles, Graham's
          assumed 15 nm spacing predicts 66.7 filaments/um — 1.48x denser than Nast-Kolb's
          measured 45 ± 12 filaments/um (close, softening ring bending rigidity by 1.48–1.87x).
        show: "validation: graham2023/val_ring_filament_count_vs_nastkolb_1um"
      - text: >-
          In the reverse direction, Nast-Kolb's single-exponential FRAP model fails on Graham's
          Fig. 1f 3D VASP droplet recovery (RMSE 6.50%), revealing the exact same diffusive S-curve
          failure seen on 2D bilayers (where 2D Soumpasis hits 11/12 points).
        show: "validation: nastkolb2022/val_frap_by_thalf_vs_graham_fig1f"

  - id: cytosim_forensics
    teaches: Auditing C++ simulation source & 37-sheet Source Data
    title: Forensic audit of CytoSim C++ source & 37-sheet Source Data
    summary: >-
      Chandrasekaran et al. (2024) model actin-VASP droplets in CytoSim, releasing the CytoSim C++
      source and a 37-sheet Source Data workbook (MOESM9_ESM.xlsx). Porting the exact C++
      subroutines and running 103 live spreadsheet validations exposes a 673x hidden diffusion
      contradiction, a factor-N_fil depletion error, a buffer mismatch on Fig. 6D, and bit-for-bit
      provenance linking MOESM9 back to Graham's 2023 notebook.
    sources: [chandrasekaran2024, chandrasekaran_cytosim, chandrasekaran_source_data, graham_code, graham_source_data]
    steps:
      - text: >-
          Auditing CytoSim's C++ source reveals a smoking gun: 4-hand Sphere/Solid+Wrist VASP
          instantiation (proven by Figure 3D valencies up to 70.3%) hardcodes Stokes drag
          D = 0.01485 um^2/s — 673x slower than the printed 10 um^2/s — while Wrist::stepF()
          silently ignores diffusion = 10.
        show: "comparison: chandrasekaran_cytosim/cmp_vasp_stokes_D_vs_paper"
      - text: >-
          Comparing CytoSim's C++ Nucleator/Fiber implementation against Supplementary Table 4
          refutes the printed monomer-depletion rate by a factor of N_fil (97.2% error across the
          regime).
        show: "relation: chandrasekaran2024/rel_cyto_monomer_depletion_per_filament_discrepancy"
      - text: >-
          Our faithful Python port of CytoSim's Nucleator reproduces all 20 digitized points of
          Supplementary Figs. 6B–C (and 45/48 across all 8 curves) while exposing a +32% excess
          polymer mass at nucleator concentrations >= 75 nM.
        show: "comparison: chandrasekaran_cytosim/cmp_figs6c_max_length_depletion"
      - text: >-
          Running 103 live validations over all 37 sheets of MOESM9_ESM.xlsx confirms 94/99 blindly
          digitized curves while catching an off-by-one header shift and missing 2*pi series in
          Figure 4B.
        show: "validation: chandrasekaran_source_data/val_fig4bii_pi_literal_block4"
      - text: >-
          MOESM9's Figure 6D leaves wild-type rows 1–19 blank and stores SEM = SD/3; cross-checking
          MOESM14 'Fig 3d' reproduces Chandrasekaran's printed 70 ± 13% WT disk fraction (69.69%)
          and proves Fig. 6D juxtaposes EDTA/EGTA WT against EDTA-free GABmut — erasing the 1:20
          shift vs. buffer-matched Fig S4c (p >= 0.51) while strengthening 1:7.5 to p = 6.4e-5.
        show: "validation: graham_source_data/val_chandrasekaran2024_exp_wt_disk_1to7p5_fig3d"
      - text: >-
          Finally, MOESM9 sheet Figure 7F Column C reproduces VASPDroplet_simulate.ipynb::getsurfaceF()
          bit-for-bit (0 ULPs across all 19 aspect ratios), supplying Graham's missing Fig. 5c
          Source Data and executably confirming both the 10^6 unit-scale error and AR = 10 > pi^2.
        show: "relation: chandrasekaran_source_data/rel_notebook_surface_approx_fig7f_fine_grid"

  - id: gubbala_nematic_inclusions
    teaches: Live PDE code forensics & five-paper phase-field synthesis
    title: Viscous inclusions in nematic actin networks & ModelC_Cubic.py forensics
    summary: >-
      Gubbala et al. (2025) couple Cahn–Hilliard lipid phase separation to a 2D nematic Q-tensor
      with cubic bend–splay elasticity, releasing their Python solver ModelC_Cubic.py. Running the
      unmodified code live on CPU exposes a line-91 Fourier-space bug that collapses elastic
      anisotropy by >99% (accidentally preventing blowup of the ill-posed printed PDE) while
      linking Gubbala's model across Frohoff-Hülsmann (2021), Zwicker (2015), Weirich (2017), and
      Graham (2023).
    sources: [gubbala2025, gubbala_code, frohoff2021, zwicker2015, weirich2017, graham2023]
    steps:
      - text: >-
          Line 91 of ModelC_Cubic.py multiplies Fourier wavevectors -K[k]*K[l] pointwise into
          real-space Q[i][j] instead of Fourier-space Q_fft[i][j], producing 116.3% L2 error
          against Eq. (10) and a spurious cross-shaped artifact (max 4.013) on a uniform field.
        show: "question: gubbala_code/q_cubic_line91_realspace_fft_bug"
      - text: >-
          In live linearized dispersion of unmodified ModelC_2D.euler_step(), line 91 collapses
          bend–splay anisotropy E3_eff from +2.0 to -0.0106 (>99% loss) — explaining why the code
          stays finite at E1 = E3 = 2 despite both the non-variational +0.5*E3 sign in Eq. (10)
          and coupled-binodal ill-posedness (|Q|_eq = 1.0543 > 1).
        show: "comparison: gubbala_code/cmp_lsa_E3_eff_code_vs_paper"
      - text: >-
          An accidental double-error cancellation emerges on Q_xy: SI Eq. (S26) drops E3 from
          omega_xy while line 91 wipes out E3 in code (matching to 2.02e-3), whereas fixing line 91
          and the variational sign restores exact +1.000 free-energy dissipation (8.04e-9 diff).
        show: "relation: gubbala_code/rel_code_cubic_fixed_same_variational"
      - text: >-
          In ModelC_2D.run(), line 224 updates T += self.DT after overwriting self.DT with DT_new
          (overshooting step-1 time by ~280x), while lines 148–153 reuse one noise array identically
          for phi, Qxx, and Qxy (corr = 1.0) and TOL = 1e-4 is 100x looser than SI 1e-6.
        show: "comparison: gubbala_code/cmp_stepper_reported_t1_vs_dt0"
      - text: >-
          Across the phase-separation corpus, Gubbala's corrected 2x2 Model C dispersion is
          isospectral to Frohoff-Hülsmann (2021) Eq. (12) under Q_eff = 1/q^2 (1.95e-14 max rel
          diff) and its coupled binodal shift reduces to Zwicker (2015) Eq. (A1) to 4.4e-16 —
          corroborating both papers' printed LSA factor-of-2 typos simultaneously.
        show: "relation: gubbala2025/rel_frohoff2021_lsa_corr_same_eq12_sigma_max"
      - text: >-
          Mapping rigid-kink line tension 1 + chi/2 onto Weirich (2017)'s smooth-Wulff tactoid
          branch 1 + omega (verified identically up to chi = 2 <=> omega = 1) proves Gubbala's
          sharp-cusped tactoids sit in Weirich's deformed defect regime rather than the homogeneous
          Wulff cusp regime (omega > 1), while exact 2D k33 matches Graham (2023)'s ring bending
          stiffness to 4.4e-13.
        show: "relation: gubbala2025/rel_weirich2017_nondim_lam_same_small_omega_ar"
      - text: >-
          Running unmodified ModelC_Cubic.py over Fig. 3's exact 9.97x window yields R/R0 = 1.734
          (independent noise, within 0.6% of Fig. 3 sim 1.724 and +10.4% above digitized experiment
          1.571), while high actin initially coarsens faster (2.03–2.29) before arresting past
          t > 3000.
        show: "validation: gubbala_code/val_euler_low_indep_Rratio_vs_fig3_exp_low_end"

  - id: lepidoptera_and_droplet_code
    teaches: Wing-scale actin ridges, CytoSim code audits, & condensate wetting
    title: Lepidoptera wing scales, Arp2/3–VASP droplets, & CytoSim forensics
    summary: >-
      Wave 4 bridges butterfly wing-scale morphogenesis (McDougal et al. 2021; Lloyd et al. 2024)
      to CytoSim droplet-remodeling codebases (Graham et al. 2024; Walker et al. 2025) and FUS/filamin
      actin-condensate wetting (Feigeles et al. 2025; Weirich et al. 2017/2019). Auditing live CytoSim
      analysis notebooks and cross-validating AFM ridge timelines catches hidden code bugs, silent
      averaging errors, and a 7-degree branching-angle mismatch.
    sources: [mcdougal2021, lloyd2024, walker2025, walker2025_code, graham2024, graham2024_code, feigeles2025, weirich2017]
    steps:
      - text: >-
          Cross-validating Lloyd et al. (2024)'s Vanessa cardui pupal morphogenesis timeline and AFM
          ridge heights directly against McDougal et al. (2021) quantitatively links both wing-scale
          datasets while flagging a CytoD curvature Welch-test SE discrepancy and Fig. S12C unit typo.
        show: "validation: lloyd2024/val_afm_ridge_height_vs_mcdougal_figS10c_rotated"
      - text: >-
          Auditing Graham et al. (2024)'s released CytoSim configs and notebooks exposes a 77-degree
          branching angle in code vs. the 70 degrees printed in the paper, plus a Radial Aster
          Enrichment (RAE) script that maximizes bead count rather than radial density.
        show: "comparison: graham2024_code/cmp_branching_angle_code_vs_paper"
      - text: >-
          Running live CSV RAE readers on Graham (2024)'s released trajectories distinguishes the code's
          count-maximizing RAE from the paper's printed density definition across Fig. 4d.
        show: "validation: graham2024_code/val_csv_rae_code_arp23_vs_graham2024_fig4d"
      - text: >-
          Auditing Walker et al. (2025)'s released CytoSim multimer analysis notebook reveals that
          Fig. 5d and Fig. S7e average across all simulation snapshots rather than the stated final 30,
          while Fig. S7d reverses its legend and Table S1 mixes steric and bond stiffnesses.
        show: "comparison: walker2025_code/cmp_nb_fig5d_nsnaps_as_written_vs_paper"
      - text: >-
          In Feigeles et al. (2025), ModelAtlas maps FUS-droplet coalescence directly onto Weirich
          et al. (2017)'s capillary relaxation laws and validates coalescence velocity and surface
          tension out-of-sample against Weirich's Fig. 3b tactoid relaxation traces.
        show: "validation: feigeles2025/val_coal_exp_decay_vs_weirich2017_fig3b_data"
      - text: >-
          Digitizing Feigeles et al.'s SI exposes a missing square on Eq. (3)'s RHS, an inverted
          Fig. S2 straightness ratio, and a 10x slope inversion on Fig. S6C.
        show: "question: feigeles2025/q_figS6C_slope_inversion_10x_and_n10"

  - id: nonreciprocal_and_active_shells
    teaches: Unifying active phase separation, nonreciprocal fields, & active gels
    title: Nonreciprocal Cahn–Hilliard, active emulsions, & 6-paper active-gel synthesis
    summary: >-
      Wave 5 and Wave 7 unite six continuum frameworks across active phase separation and active gels:
      Active Model B+ (Tjhung et al. 2018), nonreciprocal Cahn–Hilliard (Saha et al. 2020; You et al.
      2020; Frohoff-Hülsmann et al. 2021), deformable active surfaces (Mietke et al. 2019), bistable
      cortical patterning with released code (Barberi & Kruse 2023), pulsatory two-regulator gels
      (Kumar et al. 2014), active nematic shells (Mirza et al. 2025), and tactoid coarsening (Scheff
      et al. 2020).
    sources: [tjhung2018, saha2020, you2020, frohoff2021, mietke2019, barberi2023, barberi2023_code, kumar2014, mirza2025, hannezo2015, scheff2020, weirich2017]
    steps:
      - text: >-
          ModelAtlas verifies that Saha et al. (2020)'s corrected nonreciprocal Cahn–Hilliard Eq. (6)
          and Eq. (8) dispersion map identically onto both You et al. (2020)'s cross-diffusion
          traveling-wave model and Frohoff-Hülsmann et al. (2021) Eq. (12) — while exposing printed
          sign and prefactor errors in Saha Eq. (6) and Eq. (9).
        show: "relation: saha2020/rel_frohoff2021_eq8_disc_same_as_eq12"
      - text: >-
          In Active Model B+ (Tjhung et al. 2018), symbolic reduction confirms the passive Cahn–Hilliard
          limit while isolating a misprinted 6*zeta factor in Appendix B Eq. (B2) and an inverted Ito
          drift sign in Eq. (34).
        show: "relation: tjhung2018/rel_binodals_eq9_same_as_eqB2_corr_phi1"
      - text: >-
          Auditing Barberi & Kruse (2023)'s released Julia PDE code proves that SM Fig. 1 used a
          discrete wavenumber grid rather than the continuum limit and uncovers half-cell trapz mass
          artifacts and a 1D no-flux boundary mass leak.
        show: "question: barberi2023_code/q_smfig3_half_cell_and_trapz_mass_artifact"
      - text: >-
          Forty-two verified ModelAtlas relations anchor Kumar et al. (2014) at the hub of the
          six-paper active-gel lineage (Bois 2011, Kumar 2014, Hannezo 2015, Mietke 2019, Barberi 2023,
          Mirza 2025), proving Mirza's 1D active-nematic dispersion Eq. (C7) reduces to Kumar's 2D
          ARD system at exact viscous factor nu = 4 (diff 6.1e-15).
        show: "relation: kumar2014/rel_mirza2025_disp_eqC7_reduces_ard_eq12_13"
      - text: >-
          Tested out-of-sample against Hannezo et al. (2015)'s Drosophila embryonic and larval tracheal
          actin rings, Mirza et al. (2025)'s isotropic and Case A nematic-gel wavelengths quantify
          exactly how cortical friction and nematic alignment govern spacing across developmental stages.
        show: "validation: mirza2025/val_caseA_hannezo_matched_vs_embryo_wt"
      - text: >-
          In liquid-crystalline tactoids, Scheff et al. (2020) omit the Frank elastic factor of 1/2 in
          Eqs. (1) and (2b) — and out-of-sample validation against Weirich et al. (2017)'s 2.5% and 15%
          filamin tactoids separates the printed formula from the Frank-half correction.
        show: "validation: scheff2020/val_qb_frank_half_ar_vs_weirich2017_2p5pct"

  - id: wormlike_bundle_trilogy
    teaches: Same-authors trilogy & a 10x stiffness bug in downstream code
    title: The wormlike bundle trilogy & Graham's Bathe-branch bug
    summary: >-
      Claessens et al. (2006), Bathe et al. (2008), and Claessens et al. (2008) established the
      wormlike bundle (WLB) model of F-actin flexural rigidity, which Graham et al. (2023) later
      embedded in VASPDroplet_simulate.ipynb. Rebuilding all three papers with converted Word SI
      (mmc1.doc) and digitizing 78 panels settles caption/ratio swaps, proves Fourier–ODE equivalence,
      and exposes a 5.6–10x mode-summation bug in Graham's nonlinear Bathe branch.
    sources: [claessens2006, bathe2008, claessens2008, graham2023, graham_code]
    steps:
      - text: >-
          On Claessens et al. (2006)'s parameter-free Fig. 3D (4% PEG), evaluating the printed
          bending-to-shear coupling K = S_2 / N overshoots every digitized point by +34% to +44.5%
          (and +64% to +221% on Figs. 3A–C).
        show: "comparison: claessens2006/cmp_fig3d_peg_curve_printed"
      - text: >-
          Dropping the spurious 1/N factor (K = S_2) lands cleanly inside all seven digitized Fig. 3D
          points (+1.4% to +3.8%), while digitization also resolves swapped red/blue and square markers
          across Figs. 3A–C and Ono 1997 fascin K_d drift (0.7 -> 0.5 -> 0.3 uM) across the trilogy.
        show: "comparison: claessens2006/cmp_fig3d_peg_curve_KnoN"
      - text: >-
          ModelAtlas verifies exact Parseval/partial-fraction equivalence between Bathe et al. (2008)'s
          Fourier-series Eq. (A8) and Eq. (2), and proves both Bathe Eq. (2) and Eq. (A10) reduce to
          Graham (2023)'s linear and nonlinear WLB formulas.
        show: "relation: bathe2008/rel_graham2023_bathe_eqS1_same_as_eq2"
      - text: >-
          Zero-free-parameter out-of-sample cross-validations of Bathe's decoupled and fully coupled
          asymptotes against Claessens (2006) Figs. 3A and 3D quantify residual plastin shear
          stiffening (pred/meas = 0.77–0.82) and finite PEG shear compliance (pred/meas = 1.67).
        show: "validation: bathe2008/val_fully_coupled_vs_claessens_peg_4pct"
      - text: >-
          Auditing Bathe et al. (2008) against its own Fig. 4, Fig. 5, and converted Word SI (mmc1.doc)
          reveals that Fig. 4 curves fail at the printed kappa_f = 7e-26, k_x = 1e-5 by 1.7–4x, while
          SM Fig. S2B switches to phi* = M/8 vs. text M.
        show: "question: bathe2008/q_fig4_unstated_kf_kx"
      - text: >-
          Most strikingly, cross-linking Bathe (2008) to Graham et al. (2023)'s released notebook
          exposes that VASPDroplet_simulate.ipynb's nonlinearbool=True Bathe branch arithmetically sums
          10 Fourier modes instead of harmonic-averaging them, inflating stiffness 5.6–10.0x alongside
          a 17.5x I_f mismatch.
        show: "question: bathe2008/q_graham_code_nonlinear_bathe_10mode_sum_bug"

  - id: polyelectrolyte_twist_and_vasp
    teaches: Classic F-actin electrostatics, twist cooperativity, & VASP polymerase
    title: Polyelectrolyte bundling, Origin 2-sigma SAXS widths, & VASP AUC cooperativity
    summary: >-
      Wave 6's ten foundational F-actin bundling and polymerase papers (1996–2010) reveal how
      software plotting defaults, chirality sign conventions, and omitted binomial weights leave
      decades-old quantitative footprints in published figures and equations.
    sources: [tang1996, angelini2003, pelletier2003, henle2005, kierfeld2005, shin2009, gov2008, haviv2008, liu2008, hansen2010]
    steps:
      - text: >-
          Digitizing Tang & Janmey (1996) Fig. 5b refutes their trace Manning Eq. (3) salt-exponent
          prediction ([KCl]^2 / [KCl]^3) across every divalent and trivalent counterion point
          (measured slopes alpha = 0.20 and 0.74 < 1).
        show: "comparison: tang1996/cmp_eq3_mn_fig5b"
      - text: >-
          Digitizing Pelletier et al. (2003) Fig. 3(c) Gaussian components proves their printed peak
          widths (0.056 and 0.136 nm^-1) are Origin's w = 2*sigma rather than FWHM — immediately
          explaining the mysterious ~50 nm domain size (2*sqrt(2)/w_1 = 50.9 nm vs. Scherrer 112 nm)
          while showing Fig. 2(a,c) "branching" profiles are clipped at 8-bit saturation 255.
        show: "question: pelletier2003/q_digitize_fig3c_width_convention_2sigma_vs_fwhm"
      - text: >-
          In Shin et al. (2009), evaluating Eq. (3) at the printed right-handed omega_0 = +12*pi/13
          with left-handed 28/13 binding sites yields negative cooperativity u < 0 (no bundling
          transition), while digitized Fig. 3(b) refutes both perturbation and exact transfer-matrix
          curves via an unintended extra square in the abscissa.
        show: "question: shin2009/q_chirality_sign_mismatch_eq3"
      - text: >-
          Cross-linking Gov (2008) against Haviv et al. (2008) (with converted Word SI MOESM1.doc)
          honestly refutes Gov Eq. (4)'s Gaussian-tail claim while verifying that Gov's incompressible
          defect model Eq. (6) matches Haviv's exp(-N_b) tail to 9.8e-6 (exposing a 2x radius-vs-diameter
          citation shift).
        show: "relation: gov2008/rel_haviv2008_eq1_reduces_to_incomp_gaussian_tail"
      - text: >-
          In Hansen & Mullins (2010), digitizing all 32 quantitative panels (84 readings, 698 points)
          proves Fig. 2H's "VASP +LatB" trace literally plots the no-LatB Fig. 2D curve (10/10
          reproduced) rather than the Table 1 +LatB rate.
        show: "comparison: hansen2010/cmp_fig2h_vasp_latb_vs_fig2d"
      - text: >-
          Auditing Hansen & Mullins's rasterized Fig. S5 AUC appendix further catches missing binomial
          C(4,i) statistical factors (overstating negative cooperativity 16x), a 4.3x unit-area
          normalization gap, and an omitted time variable t in the Fig. 6C/S2D capping formula.
        show: "question: hansen2010/q_auc_missing_statistical_factors"

  - id: crosslinker_sorting_triad
    teaches: Convergent blind pixel forensics, AFINES code, & Figshare spreadsheets
    title: Fascin / alpha-actinin sorting across three papers, two AFINES repos, & Figshare
    summary: >-
      Winkelman et al. (2016), Freedman et al. (2019), and Bashirzadeh et al. (2021) trace passive
      cross-linker sorting from 1D TIRFM bundles to 2D GUV confinement. Independently digitizing all
      three papers and auditing their two AFINES C++ branches plus Figshare Source Data yields three
      striking convergent discoveries where blind pixel measurements and code/Excel audits agree to
      3–4 significant digits.
    sources: [winkelman2016, freedman2019, freedman2019_code, bashirzadeh2021, bashirzadeh2021_code, bashirzadeh2021_source_data]
    steps:
      - text: >-
          Refining Winkelman et al. (2016)'s 1D KMC lattice size from N = 400 to the exact infinite-lattice
          Markov limit proves 18–38% finite-size truncation bias (belongs to the numerics), refuting SI
          p. 27's claim that N = 400 removes edge effects.
        show: "refinement: winkelman2016/ref_kmc_expfit_nsites"
      - text: >-
          ModelAtlas proves Freedman et al. (2019)'s growing-bundle KMC reduces to Winkelman's 1D KMC
          as mu_grow -> 0 — while testing Winkelman's rate-independent KMC out-of-sample against
          Freedman's new Fig. 4B actin-concentration TIRFM data cleanly refutes rate independence.
        show: "validation: winkelman2016/val_kmc_expfit_vs_freedman_fig4b_fascin"
      - text: >-
          Blind 1200 dpi digitization of Freedman (2019) Fig. 3B and Fig. S3C independently proved the
          plotted curves inflate bending energy by 1.363 = (37/35)^3 * (29/27)^2 — and auditing
          freedman2019_code/kmc.ipynb Cell 2 uncovered the exact verbatim transposition (site_width = 35,
          dxl = 37 - 8 = 29 nm), reproducing Fig. S3A to the exact printed digit (0.016, 4.1).
        show: "comparison: freedman2019_code/cmp_kmc_figs3a_ratio_code"
      - text: >-
          In Bashirzadeh et al. (2021), Eq. (5)'s Binder cumulant obeys an unconditional Cauchy–Schwarz
          ceiling U_4 <= 2/3, refuted by all 40/40 digitized Fig. 4h trajectory points (0.977–0.996),
          while neither the AFINES repo nor Figshare releases any Fig. 4g/4h or Cytosim analysis code.
        show: "comparison: bashirzadeh2021/cmp_fig4h_combined_alpha_vs_eq5_bound"
      - text: >-
          Auditing Bashirzadeh's Figshare Source Data proves all 18 printed p-values on Figs. 1 and 2
          were swapped between the two figures (plus a 10x typo on Fig. 2d) — and independently confirms
          our blind Fig. 4e pixel measurements: three buggy Excel row-32 SEM formulas inflated the
          caption ± values by up to +30.1% while the plotted error bars used true SD/sqrt(N), alongside
          five 15-digit duplicate bundles and 34.2% length-window violations.
        show: "question: bashirzadeh2021_source_data/q_figs_1_and_2_all_18_pvalues_swapped_and_10x_typo"
      - text: >-
          Auditing Bashirzadeh's AFINES C++ branch (sorting_guv) against Freedman's branch uncovers
          that 49/49 consecutive filaments share an identical arm angle (mean bend 4x paper's pi/8),
          cross-linkers are non-uniformly sampled in a disk (+92% lateral cap pileup, <x^2>/<y^2> = 3/2),
          and hidden overrides (occ = 0.15 um, viscosity = 0.01, a_m_bend = 0) allow same-filament
          dual-head binding.
        show: "question: bashirzadeh2021_code/q_init_crosslinker_circle_nonuniform_sampling_bug"

  - id: microscopic_network_solvers
    teaches: Auditing 3D actomyosin simulators, SlenderBody SBT, & COMSOL PDEs
    title: MEDYAN lineage, Lie–Trotter splitting in SlenderBody, & COMSOL metric factors
    summary: >-
      Auditing Wave 7's microscopic network and membrane PDE papers — MEDYAN (Popov et al. 2016;
      Chandrasekaran et al. 2019 with converted Word SI s001.docx), nonlocal SlenderBody Brownian
      dynamics with released code (Maxian et al. 2022), and COMSOL Arp2/3-CP membrane PDEs (Dürre
      et al. 2018) — catches geometric box-bound violations, parameter-copying regressions, an
      undocumented 1st-order splitting swap, and a missing cylindrical metric factor.
    sources: [popov2016, chandrasekaran2019, maxian2022, maxian2022_code, durre2018, kumar2014]
    steps:
      - text: >-
          Digitizing all 18 cells of Popov et al. (2016) Main Fig. 6 (1.004–1.797 um) proves every
          single cell violates the strict Popoviciu bound sqrt(3)/2 = 0.866 um for a [0, 1 um]^3 box;
          dividing by Fig. 8 yields implied R_{g,i} = 1.53 um (3.06x a 1 um^3 cube, matching 3 um^3),
          while S4 Fig. 3 refutes the claimed ">100-fold" NRM speedup (59.8x at t = 10 s, peak 62.9x).
        show: "comparison: popov2016/cmp_fig6_rma0p01_vs_1um_bound"
      - text: >-
          Fifteen verified ModelAtlas relations trace every MEDYAN equation from Popov (2016) to
          Chandrasekaran et al. (2019), catching a direct Table 2C transcription slip (copying
          F_NMIIA,unbind = 12.6 pN as F_stall instead of 15 pN while absorbing N_total, understating
          ensemble stall force 17.9–35.7x) and the exact /pN unit swap between Eqs. (S11)–(S12).
        show: "relation: chandrasekaran2019/rel_popov2016_myosin_hill_walking_eqS14"
      - text: >-
          In Maxian et al. (2022), live audit of stochasticHydroTools/SlenderBody reproduces all
          21/21 Table S1 SBT entries to four decimals (settling RegularizeS.m delta = 0.1) while
          catching a C++ dimensional eigenvalue clamp that collapses beta(0.010) by -99.1%.
        show: "comparison: maxian2022_code/cmp_matlab_table_s1_alpha"
      - text: >-
          Although Maxian (2022) Sec. 2.4 states 2nd-order 3-step Strang splitting, released
          TemporalIntegrator.py implements 1st-order Lie–Trotter splitting: end-of-step LinkStrains
          collapse std_x by -61.7% (ref_smc_lt_dt_end belongs to numerics), whereas post-Brownian
          sampling inflates std_x by +24.2%, matching our digitized Fig. S1 right histogram (+22%).
        show: "refinement: maxian2022_code/ref_smc_lt_dt_end"
      - text: >-
          In Dürre et al. (2018), full 2D(r,z) P1-FEM solves across 63 digitized PDE comparisons prove
          printed SI Eqs. (14)–(15) omit reverse dissociation fluxes (1/21 curves reproduced, causing
          cone extinction), while true axisymmetric membrane diffusion overshoots every transient peak
          by +29–51% (2/21 reproduced).
        show: "comparison: durre2018/cmp_fig5c_printed_40nM"
      - text: >-
          Switching solely to a 1D Cartesian membrane Laplacian (matching COMSOL's Boundary PDE missing
          cylindrical metric factor r) reproduces 14/21 curves (5 close, 2 not reproduced), cutting
          RMSE 2–3x across Fig. 5c–e and Supp. Figs. 11 & 14 while exposing a +45–50% ring-radius
          discrepancy on calibrated Fig. 5f.
        show: "comparison: durre2018/cmp_fig5c_cart_40nM"
      - text: >-
          Finally, digitizing all 24 panels of Kumar et al. (2014) proves Fig. 1(b) was plotted at
          P = 0.50 rather than Eq. (10)'s P_c = 1.1, Fig. 1(e) PDE periods are quantized in 0.5*tau
          steps, and Fig. 2(b,d,f) plots unscaled Eq. (11) stress (factor 16/3 below rescaled f).
        show: "comparison: kumar2014/cmp_fig1b_re_p050"



